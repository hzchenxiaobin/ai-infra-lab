<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：大根堆按频率交替放置，贪心保证不相邻</text>

  <!-- Step 1: count frequencies -->
  <text x="40" y="60" font-size="12" fill="#888">输入字符串:</text>
  <rect x="120" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="156" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="192" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="228" y="44" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="264" y="44" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="300" y="44" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- Frequency table -->
  <text x="40" y="100" font-size="12" fill="#888">统计频率:</text>
  <rect x="120" y="84" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 3</text>
  <rect x="186" y="84" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 2</text>
  <rect x="252" y="84" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c: 1</text>

  <!-- Impossibility check -->
  <path d="M 330 98 L 370 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="375" y="82" width="165" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="458" y="97" text-anchor="middle" font-size="11" fill="#333">max_count=3</text>
  <text x="458" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ (6+1)/2 = 3.5 ✓ 可行</text>

  <!-- Max heap visualization -->
  <text x="40" y="146" font-size="12" fill="#888">大根堆 (按频率):</text>

  <!-- Heap root -->
  <rect x="250" y="130" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="278" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a:3</text>

  <!-- Heap children -->
  <path d="M 265 162 L 195 190" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 291 162 L 361 190" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="165" y="190" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="193" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b:2</text>
  <rect x="335" y="190" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c:1</text>

  <!-- Arrow down to interleave -->
  <path d="M 278 232 L 278 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="246" font-size="11" fill="#d6a040">弹出两个最高频</text>

  <!-- Interleave concept -->
  <text x="40" y="272" font-size="12" fill="#888">交替放置:</text>
  <rect x="120" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="160" y="256" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="206" y="275" font-size="11" fill="#888">→</text>
  <rect x="226" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="266" y="256" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="312" y="275" font-size="11" fill="#888">→</text>
  <rect x="332" y="256" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="372" y="256" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <text x="425" y="275" font-size="12" fill="#4a7a3a" font-weight="bold">= "ababac" ✓</text>

  <!-- Core idea box -->
  <rect x="40" y="300" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：每次弹出频率最高的两个字符交替放置</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#666">弹两个 → 追加 → 频率减 1 → 非零则推回堆 → 循环</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888">不可行条件：某字符频率 &gt; (n+1)/2，即"放不下"</text>
</svg>
