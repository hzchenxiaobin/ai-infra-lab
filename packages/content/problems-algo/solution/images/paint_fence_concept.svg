<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栅栏涂色核心：「同 / 异」状态机 — 至多 2 根连续同色</text>

  <!-- Allowed pattern -->
  <text x="34" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">合法：</text>
  <rect x="80" y="46" width="34" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="97" y="80" text-anchor="middle" font-size="12" fill="#333">A</text>
  <rect x="116" y="46" width="34" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="133" y="80" text-anchor="middle" font-size="12" fill="#333">B</text>
  <rect x="152" y="46" width="34" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="169" y="80" text-anchor="middle" font-size="12" fill="#333">B</text>
  <rect x="188" y="46" width="34" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="205" y="80" text-anchor="middle" font-size="12" fill="#333">A</text>
  <text x="240" y="80" font-size="11" fill="#4a7a3a">两根同色 ✓（未到三根）</text>

  <!-- Forbidden pattern -->
  <text x="34" y="124" font-size="12" fill="#b85450" font-weight="bold">非法：</text>
  <rect x="80" y="108" width="34" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="97" y="142" text-anchor="middle" font-size="12" fill="#333">A</text>
  <rect x="116" y="108" width="34" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="133" y="142" text-anchor="middle" font-size="12" fill="#333">B</text>
  <rect x="152" y="108" width="34" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="169" y="142" text-anchor="middle" font-size="12" fill="#333">B</text>
  <rect x="188" y="108" width="34" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="205" y="142" text-anchor="middle" font-size="12" fill="#333">B</text>
  <text x="240" y="142" font-size="11" fill="#b85450">三根连续同色 ✗</text>
  <path d="M 116 120 L 222 152" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- State machine -->
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">状态机：每根栅栏按「是否与前一根同色」分两类</text>

  <!-- prev states -->
  <ellipse cx="130" cy="240" rx="62" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">diff[i−1]</text>
  <text x="130" y="252" text-anchor="middle" font-size="10" fill="#666">异于前一根</text>

  <ellipse cx="430" cy="240" rx="62" ry="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">same[i−1]</text>
  <text x="430" y="252" text-anchor="middle" font-size="10" fill="#666">同于前一根</text>

  <!-- current states -->
  <ellipse cx="130" cy="360" rx="62" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">diff[i]</text>
  <text x="130" y="372" text-anchor="middle" font-size="10" fill="#666">选 ≠ 前一根</text>

  <ellipse cx="430" cy="360" rx="62" ry="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">same[i]</text>
  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#666">选 = 前一根</text>

  <!-- transitions -->
  <!-- diff[i-1] -> diff[i]: (k-1) -->
  <path d="M 110 270 Q 80 320 112 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="70" y="305" font-size="11" fill="#446688" font-weight="bold">×(k−1)</text>

  <!-- diff[i-1] -> same[i]: 1 -->
  <path d="M 180 250 Q 300 300 380 352" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="278" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">×1</text>

  <!-- same[i-1] -> diff[i]: (k-1) -->
  <path d="M 380 250 Q 270 300 182 352" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="268" y="332" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">×(k−1)</text>

  <!-- same[i-1] -> same[i]: forbidden -->
  <path d="M 450 270 Q 470 320 448 332" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="478" y="305" font-size="11" fill="#b85450" font-weight="bold">✗ 禁止</text>
  <text x="478" y="318" font-size="9" fill="#b85450">会凑成 3 连同</text>

  <!-- key insight box -->
  <rect x="40" y="394" width="480" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#333">same 态只能从 diff 转来（否则三连）→ same[i] = diff[i−1]</text>
</svg>
