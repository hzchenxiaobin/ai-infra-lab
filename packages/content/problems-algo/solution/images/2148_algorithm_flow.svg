<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历求 min/max + 一次遍历计数</text>

  <!-- Step 1: 初始化 -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始：mn=∞, mx=−∞</text>
  <path d="M 280 80 L 280 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: loop find min/max -->
  <rect x="150" y="100" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 nums 中每个 x：</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#555">mn = min(mn, x)；mx = max(mx, x)</text>
  <path d="M 280 152 L 280 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: branch mn == mx ? -->
  <polygon points="280,172 380,214 280,256 180,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mn == mx ?</text>
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#888">（全部元素相等）</text>

  <!-- left branch: yes -> 0 -->
  <path d="M 180 214 L 96 214" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="138" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="32" y="200" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="64" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 0</text>

  <!-- right branch: no -> count -->
  <path d="M 380 214 L 410 214 L 410 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="398" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 4: count loop -->
  <rect x="290" y="272" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt = 0；遍历每个 x：</text>
  <text x="410" y="310" text-anchor="middle" font-size="11" fill="#555">若 mn &lt; x &lt; mx：cnt += 1</text>
  <path d="M 410 324 L 410 344" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: return cnt -->
  <rect x="350" y="348" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 cnt</text>

  <!-- divider -->
  <path d="M 30 404 L 530 404" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- note box -->
  <rect x="60" y="416" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#555">两遍扫描，各 O(n)；mn == mx 时无元素可夹 → 直接返回 0</text>
</svg>
