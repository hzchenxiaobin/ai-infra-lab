<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后小训练师优先满足小运动员，指针 j 单调前进</text>

  <!-- Players row label -->
  <text x="40" y="92" font-size="12" fill="#4a7a3a" font-weight="bold">运动员↑</text>
  <text x="40" y="106" font-size="10" fill="#888">(能力升序)</text>
  <!-- Players: 4, 7, 9 -->
  <rect x="120" y="68" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="96" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="190" y="68" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="96" text-anchor="middle" font-size="16" fill="#333">7</text>
  <rect x="260" y="68" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="96" text-anchor="middle" font-size="16" fill="#333">9</text>
  <text x="340" y="96" font-size="10.5" fill="#888">小运动员先匹配</text>

  <!-- Matching arrows: player4 -> trainer5, player7 -> trainer8 (green, dashed down) -->
  <path d="M 148 116 C 148 150, 158 165, 158 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 116 C 218 150, 296 165, 296 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="158" font-size="10" fill="#4a7a3a">5 ≥ 4 ✓</text>
  <text x="262" y="158" font-size="10" fill="#4a7a3a">8 ≥ 7 ✓</text>

  <!-- Trainers row label -->
  <text x="40" y="212" font-size="12" fill="#446688" font-weight="bold">训练师↑</text>
  <text x="40" y="226" font-size="10" fill="#888">(能力升序)</text>
  <!-- Trainers: 2(wasted), 5, 8, 8(wasted for p9) -->
  <rect x="120" y="196" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="224" text-anchor="middle" font-size="16" fill="#b85450">2</text>
  <path d="M128 200 L164 236" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="190" y="196" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="224" text-anchor="middle" font-size="16" fill="#333">5</text>
  <rect x="260" y="196" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="224" text-anchor="middle" font-size="16" fill="#333">8</text>
  <rect x="330" y="196" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="224" text-anchor="middle" font-size="16" fill="#d6a040">8</text>
  <text x="148" y="254" text-anchor="middle" font-size="9.5" fill="#b85450">太小，弃</text>
  <text x="358" y="254" text-anchor="middle" font-size="9.5" fill="#d6a040">轮到 p9，弃</text>

  <!-- Annotation box -->
  <rect x="60" y="278" width="420" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">直觉：小训练师只能带小运动员，大训练师谁都能带</text>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#555">→ 优先用小训练师满足小运动员，把大训练师留给大运动员</text>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#888">被弃训练师对后续更大运动员更不够格 → j 单调前进，O(n+m)</text>
</svg>
