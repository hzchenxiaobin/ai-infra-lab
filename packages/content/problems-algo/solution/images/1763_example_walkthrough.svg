<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "YazaAay" 的分治递归树</text>

  <!-- ===== Level 0: Root "YazaAay" ===== -->
  <rect x="240" y="48" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">YazaAay</text>
  <text x="355" y="69" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ "aAa"</text>

  <!-- Root split label -->
  <text x="350" y="96" font-size="10" fill="#b85450" filter="url(#rough2)">z 坏，按 z 切分</text>

  <!-- Edges: root → L1 -->
  <path d="M 290 80 L 290 100 L 150 100 L 150 128" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 80 L 290 100 L 430 100 L 430 128" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- ===== Level 1 ===== -->
  <!-- "Ya" (left, loser) -->
  <rect x="125" y="128" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Ya</text>
  <text x="185" y="149" font-size="11" fill="#aaa" filter="url(#rough2)">→ ""</text>
  <text x="180" y="184" font-size="10" fill="#b85450" filter="url(#rough2)">Y 坏</text>

  <!-- "aAay" (right, winner) -->
  <rect x="400" y="128" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aAay</text>
  <text x="470" y="149" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ "aAa"</text>
  <text x="450" y="184" font-size="10" fill="#b85450" filter="url(#rough2)">y 坏</text>

  <!-- Edges: Ya → L2 -->
  <path d="M 150 160 L 150 188 L 80 188 L 80 216" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 160 L 150 188 L 200 188 L 200 216" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Edges: aAay → L2 -->
  <path d="M 430 160 L 430 188 L 380 188 L 380 216" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 430 160 L 430 188 L 480 188 L 480 216" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Level 2 ===== -->
  <!-- "" under Ya (left) -->
  <rect x="62" y="216" width="36" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="235" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">""</text>

  <!-- "a" under Ya (right) -->
  <rect x="182" y="216" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="228" y="235" font-size="10.5" fill="#aaa" filter="url(#rough2)">→ ""</text>
  <text x="230" y="270" font-size="10" fill="#b85450" filter="url(#rough2)">a 坏</text>

  <!-- "aAa" under aAay (left, HIGHLIGHTED — nice!) -->
  <rect x="348" y="214" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">aAa</text>
  <text x="380" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">美好 ✓ return "aAa"</text>

  <!-- "" under aAay (right) -->
  <rect x="462" y="216" width="36" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="480" y="235" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">""</text>

  <!-- Edges: "a" → L3 -->
  <path d="M 200 244 L 200 276 L 170 276 L 170 304" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 200 244 L 200 276 L 230 276 L 230 304" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Level 3 ===== -->
  <rect x="152" y="304" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="322" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">""</text>
  <rect x="212" y="304" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="322" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">""</text>

  <!-- Divider -->
  <path d="M 40 352 L 540 352" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="170" y="364" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"Ya" 段返回 ""，"aAay" 段返回 "aAa"</text>
  <text x="290" y="400" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最长 → "aAa" ✓</text>

  <!-- Footer -->
  <text x="290" y="428" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿框/绿线 = 美好字符串（基例）或返回它的路径；灰框 = 空串（基例 len &lt; 2）</text>
</svg>
