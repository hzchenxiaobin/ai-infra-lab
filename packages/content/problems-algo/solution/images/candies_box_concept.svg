<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="argray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">盒子何时可开？两条件会合即触发</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#888">持有盒子 (hasBox) 与 持有钥匙 (hasKey) 是两份独立资源，先后无关</text>

  <!-- condition 1: hasBox -->
  <g filter="url(#sk)">
    <rect x="40" y="92" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="115" y="115" text-anchor="middle" font-size="13" fill="#2b4b6e" font-weight="bold">条件① 持有盒子</text>
  <text x="115" y="131" text-anchor="middle" font-size="11" fill="#555">hasBox[b] = true</text>

  <!-- condition 2: openable -->
  <g filter="url(#sk)">
    <rect x="40" y="160" width="150" height="46" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="115" y="183" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">条件② 能开</text>
  <text x="115" y="199" text-anchor="middle" font-size="11" fill="#555">status[b]==1 或 hasKey[b]</text>

  <!-- AND gate -->
  <g filter="url(#sk)">
    <path d="M 230 150 L 260 150 L 260 124 Q 260 150 286 176 L 260 176 L 230 176 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="252" y="168" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">AND</text>

  <path d="M 190 115 Q 210 122 232 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>
  <path d="M 190 183 Q 210 176 232 162" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>

  <!-- trigger arrow to opening -->
  <path d="M 286 158 L 332 158" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="309" y="150" text-anchor="middle" font-size="10" fill="#2e6e2e">触发</text>

  <!-- opening box -->
  <g filter="url(#sk)">
    <rect x="336" y="92" width="190" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="431" y="116" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">盒子 b 可开启</text>
  <path d="M 352 122 Q 431 128 510 122" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g font-size="12" fill="#444">
    <text x="350" y="146">① 收糖果 candies[b]</text>
    <text x="350" y="170">② 拿钥匙 keys[b] →</text>
    <text x="362" y="186" fill="#888" font-size="11">若对应盒已持有，立刻入队</text>
    <text x="350" y="208">③ 得内含盒 containedBoxes[b]</text>
  </g>

  <!-- bottom note: order independence -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="486" height="78" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="64" y="282" font-size="12" fill="#b03a3a" font-weight="bold">关键：先拿钥匙后见盒 / 先见盒后拿钥匙 都要触发开箱</text>
  <text x="64" y="304" font-size="11" fill="#555">· 新得钥匙 k：检查 hasBox[k]，已有则入队</text>
  <text x="64" y="322" font-size="11" fill="#555">· 新得盒子 c：检查 status[c]==1 或 hasKey[c]，满足则入队</text>
</svg>
