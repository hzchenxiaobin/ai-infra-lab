<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">状态机 DP：dp[j][末位奇偶]，只有「偶→偶」这条边让 j 前进</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 已凑出的偶偶相邻对个数（0 ≤ j ≤ k）</text>

  <!-- 状态：末位偶 -->
  <ellipse cx="160" cy="160" rx="72" ry="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">末位 = 偶 E</text>
  <text x="160" y="170" text-anchor="middle" font-size="9.5" fill="#6a86a3" filter="url(#rough2)">dp[j][0]，偶数共 cntE 种</text>

  <!-- 状态：末位奇 -->
  <ellipse cx="380" cy="160" rx="72" ry="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="152" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">末位 = 奇 O</text>
  <text x="380" y="170" text-anchor="middle" font-size="9.5" fill="#5c8a4e" filter="url(#rough2)">dp[j][1]，奇数共 cntO 种</text>

  <!-- E -> E 自环：j+1 -->
  <path d="M 110 132 Q 90 84 150 84 Q 196 84 204 126" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="92" y="66" width="128" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="79" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">再填一个偶数 ×cntE</text>
  <text x="156" y="91" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶偶对 +1：j → j+1</text>

  <!-- O -> O 自环：j 不变 -->
  <path d="M 430 188 Q 450 236 390 236 Q 344 236 336 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="352" y="242" width="122" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="413" y="259" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">再填奇数 ×cntO，j 不变</text>

  <!-- E -> O：j 不变 -->
  <path d="M 232 144 Q 270 118 306 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="236" y="98" width="104" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="288" y="114" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">偶后填奇 ×cntO</text>

  <!-- O -> E：j 不变 -->
  <path d="M 308 178 Q 270 202 234 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="236" y="204" width="104" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="288" y="220" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">奇后填偶 ×cntE</text>

  <!-- 左侧注释：奇偶个数 -->
  <rect x="26" y="66" width="56" height="0" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="216" width="118" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="79" y="234" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">cntE = ⌊m/2⌋（2,4,…）</text>
  <text x="79" y="250" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">cntO = ⌈m/2⌉（1,3,5,…）</text>
  <text x="79" y="263" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">m 为奇数时奇数多一个</text>

  <!-- 底部：初始化与答案 -->
  <rect x="26" y="292" width="468" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化（第 1 位）：dp[0][偶] = cntE，dp[0][奇] = cntO（首位无相邻对，j 恒为 0）</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案：dp[k][偶] + dp[k][奇]，对 10⁹ + 7 取模</text>
  <text x="260" y="344" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">n = 1 时没有相邻对，k 只能为 0，答案 = m —— 上述流程无需任何特判</text>
</svg>
