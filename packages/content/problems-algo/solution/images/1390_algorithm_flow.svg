<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：枚举因数 + 超过 4 个提前终止</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">因数成对出现，count 只增不减 → 一旦 &gt;4 永不可能回到 4</text>

  <!-- Start oval -->
  <rect x="200" y="56" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">total = 0</text>

  <path d="M 270 86 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop: for each num -->
  <rect x="180" y="106" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#333">遍历 nums 中每个 num</text>

  <path d="M 270 136 L 270 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init divisors -->
  <rect x="190" y="156" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#333">divs = []，i = 1</text>

  <path d="M 270 186 L 270 204" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i <= sqrt(num)? -->
  <polygon points="270,206 360,246 270,286 180,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#333">i ≤ √num ?</text>
  <text x="270" y="258" text-anchor="middle" font-size="9.5" fill="#888">(isqrt)</text>

  <!-- No branch: go right to check len==4 -->
  <text x="372" y="244" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 360 246 L 410 246 L 410 406" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes branch: down -->
  <text x="280" y="302" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 286 L 270 304" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num % i == 0? -->
  <polygon points="270,306 360,346 270,386 180,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#333">num % i == 0 ?</text>

  <!-- No: i++ loop back -->
  <text x="372" y="344" font-size="10.5" fill="#888">否</text>
  <path d="M 360 346 L 392 346" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="332" width="46" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="350" text-anchor="middle" font-size="10.5" fill="#666">i++</text>
  <path d="M 415 332 L 415 226 L 360 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,2"/>

  <!-- Yes: add divisors -->
  <text x="280" y="402" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 386 L 270 404" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="406" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="10.5" fill="#333">加入 i；若 i≠num/i 再加入 num/i</text>

  <path d="M 270 436 L 270 446" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: len > 4? -->
  <polygon points="270,448 330,478 270,508 210,478" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="475" text-anchor="middle" font-size="10.5" fill="#333">len&gt;4?</text>
  <text x="270" y="490" text-anchor="middle" font-size="9" fill="#b85450">提前终止</text>

  <!-- Yes: break -> join to len==4 check (right side at x=410, y=406 area) -->
  <text x="340" y="474" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 330 478 L 410 478" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- No: i++ loop back up (left side) -->
  <text x="196" y="474" font-size="10.5" fill="#888">否</text>
  <path d="M 210 478 L 168 478 L 168 226 L 180 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="120" y="350" font-size="9.5" fill="#888" transform="rotate(-90 120 350)">i++ 继续内层循环</text>

  <!-- len == 4 check (right column) -->
  <rect x="350" y="406" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="424" text-anchor="middle" font-size="10.5" fill="#333">len(divs)==4 ?</text>
  <text x="410" y="438" text-anchor="middle" font-size="9.5" fill="#888">是 → total += sum</text>

  <path d="M 410 446 L 410 472" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- back to outer loop -->
  <rect x="350" y="474" width="120" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="492" text-anchor="middle" font-size="10" fill="#666">下一个 num</text>
  <path d="M 410 502 L 410 518 L 270 518" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="200" y="506" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="270" y="523" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return total</text>
</svg>
