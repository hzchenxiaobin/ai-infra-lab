<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：piles = [[1,100,3],[7,8,9]], k = 2</text>

  <!-- ===== Prefix sums ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">前缀和：</text>

  <text x="40" y="82" font-size="11" fill="#555">栈 1 [1,100,3]：</text>
  <rect x="170" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="85" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="220" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="85" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="270" y="68" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101</text>
  <rect x="326" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="85" text-anchor="middle" font-size="11" fill="#333">104</text>
  <text x="386" y="85" font-size="10" fill="#888">j=0,1,2,3</text>

  <text x="40" y="112" font-size="11" fill="#555">栈 2 [7,8,9]：</text>
  <rect x="170" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="115" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="220" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="115" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="270" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="115" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="320" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="115" text-anchor="middle" font-size="11" fill="#333">24</text>

  <!-- divider -->
  <line x1="40" y1="138" x2="520" y2="138" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== DP after init ===== -->
  <text x="40" y="162" font-size="12" fill="#888" font-weight="bold">初始化：</text>
  <rect x="120" y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="148" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="165" text-anchor="middle" font-size="10" fill="#b85450">−∞</text>
  <rect x="208" y="148" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="165" text-anchor="middle" font-size="10" fill="#b85450">−∞</text>
  <text x="262" y="165" font-size="10" fill="#888">dp[0]=0, dp[1]=dp[2]=−∞</text>

  <!-- arrow -->
  <path d="M 280 176 L 280 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== DP after pile 1 ===== -->
  <text x="40" y="212" font-size="12" fill="#888" font-weight="bold">处理栈 1 后：</text>
  <rect x="120" y="198" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="198" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="215" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="208" y="198" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101</text>
  <text x="262" y="215" font-size="10" fill="#555">t=2: dp[0]+prefix[2]=0+101</text>
  <text x="262" y="230" font-size="10" fill="#888">→ 取栈 1 的前 2 个（1+100）</text>

  <!-- arrow -->
  <path d="M 280 226 L 280 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== DP after pile 2 ===== -->
  <text x="40" y="262" font-size="12" fill="#888" font-weight="bold">处理栈 2 后：</text>
  <rect x="120" y="248" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="265" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="248" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="265" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="208" y="248" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="265" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101</text>
  <text x="262" y="262" font-size="10" fill="#555">t=2 候选：</text>
  <text x="262" y="276" font-size="10" fill="#555">dp[2]+0=101 / dp[1]+7=8 / dp[0]+15=15</text>
  <text x="262" y="290" font-size="10" fill="#b85450" font-weight="bold">→ max=101（仍取栈 1 两个）</text>

  <!-- divider -->
  <line x1="40" y1="308" x2="520" y2="308" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="100" y="324" width="360" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp[2] = 101</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#555">取栈 1 顶部 2 个硬币：1 + 100 = 101</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">（优于「栈1取1个+栈2取1个」=1+7=8，也优于「栈2取2个」=15）</text>

  <!-- ===== Insight box ===== -->
  <rect x="60" y="406" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#555">关键：t 倒序遍历保证「每个栈只选一次」，</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#555">dp[t−j] 读到的是上一轮（前 i−1 个栈）的旧值，不与当前栈混用</text>
</svg>
