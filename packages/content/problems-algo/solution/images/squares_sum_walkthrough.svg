<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：c = 5，⌊√5⌋ = 2，初始 a=0, b=2</text>

  <!-- ================= Step 1 ================= -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">步骤 1：a=0, b=2</text>

  <!-- array cells [0,1,2] -->
  <g filter="url(#rough2)">
    <rect x="60"  y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="92">0</text>
    <text x="150" y="92">1</text>
    <text x="210" y="92">2</text>
  </g>

  <!-- a pointer at index 0 -->
  <path d="M 90 60 L 84 50 L 96 50 z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="90" y="44" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a=0</text>

  <!-- b pointer at index 2 -->
  <path d="M 210 116 L 204 126 L 216 126 z" fill="#b85450" filter="url(#rough2)"/>
  <text x="210" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b=2</text>

  <!-- computation box -->
  <rect x="280" y="64" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="84" text-anchor="middle" font-size="12" fill="#333">s = 0² + 2² = 0 + 4 = 4</text>
  <text x="390" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4 &lt; 5 ⇒ 和小，a = 1</text>

  <!-- arrow down to step 2 -->
  <path d="M 280 138 L 280 168" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ================= Step 2 ================= -->
  <text x="40" y="184" font-size="12" fill="#888" font-weight="bold">步骤 2：a=1, b=2</text>

  <!-- array cells [0,1,2] -->
  <g filter="url(#rough2)">
    <rect x="60"  y="196" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="196" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"   rx="4"/>
    <rect x="180" y="196" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="218">0</text>
    <text x="150" y="218">1</text>
    <text x="210" y="218">2</text>
  </g>

  <!-- a pointer moved to index 1 -->
  <path d="M 150 186 L 144 176 L 156 176 z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a=1</text>

  <!-- b pointer still at index 2 -->
  <path d="M 210 242 L 204 252 L 216 252 z" fill="#b85450" filter="url(#rough2)"/>
  <text x="210" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b=2</text>

  <!-- computation box -->
  <rect x="280" y="190" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#333">s = 1² + 2² = 1 + 4 = 5</text>
  <text x="390" y="230" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5 == 5 ✓ 命中！</text>

  <!-- arrow down to result -->
  <path d="M 390 240 L 390 268" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ================= Result ================= -->
  <rect x="200" y="280" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="308" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">return true（1² + 2² = 5）</text>

  <!-- ===== bottom note: c=3 counter-example ===== -->
  <rect x="40" y="280" width="140" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">反例 c=3</text>
  <text x="110" y="318" text-anchor="middle" font-size="10" fill="#444">(0,1):1&lt;3 → a=1</text>
  <text x="110" y="332" text-anchor="middle" font-size="10" fill="#444">(1,1):2&lt;3 → a=2</text>
  <text x="110" y="346" text-anchor="middle" font-size="10" fill="#444">a&gt;b 终止 ⇒ false</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">关键：a 可等于 b（如 c=8=2²+2²），故循环条件 a ≤ b</text>
</svg>
