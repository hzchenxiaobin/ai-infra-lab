<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：枚举 k ∈ [0, num]，检验 k + rev(k) = num</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">rev(k) ≥ 0 ⟹ k ≤ num，搜索空间天然有上界</text>

  <!-- Equation boxes: k + rev(k) = num -->
  <rect x="108" y="66" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">k</text>

  <text x="190" y="92" text-anchor="middle" font-size="18" fill="#666">+</text>

  <rect x="206" y="66" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="256" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">reverse(k)</text>

  <text x="326" y="92" text-anchor="middle" font-size="18" fill="#666">=</text>

  <rect x="342" y="66" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="374" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">num</text>

  <!-- Arrow down to range bar -->
  <path d="M 256 108 L 256 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Range bar [0, num] -->
  <rect x="80" y="128" width="360" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="86" y1="124" x2="86" y2="154" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="434" y1="124" x2="434" y2="154" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="144" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="428" y="144" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">num</text>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#555">枚举 k = 0, 1, 2, …, num</text>

  <text x="260" y="166" text-anchor="middle" font-size="9.5" fill="#888">至多 10^5 + 1 个候选，每个反转 O(d)，d ≤ 6</text>

  <!-- Example row 1: 172 + 271 = 443 -->
  <text x="58" y="206" font-size="10" fill="#888">示例</text>
  <rect x="108" y="186" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">172</text>

  <text x="170" y="206" text-anchor="middle" font-size="14" fill="#666">+</text>

  <rect x="180" y="186" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">271</text>

  <text x="242" y="206" text-anchor="middle" font-size="14" fill="#666">=</text>

  <rect x="252" y="186" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="277" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">443</text>

  <text x="316" y="206" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="336" y="206" font-size="10" fill="#4a7a3a">命中</text>

  <!-- Example row 2: 140 + 041(=41) = 181 -->
  <rect x="108" y="226" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">140</text>

  <text x="170" y="246" text-anchor="middle" font-size="14" fill="#666">+</text>

  <!-- Highlight: leading zero dropped -->
  <rect x="180" y="226" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">041</text>

  <text x="242" y="246" text-anchor="middle" font-size="14" fill="#666">=</text>

  <rect x="252" y="226" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="277" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">181</text>

  <text x="316" y="246" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Callout: leading zero -->
  <path d="M 205 262 L 205 276" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">041 → 41</text>
  <text x="205" y="304" text-anchor="middle" font-size="9.5" fill="#b85450">前导零自然丢弃</text>

  <!-- Right-side note about symmetry break -->
  <rect x="350" y="262" width="146" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="423" y="280" text-anchor="middle" font-size="9.5" fill="#555">末尾零打破对称：</text>
  <text x="423" y="296" text-anchor="middle" font-size="9.5" fill="#b85450">rev(rev(140))=14≠140</text>

  <!-- Footer -->
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#aaa">因 rev(k) ≥ 0 ⟹ k ≤ num；num ≤ 10^5 时暴力枚举即最优</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#aaa">反转用数值取模或字符串切片，前导零天然处理</text>
</svg>
