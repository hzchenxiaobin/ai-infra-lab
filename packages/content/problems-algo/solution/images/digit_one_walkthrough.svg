<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 13，逐位统计数字 1 的总数</text>

  <!-- n = 1 3 digit boxes -->
  <text x="120" y="66" font-size="12" fill="#555">n = </text>
  <rect x="150" y="48" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="74" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">1</text>
  <text x="174" y="98" text-anchor="middle" font-size="10" fill="#888">十位</text>
  <rect x="202" y="48" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="74" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">3</text>
  <text x="226" y="98" text-anchor="middle" font-size="10" fill="#888">个位</text>

  <!-- Position 1: ones place (factor=1) -->
  <rect x="40" y="120" width="270" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="142" font-size="12" fill="#b85450" font-weight="bold">第 1 位：个位（factor = 1）</text>
  <text x="60" y="162" font-size="11" fill="#333">high = 13 / 10 = 1</text>
  <text x="60" y="178" font-size="11" fill="#333">cur = (13 / 1) % 10 = 3</text>
  <text x="60" y="194" font-size="11" fill="#333">low = 13 % 1 = 0</text>
  <text x="60" y="212" font-size="11" fill="#b85450" font-weight="bold">cur ≥ 2 → (high + 1) × factor</text>
  <text x="60" y="230" font-size="12" fill="#333" font-weight="bold">= (1 + 1) × 1 = 2</text>

  <!-- Position 2: tens place (factor=10) -->
  <rect x="330" y="120" width="270" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="142" font-size="12" fill="#d6a040" font-weight="bold">第 2 位：十位（factor = 10）</text>
  <text x="350" y="162" font-size="11" fill="#333">high = 13 / 100 = 0</text>
  <text x="350" y="178" font-size="11" fill="#333">cur = (13 / 10) % 10 = 1</text>
  <text x="350" y="194" font-size="11" fill="#333">low = 13 % 10 = 3</text>
  <text x="350" y="212" font-size="11" fill="#d6a040" font-weight="bold">cur = 1 → high × factor + low + 1</text>
  <text x="350" y="230" font-size="12" fill="#333" font-weight="bold">= 0 × 10 + 3 + 1 = 4</text>

  <!-- Numbers 1..13 with 1s highlighted -->
  <text x="310" y="262" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">直观验证：列出 1 ~ 13，标记每个数字 1</text>
  <!-- 1 (one 1) -->
  <rect x="50" y="276" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <!-- 2 -->
  <rect x="86" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="296" text-anchor="middle" font-size="13" fill="#888">2</text>
  <!-- 3 -->
  <rect x="122" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="296" text-anchor="middle" font-size="13" fill="#888">3</text>
  <!-- 4 -->
  <rect x="158" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="296" text-anchor="middle" font-size="13" fill="#888">4</text>
  <!-- 5 -->
  <rect x="194" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="211" y="296" text-anchor="middle" font-size="13" fill="#888">5</text>
  <!-- 6 -->
  <rect x="230" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="247" y="296" text-anchor="middle" font-size="13" fill="#888">6</text>
  <!-- 7 -->
  <rect x="266" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="283" y="296" text-anchor="middle" font-size="13" fill="#888">7</text>
  <!-- 8 -->
  <rect x="302" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="319" y="296" text-anchor="middle" font-size="13" fill="#888">8</text>
  <!-- 9 -->
  <rect x="338" y="276" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="296" text-anchor="middle" font-size="13" fill="#888">9</text>
  <!-- 10 (tens 1) -->
  <rect x="374" y="276" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="406" y="296" text-anchor="middle" font-size="13" fill="#888">0</text>
  <!-- 11 (two 1s) -->
  <rect x="418" y="276" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="450" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <!-- 12 (tens 1) -->
  <rect x="462" y="276" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="494" y="296" text-anchor="middle" font-size="13" fill="#888">2</text>
  <!-- 13 (tens 1) -->
  <rect x="506" y="276" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="519" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="538" y="296" text-anchor="middle" font-size="13" fill="#888">3</text>

  <!-- Annotation: which position each 1 comes from -->
  <text x="67" y="322" text-anchor="middle" font-size="9" fill="#b85450">个位</text>
  <text x="387" y="322" text-anchor="middle" font-size="9" fill="#d6a040">十位</text>
  <text x="431" y="322" text-anchor="middle" font-size="9" fill="#d6a040">十位</text>
  <text x="450" y="322" text-anchor="middle" font-size="9" fill="#b85450">个位</text>
  <text x="475" y="322" text-anchor="middle" font-size="9" fill="#d6a040">十位</text>
  <text x="519" y="322" text-anchor="middle" font-size="9" fill="#d6a040">十位</text>

  <!-- Count summary -->
  <rect x="40" y="340" width="270" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="364" text-anchor="middle" font-size="12" fill="#333">个位为 1 的数：1, 11 → 2 个</text>

  <rect x="330" y="340" width="270" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="364" text-anchor="middle" font-size="12" fill="#333">十位为 1 的数：10,11,12,13 → 4 个</text>

  <!-- Final result -->
  <rect x="40" y="394" width="560" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">合计 = 2 (个位) + 4 (十位) = 6 ✓</text>
</svg>
