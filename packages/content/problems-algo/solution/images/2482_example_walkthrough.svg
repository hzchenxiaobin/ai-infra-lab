<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：grid + 行/列一数 → 套公式 → diff</text>

  <!-- ====== Left: grid 3x3 + margins, cell=38, x0=40, y0=72 ====== -->
  <text x="84" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输入 grid（m=n=3）</text>

  <!-- Row 0: 0,1,1 -->
  <rect x="40" y="72" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="59" y="96" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="78" y="72" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="97" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="72" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156" y="72" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="177" y="90" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">r0</text>
  <text x="177" y="104" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 1: 1,0,1 -->
  <rect x="40" y="110" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="59" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="78" y="110" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="97" y="134" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="116" y="110" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156" y="110" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="177" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">r1</text>
  <text x="177" y="142" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 2: 0,0,1 -->
  <rect x="40" y="148" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="59" y="172" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="78" y="148" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="97" y="172" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="116" y="148" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156" y="148" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="177" y="166" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">r2</text>
  <text x="177" y="180" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- col margin -->
  <rect x="40" y="186" width="38" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="200" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">c0</text>
  <text x="59" y="214" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="78" y="186" width="38" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="97" y="200" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">c1</text>
  <text x="97" y="214" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="186" width="38" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="200" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">c2</text>
  <text x="135" y="214" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- arrow to right -->
  <path d="M 212 130 L 296 130" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">套公式</text>

  <!-- ====== Right: diff matrix 3x3, cell=50, x0=320, y0=72 ====== -->
  <text x="395" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">输出 diff</text>

  <!-- Row 0: 0,0,4 -->
  <rect x="320" y="72" width="50" height="50" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="102" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">0</text>
  <rect x="370" y="72" width="50" height="50" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="102" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">0</text>
  <rect x="420" y="72" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Row 1: 0,0,4 -->
  <rect x="320" y="122" width="50" height="50" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="152" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">0</text>
  <rect x="370" y="122" width="50" height="50" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="152" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">0</text>
  <rect x="420" y="122" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="152" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Row 2: -2,-2,2 -->
  <rect x="320" y="172" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="345" y="202" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="370" y="172" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="395" y="202" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="420" y="172" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- divider -->
  <path d="M 30 244 L 550 244" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- ====== Bottom: sample computations ====== -->
  <text x="30" y="264" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">抽样演算（n=m=3）：</text>

  <!-- sample (0,2) -> 4 -->
  <rect x="30" y="276" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="297" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,2):</text>
  <text x="90" y="297" font-size="10.5" fill="#333" filter="url(#rough2)">2·r0 − n + 2·c2 − m</text>
  <text x="232" y="297" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1+3 = 4</text>

  <!-- sample (2,0) -> -2 -->
  <rect x="300" y="276" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="297" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2,0):</text>
  <text x="360" y="297" font-size="10.5" fill="#333" filter="url(#rough2)">2·r2 − n + 2·c0 − m</text>
  <text x="502" y="297" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= −1−1 = −2</text>

  <!-- legend -->
  <rect x="30" y="324" width="18" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="335" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">正值</text>
  <rect x="100" y="324" width="18" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="124" y="335" font-size="10.5" fill="#b85450" filter="url(#rough2)">负值</text>
  <rect x="170" y="324" width="18" height="13" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="194" y="335" font-size="10.5" fill="#888" filter="url(#rough2)">零</text>
  <rect x="230" y="324" width="18" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="254" y="335" font-size="10.5" fill="#446688" filter="url(#rough2)">行一数 r[i]</text>
  <rect x="330" y="324" width="18" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="354" y="335" font-size="10.5" fill="#d6a040" filter="url(#rough2)">列一数 c[j]</text>
</svg>
