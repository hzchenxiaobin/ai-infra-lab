<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="640" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：≤26 个候选起点 × 每起点一次线性扫描</text>

  <!-- start box -->
  <rect x="100" y="38" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理：扫描一遍 s</text>
  <text x="210" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">记录每个字符的 first[c] / last[c]</text>

  <path d="M 210 82 L 210 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- enum box -->
  <rect x="100" y="100" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = −1；枚举 26 个字符 c</text>
  <text x="210" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">起点 i = first[c]（全试完 → 返回 ans）</text>

  <path d="M 210 144 L 210 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="100" y="162" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="184" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mx = last[c]，j = i</text>

  <path d="M 210 196 L 210 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: j < n ? -->
  <path d="M 210 214 L 300 240 L 210 266 L 120 240 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="245" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; n ?</text>

  <!-- D1 no-branch to R1 -->
  <text x="308" y="232" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 300 240 L 352 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="356" y="222" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="239" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">本起点扫描结束</text>
  <text x="426" y="255" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 下一个字符 c</text>

  <!-- R1 loop back to enum box -->
  <path d="M 426 222 L 426 122 L 324 122" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- D1 yes-branch down -->
  <text x="220" y="284" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 210 266 L 210 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- diamond 2: first[s[j]] < i ? -->
  <path d="M 210 290 L 300 326 L 210 362 L 120 326 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="331" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">first[s[j]] &lt; i ?</text>

  <!-- D2 yes-branch to R2 -->
  <text x="308" y="318" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300 326 L 352 326" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="356" y="308" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="325" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break：s[j] 在左边出现过</text>
  <text x="426" y="341" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">起点 i 报废 → 下一个 c</text>

  <!-- R2 loop back to enum box -->
  <path d="M 496 328 L 508 328 L 508 114 L 324 114" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- D2 no-branch down -->
  <text x="220" y="380" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 210 362 L 210 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- update mx box -->
  <rect x="100" y="384" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="406" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mx = max(mx, last[s[j]])</text>

  <path d="M 210 418 L 210 436" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 3: mx == j && len < n ? -->
  <path d="M 210 440 L 300 478 L 210 516 L 120 478 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="474" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">mx == j 且</text>
  <text x="210" y="492" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j−i+1 &lt; n ?</text>

  <!-- D3 yes-branch to ans box -->
  <text x="308" y="468" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300 478 L 352 478" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="356" y="460" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="477" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = max(ans,</text>
  <text x="426" y="493" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j − i + 1)</text>

  <!-- ans box merge into j++ box -->
  <path d="M 426 500 L 426 548 L 324 548" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- D3 no-branch down -->
  <text x="220" y="532" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 210 516 L 210 532" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- j++ box -->
  <rect x="100" y="536" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="558" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j++，回到「j &lt; n ?」</text>

  <!-- loop back to diamond 1 -->
  <path d="M 100 553 L 64 553 L 64 240 L 114 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="76" y="350" font-size="10" fill="#446688" filter="url(#rough2)" transform="rotate(-90 76 350)">j 前进，继续内层循环</text>

  <!-- enum-done dashed path to return -->
  <path d="M 100 122 L 40 122 L 40 606 L 146 606" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="10" fill="#8a6d3b" filter="url(#rough2)" transform="rotate(-90 56 360)">26 个字符都枚举完</text>

  <!-- return box -->
  <rect x="150" y="588" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="611" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
