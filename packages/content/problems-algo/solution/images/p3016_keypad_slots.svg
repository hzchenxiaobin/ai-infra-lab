<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">键盘模型：只有 2~9 共 8 个键挂字母，键内第 k 个字母要连按 k 次</text>

  <!-- keypad 3 cols x 4 rows -->
  <rect x="48" y="60" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="77" y="91" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">1</text>

  <rect x="116" y="60" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="91" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="184" y="60" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="213" y="91" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="48" y="124" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="155" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="116" y="124" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="155" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="184" y="124" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="213" y="155" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="48" y="188" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="219" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="116" y="188" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="219" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="184" y="188" width="58" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="213" y="219" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="48" y="252" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="77" y="283" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">*</text>

  <rect x="116" y="252" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="283" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">0</text>

  <rect x="184" y="252" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="213" y="283" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">#</text>

  <text x="143" y="330" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">蓝色 8 个键：挂字母</text>
  <text x="143" y="348" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">1 / * / 0 / # 不挂字母</text>

  <!-- zoom arrow -->
  <path d="M 234 208 C 272 200 276 172 300 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="182" font-size="10.5" fill="#888" filter="url(#rough2)">放大看</text>

  <!-- zoomed key -->
  <text x="375" y="60" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">位次 = 字母在键内排第几个</text>
  <rect x="310" y="70" width="130" height="168" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="375" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">某个键（比如 9）</text>

  <rect x="324" y="106" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="128" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="376" y="128" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">按 1 次</text>

  <rect x="324" y="150" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="172" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="376" y="172" font-size="11.5" fill="#d6a040" filter="url(#rough2)">按 2 次</text>

  <rect x="324" y="194" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="216" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="376" y="216" font-size="11.5" fill="#b85450" filter="url(#rough2)">按 3 次</text>

  <!-- rules note -->
  <rect x="288" y="256" width="216" height="104" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="396" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 一个键可以挂任意多个字母</text>
  <text x="396" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 每个字母恰好挂在一个键上</text>
  <text x="396" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 不必每个键都有字母</text>
  <text x="396" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 同一字母出现几次就计费几次</text>
</svg>
