<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：source = "xyz", target = "xzyxz"
  </text>

  <!-- ===== header: target 全串，按轮着色 ===== -->
  <text x="30" y="64" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">target</text>
  <rect x="120" y="48" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="164" y="48" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>
  <rect x="208" y="48" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="252" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="296" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>

  <text x="139" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="183" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="227" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="271" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="315" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 分隔线 -->
  <path d="M 30 104 L 530 104" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== 第 1 轮 ===== -->
  <rect x="20" y="116" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="57" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 轮</text>

  <!-- source 扫描：x✓ y跳 z✓ -->
  <text x="110" y="135" font-size="11" fill="#888" filter="url(#rough2)">扫 source:</text>
  <rect x="178" y="116" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="198" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中</text>
  <rect x="222" y="116" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="135" text-anchor="middle" font-size="13" fill="#999" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="242" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>
  <rect x="266" y="116" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="286" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中</text>

  <!-- 箭头到结果 -->
  <path d="M 318 130 L 356 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="116" width="70" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">吃 "xz"</text>
  <text x="450" y="135" font-size="11" fill="#666" filter="url(#rough2)">i: 0→2</text>

  <path d="M 30 172 L 530 172" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 第 2 轮 ===== -->
  <rect x="20" y="184" width="74" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="57" y="203" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 轮</text>

  <text x="110" y="203" font-size="11" fill="#888" filter="url(#rough2)">扫 source:</text>
  <rect x="178" y="184" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="198" y="203" text-anchor="middle" font-size="13" fill="#999" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="198" y="226" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>
  <rect x="222" y="184" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="242" y="226" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓ 命中</text>
  <rect x="266" y="184" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="203" text-anchor="middle" font-size="13" fill="#999" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="286" y="226" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>

  <path d="M 318 198 L 356 198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="184" width="70" height="28" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="203" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吃 "y"</text>
  <text x="450" y="203" font-size="11" fill="#666" filter="url(#rough2)">i: 2→3</text>

  <path d="M 30 240 L 530 240" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 第 3 轮 ===== -->
  <rect x="20" y="252" width="74" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="57" y="271" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第 3 轮</text>

  <text x="110" y="271" font-size="11" fill="#888" filter="url(#rough2)">扫 source:</text>
  <rect x="178" y="252" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="198" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">✓ 命中</text>
  <rect x="222" y="252" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="271" text-anchor="middle" font-size="13" fill="#999" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="242" y="294" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>
  <rect x="266" y="252" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="286" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">✓ 命中</text>

  <path d="M 318 266 L 356 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="252" width="70" height="28" fill="#fff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="271" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">吃 "xz"</text>
  <text x="450" y="271" font-size="11" fill="#666" filter="url(#rough2)">i: 3→5</text>

  <!-- ===== 结果 ===== -->
  <rect x="30" y="320" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    拼接 "xz" + "y" + "xz" = "xzyxz"  →  返回 count = 3
  </text>

  <!-- 无解提示 -->
  <rect x="30" y="375" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    无解判定：若某轮扫完整段 source 后 i 没有前进（i == prev）
  </text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    说明 target 当前字符在 source 中不存在 → 返回 -1
  </text>
</svg>
