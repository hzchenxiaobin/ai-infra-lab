<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">对角线只看 l²+w²：长边更长 ≠ 对角线更长</text>

  <!-- Rect A: 9 x 3, scale 7px/unit -->
  <text x="95" y="66" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">d = √90 ≈ 9.49</text>
  <rect x="64" y="74" width="63" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <line x1="64" y1="95" x2="127" y2="74" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="12.5" fill="#334" font-weight="bold" filter="url(#rough2)">矩形 ① 9 × 3</text>

  <!-- Rect B: 8 x 6, scale 7px/unit -->
  <text x="358" y="46" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">d = √100 = 10</text>
  <rect x="330" y="53" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <line x1="330" y1="95" x2="386" y2="53" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="358" y="118" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">矩形 ② 8 × 6</text>

  <!-- middle annotations -->
  <text x="238" y="72" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">长边：9 &gt; 8</text>
  <text x="238" y="90" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不能作数 ✗</text>
  <text x="238" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">对角线：9.49 &lt; 10</text>
  <text x="238" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 胜 ✓</text>

  <!-- chips -->
  <rect x="38" y="136" width="116" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="154" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">d² = 90，面积 = 27</text>
  <rect x="306" y="136" width="124" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="368" y="154" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d² = 100，面积 = 48</text>

  <!-- formula strip -->
  <rect x="60" y="176" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">√ 单调 ⇒ √a &lt; √b ⇔ a &lt; b</text>
  <text x="260" y="211" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">比较搬到整数域：直接比 d² = l² + w²，不开方</text>

  <!-- perimeter note -->
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">周长同样不能代理：[3,4] 周长 14 &gt; [1,5] 周长 12，对角线却 5 &lt; √26 ≈ 5.10</text>

  <!-- bottom dashed note -->
  <rect x="48" y="262" width="424" height="106" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">① 对角线 d = √(l²+w²) 由长宽共同决定——长边、周长都只是片面代理；</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">② √ 单调 ⇒ 比较改用整数 d² = l²+w²，零浮点误差；</text>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">③ 平局规则 = 字典序 (d², area)：主键对角线、次键面积，单趟维护 top-1。</text>
</svg>
