<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">k=3, arrival=[1,2,3,4,5], load=[5,2,3,3,3]</text>

  <!-- table outer -->
  <rect x="30" y="60" width="540" height="232" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="60" width="540" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">i</text>
  <text x="100" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">到达</text>
  <text x="160" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">目标i%k</text>
  <text x="245" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">释放回 free</text>
  <text x="335" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">选中</text>
  <text x="425" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">cnt</text>
  <text x="525" y="78" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">结果</text>

  <!-- column separators -->
  <line x1="70" y1="86" x2="70" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="86" x2="130" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="86" x2="190" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="86" x2="300" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="86" x2="370" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="86" x2="480" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=0 -->
  <rect x="32" y="88" width="536" height="38" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="50" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1</text>
  <text x="160" y="112" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">0</text>
  <text x="245" y="112" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="335" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="425" y="112" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">[1,0,0]</text>
  <text x="525" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">分配 0</text>

  <!-- row i=1 -->
  <rect x="32" y="128" width="536" height="38" fill="#f6f6f6" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="50" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="100" y="152" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">2</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1</text>
  <text x="245" y="152" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="335" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="425" y="152" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">[1,1,0]</text>
  <text x="525" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">分配 1</text>

  <!-- row i=2 -->
  <rect x="32" y="168" width="536" height="38" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="50" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="100" y="192" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">3</text>
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">2</text>
  <text x="245" y="192" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="335" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="425" y="192" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">[1,1,1]</text>
  <text x="525" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">分配 2</text>

  <!-- row i=3 (key: boundary release 4<=4) -->
  <rect x="32" y="208" width="536" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="100" y="232" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">4</text>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">0</text>
  <text x="245" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1 (end4≤4)</text>
  <text x="335" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="425" y="232" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">[1,2,1]</text>
  <text x="525" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">分配 1</text>

  <!-- row i=4 (dropped) -->
  <rect x="32" y="248" width="536" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="100" y="272" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">5</text>
  <text x="160" y="272" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1</text>
  <text x="245" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">free 空</text>
  <text x="335" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">—</text>
  <text x="425" y="272" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">[1,2,1]</text>
  <text x="525" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">丢弃</text>

  <!-- arrow to conclusion -->
  <path d="M 300 296 L 300 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="80" y="318" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cnt = [1, 2, 1]，最大值 mx = 2</text>
  <text x="300" y="356" text-anchor="middle" font-size="12" fill="#444">只有服务器 1 处理了 2 个请求 → 返回 [1]</text>

  <!-- notes -->
  <rect x="40" y="378" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="398" font-size="10" fill="#555">▶ i=3 关键：服务器 1 的 end=4，恰在 arrival=4 时完工（4 ≤ 4），被释放回 free，于是 ceiling(0)=1 选中它。</text>
  <text x="58" y="414" font-size="10" fill="#555">▶ i=4：三台服务器 end 分别为 6/7/6，均 &gt; 5，无人空闲 → 请求丢弃，cnt 不变。</text>
  <text x="58" y="428" font-size="10" fill="#d6a040">⚠ “完工”判定用 ≤：end ≤ arrival 即可被重新分配（半开区间 [start, end) 的右端点已空闲）。</text>
</svg>
