<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">点修改的局部性：改 colors[idx] 只切换左、右两条边</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">colors = [0,1,0,1,0,1] 整环交替，queries = [[2,2,1]]</text>

  <!-- 改前行：x = 90,148,206,264,322,380 宽 48 -->
  <text x="42" y="80" font-size="11" fill="#555" filter="url(#rough2)">改前</text>
  <rect x="90" y="58" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="58" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="58" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="230" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">idx=2</text>
  <rect x="264" y="58" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="322" y="58" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="58" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="196" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="254" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="312" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="440" y="66" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">m=0 断点</text>
  <text x="440" y="80" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">整环是环：</text>
  <text x="440" y="94" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">answer=n</text>

  <!-- 更新箭头 -->
  <path d="M 240 100 L 240 126" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="118" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">[2,2,1]：colors[2] 0→1</text>

  <!-- 改后行 -->
  <text x="42" y="158" font-size="11" fill="#555" filter="url(#rough2)">改后</text>
  <rect x="90" y="136" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="136" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="136" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="230" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="130" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">idx=2</text>
  <rect x="264" y="136" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="322" y="136" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="136" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="159" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="196" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="254" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="312" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 改后极大段：{tile2} 与 tiles 3..1 绕回 -->
  <rect x="200" y="182" width="60" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L=1</text>
  <rect x="259" y="182" width="174" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="346" y="198" text-anchor="middle" font-size="10" fill="#2f5426" filter="url(#rough2)">tiles 3..5</text>
  <rect x="85" y="182" width="136" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="153" y="198" text-anchor="middle" font-size="10" fill="#2f5426" filter="url(#rough2)">tiles 0..1</text>
  <path d="M 346 208 C 346 228, 153 228, 153 208" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#2f5426" filter="url(#rough2)">绕回接成一段：L = 5（1,0,1,0,1）</text>

  <!-- 三种形态小结 -->
  <text x="260" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">一次改色只有三种形态（左右两边各自「断开 / 接上」的组合）</text>
  <rect x="40" y="262" width="146" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5426" filter="url(#rough2)">① 两边都断开 → 分裂</text>
  <text x="113" y="300" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">一段 L 裂成三段</text>
  <text x="113" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">L → a, 1, b</text>
  <rect x="196" y="262" width="146" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="269" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4460" filter="url(#rough2)">② 两边都接上 → 合并</text>
  <text x="269" y="300" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">三段并成一段</text>
  <text x="269" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a, 1, b → L</text>
  <rect x="352" y="262" width="146" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a10" filter="url(#rough2)">③ 一断一接 → 平移</text>
  <text x="425" y="300" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">段边界挪一格</text>
  <text x="425" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a, b → a+1, b−1</text>
  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">本例即形态①：m 从 0 → 2，整环裂成 L=1 与 L=5 两段（k=3 的答案 6 → 5−3+1=3）</text>
</svg>
