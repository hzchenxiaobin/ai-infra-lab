<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">前缀计数表与差分：freq(c, l, r) = pre[r+1][c] − pre[l][c]</text>

  <!-- 字符串 s（与下方表的列 i=1..6 对齐） -->
  <text x="150" y="68" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="155" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="195" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="275" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="355" y="48" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="214" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="254" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="294" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="334" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="374" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="174" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="214" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="254" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="294" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="334" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="374" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">读入 s[i−1]：从列 i−1 整行拷贝到列 i，再给对应字母 +1</text>

  <!-- 查询用到的两列标记 -->
  <text x="174" y="134" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">l = 1</text>
  <text x="334" y="134" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">r+1 = 5</text>

  <!-- 高亮列（i=1 与 i=5） -->
  <rect x="154" y="140" width="40" height="100" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="314" y="140" width="40" height="100" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 表格网格 -->
  <rect x="70" y="140" width="324" height="100" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 114 140 L 114 240 M 154 140 L 154 240 M 194 140 L 194 240 M 234 140 L 234 240 M 274 140 L 274 240 M 314 140 L 314 240 M 354 140 L 354 240" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 70 165 L 394 165 M 70 190 L 394 190 M 70 215 L 394 215" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="92" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">字母</text>
  <text x="134" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="174" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="214" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="254" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="294" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="334" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="374" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>

  <!-- 行标签 -->
  <text x="92" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="92" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="92" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- a 行 -->
  <text x="134" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="214" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="254" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="294" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="334" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="374" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- b 行 -->
  <text x="134" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="214" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="254" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="294" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="334" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="374" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- c 行 -->
  <text x="134" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="214" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="254" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="294" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="334" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="374" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 i = 前 i 个字符中各字母的个数（pre[0] 全零）</text>

  <!-- 底部：查询差分演算 -->
  <rect x="40" y="268" width="480" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="64" y="294" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">查询 [1, 4]：freq = pre[5] − pre[1]，再套 t(t+1)/2</text>
  <text x="64" y="318" font-size="12" fill="#333" filter="url(#rough2)">a：3 − 1 = 2 → 2×3÷2 = 3</text>
  <text x="64" y="340" font-size="12" fill="#333" filter="url(#rough2)">b：1 − 0 = 1 → 1×2÷2 = 1</text>
  <text x="64" y="362" font-size="12" fill="#333" filter="url(#rough2)">c：1 − 0 = 1 → 1×2÷2 = 1</text>
  <text x="400" y="340" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 5 ✓</text>
</svg>
