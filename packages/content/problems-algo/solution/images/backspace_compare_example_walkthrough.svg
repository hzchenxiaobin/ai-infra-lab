<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "ab##", t = "c#d#"</text>

  <!-- s walkthrough -->
  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">s = "ab##" 双指针逆序</text>

  <!-- step1: i at last # -->
  <text x="30" y="76" font-size="10" fill="#555">① i=4, s[4]='#' → skip=1, i=3</text>
  <rect x="200" y="62" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="240" y="62" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <rect x="280" y="62" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <rect x="320" y="62" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="338" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <path d="M 338 96 L 338 92" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step2: i=3 is #, skip now 2 -->
  <text x="30" y="112" font-size="10" fill="#555">② i=3, s[3]='#' → skip=2, i=2</text>
  <rect x="200" y="98" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="240" y="98" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <rect x="280" y="98" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <rect x="320" y="98" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="338" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <path d="M 298 132 L 298 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step3: i=2 b, skip=2>0 skip it -->
  <text x="30" y="148" font-size="10" fill="#555">③ i=2, s[2]='b', skip&gt;0 → 跳过b, skip=1, i=1</text>
  <rect x="200" y="134" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="240" y="134" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">b</text>
  <text x="258" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">被删</text>
  <rect x="280" y="134" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <rect x="320" y="134" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="338" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>

  <!-- step4: i=1 a, skip=1>0 skip it -->
  <text x="30" y="186" font-size="10" fill="#555">④ i=1, s[1]='a', skip&gt;0 → 跳过a, skip=0, i=0</text>
  <rect x="200" y="172" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a</text>
  <text x="218" y="208" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">被删</text>
  <rect x="240" y="172" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <rect x="280" y="172" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <rect x="320" y="172" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="338" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>

  <text x="30" y="222" font-size="10.5" fill="#4a7a3a" font-weight="bold">⑤ i=0 &lt; 0 → s 耗尽，有效串为 ""</text>

  <!-- divider -->
  <path d="M 30 240 L 490 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- t walkthrough compact -->
  <text x="30" y="262" font-size="11" fill="#888" font-weight="bold">t = "c#d#" 双指针逆序</text>
  <text x="30" y="284" font-size="10" fill="#555">① j=3, '#' → skip=1, j=2</text>
  <text x="30" y="302" font-size="10" fill="#555">② j=2, 'd', skip&gt;0 → 跳过d, skip=0, j=1</text>
  <text x="30" y="320" font-size="10" fill="#555">③ j=1, '#' → skip=1, j=0</text>
  <text x="30" y="338" font-size="10" fill="#555">④ j=0, 'c', skip&gt;0 → 跳过c, skip=0, j=-1</text>
  <text x="30" y="358" font-size="10.5" fill="#4a7a3a" font-weight="bold">⑤ j=-1 &lt; 0 → t 耗尽，有效串为 ""</text>

  <!-- t char boxes -->
  <rect x="300" y="272" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c</text>
  <text x="318" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">被删</text>
  <rect x="340" y="272" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <rect x="380" y="272" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d</text>
  <rect x="420" y="272" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="438" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>

  <!-- result -->
  <rect x="150" y="372" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"" == "" → true ✓</text>
</svg>
