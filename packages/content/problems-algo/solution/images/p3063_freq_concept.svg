<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：一遍扫链表进哈希表，再把每个频率串成新链表</text>

  <!-- original linked list -->
  <text x="76" y="44" font-size="11" fill="#888" filter="url(#rough2)">原链表（无序：两个 2 中间隔着一个 1）</text>
  <text x="68" y="71" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">head →</text>

  <rect x="76" y="48" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 124 66 L 134 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="136" y="48" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 184 66 L 194 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="196" y="48" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="219" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 244 66 L 254 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="256" y="48" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 304 66 L 314 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="316" y="48" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="339" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 364 66 L 374 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="376" y="48" width="46" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="399" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <text x="432" y="71" font-size="12" fill="#999" filter="url(#rough2)">→ ∅</text>

  <!-- arrow down: counting -->
  <path d="M 249 88 L 249 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="104" font-size="11" fill="#446688" filter="url(#rough2)">① 一遍扫描：freq[val]++</text>

  <!-- hash table -->
  <text x="96" y="172" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">freq =</text>
  <text x="130" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">键 = 原值</text>

  <rect x="106" y="144" width="36" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="148" y="172" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">:</text>
  <rect x="154" y="144" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="177" y="172" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="216" y="144" width="36" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="258" y="172" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">:</text>
  <rect x="264" y="144" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="172" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="326" y="144" width="36" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="344" y="172" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <text x="368" y="172" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">:</text>
  <rect x="374" y="144" width="46" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="397" y="172" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>

  <text x="452" y="170" font-size="11" fill="#888" filter="url(#rough2)">值 = 频率</text>

  <!-- arrow down: build -->
  <path d="M 249 192 L 249 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="208" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② 遍历哈希表：每个频率 new 一个节点</text>

  <!-- result list -->
  <text x="160" y="242" font-size="11" fill="#888" filter="url(#rough2)">新链表：只挂频率、不挂原值，顺序任意</text>
  <text x="152" y="270" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">返回 →</text>

  <rect x="160" y="248" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="183" y="271" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="183" y="298" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">freq[1]</text>
  <path d="M 208 266 L 218 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="220" y="248" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="243" y="271" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="243" y="298" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">freq[2]</text>
  <path d="M 268 266 L 278 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="280" y="248" width="46" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="303" y="271" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="303" y="298" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">freq[3]</text>
  <text x="336" y="271" font-size="12" fill="#999" filter="url(#rough2)">→ ∅</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="440" height="74" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 原链表全程只读不动；新链表每个节点都是新 new 的</text>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">✅ 输出顺序任意：{1:3, 2:2, 3:1} 排成 [3,2,1] / [2,3,1] / … 都判正确</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">无序 ⇒ 重复值散布 ⇒ 只能全局哈希计数，不能「数相邻段」</text>
</svg>
