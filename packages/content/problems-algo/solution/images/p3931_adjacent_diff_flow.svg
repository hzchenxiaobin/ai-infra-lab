<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描 n−1 对，一处违规短路返回</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="232" y="34" width="96" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="52" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">开始</text>
    <path d="M280,62 L280,76" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="200" y="78" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="98" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i = 0（从第 0 对开始）</text>
    <path d="M280,110 L280,124" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 菱形一：还有对未判？ -->
  <g filter="url(#rough2)">
    <polygon points="280,124 396,166 280,208 164,166" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="162" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i ≤ n − 2 ？</text>
    <text x="280" y="178" text-anchor="middle" font-size="9.5" fill="#33506b">（还有相邻对未判？）</text>

    <text x="402" y="158" font-size="11" fill="#b85450" font-weight="bold">否</text>
    <path d="M396,166 L436,166" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="440" y="144" width="104" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="492" y="162" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">返回 true</text>
    <text x="492" y="178" text-anchor="middle" font-size="9.5" fill="#2f5d24">n−1 对全达标 ✓</text>

    <text x="290" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M280,208 L280,226" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 菱形二：本对差值判定 -->
  <g filter="url(#rough2)">
    <polygon points="280,228 400,272 280,316 160,272" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="268" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">|s[i+1] − s[i]| ≤ 2 ？</text>
    <text x="280" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24">（char 相减即数值差）</text>

    <text x="406" y="264" font-size="11" fill="#b85450" font-weight="bold">否</text>
    <path d="M400,272 L436,272" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="440" y="250" width="104" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="492" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 false</text>
    <text x="492" y="284" text-anchor="middle" font-size="9.5" fill="#8a3030">短路，一票否决</text>

    <text x="290" y="330" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M280,316 L280,332" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="200" y="334" width="160" height="32" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="354" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i ← i + 1（判下一对）</text>
  </g>

  <!-- 循环回边 -->
  <g filter="url(#rough2)">
    <path d="M200,350 L150,350 L150,166 L162,166" fill="none" stroke="#8a6d1a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <text x="142" y="262" text-anchor="end" font-size="9.5" fill="#8a6d1a">循环</text>
  </g>

  <!-- 边界备忘 -->
  <g filter="url(#rough2)">
    <rect x="18" y="240" width="120" height="112" rx="8" fill="#fff" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="78" y="262" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">边界备忘</text>
    <text x="78" y="282" text-anchor="middle" font-size="9.5" fill="#33506b">n = 2 ⇒ 仅一对</text>
    <text x="78" y="298" text-anchor="middle" font-size="9.5" fill="#33506b">(s[0], s[1])</text>
    <text x="78" y="314" text-anchor="middle" font-size="9.5" fill="#33506b">全达标也须扫完</text>
    <text x="78" y="330" text-anchor="middle" font-size="9.5" fill="#33506b">n−1 对 ⇒ Ω(n)</text>
    <text x="78" y="346" text-anchor="middle" font-size="9.5" fill="#33506b">O(n) 时间 O(1) 空间</text>
  </g>
</svg>
