<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">交换论证：相邻两任务谁先做？</text>

  <!-- 两个任务定义 -->
  <rect x="40" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="71" text-anchor="middle" font-size="13" fill="#333">任务 A = [a₁, m₁]</text>

  <rect x="280" y="46" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="71" text-anchor="middle" font-size="13" fill="#333">任务 B = [a₂, m₂]</text>

  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#888">前缀已耗 P（之前任务实际消耗之和）</text>

  <!-- A 先 B 后 -->
  <rect x="30" y="124" width="220" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="144" text-anchor="middle" font-size="12.5" fill="#b8860b" font-weight="bold">A 先 → B 后</text>
  <text x="140" y="166" text-anchor="middle" font-size="11.5" fill="#444">做 A：门槛 m₁，需 P + m₁</text>
  <text x="140" y="184" text-anchor="middle" font-size="11.5" fill="#444">做 B：剩 P−a₁，需 P + a₁ + m₂</text>
  <text x="140" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">需 P + max(m₁, a₁+m₂)</text>

  <!-- B 先 A 后 -->
  <rect x="270" y="124" width="220" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="144" text-anchor="middle" font-size="12.5" fill="#b8860b" font-weight="bold">B 先 → A 后</text>
  <text x="380" y="166" text-anchor="middle" font-size="11.5" fill="#444">做 B：门槛 m₂，需 P + m₂</text>
  <text x="380" y="184" text-anchor="middle" font-size="11.5" fill="#444">做 A：剩 P−a₂，需 P + a₂ + m₁</text>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">需 P + max(m₂, a₂+m₁)</text>

  <!-- 对比箭头 -->
  <path d="M 250 170 L 270 170" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="50" y="232" width="420" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12.5" fill="#333">A 先更优 ⟺ max(m₁, a₁+m₂) ≤ max(m₂, a₂+m₁)</text>
  <text x="260" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⟺ (m₁ − a₁) ≥ (m₂ − a₂)</text>

  <!-- 直觉解释 -->
  <rect x="40" y="312" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#333">diff = minimum − actual：门槛高出消耗的"余量"</text>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">按 diff 降序：余量大的先做（趁能量足），余量小的后做</text>
</svg>
