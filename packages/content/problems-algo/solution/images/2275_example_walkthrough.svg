<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：candidates = [16,17,71,62,12,24,14]</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">纵向对齐二进制，逐位数 1，取最大列 = 4</text>

  <!-- highlight bands for bit4/bit3/bit2 (the three max=4 columns) -->
  <rect x="226" y="92" width="36" height="196" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="262" y="92" width="36" height="196" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="298" y="92" width="36" height="196" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- table outer border -->
  <rect x="114" y="64" width="292" height="252" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- vertical grid lines -->
  <line x1="154" y1="64" x2="154" y2="316" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="64" x2="190" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="226" y1="64" x2="226" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="262" y1="64" x2="262" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="298" y1="64" x2="298" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="334" y1="64" x2="334" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="64" x2="370" y2="316" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- horizontal grid lines -->
  <line x1="114" y1="92" x2="406" y2="92" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="120" x2="406" y2="120" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="148" x2="406" y2="148" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="176" x2="406" y2="176" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="204" x2="406" y2="204" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="232" x2="406" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="260" x2="406" y2="260" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="114" y1="288" x2="406" y2="288" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- header: bit index -->
  <text x="148" y="82" text-anchor="end" font-size="11" fill="#888" font-weight="bold">数值</text>
  <text x="172" y="82" text-anchor="middle" font-size="10.5" fill="#888">b6</text>
  <text x="208" y="82" text-anchor="middle" font-size="10.5" fill="#888">b5</text>
  <text x="244" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b4</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b3</text>
  <text x="316" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">b2</text>
  <text x="352" y="82" text-anchor="middle" font-size="10.5" fill="#888">b1</text>
  <text x="388" y="82" text-anchor="middle" font-size="10.5" fill="#888">b0</text>

  <!-- row 16: 0 0 1 0 0 0 0 -->
  <text x="148" y="110" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">16</text>
  <text x="172" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="316" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="352" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="388" y="110" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- row 17: 0 0 1 0 0 0 1 -->
  <text x="148" y="138" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">17</text>
  <text x="172" y="138" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="138" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="316" y="138" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="352" y="138" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="388" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- row 71: 1 0 0 0 1 1 1 -->
  <text x="148" y="166" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">71</text>
  <text x="172" y="166" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="208" y="166" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="166" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="316" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="352" y="166" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="388" y="166" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- row 62: 0 1 1 1 1 1 0 -->
  <text x="148" y="194" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">62</text>
  <text x="172" y="194" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="194" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="244" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="316" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="352" y="194" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="388" y="194" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- row 12: 0 0 0 1 1 0 0 -->
  <text x="148" y="222" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">12</text>
  <text x="172" y="222" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="222" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="222" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="316" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="352" y="222" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="388" y="222" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- row 24: 0 0 1 1 0 0 0 -->
  <text x="148" y="250" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">24</text>
  <text x="172" y="250" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="250" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="316" y="250" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="352" y="250" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="388" y="250" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- row 14: 0 0 0 1 1 1 0 -->
  <text x="148" y="278" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">14</text>
  <text x="172" y="278" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="208" y="278" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="244" y="278" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="316" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="352" y="278" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="388" y="278" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- count row -->
  <text x="148" y="306" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">cnt</text>
  <text x="172" y="306" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="208" y="306" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="244" y="306" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="316" y="306" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="352" y="306" text-anchor="middle" font-size="12" fill="#888">3</text>
  <text x="388" y="306" text-anchor="middle" font-size="12" fill="#888">2</text>

  <!-- bracket for max columns -->
  <path d="M226 326 L226 334 L334 334 L334 326" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max = 4 ← 三位并列最长</text>

  <!-- conclusion box -->
  <rect x="60" y="362" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = max(1,1,4,4,4,3,2) = 4 ✓</text>
</svg>
