<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建集合 → 查集合（哈希集合解法）</text>

  <!-- Step 1: Start -->
  <rect x="220" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 280 76 L 280 94" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: init set -->
  <rect x="170" y="96" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#333">childSet = ∅  （哈希集合）</text>
  <path d="M 280 134 L 280 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: collect children -->
  <rect x="90" y="154" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第一遍遍历：收集所有子节点值</text>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#555">for node in tree: for child in node.children: childSet.add(child.val)</text>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#888">共处理 n−1 条父子关系 → O(n)</text>
  <path d="M 280 204 L 280 222" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: second pass -->
  <rect x="160" y="224" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第二遍遍历：for node in tree</text>
  <path d="M 280 258 L 280 278" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 280 280 L 376 316 L 280 352 L 184 316 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">node.val</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333">∈ childSet ?</text>

  <!-- Yes branch: continue (loop back up to second pass) -->
  <path d="M 376 316 L 440 316 L 440 241 L 400 241" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="396" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="448" y="280" font-size="10.5" fill="#888">该节点有父节点</text>
  <text x="448" y="294" font-size="10.5" fill="#888">→ 继续下一个</text>

  <!-- No branch: return root -->
  <path d="M 280 352 L 280 370" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="292" y="366" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="180" y="372" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return node  ← 根节点</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#888">值不在子节点集合 → 唯一无父节点者</text>

  <!-- complexity tag -->
  <rect x="40" y="410" width="120" height="22" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="426" text-anchor="middle" font-size="10.5" fill="#888">O(n) 时间 / O(n) 空间</text>
</svg>
