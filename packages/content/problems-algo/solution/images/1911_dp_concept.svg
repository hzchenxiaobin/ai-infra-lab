<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    两状态 DP：even（末位为加）/ odd（末位为减）
  </text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    初始 even = 0, odd = 0（空前缀，交替和为 0）
  </text>

  <!-- nums row -->
  <text x="50" y="76" font-size="12" fill="#888" filter="url(#rough2)">nums:</text>
  <rect x="100" y="60" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="60" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="60" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="310" y="60" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- even row -->
  <text x="50" y="120" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">even:</text>
  <rect x="100" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="310" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- odd row -->
  <text x="50" y="170" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">odd:</text>
  <rect x="100" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="310" y="154" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- Decision annotations for even row -->
  <text x="130" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">加</text>
  <text x="200" y="98" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">跳</text>
  <text x="270" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">加</text>
  <text x="340" y="98" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">跳</text>

  <!-- Decision annotations for odd row -->
  <text x="130" y="196" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">跳</text>
  <text x="200" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">减</text>
  <text x="270" y="196" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">跳</text>
  <text x="340" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">减</text>

  <!-- Key transition arrows -->
  <!-- odd[0]=0 -> even[1]? No, even[1] skips. -->
  <!-- even[0]=4 -> odd[1]=2 (subtract 2) -->
  <path d="M 155 134 Q 175 144 185 154" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="150" font-size="9" fill="#b85450" filter="url(#rough2)">−2</text>

  <!-- odd[1]=2 -> even[2]=7 (add 5) -->
  <path d="M 225 154 Q 245 144 255 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="150" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+5</text>

  <!-- even[2]=7 -> odd[3]=4 (subtract 3) -->
  <path d="M 295 134 Q 315 144 325 154" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="150" font-size="9" fill="#b85450" filter="url(#rough2)">−3</text>

  <!-- Answer annotation -->
  <path d="M 340 136 L 340 210" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="270" y="212" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="355" y="231" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = even = 7 ⭐</text>

  <!-- Transition rule boxes -->
  <rect x="30" y="258" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">even ← max(even, odd + num)</text>
  <text x="150" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">跳过 num 或把 num 加到 odd 后面</text>

  <rect x="290" y="258" width="240" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">odd ← max(odd, even − num)</text>
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">跳过 num 或把 num 减到 even 后面</text>

  <!-- Summary -->
  <rect x="30" y="324" width="500" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#7a3a38" filter="url(#rough2)">
    核心直觉：最优子序列必以「加」结尾（去掉末位减项只会更大）
  </text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    even/odd 在「跳过」与「接续」间取较大值，O(n) 一趟扫描
  </text>
</svg>
