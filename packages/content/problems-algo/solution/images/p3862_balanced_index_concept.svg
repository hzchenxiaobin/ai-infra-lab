<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：左和单调增、右积单调减 —— 乘积封顶即可比较</text>

  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 2：nums = [2, 8, 2, 2, 5]</text>

  <rect x="78" y="52" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="154" y="52" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="230" y="52" width="60" height="36" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="306" y="52" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="382" y="52" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="108" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="184" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="336" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="108" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="184" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="260" y="102" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ← i</text>
  <text x="336" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="412" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 78 108 L 78 114 Q 78 122 86 122 L 206 122 Q 214 122 214 114 L 214 108"
        fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左侧和 pre = 2+8 = 10</text>

  <path d="M 306 108 L 306 114 Q 306 122 314 122 L 434 122 Q 442 122 442 114 L 442 108"
        fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="140" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">右侧积 suf = 2×5 = 10</text>

  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 == 10 ✓</text>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">i = 2 即最小平衡下标</text>

  <path d="M 20 172 L 500 172" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <text x="180" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单调性：pre ↗ 严格增、suf ↘ 不增 —— 至多相交一次</text>

  <path d="M 40 330 L 305 228" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="318" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pre(i) 左和 ↗</text>

  <path d="M 40 228 L 305 330" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="44" y="222" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">suf(i) 右积 ↘</text>

  <circle cx="172" cy="279" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="186" y="268" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">pre == suf → 答案 i</text>

  <rect x="338" y="204" width="172" height="132" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="224" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">乘积会爆炸，怎么比？</text>
  <text x="424" y="244" text-anchor="middle" font-size="9.6" fill="#a0433f" filter="url(#rough2)">右积可达 (10⁹)^(10⁵)</text>
  <text x="424" y="261" text-anchor="middle" font-size="9.6" fill="#a0433f" filter="url(#rough2)">≈ 90 万位十进制数！</text>
  <text x="424" y="281" text-anchor="middle" font-size="9.6" fill="#a0433f" filter="url(#rough2)">而 pre ≤ 10⁵·10⁹ = 10¹⁴</text>
  <text x="424" y="301" text-anchor="middle" font-size="9.6" fill="#a0433f" filter="url(#rough2)">⇒ 封顶 CAP = 2×10¹⁸</text>
  <text x="424" y="321" text-anchor="middle" font-size="9.6" fill="#a0433f" filter="url(#rough2)">suf[i] = min(真实, CAP)</text>

  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">d(i) = pre − suf 单调不减 —— 一旦为正，立即返回 −1</text>
</svg>
