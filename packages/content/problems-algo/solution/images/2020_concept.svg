<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：区间重叠判定 + 反连接</text>

  <!-- ===== Timeline axis ===== -->
  <!-- 2021 highlighted region -->
  <rect x="260" y="50" width="190" height="230" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="355" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2021 年</text>

  <!-- Year markers -->
  <text x="70" y="46" font-size="10" fill="#888">2020-01</text>
  <text x="260" y="46" font-size="10" fill="#446688" font-weight="bold">2021-01</text>
  <text x="440" y="46" font-size="10" fill="#446688" font-weight="bold">2022-01</text>

  <!-- Timeline line -->
  <line x1="70" y1="52" x2="450" y2="52" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="49" x2="70" y2="55" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="49" x2="260" y2="55" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="450" y1="49" x2="450" y2="55" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- ===== Account rows ===== -->
  <!-- Account 9: sub 2020-02 to 2021-10, stream 2020-05 → RED (counts) -->
  <text x="50" y="76" font-size="9" fill="#555">acc 9</text>
  <rect x="99" y="68" width="374" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="153" cy="75" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="160" y="78" font-size="8" fill="#b85450">stream 2020-05</text>

  <!-- Account 3: sub 2021-09 to 2021-11, stream 2021-10 → GREEN -->
  <text x="50" y="112" font-size="9" fill="#555">acc 3</text>
  <rect x="449" y="104" width="32" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="471" cy="111" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="478" y="114" font-size="8" fill="#4a7a3a">21-10</text>

  <!-- Account 11: sub 2020-02 to 2020-08, stream 2020-04 → GRAY (not active 2021) -->
  <text x="50" y="148" font-size="9" fill="#999">acc 11</text>
  <rect x="105" y="140" width="104" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="143" cy="147" r="4" fill="#bbb" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="8" fill="#999">20-04（不在 2021）</text>

  <!-- Account 13: sub 2021-04 to 2021-09, stream 2021-08 → GREEN -->
  <text x="50" y="184" font-size="9" fill="#555">acc 13</text>
  <rect x="357" y="176" width="93" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="422" cy="183" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="429" y="186" font-size="8" fill="#4a7a3a">21-08</text>

  <!-- Account 4: sub 2020-10 to 2021-05, stream 2020-12 → RED (counts) -->
  <text x="50" y="220" font-size="9" fill="#555">acc 4</text>
  <rect x="251" y="212" width="117" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="290" cy="219" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="297" y="222" font-size="8" fill="#b85450">stream 20-12</text>

  <!-- Account 5: sub 2020-09 to 2021-01, stream 2021-01 → GREEN -->
  <text x="50" y="256" font-size="9" fill="#555">acc 5</text>
  <rect x="223" y="248" width="77" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="292" cy="255" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="299" y="258" font-size="8" fill="#4a7a3a">21-01</text>

  <!-- ===== Legend ===== -->
  <rect x="370" y="60" width="200" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="378" y="68" width="14" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="396" y="75" font-size="8" fill="#b85450">2021 有订阅、无流量</text>
  <rect x="378" y="80" width="14" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="396" y="87" font-size="8" fill="#4a7a3a">2021 有订阅、有流量</text>
  <rect x="378" y="92" width="14" height="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="396" y="99" font-size="8" fill="#999">2021 无订阅</text>
  <circle cx="385" cy="111" r="3" fill="#666"/>
  <text x="396" y="114" font-size="8" fill="#666">stream 日期</text>

  <!-- ===== Filter steps ===== -->
  <path d="M 290 288 L 290 308" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 1: overlap check -->
  <rect x="40" y="312" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="330" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① 区间重叠：订阅覆盖 2021</text>
  <text x="150" y="346" text-anchor="middle" font-size="8" fill="#666">start_date ≤ 2021-12-31 AND end_date ≥ 2021-01-01</text>

  <!-- Arrow to step 2 -->
  <path d="M 260 334 L 290 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: anti-join -->
  <rect x="294" y="312" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="404" y="330" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">② 反连接：2021 无 stream</text>
  <text x="404" y="346" text-anchor="middle" font-size="8" fill="#666">NOT EXISTS (stream WHERE YEAR=2021)</text>

  <!-- Arrow to result -->
  <path d="M 290 356 L 290 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="200" y="376" width="180" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">accounts_count</text>
  <line x1="200" y1="398" x2="380" y2="398" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="412" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- Bottom note -->
  <text x="290" y="430" text-anchor="middle" font-size="9" fill="#666">acc 4 和 acc 9：2021 有订阅但无流量 → 计数 = 2</text>
</svg>
