<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0 0 L5 9 L10 0 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：频率统计 → 绝对差求和</text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="140" y="50" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">① 遍历 s，统计字符频率 cntS[26]</text>
  </g>
  <path d="M280 88 L280 102" stroke="#888" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="140" y="106" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="129" text-anchor="middle" font-size="12" fill="#333">② 遍历 t，统计字符频率 cntT[26]</text>
  </g>
  <path d="M280 144 L280 158" stroke="#888" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <g filter="url(#rough2)">
    <rect x="100" y="162" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="185" text-anchor="middle" font-size="12" fill="#333">③ for c in 'a'..'z': ans += |cntS[c] − cntT[c]|</text>
  </g>
  <path d="M280 200 L280 214" stroke="#888" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <g filter="url(#rough2)">
    <rect x="140" y="218" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="280" y="241" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">④ return ans</text>
  </g>

  <!-- Side note -->
  <text x="470" y="183" font-size="10" fill="#888" filter="url(#rough2)">Σ|diff|</text>
  <text x="470" y="73" font-size="10" fill="#888" filter="url(#rough2)">O(n)</text>
  <text x="470" y="129" font-size="10" fill="#888" filter="url(#rough2)">O(m)</text>
  <text x="470" y="241" font-size="10" fill="#888" filter="url(#rough2)">O(1)</text>
</svg>
