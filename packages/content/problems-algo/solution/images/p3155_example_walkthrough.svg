<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：count=[4,3], upgrade=[3,5], sell=[4,2], money=[8,9]</text>

  <rect x="30" y="44" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="89" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">数据中心</text>
  <rect x="148" y="44" width="142" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219" y="57" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">budget =</text>
  <text x="219" y="69" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">money + count·sell</text>
  <rect x="290" y="44" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="333" y="57" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">unit =</text>
  <text x="333" y="69" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">upgrade + sell</text>
  <rect x="376" y="44" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="403" y="63" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⌊b/u⌋</text>
  <rect x="430" y="44" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="30" y="74" width="118" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=0 (4,3,4,8)</text>
  <rect x="148" y="74" width="142" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 + 4×4 = 24</text>
  <rect x="290" y="74" width="86" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 + 4 = 7</text>
  <rect x="376" y="74" width="54" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="430" y="74" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="460" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="30" y="108" width="118" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1 (3,5,2,9)</text>
  <rect x="148" y="108" width="142" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 + 3×2 = 15</text>
  <rect x="290" y="108" width="86" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 + 2 = 7</text>
  <rect x="376" y="108" width="54" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="430" y="108" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="460" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="158" width="460" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证 i=0：卖 1 台得 4 元 → 手头 8+4=12；升级 3 台花 9 ≤ 12 ✓</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（升满 4 台需 4×3=12 > 8，卖光才能凑 16 也不行——卖光就没机器升了）</text>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证 i=1：卖 1 台得 2 元 → 手头 11；升级 2 台花 10 ≤ 11 ✓</text>

  <rect x="30" y="242" width="460" height="138" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2 的陷阱：count=[1], upgrade=[2], sell=[1], money=[1]</text>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">budget = 1 + 1×1 = 2，unit = 2 + 1 = 3，⌊2/3⌋ = 0 → ans = [0]</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">手头 1 元不够升级（要 2 元）；</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">若先卖掉唯一的服务器赚 1 元，钱是够了——</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">但机器没了，无从升级：卖机器与升机器互斥</text>
</svg>
