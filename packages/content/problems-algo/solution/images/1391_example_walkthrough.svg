<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arred" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：grid = [[2,4,3],[6,5,2]]</text>
  <path d="M 140 38 Q 280 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">沿街道走，每步都要双向接通，6 步从 (0,0) 到 (1,2)</text>

  <!-- 2x3 grid cells, cell size 130, origin (80, 90) -->
  <!-- (0,0)=2 -->
  <g filter="url(#sk)">
    <rect x="80" y="90" width="130" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="92" y="108" font-size="11" font-weight="bold" fill="#2b4b6e">2</text>
  <path d="M 145 90 L 145 220" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- (0,1)=4 -->
  <g filter="url(#sk)">
    <rect x="210" y="90" width="130" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="222" y="108" font-size="11" font-weight="bold" fill="#2b4b6e">4</text>
  <path d="M 340 155 Q 275 155 275 220" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- (0,2)=3 -->
  <g filter="url(#sk)">
    <rect x="340" y="90" width="130" height="130" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="352" y="108" font-size="11" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="478" y="108" font-size="9" fill="#2e6e2e" font-weight="bold">终点</text>
  <path d="M 340 155 Q 405 155 405 220" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- (1,0)=6 -->
  <g filter="url(#sk)">
    <rect x="80" y="220" width="130" height="130" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="92" y="238" font-size="11" font-weight="bold" fill="#7a5415">6</text>
  <text x="92" y="252" font-size="9" fill="#7a5415" font-weight="bold">起点</text>
  <path d="M 210 285 Q 145 285 145 220" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- (1,1)=5 -->
  <g filter="url(#sk)">
    <rect x="210" y="220" width="130" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="222" y="238" font-size="11" font-weight="bold" fill="#2b4b6e">5</text>
  <path d="M 210 285 Q 275 285 275 220" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- (1,2)=2 -->
  <g filter="url(#sk)">
    <rect x="340" y="220" width="130" height="130" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="352" y="238" font-size="11" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="478" y="238" font-size="9" fill="#2e6e2e" font-weight="bold">终点</text>
  <path d="M 405 220 L 405 350" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>

  <!-- path arrows + step numbers (red overlay) -->
  <!-- step1 -> step2: (0,0) down to (1,0) -->
  <path d="M 158 175 L 158 205" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <!-- step2 -> step3: (1,0) right to (1,1) -->
  <path d="M 188 285 L 252 285" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <!-- step3 -> step4: (1,1) up to (0,1) -->
  <path d="M 290 245 L 290 215" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <!-- step4 -> step5: (0,1) right to (0,2) -->
  <path d="M 318 155 L 352 155" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <!-- step5 -> step6: (0,2) down to (1,2) -->
  <path d="M 418 175 L 418 205" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>

  <!-- step number badges -->
  <g filter="url(#sk)">
    <circle cx="180" cy="100" r="11" fill="#b85450" stroke="#8a3a38" stroke-width="1.2"/>
  </g>
  <text x="180" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
  <g filter="url(#sk)">
    <circle cx="180" cy="340" r="11" fill="#b85450" stroke="#8a3a38" stroke-width="1.2"/>
  </g>
  <text x="180" y="344" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <g filter="url(#sk)">
    <circle cx="310" cy="340" r="11" fill="#b85450" stroke="#8a3a38" stroke-width="1.2"/>
  </g>
  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
  <g filter="url(#sk)">
    <circle cx="310" cy="100" r="11" fill="#b85450" stroke="#8a3a38" stroke-width="1.2"/>
  </g>
  <text x="310" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
  <g filter="url(#sk)">
    <circle cx="440" cy="100" r="11" fill="#b85450" stroke="#8a3a38" stroke-width="1.2"/>
  </g>
  <text x="440" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>
  <g filter="url(#sk)">
    <circle cx="440" cy="340" r="11" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1.2"/>
  </g>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">6</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <line x1="80" y1="390" x2="110" y2="390" stroke="#d6a040" stroke-width="4"/>
  </g>
  <text x="118" y="394" font-size="11" fill="#555">街道（按格子类型固定）</text>
  <g filter="url(#sk)">
    <line x1="260" y1="390" x2="290" y2="390" stroke="#b85450" stroke-width="2.4" marker-end="url(#arred)"/>
  </g>
  <text x="298" y="394" font-size="11" fill="#b03a3a">行走方向（双向接通才能跨过）</text>

  <g filter="url(#sk)">
    <rect x="80" y="410" width="390" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="275" y="435" text-anchor="middle" font-size="11" fill="#444">路径：(0,0)→(1,0)→(1,1)→(0,1)→(0,2)→(1,2)，到达终点 ✓</text>
</svg>
