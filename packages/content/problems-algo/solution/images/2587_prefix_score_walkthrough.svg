<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums=[2,-1,0,1,-3,3,-3]</text>

  <!-- 排序后数组条 -->
  <text x="30" y="56" font-size="12" fill="#666" filter="url(#rough2)">降序后：</text>
  <g filter="url(#rough2)">
    <rect x="92" y="42" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="114" y="60" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="138" y="42" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="160" y="60" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="184" y="42" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="206" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="230" y="42" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="60" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="276" y="42" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="298" y="60" text-anchor="middle" font-size="12" fill="#333">-1</text>
    <rect x="322" y="42" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="344" y="60" text-anchor="middle" font-size="12" fill="#333">-3</text>
    <rect x="368" y="42" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="390" y="60" text-anchor="middle" font-size="12" fill="#333">-3</text>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="86" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="52" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">步</text>
    <rect x="74" y="86" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="96" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">num</text>
    <rect x="118" y="86" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="148" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">sum</text>
    <rect x="178" y="86" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="218" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">sum&gt;0?</text>
    <rect x="258" y="86" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="288" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">count</text>
    <rect x="318" y="86" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="408" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">说明</text>
  </g>

  <!-- 行：步 0..6，每行高 32，从 y=116 起 -->
  <!-- 步0 num=3 sum=3 >0 count=1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="116" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="136" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="74" y="116" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="96" y="136" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="118" y="116" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="148" y="136" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="178" y="116" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="116" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="328" y="136" font-size="11" fill="#666">最大正数先入，sum 起步即正</text>
  </g>

  <!-- 步1 num=2 sum=5 -->
  <g filter="url(#rough2)">
    <rect x="30" y="148" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="168" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="74" y="148" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="96" y="168" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="118" y="148" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="148" y="168" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="178" y="148" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="148" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="168" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="328" y="168" font-size="11" fill="#666">正数区持续累加，sum 单调增</text>
  </g>

  <!-- 步2 num=1 sum=6 -->
  <g filter="url(#rough2)">
    <rect x="30" y="180" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="200" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="74" y="180" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="96" y="200" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="118" y="180" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="148" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">6</text>
    <rect x="178" y="180" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="180" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="200" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="328" y="200" font-size="11" fill="#666">最后一个正数，sum 达峰</text>
  </g>

  <!-- 步3 num=0 sum=6 -->
  <g filter="url(#rough2)">
    <rect x="30" y="212" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="232" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="74" y="212" width="44" height="32" fill="#e8f0fe" stroke="#446688"/>
    <text x="96" y="232" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="118" y="212" width="60" height="32" fill="#e8f0fe" stroke="#446688"/>
    <text x="148" y="232" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="178" y="212" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="212" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="328" y="232" font-size="11" fill="#666">加 0 不变 sum，仍为正</text>
  </g>

  <!-- 步4 num=-1 sum=5 -->
  <g filter="url(#rough2)">
    <rect x="30" y="244" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="264" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="74" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="96" y="264" text-anchor="middle" font-size="12" fill="#333">-1</text>
    <rect x="118" y="244" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="148" y="264" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="178" y="244" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="244" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="264" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="328" y="264" font-size="11" fill="#666">进入负数区，最小负先来</text>
  </g>

  <!-- 步5 num=-3 sum=2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="276" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="296" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="74" y="276" width="44" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="96" y="296" text-anchor="middle" font-size="12" fill="#333">-3</text>
    <rect x="118" y="276" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="148" y="296" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="178" y="276" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="218" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
    <rect x="258" y="276" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="288" y="296" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="328" y="296" font-size="11" fill="#666">sum 递减但仍为正</text>
  </g>

  <!-- 步6 num=-3 sum=-1 break -->
  <g filter="url(#rough2)">
    <rect x="30" y="308" width="44" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="52" y="328" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="74" y="308" width="44" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="96" y="328" text-anchor="middle" font-size="12" fill="#333">-3</text>
    <rect x="118" y="308" width="60" height="32" fill="#fce4ec" stroke="#b85450"/>
    <text x="148" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">-1</text>
    <rect x="178" y="308" width="80" height="32" fill="#fce4ec" stroke="#b85450"/>
    <text x="218" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗ break</text>
    <rect x="258" y="308" width="60" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="288" y="328" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="328" y="328" font-size="11" fill="#666">sum 穿零，后续全负必更小，停</text>
  </g>

  <!-- 结果 -->
  <rect x="170" y="372" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">最大分数 = 6</text>

  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">正数区(3步)+零(1步)+负数区前段(2步) = 6 个正前缀和</text>
</svg>
