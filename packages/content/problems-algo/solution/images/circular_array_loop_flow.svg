<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrFlow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    Floyd 判圈法流程（O(n) 时间 / O(1) 空间）
  </text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="200" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="260" y="59" text-anchor="middle" font-size="11" fill="#333">遍历每个下标 i</text>
  </g>
  <line x1="260" y1="70" x2="260" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>

  <!-- Decision: nums[i] == 0? -->
  <g filter="url(#rough2)">
    <polygon points="260,90 340,120 260,150 180,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="118" text-anchor="middle" font-size="10" fill="#333">nums[i] == 0?</text>
    <text x="260" y="131" text-anchor="middle" font-size="9" fill="#888">(已访问)</text>
  </g>
  <text x="348" y="118" font-size="10" fill="#b85450" filter="url(#rough2)">是→跳过</text>
  <line x1="260" y1="150" x2="260" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>
  <text x="268" y="163" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Init slow/fast -->
  <g filter="url(#rough2)">
    <rect x="170" y="170" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="189" text-anchor="middle" font-size="10" fill="#333">slow=i, fast=next(i)</text>
  </g>
  <line x1="260" y1="200" x2="260" y2="218" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>

  <!-- Decision: same direction & not 0? -->
  <g filter="url(#rough2)">
    <polygon points="260,220 370,255 260,290 150,255" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="250" text-anchor="middle" font-size="10" fill="#333">nums[slow]·nums[fast]&gt;0</text>
    <text x="260" y="263" text-anchor="middle" font-size="10" fill="#333">&amp; nums[slow]·nums[next(fast)]&gt;0?</text>
  </g>
  <text x="378" y="255" font-size="10" fill="#b85450" filter="url(#rough2)">否→清理标记</text>
  <line x1="260" y1="290" x2="260" y2="308" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>
  <text x="268" y="303" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Decision: slow == fast? -->
  <g filter="url(#rough2)">
    <polygon points="260,310 340,335 260,360 180,335" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="333" text-anchor="middle" font-size="10" fill="#333">slow == fast?</text>
    <text x="260" y="345" text-anchor="middle" font-size="9" fill="#888">(追上)</text>
  </g>
  <text x="348" y="333" font-size="10" fill="#555" filter="url(#rough2)">否</text>
  <line x1="260" y1="360" x2="260" y2="375" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>

  <!-- slow = next(slow), fast = next(next(fast)) -->
  <g filter="url(#rough2)">
    <rect x="140" y="377" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="260" y="391" text-anchor="middle" font-size="9" fill="#333">slow走1步, fast走2步, 回到方向判定</text>
  </g>

  <!-- Return true path (from slow==fast, yes) -->
  <path d="M 180 335 L 60 335 L 60 250" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrFlow)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="20" y="220" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="60" y="235" text-anchor="middle" font-size="10" fill="#333">next≠自身?</text>
    <text x="60" y="245" text-anchor="middle" font-size="9" fill="#888">(长度&gt;1)</text>
  </g>
  <line x1="60" y1="220" x2="60" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arrFlow)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="20" y="175" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
    <text x="60" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a">return True</text>
  </g>
  <text x="100" y="330" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
</svg>
