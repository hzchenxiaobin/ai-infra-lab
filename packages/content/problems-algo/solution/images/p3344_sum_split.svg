<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：i 与 (j, k) 解耦 —— 三重和直接因子化</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">S(n) = Σ i·(j∨k) = (Σ i) × Σ(j∨k)：三重循环 O(n³) 塌缩成一次乘法</text>

  <!-- 左侧：n×n×n 立方体 -->
  <polygon points="55,120 85,96 175,96 145,120" fill="#f2f7fd" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <polygon points="145,120 175,96 175,186 145,210" fill="#d6e4f7" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="55" y="120" width="90" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="44" y="170" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="96" y="228" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="168" y="106" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="115" y="246" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">n × n × n 三维数组</text>
  <text x="115" y="264" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">A[i][j][k] = i · (j ∨ k)</text>

  <!-- 分流箭头 -->
  <path d="M 178 132 C 215 118, 240 110, 264 108" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 178 182 C 215 196, 240 202, 264 202" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 右上：只含 i 的因子 -->
  <rect x="270" y="80" width="235" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="102" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">只含 i：Σ i = 0+1+⋯+(n−1)</text>
  <text x="387" y="124" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">= n(n−1)/2</text>

  <!-- 乘号 -->
  <text x="387" y="160" text-anchor="middle" font-size="18" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- 右下：只含 (j,k) 的因子 -->
  <rect x="270" y="168" width="235" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="190" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">只含 (j, k)：T(n) = Σ (j ∨ k)</text>
  <text x="387" y="212" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">（对 0 ≤ j, k &lt; n 求和，按位贡献算）</text>

  <!-- 汇合箭头 -->
  <path d="M 387 228 L 387 260" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="90" y="264" width="360" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">S(n) = n(n−1)/2 × T(n) ≤ s</text>
  <text x="270" y="306" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">S(n) 随 n 单调不减 → 二分找最大可行 n</text>

  <!-- 底注 -->
  <rect x="20" y="332" width="480" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="352" font-size="10" fill="#333" filter="url(#rough2)">💡 两个因子的变量不相交：Σ i·(j∨k) = (Σ i)·Σ(j∨k)，与期望的独立性分解同理；</text>
  <text x="34" y="370" font-size="10" fill="#333" filter="url(#rough2)">求和成本从 O(n³) 的三重循环降到「等差数列和 × T(n)」，剩下的问题只是把 T(n) 算快。</text>
</svg>
