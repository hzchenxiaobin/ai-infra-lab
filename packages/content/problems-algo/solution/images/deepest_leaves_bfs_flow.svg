<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">BFS 算法流程：逐层求和，最后一层 sum 即答案</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">复用 102 层序遍历的 while + for(size) 骨架，多一个 sum 变量</text>

  <!-- ===== Start ===== -->
  <rect x="210" y="58" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <line x1="260" y1="88" x2="260" y2="104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="160" y="106" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333">queue = deque([root])</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#333">sum = 0</text>
  <line x1="260" y1="150" x2="260" y2="166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="260,168 320,205 260,242 200,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">queue</text>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">非空?</text>

  <!-- Yes branch (down) -->
  <text x="270" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="260" y1="242" x2="260" y2="278" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch (right) to return -->
  <text x="332" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <line x1="320" y1="205" x2="392" y2="205" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="430" y1="220" x2="430" y2="392" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== sum reset + size ===== -->
  <rect x="150" y="280" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#333">sum = 0   // 每层重置</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333">size = len(queue)</text>
  <line x1="260" y1="324" x2="260" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== for loop ===== -->
  <rect x="120" y="342" width="280" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i in range(size):</text>
  <text x="138" y="378" font-size="10" fill="#333">node = queue.popleft()</text>
  <text x="138" y="392" font-size="10" fill="#333">sum += node.val</text>
  <text x="138" y="406" font-size="10" fill="#333">push node.left / node.right</text>

  <!-- loop back arrow: from for-box right side up to diamond right-bottom -->
  <path d="M 400 360 L 470 360 L 470 235 L 320 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="300" font-size="9" fill="#888">回到判断</text>

  <!-- ===== Return ===== -->
  <rect x="380" y="392" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="415" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 sum</text>

  <!-- ===== side note ===== -->
  <rect x="20" y="280" width="118" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="28" y="298" font-size="9" fill="#d6a040" font-weight="bold">为何每层重置?</text>
  <text x="28" y="313" font-size="9" fill="#555">只有最后一层的</text>
  <text x="28" y="325" font-size="9" fill="#555">sum 需要保留，</text>
  <text x="28" y="337" font-size="9" fill="#555">前面层的 sum</text>
  <text x="28" y="349" font-size="9" fill="#555">会被覆盖丢弃。</text>
</svg>
