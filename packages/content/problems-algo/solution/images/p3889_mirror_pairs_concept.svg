    <text x="195" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="221" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="247" y="221" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">4</text>
    <text x="273" y="221" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">5</text>
