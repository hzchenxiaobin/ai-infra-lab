  </g>
  <text x="410" y="164" text-anchor="start" font-size="9" fill="#8a6d1a" filter="url(#rough2)">0↔9 …</text>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10 个数字 → 5 对：下标 i ↔ 9−i（即 '0'+'9'−c）</text>

  <!-- answer box -->
  <rect x="36" y="266" width="448" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="11.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">答案 = Σ |freq[L] − freq[R]|：L 只取 a..m 和 0..4，恰好 18 项，天然不重复</text>

  <!-- observations box -->
  <rect x="30" y="318" width="460" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">三条观察</text>
  <text x="42" y="356" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① 对合：(97+122)/2 = 109.5、(48+57)/2 = 52.5 都不是整数</text>
  <text x="42" y="370" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   ⟹ 没有字符是自己的镜像 ⟹ 36 字符恰好配成 18 对，不重不漏</text>
  <text x="42" y="386" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② 题目只统计"s 中出现过的字符"所在的对，但两端频次都为 0 的对</text>
  <text x="42" y="400" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   贡献 |0−0| = 0 ⟹ 直接把 18 对全加起来，连去重集合都省了！</text>
</svg>
