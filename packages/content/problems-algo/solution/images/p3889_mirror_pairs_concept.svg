    <path d="M 140 92 Q 260 47 380 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 156 92 Q 260 52 364 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 172 92 Q 260 57 348 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 188 92 Q 260 62 332 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 204 92 Q 260 67 316 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 220 92 Q 260 72 300 92" stroke="#446688" stroke-width="1.4" fill="none" opacity="0.85"/>
