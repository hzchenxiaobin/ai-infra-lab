  </g>
  <text x="60" y="46" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">a↔z</text>
  <text x="262" y="84" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">m↔n（最中间的一对）</text>
  <text x="120" y="148" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">26 个小写字母 → 13 对：下标 i ↔ 25−i（即 'a'+'z'−c）</text>

  <!-- digits strip: 10 cells, w=26, centered x=130..390 -->
  <g filter="url(#rough2)">
    <rect x="130" y="200" width="26" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="156" y="200" width="26" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
