    <path d="M 143 196 Q 260 158 377 196" stroke="#d6a040" stroke-width="1.5" fill="none" opacity="0.9"/>
    <path d="M 169 196 Q 260 168 351 196" stroke="#d6a040" stroke-width="1.5" fill="none" opacity="0.9"/>
    <path d="M 195 196 Q 260 178 325 196" stroke="#d6a040" stroke-width="1.5" fill="none" opacity="0.9"/>
    <path d="M 221 196 Q 260 188 299 196" stroke="#d6a040" stroke-width="1.5" fill="none" opacity="0.9"/>
