<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算（n=4, k=2）：DFS 逐步追踪</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">选→递归→撤销；size==k 收集；最后一步展示剪枝</text>

  <g filter="url(#rough2)" font-size="10">
    <!-- Header row -->
    <rect x="24" y="58" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="50" y="76" text-anchor="middle" fill="#446688" font-weight="bold">步骤</text>
    <text x="110" y="76" text-anchor="middle" fill="#446688" font-weight="bold">start</text>
    <text x="210" y="76" text-anchor="middle" fill="#446688" font-weight="bold">path</text>
    <text x="360" y="76" text-anchor="middle" fill="#446688" font-weight="bold">动作</text>
    <text x="492" y="76" text-anchor="middle" fill="#446688" font-weight="bold">收集?</text>

    <!-- Column dividers (subtle) -->
    <line x1="80" y1="58" x2="80" y2="392" stroke="#ddd" stroke-width="0.8"/>
    <line x1="140" y1="58" x2="140" y2="392" stroke="#ddd" stroke-width="0.8"/>
    <line x1="280" y1="58" x2="280" y2="392" stroke="#ddd" stroke-width="0.8"/>
    <line x1="440" y1="58" x2="440" y2="392" stroke="#ddd" stroke-width="0.8"/>

    <!-- Row 1: enter root -->
    <rect x="24" y="86" width="512" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="104" text-anchor="middle" fill="#555">1</text>
    <text x="110" y="104" text-anchor="middle" fill="#555">1</text>
    <text x="210" y="104" text-anchor="middle" fill="#555" font-weight="bold">[]</text>
    <text x="360" y="104" text-anchor="middle" fill="#555">入 root，循环 i=1..4</text>
    <text x="492" y="104" text-anchor="middle" fill="#888">—</text>

    <!-- Row 2: pick 1 -->
    <rect x="24" y="114" width="512" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="132" text-anchor="middle" fill="#555">2</text>
    <text x="110" y="132" text-anchor="middle" fill="#555">2</text>
    <text x="210" y="132" text-anchor="middle" fill="#555" font-weight="bold">[1]</text>
    <text x="360" y="132" text-anchor="middle" fill="#4a7a3a">选 1，循环 i=2..4</text>
    <text x="492" y="132" text-anchor="middle" fill="#888">—</text>

    <!-- Row 3: pick 2, collect [1,2] -->
    <rect x="24" y="142" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="160" text-anchor="middle" fill="#555">3</text>
    <text x="110" y="160" text-anchor="middle" fill="#555">3</text>
    <text x="210" y="160" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,2]</text>
    <text x="360" y="160" text-anchor="middle" fill="#555">选 2，size==2</text>
    <text x="492" y="160" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,2] ✓</text>

    <!-- Row 4: undo 2, pick 3, collect [1,3] -->
    <rect x="24" y="170" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="188" text-anchor="middle" fill="#555">4</text>
    <text x="110" y="188" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,3]</text>
    <text x="360" y="188" text-anchor="middle" fill="#555">撤 2，选 3，size==2</text>
    <text x="492" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,3] ✓</text>

    <!-- Row 5: undo 3, pick 4, collect [1,4] -->
    <rect x="24" y="198" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="216" text-anchor="middle" fill="#555">5</text>
    <text x="110" y="216" text-anchor="middle" fill="#555">5</text>
    <text x="210" y="216" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,4]</text>
    <text x="360" y="216" text-anchor="middle" fill="#555">撤 3，选 4，size==2</text>
    <text x="492" y="216" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,4] ✓</text>

    <!-- Row 6: undo 4, undo 1, pick 2 -->
    <rect x="24" y="226" width="512" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="244" text-anchor="middle" fill="#555">6</text>
    <text x="110" y="244" text-anchor="middle" fill="#555">3</text>
    <text x="210" y="244" text-anchor="middle" fill="#555" font-weight="bold">[2]</text>
    <text x="360" y="244" text-anchor="middle" fill="#4a7a3a">撤 4→撤 1，选 2</text>
    <text x="492" y="244" text-anchor="middle" fill="#888">—</text>

    <!-- Row 7: pick 3, collect [2,3] -->
    <rect x="24" y="254" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="272" text-anchor="middle" fill="#555">7</text>
    <text x="110" y="272" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,3]</text>
    <text x="360" y="272" text-anchor="middle" fill="#555">选 3，size==2</text>
    <text x="492" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,3] ✓</text>

    <!-- Row 8: undo 3, pick 4, collect [2,4] -->
    <rect x="24" y="282" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="300" text-anchor="middle" fill="#555">8</text>
    <text x="110" y="300" text-anchor="middle" fill="#555">5</text>
    <text x="210" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,4]</text>
    <text x="360" y="300" text-anchor="middle" fill="#555">撤 3，选 4，size==2</text>
    <text x="492" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,4] ✓</text>

    <!-- Row 9: undo 4, undo 2, pick 3 -->
    <rect x="24" y="310" width="512" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="328" text-anchor="middle" fill="#555">9</text>
    <text x="110" y="328" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="328" text-anchor="middle" fill="#555" font-weight="bold">[3]</text>
    <text x="360" y="328" text-anchor="middle" fill="#4a7a3a">撤 4→撤 2，选 3</text>
    <text x="492" y="328" text-anchor="middle" fill="#888">—</text>

    <!-- Row 10: pick 4, collect [3,4] -->
    <rect x="24" y="338" width="512" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="356" text-anchor="middle" fill="#555">10</text>
    <text x="110" y="356" text-anchor="middle" fill="#555">5</text>
    <text x="210" y="356" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[3,4]</text>
    <text x="360" y="356" text-anchor="middle" fill="#555">选 4，size==2</text>
    <text x="492" y="356" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[3,4] ✓</text>

    <!-- Row 11: undo 4, undo 3, pick 4, PRUNE -->
    <rect x="24" y="366" width="512" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="3"/>
    <text x="50" y="384" text-anchor="middle" fill="#555">11</text>
    <text x="110" y="384" text-anchor="middle" fill="#555">5</text>
    <text x="210" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">[4] ✂</text>
    <text x="360" y="384" text-anchor="middle" fill="#b85450">撤 4→撤 3，选 4，剩余 0 &lt; 还需 1</text>
    <text x="492" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">跳过</text>
  </g>

  <!-- ===== Summary box ===== -->
  <rect x="24" y="404" width="512" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收集 6 个组合：[1,2] [1,3] [1,4] [2,3] [2,4] [3,4] = C(4,2)</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#555">步骤 11 展示剪枝：选 4 为第 1 个数时，后面已无数可选，凑不够 k=2</text>
</svg>
