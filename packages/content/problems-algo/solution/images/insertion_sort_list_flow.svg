<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">对链表插入排序：算法流程</text>
  <path d="M 160 38 Q 280 46 400 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="64" rx="48" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">开始</text>
  <path d="M 280 80 L 280 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 dummy -->
  <g filter="url(#sk)">
    <rect x="200" y="96" width="160" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#2b2b2b">dummy.next = null</text>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#2b2b2b">cur = head</text>
  <path d="M 280 136 L 280 154" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 cur == null -->
  <g filter="url(#sk)">
    <path d="M 280 170 L 360 200 L 280 230 L 200 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">cur == null?</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">（遍历完原链表）</text>

  <!-- 是 -> 结束 -->
  <path d="M 360 200 L 420 200 L 420 64 L 332 64" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="376" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 否 -> 继续 -->
  <path d="M 200 200 L 150 200 L 150 250" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="194" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 保存 next -->
  <g filter="url(#sk)">
    <rect x="80" y="250" width="140" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#2b2b2b">next = cur.next</text>
  <text x="150" y="281" text-anchor="middle" font-size="10" fill="#888">（暂存，插入会改 cur.next）</text>
  <path d="M 150 286 L 150 302" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- prev = dummy -->
  <g filter="url(#sk)">
    <rect x="80" y="302" width="140" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="150" y="322" text-anchor="middle" font-size="11" fill="#2b2b2b">prev = dummy</text>
  <path d="M 150 334 L 150 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 内层 while 判断 -->
  <g filter="url(#sk)">
    <path d="M 150 368 L 250 400 L 150 432 L 50 400 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="150" y="397" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold">prev.next != null</text>
  <text x="150" y="412" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold">&amp;&amp; prev.next.val</text>
  <text x="150" y="425" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold">&lt; cur.val ?</text>

  <!-- 是 -> prev 前进 -->
  <path d="M 250 400 L 320 400" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="272" y="394" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="320" y="384" width="140" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="390" y="404" text-anchor="middle" font-size="11" fill="#2b2b2b">prev = prev.next</text>
  <!-- 回到判断 -->
  <path d="M 390 384 L 390 360 L 150 360 L 150 368" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否 -> 插入 -->
  <path d="M 150 432 L 150 458" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="158" y="450" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 插入操作 -->
  <g filter="url(#sk)">
    <rect x="60" y="458" width="180" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="150" y="478" text-anchor="middle" font-size="11" fill="#2b2b2b">cur.next = prev.next</text>
  <text x="150" y="494" text-anchor="middle" font-size="11" fill="#2b2b2b">prev.next = cur</text>
  <path d="M 150 508 L 150 524" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- cur = next -->
  <g filter="url(#sk)">
    <rect x="80" y="524" width="140" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="150" y="544" text-anchor="middle" font-size="11" fill="#2b2b2b">cur = next</text>
  <!-- 回到外层判断 -->
  <path d="M 150 556 L 150 580 L 460 580 L 460 200 L 360 200" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束返回 -->
  <g filter="url(#sk)">
    <ellipse cx="420" cy="64" rx="0" ry="0" fill="none"/>
  </g>
  <text x="448" y="60" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="448" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">dummy.next</text>

  <!-- 右侧说明 -->
  <g filter="url(#sk)">
    <rect x="330" y="250" width="210" height="120" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="435" y="274" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">两处关键</text>
  <text x="346" y="296" font-size="10.5" fill="#b85450" font-weight="bold">① 先存 next</text>
  <text x="346" y="310" font-size="10.5" fill="#444">　插入会改 cur.next，</text>
  <text x="346" y="322" font-size="10.5" fill="#444">　不存则丢失后续节点</text>
  <text x="346" y="344" font-size="10.5" fill="#4a7a3a" font-weight="bold">② 找「首个 ≥ cur」的位置</text>
  <text x="346" y="358" font-size="10.5" fill="#444">　保证稳定性：相等不换序</text>
</svg>
