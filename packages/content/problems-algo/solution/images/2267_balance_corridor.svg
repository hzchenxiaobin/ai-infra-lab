<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">合法路径的「平衡走廊」：0 ≤ balance ≤ 剩余步数，终点归零</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">balance = 已读 '(' 数 − 已读 ')' 数；曲线必须落在阴影三角内并回到 0</text>

  <!-- corridor (triangle between y=0 and y=6-step) -->
  <polygon points="80,300 80,90 500,300" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>

  <!-- upper bound line: balance = 6 - step -->
  <line x1="80" y1="90" x2="500" y2="300" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="250" y="178" font-size="11" fill="#d6a040" font-weight="bold" transform="rotate(19 250 178)">上界 balance ≤ 剩余步数</text>

  <!-- lower bound line: y=0 -->
  <line x1="80" y1="300" x2="520" y2="300" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="360" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">下界 balance ≥ 0（前缀 ')' 不过多）</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="80" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="80" y1="300" x2="525" y2="300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="535" y="305" font-size="11" fill="#666" font-weight="bold">步数</text>
  <text x="80" y="62" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">balance</text>

  <!-- tick labels on x (0..6) -->
  <g font-size="10" fill="#888">
    <text x="80"  y="318" text-anchor="middle">0</text>
    <text x="150" y="318" text-anchor="middle">1</text>
    <text x="220" y="318" text-anchor="middle">2</text>
    <text x="290" y="318" text-anchor="middle">3</text>
    <text x="360" y="318" text-anchor="middle">4</text>
    <text x="430" y="318" text-anchor="middle">5</text>
    <text x="500" y="318" text-anchor="middle">6</text>
  </g>
  <!-- tick labels on y (0..6) -->
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="74" y="304">0</text>
    <text x="74" y="269">1</text>
    <text x="74" y="234">2</text>
    <text x="74" y="199">3</text>
    <text x="74" y="164">4</text>
    <text x="74" y="129">5</text>
    <text x="74" y="94">6</text>
  </g>

  <!-- sample valid curve ((())) : (0,0)(1,1)(2,2)(3,3)(4,2)(5,1)(6,0) -->
  <polyline points="80,300 150,265 220,230 290,195 360,230 430,265 500,300"
            fill="none" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>

  <!-- sample curve points -->
  <g fill="#b85450" filter="url(#rough2)">
    <circle cx="80"  cy="300" r="3.5"/>
    <circle cx="150" cy="265" r="4.5"/>
    <circle cx="220" cy="230" r="4.5"/>
    <circle cx="290" cy="195" r="5"/>
    <circle cx="360" cy="230" r="4.5"/>
    <circle cx="430" cy="265" r="4.5"/>
    <circle cx="500" cy="300" r="4.5"/>
  </g>

  <!-- start / peak / end annotations -->
  <text x="150" y="258" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">起：首格必 '('</text>
  <line x1="150" y1="262" x2="150" y2="265" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="298" y="186" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">峰值 = 路径长一半</text>
  <text x="500" y="290" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">终：归零</text>

  <!-- an illegal curve that dips below 0 -->
  <polyline points="220,300 250,335 290,300" fill="none" stroke="#999" stroke-width="1.6"
            stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="300" y="346" font-size="9.5" fill="#999">越界（balance&lt;0）→ 该支剪枝</text>

  <!-- bottom note -->
  <rect x="40" y="362" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">剩余步数 = (m+n−1) − 当前已走步数；上界即“即使后面全是 ')' 也降不到 0”的剪枝依据</text>
</svg>
