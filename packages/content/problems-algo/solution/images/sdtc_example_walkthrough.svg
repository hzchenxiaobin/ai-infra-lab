<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：双向扫描后的最终 dist 表</text>

  <!-- table header -->
  <rect x="80" y="50" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="70" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">index</text>
  <text x="205" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dist[color=1]</text>
  <text x="315" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dist[color=2]</text>
  <text x="425" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dist[color=3]</text>

  <!-- row 0 -->
  <rect x="80" y="80" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="97" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="205" y="97" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="315" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="425" y="97" text-anchor="middle" font-size="10" fill="#d6a040">4</text>

  <!-- row 1: query [1,3] → highlight color3 cell -->
  <rect x="80" y="104" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="370" y="104" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="121" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="205" y="121" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <text x="315" y="121" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="425" y="121" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- row 2: query [2,2] → highlight color2 cell -->
  <rect x="80" y="128" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="128" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="145" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="205" y="145" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="315" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="425" y="145" text-anchor="middle" font-size="10" fill="#d6a040">2</text>

  <!-- row 3 -->
  <rect x="80" y="152" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="169" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="205" y="169" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <text x="315" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="425" y="169" text-anchor="middle" font-size="10" fill="#d6a040">1</text>

  <!-- row 4 -->
  <rect x="80" y="176" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="193" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="205" y="193" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="315" y="193" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="425" y="193" text-anchor="middle" font-size="10" fill="#d6a040">0</text>

  <!-- row 5 -->
  <rect x="80" y="200" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="217" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="205" y="217" text-anchor="middle" font-size="10" fill="#446688">2</text>
  <text x="315" y="217" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="425" y="217" text-anchor="middle" font-size="10" fill="#d6a040">1</text>

  <!-- row 6: query [6,1] → highlight color1 cell -->
  <rect x="80" y="224" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="224" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="241" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="205" y="241" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="315" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="425" y="241" text-anchor="middle" font-size="10" fill="#d6a040">1</text>

  <!-- row 7 -->
  <rect x="80" y="248" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="265" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="205" y="265" text-anchor="middle" font-size="10" fill="#446688">4</text>
  <text x="315" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="425" y="265" text-anchor="middle" font-size="10" fill="#d6a040">0</text>

  <!-- row 8 -->
  <rect x="80" y="272" width="400" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="289" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="205" y="289" text-anchor="middle" font-size="10" fill="#446688">5</text>
  <text x="315" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="425" y="289" text-anchor="middle" font-size="10" fill="#d6a040">0</text>

  <!-- query results -->
  <rect x="80" y="312" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">answer = [3, 0, 3]</text>

  <!-- key insight boxes -->
  <rect x="40" y="358" width="230" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="378" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">观察：每个 0 = 自身即该颜色</text>
  <text x="52" y="396" font-size="9.5" fill="#444">dist[i][colors[i]] = 0（对角线为 0）</text>
  <text x="52" y="412" font-size="9.5" fill="#444">如 index 2 颜色 2 → dist=0</text>

  <rect x="290" y="358" width="230" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="378" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">观察：取左右最近的最小值</text>
  <text x="302" y="396" font-size="9.5" fill="#444">index 6 查颜色 1：</text>
  <text x="302" y="412" font-size="9.5" fill="#444">左最近 index 3 (dist 3) &gt; 右无 → 3</text>
</svg>
