<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三指针算法流程</text>

  <!-- Start -->
  <rect x="210" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：i = j = k = 0</text>
  <path d="M 280 80 L 280 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,100 400,150 280,200 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">i &lt; n₁ 且</text>
  <text x="280" y="162" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">j &lt; n₂ 且 k &lt; n₃ ?</text>
  <text x="408" y="154" font-size="11" fill="#888">否</text>
  <text x="148" y="154" font-size="11" fill="#888" text-anchor="end">是</text>

  <!-- No branch -> end -->
  <path d="M 400 150 L 470 150 L 470 430" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="410" y="416" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="470" y="438" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 result</text>

  <!-- Yes branch down -->
  <path d="M 280 200 L 280 220" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- read values -->
  <rect x="200" y="222" width="160" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#555">a=arr1[i]，b=arr2[j]，c=arr3[k]</text>
  <path d="M 280 256 L 280 274" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="280,276 380,316 280,356 180,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">a == b == c ?</text>
  <text x="388" y="318" font-size="11" fill="#888">否</text>
  <text x="172" y="318" font-size="11" fill="#888" text-anchor="end">是</text>

  <!-- Yes: append -->
  <path d="M 180 316 L 90 316 L 90 360" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="20" y="362" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="384" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">result.append(a)</text>
  <text x="90" y="402" text-anchor="middle" font-size="11" fill="#555">i++、j++、k++</text>
  <path d="M 90 412 L 90 430 L 160 430 L 160 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- No: advance min -->
  <path d="M 380 316 L 470 316 L 470 360" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="380" y="362" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="384" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">m = min(a,b,c)</text>
  <text x="470" y="402" text-anchor="middle" font-size="11" fill="#555">若 a==m 则 i++，若 b==m 则 j++，若 c==m 则 k++</text>

  <!-- loop back from No branch -->
  <path d="M 470 362 L 470 150 L 400 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="430" y="142" font-size="9.5" fill="#aaa">回循环</text>
</svg>
