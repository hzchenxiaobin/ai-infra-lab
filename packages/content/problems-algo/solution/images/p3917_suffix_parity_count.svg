<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：右手边两个奇偶计数器，倒序一趟递推</text>

  <!-- nums 行 -->
  <text x="58" y="67" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="90" y="48" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="67" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="48" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="168" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="202" y="48" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="67" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="258" y="48" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="168" y="42" text-anchor="middle" font-size="9" fill="#a0433f" font-weight="bold" filter="url(#rough2)">▶ 当前 i = 1（偶）</text>
  <text x="112" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="168" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="224" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="280" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="112" y="102" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="168" y="102" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="224" y="102" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="280" y="102" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶</text>

  <!-- 扫描方向 -->
  <path d="M 298 118 L 95 118" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="134" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">倒序扫描（i：n−1 → 0）</text>

  <!-- ans 行 -->
  <text x="58" y="159" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">ans</text>
  <rect x="90" y="140" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="159" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="146" y="140" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="159" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="202" y="140" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="159" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <rect x="258" y="140" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>

  <!-- 计数器演化条 -->
  <text x="160" y="186" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">计数器演化（cntOdd, cntEven）</text>
  <rect x="16" y="192" width="60" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="204" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=3 后</text>
  <text x="46" y="216" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">(0, 1)</text>
  <rect x="92" y="192" width="60" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="204" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=2 后</text>
  <text x="122" y="216" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">(1, 1)</text>
  <rect x="168" y="192" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="198" y="204" text-anchor="middle" font-size="8.5" fill="#a0433f" filter="url(#rough2)">i=1 后</text>
  <text x="198" y="216" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">(1, 2)</text>
  <rect x="244" y="192" width="60" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="204" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=0 后</text>
  <text x="274" y="216" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">(2, 2)</text>
  <path d="M 76 207 L 86 207" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 152 207 L 162 207" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 228 207 L 238 207" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 左下说明框 -->
  <rect x="14" y="234" width="296" height="70" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="252" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">为什么一趟就是 O(n)？</text>
  <text x="162" y="268" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">指针左移一格，右侧集合恰好只多一个元素</text>
  <text x="162" y="282" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">两个计数器各做一次 +1，状态 O(1) 转移</text>
  <text x="162" y="296" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">暴力对每个 i 重扫右侧 —— 同一份信息被数 n 遍</text>

  <text x="162" y="320" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">示例：nums = [1,2,3,4] → ans = [2,1,1,0]</text>
  <text x="162" y="336" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">倒序「先查后插」：ans 用右侧计数作答，再把 nums[i] 计入本方</text>

  <!-- 右侧便签 1：两个计数器 -->
  <rect x="322" y="44" width="184" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="62" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">两个后缀计数器</text>
  <text x="414" y="78" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">cntOdd = 右侧奇数个数</text>
  <text x="414" y="92" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">cntEven = 右侧偶数个数</text>
  <text x="414" y="106" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">「倒序已扫过」= 严格右侧</text>

  <!-- 右侧便签 2：查询规则 -->
  <rect x="322" y="130" width="184" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="148" text-anchor="middle" font-size="10" fill="#2f5c24" font-weight="bold" filter="url(#rough2)">查询规则：选对面计数器</text>
  <text x="414" y="164" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">nums[i] 为偶 → ans[i] = cntOdd</text>
  <text x="414" y="178" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">nums[i] 为奇 → ans[i] = cntEven</text>
  <text x="414" y="196" text-anchor="middle" font-size="9.3" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">例：i=1（2 偶）→ cntOdd = 1</text>

  <!-- 右侧便签 3：先查后插 -->
  <rect x="322" y="220" width="184" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="238" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">每步 O(1)：先查后插</text>
  <text x="414" y="254" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">查：ans[i] ← 对面计数器</text>
  <text x="414" y="268" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">插：本方计数器 + 1</text>

  <!-- 右侧便签 4：升级预告 -->
  <rect x="322" y="296" width="184" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="312" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">升级预告 → 3907</text>
  <text x="414" y="328" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">加 nums[j] &lt; nums[i] 值域约束</text>
  <text x="414" y="342" text-anchor="middle" font-size="9.3" fill="#a0433f" filter="url(#rough2)">计数器 → 树状数组（值域前缀）</text>
</svg>
