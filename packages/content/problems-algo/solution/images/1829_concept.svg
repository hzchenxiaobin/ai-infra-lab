<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：k = cur 按位取反，cur ⊕ k 恒为 mask</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">示例 2 查询 0：cur = 2, maximumBit = 3, mask = 7</text>

  <!-- ===== Row 1: cur ===== -->
  <text x="50" y="100" font-size="12" fill="#446688" font-weight="bold">cur = 2</text>
  <rect x="160" y="78" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="216" y="78" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="106" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="272" y="78" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="335" y="106" font-size="11" fill="#888">前缀异或</text>

  <!-- operator ⊕ between row1 and row2 -->
  <text x="186" y="140" font-size="18" fill="#888" font-weight="bold">⊕</text>

  <!-- ===== Row 2: mask ===== -->
  <text x="50" y="168" font-size="12" fill="#d6a040" font-weight="bold">mask = 7</text>
  <rect x="160" y="146" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="174" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <rect x="216" y="146" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="174" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <rect x="272" y="146" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="174" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="335" y="174" font-size="11" fill="#888">2^maximumBit − 1</text>

  <!-- operator = between row2 and row3 -->
  <text x="186" y="208" font-size="18" fill="#888" font-weight="bold">=</text>

  <!-- ===== Row 3: k (answer) ===== -->
  <text x="50" y="236" font-size="12" fill="#4a7a3a" font-weight="bold">k = 5</text>
  <rect x="160" y="214" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="242" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="216" y="214" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="242" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="272" y="214" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="242" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="335" y="242" font-size="11" fill="#4a7a3a">← 答案（逐位取反）</text>

  <!-- flip indicators: dashed lines from cur bits to k bits -->
  <path d="M 186 122 C 150 165, 150 170, 186 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 242 122 C 280 165, 280 170, 242 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 298 122 C 340 165, 340 170, 298 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <text x="118" y="172" font-size="10" fill="#b85450">取反</text>

  <!-- arrow down to verification -->
  <path d="M 242 266 L 242 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="280" font-size="10" fill="#888">验证</text>

  <!-- ===== Row 4: cur ⊕ k = mask (result, highlighted) ===== -->
  <text x="50" y="324" font-size="12" fill="#4a7a3a" font-weight="bold">cur ⊕ k</text>
  <rect x="160" y="302" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="330" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="216" y="302" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="330" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="272" y="302" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="330" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="335" y="330" font-size="11" fill="#4a7a3a" font-weight="bold">= 7 = mask ✓</text>

  <!-- ===== Side explanation box ===== -->
  <rect x="400" y="78" width="200" height="268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="104" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">为什么最大值恒为 mask？</text>
  <text x="500" y="128" text-anchor="middle" font-size="11" fill="#666">nums[i] &lt; 2^maximumBit</text>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#666">⇒ cur 只占低 maximumBit 位</text>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#666">k 只能改低 maximumBit 位</text>
  <text x="500" y="188" text-anchor="middle" font-size="11" fill="#666">→ 让低位全置 1 即最大</text>
  <text x="500" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k = cur ⊕ mask</text>
  <text x="500" y="232" text-anchor="middle" font-size="10" fill="#888">（逐位取反）</text>
  <text x="500" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cur ⊕ k = mask</text>
  <text x="500" y="276" text-anchor="middle" font-size="10" fill="#888">（与 cur 无关）</text>
  <text x="500" y="302" text-anchor="middle" font-size="11" fill="#666">最大异或值 = mask</text>
  <text x="500" y="320" text-anchor="middle" font-size="11" fill="#666">= 2^maximumBit − 1</text>
  <text x="500" y="338" text-anchor="middle" font-size="10" fill="#888">每查询 O(1) 直接算出</text>
</svg>
