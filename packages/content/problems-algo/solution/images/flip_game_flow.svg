<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：线性扫描 + 逐位置判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">i 从 0 走到 n−2，每处查 s[i],s[i+1] 是否同为 +，命中即翻一次入结果</text>

  <!-- ===== Start ===== -->
  <rect x="200" y="60" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：res = [ ]</text>

  <path d="M 280 96 L 280 110" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop init ===== -->
  <rect x="200" y="112" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i = 0</text>

  <path d="M 280 148 L 280 162" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond: i < n-1 ? ===== -->
  <polygon points="280,164 360,206 280,248 200,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n − 1 ?</text>
  <text x="280" y="216" text-anchor="middle" font-size="9" fill="#888">（还有相邻对可查）</text>

  <!-- No -> end -->
  <path d="M 360 206 L 470 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="188" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="508" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <!-- Yes -> down -->
  <path d="M 280 248 L 280 262" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="258" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Decision: s[i]=='+' and s[i+1]=='+' ? ===== -->
  <polygon points="280,264 380,300 280,336 180,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s[i]==&apos;+&apos;</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">且 s[i+1]==&apos;+&apos; ?</text>

  <!-- Yes -> right: flip and append -->
  <path d="M 380 300 L 430 300" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="280" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="298" text-anchor="middle" font-size="10" fill="#333">翻 s[i..i+1] 为 &quot;--&quot;</text>
  <text x="490" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">res.append(新串)</text>

  <!-- No -> left: skip -->
  <path d="M 180 300 L 130 300" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="294" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="40" y="280" width="90" height="42" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="305" text-anchor="middle" font-size="10" fill="#888">此处不可翻</text>

  <!-- both merge to i++ -->
  <path d="M 85 322 L 85 352 L 490 352 L 490 322" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 280 352 L 280 348" stroke="none"/>

  <rect x="220" y="346" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i = i + 1（回到判定）</text>

  <!-- loop back arrow to top diamond -->
  <path d="M 220 360 L 60 360 L 60 206 L 200 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="9" fill="#888" transform="rotate(-90 50 300)">循环回到 i&lt;n−1 判定</text>
</svg>
