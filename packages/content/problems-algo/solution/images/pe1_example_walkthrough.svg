<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：JOIN 宽表 → 按 project_id 分组求平均
  </text>

  <!-- ===== Joined wide table ===== -->
  <!-- header -->
  <rect x="50" y="44" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="85" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">project_id</text>
  <text x="155" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">employee_id</text>
  <text x="245" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">name</text>
  <text x="335" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">exp_years</text>
  <text x="455" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">分组</text>
  <!-- column dividers in header -->
  <line x1="120" y1="44" x2="120" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="44" x2="190" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="44" x2="300" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="44" x2="370" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- body -->
  <rect x="50" y="70" width="460" height="130" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <line x1="120" y1="70" x2="120" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="190" y1="70" x2="190" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="70" x2="300" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="70" x2="370" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="96" x2="510" y2="96" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="122" x2="510" y2="122" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="148" x2="510" y2="148" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="174" x2="510" y2="174" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bucket highlight bands -->
  <rect x="50" y="70" width="460" height="78" fill="#e8f0fe" opacity="0.35" filter="url(#rough2)"/>
  <rect x="50" y="148" width="460" height="52" fill="#fff8e1" opacity="0.5" filter="url(#rough2)"/>
  <!-- re-draw gridlines on top of bands -->
  <line x1="120" y1="70" x2="120" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="190" y1="70" x2="190" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="70" x2="300" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="70" x2="370" y2="200" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="96" x2="510" y2="96" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="122" x2="510" y2="122" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="148" x2="510" y2="148" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="50" y1="174" x2="510" y2="174" stroke="#ccd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows: project 1 -->
  <text x="85" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="245" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Khaled</text>
  <text x="335" y="89" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="455" y="89" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">桶 1</text>

  <text x="85" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="245" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ali</text>
  <text x="335" y="115" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="455" y="115" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">桶 1</text>

  <text x="85" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="245" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">John</text>
  <text x="335" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="455" y="141" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">桶 1</text>

  <!-- rows: project 2 -->
  <text x="85" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="245" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Khaled</text>
  <text x="335" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="455" y="167" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">桶 2</text>

  <text x="85" y="193" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="245" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Doe</text>
  <text x="335" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="455" y="193" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">桶 2</text>

  <!-- ===== Calculation ===== -->
  <rect x="50" y="218" width="220" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 1 (project_id = 1)</text>
  <text x="64" y="262" font-size="11" fill="#333" filter="url(#rough2)">(3 + 2 + 1) / 3</text>
  <text x="64" y="284" font-size="11" fill="#333" filter="url(#rough2)">= 6 / 3 = 2.00</text>

  <rect x="290" y="218" width="220" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">桶 2 (project_id = 2)</text>
  <text x="304" y="262" font-size="11" fill="#333" filter="url(#rough2)">(3 + 2) / 2</text>
  <text x="304" y="284" font-size="11" fill="#333" filter="url(#rough2)">= 5 / 2 = 2.50</text>

  <!-- output -->
  <rect x="50" y="312" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    输出: (1, 2.00) , (2, 2.50)
  </text>
</svg>
