<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：右端定上限 v，自右向左逐位判定切分，累加 ops</text>

  <!-- Start -->
  <rect x="180" y="34" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v = nums[n−1]；ans = 0；i = n−2</text>
  <path d="M 280 80 L 280 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: i < 0 ? -->
  <path d="M 280 106 L 372 140 L 280 174 L 188 140 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i &lt; 0 ?</text>

  <!-- Yes -> return ans -->
  <path d="M 372 140 L 440 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="406" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="122" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="492" y="145" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- No -> diamond 2 -->
  <path d="M 280 174 L 280 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="194" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Diamond 2: nums[i] > v ? -->
  <path d="M 280 208 L 380 244 L 280 280 L 180 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] &gt; v ?</text>

  <!-- Yes (right): split -->
  <path d="M 380 244 L 432 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="406" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="432" y="212" width="116" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k = ⌈nums[i]/v⌉</text>
  <text x="490" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += k − 1</text>
  <text x="490" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v = ⌊nums[i]/k⌋</text>

  <!-- No (left): no split -->
  <path d="M 180 244 L 128 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="154" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="40" y="226" width="88" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="84" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">v = nums[i]</text>

  <!-- merge into i = i - 1 -->
  <path d="M 84 262 L 84 296 L 260 296 L 260 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 490 276 L 490 296 L 300 296 L 300 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="240" y="314" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i = i − 1</text>

  <!-- loop back to diamond 1 -->
  <path d="M 240 330 L 24 330 L 24 140 L 188 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="132" y="324" text-anchor="middle" font-size="10.5" fill="#888">循环回顶部判断</text>
</svg>
