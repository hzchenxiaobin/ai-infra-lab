<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：定长滑窗 + 三份增量状态</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums = [2,6,7,3,1,7]，k = 4，m = 3，当前窗口 [2,6,7,3]</text>

  <!-- window label above cells -->
  <text x="244" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">长度恒为 k = 4 的窗口</text>

  <!-- array cells -->
  <rect x="140" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="244" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="296" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="348" y="72" width="52" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="97" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="400" y="72" width="52" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="97" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7</text>

  <!-- window dashed rect over cells 0..3 -->
  <rect x="134" y="66" width="220" height="52" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>

  <!-- index labels -->
  <text x="166" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="218" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="322" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="374" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="426" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- out arrow (leftmost cell leaves) -->
  <path d="M 166 138 Q 148 158 124 156" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="112" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">出 2</text>

  <!-- in arrow (new element enters cell 4) -->
  <path d="M 480 158 Q 436 158 380 142" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="494" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">进 1</text>

  <!-- three state boxes -->
  <rect x="40" y="190" width="180" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">freq 频率表</text>
  <text x="130" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2:1, 6:1, 7:1, 3:1}</text>

  <rect x="240" y="190" width="140" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">distinct 种类数</text>
  <text x="310" y="240" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="400" y="190" width="180" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">sum 窗口和</text>
  <text x="490" y="240" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- update rule box -->
  <rect x="70" y="272" width="480" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一出一进，三份状态 O(1) 增量更新：</text>
  <text x="310" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">freq 一加一减；首现 distinct++，清零 distinct−−；sum ± 元素值</text>

  <!-- conclusion box -->
  <rect x="70" y="340" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口成型即判定：distinct ≥ m 则 ans = max(ans, sum)</text>
  <text x="310" y="378" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">窗口平移 n − k 次，i 单向前进，无回溯</text>
</svg>
