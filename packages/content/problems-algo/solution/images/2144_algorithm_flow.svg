<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">购买糖果最低成本 — 算法流程</text>

  <rect x="190" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 260 80 L 260 100" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="104" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#333">将 costs 按降序排序</text>

  <path d="M 260 144 L 260 164" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="168" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="12" fill="#333">初始化 total = 0, i = 0</text>

  <path d="M 260 208 L 260 228" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,232 360,278 260,324 160,278" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#444">i &lt; n ?</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#444">且 (i+1)%3≠0</text>

  <path d="M 360 278 L 410 278" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="270" font-size="10" fill="#4a7a3a">是</text>

  <rect x="410" y="262" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="278" text-anchor="middle" font-size="11" fill="#333">total +=</text>
  <text x="455" y="291" text-anchor="middle" font-size="11" fill="#333">costs[i]</text>

  <path d="M 455 262 L 455 200 L 380 200 L 380 187" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="195" font-size="10" fill="#888">i++, 回到判断</text>

  <path d="M 160 278 L 110 278" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="270" font-size="10" fill="#b85450">否/免费</text>

  <rect x="50" y="262" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="80" y="284" text-anchor="middle" font-size="11" fill="#b85450">跳过</text>

  <path d="M 80 262 L 80 200 L 380 200" stroke="#6a9acc" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="194" font-size="10" fill="#888">i++, 回到判断</text>

  <path d="M 260 324 L 260 348" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="352" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#333">返回 total</text>

  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#888">遍历时跳过下标 2, 5, 8…（每组第 3 个）</text>
</svg>
