<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 11 → 答案 5</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">枚举终值 v ∈ [1, ⌊√11⌋+1] = [1, 4]，逐个算最小份数 m = ⌈11/v⌉</text>

  <!-- array evolution -->
  <rect x="80" y="60" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M 122 75 L 240 75" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+1 × 3</text>
  <rect x="246" y="60" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 288 75 L 400 75" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">复制 × 2</text>
  <rect x="406" y="60" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="444" y="60" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="482" y="60" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="499" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <text x="180" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum = 4×3 = 12 ≥ 11 ✓</text>
  <text x="430" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作数 = 3 + 2 = 5（v=4 方案）</text>

  <!-- enumeration table -->
  <text x="80" y="140" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举表：f(v) = (v−1) + (⌈11/v⌉−1)</text>

  <!-- header row -->
  <rect x="80" y="150" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">终值 v</text>
  <rect x="170" y="150" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">份数 m = ⌈11/v⌉</text>
  <rect x="320" y="150" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作数</text>
  <rect x="430" y="150" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- row v=1 -->
  <rect x="80" y="182" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="182" width="150" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="320" y="182" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="430" y="182" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">纯复制，不加值</text>

  <!-- row v=2 -->
  <rect x="80" y="218" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="218" width="150" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="320" y="218" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="430" y="218" width="130" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="238" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">加太少，复制吃亏</text>

  <!-- row v=3 highlight -->
  <rect x="80" y="254" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="170" y="254" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="320" y="254" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <rect x="430" y="254" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="495" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">最优：[3]×4 份</text>

  <!-- row v=4 highlight (example 1) -->
  <rect x="80" y="290" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="170" y="290" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="320" y="290" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <rect x="430" y="290" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="310" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">即示例 1 的方案</text>

  <!-- row v=5 grey, beyond bound -->
  <rect x="80" y="326" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="346" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <rect x="170" y="326" width="150" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="245" y="346" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <rect x="320" y="326" width="110" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="375" y="346" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <rect x="430" y="326" width="130" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="495" y="346" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">已超上界，无需枚举</text>

  <!-- bottom summary -->
  <rect x="60" y="376" width="500" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = 5：v = 3 与 v = 4 并列取到最小值</text>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">v 再增大时 f(v) 回升（加法成本压过复制收益）</text>
  <text x="310" y="436" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">对照：k = 1 时 v = 1, m = 1，答案 0，公式自然覆盖</text>
</svg>
