<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：共享 path 列表 + 回溯（选 / 撤销）</text>

  <!-- left: root-to-leaf path -->
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">根→叶路径</text>
  <circle cx="110" cy="72" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <circle cx="110" cy="120" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="110" cy="168" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <circle cx="110" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="110" y="221" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 110 90 L 110 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 110 138 L 110 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 110 186 L 110 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="110" y="252" text-anchor="middle" font-size="10" fill="#888">sum = 5+4+11+2 = 22</text>

  <!-- divider -->
  <path d="M 210 56 L 210 270" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- right: path list lifecycle -->
  <text x="367" y="48" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">共享 path 列表（沿递归栈维护）</text>

  <!-- step 1 -->
  <text x="246" y="72" font-size="11" fill="#4a7a3a" font-weight="bold">① 进入节点：path.append(val)</text>
  <rect x="300" y="78" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="95" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="334" y="78" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="95" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="368" y="78" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="95" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="402" y="78" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="95" text-anchor="middle" font-size="12" fill="#333">2</text>
  <path d="M 367 104 L 367 118" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 2: hit leaf -->
  <rect x="244" y="120" width="248" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="368" y="140" text-anchor="middle" font-size="11" fill="#8a6a20">② 到达叶子：cur = 22 = targetSum ✓</text>
  <text x="368" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ res.append(path[:])  复制快照</text>
  <path d="M 367 176 L 367 192" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 3: backtrack pop -->
  <rect x="300" y="194" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="211" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="334" y="194" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="211" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="368" y="194" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="211" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="402" y="194" width="32" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="211" text-anchor="middle" font-size="12" fill="#bbbbbb">2</text>
  <text x="446" y="207" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="446" y="220" font-size="8" fill="#b85450">pop</text>
  <text x="246" y="240" font-size="11" fill="#d6a040" font-weight="bold">③ 返回上层：path.pop() 撤销 → 兄弟分支拿到干净 path</text>

  <text x="367" y="300" text-anchor="middle" font-size="10" fill="#888">cur 按值传递自动恢复；只有共享的 path 需要显式 pop</text>
</svg>
