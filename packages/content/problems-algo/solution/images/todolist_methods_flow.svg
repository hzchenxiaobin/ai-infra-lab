<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 432"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="432" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">四个方法流程：构造 → 增 → 查 → 改</text>

  <!-- addTask -->
  <rect x="30" y="52" width="500" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="74" font-size="13" fill="#2c4a22" filter="url(#rough2)">addTask(userId, desc, dueDate, tags)　　— 写入</text>
  <text x="44" y="94" font-size="12" fill="#333" filter="url(#rough2)">① taskId = nextId；构造 {id, desc, due, tags→集合, done=✗}</text>
  <text x="44" y="112" font-size="12" fill="#333" filter="url(#rough2)">② push 到 userTasks[userId]；③ 返回 taskId，nextId++　　O(1) 均摊</text>

  <!-- getAllTasks -->
  <rect x="30" y="142" width="500" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="164" font-size="13" fill="#223" filter="url(#rough2)">getAllTasks(userId)　　— 查全部</text>
  <text x="44" y="184" font-size="12" fill="#333" filter="url(#rough2)">① 遍历 userTasks[userId]　② 收集 done=✗ 的 (due, desc)</text>
  <text x="44" y="202" font-size="12" fill="#333" filter="url(#rough2)">③ 按 due 升序排序　④ 输出 desc 列表　　O(n log n)</text>

  <!-- getTasksForTag -->
  <rect x="30" y="232" width="500" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="254" font-size="13" fill="#223" filter="url(#rough2)">getTasksForTag(userId, tag)　　— 按标签查</text>
  <text x="44" y="274" font-size="12" fill="#333" filter="url(#rough2)">① 遍历　② 收集 done=✗ 且 tag ∈ tags 的 (due, desc)</text>
  <text x="44" y="292" font-size="12" fill="#333" filter="url(#rough2)">③ 排序　④ 输出　（tags 存集合 ⇒ 判定 O(1)）　O(n log n)</text>

  <!-- completeTask -->
  <rect x="30" y="322" width="500" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="344" font-size="13" fill="#7a2a26" filter="url(#rough2)">completeTask(userId, taskId)　　— 标记完成</text>
  <text x="44" y="364" font-size="12" fill="#333" filter="url(#rough2)">① 在 userTasks[userId] 中找 id==taskId 且 done=✗</text>
  <text x="44" y="382" font-size="12" fill="#333" filter="url(#rough2)">② 置 done=✓；不存在 / 已完成则不动　　O(n)</text>

  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">写 O(1)、读 O(n log n)、改 O(n)；n ≤ 100，约束温和 ⇒ 直接模拟即最优</text>
</svg>
