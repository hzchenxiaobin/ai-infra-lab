<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 345"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="345" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">贪心陷阱：逐空格锁定最近源，可能错过全局最优</text>

  <!-- ===== Grid A (optimal) ===== -->
  <text x="120" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一网格：空格 (0,0),(1,0)；多余 (0,2),(2,0)</text>
  <!-- row 0 -->
  <rect x="48" y="56" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="96" y="56" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="56" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <!-- row 1 -->
  <rect x="48" y="104" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="96" y="104" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="104" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <!-- row 2 -->
  <rect x="48" y="152" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="152" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="152" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- A match arrows (green) -->
  <path d="M160,64 L82,64" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="120" cy="64" r="9" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M78,168 L78,142" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="78" cy="155" r="9" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="120" y="216" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案 A：全局最优</text>
  <text x="120" y="236" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0,0) ← (0,2)：d = 2</text>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1,0) ← (2,0)：d = 1</text>
  <text x="120" y="280" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总代价 2 + 1 = 3 ✓</text>

  <!-- ===== Grid B (greedy fail) ===== -->
  <!-- row 0 -->
  <rect x="320" y="56" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="368" y="56" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="416" y="56" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <!-- row 1 -->
  <rect x="320" y="104" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="368" y="104" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="416" y="104" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <!-- row 2 -->
  <rect x="320" y="152" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="368" y="152" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="416" y="152" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- B match arrows (red) -->
  <path d="M334,170 C296,142 296,92 332,86" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="302" cy="128" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="302" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M436,76 C402,58 358,72 350,120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="390" cy="58" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="62" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="432" y="216" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案 B：贪心错配</text>
  <text x="432" y="236" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0,0) 先锁 (2,0)：d = 2（平手选错）</text>
  <text x="432" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1,0) 只剩 (0,2)：d = 3</text>
  <text x="432" y="280" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">总代价 2 + 3 = 5 ✗</text>

  <!-- conclusion -->
  <rect x="48" y="298" width="464" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">「逐空格锁定最近源」不保证全局最优 → 必须全排列枚举 / 最小权匹配</text>
</svg>
