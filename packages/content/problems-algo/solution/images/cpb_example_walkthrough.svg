<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = “))()))”，locked = “010100”</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">两趟 balance 均全程 ≥ 0 → true（合法赋值 “()()()”）</text>

  <!-- ===== 第一趟 ===== -->
  <text x="40" y="82" font-size="13" fill="#446688" font-weight="bold">第一趟  左→右  （可改位当 ‘(’）</text>

  <!-- 列头 -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="70" y="106">i</text>
    <text x="130" y="106">字符/角色</text>
    <text x="220" y="106">增量</text>
    <text x="300" y="106">balance</text>
  </g>

  <!-- 6 行表 -->
  <g filter="url(#rough2)">
    <!-- 行1 i=0 可改->( +1 1 -->
    <rect x="40" y="114" width="320" height="22" fill="#e8f0fe" stroke="#cdd9ea" stroke-width="0.8" rx="2"/>
    <!-- 行2 i=1 锁) -1 0 -->
    <rect x="40" y="136" width="320" height="22" fill="#fce4ec" stroke="#eccdd6" stroke-width="0.8" rx="2"/>
    <!-- 行3 i=2 可改->( +1 1 -->
    <rect x="40" y="158" width="320" height="22" fill="#e8f0fe" stroke="#cdd9ea" stroke-width="0.8" rx="2"/>
    <!-- 行4 i=3 锁) -1 0 -->
    <rect x="40" y="180" width="320" height="22" fill="#fce4ec" stroke="#eccdd6" stroke-width="0.8" rx="2"/>
    <!-- 行5 i=4 可改->( +1 1 -->
    <rect x="40" y="202" width="320" height="22" fill="#e8f0fe" stroke="#cdd9ea" stroke-width="0.8" rx="2"/>
    <!-- 行6 i=5 可改->( +1 2 -->
    <rect x="40" y="224" width="320" height="22" fill="#e8f0fe" stroke="#cdd9ea" stroke-width="0.8" rx="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="129">0</text><text x="130" y="129">可改→(</text><text x="220" y="129">+1</text><text x="300" y="129" fill="#446688" font-weight="bold">1</text>
    <text x="70" y="151">1</text><text x="130" y="151">锁 )</text><text x="220" y="151">−1</text><text x="300" y="151" fill="#b85450" font-weight="bold">0</text>
    <text x="70" y="173">2</text><text x="130" y="173">可改→(</text><text x="220" y="173">+1</text><text x="300" y="173" fill="#446688" font-weight="bold">1</text>
    <text x="70" y="195">3</text><text x="130" y="195">锁 )</text><text x="220" y="195">−1</text><text x="300" y="195" fill="#b85450" font-weight="bold">0</text>
    <text x="70" y="217">4</text><text x="130" y="217">可改→(</text><text x="220" y="217">+1</text><text x="300" y="217" fill="#446688" font-weight="bold">1</text>
    <text x="70" y="239">5</text><text x="130" y="239">可改→(</text><text x="220" y="239">+1</text><text x="300" y="239" fill="#446688" font-weight="bold">2</text>
  </g>
  <text x="380" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">全程 ≥ 0 ✓</text>
  <text x="380" y="198" font-size="10" fill="#888">末尾 = 2 不算非法</text>
  <text x="380" y="212" font-size="10" fill="#888">（只验「右括号不过早」）</text>

  <!-- ===== 第二趟 ===== -->
  <text x="40" y="280" font-size="13" fill="#b85450" font-weight="bold">第二趟  右→左  （可改位当 ‘)’）</text>

  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="70" y="304">i</text>
    <text x="130" y="304">字符/角色</text>
    <text x="220" y="304">增量</text>
    <text x="300" y="304">balance</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="312" width="320" height="22" fill="#e6f4ea" stroke="#d6e6cc" stroke-width="0.8" rx="2"/>
    <rect x="40" y="334" width="320" height="22" fill="#e6f4ea" stroke="#d6e6cc" stroke-width="0.8" rx="2"/>
    <rect x="40" y="356" width="320" height="22" fill="#fce4ec" stroke="#eccdd6" stroke-width="0.8" rx="2"/>
    <rect x="40" y="378" width="320" height="22" fill="#e6f4ea" stroke="#d6e6cc" stroke-width="0.8" rx="2"/>
    <rect x="40" y="400" width="320" height="22" fill="#fce4ec" stroke="#eccdd6" stroke-width="0.8" rx="2"/>
    <rect x="40" y="422" width="320" height="22" fill="#e6f4ea" stroke="#d6e6cc" stroke-width="0.8" rx="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="327">5</text><text x="130" y="327">可改→)</text><text x="220" y="327">+1</text><text x="300" y="327" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="70" y="349">4</text><text x="130" y="349">可改→)</text><text x="220" y="349">+1</text><text x="300" y="349" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="70" y="371">3</text><text x="130" y="371">锁 )</text><text x="220" y="371">+1</text><text x="300" y="371" fill="#b85450" font-weight="bold">3</text>
    <text x="70" y="393">2</text><text x="130" y="393">可改→)</text><text x="220" y="393">+1</text><text x="300" y="393" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="70" y="415">1</text><text x="130" y="415">锁 )</text><text x="220" y="415">+1</text><text x="300" y="415" fill="#b85450" font-weight="bold">5</text>
    <text x="70" y="437">0</text><text x="130" y="437">可改→)</text><text x="220" y="437">+1</text><text x="300" y="437" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="380" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">全程 ≥ 0 ✓</text>
  <text x="380" y="390" font-size="10" fill="#888">两趟皆通过 → true</text>
</svg>
