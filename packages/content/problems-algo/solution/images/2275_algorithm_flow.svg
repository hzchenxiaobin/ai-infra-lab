<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐位计数 → 取最大</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">外层枚举位 b=0..23，内层扫数组数该位 1 的个数</text>

  <!-- start -->
  <ellipse cx="150" cy="78" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>

  <!-- arrow down -->
  <path d="M150 100 L150 116" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop init: b = 0 -->
  <rect x="98" y="120" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="11" fill="#333">b = 0 → 23</text>

  <path d="M150 156 L150 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cnt = 0 -->
  <rect x="98" y="176" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="11" fill="#333">cnt = 0</text>

  <path d="M150 208 L150 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop: for x in candidates -->
  <rect x="60" y="226" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#333">for x in candidates</text>

  <path d="M150 264 L150 280" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: x & (1<<b) ? -->
  <polygon points="150,282 232,312 150,342 68,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="309" text-anchor="middle" font-size="10.5" fill="#333">x 的 b 位=1?</text>
  <text x="150" y="322" text-anchor="middle" font-size="9.5" fill="#888">x &amp; (1&lt;&lt;b) ≠ 0</text>

  <!-- yes branch: cnt++ (to the right) -->
  <path d="M232 312 L300 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="300" y="296" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt++</text>

  <!-- loop back: from cnt++ up to for x -->
  <path d="M335 296 L335 244 L240 244" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="270" text-anchor="middle" font-size="9.5" fill="#888">下一个 x</text>

  <!-- after inner loop: ans = max(ans, cnt) (to the right of decision, lower) -->
  <path d="M150 342 L150 350 L420 350 L420 348" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="160" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="181" text-anchor="middle" font-size="11" fill="#333">ans=max(ans,cnt)</text>

  <!-- arrow from ans up to loop b (next bit) -->
  <path d="M440 160 L440 137 L202 137" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="9.5" fill="#888">下一位 b</text>

  <!-- return -->
  <path d="M98 137 L50 137 L50 78 L102 78" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="60" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">b 用完</text>

  <!-- return box on left -->
  <ellipse cx="150" cy="78" rx="48" ry="20" fill="none" stroke="none"/>

  <!-- footer note -->
  <rect x="300" y="206" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="400" y="225" text-anchor="middle" font-size="10.5" fill="#333">位独立：每一位单独数 1，</text>
  <text x="400" y="240" text-anchor="middle" font-size="10.5" fill="#333">避免枚举 2^n 个子集</text>
</svg>
