<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">状压 DP：按值逐个决策，dp[mask] 两分支转移</text>

  <!-- 当前处理的值 -->
  <rect x="56" y="42" width="240" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="61" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">当前处理的值 v = 3，行集合 R = {r0, r1}</text>

  <!-- 状态 A -->
  <rect x="56" y="106" width="150" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="131" y="126" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp[mask]</text>
  <text x="131" y="143" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">已占行集合 mask 的最大得分</text>

  <!-- 选 v 分支 -->
  <path d="M 210 130 L 292 130" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="251" y="99" text-anchor="middle" font-size="10" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">选 v：放入某个</text>
  <text x="251" y="112" text-anchor="middle" font-size="10" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">空闲可行行 r</text>
  <text x="251" y="156" text-anchor="middle" font-size="10" fill="#8a6a1c" filter="url(#rough2)">得 dp[mask] + v</text>

  <!-- 状态 C -->
  <rect x="296" y="106" width="186" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="389" y="126" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp′[mask | (1&lt;&lt;r)]</text>
  <text x="389" y="143" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">其中 r ∈ R 且 r ∉ mask（行还空着）</text>

  <!-- 跳过 v 分支 -->
  <path d="M 131 156 L 131 192" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="52" y="196" width="164" height="48" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="216" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">跳过 v（这个值不选）</text>
  <text x="134" y="233" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp′[mask] ← dp[mask]</text>
  <text x="156" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">不占用任何行</text>

  <!-- 选 v 的完整式子 -->
  <rect x="272" y="196" width="228" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="216" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">dp′[mask | 1&lt;&lt;r] =</text>
  <text x="386" y="234" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">max(dp′[mask | 1&lt;&lt;r],</text>
  <text x="386" y="250" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">dp[mask] + v)</text>

  <!-- 底部流程条 -->
  <rect x="34" y="270" width="104" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="285" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">① 建值→行集合表</text>
  <text x="86" y="298" text-anchor="middle" font-size="9" fill="#7a6a50" filter="url(#rough2)">rowOf[v]</text>
  <path d="M 140 287 L 154 287" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="158" y="270" width="104" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="285" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">② 值升序逐个处理</text>
  <text x="210" y="298" text-anchor="middle" font-size="9" fill="#7a6a50" filter="url(#rough2)">每值恰好一次</text>
  <path d="M 264 287 L 278 287" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="270" width="104" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="285" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">③ 每值两分支</text>
  <text x="334" y="298" text-anchor="middle" font-size="9" fill="#7a6a50" filter="url(#rough2)">跳过 / 放行（0-1）</text>
  <path d="M 388 287 L 402 287" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="406" y="270" width="94" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="453" y="285" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 答案 = max(dp)</text>
  <text x="453" y="298" text-anchor="middle" font-size="9" fill="#7a6a50" filter="url(#rough2)">所有 mask 取最大</text>

  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">每个值至多决策一次 → 用「旧 dp 推新 dp」（拷贝一份再更新），与 0-1 背包同款滚动</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">值全为正 ⇒ max(dp) 必 ≥ 最大单格值，「至少选一个」自动满足</text>
</svg>
