<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：命中部分返回 33，letter 不在串中返回 0</text>

  <!-- ===== Example 1: foobar, o → 33 ===== -->
  <rect x="40" y="44" width="460" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12.5" fill="#446688" font-weight="bold">示例 1：s="foobar", letter='o'（命中 2 次）</text>

  <!-- string boxes; 'o' at idx 1,2 highlighted. 6 chars, w44 gap6, total 294, start 123 -->
  <rect x="123" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">f</text>
  <rect x="173" y="80" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="104" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">o</text>
  <rect x="223" y="80" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="104" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">o</text>
  <rect x="273" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="323" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="345" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="373" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="395" y="104" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">r</text>

  <!-- count/n labels -->
  <text x="195" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt = 2</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n = 6</text>

  <!-- formula -->
  <rect x="110" y="160" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 2×100 // 6 = 200 // 6 = 33 ✓</text>

  <!-- ===== Example 2: jjjj, k → 0 ===== -->
  <rect x="40" y="220" width="460" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="242" font-size="12.5" fill="#d6a040" font-weight="bold">示例 2：s="jjjj", letter='k'（不在串中）</text>

  <!-- 4 chars, none highlighted. w44 gap6, total 194, start 173 -->
  <rect x="173" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="195" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">j</text>
  <rect x="223" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">j</text>
  <rect x="273" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">j</text>
  <rect x="323" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="345" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">j</text>

  <!-- letter k not found -->
  <text x="270" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">letter 'k' 未出现 → cnt = 0，n = 4</text>

  <!-- formula -->
  <rect x="110" y="324" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="345" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 0×100 // 4 = 0 // 4 = 0 ✓</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="384" width="460" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="406" font-size="12" fill="#b85450" font-weight="bold">⚠ 关键：ans = cnt × 100 // n（先乘后除）</text>
  <text x="60" y="426" font-size="11" fill="#b85450">· cnt=0 时 0×100=0，0//n=0，天然返回 0</text>
  <text x="60" y="446" font-size="11" fill="#b85450">· 切勿 cnt // n × 100：2//6=0 会把 33% 抹成 0</text>
</svg>
