<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">逆向 DP：k 枚蛋 m 次操作 → 最多能测多少层？</text>

  <!-- root node dp[k][m] -->
  <rect x="200" y="48" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dp[k][m]</text>

  <!-- drop arrow down to current floor -->
  <path d="M 260 90 L 260 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <ellipse cx="260" cy="100" rx="6" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- current floor (the +1) -->
  <rect x="232" y="112" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">+1 层</text>
  <text x="260" y="156" text-anchor="middle" font-size="9" fill="#888">(本次测试楼)</text>

  <!-- two branch arrows from current floor -->
  <path d="M 234 142 Q 170 158 140 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 286 142 Q 350 158 380 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="160" font-size="10" fill="#b85450" font-weight="bold">碎了</text>
  <text x="320" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">没碎</text>

  <!-- left child: dp[k-1][m-1] -->
  <rect x="60" y="180" width="160" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[k−1][m−1]</text>
  <text x="140" y="222" text-anchor="middle" font-size="10" fill="#444">蛋 −1, 次 −1</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#444">能测下方楼层数</text>

  <!-- right child: dp[k][m-1] -->
  <rect x="300" y="180" width="160" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[k][m−1]</text>
  <text x="380" y="222" text-anchor="middle" font-size="10" fill="#444">蛋 不变, 次 −1</text>
  <text x="380" y="240" text-anchor="middle" font-size="10" fill="#444">能测上方楼层数</text>

  <!-- merge arrows to equation -->
  <path d="M 140 254 Q 140 268 200 274" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 380 254 Q 380 268 320 274" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 260 158 Q 260 268 260 274" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- equation box -->
  <rect x="50" y="280" width="420" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[k][m] = dp[k−1][m−1] + 1 + dp[k][m−1]</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#888">下方能测层 ＋ 本层 ＋ 上方能测层 = m 次操作的总覆盖范围</text>
</svg>
