<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="260" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arrays = [[1,2,3],[4,5],[1,2,3]]</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步先算两个候选再更新全局最值，最终 result = 4</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="56" width="540" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="45" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
    <text x="105" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">当前数组</text>
    <text x="185" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">prev(min,max)</text>
    <text x="270" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cur(min,max)</text>
    <text x="355" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">① cur_max−prev_min</text>
    <text x="450" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">② prev_max−cur_min</text>
    <text x="530" y="72" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">result</text>
  </g>

  <!-- row 0: init -->
  <g filter="url(#rough2)">
    <rect x="20" y="80" width="540" height="24" fill="#e8f0fe" stroke="#c0d0e8" stroke-width="0.8"/>
    <text x="45" y="96" text-anchor="middle" font-size="10" fill="#333">初始化</text>
    <text x="105" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[1,2,3]</text>
    <text x="185" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1, 3</text>
    <text x="270" y="96" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="355" y="96" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="450" y="96" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="530" y="96" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <!-- row 1: arrays[1] = [4,5] -->
  <g filter="url(#rough2)">
    <rect x="20" y="104" width="540" height="24" fill="#e6f4ea" stroke="#a0c0a0" stroke-width="0.8"/>
    <text x="45" y="120" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="105" y="120" text-anchor="middle" font-size="10" fill="#333">[4,5]</text>
    <text x="185" y="120" text-anchor="middle" font-size="10" fill="#333">1, 3</text>
    <text x="270" y="120" text-anchor="middle" font-size="10" fill="#333">4, 5</text>
    <text x="355" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5−1 = 4</text>
    <text x="450" y="120" text-anchor="middle" font-size="10" fill="#b85450">3−4 = −1</text>
    <text x="530" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- row 2: arrays[2] = [1,2,3] -->
  <g filter="url(#rough2)">
    <rect x="20" y="128" width="540" height="24" fill="#e6f4ea" stroke="#a0c0a0" stroke-width="0.8"/>
    <text x="45" y="144" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="105" y="144" text-anchor="middle" font-size="10" fill="#333">[1,2,3]</text>
    <text x="185" y="144" text-anchor="middle" font-size="10" fill="#333">1, 5</text>
    <text x="270" y="144" text-anchor="middle" font-size="10" fill="#333">1, 3</text>
    <text x="355" y="144" text-anchor="middle" font-size="10" fill="#888">3−1 = 2</text>
    <text x="450" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5−1 = 4</text>
    <text x="530" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="20" y="168" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="290" y="190" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">最终：result = 4</text>
    <text x="290" y="208" text-anchor="middle" font-size="10.5" fill="#888">步骤 1 候选① 5−1=4 命中最大；步骤 2 候选② 5−1=4 追平</text>
  </g>

  <text x="290" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">prev_min/prev_max 更新轨迹：1,3 → 1,3 → 1,5（arrays[1] 的 max=5 被吸收）</text>
</svg>
