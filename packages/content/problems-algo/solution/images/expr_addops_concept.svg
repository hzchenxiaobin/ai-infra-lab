<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    乘法撤销再加回：插 *n 时先撤回 prevOperand，再把 prevOperand×n 整体接回
  </text>

  <!-- Row 1: expression 2 + 3, curVal=5, prevOperand=+3 -->
  <text x="40" y="78" font-size="12" fill="#446688" filter="url(#rough2)">已生成：</text>
  <rect x="110" y="60" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="60" width="32" height="30" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="80" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">+</text>
  <rect x="198" y="60" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="270" y="58" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">curVal = 5</text>
  <text x="330" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">prevOperand = +3</text>

  <!-- Arrow down: insert * 2 -->
  <path d="M218,92 L218,124" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="230" y="114" font-size="11" fill="#b85450" filter="url(#rough2)">插 * 2</text>

  <!-- Row 2: the undo visualization -->
  <!-- Step A: undo (take back the +3) -->
  <text x="40" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">① 撤销：</text>
  <rect x="110" y="140" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="140" width="32" height="30" fill="#fff" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="174" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">+</text>
  <rect x="198" y="140" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="218" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">3</text>
  <path d="M218,138 Q260,118 300,140" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="120" font-size="10" fill="#b85450" filter="url(#rough2)">收回 prevOperand</text>
  <rect x="360" y="142" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">curVal − prev = 5 − 3 = 2</text>

  <!-- Step B: re-attach as product -->
  <text x="40" y="218" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 接回：</text>
  <rect x="110" y="200" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="200" width="32" height="30" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="220" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">+</text>
  <!-- product box enclosing 3 * 2 -->
  <rect x="196" y="194" width="104" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="200" y="200" width="40" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="246" y="200" width="24" height="30" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="220" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">*</text>
  <rect x="276" y="200" width="22" height="30" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="248" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">↑ 作为一个整体 = 6</text>

  <rect x="360" y="202" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+ prev×n = 3×2 = 6</text>

  <!-- Result row -->
  <path d="M218,256 L218,284" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="12" fill="#333" filter="url(#rough2)">结果：</text>
  <rect x="110" y="290" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="158" y="310" font-size="13" fill="#d6a040" filter="url(#rough2)">+</text>
  <rect x="172" y="290" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="220" y="310" font-size="13" fill="#d6a040" filter="url(#rough2)">*</text>
  <rect x="234" y="290" width="22" height="30" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="262" y="310" font-size="13" fill="#888" filter="url(#rough2)">= 8</text>

  <rect x="350" y="290" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">curVal' = 5 − 3 + 3×2 = 8</text>
  <text x="435" y="319" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">prevOperand' = 3×2 = +6</text>

  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    公式：curVal' = curVal − prevOperand + prevOperand × n
  </text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    prevOperand' = prevOperand × n（带符号，保证连续乘法链式撤销正确）
  </text>
</svg>
