<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums=[1,2,1,2,6,7,5,1], k=2</text>

  <!-- index header -->
  <text x="40" y="66" font-size="11" fill="#888" filter="url(#rough2)">起点 i:</text>
  <g filter="url(#rough2)" font-size="11" fill="#aaa" text-anchor="middle">
    <text x="120" y="66">0</text>
    <text x="180" y="66">1</text>
    <text x="240" y="66">2</text>
    <text x="300" y="66">3</text>
    <text x="360" y="66">4</text>
    <text x="420" y="66">5</text>
    <text x="480" y="66">6</text>
  </g>

  <!-- W row -->
  <text x="40" y="104" font-size="12" fill="#888" filter="url(#rough2)">W[i]:</text>
  <!-- values 3,3,3,8,13,12,6 ; cell 60 wide starting x=90 -->
  <rect x="90" y="88" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="150" y="88" width="60" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="210" y="88" width="60" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="270" y="88" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="330" y="88" width="60" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#999">13</text>
  <rect x="390" y="88" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">12</text>
  <rect x="450" y="88" width="60" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="108" text-anchor="middle" font-size="12" fill="#999">6</text>

  <!-- left row -->
  <text x="40" y="148" font-size="12" fill="#888" filter="url(#rough2)">left:</text>
  <g filter="url(#rough2)" font-size="11" fill="#b85450" font-weight="bold" text-anchor="middle">
    <rect x="90" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="120" y="148">0</text>
    <rect x="150" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="180" y="148">0</text>
    <rect x="210" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="240" y="148">0</text>
    <rect x="270" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="300" y="148">3</text>
    <rect x="330" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="360" y="148">4</text>
    <rect x="390" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="420" y="148">4</text>
    <rect x="450" y="132" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/><text x="480" y="148">4</text>
  </g>

  <!-- right row -->
  <text x="40" y="188" font-size="12" fill="#888" filter="url(#rough2)">right:</text>
  <g filter="url(#rough2)" font-size="11" fill="#a07820" font-weight="bold" text-anchor="middle">
    <rect x="90" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="120" y="188">4</text>
    <rect x="150" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="180" y="188">4</text>
    <rect x="210" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="240" y="188">4</text>
    <rect x="270" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="300" y="188">4</text>
    <rect x="330" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="360" y="188">4</text>
    <rect x="390" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="420" y="188">5</text>
    <rect x="450" y="172" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="480" y="188">6</text>
  </g>

  <!-- enumeration header -->
  <text x="40" y="232" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">枚举中间 b ∈ [2, 4]：</text>

  <!-- b=2 row -->
  <g filter="url(#rough2)">
    <text x="48" y="262" font-size="11.5" fill="#4a7a3a" font-weight="bold">b=2:</text>
    <text x="92" y="262" font-size="11" fill="#555">a=left[0]=0, c=right[4]=4</text>
    <text x="290" y="262" font-size="11" fill="#555">total = 3 + 3 + 13 =</text>
    <rect x="410" y="250" width="50" height="22" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="435" y="266" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">19</text>
    <text x="470" y="262" font-size="10" fill="#888">(0,2,4) 初始</text>
  </g>

  <!-- b=3 row (best) -->
  <g filter="url(#rough2)">
    <rect x="40" y="276" width="490" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="48" y="294" font-size="11.5" fill="#3a5a2a" font-weight="bold">b=3:</text>
    <text x="92" y="294" font-size="11" fill="#3a5a2a">a=left[1]=0, c=right[5]=5</text>
    <text x="290" y="294" font-size="11" fill="#3a5a2a">total = 3 + 8 + 12 =</text>
    <rect x="410" y="282" width="50" height="22" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.4" rx="4"/>
    <text x="435" y="298" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">23</text>
    <text x="470" y="294" font-size="10" fill="#3a5a2a" font-weight="bold">★ 更新</text>
  </g>

  <!-- b=4 row -->
  <g filter="url(#rough2)">
    <text x="48" y="326" font-size="11.5" fill="#b85450" font-weight="bold">b=4:</text>
    <text x="92" y="326" font-size="11" fill="#555">a=left[2]=0, c=right[6]=6</text>
    <text x="290" y="326" font-size="11" fill="#555">total = 3 + 13 + 6 =</text>
    <rect x="410" y="314" width="50" height="22" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="435" y="330" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">22</text>
    <text x="470" y="326" font-size="10" fill="#888">✗ 未超 23</text>
  </g>

  <!-- highlight markers on W row for b=3 best: a=0, b=3, c=5 -->
  <path d="M 120 122 L 120 130" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 300 122 L 300 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 420 122 L 420 170" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="352" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果：max = 23，答案 [0, 3, 5]</text>
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#666">a=0 → [1,2]=3, b=3 → [2,6]=8, c=5 → [7,5]=12</text>
  <text x="300" y="414" text-anchor="middle" font-size="11" fill="#666">三窗口 [0,1] [3,4] [5,6] 互不重叠 ✓</text>
  <text x="300" y="432" text-anchor="middle" font-size="10.5" fill="#888">注意：b=4 单窗 W=13 最大，但右侧仅剩 W=6，总和不优 → 不能贪心选最大三窗</text>
</svg>
