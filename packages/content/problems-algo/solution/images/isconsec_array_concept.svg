<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">连续数组 = 元素互异 ∧ 跨度恰好 n−1</text>

  <!-- Row 1: [3,5,4] -> TRUE -->
  <text x="40" y="92" font-size="12" fill="#446688" font-weight="bold">nums =</text>
  <rect x="90" y="74" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="93" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="130" y="74" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="93" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="170" y="74" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="93" text-anchor="middle" font-size="13" fill="#333">4</text>

  <text x="225" y="86" font-size="11" fill="#333">min=3, max=5, n=3</text>
  <text x="225" y="100" font-size="11" fill="#4a7a3a">max−min=2 == n−1 ✓  无重复 ✓</text>
  <rect x="450" y="76" width="78" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="489" y="94" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">TRUE</text>

  <!-- Row 2: [1,2,3,5] -> FALSE (gap) -->
  <text x="40" y="192" font-size="12" fill="#446688" font-weight="bold">nums =</text>
  <rect x="90" y="174" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="193" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="174" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="193" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="170" y="174" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="193" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="210" y="174" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="193" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <text x="265" y="186" font-size="11" fill="#333">min=1, max=5, n=4</text>
  <text x="265" y="200" font-size="11" fill="#b85450">max−min=4 ≠ n−1=3 ✗  跨度过大(缺4)</text>
  <rect x="450" y="176" width="78" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="489" y="194" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Row 3: [1,1,3] -> FALSE (duplicate, range ok) -->
  <text x="40" y="292" font-size="12" fill="#446688" font-weight="bold">nums =</text>
  <rect x="90" y="274" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="293" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="130" y="274" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="293" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="170" y="274" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="293" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- duplicate bracket -->
  <rect x="86" y="270" width="88" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="322" text-anchor="middle" font-size="9" fill="#b85450">重复!</text>

  <text x="225" y="286" font-size="11" fill="#333">min=1, max=3, n=3</text>
  <text x="225" y="300" font-size="11" fill="#d6a040">max−min=2 == n−1 ✓ 但 1 重复、缺2 ✗</text>
  <rect x="450" y="276" width="78" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="489" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Bottom formula box -->
  <rect x="40" y="346" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">核心判据</text>
  <text x="280" y="392" text-anchor="middle" font-size="14" fill="#333">连续 ⟺ ( max − min == n − 1 ) ∧ ( len(set) == n )</text>
</svg>
