<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：beans = [4,1,2,3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">排序后 [1,2,3,4]，total = 10，n = 4，枚举每个目标值</text>

  <!-- ===== table header ===== -->
  <rect x="30" y="62" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>

  <rect x="82" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">目标 v</text>

  <rect x="164" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">保留袋数</text>

  <rect x="236" y="62" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">keep=(n−i)·v</text>

  <rect x="338" y="62" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">removed</text>

  <rect x="430" y="62" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>

  <!-- ===== row i=0 ===== -->
  <rect x="30" y="94" width="50" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="82" y="94" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="94" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="116" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="236" y="94" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="286" y="116" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="338" y="94" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="116" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="430" y="94" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="116" text-anchor="middle" font-size="9.5" fill="#888">4 袋全削到 1</text>

  <!-- ===== row i=1 (optimal) ===== -->
  <rect x="30" y="130" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="82" y="130" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="130" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="236" y="130" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="338" y="130" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ✓</text>
  <rect x="430" y="130" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">袋[1]清空，余削到2</text>

  <!-- ===== row i=2 (optimal) ===== -->
  <rect x="30" y="166" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="82" y="166" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="164" y="166" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="236" y="166" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="338" y="166" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ✓</text>
  <rect x="430" y="166" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="188" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">袋[1,2]清空，余削到3</text>

  <!-- ===== row i=3 ===== -->
  <rect x="30" y="202" width="50" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="224" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="82" y="202" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="224" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="164" y="202" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="236" y="202" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="286" y="224" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="338" y="202" width="90" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="224" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="430" y="202" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="224" text-anchor="middle" font-size="9.5" fill="#888">仅留袋[4]</text>

  <!-- ===== conclusion box ===== -->
  <rect x="30" y="252" width="510" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="274" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">结论</text>
  <text x="285" y="292" text-anchor="middle" font-size="11" fill="#333">maxKeep = max(4, 6, 6, 4) = 6</text>
  <text x="285" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = total − maxKeep = 10 − 6 = 4</text>

  <!-- ===== v=2 detail illustration ===== -->
  <text x="30" y="334" font-size="10.5" fill="#444" font-weight="bold">v=2 方案明细：[1]清空(移1) + [2]不动(移0) + [3]削到2(移1) + [4]削到2(移2) = 4</text>
  <text x="30" y="352" font-size="10.5" fill="#888">验证：保留数 = (n−i)·v = 3·2 = 6 = 2+2+2 ✓，移除 = 10−6 = 4 ✓</text>
</svg>
