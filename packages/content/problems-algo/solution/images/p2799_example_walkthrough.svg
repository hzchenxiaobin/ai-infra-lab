<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,3,1,2,2]，k=3</text>

  <!-- column headers -->
  <text x="30" y="56" font-size="11" fill="#888" font-weight="bold">left</text>
  <text x="60" y="56" font-size="11" fill="#888" font-weight="bold">窗口 [left,right)</text>
  <text x="230" y="56" font-size="11" fill="#888" font-weight="bold">distinct</text>
  <text x="305" y="56" font-size="11" fill="#888" font-weight="bold">right</text>
  <text x="375" y="56" font-size="11" fill="#888" font-weight="bold">累加</text>
  <text x="460" y="56" font-size="11" fill="#888" font-weight="bold">ans</text>

  <line x1="20" y1="64" x2="560" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row left=0 -->
  <text x="30" y="90" font-size="12" fill="#333" font-weight="bold">0</text>
  <g font-size="12" font-weight="bold">
    <rect x="60" y="76" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="75" y="92" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="90" y="76" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="92" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="120" y="76" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="92" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="150" y="76" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="165" y="92" text-anchor="middle" fill="#4a7a3a">2</text>
  </g>
  <text x="230" y="90" font-size="11" fill="#4a7a3a" font-weight="bold">3=k ✓</text>
  <text x="305" y="90" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="375" y="90" font-size="11" fill="#d6a040" font-weight="bold">+2</text>
  <text x="460" y="90" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="375" y="104" font-size="8" fill="#999">5−4+1</text>

  <line x1="20" y1="110" x2="560" y2="110" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row left=1 -->
  <text x="30" y="134" font-size="12" fill="#333" font-weight="bold">1</text>
  <g font-size="12" font-weight="bold">
    <rect x="60" y="120" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="75" y="136" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="90" y="120" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="136" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="120" y="120" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="135" y="136" text-anchor="middle" fill="#4a7a3a">2</text>
  </g>
  <text x="230" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">3=k ✓</text>
  <text x="305" y="134" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="375" y="134" font-size="11" fill="#d6a040" font-weight="bold">+2</text>
  <text x="460" y="134" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="60" y="148" font-size="8" fill="#999">移出 nums[0]=1，仍有 1 → distinct 不减</text>

  <line x1="20" y1="154" x2="560" y2="154" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row left=2 -->
  <text x="30" y="178" font-size="12" fill="#333" font-weight="bold">2</text>
  <g font-size="12" font-weight="bold">
    <rect x="60" y="164" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="75" y="180" text-anchor="middle" fill="#999">1</text>
    <rect x="90" y="164" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="105" y="180" text-anchor="middle" fill="#999">2</text>
    <rect x="120" y="164" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="135" y="180" text-anchor="middle" fill="#999">2</text>
  </g>
  <text x="230" y="178" font-size="11" fill="#b85450" font-weight="bold">2&lt;3 ✗</text>
  <text x="305" y="178" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="375" y="178" font-size="11" fill="#bbb" font-weight="bold">+0</text>
  <text x="460" y="178" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="60" y="200" font-size="8" fill="#b85450">移出 nums[1]=3 后丢掉唯一 3，扩到末尾也找不回</text>

  <line x1="20" y1="206" x2="560" y2="206" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row left=3 -->
  <text x="30" y="230" font-size="12" fill="#333" font-weight="bold">3</text>
  <g font-size="12" font-weight="bold">
    <rect x="60" y="216" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="75" y="232" text-anchor="middle" fill="#999">2</text>
    <rect x="90" y="216" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="105" y="232" text-anchor="middle" fill="#999">2</text>
  </g>
  <text x="230" y="230" font-size="11" fill="#b85450" font-weight="bold">1&lt;3 ✗</text>
  <text x="305" y="230" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="375" y="230" font-size="11" fill="#bbb" font-weight="bold">+0</text>
  <text x="460" y="230" font-size="12" fill="#446688" font-weight="bold">4</text>

  <line x1="20" y1="242" x2="560" y2="242" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row left=4 -->
  <text x="30" y="266" font-size="12" fill="#333" font-weight="bold">4</text>
  <g font-size="12" font-weight="bold">
    <rect x="60" y="252" width="30" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="75" y="268" text-anchor="middle" fill="#999">2</text>
  </g>
  <text x="230" y="266" font-size="11" fill="#b85450" font-weight="bold">1&lt;3 ✗</text>
  <text x="305" y="266" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="375" y="266" font-size="11" fill="#bbb" font-weight="bold">+0</text>
  <text x="460" y="266" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- summary -->
  <rect x="60" y="290" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">left=0,1 各贡献 2 个；left≥2 后 3 已丢且不再出现 → 无法凑齐</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#d6a040">合计 ans = 2 + 2 = 4 ✓</text>

  <!-- bottom: key insight -->
  <rect x="60" y="356" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为何 right 只增不减？</text>
  <text x="290" y="396" text-anchor="middle" font-size="11" fill="#446688">left 右移丢元素，要重新凑齐 k 种只需把 right 继续往右推</text>
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#446688">right 永不回头 → 每个元素至多入窗/出窗各一次 → O(n)</text>
</svg>
