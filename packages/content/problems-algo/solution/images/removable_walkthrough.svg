<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="abcacb", p="ab", removable=[3,1,0]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">m = 3, 初始 lo=0, hi=3, ans=0</text>

  <!-- ===== Table header ===== -->
  <rect x="36" y="60" width="508" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">轮次</text>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">[lo, hi]</text>
  <text x="230" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="330" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">移除下标(前mid个)</text>
  <text x="450" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">check</text>
  <text x="520" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作</text>

  <!-- ===== Round 1: mid=1 ===== -->
  <rect x="36" y="92" width="508" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0, 3]</text>
  <text x="230" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="330" y="110" text-anchor="middle" font-size="11" fill="#666">移除 removable[0]=3</text>
  <text x="330" y="126" text-anchor="middle" font-size="11" fill="#666">剩 "abccb"</text>
  <text x="450" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans=1</text>
  <text x="520" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">lo=2</text>

  <!-- ===== Round 2: mid=2 ===== -->
  <rect x="36" y="140" width="508" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[2, 3]</text>
  <text x="230" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="330" y="158" text-anchor="middle" font-size="11" fill="#666">移除 removable[0,1]=3,1</text>
  <text x="330" y="174" text-anchor="middle" font-size="11" fill="#666">剩 "accb"</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans=2</text>
  <text x="520" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">lo=3</text>

  <!-- ===== Round 3: mid=3 ===== -->
  <rect x="36" y="188" width="508" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="150" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[3, 3]</text>
  <text x="230" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="330" y="206" text-anchor="middle" font-size="11" fill="#666">移除 removable[0,1,2]=3,1,0</text>
  <text x="330" y="222" text-anchor="middle" font-size="11" fill="#666">剩 "ccb"（无 a）</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi=2</text>

  <!-- ===== End row ===== -->
  <rect x="36" y="236" width="508" height="34" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo=3 &gt; hi=2，循环结束 → 返回 ans = 2</text>

  <!-- ===== check detail for round 2 ===== -->
  <path d="M 290 280 L 290 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="294" font-size="10" fill="#888">展开 check(2)</text>

  <rect x="60" y="304" width="460" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">check(2) 子序列扫描（移除 idx 3,1）</text>

  <!-- s chars with removed marked -->
  <text x="80" y="352" font-size="11" fill="#888">s:</text>
  <!-- idx0 a (keep) -->
  <rect x="108" y="338" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <!-- idx1 b (removed) -->
  <rect x="138" y="338" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <line x1="138" y1="350" x2="166" y2="350" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- idx2 c (keep) -->
  <rect x="168" y="338" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <!-- idx3 a (removed) -->
  <rect x="198" y="338" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <line x1="198" y1="350" x2="226" y2="350" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- idx4 c (keep) -->
  <rect x="228" y="338" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <!-- idx5 b (keep, match) -->
  <rect x="258" y="338" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <text x="300" y="354" font-size="11" fill="#888">有效串: "a c c b"</text>

  <!-- match arrows -->
  <text x="80" y="390" font-size="11" fill="#888">p:</text>
  <rect x="108" y="376" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="258" y="376" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <!-- match connecting lines -->
  <path d="M 122 376 L 122 362" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 272 376 L 272 362" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <text x="320" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">j 走完 → p 是子序列 ✓</text>
  <text x="320" y="410" font-size="10" fill="#666">a@0 匹配 p[0], b@5 匹配 p[1]</text>
</svg>
