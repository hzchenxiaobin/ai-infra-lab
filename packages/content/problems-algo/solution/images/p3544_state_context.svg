<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">祖先反转的影响 = 两条线索 (p, d) 沿树向下传播</text>
  <text x="140" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 的树（k = 2）：反转节点 0 之后，各节点的上下文</text>

  <!-- 树的边 -->
  <path d="M120,90 L72,175" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M120,90 L218,175" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M72,175 L44,262" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M72,175 L112,262" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M218,175 L188,262" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M218,175 L256,262" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 节点 0 被反转：红色虚线圈 -->
  <circle cx="120" cy="90" r="24" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="150" y="70" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">反转！</text>

  <!-- 树的节点 -->
  <circle cx="120" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="72" cy="175" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="218" cy="175" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="44" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="112" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="188" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="256" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 各节点的 (p, d) 上下文 -->
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(0, ≥k) ✓</text>
  <text x="72" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(1, 1) ✗</text>
  <text x="218" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(1, 1) ✗</text>
  <text x="44" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 2) ✓</text>
  <text x="112" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 2) ✓</text>
  <text x="188" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 2) ✓</text>
  <text x="256" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 2) ✓</text>

  <!-- 图例 -->
  <text x="150" y="324" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">✓ 距离已满 k，允许反转　　✗ 距离不足，禁止</text>

  <!-- 右侧：奇偶 p 说明框 -->
  <rect x="318" y="62" width="228" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">奇偶 p ∈ {0, 1}</text>
  <text x="432" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">祖先反转次数，只需记奇偶</text>
  <text x="432" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">子树值 = 原值 × (−1)^p</text>
  <text x="432" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(−1)² = 1：翻两次等于没翻</text>
  <text x="432" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v 自己反转 → 孩子的 p ⊕ 1</text>

  <!-- 右侧：距离 d 说明框 -->
  <rect x="318" y="196" width="228" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">距离 d ∈ [1, k]</text>
  <text x="432" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">到最近反转祖先的边数</text>
  <text x="432" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不反转下传：min(d+1, k)</text>
  <text x="432" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v 反转后孩子：d 重置为 1</text>
  <text x="432" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = k（或没有反转祖先）</text>
  <text x="432" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">时才允许 v 反转</text>

  <!-- 底部结论 -->
  <rect x="46" y="352" width="468" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">约束只作用于「祖先 ↔ 后代」对：兄弟子树（如 3 与 5）互不影响</text>
  <text x="280" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">子树结果只依赖上下文 (p, d) → 独立求解 → 树形 DP 成立</text>
</svg>
