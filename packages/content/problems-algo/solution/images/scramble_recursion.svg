<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fdfcf7"/>

  <text x="310" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">扰乱字符串：两种分割情形</text>
  <path d="M 200 42 Q 310 50 420 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#888">长度 n，切点 k(1≤k&lt;n)：左段长 k，右段长 n−k</text>

  <!-- Top: s1 and s2 bars -->
  <text x="50" y="100" font-size="12" fill="#446688" font-weight="bold">s1</text>
  <g filter="url(#sk)"><rect x="80" y="78" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#2b4a6a" font-weight="bold">前 k 个</text>
  <g filter="url(#sk)"><rect x="184" y="78" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,2"/></g>
  <text x="244" y="100" text-anchor="middle" font-size="12" fill="#2b4a6a" font-weight="bold">后 n−k 个</text>

  <text x="50" y="148" font-size="12" fill="#b85450" font-weight="bold">s2</text>
  <g filter="url(#sk)"><rect x="80" y="126" width="100" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="130" y="148" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">前 k 个</text>
  <g filter="url(#sk)"><rect x="184" y="126" width="120" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,2"/></g>
  <text x="244" y="148" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">后 n−k 个</text>

  <!-- Case 1: No swap -->
  <g filter="url(#sk)"><rect x="330" y="72" width="14" height="72" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="337" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">情形一</text>
  <text x="337" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">不交换</text>

  <text x="360" y="100" font-size="13" fill="#4a7a3a" font-weight="bold">s1[:k] ≟ s2[:k]</text>
  <text x="360" y="120" font-size="11" fill="#666">且</text>
  <text x="360" y="140" font-size="13" fill="#4a7a3a" font-weight="bold">s1[k:] ≟ s2[k:]</text>

  <!-- Divider -->
  <path d="M 40 190 L 580 190" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#sk)"/>

  <!-- Case 2: Swap -->
  <text x="50" y="226" font-size="12" fill="#446688" font-weight="bold">s1</text>
  <g filter="url(#sk)"><rect x="80" y="204" width="100" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="130" y="226" text-anchor="middle" font-size="12" fill="#2b4a6a" font-weight="bold">前 k 个 (X)</text>
  <g filter="url(#sk)"><rect x="184" y="204" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,2"/></g>
  <text x="244" y="226" text-anchor="middle" font-size="12" fill="#2b4a6a" font-weight="bold">后 n−k 个 (Y)</text>

  <text x="50" y="274" font-size="12" fill="#b85450" font-weight="bold">s2</text>
  <!-- s2 after swap: Y first, X second -->
  <g filter="url(#sk)"><rect x="80" y="252" width="120" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,2"/></g>
  <text x="140" y="274" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">后 n−k 个 (Y)</text>
  <g filter="url(#sk)"><rect x="204" y="252" width="100" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="254" y="274" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">前 k 个 (X)</text>

  <g filter="url(#sk)"><rect x="330" y="198" width="14" height="72" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="337" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">情形二</text>
  <text x="337" y="282" text-anchor="middle" font-size="10" fill="#b85450">交换</text>

  <text x="360" y="226" font-size="13" fill="#b85450" font-weight="bold">s1[:k] ≟ s2[n−k:]</text>
  <text x="360" y="246" font-size="11" fill="#666">且</text>
  <text x="360" y="266" font-size="13" fill="#b85450" font-weight="bold">s1[k:] ≟ s2[:n−k]</text>

  <!-- swap arrows -->
  <path d="M 130 240 Q 200 360 140 352" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)" opacity="0.5"/>
  <path d="M 244 240 Q 180 360 254 352" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)" opacity="0.5"/>

  <!-- Bottom summary box -->
  <g filter="url(#sk)"><rect x="60" y="360" width="500" height="68" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>
  <text x="310" y="382" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">判定：存在切点 k 使「情形一 或 情形二」成立 → s2 是 s1 的扰乱串</text>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a">不交换：左对左、右对右</text>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#b85450">交换：左对右、右对左（注意 s2 的前 n−k 个对应 s1 的后段）</text>
</svg>
