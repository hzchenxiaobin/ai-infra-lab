<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">CASE WHEN 三分支：先判根，再看有没有娃</text>

  <rect x="100" y="40" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">FROM Tree —— 逐行拿到 (N, P)</text>

  <path d="M 250 76 L 250 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,100 355,145 250,190 145,145" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="141" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">P IS NULL ?</text>
  <text x="250" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（没爹吗）</text>

  <path d="M 145 145 L 108 145" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="5" y="123" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="55" y="141" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">type = 'Root'</text>
  <text x="55" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">整棵树的根</text>

  <path d="M 250 190 L 250 210" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="250,212 370,260 250,308 130,260" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">N 出现在 P 列 ?</text>
  <text x="250" y="274" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（是别人的爹吗 = 有娃吗）</text>

  <path d="M 370 260 L 393 260" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="381" y="251" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="393" y="238" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">type = 'Inner'</text>
  <text x="448" y="273" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">有爹又有娃</text>

  <path d="M 250 308 L 250 328" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="322" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="185" y="330" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">type = 'Leaf'</text>
  <text x="250" y="365" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">有爹但没娃</text>

  <path d="M 55 167 L 55 396" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 282 L 448 396" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 374 L 250 396" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="398" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">三个分支汇总后 ORDER BY N 升序输出</text>

  <text x="270" y="446" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意第二问只看 P 列去 NULL 后的集合 —— 千万别用裸的 NOT IN（见正文 5 节陷阱）</text>
</svg>
