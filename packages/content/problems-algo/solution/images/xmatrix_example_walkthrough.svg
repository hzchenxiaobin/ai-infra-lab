<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：示例1 全格合规 ✓ / 示例2 首处违例即短路 ✗</text>

  <!-- ====== Left: example 1 (4x4), cell=44, x0=50, y0=60 ====== -->
  <text x="138" y="54" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例 1（n=4）</text>
  <!-- Row 0 -->
  <rect x="50" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="94" y="60" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="88" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="138" y="60" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="182" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- Row 1 -->
  <rect x="50" y="104" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="132" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="94" y="104" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="138" y="104" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="104" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="204" y="132" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <!-- Row 2 -->
  <rect x="50" y="148" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="176" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="94" y="148" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="138" y="148" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="182" y="148" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="204" y="176" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <!-- Row 3 -->
  <rect x="50" y="192" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="94" y="192" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="220" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="138" y="192" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="12.5" fill="#888">0</text>
  <rect x="182" y="192" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- verdict -->
  <text x="138" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全部合规 → 返回 true ✓</text>

  <!-- divider -->
  <path d="M 258 50 L 258 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Right: example 2 (3x3), cell=52, x0=290, y0=60 ====== -->
  <text x="366" y="54" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">示例 2（n=3）</text>
  <!-- Row 0 -->
  <rect x="290" y="60" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- (0,1)=7 off non-zero -> first violation -->
  <rect x="342" y="60" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="368" y="92" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">7</text>
  <text x="388" y="72" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="394" y="84" text-anchor="start" font-size="9.5" fill="#d6a040">首处违例</text>
  <!-- (0,2)=0 anti but zero -> fail (other) -->
  <rect x="394" y="60" width="52" height="52" fill="#fce4ec" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="92" text-anchor="middle" font-size="15" fill="#888">0</text>
  <text x="440" y="72" text-anchor="start" font-size="11" fill="#b85450">✗</text>
  <!-- Row 1 -->
  <!-- (1,0)=0 off -> pass pink -->
  <rect x="290" y="112" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="316" y="144" text-anchor="middle" font-size="14" fill="#888">0</text>
  <!-- (1,1)=3 center both diag -> pass green -->
  <rect x="342" y="112" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <!-- (1,2)=1 off non-zero -> fail -->
  <rect x="394" y="112" width="52" height="52" fill="#fce4ec" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="144" text-anchor="middle" font-size="15" fill="#888">1</text>
  <text x="440" y="124" text-anchor="start" font-size="11" fill="#b85450">✗</text>
  <!-- Row 2 -->
  <!-- (2,0)=0 anti but zero -> fail -->
  <rect x="290" y="164" width="52" height="52" fill="#fce4ec" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="196" text-anchor="middle" font-size="15" fill="#888">0</text>
  <text x="336" y="176" text-anchor="start" font-size="11" fill="#b85450">✗</text>
  <!-- (2,1)=5 off non-zero -> fail -->
  <rect x="342" y="164" width="52" height="52" fill="#fce4ec" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="196" text-anchor="middle" font-size="15" fill="#888">5</text>
  <text x="388" y="176" text-anchor="start" font-size="11" fill="#b85450">✗</text>
  <!-- (2,2)=0 diag but zero -> fail -->
  <rect x="394" y="164" width="52" height="52" fill="#fce4ec" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="15" fill="#888">0</text>
  <text x="440" y="176" text-anchor="start" font-size="11" fill="#b85450">✗</text>
  <!-- verdict -->
  <text x="366" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">行优先扫到 (0,1)=7 即短路 → false ✗</text>

  <!-- Legend / notes -->
  <path d="M 40 274 L 520 274" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="50" y="286" width="18" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="74" y="297" font-size="11" fill="#4a7a3a">对角线·非零（通过）</text>
  <rect x="200" y="286" width="18" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="224" y="297" font-size="11" fill="#b85450">非对角线·零（通过）</text>
  <rect x="350" y="286" width="18" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="374" y="297" font-size="11" fill="#d6a040">违例格（橙虚 + ✗）</text>
  <text x="50" y="320" font-size="11" fill="#888">扫描顺序为行优先：i 外层、j 内层；(0,0) 通过 → (0,1)=7 不在却非零，命中首处违例即返回 false。</text>
  <text x="50" y="338" font-size="11" fill="#888">示例 2 共 6 格违例（对角线上 3 个 0、非对角线 3 个非零），但短路使其无需全部检查。</text>
</svg>
