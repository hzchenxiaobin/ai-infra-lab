<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：只数「严格夹在 min 与 max 之间」的元素</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">nums = [11, 7, 2, 15]</text>

  <!-- ====== Row 1: array cells ====== -->
  <text x="36" y="86" font-size="11" fill="#446688" font-weight="bold">① 扫一遍找 min / max</text>

  <rect x="90" y="96" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">11</text>

  <rect x="146" y="96" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="124" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">7</text>

  <rect x="202" y="96" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="124" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">2</text>

  <rect x="258" y="96" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="124" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">15</text>

  <!-- labels under cells -->
  <text x="118" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">内部 ✓</text>
  <text x="174" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">内部 ✓</text>
  <text x="230" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= min ✗</text>
  <text x="286" y="158" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">= max ✗</text>

  <!-- divider -->
  <path d="M 30 178 L 530 178" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Row 2: number line with walls ====== -->
  <text x="36" y="204" font-size="11" fill="#446688" font-weight="bold">② min 与 max 构成两堵「墙」</text>

  <!-- shaded inside region -->
  <rect x="170" y="232" width="180" height="46" fill="#e6f4ea" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">严格在墙之间 → 计入</text>

  <!-- min wall -->
  <path d="M 170 222 L 170 290" stroke="#b85450" stroke-width="2.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="160" y="216" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">min=2</text>

  <!-- max wall -->
  <path d="M 350 222 L 350 290" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="start" font-size="11" fill="#d6a040" font-weight="bold">max=15</text>

  <!-- number line -->
  <path d="M 90 288 L 430 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- elements placed on line -->
  <!-- 2 at min wall -->
  <circle cx="170" cy="288" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="306" text-anchor="middle" font-size="9" fill="#b85450">2</text>
  <!-- 7 inside -->
  <circle cx="220" cy="288" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="306" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7 ✓</text>
  <!-- 11 inside -->
  <circle cx="300" cy="288" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">11 ✓</text>
  <!-- 15 at max wall -->
  <circle cx="350" cy="288" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="306" text-anchor="middle" font-size="9" fill="#d6a040">15</text>

  <!-- divider -->
  <path d="M 30 324 L 530 324" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Result ====== -->
  <text x="36" y="350" font-size="11" fill="#446688" font-weight="bold">③ 统计：min &lt; x &lt; max 的元素个数</text>
  <rect x="120" y="362" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 2（11 与 7 被夹在中间）✓</text>
</svg>
