<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例演算：三条根到叶路径的掩码演化
  </text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    root = [2,3,1,3,1,null,1]　　掩码仅示位 1,2,3
  </text>

  <!-- ===== 树 ===== -->
  <g filter="url(#rough2)">
    <!-- 边 -->
    <line x1="180" y1="74" x2="118" y2="104" stroke="#999" stroke-width="1.4"/>
    <line x1="180" y1="74" x2="242" y2="104" stroke="#999" stroke-width="1.4"/>
    <line x1="110" y1="124" x2="70"  y2="154" stroke="#999" stroke-width="1.4"/>
    <line x1="110" y1="124" x2="150" y2="154" stroke="#999" stroke-width="1.4"/>
    <line x1="250" y1="124" x2="300" y2="154" stroke="#999" stroke-width="1.4"/>

    <!-- 节点 -->
    <circle cx="180" cy="66" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="180" y="71" text-anchor="middle" font-size="13" fill="#333">2</text>
    <circle cx="110" cy="112" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="110" y="117" text-anchor="middle" font-size="13" fill="#333">3</text>
    <circle cx="250" cy="112" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
    <text x="250" y="117" text-anchor="middle" font-size="13" fill="#333">1</text>
    <circle cx="62"  cy="160" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="62"  y="165" text-anchor="middle" font-size="13" fill="#2a5a2a">3</text>
    <circle cx="158" cy="160" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="158" y="165" text-anchor="middle" font-size="13" fill="#8a3a3a">1</text>
    <circle cx="308" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="308" y="165" text-anchor="middle" font-size="13" fill="#224">1</text>

    <!-- 路径编号标在叶子旁 -->
    <text x="62"  y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">A</text>
    <text x="158" y="190" text-anchor="middle" font-size="11" fill="#b85450">B</text>
    <text x="308" y="190" text-anchor="middle" font-size="11" fill="#446688">C</text>
  </g>

  <!-- 图例 -->
  <text x="380" y="76" font-size="11" fill="#4a7a3a" filter="url(#rough2)">■ 路径 A 左左 [2,3,3]</text>
  <text x="380" y="96" font-size="11" fill="#b85450" filter="url(#rough2)">■ 路径 B 左右 [2,3,1]</text>
  <text x="380" y="116" font-size="11" fill="#446688" filter="url(#rough2)">■ 路径 C 右右 [2,1,1]</text>

  <!-- ===== 路径 A ===== -->
  <rect x="20" y="205" width="520" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="34" y="225" font-size="12" fill="#2a5a2a" filter="url(#rough2)">A [2,3,3]</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="232" width="30" height="28" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="55"  y="251" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="86"  y="232" width="30" height="28" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="101" y="251" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="132" y="232" width="30" height="28" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="147" y="251" text-anchor="middle" font-size="13" fill="#333">3</text>
    <line x1="70"  y1="246" x2="86"  y2="246" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)"/>
    <line x1="116" y1="246" x2="132" y2="246" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)"/>
  </g>
  <text x="178" y="240" font-size="11" fill="#333" filter="url(#rough2)">mask 演化</text>
  <text x="178" y="258" font-size="12" fill="#2a5a2a" filter="url(#rough2)">000 → 010 → 110 → 010</text>
  <rect x="372" y="234" width="156" height="32" rx="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="450" y="255" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">叶子 010, 1 奇频 ✓</text>

  <!-- ===== 路径 B ===== -->
  <rect x="20" y="285" width="520" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="34" y="305" font-size="12" fill="#8a3a3a" filter="url(#rough2)">B [2,3,1]</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="312" width="30" height="28" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="55"  y="331" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="86"  y="312" width="30" height="28" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="101" y="331" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="132" y="312" width="30" height="28" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="147" y="331" text-anchor="middle" font-size="13" fill="#333">1</text>
    <line x1="70"  y1="326" x2="86"  y2="326" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)"/>
    <line x1="116" y1="326" x2="132" y2="326" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)"/>
  </g>
  <text x="178" y="320" font-size="11" fill="#333" filter="url(#rough2)">mask 演化</text>
  <text x="178" y="338" font-size="12" fill="#8a3a3a" filter="url(#rough2)">000 → 010 → 110 → 111</text>
  <rect x="372" y="314" width="156" height="32" rx="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="450" y="335" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">叶子 111, 3 奇频 ✗</text>

  <!-- ===== 路径 C ===== -->
  <rect x="20" y="365" width="520" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="34" y="385" font-size="12" fill="#224" filter="url(#rough2)">C [2,1,1]</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="392" width="30" height="28" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="55"  y="411" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="86"  y="392" width="30" height="28" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="101" y="411" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="132" y="392" width="30" height="28" rx="5" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="147" y="411" text-anchor="middle" font-size="13" fill="#333">1</text>
    <line x1="70"  y1="406" x2="86"  y2="406" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)"/>
    <line x1="116" y1="406" x2="132" y2="406" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)"/>
  </g>
  <text x="178" y="400" font-size="11" fill="#333" filter="url(#rough2)">mask 演化</text>
  <text x="178" y="418" font-size="12" fill="#224" filter="url(#rough2)">000 → 010 → 011 → 010</text>
  <rect x="372" y="394" width="156" height="32" rx="6" fill="#446688" filter="url(#rough2)"/>
  <text x="450" y="415" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">叶子 010, 1 奇频 ✓</text>

  <!-- 结论 -->
  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    两条 ✓ 路径 → count = 2　　（两次翻转互抵 → 偶数次归零）
  </text>
</svg>
