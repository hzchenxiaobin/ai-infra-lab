<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Start -->
  <ellipse cx="280" cy="28" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="33" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M280,46 L280,52" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort -->
  <rect x="170" y="54" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">按 end 升序排序 tasks</text>

  <path d="M280,90 L280,104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="130" y="106" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一任务 [s,e,d]；已无剩余？</text>

  <!-- yes -> end (route right, y=116) -->
  <path d="M430,116 L540,116 L540,459 L372,459" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="110" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no -> count -->
  <path d="M280,146 L280,162" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Count -->
  <rect x="110" y="164" width="340" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">统计 [s, e] 内已开机点数 cnt</text>

  <path d="M280,202 L280,212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="280,214 365,250 280,286 195,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt ≥ d ?</text>

  <!-- yes -> skip (right) -->
  <path d="M365,250 L398,250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="231" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="455" y="255" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">跳过</text>

  <!-- no -> need (down) -->
  <path d="M280,286 L280,302" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="298" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Need -->
  <rect x="180" y="304" width="200" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">need = d − cnt</text>

  <path d="M280,342 L280,356" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Fill -->
  <rect x="100" y="358" width="360" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">从 e 向左选 need 个未开机点开机</text>

  <!-- loop back: fill -> loop header (left side, y=136) -->
  <path d="M100,377 L55,377 L55,136 L128,136" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- loop back: skip -> loop header (right side, y=136) -->
  <path d="M455,231 L455,136 L432,136" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End box -->
  <rect x="190" y="440" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回开机点总数 Σ on[i]</text>
</svg>
