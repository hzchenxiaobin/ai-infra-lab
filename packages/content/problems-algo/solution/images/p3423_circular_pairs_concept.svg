<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">循环数组：首尾也是邻居</text>
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums = [1, 2, 4]</text>

  <!-- 相邻对箭头：1 -> 2 -->
  <path d="M 163 141 Q 195 165 213 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 相邻对箭头：2 -> 4 -->
  <path d="M 206 231 Q 150 241 95 233" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 首尾相连箭头：4 -> 1（红色强调） -->
  <path d="M 78 205 Q 95 165 117 143" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 节点 nums[0] = 1 -->
  <circle cx="140" cy="120" r="27" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="126" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">nums[0]</text>

  <!-- 节点 nums[1] = 2 -->
  <circle cx="235" cy="225" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="231" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="266" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">nums[1]</text>

  <!-- 节点 nums[2] = 4 -->
  <circle cx="65" cy="230" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="236" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="40" y="263" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">nums[2]</text>

  <!-- 环内差值标注 -->
  <text x="200" y="168" font-size="12" fill="#446688" filter="url(#rough2)">|2−1|=1</text>
  <text x="150" y="222" font-size="12" fill="#446688" filter="url(#rough2)">|4−2|=2</text>
  <text x="152" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">|4−1| = 3</text>
  <text x="152" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首尾相连，别漏!</text>

  <!-- 右侧说明面板 -->
  <rect x="320" y="72" width="180" height="200" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">n 个元素 → n 对相邻</text>
  <text x="410" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1, 2) → 差 1</text>
  <text x="410" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2, 4) → 差 2</text>
  <text x="410" y="184" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">(4, 1) → 差 3 ★</text>
  <path d="M 340 200 L 480 200" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">最大差正来自首尾对!</text>

  <!-- 底部技巧框 -->
  <rect x="35" y="300" width="450" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#2a4a6a" filter="url(#rough2)">💡 邻居下标用 (i+1) % n：i = n−1 时自动接回 nums[0]</text>
</svg>
