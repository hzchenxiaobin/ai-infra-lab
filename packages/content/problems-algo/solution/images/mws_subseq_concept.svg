<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fdfcf7"/>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">727 最小窗口子序列：T 按序匹配进 W</text>
  <path d="M 210 42 Q 360 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- S label -->
  <text x="40" y="112" font-size="13" font-weight="bold" fill="#2b6e9e">S =</text>
  <!-- window highlight behind boxes 1..4 -->
  <g filter="url(#sk)"><rect x="120" y="82" width="180" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="210" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">W = bcde（长度 4）</text>

  <!-- S boxes: a b c d e b d d e -->
  <!-- positions: x = 80 + j*44, w=40, y=88, h=34 -->
  <g filter="url(#sk)"><rect x="80"  y="88" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="124" y="88" width="40" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="168" y="88" width="40" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="88" width="40" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="256" y="88" width="40" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="300" y="88" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="344" y="88" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="388" y="88" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="432" y="88" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>

  <!-- S chars -->
  <text x="100" y="110" text-anchor="middle" font-size="13" fill="#888">a</text>
  <text x="144" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="188" y="110" text-anchor="middle" font-size="13" fill="#888">c</text>
  <text x="232" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">d</text>
  <text x="276" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="320" y="110" text-anchor="middle" font-size="13" fill="#888">b</text>
  <text x="364" y="110" text-anchor="middle" font-size="13" fill="#888">d</text>
  <text x="408" y="110" text-anchor="middle" font-size="13" fill="#888">d</text>
  <text x="452" y="110" text-anchor="middle" font-size="13" fill="#888">e</text>

  <!-- S indices -->
  <text x="100" y="138" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="144" y="138" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="188" y="138" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="232" y="138" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="276" y="138" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="364" y="138" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="408" y="138" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="452" y="138" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- T label -->
  <text x="40" y="234" font-size="13" font-weight="bold" fill="#b85450">T =</text>
  <text x="40" y="252" font-size="10" fill="#888">(子序列)</text>
  <!-- T boxes: b under S[1](x144), d under S[3](x232), e under S[4](x276) -->
  <g filter="url(#sk)"><rect x="126" y="218" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="214" y="218" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="258" y="218" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="144" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">b</text>
  <text x="232" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">d</text>
  <text x="276" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">e</text>

  <!-- arrows T -> S (vertical, up) -->
  <path d="M 144 218 L 144 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 232 218 L 232 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 276 218 L 276 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- dp definition note -->
  <g filter="url(#sk)">
    <rect x="40" y="288" width="640" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="312" font-size="12" font-weight="bold" fill="#7a5415">核心定义（DP 状态）</text>
  <text x="60" y="334" font-size="11" fill="#444">dp[i][j] = 以 S[i] 为结尾的子串中，能匹配 T[0..j] 作为子序列的「最大起始下标」k</text>
  <text x="60" y="352" font-size="11" fill="#444">→ 固定结尾 i，k 越大 → 窗口 S[k..i] 越短；故取「最大 k」即该结尾的最短窗口</text>
  <text x="60" y="370" font-size="11" fill="#b85450">⚠ 与 76 不同：T 须按序作为子序列（顺序敏感），不是字符集合的覆盖</text>
</svg>
