<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心配面值算法流程</text>

  <!-- A: Start oval -->
  <rect x="190" y="40" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">开始：输入 num，ans = ""</text>

  <!-- arrow A -> B -->
  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: process rect -->
  <rect x="170" y="98" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="12" fill="#333">从大到小取下一个面值对 (v, s)</text>

  <!-- arrow B -> C -->
  <path d="M 280 142 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: decision diamond: num >= v ? -->
  <polygon points="280,162 388,200 280,238 172,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">num ≥ v ?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#888">（能减这个面值）</text>

  <!-- arrow C -> D (Yes, right) -->
  <path d="M 388 200 L 426 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- D: process rect: append symbol -->
  <rect x="428" y="178" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="488" y="198" text-anchor="middle" font-size="11" fill="#333">ans += s</text>
  <text x="488" y="213" text-anchor="middle" font-size="11" fill="#333">num −= v</text>

  <!-- loop D back up to C top -->
  <path d="M 488 178 L 488 150 L 280 150 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="146" text-anchor="middle" font-size="9" fill="#b85450">继续减同一面值</text>

  <!-- arrow C -> E (No, down) -->
  <path d="M 280 238 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="258" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- E: decision diamond: pairs exhausted? -->
  <polygon points="280,272 388,310 280,348 172,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">面值表遍历完?</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">（或 num == 0）</text>

  <!-- loop E -> B (No, left side up) -->
  <path d="M 172 310 L 110 310 L 110 120 L 170 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否，</text>
  <text x="96" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">取下一个</text>

  <!-- arrow E -> F (Yes, down) -->
  <path d="M 280 348 L 280 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- F: end oval -->
  <rect x="190" y="376" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="12" fill="#333">返回 ans（罗马数字串）</text>

  <!-- bottom note -->
  <rect x="40" y="424" width="480" height="12" fill="none"/>
  <text x="280" y="434" text-anchor="middle" font-size="9" fill="#888">内层 while 可连续减同一面值（如 2000 = M + M）；面值 1 兜底，遍历完 num 必为 0</text>
</svg>
