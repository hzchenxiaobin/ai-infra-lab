<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：发现列名 → 拼接 SQL → 预备执行</text>

  <!-- ===== Step 0: SET group_concat_max_len ===== -->
  <rect x="40" y="44" width="240" height="36" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">SET group_concat_max_len = 5000</text>
  <text x="160" y="72" text-anchor="middle" font-size="7" fill="#888">默认 1024 字节不够 30 列，先放大</text>

  <path d="M 160 82 L 160 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: information_schema.columns ===== -->
  <rect x="30" y="100" width="260" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① information_schema.columns</text>
  <text x="160" y="134" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">WHERE table_schema = DATABASE()</text>
  <text x="160" y="146" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">  AND table_name = 'Products'</text>
  <text x="160" y="158" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">  AND column_name != 'product_id'</text>
  <text x="160" y="172" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">→ 发现列名: LC_Store, Nozama, Shop, Souq</text>

  <path d="M 160 182 L 160 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP_CONCAT build SQL string ===== -->
  <rect x="30" y="200" width="260" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② GROUP_CONCAT 拼接</text>
  <text x="160" y="234" text-anchor="middle" font-size="7" fill="#666" font-family="monospace">SELECT GROUP_CONCAT(</text>
  <text x="160" y="246" text-anchor="middle" font-size="7" fill="#666" font-family="monospace">'SELECT product_id, ''', column_name,</text>
  <text x="160" y="258" text-anchor="middle" font-size="7" fill="#666" font-family="monospace">''' store, ', column_name, ' price FROM Products</text>
  <text x="160" y="270" text-anchor="middle" font-size="7" fill="#666" font-family="monospace">WHERE ', column_name, ' IS NOT NULL'</text>
  <text x="160" y="282" text-anchor="middle" font-size="7" fill="#b85450" font-family="monospace">SEPARATOR ' UNION ALL '</text>
  <text x="160" y="294" text-anchor="middle" font-size="7" fill="#d6a040" font-family="monospace">) INTO @sql FROM t;</text>

  <path d="M 160 302 L 160 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: PREPARE ===== -->
  <rect x="30" y="320" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③ PREPARE stmt FROM @sql</text>
  <text x="160" y="354" text-anchor="middle" font-size="8" fill="#888">把字符串编译为可执行的 SQL 语句</text>

  <path d="M 160 366 L 160 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: EXECUTE + DEALLOCATE ===== -->
  <rect x="30" y="384" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="404" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">④ EXECUTE stmt</text>
  <text x="160" y="418" text-anchor="middle" font-size="8" fill="#666" font-family="monospace">DEALLOCATE PREPARE stmt</text>
  <text x="160" y="430" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">→ 返回 unpivot 结果集</text>

  <path d="M 160 442 L 160 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: result ===== -->
  <rect x="40" y="460" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="478" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">结果（product_id, store, price）</text>
  <text x="160" y="494" text-anchor="middle" font-size="8" fill="#888">6 行，null 已过滤</text>

  <!-- ===== Right: generated SQL preview ===== -->
  <rect x="320" y="100" width="270" height="404" fill="#f4f8fc" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="455" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">@sql 生成的动态 SQL</text>
  <line x1="334" y1="128" x2="576" y2="128" stroke="#dde6f0" stroke-width="1" filter="url(#rough2)"/>

  <text x="336" y="146" font-size="7" fill="#888" font-family="monospace">SELECT product_id, 'LC_Store' store,</text>
  <text x="336" y="156" font-size="7" fill="#666" font-family="monospace">  LC_Store price FROM Products</text>
  <text x="336" y="166" font-size="7" fill="#b85450" font-family="monospace">  WHERE LC_Store IS NOT NULL</text>
  <text x="336" y="178" font-size="7" fill="#d6a040" font-weight="bold" font-family="monospace">UNION ALL</text>

  <text x="336" y="194" font-size="7" fill="#888" font-family="monospace">SELECT product_id, 'Nozama' store,</text>
  <text x="336" y="204" font-size="7" fill="#666" font-family="monospace">  Nozama price FROM Products</text>
  <text x="336" y="214" font-size="7" fill="#b85450" font-family="monospace">  WHERE Nozama IS NOT NULL</text>
  <text x="336" y="226" font-size="7" fill="#d6a040" font-weight="bold" font-family="monospace">UNION ALL</text>

  <text x="336" y="242" font-size="7" fill="#888" font-family="monospace">SELECT product_id, 'Shop' store,</text>
  <text x="336" y="252" font-size="7" fill="#666" font-family="monospace">  Shop price FROM Products</text>
  <text x="336" y="262" font-size="7" fill="#b85450" font-family="monospace">  WHERE Shop IS NOT NULL</text>
  <text x="336" y="274" font-size="7" fill="#d6a040" font-weight="bold" font-family="monospace">UNION ALL</text>

  <text x="336" y="290" font-size="7" fill="#888" font-family="monospace">SELECT product_id, 'Souq' store,</text>
  <text x="336" y="300" font-size="7" fill="#666" font-family="monospace">  Souq price FROM Products</text>
  <text x="336" y="310" font-size="7" fill="#b85450" font-family="monospace">  WHERE Souq IS NOT NULL</text>
  <text x="336" y="322" font-size="7" fill="#888" font-family="monospace">;</text>

  <!-- annotation: column names come from schema -->
  <rect x="336" y="340" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="456" y="358" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">列名来源</text>
  <text x="346" y="372" font-size="7" fill="#666">'LC_Store' 等字符串不是手写的</text>
  <text x="346" y="382" font-size="7" fill="#666">而是 information_schema.columns</text>
  <text x="346" y="392" font-size="7" fill="#666">返回的 column_name 值拼入</text>
  <text x="346" y="402" font-size="7" fill="#4a7a3a" font-weight="bold">→ 列名「数据化」，运行时适应</text>

  <!-- annotation: UNION ALL vs UNION -->
  <rect x="336" y="420" width="240" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="456" y="438" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">UNION ALL vs UNION</text>
  <text x="346" y="452" font-size="7" fill="#666">每个 (product_id, store) 对唯一</text>
  <text x="346" y="462" font-size="7" fill="#666">UNION ALL 不去重，更快</text>
  <text x="346" y="472" font-size="7" fill="#666">UNION 会去重，多一次排序</text>
  <text x="346" y="484" font-size="7" fill="#4a7a3a" font-weight="bold">→ 推荐 UNION ALL</text>
</svg>
