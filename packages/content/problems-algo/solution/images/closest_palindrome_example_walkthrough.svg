<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = "123"（k=3, half=2, prefix=12）</text>

  <!-- n = 123 with prefix highlighted -->
  <text x="44" y="58" font-size="12" fill="#888">n =</text>
  <rect x="80" y="38" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="59" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="38" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="59" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="38" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="59" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">3</text>
  <text x="146" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">prefix=12</text>
  <text x="190" y="88" text-anchor="middle" font-size="9" fill="#999">待覆盖</text>

  <!-- Table header -->
  <rect x="40" y="108" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选来源</text>
  <text x="170" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前缀值</text>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">镜像过程</text>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">回文值</text>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">|差|</text>

  <!-- Row 1: prefix-1 = 11 -> 111 (orange) -->
  <rect x="40" y="140" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#d6a040">prefix−1</text>
  <text x="170" y="158" text-anchor="middle" font-size="11" fill="#333">11</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#555">"11"+reverse("1")</text>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">111</text>
  <text x="470" y="158" text-anchor="middle" font-size="11" fill="#d6a040">12</text>

  <!-- Row 2: prefix = 12 -> 121 (green, answer) -->
  <rect x="40" y="172" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">prefix</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#555">"12"+reverse("1")</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">121</text>
  <text x="470" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 ← min</text>

  <!-- Row 3: prefix+1 = 13 -> 131 (blue) -->
  <rect x="40" y="204" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="11" fill="#446688">prefix+1</text>
  <text x="170" y="222" text-anchor="middle" font-size="11" fill="#333">13</text>
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="#555">"13"+reverse("1")</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">131</text>
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#446688">8</text>

  <!-- Divider -->
  <line x1="60" y1="244" x2="500" y2="244" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="9" fill="#999">— 边界候选 —</text>

  <!-- Row 4: 10^(k-1)-1 = 99 (red) -->
  <rect x="40" y="252" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="270" text-anchor="middle" font-size="10" fill="#b85450">10^(k−1)−1</text>
  <text x="170" y="270" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#555">短一位全 9</text>
  <text x="380" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">99</text>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#b85450">24</text>

  <!-- Row 5: 10^k+1 = 1001 (red) -->
  <rect x="40" y="284" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="302" text-anchor="middle" font-size="10" fill="#b85450">10^k+1</text>
  <text x="170" y="302" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="270" y="302" text-anchor="middle" font-size="10" fill="#555">长一位 10…01</text>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1001</text>
  <text x="470" y="302" text-anchor="middle" font-size="11" fill="#b85450">878</text>

  <!-- Arrow down to answer -->
  <line x1="380" y1="320" x2="380" y2="340" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="140" y="348" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案："121"</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#666">最小距离 = 2，排除自身后 121 胜出</text>

  <!-- Edge case note -->
  <rect x="60" y="395" width="440" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="9" fill="#888">对照：n="999" → 1001（边界胜）；n="1000" → 999（平手取较小）</text>
</svg>
