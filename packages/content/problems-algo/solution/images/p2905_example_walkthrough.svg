<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5, 1, 4, 1]，D = 2，V = 4</text>

  <rect x="40" y="48" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="100" y="48" width="115" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="215" y="48" width="115" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="330" y="48" width="115" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="445" y="48" width="95" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="70" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="70" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">当前</text>
  <text x="157" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">纳入 r = j−D</text>
  <text x="157" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">先纳入，再检查</text>
  <text x="272" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 min</text>
  <text x="272" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(下标, 值)</text>
  <text x="387" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 max</text>
  <text x="387" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(下标, 值)</text>
  <text x="492" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">检查</text>
  <text x="492" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">mn差 / mx差</text>

  <rect x="40" y="92" width="60" height="48" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="92" width="115" height="48" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="92" width="115" height="48" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="330" y="92" width="115" height="48" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="445" y="92" width="95" height="48" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="70" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = 0（值 5）</text>
  <text x="272" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 5)</text>
  <text x="387" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 5)</text>
  <text x="492" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1 ✗ / 1 ✗</text>

  <rect x="40" y="140" width="60" height="48" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="140" width="115" height="48" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="140" width="115" height="48" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="330" y="140" width="115" height="48" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="445" y="140" width="95" height="48" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="70" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="157" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = 1（值 1）</text>
  <text x="262" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1, 1)</text>
  <text x="262" y="179" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">↓ 更新</text>
  <text x="387" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 5)</text>
  <text x="492" y="169" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ✗ / 4 ✓</text>

  <path d="M 492 192 L 470 214" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="40" y="216" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="234" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">边界提醒：4 ≥ 4 含等于，压线即达标</text>
  <text x="165" y="250" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">D = V = 0 时首轮 j = 0 即返回 [0, 0]</text>

  <rect x="330" y="216" width="210" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 [0, 3]</text>
  <text x="435" y="251" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">|nums[3] − nums[0]| = |1 − 5| = 4 ≥ 4</text>

  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">不变式：检查 j 之前，minIdx / maxIdx 恰为 [0, j−D] 的最值下标</text>
  <text x="290" y="320" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">先纳入 r = j−D，再检查 min / max 两个代表 —— 两轮锁定答案</text>
</svg>
