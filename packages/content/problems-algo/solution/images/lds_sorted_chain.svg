<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fdfcf7"/>

  <text x="310" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">排序把「任意配对」变成「链式传递」</text>
  <path d="M 180 42 Q 310 50 440 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 原始未排序 -->
  <text x="40" y="92" font-size="12" fill="#888" font-weight="bold">原始 nums</text>
  <g filter="url(#sk)">
    <rect x="100" y="76" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="155" y="76" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="210" y="76" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="265" y="76" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <text x="127" y="97" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="182" y="97" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="237" y="97" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>
  <text x="292" y="97" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="345" y="97" font-size="11" fill="#b85450">← 配对关系杂乱，下标方向 ≠ 大小方向</text>

  <!-- 排序箭头 -->
  <path d="M 195 122 L 195 148" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="205" y="140" font-size="11" fill="#3a3a3a" font-weight="bold">sort()</text>

  <!-- 排序后链 -->
  <text x="40" y="178" font-size="12" fill="#888" font-weight="bold">升序链</text>
  <g filter="url(#sk)">
    <rect x="100" y="162" width="55" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/>
    <rect x="180" y="162" width="55" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/>
    <rect x="260" y="162" width="55" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/>
    <rect x="340" y="162" width="55" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/>
  </g>
  <text x="127" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="207" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="287" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="367" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>

  <!-- 相邻整除箭头 -->
  <path d="M 155 178 L 180 178" stroke="#4a8e4a" stroke-width="1.6" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 235 178 L 260 178" stroke="#4a8e4a" stroke-width="1.6" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 315 178 L 340 178" stroke="#4a8e4a" stroke-width="1.6" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="167" y="156" text-anchor="middle" font-size="10" fill="#4a8e4a">1|2</text>
  <text x="247" y="156" text-anchor="middle" font-size="10" fill="#4a8e4a">2|4</text>
  <text x="327" y="156" text-anchor="middle" font-size="10" fill="#4a8e4a">4|8</text>

  <!-- 传递性说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="220" width="540" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="244" font-size="13" fill="#2b2b2b" font-weight="bold">传递性：a | b 且 b | c  ⟹  a | c</text>

  <text x="60" y="272" font-size="12" fill="#444">• 相邻整除：1|2 ✓ ，2|4 ✓ ，4|8 ✓</text>
  <text x="60" y="294" font-size="12" fill="#444">• 推导得：1|4 ✓ （由 1|2, 2|4），1|8 ✓ （由 1|2, 2|4, 4|8），2|8 ✓</text>
  <text x="60" y="316" font-size="12" fill="#444">• 故整条链 [1,2,4,8] 任意两两整除，是一条「整除链」</text>

  <text x="60" y="346" font-size="12" fill="#c98a2b" font-weight="bold">结论：升序后只需保证「相邻整除」即可保证「全链两两整除」</text>
  <text x="60" y="368" font-size="11" fill="#888">⇒ 问题转化为：在升序数组里找最长的「每个元素整除下一个」的链 = LIS 结构</text>

  <text x="310" y="404" text-anchor="middle" font-size="11" fill="#888">排序 O(n log n) 使整除关系沿下标方向可传递，DP 只需查前驱</text>
</svg>
