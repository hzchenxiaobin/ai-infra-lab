<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程：逐字符写入</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: result = ""</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: a==0 and b==0? -->
  <polygon points="270,104 390,152 270,200 150,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#333">a==0 且 b==0 ?</text>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#666">(字符已用完)</text>

  <!-- Yes branch -> End -->
  <path d="M 390 152 L 470 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="144" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="488" cy="152" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="156" text-anchor="middle" font-size="12" fill="#333">返回 result</text>

  <!-- No branch down -->
  <path d="M 270 200 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="11" fill="#b85450">否</text>

  <!-- Decision: last 2 chars same? -->
  <polygon points="270,222 400,272 270,322 140,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12" fill="#333">末尾 2 字符相同?</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#666">(result[-1]==result[-2])</text>

  <!-- Yes (forced switch) -> left branch -->
  <path d="M 140 272 L 100 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="250" width="78" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="59" y="268" text-anchor="middle" font-size="10" fill="#333">强制写另一个</text>
  <text x="59" y="284" text-anchor="middle" font-size="10" fill="#555">aa→b / bb→a</text>

  <!-- No branch down -->
  <path d="M 270 322 L 270 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="336" font-size="11" fill="#82b366">否</text>

  <!-- Decision: a >= b? -->
  <polygon points="270,344 380,388 270,432 160,388" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="12" fill="#333">a &gt;= b ?</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#666">(多数优先)</text>

  <!-- a >= b -> right write 'a' -->
  <path d="M 380 388 L 440 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="380" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="442" y="370" width="82" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="483" y="392" text-anchor="middle" font-size="10" fill="#333">写 'a'; a--</text>

  <!-- b > a -> left write 'b' -->
  <path d="M 160 388 L 120 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="370" width="98" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="69" y="392" text-anchor="middle" font-size="10" fill="#333">写 'b'; b--</text>

  <!-- merge: all three branches loop back to top decision -->
  <!-- forced switch loops from (59,294) up to (270,152) -->
  <path d="M 59 294 L 59 440 L 530 440 L 530 152 L 512 152" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- write 'a' loops from (483,406) -->
  <path d="M 483 406 L 483 440" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- write 'b' loops from (69,406) -->
  <path d="M 69 406 L 69 440" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="270" y="454" text-anchor="middle" font-size="10" fill="#888">继续循环（共 a+b 轮，每轮 O(1)）</text>
</svg>
