<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：桶分桶 + 滑动窗口</text>
  <path d="M 140 42 Q 280 50 420 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="70" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333">开始</text>
  <path d="M 280 88 L 280 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个 nums[i] -->
  <g filter="url(#rough2)">
    <rect x="190" y="102" width="180" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333">取下一个 nums[i]</text>
  <path d="M 280 138 L 280 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 bucket -->
  <g filter="url(#rough2)">
    <rect x="170" y="152" width="220" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="175" text-anchor="middle" font-size="13" fill="#333">bucket = ⌊nums[i] / w⌋，w = t+1</text>
  <path d="M 280 188 L 280 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形：三桶检查 -->
  <g filter="url(#rough2)">
    <polygon points="280,202 430,256 280,310 130,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333">同桶有元素？</text>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">或邻桶有元素</text>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333">且 |差| ≤ t？</text>

  <!-- 是 → 返回 true -->
  <path d="M 430 256 L 462 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="444" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#rough2)">
    <ellipse cx="510" cy="256" rx="46" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="510" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 true</text>

  <!-- 否 → 放入桶 -->
  <path d="M 280 310 L 280 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="320" font-size="11" font-weight="bold" fill="#666">否</text>

  <g filter="url(#rough2)">
    <rect x="180" y="324" width="200" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="280" y="347" text-anchor="middle" font-size="13" fill="#333">buckets[bucket] = nums[i]</text>
  <path d="M 280 360 L 280 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 2：i >= indexDiff -->
  <g filter="url(#rough2)">
    <polygon points="280,374 370,406 280,438 190,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="411" text-anchor="middle" font-size="12" fill="#333">i ≥ indexDiff ?</text>

  <!-- 是 → 删旧 -->
  <path d="M 370 406 L 398 406" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#rough2)">
    <rect x="400" y="388" width="148" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="474" y="411" text-anchor="middle" font-size="11" fill="#333">删 buckets[旧桶]</text>
  <!-- 删完后回到取下一个 -->
  <path d="M 474 424 L 474 440 L 100 440 L 100 120 L 190 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5,3"/>

  <!-- 否 → 回到取下一个 -->
  <path d="M 190 406 L 100 406 L 100 120 L 190 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">否</text>

  <!-- 循环结束 → 返回 false -->
  <path d="M 100 120 L 100 90 L 60 90" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="80" y="84" font-size="10" fill="#888">无下一个</text>
  <g filter="url(#rough2)">
    <ellipse cx="48" cy="90" rx="40" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="48" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 false</text>
</svg>
