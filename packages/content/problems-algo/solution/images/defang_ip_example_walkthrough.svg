<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：address = "1.1.1.1" → "1[.]1[.]1[.]1"</text>

  <!-- Input chars with index -->
  <text x="60" y="68" font-size="11" fill="#888">下标:</text>
  <text x="124" y="68" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="172" y="68" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="220" y="68" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="268" y="68" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="316" y="68" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="364" y="68" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="412" y="68" text-anchor="middle" font-size="10" fill="#888">6</text>

  <text x="60" y="92" font-size="11" fill="#888">字符:</text>
  <!-- char 0: '1' -->
  <rect x="104" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- char 1: '.' -->
  <rect x="152" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <!-- char 2: '1' -->
  <rect x="200" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- char 3: '.' -->
  <rect x="248" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <!-- char 4: '1' -->
  <rect x="296" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- char 5: '.' -->
  <rect x="344" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <!-- char 6: '1' -->
  <rect x="392" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Step table header -->
  <rect x="40" y="130" width="480" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前字符</text>
  <text x="320" y="148" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">操作</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">res 累积</text>

  <!-- Step rows -->
  <!-- Step 0 -->
  <rect x="40" y="160" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="176" text-anchor="middle" font-size="10" fill="#333">i=0</text>
  <text x="200" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">'1'</text>
  <text x="320" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a">追加 '1'</text>
  <text x="450" y="176" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1"</text>

  <!-- Step 1 -->
  <rect x="40" y="184" width="480" height="24" fill="#fff8e1" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="10" fill="#333">i=1</text>
  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">'.'</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#b85450">追加 "[.]"</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]"</text>

  <!-- Step 2 -->
  <rect x="40" y="208" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="224" text-anchor="middle" font-size="10" fill="#333">i=2</text>
  <text x="200" y="224" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">'1'</text>
  <text x="320" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">追加 '1'</text>
  <text x="450" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]1"</text>

  <!-- Step 3 -->
  <rect x="40" y="232" width="480" height="24" fill="#fff8e1" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="248" text-anchor="middle" font-size="10" fill="#333">i=3</text>
  <text x="200" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">'.'</text>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#b85450">追加 "[.]"</text>
  <text x="450" y="248" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]1[.]"</text>

  <!-- Step 4 -->
  <rect x="40" y="256" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="272" text-anchor="middle" font-size="10" fill="#333">i=4</text>
  <text x="200" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">'1'</text>
  <text x="320" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">追加 '1'</text>
  <text x="450" y="272" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]1[.]1"</text>

  <!-- Step 5 -->
  <rect x="40" y="280" width="480" height="24" fill="#fff8e1" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="296" text-anchor="middle" font-size="10" fill="#333">i=5</text>
  <text x="200" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">'.'</text>
  <text x="320" y="296" text-anchor="middle" font-size="10" fill="#b85450">追加 "[.]"</text>
  <text x="450" y="296" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]1[.]1[.]"</text>

  <!-- Step 6 -->
  <rect x="40" y="304" width="480" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="320" text-anchor="middle" font-size="10" fill="#333">i=6</text>
  <text x="200" y="320" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">'1'</text>
  <text x="320" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a">追加 '1'</text>
  <text x="450" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"1[.]1[.]1[.]1"</text>

  <!-- Final result -->
  <rect x="40" y="344" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">最终结果："1[.]1[.]1[.]1"</text>

  <!-- Scan arrow -->
  <path d="M 104 118 L 412 118" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">从左到右逐字符扫描 →</text>

  <!-- Bottom note -->
  <rect x="60" y="396" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每遇到 "." 就把 1 个字符扩展为 3 个字符 "[.]"，其余字符不变</text>
</svg>
