<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：四条可行路径 (fuel=5)</text>

  <!-- 城市位置数轴 -->
  <text x="40" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">位置</text>
  <line x1="60" y1="68" x2="540" y2="68" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 城市节点: pos2=城市0, pos3=城市1(start), pos4=城市4, pos6=城市2, pos8=城市3(finish) -->
  <!-- 映射: pos p -> x = 60 + (p-2)*60  => pos2:60, pos3:120, pos4:180, pos6:300, pos8:420 -->

  <!-- city 0 pos 2 -->
  <ellipse cx="60" cy="68" rx="14" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="60" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">pos=2</text>

  <!-- city 1 pos 3 (start) -->
  <ellipse cx="120" cy="68" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pos=3 起</text>

  <!-- city 4 pos 4 -->
  <ellipse cx="180" cy="68" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="72" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="180" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">pos=4</text>

  <!-- city 2 pos 6 -->
  <ellipse cx="300" cy="68" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="300" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">pos=6</text>

  <!-- city 3 pos 8 (finish) -->
  <ellipse cx="420" cy="68" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="420" y="96" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">pos=8 终</text>

  <!-- 四条路径 -->
  <!-- 路径1: 1->3 直接 -->
  <text x="30" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">①</text>
  <path d="M120 124 Q 270 150 420 124" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="270" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 → 3   cost = 5</text>

  <!-- 路径2: 1->2->3 -->
  <text x="30" y="200" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">②</text>
  <path d="M120 184 Q 210 210 300 184" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M300 184 Q 360 210 420 184" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="210" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">cost 3</text>
  <text x="360" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">cost 2</text>
  <text x="270" y="238" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1 → 2 → 3   总 cost = 5</text>

  <!-- 路径3: 1->4->3 -->
  <text x="30" y="268" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">③</text>
  <path d="M120 252 Q 150 278 180 252" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M180 252 Q 300 285 420 252" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="150" y="288" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">cost 1</text>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">cost 4</text>
  <text x="270" y="306" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1 → 4 → 3   总 cost = 5</text>

  <!-- 路径4: 1->4->2->3 -->
  <text x="30" y="340" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">④</text>
  <path d="M120 324 Q 150 350 180 324" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M180 324 Q 240 355 300 324" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M300 324 Q 360 355 420 324" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="150" y="360" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="240" y="360" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="360" y="360" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1 → 4 → 2 → 3   总 cost = 5</text>

  <!-- 结论框 -->
  <rect x="50" y="396" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="418" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">dfs(1, 5) = 0+0+1+1+2 = 4   ✓</text>
</svg>
