<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">代价表 cost[i][j]：以 s = "abc" 为例</text>

  <!-- String display -->
  <text x="30" y="56" font-size="11" fill="#888">下标:</text>
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="160" y="56" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="220" y="56" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="30" y="76" font-size="11" fill="#888">字符:</text>
  <rect x="76" y="62" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="81" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="136" y="62" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="81" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="196" y="62" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="81" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- cost table header -->
  <text x="30" y="120" font-size="11" fill="#888">cost</text>
  <text x="100" y="120" text-anchor="middle" font-size="10.5" fill="#888">j=0</text>
  <text x="160" y="120" text-anchor="middle" font-size="10.5" fill="#888">j=1</text>
  <text x="220" y="120" text-anchor="middle" font-size="10.5" fill="#888">j=2</text>

  <!-- Row i=0 -->
  <text x="55" y="146" text-anchor="middle" font-size="10.5" fill="#888">i=0</text>
  <rect x="76" y="128" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="147" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="136" y="128" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="147" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="196" y="128" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row i=1 -->
  <text x="55" y="182" text-anchor="middle" font-size="10.5" fill="#888">i=1</text>
  <rect x="76" y="164" width="48" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="183" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="136" y="164" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="183" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="196" y="164" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="183" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row i=2 -->
  <text x="55" y="218" text-anchor="middle" font-size="10.5" fill="#888">i=2</text>
  <rect x="76" y="200" width="48" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="219" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="136" y="200" width="48" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="219" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="196" y="200" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="219" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- Legend -->
  <rect x="300" y="128" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="140" font-size="10.5" fill="#555">对角线 = 0（单字符）</text>
  <rect x="300" y="148" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="160" font-size="10.5" fill="#555">需修改（两端不同）</text>
  <rect x="300" y="168" width="14" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="180" font-size="10.5" fill="#555">i &gt; j（无效区域）</text>

  <!-- Recurrence formula box -->
  <rect x="280" y="200" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="218" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cost[i][j] = cost[i+1][j-1]</text>
  <text x="390" y="234" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">           + (s[i] ≠ s[j])</text>

  <!-- Example arrows: cost[0][2] depends on cost[1][1] -->
  <text x="30" y="260" font-size="11" fill="#888" font-weight="bold">填表示例：cost[0][2]（"abc"→回文）</text>
  <rect x="76" y="272" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="291" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="136" y="272" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="291" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="196" y="272" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="291" text-anchor="middle" font-size="11" fill="#333">c</text>

  <!-- arrow: s[0] vs s[2] -->
  <path d="M 100 304 L 100 316 L 220 316 L 220 304" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="160" y="330" text-anchor="middle" font-size="10" fill="#b85450">a ≠ c → +1</text>

  <!-- arrow: cost[1][1] -->
  <path d="M 160 272 L 160 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">cost[1][1]=0</text>

  <!-- Result -->
  <rect x="300" y="312" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cost[0][2] = 0 + 1 = 1</text>
  <text x="400" y="346" text-anchor="middle" font-size="10" fill="#888">改 a→c 得 "cbc" 或 c→a 得 "aba"</text>
</svg>
