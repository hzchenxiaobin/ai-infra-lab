<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每步恰好摘 1 朵 → 对局长度固定 → 胜负只看奇偶</text>

  <!-- flower rows -->
  <text x="70" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一排</text>
  <circle cx="110" cy="62" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="110" cy="62" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="138" cy="62" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="138" cy="62" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="166" cy="62" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="166" cy="62" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="194" cy="62" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="194" cy="62" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="226" y="66" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">x 朵</text>

  <text x="70" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二排</text>
  <circle cx="110" cy="94" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="110" cy="94" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="138" cy="94" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="138" cy="94" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="166" cy="94" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="166" cy="94" r="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="196" y="98" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">y 朵</text>

  <text x="350" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">共 N = x + y 朵</text>
  <text x="350" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（每一步：任选一排，摘 1 朵）</text>

  <text x="260" y="130" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">总数每步恰减 1 → 对局恰好进行 N = x + y 步，怎么选都一样！</text>

  <!-- left panel: odd -->
  <rect x="34" y="150" width="222" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x + y = 奇数（如 1 + 2 = 3）</text>
  <rect x="55" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="81" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1·A</text>
  <rect x="119" y="184" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2·B</text>
  <rect x="183" y="184" width="52" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3·A</text>
  <text x="145" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 3 步（最后）是 Alice → Alice 赢 ✓</text>

  <!-- right panel: even -->
  <rect x="272" y="150" width="222" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="383" y="172" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x + y = 偶数（如 1 + 1 = 2）</text>
  <rect x="320" y="184" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1·A</text>
  <rect x="390" y="184" width="56" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="418" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2·B</text>
  <text x="383" y="240" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 2 步（最后）是 Bob → Bob 赢 ✗</text>

  <!-- conclusion -->
  <rect x="48" y="268" width="424" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Alice 必胜 ⇔ x + y 为奇 ⇔ x、y 一奇一偶</text>
  <text x="260" y="309" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">策略完全不改变对局长度 —— 这是披着博弈外衣的奇偶问题</text>

  <!-- bottom note -->
  <rect x="48" y="328" width="424" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">💡 不变量：每步总量恰减 1，终局只看总量是否归零，</text>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">胜负在开局（x, y）确定的那一刻就已注定，与过程无关。</text>
</svg>
