<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：断点唯一 + 环接相容 ⇒ 可右移还原成递增</text>

  <!-- ======== Part A：示例 1 ======== -->
  <text x="30" y="46" font-size="12" fill="#333" filter="url(#rough2)">示例 1：nums = [3,4,5,1,2]</text>

  <!-- 第一行：原数组 -->
  <rect x="30" y="58" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="74" y="58" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="118" y="58" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="162" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- 断点闪电：5 → 1 -->
  <path d="M162,54 L157,64 L167,78 L155,92 L162,104" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="272" y="68" font-size="12" fill="#b85450" filter="url(#rough2)">唯一断点 i = 3：5 &gt; 1（下降沿）</text>
  <text x="272" y="88" font-size="12" fill="#888" filter="url(#rough2)">最小值 1 恰在断点处</text>

  <text x="96" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A 段（递增）</text>
  <text x="206" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">B 段（递增）</text>

  <!-- 右移箭头 -->
  <line x1="140" y1="120" x2="140" y2="136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="133" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">右移 k = n − i = 2 次</text>

  <!-- 第二行：还原结果 B + A -->
  <rect x="30" y="140" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="140" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="118" y="140" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="162" y="140" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="206" y="140" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="272" y="156" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B + A 拼接：环接相容 ✓</text>
  <text x="272" y="176" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">（B 尾 2 &lt; A 头 3）答案 = 2</text>

  <!-- 分隔线 -->
  <line x1="30" y1="200" x2="530" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ======== Part B：反例 ======== -->
  <text x="30" y="228" font-size="12" fill="#333" filter="url(#rough2)">反例：nums = [2,1,4]</text>

  <rect x="30" y="240" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="74" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M74,236 L69,246 L79,260 L67,274 L74,286" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="52" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A</text>
  <text x="118" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">B</text>

  <!-- 强行拼接箭头 -->
  <line x1="176" y1="257" x2="216" y2="257" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">B+A</text>

  <rect x="220" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="264" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="308" y="240" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M308,236 L303,246 L313,260 L301,274 L308,286" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="366" y="252" font-size="12" fill="#b85450" filter="url(#rough2)">4 &gt; 2 仍是一处下降 ✗</text>
  <text x="366" y="272" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 返回 −1</text>

  <text x="30" y="318" font-size="12" fill="#b85450" filter="url(#rough2)">断点虽唯一（i = 1），但环接失败：B 尾 4 &gt; A 头 2，拼接后仍压不平</text>
  <text x="30" y="340" font-size="12" fill="#888" filter="url(#rough2)">环接相容 = 右移还原后的 B + A 拼接处不再产生新的下降沿</text>
</svg>
