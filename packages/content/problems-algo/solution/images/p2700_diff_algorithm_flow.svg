<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：递归类型分派——同型容器下钻求差异，否则叶差异 [v₁, v₂]</text>

  <rect x="210" y="44" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">objDiff(obj1, obj2)</text>
  <path d="M 300 78 L 300 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,96 420,140 300,184 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">1. obj1 === obj2 ?</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">递归基（null / 原始值 / 同引用）</text>
  <path d="M 420 140 L 470 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="472" y="123" width="112" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="528" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">return {}  无差异</text>
  <path d="M 300 184 L 300 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="198" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="300,202 440,258 300,314 160,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">2. 不同型 ?</text>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">null / 原始值 / 数组↔对象</text>
  <path d="M 440 258 L 470 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="455" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="472" y="241" width="112" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="528" y="263" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">return [o1, o2]</text>
  <path d="M 300 314 L 300 334" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="330" font-size="10" fill="#446688" filter="url(#rough2)">否·同型容器</text>

  <path d="M 300 338 L 160 338 L 160 364" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 338 L 440 338 L 440 364" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="332" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">数组</text>
  <text x="374" y="332" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">对象</text>

  <rect x="48" y="364" width="224" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">3a. 数组·下标交集递归</text>
  <text x="160" y="404" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">for i in 0 .. min(len1,len2)-1 :</text>
  <text x="160" y="420" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">  d = objDiff(a[i], b[i])</text>
  <text x="160" y="436" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">  非空 → result[i] = d</text>

  <rect x="328" y="364" width="224" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">3b. 对象·共有键递归</text>
  <text x="440" y="404" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">for k in 共有键 (k in o1 &amp;&amp; k in o2) :</text>
  <text x="440" y="420" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">  d = objDiff(a[k], b[k])</text>
  <text x="440" y="436" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">  非空 → result[k] = d</text>

  <path d="M 90 364 C 30 300 30 130 210 68" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 510 364 C 570 300 570 130 390 68" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold" transform="rotate(-90 40 250)">递归回入口</text>

  <rect x="48" y="462" width="504" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="482" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「非空」判定 = Object.keys(d).length ≠ 0：空对象 {} / 无差异空数组 视为「无差异」并在父层省略该键/下标。</text>
</svg>
