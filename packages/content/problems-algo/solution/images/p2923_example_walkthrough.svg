<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[0,0,1],[1,0,1],[0,0,0]]</text>

  <!-- 第 1 步：j = 1 -->
  <rect x="44" y="60" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="80" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">j = 1</text>
  <path d="M 112 75 L 138 75" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="142" y="52" width="178" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="231" y="70" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">grid[1][0] = 1</text>
  <text x="231" y="88" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1 队强于 0 队 → 挑战成功</text>
  <path d="M 324 75 L 350 75" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="52" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="429" y="70" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">擂主：0 → 1</text>
  <text x="429" y="88" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">王冠易主</text>

  <!-- 第 2 步：j = 2 -->
  <rect x="44" y="144" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="164" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">j = 2</text>
  <path d="M 112 159 L 138 159" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="142" y="136" width="178" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="231" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">grid[2][1] = 0</text>
  <text x="231" y="172" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 队不强于 1 队 → 守擂成功</text>
  <path d="M 324 159 L 350 159" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="136" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="429" y="154" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">擂主：保持 1</text>
  <text x="429" y="172" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">擂主守擂</text>

  <!-- 分隔线 -->
  <path d="M 40 200 L 480 200" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 最终结果 -->
  <path d="M 248 208 L 248 194 L 254 200 L 260 190 L 266 200 L 272 194 L 272 208 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="212" width="340" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">遍历结束 → 返回 champion = 1 ✓</text>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">与示例 2 输出一致</text>

  <!-- 底部说明 -->
  <rect x="70" y="276" width="380" height="48" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">全程只查询了 2 个矩阵单元 = n − 1 次</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（grid[1][0] 与 grid[2][1]，其余格子一眼未读）</text>
</svg>
