<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">特殊二叉树：靠 v.left.right == v 标记叶子</text>

  <!-- 左：内部节点 -->
  <text x="140" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">内部节点</text>
  <circle cx="140" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">v</text>
  <line x1="128" y1="126" x2="92" y2="178" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="152" y1="126" x2="188" y2="178" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="88" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="192" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="226" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v.left.right != v</text>
  <text x="140" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 递归左右子树</text>

  <!-- 右：叶子节点 -->
  <text x="380" y="72" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">叶子节点</text>
  <circle cx="380" cy="110" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="380" y="116" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">v</text>
  <!-- 左子指针折返回自身：从 v 出发向左下，再绕回 v -->
  <path d="M362,118 C316,150 316,72 360,100" stroke="#d6a040" stroke-width="2.2"
        marker-end="url(#arr)" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="316" y="158" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">left.right</text>
  <text x="380" y="226" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">v.left.right == v</text>
  <text x="380" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 命中基底，返回 1</text>

  <!-- 中线 -->
  <line x1="260" y1="60" x2="260" y2="258" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="70" y="280" width="380" height="56" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">叶子靠回指指针自标记，无需 null 判定</text>
  <text x="260" y="324" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">区分叶子 vs 内部节点 = 本题唯一新概念</text>
</svg>
