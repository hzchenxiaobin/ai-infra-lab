<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">操作只删同类：选中心 a，删左右各一个最近的 a</text>

  <!-- ===== input: a a a b c ===== -->
  <text x="50" y="64" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s = "aaabc"</text>

  <!-- index labels -->
  <text x="90" y="84" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="150" y="84" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="210" y="84" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="270" y="84" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="330" y="84" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- a index 0: deleted (left nearest) -->
  <rect x="70" y="92" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="121" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">a</text>
  <!-- a index 1: center (kept) -->
  <rect x="130" y="92" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="121" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- a index 2: deleted (right nearest) -->
  <rect x="190" y="92" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="121" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">a</text>
  <!-- b index 3: untouched -->
  <rect x="250" y="92" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="121" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <!-- c index 4: untouched -->
  <rect x="310" y="92" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="121" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">c</text>

  <!-- center marker -->
  <path d="M 150 74 L 150 88" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中心 i=1</text>

  <!-- left delete arrow -->
  <path d="M 150 145 L 100 145" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删左 a</text>

  <!-- right delete arrow -->
  <path d="M 150 145 L 200 145" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删右 a</text>

  <!-- note: b c untouched -->
  <path d="M 290 145 L 290 165" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="370" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">b、c 非同类，纹丝不动</text>

  <!-- big arrow down -->
  <path d="M 280 175 L 280 200" stroke="#446688" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== output: a b c ===== -->
  <text x="50" y="218" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 "abc"</text>

  <rect x="130" y="228" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="257" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="190" y="228" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="257" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="250" y="228" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="257" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">c</text>

  <!-- bracket showing all distinct -->
  <path d="M 128 282 L 128 294 L 292 294 L 292 282" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="210" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每种字符各留 1 个 → 长度 = 不同字符数</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一次操作只删与中心相同的字符，异类不受影响</text>
</svg>
