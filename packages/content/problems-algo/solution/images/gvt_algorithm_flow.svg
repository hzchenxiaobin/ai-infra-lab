<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">以图判树 — 算法流程</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="56" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始 validTree(n, edges)</text>

  <!-- arrow down -->
  <line x1="270" y1="78" x2="270" y2="100" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: edges.size() == n-1 ? -->
  <polygon points="270,104 350,150 270,196 190,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">edges.size()</text>
  <text x="270" y="162" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">== n − 1 ?</text>

  <!-- No branch -> right -->
  <line x1="350" y1="150" x2="386" y2="150" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="390" y="134" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes branch down -->
  <line x1="270" y1="196" x2="270" y2="222" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- rect: init union-find -->
  <rect x="170" y="226" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#333">uf ← UnionFind(n)，count = n</text>

  <line x1="270" y1="260" x2="270" y2="282" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- rect: union all edges -->
  <rect x="150" y="286" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="11.5" fill="#333">for (u,v) in edges : uf.unite(u, v)</text>

  <line x1="270" y1="320" x2="270" y2="342" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2 / return merged into a single highlight rect to save vertical space -->
  <polygon points="270,344 340,372 270,400 200,372" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">count == 1 ?</text>

  <!-- Yes -> left return true -->
  <line x1="200" y1="372" x2="158" y2="372" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="22" y="356" width="132" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="88" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No -> right return false -->
  <line x1="340" y1="372" x2="382" y2="372" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="386" y="356" width="132" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
</svg>
