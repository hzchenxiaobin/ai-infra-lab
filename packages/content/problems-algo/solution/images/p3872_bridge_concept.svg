<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：换掉一格，新值 x 由两侧公差共同锁定</text>

  <!-- 区域标签 -->
  <text x="216" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">左段（公差锁定 dL）</text>
  <text x="344" y="58" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">替换位 i</text>
  <text x="428" y="58" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">右侧</text>

  <!-- 桥公差弧线 -->
  <path d="M 280 178 C 280 116, 408 116, 408 176" stroke="#d6a040" stroke-width="2.2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="96" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">x − a = b − x = d ⟹ d = (b−a)/2</text>
  <text x="344" y="113" text-anchor="middle" font-size="11" fill="#a07020" filter="url(#rough2)">= (1−5)/2 = −2，x = a + d = 3</text>

  <!-- 相邻差行（旧） -->
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="184" y="160" font-size="12.5" fill="#446688" font-weight="bold">−2</text>
    <text x="248" y="160" font-size="12.5" fill="#446688" font-weight="bold">−2</text>
    <text x="312" y="160" font-size="11" fill="#ccc"><tspan text-decoration="line-through">+5</tspan></text>
    <text x="376" y="160" font-size="11" fill="#ccc"><tspan text-decoration="line-through">−9</tspan></text>
  </g>
  <!-- 替换后的新差 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="312" y="177" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
    <text x="376" y="177" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
  </g>
  <text x="96" y="170" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">相邻差</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="124" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="188" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="316" y="190" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="380" y="190" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <!-- 元素值 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="152" y="218">9</text>
    <text x="216" y="218">7</text>
    <text x="280" y="218">5</text>
    <text x="344" y="218" fill="#b85450"><tspan text-decoration="line-through">10</tspan></text>
    <text x="408" y="218">1</text>
  </g>
  <text x="344" y="241" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 3</text>

  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="152" y="254">0</text>
    <text x="216" y="254">1</text>
    <text x="280" y="254">2 = i−1（a = 5）</text>
    <text x="344" y="254" fill="#b85450" font-weight="bold">3 = i</text>
    <text x="408" y="254">4 = i+1（b = 1）</text>
  </g>

  <!-- 公差检查条 -->
  <g filter="url(#rough2)">
    <rect x="88" y="266" width="160" height="28" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="168" y="285" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">左段 dL = −2 = d ✓ 取整段</text>
    <rect x="256" y="266" width="130" height="28" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="321" y="285" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold">桥公差 d = −2</text>
    <rect x="394" y="266" width="140" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="464" y="285" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">右侧单元素：公差自由</text>
  </g>

  <!-- 底部解释框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="304" width="500" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">搭桥候选 = lv + 1 + rv；lv / rv =（该侧锁定公差 = d ？ 完整游程 ： 单元素 1）</text>
    <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#33506b">若某侧成段但公差不匹配（dL ≠ d / dR ≠ d）：该侧退化为 1——「半桥」分支最易漏！</text>
    <rect x="140" y="356" width="280" height="24" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">本例：left[2] + 1 + right[4] = 3 + 1 + 1 = 5 ✓</text>
  </g>
</svg>
