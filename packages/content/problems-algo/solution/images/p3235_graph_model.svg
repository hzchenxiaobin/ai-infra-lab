<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">接触即连边：几何场景 → 障碍图（n + 4 个节点）</text>

  <!-- 左面板：几何场景 -->
  <rect x="18" y="40" width="240" height="296" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="138" y="60" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">几何：一堵围住起点的墙</text>

  <rect x="44" y="84" width="192" height="230" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">上边</text>
  <text x="243" y="203" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">右边</text>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">下边</text>
  <text x="20" y="203" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">左边</text>

  <!-- 被围的角域 -->
  <polygon points="44,314 44,270 90,314" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>

  <!-- 三个圆：A 贴左，B 居中，C 贴下 -->
  <circle cx="44" cy="155" r="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="52" y="132" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="115" cy="225" r="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="230" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="140" cy="314" r="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="302" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- 接触标记 -->
  <circle cx="44" cy="126" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="52" y="122" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">贴左</text>
  <circle cx="126" cy="314" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="112" y="308" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">贴下</text>
  <circle cx="75" cy="186" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="62" y="200" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">A∩B</text>
  <circle cx="129" cy="276" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="137" y="280" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">B∩C</text>

  <circle cx="44" cy="314" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="310" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点(0,0)</text>
  <circle cx="236" cy="84" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="76" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点(X,Y)</text>
  <path d="M 52 306 Q 60 292 74 288" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="78" y="286" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 右面板：障碍图 -->
  <rect x="286" y="40" width="216" height="296" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="394" y="60" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">障碍图：同一连通块 = 一堵墙</text>

  <!-- 孤立边界节点（灰） -->
  <rect x="364" y="84" width="46" height="26" fill="#f2f2f2" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="387" y="101" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">上边</text>
  <rect x="440" y="183" width="46" height="26" fill="#f2f2f2" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="463" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">右边</text>

  <!-- 连通的边界节点（红） -->
  <rect x="296" y="137" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="319" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">左边</text>
  <rect x="328" y="288" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="351" y="305" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下边</text>

  <!-- 圆节点 -->
  <circle cx="350" cy="160" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="392" cy="205" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="352" cy="250" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- 连边 -->
  <path d="M 335 155 L 319 154" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 362 172 L 381 193" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 380 218 L 363 237" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 267 L 351 288" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="373" y="178" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">相交</text>
  <text x="371" y="238" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">相交</text>
  <text x="296" y="128" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">贴边</text>
  <text x="378" y="284" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">贴边</text>

  <text x="394" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左边 ↔ 下边 同一连通块</text>

  <!-- 底部结论 -->
  <rect x="18" y="348" width="484" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">圆-圆相交 / 相切、圆-边相交 / 相切 ⇒ 连边（n + 4 节点并查集）</text>
  <text x="260" y="373" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">本例：左 ↔ 右 / 上 ↔ 下 / 左 ↔ 下 / 上 ↔ 右 均需检查 —— 此图左↔下同根 → false</text>
</svg>
