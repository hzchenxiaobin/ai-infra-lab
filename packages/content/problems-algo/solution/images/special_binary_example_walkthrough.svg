<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "11011000" → "11100100"</text>

  <!-- Row 0: original string with balance track -->
  <text x="36" y="56" font-size="11" fill="#888">原串 + balance：</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
    <rect x="150" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="167" y="63">1</text>
    <rect x="184" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="201" y="63">1</text>
    <rect x="218" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="63">0</text>
    <rect x="252" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="269" y="63">1</text>
    <rect x="286" y="44" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="303" y="63">1</text>
    <rect x="320" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="337" y="63">0</text>
    <rect x="354" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="371" y="63">0</text>
    <rect x="388" y="44" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="405" y="63">0</text>
  </g>
  <!-- balance values -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="167" y="84">1</text>
    <text x="201" y="84">2</text>
    <text x="235" y="84">1</text>
    <text x="269" y="84">2</text>
    <text x="303" y="84">3</text>
    <text x="337" y="84">2</text>
    <text x="371" y="84">1</text>
    <text x="405" y="84">0</text>
  </g>
  <text x="440" y="84" font-size="11" fill="#b85450" font-weight="bold">仅末尾归 0 → 整体一个顶层子串</text>

  <!-- Row 1: decompose into 1 + middle + 0 -->
  <text x="36" y="116" font-size="11" fill="#888">剥外层：</text>
  <rect x="150" y="104" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="123" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="184" y="104" width="238" height="28" fill="#eef3fb" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="303" y="123" text-anchor="middle" font-size="11" fill="#34506e">middle = "101100"</text>
  <rect x="388" y="104" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="123" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="440" y="123" font-size="11" fill="#555">→ 递归 dfs("101100")</text>

  <!-- Row 2: split middle into two chunks -->
  <text x="36" y="156" font-size="11" fill="#888">切中段：</text>
  <text x="150" y="156" font-size="11" fill="#555">"101100" 的 balance：1,0 → 切点；1,2,1,0 → 切点</text>
  <rect x="150" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="166" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="226" y="184" font-size="11" fill="#888">|</text>
  <rect x="238" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="166" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="306" y="166" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="340" y="166" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="386" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">chunks = ["10", "1100"]</text>

  <!-- Row 3: recurse each chunk -->
  <text x="36" y="216" font-size="11" fill="#888">递归各子串：</text>
  <rect x="150" y="206" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="210" y="224" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">dfs("10")="10"</text>
  <rect x="282" y="206" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="367" y="224" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">dfs("1100")="1"+dfs("10")+"0"="1100"</text>
  <text x="468" y="224" font-size="11" fill="#888">（最内层 "10" 已是叶子）</text>

  <!-- Row 4: sort descending -->
  <text x="36" y="262" font-size="11" fill="#888">降序排序：</text>
  <rect x="150" y="250" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="182" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1100</text>
  <text x="226" y="268" font-size="11" fill="#888">,</text>
  <rect x="238" y="250" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <path d="M 296 263 L 326 263" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="252" text-anchor="middle" font-size="10" fill="#b85450">sort↓</text>
  <rect x="340" y="250" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="372" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1100</text>
  <text x="416" y="268" font-size="11" fill="#888">,</text>
  <rect x="428" y="250" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="486" y="268" font-size="11" fill="#555">→ "1100"+"10"="110010"</text>

  <!-- Row 5: wrap back -->
  <text x="36" y="306" font-size="11" fill="#888">包回外层：</text>
  <rect x="150" y="294" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="314" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="184" y="294" width="204" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="314" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">"110010"</text>
  <rect x="388" y="294" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="314" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <!-- Final result -->
  <rect x="40" y="346" width="640" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="376" font-size="13" fill="#7a5415" font-weight="bold">最终结果：</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#b85450">
    <rect x="160" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="175" y="378">1</text>
    <rect x="190" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="378">1</text>
    <rect x="220" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="378">1</text>
    <rect x="250" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="265" y="378">0</text>
    <rect x="280" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="295" y="378">0</text>
    <rect x="310" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="325" y="378">1</text>
    <rect x="340" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="355" y="378">0</text>
    <rect x="370" y="360" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="385" y="378">0</text>
  </g>
  <text x="430" y="378" font-size="13" fill="#b03a3a" font-weight="bold">= "11100100" ✓</text>

  <!-- verification note -->
  <text x="360" y="424" text-anchor="middle" font-size="11" fill="#555">验证："11100100" 是合法特殊串，且字典序 &gt; 原串 "11011000"（第 2 位 1 &gt; 0）</text>
  <text x="360" y="444" text-anchor="middle" font-size="11" fill="#888">对应官方解释：交换 "10"(s[1]) 与 "1100"(s[3]) 两个相邻特殊子串</text>
</svg>
