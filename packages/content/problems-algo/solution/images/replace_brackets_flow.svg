<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建表 + 单次扫描 O(n+k)</text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 270 72 L 270 90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build map -->
  <rect x="120" y="94" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">map = {} ；遍历 knowledge 建哈希表</text>
  <text x="270" y="131" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">map[keyi] = valuei　 O(k)</text>

  <path d="M 270 140 L 270 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init result -->
  <rect x="140" y="162" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="185" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">res = [] ；i = 0</text>

  <path d="M 270 198 L 270 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="270,218 380,258 270,298 160,258" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="270" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">遍历 s</text>

  <!-- No -> end -->
  <path d="M 380 258 L 470 258 L 470 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="252" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes -> char check -->
  <path d="M 270 298 L 270 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="310" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: s[i]=='(' ? -->
  <polygon points="270,318 360,348 270,378 180,348" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">s[i] == '(' ?</text>

  <!-- Yes branch: collect key -->
  <path d="M 180 348 L 70 348 L 70 400" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="110" y="342" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="404" width="160" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="422" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">收集键直到 ')'</text>
  <text x="100" y="436" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">res += map[key] 或 "?"</text>
  <text x="100" y="448" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i 跳过 ')' 后继续</text>

  <!-- No branch: append char -->
  <path d="M 360 348 L 470 348 L 470 400" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="342" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="380" y="404" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="422" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">普通字符</text>
  <text x="455" y="436" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">res += s[i]</text>
  <text x="455" y="448" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i += 1</text>

  <!-- Both branches loop back up to loop condition -->
  <path d="M 100 404 L 100 250 L 160 258" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <path d="M 455 404 L 455 250 L 380 258" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- End -->
  <ellipse cx="470" cy="440" rx="58" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="445" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return res</text>
</svg>
