<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n=2, maxValue=5  →  C(1+e, e)</text>

  <!-- Table frame -->
  <!-- Header -->
  <rect x="70" y="38" width="40" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="55" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="110" y="38" width="150" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="55" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">质因子分解</text>
  <rect x="260" y="38" width="90" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="55" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">cnt(v)</text>
  <rect x="350" y="38" width="90" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="55" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">累计</text>

  <!-- Row v=1 -->
  <rect x="70" y="62" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="62" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1（无质因子）</text>
  <rect x="260" y="62" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(1,0)=1</text>
  <rect x="350" y="62" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- Row v=2 -->
  <rect x="70" y="86" width="40" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="86" width="150" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2¹</text>
  <rect x="260" y="86" width="90" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(2,1)=2</text>
  <rect x="350" y="86" width="90" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- Row v=3 -->
  <rect x="70" y="110" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="110" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3¹</text>
  <rect x="260" y="110" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(2,1)=2</text>
  <rect x="350" y="110" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- Row v=4 (highlight: e=2) -->
  <rect x="70" y="134" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="110" y="134" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2²  （e=2）</text>
  <rect x="260" y="134" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">C(3,2)=3</text>
  <rect x="350" y="134" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- Row v=5 -->
  <rect x="70" y="158" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="158" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5¹</text>
  <rect x="260" y="158" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(2,1)=2</text>
  <rect x="350" y="158" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <!-- Total row -->
  <rect x="70" y="190" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="208" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 = Σ cnt(v)</text>
  <rect x="350" y="190" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 ✓</text>

  <!-- Notes -->
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=4 是关键行：2² 的指数 e=2</text>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">末位固定为 2，前 n−1=1 位取值 ∈{0,1,2} ⟹ C(1+2,2)=3</text>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对应 3 个数组：[1,4]、[2,4]、[4,4]（指数 0→2、1→2、2→2）</text>

  <!-- exponent mini viz for v=4 -->
  <text x="60" y="306" font-size="10" fill="#888" filter="url(#rough2)">v=4=2² 指数序列：</text>
  <rect x="180" y="294" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="197" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="222" y="310" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">→</text>
  <rect x="232" y="294" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="280" y="310" font-size="10" fill="#888" filter="url(#rough2)">[1,4]</text>
  <rect x="320" y="294" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="310" font-size="10" fill="#888" filter="url(#rough2)">（首位∈{0,1,2} 三选）</text>

  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">与示例 1 输出 10 完全吻合</text>
</svg>
