<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：解析 → 求差 → 逐面额贪心</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每步取商累加 ops，余数留给下一档面额</text>

  <!-- ===== Example 1: "02:30" → "04:35", diff=125 ===== -->
  <text x="28" y="68" font-size="11" fill="#444" font-weight="bold">示例 1："02:30" → "04:35"</text>

  <!-- parse line -->
  <rect x="28" y="74" width="464" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="89" font-size="9.5" fill="#555">解析：</text>
  <text x="120" y="89" font-size="9.5" fill="#333">02:30 = 150 分</text>
  <text x="240" y="89" font-size="9.5" fill="#333">04:35 = 275 分</text>
  <text x="360" y="89" font-size="9.5" fill="#b85450" font-weight="bold">d = 275 − 150 = 125</text>

  <!-- table header -->
  <rect x="28" y="100" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="9.5" fill="#555">面额</text>
  <text x="150" y="114" text-anchor="middle" font-size="9.5" fill="#555">当前 d</text>
  <text x="240" y="114" text-anchor="middle" font-size="9.5" fill="#555">商 d÷denom</text>
  <text x="330" y="114" text-anchor="middle" font-size="9.5" fill="#555">余数 d%</text>
  <text x="430" y="114" text-anchor="middle" font-size="9.5" fill="#555">累计 ops</text>

  <!-- row 60 -->
  <rect x="28" y="120" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="134" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">60</text>
  <text x="150" y="134" text-anchor="middle" font-size="9.5" fill="#333">125</text>
  <text x="240" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="330" y="134" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <text x="430" y="134" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 15 -->
  <rect x="28" y="140" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="154" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">15</text>
  <text x="150" y="154" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <text x="240" y="154" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="154" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <text x="430" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 5 -->
  <rect x="28" y="160" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="174" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="150" y="174" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <text x="240" y="174" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="330" y="174" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="430" y="174" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- row 1 -->
  <rect x="28" y="180" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="194" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="240" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="194" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="430" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>

  <text x="492" y="194" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 返回 3</text>

  <!-- ===== Example 2: "11:00" → "11:01", diff=1 ===== -->
  <text x="28" y="226" font-size="11" fill="#444" font-weight="bold">示例 2："11:00" → "11:01"</text>

  <rect x="28" y="232" width="464" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="247" font-size="9.5" fill="#555">解析：</text>
  <text x="120" y="247" font-size="9.5" fill="#333">11:00 = 660 分</text>
  <text x="240" y="247" font-size="9.5" fill="#333">11:01 = 661 分</text>
  <text x="360" y="247" font-size="9.5" fill="#b85450" font-weight="bold">d = 661 − 660 = 1</text>

  <!-- table header -->
  <rect x="28" y="258" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="9.5" fill="#555">面额</text>
  <text x="150" y="272" text-anchor="middle" font-size="9.5" fill="#555">当前 d</text>
  <text x="240" y="272" text-anchor="middle" font-size="9.5" fill="#555">商 d÷denom</text>
  <text x="330" y="272" text-anchor="middle" font-size="9.5" fill="#555">余数 d%</text>
  <text x="430" y="272" text-anchor="middle" font-size="9.5" fill="#555">累计 ops</text>

  <!-- combined row: 60,15,5 all give 0, only 1 gives 1 -->
  <rect x="28" y="278" width="464" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="292" text-anchor="middle" font-size="9.5" fill="#888">60/15/5</text>
  <text x="150" y="292" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="240" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="292" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="430" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">0</text>

  <rect x="28" y="298" width="464" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="312" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="240" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="330" y="312" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="430" y="312" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="492" y="312" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 返回 1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="326" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#333">差值 d ≤ 1439（不足一天），4 次取商即得最优解</text>
</svg>
