<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：target = "he" —— 13 次按键，13 个字符串</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每按一次键，屏幕变一次，每次变化都记进答案（键 2 次数 = ord(c) − ord('a')）</text>

  <!-- 左面板：字符 'h' -->
  <text x="138" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 1 个字符 'h'：1 次键 1 + 7 次键 2</text>
  <rect x="24" y="70" width="228" height="246" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <rect x="34" y="82" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="96" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">键 1</text>
  <rect x="76" y="82" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="96" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="148" y="95" font-size="9" fill="#888888" filter="url(#rough2)">← 追加 'a'</text>

  <rect x="34" y="110" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="124" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="110" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b</text>

  <rect x="34" y="138" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="152" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="138" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c</text>

  <rect x="34" y="166" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="180" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="166" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="180" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d</text>

  <rect x="34" y="194" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="208" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="194" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e</text>

  <rect x="34" y="222" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="236" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="222" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">f</text>

  <rect x="34" y="250" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="264" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="250" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g</text>

  <rect x="34" y="278" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="51" y="292" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="76" y="278" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="292" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="148" y="291" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">'h' 敲定 ✓</text>

  <!-- 右面板：字符 'e' -->
  <text x="382" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 2 个字符 'e'：1 次键 1 + 4 次键 2</text>
  <rect x="268" y="70" width="228" height="246" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <rect x="278" y="82" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="96" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">键 1</text>
  <rect x="320" y="82" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="96" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">ha</text>
  <text x="392" y="95" font-size="9" fill="#888888" filter="url(#rough2)">← 前缀 'h' 锁定不动</text>

  <rect x="278" y="110" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="124" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="320" y="110" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">hb</text>

  <rect x="278" y="138" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="152" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="320" y="138" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">hc</text>

  <rect x="278" y="166" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="180" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="320" y="166" width="64" height="20" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="180" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">hd</text>

  <rect x="278" y="194" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="208" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">键 2</text>
  <rect x="320" y="194" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="208" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">he</text>
  <text x="392" y="207" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">完成 ✓</text>

  <rect x="280" y="228" width="204" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="382" y="248" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">键 2 次数 = ord(c) − ord('a')</text>
  <text x="382" y="266" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">'a'→0　'e'→4　'h'→7　'm'→12</text>
  <text x="382" y="282" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">'z'→25（正向步数，永不绕回）</text>
  <text x="382" y="297" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">每个位置都从 'a' 起步</text>

  <!-- 底部备注 -->
  <rect x="20" y="328" width="480" height="58" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="350" font-size="10" fill="#333" filter="url(#rough2)">💡 输出 = ["a","b",…,"h","ha","hb","hc","hd","he"]，共 1+7+1+4 = 13 个，与示例 2 一致</text>
  <text x="34" y="368" font-size="10" fill="#333" filter="url(#rough2)">一般地，字符串个数 = n + Σ(ord(c) − 97) ≤ 26n；首个输出恒为 "a"（空屏只能按键 1）</text>
</svg>
