<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">next() 单步推进：弹栈 → 补右子树左链 → 返回</text>

  <!-- 入口 -->
  <rect x="200" y="48" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="12" fill="#333">next() 被调用</text>

  <path d="M 290 80 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹栈顶 -->
  <rect x="170" y="100" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="122" text-anchor="middle" font-size="11" fill="#333">node = 栈顶; st.pop()</text>

  <path d="M 290 134 L 290 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 node.right -->
  <polygon points="290,154 410,196 290,238 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="192" text-anchor="middle" font-size="12" fill="#333">node.right</text>
  <text x="290" y="210" text-anchor="middle" font-size="12" fill="#333">存在？</text>

  <!-- 是：补左链 -->
  <path d="M 290 238 L 290 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="250" font-size="10" fill="#82b366">是</text>
  <rect x="140" y="258" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="11" fill="#333">pushLeft(node.right)：沿左链压栈</text>

  <path d="M 290 292 L 290 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：跳过 -->
  <path d="M 410 196 L 470 196 L 470 308 L 296 308" stroke="#666" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="190" font-size="10" fill="#b85450">否</text>
  <text x="478" y="252" font-size="10" fill="#888">跳过</text>

  <!-- 返回 -->
  <rect x="190" y="312" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return node.val</text>

  <!-- hasNext 旁注 -->
  <rect x="430" y="100" width="130" height="60" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="495" y="122" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">hasNext()</text>
  <text x="495" y="140" text-anchor="middle" font-size="10" fill="#888">= !st.empty()</text>
  <text x="495" y="156" text-anchor="middle" font-size="10" fill="#888">O(1)</text>
  <path d="M 430 130 L 412 130" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="356" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="11" fill="#333">每节点一生入栈/出栈各一次 ⇒ n 次 next() 总开销 O(n)，均摊每次 O(1)</text>
</svg>
