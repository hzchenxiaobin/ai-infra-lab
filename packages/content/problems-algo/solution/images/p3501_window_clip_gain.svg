<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：Δ = 左右 0 段在「窗口内」的长度之和</text>

  <!-- ===== 行 1：全局游程 ===== -->
  <text x="24" y="48" font-size="11" fill="#555" filter="url(#rough2)">s = "1000100" 全局游程分段（编号 0~3）：</text>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="30" y="58" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="56" y="58" width="78" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="134" y="58" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="160" y="58" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="43" y="77" filter="url(#rough2)">1</text>
    <text x="95" y="77" filter="url(#rough2)">000</text>
    <text x="147" y="77" filter="url(#rough2)">1</text>
    <text x="186" y="77" filter="url(#rough2)">00</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#555">
    <text x="43" y="104" filter="url(#rough2)">段0 len=1</text>
    <text x="95" y="104" filter="url(#rough2)">段1 len=3</text>
    <text x="147" y="104" fill="#b85450" font-weight="bold" filter="url(#rough2)">段2 len=1（牺牲）</text>
    <text x="186" y="104" filter="url(#rough2)">段3 len=2</text>
  </g>

  <!-- 查询窗口框 -->
  <rect x="82" y="52" width="104" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="118" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">l=2</text>
  <text x="190" y="118" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">r=5</text>

  <path d="M 134 124 L 134 144" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="138" font-size="9.5" fill="#555" filter="url(#rough2)">把窗口 [2, 5] 抠出来补位</text>

  <!-- ===== 行 2：窗口视角 ===== -->
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="40" y="150" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="68" y="150" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="122" y="150" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="150" y="150" width="26" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="178" y="150" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="53" y="169" filter="url(#rough2)">1</text>
    <text x="94" y="169" filter="url(#rough2)">00</text>
    <text x="135" y="169" filter="url(#rough2)">1</text>
    <text x="163" y="169" filter="url(#rough2)">0</text>
    <text x="191" y="169" filter="url(#rough2)">1</text>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="53" y="195" fill="#446688" filter="url(#rough2)">补位(不计)</text>
    <text x="94" y="195" fill="#b85450" font-weight="bold" filter="url(#rough2)">段1 截断×2</text>
    <text x="135" y="195" fill="#b85450" font-weight="bold" filter="url(#rough2)">牺牲 b=1</text>
    <text x="163" y="195" fill="#b85450" font-weight="bold" filter="url(#rough2)">段3 截断×1</text>
    <text x="191" y="195" fill="#446688" filter="url(#rough2)">补位(不计)</text>
  </g>

  <text x="130" y="222" text-anchor="middle" font-size="13.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">Δ = 2 + 1 = 3</text>
  <text x="130" y="240" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">牺牲 1 个 1，点亮合并出的 0000 → 窗口变 1111</text>
  <text x="130" y="254" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">整个 s：1000100 → 1011110，1 的个数 2 → 5</text>

  <!-- ===== 右侧说明框 A ===== -->
  <rect x="300" y="52" width="205" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="70" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">小心：预存值会高估！</text>
  <text x="402" y="87" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">val[段2] = len[段1] + len[段3] = 3 + 2 = 5</text>
  <text x="402" y="102" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">但段1、段3 被窗口切坏，窗外的 0 点不着</text>
  <text x="402" y="117" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">只能用窗口内长度 2 + 1</text>

  <!-- ===== 右侧说明框 B ===== -->
  <rect x="300" y="132" width="205" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">何时可直接查 ST 表？</text>
  <text x="402" y="167" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j 在 [a+2, b−2]：两侧 0 段完整</text>
  <text x="402" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">val[j] 直接进区间 max</text>
  <text x="402" y="194" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">首尾候选 a+1 / b−1 才需单独修正</text>

  <!-- ===== 右侧说明框 C ===== -->
  <rect x="300" y="206" width="205" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="223" text-anchor="middle" font-size="11" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">牺牲段必须严格在窗内</text>
  <text x="402" y="239" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">贴窗口边的 1 段连着补位 '1'</text>
  <text x="402" y="252" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">不算「被 0 包围」，永不可牺牲</text>

  <!-- ===== 底部结论横幅 ===== -->
  <rect x="18" y="266" width="488" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="290" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">answer = ones(s) + max(0, Δ)，Δ = wlen(j−1) + wlen(j+1)</text>
  <text x="262" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本例：ones = 2，Δ = 2 + 1 = 3 → 答案 5（s 变为 "1011110"）</text>
  <text x="262" y="334" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ones 数的是整个 s 的 1（窗口外原样保留）；无内部 1 段可牺牲时 Δ 取 0</text>
</svg>
