<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [4,2,6,3,1,5], val = 1, depth = 2</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 到 depth−1 = 1 层（根），对该层每个节点插入两个 val 节点</text>

  <!-- ===== Step 1: BFS to depth-1 ===== -->
  <rect x="20" y="56" width="540" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">步骤 1 — BFS 遍历到 depth−1 = 1 层</text>

  <text x="40" y="100" font-size="11" fill="#333">初始队列：</text>
  <rect x="120" y="86" width="48" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="102" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>

  <text x="190" y="100" font-size="11" fill="#333">cur_depth = 1 == depth−1 = 1 ✓</text>
  <text x="420" y="100" font-size="11" fill="#b85450" font-weight="bold">→ 停止 BFS</text>

  <text x="40" y="128" font-size="10" fill="#888">队列为 depth−1 层的全部节点：[4]</text>
  <text x="40" y="144" font-size="10" fill="#aaa">无需继续向下遍历，直接进入插入阶段</text>

  <line x1="290" y1="154" x2="290" y2="166" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Insert at each node ===== -->
  <rect x="20" y="168" width="540" height="132" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="12" fill="#7a5a20" font-weight="bold">步骤 2 — 对 depth−1 层每个节点 cur 插入新行</text>

  <text x="40" y="212" font-size="11" fill="#333" font-weight="bold">cur = 4：</text>

  <text x="60" y="232" font-size="10" fill="#7a5a20">① newL = TreeNode(1)</text>
  <text x="220" y="232" font-size="10" fill="#7a5a20">② newL.left = cur.left (节点 2)</text>
  <text x="420" y="232" font-size="10" fill="#7a5a20">③ cur.left = newL</text>

  <text x="60" y="252" font-size="10" fill="#7a5a20">④ newR = TreeNode(1)</text>
  <text x="220" y="252" font-size="10" fill="#7a5a20">⑤ newR.right = cur.right (节点 6)</text>
  <text x="420" y="252" font-size="10" fill="#7a5a20">⑥ cur.right = newR</text>

  <text x="40" y="276" font-size="10" fill="#888">→ 节点 4 的左子从 2 变为 newL(1)，newL 的左子为 2</text>
  <text x="40" y="292" font-size="10" fill="#888">→ 节点 4 的右子从 6 变为 newR(1)，newR 的右子为 6</text>

  <line x1="290" y1="302" x2="290" y2="314" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Result tree ===== -->
  <rect x="20" y="316" width="540" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="338" font-size="12" fill="#3a5a2a" font-weight="bold">步骤 3 — 结果树：[4,1,1,2,null,null,6,3,1,5]</text>

  <!-- result tree -->
  <line x1="290" y1="360" x2="230" y2="384" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="290" y1="360" x2="350" y2="384" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="230" y1="392" x2="200" y2="416" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="350" y1="392" x2="380" y2="416" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="290" cy="352" r="14" fill="#fff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="290" y="357" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>

  <circle cx="230" cy="388" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="393" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">1</text>

  <circle cx="350" cy="388" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="393" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">1</text>

  <circle cx="200" cy="420" r="11" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="424" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <circle cx="380" cy="420" r="11" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="424" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6</text>

  <text x="450" y="370" font-size="10" fill="#d6a040" font-weight="bold">⬤ 新插入节点</text>
  <text x="450" y="388" font-size="10" fill="#446688">⬤ 原有节点</text>
  <text x="450" y="406" font-size="10" fill="#888">val=1 插在 depth=2</text>
  <text x="450" y="422" font-size="10" fill="#888">原 depth=2 下移到 3</text>
</svg>
