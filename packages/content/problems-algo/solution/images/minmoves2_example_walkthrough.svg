<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两指针成对相消</text>

  <text x="40" y="64" font-size="13" fill="#446688" font-weight="bold">示例 1: nums = [1, 2, 3]</text>

  <rect x="120" y="78" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="78" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="78" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="330" y="90" font-size="11" fill="#888">l=0, r=2</text>
  <text x="330" y="106" font-size="11" fill="#888">nums[r]−nums[l] = 3−1 = 2</text>

  <path d="M 150 116 Q 214 138 278 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="148" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="184" y="148" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="148" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="169" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="330" y="169" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 0 + 2 = 2</text>

  <text x="120" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">→ 中位数 2，|1−2|+|2−2|+|3−2| = 2  ✓</text>

  <line x1="40" y1="220" x2="520" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="252" font-size="13" fill="#446688" font-weight="bold">示例 2: nums = [1, 10, 2, 9] → 排序 [1, 2, 9, 10]</text>

  <rect x="80" y="266" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="266" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="266" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="272" y="266" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <text x="360" y="280" font-size="11" fill="#888">第一对: l=0, r=3</text>
  <text x="360" y="296" font-size="11" fill="#888">10 − 1 = 9</text>

  <path d="M 110 304 Q 206 326 302 304" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="336" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="357" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="144" y="336" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="357" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="336" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="357" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="272" y="336" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="357" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <text x="360" y="350" font-size="11" fill="#888">第二对: l=1, r=2</text>
  <text x="360" y="366" font-size="11" fill="#888">9 − 2 = 7</text>

  <path d="M 174 374 Q 206 388 238 374" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="400" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 9 + 7 = 16  ✓（中位数 2 或 9 均得 16）</text>
</svg>
