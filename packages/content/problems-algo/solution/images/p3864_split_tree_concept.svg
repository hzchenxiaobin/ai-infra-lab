<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：拆点锁死「对半」⇒ 可达分段 = 一棵对半拆分树</text>

  <!-- Level 0: "1010" -->
  <g filter="url(#rough2)">
    <rect x="192" y="44" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="210" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="228" y="44" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="246" y="65" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="264" y="44" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="282" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="300" y="44" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="318" y="65" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="184" y="64" text-anchor="end" font-size="10.5" fill="#888">L=4, X=2</text>
    <text x="348" y="58" font-size="11" fill="#b85450">不拆 = 4×2×2 = 16 ✗</text>
    <text x="348" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">拆 = 3 + 3 = 6 ✓</text>
  </g>

  <!-- edges level0 -> level1 -->
  <g filter="url(#rough2)">
    <path d="M 230 78 L 172 136" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 298 78 L 322 136" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- Level 1: "10" + "10" -->
  <g filter="url(#rough2)">
    <rect x="128" y="140" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="146" y="161" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="164" y="140" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="182" y="161" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="120" y="160" text-anchor="end" font-size="10.5" fill="#888">L=2, X=1</text>
    <text x="246" y="154" text-anchor="middle" font-size="10.5" fill="#b85450">不拆 4 ✗</text>
    <text x="246" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">拆 2+1=3 ✓</text>

    <rect x="292" y="140" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="310" y="161" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="328" y="140" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="161" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="380" y="154" font-size="10.5" fill="#b85450">不拆 4 ✗</text>
    <text x="380" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">拆 2+1=3 ✓</text>
  </g>

  <!-- edges level1 -> level2 -->
  <g filter="url(#rough2)">
    <path d="M 152 174 L 132 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 176 174 L 158 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 316 174 L 296 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 340 174 L 322 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
  </g>

  <!-- Level 2: four single chars -->
  <g filter="url(#rough2)">
    <rect x="110" y="218" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="128" y="239" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="146" y="218" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="239" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="274" y="218" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="292" y="239" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="310" y="218" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="328" y="239" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="128" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">2</text>
    <text x="164" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">1 (flat)</text>
    <text x="292" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">2</text>
    <text x="328" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">1 (flat)</text>
    <text x="228" y="296" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">叶子费用和 = 2 + 1 + 2 + 1 = 6 ✓</text>
  </g>

  <!-- side panel: linear number of segments -->
  <g filter="url(#rough2)">
    <rect x="378" y="212" width="168" height="86" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="462" y="232" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">段只有线性个！</text>
    <text x="462" y="250" text-anchor="middle" font-size="10" fill="#557">第 k 层 2^k 个长 n/2^k 段</text>
    <text x="462" y="266" text-anchor="middle" font-size="10" fill="#557">层存在 ⟺ 2^k | n</text>
    <text x="462" y="284" text-anchor="middle" font-size="10" fill="#557">总段数 ≤ 2n − 1</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="30" y="318" width="500" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">① 拆点锁死对半 ⇒ 段数 2^(ν₂(n)+1) − 1 ≤ 2n − 1（n 为奇数时仅 1 段，不能拆）</text>
    <text x="280" y="359" text-anchor="middle" font-size="11" fill="#666">② 前缀和 X = pre[i+L] − pre[i]，任意段 O(1) 取 1 的个数</text>
    <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666">③ 最优子结构 f(i,L) = min(不拆费用, f(i,L/2) + f(i+L/2,L/2))；X = 0 剪枝返 flatCost</text>
  </g>
</svg>
