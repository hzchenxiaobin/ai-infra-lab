<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：对数 + 模算术双轨</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="58" rx="56" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输入 left, right</text>
  <path d="M 280 76 L 280 92" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一步：数 2 和 5 -->
  <rect x="60" y="94" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① 勒让德公式数因子</text>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333">v₂ = Σ⌊right/2ⁱ⌋ − Σ⌊(left−1)/2ⁱ⌋</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#333">v₅ = Σ⌊right/5ⁱ⌋ − Σ⌊(left−1)/5ⁱ⌋ → C = min(v₂, v₅)</text>
  <path d="M 280 160 L 280 176" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二步：模算术求后缀 -->
  <rect x="60" y="178" width="440" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 模 10¹⁰ 求后缀</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333">遍历 i ∈ [left, right]：</text>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#333">剥除 i 的全部 2 / 5 因子 → core_i</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#333">suffix = (suffix × core_i) mod 10¹⁰</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#b85450">再乘回 2^(v₂−C) × 5^(v₅−C) mod 10¹⁰</text>
  <path d="M 280 260 L 280 276" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第三步：对数求前缀和位数 -->
  <rect x="60" y="278" width="440" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 对数求前缀 &amp; 位数</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333">logP = Σ log₁₀(i) − C</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#333">d = ⌊logP⌋ + 1</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#b85450">pre = ⌊10^(frac + 4)⌋</text>
  <path d="M 280 350 L 280 366" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,368 380,398 280,428 180,398" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d ≤ 10 ?</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">位数判定</text>

  <!-- 左分支 d<=10 -->
  <path d="M 180 398 L 100 398" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="384" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58" y="404" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"NeC"</text>

  <!-- 右分支 d>10 -->
  <path d="M 380 398 L 460 398" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="392" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="384" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="504" y="404" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"pre...sufeC"</text>

  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888" font-style="italic">模算术保后 10 位精度，对数定前 5 位与总位数</text>
</svg>
