<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案流程（在峰值 x 上二分，求最大可行 x）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=1, hi=maxSum, ans=1</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,104 380,150 270,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> end -->
  <path d="M 380 150 L 452 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="130" y="218" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2  （候选峰值 x）</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute min sum -->
  <rect x="80" y="274" width="380" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="12" fill="#333">total = mid + sideSum(index, mid) + sideSum(n−index−1, mid)</text>
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#888">O(1) 等差数列公式求山峰形最小和</text>

  <!-- arrow down -->
  <path d="M 270 324 L 270 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: total <= maxSum? -->
  <polygon points="270,346 390,394 270,442 150,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12" fill="#333">total &lt;= maxSum ?</text>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#666">(sum 够小吗)</text>

  <!-- Yes (feasible) -> try bigger -->
  <path d="M 150 394 L 96 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="386" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="374" width="82" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="392" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="55" y="408" text-anchor="middle" font-size="11" fill="#555">lo = mid + 1</text>

  <!-- No (too big) -> try smaller -->
  <path d="M 390 394 L 444 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="386" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="446" y="374" width="82" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="487" y="392" text-anchor="middle" font-size="11" fill="#333">太大了</text>
  <text x="487" y="408" text-anchor="middle" font-size="11" fill="#555">hi = mid − 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 55 374 L 55 150 L 160 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="47" y="260" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 47 260)">尝试更大</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 487 374 L 487 150 L 380 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#888">关键：minSum(x) 关于 x 单调递增 → 二段性；check() 用 O(1) 公式，共 O(log maxSum) 次</text>
</svg>
