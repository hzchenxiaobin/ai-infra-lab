  <!-- zone 0 cost 2 (not chosen) -->
  <rect x="90" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="145" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="128" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="145" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="166" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="184" y="145" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="204" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="145" text-anchor="middle" font-size="11" fill="#888">2</text>
  <!-- zone 4 chosen -->
  <rect x="242" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
