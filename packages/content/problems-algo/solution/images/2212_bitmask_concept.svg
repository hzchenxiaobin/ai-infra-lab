  <rect x="90" y="88" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="105" text-anchor="middle" font-size="11" fill="#555">1</text>
