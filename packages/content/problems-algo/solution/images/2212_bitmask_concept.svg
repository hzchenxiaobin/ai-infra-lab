  <rect x="242" y="88" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="280" y="88" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="105" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="318" y="88" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="336" y="105" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="356" y="88" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
