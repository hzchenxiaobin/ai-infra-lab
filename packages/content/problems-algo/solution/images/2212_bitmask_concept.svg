  <rect x="280" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="318" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="336" y="145" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="356" y="128" width="36" height="24" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="374" y="145" text-anchor="middle" font-size="11" fill="#888">2</text>
  <!-- zone 8 chosen -->
  <rect x="394" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- zone 9 chosen -->
  <rect x="432" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- zone 10 chosen -->
  <rect x="470" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="488" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- zone 11 chosen -->
  <rect x="508" y="128" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="526" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ====== bitmask row: 0/1 per zone ====== -->
  <text x="40" y="180" font-size="11" fill="#888">mask 位</text>
  <text x="108" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="146" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="184" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="222" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="298" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="336" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="374" y="180" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="412" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="488" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="526" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">1</text>

  <!-- arrow down to summary -->
  <path d="M 280 196 L 280 214" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== summary box ====== -->
  <rect x="60" y="220" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="242" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">赢区 = {4,5,8,9,10,11}</text>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#555">代价 1+1+1+2+3+1 = 9 ≤ 9</text>
  <text x="160" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">得分 4+5+8+9+10+11 = 47</text>

  <!-- ====== right explanation box ====== -->
  <rect x="290" y="220" width="250" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="244" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两个关键观察</text>
  <circle cx="305" cy="268" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="320" y="272" font-size="11" fill="#555">赢 k 区需 alice[k]+1 支（严格更多）</text>
  <circle cx="305" cy="298" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="302" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="320" y="302" font-size="11" fill="#555">每区只有「赢/弃」两态 → 2^12 子集</text>
  <text x="415" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">枚举 4096 个 mask 取最大得分</text>

  <!-- bottom note -->
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888">剩余箭随意塞入 0 号区（得分 0 不影响结果）</text>
</svg>
