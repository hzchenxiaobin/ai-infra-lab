  <rect x="128" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="166" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="204" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="222" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="242" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="280" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="298" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="318" y="48" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
