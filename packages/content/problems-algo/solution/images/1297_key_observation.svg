<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只需考察长度 = minSize 的子串</text>

  <!-- Top box: longer substring X -->
  <rect x="60" y="46" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">长子串 X（长度 L，minSize &lt; L ≤ maxSize）</text>
  <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#555">在 s 中出现 k 次，且不同字母数 ≤ maxLetters</text>
  <text x="280" y="104" text-anchor="middle" font-size="10.5" fill="#888">例：minSize=3, maxSize=4 → 长度 4 的子串</text>

  <!-- arrow down with "包含" -->
  <path d="M 280 114 L 280 138" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="132" font-size="11" fill="#b85450" font-weight="bold">包含</text>

  <!-- Middle box: shorter substring Y -->
  <rect x="60" y="144" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">短子串 Y（长度 = minSize）</text>
  <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#555">每次 X 出现都含一个 Y → Y 出现 ≥ k 次</text>
  <text x="280" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a">distinct(Y) ⊆ distinct(X) ≤ maxLetters ✓ 仍合法</text>

  <!-- Divider -->
  <path d="M 40 226 L 520 226" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Concrete mini example: s = aababcaab -->
  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">实例：s = "aababcaab"，minSize=3，maxSize=4</text>

  <!-- string cells -->
  <text x="36" y="280" font-size="11" fill="#888">s:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="70" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="285">a</text>
    <rect x="108" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="126" y="285">a</text>
    <rect x="146" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="285">b</text>
    <rect x="184" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="202" y="285">a</text>
    <rect x="222" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="285">b</text>
    <rect x="260" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="278" y="285">c</text>
    <rect x="298" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="316" y="285">a</text>
    <rect x="336" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="354" y="285">a</text>
    <rect x="374" y="266" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="392" y="285">b</text>
  </g>

  <!-- highlight "aab" at pos 0-2 and 6-8 -->
  <rect x="68" y="264" width="112" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="124" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">aab (第1次)</text>

  <rect x="296" y="264" width="112" height="32" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="352" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">aab (第2次)</text>

  <!-- notes -->
  <text x="60" y="340" font-size="11.5" fill="#555">• "aab"（长 = minSize = 3）出现 <tspan fill="#b85450" font-weight="bold">2</tspan> 次，合法（2 ≤ maxLetters=2）</text>
  <text x="60" y="360" font-size="11.5" fill="#555">• 任何长 4 的子串（如 "aaba"）出现次数 ≤ 2（每次必含某个长 3 子串）</text>
  <text x="60" y="380" font-size="11.5" fill="#555">• 故 <tspan fill="#4a7a3a" font-weight="bold">maxSize 维度可忽略</tspan>，只统计 minSize 即可覆盖最大值</text>

  <!-- Conclusion box -->
  <rect x="60" y="392" width="440" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结论：最大出现次数必在长度 = minSize 处取得</text>
</svg>
