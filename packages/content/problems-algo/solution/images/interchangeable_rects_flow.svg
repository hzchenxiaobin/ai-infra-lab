<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：GCD 归一化 + 哈希分组 + 组合计数</text>

  <!-- Step 1 -->
  <rect x="170" y="48" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 遍历每个矩形 [w, h]</text>
  <text x="280" y="82" text-anchor="middle" font-size="9" fill="#888">rectangles[i] = [width_i, height_i]</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="112" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② GCD 归一化宽高比</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">g = gcd(w, h); key = (w/g, h/g)</text>
  <text x="280" y="164" text-anchor="middle" font-size="9" fill="#888">化为最简分数，消除尺度差异</text>

  <path d="M 280 170 L 280 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="150" y="190" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 哈希表计数</text>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">count[key] += 1</text>
  <text x="280" y="242" text-anchor="middle" font-size="9" fill="#888">同 key 的矩形归入同一组</text>

  <path d="M 280 248 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: decision -->
  <polygon points="280,268 380,308 280,348 180,308" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">还有矩形?</text>
  <text x="280" y="316" text-anchor="middle" font-size="9" fill="#888">未遍历完</text>

  <!-- loop back arrow -->
  <path d="M 180 308 Q 100 308 100 180 Q 100 70 150 70" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="92" y="200" font-size="9" fill="#b85450">是，回 ①</text>

  <!-- no arrow down -->
  <path d="M 280 348 L 280 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="360" font-size="9" fill="#4a7a3a">否</text>

  <!-- Step 5 -->
  <rect x="120" y="370" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 对每组求组合数并累加</text>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">ans += k·(k−1)/2  (k = count[key])</text>
  <text x="280" y="422" text-anchor="middle" font-size="9" fill="#888">每组 k 个矩形产生 C(k,2) 对</text>

  <path d="M 280 428 L 280 442" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="455" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
