<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最优对必含端点 0 或 n−1</text>

  <rect x="40" y="42" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">反证：设最优 (i,j) 既不含 0 也不含 n−1</text>
  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">colors[0]=colors[j]（否则 (0,j) 更远），colors[i]=colors[n−1]（否则 (i,n−1) 更远）</text>
  <text x="280" y="94" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ colors[0]=colors[n−1] ⇒ colors[i]=colors[j]，与「颜色不同」矛盾 ✗</text>

  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">∴ 只需检查两类端点配对，一次遍历即可</text>

  <rect x="40" y="144" width="230" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 配左端点 0</text>
  <text x="155" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">找最右 j 使 colors[j]≠colors[0]</text>
  <text x="155" y="202" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">距离 = j</text>

  <rect x="290" y="144" width="230" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 配右端点 n−1</text>
  <text x="405" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">找最左 i 使 colors[i]≠colors[n−1]</text>
  <text x="405" y="202" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">距离 = n−1−i</text>

  <rect x="40" y="232" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max( ① , ② ) = max( j , n−1−i )</text>

  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(n) 时间 · O(1) 空间 · 无需枚举所有数对</text>
</svg>
