<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：超出部分 D = S − target 必须为偶数</text>

  <!-- ===== Row 1: 累计 k 步全向右 ===== -->
  <text x="30" y="62" font-size="12" fill="#446688" font-weight="bold">累计 k 步</text>

  <g filter="url(#rough2)">
    <rect x="110" y="50" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="144" y="50" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="190" y="50" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="248" y="50" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="125" y="70" filter="url(#rough2)">1</text>
    <text x="165" y="70" filter="url(#rough2)">2</text>
    <text x="217" y="70" filter="url(#rough2)">3</text>
    <text x="281" y="70" filter="url(#rough2)">k</text>
  </g>
  <text x="324" y="70" font-size="13" fill="#888" font-weight="bold">= S</text>
  <text x="362" y="70" font-size="11" fill="#888">= k(k+1)/2</text>

  <!-- number line: 0 --- target --- S, D = overshoot -->
  <text x="30" y="112" font-size="11" fill="#446688" font-weight="bold">数轴</text>
  <path d="M 110 108 L 460 108" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="110" cy="108" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>

  <circle cx="250" cy="108" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="250" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">target</text>

  <circle cx="440" cy="108" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="440" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S</text>

  <!-- D = S - target region -->
  <path d="M 250 100 L 440 100" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="310" y="86" width="70" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="345" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D = S−t</text>

  <!-- arrow down -->
  <path d="M 290 134 Q 290 146 290 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 翻转一步 i ===== -->
  <text x="30" y="182" font-size="12" fill="#446688" font-weight="bold">翻转步 i</text>

  <!-- +i to the right -->
  <rect x="110" y="170" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+ i</text>
  <path d="M 196 185 L 230 185" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- flip to -i -->
  <rect x="240" y="170" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">− i</text>

  <!-- delta = -2i -->
  <text x="340" y="184" font-size="11" fill="#888" filter="url(#rough2)">总和变化</text>
  <rect x="340" y="190" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="385" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">−2i</text>

  <!-- formula box -->
  <rect x="448" y="170" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="508" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">target = S − 2T</text>
  <text x="508" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a">T = 翻转步数之和</text>

  <!-- arrow down -->
  <path d="M 290 224 Q 290 236 290 248" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 判定条件 ===== -->
  <rect x="50" y="252" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">D = S − target = 2T  →  D 必须为偶数</text>
  <text x="290" y="289" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">条件：S ≥ target  且  (S − target) 为偶数  →  返回 k</text>

  <!-- arrow down -->
  <path d="M 290 300 Q 290 312 290 322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: D 为奇数时补步 ===== -->
  <text x="30" y="346" font-size="12" fill="#446688" font-weight="bold">D 为奇数</text>

  <rect x="110" y="332" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="175" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k+1 步</text>
  <text x="175" y="367" text-anchor="middle" font-size="10" fill="#666">k+1 奇 → D 翻偶 ✓</text>

  <rect x="260" y="332" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="325" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k+1 偶 → 仍奇</text>
  <text x="325" y="367" text-anchor="middle" font-size="10" fill="#666">再加 k+2 步 → 偶 ✓</text>

  <!-- conclusion -->
  <rect x="410" y="332" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">至多 +2 步</text>
  <text x="485" y="367" text-anchor="middle" font-size="10" fill="#4a7a3a">总能调成偶数</text>

  <!-- ===== Row 5: 为何 D 偶就行 ===== -->
  <rect x="50" y="392" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为何 D 偶就行？{1, 2, …, k} 的子集和可凑出 [0, S] 内任意整数</text>
  <text x="290" y="430" text-anchor="middle" font-size="10" fill="#4a7a3a">T = D/2 ≤ S 恒成立（因 D = S−target ≤ S），故 T 总能被某子集凑出</text>
</svg>
