<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fdfcf7"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">示例演算：m=2, n=3（head = [1..13]）</text>
  <path d="M 200 38 Q 360 46 520 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
  <rect x="470" y="48" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="492" y="58" font-size="10.5" fill="#444">保留</text>
  <rect x="528" y="48" width="16" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#sk)"/>
  <text x="550" y="58" font-size="10.5" fill="#444">删除</text>
  <rect x="586" y="48" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="608" y="58" font-size="10.5" fill="#444">未处理</text>

  <!-- ===== 周期 1 ===== -->
  <text x="20" y="92" font-size="12.5" fill="#2b2b2b" font-weight="bold">周期 1</text>
  <text x="20" y="108" font-size="10.5" fill="#888">curr=1 起</text>
  <!-- nodes -->
  <g filter="url(#sk)">
    <rect x="60" y="80" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="108" y="80" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="156" y="80" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="204" y="80" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="252" y="80" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="300" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="348" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="396" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="444" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="492" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="540" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="588" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="636" y="80" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="80" y="101" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="128" y="101" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="176" y="101" text-anchor="middle" font-size="12" fill="#b85450">3</text>
  <text x="224" y="101" text-anchor="middle" font-size="12" fill="#b85450">4</text>
  <text x="272" y="101" text-anchor="middle" font-size="12" fill="#b85450">5</text>
  <text x="320" y="101" text-anchor="middle" font-size="12" fill="#444">6</text>
  <text x="368" y="101" text-anchor="middle" font-size="12" fill="#444">7</text>
  <text x="416" y="101" text-anchor="middle" font-size="12" fill="#444">8</text>
  <text x="464" y="101" text-anchor="middle" font-size="12" fill="#444">9</text>
  <text x="512" y="101" text-anchor="middle" font-size="12" fill="#444">10</text>
  <text x="560" y="101" text-anchor="middle" font-size="12" fill="#444">11</text>
  <text x="608" y="101" text-anchor="middle" font-size="12" fill="#444">12</text>
  <text x="656" y="101" text-anchor="middle" font-size="12" fill="#444">13</text>
  <!-- curr 标 -->
  <text x="128" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr</text>
  <path d="M 128 73 L 128 78" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>
  <!-- temp 走过 3→4→5 -->
  <path d="M 176 124 L 224 124 L 272 124" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="224" y="138" text-anchor="middle" font-size="10" fill="#b85450">temp：3→4→5</text>
  <!-- 重连弯箭头 2→6 -->
  <path d="M 128 112 Q 224 150 320 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="224" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr.next = 6</text>

  <!-- 分隔线 -->
  <path d="M 40 168 L 690 168" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>

  <!-- ===== 周期 2 ===== -->
  <text x="20" y="192" font-size="12.5" fill="#2b2b2b" font-weight="bold">周期 2</text>
  <text x="20" y="208" font-size="10.5" fill="#888">curr=6 起</text>
  <g filter="url(#sk)">
    <rect x="60" y="180" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="108" y="180" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="156" y="180" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="204" y="180" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="252" y="180" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="300" y="180" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="348" y="180" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="396" y="180" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="444" y="180" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="492" y="180" width="40" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="80" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="128" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="176" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">6</text>
  <text x="224" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">7</text>
  <text x="272" y="201" text-anchor="middle" font-size="12" fill="#b85450">8</text>
  <text x="320" y="201" text-anchor="middle" font-size="12" fill="#b85450">9</text>
  <text x="368" y="201" text-anchor="middle" font-size="12" fill="#b85450">10</text>
  <text x="416" y="201" text-anchor="middle" font-size="12" fill="#444">11</text>
  <text x="464" y="201" text-anchor="middle" font-size="12" fill="#444">12</text>
  <text x="512" y="201" text-anchor="middle" font-size="12" fill="#444">13</text>
  <text x="224" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr</text>
  <path d="M 224 173 L 224 178" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>
  <path d="M 272 224 L 320 224 L 368 224" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="320" y="238" text-anchor="middle" font-size="10" fill="#b85450">temp：8→9→10</text>
  <path d="M 224 212 Q 320 250 416 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="320" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr.next = 11</text>

  <path d="M 40 268 L 690 268" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>

  <!-- ===== 周期 3 ===== -->
  <text x="20" y="292" font-size="12.5" fill="#2b2b2b" font-weight="bold">周期 3</text>
  <text x="20" y="308" font-size="10.5" fill="#888">curr=11 起</text>
  <g filter="url(#sk)">
    <rect x="60" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="108" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="156" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="204" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="252" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="300" y="280" width="40" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="348" y="280" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="80" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="128" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="176" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b">6</text>
  <text x="224" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b">7</text>
  <text x="272" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">11</text>
  <text x="320" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">12</text>
  <text x="368" y="301" text-anchor="middle" font-size="12" fill="#b85450">13</text>
  <text x="320" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr</text>
  <path d="M 320 273 L 320 278" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>
  <path d="M 368 324 L 388 324" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="378" y="338" text-anchor="middle" font-size="10" fill="#b85450">temp：13→break</text>
  <path d="M 320 312 Q 350 346 388 312" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="358" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curr.next = null</text>
  <text x="404" y="300" font-size="10.5" fill="#888">删除段不足 n=3，仅删 1 个即到尾</text>

  <path d="M 40 368 L 690 368" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>

  <!-- ===== 最终结果 ===== -->
  <text x="20" y="404" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果</text>
  <g filter="url(#sk)">
    <rect x="180" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="244" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="308" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="372" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="436" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="500" y="388" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="204" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="268" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="332" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">6</text>
  <text x="396" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">7</text>
  <text x="460" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">11</text>
  <text x="524" y="410" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">12</text>
  <path d="M 228 405 L 240 405" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 292 405 L 304 405" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 356 405 L 368 405" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 405 L 432 405" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 484 405 L 496 405" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="560" y="410" font-size="13" fill="#888">null</text>

  <!-- 要点框 -->
  <rect x="40" y="448" width="640" height="96" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#sk)"/>
  <text x="60" y="472" font-size="12.5" fill="#2b2b2b" font-weight="bold">演算要点</text>
  <text x="60" y="494" font-size="11" fill="#444">① 每周期 curr 先走 m−1=1 步定位保留段末尾，temp 再走 n=3 步定位删除段末尾，重连 curr.next = temp.next。</text>
  <text x="60" y="512" font-size="11" fill="#444">② 周期 3 删除段仅剩 1 个节点（13），temp 走 1 步后 temp.next=null 触发 break，删光剩余。</text>
  <text x="60" y="532" font-size="11" fill="#d6a040" font-weight="bold">③ 每个节点只被 curr 或 temp 访问一次，三周期合计步数 = 13 = N → O(N)。</text>
</svg>
