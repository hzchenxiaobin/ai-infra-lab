<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- Start box: k = 1 -->
  <rect x="190" y="42" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = 1</text>

  <!-- Arrow to diamond 1 -->
  <path d="M260,80 L260,104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: k <= 60? -->
  <polygon points="260,108 360,148 260,188 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k ≤ 60 ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">枚举上界</text>

  <!-- No branch: return -1 -->
  <path d="M360,148 L400,148 L400,172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="352" y="172" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="195" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>

  <!-- Yes branch -->
  <path d="M260,188 L260,212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Box: compute target -->
  <rect x="130" y="216" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">target = num1 − k · num2</text>

  <!-- Arrow to diamond 2 -->
  <path d="M260,256 L260,280" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: conditions -->
  <polygon points="260,284 400,324 260,364 120,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">target ≥ k</text>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">且 popcount ≤ k ?</text>

  <!-- Yes branch: return k -->
  <path d="M400,324 L440,324" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="318" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="436" y="306" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="329" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return k</text>

  <!-- No branch -->
  <path d="M260,364 L260,388" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="380" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Box: k++ -->
  <rect x="190" y="392" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = k + 1</text>

  <!-- Loop back arrow -->
  <path d="M190,410 L50,410 L50,148 L155,148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="30" y="280" font-size="10" fill="#888" filter="url(#rough2)">循环</text>
</svg>
