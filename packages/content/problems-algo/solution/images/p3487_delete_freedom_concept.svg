<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：删除自由 ⇒「子数组」退化为「子集」</text>

  <!-- ===== 左上：原数组 ===== -->
  <text x="18" y="64" font-size="11" fill="#555" filter="url(#rough2)">nums =</text>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="90" y="44" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="124" y="44" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="158" y="44" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="192" y="44" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="226" y="44" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="260" y="44" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="294" y="44" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="105" y="64" filter="url(#rough2)">1</text>
    <text x="139" y="64" filter="url(#rough2)">2</text>
    <text x="173" y="64" filter="url(#rough2)">-1</text>
    <text x="207" y="64" filter="url(#rough2)">-2</text>
    <text x="241" y="64" filter="url(#rough2)">1</text>
    <text x="275" y="64" filter="url(#rough2)">0</text>
    <text x="309" y="64" filter="url(#rough2)">-1</text>
  </g>
  <!-- 划掉不要的元素 -->
  <g stroke="#b85450" stroke-width="2.2" stroke-linecap="round" filter="url(#rough2)">
    <path d="M 161 46 L 185 72"/>
    <path d="M 185 46 L 161 72"/>
    <path d="M 195 46 L 219 72"/>
    <path d="M 219 46 L 195 72"/>
    <path d="M 229 46 L 253 72"/>
    <path d="M 253 46 L 229 72"/>
    <path d="M 297 46 L 321 72"/>
    <path d="M 321 46 L 297 72"/>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="105" y="90" fill="#2a5a2a" filter="url(#rough2)">留 ✓</text>
    <text x="139" y="90" fill="#2a5a2a" filter="url(#rough2)">留 ✓</text>
    <text x="173" y="90" fill="#b85450" filter="url(#rough2)">负数</text>
    <text x="207" y="90" fill="#b85450" filter="url(#rough2)">负数</text>
    <text x="241" y="90" fill="#b85450" filter="url(#rough2)">重复值</text>
    <text x="275" y="90" fill="#2a5a2a" filter="url(#rough2)">留 ✓</text>
    <text x="309" y="90" fill="#b85450" filter="url(#rough2)">负数</text>
  </g>

  <path d="M 207 98 L 207 124" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左中：删除后数组 -->
  <text x="18" y="155" font-size="11" fill="#555" filter="url(#rough2)">删除后：</text>
  <rect x="80" y="126" width="116" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="90" y="135" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="124" y="135" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="158" y="135" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="105" y="155" filter="url(#rough2)">1</text>
    <text x="139" y="155" filter="url(#rough2)">2</text>
    <text x="173" y="155" filter="url(#rough2)">0</text>
  </g>
  <text x="207" y="192" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">剩余整个数组 = 它自身的子数组</text>
  <text x="207" y="208" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（连续性自动满足，和 = 3）</text>

  <!-- ===== 右上：删除自由说明 ===== -->
  <rect x="345" y="44" width="158" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="64" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">删除 = 完全自由</text>
  <text x="424" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">想让子集 S 成为子数组？</text>
  <text x="424" y="100" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删光 S 之外的元素即可</text>
  <text x="424" y="120" text-anchor="middle" font-size="11" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">⇒ 连续性名存实亡</text>

  <!-- 右中：全负特例 -->
  <rect x="345" y="142" width="158" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">全负特例</text>
  <text x="424" y="180" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[-5, -3, -8]：不能删空</text>
  <text x="424" y="198" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必须留一个 → 留最大的 -3</text>

  <!-- ===== 底部结论横幅 ===== -->
  <rect x="18" y="228" width="486" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="251" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">问题改写：从 nums 中选一个非空、值互异的子集，最大化元素和</text>
  <text x="261" y="274" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">贪心：负数一律不选 · 每个非负值只选一次 · 0 选不选都行</text>
  <text x="261" y="301" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 = max(nums) &lt; 0 ? max(nums) : 全部互异非负值之和</text>
  <text x="261" y="328" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例：[1,2,-1,-2,1,0,-1] → 1 + 2 + 0 = 3</text>
</svg>
