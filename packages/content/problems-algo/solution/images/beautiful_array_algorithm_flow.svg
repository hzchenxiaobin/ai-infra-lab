<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">漂亮数组：递归构造流程</text>

  <!-- ===== Start: base case ===== -->
  <polygon points="280,38 360,66 280,94 200,66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">N == 1 ?</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#888">（递归基）</text>

  <!-- Yes branch: return [1] -->
  <path d="M 200 66 L 130 66" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="58" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="50" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="83" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return [1]</text>

  <!-- No branch -->
  <path d="M 280 94 L 280 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="104" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Compute half sizes ===== -->
  <rect x="120" y="110" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="11" fill="#446688">half = (N + 1) / 2 ;  left = f(half) ;  right = f(N - half)</text>

  <path d="M 280 146 L 280 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Two recursive boxes ===== -->
  <rect x="40" y="160" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">递归求左段 f(half)</text>
  <text x="155" y="192" text-anchor="middle" font-size="10" fill="#888">half = ⌈N/2⌉，规模减半</text>

  <rect x="290" y="160" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">递归求右段 f(N−half)</text>
  <text x="405" y="192" text-anchor="middle" font-size="10" fill="#888">N−half = ⌊N/2⌋，规模减半</text>

  <!-- merge arrows -->
  <path d="M 155 202 L 250 220" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 202 L 310 220" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Linear transform boxes ===== -->
  <rect x="44" y="222" width="222" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">左段映射 x → 2x − 1</text>
  <text x="155" y="254" text-anchor="middle" font-size="10" fill="#888">得到全奇数段</text>

  <rect x="294" y="222" width="222" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">右段映射 x → 2x</text>
  <text x="405" y="254" text-anchor="middle" font-size="10" fill="#888">得到全偶数段</text>

  <path d="M 155 264 L 250 282" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 264 L 310 282" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Concatenate ===== -->
  <rect x="130" y="284" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">拼接：A = [2·left−1 …] ⊕ [2·right …]</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#888">奇数段在前，偶数段在后</text>

  <path d="M 280 326 L 280 338" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <rect x="170" y="340" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return A（N 的漂亮数组）</text>

  <!-- ===== Note ===== -->
  <rect x="60" y="386" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 每层规模减半，递归深度 O(log N)</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">可用自底向上迭代消除递归开销，避免重复建子数组</text>
</svg>
