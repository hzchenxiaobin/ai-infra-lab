<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：贪心双指针（外层轮数 / 内层扫 source）
  </text>

  <!-- 开始 -->
  <ellipse cx="260" cy="58" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 78 L 260 96" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="100" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">count = 0,  i = 0</text>

  <path d="M 260 140 L 260 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i < n ? -->
  <polygon points="260,162 360,202 260,242 160,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">target 还有待匹配</text>

  <!-- 否 → 返回 count -->
  <path d="M 360 202 L 412 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="194" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <ellipse cx="464" cy="202" rx="54" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="464" y="207" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 count</text>

  <!-- 是 → 下 -->
  <path d="M 260 242 L 260 260" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="256" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- prev=i, count++ -->
  <rect x="150" y="264" width="220" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">prev = i,  count += 1</text>

  <path d="M 260 304 L 260 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层扫描 source -->
  <rect x="120" y="326" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">内层：j = 0 → m−1 扫描 source</text>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 source[j] == target[i] 则 i += 1</text>

  <path d="M 260 376 L 260 394" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i == prev ? -->
  <polygon points="260,398 370,428 260,458 150,428" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i == prev ?</text>
  <text x="260" y="442" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">整轮零进展?</text>

  <!-- 是 → 返回 -1 -->
  <path d="M 150 428 L 96 428" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="420" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <ellipse cx="48" cy="428" rx="48" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="433" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- 否 → 回到 i<n（右侧虚线回环） -->
  <path d="M 370 428 L 488 428 L 488 202 L 360 202" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="420" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否 → 下一轮</text>
</svg>
