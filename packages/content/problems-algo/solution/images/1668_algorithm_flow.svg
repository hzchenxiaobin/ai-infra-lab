<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">算法流程：增量追加 word，首次失败即返回</text>

  <!-- Start oval -->
  <ellipse cx="200" cy="56" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- arrow down to init -->
  <path d="M 200 76 L 200 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="120" y="94" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="12" fill="#333">k = 0;  s = ""</text>

  <!-- arrow down to decision -->
  <path d="M 200 134 L 200 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: (s + word) in sequence ? -->
  <polygon points="200,152 300,200 200,248 100,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(s + word)</text>
  <text x="200" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⊆ sequence ?</text>

  <!-- Yes branch: to the right -->
  <path d="M 300 200 L 350 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Yes action rect -->
  <rect x="352" y="178" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="427" y="196" text-anchor="middle" font-size="11" fill="#333">s = s + word</text>
  <text x="427" y="212" text-anchor="middle" font-size="11" fill="#333">k = k + 1</text>

  <!-- loop back: up from action rect to above decision, then left to decision top -->
  <path d="M 427 178 L 427 132 L 200 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="314" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">回到判定</text>

  <!-- No branch: down -->
  <path d="M 200 248 L 200 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="214" y="262" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Return rect -->
  <rect x="120" y="270" width="160" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 k</text>

  <!-- arrow down to end -->
  <path d="M 200 310 L 200 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="200" cy="346" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="351" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <!-- Side annotation: loop invariant -->
  <rect x="360" y="262" width="180" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="372" y="282" font-size="11" fill="#446688" font-weight="bold">循环不变式</text>
  <text x="372" y="300" font-size="10" fill="#555">每轮开始时：</text>
  <text x="372" y="316" font-size="10" fill="#555">  s == word * k</text>
  <text x="372" y="332" font-size="10" fill="#555">  s ⊆ sequence</text>
  <text x="372" y="346" font-size="10" fill="#b85450" font-weight="bold">退出时 k 即最大值</text>
</svg>
