<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 5，补数 = 2</text>

  <!-- ===== Step 1 header ===== -->
  <rect x="30" y="48" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一步：读 num 与位长 L</text>

  <!-- Row num = 5 = 101 -->
  <text x="44" y="104" font-size="12.5" fill="#446688" font-weight="bold">num = 5</text>
  <rect x="180" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="107" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="257" y="107" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="288" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="107" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="346" y="107" font-size="11" fill="#446688" font-weight="bold">→ L = 3</text>

  <!-- divider -->
  <line x1="40" y1="132" x2="520" y2="132" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Step 2 header ===== -->
  <rect x="30" y="144" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第二步：构造等长全 1 掩码</text>

  <!-- mask computation rows -->
  <text x="44" y="200" font-size="12.5" fill="#d6a040" font-weight="bold">1 &lt;&lt; L</text>
  <text x="180" y="200" font-size="13" fill="#333">= 1 &lt;&lt; 3</text>
  <text x="300" y="200" font-size="13" fill="#333">= 8</text>
  <rect x="340" y="184" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="363" y="200" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1000</text>

  <text x="44" y="236" font-size="12.5" fill="#d6a040" font-weight="bold">mask</text>
  <text x="180" y="236" font-size="13" fill="#333">= 8 − 1</text>
  <text x="300" y="236" font-size="13" fill="#333">= 7</text>
  <rect x="180" y="248" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="271" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <rect x="234" y="248" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="271" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <rect x="288" y="248" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="271" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="346" y="271" font-size="10.5" fill="#d6a040" font-weight="bold">3 个 1</text>

  <!-- divider -->
  <line x1="40" y1="300" x2="520" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Step 3 header ===== -->
  <rect x="30" y="312" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第三步：异或翻转</text>

  <!-- Row num = 5 -->
  <text x="44" y="368" font-size="12.5" fill="#446688" font-weight="bold">num</text>
  <rect x="180" y="350" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="373" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="350" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="257" y="373" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="288" y="350" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="373" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- ^ symbol -->
  <text x="158" y="402" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">^</text>
  <line x1="180" y1="394" x2="334" y2="394" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- Row mask = 7 -->
  <text x="44" y="424" font-size="12.5" fill="#d6a040" font-weight="bold">mask</text>
  <rect x="180" y="406" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="429" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="406" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="257" y="429" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="288" y="406" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="429" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- result line -->
  <line x1="180" y1="448" x2="334" y2="448" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="476" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">=</text>
  <rect x="180" y="460" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="483" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="234" y="460" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="483" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="288" y="460" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="483" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="346" y="483" font-size="11" fill="#b85450" font-weight="bold">= 2 ✓</text>
</svg>
