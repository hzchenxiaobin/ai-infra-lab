<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最高有效位定正号，符号逐位翻转</text>

  <!-- ===== Panel A: n = 521 ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">n = 521</text>

  <!-- sign row for 521 -->
  <text x="142" y="80" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="196" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−</text>
  <text x="250" y="80" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+</text>

  <!-- digit boxes 5,2,1 -->
  <rect x="120" y="86" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="113" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <rect x="174" y="86" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="113" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="228" y="86" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="113" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <text x="284" y="113" font-size="15" fill="#888">=</text>
  <rect x="300" y="86" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="113" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- arrow: 最高位起始 +，向右翻转 -->
  <path d="M 120 138 L 272 138" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="156" text-anchor="middle" font-size="11" fill="#888">最高位取 +，每往右一位符号翻转一次</text>

  <!-- divider -->
  <line x1="40" y1="178" x2="500" y2="178" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: n = 886996 ===== -->
  <text x="40" y="200" font-size="12" fill="#446688" font-weight="bold">n = 886996</text>

  <!-- signs for 8 8 6 9 9 6 : + - + - + - -->
  <text x="58" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="102" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−</text>
  <text x="146" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="190" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−</text>
  <text x="234" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="278" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−</text>

  <!-- digit boxes -->
  <rect x="38" y="230" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="82" y="230" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="126" y="230" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="170" y="230" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="214" y="230" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="258" y="230" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <text x="312" y="255" font-size="14" fill="#888">=</text>
  <rect x="328" y="230" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="353" y="255" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- rule box -->
  <rect x="40" y="296" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="316" font-size="12" fill="#d6a040" font-weight="bold">符号规则：</text>
  <text x="56" y="336" font-size="11.5" fill="#333">• 从最高有效位起，第 0、2、4… 位（偶数位）取 <tspan font-weight="bold" fill="#4a7a3a">+</tspan>，第 1、3、5… 位（奇数位）取 <tspan font-weight="bold" fill="#b85450">−</tspan></text>
  <text x="56" y="354" font-size="11.5" fill="#333">• 等价地：相邻两位符号总是相反，逐位累加即得答案</text>
</svg>
