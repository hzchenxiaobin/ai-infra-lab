<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：碗沿 = 较小端点 × 它的相邻更大元素</text>

  <!-- Row 1: bowl [3,1,4] -->
  <text x="66" y="58" font-size="13" fill="#446688" filter="url(#rough2)">碗 [3,1,4]</text>

  <path d="M 194,66 Q 244,44 290,66" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="38" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 右侧第一个更大 → 4</text>

  <rect x="70" y="72" width="48" height="40" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="97" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="120" y="72" width="48" height="40" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="97" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <rect x="170" y="72" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="97" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">3</text>
  <rect x="220" y="72" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="97" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="270" y="72" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="294" y="97" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">4</text>

  <text x="94" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="144" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="194" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="244" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="294" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 194,70 Q 244,102 294,70" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="335" y="72" width="175" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="89" text-anchor="middle" font-size="11" fill="#33445e" filter="url(#rough2)">min(3,4)=3 &gt; max(1)=1</text>
  <text x="422" y="105" text-anchor="middle" font-size="11" fill="#33445e" filter="url(#rough2)">长度 3 ≥ 3 ✓ 是碗</text>

  <!-- Row 2: bowl [5,3,1,4] -->
  <text x="66" y="178" font-size="13" fill="#446688" filter="url(#rough2)">碗 [5,3,1,4]</text>

  <path d="M 290,186 Q 217,162 148,186" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 左侧第一个更大 → 5</text>

  <rect x="70" y="192" width="48" height="40" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="217" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="120" y="192" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="144" y="217" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">5</text>
  <rect x="170" y="192" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="217" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="220" y="192" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="217" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="270" y="192" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="294" y="217" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">4</text>

  <text x="94" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="144" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="194" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="244" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="294" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 146,190 Q 220,232 294,190" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="335" y="192" width="175" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="209" text-anchor="middle" font-size="11" fill="#33445e" filter="url(#rough2)">min(5,4)=4 &gt; max(3,1)=3</text>
  <text x="422" y="225" text-anchor="middle" font-size="11" fill="#33445e" filter="url(#rough2)">长度 4 ≥ 3 ✓ 是碗</text>

  <!-- Summary box -->
  <rect x="55" y="282" width="410" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#6a5320" filter="url(#rough2)">中间元素全 &lt; 较小端点值 ⇒ 从较小端走向另一端，第一个更大的恰是另一端</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#6a5320" filter="url(#rough2)">配对距离 ≥ 2（中间非空）即碗，每个碗恰计一次</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#8a7a4a" filter="url(#rough2)">绿 = 较小端点 · 蓝 = 较大端点 · 橙 = 碗底（中间元素）</text>
</svg>
