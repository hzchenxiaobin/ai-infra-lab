<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历贪心</text>

  <!-- Start node -->
  <rect x="210" y="44" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333">开始：i=0, ans=0</text>

  <!-- Arrow down -->
  <path d="M 260 76 L 260 96" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s[i] == 'X' ? -->
  <polygon points="260,96 360,140 260,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[i] == 'X' ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">(且 i &lt; n)</text>

  <!-- Yes branch: right -->
  <path d="M 360 140 L 400 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Yes action box -->
  <rect x="400" y="120" width="104" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans++</text>
  <text x="452" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i += 3</text>

  <!-- No branch: left -->
  <path d="M 160 140 L 120 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="134" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- No action box -->
  <rect x="16" y="120" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="68" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i += 1</text>

  <!-- Arrows from both boxes down and merging -->
  <path d="M 452 160 L 452 200 L 260 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 68 160 L 68 200 L 260 200" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Merge point -->
  <circle cx="260" cy="200" r="4" fill="#666" filter="url(#rough2)"/>

  <!-- Arrow down to loop check -->
  <path d="M 260 204 L 260 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop check: i < n ? -->
  <polygon points="260,224 360,262 260,300 160,262" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Yes: loop back to decision -->
  <path d="M 360 262 L 400 262 L 400 140 L 360 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是，继续</text>

  <!-- No: return -->
  <path d="M 160 262 L 120 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="256" font-size="11" fill="#888" font-weight="bold">否</text>

  <rect x="16" y="246" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="68" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Bottom note -->
  <rect x="60" y="312" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555">遇到 X：ans++ 并跳 3 格（窗口覆盖 [i,i+1,i+2]）</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#555">遇到 O：跳 1 格继续扫描 → 整体 O(n) 一趟过</text>
</svg>
