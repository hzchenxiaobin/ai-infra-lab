<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 2 演算：3 个负号（奇）→ 留在最小绝对值处</text>

  <!-- ===== Original grid 3x3 ===== -->
  <text x="116" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">原矩阵</text>
  <g font-size="13" filter="url(#rough2)">
    <!-- row0: 1 2 3 -->
    <rect x="50" y="66" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="94" text-anchor="middle" fill="#333">1</text>
    <rect x="94" y="66" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="94" text-anchor="middle" fill="#333">2</text>
    <rect x="138" y="66" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="94" text-anchor="middle" fill="#333">3</text>
    <!-- row1: -1 -2 -3 -->
    <rect x="50" y="110" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="72" y="138" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="94" y="110" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="116" y="138" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="138" y="110" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <!-- row2: 1 2 3 -->
    <rect x="50" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="182" text-anchor="middle" fill="#333">1</text>
    <rect x="94" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="182" text-anchor="middle" fill="#333">2</text>
    <rect x="138" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="182" text-anchor="middle" fill="#333">3</text>
  </g>
  <text x="116" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">neg = 3（奇），无 0</text>

  <!-- arrow between grids -->
  <path d="M 196 132 L 300 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="122" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">负号集中到 |1| 处</text>
  <text x="248" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（mn = 1）</text>

  <!-- ===== Result grid 3x3 ===== -->
  <text x="388" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">最终矩阵</text>
  <g font-size="13" filter="url(#rough2)">
    <!-- row0: -1 2 3 -->
    <rect x="322" y="66" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="344" y="94" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="366" y="66" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="388" y="94" text-anchor="middle" fill="#333">2</text>
    <rect x="410" y="66" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="432" y="94" text-anchor="middle" fill="#333">3</text>
    <!-- row1: 1 2 3 -->
    <rect x="322" y="110" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="344" y="138" text-anchor="middle" fill="#333">1</text>
    <rect x="366" y="110" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="388" y="138" text-anchor="middle" fill="#333">2</text>
    <rect x="410" y="110" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="432" y="138" text-anchor="middle" fill="#333">3</text>
    <!-- row2: 1 2 3 -->
    <rect x="322" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="344" y="182" text-anchor="middle" fill="#333">1</text>
    <rect x="366" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="388" y="182" text-anchor="middle" fill="#333">2</text>
    <rect x="410" y="154" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="432" y="182" text-anchor="middle" fill="#333">3</text>
  </g>
  <text x="388" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">仅剩 1 个负号</text>

  <!-- ===== bottom computation ===== -->
  <rect x="40" y="240" width="440" height="124" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="262" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">逐步求解：</text>
  <text x="56" y="284" font-size="11" fill="#444" filter="url(#rough2)">① S = |1|+|2|+|3|×2 行 + |1|+|2|+|3| = 1+2+3+1+2+3+1+2+3 = 18</text>
  <text x="56" y="304" font-size="11" fill="#444" filter="url(#rough2)">② mn = min(1,2,3,1,2,3,1,2,3) = 1；neg = 3 为奇数，且无 0</text>
  <text x="56" y="324" font-size="11" fill="#444" filter="url(#rough2)">③ 走“奇数”分支：答案 = S − 2·mn = 18 − 2×1 =</text>
  <text x="460" y="324" text-anchor="end" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">16</text>
  <text x="56" y="346" font-size="10" fill="#888" filter="url(#rough2)">最终矩阵和 = −1+2+3+1+2+3+1+2+3 = 16，与示例输出一致</text>
</svg>
