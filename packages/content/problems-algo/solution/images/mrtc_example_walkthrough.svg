<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 2, batteries = [3, 3, 3]，total = 9，答案区间 [1, 4]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">check(t)：Σ min(3, t) ×3 与 2·t 比较，二分找最大可行 t</text>

  <!-- Header row background -->
  <rect x="20" y="60" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- Header texts -->
  <text x="41" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <text x="77" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">lo</text>
  <text x="107" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">hi</text>
  <text x="140" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">mid</text>
  <text x="205" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">min(3,mid)×3</text>
  <text x="290" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n·mid = 2·mid</text>
  <text x="350" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">≥?</text>
  <text x="450" y="79" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>

  <!-- Column dividers -->
  <line x1="62" y1="90" x2="62" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="92" y1="90" x2="92" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="122" y1="90" x2="122" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="158" y1="90" x2="158" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="90" x2="252" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="328" y1="90" x2="328" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="90" x2="372" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: lo=1, hi=4, mid=2, sum=6, target=4, ✓ -->
  <rect x="20" y="90" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="77" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="107" y="111" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="205" y="111" text-anchor="middle" font-size="11" fill="#333">2×3 = 6</text>
  <text x="290" y="111" text-anchor="middle" font-size="11" fill="#333">2×2 = 4</text>
  <text x="350" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="450" y="111" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans=2, lo=3</text>

  <!-- Row 2: lo=3, hi=4, mid=3, sum=9, target=6, ✓ -->
  <rect x="20" y="122" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="77" y="143" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="107" y="143" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="205" y="143" text-anchor="middle" font-size="11" fill="#333">3×3 = 9</text>
  <text x="290" y="143" text-anchor="middle" font-size="11" fill="#333">2×3 = 6</text>
  <text x="350" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="450" y="143" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans=3, lo=4</text>

  <!-- Row 3: lo=4, hi=4, mid=4, sum=9, target=8, ✓ -->
  <rect x="20" y="154" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="41" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="77" y="175" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="107" y="175" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="205" y="175" text-anchor="middle" font-size="11" fill="#333">3×3 = 9</text>
  <text x="290" y="175" text-anchor="middle" font-size="11" fill="#333">2×4 = 8</text>
  <text x="350" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="450" y="175" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans=4, lo=5</text>

  <!-- Final row -->
  <rect x="20" y="186" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">lo=5 &gt; hi=4 → 循环结束，返回 ans = 4</text>

  <!-- Bottom note -->
  <rect x="40" y="234" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#444">t ≤ 3 时 Σmin = 3·t &gt; 2·t 恒可行；t &gt; 4.5 时 Σmin = 9 &lt; 2·t 不可行</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#444">交点 t = 4.5，最大整数可行 t = 4</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#446688">每节电池用 min(b, mid) 截断，sum ≥ n·mid 提前剪枝防溢出</text>
</svg>
