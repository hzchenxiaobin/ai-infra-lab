<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：窗口里每个字符最多 2 张「门票」</text>

  <!-- Panel A caption -->
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">① right=3：b 第 3 次入窗，窗口 [0,3]="bcbb" 违规</text>

  <!-- String row A -->
  <rect x="92" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="134" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="176" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="218" y="64" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="260" y="64" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="302" y="64" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="86" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <rect x="344" y="64" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="364" y="86" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="386" y="64" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="406" y="86" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">a</text>

  <!-- indices A -->
  <text x="112" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="154" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="196" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="238" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="322" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="364" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="406" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- pointers A -->
  <path d="M 112 124 L 112 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="112" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">left</text>
  <path d="M 238 124 L 238 116" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="238" y="138" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">right</text>

  <!-- badge A -->
  <rect x="92" y="148" width="334" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="259" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">freq[b] = 3 &gt; 2 ✗ —— 只有新入窗的 s[right] 可能超标</text>

  <!-- arrow down -->
  <path d="M 260 182 L 260 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="199" font-size="11" fill="#555" filter="url(#rough2)">收缩：吐出 s[0]='b'，left 0→1</text>

  <!-- Panel B caption -->
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 收缩后窗口 [1,3]="cbb" 恢复合法</text>

  <!-- String row B -->
  <rect x="92" y="240" width="40" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="262" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)">b</text>
  <rect x="134" y="240" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="262" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="176" y="240" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="262" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="218" y="240" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="262" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="260" y="240" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="302" y="240" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <rect x="344" y="240" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="364" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="386" y="240" width="40" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="406" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">a</text>

  <!-- indices B -->
  <text x="112" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="154" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="196" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="238" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="322" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="364" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="406" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- badge B -->
  <rect x="92" y="298" width="334" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="259" y="318" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">freq: b=2 ✓ c=1 ✓ —— 不变式恢复，窗口长 3（maxLen 仍 3）</text>

  <!-- bottom note -->
  <rect x="48" y="336" width="424" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不变式：任意时刻窗口内每字符频次 ≤ 2；right 只管扩张，left 只在违规时收缩</text>
  <text x="260" y="367" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">合法窗口的子串必合法（闭包性）→ left 单调不减，双指针不漏解</text>
</svg>
