<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="600" height="460" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">多线程爬虫：线程池 + 锁保护临界区</text>
  <path d="M 160 36 Q 300 44 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Top: Worker threads ===== -->
  <text x="36" y="64" font-size="11" fill="#888">工作线程（并发调用 getUrls）：</text>

  <!-- Worker 1 -->
  <g filter="url(#sk)">
    <rect x="44" y="72" width="120" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="104" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Worker T1</text>
  <text x="104" y="108" text-anchor="middle" font-size="9" fill="#666">getUrls(url_A)</text>

  <!-- Worker 2 -->
  <g filter="url(#sk)">
    <rect x="240" y="72" width="120" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="300" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Worker T2</text>
  <text x="300" y="108" text-anchor="middle" font-size="9" fill="#666">getUrls(url_B)</text>

  <!-- Worker 3 -->
  <g filter="url(#sk)">
    <rect x="436" y="72" width="120" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="496" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Worker T3</text>
  <text x="496" y="108" text-anchor="middle" font-size="9" fill="#666">idle → 领任务</text>

  <!-- arrows from workers down to queue -->
  <path d="M 104 124 Q 104 146 168 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 124 Q 300 146 300 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 496 124 Q 496 146 432 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Middle: Lock-protected critical section ===== -->
  <g filter="url(#sk)">
    <rect x="100" y="156" width="400" height="130" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">🔒 临界区（Lock 保护）</text>

  <!-- Queue -->
  <text x="124" y="200" font-size="10" fill="#888">任务队列 q：</text>
  <g filter="url(#sk)">
    <rect x="124" y="206" width="72" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="160" y="222" text-anchor="middle" font-size="9" fill="#333">url_C</text>
  <g filter="url(#sk)">
    <rect x="198" y="206" width="72" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="234" y="222" text-anchor="middle" font-size="9" fill="#333">url_D</text>
  <g filter="url(#sk)">
    <rect x="272" y="206" width="72" height="24" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="308" y="222" text-anchor="middle" font-size="9" fill="#aaa">…</text>

  <!-- Visited set -->
  <text x="124" y="248" font-size="10" fill="#888">已访问 visited：</text>
  <g filter="url(#sk)">
    <rect x="124" y="254" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="150" y="269" text-anchor="middle" font-size="8.5" fill="#b85450">startUrl</text>
  <g filter="url(#sk)">
    <rect x="180" y="254" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="206" y="269" text-anchor="middle" font-size="8.5" fill="#b85450">url_A</text>
  <g filter="url(#sk)">
    <rect x="236" y="254" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="262" y="269" text-anchor="middle" font-size="8.5" fill="#b85450">url_B</text>
  <g filter="url(#sk)">
    <rect x="292" y="254" width="52" height="22" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <text x="318" y="269" text-anchor="middle" font-size="8.5" fill="#aaa">…</text>

  <!-- working counter -->
  <text x="400" y="200" font-size="10" fill="#888">活跃计数：</text>
  <g filter="url(#sk)">
    <rect x="400" y="206" width="76" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="438" y="225" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">working=3</text>

  <!-- cond.notify -->
  <g filter="url(#sk)">
    <rect x="400" y="248" width="76" height="28" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="438" y="267" text-anchor="middle" font-size="9" fill="#446688">cv.notify</text>

  <!-- ===== Bottom: Race condition explanation ===== -->
  <path d="M 36 300 L 564 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>

  <text x="36" y="322" font-size="11" fill="#888" font-weight="bold">竞态场景：不加锁 → 同一 URL 重复入队</text>

  <!-- Thread 1 timeline -->
  <g filter="url(#sk)">
    <rect x="44" y="332" width="64" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="76" y="346" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">T1</text>

  <text x="116" y="346" font-size="9" fill="#333">查 visited → url_X 不在 ✓</text>
  <path d="M 250 338 L 280 338" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="346" font-size="9" fill="#b85450" font-weight="bold">（还没加！）</text>

  <!-- Thread 2 timeline interleaved -->
  <g filter="url(#sk)">
    <rect x="44" y="360" width="64" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="76" y="374" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">T2</text>

  <text x="116" y="374" font-size="9" fill="#333">查 visited → url_X 也不在 ✓</text>
  <path d="M 250 370 L 280 370" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="374" font-size="9" fill="#b85450" font-weight="bold">重复入队 ✗</text>

  <!-- Solution box -->
  <g filter="url(#sk)">
    <rect x="44" y="396" width="512" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="56" y="416" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 解法：用 Lock 把「检查 visited + 加入 visited + 入队 + 计数」打包成原子操作</text>
  <text x="56" y="434" font-size="10" fill="#4a7a3a">T1 持锁期间 T2 阻塞 → T1 加完 url_X 后 T2 才查 → T2 看到 url_X 已在 → 跳过</text>
</svg>
