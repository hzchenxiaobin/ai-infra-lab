<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：fronts=[1,2,4,4,7] backs=[1,3,4,1,3]</text>

  <!-- Cards row -->
  <text x="30" y="58" font-size="10" fill="#888">卡片：</text>

  <!-- Card 0: 1|1 (bad) -->
  <rect x="70" y="44" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <line x1="74" y1="68" x2="126" y2="68" stroke="#b85450" stroke-width="0.8" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="100" y="108" text-anchor="middle" font-size="9" fill="#b85450">×同</text>

  <!-- Card 1: 2|3 (good) -->
  <rect x="150" y="44" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="154" y1="68" x2="206" y2="68" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="180" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">异</text>

  <!-- Card 2: 4|4 (bad) -->
  <rect x="230" y="44" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <line x1="234" y1="68" x2="286" y2="68" stroke="#b85450" stroke-width="0.8" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="260" y="108" text-anchor="middle" font-size="9" fill="#b85450">×同</text>

  <!-- Card 3: 4|1 (good) -->
  <rect x="310" y="44" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="314" y1="68" x2="366" y2="68" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="340" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">异</text>

  <!-- Card 4: 7|3 (good) -->
  <rect x="390" y="44" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <line x1="394" y1="68" x2="446" y2="68" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="420" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">异</text>

  <!-- Step 1: bad set -->
  <rect x="40" y="130" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="150" font-size="11" fill="#b85450" font-weight="bold">第一步：坏数集合 bad = { 1, 4 }</text>
  <text x="52" y="168" font-size="10" fill="#555">卡片0: 1==1 → bad加1；卡片2: 4==4 → bad加4。其余卡片正反不同，跳过</text>

  <!-- Step 2: candidates -->
  <rect x="40" y="195" width="480" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="215" font-size="11" fill="#4a7a3a" font-weight="bold">第二步：扫描所有数，排除 bad 中的</text>
  <text x="52" y="233" font-size="10" fill="#555">所有数：{1, 2, 3, 4, 7}（fronts ∪ backs）</text>
  <text x="52" y="250" font-size="10" fill="#555">排除 bad {1, 4} 后候选好数：{2, 3, 7}</text>

  <!-- Step 3: answer -->
  <rect x="40" y="280" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="11" fill="#446688" font-weight="bold">第三步：取候选中最小值 → ans = 2</text>
  <text x="52" y="318" font-size="10" fill="#555">翻卡片1（front=2→翻为back=3朝上），2藏在正面朝下，2不可见 → 好数！</text>

  <!-- Verification -->
  <rect x="40" y="345" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="52" y="363" font-size="10" fill="#8a6a20" font-weight="bold">验证 2 是好数：翻卡片1→桌面显示 [1,3,4,4,7]，2隐藏在卡片1 ✓</text>
  <text x="52" y="378" font-size="10" fill="#555">1、4 永远可见（卡片0、2正反相同）→ 不可隐藏 → 不是好数</text>
</svg>
