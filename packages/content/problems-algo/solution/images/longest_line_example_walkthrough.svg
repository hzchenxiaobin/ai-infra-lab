  <rect x="178" y="128" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="143" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- d row -->
  <text x="40" y="160" font-size="10" fill="#d6a040">d</text>
  <rect x="70" y="152" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="167" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="106" y="152" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="124" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="152" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="152" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="167" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- a row -->
  <text x="40" y="182" font-size="10" fill="#b85450">a</text>
  <rect x="70" y="176" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="191" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="106" y="176" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="124" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="176" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="176" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="191" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <text x="230" y="143" font-size="10" fill="#888">ans = 2（水平 row0 的 [1,1]）</text>

  <!-- separator -->
  <line x1="30" y1="204" x2="530" y2="204" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 1 ====== -->
  <text x="40" y="222" font-size="11" fill="#446688" font-weight="bold">处理 row 1: [0,1,1,0]</text>

  <text x="40" y="244" font-size="10" fill="#888">mat</text>
  <rect x="70" y="232" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
