  <text x="88" y="447" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="106" y="432" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
