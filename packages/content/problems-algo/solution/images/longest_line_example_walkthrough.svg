  <text x="230" y="295" font-size="10" fill="#888">ans = 2（v/d/a 各有 2）</text>
  <text x="230" y="319" font-size="9.5" fill="#d6a040">d[2]=2: (0,1)→(1,2) 对角</text>

  <line x1="30" y1="356" x2="530" y2="356" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 2 ====== -->
