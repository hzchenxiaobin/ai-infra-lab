  <rect x="106" y="128" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="124" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="128" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
