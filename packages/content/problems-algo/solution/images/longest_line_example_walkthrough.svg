  <text x="230" y="423" font-size="10" fill="#888">d[3] = prev + 1 = 2 + 1 = 3</text>

  <!-- highlight answer -->
  <text x="40" y="462" font-size="10" fill="#d6a040">d</text>
  <rect x="70" y="456" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="471" text-anchor="middle" font-size="11" fill="#aaa">0</text>
