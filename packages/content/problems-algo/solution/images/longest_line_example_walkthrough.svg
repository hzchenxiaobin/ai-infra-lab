  <text x="160" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="178" y="256" width="36" height="22" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
