  <rect x="178" y="408" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="196" y="423" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="40" y="440" font-size="10" fill="#446688">v</text>
