<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两层拓扑：项目级 + 小组级</text>

  <!-- ===== Top: item level ===== -->
  <text x="30" y="60" font-size="12" fill="#666" filter="url(#rough2)">① 项目级图（同组内的依赖边）</text>

  <!-- Group 0 -->
  <rect x="40" y="75" width="160" height="95" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="93" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">小组 0</text>
  <circle cx="75" cy="130" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="120" cy="130" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="165" cy="130" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <path d="M90,130 L105,130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M135,130 L150,130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Group 1 -->
  <rect x="235" y="75" width="115" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="292" y="93" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">小组 1</text>
  <circle cx="265" cy="130" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="320" cy="130" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <path d="M280,130 L305,130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Singleton group (item 1) -->
  <rect x="385" y="75" width="90" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="93" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">新组 3</text>
  <circle cx="430" cy="130" r="15" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- Cross-group edge 6 -> 1 (dashed red) -->
  <path d="M75,115 Q250,35 415,118" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="45" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跨组边 6→1（beforeItems）</text>

  <!-- Divider -->
  <path d="M40,195 L520,195" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Bottom: group level ===== -->
  <text x="30" y="220" font-size="12" fill="#666" filter="url(#rough2)">② 小组级图（跨组边折叠为组间依赖）</text>

  <rect x="60" y="235" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G0</text>

  <rect x="235" y="235" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="267" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G1</text>

  <rect x="395" y="235" width="64" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="427" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G3</text>

  <!-- group edge G0 -> G3 -->
  <path d="M124,256 Q260,300 395,256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">G0 → G3（组间依赖）</text>

  <!-- explanation box -->
  <rect x="40" y="335" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">同组边 → 项目级图（组内排序）；跨组边 → 小组级图（组间排序）</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">先对小组拓扑排序，再按组序对每组内项目拓扑排序，最后拼接</text>
</svg>
