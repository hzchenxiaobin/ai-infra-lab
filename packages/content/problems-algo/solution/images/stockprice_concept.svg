<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心：哈希表存「真相」，双堆 + 延迟删除取最值</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">update 只 push 不删；查询时校验堆顶是否与真相一致，过时就 pop</text>

  <!-- ===== 左：真相源 ts2price ===== -->
  <rect x="30" y="70" width="170" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="115" y="92" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">ts2price（真相源）</text>
  <text x="115" y="108" text-anchor="middle" font-size="10" fill="#5a7a4a">timestamp → 当前有效 price</text>

  <!-- hash entries -->
  <rect x="48" y="122" width="64" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="11" fill="#333">t=1</text>
  <rect x="118" y="122" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="139" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p=3</text>

  <rect x="48" y="154" width="64" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="171" text-anchor="middle" font-size="11" fill="#333">t=2</text>
  <rect x="118" y="154" width="64" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="11" fill="#333">p=5</text>

  <rect x="48" y="186" width="64" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="203" text-anchor="middle" font-size="11" fill="#333">t=4</text>
  <rect x="118" y="186" width="64" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="203" text-anchor="middle" font-size="11" fill="#333">p=2</text>

  <text x="115" y="234" text-anchor="middle" font-size="10" fill="#5a7a4a">maxTs = 4 → current()</text>
  <text x="115" y="248" text-anchor="middle" font-size="10" fill="#5a7a4a">返回 ts2price[4] = 2</text>

  <!-- ===== 中上：maxHeap ===== -->
  <rect x="240" y="70" width="150" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="315" y="92" text-anchor="middle" font-size="12.5" fill="#2a4a6a" font-weight="bold">maxHeap（大顶）</text>

  <!-- heap layers -->
  <rect x="280" y="104" width="70" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(10,1) ✗</text>
  <rect x="250" y="134" width="60" height="22" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#333">(5,2)</text>
  <rect x="320" y="134" width="60" height="22" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="350" y="150" text-anchor="middle" font-size="10.5" fill="#333">(3,1)</text>
  <text x="315" y="168" text-anchor="middle" font-size="9.5" fill="#b85450">顶 (10,1): ts2price[1]=3≠10 → 过时</text>

  <!-- ===== 中下：minHeap ===== -->
  <rect x="240" y="190" width="150" height="105" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="315" y="212" text-anchor="middle" font-size="12.5" fill="#6a2a2a" font-weight="bold">minHeap（小顶）</text>

  <rect x="280" y="224" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(2,4) ✓</text>
  <rect x="250" y="254" width="60" height="22" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#333">(3,1)</text>
  <rect x="320" y="254" width="60" height="22" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="350" y="270" text-anchor="middle" font-size="10.5" fill="#333">(5,2)</text>
  <text x="315" y="288" text-anchor="middle" font-size="9.5" fill="#4a7a3a">顶 (2,4): ts2price[4]=2=2 → 有效</text>

  <!-- ===== 右：校验逻辑 ===== -->
  <rect x="410" y="70" width="135" height="225" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="477" y="92" text-anchor="middle" font-size="12" fill="#6a4a20" font-weight="bold">查询时校验</text>

  <rect x="425" y="106" width="105" height="42" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="477" y="122" text-anchor="middle" font-size="10" fill="#333">取堆顶 (p, t)</text>
  <text x="477" y="138" text-anchor="middle" font-size="10" fill="#333">查 ts2price[t]</text>

  <path d="M 477 150 L 477 162" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="425" y="166" width="105" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="184" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">相等 → 有效</text>
  <text x="477" y="196" text-anchor="middle" font-size="9.5" fill="#3a5a2a">返回 p</text>

  <rect x="425" y="208" width="105" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="226" text-anchor="middle" font-size="10" fill="#6a2a2a" font-weight="bold">不等 → 过时</text>
  <text x="477" y="238" text-anchor="middle" font-size="9.5" fill="#6a2a2a">pop，看下一个</text>

  <path d="M 430 208 Q 415 188 425 184" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="200" font-size="8.5" fill="#888" text-anchor="end">否</text>
  <path d="M 430 166 Q 415 186 425 188" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="180" font-size="8.5" fill="#888" text-anchor="end">是</text>

  <text x="477" y="256" text-anchor="middle" font-size="9.5" fill="#6a4a20">每条目最多被</text>
  <text x="477" y="270" text-anchor="middle" font-size="9.5" fill="#6a4a20">push 一次 / pop 一次</text>
  <text x="477" y="284" text-anchor="middle" font-size="9.5" fill="#6a4a20">→ 均摊 O(log n)</text>

  <!-- arrows from hash to heaps (push) -->
  <path d="M 200 130 Q 220 110 240 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="108" font-size="9.5" fill="#4a7a3a" text-anchor="middle">push</text>
  <path d="M 200 200 Q 220 220 240 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="222" font-size="9.5" fill="#4a7a3a" text-anchor="middle">push</text>

  <!-- Footer -->
  <rect x="30" y="310" width="515" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="287" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">延迟删除精髓</text>
  <text x="287" y="346" text-anchor="middle" font-size="10.5" fill="#555">update 不主动删旧条目 → 堆中可能残留过时数据 → 查询时用 ts2price 校验堆顶</text>
  <text x="287" y="360" text-anchor="middle" font-size="10" fill="#888">对照 239 滑动窗口最大值：窗口滑出 = 价格被更正，都是「真相源校验候选集顶」</text>
</svg>
