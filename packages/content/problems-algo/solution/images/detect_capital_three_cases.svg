<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三种合法大写用法 + 一种非法</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">蓝格 = 大写字母，绿格 = 小写字母</text>

  <!-- legend -->
  <rect x="430" y="34" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="448" y="45" font-size="10" fill="#555">大写</text>
  <rect x="486" y="34" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="504" y="45" font-size="10" fill="#555">小写</text>

  <!-- ===== Row 1: USA (all upper, case 1) ===== -->
  <text x="40" y="92" font-size="11.5" fill="#446688" font-weight="bold">规则1</text>
  <text x="40" y="108" font-size="10" fill="#888">全大写</text>

  <rect x="100" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">U</text>
  <rect x="148" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">S</text>
  <rect x="196" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">A</text>

  <rect x="270" y="78" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt = 3 = n ✓</text>

  <text x="380" y="98" font-size="14" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 2: leetcode (all lower, case 2) ===== -->
  <text x="40" y="152" font-size="11.5" fill="#4a7a3a" font-weight="bold">规则2</text>
  <text x="40" y="168" font-size="10" fill="#888">全小写</text>

  <!-- leetcode = 8 chars, cells 38px wide -->
  <rect x="100" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="119" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="140" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="180" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="220" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="260" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="300" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="340" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="380" y="136" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="399" y="158" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>

  <rect x="440" y="138" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="483" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt = 0 ✓</text>

  <text x="540" y="158" font-size="14" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 3: Google (first upper, case 3) ===== -->
  <text x="40" y="212" font-size="11.5" fill="#d6a040" font-weight="bold">规则3</text>
  <text x="40" y="228" font-size="10" fill="#888">首大写</text>

  <rect x="100" y="196" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">G</text>
  <rect x="148" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>
  <rect x="196" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>
  <rect x="244" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="266" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">g</text>
  <rect x="292" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">l</text>
  <rect x="340" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="362" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>

  <rect x="410" y="198" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">cnt=1 &amp; 首字母 ✓</text>

  <text x="540" y="218" font-size="14" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- separator -->
  <line x1="40" y1="252" x2="540" y2="252" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ 不属于以上三种 → 非法</text>

  <!-- ===== Row 4: FlaG (invalid) ===== -->
  <text x="40" y="292" font-size="11.5" fill="#b85450" font-weight="bold">非法</text>
  <text x="40" y="308" font-size="10" fill="#888">混用</text>

  <rect x="100" y="276" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="298" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">F</text>
  <rect x="148" y="276" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="298" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">l</text>
  <rect x="196" y="276" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="298" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="244" y="276" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="266" y="298" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">G</text>

  <!-- arrow pointing at the rogue G -->
  <path d="M 288 288 L 360 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="292" font-size="11" fill="#b85450" font-weight="bold">非首位的</text>
  <text x="376" y="306" font-size="11" fill="#b85450" font-weight="bold">大写 → ✗</text>

  <rect x="452" y="278" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt=2 ✗</text>

  <text x="540" y="298" font-size="14" fill="#b85450" font-weight="bold">false</text>

  <!-- ===== bottom summary ===== -->
  <rect x="40" y="338" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">统一判定：cnt == n（全大写）或 cnt == 0（全小写）</text>
  <text x="290" y="376" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">或 cnt == 1 且 word[0] 为大写（首字母大写）→ 否则 false</text>
</svg>
