<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：0 转 −1 → 前缀和 → 统计 pref[j] &gt; pref[i]</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">1 多于 0 ⟺ 子数组和 &gt; 0 ⟺ pref[j] &gt; pref[i]</text>

  <!-- A. original array -->
  <text x="28" y="80" font-size="11" fill="#666" font-weight="bold">原数组</text>
  <rect x="120" y="64" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="166" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="258" y="64" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="304" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- arrow down with transform note -->
  <path d="M 230 100 L 230 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="114" font-size="10.5" fill="#a87020" font-weight="bold">0 → −1，1 → +1</text>

  <!-- B. transformed array -->
  <text x="28" y="140" font-size="11" fill="#666" font-weight="bold">变换后</text>
  <rect x="120" y="124" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="166" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">+1</text>
  <rect x="212" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">+1</text>
  <rect x="258" y="124" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="304" y="124" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">+1</text>

  <!-- arrow down -->
  <path d="M 230 160 L 230 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="174" font-size="10.5" fill="#a87020" font-weight="bold">求前缀和，pref[0]=0</text>

  <!-- C. prefix sum row (6 cells) -->
  <text x="28" y="206" font-size="11" fill="#666" font-weight="bold">前缀和</text>
  <!-- pref index labels -->
  <rect x="96" y="190" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <rect x="142" y="190" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−1</text>
  <rect x="188" y="190" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <rect x="234" y="190" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="190" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <rect x="326" y="190" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>

  <!-- index ticks -->
  <text x="118" y="238" text-anchor="middle" font-size="9.5" fill="#aaa">pref[0]</text>
  <text x="164" y="238" text-anchor="middle" font-size="9.5" fill="#aaa">pref[1]</text>
  <text x="348" y="238" text-anchor="middle" font-size="9.5" fill="#aaa">pref[5]</text>

  <!-- arrow down -->
  <path d="M 230 244 L 230 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D. key insight -->
  <rect x="50" y="262" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">子数组 nums[i..j−1] 的和 = pref[j] − pref[i]</text>

  <rect x="50" y="304" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">和 &gt; 0 ⟺ pref[j] &gt; pref[i]（i &lt; j）</text>

  <!-- conclusion box -->
  <rect x="50" y="346" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 统计有多少对 (i, j)，i &lt; j 且 pref[i] &lt; pref[j]</text>
  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a">树状数组维护已出现前缀和，查询 &lt; 当前 s 的个数</text>
</svg>
