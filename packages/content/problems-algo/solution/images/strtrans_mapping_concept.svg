<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：批量替换 → 映射必须是函数</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一次转换改变 str1 中某字符的「所有」出现 → 同一源字符只能映到同一目标</text>

  <!-- ============ 左侧：合法映射（函数） ============ -->
  <rect x="20" y="64" width="260" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="150" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法映射（函数）</text>
  <text x="150" y="104" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">str1="aabcc" → str2="ccdee"</text>

  <!-- str1 行 -->
  <text x="36" y="134" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">str1</text>
  <rect x="44" y="116" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="84" y="116" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="124" y="116" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="164" y="116" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="204" y="116" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>

  <!-- str2 行 -->
  <text x="36" y="268" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">str2</text>
  <rect x="44" y="250" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="84" y="250" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="124" y="250" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="164" y="250" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="204" y="250" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>

  <!-- 映射箭头 a→c -->
  <line x1="62" y1="146" x2="62" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="102" y1="146" x2="102" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="142" y1="146" x2="142" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="182" y1="146" x2="182" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="222" y1="146" x2="222" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 映射表 -->
  <rect x="48" y="300" width="204" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">映射表 m</text>
  <text x="150" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a → c   b → d   c → e</text>
  <text x="150" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同一源字符始终映到同一目标 ✓</text>
  <text x="150" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">a 出现 2 次都映到 c ✓</text>

  <!-- ============ 右侧：非法映射（非函数） ============ -->
  <rect x="300" y="64" width="260" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="430" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 非法映射（非函数）</text>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">str1="aa" → str2="ab"</text>

  <!-- str1 行 -->
  <text x="316" y="134" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">str1</text>
  <rect x="330" y="116" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="136" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="380" y="116" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="136" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- str2 行 -->
  <text x="316" y="268" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">str2</text>
  <rect x="330" y="250" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="380" y="250" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- 箭头 a→a (位置0) -->
  <line x1="352" y1="146" x2="352" y2="248" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 箭头 a→b (位置1) 红色冲突 -->
  <line x1="402" y1="146" x2="402" y2="248" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 冲突标注 -->
  <rect x="338" y="170" width="128" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="402" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">a 已映到 a</text>
  <text x="402" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">又要求 a → b</text>
  <text x="402" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">批量替换：无法分别处理</text>

  <!-- 映射表 -->
  <rect x="328" y="300" width="204" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">映射表 m</text>
  <text x="430" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a → a  且  a → b  ✗</text>
  <text x="430" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">同一源映到两个不同目标</text>
  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">return false</text>
</svg>
