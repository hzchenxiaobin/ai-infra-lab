<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BIT 初始化 + 每次查询三步操作</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">n = queries.length，N = n + m；BIT 容量 N（1-indexed）</text>

  <!-- Step 1: init -->
  <rect x="160" y="64" width="300" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="86" font-size="12" fill="#446688" font-weight="bold">① 初始化 BIT 与 pos</text>
  <text x="178" y="104" font-size="11" fill="#555">对 v ∈ [1, m]：</text>
  <text x="178" y="120" font-size="11" fill="#333">pos[v] = n + v ；update(n + v, +1)</text>
  <text x="178" y="134" font-size="10" fill="#888">前 n 位空出作前插预留；数值 v 落在 n+v</text>

  <!-- arrow down -->
  <path d="M 310 142 L 310 168" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: loop decision -->
  <polygon points="310,172 430,212 310,252 190,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">还有查询？</text>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#888">i 从 0 到 n−1</text>

  <!-- yes branch (down) -->
  <text x="324" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 310 252 L 310 278" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- no branch (right) -->
  <text x="442" y="208" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 430 212 L 540 212 L 540 470" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- v = queries[i] -->
  <rect x="220" y="280" width="180" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">v = queries[i]</text>
  <path d="M 310 316 L 310 338" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step A: query position -->
  <rect x="120" y="340" width="380" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="364" font-size="12" fill="#b85450" font-weight="bold">A. 查位次</text>
  <text x="240" y="364" font-size="12" fill="#333">ans[i] = query(pos[v]) − 1</text>
  <path d="M 310 380 L 310 402" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step B: clear old -->
  <rect x="120" y="404" width="380" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="428" font-size="12" fill="#d6a040" font-weight="bold">B. 旧位置清零</text>
  <text x="252" y="428" font-size="12" fill="#333">update(pos[v], −1)</text>
  <path d="M 310 444 L 310 462" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step C: set new -->
  <rect x="80" y="464" width="420" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="488" font-size="12" fill="#4a7a3a" font-weight="bold">C. 新位置置一</text>
  <text x="206" y="488" font-size="12" fill="#333">pos[v] = n − i ；update(pos[v], +1)</text>

  <!-- loop back arrow: from C right side up to decision -->
  <path d="M 500 484 L 560 484 L 560 212 L 430 212" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="568" y="350" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 568 350)">回到判定 ↑</text>

  <!-- return box -->
  <rect x="430" y="460" width="170" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="515" y="486" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
</svg>
