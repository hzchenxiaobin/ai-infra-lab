<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 + 看符号 + 累加</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">X = 0</text>

  <!-- arrow down -->
  <path d="M 280 78 L 280 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="200" y="96" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">for op in operations</text>

  <!-- arrow down to decision -->
  <path d="M 280 138 L 280 152" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,156 360,196 280,236 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#555">op 含 '+' ?</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#555">(看 op[1])</text>

  <!-- Yes branch left -->
  <path d="M 200 196 L 130 196" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="165" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="62" y="180" width="68" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="202" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">X += 1</text>

  <!-- No branch right -->
  <path d="M 360 196 L 430 196" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="395" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="180" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="464" y="202" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">X −= 1</text>

  <!-- arrows back up to loop -->
  <path d="M 96 214 Q 96 240 130 240 Q 200 240 200 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 464 214 Q 464 240 430 240 Q 360 240 360 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#888">下一轮操作</text>

  <!-- arrow down to end -->
  <path d="M 280 138 Q 380 138 380 280 L 380 296" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="280" font-size="10" fill="#888">遍历结束</text>

  <!-- End -->
  <ellipse cx="380" cy="316" rx="56" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return X</text>

  <!-- One-liner note -->
  <rect x="60" y="340" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11" fill="#4a7a3a">等价一行：sum(+1 if '+' in op else −1 for op in operations)</text>
</svg>
