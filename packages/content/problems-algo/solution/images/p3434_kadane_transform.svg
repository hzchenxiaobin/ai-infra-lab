<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">核心观察：固定被转换值 v → 变换 +1/−1/0 → Kadane 选子数组</text>

  <!-- Row 1: nums -->
  <text x="20" y="48" font-size="11.5" fill="#666" filter="url(#rough2)">示例 2：nums = [10,2,3,4,5,5,4,3,2,2]，k = 10（红），v = 2（绿）</text>

  <rect x="40" y="56" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="76" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">10</text>
  <rect x="84" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="76" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">2</text>
  <rect x="128" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="172" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="216" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="260" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="304" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="348" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="392" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="414" y="76" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">2</text>
  <rect x="436" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="76" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">2</text>

  <!-- arrows: element-wise transform -->
  <line x1="62" y1="90" x2="62" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="106" y1="90" x2="106" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="150" y1="90" x2="150" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="194" y1="90" x2="194" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="238" y1="90" x2="238" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="282" y1="90" x2="282" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="326" y1="90" x2="326" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="370" y1="90" x2="370" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="414" y1="90" x2="414" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <line x1="458" y1="90" x2="458" y2="120" stroke="#999" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <text x="20" y="118" font-size="11.5" fill="#666" filter="url(#rough2)">变换：</text>

  <!-- highlight of chosen segment [1..9] -->
  <rect x="84" y="122" width="396" height="40" rx="6" fill="#fff8e1" opacity="0.65" filter="url(#rough2)"/>

  <!-- Row 2: transformed array b -->
  <rect x="40" y="126" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="146" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">−1</text>
  <rect x="84" y="126" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="146" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">+1</text>
  <rect x="128" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="172" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="216" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="238" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="260" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="282" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="304" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="326" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="348" y="126" width="44" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="392" y="126" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="146" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">+1</text>
  <rect x="436" y="126" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="146" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">+1</text>

  <!-- bracket under chosen segment -->
  <path d="M 84,166 L 84,176 L 480,176 L 480,166" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="282" y="194" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">最优子段 nums[1..9]：+1 + 0×7 + 1 + 1 = +3</text>
  <text x="62" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1 拖后腿，弃</text>

  <!-- formula box -->
  <rect x="30" y="206" width="460" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12.5" fill="#2f5224" filter="url(#rough2)">答案 = totalK + 最大子段和 = 1 + 3 = 4 ✓</text>
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">totalK = 1：区间外幸存的那个 10（下标 0）</text>

  <!-- bottom notes -->
  <rect x="30" y="266" width="460" height="140" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="290" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">⚠️ 三个关键点：</text>
  <text x="48" y="314" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">① x 由 v 唯一决定（x = k − v）：枚举 v = 1…50 就枚举完了所有有意义的操作</text>
  <text x="48" y="338" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">② 区间内的 k 会被误伤（k + x ≠ k）→ 计 −1；区间外的 k 幸存 → 统一记入 totalK</text>
  <text x="48" y="362" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">③ 允许空段（best ≥ 0）：取 x = 0 等价于不操作，totalK 永远是保底答案</text>
  <text x="48" y="386" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">对全部 50 个 v 各跑一趟 Kadane，取最大值即最终答案</text>
</svg>
