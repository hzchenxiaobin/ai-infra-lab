<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 2]</text>

  <!-- 表格：列 x 起点：24 / 82 / 132 / 182 / 268 / 336(明细至496) -->
  <!-- 表头 -->
  <rect x="24" y="44" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="82" y="44" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="44" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="182" y="44" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="268" y="44" width="68" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="336" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="53" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">步骤</text>
  <text x="107" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">x</text>
  <text x="157" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">奇偶</text>
  <text x="225" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">even（含空）</text>
  <text x="302" y="64" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">odd</text>
  <text x="416" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">奇和子序列明细</text>

  <!-- 行 0：初始 -->
  <rect x="24" y="74" width="58" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="82" y="74" width="50" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="74" width="50" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="74" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="268" y="74" width="68" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="336" y="74" width="160" height="30" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="53" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始</text>
  <text x="107" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="157" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="225" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="416" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（只有空子序列，和 0 偶）</text>

  <!-- 行 1：x=1 奇 -->
  <rect x="24" y="104" width="58" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="82" y="104" width="50" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="104" width="50" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="104" width="86" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="268" y="104" width="68" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="336" y="104" width="160" height="30" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="53" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">①</text>
  <text x="107" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">奇</text>
  <text x="225" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0+1=1</text>
  <text x="302" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0+1=1</text>
  <text x="416" y="124" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1}</text>

  <!-- 行 2：x=2 偶 -->
  <rect x="24" y="134" width="58" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="82" y="134" width="50" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="134" width="50" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="134" width="86" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="268" y="134" width="68" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="336" y="134" width="160" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="53" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">②</text>
  <text x="107" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="225" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1×2=2</text>
  <text x="302" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1×2=2</text>
  <text x="416" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1}，{1,2}</text>

  <!-- 行 3：x=2 偶 -->
  <rect x="24" y="164" width="58" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="82" y="164" width="50" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="164" width="50" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="164" width="86" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="268" y="164" width="68" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="336" y="164" width="160" height="30" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="53" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="107" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="184" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="225" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×2=4</text>
  <text x="302" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×2=4</text>
  <text x="416" y="184" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{1}，{1,2}，{1,2′}，{1,2,2′}</text>

  <!-- 答案 -->
  <rect x="24" y="216" width="472" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">答案 = odd = 4（对 10^9+7 取模）</text>
  <text x="260" y="253" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">校验闭式：存在奇数 ⇒ 2^(n−1) = 2^2 = 4 ✓</text>

  <!-- 与示例 1 对比 -->
  <rect x="24" y="276" width="472" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">顺带看示例 nums = [1,1,1]：①(1,1) ②(2,2) ③(4,4) → 答案 4</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">三个奇和子序列 {1},{1′},{1″} 加上 {1,1′,1″}（和 3）</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">两两组合和为 2 是偶数——奇数个数必须选中奇数个！</text>
</svg>
