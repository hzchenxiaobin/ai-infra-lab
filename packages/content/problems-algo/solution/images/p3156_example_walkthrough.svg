<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三名员工逐段统计覆盖数</text>

  <!-- 员工 1001 -->
  <rect x="24" y="40" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 1001</text>

  <rect x="136" y="40" width="23" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="147" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="159" y="40" width="23" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="182" y="40" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="40" width="23" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="263" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="275" y="40" width="47" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="298" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="40" width="47" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="345" y="56" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="369" y="40" width="117" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="427" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="136" y="82" font-size="10" fill="#666" filter="url(#rough2)">覆盖数 ≥ 1 的段长和 = 30+30+90+60+150 = 360 分 = 6 小时 ｜ max 覆盖数 = 2</text>

  <!-- 员工 1002 -->
  <rect x="24" y="104" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 1002</text>

  <rect x="136" y="104" width="23" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="147" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="159" y="104" width="23" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="182" y="104" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="136" y="146" font-size="10" fill="#666" filter="url(#rough2)">段长和 = 30+30+90 = 150 分 = 2.5 小时 → FLOOR → 2（先求和再取整！）｜ max = 2</text>

  <!-- 员工 1003 -->
  <rect x="24" y="168" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 1003</text>

  <rect x="136" y="168" width="94" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="183" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="136" y="210" font-size="10" fill="#666" filter="url(#rough2)">段长和 = 120 分 = 2 小时 ｜ max = 1（无重叠，单层）</text>

  <!-- 输出表 -->
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最终输出（按 employee_id 升序）</text>

  <rect x="110" y="250" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <rect x="210" y="250" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total_task_hours</text>
  <rect x="310" y="250" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">max_concurrent_tasks</text>

  <rect x="110" y="270" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1001</text>
  <rect x="210" y="270" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="310" y="270" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="110" y="288" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1002</text>
  <rect x="210" y="288" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="310" y="288" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="110" y="306" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="319" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1003</text>
  <rect x="210" y="306" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="310" y="306" width="100" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="319" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">空档段（覆盖数 0）既不进时长求和，也不影响 max —— INNER JOIN 让它们彻底消失</text>
</svg>
