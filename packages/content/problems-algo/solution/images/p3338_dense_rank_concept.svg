<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：部门内 DENSE_RANK，rn = 2 即第二高档</text>

  <rect x="56" y="44" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Sales 部门（薪水降序）</text>

  <rect x="56" y="82" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">90000</text>
  <rect x="188" y="82" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rn = 1</text>

  <rect x="56" y="114" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">80000</text>
  <rect x="188" y="114" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">rn = 2</text>

  <rect x="56" y="146" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">80000</text>
  <rect x="188" y="146" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">rn = 2</text>

  <rect x="56" y="178" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">70000</text>
  <rect x="188" y="178" width="58" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="196" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">rn = 3</text>

  <rect x="316" y="44" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="411" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">IT 部门（薪水降序）</text>

  <rect x="316" y="82" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">65000</text>
  <rect x="448" y="82" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rn = 1</text>

  <rect x="316" y="114" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">65000</text>
  <rect x="448" y="114" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rn = 1</text>

  <rect x="316" y="146" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">55000</text>
  <rect x="448" y="146" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">rn = 2</text>

  <path d="M 276 110 Q 300 110 310 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="98" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">并列同号</text>

  <rect x="40" y="224" width="480" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">RANK 陷阱：IT 的 65000 两人并列第 1（跳号）</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">55000 的 RANK() = 3，WHERE rk = 2 落空 → 漏掉 emp_id 5！</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">DENSE_RANK() 不跳号：55000 → rn = 2，恰好命中第二高档</text>

  <rect x="40" y="306" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并列第二高（Sales 的两个 80000）共享同一个 rn = 2，全部返回</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">部门内不同薪水不足 2 档（如 HR）→ 组内无 rn = 2 → 整组缺席</text>
</svg>
