<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字典树方案：反向插入 + 节点存「剩余后缀是否回文」</text>

  <!-- Trie structure -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">将每个 word 反向后插入 Trie（如 rev("lls")="sll"）</text>

  <!-- root -->
  <circle cx="80" cy="100" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">root</text>

  <!-- s -->
  <circle cx="160" cy="100" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s</text>
  <line x1="98" y1="100" x2="142" y2="100" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- l (after s) -->
  <circle cx="240" cy="100" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <line x1="178" y1="100" x2="222" y2="100" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- l (after l) — terminal: word "sll" = rev("lls") -->
  <circle cx="320" cy="100" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l</text>
  <line x1="258" y1="100" x2="300" y2="100" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">word_idx=2</text>

  <!-- branch from root: a (for "dcba" → rev = "abcd") -->
  <circle cx="80" cy="180" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <line x1="80" y1="118" x2="80" y2="162" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="160" cy="180" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <line x1="98" y1="180" x2="142" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="240" cy="180" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <line x1="178" y1="180" x2="222" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="320" cy="180" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <line x1="258" y1="180" x2="300" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">word_idx=0</text>

  <!-- query explanation -->
  <rect x="24" y="238" width="512" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="258" font-size="11.5" fill="#d6a040" font-weight="bold">查询：对 w="lls" 沿 Trie 正向走</text>
  <text x="40" y="276" font-size="10.5" fill="#666">走 'l'→'l' 后无 's' 子节点（路径耗尽）→ 检查当前节点的「剩余后缀回文列表」</text>
  <text x="40" y="290" font-size="10.5" fill="#666">剩余后缀 "s" 是回文 ⟹ rev("lls")="sll" 在 Trie 中 → pair (2, 该词)</text>

  <!-- two uses of node -->
  <rect x="24" y="310" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="144" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">用途 1：走到 w 末尾</text>
  <text x="144" y="348" text-anchor="middle" font-size="10" fill="#666">收集子树中所有「剩余后缀回文」的词</text>

  <rect x="296" y="310" width="240" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="416" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">用途 2：w 走不完 Trie</text>
  <text x="416" y="348" text-anchor="middle" font-size="10" fill="#666">查当前节点「剩余后缀回文」列表</text>

  <rect x="100" y="378" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">每个节点维护 suffix_pal_list：剩余后缀为回文的 word 索引</text>
</svg>
