<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次遍历，每块瓷砖 O(1) 判定</text>

  <!-- 开始 -->
  <rect x="130" y="42" width="100" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M180,74 L180,90" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="100" y="92" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0 … n−1，逐块扫</text>
  <path d="M180,128 L180,144" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取邻居 -->
  <rect x="85" y="146" width="190" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="167" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">left ← colors[(i−1+n) % n]</text>
  <text x="180" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">right ← colors[(i+1) % n]</text>
  <path d="M180,196 L180,212" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="180,212 300,262 180,312 60,262" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">left ≠ colors[i]</text>
  <text x="180" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">且 right ≠ colors[i] ?</text>

  <!-- 是 → ans++ -->
  <path d="M300,262 L356,262" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="356" y="244" width="100" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="406" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans++</text>

  <!-- ans++ 回流到 i++ -->
  <path d="M406,280 L406,343 L252,343" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → i++ -->
  <path d="M180,312 L180,326" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="323" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="115" y="328" width="130" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="349" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++（下一块）</text>

  <!-- 回环虚线 -->
  <path d="M115,345 L40,345 L40,110 L96,110" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="230" text-anchor="middle" font-size="10" fill="#999" transform="rotate(-90 40 230)" filter="url(#rough2)">还有瓷砖，继续</text>

  <!-- 结束 -->
  <path d="M180,362 L180,372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="368" font-size="10" fill="#888" filter="url(#rough2)">扫完（i = n）</text>
  <rect x="130" y="374" width="100" height="30" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="393" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>
</svg>
