<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：同值全取 + 冲突区间 [x−2, x+2]</text>

  <!-- power row -->
  <text x="26" y="60" font-size="12" fill="#888">power:</text>
  <rect x="78" y="40" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="60" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="124" y="40" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="170" y="40" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="60" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="216" y="40" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="60" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="278" y="60" font-size="10.5" fill="#888">同值合并成一份收益</text>

  <!-- arrow down -->
  <path d="M 110 74 L 110 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="122" y="88" font-size="11" fill="#d6a040" font-weight="bold">按值聚合</text>

  <!-- aggregated boxes -->
  <rect x="50" y="96" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="117" text-anchor="middle" font-size="11.5" fill="#333">值 1 × 1 = 1</text>
  <rect x="190" y="96" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="117" text-anchor="middle" font-size="11.5" fill="#333">值 6 × 2 = 12</text>
  <rect x="330" y="96" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="117" text-anchor="middle" font-size="11.5" fill="#333">值 7 × 1 = 7</text>

  <!-- number line section -->
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">取值 6 时的值域冲突（数轴视角）</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">禁用区 [6−2, 6+2] = [4, 8]</text>
  <rect x="204" y="174" width="232" height="48" fill="#fce4ec" opacity="0.45" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <path d="M 64 199 L 496 199" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- ticks: values 1..9 at x = 80 + (v-1)*48 -->
  <rect x="64" y="186" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="112" y="186" width="32" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="128" y="204" text-anchor="middle" font-size="11.5" fill="#999">2</text>
  <rect x="160" y="186" width="32" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="176" y="204" text-anchor="middle" font-size="11.5" fill="#999">3</text>
  <rect x="208" y="186" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="204" text-anchor="middle" font-size="11.5" fill="#b85450">4</text>
  <rect x="256" y="186" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="204" text-anchor="middle" font-size="11.5" fill="#b85450">5</text>
  <rect x="304" y="186" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6</text>
  <rect x="352" y="186" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="204" text-anchor="middle" font-size="11.5" fill="#b85450">7</text>
  <rect x="400" y="186" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="204" text-anchor="middle" font-size="11.5" fill="#b85450">8</text>
  <rect x="448" y="186" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="464" y="204" text-anchor="middle" font-size="11.5" fill="#333">9</text>

  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">选中 v=6</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a">与 6 相差 &gt; 2 的值才能共存（如 1 和 9）</text>

  <!-- bottom insight boxes -->
  <rect x="24" y="258" width="250" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="149" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">观察一：同值全取</text>
  <text x="149" y="302" text-anchor="middle" font-size="11" fill="#555">用了值 x ⇒ 所有 x 一起用</text>
  <text x="149" y="322" text-anchor="middle" font-size="11" fill="#555">收益 = x × 出现次数</text>

  <rect x="290" y="258" width="246" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="413" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">观察二：冲突带宽 2</text>
  <text x="413" y="302" text-anchor="middle" font-size="11" fill="#555">取 x 禁用 [x−2, x+2] 整段值</text>
  <text x="413" y="322" text-anchor="middle" font-size="11" fill="#555">740 是 ±1，本题回看更远</text>
</svg>
