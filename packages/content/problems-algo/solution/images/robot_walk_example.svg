<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：6 × 3 网格（w−1=5, h−1=2, C=14）</text>

  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="136" x2="70" y2="250"/>
    <line x1="108" y1="136" x2="108" y2="250"/>
    <line x1="146" y1="136" x2="146" y2="250"/>
    <line x1="184" y1="136" x2="184" y2="250"/>
    <line x1="222" y1="136" x2="222" y2="250"/>
    <line x1="260" y1="136" x2="260" y2="250"/>
    <line x1="298" y1="136" x2="298" y2="250"/>
    <line x1="70" y1="136" x2="298" y2="136"/>
    <line x1="70" y1="174" x2="298" y2="174"/>
    <line x1="70" y1="212" x2="298" y2="212"/>
    <line x1="70" y1="250" x2="298" y2="250"/>
  </g>

  <g font-size="9.5" fill="#aaa" filter="url(#rough2)" text-anchor="middle">
    <text x="89" y="262">0</text>
    <text x="127" y="262">1</text>
    <text x="165" y="262">2</text>
    <text x="203" y="262">3</text>
    <text x="241" y="262">4</text>
    <text x="279" y="262">5</text>
    <text x="58" y="231">0</text>
    <text x="58" y="193">1</text>
    <text x="58" y="155">2</text>
  </g>

  <path d="M 89 231 L 158 231" stroke="#446688" stroke-width="3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="124" y="222" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">①step2</text>

  <path d="M 172 231 L 234 231" stroke="#446688" stroke-width="3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="203" y="222" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">②step2</text>

  <path d="M 248 231 L 272 231" stroke="#446688" stroke-width="3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 279 224 L 279 200" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="214" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③step2 转向</text>

  <path d="M 279 186 L 279 162" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="174" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④step1</text>

  <path d="M 279 155 L 134 155" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="206" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤step4 转向</text>

  <circle cx="89" cy="231" r="6" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="244" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">起点</text>

  <circle cx="127" cy="155" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="127" y="159" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终</text>
  <text x="140" y="148" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(1,2) 朝西</text>

  <g filter="url(#rough2)">
    <rect x="60" y="282" width="320" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="84" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">指令</text>
    <text x="146" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">累计 tot</text>
    <text x="196" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">r</text>
    <text x="234" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">段</text>
    <text x="290" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">位置</text>
    <text x="350" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">朝向</text>
  </g>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="84" y="314" text-anchor="middle">step(2)</text>
    <text x="146" y="314" text-anchor="middle">2</text>
    <text x="196" y="314" text-anchor="middle">2</text>
    <text x="234" y="314" text-anchor="middle" fill="#446688" font-weight="bold">东</text>
    <text x="290" y="314" text-anchor="middle">(2, 0)</text>
    <text x="350" y="314" text-anchor="middle" fill="#446688" font-weight="bold">东</text>

    <text x="84" y="330" text-anchor="middle">step(2)</text>
    <text x="146" y="330" text-anchor="middle">4</text>
    <text x="196" y="330" text-anchor="middle">4</text>
    <text x="234" y="330" text-anchor="middle" fill="#446688" font-weight="bold">东</text>
    <text x="290" y="330" text-anchor="middle">(4, 0)</text>
    <text x="350" y="330" text-anchor="middle" fill="#446688" font-weight="bold">东</text>

    <text x="84" y="346" text-anchor="middle">step(2)</text>
    <text x="146" y="346" text-anchor="middle">6</text>
    <text x="196" y="346" text-anchor="middle">6</text>
    <text x="234" y="346" text-anchor="middle" fill="#4a7a3a" font-weight="bold">北</text>
    <text x="290" y="346" text-anchor="middle">(5, 1)</text>
    <text x="350" y="346" text-anchor="middle" fill="#4a7a3a" font-weight="bold">北</text>

    <text x="84" y="362" text-anchor="middle">step(1)</text>
    <text x="146" y="362" text-anchor="middle">7</text>
    <text x="196" y="362" text-anchor="middle">7</text>
    <text x="234" y="362" text-anchor="middle" fill="#4a7a3a" font-weight="bold">北</text>
    <text x="290" y="362" text-anchor="middle">(5, 2)</text>
    <text x="350" y="362" text-anchor="middle" fill="#4a7a3a" font-weight="bold">北</text>
  </g>

  <rect x="58" y="370" width="324" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="84" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">step(4)</text>
    <text x="146" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
    <text x="196" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
    <text x="234" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">西</text>
    <text x="290" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">(1, 2)</text>
    <text x="350" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">西 ✓</text>
  </g>

  <text x="412" y="300" font-size="10.5" fill="#666" filter="url(#rough2)">r=6：扣 5 得 k=1 北段</text>
  <text x="412" y="316" font-size="10.5" fill="#666" filter="url(#rough2)">⇒ (5, 1) ✓</text>
  <text x="412" y="340" font-size="10.5" fill="#666" filter="url(#rough2)">r=11：扣 5+2=7</text>
  <text x="412" y="356" font-size="10.5" fill="#666" filter="url(#rough2)">得 k=4 西段</text>
  <text x="412" y="372" font-size="10.5" fill="#666" filter="url(#rough2)">⇒ (5−4, 2) = (1,2) ✓</text>
</svg>
