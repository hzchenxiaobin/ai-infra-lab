<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：拆分 → 求和 → 拼接，循环到长度 ≤ k</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">以 s="11111222223", k=3 为例：每组的数位和替换该组</text>

  <!-- ===== Left panel: the loop (3 boxes top to bottom) ===== -->

  <!-- Step 1: 拆分 -->
  <text x="40" y="78" font-size="11" fill="#666" font-weight="bold">① 拆分</text>
  <rect x="40" y="84" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">111</text>
  <rect x="84" y="84" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">112</text>
  <rect x="128" y="84" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">222</text>
  <rect x="172" y="84" width="34" height="26" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">23</text>
  <text x="214" y="100" font-size="9" fill="#888">末组可短</text>

  <path d="M 116 114 L 116 128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 求和 -->
  <text x="40" y="144" font-size="11" fill="#666" font-weight="bold">② 求数位和</text>
  <rect x="46" y="150" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="96" y="150" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="146" y="150" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="196" y="150" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="69" y="188" text-anchor="middle" font-size="8.5" fill="#888">1+1+1</text>
  <text x="119" y="188" text-anchor="middle" font-size="8.5" fill="#888">1+1+2</text>
  <text x="169" y="188" text-anchor="middle" font-size="8.5" fill="#888">2+2+2</text>
  <text x="219" y="188" text-anchor="middle" font-size="8.5" fill="#888">2+3</text>

  <path d="M 142 196 L 142 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 拼接 -->
  <text x="40" y="226" font-size="11" fill="#666" font-weight="bold">③ 拼接新串</text>
  <rect x="60" y="212" width="166" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"3"+"4"+"6"+"5" = "3465"</text>

  <!-- loop arrow back to top -->
  <path d="M 226 226 L 256 226 L 256 97 L 212 97" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="160" font-size="9.5" fill="#4a7a3a" font-weight="bold">len &gt; k</text>
  <text x="262" y="174" font-size="9.5" fill="#4a7a3a" font-weight="bold">再循环</text>

  <!-- stop branch -->
  <path d="M 143 240 L 143 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="256" font-size="9.5" fill="#b85450" font-weight="bold">len ≤ k 停</text>
  <rect x="86" y="262" width="114" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="143" y="281" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 "135"</text>

  <!-- ===== Right panel: termination insight ===== -->
  <rect x="300" y="60" width="244" height="230" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="422" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么一定终止？</text>
  <text x="422" y="98" text-anchor="middle" font-size="9.5" fill="#888">总数字和 S 单调不增，长度必缩</text>

  <!-- S tracking boxes -->
  <text x="316" y="122" font-size="10" fill="#666">初始串</text>
  <rect x="360" y="108" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="123" text-anchor="middle" font-size="10.5" fill="#333">len=11</text>
  <text x="430" y="122" font-size="10" fill="#666">S=</text>
  <rect x="452" y="108" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="123" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">18</text>

  <text x="316" y="152" font-size="10" fill="#666">一轮后</text>
  <rect x="360" y="138" width="60" height="22" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="153" text-anchor="middle" font-size="10.5" fill="#333">len=4</text>
  <text x="430" y="152" font-size="10" fill="#666">S=</text>
  <rect x="452" y="138" width="40" height="22" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="153" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">18</text>

  <text x="500" y="153" font-size="9" fill="#5588bb">= 不变</text>

  <text x="316" y="182" font-size="10" fill="#666">二轮后</text>
  <rect x="360" y="168" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="183" text-anchor="middle" font-size="10.5" fill="#333">len=3</text>
  <text x="430" y="182" font-size="10" fill="#666">S=</text>
  <rect x="452" y="168" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">9</text>

  <text x="316" y="212" font-size="10" fill="#666">≤k 停</text>
  <rect x="360" y="198" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="213" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">答案</text>

  <path d="M 390 130 L 390 138" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 160 L 390 168" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 190 L 390 198" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note -->
  <text x="316" y="248" font-size="9.5" fill="#5588bb">一轮：组和均一位 → S 不变</text>
  <text x="316" y="262" font-size="9.5" fill="#4a7a3a">二轮：13 两位 → S 递减</text>
  <text x="316" y="276" font-size="9.5" fill="#b85450" font-weight="bold">长度骤缩 + S 递减 → O(log) 轮收敛</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="304" width="514" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一轮 = 切 k 段 → 每段求数位和（字符串）→ 拼回</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#555">总数字和 S 单调不增：digitSum(g) ≤ g，g≥10 时严格递减</text>
  <text x="280" y="354" text-anchor="middle" font-size="9.5" fill="#888">当所有组和都 &lt; 10 时每组变单字符，长度 = 组数 = ⌈L/k⌉ &lt; L，必然收缩</text>

  <!-- ===== In-place hint ===== -->
  <rect x="30" y="370" width="514" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">实现：while len(s) &gt; k 内做一次「分段求和拼接」即可</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#4a7a3a">每轮新建字符串，旧串丢弃；无需原地、无需复杂数据结构</text>
  <text x="280" y="420" text-anchor="middle" font-size="9.5" fill="#888">约束 L, k ≤ 100，每轮 O(L)，轮数 O(log L)，整体轻量</text>
</svg>
