<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 2, 1]</text>

  <text x="32" y="50" font-size="11" fill="#888" filter="url(#rough2)">seen 二进制只画低 6 位，低位在右</text>

  <rect x="36" y="62" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="66" y="62" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">读到 x</text>
  <rect x="116" y="62" width="112" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">seen 第 x 位</text>
  <rect x="228" y="62" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="398" y="62" width="88" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="36" y="86" width="30" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <rect x="66" y="86" width="50" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="107" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <rect x="116" y="86" width="112" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="107" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">0（没见过）</text>
  <rect x="228" y="86" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="313" y="107" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">seen |= 1&lt;&lt;1 → 0b000010</text>
  <rect x="398" y="86" width="88" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="107" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>

  <rect x="36" y="118" width="30" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="139" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <rect x="66" y="118" width="50" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="139" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <rect x="116" y="118" width="112" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">0（没见过）</text>
  <rect x="228" y="118" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="313" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">seen |= 1&lt;&lt;2 → 0b000110</text>
  <rect x="398" y="118" width="88" height="32" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="139" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>

  <rect x="36" y="150" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="51" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="66" y="150" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="91" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="116" y="150" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1（第二次见！）</text>
  <rect x="228" y="150" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="313" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans ^= 2</text>
  <rect x="398" y="150" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="182" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="51" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="66" y="182" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="91" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="182" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="203" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1（第二次见！）</text>
  <rect x="228" y="182" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="313" y="203" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans ^= 1</text>
  <rect x="398" y="182" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 486 198 C 504 198 504 246 470 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="36" y="240" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">最终 seen = 0b000110：bit 1、bit 2 被置位后不再变化</text>

  <rect x="150" y="250" width="30" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="184" y="250" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="250" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="233" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="250" width="30" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="267" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="286" y="250" width="30" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="320" y="250" width="30" height="30" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="165" y="296" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">bit 0</text>
  <text x="199" y="296" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">bit 1</text>
  <text x="233" y="296" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">bit 2</text>
  <text x="267" y="296" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">bit 3</text>
  <text x="301" y="296" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">bit 4</text>
  <text x="335" y="296" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">bit 5</text>

  <rect x="32" y="316" width="456" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 ans = 3 = 1 ⊕ 2 ✓</text>
  <text x="260" y="357" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">恰是「出现两次」的 1 和 2；若全程无二次命中（如 [1,2,3]）则 ans = 0</text>

  <rect x="32" y="380" width="456" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="399" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">注意：步 3、4 命中后不清位——每个数至多出现两次，之后不会再查</text>
</svg>
