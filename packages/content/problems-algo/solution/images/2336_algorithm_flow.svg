<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="660" fill="#fafafa"/>

  <!-- ===== popSmallest section ===== -->
  <text x="300" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">popSmallest：added 非空取堆顶，否则取 cur 并自增</text>

  <!-- start -->
  <ellipse cx="300" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333">popSmallest()</text>

  <path d="M 300 82 L 300 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: added 非空? -->
  <polygon points="300,110 390,150 300,190 210,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="12" fill="#333">added 非空?</text>
  <text x="300" y="162" text-anchor="middle" font-size="10" fill="#888">（堆顶 &lt; cur）</text>

  <!-- 是 -> left box -->
  <path d="M 210 150 L 110 150 L 110 211" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">是</text>
  <rect x="40" y="213" width="140" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x = 堆顶</text>
  <text x="110" y="250" text-anchor="middle" font-size="10" fill="#666">弹出堆顶 + 移除 added</text>

  <!-- 否 -> right box -->
  <path d="M 390 150 L 490 150 L 490 211" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="213" width="140" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x = cur</text>
  <text x="490" y="250" text-anchor="middle" font-size="10" fill="#666">cur += 1</text>

  <!-- merge bus -->
  <path d="M 110 261 L 110 296 L 490 296 L 490 261" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="110" cy="296" r="2.5" fill="#666"/>
  <circle cx="490" cy="296" r="2.5" fill="#666"/>
  <path d="M 300 296 L 300 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- terminal -->
  <ellipse cx="300" cy="336" rx="92" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 x</text>

  <!-- divider -->
  <line x1="40" y1="372" x2="560" y2="372" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== addBack section ===== -->
  <text x="300" y="396" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">addBack：仅 num &lt; cur 且不在 added 才入堆，否则无操作</text>

  <!-- start -->
  <ellipse cx="300" cy="428" rx="110" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="12" fill="#333">addBack(num)</text>

  <path d="M 300 446 L 300 470" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: num < cur 且 不在 added? -->
  <polygon points="300,474 402,514 300,554 198,514" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="510" text-anchor="middle" font-size="12" fill="#333">num &lt; cur</text>
  <text x="300" y="526" text-anchor="middle" font-size="12" fill="#333">且 不在 added?</text>

  <!-- 否 -> right box (no-op) -->
  <path d="M 402 514 L 470 514" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="506" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="490" width="120" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="530" y="510" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">无操作</text>
  <text x="530" y="526" text-anchor="middle" font-size="9" fill="#999">仍在尾/已回收</text>

  <!-- 是 -> down box (push) -->
  <path d="M 300 554 L 300 580" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="572" font-size="11" fill="#82b366" font-weight="bold">是</text>
  <rect x="180" y="582" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="600" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push 进 added 堆；加入 added 集合</text>
  <text x="300" y="617" text-anchor="middle" font-size="10" fill="#666">（set/heap 同步，自动判重）</text>
</svg>
