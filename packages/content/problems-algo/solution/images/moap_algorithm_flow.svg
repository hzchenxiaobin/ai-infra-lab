<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：双指针 + 累积和，三分支循环到 i≥j</text>

  <!-- start oval -->
  <ellipse cx="290" cy="58" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=0, j=n−1, a=nums[0], b=nums[n−1], ans=0</text>

  <!-- arrow start -> diamond i<j -->
  <path d="M290 78 L290 92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond i<j? -->
  <path d="M290 94 L362 130 L290 166 L218 130 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; j ?</text>

  <!-- No branch -> return ans -->
  <path d="M362 130 L416 130" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="112" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="481" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- Yes branch -> diamond a vs b -->
  <path d="M290 166 L290 182" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="178" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond compare a,b -->
  <path d="M290 184 L384 222 L290 260 L196 222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">比较 a, b</text>

  <!-- branch a<b -> left rect -->
  <path d="M196 222 C150 222,105 240,105 268" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a &lt; b</text>

  <!-- branch a=b -> center rect -->
  <path d="M290 260 L290 268" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="266" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a = b</text>

  <!-- branch a>b -> right rect -->
  <path d="M384 222 C430 222,475 240,475 268" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a &gt; b</text>

  <!-- left rect a<b -->
  <rect x="30" y="270" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">吞较小端 a</text>
  <text x="105" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i++; a+=nums[i]</text>
  <text x="105" y="322" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans++</text>

  <!-- center rect a=b -->
  <rect x="205" y="270" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">配对收进</text>
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i++; j--</text>
  <text x="290" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a=nums[i], b=nums[j]</text>

  <!-- right rect a>b -->
  <rect x="400" y="270" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">吞较小端 b</text>
  <text x="475" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j--; b+=nums[j]</text>
  <text x="475" y="322" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans++</text>

  <!-- loop-back: three rects down to y=360, across to x=18, up to i<j diamond left -->
  <path d="M105 326 L105 362" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M290 326 L290 362" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M475 326 L475 362" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M475 362 L18 362 L18 130 L214 130" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="358" font-size="11" fill="#888" filter="url(#rough2)">循环回 i&lt;j?</text>
</svg>
