<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算（capacity = 2）：栈状态 / free 堆</text>

  <!-- column headers -->
  <text x="85" y="44" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">操作</text>
  <text x="192" y="44" text-anchor="middle" font-size="10.5" fill="#888">栈 0</text>
  <text x="264" y="44" text-anchor="middle" font-size="10.5" fill="#888">栈 1</text>
  <text x="336" y="44" text-anchor="middle" font-size="10.5" fill="#888">栈 2</text>
  <text x="470" y="44" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">free 堆</text>

  <!-- ===== Frame 1: push 1..5 ===== -->
  <rect x="20" y="54" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="80" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">push 1..5</text>
  <rect x="160" y="60" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,2</text>
  <rect x="232" y="60" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="60" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="336" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="400" y="60" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 2 }</text>

  <!-- ===== Frame 2: popAtStack(0) -> 2 ===== -->
  <rect x="20" y="108" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="134" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">popAtStack(0)→2</text>
  <rect x="160" y="114" width="64" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="114" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="114" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="336" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="400" y="114" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 0, 2 }</text>

  <!-- ===== Frame 3: push(20) 回填栈0 ===== -->
  <rect x="20" y="162" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="188" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">push(20)</text>
  <rect x="160" y="168" width="64" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,20</text>
  <rect x="232" y="168" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="168" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="336" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="400" y="168" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 2 }</text>

  <!-- ===== Frame 4: push(21) 填满栈2 ===== -->
  <rect x="20" y="216" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="242" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">push(21)</text>
  <rect x="160" y="222" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,20</text>
  <rect x="232" y="222" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="222" width="64" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="336" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5,21</text>
  <rect x="400" y="222" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#888">{ } 空</text>

  <!-- ===== Frame 5: popAtStack(0)->20 & popAtStack(2)->21 ===== -->
  <rect x="20" y="270" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="290" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">popAtStack(0)→20</text>
  <text x="85" y="304" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">popAtStack(2)→21</text>
  <rect x="160" y="276" width="64" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="276" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="276" width="64" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="336" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="400" y="276" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 0, 2 }</text>

  <!-- ===== Frame 6: pop -> 5 (栈2裁剪) ===== -->
  <rect x="20" y="324" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="344" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pop()→5</text>
  <text x="85" y="358" text-anchor="middle" font-size="9" fill="#b85450">栈2弹空→裁剪</text>
  <rect x="160" y="330" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="330" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="264" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,4</text>
  <rect x="304" y="330" width="64" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="336" y="350" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">已删</text>
  <rect x="400" y="330" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{ 0, 2* }</text>

  <!-- ===== Frame 7: pop -> 4,3,1,-1 ===== -->
  <rect x="20" y="378" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="398" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pop()×4</text>
  <text x="85" y="412" text-anchor="middle" font-size="9" fill="#b85450">→4,3,1,-1</text>
  <rect x="160" y="384" width="64" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="192" y="404" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">已删</text>
  <rect x="232" y="384" width="64" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="264" y="404" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">已删</text>
  <rect x="304" y="384" width="64" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="336" y="404" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">已删</text>
  <rect x="400" y="384" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="404" text-anchor="middle" font-size="10.5" fill="#888">全过期·栈空</text>

  <!-- legend -->
  <rect x="20" y="448" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="459" font-size="9.5" fill="#666">满</text>
  <rect x="70" y="448" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="459" font-size="9.5" fill="#666">未满（有空位）</text>
  <rect x="180" y="448" width="14" height="14" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="459" font-size="9.5" fill="#666">本步变更</text>
  <rect x="280" y="448" width="14" height="14" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="459" font-size="9.5" fill="#666">已裁剪</text>
  <text x="470" y="459" text-anchor="middle" font-size="9.5" fill="#b85450">* = 堆内过期条目</text>

  <text x="280" y="486" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">输出：2, 20, 21, 5, 4, 3, 1, -1</text>
</svg>
