<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">换引擎：s = w + '#' + target，一次线性扫描交出全部 LCP</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 w = "abc"、target = "abcabc" 为例——'#' 是不在小写字母表里的哨兵</text>

  <!-- ============ 拼接串格子 ============ -->
  <!-- 下标 -->
  <text x="96" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="128" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="160" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="192" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="224" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="256" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="288" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="320" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="352" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="384" y="58" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">9</text>

  <!-- w 段 -->
  <rect x="80" y="62" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="96" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="112" y="62" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="144" y="62" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- 哨兵 -->
  <rect x="176" y="62" width="32" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="84" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">#</text>

  <!-- target 段 -->
  <rect x="208" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="240" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="256" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="272" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="304" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="336" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="368" y="62" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="384" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- 段标签 -->
  <text x="128" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w 段（模式串）</text>
  <text x="192" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">哨兵</text>
  <text x="304" y="112" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">target 段</text>

  <!-- ============ z[4] 的 Z-box ============ -->
  <!-- 左括住 s[0..2] -->
  <path d="M 80 120 L 80 126 L 176 126 L 176 120" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 右括住 s[4..6] -->
  <path d="M 208 120 L 208 126 L 304 126 L 304 120" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 连接弧 -->
  <path d="M 128 130 C 158 152, 222 152, 250 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="240" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">z[4] = 3：abc ✓，随后 s[3]='#' vs s[7]='a' 失配</text>
  <text x="240" y="176" text-anchor="middle" font-size="10" fill="#3a5f30" filter="url(#rough2)">⟹ match[0] ≥ 3 = LCP("abc", "abcabc…")，target 段每个位置都这样白拿一个 LCP</text>

  <!-- ============ 红色警示框 ============ -->
  <rect x="48" y="190" width="424" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">若不拼哨兵："abc" + "abcabc" = "abcabcabc"，z[3] = 6 &gt; |w| = 3</text>
  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">z 把 target 段的字符「借」给 w 用，虚报 LCP——匹配越过了 word 边界</text>

  <!-- ============ 绿色结论框 ============ -->
  <rect x="48" y="256" width="424" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">拼上 '#' 后：想越界的匹配必撞上 '#' ≠ 字母 ⟹ z ≤ |w| 恒成立</text>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">target 段的 z 值 = LCP(w, target[j:])，连 min 都不用取</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每个 word 独立跑一遍（共 W 遍），Z-box 摊还保证每遍线性 O(|w| + n)</text>
</svg>
