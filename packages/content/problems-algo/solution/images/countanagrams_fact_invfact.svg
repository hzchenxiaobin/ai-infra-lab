<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrl" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L2,4 L8,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">阶乘表与逆阶乘表：一次 pow + 倒推</text>

  <!-- 下标行 -->
  <text x="60" y="86" font-size="11" fill="#888">i</text>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="220" y="86" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="290" y="86" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="360" y="86" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#aaa">…</text>
  <text x="510" y="86" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">N</text>

  <!-- fact 行 -->
  <text x="60" y="116" font-size="12" fill="#4a7a3a" font-weight="bold">fact</text>
  <rect x="120" y="98" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="117" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="190" y="98" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="117" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="260" y="98" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="117" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="330" y="98" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="117" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="430" y="117" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  <rect x="480" y="98" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">N!</text>

  <!-- 推进注释：fact[i]=fact[i-1]·i -->
  <path d="M 180 130 L 178 142" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a">fact[i] = fact[i−1] · i　（正向递推 O(N)）</text>

  <!-- invFact 行 -->
  <text x="55" y="200" font-size="12" fill="#b85450" font-weight="bold">invFact</text>
  <rect x="120" y="184" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="203" text-anchor="middle" font-size="11" fill="#333">1/0!</text>
  <rect x="190" y="184" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="203" text-anchor="middle" font-size="11" fill="#333">1/1!</text>
  <rect x="260" y="184" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="203" text-anchor="middle" font-size="11" fill="#333">1/2!</text>
  <rect x="330" y="184" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="203" text-anchor="middle" font-size="11" fill="#333">1/3!</text>
  <text x="430" y="203" text-anchor="middle" font-size="11" fill="#aaa">…</text>
  <rect x="480" y="184" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1/N!</text>

  <!-- 起点：invFact[N] = fact[N]^(p-2) -->
  <text x="510" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">fact[N]^(p−2)</text>
  <path d="M 510 178 L 510 180" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="540" y="208" text-anchor="middle" font-size="9.5" fill="#888">一次 pow</text>
  <text x="540" y="220" text-anchor="middle" font-size="9.5" fill="#888">O(log p)</text>

  <!-- 倒推箭头：从 N 向左 -->
  <path d="M 478 218 L 392 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <path d="M 408 218 L 322 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <path d="M 338 218 L 252 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrl)" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="10.5" fill="#b85450">invFact[i−1] = invFact[i] · i　（线性回推 O(N)）</text>

  <!-- 费马小定理框 -->
  <rect x="40" y="260" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="12" fill="#d6a040" font-weight="bold">费马小定理</text>
  <text x="290" y="300" text-anchor="middle" font-size="12.5" fill="#333">p = 10⁹ + 7 为素数，a 与 p 互素 ⇒ a^(p−1) ≡ 1 (mod p)</text>
  <text x="290" y="320" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇒ a⁻¹ ≡ a^(p−2) (mod p)　（除法转乘逆元）</text>
</svg>
