<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案 = 「前缀全等 + 一位提升 + 升序尾巴」，分界点越靠右答案越小</text>

  <!-- 框1：结构 -->
  <rect x="20" y="36" width="480" height="152" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 结构：首个不同位 p 上「提升」一位，其余位置尽量贴住 target</text>

  <text x="42" y="94" font-size="10" fill="#666" filter="url(#rough2)">target:</text>
  <rect x="110" y="76" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="76" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="76" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="93" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="161" y="93" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="197" y="93" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>

  <path d="M 141 106 L 141 118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="38" y="144" font-size="10" fill="#666" filter="url(#rough2)">答案 t:</text>
  <rect x="110" y="124" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="146" y="124" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="182" y="124" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="161" y="141" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="197" y="141" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>

  <text x="238" y="86" font-size="10" fill="#888" filter="url(#rough2)">s = "abc"</text>
  <text x="238" y="108" font-size="10" fill="#33506b" filter="url(#rough2)">前缀：位置 0 照抄 'b'，保持全等</text>
  <text x="238" y="130" font-size="10" fill="#b85450" filter="url(#rough2)">提升位 p=1：放剩余 {a,c} 中 &gt; 'b' 的最小 'c'</text>
  <text x="238" y="152" font-size="10" fill="#2f5d24" filter="url(#rough2)">尾巴：剩余 {a} 升序——已稳赢，越小越好</text>

  <text x="36" y="178" font-size="10.5" fill="#33506b" filter="url(#rough2)">t[0..p−1] = target[0..p−1] 且 t[p] &gt; target[p] ⟹ t &gt; target（p 之后任意填）</text>

  <!-- 框2：引理 -->
  <rect x="20" y="200" width="480" height="136" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="222" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 引理：可行分界点越靠右，候选越小 ⇒ 只需找最大可行 p</text>

  <text x="42" y="259" font-size="10" fill="#666" filter="url(#rough2)">p=0 →</text>
  <rect x="118" y="242" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="154" y="242" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="242" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="259" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="169" y="259" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>
  <text x="205" y="259" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">b</text>
  <ellipse cx="133" cy="255" rx="21" ry="16" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="240" y="259" font-size="10.5" fill="#888" filter="url(#rough2)">"cab"（位置 0 就抬高）</text>

  <text x="42" y="303" font-size="10" fill="#666" filter="url(#rough2)">p=1 →</text>
  <rect x="118" y="286" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="154" y="286" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="190" y="286" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="303" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="169" y="303" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="205" y="303" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>
  <ellipse cx="133" cy="299" rx="21" ry="16" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="240" y="303" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">"bca" ✓</text>

  <text x="330" y="271" font-size="10" fill="#8a6d1f" filter="url(#rough2)">位置 0 首次分歧：</text>
  <text x="330" y="289" font-size="10" fill="#8a6d1f" filter="url(#rough2)">'b' &lt; 'c' ⇒ p=1 的候选更小</text>
  <text x="36" y="326" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">越晚「抬高」的候选，与 target 的公共前缀越长，在首次分歧位上放的字符越小</text>

  <!-- 底部结论 -->
  <rect x="20" y="348" width="480" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">贪心：沿 target 匹配到最远得 m；从 p = min(m, n−1) 向左回退</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首个「剩余中存在 &gt; target[p] 字符」的位置即分界点；退到 p &lt; 0 则返回 ""</text>
</svg>
