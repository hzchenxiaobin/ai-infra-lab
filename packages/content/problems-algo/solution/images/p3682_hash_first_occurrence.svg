<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一张哈希表把 nums1 坍缩成「值 → 首次下标」</text>

  <!-- nums1 行 -->
  <text x="44" y="68" font-size="11" fill="#888" filter="url(#rough2)">nums1 =</text>
  <rect x="110" y="48" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="48" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="210" y="48" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="95" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="182" y="95" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="232" y="95" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=2</text>

  <!-- 建表箭头 -->
  <path d="M 172 100 L 172 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="118" font-size="9.5" fill="#888" filter="url(#rough2)">一遍扫描建表（只记首现）</text>

  <!-- pos1 哈希表 -->
  <rect x="80" y="130" width="240" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos1：值 → 首次下标</text>
  <text x="140" y="176" font-size="11.5" fill="#333" filter="url(#rough2)">3 → 0</text>
  <text x="140" y="196" font-size="11.5" fill="#333" filter="url(#rough2)">2 → 1</text>
  <text x="140" y="216" font-size="11.5" fill="#333" filter="url(#rough2)">1 → 2</text>
  <text x="200" y="232" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（emplace / setdefault：首现不被覆盖）</text>

  <!-- nums2 竖列 -->
  <text x="60" y="238" font-size="11" fill="#888" filter="url(#rough2)">nums2 =</text>
  <text x="52" y="272" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">j=0</text>
  <rect x="60" y="252" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="82" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="52" y="316" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">j=1</text>
  <rect x="60" y="296" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="82" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="52" y="360" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">j=2</text>
  <rect x="60" y="340" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="82" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 查表箭头 -->
  <text x="124" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">查表</text>
  <path d="M 106 268 L 142 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 106 312 L 142 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 106 356 L 142 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 候选计算 -->
  <text x="154" y="272" font-size="11" fill="#333" filter="url(#rough2)">pos1[1] + 0 = 2 + 0 = 2</text>
  <rect x="146" y="298" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="316" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">pos1[3] + 1 = 0 + 1 = 1</text>
  <text x="354" y="316" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 最小！</text>
  <text x="154" y="360" font-size="11" fill="#333" filter="url(#rough2)">pos1[1] + 2 = 2 + 2 = 4</text>

  <!-- 答案框 -->
  <rect x="60" y="386" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(2, 1, 4) = 1</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中数对 (i=0, j=1)：nums1[0] = nums2[1] = 3</text>

  <!-- 要点框 -->
  <rect x="60" y="444" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="464" font-size="10.5" fill="#333" filter="url(#rough2)">① 固定值 v：i + j 最小 ⇔ 两边都取首次出现 ⇒ 只存首现不丢最优解</text>
  <text x="76" y="482" font-size="10.5" fill="#333" filter="url(#rough2)">② 建表须「不存在才插入」：覆盖式赋值会把首现换成末现，方向恰好反了</text>
  <text x="76" y="500" font-size="10.5" fill="#333" filter="url(#rough2)">③ 合法下标和恒 ≥ 0 ⇒ −1 可安全作「无公共元素」的返回哨兵</text>
</svg>
