<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：chars = "a a b b c c c"</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">绿框=当前连续段；右侧=本段写入与 write 位置</text>

  <!-- index header: 7 cells, w=44 start x=50, centers 72,116,160,204,248,292,336 -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="72" y="62">0</text><text x="116" y="62">1</text><text x="160" y="62">2</text>
    <text x="204" y="62">3</text><text x="248" y="62">4</text><text x="292" y="62">5</text><text x="336" y="62">6</text>
  </g>

  <!-- helper: greyed cell macro repeated inline -->

  <!-- Step 1: group "aa" (idx 0,1) -->
  <text x="36" y="92" font-size="10.5" fill="#4a7a3a" font-weight="bold">g1</text>
  <rect x="50" y="76" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="97" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="94" y="76" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="97" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="138" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="182" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="204" y="97" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="226" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="248" y="97" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <rect x="270" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="292" y="97" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <rect x="314" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="336" y="97" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <text x="372" y="97" font-size="11" fill="#333" font-weight="bold">count=2 → 写 'a','2'</text>
  <text x="510" y="97" font-size="11" fill="#d6a040" font-weight="bold">write=2</text>

  <!-- Step 2: group "bb" (idx 2,3) -->
  <text x="36" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold">g2</text>
  <rect x="50" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="72" y="147" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <rect x="94" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="116" y="147" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <rect x="138" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="147" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="182" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="147" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="226" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="248" y="147" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <rect x="270" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="292" y="147" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <rect x="314" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="336" y="147" text-anchor="middle" font-size="14" fill="#bbb">c</text>
  <text x="372" y="147" font-size="11" fill="#333" font-weight="bold">count=2 → 写 'b','2'</text>
  <text x="510" y="147" font-size="11" fill="#d6a040" font-weight="bold">write=4</text>

  <!-- Step 3: group "ccc" (idx 4,5,6) -->
  <text x="36" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold">g3</text>
  <rect x="50" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="72" y="197" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <rect x="94" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="116" y="197" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <rect x="138" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="160" y="197" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="182" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="204" y="197" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="226" y="176" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="197" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="270" y="176" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="197" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="314" y="176" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="197" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="372" y="197" font-size="11" fill="#333" font-weight="bold">count=3 → 写 'c','3'</text>
  <text x="510" y="197" font-size="11" fill="#d6a040" font-weight="bold">write=6</text>

  <!-- arrow to final result -->
  <path d="M280 214 L280 232" stroke="#888" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- final write buffer: a 2 b 2 c 3 -->
  <text x="36" y="262" font-size="11" fill="#446688" font-weight="bold">结果</text>
  <rect x="120" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="266" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">a</text>
  <rect x="164" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="266" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="208" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="266" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">b</text>
  <rect x="252" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="266" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="296" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="266" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">c</text>
  <rect x="340" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="362" y="266" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>

  <!-- conclusion box -->
  <rect x="48" y="292" width="464" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前 write=6 格即压缩结果 ["a","2","b","2","c","3"]</text>
  <text x="280" y="331" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">返回 6（原长 7 → 压缩后 6）</text>
</svg>
