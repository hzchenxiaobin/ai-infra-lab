<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[5,10],[6,8],[1,5],[2,3],[1,10]] → 差分标记 + 前缀和取峰值</text>

  <!-- index header -->
  <text x="90" y="70" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">下标 i</text>
  <rect x="110" y="56" width="380" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="167" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="205" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="243" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="281" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="319" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <text x="357" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <text x="395" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <text x="433" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">9</text>
  <text x="471" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>

  <!-- diff row -->
  <text x="90" y="118" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">diff[i]</text>
  <rect x="110" y="104" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="167" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="205" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="243" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="281" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="319" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="357" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="395" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="433" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="471" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="500" y="122" font-size="10.5" fill="#888">（11: −2）</text>

  <!-- prefix sum row -->
  <text x="90" y="176" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold">活跃数</text>
  <!-- cells: highlight 3 in red-ish -->
  <rect x="110" y="152" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="148" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="186" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="224" y="152" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="243" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="262" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="281" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="300" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="319" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="338" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="376" y="152" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="414" y="152" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="433" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="452" y="152" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="471" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- peak annotation -->
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">峰值 = 3 ⟹ 答案 = 3 ✓</text>

  <!-- per-interval diff contribution note -->
  <rect x="40" y="228" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="11.5" fill="#446688" font-weight="bold">各区间差分贡献：</text>
  <text x="56" y="268" font-size="10.5" fill="#446688">[1,5]→ diff[1]+=1, diff[6]−=1　　[1,10]→ diff[1]+=1, diff[11]−=1</text>
  <text x="56" y="284" font-size="10.5" fill="#446688">[2,3] → diff[2]+=1, diff[4]−=1　　[5,10]→ diff[5]+=1, diff[11]−=1</text>
  <text x="56" y="300" font-size="10.5" fill="#446688">[6,8] → diff[6]+=1, diff[9]−=1</text>
  <text x="56" y="316" font-size="10.5" fill="#446688">叠加后 diff[1]=2、diff[2]=1、diff[4]=−1、diff[5]=1、diff[6]=0、diff[9]=−1、diff[11]=−2</text>

  <!-- verification by point -->
  <rect x="40" y="332" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="11.5" fill="#4a7a3a" font-weight="bold">💡 逐点验证（t=5 处）：</text>
  <text x="56" y="372" font-size="11" fill="#4a7a3a">点 5 被覆盖的区间：[1,5] ✓（闭区间含 5）、[1,10] ✓、[5,10] ✓ ⟹ 3 个</text>
  <text x="56" y="390" font-size="11" fill="#4a7a3a">三个区间两两相交 ⟹ 必须分属 3 个组，无法更少。贪心着色恰好 3 组可行 ⟹ 答案 3</text>
</svg>
