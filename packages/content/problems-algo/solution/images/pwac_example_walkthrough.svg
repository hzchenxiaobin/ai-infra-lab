<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">5 位患者 conditions 逐行判定</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="40" width="520" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">id</text>
  <text x="120" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">name</text>
  <text x="270" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">conditions</text>
  <text x="430" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">结果</text>
  <text x="505" y="56" text-anchor="middle" font-size="10" fill="white" font-weight="bold">原因</text>

  <!-- ===== Row 1: Daniel (invalid) ===== -->
  <rect x="20" y="66" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#333">Daniel</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#333">YFEV COUGH</text>
  <text x="270" y="102" text-anchor="middle" font-size="9" fill="#888">无 DIAB1 前缀代码</text>
  <text x="430" y="92" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="505" y="92" text-anchor="middle" font-size="10" fill="#b85450">无匹配</text>

  <!-- ===== Row 2: Alice (invalid) ===== -->
  <rect x="20" y="112" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="138" text-anchor="middle" font-size="11" fill="#333">Alice</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#999">(空)</text>
  <text x="270" y="148" text-anchor="middle" font-size="9" fill="#888">无疾病代码</text>
  <text x="430" y="138" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="505" y="138" text-anchor="middle" font-size="10" fill="#b85450">空字符串</text>

  <!-- ===== Row 3: Bob (valid) ===== -->
  <rect x="20" y="158" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="184" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="184" text-anchor="middle" font-size="11" fill="#333">Bob</text>
  <text x="210" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">DIAB100</text>
  <text x="285" y="180" text-anchor="middle" font-size="10" fill="#999">␣</text>
  <text x="340" y="180" text-anchor="middle" font-size="11" fill="#333">MYOP</text>
  <text x="270" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a">DIAB100 前缀 = DIAB1 ✓</text>
  <text x="430" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="505" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">^DIAB1 命中</text>

  <!-- ===== Row 4: George (valid) ===== -->
  <rect x="20" y="204" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="230" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#333">George</text>
  <text x="210" y="226" text-anchor="middle" font-size="11" fill="#333">ACNE</text>
  <text x="285" y="226" text-anchor="middle" font-size="10" fill="#999">␣</text>
  <text x="340" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">DIAB150</text>
  <text x="270" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a">DIAB150 前缀 = DIAB1 ✓</text>
  <text x="430" y="230" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="505" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a"> DIAB1 命中</text>

  <!-- ===== Row 5: Alain (valid) ===== -->
  <rect x="20" y="250" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="276" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="120" y="276" text-anchor="middle" font-size="11" fill="#333">Alain</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">DIAB201</text>
  <text x="270" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a">DIAB201 前缀 = DIAB1 ✓</text>
  <text x="430" y="276" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="505" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a">^DIAB1 命中</text>

  <!-- ===== Summary ===== -->
  <rect x="60" y="306" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 位通过 → id 3, 4, 5（Bob, George, Alain）</text>
  <text x="280" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a">边界 ① ^DIAB1：Bob, Alain ｜ 边界 ② 空格DIAB1：George</text>
</svg>
