<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="160" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 树（targetSum = 22）</text>
  <text x="465" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">5 个叶子的根到叶和</text>

  <!-- tree edges: matching paths in red, others grey -->
  <!-- 5-4 (match1) -->
  <path d="M 142 60 L 101 93" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 5-8 (match2) -->
  <path d="M 158 60 L 212 93" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 4-11 (match1) -->
  <path d="M 88 117 L 68 147" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 8-13 (no match) -->
  <path d="M 212 117 L 192 147" stroke="#bbbbbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <!-- 8-4' (match2) -->
  <path d="M 228 117 L 250 147" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 11-7 (no match) -->
  <path d="M 52 175 L 41 205" stroke="#bbbbbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <!-- 11-2 (match1) -->
  <path d="M 72 175 L 82 205" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 4'-5' (match2) -->
  <path d="M 250 175 L 240 205" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 4'-1 (no match) -->
  <path d="M 266 175 L 280 205" stroke="#bbbbbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- tree nodes -->
  <circle cx="150" cy="48" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="53" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <circle cx="95" cy="105" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <circle cx="220" cy="105" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <circle cx="62" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <circle cx="185" cy="162" r="15" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="167" text-anchor="middle" font-size="12" fill="#666">13</text>
  <circle cx="258" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- leaves -->
  <circle cx="35" cy="220" r="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="35" y="225" text-anchor="middle" font-size="11" fill="#666">7</text>
  <circle cx="88" cy="220" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="88" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="238" cy="220" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="238" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <circle cx="285" cy="220" r="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="285" y="225" text-anchor="middle" font-size="11" fill="#666">1</text>

  <!-- leaf sum annotations -->
  <text x="35" y="252" text-anchor="middle" font-size="10" fill="#999">=27 ✗</text>
  <text x="88" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">=22 ✓</text>
  <text x="185" y="190" text-anchor="middle" font-size="10" fill="#999">=26 ✗</text>
  <text x="238" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">=22 ✓</text>
  <text x="285" y="252" text-anchor="middle" font-size="10" fill="#999">=18 ✗</text>

  <text x="160" y="285" text-anchor="middle" font-size="10" fill="#888">红 = 命中的两条根到叶路径</text>

  <!-- table on right -->
  <rect x="345" y="48" width="240" height="162" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <!-- header -->
  <rect x="345" y="48" width="240" height="24" fill="#e8f0fe" stroke="#bbbbbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="368" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">叶子</text>
  <text x="445" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">根到叶路径</text>
  <text x="524" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和</text>
  <text x="560" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收集</text>

  <!-- highlight rows 2 and 4 -->
  <rect x="346" y="98" width="238" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="346" y="146" width="238" height="24" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- row separators -->
  <path d="M 345 96 L 585 96" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 345 120 L 585 120" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 345 144 L 585 144" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 345 168 L 585 168" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: 7 -->
  <text x="368" y="113" text-anchor="middle" font-size="11" fill="#666">7</text>
  <text x="445" y="113" text-anchor="middle" font-size="10" fill="#666">5,4,11,7</text>
  <text x="524" y="113" text-anchor="middle" font-size="11" fill="#666">27</text>
  <text x="560" y="113" text-anchor="middle" font-size="11" fill="#999">✗</text>
  <!-- row 2: 2 (match) -->
  <text x="368" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="445" y="137" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5,4,11,2</text>
  <text x="524" y="137" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">22</text>
  <text x="560" y="137" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <!-- row 3: 13 -->
  <text x="368" y="161" text-anchor="middle" font-size="11" fill="#666">13</text>
  <text x="445" y="161" text-anchor="middle" font-size="10" fill="#666">5,8,13</text>
  <text x="524" y="161" text-anchor="middle" font-size="11" fill="#666">26</text>
  <text x="560" y="161" text-anchor="middle" font-size="11" fill="#999">✗</text>
  <!-- row 4: 5 (match) -->
  <text x="368" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="445" y="185" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5,8,4,5</text>
  <text x="524" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">22</text>
  <text x="560" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <!-- row 5: 1 -->
  <text x="368" y="205" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="445" y="205" text-anchor="middle" font-size="10" fill="#666">5,8,4,1</text>
  <text x="524" y="205" text-anchor="middle" font-size="11" fill="#666">18</text>
  <text x="560" y="205" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <!-- result -->
  <rect x="345" y="226" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="245" text-anchor="middle" font-size="10" fill="#8a6a20">仅命中叶子被收集：</text>
  <text x="465" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[[5,4,11,2],[5,8,4,5]]</text>
</svg>
