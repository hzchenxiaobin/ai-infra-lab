  <!-- Explanation box -->
  <rect x="40" y="362" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">x = (a−1)×7 + b ∈ [1, 49]，每格等概率 1/49</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#666">40 是 10 的倍数 → 1~10 每个结果恰好出现 4 次 → 取用后均匀</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#888">return (x − 1) % 10 + 1；丢弃 41~49 不破坏均匀性（条件概率）</text>
