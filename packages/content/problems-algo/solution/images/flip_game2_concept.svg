<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Minimax 核心判据：存在一个「必败后继」即必胜</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">canWin(s) = ∃ t∈next(s), ¬canWin(t) —— 把对手送进必败态，你就必胜</text>

  <!-- ===== Root node s = "++++" (W) ===== -->
  <text x="30" y="78" font-size="11" fill="#446688" font-weight="bold">当前局面 s = &quot;++++&quot;（你先手）</text>

  <g font-size="13">
    <!-- root cells -->
    <rect x="216" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="232" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+</text>
    <rect x="248" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="264" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+</text>
    <rect x="280" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="296" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+</text>
    <rect x="312" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+</text>
  </g>
  <rect x="232" y="124" width="96" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W（必胜）</text>

  <!-- ===== Three branches ===== -->
  <!-- left branch: flip [0,1] -> "--++" (W) -->
  <path d="M 248 122 L 110 188" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="156" font-size="10" fill="#b85450">翻 [0,1]</text>

  <!-- middle branch: flip [1,2] -> "+--+" (L)  highlighted -->
  <path d="M 280 122 L 280 188" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">翻 [1,2]</text>
  <text x="288" y="170" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 必胜手</text>

  <!-- right branch: flip [2,3] -> "++--" (W) -->
  <path d="M 312 122 L 450 188" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="156" font-size="10" fill="#b85450">翻 [2,3]</text>

  <!-- ===== Three successor nodes ===== -->
  <g font-size="13">
    <!-- left: --++ (W) -->
    <rect x="38" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="54" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="70" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="86" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="102" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="118" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="134" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="150" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>

    <!-- middle: +--+ (L) highlighted -->
    <rect x="232" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="264" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="296" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="312" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="328" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="344" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>

    <!-- right: ++-- (W) -->
    <rect x="394" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="410" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="426" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="442" y="218" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="458" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="474" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="490" y="196" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="506" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
  </g>

  <!-- state tags -->
  <rect x="70" y="234" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W（对手胜）</text>

  <rect x="248" y="234" width="64" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">L（对手败）</text>

  <rect x="422" y="234" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="457" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W（对手胜）</text>

  <!-- ===== Summary rule box ===== -->
  <rect x="30" y="278" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="298" font-size="11" fill="#d6a040" font-weight="bold">Minimax 状态判据（先手视角）</text>
  <text x="46" y="316" font-size="11" fill="#333">必胜态 W：存在至少一个后继 t 是必败态 L（能「把对手送进 L」即胜）</text>
  <text x="46" y="332" font-size="11" fill="#333">必败态 L：所有后继都是必胜态 W（怎么走对手都能赢）</text>
  <text x="46" y="350" font-size="10" fill="#888">上例：&quot;++++&quot; 的后继 &quot;+--+&quot; 是 L（对手无 ++ 可翻）→ 翻 [1,2] 即必胜</text>
</svg>
