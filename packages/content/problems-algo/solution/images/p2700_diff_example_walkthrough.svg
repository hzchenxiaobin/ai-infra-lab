<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)" font-weight="bold">示例演算：沿结构逐层下钻，相同处省略、不同叶收集为 [v₁, v₂]</text>

  <rect x="30" y="44" width="560" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">
    <text x="62" y="64" text-anchor="middle">层</text>
    <text x="205" y="64" text-anchor="middle">比对内容</text>
    <text x="410" y="64" text-anchor="middle">判定</text>
    <text x="535" y="64" text-anchor="middle">贡献</text>
  </g>
  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="44" x2="100" y2="338"/>
    <line x1="330" y1="44" x2="330" y2="338"/>
    <line x1="488" y1="44" x2="488" y2="338"/>
  </g>

  <rect x="30" y="80" width="560" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="97" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">示例 3：o1={"a":5,"v":6,"z":[1,2,4,[2,5,7]]}  vs  o2={"a":5,"v":7,"z":[1,2,3,[1]]}</text>

  <rect x="30" y="106" width="560" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="125" text-anchor="middle">L0</text>
    <text x="110" y="125">o1 vs o2（均 object）</text>
    <text x="340" y="125">共有键 {a,v,z} → 逐键下钻</text>
    <text x="535" y="125" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <rect x="30" y="134" width="560" height="28" rx="3" fill="#f4f4f4" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="153" text-anchor="middle">L1</text>
    <text x="110" y="153">a: 5  vs  5</text>
    <text x="340" y="153" fill="#999">5 === 5（递归基）→ 无差异</text>
    <text x="535" y="153" text-anchor="middle" fill="#999" font-weight="bold">省略 ∅</text>
  </g>

  <rect x="30" y="162" width="560" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="181" text-anchor="middle">L1</text>
    <text x="110" y="181">v: 6  vs  7</text>
    <text x="340" y="181" fill="#b85450" font-weight="bold">6 ≠ 7（原始值不同）→ 叶差异</text>
    <text x="535" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">[6, 7]</text>
  </g>

  <rect x="30" y="190" width="560" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="209" text-anchor="middle">L1</text>
    <text x="110" y="209">z: [1,2,4,[2,5,7]] vs [1,2,3,[1]]</text>
    <text x="340" y="209">同为数组·下标交集 {0,1,2,3} → 递归</text>
    <text x="535" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <rect x="30" y="218" width="560" height="28" rx="3" fill="#f4f4f4" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="237" text-anchor="middle">L2</text>
    <text x="110" y="237">z[0]: 1vs1   z[1]: 2vs2</text>
    <text x="340" y="237" fill="#999">=== 相同 → 无差异</text>
    <text x="535" y="237" text-anchor="middle" fill="#999" font-weight="bold">省略 ∅∅</text>
  </g>

  <rect x="30" y="246" width="560" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="265" text-anchor="middle">L2</text>
    <text x="110" y="265">z[2]: 4  vs  3</text>
    <text x="340" y="265" fill="#b85450" font-weight="bold">4 ≠ 3 → 叶差异</text>
    <text x="535" y="265" text-anchor="middle" fill="#b85450" font-weight="bold">[4, 3]</text>
  </g>

  <rect x="30" y="274" width="560" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="293" text-anchor="middle">L2</text>
    <text x="110" y="293">z[3]: [2,5,7] vs [1]</text>
    <text x="340" y="293">同为数组·交集仅 {0} → 递归</text>
    <text x="535" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <rect x="30" y="302" width="560" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="62" y="321" text-anchor="middle">L3</text>
    <text x="110" y="321">z[3][0]: 2  vs  1</text>
    <text x="340" y="321" fill="#b85450" font-weight="bold">2 ≠ 1 → 叶差异</text>
    <text x="535" y="321" text-anchor="middle" fill="#b85450" font-weight="bold">[2, 1]</text>
  </g>

  <rect x="30" y="340" width="560" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">汇总：{ "v":[6,7], "z":[ ∅, ∅, [4,3], [[2,1]] ] }  （a 无差异；∅=被省略的下标空槽）</text>

  <rect x="30" y="382" width="560" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="404" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">关键观察：</text>
  <text x="46" y="424" font-size="11" fill="#555" filter="url(#rough2)">· 只在「共有键/下标」上递归；a 与 z[0]、z[1] 相同被省略，差异只留 v 与 z[2]、z[3][0]；</text>
  <text x="46" y="440" font-size="11" fill="#555" filter="url(#rough2)">· z[3] 的内层 [2,5,7] vs [1] 因长度不同，只比下标交集 {0}，多出的 5、7 不计入；</text>
  <text x="46" y="456" font-size="11" fill="#555" filter="url(#rough2)">· 嵌套数组递归后仍为数组（z[3] = [[2,1]]），结构同构地向上汇总。</text>
</svg>
