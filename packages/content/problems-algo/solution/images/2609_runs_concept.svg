<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="290" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：切成连续段，相邻 (0段, 1段) 配对 → 2·min(a, b)</text>

  <!-- String label -->
  <text x="36" y="74" font-size="11" fill="#888">字符串</text>

  <!-- Cells: 0 1 0 0 0 1 1 1 (w=40 gap=4 start x=96) -->
  <rect x="96"  y="54" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="140" y="54" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="54" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="228" y="54" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="272" y="54" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="316" y="54" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="54" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="404" y="54" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- Run brackets (y=92, downward) -->
  <path d="M 96 92 Q 96 100 102 100 L 130 100 Q 136 100 136 92" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 140 92 Q 140 100 146 100 L 174 100 Q 180 100 180 92" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 184 92 Q 184 100 190 100 L 306 100 Q 312 100 312 92" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 316 92 Q 316 100 322 100 L 438 100 Q 444 100 444 92" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Run labels (y=116) -->
  <text x="116" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0段×1</text>
  <text x="160" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1段×1</text>
  <text x="248" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0段×3</text>
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1段×3</text>

  <!-- Pair braces (y=140) -->
  <!-- Pair A: run0(0) + run1(1) -->
  <path d="M 96 140 Q 96 148 102 148 L 174 148 Q 180 148 180 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="138" y="164" text-anchor="middle" font-size="11" fill="#555">配对 → 2·min(1,1) = 2</text>

  <!-- Pair B: run2(0) + run3(1) — highlight -->
  <path d="M 184 140 Q 184 150 192 150 L 436 150 Q 444 150 444 140" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="314" y="166" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">配对 → 2·min(3,3) = 6  ✓ 最大</text>

  <!-- Note about invalid order -->
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#999">注：1段→0段 的相邻段不满足「0 在前」，不构成配对</text>

  <!-- Core idea box -->
  <rect x="40" y="206" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">平衡子串形如 0^x 1^x ⟺ 恰好取自一对相邻 (0段, 1段)</text>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="#666">贡献 = 2 × min(0段长, 1段长)；答案 = 所有配对的最大值</text>
  <text x="270" y="264" text-anchor="middle" font-size="10.5" fill="#888">一段扫描即可，无需先存下所有段</text>
</svg>
