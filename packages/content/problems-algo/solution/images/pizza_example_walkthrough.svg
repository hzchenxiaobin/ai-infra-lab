<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 的三种合法切法（pizza = ["A..","AAA","..."], k = 3）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">三块依次送人，每块至少一个苹果 ✓；橙=第1块 蓝=第2块 绿=最后一块</text>

  <!-- ===== Way A: H@row0, V@col0(rows1-2) ===== -->
  <g>
    <text x="98" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案 A · 水平→垂直</text>
    <!-- cells: piece1=row0 (orange), piece2=rows1-2 col0 (blue), piece3=rows1-2 cols1-2 (green) -->
    <!-- row0 -->
    <rect x="56" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="70" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="84" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="98" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="112" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="126" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- row1 -->
    <rect x="56" y="116" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="70" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="84" y="116" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="98" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="112" y="116" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="126" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <!-- row2 -->
    <rect x="56" y="144" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="70" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="84" y="144" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="98" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="112" y="144" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="126" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- cut lines -->
    <path d="M 50 116 L 146 116" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <path d="M 84 116 L 84 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <text x="150" y="120" font-size="9" fill="#b85450" font-weight="bold">✂1</text>
    <text x="88" y="184" font-size="9" fill="#b85450" font-weight="bold">✂2</text>
    <!-- piece labels -->
    <text x="56" y="200" font-size="10" fill="#d6a040" font-weight="bold">① A.. ✓</text>
    <text x="56" y="216" font-size="10" fill="#446688" font-weight="bold">② A/. ✓</text>
    <text x="56" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">③ AA/.. ✓</text>
    <text x="98" y="252" text-anchor="middle" font-size="9" fill="#888">切1: 行0↕1 | 切2: 列0↕1</text>
  </g>

  <!-- ===== Way B: H@row0, V@col1(rows1-2) ===== -->
  <g>
    <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案 B · 水平→垂直</text>
    <!-- row0 piece1 orange -->
    <rect x="238" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="252" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="266" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="280" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="294" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="308" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- row1: cols0-1 piece2 blue, col2 piece3 green -->
    <rect x="238" y="116" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="252" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="266" y="116" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="280" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="294" y="116" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="308" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <!-- row2 -->
    <rect x="238" y="144" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="252" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="266" y="144" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="280" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="294" y="144" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="308" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- cut lines -->
    <path d="M 232 116 L 328 116" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <path d="M 294 116 L 294 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <text x="332" y="120" font-size="9" fill="#b85450" font-weight="bold">✂1</text>
    <text x="298" y="184" font-size="9" fill="#b85450" font-weight="bold">✂2</text>
    <!-- piece labels -->
    <text x="238" y="200" font-size="10" fill="#d6a040" font-weight="bold">① A.. ✓</text>
    <text x="238" y="216" font-size="10" fill="#446688" font-weight="bold">② AA/.. ✓</text>
    <text x="238" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">③ A/. ✓</text>
    <text x="280" y="252" text-anchor="middle" font-size="9" fill="#888">切1: 行0↕1 | 切2: 列1↕2</text>
  </g>

  <!-- ===== Way C: V@col0, V@col1 ===== -->
  <g>
    <text x="462" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案 C · 垂直→垂直</text>
    <!-- col0 piece1 orange, col1 piece2 blue, col2 piece3 green -->
    <!-- row0 -->
    <rect x="420" y="88" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="434" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="448" y="88" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="462" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="476" y="88" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="490" y="107" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- row1 -->
    <rect x="420" y="116" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="434" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="448" y="116" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="462" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="476" y="116" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="490" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <!-- row2 -->
    <rect x="420" y="144" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="434" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="448" y="144" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="462" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <rect x="476" y="144" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="490" y="163" text-anchor="middle" font-size="12" fill="#bbb">.</text>
    <!-- cut lines (both vertical, full height) -->
    <path d="M 448 84 L 448 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <path d="M 476 84 L 476 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
    <text x="444" y="80" font-size="9" fill="#b85450" font-weight="bold">✂1</text>
    <text x="472" y="80" font-size="9" fill="#b85450" font-weight="bold">✂2</text>
    <!-- piece labels -->
    <text x="420" y="200" font-size="10" fill="#d6a040" font-weight="bold">① A/A/. ✓</text>
    <text x="420" y="216" font-size="10" fill="#446688" font-weight="bold">② ./A/. ✓</text>
    <text x="420" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">③ ./A/. ✓</text>
    <text x="462" y="252" text-anchor="middle" font-size="9" fill="#888">切1: 列0↕1 | 切2: 列1↕2</text>
  </g>

  <!-- ===== Bottom summary ===== -->
  <rect x="40" y="276" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">dp[2][0][0] = 2 + 0 + 1 + 0 = 3</text>
</svg>
