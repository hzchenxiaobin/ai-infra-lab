<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举镜像锚点 + 双向贪心扩展</text>

  <!-- step 1 -->
  <g filter="url(#rough2)">
    <rect x="115" y="30" width="290" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="260" y="49" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">① 区间 DP 预处理回文表 ps / pt（O(n²+m²)）</text>
  </g>
  <line x1="260" y1="60" x2="260" y2="76" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <g filter="url(#rough2)">
    <rect x="90" y="78" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="260" y="97" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">② midS[i] / midT[j]：以 i 为起点 / 以 j 为终点的最长回文长度</text>
  </g>
  <line x1="260" y1="108" x2="260" y2="124" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <g filter="url(#rough2)">
    <rect x="90" y="126" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="145" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">③ ans ← 两串最长回文子串的较大值（全局 max，勿只查贴边！）</text>
  </g>
  <line x1="260" y1="156" x2="260" y2="172" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <g filter="url(#rough2)">
    <rect x="115" y="174" width="290" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="260" y="193" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">④ 枚举镜像锚点 (i₁, i₂)：s 左翼起点 × t 右翼终点，k ← 0</text>
  </g>
  <line x1="260" y1="204" x2="260" y2="220" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- step 5 diamond -->
  <g filter="url(#rough2)">
    <polygon points="260,222 392,254 260,286 128,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="260" y="251" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">s[i₁+k] = t[i₂−k]</text>
    <text x="260" y="266" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">且未越界 ?</text>
  </g>

  <!-- yes branch -->
  <line x1="392" y1="254" x2="408" y2="254" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- step 6 -->
  <g filter="url(#rough2)">
    <rect x="410" y="232" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="460" y="249" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">k++</text>
    <text x="460" y="265" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">ans ← max(ans, 2k+mid)</text>
  </g>

  <!-- loop back from step 6 to diamond top -->
  <path d="M 460 232 L 460 213 L 260 213 L 260 218" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="209" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">继续扩展</text>

  <!-- no branch -->
  <line x1="260" y1="286" x2="260" y2="302" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="272" y="298" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- next pair box -->
  <g filter="url(#rough2)">
    <rect x="165" y="304" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="260" y="322" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">取下一对锚点 (i₁, i₂)</text>
  </g>

  <!-- loop back from next-pair to step 4 -->
  <path d="M 165 318 L 86 318 L 86 189 L 112 189" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="80" y="255" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">循环</text>

  <!-- output -->
  <line x1="260" y1="332" x2="260" y2="348" stroke="#555" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="330" y="345" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">全部枚举完</text>
  <g filter="url(#rough2)">
    <rect x="190" y="350" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">输出 ans</text>
  </g>

  <text x="260" y="394" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">mid = max(midS[i₁+k], midT[i₂−k])：中心回文从两翼根部锚点向内取最长</text>
</svg>
