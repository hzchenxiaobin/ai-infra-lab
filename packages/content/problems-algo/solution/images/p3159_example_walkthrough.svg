<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：pos = [0, 2]（x = 1 共出现 2 次）</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [1,3,1,7]，queries = [1,3,2,4] —— 表建好后，每个查询只是查一次表</text>

  <!-- ===== table ===== -->
  <!-- header -->
  <rect x="46" y="60" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询 q</text>
  <rect x="134" y="60" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">要找什么</text>
  <rect x="264" y="60" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>
  <rect x="404" y="60" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">答案</text>

  <!-- row 1 -->
  <rect x="46" y="94" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="134" y="94" width="130" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="116" text-anchor="middle" font-size="11" fill="#555">第 1 个 1</text>
  <rect x="264" y="94" width="140" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="116" text-anchor="middle" font-size="11" fill="#555">1 ≤ 2 → pos[0]</text>
  <rect x="404" y="94" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 2 -->
  <rect x="46" y="132" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="134" y="132" width="130" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="154" text-anchor="middle" font-size="11" fill="#555">第 3 个 1</text>
  <rect x="264" y="132" width="140" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="154" text-anchor="middle" font-size="11" fill="#b85450">3 &gt; 2 越界</text>
  <rect x="404" y="132" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-1</text>

  <!-- row 3 -->
  <rect x="46" y="170" width="88" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="134" y="170" width="130" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="192" text-anchor="middle" font-size="11" fill="#555">第 2 个 1</text>
  <rect x="264" y="170" width="140" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="192" text-anchor="middle" font-size="11" fill="#555">2 ≤ 2 → pos[1]</text>
  <rect x="404" y="170" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 4 -->
  <rect x="46" y="208" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="134" y="208" width="130" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="230" text-anchor="middle" font-size="11" fill="#555">第 4 个 1</text>
  <rect x="264" y="208" width="140" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="230" text-anchor="middle" font-size="11" fill="#b85450">4 &gt; 2 越界</text>
  <rect x="404" y="208" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-1</text>

  <!-- ===== result ===== -->
  <rect x="46" y="258" width="428" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">answer = [0, -1, 2, -1]</text>

  <!-- ===== example 2 ===== -->
  <rect x="46" y="304" width="428" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 2：nums = [1,2,3]，x = 5 → pos = []（x 一次都不出现）</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#555">pos.size() = 0，任何 q ≥ 1 都大于 0 → 全部 -1，空表天然被同一个判定覆盖</text>
</svg>
