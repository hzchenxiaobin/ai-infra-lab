<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：回看前 3 格，命中即返回</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始：i = 3</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: nums[i]==nums[i-1]? -->
  <polygon points="280,96 400,140 280,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#444">nums[i] ==</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#444">nums[i−1] ?</text>

  <!-- Yes branch -> return -->
  <path d="M 400 140 L 440 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="416" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="120" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 nums[i]</text>
  <text x="490" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">(距离 1)</text>

  <!-- No branch down -->
  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="198" font-size="11" fill="#888">否</text>

  <!-- Decision 2: nums[i]==nums[i-2]? -->
  <polygon points="280,204 400,248 280,292 160,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#444">nums[i] ==</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#444">nums[i−2] ?</text>

  <path d="M 400 248 L 440 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="416" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="228" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 nums[i]</text>
  <text x="490" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">(距离 2)</text>

  <path d="M 280 292 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="306" font-size="11" fill="#888">否</text>

  <!-- Decision 3: nums[i]==nums[i-3]? -->
  <polygon points="280,312 400,356 280,400 160,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#444">nums[i] ==</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#444">nums[i−3] ?</text>

  <path d="M 400 356 L 440 356" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="416" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="336" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 nums[i]</text>
  <text x="490" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a">(距离 3)</text>

  <!-- No branch -> i++ loop back -->
  <path d="M 160 356 L 80 356 L 80 140 L 160 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="250" font-size="11" fill="#888">否</text>
  <rect x="40" y="244" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="263" text-anchor="middle" font-size="11" fill="#333">i ++</text>

  <!-- Footnote -->
  <rect x="40" y="424" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">鸽巢保证：循环内必命中，三种距离 1/2/3 至少有一个成立</text>
</svg>
