<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">窗口累计求和：PARTITION BY player_id ORDER BY event_date</text>

  <!-- Activity table (left) -->
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Activity（源表）</text>
  <rect x="20" y="64" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="83" font-size="9.5" fill="#333">player_id</text>
  <text x="92" y="83" font-size="9.5" fill="#333">event_date</text>
  <text x="145" y="83" font-size="9.5" fill="#333">games</text>
  <line x1="70" y1="64" x2="70" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="64" x2="125" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="94" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="110" font-size="10" fill="#333">1</text>
  <text x="92" y="110" font-size="9.5" fill="#333">2016-03-01</text>
  <text x="148" y="110" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <line x1="70" y1="94" x2="70" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="94" x2="125" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="118" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="134" font-size="10" fill="#333">1</text>
  <text x="92" y="134" font-size="9.5" fill="#333">2016-05-02</text>
  <text x="148" y="134" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <line x1="70" y1="118" x2="70" y2="142" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="118" x2="125" y2="142" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="142" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="158" font-size="10" fill="#333">1</text>
  <text x="92" y="158" font-size="9.5" fill="#333">2017-06-25</text>
  <text x="148" y="158" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <line x1="70" y1="142" x2="70" y2="166" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="142" x2="125" y2="166" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="166" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="182" font-size="10" fill="#333">3</text>
  <text x="92" y="182" font-size="9.5" fill="#333">2016-03-02</text>
  <text x="148" y="182" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <line x1="70" y1="166" x2="70" y2="190" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="166" x2="125" y2="190" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="190" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="206" font-size="10" fill="#333">3</text>
  <text x="92" y="206" font-size="9.5" fill="#333">2018-07-03</text>
  <text x="148" y="206" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <line x1="70" y1="190" x2="70" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="190" x2="125" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- partition brackets -->
  <path d="M175 106 L188 106 L188 158 L175 158" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="135" font-size="9.5" fill="#b85450" font-weight="bold">PARTITION</text>
  <text x="200" y="148" font-size="9.5" fill="#b85450" font-weight="bold">BY id=1</text>

  <path d="M175 178 L188 178 L188 206 L175 206" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="196" font-size="9.5" fill="#d6a040" font-weight="bold">PARTITION</text>
  <text x="200" y="208" font-size="9.5" fill="#d6a040" font-weight="bold">BY id=3</text>

  <!-- ORDER BY arrow inside each partition -->
  <path d="M250 106 L250 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="125" font-size="9" fill="#446688">ORDER BY</text>
  <text x="262" y="137" font-size="9" fill="#446688">event_date</text>
  <text x="262" y="149" font-size="9" fill="#446688">↑升序</text>

  <!-- frame indicator -->
  <rect x="225" y="94" width="80" height="120" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="265" y="232" text-anchor="middle" font-size="9" fill="#b85450">帧 frame：</text>
  <text x="265" y="244" text-anchor="middle" font-size="9" fill="#b85450">UNBOUNDED → 当前</text>

  <!-- arrows to result -->
  <path d="M310 130 L420 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M310 190 L420 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="365" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">SUM 累加</text>

  <!-- Result table (right) -->
  <text x="510" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结果（每行一行）</text>
  <rect x="420" y="64" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="83" font-size="9" fill="#333">player_id</text>
  <text x="492" y="83" font-size="9" fill="#333">event_date</text>
  <text x="568" y="83" font-size="9" fill="#333">so_far</text>
  <line x1="470" y1="64" x2="470" y2="94" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="64" x2="545" y2="94" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="94" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="110" font-size="10" fill="#333">1</text>
  <text x="492" y="110" font-size="9.5" fill="#333">2016-03-01</text>
  <text x="575" y="110" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <line x1="470" y1="94" x2="470" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="94" x2="545" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="118" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="134" font-size="10" fill="#333">1</text>
  <text x="492" y="134" font-size="9.5" fill="#333">2016-05-02</text>
  <text x="575" y="134" font-size="10" fill="#b85450" font-weight="bold">11</text>
  <line x1="470" y1="118" x2="470" y2="142" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="118" x2="545" y2="142" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="142" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="158" font-size="10" fill="#333">1</text>
  <text x="492" y="158" font-size="9.5" fill="#333">2017-06-25</text>
  <text x="575" y="158" font-size="10" fill="#b85450" font-weight="bold">12</text>
  <line x1="470" y1="142" x2="470" y2="166" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="142" x2="545" y2="166" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="166" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="182" font-size="10" fill="#333">3</text>
  <text x="492" y="182" font-size="9.5" fill="#333">2016-03-02</text>
  <text x="575" y="182" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <line x1="470" y1="166" x2="470" y2="190" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="166" x2="545" y2="190" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="190" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="206" font-size="10" fill="#333">3</text>
  <text x="492" y="206" font-size="9.5" fill="#333">2018-07-03</text>
  <text x="575" y="206" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <line x1="470" y1="190" x2="470" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="545" y1="190" x2="545" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- cumsum annotation -->
  <text x="490" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">5</text>
  <text x="528" y="232" text-anchor="middle" font-size="9.5" fill="#888">→</text>
  <text x="548" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">5+6=11</text>
  <text x="595" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">→</text>
  <text x="490" y="246" text-anchor="middle" font-size="9.5" fill="#b85450">11+1=12</text>

  <!-- key takeaway box -->
  <rect x="40" y="288" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="11.5" fill="#333" font-weight="bold">核心：窗口函数 = 不压行 + 跨行聚合</text>
  <text x="60" y="332" font-size="10.5" fill="#555">• PARTITION BY player_id → 每个玩家独立一个窗口（互不影响）</text>
  <text x="60" y="350" font-size="10.5" fill="#555">• ORDER BY event_date → 窗内按日期升序，决定累加方向</text>
  <text x="60" y="368" font-size="10.5" fill="#555">• 默认帧 UNBOUNDED PRECEDING → CURRENT ROW → 从首行累加到当前行</text>
</svg>
