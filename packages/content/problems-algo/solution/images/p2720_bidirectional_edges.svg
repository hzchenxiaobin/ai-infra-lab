<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：好友关系双向，必须把行展开成边</text>

  <!-- Left panel: original directed rows -->
  <rect x="16" y="56" width="220" height="270" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="126" y="76" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Friends 原表（有向行）</text>
  <text x="126" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">user1 → user2</text>

  <!-- row 2->1 -->
  <circle cx="56" cy="130" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="134" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <line x1="73" y1="130" x2="178" y2="130" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="194" cy="130" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="194" y="134" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- row 1->3 -->
  <circle cx="56" cy="190" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="194" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <line x1="73" y1="190" x2="178" y2="190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="194" cy="190" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>

  <!-- row 4->1 -->
  <circle cx="56" cy="250" r="15" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="254" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <line x1="73" y1="250" x2="178" y2="250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="194" cy="250" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="194" y="254" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="126" y="298" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">user2 看到的好友被漏掉</text>
  <text x="126" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（1 不知自己是 2、4 的好友）</text>

  <!-- middle transformation arrow -->
  <path d="M244 175 L316 175" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrs)" fill="none" filter="url(#rough2)"/>
  <rect x="246" y="120" width="74" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="283" y="136" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">UNION ALL</text>
  <text x="283" y="150" text-anchor="middle" font-size="9" fill="#a07820" filter="url(#rough2)">交换 user1,user2</text>
  <text x="283" y="196" text-anchor="middle" font-size="9" fill="#a07820" filter="url(#rough2)">每行复制一份</text>
  <text x="283" y="208" text-anchor="middle" font-size="9" fill="#a07820" filter="url(#rough2)">并交换两列</text>

  <!-- Right panel: bidirectional edges -->
  <rect x="324" y="56" width="220" height="270" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="434" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">edges 双向边表</text>
  <text x="434" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每用户都数到全部好友</text>

  <!-- 2 <-> 1 -->
  <circle cx="364" cy="130" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <line x1="380" y1="124" x2="485" y2="124" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="485" y1="136" x2="380" y2="136" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="502" cy="130" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="502" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 1 <-> 3 -->
  <circle cx="364" cy="190" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="364" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <line x1="380" y1="184" x2="485" y2="184" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="485" y1="196" x2="380" y2="196" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="502" cy="190" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 4 <-> 1 -->
  <circle cx="364" cy="250" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <line x1="380" y1="244" x2="485" y2="244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="485" y1="256" x2="380" y2="256" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="502" cy="250" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="502" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="434" y="298" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">GROUP BY u + COUNT(*)</text>
  <text x="434" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个用户的好友数 = 该 u 行数</text>

  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">💡 1 条关系 → 2 条边；数边用 UNION ALL（不去重），数人用 UNION（去重）</text>
</svg>
