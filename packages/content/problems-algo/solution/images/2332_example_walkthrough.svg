<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：buses=[10,20,30], passengers=[4,11,13,19,21,25,26], capacity=2</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">排序后逐车双指针上车，橙=候选时刻，红=答案</text>

  <!-- column headers -->
  <text x="60" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">车</text>
  <text x="130" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">发车</text>
  <text x="250" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">上车的乘客</text>
  <text x="345" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">满载?</text>
  <text x="410" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">末位</text>
  <text x="475" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">X</text>
  <text x="545" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">候选</text>

  <!-- ============ row 1: bus 10 (center y=108) ============ -->
  <rect x="40" y="92" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="111" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="100" y="92" width="60" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="111" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">10</text>
  <rect x="205" y="92" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{4}</text>
  <rect x="315" y="92" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1/2 否</text>
  <rect x="385" y="92" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="111" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <rect x="450" y="92" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="475" y="111" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">10</text>
  <rect x="515" y="92" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="545" y="111" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">10</text>

  <!-- ============ row 2: bus 20 (center y=148) ============ -->
  <rect x="40" y="132" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="151" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <rect x="100" y="132" width="60" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="151" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">20</text>
  <rect x="205" y="132" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="151" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{11, 13}</text>
  <rect x="315" y="132" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="151" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2/2 是</text>
  <rect x="385" y="132" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="151" text-anchor="middle" font-size="11.5" fill="#333">13</text>
  <rect x="450" y="132" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="475" y="151" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">12</text>
  <rect x="515" y="132" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="545" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>

  <!-- ============ row 3: bus 30 (center y=188) ============ -->
  <rect x="40" y="172" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <rect x="100" y="172" width="60" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="191" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">30</text>
  <rect x="205" y="172" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{19, 21}</text>
  <rect x="315" y="172" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2/2 是</text>
  <rect x="385" y="172" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="191" text-anchor="middle" font-size="11.5" fill="#333">21</text>
  <rect x="450" y="172" width="50" height="30" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="475" y="191" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">20</text>
  <rect x="515" y="172" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="545" y="191" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">20</text>

  <!-- separator -->
  <line x1="40" y1="212" x2="575" y2="212" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ answer row (center y=242) ============ -->
  <text x="300" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">取所有候选的最大值</text>
  <rect x="205" y="224" width="370" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = max(10, 12, 20) = 20  ✓</text>

  <!-- reasoning box -->
  <rect x="40" y="276" width="535" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="11" fill="#446688" font-weight="bold">逐车推演（指针 j 全程只前进）：</text>
  <text x="56" y="316" font-size="10.5" fill="#333">车1·发车10：取 4（cnt=1&lt;2，未满）→ X=发车10，10 空闲 → 候选 10</text>
  <text x="56" y="334" font-size="10.5" fill="#333">车2·发车20：取 11、13（cnt=2=2，已满，末位13）→ X=末位−1=12，12 空闲 → 候选 12</text>
  <text x="56" y="352" font-size="10.5" fill="#333">车3·发车30：取 19、21（cnt=2=2，已满，末位21）→ X=末位−1=20，20 空闲 → 候选 20</text>
  <text x="56" y="372" font-size="10.5" fill="#b85450" font-weight="bold">三车候选取最大 = 20，即你 20 时刻到、抢在末位乘客 21 之前上第 3 辆车</text>
</svg>
