<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：一真一假</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" filter="url(#rough2)">示例1：nums=[2,4,5,5,5,5,5,6,6], target=5, n=9</text>

  <!-- index labels -->
  <text x="100" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="142" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="184" y="78" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="226" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="268" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="310" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="352" y="78" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">6</text>
  <text x="394" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="436" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>

  <!-- cells width 42, start x=79 -->
  <rect x="79" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="121" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="163" y="84" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="205" y="84" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="247" y="84" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="289" y="84" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="331" y="84" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="373" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="415" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- reasoning line -->
  <text x="40" y="132" font-size="11" fill="#666" filter="url(#rough2)">first=2, n/2=4, check=2+4=6 → nums[6]=5==5 ✓ 出现5次 &gt; 9/2</text>
  <rect x="380" y="120" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="136" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">true</text>

  <!-- divider -->
  <path d="M 60 168 Q 280 163 500 168" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">示例2：nums=[10,100,101,101], target=101, n=4</text>

  <!-- index labels -->
  <text x="120" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="190" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="330" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="400" y="216" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- cells width 70, start x=85 -->
  <rect x="85" y="222" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="155" y="222" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <rect x="225" y="222" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>
  <rect x="295" y="222" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>

  <!-- out-of-bounds marker -->
  <rect x="365" y="222" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">越界</text>

  <!-- reasoning line -->
  <text x="40" y="280" font-size="11" fill="#666" filter="url(#rough2)">first=2, n/2=2, check=2+2=4 → 4 ≥ n=4 越界，出现2次不 &gt; 4/2</text>
  <rect x="380" y="268" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="284" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- bottom insight -->
  <rect x="80" y="320" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">判据：nums[first + n/2] == target</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">命中 ⇔ 至少 n/2+1 个 target ⇔ 严格过半</text>

  <!-- boundary guard -->
  <rect x="80" y="380" width="400" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 先查 nums[first]==target，再查越界 check&lt;n</text>
</svg>
