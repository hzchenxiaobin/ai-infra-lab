<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：防抖函数（调用即重置 + 到期执行）</text>

  <rect x="150" y="44" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">调用 debounced(...args)</text>
  <path d="M 280 84 L 280 100" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="102" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">clearTimeout(timer)　取消上一个待执行定时器</text>
  <path d="M 280 146 L 280 162" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="8" y="104" width="104" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">首次调用</text>
  <text x="60" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">timer = undefined</text>
  <text x="60" y="154" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">clearTimeout 空操作</text>
  <path d="M 112 133 L 120 133" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <rect x="60" y="164" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">timer = setTimeout(() =&gt; fn(...args), t)</text>
  <path d="M 280 212 L 280 228" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="230" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">立即返回（注册即返回，不阻塞主线程）</text>
  <path d="M 280 270 L 280 286" stroke="#888" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="288" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">⏱ 事件循环等待 t 毫秒…</text>
  <path d="M 280 328 L 280 344" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="70" y="346" width="420" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t 内无新调用 → 定时器到期 → 执行 fn(...args)</text>

  <path d="M 400 308 C 540 308, 540 124, 440 124" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="504" y="212" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">新调用中断</text>
  <text x="504" y="228" font-size="10" fill="#b85450" filter="url(#rough2)">→ 回到 clearTimeout</text>
  <text x="504" y="244" font-size="10" fill="#b85450" filter="url(#rough2)">　作废旧 timer 重置</text>

  <rect x="40" y="440" width="480" height="100" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="462" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">两条路径由闭包变量 timer 解耦：</text>
  <text x="60" y="482" font-size="11" fill="#555" filter="url(#rough2)">· 左侧（同步）：每次调用 clearTimeout + setTimeout 重置，注册即返回。</text>
  <text x="60" y="500" font-size="11" fill="#555" filter="url(#rough2)">· 右侧（异步）：只有 t 内无新调用，定时器才存活到期、触发 fn。</text>
  <text x="60" y="518" font-size="11" fill="#555" filter="url(#rough2)">· 中断：等待期间新调用 → 旧 timer 被 clearTimeout 作废，回到顶部重置。</text>
</svg>
