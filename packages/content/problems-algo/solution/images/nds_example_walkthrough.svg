<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [4, 6, 7, 7] 的搜索树</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">蓝格=未记录(len&lt;2)；绿格✓=记入答案；红虚✗=同层去重跳过</text>

  <!-- ===== Edges (drawn first so nodes overlap them) ===== -->
  <g stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <!-- root -> depth1 -->
    <path d="M 300 80 L 107 103" marker-end="url(#arr)"/>
    <path d="M 300 80 L 265 103" marker-end="url(#arr)"/>
    <path d="M 300 80 L 370 103" marker-end="url(#arr)"/>
    <!-- [4] -> depth2 -->
    <path d="M 107 139 L 55 168" marker-end="url(#arr)"/>
    <path d="M 107 139 L 160 168" marker-end="url(#arr)"/>
    <!-- [6] -> depth2 -->
    <path d="M 265 139 L 265 168" marker-end="url(#arr)"/>
    <!-- [7] -> depth2 -->
    <path d="M 370 139 L 370 168" marker-end="url(#arr)"/>
    <!-- [4,6] -> depth3 -->
    <path d="M 55 204 L 55 233" marker-end="url(#arr)"/>
    <!-- [4,7] -> depth3 -->
    <path d="M 160 204 L 160 233" marker-end="url(#arr)"/>
    <!-- [6,7] -> depth3 -->
    <path d="M 265 204 L 265 233" marker-end="url(#arr)"/>
    <!-- [4,6,7] -> depth4 -->
    <path d="M 55 269 L 55 298" marker-end="url(#arr)"/>
  </g>
  <!-- red dashed skip edge -->
  <path d="M 300 80 L 465 103" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edge labels -->
  <g font-size="9" fill="#888" filter="url(#rough2)">
    <text x="180" y="92">i=0</text>
    <text x="276" y="92">i=1</text>
    <text x="328" y="92">i=2</text>
    <text x="392" y="92" fill="#b85450">i=3 ✗</text>
    <text x="64"  y="156">i=1</text>
    <text x="128" y="156">i=2</text>
    <text x="270" y="156">i=2</text>
    <text x="376" y="156">i=3</text>
    <text x="60"  y="222">i=2</text>
    <text x="166" y="222">i=3</text>
    <text x="272" y="222">i=3</text>
    <text x="62"  y="288">i=3</text>
  </g>

  <!-- ===== Nodes ===== -->
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <!-- root [] -->
    <rect x="280" y="58" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="300" y="74" fill="#446688">[ ]</text>

    <!-- depth1: [4], [6], [7], [7]✗ -->
    <rect x="72"  y="103" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="107" y="119" fill="#446688">[4]</text>
    <rect x="230" y="103" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="265" y="119" fill="#446688">[6]</text>
    <rect x="335" y="103" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="370" y="119" fill="#446688">[7]</text>
    <rect x="440" y="103" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="465" y="119" fill="#b85450">[7] ✗</text>

    <!-- depth2: [4,6]✓ [4,7]✓ [6,7]✓ [7,7]✓ -->
    <rect x="16"  y="168" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="55"  y="184" fill="#4a7a3a">[4,6] ✓</text>
    <rect x="121" y="168" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="184" fill="#4a7a3a">[4,7] ✓</text>
    <rect x="226" y="168" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="265" y="184" fill="#4a7a3a">[6,7] ✓</text>
    <rect x="331" y="168" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="370" y="184" fill="#4a7a3a">[7,7] ✓</text>

    <!-- depth3: [4,6,7]✓ [4,7,7]✓ [6,7,7]✓ -->
    <rect x="16"  y="233" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="55"  y="249" fill="#4a7a3a">[4,6,7] ✓</text>
    <rect x="121" y="233" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="249" fill="#4a7a3a">[4,7,7] ✓</text>
    <rect x="226" y="233" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="265" y="249" fill="#4a7a3a">[6,7,7] ✓</text>

    <!-- depth4: [4,6,7,7]✓ -->
    <rect x="10" y="298" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="55" y="314" fill="#4a7a3a">[4,6,7,7] ✓</text>
  </g>

  <!-- ===== Summary ===== -->
  <line x1="20" y1="338" x2="520" y2="338" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="346" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="365" font-size="11" fill="#d6a040" font-weight="bold">绿格共 8 个 → 答案：</text>
  <text x="50" y="382" font-size="10.5" fill="#555">[4,6], [4,6,7], [4,6,7,7], [4,7], [4,7,7], [6,7], [6,7,7], [7,7]</text>
  <text x="430" y="365" font-size="11" fill="#b85450" font-weight="bold">✗ 仅 1 处显式</text>
  <text x="430" y="382" font-size="9.5" fill="#888">（同层去重，更多</text>
  <text x="430" y="394" font-size="9.5" fill="#888">skip 见概念图）</text>
</svg>
