<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程（在间距 d 上二分，最大化最小间距）</text>

  <!-- Step 0: sort -->
  <rect x="150" y="38" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333">排序 position，计算 hi = span / (m−1)</text>

  <!-- arrow down -->
  <path d="M 270 68 L 270 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start node -->
  <ellipse cx="270" cy="104" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#333">开始: lo=1, hi=span/(m−1), ans=1</text>

  <!-- arrow down -->
  <path d="M 270 124 L 270 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,146 370,192 270,238 170,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> end -->
  <path d="M 370 192 L 452 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="184" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="192" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="196" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 238 L 270 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="252" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="150" y="260" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2  （候选间距）</text>

  <!-- arrow down -->
  <path d="M 270 294 L 270 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute count (greedy check) -->
  <rect x="110" y="316" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#333">count = 贪心放置球数 check(mid)</text>

  <!-- arrow down -->
  <path d="M 270 350 L 270 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: count >= m? -->
  <polygon points="270,372 380,418 270,442 160,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="12" fill="#333">count &gt;= m ?</text>
  <text x="270" y="426" text-anchor="middle" font-size="11" fill="#666">(放得下吗)</text>

  <!-- Yes (feasible) -> try larger -->
  <path d="M 160 418 L 100 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="410" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="398" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="416" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="56" y="432" text-anchor="middle" font-size="11" fill="#555">lo = mid + 1</text>

  <!-- No (too large) -> try smaller -->
  <path d="M 380 418 L 440 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="410" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="442" y="398" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="424" text-anchor="middle" font-size="11" fill="#333">hi = mid − 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 56 398 L 56 192 L 170 192" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="300" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 300)">继续二分</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 484 398 L 484 192 L 370 192" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
