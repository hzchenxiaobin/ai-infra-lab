<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反悔贪心：能付就付，付不起就「换大留小」</text>

  <text x="30" y="50" font-size="11" fill="#888">例：[ +10, −10, −9, −1 ]，初始余额 0（构造的反悔触发用例）</text>

  <!-- transaction strip -->
  <rect x="30" y="60" width="62" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="61" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">+10</text>
  <text x="61" y="99" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 收</text>

  <rect x="106" y="60" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="137" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−10</text>
  <text x="137" y="99" text-anchor="middle" font-size="9" fill="#b85450">✓ 收·入堆</text>

  <rect x="182" y="60" width="62" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="213" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−9</text>
  <text x="213" y="99" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">换入！</text>

  <rect x="258" y="60" width="62" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="289" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <text x="289" y="99" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 收·入堆</text>

  <!-- per-step status -->
  <text x="61" y="120" text-anchor="middle" font-size="10" fill="#555">bal 10</text>
  <text x="61" y="134" text-anchor="middle" font-size="9" fill="#888">笔数 1</text>
  <text x="137" y="120" text-anchor="middle" font-size="10" fill="#555">bal 0</text>
  <text x="137" y="134" text-anchor="middle" font-size="9" fill="#888">笔数 2</text>
  <text x="213" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">bal 1</text>
  <text x="213" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">笔数 2</text>
  <text x="289" y="120" text-anchor="middle" font-size="10" fill="#555">bal 0</text>
  <text x="289" y="134" text-anchor="middle" font-size="9" fill="#888">笔数 3</text>

  <!-- three rules box -->
  <rect x="338" y="58" width="217" height="92" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="350" y="77" font-size="11" fill="#446688" font-weight="bold">三条规则</text>
  <text x="350" y="96" font-size="9.5" fill="#333">① t ≥ 0 → 白拿</text>
  <text x="350" y="113" font-size="9.5" fill="#333">② 负交易付得起 → 收并入堆</text>
  <text x="350" y="130" font-size="9.5" fill="#333">③ 付不起 → 堆顶更重才反悔换入</text>
  <text x="358" y="145" font-size="9" fill="#888">（堆空 / 堆顶不更重 → 跳过）</text>

  <!-- swap storyboard -->
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">扫到 −9：bal + (−9) = −9 &lt; 0 付不起 → 从堆里换出更重的 −10</text>

  <rect x="70" y="176" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">堆 = {10}</text>
  <text x="135" y="214" text-anchor="middle" font-size="10" fill="#555">bal = 0</text>

  <path d="M 200 200 L 254 200" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="227" y="190" text-anchor="middle" font-size="10" fill="#b85450">反悔一换一</text>
  <text x="227" y="216" text-anchor="middle" font-size="9" fill="#888">笔数不变</text>

  <rect x="258" y="176" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="333" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">堆 = {9}</text>
  <text x="333" y="214" text-anchor="middle" font-size="10" fill="#555">bal = 1（回升 1）</text>

  <path d="M 408 200 L 422 200" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="426" y="176" width="114" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="483" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">之后 −1 付得起</text>
  <text x="483" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最终 3 笔 &gt; 2 笔</text>

  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#446688">bal′ = 0 + |−10| − |−9| = 1（回升 1，仍 ≥ 0）</text>

  <!-- safety box -->
  <rect x="40" y="262" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#333">安全性：撤销更早的 −10，其后各时刻余额只增不减；</text>
  <text x="280" y="299" text-anchor="middle" font-size="11" fill="#333">换入 −9 后 bal′ = 1 &gt; 0 —— 前缀约束全部保住</text>

  <!-- takeaway box -->
  <rect x="40" y="320" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333">核心：非负白拿、能付就付、付不起就换大留小；</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">反悔笔数不减、余额净赚 —— 先乐观接受，后择优反悔</text>
</svg>
