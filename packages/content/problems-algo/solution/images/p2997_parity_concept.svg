<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">为什么一次操作恰好翻转 X 的一位？</text>

  <!-- 左组：操作前 -->
  <text x="112" y="56" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">nums 各元素的第 i 位（前）</text>

  <text x="52" y="92" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[0]</text>
  <rect x="76" y="74" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="52" y="124" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[1]</text>
  <rect x="76" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="52" y="156" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[2]</text>
  <rect x="76" y="138" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="52" y="188" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[3]</text>
  <rect x="76" y="170" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="112" y="220" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">cᵢ = 3 个 1（奇数）</text>
  <rect x="76" y="230" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="250" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="128" y="250" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">← X 的第 i 位</text>

  <!-- 中间箭头 -->
  <path d="M 188 152 L 306 152" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="247" y="132" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">翻转 nums[2] 的第 i 位</text>
  <text x="247" y="147" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（1 → 0）</text>

  <!-- 右组：操作后 -->
  <text x="412" y="56" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">nums 各元素的第 i 位（后）</text>

  <text x="352" y="92" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[0]</text>
  <rect x="376" y="74" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="352" y="124" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[1]</text>
  <rect x="376" y="106" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="352" y="156" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[2]</text>
  <rect x="376" y="138" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="158" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="352" y="188" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">nums[3]</text>
  <rect x="376" y="170" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="412" y="220" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">cᵢ = 2 个 1（偶数）</text>
  <rect x="376" y="230" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="250" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="428" y="250" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">← X 的第 i 位</text>

  <!-- 结论框 -->
  <rect x="36" y="288" width="448" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">结论：X 的第 i 位 = cᵢ mod 2（逐位奇偶校验）</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">翻转任意元素的第 i 位 ⟺ cᵢ ± 1 ⟺ 奇偶性反转</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">⟹ X 的第 i 位必然翻转，其余位纹丝不动</text>
  <text x="260" y="374" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">一次操作 = 翻转 X 的恰好一位</text>
</svg>
