<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：k-平衡只会诞生在「( 游程 → ) 游程」的交界处</text>

  <!-- ===================== 左栏：游程化 + 公式 ===================== -->
  <text x="30" y="46" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第一步：游程编码（示例 s = (((()))(()))，k = 2）</text>

  <!-- 字符格子 12 个 -->
  <g filter="url(#rough2)">
    <rect x="40" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="57" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="74" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="91" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="108" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="125" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="142" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="159" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="176" y="54" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="193" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="210" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="227" y="54" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="48.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="65.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="82.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="99.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="116.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
    <text x="133.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
    <text x="150.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
    <text x="167.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="184.5" y="69" text-anchor="middle" font-size="10" fill="#33506b">(</text>
    <text x="201.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
    <text x="218.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
    <text x="235.5" y="69" text-anchor="middle" font-size="10" fill="#2f5d24">)</text>
  </g>

  <line x1="142" y1="80" x2="142" y2="95" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="92" font-size="9" fill="#666" filter="url(#rough2)">RLE 压缩</text>

  <!-- 游程块 -->
  <g filter="url(#rough2)">
    <rect x="40" y="100" width="68" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="74" y="117" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">( ×4</text>
    <rect x="108" y="100" width="51" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="133.5" y="117" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">) ×3</text>
    <rect x="159" y="100" width="34" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="176" y="117" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="193" y="100" width="51" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="218.5" y="117" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">) ×3</text>
  </g>
  <text x="30" y="145" font-size="9.5" fill="#666" filter="url(#rough2)">删除只发生在「( 游程 | ) 游程」交界（蓝块 → 绿块处）</text>

  <!-- 公式框 -->
  <rect x="30" y="158" width="272" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="177" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">交界处：a 个 ( 紧跟 b 个 )</text>
  <text x="166" y="195" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">可消 t = ⌊min(a, b) / k⌋ 块，各吃 t·k 个字符</text>
  <text x="166" y="213" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">消后必有一侧剩量 &lt; k ⇒ 交界暂时枯竭</text>

  <!-- 关键机制框 -->
  <rect x="30" y="238" width="272" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删除引发的拼接 = 栈的弹出与合并</text>
  <text x="166" y="275" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">游程被消空 ⇒ 两侧字符直接相连：</text>
  <text x="166" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">同字符 ⇒ 合并；( 在下 ) 在上 ⇒ 新交界再消</text>

  <!-- ===================== 右栏：级联现场 ===================== -->
  <text x="312" y="46" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第二步：级联现场（栈快照，底 → 顶）</text>

  <!-- Row 1 -->
  <g filter="url(#rough2)">
    <rect x="330" y="56" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="347" y="72" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="364" y="56" width="17" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="372.5" y="72" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">)</text>
    <text x="372.5" y="46" text-anchor="middle" font-size="7.5" fill="#666">)×1</text>
    <rect x="381" y="56" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="398" y="72" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="415" y="56" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="432" y="72" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">) ×2</text>
  </g>
  <rect x="377" y="51" width="76" height="34" rx="6" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="415" y1="88" x2="415" y2="102" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="110" font-size="9.5" fill="#444" filter="url(#rough2)">① 交界 (×2 | )×2：t = ⌊min(2,2)/2⌋ = 1</text>
  <text x="312" y="123" font-size="9.5" fill="#444" filter="url(#rough2)">　　两侧各消 2 个 ⇒ 两个游程同时清空、弹出</text>

  <!-- Row 2: 消空后 -->
  <g filter="url(#rough2)">
    <rect x="330" y="132" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="347" y="148" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="364" y="132" width="17" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="372.5" y="148" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">)</text>
    <text x="393" y="149" font-size="11" fill="#666">＋</text>
    <rect x="406" y="132" width="17" height="24" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2"/>
    <text x="414.5" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">)</text>
    <text x="440" y="149" font-size="9" fill="#666">← 最后一个 ) 到来</text>
  </g>
  <path d="M 414 158 Q 400 170 386 174" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="330" y="178" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="347" y="194" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="364" y="178" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/>
    <text x="381" y="194" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">) ×2</text>
    <text x="404" y="194" font-size="9" fill="#8a6d1f">合并！</text>
  </g>
  <text x="312" y="220" font-size="9.5" fill="#444" filter="url(#rough2)">② 新 ) 与残留的 )×1 同字符相邻 ⇒ 合并成 )×2</text>
  <text x="312" y="233" font-size="9.5" fill="#444" filter="url(#rough2)">　　（游程更长，交界又能消了）</text>

  <!-- Row 3 -->
  <g filter="url(#rough2)">
    <rect x="330" y="242" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="347" y="258" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">( ×2</text>
    <rect x="364" y="242" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="381" y="258" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">) ×2</text>
  </g>
  <rect x="360" y="237" width="42" height="34" rx="6" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="381" y1="274" x2="381" y2="288" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="298" font-size="9.5" fill="#444" filter="url(#rough2)">③ 新交界 (×2 | )×2 又消 1 块 ⇒ 双双清空</text>
  <text x="312" y="311" font-size="9.5" fill="#444" filter="url(#rough2)">　　⇒ 栈空，终态为空串（与暴力反复删除一致）</text>

  <!-- footer -->
  <rect x="30" y="322" width="505" height="66" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="282" y="342" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">为什么快：暴力每删一轮就全串重扫 —— 嵌套 "(((…)))" 每轮只剥一层，O(n²)</text>
  <text x="282" y="360" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">游程栈把「删除」变「弹出」、「拼接」变「合并」，每个字符至多进出栈一次 ⇒ 一趟 O(n)</text>
  <text x="282" y="377" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">且删除顺序不影响终态（可对拍验证）⇒ 交界贪心消到枯竭是安全的</text>
</svg>
