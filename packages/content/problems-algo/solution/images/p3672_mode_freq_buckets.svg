<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：窗口 → 频次表 → 频次桶（有序集合）</text>

  <!-- 数组行 -->
  <rect x="40" y="38" width="212" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="146" y="34" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">当前窗口（k = 4）</text>
  <rect x="48" y="46" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="98" y="46" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="46" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="46" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="46" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="46" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="372" y="58" font-size="10" fill="#888" filter="url(#rough2)">nums =</text>
  <text x="358" y="74" font-size="10" fill="#888" filter="url(#rough2)">[1,1,2,3,3,3]</text>
  <path d="M 360,96 L 424,96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">窗口右滑一格</text>

  <!-- 频次表 -->
  <rect x="36" y="126" width="140" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="146" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq：值 → 频次</text>
  <text x="60" y="168" font-size="11" fill="#333" filter="url(#rough2)">1 → 2</text>
  <text x="60" y="190" font-size="11" fill="#333" filter="url(#rough2)">2 → 1</text>
  <text x="60" y="212" font-size="11" fill="#333" filter="url(#rough2)">3 → 1</text>
  <text x="60" y="234" font-size="9.5" fill="#666" filter="url(#rough2)">哈希表，O(1) 增减</text>

  <!-- 频次表 → 桶 的迁移箭头 -->
  <path d="M 182,185 L 252,185" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">频次 ±1</text>
  <text x="217" y="199" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">相邻桶迁移</text>

  <!-- 频次桶 -->
  <text x="406" y="140" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">buckets：频次 → 值的有序集合</text>

  <rect x="276" y="150" width="262" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="292" y="172" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">f=1</text>
  <rect x="330" y="155" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="347" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="372" y="155" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="389" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="173" font-size="9.5" fill="#666" filter="url(#rough2)">← 同桶多值，取最大</text>

  <rect x="276" y="196" width="262" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="292" y="218" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f=2</text>
  <rect x="330" y="201" width="34" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="219" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="378" y="219" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">← 众数所在层</text>

  <rect x="276" y="242" width="262" height="30" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <text x="292" y="262" font-size="10.5" fill="#999" filter="url(#rough2)">f=3</text>
  <text x="330" y="262" font-size="10" fill="#999" filter="url(#rough2)">∅（空桶，虚线表示可能存在）</text>

  <!-- maxFreq 指针 -->
  <path d="M 236,214 L 272,214" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="254" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">maxFreq=2</text>

  <!-- 答案框 -->
  <rect x="36" y="292" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="286" y="313" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">窗口的加权众数 = max(buckets[maxFreq]) × maxFreq</text>
  <text x="286" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1 × 2 = 2　（众数 1，频次 2）</text>

  <!-- 要点框 -->
  <rect x="36" y="360" width="500" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="381" font-size="10.5" fill="#333" filter="url(#rough2)">① 窗口每滑一格：恰一个值频次 +1、一个值频次 −1 ⇒ 只需两次桶间迁移</text>
  <text x="52" y="402" font-size="10.5" fill="#333" filter="url(#rough2)">② 桶用有序集合维护 ⇒ 插入/删除 O(log n)，取桶内最大值 O(1)（并列取最大）</text>
  <text x="52" y="423" font-size="10.5" fill="#333" filter="url(#rough2)">③ 顶桶（f=maxFreq）清空时 maxFreq 落一层：被移出的值恰落在相邻桶，必非空</text>
  <text x="52" y="444" font-size="10.5" fill="#333" filter="url(#rough2)">④ 升频直接 maxFreq=max(maxFreq, f)；先 remove 后 add，查询放最后 ⇒ 桶必非空</text>
</svg>
