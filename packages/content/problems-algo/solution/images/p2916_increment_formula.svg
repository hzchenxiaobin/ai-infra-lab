<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">平方和怎么维护？——增量公式把「平方」降维成「求和」</text>

  <rect x="150" y="42" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#555">区间内单个元素加一时</text>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">(d+1)² − d² = 2d + 1</text>

  <path d="M 215 100 C 180 110, 160 114, 150 122" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 345 100 C 380 110, 400 114, 410 122" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="28" y="124" width="248" height="182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="152" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">树状数组路线（两个 BIT）</text>
  <text x="152" y="172" text-anchor="middle" font-size="11" fill="#333">维护 S = Σ D[i]²，逐轮算增量</text>
  <text x="152" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Δ = 2·T + len</text>
  <text x="152" y="214" text-anchor="middle" font-size="11" fill="#555">T = 区间 [p+1, r] 内 D 的旧和</text>
  <text x="152" y="234" text-anchor="middle" font-size="11" fill="#555">只需「区间加 + 区间和」</text>
  <text x="152" y="254" text-anchor="middle" font-size="11" fill="#555">两个树状数组即可实现</text>
  <text x="152" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">先查 T → S += 2T+len → 再区间加 1</text>
  <text x="152" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a">ans = (ans + S) mod 1e9+7</text>

  <rect x="284" y="124" width="248" height="182" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">线段树路线（懒标记）</text>
  <text x="408" y="172" text-anchor="middle" font-size="11" fill="#333">每个节点存 (s1, s2, lazy)</text>
  <text x="408" y="192" text-anchor="middle" font-size="11" fill="#555">整块加 v 时：</text>
  <text x="408" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s2 += 2v·s1 + v²·len</text>
  <text x="408" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s1 += v·len</text>
  <text x="408" y="256" text-anchor="middle" font-size="11" fill="#555">公式对 v 的叠加封闭</text>
  <text x="408" y="276" text-anchor="middle" font-size="11" fill="#555">懒标记只需累加</text>
  <text x="408" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">根的 s2 就是 S，更新完直接读</text>

  <rect x="28" y="326" width="504" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">共同本质：k 次幂和的增量是 k−1 次多项式</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555">2262（一次方）增量是常数 len → O(n) 裸做；本题（平方）增量依赖一次方和</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#555">→ 必须会算区间和 → BIT / 线段树登场；节点多存一阶矩可推广到立方和</text>
</svg>
