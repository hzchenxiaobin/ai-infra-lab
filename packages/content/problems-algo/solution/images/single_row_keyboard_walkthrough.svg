<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word = "cba"（keyboard 为标准字母序）</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">pos: a=0, b=1, c=2 —— 逐步查表累加 |prev − cur|</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="56" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">字符 c</text>
  <text x="195" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">pos[c]</text>
  <text x="295" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">prev</text>
  <text x="400" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">|prev−cur|</text>
  <text x="515" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">ans 累计</text>

  <!-- column dividers -->
  <line x1="140" y1="56" x2="140" y2="202" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="250" y1="56" x2="250" y2="202" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="340" y1="56" x2="340" y2="202" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="460" y1="56" x2="460" y2="202" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- ===== Row 0: initial ===== -->
  <rect x="30" y="84" width="540" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="103" text-anchor="middle" font-size="12" fill="#888">初始</text>
  <text x="195" y="103" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="295" y="103" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="400" y="103" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="515" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- ===== Row 1: c ===== -->
  <rect x="30" y="112" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="195" y="131" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="295" y="131" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="400" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">|0−2| = 2</text>
  <text x="515" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- ===== Row 2: b ===== -->
  <rect x="30" y="140" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="195" y="159" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="295" y="159" text-anchor="middle" font-size="12" fill="#888">2</text>
  <text x="400" y="159" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">|2−1| = 1</text>
  <text x="515" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- ===== Row 3: a ===== -->
  <rect x="30" y="168" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="195" y="187" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="295" y="187" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="400" y="187" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">|1−0| = 1</text>
  <text x="515" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- ===== Result box ===== -->
  <rect x="150" y="214" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 2 + 1 + 1 = 4 ✓</text>

  <!-- ===== Example 2 note ===== -->
  <rect x="60" y="262" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">示例 2：keyboard = "pqrstuvwxyzabcdefghijklmno", word = "leetcode"</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#555">pos: l=22, e=15, e=15, t=4, c=13, o=25, d=14, e=15</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = 22+7+0+11+9+12+11+1 = 73 ✓（相同流程，仅映射表不同）</text>
</svg>
