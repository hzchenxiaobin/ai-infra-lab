<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：套用判据 2·diff vs 9·(qR−qL)</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">奇数 '?' → Alice 胜；偶数 '?' → 比较公式</text>

  <!-- table header -->
  <g font-size="11">
    <rect x="20" y="64" width="80" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="84" text-anchor="middle" fill="#446688" font-weight="bold">num</text>

    <rect x="100" y="64" width="40" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="84" text-anchor="middle" fill="#446688" font-weight="bold">diff</text>

    <rect x="140" y="64" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="158" y="84" text-anchor="middle" fill="#446688" font-weight="bold">qL</text>

    <rect x="176" y="64" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="194" y="84" text-anchor="middle" fill="#446688" font-weight="bold">qR</text>

    <rect x="212" y="64" width="100" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="262" y="84" text-anchor="middle" fill="#d6a040" font-weight="bold">qL+qR 奇偶</text>

    <rect x="312" y="64" width="90" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="357" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">2·diff</text>

    <rect x="402" y="64" width="100" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="452" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">9·(qR−qL)</text>

    <rect x="502" y="64" width="118" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="561" y="84" text-anchor="middle" fill="#4a7a3a" font-weight="bold">输出</text>
  </g>

  <!-- row 1: "5023" -->
  <g font-size="11">
    <rect x="20" y="96" width="80" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="124" text-anchor="middle" fill="#444" font-weight="bold">"5023"</text>

    <rect x="100" y="96" width="40" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="120" y="124" text-anchor="middle" fill="#444">0</text>

    <rect x="140" y="96" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="158" y="124" text-anchor="middle" fill="#444">0</text>

    <rect x="176" y="96" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="194" y="124" text-anchor="middle" fill="#444">0</text>

    <rect x="212" y="96" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="262" y="124" text-anchor="middle" fill="#888">0 (偶)</text>

    <rect x="312" y="96" width="90" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="357" y="124" text-anchor="middle" fill="#b85450">0</text>

    <rect x="402" y="96" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="452" y="124" text-anchor="middle" fill="#b85450">0</text>

    <rect x="502" y="96" width="118" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="561" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">false ✓</text>
  </g>

  <!-- row 2: "25??" -->
  <g font-size="11">
    <rect x="20" y="144" width="80" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="172" text-anchor="middle" fill="#444" font-weight="bold">"25??"</text>

    <rect x="100" y="144" width="40" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="120" y="172" text-anchor="middle" fill="#444">7</text>

    <rect x="140" y="144" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="158" y="172" text-anchor="middle" fill="#444">0</text>

    <rect x="176" y="144" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="194" y="172" text-anchor="middle" fill="#444">2</text>

    <rect x="212" y="144" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="262" y="172" text-anchor="middle" fill="#888">2 (偶)</text>

    <rect x="312" y="144" width="90" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="357" y="172" text-anchor="middle" fill="#b85450">14</text>

    <rect x="402" y="144" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="452" y="172" text-anchor="middle" fill="#b85450">18</text>

    <rect x="502" y="144" width="118" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="561" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true ✓</text>
  </g>

  <!-- row 3: "?3295???" -->
  <g font-size="11">
    <rect x="20" y="192" width="80" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="220" text-anchor="middle" fill="#444" font-weight="bold">"?3295???"</text>

    <rect x="100" y="192" width="40" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="120" y="220" text-anchor="middle" fill="#444">9</text>

    <rect x="140" y="192" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="158" y="220" text-anchor="middle" fill="#444">1</text>

    <rect x="176" y="192" width="36" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="194" y="220" text-anchor="middle" fill="#444">3</text>

    <rect x="212" y="192" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="262" y="220" text-anchor="middle" fill="#888">4 (偶)</text>

    <rect x="312" y="192" width="90" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="357" y="220" text-anchor="middle" fill="#b85450">18</text>

    <rect x="402" y="192" width="100" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="452" y="220" text-anchor="middle" fill="#b85450">18</text>

    <rect x="502" y="192" width="118" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="561" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">false ✓</text>
  </g>

  <!-- explanation boxes -->
  <rect x="20" y="252" width="195" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="36" y="274" font-size="12" fill="#b85450" font-weight="bold">示例 1: "5023"</text>
  <text x="36" y="292" font-size="10" fill="#555">无 '?'，diff=0</text>
  <text x="36" y="308" font-size="10" fill="#555">2·0 = 0 = 9·0</text>
  <text x="36" y="324" font-size="10" fill="#b85450">两半已相等 → Bob 胜</text>

  <rect x="225" y="252" width="195" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="241" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2: "25??"</text>
  <text x="241" y="292" font-size="10" fill="#555">2 '?'，diff=7</text>
  <text x="241" y="308" font-size="10" fill="#555">2·7=14 ≠ 18=9·2</text>
  <text x="241" y="324" font-size="10" fill="#4a7a3a">Alice 填 9 即可破坏</text>

  <rect x="430" y="252" width="190" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="274" font-size="12" fill="#b85450" font-weight="bold">示例 3: "?3295???"</text>
  <text x="446" y="292" font-size="10" fill="#555">4 '?'，diff=9</text>
  <text x="446" y="308" font-size="10" fill="#555">2·9=18 = 18=9·2</text>
  <text x="446" y="324" font-size="10" fill="#b85450">互补锁定 → Bob 胜</text>

  <!-- formula reminder -->
  <rect x="120" y="348" width="400" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="372" font-size="13" fill="#444" font-weight="bold">核心判据（偶数 '?' 时）：</text>
  <text x="140" y="392" font-size="13" fill="#b85450" font-weight="bold">Bob 胜 ⇔ 2 · diff == 9 · (qR − qL)</text>

  <text x="320" y="424" text-anchor="middle" font-size="10" fill="#888">奇数 '?' 时 Alice 必胜（走最后一步，10 选 1 避开目标）</text>
  <text x="320" y="440" text-anchor="middle" font-size="10" fill="#888">整数性：qL+qR 偶 → qR−qL 偶 → 9·(qR−qL)/2 恒为整数</text>
</svg>
