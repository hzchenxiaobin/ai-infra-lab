<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三种 action 各归其位，Ignored 全排除</text>

  <!-- ============ Three action chips ============ -->
  <!-- Clicked -->
  <rect x="40" y="52" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">Clicked</text>
  <!-- Viewed -->
  <rect x="205" y="52" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">Viewed</text>
  <!-- Ignored -->
  <rect x="370" y="52" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">Ignored</text>

  <!-- ============ Role labels under each chip ============ -->
  <!-- Clicked role -->
  <rect x="40" y="112" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 进分子</text>
  <text x="105" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 进分母</text>

  <!-- Viewed role -->
  <rect x="205" y="112" width="130" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 不进分子</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓ 进分母</text>

  <!-- Ignored role -->
  <rect x="370" y="112" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="435" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 不进分子</text>
  <text x="435" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 不进分母</text>

  <!-- arrow down to formula -->
  <path d="M270 168 L270 188" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ CTR formula box ============ -->
  <rect x="35" y="192" width="470" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="35" y="192" width="470" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="207" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">CTR 公式（一次 GROUP BY 内条件聚合）</text>
  <!-- fraction -->
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Σ(Clicked)</text>
  <line x1="78" y1="236" x2="162" y2="236" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="244" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Σ(Clicked+Viewed)</text>
  <text x="178" y="238" font-size="13" fill="#555" font-weight="bold">× 100</text>
  <text x="232" y="238" font-size="11" fill="#d6a040" font-weight="bold">→ ROUND(, 2)</text>
  <text x="300" y="232" font-size="10" fill="#555">分子只数 Clicked 行</text>
  <text x="300" y="244" font-size="10" fill="#555">分母数 Clicked+Viewed，Ignored 自然剔除</text>

  <!-- arrow down -->
  <path d="M270 250 L270 268" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Division-by-zero guard box ============ -->
  <rect x="35" y="272" width="470" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="35" y="272" width="470" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="287" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">⚠️ 除零兜底：广告仅有 Ignored 时分母 = 0</text>
  <text x="48" y="308" font-size="10.5" fill="#333">分母 = 0  →  <tspan fill="#b85450" font-weight="bold">0 / 0</tspan>  →  MySQL 得 <tspan fill="#b85450" font-weight="bold">NULL</tspan>  →  <tspan fill="#4a7a3a" font-weight="bold">IFNULL(·, 0)</tspan>  →  0.00</text>
  <text x="48" y="323" font-size="9.5" fill="#777">跨方言写法：分子 / NULLIF(分母, 0) 再 COALESCE(·, 0)，规避 PG 的 division by zero 报错</text>

  <!-- bottom note -->
  <rect x="20" y="346" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="365" font-size="10" fill="#333">关键：分母不可用 <tspan fill="#b85450" font-weight="bold">COUNT(*)</tspan>（会把 Ignored 算进去）。ad 1 用 COUNT(*) 得 2/4=50%，</text>
  <text x="35" y="380" font-size="10" fill="#333">而正确分母 <tspan fill="#446688" font-weight="bold">SUM(action IN ('Clicked','Viewed'))</tspan> 得 2/3=66.67%。Ignored 必须<tspan fill="#b85450" font-weight="bold">两端全排除</tspan>。</text>
</svg>
