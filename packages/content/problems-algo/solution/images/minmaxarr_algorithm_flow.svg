<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描，维护前缀和与最大上取整均值</text>

  <!-- ===== init box ===== -->
  <rect x="210" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化：ans = 0, sum = 0, i = 0</text>

  <!-- arrow down to loop body -->
  <path d="M 280 82 L 280 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== loop body ===== -->
  <rect x="150" y="112" width="260" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">循环体（对每个 i = 0..n−1）</text>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#333">① sum += nums[i]   （前缀和 S_{i+1}）</text>
  <text x="280" y="167" text-anchor="middle" font-size="11.5" fill="#333">② ans = max(ans, ⌈sum / (i+1)⌉)</text>

  <!-- arrow down to decision -->
  <path d="M 280 180 L 280 206" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== decision diamond: i < n ? ===== -->
  <polygon points="280,210 360,250 280,290 200,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888">（未遍历完）</text>

  <!-- yes branch: loop back up to body -->
  <path d="M 360 250 C 430 250 430 145 410 145" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="436" y="216" font-size="10.5" fill="#4a7a3a">i++ 后回到循环体</text>

  <!-- no branch: down to return -->
  <path d="M 280 290 L 280 316" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="306" font-size="12" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== return box ===== -->
  <rect x="200" y="320" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- divider -->
  <line x1="30" y1="372" x2="540" y2="372" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== key formula note ===== -->
  <rect x="30" y="386" width="500" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">整数上取整的小技巧</text>
  <text x="280" y="426" text-anchor="middle" font-size="11.5" fill="#333">⌈sum / k⌉ = (sum + k − 1) / k   （k = i + 1）</text>
  <text x="280" y="444" text-anchor="middle" font-size="11.5" fill="#333">即代码里写 (sum + i) / (i + 1)，避免浮点与溢出</text>
</svg>
