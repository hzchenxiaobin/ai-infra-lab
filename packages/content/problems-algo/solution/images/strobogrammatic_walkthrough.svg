<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,9 L5,1 L9,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：逐对核对旋转配对</text>

  <!-- ===== 示例 1：num = "69" → true ===== -->
  <text x="44" y="62" font-size="13" fill="#446688" filter="url(#rough2)">num = "69"</text>

  <!-- 数字格子（配对中：橙） -->
  <rect x="130" y="72" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="100" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>
  <rect x="200" y="72" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="100" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>

  <!-- 下标 -->
  <text x="155" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="225" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <!-- 双指针 -->
  <text x="135" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">left</text>
  <line x1="155" y1="148" x2="155" y2="136" stroke="#446688" stroke-width="1.6" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="225" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">right</text>
  <line x1="225" y1="148" x2="225" y2="136" stroke="#446688" stroke-width="1.6" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <!-- 配对核对说明 -->
  <rect x="300" y="78" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rotate('6') = '9'</text>
  <text x="400" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">'9' == num[1]='9'  ✓</text>

  <!-- 结果 -->
  <rect x="300" y="140" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="342" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">true ✓</text>

  <!-- 分隔虚线 -->
  <line x1="40" y1="186" x2="480" y2="186" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ===== 示例 2：num = "962" → false ===== -->
  <text x="44" y="214" font-size="13" fill="#b85450" filter="url(#rough2)">num = "962"</text>

  <!-- 数字格子：配对的 9 与 2 橙，中间未检查的 6 灰 -->
  <rect x="110" y="224" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="252" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <rect x="180" y="224" width="50" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="252" text-anchor="middle" font-size="20" fill="#999" filter="url(#rough2)">6</text>
  <rect x="250" y="224" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="252" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>

  <!-- 下标 -->
  <text x="135" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="205" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="275" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- 双指针 -->
  <text x="115" y="304" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">left</text>
  <line x1="135" y1="300" x2="135" y2="288" stroke="#446688" stroke-width="1.6" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="275" y="304" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">right</text>
  <line x1="275" y1="300" x2="275" y2="288" stroke="#446688" stroke-width="1.6" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <!-- 配对核对说明 -->
  <rect x="340" y="230" width="166" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="423" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rotate('9') = '6'</text>
  <text x="423" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">'6' ≠ num[2]='2'  ✗</text>

  <!-- 结果 -->
  <rect x="340" y="292" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">false ✗</text>

  <!-- 底部提示 -->
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每对 (num[left], num[right]) 满足 rotate(num[left]) == num[right] 即中心对称</text>
</svg>
