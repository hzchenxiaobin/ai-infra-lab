<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：vals=[1,3,2,1,3]，按值升序激活</text>

  <!-- ============ Row 1 : V=1 ============ -->
  <rect x="20" y="40" width="64" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">V=1</text>
  <text x="52" y="108" text-anchor="middle" font-size="10" fill="#888">加边 0</text>

  <!-- inactive edges all dashed grey -->
  <line x1="104" y1="80" x2="194" y2="80" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="194" y1="80" x2="284" y2="80" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="284" y1="80" x2="374" y2="80" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="284" y1="80" x2="284" y2="130" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- nodes: 1(3) 0(1) 2(2) 4(3) ; 3(1) below 2 -->
  <circle cx="104" cy="80" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="194" cy="80" r="13" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="194" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="284" cy="80" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="374" cy="80" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="284" cy="130" r="13" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <text x="450" y="78" text-anchor="middle" font-size="11" fill="#555">值1节点：0、3</text>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="#555">分属不同分量</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C(1,2)+C(1,2)=0</text>
  <text x="450" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 5</text>

  <!-- separator -->
  <line x1="20" y1="172" x2="540" y2="172" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ Row 2 : V=2 ============ -->
  <rect x="20" y="182" width="64" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">V=2</text>
  <text x="52" y="250" text-anchor="middle" font-size="10" fill="#888">加0-2,2-3</text>

  <!-- active green edges: 0-2, 2-3 ; inactive dashed: 0-1, 2-4 -->
  <line x1="104" y1="222" x2="194" y2="222" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="194" y1="222" x2="284" y2="222" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="284" y1="222" x2="374" y2="222" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="284" y1="222" x2="284" y2="272" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="104" cy="222" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="226" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="194" cy="222" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="284" cy="222" r="13" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="374" cy="222" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="226" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="284" cy="272" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="276" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- component brace {0,2,3} -->
  <text x="239" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-style="italic">分量{0,2,3}</text>

  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#555">值2节点：仅2</text>
  <text x="450" y="236" text-anchor="middle" font-size="11" fill="#555">该分量 k=1</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C(1,2)=0</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 5</text>

  <line x1="20" y1="314" x2="540" y2="314" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ Row 3 : V=3 ============ -->
  <rect x="20" y="324" width="64" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="380" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">V=3</text>
  <text x="52" y="396" text-anchor="middle" font-size="10" fill="#888">加0-1,2-4</text>

  <!-- all edges active: existing(0-2,2-3) green ; newly added(0-1,2-4) orange thick -->
  <line x1="104" y1="372" x2="194" y2="372" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="194" y1="372" x2="284" y2="372" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="284" y1="372" x2="374" y2="372" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="284" y1="372" x2="284" y2="422" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="104" cy="372" r="13" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="104" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="194" cy="372" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="284" cy="372" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="374" cy="372" r="13" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="374" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="284" cy="422" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="426" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- pairing arc between node1 and node4 (value-3 endpoints) -->
  <path d="M 104 358 Q 239 318 374 358" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="239" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 与 4 配对</text>

  <text x="450" y="370" text-anchor="middle" font-size="11" fill="#555">值3节点：1、4</text>
  <text x="450" y="386" text-anchor="middle" font-size="11" fill="#555">同属分量{0,1,2,3,4}</text>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=2 → C(2,2)=1</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 6</text>
</svg>
