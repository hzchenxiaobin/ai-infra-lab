<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    核心观察：阈值降低 → R_i 右移（j 只前进）
  </text>

  <!-- nums1 row label -->
  <text x="30" y="95" font-size="13" fill="#446688" filter="url(#rough2)">nums1</text>
  <text x="30" y="112" font-size="11" fill="#888" filter="url(#rough2)">非递增</text>

  <!-- nums1 boxes: 55, 30, 5, 4, 2 -->
  <g filter="url(#rough2)">
    <rect x="80" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="100" text-anchor="middle" font-size="13" fill="#333">55</text>
    <rect x="148" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="100" text-anchor="middle" font-size="13" fill="#333">30</text>
    <rect x="216" y="78" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="244" y="100" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="284" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="312" y="100" text-anchor="middle" font-size="13" fill="#333">4</text>
    <rect x="352" y="78" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="380" y="100" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>

  <!-- i pointer markers -->
  <text x="108" y="68" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i=0</text>
  <path d="M108,70 L108,76" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="68" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i=2</text>
  <path d="M244,70 L244,76" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- arrow: i moves right -->
  <path d="M120,62 L232,62" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="176" y="55" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i 右移，nums1[i] 递减</text>

  <!-- nums2 row label -->
  <text x="30" y="200" font-size="13" fill="#4a7a3a" filter="url(#rough2)">nums2</text>
  <text x="30" y="217" font-size="11" fill="#888" filter="url(#rough2)">非递增</text>

  <!-- nums2 boxes: 100, 20, 10, 10, 5 -->
  <g filter="url(#rough2)">
    <rect x="80" y="183" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="108" y="205" text-anchor="middle" font-size="13" fill="#333">100</text>
    <rect x="148" y="183" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="176" y="205" text-anchor="middle" font-size="13" fill="#333">20</text>
    <rect x="216" y="183" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="244" y="205" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="284" y="183" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="312" y="205" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="352" y="183" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="380" y="205" text-anchor="middle" font-size="13" fill="#333">5</text>
  </g>

  <!-- j pointer for i=0: R_0 = 0 -->
  <text x="108" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j=0 (R_0)</text>
  <path d="M108,232 L108,219" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j pointer for i=2: R_2 = 4 -->
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j=4 (R_2)</text>
  <path d="M380,232 L380,219" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow: j moves right (monotonic) -->
  <path d="M120,238 L368,238" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j 只前进不后退（R_i 单调不减）</text>

  <!-- valid region brackets for i=2 -->
  <path d="M244,165 L244,170 L380,170 L380,165" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="312" y="160" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">合法 j 区间 [i, R_i]</text>

  <!-- bottom explanation box -->
  <rect x="60" y="285" width="440" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ① nums2 非递增 → 合法 j 是一段前缀 [0, R_i]
  </text>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    ② nums1 非递增 → i 右移时阈值降低 → R_i 单调不减
  </text>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    ③ j 只前进，总推进 ≤ m → O(n + m)
  </text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    对每个 i 取 j = R_i，距离 = R_i − i，取全局 max
  </text>
</svg>
