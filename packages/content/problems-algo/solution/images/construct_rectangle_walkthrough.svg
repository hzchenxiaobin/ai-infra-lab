<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：area = 37（质数，最坏情况）与 area = 12（一步命中）</text>

  <!-- ===== Left: area = 37 walkthrough table ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">area = 37，⌊√37⌋ = 6</text>

  <!-- table header -->
  <rect x="30" y="68" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮</text>
  <rect x="70" y="68" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">w</text>
  <rect x="116" y="68" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="146" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">37 % w</text>
  <rect x="176" y="68" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="208" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">命中?</text>

  <!-- row 1: w=6, 37%6=1, ✗ -->
  <rect x="30" y="92" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="70" y="92" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="107" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="116" y="92" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="176" y="92" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="107" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- row 2: w=5, 2, ✗ -->
  <rect x="30" y="114" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="129" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="70" y="114" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="129" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="116" y="114" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="129" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="176" y="114" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="129" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- row 3: w=4, 1, ✗ -->
  <rect x="30" y="136" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="151" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="70" y="136" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="151" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="116" y="136" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="151" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="176" y="136" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="151" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- row 4: w=3, 1, ✗ -->
  <rect x="30" y="158" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="173" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="70" y="158" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="173" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="116" y="158" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="173" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="176" y="158" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="173" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- row 5: w=2, 1, ✗ -->
  <rect x="30" y="180" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="195" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="70" y="180" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="93" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="116" y="180" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="195" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="176" y="180" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="195" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- row 6: w=1, 0, ✓ (hit, highlight) -->
  <rect x="30" y="202" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="70" y="202" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="93" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="202" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="146" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="202" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>

  <!-- decrement arrow on the w column -->
  <path d="M 93 114 L 93 200" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="160" font-size="10" fill="#888" transform="rotate(90 266 160)">w 递减</text>

  <!-- answer for 37 -->
  <rect x="30" y="244" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 [37/1, 1] = [37, 1]</text>
  <text x="135" y="280" text-anchor="middle" font-size="10" fill="#888">37 质数 ⇒ 唯一因子对 (1, 37)</text>

  <!-- ===== Right: area = 12 one-step ===== -->
  <text x="310" y="56" font-size="12" fill="#888" font-weight="bold">area = 12，⌊√12⌋ = 3</text>

  <!-- single step highlight box -->
  <rect x="300" y="92" width="230" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 1 轮：w = 3</text>
  <text x="415" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">12 % 3 == 0 ✓ 一步命中！</text>

  <!-- three factor pairs comparison -->
  <text x="310" y="166" font-size="11" fill="#888" font-weight="bold">12 的因子对（差距对比）</text>

  <rect x="300" y="176" width="230" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="192" text-anchor="middle" font-size="11" fill="#b85450">(1, 12)  差距 11</text>

  <rect x="300" y="204" width="230" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="220" text-anchor="middle" font-size="11" fill="#d6a040">(2, 6)  差距 4</text>

  <rect x="300" y="232" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(3, 4)  差距 1 ✓ 最优</text>

  <!-- answer for 12 -->
  <rect x="300" y="272" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 [12/3, 3] = [4, 3]</text>
  <text x="415" y="308" text-anchor="middle" font-size="10" fill="#888">3 是 ≤ √12≈3.46 的最大因子</text>

  <!-- bottom note -->
  <rect x="30" y="330" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对照：质数 area 一路减到 1（最坏 O(√area)）；合数 area 通常早早命中</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#888">命中即停 ⇒ 平均循环次数远小于 ⌊√area⌋，常数极小</text>
</svg>
