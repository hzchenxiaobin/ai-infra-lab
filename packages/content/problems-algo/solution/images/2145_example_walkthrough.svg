<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：differences=[3,-4,5,1,-2], lower=-4, upper=5</text>

  <!-- ===== pref array ===== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">前缀和数组 pref（长度 6）：</text>

  <!-- i header row -->
  <rect x="40" y="62" width="36" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
  <rect x="80" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <rect x="148" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <rect x="216" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <rect x="284" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <rect x="352" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="384" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <rect x="420" y="62" width="64" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="80" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>

  <!-- diff row -->
  <rect x="40" y="90" width="36" height="26" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="108" text-anchor="middle" font-size="9.5" fill="#888">d</text>
  <rect x="80" y="90" width="64" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="108" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <rect x="148" y="90" width="64" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <rect x="216" y="90" width="64" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="108" text-anchor="middle" font-size="10.5" fill="#555">-4</text>
  <rect x="284" y="90" width="64" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="108" text-anchor="middle" font-size="10.5" fill="#555">5</text>
  <rect x="352" y="90" width="64" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="384" y="108" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="420" y="90" width="64" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="108" text-anchor="middle" font-size="10.5" fill="#555">-2</text>

  <!-- pref row (highlight min & max) -->
  <rect x="40" y="118" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="58" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">pref</text>
  <!-- pref[0]=0 -->
  <rect x="80" y="118" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- pref[1]=3 -->
  <rect x="148" y="118" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- pref[2]=-1 MIN -->
  <rect x="216" y="118" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">-1</text>
  <text x="248" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">minPref=m</text>
  <!-- pref[3]=4 -->
  <rect x="284" y="118" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <!-- pref[4]=5 MAX -->
  <rect x="352" y="118" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="384" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">maxPref=M</text>
  <!-- pref[5]=3 -->
  <rect x="420" y="118" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="452" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Divider -->
  <path d="M 40 172 L 520 172" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== intersection computation ===== -->
  <text x="280" y="192" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">交集端点</text>

  <rect x="50" y="204" width="220" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="10.5" fill="#888">最右左端点（来自 m）</text>
  <text x="160" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace" font-weight="bold">lo = lower - m</text>
  <text x="160" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="'Comic Sans MS', monospace" font-weight="bold">= -4 - (-1) = -3</text>

  <rect x="290" y="204" width="220" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="224" text-anchor="middle" font-size="10.5" fill="#888">最左右端点（来自 M）</text>
  <text x="400" y="246" text-anchor="middle" font-size="12.5" fill="#d6a040" font-family="'Comic Sans MS', monospace" font-weight="bold">hi = upper - M</text>
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#d6a040" font-family="'Comic Sans MS', monospace" font-weight="bold">= 5 - 5 = 0</text>

  <!-- ===== number line with intersection ===== -->
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">数轴：交集 x ∈ [-3, 0]，共 4 个整数</text>

  <!-- number line -->
  <path d="M 110 322 L 500 322" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- ticks -4 .. 1, mapping v -> x = 200 + v*70 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <path d="M 130 318 L 130 326" stroke="#888" stroke-width="1.2"/><text x="130" y="340">-4</text>
    <path d="M 200 318 L 200 326" stroke="#888" stroke-width="1.2"/><text x="200" y="340">-3</text>
    <path d="M 270 318 L 270 326" stroke="#888" stroke-width="1.2"/><text x="270" y="340">-2</text>
    <path d="M 340 318 L 340 326" stroke="#888" stroke-width="1.2"/><text x="340" y="340">-1</text>
    <path d="M 410 318 L 410 326" stroke="#888" stroke-width="1.2"/><text x="410" y="340">0</text>
    <path d="M 480 318 L 480 326" stroke="#888" stroke-width="1.2"/><text x="480" y="340">1</text>
  </g>

  <!-- intersection bar [-3, 0] -> [200, 410] -->
  <rect x="200" y="306" width="210" height="14" fill="#b85450" opacity="0.85" rx="3" filter="url(#rough2)"/>
  <text x="305" y="316" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">合法首项 x ∈ {-3,-2,-1,0}</text>

  <!-- Divider -->
  <path d="M 40 358 L 520 358" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== 4 valid hidden sequences ===== -->
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">还原 4 个合法 hidden（hidden[i] = x + pref[i]）</text>

  <!-- table header -->
  <rect x="40" y="390" width="480" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="405" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">x</text>
  <text x="280" y="405" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">hidden = [x, x+3, x-1, x+4, x+5, x+3]</text>
  <text x="490" y="405" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">合法</text>

  <!-- rows -->
  <rect x="40" y="414" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="429" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-3</text>
  <text x="280" y="429" text-anchor="middle" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">[-3, 0, -4, 1, 2, 0]</text>
  <text x="490" y="429" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="438" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="453" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-2</text>
  <text x="280" y="453" text-anchor="middle" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">[-2, 1, -3, 2, 3, 1]</text>
  <text x="490" y="453" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="462" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="477" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-1</text>
  <text x="280" y="477" text-anchor="middle" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">[-1, 2, -2, 3, 4, 2]</text>
  <text x="490" y="477" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="486" width="480" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="64" y="501" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="280" y="501" text-anchor="middle" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">[0, 3, -1, 4, 5, 3]</text>
  <text x="490" y="501" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
</svg>
