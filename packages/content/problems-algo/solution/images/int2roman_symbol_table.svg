<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 495" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="495" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">整数转罗马数字：13 个面值-符号对（从大到小）</text>

  <!-- Column headers -->
  <text x="205" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">面值</text>
  <text x="345" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">符号</text>

  <!-- Row 0: 1000 -> M (basic) -->
  <rect x="160" y="64" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="81" text-anchor="middle" font-size="12" fill="#777">1000</text>
  <text x="275" y="81" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="64" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">M</text>

  <!-- Row 1: 900 -> CM (subtractive) -->
  <rect x="160" y="91" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="108" text-anchor="middle" font-size="12" fill="#777">900</text>
  <text x="275" y="108" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="91" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">CM</text>

  <!-- Row 2: 500 -> D (basic) -->
  <rect x="160" y="118" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="135" text-anchor="middle" font-size="12" fill="#777">500</text>
  <text x="275" y="135" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="118" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>

  <!-- Row 3: 400 -> CD (subtractive) -->
  <rect x="160" y="145" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="162" text-anchor="middle" font-size="12" fill="#777">400</text>
  <text x="275" y="162" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="145" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">CD</text>

  <!-- Row 4: 100 -> C (basic) -->
  <rect x="160" y="172" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="189" text-anchor="middle" font-size="12" fill="#777">100</text>
  <text x="275" y="189" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="172" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C</text>

  <!-- Row 5: 90 -> XC (subtractive) -->
  <rect x="160" y="199" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="216" text-anchor="middle" font-size="12" fill="#777">90</text>
  <text x="275" y="216" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="199" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">XC</text>

  <!-- Row 6: 50 -> L (basic) -->
  <rect x="160" y="226" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="243" text-anchor="middle" font-size="12" fill="#777">50</text>
  <text x="275" y="243" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="226" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="243" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>

  <!-- Row 7: 40 -> XL (subtractive) -->
  <rect x="160" y="253" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="270" text-anchor="middle" font-size="12" fill="#777">40</text>
  <text x="275" y="270" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="253" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">XL</text>

  <!-- Row 8: 10 -> X (basic) -->
  <rect x="160" y="280" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="297" text-anchor="middle" font-size="12" fill="#777">10</text>
  <text x="275" y="297" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="280" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="297" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">X</text>

  <!-- Row 9: 9 -> IX (subtractive) -->
  <rect x="160" y="307" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="324" text-anchor="middle" font-size="12" fill="#777">9</text>
  <text x="275" y="324" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="307" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">IX</text>

  <!-- Row 10: 5 -> V (basic) -->
  <rect x="160" y="334" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="351" text-anchor="middle" font-size="12" fill="#777">5</text>
  <text x="275" y="351" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="334" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="351" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">V</text>

  <!-- Row 11: 4 -> IV (subtractive) -->
  <rect x="160" y="361" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="378" text-anchor="middle" font-size="12" fill="#777">4</text>
  <text x="275" y="378" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="361" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="378" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">IV</text>

  <!-- Row 12: 1 -> I (basic) -->
  <rect x="160" y="388" width="90" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="405" text-anchor="middle" font-size="12" fill="#777">1</text>
  <text x="275" y="405" text-anchor="middle" font-size="12" fill="#888">→</text>
  <rect x="300" y="388" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="405" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">I</text>

  <!-- bracket showing 6 subtractive combos on far right -->
  <path d="M 408 91 L 414 91 L 414 378 L 408 378" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="432" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6 个</text>
  <text x="432" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">减法</text>
  <text x="432" y="228" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">组合</text>

  <!-- Greedy analogy note box -->
  <rect x="40" y="424" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="11" fill="#444">核心思路：贪心找零钱 —— 从最大面值起，能减就减，拼对应符号</text>

  <!-- legend at bottom -->
  <rect x="40" y="476" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="56" y="486" font-size="9" fill="#555">基本符号</text>
  <rect x="120" y="476" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="136" y="486" font-size="9" fill="#555">减法组合</text>
</svg>
