<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 演算：s = "aabbc", k = 3</text>

  <!-- String display -->
  <text x="30" y="56" font-size="11" fill="#888">s =</text>
  <rect x="70" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="61" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="110" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="61" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="150" y="42" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="61" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="190" y="42" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="61" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="230" y="42" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="61" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- cost table mini -->
  <text x="30" y="92" font-size="11" fill="#888" font-weight="bold">cost 表（关键值）：</text>
  <text x="30" y="110" font-size="10.5" fill="#555">cost[0][1]=0 (aa)</text>
  <text x="180" y="110" font-size="10.5" fill="#555">cost[2][3]=0 (bb)</text>
  <text x="330" y="110" font-size="10.5" fill="#555">cost[4][4]=0 (c)</text>
  <text x="30" y="126" font-size="10.5" fill="#555">cost[1][2]=1 (ab)</text>
  <text x="180" y="126" font-size="10.5" fill="#555">cost[2][4]=1 (bbc)</text>
  <text x="330" y="126" font-size="10.5" fill="#555">cost[3][4]=1 (bc)</text>

  <!-- Divider -->
  <path d="M 30 140 L 530 140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- DP table -->
  <text x="30" y="162" font-size="11" fill="#888" font-weight="bold">dp[i][j] 表：</text>

  <!-- Column headers -->
  <text x="90" y="162" text-anchor="middle" font-size="10.5" fill="#888">j=0</text>
  <text x="150" y="162" text-anchor="middle" font-size="10.5" fill="#888">j=1</text>
  <text x="210" y="162" text-anchor="middle" font-size="10.5" fill="#888">j=2</text>
  <text x="270" y="162" text-anchor="middle" font-size="10.5" fill="#888">j=3</text>

  <!-- Row i=0 -->
  <text x="45" y="184" text-anchor="middle" font-size="10.5" fill="#888">i=0</text>
  <rect x="68" y="168" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="185" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="168" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="185" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="188" y="168" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="185" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="248" y="168" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="185" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- Row i=1 -->
  <text x="45" y="214" text-anchor="middle" font-size="10.5" fill="#888">i=1</text>
  <rect x="68" y="198" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="215" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="198" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="215" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="188" y="198" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="215" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="248" y="198" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="215" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- Row i=2 -->
  <text x="45" y="244" text-anchor="middle" font-size="10.5" fill="#888">i=2</text>
  <rect x="68" y="228" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="228" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="188" y="228" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="245" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="248" y="228" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- Row i=3 -->
  <text x="45" y="274" text-anchor="middle" font-size="10.5" fill="#888">i=3</text>
  <rect x="68" y="258" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="275" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="258" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="275" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <rect x="188" y="258" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="275" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <rect x="248" y="258" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- Row i=4 -->
  <text x="45" y="304" text-anchor="middle" font-size="10.5" fill="#888">i=4</text>
  <rect x="68" y="288" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="305" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="288" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="305" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <rect x="188" y="288" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="305" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <rect x="248" y="288" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- Row i=5 (answer row) -->
  <text x="45" y="334" text-anchor="middle" font-size="10.5" fill="#888">i=5</text>
  <rect x="68" y="318" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="335" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="128" y="318" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="335" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="188" y="318" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="335" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="248" y="318" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="335" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- Answer annotation -->
  <path d="M 296 330 L 360 330" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="370" y="326" font-size="11" fill="#b85450" font-weight="bold">dp[5][3] = 0</text>
  <text x="370" y="340" font-size="10" fill="#888">"aa"|"bb"|"c" 全回文</text>

  <!-- Key transition annotation -->
  <rect x="320" y="200" width="220" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">关键转移：dp[5][3]</text>
  <text x="330" y="238" font-size="10" fill="#555">m=2: dp[2][2]+cost[2][4]</text>
  <text x="330" y="252" font-size="10" fill="#555">     = 0 + 1 = 1</text>
  <text x="330" y="266" font-size="10" fill="#555">m=4: dp[4][2]+cost[4][4]</text>
  <text x="330" y="275" font-size="10" fill="#b85450" font-weight="bold">     = 0 + 0 = 0 ✓</text>

  <!-- Bottom note -->
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#888">绿色=直接可得  橙色=需枚举 m 取 min  红色=最终答案</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">dp[i][1] = cost[0][i−1]（整段改回文的代价）</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#888">dp[i][j] = min(dp[m][j−1] + cost[m][i−1]), j−1 ≤ m ≤ i−1</text>
</svg>
