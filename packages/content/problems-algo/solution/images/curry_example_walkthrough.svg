<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：csum(1)(2, 3)，两批累积到 3 个参数后触发 sum = 6</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">fn = sum，fn.length = 3 —— 分批粒度不影响正确性，每步复用同一段逻辑</text>

  <!-- Step 1: csum(1) -->
  <rect x="30" y="70" width="560" height="78" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="92" font-size="12" fill="#446688" font-weight="bold">步 1：调用 csum(1)</text>

  <!-- collected bucket after step1 -->
  <text x="48" y="118" font-size="11" fill="#888">collected：</text>
  <rect x="150" y="104" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="178" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="104" width="56" height="36" fill="#fff" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="238" y="127" text-anchor="middle" font-size="12" fill="#bbb">_</text>
  <rect x="270" y="104" width="56" height="36" fill="#fff" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="298" y="127" text-anchor="middle" font-size="12" fill="#bbb">_</text>

  <text x="350" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">length = 1 &lt; 3</text>
  <path d="M 440 122 L 490 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="560" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回函数</text>
  <text x="560" y="134" text-anchor="middle" font-size="11" fill="#888">续接下一批</text>

  <!-- arrow down to step 2 -->
  <path d="M 178 140 L 178 168" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: (2,3) -->
  <rect x="30" y="172" width="560" height="78" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="194" font-size="12" fill="#446688" font-weight="bold">步 2：补充调用 (2, 3) —— curried.apply(this, [1, 2, 3])</text>

  <!-- collected bucket after step2 -->
  <text x="48" y="220" font-size="11" fill="#888">collected：</text>
  <rect x="150" y="206" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="178" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="206" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="238" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="270" y="206" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="298" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="350" y="226" font-size="11" fill="#b85450" font-weight="bold">length = 3 ≥ 3</text>
  <path d="M 440 224 L 490 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="560" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">触发 sum</text>
  <text x="560" y="236" text-anchor="middle" font-size="11" fill="#888">链条终止</text>

  <!-- arrow down to result -->
  <path d="M 298 242 L 298 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="180" y="274" width="260" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="296" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">sum(1, 2, 3) = 6</text>
  <text x="310" y="314" text-anchor="middle" font-size="11" fill="#888">凑够 3 个参数后立即触发原函数</text>

  <!-- contrast note -->
  <rect x="30" y="338" width="560" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#888">对照 csum(1)(2)(3)：每次只传 1 个，要三步累积，链条更长但逻辑完全相同</text>
</svg>
