<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：add 与 getProduct 各 O(1)</text>

  <rect x="40" y="48" width="230" height="380" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">add(num)</text>

  <rect x="70" y="88" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">接收数字 num</text>

  <polygon points="155,138 215,168 155,198 95,168" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num == 0 ?</text>

  <path d="M95,168 L60,168 L60,224" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="62" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M215,168 L250,168 L250,224" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="232" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="30" y="228" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">重置</text>
  <text x="60" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pp=[1]</text>

  <rect x="220" y="228" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">追加</text>
  <text x="250" y="262" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">pp[-1]*num</text>

  <path d="M60,274 L60,300 L155,300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M250,274 L250,300 L155,300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="105" y="310" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">完成，O(1)</text>

  <text x="155" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">零重置：丢弃 0 之前的</text>
  <text x="155" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全部前缀乘积</text>
  <text x="155" y="408" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">因为含 0 区间恒为 0</text>

  <rect x="300" y="48" width="230" height="380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">getProduct(k)</text>

  <rect x="330" y="88" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">查询最后 k 个的乘积</text>

  <polygon points="415,138 475,168 415,198 355,168" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="160" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k ≥ len(pp) ?</text>
  <text x="415" y="176" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（即 k &gt; n）</text>

  <path d="M355,168 L320,168 L320,224" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M475,168 L510,168 L510,224" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="492" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="280" y="228" width="80" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 0</text>
  <text x="320" y="264" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">含 0</text>

  <rect x="470" y="228" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">返回</text>
  <text x="510" y="262" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">pp[-1]//pp[-k-1]</text>

  <path d="M320,274 L320,300 L415,300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M510,274 L510,300 L415,300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="365" y="310" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">完成，O(1)</text>

  <text x="415" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k ≥ len(pp) 等价于</text>
  <text x="415" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最后 k 个里含 0</text>
  <text x="415" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">除法还原区间乘积</text>

</svg>
