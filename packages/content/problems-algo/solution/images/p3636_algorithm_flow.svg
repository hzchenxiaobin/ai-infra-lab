<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：离线莫队 + 频率位图桶</text>

  <!-- Step 1 -->
  <rect x="110" y="40" width="340" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 离线读入所有查询，值离散化</text>
  <text x="280" y="76" text-anchor="middle" font-size="10.5" fill="#555">按值排序编号 ⇒ 最小 id = 最小值（并列取最小）</text>

  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="110" y="104" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 查询按 (l / B, r) 排序，B ≈ n / √q</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#555">同块内 r 递增 ⇒ L、R 指针总移动量 O(n√q)</text>

  <path d="M 280 150 L 280 164" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="110" y="168" width="340" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ 窗口 [L, R] 增量挪到 [l, r]（先扩后缩）</text>
  <text x="280" y="204" text-anchor="middle" font-size="10.5" fill="#555">加入 x：cnt[x] 从 f → f+1，x 迁入 bucket[f+1]</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#555">移出 x：对称下移；maxfreq 层被清空 ⇒ maxfreq − 1</text>

  <path d="M 280 232 L 280 248" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,252 400,296 280,340 160,296" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">maxfreq ≥</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">threshold ?</text>

  <!-- Yes branch -->
  <path d="M 400 296 L 418 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="409" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="422" y="272" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="487" y="291" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">ans = bucket[maxfreq]</text>
  <text x="487" y="308" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">最小 id 对应的值</text>

  <!-- No branch -->
  <path d="M 160 296 L 142 296" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="151" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="8" y="272" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="73" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = −1</text>
  <text x="73" y="308" text-anchor="middle" font-size="10.5" fill="#555">（没有任何元素达标）</text>

  <!-- loop back arrows -->
  <path d="M 487 272 L 487 206 L 456 206" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="500" y="246" text-anchor="middle" font-size="9" fill="#999">下一条</text>
  <text x="500" y="258" text-anchor="middle" font-size="9" fill="#999">查询</text>
  <path d="M 73 272 L 73 206 L 104 206" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="9" fill="#999">下一条</text>
  <text x="60" y="258" text-anchor="middle" font-size="9" fill="#999">查询</text>

  <!-- arrow down to step 4 -->
  <path d="M 280 340 L 280 376" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="302" y="362" font-size="10" fill="#aaa">查询处理完毕</text>

  <!-- Step 4 -->
  <rect x="110" y="380" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">④ 按查询原始下标输出 ans</text>

  <!-- footer note -->
  <rect x="60" y="440" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="457" text-anchor="middle" font-size="10.5" fill="#666">指针移动 O(qB + n²/B)，取 B = n/√q ⇒ O(n√q)</text>
  <text x="280" y="474" text-anchor="middle" font-size="10.5" fill="#666">每次移动的桶维护 O(1)：位图 set / reset，无查找开销</text>
</svg>
