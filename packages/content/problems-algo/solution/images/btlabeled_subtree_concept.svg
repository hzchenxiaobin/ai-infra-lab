<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：后序 DFS + 子树频率合并</text>

  <!-- Subtree boundary (dashed) around entire tree rooted at 0 -->
  <path d="M 70 56 Q 60 50 65 44 L 90 42 Q 120 38 150 42 L 210 44 Q 260 40 290 44 L 360 42 Q 400 38 440 42 L 470 44 Q 490 48 480 56 L 482 300 Q 480 320 460 322 L 90 322 Q 68 320 68 300 Z"
        fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="250" y="40" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">节点 0 的子树（全部 7 个节点）</text>

  <!-- Tree edges -->
  <path d="M 280 82 L 170 140" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 280 82 L 390 140" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 170 L 110 230" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 170 L 230 230" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 170 L 330 230" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 390 170 L 450 230" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- Node 0 (label a) - highlighted, root -->
  <circle cx="280" cy="70" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>

  <!-- Node 1 (label b) -->
  <circle cx="170" cy="155" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="170" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>

  <!-- Node 2 (label e) -->
  <circle cx="390" cy="155" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="152" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="390" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">e</text>

  <!-- Node 4 (label a) - highlighted same label as root -->
  <circle cx="110" cy="248" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="110" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>

  <!-- Node 5 (label d) -->
  <circle cx="230" cy="248" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="230" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">d</text>

  <!-- Node 3 (label c) -->
  <circle cx="330" cy="248" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="330" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c</text>

  <!-- Node 6 (label d) -->
  <circle cx="450" cy="248" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="450" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">d</text>

  <!-- Arrow from highlighted nodes to explanation -->
  <path d="M 110 270 L 110 290" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 280 96 L 280 290" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Explanation box -->
  <rect x="40" y="296" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">节点 0 标签为 'a'，其子树中 'a' 出现在节点 0 和节点 4</text>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#555">freq['a'] = 2 → ans[0] = 2；频率由子节点向上合并得到</text>

  <!-- Key insight box -->
  <rect x="40" y="362" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">后序 DFS：先递归子节点拿到 freq，再合并 + 自身，最后 ans[i]=freq[label[i]]</text>
  <text x="280" y="397" text-anchor="middle" font-size="10.5" fill="#555">每条边贡献 O(26) 合并，总计 O(26n)</text>
</svg>
