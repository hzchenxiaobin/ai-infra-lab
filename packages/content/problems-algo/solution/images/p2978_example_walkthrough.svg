<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：编号后三组镜像配对 → x ≤ y 过滤 → 去重排序输出</text>

  <!-- 左侧：编号后的输入表 -->
  <rect x="36" y="44" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="54" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">id</text>
  <text x="100" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="147" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>

  <rect x="36" y="72" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="72" y="72" width="57" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="129" y="72" width="57" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <rect x="36" y="98" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="72" y="98" width="57" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="129" y="98" width="57" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <rect x="36" y="124" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="72" y="124" width="57" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="129" y="124" width="57" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">21</text>

  <rect x="36" y="150" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="72" y="150" width="57" height="26" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">23</text>
  <rect x="129" y="150" width="57" height="26" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>

  <rect x="36" y="176" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="72" y="176" width="57" height="26" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>
  <rect x="129" y="176" width="57" height="26" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">23</text>

  <rect x="36" y="202" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="72" y="202" width="57" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">21</text>
  <rect x="129" y="202" width="57" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <text x="111" y="248" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">（ROW_NUMBER 编号：值可重复，id 唯一）</text>

  <!-- 配对弧线：1↔2 -->
  <path d="M 186 85 C 210 85, 210 111, 186 111" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 配对弧线：3↔6 -->
  <path d="M 186 137 C 226 137, 226 217, 186 217" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 配对弧线：4↔5 -->
  <path d="M 186 163 C 208 163, 208 189, 186 189" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="222" y="104" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">id≠id ✓</text>
  <text x="232" y="180" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">交换相等</text>

  <!-- 中部箭头指向右侧配对结果 -->
  <path d="M 258 137 L 300 137" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 111 L 300 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 189 L 300 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：三组配对判定 -->
  <rect x="306" y="54" width="182" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="74" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">id 1 ↔ id 2：(20,20)&amp;(20,20)</text>
  <text x="397" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">id 不同 ⇒ 可配对，20 ≤ 20 ✓</text>
  <text x="397" y="108" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">留 (20,20)（DISTINCT 合并两条）</text>

  <rect x="306" y="130" width="182" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">id 3 ↔ id 6：(20,21)&amp;(21,20)</text>
  <text x="397" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">20 ≤ 21 ✓；另一侧 21 &gt; 20 ✗</text>
  <text x="397" y="184" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">留 (20,21)，删 (21,20)</text>

  <rect x="306" y="206" width="182" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="226" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">id 5 ↔ id 4：(22,23)&amp;(23,22)</text>
  <text x="397" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">22 ≤ 23 ✓；另一侧 23 &gt; 22 ✗</text>
  <text x="397" y="260" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">留 (22,23)，删 (23,22)</text>

  <!-- 底部：最终输出 -->
  <path d="M 397 268 L 397 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="36" y="292" width="452" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="312" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">最终输出（DISTINCT 去重 ＋ ORDER BY x, y 升序）：</text>
  <text x="262" y="332" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">(20, 20)　(20, 21)　(22, 23)　✓ 与预期一致</text>
</svg>
