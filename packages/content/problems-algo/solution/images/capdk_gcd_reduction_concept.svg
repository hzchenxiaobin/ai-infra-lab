<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：gcd(x,k) 吸收 x 与 k 的全部公共素因子</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">k | x·y  ⟺  k | gcd(x,k)·gcd(y,k)</text>

  <!-- Top row: original nums with k=6 -->
  <text x="28" y="74" font-size="10.5" fill="#666">原始值</text>
  <rect x="68" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="78" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="124" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="78" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="180" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="13" fill="#333">15</text>

  <text x="252" y="78" font-size="11" fill="#888">k = 6 = 2 × 3</text>

  <!-- Arrows down -->
  <path d="M 93 92 L 93 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 149 92 L 149 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 205 92 L 205 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="310" y="104" font-size="10" fill="#4a7a3a">gcd(x, 6)</text>

  <!-- Middle row: gcd values -->
  <text x="28" y="130" font-size="10.5" fill="#666">GCD 值</text>
  <rect x="68" y="112" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="112" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="112" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Pair check boxes -->
  <!-- Pair (4,9): gcd 2*3=6 % 6 == 0 ✓ -->
  <rect x="50" y="166" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="184" text-anchor="middle" font-size="11" fill="#333">gcd(4,6)·gcd(9,6) = 2·3</text>
  <text x="125" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 6, 6%6=0 ✓  (4·9=36 也 ✓)</text>

  <!-- Pair (4,15): gcd 2*3=6 % 6 == 0 ✓ -->
  <rect x="210" y="166" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="184" text-anchor="middle" font-size="11" fill="#333">gcd(4,6)·gcd(15,6) = 2·3</text>
  <text x="285" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 6, 6%6=0 ✓  (4·15=60 也 ✓)</text>

  <!-- Pair (9,15): gcd 3*3=9 % 6 != 0 ✗ -->
  <rect x="370" y="166" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="184" text-anchor="middle" font-size="11" fill="#333">gcd(9,6)·gcd(15,6) = 3·3</text>
  <text x="445" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 9, 9%6≠0 ✗  (9·15=135 也 ✗)</text>

  <!-- Connecting arrows from gcd row to pair boxes -->
  <path d="M 93 148 L 125 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 149 148 L 125 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 93 148 L 285 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 205 148 L 285 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 149 148 L 445 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 205 148 L 445 164" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Bottom explanation box -->
  <rect x="40" y="228" width="460" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么等价？逐素因子比较</text>
  <text x="270" y="266" text-anchor="middle" font-size="10.5" fill="#555">k=6=2¹·3¹。v₂(4)=2 → min(2,1)=1=v₂(gcd(4,6))；v₃(9)=2 → min(2,1)=1</text>
  <text x="270" y="280" text-anchor="middle" font-size="10.5" fill="#555">gcd 吸收的幂次 = min(原幂次, k 中幂次)，超出部分对整除性无影响</text>
  <text x="270" y="296" text-anchor="middle" font-size="10.5" fill="#555">→ 乘积只需在每维凑够 k 的幂次即可，gcd 乘积恰好等价判定</text>

  <!-- Footer -->
  <text x="270" y="330" text-anchor="middle" font-size="10.5" fill="#888">所有 gcd 值都是 k 的因子 → 因子个数 d(k) ≤ 128 → 降维为因子配对</text>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#aaa">n=10⁵ 两两配对 10¹⁰ → d(k)≤128 因子配对 ≤ 128²≈1.6×10⁴</text>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#aaa">对比 974（和整除）用同余定理，本题（积整除）用 GCD 因子配对</text>
</svg>
