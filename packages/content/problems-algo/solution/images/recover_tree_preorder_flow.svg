<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈方法算法流程：维护根到当前节点的路径</text>

  <!-- 步骤 1: 解析 -->
  <rect x="40" y="46" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 解析字符串</text>
  <text x="130" y="86" text-anchor="middle" font-size="10" fill="#555">拆成 (depth, val) token</text>
  <text x="130" y="98" text-anchor="middle" font-size="9" fill="#888">数连续「-」+ 读数字</text>

  <!-- 箭头 -->
  <line x1="220" y1="74" x2="250" y2="74" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2: 取 token -->
  <rect x="252" y="46" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 取下一个 token</text>
  <text x="332" y="86" text-anchor="middle" font-size="10" fill="#555">(depth, val)</text>
  <text x="332" y="98" text-anchor="middle" font-size="9" fill="#888">无 token ⇒ 结束</text>

  <!-- 箭头向下 -->
  <line x1="332" y1="102" x2="332" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3: 弹栈到 depth -->
  <rect x="252" y="132" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 弹栈至 size=depth</text>
  <text x="332" y="172" text-anchor="middle" font-size="10" fill="#555">while stack.size &gt; depth</text>
  <text x="332" y="184" text-anchor="middle" font-size="9" fill="#888">栈顶即父节点(depth-1)</text>

  <!-- 箭头向下 -->
  <line x1="332" y1="188" x2="332" y2="216" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4: 判断左右 -->
  <polygon points="332,218 420,258 332,298 244,258" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">父节点有</text>
  <text x="332" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">左孩子?</text>

  <!-- 左分支: 无左孩子 -->
  <line x1="244" y1="258" x2="170" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="207" y="250" text-anchor="middle" font-size="9" fill="#888">否</text>
  <rect x="50" y="240" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="110" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">挂为左孩子</text>
  <text x="110" y="272" text-anchor="middle" font-size="9" fill="#888">parent.left = node</text>

  <!-- 右分支: 有左孩子 -->
  <line x1="420" y1="258" x2="470" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="250" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="472" y="240" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="522" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">挂为右孩子</text>
  <text x="522" y="272" text-anchor="middle" font-size="9" fill="#888">parent.right</text>

  <!-- 汇合箭头 -->
  <line x1="110" y1="280" x2="110" y2="310" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="522" y1="280" x2="522" y2="310" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="110" y1="310" x2="522" y2="310" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 步骤 5: 压栈 -->
  <line x1="332" y1="310" x2="332" y2="328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="330" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ node 压入栈</text>
  <text x="332" y="366" text-anchor="middle" font-size="9" fill="#888">stack.push(node)</text>

  <!-- 回到步骤2的循环箭头 -->
  <path d="M 412 352 Q 460 352 460 200 Q 460 74 412 74" fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="476" y="214" font-size="9" fill="#888">循环</text>

  <!-- 栈示意 -->
  <rect x="40" y="330" width="170" height="76" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="350" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">栈 = 根→当前节点路径</text>
  <rect x="56" y="358" width="138" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="125" y="370" text-anchor="middle" font-size="9" fill="#333">depth=0  根</text>
  <rect x="56" y="376" width="138" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="125" y="388" text-anchor="middle" font-size="9" fill="#333">depth=1  子</text>
  <text x="125" y="402" text-anchor="middle" font-size="8" fill="#888">size = 当前深度</text>
</svg>
