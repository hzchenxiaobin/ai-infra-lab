<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：拆位 LSB 优先收集、逆序拼回 answer</text>

  <!-- ====== Example 1 header ====== -->
  <text x="30" y="50" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：nums = [13, 25, 83, 77]</text>

  <!-- column headers -->
  <text x="60" y="74" text-anchor="middle" font-size="10" fill="#888">x</text>
  <text x="160" y="74" text-anchor="middle" font-size="10" fill="#888">buf（LSB）</text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#888">逆序 → 原序</text>
  <text x="430" y="74" text-anchor="middle" font-size="10" fill="#888">ans 累积</text>

  <!-- Row 1: 13 -->
  <rect x="20" y="80" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13</text>
  <rect x="110" y="80" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[3, 1]</text>
  <path d="M 215 93 L 230 93" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="80" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[1, 3]</text>
  <path d="M 335 93 L 350 93" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="80" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[1, 3]</text>

  <!-- Row 2: 25 -->
  <rect x="20" y="112" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">25</text>
  <rect x="110" y="112" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[5, 2]</text>
  <path d="M 215 125 L 230 125" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="112" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[2, 5]</text>
  <path d="M 335 125 L 350 125" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="112" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">[1, 3, 2, 5]</text>

  <!-- Row 3: 83 -->
  <rect x="20" y="144" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">83</text>
  <rect x="110" y="144" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[3, 8]</text>
  <path d="M 215 157 L 230 157" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="144" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[8, 3]</text>
  <path d="M 335 157 L 350 157" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="144" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1,3,2,5,8,3]</text>

  <!-- Row 4: 77 -->
  <rect x="20" y="176" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">77</text>
  <rect x="110" y="176" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[7, 7]</text>
  <path d="M 215 189 L 230 189" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="176" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[7, 7]</text>
  <path d="M 335 189 L 350 189" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="176" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1,3,2,5,8,3,7,7]</text>

  <!-- divider -->
  <path d="M 30 216 L 510 216" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== Example 2 ====== -->
  <text x="30" y="242" font-size="13" fill="#d6a040" font-weight="bold">示例 2：nums = [7, 1, 3, 9]</text>
  <text x="30" y="264" font-size="11" fill="#888">每个元素为单位数：</text>

  <rect x="180" y="250" width="320" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">buf 仅 1 位 → 逆序即自身 → ans = [7, 1, 3, 9]</text>

  <!-- divider -->
  <path d="M 30 294 L 510 294" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== 0 数位 case ====== -->
  <text x="30" y="320" font-size="12.5" fill="#446688" font-weight="bold">含 0 数位的例子：x = 10921</text>

  <rect x="30" y="330" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10921</text>
  <path d="M 155 346 L 175 346" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="330" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">buf = [1,2,9,0,1]</text>
  <path d="M 335 346 L 355 346" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="360" y="330" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 0, 9, 2, 1] ✓</text>
</svg>
