<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：gid = seat_id − ROW_NUMBER()，同段不变、断档跳变</text>

  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">示例：座位 1 空、2 占、3/4/5 空 —— 筛掉被占座位后，看编号差</text>

  <!-- Row A: 全表座位 -->
  <rect x="90" y="56" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="77" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="156" y="56" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="77" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="222" y="56" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="77" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="288" y="56" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="77" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="354" y="56" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="77" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="118" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">空</text>
  <text x="184" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">占</text>
  <text x="250" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">空</text>
  <text x="316" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">空</text>
  <text x="382" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">空</text>

  <text x="428" y="76" font-size="10" fill="#888" filter="url(#rough2)">Cinema 全表</text>

  <!-- 筛选箭头 -->
  <path d="M 250 106 L 250 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="118" font-size="10" fill="#446688" filter="url(#rough2)">筛 free = 1（被占的丢掉）</text>

  <!-- Row B: 空余座位 + rn -->
  <rect x="140" y="128" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="149" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="215" y="128" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="243" y="149" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="290" y="128" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="149" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="365" y="128" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="393" y="149" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="168" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn=1</text>
  <text x="243" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn=2</text>
  <text x="318" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn=3</text>
  <text x="393" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn=4</text>

  <!-- 差分箭头 -->
  <path d="M 250 176 L 250 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="188" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">gid = seat_id − rn</text>

  <!-- Row C: gid -->
  <rect x="140" y="198" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="217" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="215" y="198" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="243" y="217" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="290" y="198" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="217" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="365" y="198" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="217" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 岛括号 -->
  <rect x="134" y="230" width="68" height="42" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="168" y="256" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">岛 A（长 1）</text>

  <rect x="209" y="230" width="218" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="318" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛 B：{3,4,5}（长 3 → 最长段）</text>

  <!-- 观察一 -->
  <rect x="30" y="286" width="222" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="141" y="306" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">段内：seat_id 与 rn 同步 +1</text>
  <text x="141" y="324" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">差值不变 → 同段同 gid</text>
  <text x="141" y="340" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">例：3−2 = 4−3 = 5−4 = 1</text>

  <!-- 观察二 -->
  <rect x="272" y="286" width="222" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="383" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">断档：seat_id 跳 ≥2，rn 只 +1</text>
  <text x="383" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">gid 必然变大 → 新岛开始</text>
  <text x="383" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">例：1−1=0 → 3−2=1 跳变</text>
</svg>
