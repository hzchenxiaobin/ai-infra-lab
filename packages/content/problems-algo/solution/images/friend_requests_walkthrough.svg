<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="600" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两表 DISTINCT 去重 → 计数 → 4 / 5 = 0.80</text>

  <!-- Step 1: FriendRequest raw -->
  <text x="160" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤① FriendRequest 原始行（5 行）</text>
  <rect x="50" y="62" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="77" font-size="9" fill="#333">sender</text>
  <text x="135" y="77" font-size="9" fill="#333">send_to</text>
  <text x="195" y="77" font-size="9" fill="#333">date</text>
  <line x1="100" y1="62" x2="100" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="62" x2="170" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="84" width="220" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="97" font-size="9" fill="#333">1</text><text x="135" y="97" font-size="9" fill="#333">2</text><text x="195" y="97" font-size="9" fill="#333">06-01</text>
  <line x1="100" y1="84" x2="100" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="84" x2="170" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="102" width="220" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="115" font-size="9" fill="#333">1</text><text x="135" y="115" font-size="9" fill="#333">3</text><text x="195" y="115" font-size="9" fill="#333">06-01</text>
  <line x1="100" y1="102" x2="100" y2="120" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="102" x2="170" y2="120" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="120" width="220" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="133" font-size="9" fill="#333">1</text><text x="135" y="133" font-size="9" fill="#333">4</text><text x="195" y="133" font-size="9" fill="#333">06-01</text>
  <line x1="100" y1="120" x2="100" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="120" x2="170" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="138" width="220" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="151" font-size="9" fill="#333">2</text><text x="135" y="151" font-size="9" fill="#333">3</text><text x="195" y="151" font-size="9" fill="#333">06-02</text>
  <line x1="100" y1="138" x2="100" y2="156" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="138" x2="170" y2="156" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="156" width="220" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="169" font-size="9" fill="#333">3</text><text x="135" y="169" font-size="9" fill="#333">4</text><text x="195" y="169" font-size="9" fill="#333">06-09</text>
  <line x1="100" y1="156" x2="100" y2="174" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="156" x2="170" y2="174" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- RequestAccepted raw (right) -->
  <text x="475" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步骤① RequestAccepted 原始行（5 行）</text>
  <rect x="365" y="62" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="77" font-size="9" fill="#333">requester</text>
  <text x="470" y="77" font-size="9" fill="#333">accepter</text>
  <text x="545" y="77" font-size="9" fill="#333">date</text>
  <line x1="430" y1="62" x2="430" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="62" x2="515" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="365" y="84" width="230" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="97" font-size="9" fill="#333">1</text><text x="470" y="97" font-size="9" fill="#333">2</text><text x="545" y="97" font-size="9" fill="#333">06-03</text>
  <line x1="430" y1="84" x2="430" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="84" x2="515" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="365" y="102" width="230" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="115" font-size="9" fill="#333">1</text><text x="470" y="115" font-size="9" fill="#333">3</text><text x="545" y="115" font-size="9" fill="#333">06-08</text>
  <line x1="430" y1="102" x2="430" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="102" x2="515" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="365" y="120" width="230" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="133" font-size="9" fill="#333">2</text><text x="470" y="133" font-size="9" fill="#333">3</text><text x="545" y="133" font-size="9" fill="#333">06-08</text>
  <line x1="430" y1="120" x2="430" y2="138" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="120" x2="515" y2="138" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="365" y="138" width="230" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="395" y="151" font-size="9" fill="#333">3</text><text x="470" y="151" font-size="9" fill="#333">4</text><text x="545" y="151" font-size="9" fill="#333">06-09</text>
  <line x1="430" y1="138" x2="430" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="138" x2="515" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="365" y="156" width="230" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="169" font-size="9" fill="#b85450" font-weight="bold">3</text><text x="470" y="169" font-size="9" fill="#b85450" font-weight="bold">4</text><text x="545" y="169" font-size="9" fill="#333">06-10</text>
  <line x1="430" y1="156" x2="430" y2="174" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="156" x2="515" y2="174" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrows down -->
  <path d="M160 178 L160 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="196" font-size="9" fill="#446688" font-weight="bold">DISTINCT 对</text>
  <path d="M475 178 L475 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="493" y="196" font-size="9" fill="#4a7a3a" font-weight="bold">DISTINCT 对</text>

  <!-- Step 2: distinct pairs -->
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤② 去重后申请对（5 个，无重复）</text>
  <rect x="60" y="228" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="242" font-size="9" fill="#333">sender</text>
  <text x="170" y="242" font-size="9" fill="#333">send_to</text>
  <line x1="140" y1="228" x2="140" y2="248" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="248" width="200" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="260" font-size="9" fill="#333">1</text><text x="170" y="260" font-size="9" fill="#333">2</text>
  <line x1="140" y1="248" x2="140" y2="264" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="60" y="264" width="200" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="276" font-size="9" fill="#333">1</text><text x="170" y="276" font-size="9" fill="#333">3</text>
  <line x1="140" y1="264" x2="140" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="60" y="280" width="200" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="292" font-size="9" fill="#333">1</text><text x="170" y="292" font-size="9" fill="#333">4</text>
  <line x1="140" y1="280" x2="140" y2="296" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="60" y="296" width="200" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="308" font-size="9" fill="#333">2</text><text x="170" y="308" font-size="9" fill="#333">3</text>
  <line x1="140" y1="296" x2="140" y2="312" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="60" y="312" width="200" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="324" font-size="9" fill="#333">3</text><text x="170" y="324" font-size="9" fill="#333">4</text>
  <line x1="140" y1="312" x2="140" y2="328" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="475" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步骤② 去重后申请对（4 个，(3,4) 合并）</text>
  <rect x="375" y="228" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="242" font-size="9" fill="#333">requester</text>
  <text x="490" y="242" font-size="9" fill="#333">accepter</text>
  <line x1="455" y1="228" x2="455" y2="248" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="375" y="248" width="200" height="16" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="260" font-size="9" fill="#333">1</text><text x="490" y="260" font-size="9" fill="#333">2</text>
  <line x1="455" y1="248" x2="455" y2="264" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="375" y="264" width="200" height="16" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="276" font-size="9" fill="#333">1</text><text x="490" y="276" font-size="9" fill="#333">3</text>
  <line x1="455" y1="264" x2="455" y2="280" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="375" y="280" width="200" height="16" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="292" font-size="9" fill="#333">2</text><text x="490" y="292" font-size="9" fill="#333">3</text>
  <line x1="455" y1="280" x2="455" y2="296" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="375" y="296" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="415" y="308" font-size="9" fill="#d6a040" font-weight="bold">3</text><text x="490" y="308" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <line x1="455" y1="296" x2="455" y2="312" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="475" y="328" text-anchor="middle" font-size="9" fill="#b85450">↑ 原 5 行中两行 (3,4) 合并为 1 个</text>

  <!-- Arrows: COUNT -->
  <path d="M160 332 L220 362" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M475 332 L420 362" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: counts + ratio -->
  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步骤③ 各自 COUNT(*) 取比</text>
  <rect x="120" y="384" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="400" text-anchor="middle" font-size="9" fill="#333">已通过 COUNT</text>
  <text x="200" y="416" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="360" y="384" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="400" text-anchor="middle" font-size="9" fill="#333">已发送 COUNT</text>
  <text x="440" y="416" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <path d="M200 426 L300 456" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M440 426 L340 456" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 4: ratio -->
  <rect x="240" y="460" width="160" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="478" text-anchor="middle" font-size="9.5" fill="#333">4 / 5 = 0.8</text>
  <text x="320" y="496" text-anchor="middle" font-size="10" fill="#d6a040">IFNULL(...,0) 兜底</text>

  <path d="M320 508 L320 532" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final output -->
  <text x="320" y="548" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步骤④ ROUND(0.8, 2) = 0.80</text>
  <rect x="250" y="556" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="575" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">accept_rate = 0.80</text>
</svg>
