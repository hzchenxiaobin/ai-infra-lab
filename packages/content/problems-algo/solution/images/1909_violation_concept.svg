<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">首个违例点：必删 i 或 i−1 之一</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">nums[i] ≤ nums[i−1] 时，只有删 i 或 i−1 能修复此违例</text>

  <!-- ===== Original array: 1, 2, 10, 5, 7 ===== -->
  <text x="40" y="80" font-size="12" fill="#446688" font-weight="bold">原数组 nums = [1, 2, 10, 5, 7]</text>

  <g font-size="14">
    <g font-size="9" fill="#888">
      <text x="84" y="100" text-anchor="middle">i−2</text>
      <text x="116" y="100" text-anchor="middle">i−1</text>
      <text x="148" y="100" text-anchor="middle">i</text>
      <text x="180" y="100" text-anchor="middle">i+1</text>
      <text x="212" y="100" text-anchor="middle">i+2</text>
    </g>
    <!-- cells -->
    <rect x="68" y="106" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="127" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="106" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="116" y="127" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="132" y="106" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="148" y="127" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <rect x="164" y="106" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="127" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="196" y="106" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="127" text-anchor="middle" fill="#333">7</text>
  </g>

  <!-- violation arrow between i-1 and i -->
  <path d="M 116 150 L 116 158 L 148 158 L 148 150" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="132" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">违例：10 ≥ 5 ✗</text>

  <text x="132" y="190" text-anchor="middle" font-size="10" fill="#888">(nums[i] ≤ nums[i−1])</text>

  <!-- divider -->
  <path d="M 30 208 L 510 208" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Branch A: remove i ===== -->
  <text x="40" y="232" font-size="12" fill="#b85450" font-weight="bold">分支 A：删 nums[i] = 10</text>

  <g font-size="13">
    <rect x="68" y="250" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="270" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="250" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="270" text-anchor="middle" fill="#333">2</text>
    <rect x="132" y="250" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="270" text-anchor="middle" fill="#b85450" font-size="10">✗删</text>
    <rect x="164" y="250" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="196" y="250" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="270" text-anchor="middle" fill="#333">7</text>
  </g>

  <!-- check: nums[i-1] < nums[i+1]? 2 < 5 ✓ -->
  <path d="M 116 286 L 116 292 L 180 292 L 180 286" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="148" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">需 nums[i−1]=2 &lt; nums[i+1]=5 ✓</text>

  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a">→ [1, 2, 5, 7] 严格递增 ✓</text>

  <!-- divider -->
  <path d="M 30 340 L 510 340" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Branch B: remove i-1 ===== -->
  <text x="40" y="362" font-size="12" fill="#d6a040" font-weight="bold">分支 B：删 nums[i−1] = 2</text>

  <g font-size="13">
    <rect x="68" y="378" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="398" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="378" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
    <text x="116" y="398" text-anchor="middle" fill="#d6a040" font-size="10">✗删</text>
  </g>

  <text x="160" y="398" font-size="11" fill="#d6a040">需 nums[i−2]=1 &lt; nums[i]=10 ✓</text>

  <!-- bottom summary -->
  <rect x="340" y="232" width="180" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="254" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键观察</text>
  <text x="350" y="274" font-size="10" fill="#333">① 扫描找首个违例 i</text>
  <text x="350" y="292" font-size="10" fill="#333">② 只需试删 i 或 i−1</text>
  <text x="350" y="310" font-size="10" fill="#333">③ 检查删除后整体递增</text>
  <text x="350" y="326" font-size="9" fill="#888">至多两次 O(n) 校验</text>
</svg>
