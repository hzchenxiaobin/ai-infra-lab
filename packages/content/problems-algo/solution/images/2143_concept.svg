<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心观察：选 nums1 贡献 +a，选 nums2 贡献 −b，区间差值为 0 即平衡</text>

  <!-- ===== Section 1: per-position choices ===== -->
  <text x="40" y="54" font-size="11.5" fill="#555" font-weight="bold">示例 1：nums1 = [1, 2, 5]，nums2 = [2, 6, 3]</text>

  <!-- i=0 -->
  <rect x="95" y="66" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums1[0]=1</text>
  <rect x="95" y="104" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums2[0]=2</text>
  <text x="130" y="152" text-anchor="middle" font-size="10.5" fill="#888">i = 0</text>

  <!-- i=1 -->
  <rect x="245" y="66" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums1[1]=2</text>
  <rect x="245" y="104" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums2[1]=6</text>
  <text x="280" y="152" text-anchor="middle" font-size="10.5" fill="#888">i = 1</text>

  <!-- i=2 -->
  <rect x="395" y="66" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums1[2]=5</text>
  <rect x="395" y="104" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums2[2]=3</text>
  <text x="430" y="152" text-anchor="middle" font-size="10.5" fill="#888">i = 2</text>

  <!-- choice hints -->
  <text x="180" y="86" font-size="9.5" fill="#446688">选 → +a</text>
  <text x="180" y="124" font-size="9.5" fill="#b85450">选 → −b</text>

  <!-- Divider -->
  <path d="M 40 166 L 520 166" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: highlighted balanced selection ===== -->
  <text x="40" y="184" font-size="11.5" fill="#555" font-weight="bold">平衡区间 [0,2] 的一种选法：选 nums1[0]、nums2[1]、nums1[2]</text>

  <!-- highlight selected boxes with thicker green border -->
  <rect x="93" y="64" width="74" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="7" filter="url(#rough2)"/>
  <rect x="243" y="102" width="74" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="7" filter="url(#rough2)"/>
  <rect x="393" y="64" width="74" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="7" filter="url(#rough2)"/>

  <!-- contribution labels -->
  <rect x="100" y="206" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="130" y="223" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="250" y="206" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">−6</text>
  <rect x="400" y="206" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="430" y="223" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+5</text>

  <!-- arrows from selected boxes to contributions -->
  <path d="M 130 100 L 130 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 138 L 280 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 430 100 L 430 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 40 246 L 520 246" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 3: running difference ===== -->
  <text x="40" y="264" font-size="11.5" fill="#555" font-weight="bold">累计差值 d = Σ(nums1 选取) − Σ(nums2 选取)：从 0 出发，走完归 0 即平衡</text>

  <!-- diff boxes: 0 -> 1 -> -5 -> 0 -->
  <rect x="60" y="282" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="88" y="302" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">0</text>

  <path d="M 118 297 L 168 297" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="143" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a">+1</text>

  <rect x="172" y="282" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="200" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <path d="M 230 297 L 280 297" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="255" y="290" text-anchor="middle" font-size="9.5" fill="#b85450">−6</text>

  <rect x="284" y="282" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="312" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−5</text>

  <path d="M 342 297 L 392 297" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="367" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a">+5</text>

  <rect x="396" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="424" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0 ✓</text>

  <text x="470" y="300" font-size="10" fill="#4a7a3a" font-weight="bold">平衡！</text>

  <!-- Divider -->
  <path d="M 40 326 L 520 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 4: offset trick ===== -->
  <rect x="40" y="338" width="480" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="11.5" fill="#333" font-weight="bold">差值 d 范围 [−s₂, +s₁]，可能为负 → 加偏移 s₂ 映射到非负下标 j：</text>
  <text x="56" y="382" font-size="12.5" fill="#d6a040" font-family="'Comic Sans MS', monospace" font-weight="bold">j = d + s₂ ，范围 [0, s₁ + s₂] ，平衡 ⟺ d = 0 ⟺ j = s₂</text>
  <text x="56" y="402" font-size="10.5" fill="#888">f[i][j] = 以 i 结尾、差值 d = j − s₂ 的（区间 + 选法）数目；答案 = Σ f[i][s₂]</text>
</svg>
