<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：递归展开子任务对 + 反连接取未执行</text>

  <!-- Step 1 -->
  <rect x="50" y="44" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="78" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="76" y="82" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="68" font-size="12" fill="#446688" font-weight="bold">递归 CTE 展开全部子任务对</text>
  <text x="100" y="86" font-size="10" fill="#444">WITH RECURSIVE T: 锚点取 subtasks_count，每轮 −1 直到 1</text>
  <text x="100" y="100" font-size="10" fill="#666">→ 每个 task_id 生成 1…n 共 n 行，合计 9 行</text>

  <!-- arrow 1->2 -->
  <path d="M 280 114 L 280 136" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="50" y="140" width="460" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="174" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="76" y="178" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="164" font-size="12" fill="#4a7a3a" font-weight="bold">LEFT JOIN Executed</text>
  <text x="100" y="182" font-size="10" fill="#444">LEFT JOIN Executed USING (task_id, subtask_id)</text>
  <text x="100" y="196" font-size="10" fill="#666">保留全部子任务对；已执行的行匹配上，未执行的右表列填 NULL</text>

  <!-- arrow 2->3 -->
  <path d="M 280 210 L 280 232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="50" y="236" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="270" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="76" y="274" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="260" font-size="12" fill="#d6a040" font-weight="bold">反连接：筛出未执行</text>
  <text x="100" y="278" font-size="10" fill="#444">WHERE Executed.subtask_id IS NULL</text>
  <text x="100" y="292" font-size="10" fill="#666">右表主键为 NULL ⇔ 该子任务对未在 Executed 出现</text>

  <!-- arrow 3->4 -->
  <path d="M 280 306 L 280 328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="50" y="332" width="460" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="366" r="14" fill="#b85450" filter="url(#rough2)"/>
  <text x="76" y="370" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="356" font-size="12" fill="#b85450" font-weight="bold">输出未执行的 (task_id, subtask_id)</text>
  <text x="100" y="374" font-size="10" fill="#444">SELECT T.task_id, T.subtask_id</text>
  <text x="100" y="388" font-size="10" fill="#666">→ 4 行：(1,1) (1,3) (2,1) (2,2)</text>
</svg>
