<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 arr2 → 遍历 arr1 → 二分查邻域 → 无元素则计数</text>

  <!-- Start: sort arr2 -->
  <rect x="220" y="44" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="300" y="65" text-anchor="middle" font-size="12" fill="#333">sort(arr2)；ans = 0</text>

  <path d="M 300 76 L 300 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry: take next x -->
  <rect x="190" y="100" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="121" text-anchor="middle" font-size="12" fill="#333">取下一个 x ∈ arr1</text>

  <path d="M 300 132 L 300 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute lo, hi -->
  <rect x="210" y="154" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="12" fill="#333">lo = x − d，hi = x + d</text>

  <path d="M 300 186 L 300 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Binary search -->
  <rect x="180" y="208" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="229" text-anchor="middle" font-size="12" fill="#333">p = lower_bound(arr2, lo)</text>

  <path d="M 300 240 L 300 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: p == n OR arr2[p] > hi ? -->
  <polygon points="300,264 430,314 300,364 170,314" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#333">p == n  或</text>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#333">arr2[p] &gt; hi ?</text>

  <!-- Yes -> ans += 1 -->
  <path d="M 430 314 L 472 314" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="474" y="298" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="529" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- No -> skip (do nothing, loop back) -->
  <path d="M 170 314 L 120 314" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="308" font-size="11" fill="#888">否</text>
  <rect x="40" y="298" width="78" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="79" y="319" text-anchor="middle" font-size="12" fill="#b85450">跳过</text>

  <!-- loop back: from ans box and skip box, converge up to loop entry left side -->
  <path d="M 529 330 L 529 360 L 100 360 L 100 116 L 190 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="240" font-size="11" fill="#888" transform="rotate(-90 78 240)">遍历下一个 x</text>

  <!-- after loop ends -> return ans -->
  <path d="M 300 364 L 300 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="392" font-size="11" fill="#888">遍历完</text>
  <rect x="220" y="410" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- bottom notes -->
  <line x1="40" y1="462" x2="560" y2="462" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="484" font-size="11" fill="#444" font-weight="bold">判定要点：</text>
  <text x="40" y="504" font-size="11" fill="#333">• lower_bound(lo) 返回首个 ≥ lo 的位置 p（半开区间标准姿势）</text>
  <text x="40" y="522" font-size="11" fill="#333">• p 越界（全员 &lt; lo）或 arr2[p] &gt; hi → 窗口内无元素 → 符合计数</text>
</svg>
