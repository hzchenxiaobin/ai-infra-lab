<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转化：二值化 +「至少 K」的合法起点</text>

  <!-- nums row -->
  <text x="56" y="74" font-size="12" fill="#555">nums =</text>

  <rect x="110" y="50" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="74" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="162" y="50" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="214" y="50" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="74" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="266" y="50" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="318" y="50" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="134" y="102" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="186" y="102" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="238" y="102" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="290" y="102" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="342" y="102" text-anchor="middle" font-size="9.5" fill="#999">4</text>

  <text x="396" y="66" font-size="12" fill="#d6a040" font-weight="bold">M = 3</text>
  <text x="396" y="84" font-size="12" fill="#555">k = 2</text>

  <!-- arrow to binary -->
  <path d="M 240 112 L 240 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="252" y="128" font-size="10.5" fill="#777">x == M ? 1 : 0</text>

  <!-- binary row -->
  <rect x="110" y="138" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="159" text-anchor="middle" font-size="12" fill="#777">0</text>
  <rect x="162" y="138" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="214" y="138" width="48" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="159" text-anchor="middle" font-size="12" fill="#777">0</text>
  <rect x="266" y="138" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="318" y="138" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- arrow to subarrays -->
  <path d="M 240 176 L 240 196" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="110" y="222" font-size="12" fill="#555" font-weight="bold">以 right = 4 结尾的子数组：</text>

  <!-- bars: valid subarrays l=0..3, invalid l=4 -->
  <rect x="110" y="232" width="256" height="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="245" text-anchor="end" font-size="10.5" fill="#555">l=0</text>
  <text x="376" y="245" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="162" y="256" width="204" height="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="269" text-anchor="end" font-size="10.5" fill="#555">l=1</text>
  <text x="376" y="269" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="214" y="280" width="152" height="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="293" text-anchor="end" font-size="10.5" fill="#555">l=2</text>
  <text x="376" y="293" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="266" y="304" width="100" height="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="258" y="317" text-anchor="end" font-size="10.5" fill="#555">l=3</text>
  <text x="376" y="317" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="318" y="328" width="48" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="341" text-anchor="end" font-size="10.5" fill="#b85450">l=4</text>
  <text x="376" y="341" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="396" y="341" font-size="9.5" fill="#b85450">仅 1 个 M</text>

  <!-- bottom note -->
  <rect x="60" y="360" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans += left = 4：合法起点 l ∈ [0, left−1]，恰有 left 个</text>
</svg>
