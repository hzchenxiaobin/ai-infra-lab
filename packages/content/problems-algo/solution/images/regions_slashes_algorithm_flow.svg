<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集解法流程：4n² 个三角 → 合并 → 数连通块</text>

  <!-- init -->
  <rect x="150" y="46" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化并查集</text>
  <text x="270" y="82" text-anchor="middle" font-size="10.5" fill="#666">节点数 = 4n²，count = 4n²</text>
  <line x1="270" y1="90" x2="270" y2="110" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="130" y="110" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每个格子 (i, j)</text>
  <line x1="270" y1="144" x2="270" y2="164" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: which char -->
  <path d="M 270 164 L 380 206 L 270 248 L 160 206 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">grid[i][j]</text>
  <text x="270" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">是哪种字符？</text>

  <!-- three branches -->
  <!-- space branch (left) -->
  <text x="120" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">' '</text>
  <line x1="160" y1="206" x2="110" y2="206" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="10" y="188" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="206" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">union 4 块</text>
  <text x="60" y="220" text-anchor="middle" font-size="9.5" fill="#666">0∪1∪2∪3</text>

  <!-- slash branch (right) -->
  <text x="395" y="200" font-size="11" fill="#446688" font-weight="bold">'/'</text>
  <line x1="380" y1="206" x2="430" y2="206" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="188" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="206" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">union 两对</text>
  <text x="480" y="220" text-anchor="middle" font-size="9.5" fill="#666">0∪3 ; 1∪2</text>

  <!-- backslash branch (down) -->
  <text x="285" y="244" font-size="11" fill="#d6a040" font-weight="bold">'\'</text>
  <line x1="270" y1="248" x2="270" y2="266" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="266" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">union 两对</text>
  <text x="270" y="298" text-anchor="middle" font-size="9.5" fill="#666">0∪1 ; 2∪3</text>

  <!-- merge between cells -->
  <path d="M 270 304 Q 270 322 270 322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="322" width="300" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合并相邻格子共边三角</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#666">union(本.2, 下.0) ; union(本.1, 右.3)</text>

  <!-- back to loop -->
  <path d="M 120 341 L 60 341 L 60 127 L 130 127" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="234" font-size="10" fill="#888">下一格</text>

  <!-- end -->
  <line x1="270" y1="360" x2="270" y2="378" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="378" width="240" height="0" fill="none" stroke="none"/>
  <rect x="150" y="374" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 count = 连通块数</text>
</svg>
