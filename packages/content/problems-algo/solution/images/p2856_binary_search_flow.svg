<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="15" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：二分最大可行 k，答案 = n − 2k</text>

  <!-- A: init -->
  <rect x="150" y="36" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="230" y="66" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">lo = 0，hi = ⌊n/2⌋</text>

  <!-- A -> B -->
  <path d="M 250 72 Q 310 80 330 92" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: lo < hi ? -->
  <polygon points="330,92 400,124 330,156 260,124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">lo &lt; hi ?</text>

  <!-- B no -> G (over the top, right side) -->
  <path d="M 365 108 V 28 H 640 V 448 H 412" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="104" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- B yes -> C -->
  <path d="M 330 156 V 190" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- C: mid -->
  <rect x="235" y="190" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="209" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">mid = ⌊(lo+hi+1)/2⌋</text>

  <!-- C -> D -->
  <path d="M 330 218 V 240" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: check -->
  <polygon points="330,240 480,286 330,332 180,286" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="281" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">check(mid)：所有 i ∈ [0, mid)</text>
  <text x="330" y="299" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">nums[i] &lt; nums[n−mid+i] ?</text>

  <!-- D yes -> E (right box) -->
  <path d="M 480 286 H 540 V 368" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全部满足 ✓</text>

  <!-- D no -> F (left box) -->
  <path d="M 180 286 H 130 V 368" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">存在 ✗</text>

  <!-- E: lo = mid -->
  <rect x="470" y="368" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="540" y="383" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="540" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">lo = mid</text>

  <!-- F: hi = mid - 1 -->
  <rect x="60" y="368" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="383" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不可行</text>
  <text x="130" y="396" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">hi = mid − 1</text>

  <!-- E back to B -->
  <path d="M 610 384 H 625 V 124 H 402" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">下一轮 ↻</text>

  <!-- F back to B -->
  <path d="M 60 384 H 30 V 124 H 258" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下一轮 ↻</text>

  <!-- G: return -->
  <rect x="250" y="430" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="446" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 n − 2·lo</text>
  <text x="330" y="460" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（k = lo 为最大可行对数）</text>

  <text x="330" y="474" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">mid 向上取整防死循环；check 为假时收缩上界</text>
</svg>
