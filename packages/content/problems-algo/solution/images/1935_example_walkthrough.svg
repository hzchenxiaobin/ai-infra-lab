<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组输入的逐单词判定</text>

  <!-- Header row -->
  <rect x="40" y="44" width="510" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="65" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">示例</text>
  <text x="155" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">text</text>
  <text x="255" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">broken</text>
  <text x="390" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">各单词判定</text>
  <text x="520" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">可输入数</text>

  <!-- Row 1: ex1 -->
  <rect x="40" y="74" width="510" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="93" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="155" y="93" text-anchor="middle" font-size="11.5" fill="#333">"hello world"</text>
  <text x="255" y="93" text-anchor="middle" font-size="11.5" fill="#333">"ad"</text>
  <text x="340" y="93" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">hello ✓</text>
  <text x="445" y="93" text-anchor="middle" font-size="11.5" fill="#b85450">world ✗(d)</text>
  <text x="520" y="93" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 2: ex2 -->
  <rect x="40" y="104" width="510" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="123" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="155" y="123" text-anchor="middle" font-size="11.5" fill="#333">"leet code"</text>
  <text x="255" y="123" text-anchor="middle" font-size="11.5" fill="#333">"lt"</text>
  <text x="340" y="123" text-anchor="middle" font-size="11.5" fill="#b85450">leet ✗(l,t)</text>
  <text x="445" y="123" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">code ✓</text>
  <text x="520" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 3: ex3 -->
  <rect x="40" y="134" width="510" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="153" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="155" y="153" text-anchor="middle" font-size="11.5" fill="#333">"leet code"</text>
  <text x="255" y="153" text-anchor="middle" font-size="11.5" fill="#333">"e"</text>
  <text x="340" y="153" text-anchor="middle" font-size="11.5" fill="#b85450">leet ✗(e)</text>
  <text x="445" y="153" text-anchor="middle" font-size="11.5" fill="#b85450">code ✗(e)</text>
  <text x="520" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- Divider -->
  <path d="M 40 180 L 550 180" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="40" y="192" width="510" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">word 可输入 ⟺ 全部字符 ∉ broken（单词与破损集交集为空）</text>

  <!-- Notes -->
  <text x="40" y="242" font-size="11" fill="#555">• 示例1："hello" 各字符均不在 {a,d} → 可输入；"world" 的 d ∈ {a,d} → 不可输入</text>
  <text x="40" y="260" font-size="11" fill="#555">• 示例3：两词都含 e → 均不可输入；brokenLetters 为空时所有单词均可输入</text>
</svg>
