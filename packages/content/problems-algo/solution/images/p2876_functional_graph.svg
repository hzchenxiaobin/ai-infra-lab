<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每个点恰一条出边 ⟹ 内向基环森林（环 + 挂环的树）</text>

  <!-- cycle edges (red): 0→1→2→0 -->
  <path d="M 256 124 L 184 212" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 190 230 L 348 230" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 356 212 L 286 124" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- branch edge (blue): 3 → 0 -->
  <path d="M 464 112 L 296 108" stroke="#446688" stroke-width="2.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="270" cy="108" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="172" cy="228" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="172" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="368" cy="228" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="368" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="486" cy="108" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="486" y="113" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- cycle center label -->
  <text x="270" y="184" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">环 L = 3</text>

  <!-- ans labels -->
  <text x="270" y="72" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = 3</text>
  <text x="172" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = 3</text>
  <text x="368" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = 3</text>
  <text x="486" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 4</text>

  <!-- branch label -->
  <text x="348" y="92" font-size="11.5" fill="#446688" filter="url(#rough2)">树枝（指向环）</text>

  <!-- legend -->
  <circle cx="52" cy="58" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="62" font-size="11" fill="#555" filter="url(#rough2)">环上节点</text>
  <circle cx="52" cy="84" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="88" font-size="11" fill="#555" filter="url(#rough2)">树枝节点</text>

  <!-- green box: cycle answer -->
  <rect x="36" y="296" width="528" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环上节点：ans = 环长 L —— 绕一圈回到出发点，恰好访问完整个环</text>
  <text x="300" y="340" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0、1、2 同在一个长 3 的环上 → ans[0] = ans[1] = ans[2] = 3</text>

  <!-- yellow box: branch answer -->
  <rect x="36" y="364" width="528" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">树枝节点：ans = d(u) + L —— 先花 d 步走进环，再绕一圈</text>
  <text x="300" y="408" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">递推式 ans[u] = ans[edges[u]] + 1，例：ans[3] = ans[0] + 1 = 4</text>
</svg>
