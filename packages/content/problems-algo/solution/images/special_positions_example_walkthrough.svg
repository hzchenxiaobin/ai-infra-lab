<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：mat = [[1,0,0],[0,0,1],[1,0,0]]</text>

  <!-- ===== Precompute header ===== -->
  <rect x="120" y="36" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">预处理：rowSum = [1, 1, 1]，colSum = [2, 0, 1]</text>

  <!-- ===== Helper: mini matrix cells reused via coordinates ===== -->
  <!-- Panel 1: check (0,0) — x offset 0, panel x base = 20 -->
  <text x="93" y="90" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步骤 1：检查 (0,0)</text>
  <!-- mini 3x3, cell 30, start x=23, y=100 -->
  <rect x="23" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="38" y="120" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="53" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="83" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="23" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="53" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="83" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="23" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="53" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="83" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <!-- check lines -->
  <text x="93" y="208" text-anchor="middle" font-size="9.5" fill="#555">mat=1 ✓</text>
  <text x="93" y="222" text-anchor="middle" font-size="9.5" fill="#555">rowSum[0]=1 ✓</text>
  <text x="93" y="236" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">colSum[0]=2 ✗</text>
  <!-- verdict -->
  <rect x="48" y="246" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="93" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">非特殊</text>
  <text x="93" y="284" text-anchor="middle" font-size="9.5" fill="#888">count = 0</text>

  <!-- Panel 2: check (1,2) — panel x base = 200 -->
  <text x="273" y="90" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步骤 2：检查 (1,2)</text>
  <rect x="203" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="233" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="263" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="203" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="233" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="263" y="130" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="278" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">1</text>
  <rect x="203" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="233" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="263" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <text x="273" y="208" text-anchor="middle" font-size="9.5" fill="#555">mat=1 ✓</text>
  <text x="273" y="222" text-anchor="middle" font-size="9.5" fill="#555">rowSum[1]=1 ✓</text>
  <text x="273" y="236" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">colSum[2]=1 ✓</text>
  <rect x="228" y="246" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="273" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 特殊！</text>
  <text x="273" y="284" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">count = 1</text>

  <!-- Panel 3: check (2,0) — panel x base = 380 -->
  <text x="453" y="90" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步骤 3：检查 (2,0)</text>
  <rect x="383" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="398" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="413" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="443" y="100" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="458" y="120" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="383" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="398" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="413" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="443" y="130" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="458" y="150" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">1</text>
  <rect x="383" y="160" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="398" y="180" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="413" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <rect x="443" y="160" width="30" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="458" y="180" text-anchor="middle" font-size="10" fill="#bbb" font-family="monospace">0</text>
  <text x="453" y="208" text-anchor="middle" font-size="9.5" fill="#555">mat=1 ✓</text>
  <text x="453" y="222" text-anchor="middle" font-size="9.5" fill="#555">rowSum[2]=1 ✓</text>
  <text x="453" y="236" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">colSum[0]=2 ✗</text>
  <rect x="408" y="246" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="453" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">非特殊</text>
  <text x="453" y="284" text-anchor="middle" font-size="9.5" fill="#888">count = 1</text>

  <!-- ===== Arrow between panels ===== -->
  <line x1="140" y1="160" x2="200" y2="160" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="320" y1="160" x2="380" y2="160" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: result ===== -->
  <rect x="120" y="310" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束，仅 (1,2) 通过两道闸门</text>
  <text x="280" y="352" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = 1</text>

  <!-- footnote -->
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">列 0 有两个 1（(0,0) 与 (2,0)），故 colSum[0]=2，二者均非特殊</text>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#888">(1,2) 所在行和、列和都恰为 1，是唯一的特殊位置</text>
</svg>
