<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">k 指针算法流程（primes 长度为 k）</text>

  <!-- ===== Start ===== -->
  <rect x="145" y="36" width="290" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化: nums[0]=1, p[j]=0 (j=0..k-1), i=1</text>

  <path d="M 290 70 L 290 82" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="290,84 372,118 290,152 208,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n ?</text>

  <!-- No branch -->
  <path d="M 372 118 L 440 118" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="112" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="104" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return nums[n-1]</text>

  <!-- Yes branch -->
  <path d="M 290 152 L 290 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="164" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Compute candidates ===== -->
  <rect x="70" y="170" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="191" text-anchor="middle" font-size="11" fill="#446688">遍历 j=0..k-1: cand[j] = nums[p[j]] × primes[j]</text>

  <path d="M 290 206 L 290 218" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Min + assign ===== -->
  <rect x="90" y="220" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="241" text-anchor="middle" font-size="11" fill="#446688">next = min(cand[0..k-1]);  nums[i] = next</text>

  <path d="M 290 256 L 290 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Advance loop header ===== -->
  <rect x="130" y="270" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="291" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历 j=0..k-1: if next == cand[j]: p[j]++</text>

  <path d="M 290 306 L 290 318" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Increment ===== -->
  <rect x="220" y="320" width="140" height="32" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i++</text>

  <!-- ===== Loop back arrow ===== -->
  <path d="M 220 336 L 36 336 L 36 118 L 206 118" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="230" font-size="10" fill="#888" font-weight="bold">循环</text>

  <!-- ===== Warning note 1 ===== -->
  <rect x="50" y="374" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 第二个遍历用独立 if（不是 elif！）</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#888">同一值可能由多路同时产生（如 14 = 7×2 = 2×7），所有匹配指针都要前进</text>

  <!-- ===== Complexity note ===== -->
  <rect x="50" y="428" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="446" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(nk)，空间 O(n+k)</text>
  <text x="290" y="460" text-anchor="middle" font-size="10" fill="#888">k 大时改用最小堆：每步 O(log k) 找最小，总 O(n log k)</text>
</svg>
