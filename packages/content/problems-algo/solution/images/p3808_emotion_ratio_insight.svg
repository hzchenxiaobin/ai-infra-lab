<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">核心观察：按 (用户, 反应) 分组后，60% 阈值自动选出 dominant</text>

  <!-- 左侧：双层分组候选表 -->
  <g filter="url(#rough2)">
    <text x="168" y="42" text-anchor="middle" font-size="10" fill="#446688">GROUP BY (user_id, reaction) → 每用户 × 类型一行候选</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="28" y="48" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="78" y="48" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="158" y="48" width="48" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="48" width="48" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="254" y="48" width="54" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="53" y="62" text-anchor="middle" font-size="10" fill="#446688">user</text>
    <text x="118" y="62" text-anchor="middle" font-size="10" fill="#446688">reaction</text>
    <text x="182" y="62" text-anchor="middle" font-size="10" fill="#446688">cnt</text>
    <text x="230" y="62" text-anchor="middle" font-size="10" fill="#446688">total</text>
    <text x="281" y="62" text-anchor="middle" font-size="9" fill="#446688">cnt/total</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="28" y="68" width="280" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="53" y="84" text-anchor="middle" fill="#333">1</text>
    <text x="118" y="84" text-anchor="middle" fill="#333">like</text>
    <text x="182" y="84" text-anchor="middle" fill="#333">4</text>
    <text x="230" y="84" text-anchor="middle" fill="#333">5</text>
    <text x="281" y="84" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0.80 ✓</text>

    <rect x="28" y="92" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="53" y="108" text-anchor="middle" fill="#777">1</text>
    <text x="118" y="108" text-anchor="middle" fill="#777">wow</text>
    <text x="182" y="108" text-anchor="middle" fill="#777">1</text>
    <text x="230" y="108" text-anchor="middle" fill="#777">5</text>
    <text x="281" y="108" text-anchor="middle" fill="#b85450">0.20 ✗</text>

    <rect x="28" y="116" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="53" y="132" text-anchor="middle" fill="#777">2</text>
    <text x="118" y="132" text-anchor="middle" fill="#777">like</text>
    <text x="182" y="132" text-anchor="middle" fill="#777">2</text>
    <text x="230" y="132" text-anchor="middle" fill="#777">5</text>
    <text x="281" y="132" text-anchor="middle" fill="#b85450">0.40 ✗</text>

    <rect x="28" y="140" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="53" y="156" text-anchor="middle" fill="#777">2</text>
    <text x="118" y="156" text-anchor="middle" fill="#777">wow</text>
    <text x="182" y="156" text-anchor="middle" fill="#777">2</text>
    <text x="230" y="156" text-anchor="middle" fill="#777">5</text>
    <text x="281" y="156" text-anchor="middle" fill="#b85450">0.40 ✗</text>

    <rect x="28" y="164" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="53" y="180" text-anchor="middle" fill="#777">2</text>
    <text x="118" y="180" text-anchor="middle" fill="#777">sad</text>
    <text x="182" y="180" text-anchor="middle" fill="#777">1</text>
    <text x="230" y="180" text-anchor="middle" fill="#777">5</text>
    <text x="281" y="180" text-anchor="middle" fill="#b85450">0.20 ✗</text>

    <rect x="28" y="188" width="280" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="53" y="204" text-anchor="middle" fill="#333">3</text>
    <text x="118" y="204" text-anchor="middle" fill="#333">love</text>
    <text x="182" y="204" text-anchor="middle" fill="#333">5</text>
    <text x="230" y="204" text-anchor="middle" fill="#333">5</text>
    <text x="281" y="204" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1.00 ✓</text>
  </g>

  <!-- 表 → 输出 -->
  <g filter="url(#rough2)">
    <path d="M 168 216 L 168 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="178" y="244" font-size="9.5" fill="#446688">过线的行</text>
  </g>

  <!-- 右侧三个说明框 -->
  <g filter="url(#rough2)">
    <rect x="324" y="48" width="170" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="409" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">SUM(COUNT(*)) OVER</text>
    <text x="409" y="77" text-anchor="middle" font-size="8.5" fill="#446688">(PARTITION BY user_id)</text>
    <text x="409" y="90" text-anchor="middle" font-size="8.5" fill="#446688">同用户 cnt 加总 = total</text>
    <text x="409" y="104" text-anchor="middle" font-size="8.5" fill="#446688">广播到每行 —— 聚合的聚合</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="324" y="122" width="170" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="409" y="137" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">60% 唯一性</text>
    <text x="409" y="151" text-anchor="middle" font-size="8.5" fill="#333">两类都 ≥ 60% ⟹ 占比和 ≥ 120%</text>
    <text x="409" y="163" text-anchor="middle" font-size="8.5" fill="#333">&gt; 100%，矛盾！⇒ 幸存行至多一条</text>
    <text x="409" y="175" text-anchor="middle" font-size="8.5" fill="#333">且必是最高频 —— 过滤即选主</text>
    <text x="409" y="189" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">无需 argmax / DISTINCT</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="324" y="204" width="170" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="409" y="219" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">主键的馈赠</text>
    <text x="409" y="233" text-anchor="middle" font-size="8.5" fill="#333">(user_id, content_id) 是主键</text>
    <text x="409" y="245" text-anchor="middle" font-size="8.5" fill="#333">⇒ COUNT(*) = 不同内容数</text>
    <text x="409" y="257" text-anchor="middle" font-size="8.5" fill="#333">「≥ 5 个内容」= COUNT(*) ≥ 5</text>
  </g>

  <!-- 输出框 -->
  <g filter="url(#rough2)">
    <rect x="28" y="268" width="466" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="261" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">幸存行就是输出行：3 | love | 1.00 、 1 | like | 0.80</text>
    <text x="261" y="299" text-anchor="middle" font-size="9" fill="#4a7a3a">（ROUND(cnt/total, 2)，ratio 降序、user_id 破平）</text>
  </g>

  <!-- 底部陷阱提示 -->
  <g filter="url(#rough2)">
    <rect x="28" y="314" width="466" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="261" y="330" text-anchor="middle" font-size="9.5" fill="#b85450">⚠️ 用户 2：like 2、wow 2 并列最多，各占 0.40 &lt; 0.6 —— 全部出局</text>
    <text x="261" y="346" text-anchor="middle" font-size="9.5" fill="#b85450">「至少 60%」是闭阈值：恰 3/5 = 0.60 也算情绪一致</text>
  </g>
</svg>
