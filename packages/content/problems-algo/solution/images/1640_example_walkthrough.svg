<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：示例 3（true）与示例 2（false）对比</text>

  <!-- ===== Example 3 (true) ===== -->
  <text x="40" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3</text>
  <text x="100" y="54" font-size="11" fill="#555">arr = [91, 4, 64, 78]，pieces = [[78],[4,64],[91]]</text>

  <!-- Table outer -->
  <rect x="30" y="64" width="540" height="124" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header -->
  <rect x="30" y="64" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="56" y="81">步骤</text>
    <text x="100" y="81">i</text>
    <text x="146" y="81">arr[i]</text>
    <text x="236" y="81">查表得 piece</text>
    <text x="372" y="81">整段核对</text>
    <text x="510" y="81">i 跳到</text>
  </g>

  <!-- Column dividers -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="78" y1="64" x2="78" y2="188"/>
    <line x1="122" y1="64" x2="122" y2="188"/>
    <line x1="178" y1="64" x2="178" y2="188"/>
    <line x1="300" y1="64" x2="300" y2="188"/>
    <line x1="448" y1="64" x2="448" y2="188"/>
  </g>

  <!-- Step 1 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="56" y="110">1</text>
    <text x="100" y="110">0</text>
    <text x="146" y="110" fill="#d6a040" font-weight="bold">91</text>
    <text x="236" y="110">[91]</text>
    <text x="372" y="110">arr[0..0] == [91] ✓</text>
    <text x="510" y="110">1</text>
  </g>

  <!-- Step 2 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="56" y="136">2</text>
    <text x="100" y="136">1</text>
    <text x="146" y="136" fill="#d6a040" font-weight="bold">4</text>
    <text x="236" y="136">[4, 64]</text>
    <text x="372" y="136">arr[1..2] == [4,64] ✓</text>
    <text x="510" y="136">3</text>
  </g>

  <!-- Step 3 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="56" y="162">3</text>
    <text x="100" y="162">3</text>
    <text x="146" y="162" fill="#d6a040" font-weight="bold">78</text>
    <text x="236" y="162">[78]</text>
    <text x="372" y="162">arr[3..3] == [78] ✓</text>
    <text x="510" y="162">4</text>
  </g>

  <!-- Result row -->
  <rect x="31" y="170" width="538" height="18" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="300" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i = 4 == n → 消耗完毕，return true ✓</text>

  <!-- Row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="118" x2="570" y2="118"/>
    <line x1="30" y1="144" x2="570" y2="144"/>
    <line x1="30" y1="168" x2="570" y2="168"/>
  </g>

  <!-- ===== Example 2 (false) ===== -->
  <text x="40" y="212" font-size="12" fill="#b85450" font-weight="bold">示例 2</text>
  <text x="100" y="212" font-size="11" fill="#555">arr = [49, 18, 16]，pieces = [[16, 18, 49]]</text>

  <!-- Table outer -->
  <rect x="30" y="222" width="540" height="68" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header -->
  <rect x="30" y="222" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#b85450" font-weight="bold" text-anchor="middle">
    <text x="56" y="239">步骤</text>
    <text x="100" y="239">i</text>
    <text x="146" y="239">arr[i]</text>
    <text x="236" y="239">查表得 piece</text>
    <text x="372" y="239">整段核对</text>
    <text x="510" y="239">i 跳到</text>
  </g>

  <!-- Column dividers -->
  <g stroke="#f0d4da" stroke-width="1" filter="url(#rough2)">
    <line x1="78" y1="222" x2="78" y2="290"/>
    <line x1="122" y1="222" x2="122" y2="290"/>
    <line x1="178" y1="222" x2="178" y2="290"/>
    <line x1="300" y1="222" x2="300" y2="290"/>
    <line x1="448" y1="222" x2="448" y2="290"/>
  </g>

  <!-- Step 1: fail -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="56" y="268">1</text>
    <text x="100" y="268">0</text>
    <text x="146" y="268" fill="#b85450" font-weight="bold">49</text>
    <text x="236" y="268" fill="#b85450" font-weight="bold">查无此键 ✗</text>
    <text x="372" y="268" fill="#888">—</text>
    <text x="510" y="268" fill="#888">—</text>
  </g>

  <!-- Result row -->
  <rect x="31" y="276" width="538" height="14" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="300" y="287" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">arr[0]=49 不在任何 piece 的首元素中 → return false ✗</text>

  <!-- ===== arr visual for example 3 ===== -->
  <text x="40" y="316" font-size="11" fill="#446688" font-weight="bold">arr 拼接还原（示例 3）：</text>

  <!-- piece [91] -->
  <rect x="150" y="304" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="323" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">91</text>
  <!-- piece [4,64] -->
  <rect x="194" y="304" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="323" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="238" y="304" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">64</text>
  <!-- piece [78] -->
  <rect x="282" y="304" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="323" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">78</text>

  <!-- brace below pieces -->
  <path d="M 150 336 L 150 342 L 326 342 L 326 336" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="238" y="356" text-anchor="middle" font-size="10" fill="#888">= arr，三段拼接无缝隙</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="368" width="540" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="390" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="48" y="408" font-size="11" fill="#555">• 示例 3：arr 的每个元素恰好被某个 piece 首元素命中，整段核对全通过 → true</text>
  <text x="48" y="426" font-size="11" fill="#555">• 示例 2：arr[0]=49 在 pieces 中存在，但不是任何 piece 的<tspan fill="#b85450" font-weight="bold">首元素</tspan> → 立即 false</text>
  <text x="48" y="444" font-size="11" fill="#555">• 示例 2 即便 piece [16,18,49] 含 49，因 49 非首元素且内部顺序固定，无法对齐</text>
  <text x="48" y="462" font-size="11" fill="#b85450" font-weight="bold">• 关键：匹配只能从 piece 首元素开始，内部顺序不可重排</text>
</svg>
