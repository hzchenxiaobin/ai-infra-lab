<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：记录每个字符的首次出现位置，跨度 = 当前下标 − 首次下标 − 1</text>

  <!-- String label -->
  <text x="40" y="74" font-size="11" fill="#888">s =</text>

  <!-- Character cells -->
  <g filter="url(#rough2)">
    <rect x="62" y="52" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="106" y="52" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="52" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="52" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="52" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="52" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g font-size="18" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="84" y="80">c</text>
    <text x="128" y="80">a</text>
    <text x="172" y="80">b</text>
    <text x="216" y="80">b</text>
    <text x="260" y="80">a</text>
    <text x="304" y="80" fill="#b85450">c</text>
  </g>

  <!-- Index labels -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="84" y="112">0</text>
    <text x="128" y="112">1</text>
    <text x="172" y="112">2</text>
    <text x="216" y="112">3</text>
    <text x="260" y="112">4</text>
    <text x="304" y="112">5</text>
  </g>

  <!-- First-occurrence markers (blue) above first c, a, b -->
  <g filter="url(#rough2)">
    <path d="M 84 44 L 84 50" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 128 44 L 128 50" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 172 44 L 172 50" stroke="#446688" stroke-width="1.5" fill="none"/>
  </g>
  <g font-size="9" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="84" y="38">首次 c</text>
    <text x="128" y="38">首次 a</text>
    <text x="172" y="38">首次 b</text>
  </g>

  <!-- Repeat marker (red) above last c -->
  <path d="M 304 44 L 304 50" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="304" y="38" font-size="9" fill="#b85450" text-anchor="middle" font-weight="bold">再次 c</text>

  <!-- Span bracket between index 0 and index 5 -->
  <path d="M 84 130 L 84 142 L 304 142 L 304 130" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- Span arrow -->
  <path d="M 90 156 L 298 156" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">跨度 = 5 − 0 − 1 = 4</text>

  <!-- Inner substring highlight: "abba" (indices 1..4) -->
  <g filter="url(#rough2)">
    <rect x="108" y="188" width="168" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="192" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">中间子串 "abba"（长度 4）</text>

  <!-- Hash map box -->
  <rect x="360" y="52" width="170" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">first（首次下标表）</text>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="360" y1="80" x2="530" y2="80"/>
    <line x1="445" y1="60" x2="445" y2="172"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="402" y="98" font-weight="bold">c</text>
    <text x="488" y="98" fill="#446688" font-weight="bold">0</text>
    <text x="402" y="120" font-weight="bold">a</text>
    <text x="488" y="120" fill="#446688" font-weight="bold">1</text>
    <text x="402" y="142" font-weight="bold">b</text>
    <text x="488" y="142" fill="#446688" font-weight="bold">2</text>
    <text x="402" y="164" fill="#999">…</text>
    <text x="488" y="164" fill="#999">…</text>
  </g>

  <!-- Insight box -->
  <rect x="40" y="248" width="480" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="270" font-size="12" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="58" y="290" font-size="11" fill="#555">• 用哈希表 first[c] 记录字符 c 的首次出现下标（仅记一次，不覆盖）</text>
  <text x="58" y="308" font-size="11" fill="#555">• 再次遇到 c 时：候选长度 = i − first[c] − 1，刷新 ans = max(ans, 候选)</text>
  <text x="58" y="326" font-size="11" fill="#555">• 首次出现位置不变 → 同一字符越靠后的重复，跨度越大，天然取到该字符的最优</text>
  <text x="58" y="344" font-size="11" fill="#555">• 全程无重复字符 → ans 保持初值 −1</text>
  <text x="58" y="362" font-size="11" fill="#b85450" font-weight="bold">只用 26 个字母 → 可用长度 26 的数组替代哈希表，O(1) 空间</text>
</svg>
