<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3×3 矩阵对角线遍历</text>
  <text x="370" y="44" text-anchor="middle" font-size="11" fill="#888">mat = [[1,2,3],[4,5,6],[7,8,9]] → [1,2,4,7,5,3,6,8,9]</text>

  <!-- ===== matrix on left, cell 50, origin x=40 y=90 ; centers col 65,115,165 ; row 115,165,215 ===== -->
  <g font-size="16" fill="#333">
    <rect x="40" y="90" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="65" y="122" text-anchor="middle">1</text>
    <rect x="90" y="90" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="115" y="122" text-anchor="middle">2</text>
    <rect x="140" y="90" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="165" y="122" text-anchor="middle">3</text>
    <rect x="40" y="140" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="65" y="172" text-anchor="middle">4</text>
    <rect x="90" y="140" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="115" y="172" text-anchor="middle">5</text>
    <rect x="140" y="140" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="165" y="172" text-anchor="middle">6</text>
    <rect x="40" y="190" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="65" y="222" text-anchor="middle">7</text>
    <rect x="90" y="190" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="115" y="222" text-anchor="middle">8</text>
    <rect x="140" y="190" width="50" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="165" y="222" text-anchor="middle">9</text>
  </g>

  <!-- zigzag polyline through centers in visit order -->
  <polyline points="65,115 115,115 65,165 65,215 115,165 165,115 165,165 115,215 165,215"
    fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" opacity="0.55" filter="url(#rough2)"/>

  <!-- visit-order circles in top-left corner of each cell -->
  <g font-size="9" fill="#b85450">
    <circle cx="53" cy="103" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="53" y="106" text-anchor="middle" font-weight="bold">1</text>
    <circle cx="103" cy="103" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="103" y="106" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="53" cy="153" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="53" y="156" text-anchor="middle" font-weight="bold">3</text>
    <circle cx="53" cy="203" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="53" y="206" text-anchor="middle" font-weight="bold">4</text>
    <circle cx="103" cy="153" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="103" y="156" text-anchor="middle" font-weight="bold">5</text>
    <circle cx="153" cy="103" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="153" y="106" text-anchor="middle" font-weight="bold">6</text>
    <circle cx="153" cy="153" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="153" y="156" text-anchor="middle" font-weight="bold">7</text>
    <circle cx="103" cy="203" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="103" y="206" text-anchor="middle" font-weight="bold">8</text>
    <circle cx="153" cy="203" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="153" y="206" text-anchor="middle" font-weight="bold">9</text>
  </g>

  <text x="115" y="262" text-anchor="middle" font-size="10" fill="#888">○ = 访问序号　虚线 = 遍历路径</text>

  <!-- ===== step table on right ===== -->
  <text x="490" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步游走轨迹（记录后按 dir 决定下一格）</text>

  <!-- header -->
  <rect x="240" y="84" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="100" font-size="10" fill="#446688" font-weight="bold">步</text>
  <text x="288" y="100" font-size="10" fill="#446688" font-weight="bold">(r,c)</text>
  <text x="352" y="100" font-size="10" fill="#446688" font-weight="bold">值</text>
  <text x="392" y="100" font-size="10" fill="#446688" font-weight="bold">dir</text>
  <text x="452" y="100" font-size="10" fill="#446688" font-weight="bold">动作（决定下一格）</text>

  <g font-size="10" fill="#333">
    <!-- step 1 boundary -->
    <rect x="240" y="110" width="480" height="24" fill="#fff8e1" stroke="#e0d0a0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="126">1</text><text x="288" y="126">(0,0)</text><text x="352" y="126">1</text><text x="392" y="126" fill="#446688" font-weight="bold">↗</text><text x="452" y="126" fill="#8a6a20">r==0 撞顶 → c++, 转↙</text>

    <!-- step 2 internal -->
    <rect x="240" y="134" width="480" height="24" fill="#f4f4f4" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="150">2</text><text x="288" y="150">(0,1)</text><text x="352" y="150">2</text><text x="392" y="150" fill="#4a7a3a" font-weight="bold">↙</text><text x="452" y="150" fill="#666">内步 → r++, c−−</text>

    <!-- step 3 boundary -->
    <rect x="240" y="158" width="480" height="24" fill="#fff8e1" stroke="#e0d0a0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="174">3</text><text x="288" y="174">(1,0)</text><text x="352" y="174">4</text><text x="392" y="174" fill="#4a7a3a" font-weight="bold">↙</text><text x="452" y="174" fill="#8a6a20">c==0 撞左 → r++, 转↗</text>

    <!-- step 4 internal -->
    <rect x="240" y="182" width="480" height="24" fill="#f4f4f4" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="198">4</text><text x="288" y="198">(2,0)</text><text x="352" y="198">7</text><text x="392" y="198" fill="#446688" font-weight="bold">↗</text><text x="452" y="198" fill="#666">内步 → r−−, c++</text>

    <!-- step 5 internal -->
    <rect x="240" y="206" width="480" height="24" fill="#f4f4f4" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="222">5</text><text x="288" y="222">(1,1)</text><text x="352" y="222">5</text><text x="392" y="222" fill="#446688" font-weight="bold">↗</text><text x="452" y="222" fill="#666">内步 → r−−, c++</text>

    <!-- step 6 boundary -->
    <rect x="240" y="230" width="480" height="24" fill="#fff8e1" stroke="#e0d0a0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="246">6</text><text x="288" y="246">(0,2)</text><text x="352" y="246">3</text><text x="392" y="246" fill="#446688" font-weight="bold">↗</text><text x="452" y="246" fill="#8a6a20">c==n−1 撞右 → r++, 转↙</text>

    <!-- step 7 internal -->
    <rect x="240" y="254" width="480" height="24" fill="#f4f4f4" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="270">7</text><text x="288" y="270">(1,2)</text><text x="352" y="270">6</text><text x="392" y="270" fill="#4a7a3a" font-weight="bold">↙</text><text x="452" y="270" fill="#666">内步 → r++, c−−</text>

    <!-- step 8 boundary -->
    <rect x="240" y="278" width="480" height="24" fill="#fff8e1" stroke="#e0d0a0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="252" y="294">8</text><text x="288" y="294">(2,1)</text><text x="352" y="294">8</text><text x="392" y="294" fill="#4a7a3a" font-weight="bold">↙</text><text x="452" y="294" fill="#8a6a20">r==m−1 撞底 → c++, 转↗</text>

    <!-- step 9 end -->
    <rect x="240" y="302" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.9" rx="2" filter="url(#rough2)"/>
    <text x="252" y="318">9</text><text x="288" y="318">(2,2)</text><text x="352" y="318">9</text><text x="392" y="318" fill="#b85450" font-weight="bold">—</text><text x="452" y="318" fill="#b85450" font-weight="bold">ans 满 m×n，return</text>
  </g>

  <!-- bottom insight -->
  <rect x="40" y="338" width="680" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#555">橙行=撞墙转向步（4 次），灰行=对角线内步（4 次），红行=终止。共 9 步 = m×n，每格恰好访问一次</text>
</svg>
