<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数学洞察：答案 = n 的奇数因子个数</text>

  <!-- ===== Row 1: 2n = k × (2a+k-1) ===== -->
  <text x="34" y="60" font-size="12" fill="#446688" font-weight="bold">公式两边 ×2</text>

  <rect x="120" y="46" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2n = k × (2a + k − 1)</text>

  <!-- arrow down -->
  <path d="M 300 82 Q 300 92 300 102" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 不同奇偶性 ===== -->
  <text x="34" y="122" font-size="12" fill="#446688" font-weight="bold">关键性质</text>

  <rect x="60" y="108" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k 与 (2a+k−1)</text>
  <text x="170" y="148" text-anchor="middle" font-size="11" fill="#333">差 = 2a−1 为奇数</text>

  <rect x="320" y="108" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 一奇一偶</text>
  <text x="430" y="148" text-anchor="middle" font-size="11" fill="#333">奇因子必整除 n</text>

  <!-- arrow down -->
  <path d="M 300 166 Q 300 176 300 186" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 双射 → 答案 = 奇因子个数 ===== -->
  <rect x="50" y="190" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">每个奇因子 d ↔ 唯一分解 {d, 2n/d}（一奇一偶）</text>
  <text x="300" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = n 的奇数因子个数</text>

  <!-- arrow down -->
  <path d="M 300 242 Q 300 252 300 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Row 4: n=15 的奇因子 ===== -->
  <text x="300" y="288" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n = 15 的奇数因子：1, 3, 5, 15 → 答案 4</text>

  <g filter="url(#rough2)">
    <!-- d=1 -->
    <rect x="60" y="302" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="100" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d=1</text>
    <text x="100" y="344" text-anchor="middle" font-size="10" fill="#666">k=1: [15]</text>

    <!-- d=3 -->
    <rect x="170" y="302" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="210" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d=3</text>
    <text x="210" y="344" text-anchor="middle" font-size="10" fill="#666">k=3: [4,5,6]</text>

    <!-- d=5 -->
    <rect x="280" y="302" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="320" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d=5</text>
    <text x="320" y="344" text-anchor="middle" font-size="10" fill="#666">k=2: [7,8]</text>

    <!-- d=15 -->
    <rect x="390" y="302" width="80" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="430" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d=15</text>
    <text x="430" y="344" text-anchor="middle" font-size="9.5" fill="#666">k=5: [1,2,3,4,5]</text>
  </g>

  <!-- 连接箭头 -->
  <path d="M 300 362 L 300 378" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="150" y="380" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 个奇因子 = 4 种写法  ✓</text>

  <!-- 底部提示 -->
  <text x="300" y="428" text-anchor="middle" font-size="10.5" fill="#888">实现：去掉 n 中所有因子 2，再对奇数部分做约数个数计数</text>
</svg>
