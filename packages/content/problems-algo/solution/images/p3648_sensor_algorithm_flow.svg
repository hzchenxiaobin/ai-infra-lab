<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3648b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一行公式出答案</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">本题只要数目；若要给出具体放置方案，走右侧分支按块放</text>

  <!-- ============ Main flow ============ -->
  <g filter="url(#rough2)">
    <rect x="75" y="55" width="170" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="160" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s ← 2k + 1</text>

    <path d="M 160 91 V 115" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr3648b)"/>

    <rect x="60" y="119" width="200" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="160" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">rows ← ⌈n/s⌉</text>
    <text x="160" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cols ← ⌈m/s⌉</text>

    <path d="M 160 167 V 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr3648b)"/>

    <polygon points="160,196 230,228 160,260 90,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="160" y="224" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">需要放置</text>
    <text x="160" y="240" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">方案？</text>

    <path d="M 160 260 V 288" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr3648b)"/>
    <text x="170" y="280" font-size="10" fill="#666">否</text>
    <rect x="85" y="292" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="160" y="316" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">返回 rows × cols</text>

    <path d="M 230 228 H 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr3648b)"/>
    <text x="240" y="220" font-size="10" fill="#666">是</text>
    <rect x="266" y="200" width="220" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="376" y="219" text-anchor="middle" font-size="9.5" fill="#833">每块 (i, j) 放一个传感器在</text>
    <text x="376" y="235" text-anchor="middle" font-size="9.5" fill="#833">(min(i·s+k, n−1),</text>
    <text x="376" y="251" text-anchor="middle" font-size="9.5" fill="#833">min(j·s+k, m−1))</text>

    <path d="M 376 256 V 288" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr3648b)"/>
    <rect x="301" y="292" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="376" y="316" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">返回方案 O(rows·cols)</text>
  </g>

  <!-- ============ Pitfalls panel ============ -->
  <g filter="url(#rough2)">
    <rect x="300" y="50" width="190" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="395" y="72" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">💡 常见坑</text>
    <text x="312" y="94" font-size="9.5" fill="#555">⌈a/s⌉ 用 (a+s−1) div s，别写错</text>
    <text x="312" y="112" font-size="9.5" fill="#555">k = 0 ⇒ s = 1 ⇒ 答案 n·m</text>
    <text x="312" y="130" font-size="9.5" fill="#555">n, m ≤ 2k+1 ⇒ 答案 1</text>
    <text x="312" y="146" font-size="9" fill="#888">（例 2：2×2, k=2 ⇒ 1 个就够）</text>
    <text x="312" y="164" font-size="9.5" fill="#555">结果 ≤ 10⁶，int 不溢出</text>
  </g>

  <!-- ============ Bottom note ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="352" width="460" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="375" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">数目 O(1) 一步出；构造方案也只需按块放——块数即传感器数</text>
  </g>
</svg>
