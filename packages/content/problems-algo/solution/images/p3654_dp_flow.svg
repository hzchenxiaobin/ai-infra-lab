<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描的 O(n) DP</text>

  <rect x="140" y="36" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 初始化 pre = 0，dp = 0，best[0] = 0</text>

  <path d="M 260 70 V 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="92" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 取元素 x = nums[i−1]：pre += x</text>
  <text x="260" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = pre mod k（当前余数）</text>

  <path d="M 260 134 V 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,152 360,186 260,220 160,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best[r] 已有记录？</text>

  <path d="M 160 186 H 125 V 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 360 186 H 395 V 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="30" y="228" width="190" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③④ dp ← min(dp + x, best[r])</text>
  <text x="125" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">删段 [j..i) 或保留 x，取小者</text>

  <rect x="300" y="228" width="190" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ dp ← dp + x</text>
  <text x="395" y="264" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">无同余的 j，只能保留 x</text>

  <path d="M 125 280 V 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 280 V 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="300" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ best[r] ← min(best[r], dp)</text>
  <text x="260" y="333" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">以 j = i 登记，供后面的同余端点查询</text>

  <path d="M 400 321 H 505 V 113 H 385" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="200" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">还有元素</text>

  <path d="M 260 342 V 356" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="354" font-size="9" fill="#666" filter="url(#rough2)">扫完</text>

  <rect x="165" y="360" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">⑥ 返回 dp（= dp[n]）</text>
</svg>
