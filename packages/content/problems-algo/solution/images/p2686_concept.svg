  <!-- Arrow: GROUP BY order_date + AVG(条件)*100 -->
  <path d="M 215 160 L 345 160" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="225" y="120" width="115" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="137" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">GROUP BY</text>
  <text x="282" y="142" text-anchor="middle" font-size="9" fill="#d6a040">order_date</text>
  <rect x="225" y="168" width="115" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="186" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">AVG(条件)×100</text>

