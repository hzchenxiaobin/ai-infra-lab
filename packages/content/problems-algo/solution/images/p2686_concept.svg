  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按 order_date 分组，AVG(布尔) × 100 即即时占比</text>

