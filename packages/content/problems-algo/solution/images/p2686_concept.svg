  <text x="395" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">order_date</text>
  <rect x="435" y="54" width="100" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">immediate_%</text>

  <rect x="355" y="76" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">08-01</text>
  <rect x="435" y="76" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">66.67</text>

  <rect x="355" y="100" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">08-02</text>
  <rect x="435" y="100" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
