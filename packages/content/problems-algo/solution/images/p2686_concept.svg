  <!-- legend -->
  <rect x="355" y="188" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="374" y="199" font-size="9" fill="#4a7a3a">即时 (pref=order)</text>
  <rect x="355" y="206" width="14" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="374" y="217" font-size="9" fill="#999">计划 (pref&gt;order)</text>

  <!-- Bottom note -->
  <rect x="30" y="300" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">布尔聚合技巧：AVG(order_date = pref_date) = 即时数/总数</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#666">MySQL 中 TRUE=1 / FALSE=0，AVG 直接得到满足条件的行占比</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#666">绿色行 = 即时（两列相等）；灰色行 = 计划（pref 更晚）；红色 = 0% 即时</text>
</svg>
