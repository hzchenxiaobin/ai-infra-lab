<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：grid = [[B,W,B],[B,W,W],[B,W,B]] → true</text>

  <!-- left: 3x3 grid, cell 44, origin (50,70) -->
  <rect x="50" y="70" width="44" height="44" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="97" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="94" y="70" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="97" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">W</text>
  <rect x="138" y="70" width="44" height="44" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="50" y="114" width="44" height="44" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="141" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="94" y="114" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="141" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">W</text>
  <rect x="138" y="114" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="141" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">W</text>
  <rect x="50" y="158" width="44" height="44" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="185" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="94" y="158" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="185" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">W</text>
  <rect x="138" y="158" width="44" height="44" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="185" text-anchor="middle" font-size="14" fill="#fff" filter="url(#rough2)">B</text>

  <!-- highlight flip cell (0,2) -->
  <rect x="136" y="68" width="48" height="48" fill="none" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">改这格 B→W</text>

  <text x="116" y="234" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 grid[0][2] 改成 W 后</text>
  <text x="116" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口② 变成全 W</text>

  <!-- right: four window verdicts -->
  <rect x="270" y="66" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="66" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="86" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="86" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="88" font-size="11.5" fill="#555" filter="url(#rough2)">窗口① (0,0)：cnt = 2</text>
  <text x="500" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">❌</text>

  <rect x="270" y="126" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="126" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="146" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="146" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="148" font-size="11.5" fill="#555" filter="url(#rough2)">窗口② (0,1)：cnt = 1</text>
  <text x="500" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>

  <rect x="270" y="186" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="186" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="206" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="206" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="208" font-size="11.5" fill="#555" filter="url(#rough2)">窗口③ (1,0)：cnt = 2</text>
  <text x="500" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">❌</text>

  <rect x="270" y="246" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="246" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="266" width="20" height="20" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="266" width="20" height="20" fill="#666" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="268" font-size="11.5" fill="#555" filter="url(#rough2)">窗口④ (1,1)：cnt = 1</text>
  <text x="500" y="268" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>

  <rect x="90" y="296" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">存在 cnt ≠ 2 的窗口（②和④）→ 返回 true</text>
</svg>
