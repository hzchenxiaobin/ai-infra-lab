<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么不能贪心：操作①会改写操作②的门槛</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">门槛 x ≥ k 被「÷2 向上取整」动态改变 —— 两操作相互耦合，局部最优 ≠ 全局最优</text>

  <!-- 左panel：反例一 -->
  <rect x="16" y="54" width="242" height="282" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="137" y="76" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例一：先把大的都减半</text>
  <text x="137" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums = [8, 8]，k = 5，op1 = 2，op2 = 1</text>

  <text x="28" y="115" font-size="10" fill="#333" filter="url(#rough2)">贪心：两个 8 都减半 → [4, 4]</text>
  <text x="28" y="130" font-size="9.5" fill="#777" filter="url(#rough2)">剩下的 4 &lt; k = 5，操作②无处可用</text>
  <text x="28" y="147" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">和 = 8 ✗</text>

  <text x="28" y="170" font-size="10" fill="#333" filter="url(#rough2)">修补：② 给一个 8 → 3，① 给另一个 → 4</text>
  <text x="28" y="185" font-size="9.5" fill="#777" filter="url(#rough2)">和 = 7，仍不是最优</text>

  <rect x="24" y="196" width="226" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="34" y="214" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最优：两招叠在同一个 8 上</text>
  <text x="34" y="230" font-size="10" fill="#2f5d24" filter="url(#rough2)">先②后①：8 → 3 → ⌈3/2⌉ = 2</text>
  <text x="34" y="245" font-size="10" fill="#2f5d24" filter="url(#rough2)">另一个 8 仅①：→ 4</text>
  <text x="34" y="260" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">和 = 2 + 4 = 6 ✓</text>

  <text x="28" y="286" font-size="9.5" fill="#777" filter="url(#rough2)">减半把 8 砍到门槛之下，② 被废掉；</text>
  <text x="28" y="300" font-size="9.5" fill="#777" filter="url(#rough2)">而「叠两招」的方向贪心根本没考虑。</text>

  <!-- 右panel：反例二 -->
  <rect x="262" y="54" width="242" height="282" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="383" y="76" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例二：先用②扣大的</text>
  <text x="383" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums = [12, 11, 2]，k = 6，op1 = 1，op2 = 2</text>

  <text x="274" y="115" font-size="10" fill="#333" filter="url(#rough2)">贪心：② 扣 12 → 6、扣 11 → 5</text>
  <text x="274" y="130" font-size="10" fill="#333" filter="url(#rough2)">再把最大的 6 减半 → 3</text>
  <text x="274" y="147" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">和 = 3 + 5 + 2 = 10 ✗</text>

  <text x="274" y="170" font-size="9.5" fill="#777" filter="url(#rough2)">注意：12 减半后 = 6，恰好仍 ≥ k，</text>
  <text x="274" y="185" font-size="9.5" fill="#777" filter="url(#rough2)">② 还能「补刀」—— 贪心没想到</text>

  <rect x="270" y="196" width="226" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="214" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最优：① 先给 12 → 6（仍过门槛！）</text>
  <text x="280" y="230" font-size="10" fill="#2f5d24" filter="url(#rough2)">② 再扣这个 6 → 0，② 扣 11 → 5</text>
  <text x="280" y="245" font-size="10" fill="#2f5d24" filter="url(#rough2)">2 不动</text>
  <text x="280" y="260" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">和 = 0 + 5 + 2 = 7 ✓</text>

  <text x="274" y="286" font-size="9.5" fill="#777" filter="url(#rough2)">这次反倒是「先①后②」独占鳌头 ——</text>
  <text x="274" y="300" font-size="9.5" fill="#777" filter="url(#rough2)">两个反例的最优顺序恰好相反。</text>

  <!-- 底部结论 -->
  <rect x="16" y="348" width="488" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="30" y="370" font-size="10" fill="#333" filter="url(#rough2)">共同教训：① 的结果决定 ② 还能不能用（门槛 x ≥ k），② 的结果又改变 ① 的收益 ——</text>
  <text x="30" y="388" font-size="10" fill="#333" filter="url(#rough2)">可行性相互纠缠时没有安全的局部决策，必须把「剩余预算 (a, b)」记进状态做 DP。</text>
  <path d="M 260 342 L 260 346" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
