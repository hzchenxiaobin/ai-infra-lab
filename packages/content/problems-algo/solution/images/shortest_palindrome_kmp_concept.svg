<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">KMP 核心观察：s + "#" + reverse(s) 的 LPS 末位 = 最长回文前缀长度</text>

  <text x="40" y="78" font-size="12" fill="#666" font-weight="bold">pattern =</text>

  <text x="40" y="108" font-size="11" fill="#446688" font-weight="bold">s →</text>
  <text x="320" y="108" font-size="11" fill="#b85450" font-weight="bold">← 防火墙</text>
  <text x="396" y="108" font-size="11" fill="#d6a040" font-weight="bold">reverse(s) →</text>

  <rect x="100" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="128" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="156" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="184" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="212" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="240" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="268" y="114" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="296" y="114" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="324" y="114" width="28" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="136" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">#</text>
  <rect x="352" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="136" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="380" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="408" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="436" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="464" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="492" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="520" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="534" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="548" y="114" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="562" y="136" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <text x="114" y="166" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="142" y="166" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="170" y="166" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="166" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="226" y="166" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="254" y="166" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="282" y="166" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="310" y="166" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="338" y="166" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="366" y="166" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="394" y="166" text-anchor="middle" font-size="9" fill="#888">10</text>
  <text x="422" y="166" text-anchor="middle" font-size="9" fill="#888">11</text>
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="#888">12</text>
  <text x="478" y="166" text-anchor="middle" font-size="9" fill="#888">13</text>
  <text x="506" y="166" text-anchor="middle" font-size="9" fill="#888">14</text>
  <text x="534" y="166" text-anchor="middle" font-size="9" fill="#888">15</text>
  <text x="562" y="166" text-anchor="middle" font-size="9" fill="#888">16</text>

  <path d="M100 174 L100 182 L296 182 L296 174" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="198" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前缀 s[0..6] = "aacecaa"（长度 7）</text>

  <path d="M380 174 L380 182 L576 182 L576 174" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="478" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">后缀（reverse(s) 末 7 字符）= "aacecaa"</text>

  <path d="M198 204 L290 204 L290 232 L378 232 L378 204" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="248" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">前缀 == 后缀 ⟹ "aacecaa" == 反转("aacecaa")</text>

  <rect x="150" y="296" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">⟹ "aacecaa" 是回文 ⟹ L = lps[16] = 7</text>

  <rect x="60" y="344" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#b85450">答案 = reverse(s)[:8−7] + s = "a" + "aacecaaa" = "aaacecaaa"</text>
</svg>
