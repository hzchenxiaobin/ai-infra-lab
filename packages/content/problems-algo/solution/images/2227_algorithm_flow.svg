<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化建映射+计数表，encrypt O(n) / decrypt O(1)</text>

  <!-- ===== Init phase label ===== -->
  <rect x="40" y="44" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化阶段</text>

  <!-- Step 1: build keyToVal -->
  <rect x="40" y="76" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建 keyToVal[26]：keys[i] → values[i]</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#555">按下标 c−'a' 存 2 字符串，缺失字符留空串作哨兵</text>

  <path d="M 280 130 L 280 148" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop dictionary encrypt -->
  <rect x="40" y="152" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历 dictionary 中每个 w</text>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#555">e = encrypt(w)：逐字符查 keyToVal 拼接</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#555">若 e 非空 → cnt[e] += 1（含非法字符则跳过）</text>

  <path d="M 280 234 L 280 252" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: count table ready -->
  <rect x="40" y="256" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 计数表 cnt 就绪：密文串 → 出现次数</text>

  <!-- ===== Query phase label ===== -->
  <rect x="40" y="312" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">查询阶段</text>

  <!-- Decision diamond: encrypt or decrypt? -->
  <polygon points="280,338 380,378 280,418 180,378" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">调用类型？</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">encrypt / decrypt</text>

  <!-- encrypt branch (left) -->
  <path d="M 180 378 L 120 378" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="372" font-size="10" fill="#446688" font-weight="bold">encrypt</text>
  <rect x="40" y="362" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">逐字符映射</text>
  <text x="80" y="412" text-anchor="middle" font-size="10" fill="#888">O(|word1|)</text>

  <!-- decrypt branch (right) -->
  <path d="M 380 378 L 440 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="372" font-size="10" fill="#4a7a3a" font-weight="bold">decrypt</text>
  <rect x="440" y="362" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cnt[word2]</text>
  <text x="480" y="412" text-anchor="middle" font-size="10" fill="#888">O(1) 查表</text>

  <!-- bottom contrast -->
  <rect x="40" y="432" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：decrypt 不枚举解密串，直接查加密计数表</text>
</svg>
