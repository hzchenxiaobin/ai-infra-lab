<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双堆模型：可用椅子堆 + 占用椅子堆</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">事件驱动：离开先回收 → 到达取最小未占据</text>

  <!-- event stream -->
  <rect x="40" y="66" width="560" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="88" font-size="12" fill="#446688" font-weight="bold">事件流（按 时刻,类型 排序，离开 type=0 优先）</text>
  <g font-size="11" font-family="monospace">
    <rect x="60" y="98" width="92" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="106" y="112" text-anchor="middle" fill="#b85450">(t,0,i) 离开</text>
    <rect x="160" y="98" width="92" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="206" y="112" text-anchor="middle" fill="#4a7a3a">(t,1,i) 到达</text>
    <text x="266" y="112" font-size="10" fill="#888">同时刻：离开在前，先释放椅子</text>
  </g>

  <!-- arrow down split -->
  <path d="M 180 126 L 180 152" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 460 126 L 460 152" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- leave branch -->
  <rect x="50" y="158" width="260" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="182" font-size="13" fill="#b85450" font-weight="bold">离开事件 (t,0,i)</text>
  <text x="70" y="206" font-size="12" fill="#555">把 chairOf[i] 归还可用堆</text>
  <g font-size="11" font-family="monospace">
    <text x="70" y="232" fill="#b85450">available.push(chairOf[i])</text>
    <text x="70" y="252" fill="#888">// 椅子编号回到候选池</text>
  </g>

  <!-- arrival branch -->
  <rect x="330" y="158" width="270" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="182" font-size="13" fill="#4a7a3a" font-weight="bold">到达事件 (t,1,i)</text>
  <text x="350" y="206" font-size="12" fill="#555">取最小未占据椅子</text>
  <g font-size="11" font-family="monospace">
    <text x="350" y="232" fill="#4a7a3a">c = available.top() ? : nextChair++</text>
    <text x="350" y="252" fill="#888">// 命中 targetFriend 即返回 c</text>
  </g>

  <!-- available heap -->
  <rect x="50" y="296" width="260" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="320" font-size="13" fill="#d6a040" font-weight="bold">available 小根堆</text>
  <text x="70" y="340" font-size="11" fill="#555">存回收的椅子编号，堆顶=最小</text>
  <g font-size="12">
    <rect x="70" y="352" width="40" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="90" y="371" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <rect x="120" y="352" width="40" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="371" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="170" y="352" width="40" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="371" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="220" y="371" font-size="11" fill="#888">... 堆顶=0</text>
  </g>

  <!-- nextChair counter -->
  <rect x="330" y="296" width="270" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="320" font-size="13" fill="#d6a040" font-weight="bold">nextChair 惰性递增</text>
  <text x="350" y="340" font-size="11" fill="#555">堆空时开新椅子，编号递增</text>
  <g font-size="12">
    <rect x="350" y="352" width="60" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="371" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <text x="425" y="371" font-size="11" fill="#888">下一个新号</text>
  </g>
  <text x="350" y="396" font-size="10" fill="#888">回收号 &lt; nextChair，故优先复用堆顶</text>
</svg>
