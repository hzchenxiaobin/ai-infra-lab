<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：建集合 → 扫 order → 命中即收集</text>

  <!-- input -->
  <rect x="70" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 order, friends</text>
  <path d="M 130 70 L 130 86" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="45" y="90" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① fs ← friends 全体入集合</text>
  <path d="M 130 120 L 130 136" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="130,140 180,168 130,196 80,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">order 未取尽 ?</text>

  <path d="M 180 168 L 216 168" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="198" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step 2 -->
  <rect x="220" y="148" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② x ← order 下一个</text>
  <text x="300" y="181" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（名次从先到后）</text>

  <path d="M 300 188 L 300 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="300,206 356,234 300,262 244,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="239" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x ∈ fs ?</text>

  <path d="M 356 234 L 390 234" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="373" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step 3 -->
  <rect x="394" y="212" width="116" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="230" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ ans.push(x)</text>
  <text x="452" y="246" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">命中即收集</text>

  <!-- no branch joins loop-back line -->
  <path d="M 300 262 L 300 308" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="288" font-size="10.5" fill="#b85450" filter="url(#rough2)">否 · 跳过</text>

  <!-- loop back -->
  <path d="M 452 256 L 452 312 L 130 312 L 130 200" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="326" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">继续取下一个 x</text>

  <!-- exit -->
  <path d="M 80 168 C 46 168, 46 336, 90 336" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="62" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="56" y="252" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">扫完</text>

  <!-- return -->
  <rect x="94" y="322" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="343" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="330" y="343" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">相对顺序 = 扫描序，无需排序</text>

  <!-- side notes -->
  <text x="455" y="58" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">两阶段：</text>
  <text x="455" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 建集合 O(m)</text>
  <text x="455" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 扫描 O(n)</text>
  <text x="455" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">order 是 1..n 排列</text>
  <text x="455" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ bool is[n+1]</text>
  <text x="455" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">零哈希开销</text>

  <text x="16" y="356" font-size="9" fill="#999" filter="url(#rough2)">注：m ≤ 8 很小，但 O(n+m) 模式可扩展到十万级</text>
</svg>
