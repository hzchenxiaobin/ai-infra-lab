<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：预处理拓扑序 → 离散化二分 → check 内 DAG 最短路</text>

  <rect x="40" y="46" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="63" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建邻接表 + Kahn 拓扑序</text>
  <text x="150" y="78" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">只算一次，全部 check 共用</text>

  <rect x="40" y="104" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="121" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 边成本排序去重 → vals</text>
  <text x="150" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">候选答案集合，大小 ≤ m</text>

  <path d="M 150 84 L 150 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 142 L 150 158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="104,186 150,160 196,186 150,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ check(vals[0])？</text>

  <path d="M 196 186 L 336 186" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="340" y="168" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <text x="405" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">全部边可用仍不达标</text>

  <path d="M 150 212 L 150 228" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="224" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="70" y="230" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ lo = 0，hi = |vals| − 1</text>

  <path d="M 150 262 L 150 280" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="104,310 150,284 196,310 150,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ lo &lt; hi ？</text>

  <path d="M 196 310 L 336 310" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="340" y="292" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 vals[lo] ← 答案</text>
  <text x="410" y="322" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">最大可行阈值</text>

  <path d="M 150 336 L 150 354" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="348" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="78" y="356" width="144" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ mid = (lo+hi+1)/2</text>

  <path d="M 150 388 L 150 406" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="104,434 150,408 196,434 150,460" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="438" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑦ check(vals[mid])？</text>

  <path d="M 150 460 L 112 480" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="118" y="470" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="62" y="482" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="106" y="501" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo = mid</text>

  <path d="M 196 434 L 262 434 L 262 478" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="426" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="216" y="480" width="94" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="263" y="499" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi = mid − 1</text>

  <path d="M 106 512 L 106 534 L 26 534 L 26 310 L 98 310" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 263 510 L 263 534 L 112 534" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="60" y="552" font-size="9.5" fill="#446688" filter="url(#rough2)">回到 ⑤ 继续二分</text>

  <rect x="336" y="400" width="170" height="146" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="421" y="420" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">check(x)：O(n + m)</text>
  <text x="421" y="440" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp 全部置 ∞，dp[0] = 0</text>
  <text x="421" y="458" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">按拓扑序遍历 u</text>
  <text x="421" y="476" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（dp[u] = ∞ 则跳过）</text>
  <text x="421" y="494" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">出边 (v, c)：c ≥ x 且 online[v]</text>
  <text x="421" y="512" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">→ dp[v] = min(dp[v], dp[u]+c)</text>
  <text x="421" y="534" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 dp[n−1] ≤ k</text>
</svg>
