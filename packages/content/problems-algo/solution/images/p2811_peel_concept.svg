<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">每次只剥一个元素 → 收敛到一对</text>

  <!-- Step rows: show peeling toward pair [3,3] -->
  <!-- Row 1: full array len 5 -->
  <text x="30" y="62" font-size="11" fill="#888" filter="url(#rough2)">len=5</text>
  <rect x="70" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="48" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="48" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="48" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="48" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="285" y="67" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum=13 ≥ m ✓</text>

  <!-- peel right arrow -->
  <path d="M250,84 Q255,94 245,98" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="92" font-size="10" fill="#b85450" filter="url(#rough2)">剥右</text>

  <!-- Row 2: len 4 [2,3,3,2] -->
  <text x="30" y="122" font-size="11" fill="#888" filter="url(#rough2)">len=4</text>
  <rect x="70" y="108" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="108" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="108" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="108" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="245" y="127" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum=10 ≥ m ✓</text>

  <path d="M230,144 Q235,154 225,158" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="242" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">剥右</text>

  <!-- Row 3: len 3 [2,3,3] -->
  <text x="30" y="182" font-size="11" fill="#888" filter="url(#rough2)">len=3</text>
  <rect x="70" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="168" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="205" y="187" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum=8 ≥ m ✓</text>

  <!-- peel left arrow -->
  <path d="M90,204 Q85,214 95,218" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="60" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">剥左</text>

  <!-- Row 4: len 2 [3,3] the target pair -->
  <text x="30" y="242" font-size="11" fill="#888" filter="url(#rough2)">len=2</text>
  <rect x="110" y="228" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="228" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="205" y="247" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">sum=6 ≥ m ✓ 关键！</text>

  <!-- split arrow down -->
  <path d="M150,264 L150,278" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="276" font-size="10" fill="#4a7a3a" filter="url(#rough2)">拆分</text>

  <!-- Row 5: two singletons -->
  <rect x="115" y="284" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="155" y="284" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="200" y="300" font-size="11" fill="#4a7a3a" filter="url(#rough2)">len=1 自动 good ✓</text>

  <!-- monotonicity note -->
  <rect x="70" y="330" width="430" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="348" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">正数单调：包含该对的更长区间 sum 更大</text>
  <text x="285" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a20" filter="url(#rough2)">→ 只需检查是否存在相邻对 sum ≥ m</text>
</svg>
