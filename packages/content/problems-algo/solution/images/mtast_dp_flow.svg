<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <rect x="180" y="18" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="43" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 dp[a][c] = 0</text>
  <text x="260" y="14" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">A = maxAmount, C = maxCoupons</text>

  <path d="M260,58 L260,76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="150" y="78" width="220" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历每个水果：p, t, pc = p / 2</text>

  <path d="M260,118 L260,136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="80" y="138" width="360" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for a = A → 0：  for c = C → 0：</text>
  <text x="100" y="184" font-size="12" fill="#333" filter="url(#rough2)">dp[a][c] = max(</text>
  <text x="115" y="202" font-size="11" fill="#666" filter="url(#rough2)">① 跳过 = dp[a][c]</text>
  <text x="115" y="219" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② 原价 = dp[a-p][c] + t        (a ≥ p)</text>
  <text x="115" y="236" font-size="11" fill="#d6a040" filter="url(#rough2)">③ 优惠券 = dp[a-pc][c-1] + t   (a ≥ pc, c ≥ 1)</text>
  <text x="395" y="184" font-size="12" fill="#333" filter="url(#rough2)">)</text>

  <path d="M260,248 L260,266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <polygon points="260,268 330,300 260,332 190,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有水果?</text>
  <text x="260" y="313" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">未处理</text>

  <path d="M330,300 C400,300 410,98 370,98" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="400" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是 → 继续</text>

  <path d="M260,332 L260,360" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="270" y="352" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="170" y="362" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 dp[A][C]</text>

  <text x="30" y="440" font-size="11" fill="#888" filter="url(#rough2)">a 从大到小：保证读到的 a-p / a-pc 行尚未被本物品改写（0-1 不重复选）</text>
</svg>
