<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：hours = [12, 12, 30, 24, 24]，余数序列 = [12, 12, 6, 0, 0]</text>

  <rect x="31" y="40" width="458" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="51" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="109" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">hours[j]</text>
  <text x="185" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">r = h%24</text>
  <text x="275" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">查桶 (24−r)%24</text>
  <text x="371" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">命中 cnt[桶]</text>
  <text x="452" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="31" y="68" width="458" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="109" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="185" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="275" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="371" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="452" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="31" y="98" width="458" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="51" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="109" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="185" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="275" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="371" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="452" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="31" y="128" width="458" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="109" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="185" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="275" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">18</text>
  <text x="371" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="452" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="31" y="158" width="458" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="109" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="185" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="275" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="371" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="452" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="31" y="188" width="458" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="51" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="109" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="185" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="275" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="371" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="452" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="31" y="232" width="458" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">遍历结束后的桶：cnt[0] = 2，cnt[6] = 1，cnt[12] = 2，其余桶 = 0</text>

  <rect x="16" y="276" width="488" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2 ✓　数对 (0,1)：12 + 12 = 24；数对 (3,4)：24 + 24 = 48</text>
  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">余数 6 的互补桶 18 始终为空——30 小时那个元素谁也配不上</text>

  <rect x="16" y="340" width="488" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">示例 2 复核：[72, 48, 24, 3] → 余数 [0, 0, 0, 3]</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = C(3, 2) + cnt[3] · cnt[21] = 3 + 0 = 3 ✓</text>
</svg>
