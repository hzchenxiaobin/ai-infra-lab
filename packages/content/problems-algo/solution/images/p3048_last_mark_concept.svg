<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每个下标在其最晚出现秒标记</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 1：changeIndices = [2,2,2,2,3,2,2,1]，nums = [2,2,0]</text>

  <!-- 时间轴格子：普通秒（蓝） -->
  <rect x="52" y="96" width="50" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="96" width="50" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="96" width="50" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="96" width="50" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="312" y="96" width="50" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 标记秒（橙、加粗） -->
  <rect x="264" y="96" width="50" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="364" y="96" width="50" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="416" y="96" width="50" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="77" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="129" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="181" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="233" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="289" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="337" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="389" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="441" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 秒号 -->
  <text x="40" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒</text>
  <text x="77" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="129" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="181" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="233" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="289" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="337" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
  <text x="389" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>
  <text x="441" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>

  <!-- 标记标签 -->
  <text x="289" y="80" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">标记3★</text>
  <text x="385" y="80" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">标记2★</text>
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">标记1★</text>

  <path d="M300,178 C330,172 360,162 382,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">秒 1~4、6 也出现下标 2，但只在最晚的秒 7 标记</text>

  <rect x="36" y="204" width="448" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="226" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么推迟到最晚出现秒不吃亏？</text>
  <text x="52" y="244" font-size="12" fill="#333" filter="url(#rough2)">nums 只减不增：早减到 0，晚点标记依然合法；</text>
  <text x="52" y="260" font-size="12" fill="#333" filter="url(#rough2)">把标记尽量后挪，越早的秒都空出来给「减 1」（交换论证）</text>

  <rect x="36" y="286" width="448" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="308" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可行性判定（对升序标记时刻 t₁ &lt; t₂ &lt; … &lt; tₙ）</text>
  <text x="52" y="328" font-size="12.5" fill="#333" filter="url(#rough2)">第 j 个标记前可用「减 1」秒数 = tⱼ − j，须 ≥ 前 j 个下标的 nums 总和 Sⱼ</text>
</svg>
