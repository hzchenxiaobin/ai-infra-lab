<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：编码状态 → BFS 逐层展开 → 到达全 0 即答案</text>

  <!-- Step 1: Encode -->
  <rect x="160" y="44" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 将 grid 编码为 bitmask</text>

  <path d="M 280 82 L 280 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Initialize BFS -->
  <rect x="120" y="100" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 初始化：queue=[state], vis={state}, ans=0</text>

  <path d="M 280 138 L 280 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: BFS loop header -->
  <rect x="100" y="156" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="179" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">③ while queue 非空：逐层展开 BFS</text>

  <path d="M 280 194 L 280 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Dequeue and check -->
  <polygon points="280,212 400,252 280,292 160,252" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">state == 0 ?</text>
  <text x="280" y="262" text-anchor="middle" font-size="9.5" fill="#888">弹出队首，检查是否全清</text>

  <!-- Yes branch (right) -->
  <path d="M 400 252 L 460 252 L 460 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="430" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="390" y="290" width="140" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="460" y="326" text-anchor="middle" font-size="9.5" fill="#888">最短操作步数</text>

  <!-- No branch (left) -->
  <path d="M 160 252 L 100 252 L 100 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="130" y="246" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 5: Enumerate operations -->
  <rect x="30" y="290" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">④ 枚举所有 (i,j)</text>
  <text x="120" y="326" text-anchor="middle" font-size="10" fill="#555">grid[i][j]==1 的格子</text>
  <text x="120" y="340" text-anchor="middle" font-size="9.5" fill="#888">（检查原始 grid，非当前状态）</text>

  <!-- arrow down from enumerate to clear operation -->
  <path d="M 120 348 L 120 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Clear row i and col j -->
  <rect x="30" y="366" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="386" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">⑤ 清零第 i 行 & 第 j 列</text>
  <text x="120" y="402" text-anchor="middle" font-size="9.5" fill="#555">nxt = state</text>
  <text x="120" y="416" text-anchor="middle" font-size="9.5" fill="#555">nxt &amp;= ~row_mask &amp; ~col_mask</text>

  <!-- arrow to vis check -->
  <path d="M 210 394 L 280 394 L 280 376" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: Check visited and enqueue -->
  <polygon points="280,340 380,376 280,412 180,376" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nxt ∉ vis ?</text>
  <text x="280" y="388" text-anchor="middle" font-size="9" fill="#888">新状态?</text>

  <!-- Yes: add to vis and queue -->
  <path d="M 380 376 L 440 376 L 440 396" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="410" y="370" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="370" y="398" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="416" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">vis.add(nxt)</text>
  <text x="440" y="430" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">queue.append(nxt)</text>

  <!-- No: skip -->
  <path d="M 180 376 L 140 376 L 140 396" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="158" y="370" font-size="9.5" fill="#888">否</text>
  <text x="140" y="414" text-anchor="middle" font-size="9.5" fill="#888">跳过</text>

  <!-- Loop back arrow -->
  <path d="M 440 440 L 440 456 L 120 456 L 120 424" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="9" fill="#d6a040" font-style="italic">本轮结束后 ans += 1，继续下一层</text>
</svg>
