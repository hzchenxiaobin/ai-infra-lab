<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">要凑 x 组，长度取 1,2,…,x 最省；代价 = 三角数 T(x)=x(x+1)/2</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">组 = 列、高度 = 长度；数字填格、每列至多 1 格（组内不重复）</text>

  <!-- ============ Left: staircase triangle ============ -->
  <text x="40" y="68" font-size="11" fill="#666" font-weight="bold">一种可行填法（[1,2,5] → 3 组）</text>

  <!-- col1 (size1): [2] -->
  <rect x="60" y="268" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- col2 (size2): [2,1] -->
  <rect x="108" y="268" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="108" y="240" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- col3 (size3): [2,1,0] -->
  <rect x="156" y="268" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="156" y="240" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="212" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- column size labels -->
  <text x="82" y="312" text-anchor="middle" font-size="10" fill="#888">组1</text>
  <text x="82" y="325" text-anchor="middle" font-size="9" fill="#888">长度1</text>
  <text x="130" y="312" text-anchor="middle" font-size="10" fill="#888">组2</text>
  <text x="130" y="325" text-anchor="middle" font-size="9" fill="#888">长度2</text>
  <text x="178" y="312" text-anchor="middle" font-size="10" fill="#888">组3</text>
  <text x="178" y="325" text-anchor="middle" font-size="9" fill="#888">长度3</text>

  <!-- legend -->
  <rect x="40" y="346" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="58" y="358" font-size="10" fill="#666">数字2 (≤5) 跨3组</text>
  <rect x="40" y="364" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="58" y="376" font-size="10" fill="#666">数字1 (≤2) 跨2组</text>
  <rect x="40" y="382" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="58" y="394" font-size="10" fill="#666">数字0 (≤1) 跨1组</text>

  <!-- divider -->
  <line x1="290" y1="60" x2="290" y2="390" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ============ Right: greedy rule ============ -->
  <text x="425" y="68" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">贪心规则（升序累计）</text>

  <!-- formula box -->
  <rect x="300" y="80" width="250" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="100" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">跨过 T(ans+1)=(ans+1)(ans+2)/2 即 ans++</text>

  <!-- sorted array -->
  <text x="300" y="130" font-size="10" fill="#888">升序排序：</text>
  <rect x="362" y="118" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="402" y="118" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="420" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="442" y="118" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="460" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- steps -->
  <text x="300" y="162" font-size="11" fill="#444">v=1  total=1  ≥ T(1)=1</text>
  <text x="510" y="162" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="300" y="180" font-size="10" fill="#888">解锁组1 → ans=1</text>

  <text x="300" y="206" font-size="11" fill="#444">v=2  total=3  ≥ T(2)=3</text>
  <text x="510" y="206" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="300" y="224" font-size="10" fill="#888">解锁组2 → ans=2</text>

  <text x="300" y="250" font-size="11" fill="#444">v=5  total=8  ≥ T(3)=6</text>
  <text x="510" y="250" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="300" y="268" font-size="10" fill="#888">解锁组3 → ans=3</text>

  <!-- note -->
  <rect x="300" y="286" width="250" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="425" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">每个数字至多触发一次 ans++</text>
  <text x="425" y="322" text-anchor="middle" font-size="10" fill="#666">→ 编码「第 k 组需 k 个不同数字」</text>
  <text x="425" y="336" text-anchor="middle" font-size="10" fill="#666">的分散度约束（详见第 5 节反例）</text>
</svg>
