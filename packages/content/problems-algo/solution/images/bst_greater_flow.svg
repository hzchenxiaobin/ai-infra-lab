<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递归反序中序：右 → 根（累加写回） → 左</text>

  <!-- 入口 -->
  <rect x="200" y="48" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="12" fill="#333">sum = 0；调用 dfs(root)</text>

  <path d="M 290 80 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,100 400,140 290,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>

  <!-- 是 → 返回 -->
  <path d="M 400 140 L 470 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="132" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="124" width="90" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="515" y="145" text-anchor="middle" font-size="11" fill="#888">return</text>

  <!-- 否 ↓ -->
  <path d="M 290 180 L 290 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="194" font-size="10" fill="#82b366">否</text>

  <!-- ① 递归右 -->
  <rect x="160" y="200" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="221" text-anchor="middle" font-size="11" fill="#333">① dfs(node.right)   // 右：累加更大节点</text>

  <path d="M 290 232 L 290 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 累加写回 -->
  <rect x="120" y="252" width="340" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② sum += node.val；node.val = sum   // 根</text>

  <path d="M 290 284 L 290 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 递归左 -->
  <rect x="160" y="304" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="325" text-anchor="middle" font-size="11" fill="#333">③ dfs(node.left)   // 左：累加更小节点</text>

  <path d="M 290 336 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="245" y="356" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11" fill="#888">return node</text>

  <!-- 回溯到入口的虚线（体现递归返回） -->
  <path d="M 430 268 L 510 268 L 510 64 L 380 64" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="170" font-size="10" fill="#b85450" transform="rotate(-90 516 170)">逐层 return</text>
</svg>
