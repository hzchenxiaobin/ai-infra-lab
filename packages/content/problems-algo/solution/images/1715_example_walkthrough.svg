<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：7 个盒子的苹果 / 橘子逐行累加</text>

  <!-- ===== Table frame ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="42" width="540" height="372" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>

  <!-- header row -->
  <g filter="url(#rough2)" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="62">box_id</text>
    <text x="120" y="62">chest_id</text>
    <text x="200" y="62">盒内🍎/🍊</text>
    <text x="300" y="62">箱子🍎/🍊</text>
    <text x="396" y="62">本行🍎/🍊</text>
    <text x="500" y="62">累计🍎/🍊</text>
  </g>
  <line x1="36" y1="70" x2="564" y2="70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- column dividers -->
  <line x1="92" y1="48" x2="92" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="156" y1="48" x2="156" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="48" x2="250" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="48" x2="350" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="446" y1="48" x2="446" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Data rows ===== -->
  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <!-- Row 1: box 2, NULL -->
    <text x="60" y="88">2</text>
    <text x="120" y="88" fill="#aaa">NULL</text>
    <text x="200" y="88">6 / 15</text>
    <text x="300" y="88" fill="#aaa">— / —</text>
    <text x="396" y="88" fill="#b85450" font-weight="bold">6 / 15</text>
    <text x="500" y="88" fill="#4a7a3a" font-weight="bold">6 / 15</text>

    <!-- Row 2: box 18, chest 14 -->
    <text x="60" y="112">18</text>
    <text x="120" y="112">14</text>
    <text x="200" y="112">4 / 15</text>
    <text x="300" y="112" fill="#d6a040">20 / 10</text>
    <text x="396" y="112" fill="#b85450" font-weight="bold">24 / 25</text>
    <text x="500" y="112" fill="#4a7a3a" font-weight="bold">30 / 40</text>

    <!-- Row 3: box 19, chest 3 -->
    <text x="60" y="136">19</text>
    <text x="120" y="136">3</text>
    <text x="200" y="136">8 / 4</text>
    <text x="300" y="136" fill="#d6a040">19 / 4</text>
    <text x="396" y="136" fill="#b85450" font-weight="bold">27 / 8</text>
    <text x="500" y="136" fill="#4a7a3a" font-weight="bold">57 / 48</text>

    <!-- Row 4: box 12, chest 2 -->
    <text x="60" y="160">12</text>
    <text x="120" y="160">2</text>
    <text x="200" y="160">19 / 20</text>
    <text x="300" y="160" fill="#d6a040">8 / 8</text>
    <text x="396" y="160" fill="#b85450" font-weight="bold">27 / 28</text>
    <text x="500" y="160" fill="#4a7a3a" font-weight="bold">84 / 76</text>

    <!-- Row 5: box 20, chest 6 -->
    <text x="60" y="184">20</text>
    <text x="120" y="184">6</text>
    <text x="200" y="184">12 / 9</text>
    <text x="300" y="184" fill="#d6a040">5 / 6</text>
    <text x="396" y="184" fill="#b85450" font-weight="bold">17 / 15</text>
    <text x="500" y="184" fill="#4a7a3a" font-weight="bold">101 / 91</text>

    <!-- Row 6: box 8, chest 6 -->
    <text x="60" y="208">8</text>
    <text x="120" y="208">6</text>
    <text x="200" y="208">9 / 9</text>
    <text x="300" y="208" fill="#d6a040">5 / 6</text>
    <text x="396" y="208" fill="#b85450" font-weight="bold">14 / 15</text>
    <text x="500" y="208" fill="#4a7a3a" font-weight="bold">115 / 106</text>

    <!-- Row 7: box 3, chest 14 -->
    <text x="60" y="232">3</text>
    <text x="120" y="232">14</text>
    <text x="200" y="232">16 / 7</text>
    <text x="300" y="232" fill="#d6a040">20 / 10</text>
    <text x="396" y="232" fill="#b85450" font-weight="bold">36 / 17</text>
    <text x="500" y="232" fill="#4a7a3a" font-weight="bold">151 / 123</text>
  </g>

  <!-- highlight final row -->
  <rect x="36" y="224" width="528" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.45"/>

  <!-- ===== Chests reference note ===== -->
  <line x1="36" y1="248" x2="564" y2="248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="266" font-size="9" fill="#888" filter="url(#rough2)">Chests 参照表：</text>
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="120" y="266">chest 6 → 🍎5/🍊6</text>
    <text x="240" y="266">chest 14 → 🍎20/🍊10</text>
    <text x="360" y="266">chest 2 → 🍎8/🍊8</text>
    <text x="470" y="266">chest 3 → 🍎19/🍊4</text>
  </g>
  <text x="44" y="282" font-size="9" fill="#aaa" filter="url(#rough2)">chest 16（🍎19/🍊19）未被任何盒子引用 → 不计入 ✗</text>

  <!-- ===== Formula reminder ===== -->
  <rect x="36" y="296" width="528" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="316" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">本行 = 盒内 + IFNULL(箱子, 0)；累计 = 上一行累计 + 本行</text>
  <text x="48" y="330" font-size="9" fill="#555" filter="url(#rough2)">box 2 无箱子 → 箱子列折 0；box 18 与 box 3 共用 chest 14，箱子水果被各计一次（水果随箱子进入盒子）</text>

  <!-- ===== Final result callout ===== -->
  <rect x="36" y="346" width="528" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终结果：apple_count = 151, orange_count = 123</text>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">SUM(b.apple + IFNULL(c.apple,0)) = 151 · SUM(b.orange + IFNULL(c.orange,0)) = 123</text>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="9" fill="#888">
    <circle cx="46" cy="412" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="56" y="415" fill="#b85450">本行（盒+箱）</text>
    <circle cx="170" cy="412" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="180" y="415" fill="#4a7a3a">累计 SUM</text>
    <circle cx="266" cy="412" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="276" y="415" fill="#d6a040">箱子贡献（JOIN 挂载）</text>
  </g>

  <!-- footer -->
  <rect x="30" y="430" width="540" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键：箱子 14 被盒子 18、3 各引用一次 → 其水果计入两个盒子（水果随箱子进入不同盒子）</text>
</svg>
