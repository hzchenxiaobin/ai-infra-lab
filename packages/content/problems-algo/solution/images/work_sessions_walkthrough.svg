<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：tasks = [1,2,3], sessionTime = 3（共 2³ = 8 个状态）</text>

  <!-- Table outer -->
  <rect x="20" y="48" width="560" height="272" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Header bg -->
  <rect x="20" y="48" width="560" height="32" fill="#e8f0fe" stroke="none" rx="4" filter="url(#rough2)"/>

  <!-- Highlight rows -->
  <rect x="20" y="230" width="560" height="30" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="20" y="290" width="560" height="30" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- Grid lines vertical -->
  <line x1="110" y1="48" x2="110" y2="320" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="48" x2="230" y2="320" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="48" x2="380" y2="320" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- Grid lines horizontal -->
  <line x1="20" y1="80" x2="580" y2="80" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="110" x2="580" y2="110" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="140" x2="580" y2="140" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="170" x2="580" y2="170" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="200" x2="580" y2="200" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="230" x2="580" y2="230" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="260" x2="580" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="290" x2="580" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="320" x2="580" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header texts -->
  <text x="65" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mask</text>
  <text x="170" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">已完成任务</text>
  <text x="305" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp = (段数, 剩余)</text>
  <text x="480" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">说明</text>

  <!-- Row 1: 000 -->
  <text x="65" y="100" text-anchor="middle" font-size="12" fill="#555">000</text>
  <text x="170" y="100" text-anchor="middle" font-size="12" fill="#555">{}</text>
  <text x="305" y="100" text-anchor="middle" font-size="12" fill="#333">(1, 3)</text>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#666">初始：1 个空段待用</text>

  <!-- Row 2: 001 -->
  <text x="65" y="130" text-anchor="middle" font-size="12" fill="#555">001</text>
  <text x="170" y="130" text-anchor="middle" font-size="12" fill="#555">{0}</text>
  <text x="305" y="130" text-anchor="middle" font-size="12" fill="#333">(1, 2)</text>
  <text x="480" y="130" text-anchor="middle" font-size="11" fill="#666">放任务0(1)，塞当前段</text>

  <!-- Row 3: 010 -->
  <text x="65" y="160" text-anchor="middle" font-size="12" fill="#555">010</text>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#555">{1}</text>
  <text x="305" y="160" text-anchor="middle" font-size="12" fill="#333">(1, 1)</text>
  <text x="480" y="160" text-anchor="middle" font-size="11" fill="#666">放任务1(2)，塞当前段</text>

  <!-- Row 4: 011 -->
  <text x="65" y="190" text-anchor="middle" font-size="12" fill="#555">011</text>
  <text x="170" y="190" text-anchor="middle" font-size="12" fill="#555">{0,1}</text>
  <text x="305" y="190" text-anchor="middle" font-size="12" fill="#333">(1, 0)</text>
  <text x="480" y="190" text-anchor="middle" font-size="11" fill="#666">1+2=3，装满一段</text>

  <!-- Row 5: 100 -->
  <text x="65" y="220" text-anchor="middle" font-size="12" fill="#555">100</text>
  <text x="170" y="220" text-anchor="middle" font-size="12" fill="#555">{2}</text>
  <text x="305" y="220" text-anchor="middle" font-size="12" fill="#333">(1, 0)</text>
  <text x="480" y="220" text-anchor="middle" font-size="11" fill="#666">放任务2(3)，塞当前段</text>

  <!-- Row 6: 101 (highlighted) -->
  <text x="65" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">101</text>
  <text x="170" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{0,2}</text>
  <text x="305" y="250" text-anchor="middle" font-size="12" fill="#8a6d18" font-weight="bold">(2, 2)</text>
  <text x="480" y="250" text-anchor="middle" font-size="11" fill="#8a6d18">1+3&gt;3 新开段；选留余最大</text>

  <!-- Row 7: 110 -->
  <text x="65" y="280" text-anchor="middle" font-size="12" fill="#555">110</text>
  <text x="170" y="280" text-anchor="middle" font-size="12" fill="#555">{1,2}</text>
  <text x="305" y="280" text-anchor="middle" font-size="12" fill="#333">(2, 1)</text>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#666">2+3&gt;3 新开段；选留余最大</text>

  <!-- Row 8: 111 (answer) -->
  <text x="65" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">111</text>
  <text x="170" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全部</text>
  <text x="305" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(2, 0)</text>
  <text x="480" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案：最少 2 段 ⭐</text>

  <!-- Footnote -->
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#666">关键：r6 两种装法都花 2 段，但留余 2 &gt; 留余 0，更利于后续——故保留 (2, 2)</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#888">（下标从 0 起：任务0=1、任务1=2、任务2=3 小时）</text>
</svg>
