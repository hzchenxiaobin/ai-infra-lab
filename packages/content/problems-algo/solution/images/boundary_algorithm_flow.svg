<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三段分治流程：根 → 左边界 → 叶子 → 右边界(逆序) → 拼接</text>

  <!-- ===== Start ===== -->
  <rect x="140" y="40" width="130" height="30" rx="15" fill="#fff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="60" text-anchor="middle" font-size="12" fill="#333">输入 root</text>
  <line x1="205" y1="70" x2="205" y2="86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: root 为空? ===== -->
  <polygon points="205,88 290,128 205,168 120,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">root 为空?</text>
  <text x="205" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold"></text>
  <!-- 是 branch -->
  <line x1="290" y1="128" x2="376" y2="128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="122" font-size="10" fill="#888">是</text>
  <rect x="378" y="113" width="110" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="433" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return []</text>
  <!-- 否 down -->
  <line x1="205" y1="168" x2="205" y2="184" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="180" font-size="10" fill="#888">否</text>

  <!-- ===== Decision 2: root 有孩子? ===== -->
  <polygon points="205,186 300,226 205,266 110,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">root 有左/右孩子?</text>
  <!-- 否 branch -->
  <line x1="300" y1="226" x2="376" y2="226" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="220" font-size="10" fill="#888">否</text>
  <rect x="378" y="206" width="150" height="40" rx="6" fill="#f0f0f0" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="453" y="223" text-anchor="middle" font-size="10" fill="#666">root 自身是叶子</text>
  <text x="453" y="238" text-anchor="middle" font-size="10" fill="#666">跳过, 交 leaves()</text>
  <!-- 是 down -->
  <line x1="205" y1="266" x2="205" y2="282" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="278" font-size="10" fill="#888">是</text>

  <!-- ===== res.push(root.val) ===== -->
  <rect x="110" y="284" width="190" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="304" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">res.push(root.val)  [根段]</text>
  <line x1="205" y1="314" x2="205" y2="328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ① 左边界 ===== -->
  <rect x="80" y="330" width="250" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 左边界 leftBoundary(root.left)</text>
  <text x="338" y="346" font-size="9" fill="#888">有左走左,否则走右</text>
  <text x="338" y="358" font-size="9" fill="#888">收集非叶, 自顶向下</text>
  <line x1="205" y1="362" x2="205" y2="372" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ② 叶子 ===== -->
  <rect x="80" y="374" width="250" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="393" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 叶子 leaves(root)</text>

  <!-- ③ and ④ placed to the right column to save vertical space -->
  <!-- ===== ③ 右边界 ===== -->
  <rect x="300" y="330" width="250" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 右边界 rightBoundary(root.right)</text>

  <!-- ===== 拼接 return ===== -->
  <rect x="300" y="374" width="250" height="30" rx="15" fill="#fff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="393" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">拼接 root+左+叶+右 → return res</text>

  <!-- connecting arrows between right column boxes -->
  <line x1="425" y1="362" x2="425" y2="372" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge arrow: left column ② feeds into 拼接 (draw a dashed elbow) -->
  <path d="M 330 389 L 360 389 L 360 389 L 300 389" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
