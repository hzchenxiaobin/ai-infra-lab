<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">单调队列优化：滑动窗口求 min g[k]</text>

  <!-- Step 1: Precompute -->
  <rect x="30" y="42" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="62" font-size="12" fill="#446688" filter="url(#rough2)">① 预处理前缀和</text>
  <text x="45" y="80" font-size="11" fill="#555" filter="url(#rough2)">prefixW[i] = 前 i 个箱子总重</text>
  <text x="45" y="94" font-size="11" fill="#555" filter="url(#rough2)">p[i] = 前 i 个箱子间码头切换次数</text>
  <text x="300" y="80" font-size="11" fill="#555" filter="url(#rough2)">→ 两指针求 weight 下界 w_ptr</text>
  <text x="300" y="94" font-size="11" fill="#555" filter="url(#rough2)">→ L_i = max(1, i−maxBoxes+1, w_ptr)</text>

  <!-- Step 2: Sliding window -->
  <rect x="30" y="110" width="500" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="130" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 单调队列维护 g[k] 最小值</text>

  <!-- Window visualization -->
  <text x="45" y="150" font-size="10" fill="#666" filter="url(#rough2)">k:</text>
  <rect x="65" y="138" width="36" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="83" y="153" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">…</text>
  <rect x="105" y="138" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="123" y="153" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L_i</text>
  <rect x="145" y="138" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="163" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">k</text>
  <rect x="185" y="138" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">k+1</text>
  <rect x="225" y="138" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="153" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">i</text>
  <rect x="265" y="138" width="36" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="283" y="153" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">…</text>

  <!-- Bracket for valid range -->
  <path d="M 105 165 L 105 170 L 261 170 L 261 165" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">有效窗口 [L_i, i]</text>

  <!-- Deque visualization -->
  <text x="340" y="150" font-size="10" fill="#666" filter="url(#rough2)">deque：</text>
  <rect x="380" y="138" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">g=2</text>
  <rect x="422" y="138" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="442" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">g=5</text>
  <rect x="464" y="138" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">g=8</text>
  <text x="430" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">↑ 递增，队首=最小</text>

  <!-- Step 3: Transition -->
  <rect x="30" y="194" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="214" font-size="12" fill="#d6a040" filter="url(#rough2)">③ 对每个 i = 1…n 执行：</text>
  <text x="45" y="234" font-size="11" fill="#555" filter="url(#rough2)">a. 更新 w_ptr（weight 下界，单调递增）</text>
  <text x="45" y="250" font-size="11" fill="#555" filter="url(#rough2)">b. 弹出队首过期索引（&lt; L_i）</text>
  <text x="45" y="266" font-size="11" fill="#555" filter="url(#rough2)">c. dp[i] = p[i] + 2 + g[队首]</text>

  <text x="290" y="234" font-size="11" fill="#555" filter="url(#rough2)">d. 计算 g[i+1] = dp[i] − p[i+1]</text>
  <text x="290" y="250" font-size="11" fill="#555" filter="url(#rough2)">e. 弹出队尾所有 g ≥ g[i+1] 的索引</text>
  <text x="290" y="266" font-size="11" fill="#555" filter="url(#rough2)">f. 将 i+1 入队尾</text>

  <!-- Step 4: Why monotonic deque works -->
  <rect x="30" y="278" width="500" height="148" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="298" font-size="12" fill="#b85450" filter="url(#rough2)">④ 为什么单调队列正确？</text>

  <text x="45" y="318" font-size="11" fill="#555" filter="url(#rough2)">▶ 若 j₁ &lt; j₂ 且 g[j₁] ≥ g[j₂]，则 j₁ 永远不可能成为最优：</text>
  <text x="55" y="334" font-size="11" fill="#777" filter="url(#rough2)">j₂ 更晚入窗（更晚过期）且 g 更小 → j₁ 被弹掉无损</text>

  <text x="45" y="356" font-size="11" fill="#555" filter="url(#rough2)">▶ L_i 非递增保证窗口只右移：</text>
  <text x="55" y="372" font-size="11" fill="#777" filter="url(#rough2)">i−maxBoxes+1 随 i 递增；w_ptr 随 prefixW[i] 递增</text>
  <text x="55" y="388" font-size="11" fill="#777" filter="url(#rough2)">→ 标准「滑动窗口最小值」模型，O(n) 总开销</text>

  <text x="45" y="410" font-size="11" fill="#b85450" filter="url(#rough2)">▶ 每个索引至多入队一次、出队一次 → 总 O(n)</text>
</svg>
