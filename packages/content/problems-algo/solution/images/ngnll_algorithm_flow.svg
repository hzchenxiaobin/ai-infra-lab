<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历链表取值 → 单调栈结算 → 入栈</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">栈存下标，值递减；新值严格大于栈顶则弹栈写 answer[top]=当前值</text>

  <!-- Step 1: 链表取值 -->
  <rect x="200" y="60" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 遍历链表 → vals[]，n=len</text>
  <path d="M 280 96 L 280 116" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 初始化 -->
  <rect x="200" y="116" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② answer=[0]*n，stack=[]</text>
  <path d="M 280 152 L 280 172" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for i in 0..n-1 -->
  <rect x="190" y="172" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ for i = 0 .. n-1：v = vals[i]</text>
  <path d="M 280 208 L 280 228" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: stack非空 且 v > vals[stack.top()]? -->
  <polygon points="280,228 400,268 280,308 160,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">stack 非空</text>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">且 v &gt; vals[top]?</text>

  <!-- Yes branch: pop -->
  <path d="M 400 268 L 440 268" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="262" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="250" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">top=stack.pop()</text>
  <text x="495" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">answer[top]=v</text>
  <!-- loop back to decision -->
  <path d="M 495 250 L 495 220 L 280 220 L 280 228" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="214" font-size="9" fill="#b85450">继续判栈顶</text>

  <!-- No branch: push i -->
  <path d="M 160 268 L 120 268" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="262" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="250" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">stack.push(i)</text>
  <!-- back to for -->
  <path d="M 70 250 L 70 190 L 190 190" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="184" font-size="9" fill="#4a7a3a">下一个 i</text>

  <!-- End -->
  <path d="M 280 308 L 280 332" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="326" font-size="9" fill="#888">i 遍历完</text>
  <rect x="190" y="332" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 返回 answer（剩余项已是 0）</text>

  <!-- note -->
  <rect x="30" y="388" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="408" font-size="10" fill="#555">要点：</text>
  <text x="50" y="424" font-size="10" fill="#555">① 链表先取值，解耦输入与栈处理；② 栈存下标（回写 answer 需要位置）；③ 结算写「值」answer[top]=v</text>
  <text x="50" y="438" font-size="10" fill="#d6a040" font-weight="bold">每个元素入栈 1 次 + 出栈 1 次，while 总弹出 ≤ n → 整体 O(n)</text>
</svg>
