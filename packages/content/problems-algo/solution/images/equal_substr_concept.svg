<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转化：把"改字符"问题变成"开销数组的滑动窗口"</text>

  <!-- Row 1: s string -->
  <text x="40" y="66" font-size="12" fill="#888">s:</text>
  <rect x="120" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="72" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="196" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="72" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="272" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="348" y="50" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="72" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>

  <!-- vertical arrows s -> t with cost labels -->
  <path d="M 148 86 L 148 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 86 L 224 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 86 L 300 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 376 86 L 376 110" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cost labels between rows -->
  <text x="148" y="102" text-anchor="middle" font-size="9" fill="#b85450">|a−b|=1</text>
  <text x="224" y="102" text-anchor="middle" font-size="9" fill="#b85450">|b−c|=1</text>
  <text x="300" y="102" text-anchor="middle" font-size="9" fill="#b85450">|c−d|=1</text>
  <text x="376" y="102" text-anchor="middle" font-size="9" fill="#b85450">|d−f|=2</text>

  <!-- Row 2: t string -->
  <text x="40" y="132" font-size="12" fill="#888">t:</text>
  <rect x="120" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="272" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="348" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">f</text>

  <!-- separator -->
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#888">↓ 逐位求绝对差，得到"开销数组"</text>

  <!-- Row 3: cost array -->
  <text x="40" y="216" font-size="12" fill="#888">cost:</text>
  <rect x="120" y="198" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="196" y="198" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="198" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="348" y="198" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- sliding window bracket over first 3 costs -->
  <path d="M 120 240 Q 120 250 128 250 L 320 250 Q 328 250 328 240" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="224" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口 [1,1,1]：sum=3 ≤ maxCost=3 ✓</text>

  <!-- left/right pointers -->
  <text x="148" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left</text>
  <path d="M 148 290 L 148 294" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">right</text>
  <path d="M 300 290 L 300 294" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- max length label -->
  <text x="460" y="262" font-size="11" fill="#888">max = 3 ⭐</text>

  <!-- Core idea box -->
  <rect x="40" y="312" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察：cost[i] = |s[i] − t[i]| ≥ 0，开销数组天然非负</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666">→ "sum ≤ maxCost 的最长子数组" = 标准滑动窗口（单调性成立）</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#888">right 扩张累加 sum；sum 超预算时 left 收缩；答案 = 窗口最大宽度</text>
</svg>
