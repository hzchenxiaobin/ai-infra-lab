<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：位掩码编码分配状态 + 分组不兼容性</text>

  <!-- nums array with indices -->
  <text x="42" y="72" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="93" y="50" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx0</text>
  <rect x="72" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="50" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx1</text>
  <rect x="114" y="56" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="177" y="50" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx2</text>
  <rect x="156" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="219" y="50" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx3</text>
  <rect x="198" y="56" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- bitmask representation (right) -->
  <text x="370" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">mask（4 位，每位对应一个元素）</text>
  <rect x="310" y="56" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="338" y="56" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="366" y="56" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="394" y="56" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="430" y="76" font-size="10" fill="#888" filter="url(#rough2)">= 全分配</text>

  <!-- partition label -->
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">划分成 k=2 组，每组 m=2 个，组内无重复</text>

  <!-- Group A -->
  <rect x="50" y="126" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="146" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">组 A: {idx0, idx1}</text>
  <rect x="62" y="154" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="83" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="154" width="42" height="24" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="131" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="170" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">inc=1</text>
  <text x="206" y="170" font-size="9" fill="#888" filter="url(#rough2)">max−min</text>

  <!-- Group B -->
  <rect x="290" y="126" width="200" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="146" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组 B: {idx2, idx3}</text>
  <rect x="302" y="154" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="323" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="154" width="42" height="24" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="371" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="410" y="170" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">inc=3</text>
  <text x="446" y="170" font-size="9" fill="#888" filter="url(#rough2)">max−min</text>

  <!-- total -->
  <rect x="150" y="198" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">总不兼容性 = 1 + 3 = 4</text>

  <!-- key insight box -->
  <rect x="40" y="244" width="460" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">关键信号：n ≤ 16 → 状压 DP 甜区</text>
  <text x="60" y="288" font-size="11" fill="#333" filter="url(#rough2)">① 预处理所有「大小为 m、无重复值」的合法组，inc = max − min</text>
  <text x="60" y="308" font-size="11" fill="#333" filter="url(#rough2)">② dp[mask] = 已分配 mask 中元素的最小不兼容性和</text>
  <text x="60" y="328" font-size="11" fill="#333" filter="url(#rough2)">③ 转移：固定最低未选位 b，只枚举含 b 的合法组</text>
  <text x="60" y="348" font-size="11" fill="#b85450" filter="url(#rough2)">   → 每种划分恰好计数一次，避免 k! 重复</text>
</svg>
