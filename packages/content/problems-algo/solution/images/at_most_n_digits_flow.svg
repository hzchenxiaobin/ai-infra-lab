<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：幂次求和 + 逐位前缀匹配</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333">开始：输入 digits, n</text>
  <path d="M 280 72 L 280 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="130" y="92" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#333">m=len(D)；s=str(n)；k=len(s)；ans=0</text>
  <path d="M 280 126 L 280 142" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: 幂次求和 ===== -->
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 位数 &lt; k 的全部有效</text>

  <rect x="100" y="160" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i = 1 .. k−1 :  ans += m^i</text>
  <path d="M 280 200 L 280 216" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: 逐位匹配 ===== -->
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 位数 = k：逐位前缀匹配</text>

  <rect x="60" y="240" width="440" height="220" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="140" y="248" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#333">for i = 0 .. k−1：</text>
  <path d="M 280 278 L 280 292" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- c = s[i] -->
  <rect x="150" y="294" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#333">c = int(s[i])；less = |{d∈D : d&lt;c}|</text>
  <path d="M 280 324 L 280 338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans += less * m^(k-1-i) -->
  <rect x="120" y="340" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += less × m^(k−1−i)</text>
  <path d="M 280 374 L 280 388" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c in D? -->
  <path d="M 280 390 L 380 424 L 280 458 L 180 424 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#333">c ∈ D ?</text>

  <!-- 是 → continue loop -->
  <path d="M 380 424 L 430 424 L 430 263 L 420 263" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="438" y="345" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="438" y="360" font-size="10" fill="#4a7a3a">下一位</text>

  <!-- 否 → break to return -->
  <path d="M 180 424 L 90 424 L 90 510 L 200 510" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="418" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="96" y="470" font-size="10" fill="#b85450">break</text>

  <!-- ===== loop 正常结束 → +1 ===== -->
  <path d="M 280 458 L 280 484" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="476" font-size="10" fill="#4a7a3a">循环完成</text>

  <rect x="160" y="486" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="508" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += 1　（n 本身可被组成）</text>

  <!-- merge to return -->
  <path d="M 280 520 L 280 540" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 520 L 280 540" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="190" y="542" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="563" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return ans</text>

  <!-- note -->
  <rect x="60" y="586" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.6"/>
  <text x="280" y="604" text-anchor="middle" font-size="10" fill="#d6a040">⚠ 第二部分每位的「小于分支」后位任意 → 贡献 less×m^(k−1−i)，等于分支才需续接</text>
</svg>
