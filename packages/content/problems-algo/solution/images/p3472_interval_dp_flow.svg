<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：区间 DP 加一维预算 —— dp[i][j][c]</text>

  <rect x="125" y="28" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="235" y="45" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">初始化：dp[i][i][c] = 1（∀c）</text>

  <path d="M 235 54 L 235 64" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="30" y="64" width="460" height="180" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55677d" filter="url(#rough2)">按区间长度 len = 2 … n 枚举所有 (i, j)（更短区间先算好）</text>

  <rect x="70" y="88" width="330" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="105" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dist ← min( |s[i]−s[j]|, 26−|s[i]−s[j]| )</text>

  <path d="M 235 114 L 235 120" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="120" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="133" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">对预算 c = 0 … k 逐个计算</text>
  <text x="235" y="148" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">base ← max( dp[i+1][j][c], dp[i][j−1][c] )　弃左 / 弃右</text>

  <path d="M 235 154 L 235 160" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="235,160 320,194 235,228 150,194" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="198" text-anchor="middle" font-size="10.5" fill="#8f3a35" filter="url(#rough2)">dist ≤ c ？</text>

  <!-- yes branch -->
  <path d="M 320 194 L 342 194" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="328" y="186" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="344" y="168" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="419" y="183" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">配对：dp[i+1][j−1]</text>
    <text x="419" y="197" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">[c−dist] + 2</text>
    <text x="419" y="212" text-anchor="middle" font-size="8.5" fill="#2f5d24">花掉 dist，两端作外壳</text>
  </g>

  <!-- no branch -->
  <path d="M 235 228 L 235 244" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="243" y="241" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- pair box joins the merge -->
  <path d="M 419 220 L 419 259 L 353 259" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- merge box -->
  <rect x="120" y="244" width="230" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">dp[i][j][c] ← max( base, 配对 )</text>

  <path d="M 235 274 L 235 284" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="155" y="284" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="235" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 dp[0][n−1][k]</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="318" width="220" height="36" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="150" y="332" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b">时间 O(n²k) ≈ 8×10⁶，空间 O(n²k)</text>
    <text x="150" y="345" text-anchor="middle" font-size="8.5" fill="#55677d">按 len 滚动两层可降到 O(nk)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="280" y="318" width="220" height="36" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="390" y="332" text-anchor="middle" font-size="9" font-weight="bold" fill="#8f3a35">k = 0 时退化为 516 经典 LPS</text>
    <text x="390" y="345" text-anchor="middle" font-size="8.5" fill="#55677d">dp[i][j][c] 关于 c 单调不减</text>
  </g>
</svg>
