<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：滚动 DP —— 拷贝即「都不进」，非零状态补两条入队转移</text>

  <!-- 初始化 -->
  <rect x="95" y="46" width="160" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="65" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">V = max(nums) ≤ 200</text>
  <text x="175" y="82" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">dp[0][0] = 1，其余为 0</text>

  <path d="M 175 92 L 175 102" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判定菱形 -->
  <polygon points="175,102 237,130 175,158 113,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="135" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有元素 x？</text>

  <!-- 否 → 答案 -->
  <path d="M 237 130 L 296 130" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="122" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="300" y="98" width="196" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="398" y="120" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = Σ dp[g][g]（g≥1）</text>
  <text x="398" y="140" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">mod 10⁹+7 输出</text>
  <text x="398" y="156" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">对角线 = 两序列 gcd 相等</text>

  <!-- 是 ↓ -->
  <path d="M 175 158 L 175 170" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="168" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 拷贝 -->
  <rect x="95" y="172" width="160" height="42" fill="#f0f0f0" stroke="#888" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="190" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">ndp ← dp 整表拷贝</text>
  <text x="175" y="206" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">一步吸收全部分支③「都不进」</text>

  <path d="M 175 214 L 175 226" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描 -->
  <rect x="95" y="228" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="246" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">for g1, g2 ∈ [0, V]</text>
  <text x="175" y="262" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">跳过零状态，取 v = dp[g1][g2]</text>

  <path d="M 175 270 L 175 282" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两条转移 -->
  <rect x="95" y="284" width="160" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="302" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">ndp[gcd(g1,x)][g2] += v  ①</text>
  <text x="175" y="320" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">ndp[g1][gcd(g2,x)] += v  ②</text>

  <path d="M 175 330 L 175 342" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 滚动切换 -->
  <rect x="95" y="344" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="368" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp ↔ ndp 滚动切换</text>

  <!-- 回到判定 -->
  <path d="M 95 363 L 48 363 L 48 130 L 109 130" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="248" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)" transform="rotate(-90 44 248)">下一个 x</text>

  <!-- 规模速记 -->
  <rect x="300" y="188" width="196" height="122" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="314" y="208" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">📌 规模速记</text>
  <text x="314" y="228" font-size="10" fill="#555" filter="url(#rough2)">· 状态表 (V+1)² ≈ 4 万格</text>
  <text x="314" y="246" font-size="10" fill="#555" filter="url(#rough2)">· 总转移 ≈ 2.4×10⁷ 次</text>
  <text x="314" y="264" font-size="10" fill="#555" filter="url(#rough2)">· 预计算 gcd 表后 O(1) 查表</text>
  <text x="314" y="282" font-size="10" fill="#555" filter="url(#rough2)">· C++ 约 110 ms</text>
  <text x="314" y="300" font-size="10" fill="#555" filter="url(#rough2)">· Python 约 0.8 s</text>
</svg>
