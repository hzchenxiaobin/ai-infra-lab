<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">元音计数定去留：与第一个单词同数 ⇒ 整词反转</text>

  <!-- ① 第一个单词 cat：定基准 -->
  <text x="26" y="58" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① 第一个单词（只定基准，永不反转）</text>

  <rect x="26" y="66" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="66" y="66" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="66" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="44" y="88">c</text>
    <text x="84" y="88">a</text>
    <text x="124" y="88">t</text>
  </g>

  <text x="170" y="78" font-size="13" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">元音数 k = 1</text>
  <text x="170" y="96" font-size="10.5" fill="#888"
        filter="url(#rough2)">元音 = a·e·i·o·u（y 不算）</text>

  <!-- ② and：命中反转 -->
  <text x="26" y="152" font-size="12.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">② 后续单词 and：元音数 1 = k ⇒ 命中，整词反转</text>

  <rect x="26" y="160" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="66" y="160" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="160" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="44" y="182">a</text>
    <text x="84" y="182">n</text>
    <text x="124" y="182">d</text>
  </g>

  <path d="M 152 177 L 178 177" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="165" y="168" text-anchor="middle" font-size="10" fill="#b85450"
        filter="url(#rough2)">rev</text>

  <rect x="188" y="160" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="160" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="160" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="206" y="182">d</text>
    <text x="246" y="182">n</text>
    <text x="286" y="182">a</text>
  </g>

  <text x="318" y="182" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">⇒ "dna"</text>

  <!-- ③ mice：不命中保持 -->
  <text x="26" y="244" font-size="12.5" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">③ 后续单词 mice：元音数 2 ≠ k ⇒ 保持不变</text>

  <rect x="26" y="252" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="66" y="252" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="252" width="36" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="252" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="44" y="274">m</text>
    <text x="84" y="274">i</text>
    <text x="124" y="274">c</text>
    <text x="164" y="274">e</text>
  </g>

  <text x="200" y="274" font-size="11" fill="#b85450"
        filter="url(#rough2)">原样保留，谁也不动</text>

  <!-- 底部总结 -->
  <rect x="40" y="306" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">判定（元音计数）与变换（整词反转）解耦：先数后翻</text>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">每个字符最多被访问 2 次 ⇒ 整体 O(n)，n ≤ 10⁵ 轻松通过</text>
</svg>
