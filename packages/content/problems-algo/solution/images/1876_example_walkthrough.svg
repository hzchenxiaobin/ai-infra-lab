<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "aababcabc" 逐窗口判定</text>
  <text x="330" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7 个长度为 3 的窗口，红字 = 重复字符，绿行 = 好子串</text>

  <!-- Header row -->
  <rect x="20" y="52" width="620" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="48" y="69">i</text>
    <text x="120" y="69">窗口</text>
    <text x="220" y="69">s[i]</text>
    <text x="270" y="69">s[i+1]</text>
    <text x="320" y="69">s[i+2]</text>
    <text x="420" y="69">两两不同?</text>
    <text x="560" y="69">ans</text>
  </g>

  <!-- Row i=0: aab -> a dup -> no -> 0 -->
  <rect x="20" y="78" width="620" height="22" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="93" fill="#555" font-weight="bold">0</text>
    <text x="120" y="93" fill="#888">aab</text>
    <text x="220" y="93" fill="#b85450" font-weight="bold">a</text>
    <text x="270" y="93" fill="#b85450" font-weight="bold">a</text>
    <text x="320" y="93" fill="#446688" font-weight="bold">b</text>
    <text x="420" y="93" fill="#b85450" font-weight="bold">否（a=a）</text>
    <text x="560" y="93" fill="#aaa">0</text>
  </g>

  <!-- Row i=1: aba -> a dup -> no -> 0 -->
  <rect x="20" y="100" width="620" height="22" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="115" fill="#555" font-weight="bold">1</text>
    <text x="120" y="115" fill="#888">aba</text>
    <text x="220" y="115" fill="#b85450" font-weight="bold">a</text>
    <text x="270" y="115" fill="#446688" font-weight="bold">b</text>
    <text x="320" y="115" fill="#b85450" font-weight="bold">a</text>
    <text x="420" y="115" fill="#b85450" font-weight="bold">否（a=a）</text>
    <text x="560" y="115" fill="#aaa">0</text>
  </g>

  <!-- Row i=2: bab -> b dup -> no -> 0 -->
  <rect x="20" y="122" width="620" height="22" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="137" fill="#555" font-weight="bold">2</text>
    <text x="120" y="137" fill="#888">bab</text>
    <text x="220" y="137" fill="#b85450" font-weight="bold">b</text>
    <text x="270" y="137" fill="#446688" font-weight="bold">a</text>
    <text x="320" y="137" fill="#b85450" font-weight="bold">b</text>
    <text x="420" y="137" fill="#b85450" font-weight="bold">否（b=b）</text>
    <text x="560" y="137" fill="#aaa">0</text>
  </g>

  <!-- Row i=3: abc -> all distinct -> yes -> 1 -->
  <rect x="20" y="144" width="620" height="22" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="159" fill="#555" font-weight="bold">3</text>
    <text x="120" y="159" fill="#4a7a3a" font-weight="bold">abc</text>
    <text x="220" y="159" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="270" y="159" fill="#4a7a3a" font-weight="bold">b</text>
    <text x="320" y="159" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="420" y="159" fill="#4a7a3a" font-weight="bold">是 ✓</text>
    <text x="560" y="159" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- Row i=4: bca -> all distinct -> yes -> 2 -->
  <rect x="20" y="166" width="620" height="22" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="181" fill="#555" font-weight="bold">4</text>
    <text x="120" y="181" fill="#4a7a3a" font-weight="bold">bca</text>
    <text x="220" y="181" fill="#4a7a3a" font-weight="bold">b</text>
    <text x="270" y="181" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="320" y="181" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="420" y="181" fill="#4a7a3a" font-weight="bold">是 ✓</text>
    <text x="560" y="181" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- Row i=5: cab -> all distinct -> yes -> 3 -->
  <rect x="20" y="188" width="620" height="22" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="203" fill="#555" font-weight="bold">5</text>
    <text x="120" y="203" fill="#4a7a3a" font-weight="bold">cab</text>
    <text x="220" y="203" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="270" y="203" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="320" y="203" fill="#4a7a3a" font-weight="bold">b</text>
    <text x="420" y="203" fill="#4a7a3a" font-weight="bold">是 ✓</text>
    <text x="560" y="203" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- Row i=6: abc -> all distinct -> yes -> 4 -->
  <rect x="20" y="210" width="620" height="22" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="48" y="225" fill="#555" font-weight="bold">6</text>
    <text x="120" y="225" fill="#4a7a3a" font-weight="bold">abc</text>
    <text x="220" y="225" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="270" y="225" fill="#4a7a3a" font-weight="bold">b</text>
    <text x="320" y="225" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="420" y="225" fill="#4a7a3a" font-weight="bold">是 ✓</text>
    <text x="560" y="225" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- Summary -->
  <rect x="60" y="250" width="540" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">前 3 个窗口均含重复 → ans 停在 0；后 4 个窗口三字符两两不同</text>
  <text x="330" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">注意 i=3 与 i=6 都是 "abc"，但来自不同位置，各计一次</text>

  <!-- Result -->
  <rect x="150" y="312" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="335" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 ans = 4 ✓</text>

  <!-- Note -->
  <rect x="80" y="360" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="380" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">相同的好子串出现在不同位置，每次都要计入答案</text>
</svg>
