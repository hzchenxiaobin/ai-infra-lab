<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">双栈法核心：运算符栈 + 节点栈 → 表达式树</text>

  <!-- Expression -->
  <rect x="170" y="40" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">中缀表达式：2 * 3 − 4 * 5</text>

  <!-- Key moment label -->
  <text x="280" y="86" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">遇到 '−'：栈顶 '*' 优先级 (2) ≥ '−' (1) → 弹出并建树</text>

  <!-- op_stack (before) -->
  <text x="95" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">运算符栈</text>
  <rect x="65" y="114" width="60" height="66" fill="none" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="73" y="146" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">*</text>

  <!-- node_stack (before) -->
  <text x="205" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">节点栈</text>
  <rect x="175" y="114" width="60" height="66" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="183" y="146" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="164" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="183" y="118" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="136" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Arrows: pop op from op_stack -->
  <path d="M 129 159 L 245 159" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="154" text-anchor="middle" font-size="9.5" fill="#b85450">pop op: *</text>

  <!-- Arrows: pop nodes from node_stack -->
  <path d="M 239 159 L 252 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 239 131 L 252 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="128" font-size="9" fill="#4a7a3a">pop left: 2</text>
  <text x="258" y="172" font-size="9" fill="#4a7a3a">pop right: 3</text>

  <!-- Build operation box -->
  <rect x="255" y="120" width="90" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">建树节点</text>
  <text x="300" y="158" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">(* 2 3)</text>
  <text x="300" y="172" text-anchor="middle" font-size="9" fill="#888">push → 节点栈</text>

  <!-- Arrow to final tree -->
  <path d="M 345 148 L 375 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final tree -->
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终表达式树</text>
  <!-- Root: - -->
  <circle cx="460" cy="128" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−</text>
  <!-- Left: * -->
  <circle cx="420" cy="172" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">*</text>
  <!-- Right: * -->
  <circle cx="500" cy="172" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">*</text>
  <!-- Edges from root -->
  <path d="M 450 138 L 428 161" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 138 L 492 161" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- Leaves -->
  <rect x="398" y="196" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="210" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="422" y="196" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="210" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="478" y="196" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="489" y="210" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="502" y="196" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="513" y="210" text-anchor="middle" font-size="10" fill="#333">5</text>
  <!-- Edges to leaves -->
  <path d="M 414 183 L 409 196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 426 183 L 433 196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 494 183 L 489 196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 506 183 L 513 196" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 40 232 L 520 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Precedence table -->
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">运算符优先级与处理规则</text>

  <rect x="50" y="270" width="210" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">优先级表</text>
  <text x="68" y="308" font-size="11.5" fill="#555">+ , −  →  优先级 1（低）</text>
  <text x="68" y="326" font-size="11.5" fill="#555">* , /  →  优先级 2（高）</text>

  <rect x="280" y="270" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">处理规则</text>
  <text x="296" y="308" font-size="11" fill="#555">遇运算符：弹出 <tspan fill="#b85450" font-weight="bold">prec ≥ 当前</tspan> 的栈顶并建树</text>
  <text x="296" y="326" font-size="11" fill="#555">遇 ')'：弹出至 '(' 的所有运算符并建树</text>

  <!-- Key insight -->
  <rect x="50" y="346" width="460" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键：弹出运算符 op 时，从节点栈弹出 right、left 两个子树</text>
  <text x="280" y="384" text-anchor="middle" font-size="11.5" fill="#555">创建 Node(op, left, right) 并 push 回节点栈 → 子表达式变子树</text>
</svg>
