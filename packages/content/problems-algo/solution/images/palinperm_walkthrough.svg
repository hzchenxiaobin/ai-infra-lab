<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：carerac（true）vs code（false）</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">统计每个字母出现次数，数其中奇数个的字母有几枚</text>

  <!-- ====== Example 1: carerac ====== -->
  <text x="20" y="68" font-size="11" fill="#446688" font-weight="bold">例1 s = "carerac"</text>
  <g font-size="11">
    <rect x="20" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="33" y="92" text-anchor="middle" fill="#333">c</text>
    <rect x="48" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="61" y="92" text-anchor="middle" fill="#333">a</text>
    <rect x="76" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="89" y="92" text-anchor="middle" fill="#333">r</text>
    <rect x="104" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="117" y="92" text-anchor="middle" fill="#333">e</text>
    <rect x="132" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="145" y="92" text-anchor="middle" fill="#333">r</text>
    <rect x="160" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="173" y="92" text-anchor="middle" fill="#333">a</text>
    <rect x="188" y="76" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="201" y="92" text-anchor="middle" fill="#333">c</text>
  </g>

  <!-- freq table header -->
  <text x="20" y="120" font-size="10.5" fill="#888">频次：</text>
  <g font-size="10.5">
    <rect x="62" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="82" y="123" text-anchor="middle" fill="#888">a</text>
    <rect x="104" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="124" y="123" text-anchor="middle" fill="#888">c</text>
    <rect x="146" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="166" y="123" text-anchor="middle" fill="#888">e</text>
    <rect x="188" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="208" y="123" text-anchor="middle" fill="#888">r</text>

    <!-- counts -->
    <rect x="62" y="132" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="147" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="104" y="132" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="124" y="147" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="146" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="166" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="188" y="132" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="208" y="147" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <text x="244" y="125" font-size="10" fill="#555">奇数：e（1 枚）</text>
  <text x="244" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold">odd = 1 ≤ 1</text>

  <rect x="62" y="162" width="166" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="5" filter="url(#rough2)"/>
  <text x="145" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true ✓ 可排成 "racecar"</text>

  <!-- ====== Example 2: code ====== -->
  <text x="300" y="68" font-size="11" fill="#b85450" font-weight="bold">例2 s = "code"</text>
  <g font-size="11">
    <rect x="300" y="76" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="313" y="92" text-anchor="middle" fill="#333">c</text>
    <rect x="328" y="76" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="341" y="92" text-anchor="middle" fill="#333">o</text>
    <rect x="356" y="76" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="369" y="92" text-anchor="middle" fill="#333">d</text>
    <rect x="384" y="76" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="397" y="92" text-anchor="middle" fill="#333">e</text>
  </g>

  <text x="300" y="120" font-size="10.5" fill="#888">频次：</text>
  <g font-size="10.5">
    <rect x="342" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="362" y="123" text-anchor="middle" fill="#888">c</text>
    <rect x="384" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="404" y="123" text-anchor="middle" fill="#888">d</text>
    <rect x="426" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="446" y="123" text-anchor="middle" fill="#888">e</text>
    <rect x="468" y="108" width="40" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="488" y="123" text-anchor="middle" fill="#888">o</text>

    <rect x="342" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="362" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="384" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="404" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="426" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="446" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="468" y="132" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="488" y="147" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <text x="524" y="125" font-size="10" fill="#555">奇数：</text>
  <text x="524" y="142" font-size="10.5" fill="#b85450" font-weight="bold">odd = 4 &gt; 1</text>

  <rect x="342" y="162" width="166" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="5" filter="url(#rough2)"/>
  <text x="425" y="180" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">false ✗ 4 个奇放不下</text>

  <!-- divider -->
  <path d="M 280 60 L 280 200" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ====== bottom: why >=2 odd fails ====== -->
  <rect x="40" y="210" width="480" height="170" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">为什么「≥2 个奇」必败？回文中心只能容纳 1 个奇</text>

  <!-- palindrome skeleton -->
  <text x="60" y="262" font-size="10.5" fill="#888">回文骨架：左半镜像右半，正中至多 1 格</text>

  <g font-size="11">
    <!-- left half pairs -->
    <rect x="80" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="95" y="290" text-anchor="middle" fill="#333">x</text>
    <rect x="112" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="127" y="290" text-anchor="middle" fill="#333">y</text>
    <!-- center -->
    <rect x="144" y="272" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="159" y="290" text-anchor="middle" fill="#d6a040" font-weight="bold">?</text>
    <!-- right half mirror -->
    <rect x="176" y="272" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="191" y="290" text-anchor="middle" fill="#333">y</text>
    <rect x="208" y="272" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="223" y="290" text-anchor="middle" fill="#333">x</text>
  </g>

  <text x="95" y="312" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="127" y="312" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="159" y="312" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">奇·仅1</text>
  <text x="191" y="312" text-anchor="middle" font-size="9" fill="#4a7a3a">偶</text>
  <text x="223" y="312" text-anchor="middle" font-size="9" fill="#4a7a3a">偶</text>

  <!-- explanation text -->
  <text x="280" y="262" font-size="10.5" fill="#555">每个成对字符占左右各 1 格 → 频次为偶；</text>
  <text x="280" y="280" font-size="10.5" fill="#555">正中只有 1 格 → 只能容纳 1 个奇数次字符。</text>
  <text x="280" y="298" font-size="10.5" fill="#b85450" font-weight="bold">若有 2 个奇，第 2 个奇无处可放 → 必败。</text>

  <rect x="280" y="312" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="390" y="330" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">判定式：odd ≤ 1</text>
  <text x="390" y="346" text-anchor="middle" font-size="9.5" fill="#888">统一覆盖偶长度(0)/奇长度(1)</text>
</svg>
