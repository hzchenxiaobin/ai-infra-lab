<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,null,4]</text>

  <!-- ===== 左侧：原树 ===== -->
  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#888">原二叉树</text>
  <g filter="url(#rough2)">
    <circle cx="130" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <circle cx="90" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="145" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <line x1="118" y1="96" x2="98" y2="128" stroke="#446688" stroke-width="1.2"/>
    <circle cx="170" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="170" y="145" text-anchor="middle" font-size="11" fill="#446688">3</text>
    <line x1="142" y1="96" x2="162" y2="128" stroke="#446688" stroke-width="1.2"/>
    <!-- null 左 -->
    <circle cx="62" cy="196" r="12" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="62" y="201" text-anchor="middle" font-size="9" fill="#b85450">×</text>
    <line x1="82" y1="152" x2="66" y2="184" stroke="#b85450" stroke-width="1.1" stroke-dasharray="2,2"/>
    <!-- 4 -->
    <circle cx="118" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="118" y="201" text-anchor="middle" font-size="10" fill="#446688">4</text>
    <line x1="98" y1="152" x2="114" y2="184" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="62" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">左空</text>

  <!-- 箭头到过程 -->
  <path d="M 220 140 L 270 140" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="245" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">递归</text>

  <!-- ===== 右侧：递归展开过程 ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#888">递归展开</text>

  <!-- dfs(1) -->
  <rect x="300" y="68" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="88" font-size="10" fill="#446688" font-weight="bold">dfs(1):</text>
  <text x="360" y="88" font-size="10" fill="#333" font-family="monospace">res="1" + 左子 + 右子</text>

  <!-- dfs(2) -->
  <rect x="320" y="108" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="128" font-size="10" fill="#d6a040" font-weight="bold">dfs(2):</text>
  <text x="370" y="128" font-size="10" fill="#333" font-family="monospace">res="2" + 左 + 右</text>

  <!-- dfs(null) 左 -->
  <rect x="340" y="148" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="166" text-anchor="middle" font-size="9" fill="#b85450">dfs(null)→""</text>
  <text x="352" y="166" font-size="9" fill="#b85450" font-weight="bold">左</text>

  <!-- dfs(4) -->
  <rect x="340" y="180" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="352" y="198" font-size="9" fill="#4a7a3a" font-weight="bold">右</text>
  <text x="400" y="198" font-size="9" fill="#333" font-family="monospace">dfs(4): res="4" (叶子,无括号)</text>

  <!-- 回填 dfs(2) -->
  <rect x="320" y="214" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="232" text-anchor="middle" font-size="9" fill="#d6a040" font-family="monospace">→ "2" + "()" + "(4)" = "2()(4)"</text>
  <text x="330" y="232" font-size="9" fill="#b85450" font-weight="bold">⚠左空必留()</text>

  <!-- dfs(3) -->
  <rect x="320" y="250" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="268" font-size="10" fill="#4a7a3a" font-weight="bold">dfs(3):</text>
  <text x="370" y="268" font-size="9" fill="#333" font-family="monospace">res="3" (叶子,无括号)</text>

  <!-- 回填 dfs(1) -->
  <rect x="300" y="288" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="308" text-anchor="middle" font-size="10" fill="#446688" font-family="monospace">→ "1" + "(2()(4))" + "(3)"</text>

  <!-- 箭头到结果 -->
  <path d="M 300 303 L 230 303 L 230 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 底部：最终结果 ===== -->
  <rect x="60" y="340" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="365" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">"1(2()(4))(3)"</text>

  <!-- 标注 -->
  <rect x="60" y="395" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="415" font-size="10" fill="#d6a040" font-weight="bold">关键点：</text>
  <text x="80" y="432" font-size="10" fill="#555">节点2有右子4但左子为空 → 左子位置必须写 "()" 占位</text>
  <text x="80" y="446" font-size="10" fill="#555">否则 "1(2(4))(3)" 会被误读为 4 是 2 的左子 → 破坏一一映射</text>
</svg>
