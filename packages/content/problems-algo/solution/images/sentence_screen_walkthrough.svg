<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：rows=3, cols=6, sentence=[a, bcd, e]</text>

  <!-- ===== s reference band ===== -->
  <text x="20" y="58" font-size="11" fill="#888">s =</text>
  <!-- 8 boxes width 34, x=52 -->
  <rect x="52" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="69" y="62" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="86" y="44" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="103" y="62" text-anchor="middle" font-size="10" fill="#888">·</text>
  <rect x="120" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="137" y="62" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="154" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="171" y="62" text-anchor="middle" font-size="11" fill="#333">c</text>
  <rect x="188" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="205" y="62" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="222" y="44" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="239" y="62" text-anchor="middle" font-size="10" fill="#888">·</text>
  <rect x="256" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="273" y="62" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="290" y="44" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="62" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">·</text>
  <text x="332" y="62" font-size="11" fill="#b85450" font-weight="bold">m=8</text>
  <text x="52" y="82" font-size="9" fill="#999">0</text>
  <text x="86" y="82" font-size="9" fill="#999">1</text>
  <text x="120" y="82" font-size="9" fill="#999">2</text>
  <text x="154" y="82" font-size="9" fill="#999">3</text>
  <text x="188" y="82" font-size="9" fill="#999">4</text>
  <text x="222" y="82" font-size="9" fill="#999">5</text>
  <text x="256" y="82" font-size="9" fill="#999">6</text>
  <text x="290" y="82" font-size="9" fill="#b85450" font-weight="bold">7</text>

  <!-- ===== Row 0 ===== -->
  <rect x="20" y="96" width="500" height="92" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="32" y="114" font-size="11" fill="#446688" font-weight="bold">第 0 行</text>
  <text x="32" y="132" font-size="10.5" fill="#333">cur=0 → +6 = 6 ； s[6]='e'(词中) → 回退到 s[5]=' ' 停 → cur=6</text>
  <!-- screen cells: a · b c d · (6 green) -->
  <rect x="70" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="161" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="112" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="161" text-anchor="middle" font-size="11" fill="#888">·</text>
  <rect x="154" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="161" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="196" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="161" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="238" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="161" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="280" y="142" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="161" text-anchor="middle" font-size="11" fill="#888">·</text>
  <text x="332" y="161" font-size="10" fill="#4a7a3a">= "a-bcd-"</text>

  <!-- ===== Row 1 ===== -->
  <rect x="20" y="196" width="500" height="92" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="32" y="214" font-size="11" fill="#446688" font-weight="bold">第 1 行</text>
  <text x="32" y="232" font-size="10.5" fill="#333">cur=6 → +6 = 12 ； s[12%8]=s[4]='d'(词中) → 回退到 10 (s[1]=' ') → cur=10</text>
  <!-- screen cells: e · a · _ _ (4 green + 2 gray padding) -->
  <rect x="70" y="242" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="261" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="112" y="242" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="261" text-anchor="middle" font-size="11" fill="#888">·</text>
  <rect x="154" y="242" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="261" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="196" y="242" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="261" text-anchor="middle" font-size="11" fill="#888">·</text>
  <rect x="238" y="242" width="42" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="261" text-anchor="middle" font-size="10" fill="#bbb">空</text>
  <rect x="280" y="242" width="42" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="261" text-anchor="middle" font-size="10" fill="#bbb">空</text>
  <text x="332" y="261" font-size="10" fill="#4a7a3a">= "e-a---"</text>

  <!-- ===== Row 2 ===== -->
  <rect x="20" y="296" width="500" height="92" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="32" y="314" font-size="11" fill="#446688" font-weight="bold">第 2 行</text>
  <text x="32" y="332" font-size="10.5" fill="#333">cur=10 → +6 = 16 ； s[16%8]=s[0]='a'(词中) ； s[15%8]=s[7]=' ' 已是界 → cur=16</text>
  <!-- screen cells: b c d · e · (6 green) -->
  <rect x="70" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="361" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="112" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="361" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="154" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="361" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="196" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="361" text-anchor="middle" font-size="11" fill="#888">·</text>
  <rect x="238" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="361" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="280" y="342" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="361" text-anchor="middle" font-size="11" fill="#888">·</text>
  <text x="332" y="361" font-size="10" fill="#4a7a3a">= "bcd-e-"</text>

  <!-- ===== Answer ===== -->
  <rect x="80" y="402" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="423" text-anchor="middle" font-size="12" fill="#333">cur = 16,  m = 8</text>
  <text x="270" y="444" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = cur // m = 16 // 8 = 2</text>
</svg>
