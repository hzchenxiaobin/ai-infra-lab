<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="356" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：OR 只置 1 不清 0，奇数是最低位的污染源</text>

  <!-- 左面板：只选偶数 -->
  <rect x="25" y="44" width="228" height="212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="139" y="66" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">只选偶数 → 最低位保住 0 ✓</text>
  <text x="113" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₃</text>
  <text x="140" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₂</text>
  <text x="167" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₁</text>
  <text x="194" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₀</text>

  <text x="92" y="104" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">2 =</text>
  <rect x="100" y="88" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="127" y="88" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="88" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="181" y="88" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="139.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="166.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="193.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="92" y="136" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">4 =</text>
  <rect x="100" y="120" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="127" y="120" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="120" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="181" y="120" width="25" height="25" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112.5" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="139.5" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="166.5" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="193.5" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="92" y="173" text-anchor="end" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">OR =</text>
  <rect x="100" y="156" width="25" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="127" y="156" width="25" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="156" width="25" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="181" y="156" width="25" height="27" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112.5" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="139.5" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="166.5" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="193.5" y="174" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="139" y="212" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">最低位的 0 原样保留 ✓</text>
  <text x="139" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（高位是什么都无所谓）</text>

  <!-- 右面板：混入奇数 -->
  <rect x="267" y="44" width="228" height="212" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="381" y="66" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">混入奇数 5 → 最低位被污染 ✗</text>
  <text x="355" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₃</text>
  <text x="382" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₂</text>
  <text x="409" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₁</text>
  <text x="436" y="82" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b₀</text>

  <text x="334" y="104" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">2 =</text>
  <rect x="342" y="88" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="369" y="88" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="396" y="88" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="423" y="88" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="354.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="381.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="408.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="435.5" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="334" y="134" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">4 =</text>
  <rect x="342" y="118" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="369" y="118" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="396" y="118" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="423" y="118" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="354.5" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="381.5" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="408.5" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="435.5" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="334" y="164" text-anchor="end" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">5 =</text>
  <rect x="342" y="148" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="369" y="148" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="396" y="148" width="25" height="25" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="423" y="148" width="25" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="354.5" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="381.5" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="408.5" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="435.5" y="165" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="334" y="199" text-anchor="end" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">OR =</text>
  <rect x="342" y="182" width="25" height="27" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="369" y="182" width="25" height="27" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="396" y="182" width="25" height="27" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="423" y="182" width="25" height="27" fill="#b85450" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="354.5" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="381.5" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="408.5" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="435.5" y="200" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="381" y="232" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">1 传播到结果，尾随零消失 ✗</text>
  <text x="381" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（一个奇数就够，全盘皆输）</text>

  <!-- 底部结论框 -->
  <rect x="25" y="272" width="470" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">OR 结果最低位 = 0 ⟺ 所选元素全为偶数</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">⟹ 存在可行方案 ⟺ 数组中偶数个数 ≥ 2</text>
</svg>
