<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：桶 1 / 2 / 3 的链表变化</text>
  <path d="M 260 44 Q 440 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Header row ===== -->
  <g font-size="12" font-weight="bold">
    <g filter="url(#sk)"><rect x="40" y="64" width="200" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="85" text-anchor="middle" fill="#2b6e9e">操作</text>
    <g filter="url(#sk)"><rect x="250" y="64" width="180" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="340" y="85" text-anchor="middle" fill="#7a5415">桶 1  链表</text>
    <g filter="url(#sk)"><rect x="440" y="64" width="180" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="530" y="85" text-anchor="middle" fill="#7a5415">桶 2  链表</text>
    <g filter="url(#sk)"><rect x="630" y="64" width="180" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="720" y="85" text-anchor="middle" fill="#7a5415">桶 3  链表</text>
  </g>

  <!-- ===== Row 1: add(1) ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="104" width="200" height="40" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="140" y="129" text-anchor="middle" fill="#2e6e2e" font-weight="bold">add(1)</text>
    <text x="140" y="124" text-anchor="middle" font-size="10" fill="#5a7a5a"></text>
    <!-- bucket1: 1 -->
    <g filter="url(#sk)"><rect x="290" y="110" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="312" y="129" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="346" y="129" font-size="10" fill="#888">→ null</text>
    <!-- bucket2: empty -->
    <text x="530" y="129" text-anchor="middle" fill="#888" font-size="11">null</text>
    <!-- bucket3: empty -->
    <text x="720" y="129" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>
  <text x="830" y="129" font-size="11" fill="#5a7a5a">1%769=1</text>

  <!-- ===== Row 2: add(2) ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="152" width="200" height="40" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="140" y="177" text-anchor="middle" fill="#2e6e2e" font-weight="bold">add(2)</text>
    <!-- bucket1: 1 -->
    <g filter="url(#sk)"><rect x="290" y="158" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="177" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="177" font-size="10" fill="#888">→ null</text>
    <!-- bucket2: 2 -->
    <g filter="url(#sk)"><rect x="480" y="158" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="502" y="177" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="536" y="177" font-size="10" fill="#888">→ null</text>
    <!-- bucket3: empty -->
    <text x="720" y="177" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>
  <text x="830" y="177" font-size="11" fill="#5a7a5a">2%769=2</text>

  <!-- ===== Row 3: contains(1) → true ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="200" width="200" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="220" text-anchor="middle" fill="#2b6e9e" font-weight="bold">contains(1)</text>
    <text x="140" y="234" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ true ✓</text>
    <!-- bucket1: 1 highlighted -->
    <g filter="url(#sk)"><rect x="290" y="206" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="312" y="225" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <text x="346" y="225" font-size="10" fill="#888">→ null</text>
    <!-- bucket2 -->
    <g filter="url(#sk)"><rect x="480" y="206" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="502" y="225" text-anchor="middle" fill="#555">2</text>
    <text x="536" y="225" font-size="10" fill="#888">→ null</text>
    <!-- bucket3: empty -->
    <text x="720" y="225" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>

  <!-- ===== Row 4: contains(3) → false ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="248" width="200" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="268" text-anchor="middle" fill="#2b6e9e" font-weight="bold">contains(3)</text>
    <text x="140" y="282" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">→ false ✗</text>
    <!-- bucket1 -->
    <g filter="url(#sk)"><rect x="290" y="254" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="273" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="273" font-size="10" fill="#888">→ null</text>
    <!-- bucket2 -->
    <g filter="url(#sk)"><rect x="480" y="254" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="502" y="273" text-anchor="middle" fill="#555">2</text>
    <text x="536" y="273" font-size="10" fill="#888">→ null</text>
    <!-- bucket3: empty highlighted (searched but empty) -->
    <g filter="url(#sk)"><rect x="670" y="254" width="100" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2"/></g>
    <text x="720" y="273" text-anchor="middle" fill="#b03a3a" font-size="11">null (没找到)</text>
  </g>
  <text x="830" y="273" font-size="11" fill="#5a7a5a">3%769=3</text>

  <!-- ===== Row 5: add(2) again ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="296" width="200" height="40" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="140" y="316" text-anchor="middle" fill="#2e6e2e" font-weight="bold">add(2)</text>
    <text x="140" y="330" text-anchor="middle" font-size="10" fill="#888">已存在，跳过</text>
    <!-- bucket1 -->
    <g filter="url(#sk)"><rect x="290" y="302" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="321" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="321" font-size="10" fill="#888">→ null</text>
    <!-- bucket2: 2 unchanged -->
    <g filter="url(#sk)"><rect x="480" y="302" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="502" y="321" text-anchor="middle" fill="#555">2</text>
    <text x="536" y="321" font-size="10" fill="#888">→ null</text>
    <!-- bucket3 -->
    <text x="720" y="321" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>

  <!-- ===== Row 6: contains(2) → true ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="344" width="200" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="364" text-anchor="middle" fill="#2b6e9e" font-weight="bold">contains(2)</text>
    <text x="140" y="378" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ true ✓</text>
    <g filter="url(#sk)"><rect x="290" y="350" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="369" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="369" font-size="10" fill="#888">→ null</text>
    <g filter="url(#sk)"><rect x="480" y="350" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="502" y="369" text-anchor="middle" fill="#b03a3a" font-weight="bold">2</text>
    <text x="536" y="369" font-size="10" fill="#888">→ null</text>
    <text x="720" y="369" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>

  <!-- ===== Row 7: remove(2) ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="392" width="200" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="140" y="412" text-anchor="middle" fill="#b03a3a" font-weight="bold">remove(2)</text>
    <text x="140" y="426" text-anchor="middle" font-size="10" fill="#888">摘除节点 2</text>
    <g filter="url(#sk)"><rect x="290" y="398" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="417" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="417" font-size="10" fill="#888">→ null</text>
    <!-- bucket2: now empty, show removed node struck through -->
    <g filter="url(#sk)"><rect x="480" y="398" width="44" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3 2"/></g>
    <text x="502" y="417" text-anchor="middle" fill="#bbb" font-size="10" text-decoration="line-through">2</text>
    <text x="536" y="417" font-size="10" fill="#888">→ null</text>
    <text x="530" y="438" text-anchor="middle" font-size="10" fill="#b03a3a">桶 2 置空</text>
    <text x="720" y="417" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>

  <!-- ===== Row 8: contains(2) → false ===== -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="40" y="450" width="200" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="470" text-anchor="middle" fill="#2b6e9e" font-weight="bold">contains(2)</text>
    <text x="140" y="484" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">→ false ✗</text>
    <g filter="url(#sk)"><rect x="290" y="456" width="44" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.1"/></g>
    <text x="312" y="475" text-anchor="middle" fill="#555">1</text>
    <text x="346" y="475" font-size="10" fill="#888">→ null</text>
    <g filter="url(#sk)"><rect x="480" y="456" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2"/></g>
    <text x="502" y="475" text-anchor="middle" fill="#b03a3a" font-size="11">null</text>
    <text x="720" y="475" text-anchor="middle" fill="#888" font-size="11">null</text>
  </g>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#sk)"><rect x="40" y="510" width="800" height="36" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="440" y="533" text-anchor="middle" font-size="12" fill="#2e6e2e">
    同桶的 key（如 1 和 770）在链表里共存；remove 只摘目标节点，其余不动
  </text>
</svg>
