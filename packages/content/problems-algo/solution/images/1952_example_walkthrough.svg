<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：六组 n 的判定过程</text>

  <!-- Table columns: n(60-110) k=⌊√n⌋(110-170) k²==n?(170-240) k 是否质数(240-330) 除数集合(330-430) 结果(430-480) -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <!-- Header -->
    <rect x="60" y="48" width="430" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="85" y="67">n</text>
    <text x="140" y="67">k = ⌊√n⌋</text>
    <text x="205" y="67">k² == n?</text>
    <text x="285" y="67">k 是否质数</text>
    <text x="380" y="67">除数集合</text>
    <text x="455" y="67">结果</text>

    <!-- Row 1: n=4 → true -->
    <rect x="60" y="78" width="430" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="97">4</text>
    <text x="140" y="97">2</text>
    <text x="205" y="97" fill="#4a7a3a">✓</text>
    <text x="285" y="97" fill="#4a7a3a">✓ 质数</text>
    <text x="380" y="97">{1, 2, 4}</text>
    <text x="455" y="97" fill="#4a7a3a" font-weight="bold">true</text>

    <!-- Row 2: n=9 → true -->
    <rect x="60" y="106" width="430" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="125">9</text>
    <text x="140" y="125">3</text>
    <text x="205" y="125" fill="#4a7a3a">✓</text>
    <text x="285" y="125" fill="#4a7a3a">✓ 质数</text>
    <text x="380" y="125">{1, 3, 9}</text>
    <text x="455" y="125" fill="#4a7a3a" font-weight="bold">true</text>

    <!-- Row 3: n=25 → true -->
    <rect x="60" y="134" width="430" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="153">25</text>
    <text x="140" y="153">5</text>
    <text x="205" y="153" fill="#4a7a3a">✓</text>
    <text x="285" y="153" fill="#4a7a3a">✓ 质数</text>
    <text x="380" y="153">{1, 5, 25}</text>
    <text x="455" y="153" fill="#4a7a3a" font-weight="bold">true</text>

    <!-- Row 4: n=2 → false (not square) -->
    <rect x="60" y="162" width="430" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="181">2</text>
    <text x="140" y="181">1</text>
    <text x="205" y="181" fill="#b85450">✗ (1≠2)</text>
    <text x="285" y="181" fill="#888">—</text>
    <text x="380" y="181">{1, 2}</text>
    <text x="455" y="181" fill="#b85450" font-weight="bold">false</text>

    <!-- Row 5: n=16 → false (square but composite sqrt) -->
    <rect x="60" y="190" width="430" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="209">16</text>
    <text x="140" y="209">4</text>
    <text x="205" y="209" fill="#4a7a3a">✓</text>
    <text x="285" y="209" fill="#b85450">✗ 4=2·2</text>
    <text x="380" y="209">{1,2,4,8,16}</text>
    <text x="455" y="209" fill="#b85450" font-weight="bold">false</text>

    <!-- Row 6: n=1 → false (k=1 not prime) -->
    <rect x="60" y="218" width="430" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="85" y="237">1</text>
    <text x="140" y="237">1</text>
    <text x="205" y="237" fill="#4a7a3a">✓</text>
    <text x="285" y="237" fill="#b85450">✗ 1 非质数</text>
    <text x="380" y="237">{1}</text>
    <text x="455" y="237" fill="#b85450" font-weight="bold">false</text>
  </g>

  <!-- Divider -->
  <path d="M 40 264 L 520 264" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="60" y="278" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">true 的 n：4, 9, 25 → 形如 p²（p ∈ {2,3,5} 质数）</text>

  <!-- Notes -->
  <text x="60" y="328" font-size="11" fill="#555">• n=2：非完全平方 → 除数成对 (1,2)，共 2 个（偶），第一关即淘汰</text>
  <text x="60" y="346" font-size="11" fill="#555">• n=16：虽是完全平方，但 √16=4 复合 → 多出 2,8 两个除数，共 5 个</text>
  <text x="60" y="364" font-size="11" fill="#555">• n=1：1=1² 但 1 按定义非质数 → 仅 1 个除数，须显式排除</text>
  <text x="60" y="382" font-size="11" fill="#555">• 两道关卡缺一不可：完全平方 √ + 平方根为质数</text>
</svg>
