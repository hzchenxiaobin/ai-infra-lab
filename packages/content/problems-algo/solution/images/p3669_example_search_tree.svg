<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：n = 44, k = 3 的搜索树（divs = [1,2,4,11,22,44]）</text>

  <!-- 根 -->
  <rect x="203" y="40" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="233" y="56" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prod=1</text>

  <!-- 根的剪枝 -->
  <path d="M 263 52 L 326 52" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="330" y="40" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="57" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d≥4：4³ = 64 &gt; 44 ✂</text>

  <!-- 第 1 层 -->
  <path d="M 222 64 C 180 82, 140 92, 114 106" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=1</text>
  <path d="M 244 64 C 280 82, 320 92, 338 106" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=2</text>

  <rect x="92" y="108" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="324" y="108" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>

  <!-- 第 1 层的剪枝说明 -->
  <path d="M 130 120 L 156 120" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="228" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">d≥11：1×11² &gt; 44 ✂</text>
  <path d="M 362 120 L 378 120" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="448" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">d≥11：2×11² &gt; 44 ✂</text>

  <!-- 第 2 层 -->
  <path d="M 102 132 C 85 150, 68 168, 58 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=1</text>
  <path d="M 110 132 C 112 150, 122 168, 127 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=2</text>
  <path d="M 118 132 C 140 150, 175 168, 198 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=4</text>
  <path d="M 334 132 C 322 150, 310 168, 304 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=2</text>
  <path d="M 350 132 C 362 150, 380 168, 388 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=4</text>

  <rect x="28" y="190" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1]</text>
  <rect x="101" y="190" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="174" y="190" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4]</text>
  <rect x="275" y="190" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,2]</text>
  <rect x="363" y="190" width="54" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[2,4]</text>

  <!-- 死路 -->
  <text x="390" y="238" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">prod=8，44 % 8 ≠ 0</text>
  <text x="390" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">无路可走 ✗</text>

  <!-- 叶子 -->
  <path d="M 55 214 L 55 260" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="240" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=44</text>
  <path d="M 128 214 L 128 260" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="240" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=22</text>
  <path d="M 201 214 L 201 260" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="201" y="240" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=11</text>
  <path d="M 302 214 L 302 260" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="240" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=11</text>

  <rect x="20" y="264" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,44]</text>
  <text x="55" y="293" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">差 43</text>

  <rect x="93" y="264" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,22]</text>
  <text x="128" y="293" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">差 21</text>

  <rect x="166" y="264" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,4,11]</text>
  <text x="201" y="293" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">差 10</text>

  <rect x="267" y="264" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2,2,11] ★</text>
  <text x="302" y="293" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">差 9 最优</text>

  <!-- 结论 -->
  <rect x="100" y="330" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4 个完整拆分的差值：43 / 21 / 10 / 9</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最小差值 9 → 答案 [2,2,11]</text>
</svg>
