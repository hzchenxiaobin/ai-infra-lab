<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">互补配对 (x, 2^p−1−x) 固定和 → 极端化 (1, 2^p−2)</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">以 p=3 为例：nums=[1,2,3,4,5,6,7]，其中 7=111 单独保留</text>

  <!-- 7 stays -->
  <rect x="260" y="62" width="100" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="84" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7 = 111 （保留）</text>

  <!-- left: original pairs -->
  <text x="60" y="126" font-size="12" fill="#446688" font-weight="bold">交换前：3 个互补对（每对和=7）</text>

  <g font-size="12">
    <rect x="60" y="138" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="96" y="158" text-anchor="middle" fill="#333">1 = 001</text>
    <text x="96" y="173" text-anchor="middle" font-size="10" fill="#888">值 1</text>
    <rect x="152" y="138" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="158" text-anchor="middle" fill="#333">6 = 110</text>
    <text x="188" y="173" text-anchor="middle" font-size="10" fill="#888">值 6</text>
    <text x="244" y="164" font-size="12" fill="#b85450" font-weight="bold">积=6</text>
  </g>

  <g font-size="12">
    <rect x="60" y="190" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="96" y="210" text-anchor="middle" fill="#333">2 = 010</text>
    <text x="96" y="225" text-anchor="middle" font-size="10" fill="#888">值 2</text>
    <rect x="152" y="190" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="210" text-anchor="middle" fill="#333">5 = 101</text>
    <text x="188" y="225" text-anchor="middle" font-size="10" fill="#888">值 5</text>
    <text x="244" y="216" font-size="12" fill="#d6a040" font-weight="bold">积=10</text>
  </g>

  <g font-size="12">
    <rect x="60" y="242" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="96" y="262" text-anchor="middle" fill="#333">3 = 011</text>
    <text x="96" y="277" text-anchor="middle" font-size="10" fill="#888">值 3</text>
    <rect x="152" y="242" width="72" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="262" text-anchor="middle" fill="#333">4 = 100</text>
    <text x="188" y="277" text-anchor="middle" font-size="10" fill="#888">值 4</text>
    <text x="244" y="268" font-size="12" fill="#d6a040" font-weight="bold">积=12</text>
  </g>

  <!-- horizontal arrow: bit swap -->
  <path d="M 276 210 L 360 210" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="200" text-anchor="middle" font-size="10" fill="#888">位交换</text>

  <!-- right: after swap -->
  <text x="384" y="126" font-size="12" fill="#4a7a3a" font-weight="bold">交换后：全部极端化为 (1, 6)</text>

  <g font-size="12">
    <rect x="384" y="138" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="158" text-anchor="middle" fill="#333">1 = 001</text>
    <rect x="476" y="138" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="512" y="158" text-anchor="middle" fill="#333">6 = 110</text>
    <text x="566" y="164" font-size="12" fill="#b85450" font-weight="bold">积=6</text>
  </g>
  <g font-size="12">
    <rect x="384" y="190" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="210" text-anchor="middle" fill="#333">1 = 001</text>
    <rect x="476" y="190" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="512" y="210" text-anchor="middle" fill="#333">6 = 110</text>
    <text x="566" y="216" font-size="12" fill="#b85450" font-weight="bold">积=6</text>
  </g>
  <g font-size="12">
    <rect x="384" y="242" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="262" text-anchor="middle" fill="#333">1 = 001</text>
    <rect x="476" y="242" width="72" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="512" y="262" text-anchor="middle" fill="#333">6 = 110</text>
    <text x="566" y="268" font-size="12" fill="#b85450" font-weight="bold">积=6</text>
  </g>

  <!-- bottom summary -->
  <rect x="40" y="312" width="540" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="13" fill="#444" font-weight="bold">AM-GM：和固定时，积最小当两数最不均</text>
  <text x="60" y="360" font-size="12" fill="#4a7a3a">每对和 = 2^p−1，极端化到 (1, 2^p−2)，每对积 = 2^p−2</text>
  <text x="60" y="382" font-size="13" fill="#b85450" font-weight="bold">答案 = (2^p−1) × (2^p−2)^(对数) = (2^p−1)·(2^p−2)^(2^(p−1)−1)</text>
  <text x="60" y="398" font-size="10" fill="#888">对数 = (2^p−2)/2 = 2^(p−1)−1；原始乘积 5040 → 最小乘积 1512</text>
</svg>
