<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：dummy 哨兵 + 找最右非 9 节点</text>

  <!-- Step 1: build dummy -->
  <rect x="30" y="50" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="74" font-size="12" fill="#d6a040" font-weight="bold">① 建哑节点 dummy(0) → head</text>
  <text x="48" y="92" font-size="11" fill="#555">作用：统一处理「全 9 时首位补 1」——dummy 的值会被 +1 当新头返回</text>

  <!-- dummy -> 9 -> 9 -> 9 visualization -->
  <g filter="url(#rough2)">
    <rect x="60" y="118" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="100" y="118" width="12" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="80" y="137" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="56" y="112" font-size="10" fill="#888">dummy</text>

  <g filter="url(#rough2)">
    <rect x="140" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="180" y="118" width="12" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="160" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="220" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="260" y="118" width="12" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="240" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="300" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="320" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <path d="M 112 132 L 138 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 132 L 218 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 132 L 298 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M 280 158 Q 280 168 280 178" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: scan, track last non-9 -->
  <rect x="30" y="180" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="204" font-size="12" fill="#d6a040" font-weight="bold">② 一次遍历：维护「最右的非 9 节点」 last_not_nine</text>
  <text x="48" y="222" font-size="11" fill="#555">每走到一个节点：若 val ≠ 9，更新 last = node；否则跳过</text>
  <text x="48" y="238" font-size="11" fill="#b85450" font-weight="bold">例：1→2→9→9，遍历后 last 指向「2」（最右的非 9）</text>

  <!-- arrow down -->
  <path d="M 280 250 Q 280 260 280 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: increment last_not_nine -->
  <rect x="30" y="272" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="296" font-size="12" fill="#4a7a3a" font-weight="bold">③ last_not_nine.val += 1（这一位之后必无进位）</text>
  <text x="48" y="314" font-size="11" fill="#555">从 last.next 起把所有后续节点置 0（它们全是 9，+1 后变 0）</text>
  <text x="48" y="328" font-size="11" fill="#4a7a3a" font-weight="bold">例：1→2→9→9 → 1→3→0→0</text>

  <!-- arrow down -->
  <path d="M 280 338 Q 280 348 280 358" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="30" y="360" width="500" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="384" font-size="12" fill="#446688" font-weight="bold">④ 返回 dummy.val == 1 ? dummy : dummy.next</text>
  <text x="48" y="402" font-size="11" fill="#555">全 9 时 dummy 从 0 变 1，作为新头返回；否则 dummy 仍为 0，返回 dummy.next</text>
  <text x="48" y="416" font-size="11" fill="#888">一次遍历 O(n)，常数额外空间 O(1)</text>
</svg>
