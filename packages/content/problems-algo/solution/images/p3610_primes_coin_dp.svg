<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：质数当硬币 —— dp[i] = min(dp[i−p] + 1)</text>

  <!-- 质数条：前 m 个 -->
  <circle cx="58" cy="66" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="96" cy="66" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="134" cy="66" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="134" y="71" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <circle cx="172" cy="66" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="172" y="71" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">7</text>
  <circle cx="210" cy="66" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="210" y="71" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">11</text>
  <text x="238" y="71" font-size="12" fill="#999" filter="url(#rough2)">…</text>
  <text x="330" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 m=2：只可用 2、3</text>
  <text x="330" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（同一质数可重复取）</text>

  <!-- dp 表 0..10 -->
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">dp[i]：凑出和为 i 所需的最少质数个数（硬币 = {2, 3}）</text>

  <!-- 格子：x = 36 + 42k -->
  <rect x="36" y="116" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="78" y="116" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="116" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="372" y="116" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="414" y="116" width="42" height="38" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="116" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>

  <!-- 下标 -->
  <text x="57" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="99" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="141" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="183" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="225" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="267" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="309" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="351" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="393" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="435" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="477" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>

  <!-- 值 -->
  <text x="57" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="99" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">∞</text>
  <text x="141" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="225" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="267" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="309" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="351" y="148" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="393" y="148" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="435" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="477" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <!-- 转移箭头 -->
  <path d="M 393 158 C 400 186, 448 192, 472 162" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="188" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">取 p=2：dp[10]←dp[8]+1</text>
  <path d="M 351 158 C 351 214, 452 214, 471 164" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="212" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">取 p=3：dp[10]←dp[7]+1</text>

  <!-- 方程框 -->
  <rect x="46" y="232" width="428" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[0] = 0；dp[i] = min&#8201;( dp[i−p] + 1 )，p 取遍 ≤ i 的质数</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">∞ 表示「凑不出」；dp[1]=∞ —— 1 不是质数，无可行转移</text>

  <!-- 分解 -->
  <text x="150" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">10 = 2 + 2 + 3 + 3</text>
  <text x="150" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最少 4 个质数 ✅</text>
  <circle cx="258" cy="314" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="284" cy="314" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="310" cy="314" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="336" cy="314" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="319" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个质数可重复使用 → 完全背包</text>
</svg>
