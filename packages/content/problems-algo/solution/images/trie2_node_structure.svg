<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Trie II 节点结构：两个计数器</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="11" fill="#888">208 的 is_end 升级为 cnt_end / cnt_pass，支持计数与删除</text>

  <!-- ===== Left: 208 basic node ===== -->
  <text x="180" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">208 基础 TrieNode</text>
  <g filter="url(#sk)">
    <rect x="80" y="104" width="200" height="130" rx="8" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="96" y="128" font-weight="bold" fill="#4a8edb">children[26]</text>
    <text x="96" y="148">is_end : bool</text>
    <text x="96" y="176" fill="#888" font-size="10">只能判「在 / 不在」</text>
    <text x="96" y="192" fill="#888" font-size="10">无法计数，无法删除</text>
  </g>
  <path d="M 96 160 L 264 160" stroke="#ddd" stroke-width="0.8" filter="url(#sk)"/>

  <!-- ===== Arrow ===== -->
  <path d="M 290 170 L 340 170" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="315" y="160" text-anchor="middle" font-size="10" fill="#c04050">升级</text>

  <!-- ===== Right: 1804 node with two counters ===== -->
  <text x="640" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e8b57">1804 TrieNode (带计数)</text>
  <g filter="url(#sk)">
    <rect x="500" y="104" width="280" height="150" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#333">
    <text x="516" y="128" font-weight="bold" fill="#4a8edb">children[26]</text>
    <text x="516" y="152" font-weight="bold" fill="#2e8b57">cnt_end : int</text>
    <text x="516" y="172" font-weight="bold" fill="#c98a2b">cnt_pass : int</text>
    <path d="M 516 184 L 764 184" stroke="#aac" stroke-width="0.8" filter="url(#sk)"/>
    <text x="516" y="204" fill="#555" font-size="10">cnt_end = 在此结尾的单词数</text>
    <text x="516" y="220" fill="#555" font-size="10">cnt_pass = 经过此节点的单词数</text>
    <text x="516" y="240" fill="#c04050" font-size="10">erase = cnt_pass−1, 末节点 cnt_end−1</text>
  </g>

  <!-- ===== Bottom: example tree with counters ===== -->
  <text x="470" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">插入 apple ×2 后的计数状态</text>

  <!-- root -->
  <g filter="url(#sk)">
    <circle cx="120" cy="320" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="120" y="324" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">root</text>
  <text x="120" y="358" text-anchor="middle" font-size="9" fill="#888">pass=2</text>

  <!-- a -->
  <path d="M 120 342 L 120 372" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="132" y="360" font-size="9" fill="#888">a</text>
  <g filter="url(#sk)">
    <circle cx="120" cy="392" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="120" y="396" text-anchor="middle" font-size="9" fill="#2b6e9e">a</text>
  <text x="120" y="416" text-anchor="middle" font-size="9" fill="#888">pass=2</text>

  <!-- p -->
  <path d="M 120 410 L 220 410" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="402" font-size="9" fill="#888">p</text>
  <g filter="url(#sk)">
    <circle cx="240" cy="410" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="240" y="414" text-anchor="middle" font-size="9" fill="#2b6e9e">p</text>
  <text x="240" y="432" text-anchor="middle" font-size="8" fill="#888">pass=2</text>

  <!-- p (shared, where countWordsStartingWith("app") reads) -->
  <path d="M 258 410 L 348 380" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="388" font-size="9" fill="#888">p</text>
  <g filter="url(#sk)">
    <circle cx="368" cy="372" r="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="368" y="376" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">p</text>
  <text x="368" y="356" text-anchor="middle" font-size="8" fill="#888">end=0</text>
  <text x="368" y="398" text-anchor="middle" font-size="8" fill="#c98a2b" font-weight="bold">pass=2</text>

  <!-- l -->
  <path d="M 388 372 L 458 372" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="364" font-size="9" fill="#888">l</text>
  <g filter="url(#sk)">
    <circle cx="478" cy="372" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="478" y="376" text-anchor="middle" font-size="9" fill="#2b6e9e">l</text>
  <text x="478" y="394" text-anchor="middle" font-size="8" fill="#888">pass=2</text>

  <!-- e (end of apple) -->
  <path d="M 496 372 L 568 372" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="530" y="364" font-size="9" fill="#888">e</text>
  <g filter="url(#sk)">
    <circle cx="588" cy="372" r="20" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="588" y="376" text-anchor="middle" font-size="9" fill="#8a6a1a" font-weight="bold">e</text>
  <text x="588" y="356" text-anchor="middle" font-size="8" fill="#c98a2b" font-weight="bold">end=2</text>
  <text x="588" y="398" text-anchor="middle" font-size="8" fill="#888">pass=2</text>

  <!-- ===== Query results panel (right) ===== -->
  <g filter="url(#sk)">
    <rect x="660" y="300" width="270" height="110" rx="8" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="795" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">查询结果</text>
  <g font-size="10" fill="#444">
    <text x="676" y="340" font-weight="bold" fill="#2e8b57">countWordsEqualTo("apple")</text>
    <text x="676" y="354" fill="#555">→ 走到 e, 读 end=</text>
    <text x="800" y="354" fill="#2e8b57" font-weight="bold">2</text>

    <text x="676" y="372" font-weight="bold" fill="#c98a2b">countWordsStartingWith("app")</text>
    <text x="676" y="386" fill="#555">→ 走到第2个p, 读 pass=</text>
    <text x="820" y="386" fill="#c98a2b" font-weight="bold">2</text>
  </g>
</svg>
