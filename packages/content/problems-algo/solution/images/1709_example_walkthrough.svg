<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 个用户的空档计算与 MAX</text>

  <!-- ===== Combined table ===== -->
  <rect x="40" y="42" width="430" height="312" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <text x="80" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user</text>
  <text x="170" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visit_date</text>
  <text x="310" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">next(LEAD)</text>
  <text x="430" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">空档</text>
  <line x1="50" y1="66" x2="460" y2="66" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- user 1 group bg -->
  <rect x="46" y="70" width="418" height="78" fill="#e8f0fe" stroke="none" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <!-- user 1 rows -->
  <text x="80" y="86" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="170" y="86" text-anchor="middle" font-size="9" fill="#446688">2020-10-20</text>
  <text x="310" y="86" text-anchor="middle" font-size="9" fill="#446688">2020-11-28</text>
  <text x="430" y="86" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">39</text>

  <text x="80" y="104" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#446688">2020-11-28</text>
  <text x="310" y="104" text-anchor="middle" font-size="9" fill="#446688">2020-12-03</text>
  <text x="430" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a">5</text>

  <text x="80" y="122" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="170" y="122" text-anchor="middle" font-size="9" fill="#446688">2020-12-03</text>
  <text x="310" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-01-01(默认)</text>
  <text x="430" y="122" text-anchor="middle" font-size="9" fill="#d6a040">29</text>

  <text x="80" y="140" text-anchor="middle" font-size="9" fill="#888" font-style="italic">MAX →</text>
  <text x="430" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">39</text>

  <!-- user 2 group bg -->
  <rect x="46" y="150" width="418" height="60" fill="#e6f4ea" stroke="none" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="80" y="166" text-anchor="middle" font-size="9" fill="#446688">2</text>
  <text x="170" y="166" text-anchor="middle" font-size="9" fill="#446688">2020-10-05</text>
  <text x="310" y="166" text-anchor="middle" font-size="9" fill="#446688">2020-12-09</text>
  <text x="430" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">65</text>

  <text x="80" y="184" text-anchor="middle" font-size="9" fill="#446688">2</text>
  <text x="170" y="184" text-anchor="middle" font-size="9" fill="#446688">2020-12-09</text>
  <text x="310" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-01-01(默认)</text>
  <text x="430" y="184" text-anchor="middle" font-size="9" fill="#d6a040">23</text>

  <text x="80" y="204" text-anchor="middle" font-size="9" fill="#888" font-style="italic">MAX →</text>
  <text x="430" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">65</text>

  <!-- user 3 group bg -->
  <rect x="46" y="212" width="418" height="42" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="80" y="232" text-anchor="middle" font-size="9" fill="#446688">3</text>
  <text x="170" y="232" text-anchor="middle" font-size="9" fill="#446688">2020-11-11</text>
  <text x="310" y="232" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-01-01(默认)</text>
  <text x="430" y="232" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">51</text>

  <text x="80" y="250" text-anchor="middle" font-size="9" fill="#888" font-style="italic">MAX →</text>
  <text x="430" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">51</text>

  <!-- note -->
  <text x="250" y="300" text-anchor="middle" font-size="8" fill="#888">红=最大空档 / 绿=普通空档 / 橙=到今天哨兵的空档</text>
  <text x="250" y="314" text-anchor="middle" font-size="8" fill="#888">每用户末行的 next 均为「2021-01-01」默认值</text>

  <!-- arrow to result -->
  <path d="M 470 200 L 500 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result table ===== -->
  <rect x="490" y="80" width="80" height="200" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="530" y="98" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">结果</text>
  <line x1="495" y1="104" x2="565" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="120" text-anchor="middle" font-size="9" fill="#888">u_id</text>
  <text x="548" y="120" text-anchor="middle" font-size="9" fill="#888">win</text>
  <text x="515" y="140" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="548" y="140" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">39</text>
  <text x="515" y="158" text-anchor="middle" font-size="9" fill="#446688">2</text>
  <text x="548" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">65</text>
  <text x="515" y="176" text-anchor="middle" font-size="9" fill="#446688">3</text>
  <text x="548" y="176" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">51</text>

  <!-- ===== Bottom verification ===== -->
  <rect x="40" y="380" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">验算（DATEDIFF = 后者 − 前者，按日历天数计）</text>
  <text x="60" y="424" font-size="9" fill="#666">用户1：10-20→11-28 = 39 ；11-28→12-03 = 5 ；12-03→01-01 = 29 ⇒ max = 39</text>
  <text x="60" y="446" font-size="9" fill="#666">用户2：10-05→12-09 = 65 ；12-09→01-01 = 23 ⇒ max = 65</text>
  <text x="60" y="468" font-size="9" fill="#666">用户3：仅 1 次访问 11-11→01-01(今天) = 51 ⇒ max = 51</text>
  <text x="60" y="490" font-size="9" fill="#b85450" font-weight="bold">关键：末行一律接到「今天 2021-01-01」，与访问次数无关</text>
</svg>
