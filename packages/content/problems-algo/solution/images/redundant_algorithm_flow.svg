<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集判环流程</text>

  <!-- init -->
  <rect x="190" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">parent[i]=i, n 个集合</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="170" y="104" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按输入顺序遍历每条边 (u, v)</text>
  <line x1="270" y1="138" x2="270" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find box -->
  <rect x="160" y="158" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru = find(u), rv = find(v)</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#666">带路径压缩地找根</text>
  <line x1="270" y1="196" x2="270" y2="214" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 270 214 L 380 256 L 270 298 L 160 256 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru == rv ?</text>
  <text x="270" y="268" text-anchor="middle" font-size="10" fill="#888">两端已同根</text>

  <!-- yes branch: return -->
  <text x="395" y="252" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="380" y1="256" x2="430" y2="256" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="238" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="478" y="255" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 [u, v]</text>
  <text x="478" y="269" text-anchor="middle" font-size="10" fill="#888">这条边冗余</text>

  <!-- no branch: union -->
  <text x="120" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="160" y1="256" x2="110" y2="256" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="238" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="255" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">union(u, v)</text>
  <text x="62" y="269" text-anchor="middle" font-size="10" fill="#666">合并两集合</text>

  <!-- union -> back to loop -->
  <path d="M 62 238 Q 62 170 170 122" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="190" font-size="10" fill="#888">回到循环</text>

  <!-- end note -->
  <rect x="120" y="324" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为何返回的就是「最后出现的」冗余边？</text>
  <text x="270" y="360" text-anchor="middle" font-size="10.5" fill="#666">环上前 k−1 条边依次 union 成功，</text>
  <text x="270" y="374" text-anchor="middle" font-size="10.5" fill="#666">第 k 条（输入中最晚的）才让两端已同根 → 命中返回</text>
</svg>
