<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="450" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟遍历，dist=∞ 编码无效，严格 &lt; 更新</text>

  <!-- Start oval -->
  <ellipse cx="270" cy="48" rx="40" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="53" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- arrow start -> init -->
  <path d="M 270 65 L 270 82" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="170" y="84" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">bestDist = ∞, bestIdx = -1</text>
  <text x="270" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 0；未命中时原样返回 -1</text>

  <!-- arrow init -> diamond i<n -->
  <path d="M 270 128 L 270 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? center (270, 164) -->
  <polygon points="270,144 342,164 270,184 198,164" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是: down to process -->
  <path d="M 270 184 L 270 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="196" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process rect: validity + dist -->
  <rect x="108" y="204" width="324" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(a, b) = points[i]</text>
  <text x="270" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a==x → dist = |b−y|</text>
  <text x="270" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b==y → dist = |a−x|</text>
  <text x="270" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否则 dist = ∞（无效，跳过）</text>

  <!-- arrow process -> diamond dist<bestDist -->
  <path d="M 270 284 L 270 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: dist < bestDist ? center (270, 320) -->
  <polygon points="270,300 348,320 270,340 192,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">dist &lt;</text>
  <text x="270" y="331" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">bestDist ?</text>

  <!-- 是: down to update -->
  <path d="M 270 340 L 270 358" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="352" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Update rect -->
  <rect x="166" y="360" width="208" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="385" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">bestDist = dist, bestIdx = i</text>

  <!-- 否 from dist<bestDist diamond: right vertex (348,320) -> right to loop-back -->
  <path d="M 348 320 L 432 320" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="356" y="314" font-size="10.5" fill="#888" filter="url(#rough2)">否（并列/无效）</text>

  <!-- loop-back from update box right (374,380) -> right to x=432 -> up to diamond i<n right vertex (342,164) -->
  <path d="M 374 380 L 432 380 L 432 164 L 342 164" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="276" font-size="10" fill="#888" filter="url(#rough2)">i++</text>
  <text x="442" y="290" font-size="9.5" fill="#aaa" filter="url(#rough2)">重复</text>

  <!-- 否 from i<n diamond: left vertex (198,164) -> left -> down -> end -->
  <path d="M 198 164 L 96 164 L 96 410 L 214 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="182" y="158" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="56" y="292" font-size="9.5" fill="#b85450" filter="url(#rough2)">遍历完</text>

  <!-- End oval -->
  <ellipse cx="270" cy="410" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 bestIdx</text>
</svg>
