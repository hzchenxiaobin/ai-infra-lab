<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：3×4 棋盘，起点 (0,0)，Warnsdorff 一次走通（无需回溯）</text>

  <!-- path arrows (drawn first, behind cells). centers: cx=160+c*80, cy=110+r*80 -->
  <g stroke="#b85450" stroke-width="1.3" fill="none" opacity="0.75" filter="url(#rough2)">
    <path d="M 160 110 L 320 190" marker-end="url(#arrR)"/>
    <path d="M 320 190 L 160 270" marker-end="url(#arrR)"/>
    <path d="M 160 270 L 240 110" marker-end="url(#arrR)"/>
    <path d="M 240 110 L 400 190" marker-end="url(#arrR)"/>
    <path d="M 400 190 L 240 270" marker-end="url(#arrR)"/>
    <path d="M 240 270 L 320 110" marker-end="url(#arrR)"/>
    <path d="M 320 110 L 160 190" marker-end="url(#arrR)"/>
    <path d="M 160 190 L 320 270" marker-end="url(#arrR)"/>
    <path d="M 320 270 L 400 110" marker-end="url(#arrR)"/>
    <path d="M 400 110 L 240 190" marker-end="url(#arrR)"/>
    <path d="M 240 190 L 400 270" marker-end="url(#arrR)"/>
  </g>

  <!-- 3x4 grid cells, origin (120,70), cell=80 -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="120" y="70"  width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="5"/>
    <rect x="200" y="70"  width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="280" y="70"  width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="360" y="70"  width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <!-- row 1 -->
    <rect x="120" y="150" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="200" y="150" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="280" y="150" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="360" y="150" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <!-- row 2 -->
    <rect x="120" y="230" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="200" y="230" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="280" y="230" width="80" height="80" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" rx="5"/>
    <rect x="360" y="230" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
  </g>

  <!-- step numbers -->
  <g font-size="26" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="160" y="120" fill="#446688">0</text>
    <text x="240" y="120">3</text>
    <text x="320" y="120">6</text>
    <text x="400" y="120">9</text>
    <text x="160" y="200">7</text>
    <text x="240" y="200">10</text>
    <text x="320" y="200">1</text>
    <text x="400" y="200">4</text>
    <text x="160" y="280">2</text>
    <text x="240" y="280">5</text>
    <text x="320" y="280">8</text>
    <text x="400" y="280" fill="#d6a040">11</text>
  </g>

  <!-- small step-tag circles on a few arrows -->
  <g font-size="9" fill="#b85450" filter="url(#rough2)">
    <text x="250" y="155">step1</text>
    <text x="250" y="235">step2</text>
    <text x="195" y="195">step7</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="80" y="338" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <text x="106" y="350" font-size="11" fill="#555">起点（step 0）</text>
    <rect x="210" y="338" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="236" y="350" font-size="11" fill="#555">终点（step m×n−1）</text>
    <line x1="350" y1="345" x2="378" y2="345" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)"/>
    <text x="386" y="350" font-size="11" fill="#555">马步行进方向</text>
  </g>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">格中数字 = 该格被访问的步号；相邻步号之间恰好是一个马步</text>
</svg>
