<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：差分数组求解区间加法</text>

  <!-- Box 1 -->
  <rect x="110" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333">① 初始化 diff[0..n] = 0（长度 n+1）</text>

  <path d="M 260 86 L 260 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2 -->
  <rect x="110" y="104" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="13" fill="#333">② 取下一条更新 [l, r, inc]</text>

  <path d="M 260 146 L 260 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 -->
  <rect x="110" y="164" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="13" fill="#333">③ diff[l] += inc</text>
  <text x="260" y="201" text-anchor="middle" font-size="13" fill="#333">diff[r+1] −= inc</text>

  <!-- loop arrow back to Box 2 -->
  <path d="M 410 184 L 450 184 L 450 124 L 412 124" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="456" y="158" font-size="10" fill="#b85450" font-weight="bold">还有</text>
  <text x="456" y="172" font-size="10" fill="#b85450" font-weight="bold">更新</text>

  <!-- after loop arrow -->
  <path d="M 260 210 L 260 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="224" font-size="10" fill="#888">遍历完</text>

  <!-- Box 4 -->
  <rect x="110" y="230" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="13" fill="#333">④ 对 i = 0..n−1：</text>
  <text x="260" y="267" text-anchor="middle" font-size="13" fill="#333">cur += diff[i]，写入 ans[i]</text>

  <path d="M 260 276 L 260 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5 -->
  <rect x="110" y="294" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑤ 返回 ans[0..n−1]</text>

  <!-- complexity note -->
  <rect x="60" y="346" width="400" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#b85450">时间 O(n+k)，空间 O(n)；diff 开到 n+1 容纳 r+1=n</text>
</svg>
