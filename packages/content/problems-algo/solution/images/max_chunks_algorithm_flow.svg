<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描 + 维护当前块最大值 mx</text>

  <!-- start oval -->
  <rect x="215" y="48" width="110" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">开始</text>

  <!-- init box -->
  <rect x="190" y="92" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333">chunks = 0, mx = 0, i = 0</text>

  <!-- diamond i < n -->
  <polygon points="270,140 350,168 270,196 190,168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- mx = max box -->
  <rect x="190" y="210" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="12" fill="#333">mx = max(mx, arr[i])</text>

  <!-- diamond mx == i -->
  <polygon points="270,258 350,286 270,314 190,286" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mx == i ?</text>

  <!-- chunks++ box (yes branch) -->
  <rect x="378" y="269" width="132" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">chunks += 1  ✂</text>

  <!-- i++ box -->
  <rect x="210" y="355" width="120" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="12" fill="#333">i = i + 1</text>

  <!-- return box (no branch of i<n) -->
  <rect x="380" y="152" width="128" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return chunks</text>

  <!-- arrows: main vertical flow -->
  <path d="M 270 76 L 270 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 126 L 270 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i<n yes (down) -->
  <path d="M 270 196 L 270 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- mx box to mx==i diamond -->
  <path d="M 270 244 L 270 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- mx==i yes (right) to chunks++ -->
  <path d="M 350 286 L 378 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="280" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <!-- chunks++ down then left into i++ -->
  <path d="M 444 303 L 444 371 L 330 371" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- mx==i no (down) to i++ -->
  <path d="M 270 314 L 270 355" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="338" font-size="10.5" fill="#888" font-weight="bold">否</text>
  <!-- i++ loop back to i<n diamond -->
  <path d="M 210 371 L 110 371 L 110 168 L 190 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="270" font-size="10" fill="#888">回到判断 i &lt; n</text>
  <!-- i<n no (right) to return -->
  <path d="M 350 168 L 380 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="162" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <!-- note -->
  <rect x="40" y="404" width="460" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#444">一次遍历，i 单调递增、mx 只增不减 ⇒ 时间 O(n)，空间 O(1)</text>
</svg>
