<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 长度 k 滑窗 → 维护最小差值</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="50" rx="46" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#333">开始</text>

  <path d="M 260 65 L 260 78" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sort box -->
  <rect x="170" y="82" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="11.5" fill="#333">① 排序 nums（升序）</text>

  <path d="M 260 112 L 260 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="170" y="128" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="11.5" fill="#333">② ans = +∞</text>

  <path d="M 260 158 L 260 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="260,174 360,208 260,242 160,208" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i ≤ n − k ?</text>
  <text x="260" y="218" text-anchor="middle" font-size="9.5" fill="#666">(还有窗口)</text>

  <!-- Yes arrow down to compute -->
  <path d="M 260 242 L 260 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="251" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- compute box -->
  <rect x="140" y="258" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#333">③ diff = nums[i+k−1] − nums[i]</text>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#333">   ans = min(ans, diff);  i++</text>

  <!-- back arrow from compute left up to diamond left point -->
  <path d="M 140 280 L 108 280 L 108 208 L 158 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="246" font-size="10" fill="#888">回到判定</text>

  <!-- No arrow right to return -->
  <path d="M 360 208 L 408 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="202" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- return box -->
  <rect x="408" y="192" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="458" y="213" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Footer -->
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888">窗口数 n−k+1 个，每个 O(1)；排序 O(n log n) 是复杂度瓶颈</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#aaa">k=1 时窗口 [i,i] 差值恒 0；k=n 时唯一窗口差值 = nums[n−1] − nums[0]</text>
</svg>
