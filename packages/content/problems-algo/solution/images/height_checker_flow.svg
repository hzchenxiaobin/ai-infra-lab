<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：复制 → 排序 → 逐位比较 → 计数
  </text>

  <!-- Step 1: 开始 -->
  <ellipse cx="260" cy="64" rx="56" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- arrow -->
  <path d="M 260 86 L 260 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 复制数组 -->
  <rect x="160" y="108" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">expected = heights 的副本</text>

  <!-- arrow -->
  <path d="M 260 150 L 260 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 排序 -->
  <rect x="160" y="172" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">sort(expected)  升序排列</text>

  <!-- arrow -->
  <path d="M 260 214 L 260 232" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 初始化 -->
  <rect x="160" y="236" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">count = 0,  i = 0</text>

  <!-- arrow -->
  <path d="M 260 278 L 260 296" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 判断 i < n? -->
  <polygon points="260,300 360,340 260,380 160,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">遍历每个位置</text>

  <!-- 否：向右到返回 -->
  <path d="M 360 340 L 440 340 L 440 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="332" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 是：向下 -->
  <path d="M 260 380 L 260 398" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="392" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- Step 6: 判断 heights[i] != expected[i] -->
  <polygon points="260,402 380,432 260,432 140,432" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">heights[i] ≠ expected[i] ?</text>

  <!-- 右侧循环回退箭头（不等于 → count++, i++ → 回到判断 i<n） -->
  <path d="M 380 417 L 470 417 L 470 340 L 360 340" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="409" font-size="10" fill="#b85450" filter="url(#rough2)">是 → count++, i++</text>

  <!-- 左侧循环回退箭头（等于 → i++ → 回到判断 i<n） -->
  <path d="M 140 432 L 60 432 L 60 340 L 160 340" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="424" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否 → i++</text>

  <!-- 返回结果 -->
  <ellipse cx="440" cy="430" rx="64" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="435" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 count</text>
</svg>
