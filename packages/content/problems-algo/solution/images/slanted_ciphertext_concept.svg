<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">编码与解码：对角线放置 ↔ 按行读取</text>

  <text x="40" y="56" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 编码：originalText 沿对角线放入矩阵</text>

  <rect x="160" y="64" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="200" y="64" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>

  <rect x="240" y="64" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="88" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="280" y="64" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="88" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="160" y="104" width="36" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="128" text-anchor="middle" font-size="14" fill="#ddd" filter="url(#rough2)">·</text>

  <rect x="200" y="104" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>

  <rect x="240" y="104" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>

  <rect x="280" y="104" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="128" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="160" y="144" width="36" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="168" text-anchor="middle" font-size="14" fill="#ddd" filter="url(#rough2)">·</text>

  <rect x="200" y="144" width="36" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="168" text-anchor="middle" font-size="14" fill="#ddd" filter="url(#rough2)">·</text>

  <rect x="240" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p</text>

  <rect x="280" y="144" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="298" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">r</text>

  <text x="148" y="88" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">行0</text>
  <text x="148" y="128" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">行1</text>
  <text x="148" y="168" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">行2</text>

  <path d="M 194 96 Q 206 104 206 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 234 136 Q 246 144 246 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 234 96 Q 246 104 246 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 274 136 Q 286 144 286 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="350" y="74" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">对角线颜色：</text>
  <rect x="350" y="82" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="93" font-size="10.5" fill="#444" filter="url(#rough2)">k=0: c i p</text>
  <rect x="350" y="100" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="111" font-size="10.5" fill="#444" filter="url(#rough2)">k=1: h e r</text>
  <rect x="350" y="118" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="129" font-size="10.5" fill="#999" filter="url(#rough2)">k=2: · · (填充空格)</text>
  <rect x="350" y="136" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="147" font-size="10.5" fill="#999" filter="url(#rough2)">k=3: · (填充空格)</text>

  <text x="350" y="172" font-size="10" fill="#666" filter="url(#rough2)">originalText = "cipher"</text>
  <text x="350" y="186" font-size="10" fill="#666" filter="url(#rough2)">先填 k=0(c,i,p)，再填 k=1(h,e,r)</text>

  <path d="M 238 192 L 238 208" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="40" y="206" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 按行读出 → encodedText</text>

  <rect x="80" y="214" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">"ch  " + " ie " + "  pr" = "ch   ie   pr"</text>

  <text x="40" y="262" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 解码：对角线 k 的元素在 encodedText 中等间距分布</text>

  <rect x="40" y="272" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cell (r, c) 在 encodedText 中下标 = r × cols + c</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">对角线 k 第 r 个元素下标 = r × (cols + 1) + k</text>

  <rect x="40" y="324" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">cols=4：k=0 → 0,5,10 ｜ k=1 → 1,6,11 ｜ k=2 → 2,7 ｜ k=3 → 3</text>

  <rect x="40" y="358" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">无需重建矩阵，直接按公式取字符，O(n) 时间 O(1) 额外空间</text>
</svg>
