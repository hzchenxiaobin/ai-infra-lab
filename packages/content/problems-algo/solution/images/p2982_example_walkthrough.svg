<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aaabaaa"</text>

  <!-- step 1: runs -->
  <text x="52" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 切游程：</text>
  <g filter="url(#rough2)">
    <rect x="140" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="185" y="62" text-anchor="middle" font-size="11.5" fill="#446688">aaa（L=3）</text>
    <rect x="238" y="44" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="268" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a">b（L=1）</text>
    <rect x="306" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="351" y="62" text-anchor="middle" font-size="11.5" fill="#446688">aaa（L=3）</text>
  </g>

  <!-- step 2: len array -->
  <text x="52" y="100" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② len 数组：</text>
  <g filter="url(#rough2)">
    <rect x="140" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="174" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="208" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="242" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="276" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="310" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="344" y="86" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="157" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="191" y="104" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="225" y="104" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="259" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="293" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="327" y="104" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="361" y="104" text-anchor="middle" font-size="12" fill="#333">3</text>
  </g>

  <!-- step 3: group -->
  <text x="52" y="146" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 分组取前三：</text>
  <rect x="140" y="130" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="245" y="148" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">'a'：{1,2,3, 1,2,3} → 前三大 3,3,2</text>
  <rect x="330" y="138" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="155" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">=2 ✓</text>

  <rect x="140" y="182" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="245" y="204" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">'b'：{1} → 不足 3 个，无候选 ✗</text>

  <!-- step 4: verify -->
  <text x="52" y="248" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 验证 x=2 与 x=3：</text>

  <g filter="url(#rough2)">
    <!-- x=2 row -->
    <rect x="140" y="232" width="290" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="285" y="254" text-anchor="middle" font-size="11.5" fill="#4a7a3a">x=2："aa" 出现 (3−2+1)+(3−2+1) = 4 次 ≥ 3 ✓</text>
    <!-- x=3 row -->
    <rect x="140" y="272" width="290" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="285" y="294" text-anchor="middle" font-size="11.5" fill="#b85450">x=3："aaa" 出现 1+1 = 2 次 &lt; 3 ✗</text>
  </g>

  <path d="M 285 306 L 285 324" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="185" y="326" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="285" y="348" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 2</text>

  <!-- official examples -->
  <rect x="40" y="372" width="440" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">官方示例对照："aaaa" → len 前三大 4,3,2 → 2；"abcdef" → 每组仅 1 个值 → −1；</text>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">"abcaba" → 'a' 的三个 len 均为 1 → 第三大 = 1 → 答案 1</text>
</svg>
