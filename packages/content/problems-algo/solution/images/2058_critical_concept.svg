<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：临界点 = 局部极大值 / 局部极小值</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">val 严格大于左右邻居 → 极大；严格小于左右邻居 → 极小</text>

  <!-- Example label -->
  <text x="24" y="92" font-size="10.5" fill="#666">head = [5, 3, 1, 2, 5, 1, 2]</text>

  <!-- Position labels (1-indexed) -->
  <text x="68"  y="80" text-anchor="middle" font-size="9.5" fill="#aaa">pos 1</text>
  <text x="128" y="80" text-anchor="middle" font-size="9.5" fill="#aaa">pos 2</text>
  <text x="188" y="80" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">pos 3</text>
  <text x="248" y="80" text-anchor="middle" font-size="9.5" fill="#aaa">pos 4</text>
  <text x="308" y="80" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">pos 5</text>
  <text x="368" y="80" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">pos 6</text>
  <text x="428" y="80" text-anchor="middle" font-size="9.5" fill="#aaa">pos 7</text>

  <!-- Node 1: val=5 (head, not critical) -->
  <rect x="44" y="92" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <path d="M 92 112 L 116 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 2: val=3 (not critical, 3<5 but 3>1, neither strictly both) -->
  <rect x="104" y="92" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="128" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <path d="M 152 112 L 176 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 3: val=1 (local MINIMA, green) -->
  <rect x="164" y="92" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="188" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="188" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">极小</text>
  <path d="M 212 112 L 236 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 4: val=2 (not critical) -->
  <rect x="224" y="92" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="248" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <path d="M 272 112 L 296 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 5: val=5 (local MAXIMA, red) -->
  <rect x="284" y="92" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="308" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <text x="308" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">极大</text>
  <path d="M 332 112 L 356 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 6: val=1 (local MINIMA, green) -->
  <rect x="344" y="92" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="368" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="368" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">极小</text>
  <path d="M 392 112 L 416 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 7: val=2 (tail, not critical) -->
  <rect x="404" y="92" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="428" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="464" y="118" font-size="11" fill="#888">→ null</text>

  <!-- Comparison annotations for critical nodes -->
  <!-- Node 3 annotation: 1 < 3 and 1 < 2 -->
  <text x="188" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1 &lt; 3 且 1 &lt; 2</text>

  <!-- Node 5 annotation: 5 > 2 and 5 > 1 -->
  <text x="308" y="172" text-anchor="middle" font-size="9.5" fill="#b85450">5 &gt; 2 且 5 &gt; 1</text>

  <!-- Node 6 annotation: 1 < 5 and 1 < 2 -->
  <text x="368" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1 &lt; 5 且 1 &lt; 2</text>

  <!-- Distance boxes -->
  <rect x="40" y="200" width="240" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">minDistance = 相邻临界点最小间距</text>
  <text x="160" y="238" text-anchor="middle" font-size="10.5" fill="#555">pos6 − pos5 = 6 − 5 = 1</text>
  <text x="160" y="254" text-anchor="middle" font-size="10" fill="#888">(只看相邻对的差，取最小)</text>

  <rect x="290" y="200" width="240" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">maxDistance = 首尾临界点间距</text>
  <text x="410" y="238" text-anchor="middle" font-size="10.5" fill="#555">pos6 − pos3 = 6 − 3 = 3</text>
  <text x="410" y="254" text-anchor="middle" font-size="10" fill="#888">(最远一对 = 末个 − 首个)</text>

  <!-- Bottom insight -->
  <rect x="40" y="280" width="490" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何 max 只看首尾、min 只看相邻？</text>
  <text x="285" y="316" text-anchor="middle" font-size="10.5" fill="#555">临界点位置升序排列 → 最大差必在首末，最小差必在某对相邻之间</text>

  <!-- Footer -->
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#aaa">头尾节点无前后邻居 → 不可能是临界点 · 临界点 &lt; 2 时返回 [-1,-1]</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n) · 空间 O(1)（只记 first / prev / minGap）</text>
</svg>
