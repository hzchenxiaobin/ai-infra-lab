<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：模式 [4,2,8]，单趟 DFS 携带 j 下行，节点 8 处 j=3 命中</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">节点旁标「j=出口」；红路径为成功匹配；蓝节点发生过失配回退</text>

  <!-- ===== Left: tree with j labels ===== -->
  <g font-size="12">
    <!-- edges -->
    <line x1="180" y1="78" x2="110" y2="102" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="180" y1="78" x2="250" y2="102" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="110" y1="130" x2="150" y2="154" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="250" y1="130" x2="250" y2="154" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>
    <line x1="150" y1="182" x2="120" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="250" y1="182" x2="220" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="250" y1="182" x2="300" y2="206" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>

    <!-- nodes -->
    <circle cx="180" cy="72" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="77" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="180" y="58" text-anchor="middle" font-size="9" fill="#446688">j=0</text>

    <circle cx="110" cy="116" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="110" y="121" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="110" y="102" text-anchor="middle" font-size="9" fill="#446688">j=1</text>

    <circle cx="250" cy="116" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="250" y="121" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="250" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">j=1</text>

    <circle cx="150" cy="168" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="150" y="173" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="150" y="154" text-anchor="middle" font-size="9" fill="#446688">j=2</text>

    <circle cx="250" cy="168" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="250" y="173" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="250" y="154" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">j=2</text>

    <circle cx="120" cy="220" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="225" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="120" y="240" text-anchor="middle" font-size="9" fill="#446688">j=0↩</text>

    <circle cx="220" cy="220" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="225" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="220" y="240" text-anchor="middle" font-size="9" fill="#446688">j=0↩</text>

    <circle cx="300" cy="220" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="300" y="225" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="300" y="240" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">j=3 ✓</text>
  </g>

  <text x="180" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4→2→8 命中；↩ 表示失配回退</text>

  <!-- ===== Right: step table ===== -->
  <text x="490" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">DFS 前序逐节点（pattern p=[4,2,8]）</text>

  <!-- header -->
  <rect x="360" y="74" width="270" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <text x="430" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">val</text>
  <text x="475" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">入j</text>
  <text x="555" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作 / 出j</text>

  <g font-size="9" fill="#555">
    <rect x="360" y="100" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="114" text-anchor="middle">1</text><text x="430" y="114" text-anchor="middle">1</text><text x="475" y="114" text-anchor="middle">0</text><text x="555" y="114" text-anchor="middle">1≠4 → 0</text>

    <rect x="360" y="122" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="136" text-anchor="middle">4L</text><text x="430" y="136" text-anchor="middle">4</text><text x="475" y="136" text-anchor="middle">0</text><text x="555" y="136" text-anchor="middle">=p[0] → 1</text>

    <rect x="360" y="144" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="158" text-anchor="middle">2a</text><text x="430" y="158" text-anchor="middle">2</text><text x="475" y="158" text-anchor="middle">1</text><text x="555" y="158" text-anchor="middle">=p[1] → 2</text>

    <rect x="360" y="166" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="180" text-anchor="middle">1lf</text><text x="430" y="180" text-anchor="middle">1</text><text x="475" y="180" text-anchor="middle">2</text><text x="555" y="180" text-anchor="middle">≠8,回退→0</text>

    <rect x="360" y="188" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="202" text-anchor="middle">4R</text><text x="430" y="202" text-anchor="middle">4</text><text x="475" y="202" text-anchor="middle">0</text><text x="555" y="202" text-anchor="middle">=p[0] → 1</text>

    <rect x="360" y="210" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="224" text-anchor="middle">2b</text><text x="430" y="224" text-anchor="middle">2</text><text x="475" y="224" text-anchor="middle">1</text><text x="555" y="224" text-anchor="middle">=p[1] → 2</text>

    <rect x="360" y="232" width="270" height="20" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="246" text-anchor="middle">6</text><text x="430" y="246" text-anchor="middle">6</text><text x="475" y="246" text-anchor="middle">2</text><text x="555" y="246" text-anchor="middle">≠8,回退→0</text>

    <!-- highlighted match row -->
    <rect x="360" y="254" width="270" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="380" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="430" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="475" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="555" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">=p[2] → 3=m ✓</text>
  </g>

  <!-- note -->
  <rect x="360" y="284" width="270" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 true</text>
  <text x="372" y="326" font-size="10" fill="#555">• 根 1≠4，j 保持 0，匹配「自动」</text>
  <text x="372" y="342" font-size="10" fill="#555">  从右子 4 才真正起跳</text>
  <text x="372" y="358" font-size="10" fill="#555">• 1lf、6 失配回退到 0，无残留</text>
  <text x="372" y="372" font-size="10" fill="#555">• 8 处 j 触顶 m，整段命中</text>

  <!-- bottom note -->
  <rect x="20" y="392" width="600" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：j 沿「向下路径」按值传递；兄弟分支共用入口 j 互不污染，失配靠 next[] 回退而非从头</text>
  <text x="320" y="434" text-anchor="middle" font-size="10" fill="#888">本例 next=[0,0,0]（模式无重复前后缀），回退直接归零；模式含重复前缀时 next 让进度部分保留，才是 KMP 真正省力处</text>
  <text x="320" y="452" text-anchor="middle" font-size="10" fill="#888">对比暴力：每个节点都从 head=4 重比，最坏 O(n·m)；KMP 单趟 O(n+m)</text>
</svg>
