<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：翻 x → 总和恰好减少 2x</text>

  <!-- row 1: all positive -->
  <rect x="100" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="274" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="48" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="298" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="356" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="412" y="69" font-size="12" fill="#446688" filter="url(#rough2)">S = 15</text>

  <!-- D box -->
  <rect x="60" y="94" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">n=5, target=−3 ⇒ D = S − target = 18（还需减 18）</text>

  <!-- flip arrows -->
  <path d="M 124 84 L 124 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 84 L 182 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="128" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">翻5</text>
  <text x="182" y="128" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">翻4</text>

  <!-- row 2: after flips -->
  <rect x="100" y="140" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="140" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="140" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="274" y="140" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="140" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="161" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="182" y="161" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−4</text>
  <text x="240" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="298" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="356" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="161" font-size="11" fill="#4a7a3a" filter="url(#rough2)">和 = −3 ✓</text>

  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x 从 n 到 1 扫描：只要 2x ≤ 剩余 D 就翻转 x</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">翻 5：D = 18−10 = 8；翻 4：D = 8−8 = 0，剩下的都不够翻</text>

  <!-- result box -->
  <rect x="80" y="228" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="14" fill="#2a4a1a" filter="url(#rough2)">升序输出：[ −5, −4, 1, 2, 3 ]</text>

  <!-- bottom notes -->
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">• 负数在前（绝对值降序），正数在后（升序）</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">• 让大数尽量取负 → 首元素尽可能小 → 字典序最小</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">• 无解：|target| &gt; S 或 (S − target) 为奇数</text>
</svg>
