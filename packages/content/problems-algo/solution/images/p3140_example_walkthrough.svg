<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：岛 A {1} 与岛 B {3,4,5}，聚合后取 len 最大</text>

  <!-- 输入表 Cinema -->
  <rect x="32" y="42" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">seat_id</text>
  <rect x="84" y="42" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">free</text>

  <rect x="32" y="66" width="52" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="82" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="66" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="32" y="90" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="84" y="90" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="32" y="114" width="52" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="84" y="114" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="32" y="138" width="52" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="84" y="138" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="32" y="162" width="52" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="84" y="162" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 箭头 1 -->
  <path d="M 140 110 L 166 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="153" y="100" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">筛+编号+差分</text>

  <!-- 中间表：筛后编号 -->
  <rect x="172" y="42" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">seat_id</text>
  <rect x="228" y="42" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">rn</text>
  <rect x="272" y="42" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">gid</text>

  <rect x="172" y="66" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="228" y="66" width="44" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="82" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <rect x="272" y="66" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="172" y="90" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="228" y="90" width="44" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>
  <rect x="272" y="90" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="172" y="114" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="228" y="114" width="44" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>
  <rect x="272" y="114" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="172" y="138" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="228" y="138" width="44" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="154" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4</text>
  <rect x="272" y="138" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="244" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">座位 2 被占 → 不入选</text>

  <!-- 箭头 2 -->
  <path d="M 320 110 L 346 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="333" y="100" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">GROUP BY gid</text>

  <!-- 右表 P -->
  <rect x="350" y="42" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">gid</text>
  <rect x="380" y="42" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">first</text>
  <rect x="434" y="42" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">last</text>
  <rect x="478" y="42" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="496" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">len</text>

  <rect x="350" y="66" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="380" y="66" width="54" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="434" y="66" width="44" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="478" y="66" width="36" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="350" y="90" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="380" y="90" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="407" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="434" y="90" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="456" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="478" y="90" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="496" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="432" y="130" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">P 表（每岛一行）：first/last/len = MIN/MAX/COUNT</text>

  <!-- 箭头 3 -->
  <path d="M 432 136 L 432 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="444" y="166" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">取 len 最大（rk=1）</text>

  <!-- 左下：两岛对比 -->
  <rect x="30" y="194" width="290" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="175" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两岛聚合结果：</text>
  <text x="175" y="232" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">岛 A：first=1, last=1, len=1（rk=2，落选）</text>
  <text x="175" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛 B：first=3, last=5, len=3（rk=1 ✓ 入选）</text>

  <!-- 右下：输出框 -->
  <rect x="340" y="190" width="172" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="426" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终输出</text>
  <text x="426" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">first=3, last=5, len=3</text>
  <text x="426" y="246" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（按 first_seat_id 升序）</text>

  <!-- 注意框 -->
  <rect x="30" y="268" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">岛 A 长 1：孤立空位也算一段（本题不设段长下限，603 才要求 ≥ 2）</text>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">若两岛 len 并列最大：RANK 并列第 1 → 两行都输出</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">流程一次成型：筛选 → 编号 → 差分 → 分组 → 取最大，全程只需一趟窗口排序 + 一趟分组</text>
</svg>
