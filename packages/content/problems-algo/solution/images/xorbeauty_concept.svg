<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐位独立 + 奇偶塌缩：n³ 个有效值按位拆开</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">异或只看「1 的总数奇偶」⇒ 每位只数「该位为 1 的三元组数」的奇偶</text>

  <!-- Bit view: 8 cells, c=3 ones (positions 1,4,6) -->
  <text x="48" y="80" font-size="10.5" fill="#666">第 b 位 →</text>
  <!-- ones -->
  <rect x="141" y="58" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="261" y="58" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="341" y="58" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- zeros -->
  <rect x="101" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="181" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="221" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="301" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="381" y="58" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- values -->
  <text x="120" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="160" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="200" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="240" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="320" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="360" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="400" y="79" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- brace labels -->
  <path d="M 141 96 L 141 100 L 360 100 L 360 96" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="250" y="114" text-anchor="middle" font-size="10.5" fill="#a07020" font-weight="bold">c 个 1（该位为 1 的元素个数）</text>
  <path d="M 101 96 L 101 102 L 400 102 M 101 96 L 101 100 M 400 96 L 400 100" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="420" y="80" font-size="10.5" fill="#446688">n−c 个 0</text>

  <!-- Count formula box -->
  <rect x="40" y="128" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">该位为 1 的三元组数  N_b = c · ( n² − (n−c)² )</text>
  <text x="260" y="162" text-anchor="middle" font-size="10.5" fill="#555">k 选「该位=1」：c 种 ｜ (i,j) 选「至少一个=1」：n²−(n−c)² 种</text>

  <!-- arrow down -->
  <path d="M 260 172 L 260 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Mod2 box -->
  <rect x="40" y="182" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">展开：N_b = c · (2nc − c²) = 2nc² − c³</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#555">对 2 取模：2nc² ≡ 0，c³ ≡ c (mod 2)  ⇒  N_b ≡ c (mod 2)</text>

  <!-- arrow down -->
  <path d="M 260 226 L 260 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="40" y="236" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⇒ 第 b 位结果 = 1  ⇔  c 为奇  ⇔  c mod 2 = 1</text>

  <!-- equivalence note -->
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#666">而 ⊕nums 第 b 位 =（数组中该位为 1 的元素个数 c）mod 2 —— 逐位相等</text>

  <!-- Final formula box -->
  <rect x="40" y="300" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">故：异或美丽值 = ⊕nums</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#666">n 在 2nc² 中被偶因子消去，结果与数组长度无关</text>
</svg>
