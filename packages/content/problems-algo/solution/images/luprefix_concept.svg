<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：指针 ans 只向右推进</text>

  <!-- video index labels -->
  <g font-size="13" fill="#888" filter="url(#rough2)">
    <text x="120" y="92" text-anchor="middle">1</text>
    <text x="192" y="92" text-anchor="middle">2</text>
    <text x="264" y="92" text-anchor="middle">3</text>
    <text x="336" y="92" text-anchor="middle">4</text>
    <text x="408" y="92" text-anchor="middle">5</text>
    <text x="480" y="92" text-anchor="middle">6</text>
  </g>

  <!-- cells: 1,2,3 uploaded(green); 4 not(grey); 5 uploaded(green); 6 not(grey) -->
  <rect x="88" y="104" width="64" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="160" y="104" width="64" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="135" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="232" y="104" width="64" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="135" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="304" y="104" width="64" height="50" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="135" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="376" y="104" width="64" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="135" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="448" y="104" width="64" height="50" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="135" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- ans pointer: bracket over 1..3 (uploaded prefix) -->
  <path d="M88 168 L88 178 L296 178 L296 168" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="198" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">连续前缀 [1..ans]</text>
  <text x="192" y="216" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">ans = 3（最长的连续上传段）</text>

  <!-- gap marker at video 4 -->
  <path d="M336 158 L336 184" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="336" y="216" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">此处断链</text>
  <text x="336" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">seen[4]=false → 推进停止</text>

  <!-- while loop arrow -->
  <path d="M336 244 L448 244 L448 244" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="408" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">后面的 5 已上传也不影响 ans</text>

  <!-- summary note -->
  <rect x="70" y="276" width="460" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">while (ans &lt; n &amp;&amp; seen[ans+1]) ans++;</text>
  <text x="300" y="320" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans 单调递增，全程至多推进 n 次 → 摊还 O(1)</text>
</svg>
