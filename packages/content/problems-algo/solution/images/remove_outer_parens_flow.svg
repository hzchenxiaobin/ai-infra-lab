<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">计数法流程：用 balance 跟踪括号深度</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">balance 从 0→1 的 '(' 和 1→0 的 ')' 即为外层括号，跳过即可</text>

  <!-- ===== Left branch: c == '(' ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="220" height="210" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="140" y="84" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">读到 '('</text>

    <!-- decision diamond: balance > 0 ? -->
    <polygon points="140,96 186,118 140,140 94,118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="122" text-anchor="middle" fill="#333" font-size="11">balance &gt; 0 ?</text>

    <!-- Yes → keep (green) -->
    <path d="M 94 118 L 60 118 L 60 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="68" y="112" font-size="10" fill="#4a7a3a">Yes</text>
    <rect x="36" y="152" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="79" y="170" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="12">保留 '('</text>
    <text x="79" y="184" text-anchor="middle" fill="#4a7a3a" font-size="10">内部括号</text>

    <!-- No → skip (red) -->
    <path d="M 186 118 L 220 118 L 220 150" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="196" y="112" font-size="10" fill="#b85450">No</text>
    <rect x="176" y="152" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="219" y="170" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="12">跳过 '('</text>
    <text x="219" y="184" text-anchor="middle" fill="#b85450" font-size="10">外层括号</text>

    <!-- converge → balance++ -->
    <path d="M 79 192 L 79 210 L 140 210" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 219 192 L 219 210 L 140 210" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 140 210 L 140 222" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <rect x="88" y="224" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="244" text-anchor="middle" fill="#446688" font-weight="bold" font-size="12">balance += 1</text>
  </g>

  <!-- ===== Right branch: c == ')' ===== -->
  <g filter="url(#rough2)">
    <rect x="270" y="62" width="220" height="210" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="380" y="84" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">读到 ')'</text>

    <!-- balance-- first -->
    <rect x="330" y="96" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="380" y="116" text-anchor="middle" fill="#446688" font-weight="bold" font-size="12">balance -= 1</text>

    <path d="M 380 126 L 380 134" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- decision diamond: balance > 0 ? -->
    <polygon points="380,138 426,160 380,182 334,160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="164" text-anchor="middle" fill="#333" font-size="11">balance &gt; 0 ?</text>

    <!-- Yes → keep (green) -->
    <path d="M 334 160 L 300 160 L 300 192" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="308" y="154" font-size="10" fill="#4a7a3a">Yes</text>
    <rect x="276" y="194" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="319" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="12">保留 ')'</text>
    <text x="319" y="226" text-anchor="middle" fill="#4a7a3a" font-size="10">内部括号</text>

    <!-- No → skip (red) -->
    <path d="M 426 160 L 460 160 L 460 192" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="436" y="154" font-size="10" fill="#b85450">No</text>
    <rect x="416" y="194" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="459" y="212" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="12">跳过 ')'</text>
    <text x="459" y="226" text-anchor="middle" fill="#b85450" font-size="10">外层括号</text>
  </g>

  <!-- ===== Bottom insight ===== -->
  <rect x="30" y="288" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="308" font-size="11" fill="#d6a040" font-weight="bold">💡 一句话规则</text>
  <text x="46" y="324" font-size="11" fill="#555">'(' : 若 balance &gt; 0 则保留，然后 balance++；')' : 先 balance--，若 balance &gt; 0 则保留。</text>
  <text x="46" y="336" font-size="11" fill="#555">balance == 0 标志原语边界——此刻遇到的括号就是外层，跳过。</text>
</svg>
