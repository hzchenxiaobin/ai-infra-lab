<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 → 入桶 → 桶满出组</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="140" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: result = [], buckets = {}</text>

  <path d="M 270 74 L 270 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more people? -->
  <polygon points="270,88 380,118 270,148 160,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333">还有人 i ?</text>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#666">i &lt; n</text>

  <!-- Yes -> down -->
  <path d="M 270 148 L 270 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="160" font-size="11" fill="#82b366">是</text>

  <!-- Step: read size, add to bucket -->
  <rect x="130" y="168" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333">s = groupSizes[i]</text>
  <text x="270" y="198" text-anchor="middle" font-size="12" fill="#333">buckets[s].append(i)</text>

  <path d="M 270 204 L 270 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: bucket full? -->
  <polygon points="270,218 400,250 270,282 140,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#333">len(buckets[s])</text>
  <text x="270" y="262" text-anchor="middle" font-size="12" fill="#333">== s ?</text>

  <!-- Yes (full) -> left, emit group -->
  <path d="M 140 250 L 96 250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Emit group box -->
  <rect x="20" y="232" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">出组</text>
  <text x="58" y="261" text-anchor="middle" font-size="9" fill="#4a7a3a">清空桶</text>

  <!-- arrow from emit down then right back to loop -->
  <path d="M 58 268 L 58 320 L 270 320" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="300" font-size="10" fill="#4a7a3a">result.append(group)</text>

  <!-- No (not full) -> right -->
  <path d="M 400 250 L 460 250 L 460 320 L 270 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <text x="470" y="285" font-size="10" fill="#888">继续等</text>

  <!-- i++ and loop back -->
  <rect x="200" y="310" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="329" text-anchor="middle" font-size="12" fill="#333">i++，回到判断</text>

  <!-- loop back to diamond1 -->
  <path d="M 200 324 L 60 324 L 60 118 L 160 118" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="220" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 44 220)">下一个</text>

  <!-- No (no more people) -> right to return -->
  <path d="M 380 118 L 440 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Return result -->
  <rect x="440" y="100" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="483" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">result</text>

  <!-- Summary -->
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#888">一次遍历 O(n)：每人入桶 O(1)，桶满即出组 O(1)</text>
  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#888">空间 O(n)：桶暂存所有人，出组后清空</text>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">正确性保证：同 size 的任意分组都合法，故桶满即出</text>
</svg>
