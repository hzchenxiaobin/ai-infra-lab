<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,3,4,4,5,5]</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">两条序列逐步生长，续接优先 → 最终均长度 ≥ 3</text>

  <!-- column headers -->
  <text x="40" y="70" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="100" y="70" font-size="10.5" fill="#888" font-weight="bold">x</text>
  <text x="150" y="70" font-size="10.5" fill="#888" font-weight="bold">决策</text>
  <text x="300" y="70" font-size="10.5" fill="#888" font-weight="bold">序列 A</text>
  <text x="470" y="70" font-size="10.5" fill="#888" font-weight="bold">序列 B</text>

  <line x1="20" y1="78" x2="600" y2="78" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- step 1: x=1 新建 -->
  <text x="40" y="100" font-size="11" fill="#333">1</text>
  <rect x="92" y="86" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="150" y="102" font-size="10.5" fill="#d6a040" font-weight="bold">新建 [1,2,3]</text>
  <rect x="284" y="86" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="298" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="312" y="86" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="102" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="340" y="86" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="354" y="102" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="300" y="120" font-size="9" fill="#888">↑ 消耗 1,2,3</text>

  <!-- step 3: x=3 新建 (seq B) -->
  <text x="40" y="146" font-size="11" fill="#333">3</text>
  <rect x="92" y="132" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="150" y="148" font-size="10.5" fill="#d6a040" font-weight="bold">新建 [3,4,5]</text>
  <rect x="454" y="132" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="468" y="148" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="482" y="132" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="148" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="510" y="132" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="524" y="148" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="470" y="166" font-size="9" fill="#888">↑ 消耗 3,4,5</text>

  <!-- step 5: x=4 续接 to A -->
  <text x="40" y="192" font-size="11" fill="#333">5</text>
  <rect x="92" y="178" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="150" y="194" font-size="10.5" fill="#4a7a3a" font-weight="bold">续接 → A</text>
  <rect x="284" y="178" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="298" y="194" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="312" y="178" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="194" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="340" y="178" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="354" y="194" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="368" y="178" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="300" y="212" font-size="9" fill="#4a7a3a">↑ tails[3]&gt;0，接到 A 末尾</text>

  <!-- step 7: x=5 续接 to A -->
  <text x="40" y="238" font-size="11" fill="#333">7</text>
  <rect x="92" y="224" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="150" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold">续接 → A</text>
  <rect x="284" y="224" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="298" y="240" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="312" y="224" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="240" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="340" y="224" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="354" y="240" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="368" y="224" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="240" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="396" y="224" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="300" y="258" font-size="9" fill="#4a7a3a">↑ tails[4]&gt;0，接到 A 末尾</text>

  <line x1="20" y1="276" x2="600" y2="276" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- final result -->
  <text x="40" y="304" font-size="11" fill="#444" font-weight="bold">结果</text>
  <rect x="270" y="290" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="355" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A = [1,2,3,4,5]  长度 5 ✓</text>
  <rect x="270" y="322" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">B = [3,4,5]  长度 3 ✓</text>

  <!-- key insight box -->
  <rect x="40" y="362" width="540" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">关键决策：步骤 5 的 x=4 选择续接而非新建</text>
  <text x="310" y="400" text-anchor="middle" font-size="10.5" fill="#555">若错误新建 [4,5,6]，则 freq[6]=0 → 失败</text>
  <text x="310" y="416" text-anchor="middle" font-size="10.5" fill="#555">续接不消耗未来资源，是"免费"操作；新建抢占 x+1、x+2 → 奢侈</text>
  <text x="310" y="434" text-anchor="middle" font-size="10" fill="#888">被跳过的步骤(2,4,6,8)的元素已被前面新建时预消耗，freq[x]==0 直接 continue</text>
</svg>
