<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">凯撒整体移位：相对差不变 ⇒ 规范化后哈希分组</text>

  <!-- 单词行：fusion +6 layout -->
  <g filter="url(#rough2)">
    <text x="157" y="42" text-anchor="middle" font-size="11" fill="#666">words[0]</text>
    <rect x="55"  y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="90"  y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="125" y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="160" y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="195" y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="48" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70"  y="68" text-anchor="middle" font-size="13" fill="#333">f</text>
    <text x="105" y="68" text-anchor="middle" font-size="13" fill="#333">u</text>
    <text x="140" y="68" text-anchor="middle" font-size="13" fill="#333">s</text>
    <text x="175" y="68" text-anchor="middle" font-size="13" fill="#333">i</text>
    <text x="210" y="68" text-anchor="middle" font-size="13" fill="#333">o</text>
    <text x="245" y="68" text-anchor="middle" font-size="13" fill="#333">n</text>

    <path d="M 272 63 L 320 63" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="297" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">整体 +6</text>
    <text x="297" y="82" text-anchor="middle" font-size="10" fill="#b85450">（z→a 循环）</text>

    <text x="432" y="42" text-anchor="middle" font-size="11" fill="#666">words[1]</text>
    <rect x="330" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="365" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="400" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="435" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="470" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="505" y="48" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="345" y="68" text-anchor="middle" font-size="13" fill="#333">l</text>
    <text x="380" y="68" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="415" y="68" text-anchor="middle" font-size="13" fill="#333">y</text>
    <text x="450" y="68" text-anchor="middle" font-size="13" fill="#333">o</text>
    <text x="485" y="68" text-anchor="middle" font-size="13" fill="#333">u</text>
    <text x="520" y="68" text-anchor="middle" font-size="13" fill="#333">t</text>
  </g>

  <!-- 下行箭头：减首字母 -->
  <path d="M 157 84 L 157 100" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 84 L 432 100" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个字母减去首字母（mod 26）</text>

  <!-- 差值向量行 -->
  <g filter="url(#rough2)">
    <rect x="55"  y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="90"  y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="125" y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="160" y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="195" y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="104" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70"  y="124" text-anchor="middle" font-size="11.5" fill="#33506b">0</text>
    <text x="105" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">15</text>
    <text x="140" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">13</text>
    <text x="175" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">3</text>
    <text x="210" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">9</text>
    <text x="245" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">8</text>

    <text x="297" y="126" text-anchor="middle" font-size="24" fill="#333">=</text>

    <rect x="330" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="365" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="400" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="435" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="470" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="505" y="104" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="345" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">0</text>
    <text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">15</text>
    <text x="415" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">13</text>
    <text x="450" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">3</text>
    <text x="485" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">9</text>
    <text x="520" y="124" text-anchor="middle" font-size="11.5" fill="#2f5d24">8</text>
  </g>

  <text x="280" y="158" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">差值向量相同 ⇒ 可整体移位互相得到 ⇒ 相似</text>

  <!-- 规范化规则框 -->
  <g filter="url(#rough2)">
    <rect x="35" y="172" width="490" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="194" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">规范化（哈希 key）：把首字符平移回 'a'</text>
    <text x="280" y="216" text-anchor="middle" font-size="12" fill="#8a6d1a">key[p] = ( s[p] − s[0] + 26 ) % 26</text>
    <text x="170" y="242" text-anchor="middle" font-size="12.5" fill="#33506b">fusion → apdnji</text>
    <text x="390" y="242" text-anchor="middle" font-size="12.5" fill="#2f5d24">layout → apdnji</text>
    <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#8a6d1a">同 key 的字符串两两相似：一组 c 个 ⇒ 贡献 c·(c−1)/2 对</text>
    <text x="280" y="294" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">本例 cnt = { apdnji: 2 } ⇒ 答案 = 2×1/2 = 1</text>
    <text x="280" y="318" text-anchor="middle" font-size="11" fill="#666">又如 [ab, aa, za, aa]：key 依次 ab, aa, ab, aa ⇒ 1+1 = 2</text>
  </g>
</svg>
