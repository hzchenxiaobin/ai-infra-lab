<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 start 排序后，冲突必出现在相邻会议之间</text>

  <!-- timeline -->
  <line x1="50" y1="232" x2="510" y2="232" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 510 232 L 502 228 L 502 240 Z" fill="#888" filter="url(#rough2)"/>
  <text x="518" y="236" font-size="10.5" fill="#888">t</text>
  <g font-size="10" fill="#888" text-anchor="middle">
    <line x1="70" y1="228" x2="70" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="252">0</text>
    <line x1="140" y1="228" x2="140" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="140" y="252">5</text>
    <line x1="210" y1="228" x2="210" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="210" y="252">10</text>
    <line x1="280" y1="228" x2="280" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="280" y="252">15</text>
    <line x1="350" y1="228" x2="350" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="252">20</text>
    <line x1="490" y1="228" x2="490" y2="238" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="490" y="252">30</text>
  </g>

  <!-- sorted meetings: A[0,30] B[5,10] C[15,20] -->
  <rect x="70" y="72" width="420" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="89" font-size="12" fill="#b85450" font-weight="bold">A [0,30]</text>

  <rect x="140" y="108" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="125" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">B [5,10]</text>

  <rect x="280" y="144" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="161" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">C [15,20]</text>

  <!-- compare A vs B: overlap -->
  <path d="M 175 96 L 175 108" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="300" y="104" font-size="11" fill="#b85450" font-weight="bold">B.start(5) &lt; A.end(30) → 冲突!</text>

  <!-- compare B vs C: no overlap -->
  <path d="M 255 132 L 280 144" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">C.start(15) ≥ B.end(10) → OK</text>

  <!-- conclusion box -->
  <rect x="32" y="282" width="476" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="304" font-size="12" fill="#7a5415" font-weight="bold">关键洞察：排序后，若会议 i 与 i−1 不重叠，则与更早的会议也不重叠。</text>
  <text x="48" y="322" font-size="11" fill="#444">因为排序保证 start₁ ≤ start₂ ≤ … ，i−1 是 start 比 i 小中最大的那个，</text>
  <text x="48" y="338" font-size="11" fill="#444">若 i−1 的 end 都不超过 i 的 start，更早的 end 只可能更小（更早结束或被覆盖）。</text>
  <text x="48" y="354" font-size="11" fill="#444">→ 只需检查相邻对，O(n) 一遍扫描即可判定能否参加所有会议。</text>
</svg>
