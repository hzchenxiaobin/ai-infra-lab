<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aaba*" → "aab"</text>

  <!-- header row: y=40..70, cols at x = 15,55,105,245,345,425,505 -->
  <rect x="15" y="40" width="490" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="35" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="80" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="295" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 'a'</text>
  <text x="385" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 'b'</text>
  <text x="465" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">removed</text>

  <!-- row 0 -->
  <rect x="15" y="70" width="490" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="35" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="80" y="93" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="175" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 0 入桶 'a'</text>
  <text x="295" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0]</text>
  <text x="385" y="93" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="465" y="93" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 1 -->
  <rect x="15" y="106" width="490" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="35" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="80" y="129" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="175" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 1 入桶 'a'</text>
  <text x="295" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="385" y="129" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="465" y="129" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 2 -->
  <rect x="15" y="142" width="490" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="35" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="80" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="175" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 2 入桶 'b'</text>
  <text x="295" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="385" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="465" y="165" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 3 -->
  <rect x="15" y="178" width="490" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="35" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="80" y="201" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="175" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 3 入桶 'a'</text>
  <text x="295" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1, 3]</text>
  <text x="385" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="465" y="201" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 4 (star) -->
  <rect x="15" y="214" width="490" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="35" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="80" y="237" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="175" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹桶 'a' 栈顶 3</text>
  <text x="295" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="385" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="465" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">{3}</text>

  <!-- column separators -->
  <path d="M 55 40 L 55 250" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 105 40 L 105 250" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 245 40 L 245 250" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 345 40 L 345 250" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 425 40 L 425 250" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="30" y="264" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留非 '*' 且未删的下标 0, 1, 2 → 拼接得 "aab"</text>

  <!-- second example -->
  <rect x="30" y="316" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">再练一个：s = "ab*c*d" → "cd"</text>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 1 个 '*' 弹桶 'a' 的 0，第 2 个 '*' 弹桶 'b' 的 1</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">剩下标 3, 5 → "cd"</text>
</svg>
