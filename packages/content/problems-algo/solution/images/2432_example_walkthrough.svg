<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐任务差分 → 比较更新 → 平局取最小 id</text>

  <!-- ===== Example 1: n=10, logs=[[0,3],[2,5],[0,9],[1,15]] ===== -->
  <text x="40" y="48" font-size="12" fill="#446688" font-weight="bold">示例 1：n=10, logs=[[0,3],[2,5],[0,9],[1,15]]</text>

  <!-- header -->
  <rect x="60" y="56" width="480" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i</text>
  <text x="120" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">id</text>
  <text x="170" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">leave</text>
  <text x="225" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">prev</text>
  <text x="275" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">dur</text>
  <text x="380" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">比较结果</text>
  <text x="500" y="73" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">ans(maxDur)</text>

  <line x1="100" y1="56" x2="100" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="56" x2="140" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="56" x2="200" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="56" x2="250" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="56" x2="300" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="56" x2="460" y2="184" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0: dur3, 3>-1 update -->
  <rect x="60" y="80" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="120" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="170" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="225" y="97" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="275" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="380" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 &gt; -1 → 更新</text>
  <text x="500" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0 (3)</text>

  <!-- i=1: dur2, 2>3 no -->
  <rect x="60" y="106" width="480" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="80" y="123" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="120" y="123" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="170" y="123" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="225" y="123" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="275" y="123" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <text x="380" y="123" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 &gt; 3 ✗</text>
  <text x="500" y="123" text-anchor="middle" font-size="10.5" fill="#888">0 (3)</text>

  <!-- i=2: dur4, 4>3 update -->
  <rect x="60" y="132" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="120" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="170" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="225" y="149" text-anchor="middle" font-size="10.5" fill="#888">5</text>
  <text x="275" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="380" y="149" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 &gt; 3 → 更新</text>
  <text x="500" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0 (4)</text>

  <!-- i=3: dur6, 6>4 update  <-- final answer -->
  <rect x="60" y="158" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="170" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">15</text>
  <text x="225" y="175" text-anchor="middle" font-size="10.5" fill="#888">9</text>
  <text x="275" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">6</text>
  <text x="380" y="175" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6 &gt; 4 → 更新（最长）</text>
  <text x="500" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1 (6)</text>

  <rect x="60" y="56" width="480" height="128" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="552" y="105" width="0" height="0" fill="none"/>

  <!-- ===== Example 3 (tie): n=2, logs=[[0,10],[1,20]] ===== -->
  <text x="40" y="206" font-size="12" fill="#d6a040" font-weight="bold">示例 3（平局）：n=2, logs=[[0,10],[1,20]]</text>

  <rect x="60" y="214" width="480" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i</text>
  <text x="120" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">id</text>
  <text x="170" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">leave</text>
  <text x="225" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">prev</text>
  <text x="275" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">dur</text>
  <text x="380" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">比较结果</text>
  <text x="500" y="231" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">ans(maxDur)</text>

  <line x1="100" y1="214" x2="100" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="214" x2="140" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="214" x2="200" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="214" x2="250" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="214" x2="300" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="214" x2="460" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 dur10 update -->
  <rect x="60" y="238" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="120" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="170" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="225" y="255" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="275" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="380" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10 &gt; -1 → 更新</text>
  <text x="500" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0 (10)</text>

  <!-- i=1 dur10 tie -->
  <rect x="60" y="264" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="120" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="170" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">20</text>
  <text x="225" y="281" text-anchor="middle" font-size="10.5" fill="#888">10</text>
  <text x="275" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="380" y="281" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">10&gt;10 ✗; 10==10 → min(0,1)=0</text>
  <text x="500" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">0 (10)</text>

  <rect x="60" y="214" width="480" height="76" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- footer: answers + key insight -->
  <rect x="40" y="312" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案：示例1 → 1（任务3·员工1·用时6）；示例3 → 0（并列用时10，取最小 id）</text>

  <rect x="40" y="356" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：dur = leave - prev（差分）；严格 &gt; 刷新最大，== 时显式取 min(ans, id)</text>
  <text x="290" y="390" text-anchor="middle" font-size="10" fill="#888">只用 &gt; 不够——会把先出现的大 id 错当答案保留</text>
</svg>
