<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">算法流程：双重循环枚举数对，逐对 gcd 打擂台</text>

    <!-- ① 初始化 -->
    <rect x="90" y="32" width="320" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="51" text-anchor="middle" font-size="10.5" fill="#2f5d24">① ans ← 0（n = len(nums)，n ≥ 2）</text>
    <path d="M250 62 V 78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- 双重循环容器 -->
    <rect x="58" y="82" width="404" height="268" rx="10" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="70" y="74" width="150" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="145" y="85.5" text-anchor="middle" font-size="8" fill="#33506b">对每个 i：0 ≤ i &lt; n−1</text>

    <!-- ② 枚举 j -->
    <rect x="90" y="96" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="116" text-anchor="middle" font-size="10.5" fill="#33506b">② j 从 i+1 到 n−1：数对 (nums[i], nums[j])</text>
    <path d="M250 128 V 142" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- ③ gcd -->
    <rect x="90" y="142" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="162" text-anchor="middle" font-size="10.5" fill="#33506b">③ g ← gcd(nums[i], nums[j])（欧几里得）</text>
    <path d="M250 174 V 188" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- ④ 先除后乘 -->
    <rect x="90" y="188" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="208" text-anchor="middle" font-size="10.5" fill="#33506b">④ s ← (nums[i]/g) × (nums[j]/g)（先除后乘）</text>
    <path d="M250 220 V 236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- 菱形判定 -->
    <polygon points="250,236 330,270 250,304 170,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="266" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold">s &gt; ans ?</text>
    <text x="250" y="280" text-anchor="middle" font-size="8" fill="#a08040">打擂台</text>

    <!-- 是 → ans ← s -->
    <path d="M330 270 H 352" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="341" y="262" text-anchor="middle" font-size="8.5" fill="#b85450">是</text>
    <rect x="356" y="252" width="104" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="408" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans ← s</text>

    <!-- 否 → 下一对 -->
    <path d="M250 304 V 330" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="320" font-size="8.5" fill="#4a7a3a">否</text>

    <!-- 更新后同样进入下一对，汇合后回到 ② -->
    <path d="M408 288 V 330" stroke="#446688" stroke-width="1.8"/>
    <path d="M250 330 H 486" stroke="#446688" stroke-width="1.8"/>
    <path d="M486 330 V 112 H 414" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="380" y="324" text-anchor="middle" font-size="8" fill="#888">下一对数对（更新与否都继续）</text>

    <!-- 枚举完退出 -->
    <path d="M250 350 V 362" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="258" y="358" font-size="8" fill="#888">全部数对枚举完</text>

    <!-- ⑤ 返回 -->
    <rect x="90" y="366" width="320" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="386" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">⑤ 返回 ans（上界 ≈ 10¹⁰，必须 64 位）</text>

    <text x="260" y="424" text-anchor="middle" font-size="8.5" fill="#999">C(2000, 2) ≈ 2×10⁶ 对 × 每对一次 gcd（最坏约 24 步）≈ 5×10⁷ 基本操作：C++ 毫秒级，Python 约 1~2 s</text>
  </g>
</svg>
