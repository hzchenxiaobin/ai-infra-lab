<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次遍历，每步 O(1)</text>

  <!-- 开始 -->
  <rect x="170" y="42" width="180" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">初始化 dp[0/1][1/2] = 0</text>

  <path d="M 260 74 L 260 88" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="105" y="92" width="310 " height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">取元素 x：p = x mod 2，q = 1 − p</text>

  <path d="M 260 126 L 260 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新① -->
  <rect x="70" y="144" width="380" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">① dp[p][2] ← dp[p][2] + dp[p][1]（旧值，先更新！）</text>

  <path d="M 260 180 L 260 194" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新② -->
  <rect x="70" y="198" width="380" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">② dp[p][1] ← dp[p][1] + dp[q][1] + dp[q][2] + 1</text>

  <path d="M 260 234 L 260 248" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,248 344,280 260,312 176,280" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">还有元素？</text>

  <!-- 是：回环 -->
  <path d="M 176 280 C 110 280, 62 260, 60 190 C 58 130, 70 110, 100 109" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="266" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 否：到输出 -->
  <path d="M 260 312 L 260 326" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="324" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 输出 -->
  <rect x="150" y="328" width="220" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">返回 Σdp mod 1e9+7</text>
</svg>
