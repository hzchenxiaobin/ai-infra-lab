<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心思路：按薪水排序 → 窗口累计求和 → 预算 70000 切分（高级先切，剩余给初级）</text>

  <!-- ===== Budget bar (top) ===== -->
  <text x="60" y="56" font-size="11" fill="#b85450" font-weight="bold">预算 70000</text>
  <rect x="60" y="62" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="310" y1="58" x2="310" y2="88" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="54" text-anchor="middle" font-size="8.5" fill="#b85450">切分线 70000</text>

  <!-- ===== Senior section ===== -->
  <text x="60" y="104" font-size="11" fill="#446688" font-weight="bold">① 高级组（按 salary 升序，窗口累计求和 cur）</text>

  <!-- senior row 1 -->
  <rect x="60" y="110" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="122" text-anchor="middle" font-size="9" fill="#333">salary 20000</text>
  <text x="100" y="134" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cur=20000 ✓</text>

  <!-- senior row 2 -->
  <rect x="148" y="110" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="122" text-anchor="middle" font-size="9" fill="#333">salary 20000</text>
  <text x="188" y="134" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cur=40000 ✓</text>

  <!-- senior row 3 (rejected) -->
  <rect x="236" y="110" width="80" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="122" text-anchor="middle" font-size="9" fill="#999">salary 50000</text>
  <text x="276" y="134" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">cur=90000 ✗</text>

  <!-- spent_senior annotation -->
  <path d="M60 144 L316 144" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="120" y="148" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="161" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">高级花费 spent = 40000</text>

  <!-- arrow down -->
  <path d="M190 170 L190 186" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="130" y="188" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="200" text-anchor="middle" font-size="8.5" fill="#d6a040">剩余预算 70000−40000=30000</text>

  <!-- ===== Junior section ===== -->
  <text x="60" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">② 初级组（累计 = 偏移 40000 + 初级前缀和）</text>

  <!-- junior row 1 -->
  <rect x="60" y="234" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="246" text-anchor="middle" font-size="9" fill="#333">salary 10000</text>
  <text x="100" y="258" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">cur=50000 ✓</text>

  <!-- junior row 2 -->
  <rect x="148" y="234" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="246" text-anchor="middle" font-size="9" fill="#333">salary 10000</text>
  <text x="188" y="258" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">cur=60000 ✓</text>

  <!-- junior row 3 (rejected) -->
  <rect x="236" y="234" width="80" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="246" text-anchor="middle" font-size="9" fill="#999">salary 40000</text>
  <text x="276" y="258" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">cur=100000 ✗</text>

  <!-- 70000 cut line spanning junior -->
  <line x1="316" y1="230" x2="316" y2="270" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="316" y="228" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">70000</text>

  <!-- ===== Right side: result ===== -->
  <rect x="400" y="110" width="180" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Senior 可雇用人数</text>
  <text x="490" y="152" text-anchor="middle" font-size="20" fill="#446688" font-weight="bold">2</text>

  <rect x="400" y="234" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Junior 可雇用人数</text>
  <text x="490" y="276" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- arrows to result -->
  <path d="M316 125 L398 140" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M316 249 L398 264" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Bottom callouts ===== -->
  <rect x="60" y="300" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="320" font-size="10" fill="#446688" font-weight="bold">贪心：薪水升序，低薪优先</text>
  <text x="75" y="336" font-size="9.5" fill="#555">同样预算 → 雇低薪能雇更多人</text>
  <text x="75" y="350" font-size="9.5" fill="#555">SUM(salary) OVER (ORDER BY salary)</text>

  <rect x="320" y="300" width="240" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="335" y="320" font-size="10" fill="#d6a040" font-weight="bold">预算传递：偏移量</text>
  <text x="335" y="336" font-size="9.5" fill="#555">初级 cur = spent_Senior + 前缀和</text>
  <text x="335" y="350" font-size="9.5" fill="#555">spent = MAX(cur) WHERE cur ≤ 70000</text>

  <rect x="60" y="370" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="390" font-size="10" fill="#b85450" font-weight="bold">⚠️ ROWS vs RANGE</text>
  <text x="75" y="406" font-size="9.5" fill="#555">默认 RANGE 让并列薪水共享累计值 → 可能少雇。显式写 ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW 才正确</text>
</svg>
