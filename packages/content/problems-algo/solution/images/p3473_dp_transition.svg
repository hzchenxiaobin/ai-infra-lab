<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最后一段独立决策，max 里拆出 P[i]</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1（k=2, m=2）：最后一段取 nums[3..5]，前 3 个元素中已选好 1 段</text>

  <!-- array boxes -->
  <text x="62" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">nums</text>

  <rect x="85" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="73" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="135" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="73" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="185" y="54" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="207" y="73" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-1</text>
  <rect x="235" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="285" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="335" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- t / i markers -->
  <path d="M 235 50 L 235 96" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="235" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t = 3</text>
  <path d="M 379 50 L 379 96" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="379" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 6</text>

  <!-- brackets -->
  <path d="M 85 98 L 85 106 L 229 106 L 229 98" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="157" y="121" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">dp[j−1][t]：前 t 个选好 j−1 段</text>
  <path d="M 235 98 L 235 106 L 379 106 L 379 98" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="307" y="121" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">P[i]−P[t]：第 j 段（长 ≥ m）</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="40" y="134" width="440" height="56" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="260" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">dp[j][i] = max( dp[j][i−1] ,  P[i] + max{ dp[j−1][t] − P[t] } )</text>
    <text x="260" y="178" text-anchor="middle" font-size="9.5" fill="#55677d">t ∈ [ (j−1)·m , i−m ]：最后一段为 nums[t..i−1]，长度 i−t ≥ m；dp[j][i−1] = 跳过第 i 个元素</text>
  </g>

  <!-- worked example -->
  <g filter="url(#rough2)">
    <rect x="105" y="198" width="310" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="260" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">示例 1 收尾：dp[2][6] = 12 + (3 − 2) = 13</text>
  </g>

  <!-- two notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="236" width="220" height="64" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="150" y="254" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">① 窗口只右扩 ⇒ 单变量足够</text>
    <text x="150" y="270" text-anchor="middle" font-size="9.5" fill="#55677d">i 每加 1，恰好只有 t = i−m 新进入</text>
    <text x="150" y="284" text-anchor="middle" font-size="9.5" fill="#55677d">best 一路取 max，无需单调队列</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="280" y="236" width="220" height="64" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="390" y="254" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">② 下界 (j−1)·m 保证塞得下</text>
    <text x="390" y="270" text-anchor="middle" font-size="9.5" fill="#55677d">前 t 个元素至少容纳 j−1 个长 m 的段</text>
    <text x="390" y="284" text-anchor="middle" font-size="9.5" fill="#55677d">k·m ≤ n ⇒ 恒有解，dp[k][n] 即答案</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="40" y="310" width="440" height="40" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="260" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">外层 j（1..k）× 内层 i（单趟）⇒ O(nk) 时间；滚动数组 O(n) 空间</text>
    <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#55677d">n ≤ 2000、k ≤ n/m：最坏约 4×10⁶ 次基本操作</text>
  </g>
</svg>
