<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [5,19,8,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">total = 33，target = 16.5；每次取堆顶最大减半，累计收益达标即停</text>

  <!-- ===== table header ===== -->
  <rect x="24" y="62" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>

  <rect x="72" y="62" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">堆顶最大</text>

  <rect x="150" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">减半为</text>

  <rect x="222" y="62" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">本次收益</text>

  <rect x="298" y="62" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">累计削减</text>

  <rect x="386" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">≥16.5?</text>

  <rect x="468" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="503" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">堆(后)</text>

  <!-- ===== row op1 ===== -->
  <rect x="24" y="94" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="47" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="72" y="94" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">19</text>
  <rect x="150" y="94" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="116" text-anchor="middle" font-size="11" fill="#333">9.5</text>
  <rect x="222" y="94" width="74" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="259" y="116" text-anchor="middle" font-size="11" fill="#333">9.5</text>
  <rect x="298" y="94" width="86" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="341" y="116" text-anchor="middle" font-size="11" fill="#333">9.5</text>
  <rect x="386" y="94" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="116" text-anchor="middle" font-size="11" fill="#888">否</text>
  <rect x="468" y="94" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="503" y="116" text-anchor="middle" font-size="9.5" fill="#555">9.5,8,5,1</text>

  <!-- ===== row op2 ===== -->
  <rect x="24" y="130" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="47" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="72" y="130" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9.5</text>
  <rect x="150" y="130" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="152" text-anchor="middle" font-size="11" fill="#333">4.75</text>
  <rect x="222" y="130" width="74" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="259" y="152" text-anchor="middle" font-size="11" fill="#333">4.75</text>
  <rect x="298" y="130" width="86" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="341" y="152" text-anchor="middle" font-size="11" fill="#333">14.25</text>
  <rect x="386" y="130" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="426" y="152" text-anchor="middle" font-size="11" fill="#888">否</text>
  <rect x="468" y="130" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="503" y="152" text-anchor="middle" font-size="9.5" fill="#555">8,5,4.75,1</text>

  <!-- ===== row op3 (done) ===== -->
  <rect x="24" y="166" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="72" y="166" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="150" y="166" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="222" y="166" width="74" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="298" y="166" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18.25</text>
  <rect x="386" y="166" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="468" y="166" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="503" y="188" text-anchor="middle" font-size="9.5" fill="#555">5,4.75,4,1</text>

  <!-- ===== conclusion box ===== -->
  <rect x="24" y="214" width="514" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="281" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结论</text>
  <text x="281" y="254" text-anchor="middle" font-size="11" fill="#333">3 步后累计削减 18.25 ≥ 16.5（目标），停止</text>
  <text x="281" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = 3</text>

  <!-- ===== detail illustration ===== -->
  <text x="24" y="300" font-size="10.5" fill="#444" font-weight="bold">要点：19 被减半两次（19→9.5→4.75），减半后的数放回堆仍可能是最大值，可再次操作</text>
  <text x="24" y="318" font-size="10.5" fill="#444">最终数组 [5, 4.75, 4, 1]，和 = 14.75；削减 = 33 − 14.75 = 18.25 ≥ 16.5 ✓</text>
  <text x="24" y="336" font-size="10.5" fill="#888">上界验证：4 个数各减半一次 ⟹ 削减 = 33/2 = 16.5 = 目标，故操作数 ≤ 4；贪心 3 步更优</text>
</svg>
