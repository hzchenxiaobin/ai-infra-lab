<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：9 行 → 3 组 → 组内排序 → 拼接 → 按州升序</text>

  <rect x="40" y="44" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="59" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">state</text>
  <rect x="116" y="44" width="136" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="59" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">组内 city（输入序）</text>
  <rect x="256" y="44" width="136" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="59" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ORDER BY city 后</text>
  <rect x="396" y="44" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="59" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cities 拼接</text>

  <rect x="40" y="70" width="72" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">California</text>
  <rect x="116" y="70" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="88" font-size="8.5" fill="#333" filter="url(#rough2)">Los Angeles, San</text>
  <text x="124" y="102" font-size="8.5" fill="#333" filter="url(#rough2)">Francisco, San Diego</text>
  <rect x="256" y="70" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="264" y="88" font-size="8.5" fill="#333" filter="url(#rough2)">Los Angeles,</text>
  <text x="264" y="102" font-size="8.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">San Diego, San Francisco</text>
  <rect x="396" y="70" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="88" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">Los Angeles, San</text>
  <text x="404" y="102" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">Diego, San Francisco</text>

  <rect x="40" y="122" width="72" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="150" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">New York</text>
  <rect x="116" y="122" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="140" font-size="8.5" fill="#333" filter="url(#rough2)">New York City,</text>
  <text x="124" y="154" font-size="8.5" fill="#333" filter="url(#rough2)">Buffalo, Rochester</text>
  <rect x="256" y="122" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="264" y="140" font-size="8.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">Buffalo, New York</text>
  <text x="264" y="154" font-size="8.5" fill="#333" filter="url(#rough2)">City, Rochester</text>
  <rect x="396" y="122" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="140" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">Buffalo, New York</text>
  <text x="404" y="154" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">City, Rochester</text>

  <rect x="40" y="174" width="72" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Texas</text>
  <rect x="116" y="174" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="192" font-size="8.5" fill="#333" filter="url(#rough2)">Houston, Austin,</text>
  <text x="124" y="206" font-size="8.5" fill="#333" filter="url(#rough2)">Dallas</text>
  <rect x="256" y="174" width="136" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="264" y="192" font-size="8.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">Austin, Dallas,</text>
  <text x="264" y="206" font-size="8.5" fill="#333" filter="url(#rough2)">Houston</text>
  <rect x="396" y="174" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="192" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">Austin, Dallas,</text>
  <text x="404" y="206" font-size="8.5" fill="#2d5a1e" filter="url(#rough2)">Houston</text>

  <rect x="40" y="234" width="300" height="148" fill="#ffffff" stroke="#999" stroke-width="1" stroke-dasharray="5,4" rx="10" filter="url(#rough2)"/>
  <text x="190" y="256" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">四步走</text>
  <text x="56" y="278" font-size="9" fill="#446688" filter="url(#rough2)">① GROUP BY state：9 行 → 3 组（每组 3 城）</text>
  <text x="56" y="300" font-size="9" fill="#4a7a3a" filter="url(#rough2)">② 组内 ORDER BY city：SD↔SF 换位、</text>
  <text x="74" y="314" font-size="9" fill="#4a7a3a" filter="url(#rough2)">Austin / Dallas / Buffalo 提前（红色标记）</text>
  <text x="56" y="336" font-size="9" fill="#b85450" filter="url(#rough2)">③ SEPARATOR ', '：每州拼成一条串</text>
  <text x="56" y="358" font-size="9" fill="#d6a040" filter="url(#rough2)">④ ORDER BY state：C &lt; N &lt; T，输出 3 行</text>
  <text x="56" y="376" font-size="8" fill="#999" filter="url(#rough2)">（San Diego &lt; San Francisco：D &lt; F）</text>

  <rect x="352" y="234" width="168" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="436" y="256" text-anchor="middle" font-size="10" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">输出（3 行）</text>
  <text x="364" y="278" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">California</text>
  <text x="364" y="291" font-size="8" fill="#2d5a1e" filter="url(#rough2)">Los Angeles, San Diego,</text>
  <text x="364" y="303" font-size="8" fill="#2d5a1e" filter="url(#rough2)">San Francisco</text>
  <text x="364" y="322" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">New York</text>
  <text x="364" y="335" font-size="8" fill="#2d5a1e" filter="url(#rough2)">Buffalo, New York City,</text>
  <text x="364" y="347" font-size="8" fill="#2d5a1e" filter="url(#rough2)">Rochester</text>
  <text x="364" y="366" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Texas</text>
  <text x="364" y="379" font-size="8" fill="#2d5a1e" filter="url(#rough2)">Austin, Dallas, Houston</text>
</svg>
