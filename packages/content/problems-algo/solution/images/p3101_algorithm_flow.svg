<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一趟扫描：cur 记「以 i 结尾的交替子数组个数」</text>

  <!-- 开始 -->
  <rect x="190" y="44" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans = 0, cur = 0</text>
  <text x="342" y="65" font-size="11" fill="#d6a040" filter="url(#rough2)">← for i = 0 … n−1</text>

  <path d="M 260 76 V 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,98 372,150 260,202 148,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">i &gt; 0 且</text>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">nums[i] ≠ nums[i−1] ?</text>

  <!-- 是 分支 -->
  <path d="M 148 150 H 108 V 218" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="142" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="38" y="220" width="140" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="241" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">cur = cur + 1</text>

  <!-- 否 分支 -->
  <path d="M 372 150 H 412 V 218" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="142" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="342" y="220" width="140" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="241" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">cur = 1</text>

  <!-- 汇合 -->
  <path d="M 108 252 V 288 H 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 412 252 V 288 H 334" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="190" y="272" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans += cur</text>

  <path d="M 260 304 V 328" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="190" y="330" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a1f" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每个元素只看一次 → O(n) 时间 / O(1) 空间</text>
</svg>
