<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [-2,-1,0,0,1,2], target = 0</text>

  <!-- sorted array at top -->
  <text x="20" y="56" font-size="12" fill="#888">nums(排序后)：</text>
  <rect x="120" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-2</text>
  <rect x="166" y="42" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-1</text>
  <rect x="212" y="42" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="234" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="258" y="42" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="304" y="42" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="350" y="42" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="372" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="142" y="84" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="188" y="84" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="234" y="84" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="280" y="84" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="326" y="84" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="372" y="84" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- table headers -->
  <text x="20" y="112" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="96" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">j</text>
  <text x="140" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">left</text>
  <text x="188" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">right</text>
  <text x="280" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">四数之和</text>
  <text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="560" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">命中</text>
  <line x1="10" y1="120" x2="590" y2="120" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: i=0,j=1,l=2,r=5 sum=-1<0 left++ -->
  <text x="20" y="142" font-size="11" fill="#333">1</text>
  <text x="56" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="96" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="188" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#333">-1 &lt; 0</text>
  <text x="430" y="142" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">left++</text>
  <text x="560" y="142" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 2: i=0,j=1,l=4,r=5 sum=0 HIT -->
  <text x="20" y="166" font-size="11" fill="#333">2</text>
  <text x="56" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="96" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="140" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="188" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="248" y="154" width="64" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 == 0</text>
  <text x="430" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">记录</text>
  <text x="560" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[-2,-1,1,2]</text>

  <!-- Row 3: i=0,j=2,l=3,r=5 sum=0 HIT -->
  <text x="20" y="190" font-size="11" fill="#333">3</text>
  <text x="56" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="96" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="188" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="248" y="178" width="64" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 == 0</text>
  <text x="430" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">记录</text>
  <text x="560" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[-2,0,0,2]</text>

  <!-- Row 4: i=0,j=3 dedup skip -->
  <text x="20" y="214" font-size="11" fill="#333">4</text>
  <text x="56" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="96" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="188" y="214" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="280" y="214" text-anchor="middle" font-size="10.5" fill="#888">nums[3]==nums[2]</text>
  <text x="430" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">去重2 跳过</text>
  <text x="560" y="214" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 5: i=1, j=2, l=3, r=5, sum=1 > 0, right minus minus -->
  <text x="20" y="238" font-size="11" fill="#333">5</text>
  <text x="56" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="96" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="188" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#333">1 &gt; 0</text>
  <text x="430" y="238" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">right--</text>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 6: i=1,j=2,l=3,r=4 sum=0 HIT -->
  <text x="20" y="262" font-size="11" fill="#333">6</text>
  <text x="56" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="96" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="188" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="248" y="250" width="64" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 == 0</text>
  <text x="430" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">记录</text>
  <text x="560" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[-1,0,0,1]</text>

  <line x1="10" y1="276" x2="590" y2="276" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="292" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="314" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 [[-2,-1,1,2],[-2,0,0,2],[-1,0,0,1]] ✓</text>

  <!-- legend -->
  <text x="20" y="350" font-size="11" fill="#888" font-weight="bold">图例：</text>
  <rect x="70" y="340" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="94" y="352" font-size="10.5" fill="#444">i（固定①）</text>
  <rect x="160" y="340" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="352" font-size="10.5" fill="#444">j（固定②）</text>
  <rect x="250" y="340" width="18" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="352" font-size="10.5" fill="#444">left/right（双指针）</text>
  <rect x="380" y="340" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="404" y="352" font-size="10.5" fill="#4a7a3a" font-weight="bold">命中 target</text>

  <!-- footer note -->
  <rect x="40" y="376" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="11.5" fill="#444">三层去重：i 层（步4跳过重复 j=3）+ j 层 + 解后 left/right 层</text>
  <text x="300" y="412" text-anchor="middle" font-size="11" fill="#888">三次命中互不重复，无需额外去重集合</text>

  <rect x="40" y="424" width="520" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ 溢出坑：四个 10⁹ 相加 = 4×10⁹，超 32 位 int，C++ 用 long long</text>
</svg>
