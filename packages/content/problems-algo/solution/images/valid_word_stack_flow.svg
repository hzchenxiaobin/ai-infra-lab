<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">算法流程：栈匹配 "abc"</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">逐字符入栈，栈顶三字为 abc 即弹出，扫描结束判栈空</text>

  <!-- Start -->
  <ellipse cx="270" cy="78" rx="56" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 270 98 L 270 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="120" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="141" text-anchor="middle" font-size="12" fill="#555">初始化空栈 st</text>

  <path d="M 270 154 L 270 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="270,176 360,212 270,248 180,212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333">还有字符</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#333">未扫描?</text>

  <!-- No -> end check -->
  <path d="M 270 248 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="312" font-size="10" fill="#888">否</text>

  <!-- Yes -> push -->
  <path d="M 180 212 L 80 212 L 80 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="204" font-size="10" fill="#888">是</text>

  <rect x="20" y="252" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="273" text-anchor="middle" font-size="11" fill="#333">字符 ch 入栈</text>

  <path d="M 80 286 L 80 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check top3 decision -->
  <polygon points="80,316 200,352 80,388 -40,352" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="346" text-anchor="middle" font-size="11" fill="#333">栈顶 3 字</text>
  <text x="80" y="360" text-anchor="middle" font-size="11" fill="#333">== "abc"?</text>

  <!-- Yes -> pop 3 -->
  <path d="M 200 352 L 320 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="344" font-size="10" fill="#888">是</text>

  <rect x="324" y="336" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="394" y="357" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">弹出 3 个字符</text>

  <!-- loop back from pop -->
  <path d="M 394 336 L 394 212 L 360 212" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> loop back -->
  <path d="M 80 388 L 80 408 L 270 408 L 270 212 L 360 212" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="10" fill="#888">否</text>

  <!-- End: stack empty? -->
  <polygon points="270,376 380,412 270,448 160,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#333">栈为空?</text>

  <path d="M 160 412 L 120 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="404" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <ellipse cx="60" cy="412" rx="56" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="417" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">有效 ✓</text>

  <path d="M 380 412 L 420 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="404" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <ellipse cx="478" cy="412" rx="56" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="417" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非法 ✗</text>
</svg>
