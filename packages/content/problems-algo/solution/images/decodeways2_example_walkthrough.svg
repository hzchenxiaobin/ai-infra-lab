<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：'1*' → 18 与 '2*' → 15</text>

  <!-- ============ 例 1: s = "1*" ============ -->
  <rect x="24" y="48" width="532" height="178" fill="#ffffff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="72" font-size="12.5" fill="#446688" font-weight="bold">s = "1*"</text>

  <!-- 字符串 -->
  <rect x="40" y="84" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="84" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="106" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <text x="120" y="106" font-size="10.5" fill="#888">i=1 → i=2</text>

  <!-- f[0] 种子 -->
  <rect x="40" y="150" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="170" text-anchor="middle" font-size="10.5" fill="#888">f[0]</text>
  <text x="68" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="68" y="208" text-anchor="middle" font-size="9.5" fill="#888">种子</text>

  <!-- 箭头到 f[1] -->
  <path d="M 98 172 L 150 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">m₁('1')=1</text>

  <!-- f[1] -->
  <rect x="154" y="150" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182" y="170" text-anchor="middle" font-size="10.5" fill="#888">f[1]</text>
  <text x="182" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="182" y="208" text-anchor="middle" font-size="9.5" fill="#888">1·f[0]</text>

  <!-- 箭头到 f[2] -->
  <path d="M 212 172 L 300 172" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="256" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">m₁=9, m₂('1','*')=9</text>
  <text x="256" y="168" text-anchor="middle" font-size="10" fill="#888">单字符9 + 双字符9</text>

  <!-- f[2] = 18 -->
  <rect x="304" y="146" width="76" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="342" y="166" text-anchor="middle" font-size="10.5" fill="#888">f[2]</text>
  <text x="342" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">18</text>
  <text x="342" y="212" text-anchor="middle" font-size="10" fill="#333">9·f[1] + 9·f[0]</text>

  <!-- 解析 -->
  <rect x="396" y="150" width="150" height="60" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="471" y="170" text-anchor="middle" font-size="10.5" fill="#555">'1' 十位 → 10..19</text>
  <text x="471" y="186" text-anchor="middle" font-size="10.5" fill="#555">9 个个位全合法</text>
  <text x="471" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">故 m₂ = 9</text>

  <!-- ============ 例 2: s = "2*" ============ -->
  <rect x="24" y="244" width="532" height="178" fill="#ffffff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="268" font-size="12.5" fill="#446688" font-weight="bold">s = "2*"</text>

  <!-- 字符串 -->
  <rect x="40" y="280" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="302" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="78" y="280" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="302" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <text x="120" y="302" font-size="10.5" fill="#888">i=1 → i=2</text>

  <!-- f[0] 种子 -->
  <rect x="40" y="346" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="366" text-anchor="middle" font-size="10.5" fill="#888">f[0]</text>
  <text x="68" y="382" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="68" y="404" text-anchor="middle" font-size="9.5" fill="#888">种子</text>

  <!-- 箭头到 f[1] -->
  <path d="M 98 368 L 150 368" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a">m₁('2')=1</text>

  <!-- f[1] -->
  <rect x="154" y="346" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182" y="366" text-anchor="middle" font-size="10.5" fill="#888">f[1]</text>
  <text x="182" y="382" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="182" y="404" text-anchor="middle" font-size="9.5" fill="#888">1·f[0]</text>

  <!-- 箭头到 f[2] -->
  <path d="M 212 368 L 300 368" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="256" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">m₁=9, m₂('2','*')=6</text>
  <text x="256" y="364" text-anchor="middle" font-size="10" fill="#888">单字符9 + 双字符6</text>

  <!-- f[2] = 15 -->
  <rect x="304" y="342" width="76" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="342" y="362" text-anchor="middle" font-size="10.5" fill="#888">f[2]</text>
  <text x="342" y="382" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">15</text>
  <text x="342" y="408" text-anchor="middle" font-size="10" fill="#333">9·f[1] + 6·f[0]</text>

  <!-- 解析 -->
  <rect x="396" y="346" width="150" height="60" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="471" y="366" text-anchor="middle" font-size="10.5" fill="#555">'2' 十位 → 20..29</text>
  <text x="471" y="382" text-anchor="middle" font-size="10.5" fill="#555">仅 21..26 合法</text>
  <text x="471" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">故 m₂ = 6</text>

  <!-- 底部对比 -->
  <rect x="24" y="430" width="532" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="450" text-anchor="middle" font-size="11" fill="#333">对比精髓：两例 m₁ 都是 9（' *' 单字符），差异全在 m₂ —— '1' 行=9，'2' 行=6</text>
</svg>
