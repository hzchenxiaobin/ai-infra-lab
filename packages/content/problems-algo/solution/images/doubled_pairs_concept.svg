<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二倍数对：每个 x 配一个 2x</text>

  <!-- Pair group A: negative -->
  <text x="30" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">负数对</text>
  <rect x="80" y="66" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="170" y="66" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−4</text>
  <path d="M 126 81 L 166 81" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="74" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×2</text>
  <text x="230" y="86" font-size="10" fill="#888">x &lt; 0：2x 更负，|2x|&gt;|x|</text>

  <!-- Pair group B: positive -->
  <text x="30" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">正数对</text>
  <rect x="80" y="126" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="126" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <path d="M 126 141 L 166 141" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="230" y="146" font-size="10" fill="#888">x &gt; 0：2x 更大，|2x|&gt;|x|</text>

  <!-- Divider -->
  <path d="M 40 176 L 480 176" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- Abs sort row -->
  <text x="30" y="200" font-size="12" fill="#d6a040" font-weight="bold">按 |x| 升序处理</text>
  <text x="30" y="218" font-size="10" fill="#888">arr = [4,−2,2,−4]</text>

  <rect x="80" y="226" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="136" y="226" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="192" y="226" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−4</text>
  <rect x="248" y="226" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="103" y="272" text-anchor="middle" font-size="10" fill="#446688">|2|</text>
  <text x="159" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">|2|</text>
  <text x="215" y="272" text-anchor="middle" font-size="10" fill="#b85450">|4|</text>
  <text x="271" y="272" text-anchor="middle" font-size="10" fill="#d6a040">|4|</text>

  <!-- Insight box -->
  <rect x="40" y="288" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">|2x| = 2·|x| ≥ |x| ⇒ 2x 永远排在 x 之后</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#888">先处理 x 时，它的 2x 还没被动用，定能配对成功</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#888">零自成对：2·0 = 0，零的个数必须为偶数</text>
</svg>
