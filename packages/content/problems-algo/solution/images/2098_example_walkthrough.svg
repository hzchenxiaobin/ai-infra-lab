<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums=[8,7,6,5,4,3], k=3</text>

  <!-- Step 1: Sort -->
  <text x="48" y="54" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 ① 降序排序</text>
  <rect x="48" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="100" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="152" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="204" y="62" width="48" height="32" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <rect x="256" y="62" width="48" height="32" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="308" y="62" width="48" height="32" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>

  <!-- Bracket for Top-K -->
  <path d="M 48 100 L 48 106 L 200 106 L 200 100" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="124" y="118" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Top-K</text>
  <path d="M 204 100 L 204 106 L 356 106 L 356 100" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">剩余</text>

  <!-- Step 2: Sum -->
  <text x="48" y="140" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">步骤 ② 求和 S = 8+7+6 = 21（奇数 → 需修正）</text>

  <rect x="48" y="148" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="208" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S = 21 % 2 = 1 → 奇数，进入交换修正</text>

  <!-- Step 3: Find candidates -->
  <text x="48" y="196" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">步骤 ③ 在 Top-K 与剩余中各找最小奇/偶与最大奇/偶</text>

  <!-- Top-K candidates -->
  <rect x="48" y="206" width="220" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.5"/>
  <text x="60" y="222" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Top-K = [8, 7, 6]</text>

  <text x="60" y="240" font-size="10" fill="#666" filter="url(#rough2)">最小奇数 min_odd_in = 7</text>
  <rect x="180" y="228" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="60" y="268" font-size="10" fill="#666" filter="url(#rough2)">最小偶数 min_even_in = 6</text>
  <rect x="180" y="256" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Rest candidates -->
  <rect x="290" y="206" width="220" height="78" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.5"/>
  <text x="302" y="222" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">剩余 = [5, 4, 3]</text>

  <text x="302" y="240" font-size="10" fill="#666" filter="url(#rough2)">最大偶数 max_even_out = 4</text>
  <rect x="430" y="228" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="302" y="268" font-size="10" fill="#666" filter="url(#rough2)">最大奇数 max_odd_out = 5</text>
  <rect x="430" y="256" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Step 4: Compute two options -->
  <text x="48" y="306" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 ④ 计算两种交换方案</text>

  <rect x="48" y="314" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案 A：S − 7 + 4</text>
  <text x="60" y="350" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 21 − 7 + 4 = 18 ✓ 偶数</text>

  <rect x="290" y="314" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="302" y="332" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">方案 B：S − 6 + 5</text>
  <text x="302" y="350" font-size="11" fill="#d6a040" filter="url(#rough2)">= 21 − 6 + 5 = 20 ✓ 偶数</text>

  <!-- Step 5: Result -->
  <text x="48" y="382" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 ⑤ 取最大值</text>

  <rect x="48" y="390" width="470" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="283" y="412" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">max(18, 20) = 20 → 选 {8, 7, 5}，最大偶数和 = 20</text>

  <!-- Note -->
  <text x="48" y="446" font-size="10" fill="#888" filter="url(#rough2)">方案 B 损失更小（仅 −1），优于方案 A（−3），故选 B</text>
</svg>
