<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">Bob 的提升效率：先减后舍 ✓，先舍后减 ✗</text>

  <rect x="90" y="44" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">原始平均值（未舍入，全精度参与运算）</text>
  <text x="260" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">first = 11.237373…    second = 13.333333…</text>

  <path d="M 175 102 Q 150 120 145 138" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="138" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">先相减</text>

  <path d="M 345 102 Q 370 120 375 138" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="383" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">先舍入</text>

  <rect x="40" y="142" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13.333333… − 11.237373…</text>
  <text x="145" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= 2.095959…</text>

  <path d="M 145 192 L 145 208" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="40" y="212" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ROUND(2.095959…, 2)</text>
  <text x="145" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 2.10 ✓</text>

  <rect x="270" y="142" width="210" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">先各自 ROUND：11.24、13.33</text>
  <text x="375" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13.33 − 11.24</text>

  <path d="M 375 192 L 375 208" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="270" y="212" width="210" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="231" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2.09 ✗</text>
  <text x="375" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">与期望差了 0.01</text>

  <path d="M 145 262 Q 180 282 208 292" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 375 262 Q 340 282 312 292" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="288" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">官方期望输出：2.10 → 左路才对</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">误差剖析：被减数向下舍（−0.0033）、减数向上舍（+0.0026），同向叠加 ≈ −0.006</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 2.0960 拖过舍入边界变 2.09 —— 三列必须各自从原始值独立 ROUND</text>
</svg>
