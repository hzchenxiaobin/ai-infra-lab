<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：分组 = 填一张 g 行 × k 列的网格</text>
  <text x="260" y="42" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每行是一个组、行内互不相同 ⇒ 每个值的份数不能超过行数 g</text>

  <!-- 左：g×k 网格 -->
  <text x="139" y="60" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每行 k = 3 个互不相同</text>

  <text x="56" y="90" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">组1</text>
  <text x="56" y="130" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">组2</text>
  <text x="56" y="170" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">组3</text>

  <rect x="64" y="68" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="68" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="68" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="64" y="108" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="108" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="164" y="108" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="64" y="148" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="114" y="148" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="148" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <text x="139" y="206" text-anchor="middle" font-size="10" fill="#2f5d25" filter="url(#rough2)">值 1 共 3 份 = g，每行恰一份 ✓</text>

  <!-- 右：反例 -->
  <rect x="252" y="56" width="244" height="150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="374" y="76" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">反例：值 7 有 4 份，但只有 g = 3 行</text>

  <rect x="272" y="90" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="330" y="90" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="388" y="90" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="446" y="90" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="464" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <path d="M 446 122 L 482 90" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="290" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">放行1</text>
  <text x="348" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">放行2</text>
  <text x="406" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">放行3</text>
  <text x="464" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">无行可放✗</text>

  <text x="374" y="164" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">第 4 份无论塞进哪一行，都会与同值撞车</text>
  <text x="374" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">频次 4 &gt; g = 3 ⇒ false</text>

  <!-- 底部判定框 -->
  <rect x="56" y="222" width="408" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">判定（充要）：n % k == 0 且 每个值出现次数 ≤ g = n / k</text>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">示例 2：n=4, k=2 ⇒ g=2；频次 {3:1, 5:1, 2:2}，最大 2 ≤ 2 ⇒ true</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 3：n=4, k=3 ⇒ 4 % 3 ≠ 0 ⇒ false（组数都不是整数）</text>
  <text x="260" y="318" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">两条之外再无隐藏失败方式：贪心构造可证充分性（见解题思路 2.2）</text>
</svg>
