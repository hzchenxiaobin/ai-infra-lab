<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">回文预处理表 isPal[i][j]（s = "aab"）</text>

  <!-- String reference -->
  <text x="40" y="56" font-size="11" fill="#888">s:</text>
  <rect x="70" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="60" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="110" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="60" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="150" y="42" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="60" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="70" y="80" font-size="9" fill="#aaa">0</text>
  <text x="110" y="80" font-size="9" fill="#aaa">1</text>
  <text x="150" y="80" font-size="9" fill="#aaa">2</text>

  <!-- Table -->
  <!-- Column headers (j) -->
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i \ j</text>
  <text x="200" y="106" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="260" y="106" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="320" y="106" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>

  <!-- Row 0 (i=0) -->
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <!-- [0][0]: "a" len=1 → T -->
  <rect x="174" y="122" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>
  <!-- [0][1]: "aa" len=2 → T -->
  <rect x="234" y="122" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>
  <!-- [0][2]: "aab" len=3 → F -->
  <rect x="294" y="122" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>

  <!-- Row 1 (i=1) -->
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <!-- [1][0]: lower triangle, gray -->
  <rect x="174" y="162" width="52" height="32" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="183" text-anchor="middle" font-size="12" fill="#bbb">−</text>
  <!-- [1][1]: "a" len=1 → T -->
  <rect x="234" y="162" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>
  <!-- [1][2]: "ab" len=2 → F -->
  <rect x="294" y="162" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>

  <!-- Row 2 (i=2) -->
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <rect x="174" y="202" width="52" height="32" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="223" text-anchor="middle" font-size="12" fill="#bbb">−</text>
  <rect x="234" y="202" width="52" height="32" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#bbb">−</text>
  <!-- [2][2]: "b" len=1 → T -->
  <rect x="294" y="202" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>

  <!-- Substring labels -->
  <text x="200" y="248" text-anchor="middle" font-size="9" fill="#888">"a"</text>
  <text x="260" y="248" text-anchor="middle" font-size="9" fill="#888">"aa" / "a"</text>
  <text x="320" y="248" text-anchor="middle" font-size="9" fill="#888">"aab" / "ab" / "b"</text>

  <!-- Dependency arrow: [0][2] depends on [1][1] -->
  <path d="M 294 138 Q 220 150 260 162" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="156" font-size="9" fill="#b85450">依赖</text>

  <!-- Filling order legend -->
  <rect x="40" y="270" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="289" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按子串长度递增填表</text>
  <text x="140" y="306" text-anchor="middle" font-size="10" fill="#555">len=1 → len=2 → len=3</text>

  <!-- Color legend -->
  <rect x="280" y="270" width="22" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="312" y="284" font-size="10" fill="#555">= 回文 (T)</text>
  <rect x="280" y="294" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="312" y="308" font-size="10" fill="#555">= 非回文 (F)</text>

  <!-- Key insight -->
  <rect x="40" y="328" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#444">关键：isPal[i][j] 依赖更短的 isPal[i+1][j−1]</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#888">按长度递增填表 → 查询时 O(1) 判任意区间是否回文</text>
</svg>
