<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一条锚定正则拆解合法邮箱</text>

  <!-- anchor ^ -->
  <text x="120" y="46" text-anchor="middle" font-size="9" fill="#888">锚定串首</text>
  <text x="120" y="79" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">^</text>

  <!-- prefix box -->
  <text x="174" y="48" text-anchor="middle" font-size="10" fill="#888">前缀（规则③）</text>
  <rect x="136" y="56" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="174" y="78" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">alice</text>

  <!-- @ box -->
  <rect x="216" y="56" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="234" y="78" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">@</text>

  <!-- domain box -->
  <text x="306" y="48" text-anchor="middle" font-size="10" fill="#888">域名（规则④）</text>
  <rect x="256" y="56" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="306" y="78" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">example</text>

  <!-- .com box -->
  <text x="392" y="48" text-anchor="middle" font-size="10" fill="#888">后缀（规则②）</text>
  <rect x="360" y="56" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="392" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.com</text>

  <!-- anchor $ -->
  <text x="444" y="46" text-anchor="middle" font-size="9" fill="#888">锚定串尾</text>
  <text x="444" y="79" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">$</text>

  <!-- arrows down -->
  <path d="M 174 92 L 174 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 234 92 L 234 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 92 L 306 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 92 L 392 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- regex fragments with rule numbers -->
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ [A-Za-z0-9_]+</text>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">① @</text>
  <text x="310" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ [A-Za-z]+</text>
  <text x="396" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② [.]com</text>

  <!-- callout: structural guarantee -->
  <rect x="56" y="136" width="448" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="11" fill="#8a6d1f">两侧字符类都不含 @ ⇒ 结构上保证「恰好一个 @」，规则① 零成本达标</text>

  <!-- invalid examples -->
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反例：一步失配，整串拒绝</text>

  <rect x="40" y="204" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="223" font-size="11" fill="#333">bob_at_example.com</text>
  <text x="510" y="223" text-anchor="end" font-size="10" fill="#b85450">✗ 规则①：根本没有 @</text>

  <rect x="40" y="238" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="257" font-size="11" fill="#333">charlie@example.net</text>
  <text x="510" y="257" text-anchor="end" font-size="10" fill="#b85450">✗ 规则②：后缀不是 .com</text>

  <rect x="40" y="272" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="291" font-size="11" fill="#333">a@.com</text>
  <text x="510" y="291" text-anchor="end" font-size="10" fill="#b85450">✗ 规则④：域名为空（+ 拒空段）</text>

  <rect x="40" y="306" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="325" font-size="11" fill="#333">a@exa_mple.com</text>
  <text x="510" y="325" text-anchor="end" font-size="10" fill="#b85450">✗ 规则④：下划线不是字母</text>
</svg>
