<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：7 行数据 → 3 个分组 → 1 个结果</text>

  <!-- 原始表 -->
  <text x="40" y="50" font-size="11.5" fill="#888">原始表 ActorDirector</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">actor_id</text>
  <rect x="130" y="56" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">director_id</text>
  <rect x="230" y="56" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">timestamp</text>

  <!-- 分组颜色标记列 -->
  <rect x="320" y="56" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="74" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">分组</text>

  <!-- Row 1: (1,1,0) -->
  <rect x="40" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="99" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="84" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="99" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="99" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="320" y="84" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- Row 2: (1,1,1) -->
  <rect x="40" y="108" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="123" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="108" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="123" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="108" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="123" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="320" y="108" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- Row 3: (1,1,2) -->
  <rect x="40" y="132" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="147" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="132" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="147" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="132" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="147" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="320" y="132" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- Row 4: (1,2,3) -->
  <rect x="40" y="156" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="171" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="156" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="171" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="230" y="156" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="171" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="320" y="156" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="171" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B</text>

  <!-- Row 5: (1,2,4) -->
  <rect x="40" y="180" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="195" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="130" y="180" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="230" y="180" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="195" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="320" y="180" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B</text>

  <!-- Row 6: (2,1,5) -->
  <rect x="40" y="204" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="219" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="130" y="204" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="219" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="204" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="219" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="320" y="204" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">C</text>

  <!-- Row 7: (2,1,6) -->
  <rect x="40" y="228" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="243" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="130" y="228" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="228" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="243" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="320" y="228" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="243" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">C</text>

  <!-- 箭头 -->
  <path d="M 200 256 L 200 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="270" font-size="10" fill="#888">GROUP BY + COUNT</text>

  <!-- 分组统计表 -->
  <text x="40" y="288" font-size="11.5" fill="#888">分组统计</text>

  <rect x="60" y="296" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="313" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">分组</text>
  <rect x="150" y="296" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="313" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(actor, director)</text>
  <rect x="270" y="296" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="313" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">COUNT(*)</text>
  <rect x="350" y="296" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="313" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">≥ 3 ?</text>

  <!-- Group A: (1,1) count=3 PASS -->
  <rect x="60" y="322" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="339" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>
  <rect x="150" y="322" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="339" text-anchor="middle" font-size="10.5" fill="#333">(1, 1)</text>
  <rect x="270" y="322" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="339" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <rect x="350" y="322" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="339" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✅ YES</text>

  <!-- Group B: (1,2) count=2 FAIL -->
  <rect x="60" y="348" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="365" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B</text>
  <rect x="150" y="348" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="365" text-anchor="middle" font-size="10.5" fill="#333">(1, 2)</text>
  <rect x="270" y="348" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="365" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="350" y="348" width="100" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="365" text-anchor="middle" font-size="10.5" fill="#999">❌ NO</text>

  <!-- Group C: (2,1) count=2 FAIL -->
  <rect x="60" y="374" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="391" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">C</text>
  <rect x="150" y="374" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="391" text-anchor="middle" font-size="10.5" fill="#333">(2, 1)</text>
  <rect x="270" y="374" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="391" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="350" y="374" width="100" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="391" text-anchor="middle" font-size="10.5" fill="#999">❌ NO</text>

  <!-- 箭头到结果 -->
  <path d="M 200 400 L 200 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="414" font-size="10" fill="#888">HAVING</text>

  <!-- 结果 -->
  <rect x="80" y="424" width="420" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结果：仅 (1, 1) 合作 3 次 → 通过 HAVING</text>
  <text x="290" y="458" text-anchor="middle" font-size="11" fill="#555">输出：actor_id=1, director_id=1</text>
</svg>