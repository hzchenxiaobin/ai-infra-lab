<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例 1：最优路径 dp 填表演算
  </text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">
    houses=[0,0,0,0,0]  cost=[[1,10],[10,1],[10,1],[1,10],[5,1]]  target=3
  </text>

  <!-- 五列：每列一个房子的状态 -->
  <!-- 列中心 x: 56, 164, 272, 380, 488  间距 108 -->

  <!-- 房子编号 -->
  <text x="56" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="164" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="272" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="380" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="488" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- 颜色方块 -->
  <!-- i=0 颜色1 蓝 -->
  <rect x="32" y="86" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="56" y="112" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>

  <!-- i=1 颜色2 绿 -->
  <rect x="140" y="86" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="112" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- i=2 颜色2 绿 -->
  <rect x="248" y="86" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="112" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- i=3 颜色1 蓝 -->
  <rect x="356" y="86" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="112" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>

  <!-- i=4 颜色1 蓝 (答案) -->
  <rect x="464" y="86" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="488" y="112" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- 花费 -->
  <text x="56" y="146" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">花费 1</text>
  <text x="164" y="146" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">花费 1</text>
  <text x="272" y="146" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">花费 1</text>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">花费 1</text>
  <text x="488" y="146" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">花费 5</text>

  <!-- 街区数 k -->
  <rect x="28" y="160" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=1</text>

  <rect x="136" y="160" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="164" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=2</text>

  <rect x="244" y="160" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="272" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=2</text>

  <rect x="352" y="160" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=3</text>

  <rect x="460" y="160" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="488" y="178" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">k=3</text>

  <!-- dp 值 -->
  <rect x="24" y="200" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="222" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">= 1</text>

  <rect x="132" y="200" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="164" y="222" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">= 2</text>

  <rect x="240" y="200" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="272" y="222" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">= 3</text>

  <rect x="348" y="200" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">= 4</text>

  <rect x="456" y="200" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="488" y="222" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">= 9 ✓</text>

  <!-- 转移箭头：异色(红) / 同色(绿) -->
  <!-- 0->1 异色 k: 1->2 -->
  <path d="M88,217 L132,217" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">异色</text>

  <!-- 1->2 同色 k: 2->2 -->
  <path d="M196,217 L240,217" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="218" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同色</text>

  <!-- 2->3 异色 k: 2->3 -->
  <path d="M304,217 L348,217" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="326" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">异色</text>

  <!-- 3->4 同色 k: 3->3 -->
  <path d="M412,217 L456,217" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="434" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同色</text>

  <!-- 底部说明 -->
  <rect x="40" y="262" width="480" height="78" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    异色：另起新街区，k 由 k-1 转来 ｜ 同色：并入旧街区，k 不变
  </text>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    方案 [1,2,2,1,1] → 街区 [{1},{2,2},{1,1}] = 3 个 ✓
  </text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">
    总花费 = 1+1+1+1+5 = 9  ←  min dp[4][j][3]
  </text>
</svg>
