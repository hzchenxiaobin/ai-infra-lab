<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,2,4,6,8]，k = 2，numOperations = 2</text>

  <!-- 排序后数组 -->
  <text x="62" y="60" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">排序后</text>
  <rect x="110" y="40" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="154" y="40" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="198" y="40" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <rect x="242" y="40" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <rect x="286" y="40" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="61" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>

  <!-- 情形二标签 -->
  <text x="30" y="86" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">情形二：枚举数组里的目标值</text>

  <!-- 表头 -->
  <rect x="30" y="92" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">目标 x</text>
  <rect x="100" y="92" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">值域 [x−k, x+k]</text>
  <rect x="210" y="92" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">reach</text>
  <rect x="270" y="92" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt</text>
  <rect x="320" y="92" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">频率 = cnt + min(op, reach−cnt)</text>

  <!-- 行 1：x=2 -->
  <rect x="30" y="118" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="118" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="155" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0, 4]</text>
  <rect x="210" y="118" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="270" y="118" width="50" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="118" width="170" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="135" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 + min(2, 1) = 3</text>

  <!-- 行 2：x=4 -->
  <rect x="30" y="144" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="161" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="100" y="144" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="155" y="161" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 6]</text>
  <rect x="210" y="144" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="161" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="144" width="50" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="161" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="144" width="170" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="161" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 + min(2, 3) = 3</text>

  <!-- 行 3：x=6 -->
  <rect x="30" y="170" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="100" y="170" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="155" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4, 8]</text>
  <rect x="210" y="170" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="270" y="170" width="50" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="170" width="170" height="26" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="187" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 + min(2, 2) = 3</text>

  <!-- 行 4：x=8 -->
  <rect x="30" y="196" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="100" y="196" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="155" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[6, 10]</text>
  <rect x="210" y="196" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="270" y="196" width="50" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="196" width="170" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1 + min(2, 1) = 2</text>

  <!-- 情形一 -->
  <rect x="20" y="234" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">情形一：2k = 4 的滑窗 —— 目标值不在数组里的兜底</text>
  <text x="260" y="269" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最宽窗口 [2,2,4,6]（极差 4 ≤ 2k，宽 4）→ min(2, 4) = 2；窗口 [4,6,8] → min(2, 3) = 2</text>

  <!-- 答案 -->
  <rect x="20" y="288" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 3：如目标 2，把 4 → 2 花 1 次操作得 [2,2,2,6,8]，剩 1 次随便加 0</text>

  <!-- 底部看点 -->
  <rect x="20" y="328" width="480" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="346" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">💡 看点</text>
  <text x="34" y="362" font-size="10" fill="#555" filter="url(#rough2)">· numOperations = 2 把情形一压死：窗口再宽，操作次数不够也白搭（上限 2）</text>
  <text x="34" y="378" font-size="10" fill="#555" filter="url(#rough2)">· 情形二里 x = 2 靠 cnt = 2 白赚底子，只需再改 1 个元素；x = 4 靠 reach = 4 兵源充足</text>
  <text x="34" y="394" font-size="10" fill="#555" filter="url(#rough2)">· 目标 6 同样到 3：4→6、8→6 各花 1 次 —— 三种方案殊途同归</text>
</svg>
