<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：ORDER BY → ROW_NUMBER → grp → GROUP BY</text>

  <text x="50" y="54" font-size="11" fill="#555" font-weight="bold">Logs 按 log_id 升序 + ROW_NUMBER()</text>

  <!-- Column headers -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="60" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="200" y="60" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="10" fill="#333" font-weight="bold">
    <text x="85" y="76" text-anchor="middle">log_id</text>
    <text x="165" y="76" text-anchor="middle">rn</text>
    <text x="270" y="76" text-anchor="middle">grp = log_id − rn</text>
  </g>

  <!-- Row 1: 1,1,0 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="130" y="84" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="84" width="140" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="85" y="99" text-anchor="middle" font-weight="bold">1</text>
    <text x="165" y="99" text-anchor="middle">1</text>
    <text x="270" y="99" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- Row 2: 2,2,0 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="106" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="130" y="106" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="106" width="140" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="85" y="121" text-anchor="middle" font-weight="bold">2</text>
    <text x="165" y="121" text-anchor="middle">2</text>
    <text x="270" y="121" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- Row 3: 3,3,0 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="128" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="130" y="128" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="128" width="140" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="85" y="143" text-anchor="middle" font-weight="bold">3</text>
    <text x="165" y="143" text-anchor="middle">3</text>
    <text x="270" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- Island 1 bracket -->
  <path d="M 35 84 L 28 84 L 28 150 L 35 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="117" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 20 117)">岛屿1</text>

  <!-- Row 4: 7,4,3 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="156" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <rect x="130" y="156" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="156" width="140" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="85" y="171" text-anchor="middle" font-weight="bold">7</text>
    <text x="165" y="171" text-anchor="middle">4</text>
    <text x="270" y="171" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- Row 5: 8,5,3 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="178" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <rect x="130" y="178" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="178" width="140" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="85" y="193" text-anchor="middle" font-weight="bold">8</text>
    <text x="165" y="193" text-anchor="middle">5</text>
    <text x="270" y="193" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- Island 2 bracket -->
  <path d="M 35 156 L 28 156 L 28 200 L 35 200" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90 20 178)">岛屿2</text>

  <!-- Row 6: 10,6,4 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="206" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <rect x="130" y="206" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="200" y="206" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="85" y="221" text-anchor="middle" font-weight="bold">10</text>
    <text x="165" y="221" text-anchor="middle">6</text>
    <text x="270" y="221" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- Island 3 bracket -->
  <path d="M 35 206 L 28 206 L 28 228 L 35 228" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="217" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" transform="rotate(-90 20 217)">岛屿3</text>

  <!-- Arrow to result -->
  <path d="M 270 240 L 270 255 L 105 255 L 105 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="300" y="252" font-size="10" fill="#888">GROUP BY grp</text>
  <text x="300" y="264" font-size="10" fill="#888">→ MIN / MAX</text>

  <!-- Result table -->
  <text x="50" y="288" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY start_id）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="296" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="170" y="296" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="10" fill="#333" font-weight="bold">
    <text x="105" y="312" text-anchor="middle">start_id</text>
    <text x="235" y="312" text-anchor="middle">end_id</text>
  </g>

  <!-- Result rows -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="320" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="170" y="320" width="130" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="105" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="235" y="335" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="342" width="130" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <rect x="170" y="342" width="130" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="105" y="357" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <text x="235" y="357" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="364" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="170" y="364" width="130" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="105" y="379" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <text x="235" y="379" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
  </g>

  <!-- Key observations box -->
  <rect x="360" y="296" width="240" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="480" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="370" y="334" font-size="9.5" fill="#555">• 岛屿1：rn=1,2,3 → grp 全=0（连续）</text>
  <text x="370" y="350" font-size="9.5" fill="#555">• 岛屿2：rn=4,5 → grp 全=3（连续）</text>
  <text x="370" y="366" font-size="9.5" fill="#b85450">• 岛屿3：rn=6 → grp=4（断点→新岛）</text>
  <text x="370" y="382" font-size="9.5" fill="#888">  grp 差值 = 跳过的缺失整数个数</text>

  <!-- Summary -->
  <rect x="40" y="402" width="560" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">rn 在全表范围连续递增（无需 PARTITION BY）</text>
  <text x="310" y="436" text-anchor="middle" font-size="10.5" fill="#888">连续整数 log_id 与 rn 同步增长 → grp 不变；断点处 grp 跳变 → 自然分裂为新岛屿</text>
</svg>
