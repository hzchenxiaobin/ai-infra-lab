<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两串不等 → 整串即答案；两串相等 → 无解</text>

  <!-- ============ Panel 1: a != b ============ -->
  <rect x="30" y="44" width="500" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="12" fill="#446688" font-weight="bold">情况一：a ≠ b（如 a="aba", b="cdc"）</text>

  <!-- string a -->
  <text x="50" y="92" font-size="11" fill="#888">a =</text>
  <rect x="86" y="78" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="78" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="154" y="78" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="200" y="98" font-size="11" fill="#d6a040" font-weight="bold">← 整串是自身的子序列 ✓</text>

  <!-- string b -->
  <text x="50" y="130" font-size="11" fill="#888">b =</text>
  <rect x="86" y="116" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="120" y="116" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="154" y="116" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="200" y="136" font-size="11" fill="#b85450" font-weight="bold">← "aba" 不是 b 的子序列 ✗</text>

  <!-- reasoning -->
  <rect x="50" y="156" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"aba" 是 a 的子序列但不是 b 的子序列 ⇒ 特殊序列</text>
  <text x="280" y="189" text-anchor="middle" font-size="11" fill="#666">答案 = len(a) = 3（等长不等 → 整串即最长）</text>

  <!-- ============ Panel 2: a == b ============ -->
  <rect x="30" y="220" width="500" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="242" font-size="12" fill="#b85450" font-weight="bold">情况二：a == b（如 a="aaa", b="aaa"）</text>

  <!-- string a -->
  <text x="50" y="268" font-size="11" fill="#888">a =</text>
  <rect x="86" y="254" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="254" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="154" y="254" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- string b -->
  <text x="50" y="306" font-size="11" fill="#888">b =</text>
  <rect x="86" y="292" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="292" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="154" y="292" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <text x="205" y="290" font-size="11" fill="#b85450" font-weight="bold">a 的每个子序列</text>
  <path d="M 270 296 L 300 296" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="290" font-size="11" fill="#b85450" font-weight="bold">也是 b 的子序列</text>
  <text x="205" y="320" font-size="11" fill="#888">两串完全相同 → 没有任何「独有」子序列</text>

  <!-- result -->
  <rect x="50" y="330" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = -1（不存在特殊序列）</text>

  <!-- bottom hint -->
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#888">关键：等长不等时整串互不为子序列；等长相等时所有子序列都被共享</text>
</svg>
