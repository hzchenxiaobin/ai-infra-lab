<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：head = 1→2→3→4→5→6</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">蓝=奇数位 odd，橙=偶数位 even；★ 标当前指针位置</text>

  <!-- ===== Panel 1: initial ===== -->
  <text x="40" y="70" font-size="11.5" fill="#888" font-weight="bold">初始</text>
  <rect x="106" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="130" y="70" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">odd</text>
  <line x1="154" y1="94" x2="172" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="174" y="78" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="198" y="68" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">even★ evenHead</text>
  <line x1="222" y1="94" x2="240" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="242" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="99" text-anchor="middle" font-size="13" fill="#333">3</text>
  <line x1="290" y1="94" x2="308" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="310" y="78" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="99" text-anchor="middle" font-size="13" fill="#333">4</text>
  <line x1="358" y1="94" x2="376" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="378" y="78" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="99" text-anchor="middle" font-size="13" fill="#333">5</text>
  <line x1="426" y1="94" x2="444" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="446" y="78" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="99" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- separator -->
  <line x1="40" y1="128" x2="560" y2="128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Panel 2: after round 1 ===== -->
  <text x="40" y="154" font-size="11.5" fill="#888" font-weight="bold">第 1 轮后</text>
  <text x="300" y="154" text-anchor="middle" font-size="10.5" fill="#666">odd.next=even.next(3) → odd→3；even.next=odd.next(4) → even→4</text>
  <!-- odd chain 1->3 -->
  <rect x="150" y="166" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="198" y1="182" x2="222" y2="182" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="224" y="166" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="248" y="158" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">odd★</text>
  <!-- even chain 2->4 -->
  <rect x="150" y="216" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="174" y="262" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">evenHead</text>
  <line x1="198" y1="232" x2="222" y2="232" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="224" y="216" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="248" y="208" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">even★</text>
  <!-- tail -->
  <line x1="272" y1="232" x2="290" y2="232" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="216" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="237" text-anchor="middle" font-size="12" fill="#999">5</text>
  <line x1="340" y1="232" x2="358" y2="232" stroke="#ccc" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="216" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="384" y="237" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="420" y="237" font-size="10.5" fill="#aaa">待处理尾段</text>

  <line x1="40" y1="280" x2="560" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Panel 3: after round 2 ===== -->
  <text x="40" y="306" font-size="11.5" fill="#888" font-weight="bold">第 2 轮后</text>
  <text x="300" y="306" text-anchor="middle" font-size="10.5" fill="#666">odd→5；even→6；even.next 为空，循环结束</text>
  <!-- odd chain 1->3->5 -->
  <rect x="110" y="318" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="339" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="158" y1="334" x2="182" y2="334" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="184" y="318" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="339" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <line x1="232" y1="334" x2="256" y2="334" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="258" y="318" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="339" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="282" y="310" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">odd★</text>
  <!-- even chain 2->4->6 -->
  <rect x="110" y="368" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="389" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="134" y="414" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">evenHead</text>
  <line x1="158" y1="384" x2="182" y2="384" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="184" y="368" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="389" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="232" y1="384" x2="256" y2="384" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="258" y="368" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="389" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="282" y="360" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">even★</text>

  <!-- connect action -->
  <text x="410" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">↓ 收尾</text>
  <text x="410" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">odd.next=evenHead</text>

  <!-- ===== Panel 4: result ===== -->
  <rect x="40" y="424" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果：1→3→5→2→4→6</text>
</svg>
