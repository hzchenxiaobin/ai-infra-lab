<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10, 21, 31] 逐元素走一遍</text>

  <!-- header row -->
  <rect x="24" y="42" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 x</text>
  <rect x="94" y="42" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">m（最大位）</text>
  <rect x="194" y="42" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="244" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">rep（d 个 1）</text>
  <rect x="294" y="42" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">encrypt(x)</text>
  <rect x="394" y="42" width="102" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">累计 ans</text>

  <!-- row 1: x=10 -->
  <rect x="24" y="74" width="70" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="94" y="74" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="99" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="194" y="74" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="99" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="294" y="74" width="100" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="394" y="74" width="102" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="445" y="99" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- row 2: x=21 -->
  <rect x="24" y="120" width="70" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>
  <rect x="94" y="120" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="145" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="194" y="120" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="145" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="294" y="120" width="100" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">22</text>
  <rect x="394" y="120" width="102" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="445" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">33</text>

  <!-- row 3: x=31 -->
  <rect x="24" y="166" width="70" height="42" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">31</text>
  <rect x="94" y="166" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="191" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="194" y="166" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="191" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="294" y="166" width="100" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">33</text>
  <rect x="394" y="166" width="102" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">66</text>

  <!-- trace strip: x=10 -->
  <rect x="48" y="222" width="424" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 10 的扫描轨迹（从低位往高位吃）：</text>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">吃 0 → m 仍 0，rep = 1；吃 1 → m = 1，rep = 11；x = 0 结束 → encrypt = 1 × 11 = 11</text>

  <!-- more examples -->
  <rect x="48" y="278" width="424" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">更多例子：</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">encrypt(523) = 5 × 111 = 555；encrypt(1000) = 1 × 1111 = 1111（最大数位恰是最高位）</text>

  <!-- bottom note -->
  <rect x="48" y="338" width="424" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">m 与 rep 在同一趟 while 里聚合：扫描结束，两个原料同时到位，一次乘法拼出 encrypt(x)</text>
</svg>
