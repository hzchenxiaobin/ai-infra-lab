<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：JOIN 取产品名 · WHERE 过滤行 · HAVING 过滤组</text>

  <!-- Products table -->
  <rect x="30" y="48" width="235" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="30" y="48" width="235" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="147" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Products（产品表）</text>
  <text x="42" y="86" font-size="9.5" fill="#333" font-weight="bold">product_id</text>
  <text x="115" y="86" font-size="9.5" fill="#4a7a3a" font-weight="bold">product_name</text>
  <text x="210" y="86" font-size="9.5" fill="#777">category</text>
  <text x="42" y="104" font-size="9.5" fill="#333">1  Leetcode Solutions</text>
  <text x="42" y="118" font-size="9.5" fill="#333">2  Jewels of String..</text>
  <text x="42" y="132" font-size="9.5" fill="#333">3  HP</text>
  <text x="42" y="146" font-size="9.5" fill="#333">5  Leetcode Kit</text>
  <text x="42" y="160" font-size="8.5" fill="#999">↑ 名字在此表，Orders 没有</text>

  <!-- Orders table -->
  <rect x="295" y="48" width="235" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="295" y="48" width="235" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Orders（订单表）</text>
  <text x="307" y="86" font-size="9.5" fill="#333" font-weight="bold">product_id</text>
  <text x="370" y="86" font-size="9.5" fill="#d6a040" font-weight="bold">order_date</text>
  <text x="475" y="86" font-size="9.5" fill="#b85450" font-weight="bold">unit</text>
  <text x="307" y="104" font-size="9" fill="#333">1  2020-02-05  60</text>
  <text x="307" y="118" font-size="9" fill="#333">1  2020-02-10  70</text>
  <text x="307" y="132" font-size="9" fill="#333">2  2020-02-11  80</text>
  <text x="307" y="146" font-size="9" fill="#333">5  2020-02-25  50</text>
  <text x="307" y="160" font-size="8.5" fill="#999">↑ 数量在此表，Products 没有</text>

  <!-- JOIN arrow -->
  <path d="M265 107 L295 107" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">JOIN</text>
  <text x="280" y="122" text-anchor="middle" font-size="8" fill="#446688">on id</text>

  <!-- WHERE filter -->
  <rect x="60" y="188" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="188" width="440" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">WHERE order_date ∈ 2020-02（行级过滤 · 分组前）</text>
  <text x="78" y="226" font-size="10" fill="#333">只留 2 月订单行，<tspan fill="#b85450" font-weight="bold">1 月 / 3 月</tspan>行丢弃。条件作用在<tspan fill="#d6a040" font-weight="bold">原始列</tspan> → 用 WHERE</text>

  <!-- arrow down -->
  <path d="M280 244 L280 262" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- GROUP BY + SUM -->
  <rect x="60" y="266" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="266" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">GROUP BY product_id → SUM(unit) AS unit（聚合）</text>
  <text x="78" y="304" font-size="10" fill="#333">按产品分组求和：pid=1 → 60+70=130，pid=5 → 50+50=100，pid=2 → 80 …</text>

  <!-- arrow down -->
  <path d="M280 322 L280 340" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- HAVING filter -->
  <rect x="60" y="344" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="344" width="440" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">HAVING SUM(unit) >= 100（组级过滤 · 分组后）</text>
  <text x="78" y="382" font-size="10" fill="#333">只留总和 ≥ 100 的组。条件作用在<tspan fill="#b85450" font-weight="bold">聚合结果</tspan> → 用 HAVING，不可用 WHERE</text>

  <!-- arrow down -->
  <path d="M280 400 L280 416" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="120" y="420" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输出：product_name, unit（JOIN 取名）</text>
</svg>
