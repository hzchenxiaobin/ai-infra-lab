<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：闭式直出，O(1) 收工</text>

  <!-- 主链 -->
  <rect x="36" y="54" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n</text>

  <path d="M 146 90 L 146 102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="104" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="126" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 闭式求和（免循环）</text>
  <text x="146" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sumOdd = n²　sumEven = n(n+1)</text>

  <path d="M 146 160 L 146 172" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="174" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="196" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="bold" filter="url(#rough2)">② 提取公因子 n</text>
  <text x="146" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">gcd(n², n(n+1)) = n·gcd(n, n+1)</text>

  <path d="M 146 230 L 146 242" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="244" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="266" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 相邻整数互质</text>
  <text x="146" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">gcd(n, n+1) = 1</text>

  <path d="M 256 272 L 292 272" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回框 -->
  <rect x="296" y="246" width="228" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">return n</text>
  <text x="410" y="289" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(1) · 空间 O(1)</text>

  <!-- 互质证明注记 -->
  <rect x="296" y="54" width="228" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="78" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么相邻必互质？</text>
  <text x="310" y="102" font-size="12" fill="#446688" filter="url(#rough2)">设 d 整除 n 与 n+1，</text>
  <text x="310" y="124" font-size="12" fill="#446688" filter="url(#rough2)">则 d 整除 (n+1) − n = 1</text>
  <text x="310" y="146" font-size="12" fill="#446688" filter="url(#rough2)">⇒ d = 1，恒成立</text>
  <text x="310" y="163" font-size="11" fill="#888" filter="url(#rough2)">（更相减损术：gcd(a,b) | a−b）</text>

  <!-- 暴力旁路 -->
  <rect x="296" y="186" width="228" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="205" text-anchor="middle" font-size="12" fill="#b3541e" filter="url(#rough2)">旁路 · 暴力对照：累加 + 辗转相除</text>
  <text x="410" y="223" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">O(n)，n ≤ 1000 也能过（对拍用）</text>

  <!-- 底部备注 -->
  <rect x="36" y="314" width="488" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">闭式解天然免疫大 n：n = 10¹⁸ 时暴力累加失效，return n 依然瞬答</text>
</svg>
