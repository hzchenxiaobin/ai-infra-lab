<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + 按位计数闭式判定</text>

  <!-- Step 1: init -->
  <rect x="170" y="46" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lo = 1，hi = 10^16，ans = 0</text>

  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: mid -->
  <rect x="170" y="104" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">② 取 mid = (lo + hi) / 2</text>

  <path d="M 280 140 L 280 154" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: acc(mid) -->
  <rect x="115" y="158" width="330" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="177" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">③ 计算 acc(mid)：枚举计费位 i = x, 2x, 3x, …</text>
  <text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">逐位 O(1)：⌊n/2^i⌋·2^(i−1) + max(0, n mod 2^i − 2^(i−1))，n = mid+1</text>
  <text x="280" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">和一旦超过 k 提前退出（防溢出兼提速）</text>

  <path d="M 280 214 L 280 230" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,234 380,282 280,330 180,282" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">acc(mid)</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">≤ k ？</text>

  <!-- Yes branch (right): cheap, go bigger -->
  <path d="M 380 282 L 424 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="402" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="426" y="258" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="491" y="275" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">mid 廉价 ✓</text>
  <text x="491" y="290" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = mid</text>
  <text x="491" y="303" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lo = mid + 1</text>

  <!-- No branch (left): too expensive, shrink -->
  <path d="M 180 282 L 136 282" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="158" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="14" y="258" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">mid 超支 ✗</text>
  <text x="74" y="290" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">hi = mid − 1</text>
  <text x="74" y="303" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向左收缩</text>

  <!-- loop back arrows -->
  <path d="M 491 258 L 491 122 L 394 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 74 258 L 74 122 L 166 122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="497" y="192" font-size="9.5" fill="#aaa" filter="url(#rough2)">lo ≤ hi</text>
  <text x="497" y="204" font-size="9.5" fill="#aaa" filter="url(#rough2)">循环 ↑</text>

  <!-- exit down -->
  <path d="M 280 330 L 280 352" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="346" font-size="10" fill="#aaa" filter="url(#rough2)">lo &gt; hi 结束</text>

  <!-- Step 4: return -->
  <rect x="140" y="356" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">④ 返回 ans（最大廉价数字）</text>

  <!-- note box -->
  <rect x="60" y="406" width="440" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">上界 hi = 10^16 的底气：x = 8（计费最稀疏）时 acc(10^16) ≈ 3×10^16 ≫ 10^15，</text>
  <text x="280" y="441" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">答案必在界内；求和最坏 54 项 × 5×10^15 ≈ 2.7×10^17，long long 不溢出</text>
  <text x="280" y="456" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单轮判定 O(54/x) 次 O(1) 公式 ⇒ 总复杂度 O((log k)²/x) ≈ 3000 次整数运算</text>
</svg>
