<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫边 + 一趟扫点，全程不建图</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">时间 O(n + m)，空间 O(n)——每条边只用到它的终点</text>

  <!-- 步骤 1 -->
  <rect x="200" y="64" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">indeg[0..n−1] 全部置 0</text>

  <path d="M 290 96 L 290 110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="160" y="112" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="131" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历每条边 [u, v]</text>
  <text x="290" y="149" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">indeg[v] += 1（v 又被压制一次）</text>

  <path d="M 290 158 L 290 172" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="160" y="174" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">扫描 indeg[]，收集所有值为 0 的下标</text>

  <path d="M 290 206 L 290 226" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="290,228 408,264 290,300 172,264" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">入度 0 的个数 = 1？</text>

  <!-- 分支 -->
  <path d="M 172 264 L 128 264 L 128 304" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="148" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 408 264 L 452 264 L 452 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="432" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 结果框 -->
  <rect x="38" y="306" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="128" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回该下标</text>
  <text x="128" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">唯一冠军 ✓</text>

  <rect x="362" y="306" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <text x="452" y="348" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">候选 ≥ 2 个（或 0 个）✗</text>

  <text x="290" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">不需要邻接表 / BFS / DFS——入度数组就是全部状态</text>
</svg>
