<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- 总标题 -->
  <text x="30" y="34" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心：长度分桶计数 + 高到低逐位放 1（以 n=4, k=2 为例）</text>

  <!-- ① 按长度分桶 -->
  <text x="30" y="66" font-size="13" fill="#446688" filter="url(#rough2)">① 按长度分桶：桶大小 = C(L−1, k−1)，短桶的数全 &lt; 长桶的数</text>

  <!-- 桶 L=2 -->
  <rect x="30" y="80" width="115" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L = 2</text>
  <rect x="69" y="110" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="87" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">C(1,1)=1 个</text>

  <!-- 桶间箭头 -->
  <path d="M 147 126 L 166 126" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">＜</text>
  <path d="M 297 126 L 316 126" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">＜</text>

  <!-- 桶 L=3 -->
  <rect x="170" y="80" width="125" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L = 3</text>
  <rect x="180" y="110" width="42" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="201" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>
  <rect x="228" y="110" width="42" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="249" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>
  <text x="232" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">C(2,1)=2 个</text>

  <!-- 桶 L=4 -->
  <rect x="320" y="80" width="210" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L = 4</text>
  <rect x="330" y="110" width="50" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1001</text>
  <rect x="386" y="110" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="411" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1010</text>
  <rect x="442" y="110" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1100</text>
  <text x="425" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">C(3,1)=3 个</text>

  <!-- 累计刻度 -->
  <path d="M 87 172 L 87 186" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="87" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 1</text>
  <path d="M 232 172 L 232 186" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="232" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 1+2=3</text>
  <path d="M 425 172 L 425 186" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="425" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 1+2+3=6</text>

  <!-- n=4 定位标注 -->
  <text x="30" y="224" font-size="12.5" fill="#b85450" filter="url(#rough2)">n=4：前面桶共 3 个仍不够 → 答案长 L=4，桶内序号 n′ = 4 − 3 = 1</text>
  <path d="M 340 230 C 345 200 350 175 355 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ② 逐位放 1 -->
  <text x="30" y="258" font-size="13" fill="#446688" filter="url(#rough2)">② 桶内从高位到低位：放 0 能“跳过” C(p, r) 个更小的数</text>

  <!-- 位槽 -->
  <rect x="40" y="272" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="98" y="272" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="297" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="272" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="297" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="214" y="272" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <text x="62" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p=3 固定</text>
  <text x="120" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p=2</text>
  <text x="178" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p=1</text>
  <text x="236" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p=0</text>

  <!-- 决策注释 -->
  <text x="290" y="282" font-size="12" fill="#333" filter="url(#rough2)">p=2：C(2,1)=2 ≥ n′=1 → 放 0</text>
  <text x="290" y="304" font-size="12" fill="#333" filter="url(#rough2)">p=1：C(1,1)=1 ≥ n′=1 → 放 0</text>
  <text x="290" y="326" font-size="12" fill="#b85450" filter="url(#rough2)">p=0：C(0,1)=0 &lt; n′=1 → 放 1</text>

  <!-- 结果 -->
  <text x="40" y="364" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 1001<tspan font-size="11" dy="4">2</tspan><tspan dy="-4"> = 9 ✓</tspan></text>

  <!-- 脚注 -->
  <text x="30" y="398" font-size="11.5" fill="#888" filter="url(#rough2)">「跳过」= 前缀相同、该位为 0、低 p 位任放 r 个 1 的数，它们都更小（共 C(p, r) 个）</text>
</svg>
