<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：双指针从两端相向，失配 +2</text>

  <!-- ① 转二进制 -->
  <rect x="150" y="38" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① s ← n 的二进制（去前导零）</text>

  <path d="M 260 68 L 260 80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="150" y="80" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② l = 0，r = L−1，ans = 0</text>

  <path d="M 260 110 L 260 122" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ l < r ? -->
  <polygon points="260,122 338,150 260,178 182,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">l &lt; r ?</text>

  <!-- 否 → 返回 -->
  <path d="M 338 150 L 394 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="143" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="396" y="133" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑦ 返回 ans</text>

  <!-- 是 ↓ -->
  <path d="M 260 178 L 260 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- ④ s[l] != s[r] ? -->
  <polygon points="260,192 338,220 260,248 182,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s[l] ≠ s[r] ?</text>

  <!-- 是（失配）↓ ans += 2 -->
  <path d="M 260 248 L 260 262" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="185" y="262" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ ans += 2</text>

  <path d="M 260 292 L 260 304" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ 推进 -->
  <rect x="185" y="304" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ l++，r−−</text>

  <!-- ④ 否（匹配）→ 直接推进 -->
  <path d="M 182 220 L 138 220 L 138 319 L 183 319" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="272" transform="rotate(-90 131 272)" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">匹配 ⇒ 0 次，跳过</text>

  <!-- ⑥ → ③ 循环回环 -->
  <path d="M 260 334 L 260 346 L 70 346 L 70 150 L 178 150" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="250" transform="rotate(-90 62 250)" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一对（共 ⌊L/2⌋ 轮）</text>

  <!-- 右侧注释框 -->
  <rect x="384" y="230" width="124" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#d6a040" text-anchor="middle">
    <text x="446" y="250" font-weight="bold">为什么每对 +2 ？</text>
    <text x="446" y="266">位置 i 与 L−1−i</text>
    <text x="446" y="282">同生同灭地失配，</text>
    <text x="446" y="298">各翻一次 ⇒ +2</text>
  </g>
</svg>
