<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 判定 → 取半 → 排列 → 镜像</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">前半段承接 266 判定，后半段承接 47 去重排列</text>

  <!-- ====== Step 1: count freq ====== -->
  <rect x="80" y="60" width="300" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计字符频次</text>
  <text x="230" y="98" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#446688">cnt[26] = {0}; for c in s: cnt[c-'a']++</text>
  <text x="230" y="112" text-anchor="middle" font-size="9.5" fill="#888">O(n)，26 字母定长数组</text>

  <path d="M 230 120 L 230 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Step 2: decision diamond ====== -->
  <polygon points="230,142 360,192 230,242 100,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="184" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">奇数次字符 ≤ 1 ?</text>
  <text x="230" y="202" text-anchor="middle" font-size="10" fill="#888">（266 的判定）</text>
  <text x="230" y="216" text-anchor="middle" font-size="10" fill="#888">odd = Σ cnt[i]%2</text>

  <!-- No branch → return [] -->
  <path d="M 360 192 L 430 192 L 430 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="184" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="392" y="234" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="452" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return []</text>
  <text x="452" y="268" text-anchor="middle" font-size="9.5" fill="#b85450">无法构成回文</text>

  <!-- Yes branch ↓ -->
  <path d="M 230 242 L 230 262" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="246" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ====== Step 3: build half ====== -->
  <rect x="80" y="264" width="300" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 构建半串 half + 中心 mid</text>
  <text x="230" y="302" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#446688">half += cnt[i]/2 个 ('a'+i); mid += 奇数个字符</text>
  <text x="230" y="316" text-anchor="middle" font-size="9.5" fill="#888">half 天然有序（按字母遍历），无需额外排序</text>

  <path d="M 230 324 L 230 344" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Step 4: backtrack ====== -->
  <rect x="80" y="346" width="300" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="368" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 回溯生成 half 的唯一排列</text>
  <text x="230" y="384" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#4a7a3a">backtrack(half, path, used) + 同层剪枝去重</text>
  <text x="230" y="398" text-anchor="middle" font-size="9.5" fill="#888">承接 47 全排列 II 的排序 + !used[i-1] 剪枝</text>

  <path d="M 230 406 L 230 422" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Step 5: mirror ====== -->
  <rect x="80" y="424" width="300" height="10" fill="none"/>

  <!-- right side: mirror step + result -->
  <rect x="400" y="346" width="130" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="465" y="366" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ 镜像拼接</text>
  <text x="465" y="384" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">perm + mid</text>
  <text x="465" y="398" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">+ reverse(perm)</text>
  <text x="465" y="414" text-anchor="middle" font-size="9.5" fill="#888">→ 一条回文排列</text>

  <path d="M 380 375 L 400 375" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="432" text-anchor="middle" font-size="10.5" fill="#555">对每个唯一排列镜像拼接 → 返回所有回文排列</text>
</svg>
