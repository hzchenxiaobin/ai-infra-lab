<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：预求 maxVal 与 threshold = maxVal − extra，每个孩子只需一次比较</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">candies[i] + extra ≥ maxVal  ⟺  candies[i] ≥ maxVal − extra</text>

  <!-- result column label -->
  <text x="40" y="56" font-size="11" fill="#888">res[i]</text>

  <!-- check row (true/false result per kid) -->
  <text x="130" y="56" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="200" y="56" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="270" y="56" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="340" y="56" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✗</text>
  <text x="410" y="56" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- axes -->
  <path d="M 80 70 L 80 300 L 480 300" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- max line (red solid) at value 5 -> y=70 -->
  <path d="M 80 70 L 480 70" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="486" y="66" font-size="11" fill="#b85450" font-weight="bold">maxVal = 5</text>

  <!-- threshold line (orange dashed) at value 2 -> y=208 -->
  <path d="M 80 208 L 480 208" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="486" y="205" font-size="11" fill="#d6a040" font-weight="bold">threshold = 2</text>
  <text x="486" y="220" font-size="9.5" fill="#b08840">= max − extra</text>

  <!-- bars: idx0 v2 -->
  <rect x="105" y="208" width="50" height="92" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="226" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- idx1 v3 -->
  <rect x="175" y="162" width="50" height="138" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- idx2 v5 (the max element, highlight orange) -->
  <rect x="245" y="70" width="50" height="230" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- idx3 v1 (fails) -->
  <rect x="315" y="254" width="50" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- idx4 v3 -->
  <rect x="385" y="162" width="50" height="138" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- index labels -->
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="200" y="318" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="340" y="318" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="410" y="318" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="40" y="318" font-size="11" fill="#888">孩子 i</text>

  <!-- note box -->
  <rect x="80" y="336" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="356" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">等价变形：candies[i] + extra ≥ maxVal ⟺ candies[i] ≥ maxVal − extra</text>
  <text x="300" y="374" text-anchor="middle" font-size="10.5" fill="#555">把「每个孩子加一次 extra」换成「max 减一次 extra」→ 1 次减法 + n 次比较</text>
</svg>
