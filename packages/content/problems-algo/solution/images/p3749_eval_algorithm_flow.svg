<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：单趟扫描 + 双栈，")" 处归约</text>

  <!-- 开始框 -->
  <rect x="185" y="32" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = 0，nums / ops 清空</text>

  <path d="M 260 58 L 260 70" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形：终止判定 -->
  <polygon points="260,74 325,98 260,122 195,98" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 325 98 L 370 98" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="344" y="92" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <rect x="374" y="82" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="439" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 nums.back()</text>

  <path d="M 260 122 L 260 136" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="270" y="134" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <!-- 取字符分派 -->
  <rect x="172" y="140" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c = s[i]，按字符类别分派</text>

  <path d="M 260 166 L 260 180" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 分配总线 -->
  <line x1="77" y1="182" x2="462" y2="182" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 77 182 L 77 190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 207 182 L 207 190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 337 182 L 337 190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 462 182 L 462 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 四个分支处理框 -->
  <rect x="25" y="192" width="104" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="214" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字母 ⇒</text>
  <text x="77" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">抓函数名压 ops</text>

  <rect x="155" y="192" width="104" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">− / 数字 ⇒</text>
  <text x="207" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">抓整数压 nums</text>

  <rect x="285" y="192" width="104" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="214" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">( , 空格 ⇒</text>
  <text x="337" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">噪声跳过 i++</text>

  <rect x="412" y="192" width="100" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">")" ⇒ 归约</text>
  <text x="462" y="222" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">弹 op、b、a</text>
  <text x="462" y="236" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">apply 压回 nums</text>

  <!-- 汇流总线 -->
  <path d="M 77 246 L 77 260" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 207 246 L 207 260" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 337 246 L 337 260" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 462 246 L 462 260" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="77" y1="262" x2="462" y2="262" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 260 262 L 260 270" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 推进框 -->
  <rect x="185" y="272" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i 移到下一 token 起点</text>

  <!-- 回边 -->
  <path d="M 185 285 L 14 285 L 14 98 L 191 98" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="26" y="200" font-size="10" fill="#666" filter="url(#rough2)">循</text>
  <text x="26" y="214" font-size="10" fill="#666" filter="url(#rough2)">环</text>

  <!-- 底部说明框 -->
  <rect x="25" y="312" width="470" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="37" y="329" font-size="10" fill="#333" filter="url(#rough2)">均摊 O(n)：游标 i 单调前进，每个 token 恰被消费一次；")" 分支是唯一计算点</text>
  <text x="37" y="346" font-size="10" fill="#333" filter="url(#rough2)">弹序：先弹 b（第二参数）再弹 a（第一参数）——sub / div 不可交换</text>
</svg>
