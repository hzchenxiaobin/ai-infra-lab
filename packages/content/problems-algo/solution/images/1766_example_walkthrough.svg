<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 (nums=[2,3,3,2]) 的 5 步执行</text>

  <!-- Tree sketch -->
  <text x="80" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">树形</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="80" cy="74" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="80" y="78" fill="#446688">0</text>
    <text x="80" y="98" font-size="9" fill="#888" font-weight="normal">2</text>

    <circle cx="80" cy="124" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="80" y="128" fill="#4a7a3a">1</text>
    <text x="80" y="148" font-size="9" fill="#888" font-weight="normal">3</text>

    <circle cx="48" cy="184" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="48" y="188" fill="#b85450">2</text>
    <text x="48" y="208" font-size="9" fill="#888" font-weight="normal">3</text>

    <circle cx="116" cy="184" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="116" y="188" fill="#d6a040">3</text>
    <text x="116" y="208" font-size="9" fill="#888" font-weight="normal">2</text>
  </g>
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.6" fill="none">
    <path d="M 80 89 L 80 109"/>
    <path d="M 73 139 L 55 169"/>
    <path d="M 87 139 L 109 169"/>
  </g>
  <text x="80" y="228" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">coprimes[2]含3</text>
  <text x="80" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">coprimes[3]含2</text>

  <!-- Steps table -->
  <text x="380" y="48" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">逐步执行</text>

  <!-- header -->
  <g filter="url(#rough2)" font-size="9.5" fill="#555">
    <rect x="180" y="56" width="420" height="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3"/>
    <text x="195" y="71" font-weight="bold">步</text>
    <text x="230" y="71" font-weight="bold">节点</text>
    <text x="290" y="71" font-weight="bold">path 状态(非空桶)</text>
    <text x="475" y="71" font-weight="bold">候选(取最深)</text>
    <text x="585" y="71" font-weight="bold">ans</text>
  </g>

  <!-- row 1: step ① node 0 -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="180" y="80" width="420" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="195" y="100" fill="#446688" font-weight="bold">①</text>
    <text x="230" y="100">0 (val=2)</text>
    <text x="290" y="94">path[2]=[0]</text>
    <text x="290" y="108" font-size="8.5" fill="#888">path[3]=∅</text>
    <text x="475" y="100">coprimes[2]→path[3]顶=∅</text>
    <text x="585" y="100" fill="#b85450" font-weight="bold">-1</text>
  </g>

  <!-- row 2: step ② node 1 -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="180" y="116" width="420" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="195" y="136" fill="#4a7a3a" font-weight="bold">②</text>
    <text x="230" y="136">1 (val=3)</text>
    <text x="290" y="130">path[2]=[0]</text>
    <text x="290" y="144">path[3]=[1]</text>
    <text x="475" y="136">coprimes[3]→path[2]顶=0(d0)</text>
    <text x="585" y="136" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- row 3: step ③ node 2 -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="180" y="152" width="420" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="195" y="176" fill="#b85450" font-weight="bold">③</text>
    <text x="230" y="176">2 (val=3)</text>
    <text x="290" y="168">path[2]=[0]</text>
    <text x="290" y="182">path[3]=[1,2]</text>
    <text x="475" y="170">coprimes[3]→path[2]顶=0(d0)</text>
    <text x="475" y="184" font-size="8.5" fill="#888">path[3]不计(3∉coprimes[3])</text>
    <text x="585" y="176" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- row 4: step ④ backtrack -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="180" y="194" width="420" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="3"/>
    <text x="195" y="213" fill="#888" font-weight="bold">④</text>
    <text x="230" y="213">回溯 2</text>
    <text x="290" y="213">path[3]=[1]  ← 弹出 2</text>
    <text x="475" y="213" fill="#888">恢复到节点 1 的状态</text>
    <text x="585" y="213" fill="#888">—</text>
  </g>

  <!-- row 5: step ⑤ node 3 -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="180" y="226" width="420" height="40" fill="#fff" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="195" y="250" fill="#d6a040" font-weight="bold">⑤</text>
    <text x="230" y="250">3 (val=2)</text>
    <text x="290" y="242">path[2]=[0,3]</text>
    <text x="290" y="256">path[3]=[1]</text>
    <text x="475" y="244">coprimes[2]→path[3]顶=1(d1)</text>
    <text x="475" y="258" font-size="8.5" fill="#b85450">d1 &gt; d0 → 选 1</text>
    <text x="585" y="250" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- Result -->
  <rect x="180" y="276" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="296" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果：ans = [-1, 0, 0, 1] ✓</text>

  <!-- Key insights -->
  <rect x="40" y="324" width="560" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="344" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两处精髓</text>

  <text x="56" y="364" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">步骤 ③：</text>
  <text x="120" y="364" font-size="9.5" fill="#555" filter="url(#rough2)">节点 2 与父节点 1 同值(3)，gcd(3,3)=3 不互质。</text>
  <text x="120" y="378" font-size="9.5" fill="#555" filter="url(#rough2)">coprimes[3] 不含 3 → path[3] 桶自动跳过，无需特判同值父节点。</text>

  <text x="56" y="398" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">步骤 ⑤：</text>
  <text x="120" y="398" font-size="9.5" fill="#555" filter="url(#rough2)">兄弟节点 2 已在 ④ 弹栈，path[3] 顶是节点 1 而非节点 2。</text>
  <text x="120" y="412" font-size="9.5" fill="#555" filter="url(#rough2)">弹栈保证 path 只反映当前路径，兄弟节点不会被误当祖先。</text>

  <text x="310" y="432" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">同值跳过靠预处理表 ✦ 兄弟隔离靠进/出栈配对</text>
</svg>
