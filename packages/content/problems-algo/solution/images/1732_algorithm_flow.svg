<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历，滚动维护 alt 与 best</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- arrow start -> init -->
  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="170" y="96" width="180" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">alt = 0, best = 0</text>
  <text x="260" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">起点海拔 0 即首个候选</text>

  <!-- arrow init -> diamond -->
  <path d="M 260 138 L 260 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有 gain 元素? center (260, 190) -->
  <polygon points="260,164 332,190 260,216 188,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有 gain</text>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">元素？</text>

  <!-- 是: diamond bottom -> process top -->
  <path d="M 260 216 L 260 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="236" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process rect -->
  <rect x="140" y="250" width="240" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">g = 下一个 gain 元素</text>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">alt = alt + g</text>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best = max(best, alt)</text>

  <!-- loop back: process right -> right -> up -> diamond right -->
  <path d="M 380 283 L 432 283 L 432 190 L 332 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="240" font-size="10" fill="#888" filter="url(#rough2)">重复</text>

  <!-- 否: diamond left -> left -> down -> end -->
  <path d="M 188 190 L 118 190 L 118 360 L 206 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="184" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="72" y="280" font-size="9.5" fill="#b85450" filter="url(#rough2)">遍历完</text>

  <!-- End oval -->
  <ellipse cx="260" cy="360" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 best</text>
</svg>
