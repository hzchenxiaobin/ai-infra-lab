<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：奇偶可行性剪枝 + 组合数取模</text>

  <!-- Box 1 -->
  <rect x="70" y="40" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① Δ = endPos − startPos，d = |Δ|</text>

  <path d="M 260 74 L 260 86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: feasibility (decision) -->
  <rect x="70" y="88" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 可行性？ (k − d) 偶 且 d ≤ k</text>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否 → 直接返回 0（剪枝）</text>

  <path d="M 260 134 L 260 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 -->
  <rect x="70" y="148" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ r = (k + Δ) / 2   （向右步数）</text>

  <path d="M 260 182 L 260 194" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4 -->
  <rect x="70" y="196" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 预处理 fact / invFact ∈ [0, k]</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">invFact[k] = fact[k]^(p−2) 后线性回推</text>

  <path d="M 260 242 L 260 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5 -->
  <rect x="70" y="256" width="380" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ ans = fact[k]·invFact[r]·invFact[k−r] mod p</text>

  <!-- Footer notes -->
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(k)，空间 O(k)；k ≤ 1000 ⟹ 预处理仅 1000 项</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">② 的剪枝把 k 与 d 异奇偶、距离过远两类直接归零</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">逆元仅调一次 pow（费马小定理），其余 O(k) 回推</text>
</svg>
