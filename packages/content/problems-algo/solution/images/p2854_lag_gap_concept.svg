  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">相邻间隔都 ≥ 1 天 ⇒ 和为 2 ⇔ 各为 1；差 &gt; 2 天必有缺日</text>
