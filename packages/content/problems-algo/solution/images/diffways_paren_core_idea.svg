<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：枚举「最后执行的运算符」= 枚举加括号方式</text>

  <!-- Expression: 2 * 3 - 4 * 5 -->
  <text x="30" y="62" font-size="12" fill="#888">表达式:</text>
  <rect x="96" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <rect x="192" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="244" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">-</text>
  <rect x="288" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="340" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <rect x="384" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- three split markers (vertical dashed lines) -->
  <path d="M 166 84 L 166 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 262 84 L 262 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 84 L 358 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="460" y="48" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="476" y="58" font-size="10" fill="#555">运算符</text>
  <text x="510" y="58" font-size="10" fill="#b85450">↓ 最后执行</text>

  <!-- Split 1: top = * at idx1 -->
  <text x="30" y="112" font-size="11" fill="#888" font-weight="bold">以第1个 * 为根:</text>
  <rect x="40" y="120" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="138" text-anchor="middle" font-size="11" fill="#333">左="2"</text>
  <rect x="130" y="120" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">*</text>
  <rect x="190" y="120" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#333">右="3-4*5"</text>
  <text x="330" y="138" font-size="11" fill="#4a7a3a">→ {2} × {-17,-5}</text>
  <rect x="450" y="120" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">→ {-34, -10}</text>

  <!-- Split 2: top = - at idx3 -->
  <text x="30" y="170" font-size="11" fill="#888" font-weight="bold">以 - 为根:</text>
  <rect x="40" y="178" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="196" text-anchor="middle" font-size="11" fill="#333">左="2*3"</text>
  <rect x="136" y="178" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-</text>
  <rect x="188" y="178" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="196" text-anchor="middle" font-size="11" fill="#333">右="4*5"</text>
  <text x="290" y="196" font-size="11" fill="#4a7a3a">→ {6} - {20}</text>
  <rect x="450" y="178" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">→ {-14}</text>

  <!-- Split 3: top = * at idx5 -->
  <text x="30" y="228" font-size="11" fill="#888" font-weight="bold">以第2个 * 为根:</text>
  <rect x="40" y="236" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="11" fill="#333">左="2*3-4"</text>
  <rect x="156" y="236" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">*</text>
  <rect x="210" y="236" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="254" text-anchor="middle" font-size="11" fill="#333">右="5"</text>
  <text x="310" y="254" font-size="11" fill="#4a7a3a">→ {-2,2} × {5}</text>
  <rect x="450" y="236" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">→ {-10, 10}</text>

  <!-- merge all -->
  <path d="M 510 268 L 510 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="300" font-size="11" fill="#888">三个分支的结果并集 =</text>
  <rect x="450" y="288" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">{-34,-14,-10,-10,10}</text>

  <!-- bottom callout -->
  <rect x="30" y="332" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每个运算符轮流当「树根」(最后执行)，左右子串递归求全部结果，再两两组合</text>
  <text x="310" y="368" text-anchor="middle" font-size="11" fill="#888">n 个运算符 → 卡塔兰数 Cₙ 种括号化，逐一枚举不重不漏</text>
</svg>
