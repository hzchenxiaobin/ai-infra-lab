<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">峰值判定：中间高、两边低，还要「严格」</text>

  <!-- Section A: mountain = [1,4,3,8,5] -->
  <rect x="88" y="64" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="89" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="142" y="64" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="89" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="196" y="64" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="89" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <rect x="250" y="64" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="89" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="304" y="64" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="89" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>

  <!-- comparison arrows above -->
  <path d="M 110 62 C 118 44 156 44 164 62" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="137" y="40" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 &lt; 4</text>
  <path d="M 216 62 C 208 44 172 44 164 62" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="40" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 &lt; 4</text>
  <path d="M 222 62 C 230 44 264 44 272 62" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="247" y="40" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 &lt; 8</text>
  <path d="M 326 62 C 318 44 280 44 272 62" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="299" y="40" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 &lt; 8</text>

  <!-- index labels -->
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="164" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="218" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="272" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="326" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>

  <!-- per-index annotations -->
  <text x="110" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首 ✗</text>
  <text x="164" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 ✓</text>
  <text x="218" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">非峰</text>
  <text x="272" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 ✓</text>
  <text x="326" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">尾 ✗</text>

  <!-- answer box -->
  <rect x="372" y="66" width="132" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="438" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">收集峰下标</text>
  <text x="438" y="110" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = [1, 3]</text>
  <path d="M 298 86 C 330 86 346 90 368 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Section B: plateau counter-example -->
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例：mountain = [2, 4, 4] —— 等值不算峰</text>

  <rect x="128" y="192" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="180" y="192" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="217" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="244" y="192" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="217" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="234" y="219" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">＝</text>

  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="202" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="266" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="330" y="192" width="164" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="412" y="214" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4 不严格大于 4</text>
  <text x="412" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = [ ]</text>
  <path d="M 290 212 L 326 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="48" y="284" width="424" height="98" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">① 判定窗口只有 3 格：m[i−1]、m[i]、m[i+1]，各下标判定相互独立；</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">② 必须严格大于：等值平台（如 4，4）不算峰——示例 1 埋的坑；</text>
  <text x="260" y="354" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">③ 首尾天然排除，枚举范围收缩为 [1, n−2]，一趟扫描即最优。</text>
</svg>
