<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：先判包含，再双向最大重叠，取短</text>

  <!-- 开始 -->
  <rect x="190" y="38" width="140" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 s1, s2</text>
  <path d="M260,70 L260,90" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判包含 -->
  <path d="M260,92 L355,127 L260,162 L165,127 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">有包含关系？</text>
  <text x="260" y="139" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">s1 ⊆ s2 或 s2 ⊆ s1</text>

  <!-- 是：返回长串 -->
  <path d="M355,127 L390,127" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="394" y="110" width="112" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">return 长串</text>

  <!-- 否：主流程 -->
  <path d="M260,162 L260,184" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="180" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="135" y="188" width="250" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">k₁ ← s1 后缀与 s2 前缀的最大重叠</text>
  <text x="260" y="223" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">（k 从 min(m,n) 递减，首次匹配即最大）</text>
  <path d="M260,232 L260,250" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="135" y="254" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">k₂ ← s2 后缀与 s1 前缀的最大重叠</text>
  <path d="M260,288 L260,306" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="120" y="310" width="280" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x = s1 + s2[k₁:]，y = s2 + s1[k₂:]</text>
  <text x="260" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return 较短者（等长任取）</text>

  <!-- 右侧备注 -->
  <rect x="398" y="188" width="112" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">正确性</text>
  <text x="454" y="226" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">砍头 + 去空隙的</text>
  <text x="454" y="240" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">交换论证 ⇒ 三形态</text>
  <text x="454" y="258" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">两串贪心 = 精确解</text>
  <text x="454" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">时间 O(nm)</text>
  <text x="454" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n,m ≤ 100 ⇒</text>
  <text x="454" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">约 10⁴ 次比较</text>

  <!-- 底部坑提示 -->
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 包含别漏判：嵌在长串中间的重叠抓不到（"abcba" ⊃ "bcb"，5 vs 8）</text>
</svg>
