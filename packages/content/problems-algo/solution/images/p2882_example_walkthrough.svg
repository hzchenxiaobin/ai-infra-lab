<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 逐行演算：哈希判重，保留首次出现</text>

  <!-- Header row -->
  <rect x="30" y="56" width="44" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="75" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">行</text>
  <rect x="74" y="56" width="160" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="75" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">email（判重键）</text>
  <rect x="234" y="56" width="160" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="75" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">seen 集合变化</text>
  <rect x="394" y="56" width="70" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="429" y="75" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">判定</text>
  <rect x="464" y="56" width="100" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="514" y="75" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">动作</text>

  <!-- row 0 -->
  <rect x="30" y="84" width="44" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="74" y="84" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="154" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">emily@example.com</text>
  <rect x="234" y="84" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+ emily</text>
  <rect x="394" y="84" width="70" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="429" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次 ✓</text>
  <rect x="464" y="84" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">保留（Ella）</text>

  <!-- row 1 -->
  <rect x="30" y="120" width="44" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="120" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="154" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">michael@example.com</text>
  <rect x="234" y="120" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+ michael</text>
  <rect x="394" y="120" width="70" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="429" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次 ✓</text>
  <rect x="464" y="120" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">保留（David）</text>

  <!-- row 2 -->
  <rect x="30" y="156" width="44" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="74" y="156" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="154" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">sarah@example.com</text>
  <rect x="234" y="156" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+ sarah</text>
  <rect x="394" y="156" width="70" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="429" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次 ✓</text>
  <rect x="464" y="156" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">保留（Zachary）</text>

  <!-- row 3: Alice, first occurrence of john@ -->
  <rect x="30" y="192" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="74" y="192" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">john@example.com</text>
  <rect x="234" y="192" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+ john</text>
  <rect x="394" y="192" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="429" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次 ✓</text>
  <rect x="464" y="192" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="514" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">保留（Alice）</text>

  <!-- row 4: Finn, duplicate -->
  <rect x="30" y="228" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="74" y="228" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">john@example.com</text>
  <rect x="234" y="228" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="251" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已存在，不变</text>
  <rect x="394" y="228" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="429" y="251" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">重复 ✗</text>
  <rect x="464" y="228" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="514" y="251" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">丢弃（Finn）</text>

  <!-- row 5 -->
  <rect x="30" y="264" width="44" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="74" y="264" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="154" y="287" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">alice@example.com</text>
  <rect x="234" y="264" width="160" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="287" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+ alice</text>
  <rect x="394" y="264" width="70" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="429" y="287" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次 ✓</text>
  <rect x="464" y="264" width="100" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="287" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">保留（Violet）</text>

  <!-- Bottom summary -->
  <rect x="60" y="318" width="480" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出：customer_id = 1, 2, 3, 4, 6（共 5 行）</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相对顺序 = 首次出现顺序（drop_duplicates 是稳定操作）</text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行索引 0,1,2,3,5 跳过 4 —— 评测只比对数据，不比对索引标签</text>
</svg>
