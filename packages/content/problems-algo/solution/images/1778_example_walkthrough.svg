<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>

  <!-- Left grid: DFS order -->
  <text x="115" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">DFS 探索顺序</text>

  <rect x="40" y="58" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="65" y="97" text-anchor="middle" font-size="9" fill="#4a7a3a">S</text>

  <rect x="110" y="58" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">②</text>

  <rect x="180" y="58" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="80" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⑤</text>
  <text x="205" y="97" text-anchor="middle" font-size="9" fill="#b85450">T</text>

  <rect x="40" y="128" width="50" height="50" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="158" text-anchor="middle" font-size="16" fill="#bbb">#</text>

  <rect x="110" y="128" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">③</text>

  <rect x="180" y="128" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">④</text>

  <text x="115" y="198" text-anchor="middle" font-size="10" fill="#888">DFS 递归 5 格，第 ⑤ 格命中目标</text>

  <!-- Arrow between grids -->
  <path d="M245 90 L285 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right grid: BFS layers -->
  <text x="375" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">BFS 层级（dist）</text>

  <rect x="300" y="58" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="80" text-anchor="middle" font-size="12" fill="#446688">S</text>
  <text x="325" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <rect x="370" y="58" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="80" text-anchor="middle" font-size="12" fill="#d6a040">.</text>
  <text x="395" y="97" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <rect x="440" y="58" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="80" text-anchor="middle" font-size="12" fill="#b85450">T</text>
  <text x="465" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <rect x="300" y="128" width="50" height="50" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="158" text-anchor="middle" font-size="16" fill="#bbb">#</text>

  <rect x="370" y="128" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="150" text-anchor="middle" font-size="12" fill="#d6a040">.</text>
  <text x="395" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <rect x="440" y="128" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="150" text-anchor="middle" font-size="12" fill="#446688">.</text>
  <text x="465" y="167" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <text x="375" y="198" text-anchor="middle" font-size="10" fill="#888">BFS 第 2 层首达目标 → 返回 2</text>

  <!-- BFS step table -->
  <rect x="40" y="220" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">step</text>
  <text x="135" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pop</text>
  <text x="280" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">expand 邻居</text>
  <text x="430" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">result</text>

  <rect x="40" y="244" width="440" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="260" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="135" y="260" text-anchor="middle" font-size="10.5" fill="#333">(0,0)</text>
  <text x="280" y="260" text-anchor="middle" font-size="10.5" fill="#333">(0,1) 入队, d=1</text>
  <text x="430" y="260" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <rect x="40" y="268" width="440" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="284" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="135" y="284" text-anchor="middle" font-size="10.5" fill="#333">(0,1)</text>
  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#b85450">(0,2) = T</text>
  <text x="430" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return 2 ✓</text>

  <line x1="90" y1="220" x2="90" y2="292" stroke="#ddd" stroke-width="1"/>
  <line x1="180" y1="220" x2="180" y2="292" stroke="#ddd" stroke-width="1"/>
  <line x1="380" y1="220" x2="380" y2="292" stroke="#ddd" stroke-width="1"/>

  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#888">DFS 探完 5 格后，机器人物理回到 (0,0)，再用 BFS 在已知地图上求最短路</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#aaa">两阶段解耦：探图（DFS + 物理移动）与寻路（BFS + 纯计算）互不干扰</text>
</svg>
