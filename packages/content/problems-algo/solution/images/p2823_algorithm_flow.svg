<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：三分支递归（数组 / 对象 / 原始值）</text>

  <!-- Start -->
  <ellipse cx="270" cy="52" rx="60" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">deepFilter(obj, fn)</text>

  <!-- Branch lines to three columns -->
  <path d="M 210 64 L 100 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 70 L 270 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 330 64 L 440 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- === Column 1: Array (x=100) === -->
  <text x="100" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">数组</text>

  <rect x="30" y="100" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">递归 map + filter</text>
  <text x="100" y="129" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">子元素 deepFilter 后去 undefined</text>

  <path d="M 100 136 L 100 158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="100,160 170,190 100,220 30,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="186" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">fn(arr) ||</text>
  <text x="100" y="198" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">len > 0 ?</text>

  <path d="M 100 220 L 100 244" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="112" y="236" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="40" y="246" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return filtered</text>

  <path d="M 170 190 L 200 190" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="185" y="182" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="202" y="176" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="234" y="195" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">undefined</text>

  <!-- === Column 2: Object (x=270) === -->
  <text x="270" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">对象</text>

  <rect x="200" y="100" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遍历 keys 递归</text>
  <text x="270" y="129" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">各属性 deepFilter 后去 undefined</text>

  <path d="M 270 136 L 270 158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,160 340,190 270,220 200,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">fn(obj) ||</text>
  <text x="270" y="198" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">keys > 0 ?</text>

  <path d="M 270 220 L 270 244" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="282" y="236" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="210" y="246" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return result</text>

  <path d="M 200 190 L 170 190" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="185" y="182" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="106" y="176" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="195" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">undefined</text>

  <!-- === Column 3: Primitive (x=440) === -->
  <text x="440" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">原始值</text>

  <rect x="380" y="100" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">number / string / ...</text>

  <path d="M 440 130 L 440 152" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="440,154 500,184 440,214 380,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="180" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">fn(val)</text>
  <text x="440" y="192" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">=== true ?</text>

  <path d="M 440 214 L 440 238" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="452" y="230" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="380" y="240" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="259" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return val</text>

  <path d="M 380 184 L 350 184" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="365" y="176" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="286" y="170" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="189" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">undefined</text>

  <!-- Bottom note -->
  <rect x="34" y="320" width="472" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="342" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留条件：fn(value) === true  或  容器递归筛选后非空</text>
  <text x="50" y="360" font-size="11" fill="#555" filter="url(#rough2)">移除条件：fn(value) === false 且（原始值 或 筛选后为空容器）</text>

  <!-- Key insight box -->
  <rect x="34" y="392" width="472" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="414" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键洞察：</text>
  <text x="50" y="432" font-size="10" fill="#555" filter="url(#rough2)">① 先递归过滤子元素，再决定容器自身去留（自底向上）</text>
  <text x="50" y="448" font-size="10" fill="#555" filter="url(#rough2)">② fn 对所有值生效——容器通过 fn 时即使空也保留（如 Array.isArray 返回 true）</text>
</svg>
