<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：外层块循环 + 内层累加 + 块尾取模</text>

  <!-- 开始 -->
  <rect x="80" y="32" width="140" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="48" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始：读入 s, k</text>
  <path d="M150,56 L150,64" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="64" width="140" height="20" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">result = ""（长度 n/k）</text>
  <path d="M150,84 L150,92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 块循环头 -->
  <rect x="70" y="92" width="160" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">块循环：i = 0，步长 k</text>
  <path d="M150,114 L150,122" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="122" width="140" height="20" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum = 0</text>
  <path d="M150,142 L150,150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层累加 -->
  <rect x="55" y="150" width="190" height="30" rx="4" fill="#fff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for j in [i, i+k)：</text>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum += s[j] − 'a'</text>
  <path d="M150,180 L150,188" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="188" width="140" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h = sum mod 26</text>
  <path d="M150,208 L150,216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="216" width="140" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">result += 'a' + h</text>
  <path d="M150,236 L150,244" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="150,244 208,266 150,288 92,266" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="263" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">还有下一块？</text>
  <text x="150" y="276" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i + k &lt; n</text>

  <!-- 是：循环回边 -->
  <path d="M92,266 L38,266 L38,103 L64,103" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="258" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">是</text>
  <text x="44" y="190" font-size="10" fill="#a06a10" filter="url(#rough2)">i += k</text>
  <text x="44" y="204" font-size="9" fill="#a06a10" filter="url(#rough2)">下一块</text>

  <!-- 否：返回 -->
  <path d="M208,266 L246,266" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="227" y="259" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="248" y="252" width="112" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="304" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 result</text>

  <!-- 右侧注解 -->
  <rect x="368" y="32" width="142" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">时间 O(n)</text>
  <text x="439" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每字符恰好读一次</text>
  <text x="439" y="98" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">分块 = 下标规划</text>

  <rect x="368" y="128" width="142" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">取模时机</text>
  <text x="439" y="174" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">块和 ≤ 2500 不溢出</text>
  <text x="439" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">块尾模一次即可</text>

  <rect x="368" y="224" width="142" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">工程细节</text>
  <text x="439" y="270" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C++: reserve(n/k)</text>
  <text x="439" y="290" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">免反复扩容</text>

  <text x="150" y="316" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两重循环只是把 n 个字符各扫一遍</text>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">模与转字符每块只做一次，共 n/k 次</text>
</svg>
