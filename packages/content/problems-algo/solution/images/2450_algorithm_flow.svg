<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="200" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求 2^(n−k+1) mod (10⁹+7)</text>

  <!-- main vertical flow centered at x=200 -->
  <!-- Start -->
  <ellipse cx="200" cy="54" rx="34" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">开始 (s, k)</text>
  <path d="M 200 68 L 200 82" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n = len(s) -->
  <rect x="110" y="82" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="105" text-anchor="middle" font-size="11.5" fill="#555">n = len(s)</text>
  <path d="M 200 118 L 200 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- m = n-k+1 -->
  <rect x="100" y="132" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#555">m = n − k + 1</text>
  <text x="200" y="165" text-anchor="middle" font-size="9.5" fill="#888">（长度 k 的子串数 = 翻转操作数）</text>
  <path d="M 200 172 L 200 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: 线性无关? -->
  <polygon points="200,188 268,214 200,240 132,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">m 个翻转向量</text>
  <text x="200" y="224" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">线性无关？（逐位贪心）</text>
  <path d="M 200 240 L 200 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ans = 2^m mod p -->
  <rect x="100" y="256" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="275" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans = 2^m mod (10⁹+7)</text>
  <text x="200" y="290" text-anchor="middle" font-size="9.5" fill="#888">快速幂 O(log m) / 累乘 O(m)</text>
  <path d="M 200 296 L 200 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <ellipse cx="200" cy="322" rx="34" ry="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- side note box -->
  <rect x="312" y="120" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="427" y="142" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">为何只此一步？</text>
  <text x="322" y="160" font-size="9.5" fill="#555">• 答案只依赖 n，与 s 内容无关</text>
  <text x="322" y="176" font-size="9.5" fill="#555">• 翻转奇偶向量 p 共 2^m 种，</text>
  <text x="322" y="190" font-size="9.5" fill="#555">  与 s 异或为双射保不同串数</text>
  <text x="322" y="206" font-size="9.5" fill="#555">• 线性无关 ⟹ 2^m 全部不同</text>

  <text x="312" y="238" font-size="9.5" fill="#999">约束 k ≤ n ⟹ m ≥ 1，恒有解</text>
</svg>
