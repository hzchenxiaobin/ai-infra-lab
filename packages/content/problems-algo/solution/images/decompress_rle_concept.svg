<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每对 [freq, val] 展开为 freq 个 val，从左到右拼接</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">nums[2i] = 频次 freq，nums[2i+1] = 值 val</text>

  <!-- Input row -->
  <text x="28" y="74" font-size="10.5" fill="#666">输入 nums</text>

  <!-- 4 input boxes: [1, 2, 3, 4] w=42 gap=10 start=86 -->
  <rect x="86" y="54" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="107" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="54" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="54" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="211" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="242" y="54" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="263" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- pair labels -->
  <text x="133" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">对0：freq=1, val=2</text>
  <text x="237" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">对1：freq=3, val=4</text>

  <!-- Arrows down -->
  <path d="M 133 110 L 133 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 237 110 L 237 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Expansion row -->
  <text x="28" y="158" font-size="10.5" fill="#666">展开</text>

  <!-- pair0 expansion: [2] centered at 133 -->
  <rect x="112" y="138" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="160" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- + sign -->
  <text x="168" y="161" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- pair1 expansion: [4,4,4] centered at 237 -->
  <rect x="196" y="138" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="238" y="138" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="160" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="280" y="138" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="160" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- Concatenate label + arrow -->
  <text x="225" y="194" text-anchor="middle" font-size="10.5" fill="#666">从左到右拼接</text>
  <path d="M 225 184 L 225 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result row -->
  <text x="28" y="232" font-size="10.5" fill="#666">结果</text>

  <!-- result [2, 4, 4, 4] w=42 gap=8 total=192 center=225 start=129 -->
  <rect x="129" y="214" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="179" y="214" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="229" y="214" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="279" y="214" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Bottom note -->
  <rect x="50" y="262" width="420" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">行程长度编码（Run-Length Encoding, RLE）</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#555">相邻两元素成对：[freq, val] 表示 val 连续出现 freq 次</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#555">解码 = 按对顺序展开 + 拼接，一次遍历 O(输出长度)</text>
</svg>
