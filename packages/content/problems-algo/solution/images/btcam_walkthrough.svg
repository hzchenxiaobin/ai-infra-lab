<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：[0,0,null,0,0,0,null,null,null,0,0] → 2</text>

  <!-- 左侧：树结构 + 状态标注 -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#888">后序顺序 ①→⑥</text>

  <!-- root ⑥ 已覆盖 -->
  <line x1="150" y1="92" x2="150" y2="124" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="150" cy="78" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="172" y="72" font-size="10" fill="#4a7a3a" font-weight="bold">⑥已覆盖</text>

  <!-- idx1 ⑤ 有摄像头 -->
  <line x1="138" y1="148" x2="100" y2="186" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="162" y1="148" x2="206" y2="186" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="150" cy="134" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="172" y="128" font-size="10" fill="#d6a040" font-weight="bold">⑤摄像头</text>

  <!-- idx3 ① 未覆盖（叶子） -->
  <circle cx="92" cy="198" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="202" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="60" y="222" font-size="10" fill="#b85450" font-weight="bold">①未覆盖</text>

  <!-- idx4 ④ 有摄像头 -->
  <line x1="200" y1="210" x2="178" y2="248" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="216" y1="210" x2="238" y2="248" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="208" cy="198" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="208" y="202" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="226" y="190" font-size="10" fill="#d6a040" font-weight="bold">④摄像头</text>

  <!-- idx9 ② 未覆盖（叶子） -->
  <circle cx="172" cy="260" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="264" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="140" y="284" font-size="10" fill="#b85450" font-weight="bold">②未覆盖</text>

  <!-- idx10 ③ 未覆盖（叶子） -->
  <circle cx="244" cy="260" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="244" y="264" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="212" y="284" font-size="10" fill="#b85450" font-weight="bold">③未覆盖</text>

  <!-- 右侧：步骤表 -->
  <!-- 表头 -->
  <rect x="340" y="50" width="280" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="360" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步</text>
  <text x="410" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="475" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">左/右态</text>
  <text x="545" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">状态</text>
  <text x="595" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">n</text>

  <!-- 行 ① 叶 idx3 -->
  <rect x="340" y="76" width="280" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="360" y="93" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="410" y="93" text-anchor="middle" font-size="9" fill="#333">左叶</text>
  <text x="475" y="93" text-anchor="middle" font-size="9" fill="#888">1 / 1</text>
  <text x="545" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="595" y="93" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ② 叶 idx9 -->
  <rect x="340" y="102" width="280" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="360" y="119" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="410" y="119" text-anchor="middle" font-size="9" fill="#333">右左叶</text>
  <text x="475" y="119" text-anchor="middle" font-size="9" fill="#888">1 / 1</text>
  <text x="545" y="119" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="595" y="119" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ③ 叶 idx10 -->
  <rect x="340" y="128" width="280" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="360" y="145" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="410" y="145" text-anchor="middle" font-size="9" fill="#333">右右叶</text>
  <text x="475" y="145" text-anchor="middle" font-size="9" fill="#888">1 / 1</text>
  <text x="545" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="595" y="145" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ④ idx4 -->
  <rect x="340" y="154" width="280" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="360" y="171" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="410" y="171" text-anchor="middle" font-size="9" fill="#333">右内</text>
  <text x="475" y="171" text-anchor="middle" font-size="9" fill="#b85450">0 / 0</text>
  <text x="545" y="171" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="595" y="171" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ⑤ idx1 -->
  <rect x="340" y="180" width="280" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="360" y="197" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="410" y="197" text-anchor="middle" font-size="9" fill="#333">左内</text>
  <text x="475" y="197" text-anchor="middle" font-size="9" fill="#555">0 / 2</text>
  <text x="545" y="197" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="595" y="197" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ⑥ root -->
  <rect x="340" y="206" width="280" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="360" y="223" text-anchor="middle" font-size="10" fill="#333">⑥</text>
  <text x="410" y="223" text-anchor="middle" font-size="9" fill="#333">根</text>
  <text x="475" y="223" text-anchor="middle" font-size="9" fill="#555">2 / 1</text>
  <text x="545" y="223" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="595" y="223" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 表格边框 -->
  <rect x="340" y="50" width="280" height="182" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="50" x2="380" y2="232" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="440" y1="50" x2="440" y2="232" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="50" x2="510" y2="232" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="580" y1="50" x2="580" y2="232" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="50" y="310" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 count = 2 ✓（root 已覆盖，无需补）</text>
  <text x="320" y="352" text-anchor="middle" font-size="10" fill="#555">摄像头位于 ④（右内）与 ⑤（左内），两颗覆盖全树</text>

  <!-- 关键观察 -->
  <rect x="50" y="376" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="398" text-anchor="middle" font-size="10" fill="#555">④ 因两子皆未覆盖被迫设摄像头；⑤ 因左子未覆盖再设一颗</text>
</svg>
