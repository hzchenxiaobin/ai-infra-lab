<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：charge=[3,6,1,3,4] run=[2,1,3,4,5] budget=25</text>

  <!-- table header -->
  <g font-size="11" fill="#444" text-anchor="middle" font-weight="bold">
    <rect x="20" y="40" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="55" filter="url(#rough2)">步</text>
    <rect x="60" y="40" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="55" filter="url(#rough2)">r</text>
    <rect x="100" y="40" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="135" y="55" filter="url(#rough2)">dq(下标)</text>
    <rect x="170" y="40" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="200" y="55" filter="url(#rough2)">max</text>
    <rect x="230" y="40" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="265" y="55" filter="url(#rough2)">sum</text>
    <rect x="300" y="40" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="345" y="55" filter="url(#rough2)">成本</text>
    <rect x="390" y="40" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="410" y="55" filter="url(#rough2)">l</text>
    <rect x="430" y="40" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="460" y="55" filter="url(#rough2)">长度</text>
    <rect x="490" y="40" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="535" y="55" filter="url(#rough2)">动作</text>
  </g>

  <!-- rows -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- row1 -->
    <rect x="20" y="62" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="40" y="77" filter="url(#rough2)">1</text>
    <rect x="60" y="62" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="80" y="77" filter="url(#rough2)">0</text>
    <rect x="100" y="62" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="135" y="77" filter="url(#rough2)">[0]</text>
    <rect x="170" y="62" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="200" y="77" filter="url(#rough2)">3</text>
    <rect x="230" y="62" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="265" y="77" filter="url(#rough2)">2</text>
    <rect x="300" y="62" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/><text x="345" y="77" fill="#2a4a1a" filter="url(#rough2)">5</text>
    <rect x="390" y="62" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="410" y="77" filter="url(#rough2)">0</text>
    <rect x="430" y="62" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="460" y="77" filter="url(#rough2)">1</text>
    <rect x="490" y="62" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="535" y="77" filter="url(#rough2)">入队0</text>

    <!-- row2 -->
    <rect x="20" y="84" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="40" y="99" filter="url(#rough2)">2</text>
    <rect x="60" y="84" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="80" y="99" filter="url(#rough2)">1</text>
    <rect x="100" y="84" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="135" y="99" filter="url(#rough2)">[1]</text>
    <rect x="170" y="84" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="200" y="99" filter="url(#rough2)">6</text>
    <rect x="230" y="84" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="265" y="99" filter="url(#rough2)">3</text>
    <rect x="300" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/><text x="345" y="99" fill="#2a4a1a" filter="url(#rough2)">12</text>
    <rect x="390" y="84" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="410" y="99" filter="url(#rough2)">0</text>
    <rect x="430" y="84" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="460" y="99" filter="url(#rough2)">2</text>
    <rect x="490" y="84" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="535" y="99" filter="url(#rough2)">6&gt;3 弹尾</text>

    <!-- row3 -->
    <rect x="20" y="106" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="40" y="121" filter="url(#rough2)">3</text>
    <rect x="60" y="106" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="80" y="121" filter="url(#rough2)">2</text>
    <rect x="100" y="106" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="135" y="121" filter="url(#rough2)">[1,2]</text>
    <rect x="170" y="106" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="200" y="121" filter="url(#rough2)">6</text>
    <rect x="230" y="106" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="265" y="121" filter="url(#rough2)">6</text>
    <rect x="300" y="106" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/><text x="345" y="121" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">24 ✓</text>
    <rect x="390" y="106" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="410" y="121" filter="url(#rough2)">0</text>
    <rect x="430" y="106" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/><text x="460" y="121" fill="#5a4010" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="490" y="106" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="535" y="121" filter="url(#rough2)">ans=3</text>

    <!-- row4 (r=3, shrink) -->
    <rect x="20" y="128" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="40" y="143" filter="url(#rough2)">4</text>
    <rect x="60" y="128" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="80" y="143" filter="url(#rough2)">3</text>
    <rect x="100" y="128" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="135" y="143" filter="url(#rough2)">[1,3]</text>
    <rect x="170" y="128" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="200" y="143" filter="url(#rough2)">6</text>
    <rect x="230" y="128" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="265" y="143" filter="url(#rough2)">10</text>
    <rect x="300" y="128" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/><text x="345" y="143" fill="#7a2a26" font-weight="bold" filter="url(#rough2)">46 ✗</text>
    <rect x="390" y="128" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="410" y="143" filter="url(#rough2)">0→2</text>
    <rect x="430" y="128" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="460" y="143" filter="url(#rough2)">4→3</text>
    <rect x="490" y="128" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="535" y="143" filter="url(#rough2)">超预算左缩</text>

    <!-- row5 (r=4, shrink) -->
    <rect x="20" y="150" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="40" y="165" filter="url(#rough2)">5</text>
    <rect x="60" y="150" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="80" y="165" filter="url(#rough2)">4</text>
    <rect x="100" y="150" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="135" y="165" filter="url(#rough2)">[4]</text>
    <rect x="170" y="150" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="200" y="165" filter="url(#rough2)">4</text>
    <rect x="230" y="150" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/><text x="265" y="165" filter="url(#rough2)">5</text>
    <rect x="300" y="150" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/><text x="345" y="165" fill="#2a4a1a" filter="url(#rough2)">9 ✓</text>
    <rect x="390" y="150" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="410" y="165" filter="url(#rough2)">4</text>
    <rect x="430" y="150" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="460" y="165" filter="url(#rough2)">1</text>
    <rect x="490" y="150" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/><text x="535" y="165" filter="url(#rough2)">ans 仍 3</text>
  </g>

  <!-- notes -->
  <rect x="20" y="200" width="560" height="250" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="224" font-size="13" font-weight="bold" fill="#224" filter="url(#rough2)">关键观察</text>
  <text x="36" y="250" font-size="12" fill="#333" filter="url(#rough2)">▸ 成本随窗口变长单调不降：max↑、sum↑、k↑ 三者都不降。</text>
  <text x="36" y="274" font-size="12" fill="#333" filter="url(#rough2)">▸ 故「成本 ≤ budget」是可遗传条件：合法窗口的子窗口必合法。</text>
  <text x="36" y="298" font-size="12" fill="#333" filter="url(#rough2)">▸ 因此可直接滑窗：右端 r 扩展，一旦超预算就把 l 右移收缩。</text>
  <text x="36" y="322" font-size="12" fill="#333" filter="url(#rough2)">▸ max 用单调递减队列维护，删 l 时「若 l 在队头才出队」(懒惰删除)。</text>
  <text x="36" y="346" font-size="12" fill="#b85450" filter="url(#rough2)">▸ 步骤4：r=3 时成本 46&gt;25，l 从 0 缩到 2，队头从下标1(值6)弹出 → max 变 3。</text>
  <text x="36" y="370" font-size="12" fill="#4a7a3a" filter="url(#rough2)">▸ 步骤3 是峰值：窗口 [0,2] 成本 24，最长合法长度 3。</text>
  <text x="36" y="394" font-size="12" fill="#4a7a3a" filter="url(#rough2)">▸ 步骤5：r=4 后收缩到 [4,4]，成本 9，但长度仅 1，不刷新 ans。</text>
  <text x="36" y="424" font-size="13" font-weight="bold" fill="#224" filter="url(#rough2)">最终答案：ans = 3</text>
</svg>
