<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：按时间分组 + 并查集 + 组后重置</text>

  <rect x="70" y="48" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 按 time 排序会议，初始化 knows[0]=knows[firstPerson]=true</text>

  <line x1="280" y1="86" x2="280" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="110" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 按相同 time 划分一组 meetings[i..j)</text>

  <line x1="280" y1="148" x2="280" y2="168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="172" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 组内所有 (xi, yi) 执行 union，形成连通分量</text>

  <line x1="280" y1="210" x2="280" y2="230" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="234" width="420" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 收集含知晓者的根 → 标记该分量内所有人 knows=true</text>

  <line x1="280" y1="272" x2="280" y2="292" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="296" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 重置本组涉及人的 parent[x]=x（knows 标记保留）</text>

  <path d="M 492 314 Q 540 314 540 200 Q 540 128 492 128" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="218" font-size="10" fill="#999" filter="url(#rough2)">下</text>
  <text x="548" y="232" font-size="10" fill="#999" filter="url(#rough2)">组</text>

  <line x1="280" y1="334" x2="280" y2="356" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="360" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ 所有组处理完，返回 knows=true 的人列表</text>

  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关键：union 只在本时间组内有效，组后必须重置，避免跨时间误连通</text>
</svg>
