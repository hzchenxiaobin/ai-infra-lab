<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：100 → "202"，-7 → "-10"</text>

  <!-- ===== Example 1: num = 100 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">用例一：num = 100（正数）</text>

  <!-- table header -->
  <rect x="40" y="70" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="70" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n（进入时）</text>
  <rect x="230" y="70" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n % 7</text>
  <rect x="320" y="70" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">字符</text>
  <rect x="400" y="70" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n /= 7 后</text>

  <!-- row 1: 100 -> %7=2, /7=14 -->
  <rect x="40" y="94" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="94" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="11" fill="#333">100</text>
  <rect x="230" y="94" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="110" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="320" y="94" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="400" y="94" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="110" text-anchor="middle" font-size="11" fill="#333">14</text>

  <!-- row 2: 14 -> %7=0, /7=2 -->
  <rect x="40" y="118" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="118" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="134" text-anchor="middle" font-size="11" fill="#333">14</text>
  <rect x="230" y="118" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="118" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="400" y="118" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row 3: 2 -> %7=2, /7=0 -->
  <rect x="40" y="142" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="100" y="142" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="230" y="142" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="320" y="142" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="158" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="400" y="142" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="158" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 4 stop -->
  <rect x="40" y="166" width="490" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="285" y="180" text-anchor="middle" font-size="10.5" fill="#888">轮次 4: n=0 → 停止</text>

  <!-- result 1 -->
  <path d="M 360 190 L 360 202" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="204" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans=[2,0,2] → "202" ✓</text>

  <!-- ===== Example 2: num = -7 ===== -->
  <text x="40" y="262" font-size="12" fill="#b85450" font-weight="bold">用例二：num = -7（负数）</text>

  <!-- sign note -->
  <rect x="40" y="270" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">negative = true  ;  n = abs(-7) = 7  （符号单独记录，对绝对值取余）</text>

  <!-- table header for ex2 -->
  <rect x="40" y="304" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="304" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n（进入时）</text>
  <rect x="230" y="304" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n % 7</text>
  <rect x="320" y="304" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">字符</text>
  <rect x="400" y="304" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n /= 7 后</text>

  <!-- row 1: 7 -> %7=0, /7=1 -->
  <rect x="40" y="328" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="344" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="328" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="344" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="230" y="328" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="344" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="328" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="400" y="328" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="344" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2: 1 -> %7=1, /7=0 -->
  <rect x="40" y="352" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="368" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="352" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="368" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="352" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="368" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="320" y="352" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="400" y="352" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="368" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 3 stop -->
  <rect x="40" y="376" width="490" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="285" y="390" text-anchor="middle" font-size="10.5" fill="#888">轮次 3: n=0 → 停止 → 追加 '-' → 反转</text>

  <!-- result 2 -->
  <path d="M 290 400 L 290 414" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="416" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="434" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans=[0,1,'-'] → "-10" ✓</text>

  <!-- summary note -->
  <rect x="40" y="452" width="500" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="464" text-anchor="middle" font-size="10.5" fill="#888">中间位 0 必须保留；负号最后追加再随字符串一起反转，自然落到最左</text>
</svg>
