<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">砖墙缝隙 = 行内砖宽前缀和（不含末尾墙宽）</text>

  <!-- Wall: 3 rows. Wall width = 6. Row bricks:
       row0: [1,2,1,2] -> gaps at 1, 3, 4
       row1: [3,1,2]   -> gaps at 3, 4
       row2: [2,2,2]   -> gaps at 2, 4
       brick pixel = 28 px wide, origin x=70, y=70 -->

  <!-- row 0: [1,2,1,2] -->
  <rect x="70" y="70" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="98" y="70" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="154" y="70" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="182" y="70" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="end" font-size="11" fill="#888">row 0</text>

  <!-- row 1: [3,1,2] -->
  <rect x="70" y="100" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="154" y="100" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="182" y="100" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="end" font-size="11" fill="#888">row 1</text>

  <!-- row 2: [2,2,2] -->
  <rect x="70" y="130" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="126" y="130" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="182" y="130" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="148" text-anchor="end" font-size="11" fill="#888">row 2</text>

  <!-- gap tick marks (positions: 1,2,3,4 in wall units -> x = 70 + p*28) -->
  <!-- gap at position 1 (x=98) -->
  <line x1="98" y1="64" x2="98" y2="166" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="98" cy="64" r="2.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="98" y="58" text-anchor="middle" font-size="9.5" fill="#b85450">1</text>

  <!-- gap at position 2 (x=126) -->
  <line x1="126" y1="64" x2="126" y2="166" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="126" cy="64" r="2.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="126" y="58" text-anchor="middle" font-size="9.5" fill="#b85450">2</text>

  <!-- gap at position 3 (x=154) -->
  <line x1="154" y1="64" x2="154" y2="166" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="154" cy="64" r="2.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="154" y="58" text-anchor="middle" font-size="9.5" fill="#b85450">3</text>

  <!-- gap at position 4 (x=182) -->
  <line x1="182" y1="64" x2="182" y2="166" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="182" cy="64" r="2.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="182" y="58" text-anchor="middle" font-size="9.5" fill="#b85450">4</text>

  <!-- wall boundary edges (not allowed to draw here) -->
  <line x1="70" y1="64" x2="70" y2="166" stroke="#aaa" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="238" y1="64" x2="238" y2="166" stroke="#aaa" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="70" y="178" text-anchor="middle" font-size="9" fill="#aaa">0（左边界）</text>
  <text x="238" y="178" text-anchor="middle" font-size="9" fill="#aaa">6（右边界）</text>

  <!-- prefix-sum annotation for row 0 -->
  <text x="290" y="88" font-size="11" fill="#446688">row 0: [1,2,1,2] → 缝隙 {1, 3, 4}</text>
  <text x="290" y="118" font-size="11" fill="#4a7a3a">row 1: [3,1,2]  → 缝隙 {3, 4}</text>
  <text x="290" y="148" font-size="11" fill="#d6a040">row 2: [2,2,2]  → 缝隙 {2, 4}</text>

  <!-- key insight box -->
  <rect x="60" y="196" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">关键观察：缝隙位置 = 砖宽前缀和（去掉最后一项）</text>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#555">row = [a₁, a₂, …, aₖ]，缝隙位置 = {a₁, a₁+a₂, …, a₁+…+aₖ₋₁}</text>

  <!-- count gaps -->
  <text x="40" y="294" font-size="12" fill="#333" font-weight="bold">统计每个缝隙位置出现行数：</text>

  <!-- bar chart: position -> count
       pos1: 1 row (row0)
       pos2: 1 row (row2)
       pos3: 2 rows (row0,row1)
       pos4: 3 rows (row0,row1,row2)  <- MAX
  -->
  <line x1="70" y1="320" x2="70" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="370" x2="270" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="92" y="358" width="24" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="104" y="320" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="104" y="386" text-anchor="middle" font-size="9.5" fill="#555">pos 1</text>
  <text x="130" y="370" text-anchor="middle" font-size="9" fill="#446688">1</text>

  <rect x="132" y="358" width="24" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="144" y="386" text-anchor="middle" font-size="9.5" fill="#555">pos 2</text>
  <text x="170" y="370" text-anchor="middle" font-size="9" fill="#446688">1</text>

  <rect x="172" y="346" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="184" y="386" text-anchor="middle" font-size="9.5" fill="#555">pos 3</text>
  <text x="210" y="370" text-anchor="middle" font-size="9" fill="#446688">2</text>

  <rect x="212" y="334" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="224" y="386" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">pos 4</text>
  <text x="250" y="370" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3 ← max</text>

  <!-- conclusion -->
  <path d="M 224 332 L 224 312 L 320 312" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="320" y="288" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="310" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">在 pos 4 处画线穿 0 砖</text>
  <text x="430" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = rows − max = 3 − 3 = 0</text>
</svg>
