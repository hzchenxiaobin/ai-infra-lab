<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ranks=[4,2,3,1], cars=10</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">g(t)=⌊√(t/1)⌋+⌊√(t/2)⌋+⌊√(t/3)⌋+⌊√(t/4)⌋，hi=r_min·cars²=100</text>

  <!-- ===== Table grid ===== -->
  <!-- outer frame -->
  <rect x="20" y="58" width="540" height="232" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- header fill -->
  <rect x="20" y="58" width="540" height="32" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- column dividers: x = 60,135,190,430,475,520 -->
  <line x1="60" y1="58" x2="60" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="135" y1="58" x2="135" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="58" x2="190" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="58" x2="430" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="475" y1="58" x2="475" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="520" y1="58" x2="520" y2="290" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- row dividers at y = 90,122,154,186,218,250,282 -->
  <line x1="20" y1="90" x2="560" y2="90" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="122" x2="560" y2="122" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="154" x2="560" y2="154" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="186" x2="560" y2="186" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="218" x2="560" y2="218" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="250" x2="560" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header text -->
  <text x="40" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>
  <text x="97" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[lo, hi]</text>
  <text x="162" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mid</text>
  <text x="310" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">g(mid)（r=1,2,3,4 求和）</text>
  <text x="452" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果</text>
  <text x="497" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>
  <text x="540" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">下一区间</text>

  <!-- Row 1: mid=50 -->
  <text x="40" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="97" y="111" text-anchor="middle" font-size="11" fill="#333">[1,100]</text>
  <text x="162" y="111" text-anchor="middle" font-size="11" fill="#333">50</text>
  <text x="310" y="111" text-anchor="middle" font-size="11" fill="#333">7+5+4+3 = 19</text>
  <text x="452" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="497" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="540" y="111" text-anchor="middle" font-size="10" fill="#666">[1,49]</text>

  <!-- Row 2: mid=25 -->
  <text x="40" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="97" y="143" text-anchor="middle" font-size="11" fill="#333">[1,49]</text>
  <text x="162" y="143" text-anchor="middle" font-size="11" fill="#333">25</text>
  <text x="310" y="143" text-anchor="middle" font-size="11" fill="#333">5+3+2+2 = 12</text>
  <text x="452" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="497" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">25</text>
  <text x="540" y="143" text-anchor="middle" font-size="10" fill="#666">[1,24]</text>

  <!-- Row 3: mid=12 -->
  <text x="40" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="97" y="175" text-anchor="middle" font-size="11" fill="#333">[1,24]</text>
  <text x="162" y="175" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="310" y="175" text-anchor="middle" font-size="11" fill="#b85450">3+2+2+1 = 8</text>
  <text x="452" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="497" y="175" text-anchor="middle" font-size="11" fill="#666">25</text>
  <text x="540" y="175" text-anchor="middle" font-size="10" fill="#666">[13,24]</text>

  <!-- Row 4: mid=18 -->
  <text x="40" y="207" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="97" y="207" text-anchor="middle" font-size="11" fill="#333">[13,24]</text>
  <text x="162" y="207" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="310" y="207" text-anchor="middle" font-size="11" fill="#333">4+3+2+2 = 11</text>
  <text x="452" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="497" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18</text>
  <text x="540" y="207" text-anchor="middle" font-size="10" fill="#666">[13,17]</text>

  <!-- Row 5: mid=15 -->
  <text x="40" y="239" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="97" y="239" text-anchor="middle" font-size="11" fill="#333">[13,17]</text>
  <text x="162" y="239" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="310" y="239" text-anchor="middle" font-size="11" fill="#b85450">3+2+2+1 = 8</text>
  <text x="452" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="497" y="239" text-anchor="middle" font-size="11" fill="#666">18</text>
  <text x="540" y="239" text-anchor="middle" font-size="10" fill="#666">[16,17]</text>

  <!-- Row 6: mid=16 (answer) -->
  <text x="40" y="271" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="97" y="271" text-anchor="middle" font-size="11" fill="#333">[16,17]</text>
  <text x="162" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="310" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4+2+2+2 = 10</text>
  <text x="452" y="271" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="497" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="540" y="271" text-anchor="middle" font-size="10" fill="#666">[16,15]</text>

  <!-- bottom note -->
  <rect x="100" y="304" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo=16 &gt; hi=15，循环结束 → 返回 ans = 16 ✓</text>
  <text x="290" y="342" text-anchor="middle" font-size="11" fill="#888">g(15)=8&lt;10 修不完，g(16)=10≥10 恰好修完</text>
</svg>
