<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat = [[1,2,3],[4,5,6],[7,8,9]]</text>

  <!-- ====== Left: 3x3 matrix with diagonals highlighted ====== -->
  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3×3 矩阵（n 为奇数）</text>

  <!-- Row 0 -->
  <rect x="44" y="62" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="66" y="90" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">1</text>
  <rect x="88" y="62" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="90" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">2</text>
  <rect x="132" y="62" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="90" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">3</text>
  <!-- Row 1 -->
  <rect x="44" y="106" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="66" y="134" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">4</text>
  <rect x="88" y="106" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="134" text-anchor="middle" font-size="15" fill="#b85450" font-family="monospace" font-weight="bold">5</text>
  <rect x="132" y="106" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="154" y="134" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">6</text>
  <!-- Row 2 -->
  <rect x="44" y="150" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="66" y="178" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">7</text>
  <rect x="88" y="150" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">8</text>
  <rect x="132" y="150" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="178" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">9</text>

  <!-- Labels -->
  <text x="66" y="212" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">主 1,5,9</text>
  <text x="110" y="212" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">中心 5</text>
  <text x="154" y="212" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">副 3,5,7</text>

  <!-- ====== Right: accumulation steps table ====== -->
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">逐行累加过程</text>

  <!-- Table header -->
  <rect x="240" y="62" width="300" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="80" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold">i</text>
  <text x="300" y="80" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold">主[i][i]</text>
  <text x="370" y="80" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold">副[i][n−1−i]</text>
  <text x="475" y="80" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold">sum</text>

  <line x1="288" y1="62" x2="288" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="62" x2="360" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="465" y1="62" x2="465" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=0 -->
  <rect x="240" y="88" width="300" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="106" text-anchor="start" font-size="11" fill="#333">0</text>
  <text x="300" y="106" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="370" y="106" text-anchor="start" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="475" y="106" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row i=1 -->
  <rect x="240" y="116" width="300" height="28" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="134" text-anchor="start" font-size="11" fill="#333">1</text>
  <text x="300" y="134" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="370" y="134" text-anchor="start" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="475" y="134" text-anchor="start" font-size="11" fill="#333" font-weight="bold">14</text>

  <!-- Row i=2 -->
  <rect x="240" y="144" width="300" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="258" y="162" text-anchor="start" font-size="11" fill="#333">2</text>
  <text x="300" y="162" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">9</text>
  <text x="370" y="162" text-anchor="start" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="475" y="162" text-anchor="start" font-size="11" fill="#333" font-weight="bold">30</text>

  <!-- Subtract center row -->
  <rect x="240" y="172" width="300" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="258" y="190" text-anchor="start" font-size="11" fill="#888">—</text>
  <text x="300" y="190" text-anchor="start" font-size="10.5" fill="#888">n 奇数</text>
  <text x="370" y="190" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">− mat[1][1] = −5</text>
  <text x="475" y="190" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">25</text>

  <!-- Final result highlight -->
  <rect x="240" y="200" width="300" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果 = 25 ⭐</text>

  <!-- ====== Bottom: equation line ====== -->
  <rect x="50" y="248" width="460" height="60" fill="#f0f7ff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">主对角线和：1 + 5 + 9 = 15</text>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">副对角线和：3 + 5 + 7 = 15</text>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">合计：15 + 15 − 5 = 25（中心 5 被减去一次）</text>

  <!-- ====== Even example callout ====== -->
  <rect x="50" y="328" width="460" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">对照：n = 4 偶数阶（示例 2）</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#666">主对角线和：1 + 1 + 1 + 1 = 4</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#666">副对角线和：1 + 1 + 1 + 1 = 4</text>
  <text x="280" y="404" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">合计：4 + 4 = 8（无重叠，无需减中心）</text>
</svg>
