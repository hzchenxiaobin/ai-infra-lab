<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：扩张 → 违规才收缩 → 记录最大窗口</text>

  <!-- start box -->
  <rect x="150" y="42" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化：freq[26]=0，left=0，maxLen=0</text>

  <path d="M 260 80 L 260 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- move right box -->
  <rect x="140" y="102" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">right 右移一格：c = s[right]，freq[c]++</text>

  <path d="M 260 144 L 260 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <path d="M 260 168 L 392 212 L 260 256 L 128 212 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">freq[c] &gt; 2 ?</text>

  <text x="402" y="204" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 396 212 L 402 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- shrink box -->
  <rect x="406" y="186" width="108" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">吐出 s[left]：</text>
  <text x="460" y="219" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">freq[s[left]]−−</text>
  <text x="460" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">left++</text>

  <!-- shrink loop back into diamond -->
  <path d="M 460 240 L 460 264 L 326 264 L 326 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">再检查</text>

  <!-- no branch -->
  <text x="270" y="272" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 256 L 260 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- update maxlen box -->
  <rect x="140" y="280" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">maxLen = max(maxLen, right − left + 1)</text>

  <!-- loop back to right-move box -->
  <path d="M 140 300 L 84 300 L 84 123 L 132 123" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="90" y="292" font-size="10.5" fill="#446688" filter="url(#rough2)">right 未到头，继续下一轮</text>

  <!-- end branch -->
  <path d="M 260 320 L 260 342" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="336" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">遍历结束</text>

  <!-- return box -->
  <rect x="170" y="346" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="371" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 maxLen</text>
</svg>
