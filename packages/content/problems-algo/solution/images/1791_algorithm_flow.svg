<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：只比前两条边，O(1) 定位中心</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">中心必同时在 edges[0] 与 edges[1] 中 → 取其公共端点</text>

  <!-- Step 1: take first two edges -->
  <rect x="60" y="58" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 1 步：取出前两条边</text>
  <text x="260" y="93" text-anchor="middle" font-size="10.5" fill="#555">e0 = edges[0] = [u0, v0]　　e1 = edges[1] = [u1, v1]</text>

  <!-- Arrow down -->
  <path d="M 260 104 L 260 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: is u0 in e1? -->
  <polygon points="260,122 360,168 260,214 160,168" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u0 == u1</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">或 u0 == v1 ?</text>
  <text x="260" y="194" text-anchor="middle" font-size="9.5" fill="#888">（u0 是否也在 e1 中）</text>

  <!-- Yes branch (left) -->
  <path d="M 160 168 L 110 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="40" y="150" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="74" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return u0</text>

  <!-- No branch (right) -->
  <path d="M 360 168 L 410 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <rect x="412" y="150" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="446" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return v0</text>

  <!-- Why box -->
  <rect x="60" y="232" width="400" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么这样一定对？</text>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#555">中心在每条边里 → 它必在 e0 与 e1 中 → 是两者的公共端点</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#555">e0 的两个端点 {u0, v0} 必有一个是中心；若 u0 不在 e1，则 u0 非中心</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#555">→ 中心只能是 v0</text>

  <!-- Footer -->
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#888">复杂度：时间 O(1) · 空间 O(1)——只读了 4 个整数，与 n 无关</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">对比暴力度数统计 O(n)/O(n)：结构保证让遍历退化为常数</text>
</svg>
