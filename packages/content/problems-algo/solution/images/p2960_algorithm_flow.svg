<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 计数器判定</text>

  <!-- start -->
  <ellipse cx="260" cy="58" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 75 L 260 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="185" y="90" width="150" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">tested = 0，i = 0</text>
  <path d="M 260 122 L 260 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: range check -->
  <polygon points="170,172 260,138 350,172 260,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no -> return -->
  <path d="M 350 172 L 400 172" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="404" y="154" width="102" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="176" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 tested</text>

  <!-- yes -> counter check -->
  <path d="M 260 206 L 260 220" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2: counter predicate -->
  <polygon points="130,266 260,222 390,266 260,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b[i] &gt; tested ?</text>

  <!-- yes -> tested++ -->
  <path d="M 260 310 L 260 324" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="205" y="326" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">tested + 1</text>

  <!-- no -> i++ directly -->
  <path d="M 390 266 C 418 266 415 296 415 324" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="406" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <rect x="370" y="326" width="90" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="346" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i ← i + 1</text>

  <!-- tested++ -> i++ -->
  <path d="M 315 342 L 368 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 415 358 L 415 382 L 84 382 L 84 172 L 164 172" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮判定</text>
</svg>
