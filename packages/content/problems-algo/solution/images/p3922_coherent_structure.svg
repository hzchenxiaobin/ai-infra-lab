<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">连贯字符串只有三族</text>

  <!-- ① 至多一个 1 -->
  <rect x="30" y="46" width="460" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="72" font-size="14" fill="#2f5d25" filter="url(#rough2)">① 1 的个数 ≤ 1</text>
  <text x="46" y="94" font-size="11" fill="#557" filter="url(#rough2)">0…0 1 0…0：唯一的 1 放哪都行</text>
  <rect x="306" y="62" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="82" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="342" y="62" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="82" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="378" y="62" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="82" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="414" y="62" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="450" y="62" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="82" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>

  <!-- ② 恰好两个 1 分居首尾 -->
  <rect x="30" y="122" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="148" font-size="14" fill="#33517a" filter="url(#rough2)">② 恰好 2 个 1：分居首尾</text>
  <text x="46" y="170" font-size="11" fill="#557" filter="url(#rough2)">所有 0 都必须夹在两个 1 中间</text>
  <rect x="306" y="138" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="158" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="342" y="138" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="158" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="378" y="138" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="158" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="414" y="138" width="32" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="158" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <rect x="450" y="138" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="158" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>

  <!-- ③ 全是 1 -->
  <rect x="30" y="198" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="224" font-size="14" fill="#33517a" filter="url(#rough2)">③ 全是 1</text>
  <text x="46" y="246" font-size="11" fill="#557" filter="url(#rough2)">1 的个数 ≥ 3 时，存在任何一个 0 都违规</text>
  <rect x="306" y="214" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="234" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="342" y="214" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="234" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="378" y="214" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="234" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="414" y="214" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="234" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>
  <rect x="450" y="214" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="234" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">1</text>

  <!-- 违规判定 -->
  <rect x="30" y="274" width="460" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 违规判定（以 0 为锚点）</text>
  <text x="46" y="318" font-size="11.5" fill="#7a3a37" filter="url(#rough2)">某个 0 的后面有两个 1 ⇒ 含子序列 011</text>
  <text x="46" y="338" font-size="11.5" fill="#7a3a37" filter="url(#rough2)">某个 0 的前面有两个 1 ⇒ 含子序列 110</text>
</svg>
