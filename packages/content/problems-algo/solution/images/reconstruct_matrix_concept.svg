<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三种列和的填充策略</text>

  <!-- ===== Case 0: colsum == 0 ===== -->
  <rect x="40" y="58" width="130" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">colsum = 0</text>
  <text x="105" y="98" text-anchor="middle" font-size="10.5" fill="#888">无自由度</text>

  <text x="62" y="120" font-size="10" fill="#888">上行</text>
  <rect x="95" y="108" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>

  <text x="62" y="152" font-size="10" fill="#888">下行</text>
  <rect x="95" y="140" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>

  <text x="105" y="178" text-anchor="middle" font-size="10" fill="#888">两行都填 0</text>

  <!-- ===== Case 2: colsum == 2 ===== -->
  <rect x="210" y="58" width="130" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">colsum = 2</text>
  <text x="275" y="98" text-anchor="middle" font-size="10.5" fill="#888">无自由度</text>

  <text x="232" y="120" font-size="10" fill="#888">上行</text>
  <rect x="265" y="108" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <text x="232" y="152" font-size="10" fill="#888">下行</text>
  <rect x="265" y="140" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <text x="275" y="178" text-anchor="middle" font-size="10" fill="#888">两行都填 1</text>

  <!-- ===== Case 1: colsum == 1 ===== -->
  <rect x="380" y="58" width="150" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">colsum = 1</text>
  <text x="455" y="98" text-anchor="middle" font-size="10.5" fill="#888">二选一</text>

  <text x="402" y="120" font-size="10" fill="#888">上行</text>
  <rect x="435" y="108" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">?</text>
  <text x="470" y="124" font-size="13" fill="#888">/</text>
  <rect x="485" y="108" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">?</text>

  <text x="402" y="152" font-size="10" fill="#888">下行</text>
  <rect x="435" y="140" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">?</text>
  <text x="470" y="156" font-size="13" fill="#888">/</text>
  <rect x="485" y="140" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">?</text>

  <text x="455" y="178" text-anchor="middle" font-size="10" fill="#888">[1,0] 或 [0,1]</text>

  <!-- Divider -->
  <path d="M 40 210 L 520 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bottom: Greedy strategy ===== -->
  <text x="280" y="236" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：两遍扫描</text>

  <!-- Step 1 -->
  <rect x="60" y="256" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第 1 遍：处理 colsum=2</text>
  <text x="160" y="296" text-anchor="middle" font-size="10.5" fill="#888">两行填 1，upper-- &amp; lower--</text>

  <!-- Step 2 -->
  <rect x="300" y="256" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 2 遍：处理 colsum=1</text>
  <text x="400" y="296" text-anchor="middle" font-size="10.5" fill="#888">upper&gt;0 给上行，否则给下行</text>

  <!-- Arrow between steps -->
  <path d="M 262 284 L 298 284" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Final check -->
  <rect x="130" y="332" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">检查 upper==0 &amp;&amp; lower==0，否则返回 []</text>

  <!-- Necessary condition -->
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#888">必要条件：sum(colsum) == upper + lower</text>
</svg>
