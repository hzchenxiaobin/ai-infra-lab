<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：digits="23" 回溯树</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">绿边=选 a/b/c，橙边=选 d/e/f；9 条根到叶路径 = 9 个组合</text>

  <g font-size="10" fill="#333">
    <!-- root: dfs(0, "") -->
    <ellipse cx="310" cy="78" rx="34" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="310" y="82" text-anchor="middle" font-size="11" font-weight="bold">i=0 ""</text>
    <text x="310" y="62" text-anchor="middle" font-size="9" fill="#888">root</text>

    <!-- root → a → (i=1, "a") -->
    <path d="M 296 90 Q 220 112 150 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <text x="208" y="112" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
    <!-- root → b -->
    <path d="M 310 94 L 310 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <text x="322" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
    <!-- root → c -->
    <path d="M 324 90 Q 400 112 470 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <text x="408" y="112" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>

    <ellipse cx="138" cy="144" rx="34" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="138" y="148" text-anchor="middle" font-size="10" font-weight="bold">i=1 "a"</text>
    <ellipse cx="310" cy="144" rx="34" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="310" y="148" text-anchor="middle" font-size="10" font-weight="bold">i=1 "b"</text>
    <ellipse cx="482" cy="144" rx="34" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="482" y="148" text-anchor="middle" font-size="10" font-weight="bold">i=1 "c"</text>

    <!-- ===== from "a" → d,e,f (leaves) ===== -->
    <path d="M 126 158 Q 80 184 54 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="78" y="184" font-size="10" fill="#d6a040" font-weight="bold">d</text>
    <path d="M 138 160 L 138 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="148" y="186" font-size="10" fill="#d6a040" font-weight="bold">e</text>
    <path d="M 150 158 Q 196 184 222 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="200" y="184" font-size="10" fill="#d6a040" font-weight="bold">f</text>

    <rect x="22" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="44" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ad ✓</text>
    <rect x="116" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="138" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ae ✓</text>
    <rect x="210" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="232" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">af ✓</text>

    <!-- ===== from "b" → d,e,f ===== -->
    <path d="M 298 158 Q 252 184 226 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="250" y="184" font-size="10" fill="#d6a040" font-weight="bold">d</text>
    <path d="M 310 160 L 310 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="320" y="186" font-size="10" fill="#d6a040" font-weight="bold">e</text>
    <path d="M 322 158 Q 368 184 394 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="372" y="184" font-size="10" fill="#d6a040" font-weight="bold">f</text>

    <rect x="194" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="216" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bd ✓</text>
    <rect x="288" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="310" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">be ✓</text>
    <rect x="382" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="404" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bf ✓</text>

    <!-- ===== from "c" → d,e,f ===== -->
    <path d="M 470 158 Q 424 184 398 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="422" y="184" font-size="10" fill="#d6a040" font-weight="bold">d</text>
    <path d="M 482 160 L 482 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="492" y="186" font-size="10" fill="#d6a040" font-weight="bold">e</text>
    <path d="M 494 158 Q 540 184 566 206" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="544" y="184" font-size="10" fill="#d6a040" font-weight="bold">f</text>

    <rect x="366" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="388" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cd ✓</text>
    <rect x="460" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="482" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ce ✓</text>
    <rect x="554" y="210" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="576" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cf ✓</text>

    <text x="310" y="200" text-anchor="middle" font-size="8" fill="#888">第 1 位 i=2==n → 收集</text>
  </g>

  <!-- ===== summary ===== -->
  <rect x="40" y="262" width="540" height="190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9 个组合 = 3 × 3（第 0 位 3 叉 × 第 1 位 3 叉）</text>
  <text x="60" y="306" font-size="11" fill="#555">• 执行顺序（DFS 先序）：ad → ae → af → bd → be → bf → cd → ce → cf</text>
  <text x="60" y="326" font-size="11" fill="#555">• 回溯点：选完 d 收集 "ad" 后 pop d，再选 e 得 "ae"；选完 a 的三个分支后 pop a，再选 b</text>
  <text x="60" y="346" font-size="11" fill="#555">• 路径长度 = 位数 n = 2；叶节点数 = 各位字母数之积 = 3·3 = 9</text>
  <text x="60" y="366" font-size="11" fill="#555">• 无剪枝：每位都全选，每个叶节点都是答案</text>
  <text x="60" y="392" font-size="10" fill="#888">推广：n 位、每位平均 k 个字母 → 叶节点数 kⁿ；全为 7/9 时每位 4 个 → 最多 4⁴=256</text>
  <text x="60" y="408" font-size="10" fill="#888">复杂度：时间 O(4ⁿ·n)（每个叶 join 拼接 O(n)），空间 O(n)（递归栈+path，不计答案）</text>
  <text x="60" y="432" font-size="10" fill="#b85450" font-weight="bold">要点：append/dfs(i+1)/pop 三步成对，是所有回溯题的通用骨架</text>
</svg>
