<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：计数 → 三重枚举 → 整除判定 → 累加排列数</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">外层 O(n) 建桶，内层 O(100³) 枚举值三元组，整体 O(n + 10⁶)</text>

  <!-- ===== Start ===== -->
  <ellipse cx="110" cy="74" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>
  <path d="M 110 94 L 110 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Count freq ===== -->
  <rect x="48" y="114" width="124" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="132" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">统计频率</text>
  <text x="110" y="148" text-anchor="middle" font-size="10" fill="#555">cnt[v]++，v ∈ [1,100]</text>
  <path d="M 110 158 L 110 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Triple loop diamond ===== -->
  <polygon points="110,180 210,218 110,256 10,218" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">枚举完所有</text>
  <text x="110" y="230" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(a,b,c) ?</text>

  <!-- NO -> return -->
  <path d="M 10 218 L -8 218" stroke="none"/>
  <path d="M 10 218 L 28 218 L 28 360" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="212" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="48" y="356" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <path d="M 28 372 L 46 372" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- YES -> right -->
  <path d="M 210 218 L 240 218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Compute s & t ===== -->
  <rect x="248" y="178" width="172" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="334" y="198" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">取下一组 (a,b,c)</text>
  <text x="334" y="216" text-anchor="middle" font-size="10" fill="#555">s = a + b + c</text>
  <text x="334" y="232" text-anchor="middle" font-size="10" fill="#555">t = (s%a==0)</text>
  <text x="334" y="246" text-anchor="middle" font-size="10" fill="#555">  + (s%b==0) + (s%c==0)</text>

  <!-- ===== Check t==1 ===== -->
  <path d="M 420 218 L 446 218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="470,182 524,218 470,254 416,218" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="214" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">t == 1 ?</text>

  <!-- NO: skip -->
  <path d="M 524 218 L 524 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="532" y="240" font-size="10" fill="#888">否</text>
  <rect x="468" y="304" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="321" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <!-- YES: down to add -->
  <path d="M 470 254 L 470 280" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="486" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Add arrangement count ===== -->
  <rect x="300" y="282" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">按相等情形算排列数</text>
  <text x="410" y="316" text-anchor="middle" font-size="9.5" fill="#333">互异：cnt[a]cnt[b]cnt[c]</text>
  <text x="410" y="330" text-anchor="middle" font-size="9.5" fill="#333">a==b：cnt[a](cnt[a]-1)cnt[c]</text>
  <text x="410" y="344" text-anchor="middle" font-size="9.5" fill="#333">余类推 → ans += 排列数</text>

  <!-- loop back to diamond -->
  <path d="M 500 330 L 500 360 L 410 360" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 410 360 L 110 360 L 110 256" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 317 L 410 317 L 410 360" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="9.5" fill="#888">回到枚举判定，取下一组 (a,b,c)</text>
</svg>
