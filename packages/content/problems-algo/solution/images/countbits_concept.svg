<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：popcount(i) = popcount(i&gt;&gt;1) + 最低位</text>

  <!-- ===== Example 1: i = 5 (101) ===== -->
  <text x="40" y="62" font-size="12.5" fill="#446688" font-weight="bold">例 1：i = 5，二进制 101（末位是 1）</text>

  <!-- i=5 bits -->
  <text x="44" y="92" font-size="11" fill="#888">i =</text>
  <rect x="74" y="76" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="94" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="76" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="158" y="76" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="98" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="208" y="98" font-size="10.5" fill="#b85450" font-weight="bold">← 最低位 (i&amp;1)</text>

  <!-- shift arrow -->
  <path d="M 178 120 Q 178 140 178 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="140" font-size="11" fill="#888">&gt;&gt; 1（右移一位）</text>

  <!-- i>>1 = 2 (10) -->
  <text x="44" y="172" font-size="11" fill="#888">i&gt;&gt;1 =</text>
  <rect x="96" y="156" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="156" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="188" y="178" font-size="11" fill="#446688">= 2，ans[2] 已算好</text>

  <!-- formula example 1 -->
  <rect x="74" y="202" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="234" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans[5] = ans[2] + 1 = 1 + 1 = 2</text>

  <!-- ===== Example 2: i = 6 (110) ===== -->
  <text x="40" y="262" font-size="12.5" fill="#d6a040" font-weight="bold">例 2：i = 6，二进制 110（末位是 0）</text>

  <text x="44" y="292" font-size="11" fill="#888">i =</text>
  <rect x="74" y="276" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="94" y="298" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="276" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="298" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="158" y="276" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="298" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <text x="208" y="298" font-size="10.5" fill="#b85450" font-weight="bold">← 最低位 (i&amp;1)</text>

  <path d="M 178 320 Q 178 332 178 340" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="334" font-size="11" fill="#888">&gt;&gt; 1（右移一位）</text>

  <text x="44" y="360" font-size="11" fill="#888">i&gt;&gt;1 =</text>
  <rect x="96" y="344" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="366" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="344" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="366" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="188" y="366" font-size="11" fill="#d6a040">= 3，ans[3] 已算好</text>

  <!-- bottom: general formula -->
  <rect x="290" y="256" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="275" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">通项（DP 状态转移）</text>
  <text x="405" y="291" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans[i] = ans[i&gt;&gt;1] + (i&amp;1)</text>

  <rect x="290" y="306" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="324" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">关键：i&gt;&gt;1 &lt; i</text>
  <text x="405" y="340" text-anchor="middle" font-size="11" fill="#b85450">故 ans[i&gt;&gt;1] 必已算出</text>

  <!-- result for example 2 -->
  <rect x="290" y="356" width="230" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="376" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans[6] = ans[3] + 0 = 2</text>
</svg>
