<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">首尾配对最小化最大数对和</text>

  <!-- ===== Top: 首尾配对 (最优) ===== -->
  <text x="200" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 首尾配对（最优）</text>

  <!-- sorted array: 2,3,4,4,5,6 -->
  <text x="78" y="78" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">升序</text>
  <rect x="90" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="163" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="215" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="267" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="319" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="371" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- pairing arcs (首尾): (2,6) (3,5) (4,4) -->
  <path d="M 111 88 Q 241 142 371 88" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 163 88 Q 241 122 319 88" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 215 88 Q 241 104 267 88" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- right summary -->
  <text x="430" y="68" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">数对和：</text>
  <text x="430" y="88" font-size="11" fill="#446688" filter="url(#rough2)">2 + 6 = 8</text>
  <text x="430" y="106" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 + 5 = 8</text>
  <text x="430" y="124" font-size="11" fill="#d6a040" filter="url(#rough2)">4 + 4 = 8</text>
  <rect x="420" y="134" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最大数对和 = 8 ✓</text>

  <!-- divider -->
  <path d="M 40 178 L 580 178" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bottom: 相邻配对 (次优) ===== -->
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 相邻配对（次优）</text>

  <!-- same sorted array -->
  <text x="78" y="228" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">升序</text>
  <rect x="90" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="208" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="163" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="215" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="267" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="319" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="371" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- pairing arcs (相邻): (2,3) (4,4) (5,6) -->
  <path d="M 111 238 Q 137 252 163 238" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 215 238 Q 241 252 267 238" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 319 238 Q 345 252 371 238" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- right summary -->
  <text x="430" y="218" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">数对和：</text>
  <text x="430" y="238" font-size="11" fill="#446688" filter="url(#rough2)">2 + 3 = 5</text>
  <text x="430" y="256" font-size="11" fill="#d6a040" filter="url(#rough2)">4 + 4 = 8</text>
  <text x="430" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">5 + 6 = 11</text>
  <rect x="420" y="284" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="303" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大数对和 = 11 ✗</text>

  <!-- insight box -->
  <rect x="60" y="330" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最大值注定参与某对 → 让它配最小值，压低该对和</text>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">首尾配对使各对和趋于均衡，最大值被最小化</text>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(首尾) = 8 &lt; max(相邻) = 11</text>
</svg>
