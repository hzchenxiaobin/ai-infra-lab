<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一行公式，两条上界取 min</text>

  <!-- ===== 主流程 ===== -->
  <rect x="50" y="38" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 读入 n、w、maxWeight</text>
  <path d="M 165 64 L 165 76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="80" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 空间上界 cells = n × n</text>
  <path d="M 165 106 L 165 118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="122" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 重量上界 quota = ⌊maxWeight / w⌋</text>
  <path d="M 165 148 L 165 160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="164" width="230" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="183" text-anchor="middle" font-size="12.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">④ ans = min(cells, quota)</text>
  <path d="M 165 194 L 165 206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="210" width="230" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="228" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- ===== 示例验证卡 ===== -->
  <rect x="50" y="258" width="230" height="38" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="165" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 1：n=2, w=3, mx=15</text>
  <text x="165" y="290" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">min(4, 5) = 4 → 空间卡住</text>

  <rect x="50" y="306" width="230" height="38" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="165" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 2：n=3, w=5, mx=20</text>
  <text x="165" y="338" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">min(9, 4) = 4 → 重量卡住</text>

  <!-- ===== 右侧要点 ===== -->
  <rect x="316" y="38" width="188" height="204" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="410" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三个要点</text>
  <text x="326" y="82" font-size="10.5" fill="#333" filter="url(#rough2)">· 装箱无位置差异</text>
  <text x="334" y="98" font-size="10" fill="#666" filter="url(#rough2)">k ≤ n² 任选 k 格摆下</text>
  <text x="326" y="120" font-size="10.5" fill="#333" filter="url(#rough2)">· 「恰好 w」⇒ 总重 = k·w</text>
  <text x="334" y="136" font-size="10" fill="#666" filter="url(#rough2)">只依赖个数，整除取整箱</text>
  <text x="326" y="158" font-size="10.5" fill="#333" filter="url(#rough2)">· int 安全：n² ≤ 10⁶</text>
  <text x="334" y="174" font-size="10" fill="#666" filter="url(#rough2)">maxWeight/w ≤ 10⁹</text>
  <text x="326" y="200" font-size="10" fill="#999" filter="url(#rough2)">（无循环无分支，纯 O(1)）</text>

  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对照模拟装箱：</text>
  <text x="410" y="294" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">逐格模拟至多 10⁶ 次循环</text>
  <text x="410" y="312" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">一行公式 0 次</text>
</svg>
