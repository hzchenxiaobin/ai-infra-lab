<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：LEFT JOIN 才能留住没打车的用户</text>

  <rect x="30" y="48" width="180" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Users 表（左表）</text>
  <text x="45" y="92" font-size="11" fill="#333" filter="url(#rough2)">17 Addison</text>
  <text x="45" y="110" font-size="11" fill="#333" filter="url(#rough2)">14 Ethan</text>
  <text x="45" y="128" font-size="11" fill="#333" filter="url(#rough2)">4 Michael</text>
  <text x="45" y="146" font-size="11" fill="#333" filter="url(#rough2)">2 Avery</text>
  <text x="45" y="164" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 Eleanor ← 没打车</text>
  <text x="45" y="186" font-size="10" fill="#999" filter="url(#rough2)">用户是「全集」</text>

  <rect x="330" y="48" width="180" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Rides 表（右表）</text>
  <text x="345" y="92" font-size="11" fill="#333" filter="url(#rough2)">72 u17 160</text>
  <text x="345" y="110" font-size="11" fill="#333" filter="url(#rough2)">42 u14 161</text>
  <text x="345" y="128" font-size="11" fill="#333" filter="url(#rough2)">45 u4  59</text>
  <text x="345" y="146" font-size="11" fill="#333" filter="url(#rough2)">32 u2  197</text>
  <text x="345" y="164" font-size="11" fill="#333" filter="url(#rough2)">15 u4  357 …</text>
  <text x="345" y="186" font-size="10" fill="#999" filter="url(#rough2)">只记录打过车的人</text>

  <path d="M 210 123 L 330 123" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">LEFT JOIN</text>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">ON user_id</text>

  <rect x="120" y="228" width="300" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Eleanor 匹配失败 → 补一行 NULL</text>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ride_id=NULL, distance=NULL（不丢行！）</text>

  <path d="M 270 280 L 270 298" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="300" width="300" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">SUM(空集) = NULL → IFNULL 兜底成 0</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">IFNULL(SUM(distance), 0)</text>

  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">若用 INNER JOIN：Eleanor 整行消失，直接漏答</text>
</svg>
