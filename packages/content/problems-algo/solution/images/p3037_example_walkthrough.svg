<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：stream = [1,0,1,1,0,1,…]，pattern = [1,1,0,1] → 输出 2</text>

  <!-- stream strip -->
  <text x="60" y="62" font-size="11" fill="#888" filter="url(#rough2)">stream =</text>
  <rect x="196" y="32" width="176" height="50" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="284" y="26" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中窗口（下标 2..5）</text>
  <rect x="110" y="36" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="59" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="154" y="36" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="59" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="200" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="288" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="332" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="386" y="60" font-size="15" fill="#555" filter="url(#rough2)">…</text>
  <text x="130" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="174" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="220" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="264" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=3</text>
  <text x="308" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=4</text>
  <text x="352" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=5</text>

  <!-- fail row -->
  <text x="150" y="120" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fail =</text>
  <rect x="200" y="102" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="119" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="244" y="102" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="119" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="288" y="102" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="119" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="332" y="102" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="119" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="392" y="114" font-size="9" fill="#888" filter="url(#rough2)">fail[i] = pattern[0..i]</text>
  <text x="392" y="126" font-size="9" fill="#888" filter="url(#rough2)">的最长相等真前后缀</text>

  <!-- table header -->
  <rect x="44" y="142" width="432" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="63" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="100" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="181" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">失配回退动作</text>
  <text x="273" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j（末）</text>
  <text x="334" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">next()累计</text>
  <text x="421" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- table body -->
  <rect x="44" y="164" width="432" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="45" y="189" width="430" height="25" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="45" y="289" width="430" height="25" fill="#e6f4ea" filter="url(#rough2)"/>
  <path d="M 44 189 L 476 189 M 44 214 L 476 214 M 44 239 L 476 239 M 44 264 L 476 264 M 44 289 L 476 289" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <path d="M 82 142 L 82 314 M 118 142 L 118 314 M 244 142 L 244 314 M 302 142 L 302 314 M 366 142 L 366 314" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>

  <text x="63" y="181" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="100" y="181" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="181" y="181" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="273" y="181" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="334" y="181" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="421" y="181" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">接上 pattern[0]</text>

  <text x="63" y="206" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="100" y="206" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="181" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j: 1→0（fail[0]=0）</text>
  <text x="273" y="206" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="334" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="421" y="206" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">回退后仍失配，停 0</text>

  <text x="63" y="231" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="100" y="231" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="181" y="231" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="273" y="231" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="334" y="231" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="421" y="231" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">重新接上 pattern[0]</text>

  <text x="63" y="256" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="100" y="256" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="181" y="256" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="273" y="256" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="334" y="256" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="421" y="256" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">续接 pattern[1]</text>

  <text x="63" y="281" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="100" y="281" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="181" y="281" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="273" y="281" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="334" y="281" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="421" y="281" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">续接 pattern[2]</text>

  <text x="63" y="306" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="100" y="306" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="181" y="306" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="273" y="306" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">4 = m</text>
  <text x="334" y="306" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="421" y="306" text-anchor="middle" font-size="9.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">命中！返回 5−4+1=2</text>

  <!-- bottom notes -->
  <rect x="44" y="328" width="432" height="108" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① next() 调用数 = 已读位数：全程 6 次，零重读，交互预算内收官</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② 摊还计价：j 总增量 6、总回退 1——回退总量 ≤ 增量 ≤ n，匹配阶段 O(n)</text>
  <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">③ i=5 命中：j = 4 = m → 起点下标 = 5 − 4 + 1 = 2 ✓</text>
  <text x="260" y="422" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">II 版 m = 10⁴ 时同理：j 的总回退仍被总增量钳住，逐比特摊还 O(1)</text>
</svg>
