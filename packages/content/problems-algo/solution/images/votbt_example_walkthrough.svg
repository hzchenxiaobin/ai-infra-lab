<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2,3,4,5,6,7] 的三元组收集与排序</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">DFS 收集 (col, row, val) → sort() → 按 col 分组</text>

  <!-- ===== Section 1: DFS triples ===== -->
  <text x="20" y="68" font-size="11" fill="#446688" font-weight="bold">① DFS 收集的三元组（按访问顺序）</text>
  <g font-size="9">
    <!-- 7 boxes: (0,0,1) (-1,1,2) (-2,2,4) (0,2,5) (1,1,3) (0,2,6) (2,2,7) -->
    <rect x="20" y="78" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="54" y="92" text-anchor="middle" fill="#333" font-weight="bold">val=1</text>
    <text x="54" y="106" text-anchor="middle" font-size="8" fill="#888">(0,0,1)</text>

    <rect x="96" y="78" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="92" text-anchor="middle" fill="#333" font-weight="bold">val=2</text>
    <text x="130" y="106" text-anchor="middle" font-size="8" fill="#888">(−1,1,2)</text>

    <rect x="172" y="78" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="206" y="92" text-anchor="middle" fill="#333" font-weight="bold">val=4</text>
    <text x="206" y="106" text-anchor="middle" font-size="8" fill="#888">(−2,2,4)</text>

    <rect x="248" y="78" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="282" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">val=5</text>
    <text x="282" y="106" text-anchor="middle" font-size="8" fill="#b85450">(0,2,5)</text>

    <rect x="324" y="78" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="358" y="92" text-anchor="middle" fill="#333" font-weight="bold">val=3</text>
    <text x="358" y="106" text-anchor="middle" font-size="8" fill="#888">(1,1,3)</text>

    <rect x="400" y="78" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="434" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">val=6</text>
    <text x="434" y="106" text-anchor="middle" font-size="8" fill="#b85450">(0,2,6)</text>

    <rect x="476" y="78" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="510" y="92" text-anchor="middle" fill="#333" font-weight="bold">val=7</text>
    <text x="510" y="106" text-anchor="middle" font-size="8" fill="#888">(2,2,7)</text>
  </g>

  <path d="M 280 120 L 280 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">sort()</text>

  <!-- ===== Section 2: sorted triples ===== -->
  <text x="20" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">② sort() 后（按 col, row, val 字典序）</text>
  <g font-size="9">
    <!-- sorted: (-2,2,4) (-1,1,2) (0,0,1) (0,2,5) (0,2,6) (1,1,3) (2,2,7) -->
    <rect x="20" y="160" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="54" y="174" text-anchor="middle" fill="#333" font-weight="bold">val=4</text>
    <text x="54" y="188" text-anchor="middle" font-size="8" fill="#888">(−2,2,4)</text>

    <rect x="96" y="160" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="174" text-anchor="middle" fill="#333" font-weight="bold">val=2</text>
    <text x="130" y="188" text-anchor="middle" font-size="8" fill="#888">(−1,1,2)</text>

    <rect x="172" y="160" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="206" y="174" text-anchor="middle" fill="#333" font-weight="bold">val=1</text>
    <text x="206" y="188" text-anchor="middle" font-size="8" fill="#888">(0,0,1)</text>

    <rect x="248" y="160" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="282" y="174" text-anchor="middle" fill="#b85450" font-weight="bold">val=5</text>
    <text x="282" y="188" text-anchor="middle" font-size="8" fill="#b85450">(0,2,5)</text>

    <rect x="324" y="160" width="68" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="358" y="174" text-anchor="middle" fill="#b85450" font-weight="bold">val=6</text>
    <text x="358" y="188" text-anchor="middle" font-size="8" fill="#b85450">(0,2,6)</text>

    <rect x="400" y="160" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="434" y="174" text-anchor="middle" fill="#333" font-weight="bold">val=3</text>
    <text x="434" y="188" text-anchor="middle" font-size="8" fill="#888">(1,1,3)</text>

    <rect x="476" y="160" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="510" y="174" text-anchor="middle" fill="#333" font-weight="bold">val=7</text>
    <text x="510" y="188" text-anchor="middle" font-size="8" fill="#888">(2,2,7)</text>
  </g>

  <!-- highlight bracket for 5,6 pair -->
  <path d="M 248 200 L 248 204 L 392 204 L 392 200" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="320" y="216" text-anchor="middle" font-size="9" fill="#b85450">↑ 同 (col=0, row=2)，按 val 升序：5 &lt; 6</text>

  <path d="M 280 224 L 280 238" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="236" font-size="10" fill="#d6a040" font-weight="bold">按 col 分组</text>

  <!-- ===== Section 3: grouped output ===== -->
  <text x="20" y="254" font-size="11" fill="#d6a040" font-weight="bold">③ 按 col 分组 → 输出</text>
  <g font-size="11">
    <rect x="40" y="264" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="68" y="283" text-anchor="middle" fill="#333">[4]</text>

    <rect x="116" y="264" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="144" y="283" text-anchor="middle" fill="#333">[2]</text>

    <rect x="192" y="264" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="242" y="283" text-anchor="middle" fill="#d6a040" font-weight="bold">[1,5,6]</text>

    <rect x="308" y="264" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="336" y="283" text-anchor="middle" fill="#333">[3]</text>

    <rect x="384" y="264" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="412" y="283" text-anchor="middle" fill="#333">[7]</text>
  </g>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#888">col −2    col −1    col 0    col 1    col 2</text>

  <!-- ===== Section 4: example 3 comparison ===== -->
  <line x1="20" y1="322" x2="540" y2="322" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 3 验证：交换 5/6 在树中的位置 → 三元组不变 → 输出不变</text>

  <!-- mini tree: example 2 -->
  <text x="100" y="362" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">示例 2：5 是 2 的右孩子</text>
  <g font-size="10">
    <circle cx="100" cy="380" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="384" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <circle cx="72" cy="410" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="72" y="414" text-anchor="middle" font-size="9" fill="#333">2</text>
    <circle cx="128" cy="410" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="128" y="414" text-anchor="middle" font-size="9" fill="#333">3</text>

    <circle cx="50" cy="440" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="50" y="443" text-anchor="middle" font-size="8" fill="#333">4</text>
    <circle cx="88" cy="440" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="88" y="443" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">5</text>
    <circle cx="112" cy="440" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="112" y="443" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">6</text>
    <circle cx="150" cy="440" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="150" y="443" text-anchor="middle" font-size="8" fill="#333">7</text>

    <line x1="100" y1="380" x2="72" y2="410" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="100" y1="380" x2="128" y2="410" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="72" y1="410" x2="50" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="72" y1="410" x2="88" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="128" y1="410" x2="112" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="128" y1="410" x2="150" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <text x="100" y="468" text-anchor="middle" font-size="9" fill="#888">BFS col=0: [1,5,6] ✓（巧合：5&lt;6 且 5 先访问）</text>

  <!-- equals sign -->
  <text x="200" y="418" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">=</text>

  <!-- mini tree: example 3 -->
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">示例 3：6 是 2 的右孩子（交换 5/6）</text>
  <g font-size="10">
    <circle cx="300" cy="380" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="384" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <circle cx="272" cy="410" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="272" y="414" text-anchor="middle" font-size="9" fill="#333">2</text>
    <circle cx="328" cy="410" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="328" y="414" text-anchor="middle" font-size="9" fill="#333">3</text>

    <circle cx="250" cy="440" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="443" text-anchor="middle" font-size="8" fill="#333">4</text>
    <circle cx="288" cy="440" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="288" y="443" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">6</text>
    <circle cx="312" cy="440" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="312" y="443" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">5</text>
    <circle cx="350" cy="440" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="350" y="443" text-anchor="middle" font-size="8" fill="#333">7</text>

    <line x1="300" y1="380" x2="272" y2="410" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="300" y1="380" x2="328" y2="410" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="272" y1="410" x2="250" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="272" y1="410" x2="288" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="328" y1="410" x2="312" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="328" y1="410" x2="350" y2="440" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <text x="300" y="468" text-anchor="middle" font-size="9" fill="#b85450">BFS col=0: [1,6,5] ✗（6 先访问但 6&gt;5）</text>

  <!-- conclusion -->
  <rect x="380" y="372" width="160" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">987 的 sort 解法</text>
  <text x="460" y="410" text-anchor="middle" font-size="9" fill="#555">5 → (0,2,5)</text>
  <text x="460" y="424" text-anchor="middle" font-size="9" fill="#555">6 → (0,2,6)</text>
  <text x="460" y="442" text-anchor="middle" font-size="9" fill="#4a7a3a">两例三元组完全相同</text>
  <text x="460" y="458" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">→ 均输出 [1,5,6] ✓</text>
</svg>
