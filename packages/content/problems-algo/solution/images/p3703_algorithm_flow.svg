<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 515"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="515" fill="#fafafa"/>

  <text x="30" y="20" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，游程入栈 + 栈顶交界消解到底</text>

  <!-- A: 读取字符 -->
  <rect x="155" y="40" width="150" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">读取下一字符 c</text>

  <!-- 扫描结束出口 -->
  <path d="M 305 66 L 350 66 L 350 100 L 381 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="60" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">字符耗尽</text>
  <rect x="385" y="84" width="140" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="103" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">扫描结束 ⇒ 收尾</text>
  <text x="455" y="120" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">栈内游程展开 = 最终答案</text>

  <!-- B: 同字符判断 -->
  <polygon points="230,88 310,120 230,152 150,120" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="115" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">栈顶游程</text>
  <text x="230" y="130" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">字符 = c ?</text>
  <line x1="230" y1="72" x2="230" y2="86" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="138" y="112" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 120 L 150 145 L 102 145 L 102 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="112" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 310 120 L 310 145 L 365 145 L 365 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C1 / C2 -->
  <rect x="45" y="172" width="115" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="191" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">栈顶计数 +1</text>
  <rect x="300" y="172" width="130" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="191" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">压入新游程 (c, 1)</text>

  <!-- D: 交界判断 -->
  <polygon points="230,220 340,258 230,296 120,258" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="253" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">栈顶两游程是</text>
  <text x="230" y="269" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">'(' 下 + ')' 上 ?</text>
  <path d="M 102 202 L 102 240 L 172 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 202 L 365 240 L 288 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D 否 → 回 A -->
  <path d="M 340 258 L 530 258 L 530 56 L 307 56" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="352" y="251" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="430" y="250" font-size="9" fill="#8a6d1f" filter="url(#rough2)">交界未成，读下一字符</text>

  <!-- D 是 → E -->
  <text x="240" y="312" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <line x1="230" y1="296" x2="230" y2="324" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="155" y="326" width="150" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="345" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">t = ⌊min(a, b) / k⌋</text>
  <line x1="230" y1="356" x2="230" y2="372" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: t=0? -->
  <polygon points="230,374 290,402 230,430 170,402" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="406" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">t = 0 ?</text>

  <!-- F 是 → 回 A -->
  <path d="M 290 402 L 545 402 L 545 30 L 230 30 L 230 38" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="298" y="394" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="370" y="394" font-size="9" fill="#8a6d1f" filter="url(#rough2)">交界枯竭，读下一字符</text>

  <!-- F 否 → G -->
  <text x="240" y="447" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <line x1="230" y1="430" x2="230" y2="458" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G -->
  <rect x="100" y="460" width="260" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="478" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">两游程各减 t·k，清零者弹出</text>
  <text x="230" y="496" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">弹出后相邻同字符游程合并</text>

  <!-- G → D 级联回边 -->
  <path d="M 100 483 L 30 483 L 30 258 L 117 258" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="22" y="380" font-size="9" fill="#b85450" filter="url(#rough2)" transform="rotate(-90 22 380)">级联：重新判断交界</text>
</svg>
