<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="560" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">组合总和 IV：排列数 DP 流程</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. Start: init -->
  <g filter="url(#sk)">
    <rect x="250" y="62" width="280" height="44" rx="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="390" y="89" text-anchor="middle" font-size="12.5" fill="#2b6e9e">初始化 dp[0..target]=0, dp[0]=1</text>
  <line x1="390" y1="106" x2="390" y2="128" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. outer loop amount -->
  <g filter="url(#sk)">
    <rect x="230" y="130" width="320" height="48" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="390" y="159" text-anchor="middle" font-size="12.5" fill="#7a5415">外层：for i = 1 .. target（金额）</text>
  <line x1="390" y1="178" x2="390" y2="200" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. inner loop decision (diamond) -->
  <g filter="url(#sk)">
    <polygon points="390,202 540,256 390,310 240,256" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#2e6e2e">内层：for num in nums</text>
  <text x="390" y="270" text-anchor="middle" font-size="11" fill="#2e6e2e">i ≥ num ?</text>

  <!-- yes branch: do transfer -->
  <text x="560" y="250" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <line x1="540" y1="256" x2="580" y2="256" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="582" y="232" width="170" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="667" y="254" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">dp[i] += dp[i - num]</text>
  <text x="667" y="270" text-anchor="middle" font-size="9.5" fill="#6a96c0">末位用 num 的方案累加</text>

  <!-- loop back up to inner loop -->
  <path d="M 667 280 L 667 304 L 390 304" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="320" font-size="10" fill="#888">下一枚 num → 继续内层</text>

  <!-- no branch: inner loop done -->
  <line x1="390" y1="310" x2="390" y2="332" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="404" y="326" font-size="11" fill="#b85450" font-weight="bold">否/内层完</text>

  <!-- decision: more i? -->
  <g filter="url(#sk)">
    <polygon points="390,334 500,374 390,414 280,374" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="390" y="378" text-anchor="middle" font-size="12" fill="#b03a3a">i ≤ target ?</text>

  <!-- yes: back to outer -->
  <text x="226" y="368" font-size="11" fill="#7a5415" font-weight="bold">是</text>
  <path d="M 280 374 L 210 374 L 210 154 L 230 154" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="266" font-size="10" fill="#888">i++ → 处理下一金额</text>

  <!-- no: return -->
  <line x1="390" y1="414" x2="390" y2="438" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="408" y="432" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="270" y="440" width="240" height="44" rx="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="390" y="467" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">返回 dp[target]</text>

  <!-- key note box -->
  <g filter="url(#sk)">
    <rect x="50" y="500" width="680" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="390" y="521" text-anchor="middle" font-size="11" fill="#444">
    <tspan font-weight="bold" fill="#7a5415">外层金额</tspan> → 排列数（枚举末位） ·
    <tspan font-weight="bold" fill="#2e6e2e">内层硬币</tspan> → 逐个尝试 ·
    <tspan font-weight="bold" fill="#b03a3a">dp[0]=1</tspan> 是递归基
  </text>
  <text x="390" y="540" text-anchor="middle" font-size="10" fill="#888">与 518 仅循环顺序不同：518 外层硬币→组合数，本题外层金额→排列数</text>
</svg>
