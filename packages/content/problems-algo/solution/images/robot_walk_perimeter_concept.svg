<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：机器人沿周界循环，周期 C = 2(w+h−2)</text>
  <text x="280" y="48" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">示例网格 6 × 4（w−1=5, h−1=3, C=16）</text>

  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="80" y1="104" x2="80" y2="240"/>
    <line x1="114" y1="104" x2="114" y2="240"/>
    <line x1="148" y1="104" x2="148" y2="240"/>
    <line x1="182" y1="104" x2="182" y2="240"/>
    <line x1="216" y1="104" x2="216" y2="240"/>
    <line x1="250" y1="104" x2="250" y2="240"/>
    <line x1="284" y1="104" x2="284" y2="240"/>
    <line x1="80" y1="104" x2="284" y2="104"/>
    <line x1="80" y1="138" x2="284" y2="138"/>
    <line x1="80" y1="172" x2="284" y2="172"/>
    <line x1="80" y1="206" x2="284" y2="206"/>
    <line x1="80" y1="240" x2="284" y2="240"/>
  </g>

  <path d="M 80 240 L 284 240" stroke="#446688" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 284 240 L 284 104" stroke="#4a7a3a" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 284 104 L 80 104" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 104 L 80 240" stroke="#b85450" stroke-width="5" fill="none" filter="url(#rough2)"/>

  <polygon points="168,234 188,240 168,246" fill="#446688" filter="url(#rough2)"/>
  <polygon points="278,164 290,164 284,180" fill="#4a7a3a" filter="url(#rough2)"/>
  <polygon points="196,98 176,104 196,110" fill="#d6a040" filter="url(#rough2)"/>
  <polygon points="74,156 86,156 80,172" fill="#b85450" filter="url(#rough2)"/>

  <text x="182" y="262" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">东 East · w−1 步</text>
  <text x="298" y="176" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">北 North · h−1 步</text>
  <text x="182" y="94" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">西 West · w−1 步</text>
  <text x="66" y="176" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">南 South · h−1 步</text>

  <circle cx="80" cy="240" r="7" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="256" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">起点 (0,0) 朝东</text>

  <circle cx="284" cy="240" r="5" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="284" cy="104" r="5" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="80" cy="104" r="5" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="296" y="254" font-size="10.5" fill="#666" filter="url(#rough2)">↰ 转</text>
  <text x="296" y="100" font-size="10.5" fill="#666" filter="url(#rough2)">↰ 转</text>
  <text x="58" y="100" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">↰ 转</text>

  <rect x="70" y="290" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一圈四段：(w−1) + (h−1) + (w−1) + (h−1)</text>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ 周期 C = 2(w + h − 2)，走满 C 步回到 (0,0)</text>
</svg>
