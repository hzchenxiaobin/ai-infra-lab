<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">两阶段下标映射：当前 index_j → 原始 nums 的哪个位置</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">nums = [0,1,2]，n=3 · 查询 [t, index_j]，记 m = t mod 2n</text>

  <!-- ===== LEFT PANEL: removal phase ===== -->
  <rect x="20" y="58" width="240" height="244" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">删除阶段：0 ≤ m ≤ n</text>
  <text x="140" y="96" text-anchor="middle" font-size="10.5" fill="#555">当前数组 = nums[m : n]，长度 = n − m</text>

  <!-- original nums row -->
  <text x="34" y="122" font-size="10" fill="#888">原始 nums：</text>
  <rect x="100" y="110" width="30" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="127" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="132" y="110" width="30" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="110" width="30" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="127" text-anchor="middle" font-size="11" fill="#333">2</text>
  <!-- original indices below -->
  <text x="115" y="146" text-anchor="middle" font-size="9" fill="#999">idx 0</text>
  <text x="147" y="146" text-anchor="middle" font-size="9" fill="#999">idx 1</text>
  <text x="179" y="146" text-anchor="middle" font-size="9" fill="#999">idx 2</text>

  <!-- example: m=2, array = nums[2:3] = [2] -->
  <text x="34" y="178" font-size="10" fill="#446688" font-weight="bold">例 m=2：</text>
  <text x="34" y="194" font-size="10" fill="#555">当前数组 =</text>
  <!-- highlight nums[2] as the slice -->
  <rect x="163" y="182" width="32" height="26" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" rx="5" filter="url(#rough2)"/>
  <!-- current array display below -->
  <rect x="100" y="210" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="227" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="115" y="248" text-anchor="middle" font-size="9" fill="#b85450">当前[0]</text>

  <!-- mapping arrow: current[0] -> original[2] -->
  <path d="M 138 222 Q 170 206 180 126" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="32" y="258" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">index_j &lt; n−m → nums[m + index_j]</text>

  <!-- ===== RIGHT PANEL: addition phase ===== -->
  <rect x="280" y="58" width="240" height="244" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">添加阶段：n &lt; m &lt; 2n</text>
  <text x="400" y="96" text-anchor="middle" font-size="10.5" fill="#555">当前数组 = nums[0 : m−n]，长度 = m−n</text>

  <!-- original nums row -->
  <text x="294" y="122" font-size="10" fill="#888">原始 nums：</text>
  <rect x="360" y="110" width="30" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="127" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="392" y="110" width="30" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="424" y="110" width="30" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="127" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="375" y="146" text-anchor="middle" font-size="9" fill="#999">idx 0</text>
  <text x="407" y="146" text-anchor="middle" font-size="9" fill="#999">idx 1</text>
  <text x="439" y="146" text-anchor="middle" font-size="9" fill="#999">idx 2</text>

  <!-- example: m=5, m-n=2, array = nums[0:2] = [0,1] -->
  <text x="294" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">例 m=5：</text>
  <text x="294" y="194" font-size="10" fill="#555">当前数组 =</text>
  <!-- highlight nums[0:2] slice -->
  <rect x="357" y="182" width="68" height="26" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" rx="5" filter="url(#rough2)"/>
  <!-- current array display below: [0,1], index_j=1 -->
  <rect x="360" y="210" width="30" height="24" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="227" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="392" y="210" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="407" y="227" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="375" y="248" text-anchor="middle" font-size="9" fill="#888">当前[0]</text>
  <text x="407" y="248" text-anchor="middle" font-size="9" fill="#b85450">当前[1]</text>

  <!-- mapping arrow: current[1] -> original[1] (same index) -->
  <path d="M 407 210 L 407 138" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="292" y="258" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">index_j &lt; m−n → nums[index_j]</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="312" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">越界即返回 −1：删除阶段判 index_j ≥ n−m，添加阶段判 index_j ≥ m−n</text>
  <text x="270" y="348" text-anchor="middle" font-size="10.5" fill="#555">两阶段合起来：m+index_j &lt; n 取 nums[m+index_j]；否则 m &gt; n+index_j 取 nums[index_j]</text>

  <text x="270" y="372" text-anchor="middle" font-size="9.5" fill="#aaa">每个查询 O(1) 直接索引</text>
</svg>
