<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2734f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描贪心递减</text>

  <!-- start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">读入 s，i = 0</text>

  <path d="M280,80 L280,104" stroke="#446688" stroke-width="2" marker-end="url(#arr2734f)" filter="url(#rough2)"/>

  <!-- skip leading a -->
  <rect x="180" y="108" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">while i&lt;n 且 s[i]=='a': i++</text>
  <text x="280" y="140" text-anchor="middle" font-size="9" fill="#446688">跳过前导 a</text>

  <path d="M280,150 L280,176" stroke="#446688" stroke-width="2" marker-end="url(#arr2734f)" filter="url(#rough2)"/>

  <!-- decision: all a? -->
  <path d="M280,180 L400,222 L280,264 L160,222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i == n ?</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#d6a040">全是 a ?</text>

  <!-- yes branch: all a's -->
  <text x="140" y="218" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M160,222 L80,222 L80,300" stroke="#b85450" stroke-width="2" marker-end="url(#arr2734f)" filter="url(#rough2)"/>
  <rect x="10" y="304" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[n−1] = 'z'</text>
  <text x="80" y="340" text-anchor="middle" font-size="9" fill="#b85450">改最后一个，损害最小</text>

  <!-- no branch -->
  <text x="410" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M400,222 L470,222 L470,300" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2734f)" filter="url(#rough2)"/>
  <rect x="384" y="304" width="172" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">while i&lt;n 且 s[i]!='a':</text>
  <text x="470" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a">s[i]−−; i++（递减到遇 a）</text>

  <!-- merge to return -->
  <path d="M80,350 L80,376 L280,376" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M470,350 L470,376 L280,376" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M280,376 L280,392" stroke="#446688" stroke-width="2" marker-end="url(#arr2734f)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="200" y="396" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return s</text>

  <!-- side note -->
  <rect x="10" y="396" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="95" y="418" text-anchor="middle" font-size="9" fill="#446688">恰好操作一次，全 a 不可不操作</text>
</svg>
