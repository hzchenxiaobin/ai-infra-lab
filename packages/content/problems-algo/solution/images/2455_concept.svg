<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：偶数 ∩ 整除3 = 整除 lcm(2,3)=6（以 1..18 为例）</text>

  <!-- ====== LEFT: even numbers (multiples of 2) ====== -->
  <rect x="28" y="52" width="194" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="72" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">偶数（2 的倍数）</text>

  <!-- row1: 2 4 6(命中) -->
  <rect x="46" y="82" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="88" y="82" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="130" y="82" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- row2: 8 10 12(命中) -->
  <rect x="46" y="110" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>
  <rect x="88" y="110" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">10</text>
  <rect x="130" y="110" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- row3: 14 16 18(命中) -->
  <rect x="46" y="138" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">14</text>
  <rect x="88" y="138" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">16</text>
  <rect x="130" y="138" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- ====== RIGHT: divisible by 3 ====== -->
  <rect x="318" y="52" width="194" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">整除 3（3 的倍数）</text>

  <!-- row1: 3 9 15 (orange, non-intersection) -->
  <rect x="336" y="88" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="105" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <rect x="384" y="88" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="105" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <rect x="432" y="88" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="105" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">15</text>

  <!-- row2: 6 12 18 (green, intersection) -->
  <rect x="336" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="356" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="384" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">12</text>
  <rect x="432" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="452" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- arrows converging to center -->
  <path d="M 125 184 Q 150 206 200 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 415 184 Q 390 206 340 224" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ====== CENTER: intersection = multiples of 6 ====== -->
  <rect x="150" y="226" width="240" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">偶数 ∩ 整除3 = 6 的倍数</text>

  <!-- lcm chip -->
  <rect x="190" y="258" width="160" height="22" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">lcm(2,3) = 2·3 = 6（gcd=1 互素）</text>

  <!-- chips: 6 12 18 -->
  <rect x="178" y="288" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="248" y="288" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">12</text>
  <rect x="318" y="288" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- arrow down to conclusion -->
  <path d="M 270 320 L 270 342" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== conclusion ====== -->
  <rect x="120" y="346" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">折叠判据：x % 6 == 0</text>
  <text x="270" y="379" text-anchor="middle" font-size="10" fill="#888">一次取模同时判偶与整除3，替代 x%2==0 &amp;&amp; x%3==0</text>
</svg>
