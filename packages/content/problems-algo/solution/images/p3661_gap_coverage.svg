<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：间隙里的墙，只有相邻两台机器人够得着</text>

  <rect x="88" y="72" width="172" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="174" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Rᵢ 向右可覆盖</text>

  <rect x="260" y="72" width="70" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="295" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">盲区</text>

  <rect x="330" y="72" width="114" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="387" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Rᵢ₊₁ 向左可覆盖</text>

  <path d="M 260 68 L 260 140" stroke="#888" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 330 68 L 330 140" stroke="#888" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <path d="M 45 124 L 475 124" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <rect x="88" y="92" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="113" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Rᵢ</text>

  <rect x="396" y="92" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="113" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Rᵢ₊₁</text>

  <rect x="154" y="115" width="6" height="18" fill="#446688" rx="1" filter="url(#rough2)"/>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w₁</text>
  <rect x="219" y="115" width="6" height="18" fill="#446688" rx="1" filter="url(#rough2)"/>
  <text x="225" y="148" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w₂</text>
  <rect x="292" y="115" width="6" height="18" fill="#b85450" rx="1" filter="url(#rough2)"/>
  <text x="295" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w₃ ✗</text>
  <rect x="362" y="115" width="6" height="18" fill="#4a7a3a" rx="1" filter="url(#rough2)"/>
  <text x="365" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w₄</text>

  <text x="105" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rᵢ</text>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rᵢ₊₁</text>

  <path d="M 105 168 L 250 168" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 168 L 340 168" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="160" y="186" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Rᵢ 向右发射</text>
  <text x="400" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Rᵢ₊₁ 向左发射</text>
  <text x="230" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最远到 A = rᵢ + dᵢ</text>
  <text x="365" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最远到 B = rᵢ₊₁ − dᵢ₊₁</text>

  <path d="M 30 222 L 490 222" stroke="#ccc" stroke-width="1" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>

  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">DP 视角：间隙的战果只依赖相邻两台的朝向</text>

  <rect x="25" y="254" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">机器人 i−1</text>
  <text x="90" y="287" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">朝向 ∈ {L, R}</text>

  <path d="M 158 274 L 190 274" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="174" y="265" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gap i−1</text>

  <rect x="195" y="254" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">机器人 i</text>
  <text x="260" y="287" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">朝向 ∈ {L, R}</text>

  <path d="M 328 274 L 360 274" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="265" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gap i</text>

  <rect x="365" y="254" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">机器人 i+1</text>
  <text x="430" y="287" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">朝向 ∈ {L, R}</text>

  <rect x="40" y="308" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 间隙 (rᵢ, rᵢ₊₁) 内的墙只归相邻两台管：更远的子弹被邻居挡住</text>
  <text x="260" y="350" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 同位墙（与机器人同位置）恒被摧毁：两个方向的路径都含出发点</text>
  <text x="260" y="370" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 不发射永劣于发射：总战果 = 各子弹路径的并集，多打只会多毁</text>
  <text x="260" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ dp[i][朝向] 只依赖 dp[i−1][·]，一台一状态，线性扫过</text>
</svg>
