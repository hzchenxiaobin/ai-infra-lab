<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：−1/2+1/2+1/3 = 1/3</text>

  <!-- Header row -->
  <rect x="60" y="50" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="114" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输入</text>
  <rect x="174" y="50" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="68" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">合并计算 (num×b + a×den) / (den×b)</text>
  <rect x="418" y="50" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加器</text>

  <!-- Init row -->
  <rect x="60" y="80" width="50" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="98" text-anchor="middle" font-size="11" fill="#333">初始</text>
  <rect x="114" y="80" width="56" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="98" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="174" y="80" width="240" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="294" y="98" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="418" y="80" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="98" text-anchor="middle" font-size="11" fill="#333">0/1</text>

  <!-- Step 1 -->
  <rect x="60" y="110" width="50" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="128" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="114" y="110" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="128" text-anchor="middle" font-size="11" fill="#333">−1/2</text>
  <rect x="174" y="110" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="128" text-anchor="middle" font-size="11" fill="#333">(0×2 + (−1)×1) / (1×2) = −1/2</text>
  <rect x="418" y="110" width="82" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="128" text-anchor="middle" font-size="11" fill="#333">−1/2</text>

  <!-- Step 2 -->
  <rect x="60" y="140" width="50" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="114" y="140" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="158" text-anchor="middle" font-size="11" fill="#333">+1/2</text>
  <rect x="174" y="140" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="158" text-anchor="middle" font-size="11" fill="#333">((−1)×2 + 1×2) / (2×2) = 0/4</text>
  <rect x="418" y="140" width="82" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="158" text-anchor="middle" font-size="11" fill="#333">0/4</text>

  <!-- Step 3 -->
  <rect x="60" y="170" width="50" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="188" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="114" y="170" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="188" text-anchor="middle" font-size="11" fill="#333">+1/3</text>
  <rect x="174" y="170" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="188" text-anchor="middle" font-size="11" fill="#333">(0×3 + 1×4) / (4×3) = 4/12</text>
  <rect x="418" y="170" width="82" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="188" text-anchor="middle" font-size="11" fill="#333">4/12</text>

  <!-- Reduce row -->
  <rect x="60" y="200" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">约分</text>
  <rect x="114" y="200" width="56" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="218" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="174" y="200" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">÷ gcd(4, 12) = 4</text>
  <rect x="418" y="200" width="82" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="459" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1/3</text>

  <!-- Result -->
  <rect x="80" y="240" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4/12 ÷ 4 = 1/3</text>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a">→ "1/3"  ✓</text>

  <!-- Summary -->
  <rect x="80" y="294" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#555">每步合并：分子交叉相乘再相加，分母直接相乘</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">无需中间约分，末尾一次 gcd 即可化为最简</text>
</svg>
