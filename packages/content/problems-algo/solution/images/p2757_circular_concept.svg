<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">循环数组：首尾相接，i ← (i + step) mod n</text>

  <!-- array row: 1 2 3 4 5 -->
  <!-- cell 0 highlighted as startIndex -->
  <rect x="70" y="110" width="70" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="143" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="105" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">startIndex</text>

  <rect x="140" y="110" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>

  <rect x="210" y="110" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <text x="245" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <rect x="280" y="110" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
  <text x="315" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <rect x="350" y="110" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
  <text x="385" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- wrap arrow from last cell back to first -->
  <path d="M420,150 C470,150 470,210 420,210 C360,210 110,210 105,170"
        stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr[n−1] 的下一个 = arr[0]</text>

  <!-- forward step arrow (under cells) -->
  <path d="M105,184 L175,184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+1</text>

  <!-- backward step arrow -->
  <path d="M175,196 L105,196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- legend box -->
  <rect x="40" y="244" width="460" height="92" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">取模规则（负数也安全）</text>
  <text x="56" y="288" font-size="11.5" fill="#333" filter="url(#rough2)">• step &gt; 0：向右前进 step 格，越过末尾自动绕回首部</text>
  <text x="56" y="306" font-size="11.5" fill="#333" filter="url(#rough2)">• step &lt; 0：向左后退 |step| 格，越过首部自动绕至末尾</text>
  <text x="56" y="324" font-size="11.5" fill="#333" filter="url(#rough2)">• step = 0：原地不动，仍吐出当前格的值</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i ← ((i + step) % n + n) % n</text>
</svg>
