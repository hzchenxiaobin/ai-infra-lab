<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：s = aaabaab，答案 = 4</text>

  <!-- f[] summary -->
  <text x="20" y="56" font-size="12" fill="#333" filter="url(#rough2)">f[l]（删后缀 s[l:] 的最大步数）：</text>
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="255" y="70" text-anchor="middle">0</text>
    <text x="285" y="70" text-anchor="middle">1</text>
    <text x="315" y="70" text-anchor="middle">2</text>
    <text x="345" y="70" text-anchor="middle">3</text>
    <text x="375" y="70" text-anchor="middle">4</text>
    <text x="405" y="70" text-anchor="middle">5</text>
    <text x="435" y="70" text-anchor="middle">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="240" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="270" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="300" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="330" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="360" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="390" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="420" y="74" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="255" y="94" text-anchor="middle">4</text>
    <text x="285" y="94" text-anchor="middle">3</text>
    <text x="315" y="94" text-anchor="middle">1</text>
    <text x="345" y="94" text-anchor="middle">1</text>
    <text x="375" y="94" text-anchor="middle">2</text>
    <text x="405" y="94" text-anchor="middle">1</text>
    <text x="435" y="94" text-anchor="middle">1</text>
  </g>
  <text x="466" y="94" font-size="11" fill="#4a7a3a" filter="url(#rough2)">← 高亮格在最优路径上</text>

  <!-- Step 1: aaabaab, delete 'a' (i=1) -->
  <circle cx="22" cy="139" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="22" y="143" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="46" y="125" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="72" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="98" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="124" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="202" y="125" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="59" y="144" text-anchor="middle">a</text>
    <text x="85" y="144" text-anchor="middle">a</text>
    <text x="111" y="144" text-anchor="middle">a</text>
    <text x="137" y="144" text-anchor="middle">b</text>
    <text x="163" y="144" text-anchor="middle">a</text>
    <text x="189" y="144" text-anchor="middle">a</text>
    <text x="215" y="144" text-anchor="middle">b</text>
  </g>
  <path d="M232 139 L258 139" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="264" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="290" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="316" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="342" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="368" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="394" y="125" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="277" y="144" text-anchor="middle">a</text>
    <text x="303" y="144" text-anchor="middle">a</text>
    <text x="329" y="144" text-anchor="middle">b</text>
    <text x="355" y="144" text-anchor="middle">a</text>
    <text x="381" y="144" text-anchor="middle">a</text>
    <text x="407" y="144" text-anchor="middle">b</text>
  </g>
  <text x="430" y="143" font-size="11" fill="#b85450" filter="url(#rough2)">i=1：s[0]==s[1]</text>

  <!-- Step 2: aabaab, delete 'aab' (i=3) -->
  <circle cx="22" cy="211" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="22" y="215" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="46" y="197" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="72" y="197" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="98" y="197" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="124" y="197" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="150" y="197" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="197" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="59" y="216" text-anchor="middle">a</text>
    <text x="85" y="216" text-anchor="middle">a</text>
    <text x="111" y="216" text-anchor="middle">b</text>
    <text x="137" y="216" text-anchor="middle">a</text>
    <text x="163" y="216" text-anchor="middle">a</text>
    <text x="189" y="216" text-anchor="middle">b</text>
  </g>
  <path d="M206 211 L232 211" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="238" y="197" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="264" y="197" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="290" y="197" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="251" y="216" text-anchor="middle">a</text>
    <text x="277" y="216" text-anchor="middle">a</text>
    <text x="303" y="216" text-anchor="middle">b</text>
  </g>
  <text x="326" y="215" font-size="11" fill="#b85450" filter="url(#rough2)">i=3：s[0:3]=='aab'==s[3:6]</text>

  <!-- Step 3: aab, delete 'a' (i=1) -->
  <circle cx="22" cy="283" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="22" y="287" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <rect x="46" y="269" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="72" y="269" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="98" y="269" width="26" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="59" y="288" text-anchor="middle">a</text>
    <text x="85" y="288" text-anchor="middle">a</text>
    <text x="111" y="288" text-anchor="middle">b</text>
  </g>
  <path d="M128 283 L154 283" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="160" y="269" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="186" y="269" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="173" y="288" text-anchor="middle">a</text>
    <text x="199" y="288" text-anchor="middle">b</text>
  </g>
  <text x="226" y="287" font-size="11" fill="#b85450" filter="url(#rough2)">i=1：s[0]==s[1]</text>

  <!-- Step 4: ab, delete whole (option A) -->
  <circle cx="22" cy="355" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="22" y="359" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)">
    <rect x="46" y="341" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="72" y="341" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#rough2)">
    <text x="59" y="360" text-anchor="middle">a</text>
    <text x="85" y="360" text-anchor="middle">b</text>
  </g>
  <path d="M102 355 L128 355" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="134" y="341" width="36" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="360" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">∅</text>
  <text x="184" y="359" font-size="11" fill="#b85450" filter="url(#rough2)">整段删 = 1 步（选项 A）</text>

  <!-- result -->
  <rect x="160" y="388" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="409" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">共 4 步操作 → f[0] = 4 ✓</text>
</svg>
