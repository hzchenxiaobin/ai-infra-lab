<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,10,6,4,8,12]</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后枚举候选 2k；绿=取作 lower，橙=配对消耗的 higher，灰=已耗尽</text>

  <!-- Candidate enumeration header -->
  <rect x="40" y="58" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="76" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">候选 2k（= nums[j]−nums[0]，正偶去重）：</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="226" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="246" y="82" fill="#446688" font-weight="bold">2</text>
    <text x="278" y="82" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓试</text>
    <rect x="310" y="64" width="40" height="28" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="330" y="82" fill="#888" font-weight="bold">4</text>
    <rect x="358" y="64" width="40" height="28" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="82" fill="#888" font-weight="bold">6</text>
    <rect x="406" y="64" width="40" height="28" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="426" y="82" fill="#888" font-weight="bold">8</text>
    <rect x="454" y="64" width="40" height="28" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="474" y="82" fill="#888" font-weight="bold">10</text>
  </g>
  <text x="510" y="82" font-size="9.5" fill="#888" filter="url(#rough2)">k=1,2,3…</text>

  <!-- Column headers -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle">
    <text x="76" y="118">步骤</text>
    <text x="150" y="118">处理 x</text>
    <text x="320" y="118">频率表（升序键）</text>
    <text x="510" y="118">动作 / 结果</text>
  </g>
  <line x1="40" y1="126" x2="580" y2="126" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step 0: initial freq, try 2k=2 (k=1) -->
  <text x="76" y="148" font-size="10.5" fill="#555" font-weight="bold" text-anchor="middle" filter="url(#rough2)">初始</text>
  <text x="150" y="148" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">—</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="234" y="150" fill="#446688" font-weight="bold">2:1</text>
    <rect x="258" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="278" y="150" fill="#446688" font-weight="bold">4:1</text>
    <rect x="302" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="322" y="150" fill="#446688" font-weight="bold">6:1</text>
    <rect x="346" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="366" y="150" fill="#446688" font-weight="bold">8:1</text>
    <rect x="390" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="410" y="150" fill="#446688" font-weight="bold">10:1</text>
    <rect x="434" y="132" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="454" y="150" fill="#446688" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="148" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">试 2k=2 (k=1)</text>

  <!-- Step 1: x=2 -->
  <text x="76" y="188" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="130" y="172" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="190" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="172" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="234" y="190" fill="#4a7a3a" font-weight="bold">2:1</text>
    <rect x="258" y="172" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="278" y="190" fill="#d6a040" font-weight="bold">4:1</text>
    <rect x="302" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="322" y="190" fill="#446688" font-weight="bold">6:1</text>
    <rect x="346" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="366" y="190" fill="#446688" font-weight="bold">8:1</text>
    <rect x="390" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="410" y="190" fill="#446688" font-weight="bold">10:1</text>
    <rect x="434" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="454" y="190" fill="#446688" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="184" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 2，消耗 4</text>
  <text x="510" y="198" font-size="10" fill="#888" filter="url(#rough2)">arr=[3]</text>

  <!-- Step 2: x=4 skip -->
  <text x="76" y="228" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="130" y="212" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="230" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="212" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="234" y="230" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="258" y="212" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="278" y="230" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="302" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="322" y="230" fill="#446688" font-weight="bold">6:1</text>
    <rect x="346" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="366" y="230" fill="#446688" font-weight="bold">8:1</text>
    <rect x="390" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="410" y="230" fill="#446688" font-weight="bold">10:1</text>
    <rect x="434" y="212" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="454" y="230" fill="#446688" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="228" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">freq[4]=0，跳过</text>

  <!-- Step 3: x=6 -->
  <text x="76" y="268" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="130" y="252" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="270" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="252" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="234" y="270" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="258" y="252" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="278" y="270" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="302" y="252" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="322" y="270" fill="#4a7a3a" font-weight="bold">6:1</text>
    <rect x="346" y="252" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="366" y="270" fill="#d6a040" font-weight="bold">8:1</text>
    <rect x="390" y="252" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="410" y="270" fill="#446688" font-weight="bold">10:1</text>
    <rect x="434" y="252" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="454" y="270" fill="#446688" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="264" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 6，消耗 8</text>
  <text x="510" y="278" font-size="10" fill="#888" filter="url(#rough2)">arr=[3,7]</text>

  <!-- Step 4: x=8 skip -->
  <text x="76" y="308" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="130" y="292" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="310" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="292" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="234" y="310" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="258" y="292" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="278" y="310" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="302" y="292" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="322" y="310" fill="#aaa" font-weight="bold">6:0</text>
    <rect x="346" y="292" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="366" y="310" fill="#aaa" font-weight="bold">8:0</text>
    <rect x="390" y="292" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="410" y="310" fill="#4a7a3a" font-weight="bold">10:1</text>
    <rect x="434" y="292" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="454" y="310" fill="#d6a040" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="308" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">freq[8]=0，跳过</text>

  <!-- Step 5: x=10 -->
  <text x="76" y="348" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="130" y="332" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="350" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="214" y="332" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="234" y="350" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="258" y="332" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="278" y="350" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="302" y="332" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="322" y="350" fill="#aaa" font-weight="bold">6:0</text>
    <rect x="346" y="332" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="366" y="350" fill="#aaa" font-weight="bold">8:0</text>
    <rect x="390" y="332" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="410" y="350" fill="#4a7a3a" font-weight="bold">10:1</text>
    <rect x="434" y="332" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="454" y="350" fill="#d6a040" font-weight="bold">12:1</text>
  </g>
  <text x="510" y="344" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 10，消耗 12</text>
  <text x="510" y="358" font-size="10" fill="#888" filter="url(#rough2)">arr=[3,7,11]</text>

  <!-- Result -->
  <rect x="120" y="384" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr = [3, 7, 11]  （k = 1）</text>
  <text x="310" y="418" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每对 (x, x+2k) 取中点 x+k，配满 n=3 对即返回</text>

  <!-- Divider -->
  <line x1="40" y1="436" x2="580" y2="436" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Counter: wrong k -->
  <text x="40" y="464" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">反例：试 2k=4 (k=2) → x=10 配 14，freq[14]=0 &lt; 1 → k 无效，换下一个</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="476" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="140" y="494" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="164" y="476" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="184" y="494" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="208" y="476" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="228" y="494" fill="#aaa" font-weight="bold">6:0</text>
    <rect x="252" y="476" width="40" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="272" y="494" fill="#aaa" font-weight="bold">8:0</text>
    <rect x="296" y="476" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="316" y="494" fill="#4a7a3a" font-weight="bold">10:1</text>
    <rect x="340" y="476" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="360" y="494" fill="#b85450" font-weight="bold">14?</text>
  </g>
  <text x="392" y="494" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">14 不在表 → 失败</text>

  <!-- Note -->
  <rect x="40" y="510" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="526" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">要点：候选 k 按 2k 升序尝试，首个配满 n 对即返回；错误 k 必在某步暴露</text>
</svg>
