<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：倍数链 + 把「值」放进 DP 状态</text>

  <!-- ============ 左：示例 1 [3,7,9] ============ -->
  <text x="135" y="47" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">示例 1：[3,7,9]，答案 2</text>

  <text x="30" y="77" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">原</text>
  <rect x="40" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="95" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="150" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>

  <path d="M 59,88 L 59,120" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 114,88 L 114,120" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 169,88 L 169,120" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="143" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">终</text>
  <rect x="40" y="124" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="95" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="150" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>

  <text x="86.5" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">×3</text>
  <text x="141.5" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">×1</text>
  <path d="M 80,139 L 93,139" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 135,139 L 148,139" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="135" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 → 9：+2（≥ 7 的最小 3 倍数）</text>
  <text x="135" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 原地继承：+0 ⇒ 总操作数 2</text>

  <rect x="20" y="208" width="235" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="137.5" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">倍数链非降：b[i] ≥ b[i−1]（每步 ×k，k ≥ 1）</text>
  <text x="137.5" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首位 b[0] = nums[0] 锁死（i &gt; 0 才能加 1）</text>

  <!-- ============ 右：贪心陷阱 [1,40,41] ============ -->
  <text x="388" y="47" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">贪心陷阱：[1,40,41]，答案 1</text>

  <circle cx="300" cy="74" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="380" cy="74" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">40</text>
  <circle cx="460" cy="74" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">80</text>
  <path d="M 314,74 L 364,74" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 394,74 L 444,74" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="110" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">贪心：0 + 39 = 39 ✗</text>

  <circle cx="300" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="380" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">41</text>
  <circle cx="460" cy="152" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">41</text>
  <path d="M 314,152 L 364,152" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 394,152 L 444,152" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">最优：1 + 0 = 1 ✓</text>

  <rect x="272" y="202" width="233" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="388" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贪心取 40：作整除基，后继只能跳 80</text>
  <text x="388" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">多花 1 取 41：后继原地继承，省 38</text>

  <!-- ============ 底部：状态设计 ============ -->
  <rect x="40" y="262" width="440" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dp[i][v] = (v − nums[i]) + min{ dp[i−1][u] : u | v }</text>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">初始：dp[0][nums[0]] = 0（首位锁死，只点亮一个值）</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">值域封顶：v ≤ 2·max(nums) = 100（交换论证 ⇒ 最优解不越界）</text>
</svg>
