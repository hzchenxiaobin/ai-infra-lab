<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 492"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="492" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：位包含判定 + 在最高缺失位顶一格</text>

  <!-- Panel A -->
  <text x="30" y="52" font-size="12.5" fill="#33506b" filter="url(#rough2)">① AND ⊇ candidate ⟺ 每个 vᵢ ⊇ candidate（只需包含，不必相等）</text>

  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="227" y="72" text-anchor="middle">b5</text>
    <text x="261" y="72" text-anchor="middle">b4</text>
    <text x="295" y="72" text-anchor="middle">b3</text>
    <text x="329" y="72" text-anchor="middle">b2</text>
    <text x="363" y="72" text-anchor="middle">b1</text>
    <text x="397" y="72" text-anchor="middle">b0</text>
  </g>

  <!-- candidate bands: b5, b2, b1 -->
  <g filter="url(#rough2)">
    <rect x="210" y="76" width="34" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="312" y="76" width="34" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="346" y="76" width="34" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <!-- v1 = 110110 -->
  <g filter="url(#rough2)">
    <rect x="210" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="244" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="278" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="312" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="346" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="380" y="76" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="227" y="94" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="261" y="94" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="295" y="94" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="329" y="94" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="363" y="94" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="397" y="94" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="200" y="94" text-anchor="end" font-size="12" fill="#444">v₁</text>
    <text x="420" y="94" font-size="10.5" fill="#999">=54</text>
  </g>

  <!-- v2 = 101110 -->
  <g filter="url(#rough2)">
    <rect x="210" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="244" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="278" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="312" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="346" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="380" y="106" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="227" y="124" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="261" y="124" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="295" y="124" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="329" y="124" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="363" y="124" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="397" y="124" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="200" y="124" text-anchor="end" font-size="12" fill="#444">v₂</text>
    <text x="420" y="124" font-size="10.5" fill="#999">=46</text>
  </g>

  <!-- v3 = 100111 -->
  <g filter="url(#rough2)">
    <rect x="210" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="244" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="278" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="312" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="346" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="380" y="136" width="34" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="227" y="154" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="261" y="154" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="295" y="154" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="329" y="154" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="363" y="154" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="397" y="154" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="200" y="154" text-anchor="end" font-size="12" fill="#444">v₃</text>
    <text x="420" y="154" font-size="10.5" fill="#999">=39</text>
  </g>

  <!-- AND row = 100110 -->
  <g filter="url(#rough2)">
    <rect x="210" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="244" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="278" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="312" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="346" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="380" y="176" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="227" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">1</text>
    <text x="261" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">0</text>
    <text x="295" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">0</text>
    <text x="329" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">1</text>
    <text x="363" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">1</text>
    <text x="397" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">0</text>
    <text x="200" y="194" text-anchor="end" font-size="12" fill="#2f5d24" font-weight="bold">AND</text>
    <text x="420" y="194" font-size="10.5" fill="#2f5d24" font-weight="bold">=38</text>
  </g>

  <g font-size="11" fill="#666" filter="url(#rough2)">
    <text x="30" y="226">蓝列是 candidate（100110₂ = 38）的 1 位：三个数在这些列全为 1 ⇒ AND 全部保住；</text>
    <text x="30" y="242">其余列只要有 0 就被 AND 抹掉——不影响「AND ⊇ candidate」，判定只看蓝列。</text>
  </g>

  <!-- Panel B -->
  <text x="30" y="270" font-size="12.5" fill="#33506b" filter="url(#rough2)">② cost(x, cand)：x = 1011₂，cand = 0110₂ ⟹ 在最高缺失位 h = 2 顶一格</text>

  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="240" y="290" text-anchor="middle">b3</text>
    <text x="280" y="290" text-anchor="middle">b2</text>
    <text x="320" y="290" text-anchor="middle">b1</text>
    <text x="360" y="290" text-anchor="middle">b0</text>
  </g>

  <!-- x = 1011 -->
  <g filter="url(#rough2)">
    <rect x="220" y="294" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="260" y="294" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="300" y="294" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="340" y="294" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="240" y="312" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="320" y="312" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="360" y="312" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="212" y="312" text-anchor="end" font-size="12" fill="#444">x</text>
  </g>

  <!-- cand = 0110 -->
  <g filter="url(#rough2)">
    <rect x="220" y="326" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="260" y="326" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="300" y="326" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <rect x="340" y="326" width="40" height="28" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2"/>
    <text x="240" y="344" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="280" y="344" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="320" y="344" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="360" y="344" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="212" y="344" text-anchor="end" font-size="12" fill="#444">cand</text>
  </g>

  <!-- v = 1110, color-coded -->
  <g filter="url(#rough2)">
    <rect x="220" y="358" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="260" y="358" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="300" y="358" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="340" y="358" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="240" y="376" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
    <text x="280" y="376" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
    <text x="320" y="376" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">1</text>
    <text x="360" y="376" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">0</text>
    <text x="212" y="376" text-anchor="end" font-size="12" fill="#2f5d24" font-weight="bold">v</text>
  </g>

  <path d="M 400 310 C 432 320, 432 356, 404 370" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#666" filter="url(#rough2)">
    <text x="440" y="330">最小 v = 1110₂</text>
    <text x="440" y="348">cost = 14 − 11 = 3</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="30" y="400" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="48" y="410" font-size="11" fill="#33506b">保留 x 高于 h 的位</text>
    <rect x="200" y="400" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="218" y="410" font-size="11" fill="#b85450">最高缺失位 h 顶成 1</text>
    <rect x="372" y="400" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="390" y="410" font-size="11" fill="#8a6d1a">低位照抄 candidate</text>
  </g>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="30" y="428" width="500" height="50" rx="8" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="280" y="448" text-anchor="middle" font-size="11.5" fill="#444">v = (x ≫ h+1 ≪ h+1) | 2ʰ | (cand &amp; 2ʰ−1) = 1000₂ | 100₂ | 10₂ = 1110₂</text>
    <text x="280" y="466" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">cost = v − x = 3 —— n 个元素各算一遍，取最小 m 个之和 ≤ k 即该位可保</text>
  </g>
</svg>
