<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：反转会丢弃前导零（即原数的尾随零）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">两次反转后能否还原，取决于原数有没有尾随零</text>

  <!-- ===== Case 1: 526 (no trailing zero) → true ===== -->
  <text x="280" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">情况一：末位非零（526）→ 两次反转还原 ✓</text>

  <!-- 526 -->
  <rect x="80" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="120" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="64" y="106" text-anchor="end" font-size="11" fill="#888">num</text>

  <!-- arrow down: reverse -->
  <path d="M 180 124 L 180 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="140" font-size="10.5" fill="#4a7a3a" font-weight="bold">reverse</text>

  <!-- 625 -->
  <rect x="80" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="120" y="156" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="156" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="64" y="176" text-anchor="end" font-size="11" fill="#888">reversed1</text>

  <!-- arrow down: reverse again -->
  <path d="M 180 194 L 180 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="210" font-size="10.5" fill="#4a7a3a" font-weight="bold">reverse</text>

  <!-- 526 again -->
  <rect x="80" y="226" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="120" y="226" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="226" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="64" y="246" text-anchor="end" font-size="11" fill="#888">reversed2</text>

  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">526 == 526 → true</text>

  <!-- vertical divider -->
  <line x1="290" y1="60" x2="290" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Case 2: 1800 (trailing zeros) → false ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">情况二：末位为零（1800）→ 零丢失 ✗</text>

  <!-- 1800 -->
  <rect x="330" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="410" y="86" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <rect x="450" y="86" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="314" y="106" text-anchor="end" font-size="11" fill="#888">num</text>

  <!-- arrow down: reverse -->
  <path d="M 470 124 L 470 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="486" y="140" font-size="10.5" fill="#b85450" font-weight="bold">reverse</text>

  <!-- 0081 → 81 (two ghost zeros struck through) -->
  <rect x="330" y="156" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="176" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold">0</text>
  <rect x="370" y="156" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="176" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold">0</text>
  <rect x="410" y="156" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="450" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="314" y="176" text-anchor="end" font-size="11" fill="#888">reversed1</text>
  <text x="370" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 前导零被丢弃</text>

  <!-- arrow down: reverse again -->
  <path d="M 430 206 L 430 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="446" y="218" font-size="10.5" fill="#b85450" font-weight="bold">reverse</text>

  <!-- 18 (only 2 digits, zeros gone forever) -->
  <rect x="390" y="226" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="226" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <text x="314" y="246" text-anchor="end" font-size="11" fill="#888">reversed2</text>

  <text x="430" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">18 ≠ 1800 → false</text>

  <!-- ===== Bottom conclusion ===== -->
  <rect x="40" y="300" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结论：两次反转还原 ⟺ 原数无尾随零</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">代码：return num == 0 or num % 10 != 0</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">（0 是特例：0 的反转仍是 0，还原成立）</text>
</svg>
