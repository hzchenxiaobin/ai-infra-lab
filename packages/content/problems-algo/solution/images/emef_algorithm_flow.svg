<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">彼此熟识最早时间：算法流程</text>

  <!-- step 1: sort -->
  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 按 timestamp 升序排序 logs</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">保证按时间从早到晚处理</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: init UF -->
  <rect x="150" y="104" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 初始化并查集</text>
  <text x="270" y="137" text-anchor="middle" font-size="10.5" fill="#666">parent[i]=i, count = n</text>
  <line x1="270" y1="144" x2="270" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="130" y="162" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历每条 log (t, u, v)</text>
  <line x1="270" y1="196" x2="270" y2="214" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find -->
  <rect x="120" y="214" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru = find(u), rv = find(v)</text>
  <text x="270" y="246" text-anchor="middle" font-size="10" fill="#666">带路径压缩地找根</text>
  <line x1="270" y1="252" x2="270" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: ru == rv? -->
  <path d="M 270 270 L 372 306 L 270 342 L 168 306 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru == rv ?</text>
  <text x="270" y="318" text-anchor="middle" font-size="10" fill="#888">已是好友</text>

  <!-- yes branch: skip -->
  <text x="388" y="302" font-size="11" fill="#888" font-weight="bold">是</text>
  <line x1="372" y1="306" x2="420" y2="306" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="288" width="104" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="472" y="305" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">跳过</text>
  <text x="472" y="319" text-anchor="middle" font-size="10" fill="#888">同根不合并</text>

  <!-- no branch: union + count -->
  <text x="128" y="302" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="168" y1="306" x2="120" y2="306" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="288" width="106" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="67" y="305" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">union(u,v)</text>
  <text x="67" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a">count −−</text>

  <!-- union -> check count == 1 -->
  <line x1="67" y1="326" x2="67" y2="350" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: count == 1? -->
  <path d="M 67 350 L 169 386 L 67 412 L -35 386 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="67" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count==1?</text>
  <text x="67" y="398" text-anchor="middle" font-size="9.5" fill="#888">全连通?</text>

  <!-- yes: return t -->
  <text x="185" y="378" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="169" y1="386" x2="230" y2="372" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="354" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 t ⭐</text>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#888">最早时刻</text>

  <!-- no: back to loop -->
  <text x="-18" y="378" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M -35 386 Q 250 412 250 196" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end: return -1 note -->
  <rect x="360" y="354" width="170" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="445" y="372" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">遍历结束仍未连通</text>
  <text x="445" y="386" text-anchor="middle" font-size="10.5" fill="#888">返回 −1</text>
</svg>
