<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">组内 DP：打家劫舍式转移</text>

  <!-- chain arr -->
  <text x="30" y="60" font-size="12" fill="#888">arr:</text>
  <rect x="80" y="46" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="66" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="150" y="46" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="66" text-anchor="middle" font-size="12" fill="#333">8</text>
  <path d="M 130 61 L 150 61" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="40" text-anchor="middle" font-size="9" fill="#b85450">8−3=5=k</text>

  <!-- f row -->
  <text x="30" y="124" font-size="12" fill="#888">f[i]:</text>
  <rect x="60" y="108" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="85" y="100" text-anchor="middle" font-size="9" fill="#888">f[0]</text>

  <rect x="120" y="108" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="128" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="145" y="100" text-anchor="middle" font-size="9" fill="#888">f[1]</text>

  <rect x="190" y="108" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="215" y="100" text-anchor="middle" font-size="9" fill="#888">f[2]</text>

  <!-- transitions into f[2] -->
  <!-- not pick (from f[1]) -->
  <path d="M 170 123 Q 180 145 190 123" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">不选8</text>
  <!-- pick (from f[0]) -->
  <path d="M 110 138 Q 150 180 210 138" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="10" fill="#b85450">选8(跳过3)</text>

  <!-- formula box: diff == k -->
  <rect x="30" y="200" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相邻差 = k (冲突)</text>
  <text x="140" y="244" text-anchor="middle" font-size="12" fill="#b85450">f[i] = f[i−1] + f[i−2]</text>

  <!-- formula box: diff != k -->
  <rect x="270" y="200" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相邻差 ≠ k (独立)</text>
  <text x="380" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a">f[i] = f[i−1] × 2</text>

  <!-- Summary -->
  <rect x="30" y="280" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">选第 i 个 → 不能选第 i−1 个 → 回退到 f[i−2]</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#888">等价于「打家劫舍」：相邻不能同时选</text>
</svg>
