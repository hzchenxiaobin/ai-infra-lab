<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">题面键盘：26 个字母 → 数字 1–9 的映射</text>

  <!-- 键 1：a b（"asdf" 用到，橙色） -->
  <rect x="50" y="48" width="140" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">1</text>
  <text x="120" y="122" text-anchor="middle" font-size="15" fill="#555">a b</text>

  <!-- 键 2：c d e（橙色） -->
  <rect x="210" y="48" width="140" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">2</text>
  <text x="280" y="122" text-anchor="middle" font-size="15" fill="#555">c d e</text>

  <!-- 键 3：f g h（橙色） -->
  <rect x="370" y="48" width="140" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="86" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">3</text>
  <text x="440" y="122" text-anchor="middle" font-size="15" fill="#555">f g h</text>

  <!-- 键 4：i j k -->
  <rect x="50" y="156" width="140" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="194" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">4</text>
  <text x="120" y="230" text-anchor="middle" font-size="15" fill="#555">i j k</text>

  <!-- 键 5：l m n -->
  <rect x="210" y="156" width="140" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">5</text>
  <text x="280" y="230" text-anchor="middle" font-size="15" fill="#555">l m n</text>

  <!-- 键 6：o p q -->
  <rect x="370" y="156" width="140" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="194" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">6</text>
  <text x="440" y="230" text-anchor="middle" font-size="15" fill="#555">o p q</text>

  <!-- 键 7：r s t（橙色） -->
  <rect x="50" y="264" width="140" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">7</text>
  <text x="120" y="338" text-anchor="middle" font-size="15" fill="#555">r s t</text>

  <!-- 键 8：u v w -->
  <rect x="210" y="264" width="140" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">8</text>
  <text x="280" y="338" text-anchor="middle" font-size="15" fill="#555">u v w</text>

  <!-- 键 9：x y z -->
  <rect x="370" y="264" width="140" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="302" text-anchor="middle" font-size="26" fill="#333" font-weight="bold">9</text>
  <text x="440" y="338" text-anchor="middle" font-size="15" fill="#555">x y z</text>

  <text x="280" y="386" text-anchor="middle" font-size="12.5" fill="#b85450">示例 "asdf"：a→1、s→7、d→2、f→3（橙色键），映射值序列 [1, 7, 2, 3]</text>
  <text x="280" y="410" text-anchor="middle" font-size="12.5" fill="#446688">等价公式：val(c) = ⌊(c − 'a' + 1) / 3⌋ + 1（键 1 放 2 个字母，键 2–9 各放 3 个）</text>
</svg>
