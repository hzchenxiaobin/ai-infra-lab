<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分组计数 → 求最大 → 回连经理 → 等值筛选 → 升序输出</text>

  <!-- 第一行：① FROM → ② GROUP BY → ③ MAX -->
  <rect x="16" y="56" width="104" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">FROM</text>
  <text x="68" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Employees</text>
  <text x="68" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">11 行全表</text>

  <rect x="148" y="56" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="238" y="80" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">GROUP BY dep_id</text>
  <text x="238" y="100" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">COUNT(*) → T：3 行</text>
  <text x="238" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">哈希聚合 O(n)</text>

  <rect x="356" y="56" width="148" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">SELECT MAX(cnt) FROM T</text>
  <text x="430" y="100" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">阈值 = 4</text>
  <text x="430" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">O(k) 小表求最大</text>

  <path d="M 122 86 C 130 84, 138 84, 144 86" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 330 86 C 338 84, 346 84, 352 86" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 第二行：④ JOIN（右上，接 ③ 下方） -->
  <rect x="356" y="164" width="148" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">JOIN Employees</text>
  <text x="430" y="204" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">ON dep_id 相等 AND</text>
  <text x="430" y="220" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">position = 'Manager'</text>

  <path d="M 430 118 L 430 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ⑤ 判定菱形 -->
  <polygon points="250,164 336,196 250,228 164,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="192" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">cnt = MAX ?</text>
  <text x="250" y="210" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">（= 4 ?）</text>

  <path d="M 354 196 L 340 196" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 否分支：出局 -->
  <path d="M 250 230 L 250 250" stroke="#999" stroke-width="1.5" marker-end="url(#arrGray)" fill="none" filter="url(#rough2)"/>
  <text x="260" y="244" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="186" y="252" width="150" height="44" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="261" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否：非冠军出局</text>
  <text x="261" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">Michael（107），3 &lt; 4</text>

  <!-- 是分支：排序 -->
  <path d="M 162 196 L 148 196" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="155" y="184" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是（并列全过）</text>

  <rect x="16" y="170" width="128" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ORDER BY dep_id</text>
  <text x="80" y="210" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">升序 ↑</text>

  <!-- 输出 -->
  <path d="M 80 224 L 80 262" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <rect x="16" y="264" width="152" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="92" y="284" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输出</text>
  <text x="92" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Joseph　　100</text>
  <text x="92" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Isabella　101</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 在⑤用 ORDER BY … LIMIT 1 截断会漏并列冠军——等值条件才并列安全</text>
</svg>
