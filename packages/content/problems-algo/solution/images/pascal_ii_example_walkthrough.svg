<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：rowIndex = 4</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同一数组反复刷新，最终得到第 4 行 [1,4,6,4,1]</text>

  <!-- index header -->
  <g font-size="9" fill="#aaa">
    <text x="155" y="72" text-anchor="middle">[0]</text>
    <text x="215" y="72" text-anchor="middle">[1]</text>
    <text x="275" y="72" text-anchor="middle">[2]</text>
    <text x="335" y="72" text-anchor="middle">[3]</text>
    <text x="395" y="72" text-anchor="middle">[4]</text>
  </g>

  <!-- ===== i=0 : [1,0,0,0,0] ===== -->
  <text x="80" y="100" text-anchor="end" font-size="11" fill="#888">i=0 初始</text>
  <g font-size="13" fill="#333">
    <rect x="127" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="155" y="104" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="187" y="82" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="104" text-anchor="middle" fill="#999">0</text>
    <rect x="247" y="82" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="275" y="104" text-anchor="middle" fill="#999">0</text>
    <rect x="307" y="82" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="104" text-anchor="middle" fill="#999">0</text>
    <rect x="367" y="82" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="395" y="104" text-anchor="middle" fill="#999">0</text>
  </g>

  <path d="M 280 120 L 280 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i=1 : [1,1,0,0,0]  j=1: 0+1=1 ===== -->
  <text x="80" y="158" text-anchor="end" font-size="11" fill="#888">i=1  j=1↓1</text>
  <g font-size="13" fill="#333">
    <rect x="127" y="140" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="155" y="162" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="187" y="140" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="162" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="247" y="140" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="275" y="162" text-anchor="middle" fill="#999">0</text>
    <rect x="307" y="140" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="162" text-anchor="middle" fill="#999">0</text>
    <rect x="367" y="140" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="395" y="162" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="215" y="190" text-anchor="middle" font-size="9" fill="#d6a040">= 0+1</text>

  <path d="M 280 194 L 280 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i=2 : [1,2,1,0,0] ===== -->
  <text x="80" y="232" text-anchor="end" font-size="11" fill="#888">i=2  j=2↓1</text>
  <g font-size="13" fill="#333">
    <rect x="127" y="214" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="155" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="187" y="214" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="236" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="247" y="214" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="275" y="236" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="307" y="214" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="236" text-anchor="middle" fill="#999">0</text>
    <rect x="367" y="214" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="395" y="236" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="215" y="264" text-anchor="middle" font-size="9" fill="#d6a040">=1+1</text>
  <text x="275" y="264" text-anchor="middle" font-size="9" fill="#d6a040">=0+1</text>

  <path d="M 280 268 L 280 282" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i=3 : [1,3,3,1,0] ===== -->
  <text x="80" y="306" text-anchor="end" font-size="11" fill="#888">i=3  j=3↓1</text>
  <g font-size="13" fill="#333">
    <rect x="127" y="288" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="155" y="310" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="187" y="288" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="247" y="288" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="275" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="307" y="288" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="367" y="288" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="395" y="310" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="215" y="338" text-anchor="middle" font-size="9" fill="#d6a040">=2+1</text>
  <text x="275" y="338" text-anchor="middle" font-size="9" fill="#d6a040">=1+2</text>
  <text x="335" y="338" text-anchor="middle" font-size="9" fill="#d6a040">=0+1</text>

  <path d="M 280 342 L 280 356" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i=4 : [1,4,6,4,1]  答案 ===== -->
  <text x="80" y="380" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">i=4 答案</text>
  <g font-size="13" fill="#333">
    <rect x="127" y="362" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="155" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="187" y="362" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="247" y="362" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="275" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="307" y="362" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="335" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="367" y="362" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="395" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- 右侧说明框 -->
  <rect x="445" y="288" width="100" height="108" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="495" y="308" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">图例</text>
  <rect x="458" y="318" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="482" y="328" font-size="9" fill="#666">初始/不变</text>
  <rect x="458" y="336" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="482" y="346" font-size="9" fill="#666">本行新写入</text>
  <rect x="458" y="354" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="482" y="364" font-size="9" fill="#666">最终答案</text>
  <rect x="458" y="372" width="16" height="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="482" y="382" font-size="9" fill="#666">未用到</text>
</svg>
