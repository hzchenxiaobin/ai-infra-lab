<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：num+1 → 二进制 → 去掉最高位 1</text>

  <!-- Step 1: input num -->
  <rect x="40" y="56" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="11" fill="#888">输入</text>
  <text x="80" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">num</text>

  <!-- arrow -->
  <path d="M 120 78 L 150 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: num + 1 -->
  <rect x="150" y="56" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="190" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+1</text>
  <text x="190" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">num+1</text>

  <!-- arrow -->
  <path d="M 230 78 L 260 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: to binary -->
  <rect x="260" y="56" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="305" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">转二进制</text>
  <text x="305" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1..."</text>

  <!-- arrow -->
  <path d="M 350 78 L 380 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: remove leading 1 -->
  <rect x="380" y="56" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">去掉最高位1</text>
  <text x="430" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">剩余 k 位</text>

  <!-- arrow down to result -->
  <path d="M 430 100 Q 430 116 260 116 L 260 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="180" y="134" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回编码字符串</text>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bin(num+1)[3:]</text>

  <!-- ===== Example walkthrough below ===== -->
  <text x="40" y="206" font-size="11" fill="#888" font-weight="bold">以 num = 10 为例：</text>

  <!-- pipeline example -->
  <rect x="40" y="218" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <path d="M 100 235 L 125 235" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="125" y="218" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="240" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">11</text>

  <path d="M 185 235 L 210 235" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="218" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1011"</text>

  <path d="M 290 235 L 315 235" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="315" y="218" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="355" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"011"</text>

  <path d="M 395 235 L 420 235" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="420" y="218" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"011"</text>

  <!-- annotation -->
  <text x="250" y="276" text-anchor="middle" font-size="10.5" fill="#888">num=10 属于第 3 组（7~14），偏移 = 10−7 = 3 = "011"（3 位二进制）</text>
  <text x="250" y="292" text-anchor="middle" font-size="10.5" fill="#888">而 10+1=11 = "1011"，去掉前导 "1" 恰好得到 "011" ✓</text>

  <!-- bottom note -->
  <rect x="60" y="306" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Python 一行：return bin(num + 1)[3:]　C++：位运算拼接 + 反转</text>
</svg>
