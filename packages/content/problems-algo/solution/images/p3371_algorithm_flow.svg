<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟建表 + 一趟枚举，O(n) 收工</text>

  <!-- 主流程 -->
  <rect x="170" y="42" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">计算 total = Σ nums</text>
  <path d="M 260 74 L 260 88" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="92" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">建哈希计数 cnt（值 → 次数）</text>
  <path d="M 260 124 L 260 138" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="142" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">枚举 s ∈ nums（充当「和」）</text>
  <path d="M 260 174 L 260 188" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="192" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cand = total − 2·s</text>
  <path d="M 260 224 L 260 238" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,242 348,272 260,302 172,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">存在性检查通过？</text>
  <text x="260" y="284" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">（cand == s 时需 ≥ 2 次）</text>

  <!-- 是 分支 -->
  <text x="272" y="316" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 302 L 260 322" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="326" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">ans = max(ans, cand)</text>

  <!-- 否 分支：从菱形右侧出 -->
  <text x="356" y="264" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 348 272 L 452 272" fill="none" stroke="#a07830" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 回环 -->
  <path d="M 350 342 L 452 342" fill="none" stroke="#a07830" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 452 342 L 452 130 L 272 130" fill="none" stroke="#a07830" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 272 130 L 272 138" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="124" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">取下一个 s（循环）</text>

  <!-- 出口 -->
  <path d="M 260 358 L 260 372" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="370" font-size="8.5" fill="#777" filter="url(#rough2)">全部枚举完</text>
  <rect x="170" y="374" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（题目保证有解）</text>
</svg>
