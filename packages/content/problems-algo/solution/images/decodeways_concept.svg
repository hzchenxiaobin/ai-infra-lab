<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：解码方法 = 爬楼梯 + 合法性约束</text>

  <!-- 爬楼梯 (左) -->
  <rect x="30" y="50" width="230" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="145" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">70 爬楼梯</text>
  <text x="145" y="94" text-anchor="middle" font-size="12.5" fill="#333">f[i] = f[i−1] + f[i−2]</text>
  <text x="145" y="113" text-anchor="middle" font-size="10.5" fill="#888">每次走 1 或 2 步，无约束</text>

  <!-- 解码 (右) -->
  <rect x="300" y="50" width="230" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">91 解码方法</text>
  <text x="415" y="94" text-anchor="middle" font-size="12" fill="#333">f[i] = f[i−1]·[1位合法] + f[i−2]·[2位合法]</text>
  <text x="415" y="113" text-anchor="middle" font-size="10.5" fill="#888">取 1 或 2 个字符，需合法</text>

  <!-- 中间箭头 -->
  <path d="M 260 86 L 300 86" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="9.5" fill="#888">加约束</text>

  <!-- 数字串示例 -->
  <text x="40" y="162" font-size="11.5" fill="#888">示例串 s = "226"</text>
  <rect x="120" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="166" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="212" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- 取1位 -->
  <rect x="330" y="172" width="210" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="191" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">取 1 位：s[i−1]</text>
  <text x="435" y="207" text-anchor="middle" font-size="10.5" fill="#333">合法 ⇔ s[i−1] ≠ '0'  →  f[i] += f[i−1]</text>

  <!-- 取2位 -->
  <rect x="330" y="222" width="210" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="241" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">取 2 位：s[i−2..i−1]</text>
  <text x="435" y="257" text-anchor="middle" font-size="10.5" fill="#333">合法 ⇔ 10 ≤ s[i−2..i−1] ≤ 26</text>
  <text x="435" y="269" text-anchor="middle" font-size="10.5" fill="#333">→  f[i] += f[i−2]</text>

  <!-- 编码表 -->
  <rect x="30" y="212" width="270" height="84" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="165" y="230" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">编码表  A→1 … Z→26</text>
  <text x="165" y="250" text-anchor="middle" font-size="11" fill="#333">单字符合法值：'1'..'9'（'0' 不映射字母）</text>
  <text x="165" y="268" text-anchor="middle" font-size="11" fill="#333">双字符合法值：10..26（'10'=J, '26'=Z）</text>
  <text x="165" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">⚠ '06'、'27'、'30' 均非法</text>

  <!-- 递推总结 -->
  <rect x="30" y="320" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">状态转移</text>
  <text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#333">f[i] = (s[i−1]≠'0' ? f[i−1] : 0) + (10≤s[i−2..i−1]≤26 ? f[i−2] : 0)</text>

  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888">初始 f[0]=1（空串一种解法）；非法分支贡献 0，相当于“此路不通”</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888">10 ≤ val 已隐含“首位非 0”，自动排除 '06' 这类前导零</text>
</svg>
