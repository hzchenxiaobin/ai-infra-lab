<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三段式 ⟺ 差分符号序列恰好三块：+ | − | +</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 nums = [1,3,5,4,2,6] 为例，p = 2（峰顶），q = 4（谷底）</text>

  <text x="226" y="66" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=2 ↓</text>
  <text x="378" y="66" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">q=4 ↓</text>

  <rect x="48" y="76" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="76" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="76" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="226" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="276" y="76" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="352" y="76" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="378" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="428" y="76" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <circle cx="112" cy="148" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="153" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">+</text>
  <circle cx="188" cy="148" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="153" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">+</text>
  <circle cx="264" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="153" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">−</text>
  <circle cx="340" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="153" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">−</text>
  <circle cx="416" cy="148" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+</text>

  <rect x="48" y="176" width="192" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">块① 严格增 ×2</text>
  <rect x="240" y="176" width="112" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296" y="194" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">块② 严格减 ×2</text>
  <rect x="352" y="176" width="128" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">块③ 严格增 ×1</text>

  <rect x="40" y="222" width="440" height="58" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">判定：块数 == 3 且首块为 “+” ⇔ 存在合法 (p, q)</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">反取 p = 块①长度（峰顶下标），q = 块①+②长度（谷底下标），自然满足 0 &lt; p &lt; q &lt; n−1</text>

  <rect x="40" y="296" width="440" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11.5" fill="#7a3a36" filter="url(#rough2)">✗ [2,1,3]：符号 − + → 只有 2 块且首块为 −（n=3 时 0&lt;p&lt;q&lt;n−1 无解）</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#7a3a36" filter="url(#rough2)">✗ [1,2,3,2,1]：符号 + + − − → 只有 2 块，缺尾段递增</text>
</svg>
