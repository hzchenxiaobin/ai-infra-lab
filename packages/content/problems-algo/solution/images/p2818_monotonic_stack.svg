<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    单调栈求 left[i] 和 right[i]
  </text>

  <!-- Left side: left[i] (>=) -->
  <text x="135" y="58" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    左→右扫描：弹 s[栈顶] &lt; s[i]，留 ≥
  </text>

  <!-- score array for left scan: s = [1, 2, 2, 2, 2, 2] -->
  <text x="40" y="88" font-size="11" fill="#666" filter="url(#rough2)">s[i]</text>
  <rect x="60" y="72" width="45" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="90" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="105" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="150" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="195" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="40" y="118" font-size="11" fill="#666" filter="url(#rough2)">left</text>
  <text x="82" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-1</text>
  <text x="127" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-1</text>
  <text x="172" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="217" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>

  <!-- Stack visualization for left scan -->
  <text x="40" y="148" font-size="11" fill="#666" filter="url(#rough2)">栈</text>

  <!-- i=0: stack empty → left[0]=-1, push 0. Stack: [0] -->
  <rect x="60" y="135" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="105" y="150" font-size="11" fill="#666" filter="url(#rough2)">← i=0 入栈</text>

  <!-- i=1: s[0]=1 < s[1]=2, pop 0. Stack empty → left[1]=-1, push 1. Stack: [1] -->
  <rect x="60" y="162" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="177" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0↓</text>
  <rect x="105" y="162" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="177" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="155" y="177" font-size="11" fill="#b85450" filter="url(#rough2)">弹0(s=1&lt;2)</text>

  <!-- i=2: s[1]=2 >= s[2]=2, stop. left[2]=1, push 2. Stack: [1,2] -->
  <rect x="60" y="189" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="105" y="189" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="204" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="155" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不弹(s=2≥2)</text>

  <!-- Right side: right[i] (>) -->
  <text x="370" y="58" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    右→左扫描：弹 s[栈顶] ≤ s[i]，留 &gt;
  </text>

  <text x="275" y="88" font-size="11" fill="#666" filter="url(#rough2)">s[i]</text>
  <rect x="295" y="72" width="45" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="90" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="340" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="385" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="430" y="72" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="275" y="118" font-size="11" fill="#666" filter="url(#rough2)">right</text>
  <text x="317" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="362" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="407" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <text x="452" y="118" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>

  <!-- Stack visualization for right scan -->
  <text x="275" y="148" font-size="11" fill="#666" filter="url(#rough2)">栈</text>

  <!-- i=5: stack empty → right[5]=6, push 5. Stack: [5] -->
  <rect x="430" y="135" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="340" y="150" font-size="11" fill="#666" filter="url(#rough2)">i=5 入栈 →</text>

  <!-- i=4: s[5]=2 <= s[4]=2, pop 5. Stack empty → right[4]=6, push 4. Stack: [4] -->
  <rect x="430" y="162" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="177" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">5↓</text>
  <rect x="385" y="162" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="405" y="177" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="300" y="177" font-size="11" fill="#b85450" filter="url(#rough2)">弹5(s=2≤2)</text>

  <!-- i=3: s[4]=2 <= s[3]=2, pop 4. Stack empty → right[3]=6, push 3. Stack: [3] -->
  <rect x="385" y="189" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="405" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4↓</text>
  <rect x="340" y="189" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="285" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">弹4(s=2≤2)</text>

  <!-- Key insight box -->
  <rect x="40" y="225" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    左侧用 ≥（同分也挡）→ 左边同分者下标更小，抢走资格
  </text>
  <text x="260" y="266" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    右侧用 &gt;（同分不挡）→ 右边同分者下标更大，不抢资格
  </text>

  <!-- Result: ranges table -->
  <text x="260" y="300" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    结果：ranges = [1, 10, 4, 3, 2, 1]
  </text>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    ∑ ranges = 21 = 6×7/2 = 子数组总数 ✓
  </text>

  <!-- Color legend -->
  <rect x="50" y="340" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="353" font-size="11" fill="#333" filter="url(#rough2)">栈中元素</text>
  <rect x="160" y="340" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="353" font-size="11" fill="#333" filter="url(#rough2)">被弹出</text>
  <rect x="260" y="340" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="286" y="353" font-size="11" fill="#333" filter="url(#rough2)">保留(s≥/s>)</text>
  <rect x="380" y="340" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="406" y="353" font-size="11" fill="#333" filter="url(#rough2)">score=1</text>
</svg>
