<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：逐位取 k 次方求和，与原数比较</text>

  <!-- ===== Section A: number 153 split into digits ===== -->
  <text x="40" y="52" font-size="11" fill="#446688" font-weight="bold">第 1 步：拆数 153 → 位数 k = 3，逐位取出</text>

  <!-- original number 153 -->
  <rect x="60" y="64" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">153</text>

  <!-- arrow splitting -->
  <path d="M 120 106 L 120 120" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- three digit boxes -->
  <rect x="50" y="128" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="75" y="152" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>

  <rect x="120" y="128" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="152" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">5</text>

  <rect x="190" y="128" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="152" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>

  <!-- k label -->
  <text x="280" y="148" font-size="12" fill="#888">位数</text>
  <rect x="312" y="134" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">k=3</text>

  <!-- ===== Section B: each digit to k-th power ===== -->
  <text x="40" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 步：每位取 k=3 次方</text>

  <!-- 1^3 = 1 -->
  <rect x="50" y="204" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="75" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="115" y="224" font-size="12" fill="#888">^3 =</text>
  <rect x="150" y="204" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 5^3 = 125 -->
  <rect x="50" y="240" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="75" y="260" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="115" y="260" font-size="12" fill="#888">^3 =</text>
  <rect x="150" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="260" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">125</text>

  <!-- 3^3 = 27 -->
  <rect x="50" y="276" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="75" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="115" y="296" font-size="12" fill="#888">^3 =</text>
  <rect x="150" y="276" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">27</text>

  <!-- ===== Section C: sum and compare ===== -->
  <text x="260" y="210" font-size="11" fill="#b85450" font-weight="bold">第 3 步：求和并比较</text>

  <!-- sum expression -->
  <rect x="250" y="224" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1 + 125 + 27 = 153</text>

  <!-- arrows from powers to sum -->
  <path d="M 190 219 C 220 219 230 236 250 236" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 190 255 C 220 255 230 241 250 241" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 190 291 C 220 291 230 246 250 246" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- compare box -->
  <path d="M 370 260 L 370 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="278" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="300" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">153 == 153  →  true</text>

  <!-- conclusion note -->
  <rect x="50" y="338" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">阿姆斯特朗数定义：k 位数 n，各位数字的 k 次方之和恰好等于 n</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#888">1–9 均为阿姆斯特朗数（k=1，d^1 = d）</text>
</svg>
