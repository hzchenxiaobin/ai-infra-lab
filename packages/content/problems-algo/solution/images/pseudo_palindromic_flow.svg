<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    前序 DFS 流程：dfs(node, mask)
  </text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    mask 按值传给左右子树，免回溯
  </text>

  <!-- 起始 -->
  <rect x="160" y="58" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="78" text-anchor="middle" font-size="13" fill="#224" filter="url(#rough2)">进入 dfs(node, mask)</text>

  <line x1="230" y1="88" x2="230" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="230,110 320,150 230,190 140,150" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">node 为空?</text>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（不构成路径）</text>

  <!-- 是 → return 0 -->
  <line x1="320" y1="150" x2="372" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="143" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="374" y="134" width="92" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="154" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">return 0</text>

  <!-- 否 ↓ -->
  <line x1="230" y1="190" x2="230" y2="210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- XOR 矩形 -->
  <rect x="120" y="212" width="220" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="13" fill="#2a5a2a" filter="url(#rough2)">
    mask ^= (1 &lt;&lt; node-&gt;val)   翻转奇偶位
  </text>

  <line x1="230" y1="246" x2="230" y2="262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 叶子判定菱形 -->
  <polygon points="230,264 340,300 230,336 120,300" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="298" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">叶子? (无左右孩子)</text>

  <!-- 否 → 右：递归左右 -->
  <line x1="340" y1="300" x2="372" y2="300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="374" y="282" width="146" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="447" y="300" text-anchor="middle" font-size="11" fill="#224" filter="url(#rough2)">return dfs(left, mask)</text>
  <text x="447" y="315" text-anchor="middle" font-size="11" fill="#224" filter="url(#rough2)">+ dfs(right, mask)</text>

  <!-- 是 ↓ -->
  <line x1="230" y1="336" x2="230" y2="352" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="348" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 掩码判定菱形 -->
  <polygon points="230,354 350,384 230,414 110,384" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="382" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">mask &amp; (mask−1) == 0 ?</text>
  <text x="230" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">至多一个奇频?</text>

  <!-- 是 → return 1 (左下) -->
  <line x1="110" y1="384" x2="78" y2="384" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="377" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="368" width="64" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="382" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">return 1</text>
  <text x="46" y="394" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">伪回文</text>

  <!-- 否 → return 0 (右下) -->
  <line x1="350" y1="384" x2="382" y2="384" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="377" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="384" y="368" width="80" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="424" y="388" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">return 0</text>
</svg>
