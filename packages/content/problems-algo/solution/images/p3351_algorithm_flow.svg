<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，每步 O(1) 更新两个桶</text>

  <!-- 开始 -->
  <rect x="185" y="38" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：cnt/sum 清零</text>
  <path d="M 260 70 L 260 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="150" y="92" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历 nums，取当前元素 x</text>
  <path d="M 260 128 L 260 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 读两桶 -->
  <rect x="92" y="150" width="336" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">c = cnt[x−1] + cnt[x+1]，s = sum[x−1] + sum[x+1]</text>
  <text x="260" y="182" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">（均对 10⁹+7 取模）</text>
  <path d="M 260 190 L 260 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 算增量 -->
  <rect x="92" y="212" width="336" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">dc = c + 1，ds = s + c·x + x（都取模）</text>
  <path d="M 260 248 L 260 266" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 更新桶 -->
  <rect x="92" y="270" width="336" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[x] += dc，sum[x] += ds</text>

  <!-- 循环回路 -->
  <path d="M 428 288 C 470 288, 478 110, 380 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="487" y="205" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)" transform="rotate(90 487 205)">还有元素？→ 回到遍历</text>
  <path d="M 260 306 L 260 322" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="130" y="326" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = Σ sum[v] mod (10⁹+7) ✓</text>
</svg>
