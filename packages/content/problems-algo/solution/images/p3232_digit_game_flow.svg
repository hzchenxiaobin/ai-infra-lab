<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历分桶求和，single ≠ dbl 即 true</text>

  <!-- 开始 -->
  <rect x="168" y="36" width="64" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="52" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 200 60 L 200 74" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="100" y="76" width="200" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">single = 0，dbl = 0，逐个取 x</text>
  <path d="M 200 104 L 200 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：x < 10 ? -->
  <polygon points="200,118 272,148 200,178 128,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x &lt; 10 ?</text>

  <!-- 是 → single += x -->
  <path d="M 272 148 L 328 148" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="133" width="86" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="373" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">single += x</text>
  <path d="M 416 148 C 446 148, 446 90, 304 90" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 否 → dbl += x -->
  <path d="M 200 178 L 200 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="212" y="190" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="140" y="194" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="212" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">dbl += x</text>
  <path d="M 140 208 C 94 208, 80 160, 96 90" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 遍历完毕 -->
  <path d="M 200 222 L 200 234" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="214" y="233" font-size="9.5" fill="#555" filter="url(#rough2)">元素取完</text>
  <rect x="152" y="236" width="96" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">遍历完毕</text>
  <path d="M 200 262 L 200 274" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：single != dbl ? -->
  <polygon points="200,276 268,302 200,328 132,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">single ≠ dbl ?</text>

  <!-- 是 → true -->
  <path d="M 268 302 L 302 302" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="285" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="304" y="285" width="192" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true（挑大桶获胜）</text>

  <!-- 否 → false -->
  <path d="M 132 302 L 100 302" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="116" y="294" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="24" y="285" width="192" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="306" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false（两和相等）</text>

  <!-- 脚注 -->
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">一趟遍历 + 一次比较：O(n) 时间 / O(1) 空间</text>
</svg>
