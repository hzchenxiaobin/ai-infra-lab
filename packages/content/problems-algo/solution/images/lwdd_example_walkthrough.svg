<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abpcplea"</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">排序后逐词判定，首个命中即返回</text>

  <!-- column headers -->
  <text x="60" y="68" font-size="10.5" fill="#888" font-weight="bold">序号</text>
  <text x="140" y="68" font-size="10.5" fill="#888" font-weight="bold">word</text>
  <text x="220" y="68" font-size="10.5" fill="#888" font-weight="bold">长度</text>
  <text x="280" y="68" font-size="10.5" fill="#888" font-weight="bold">子序列判定</text>
  <text x="470" y="68" font-size="10.5" fill="#888" font-weight="bold">结果</text>
  <line x1="40" y1="74" x2="510" y2="74" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: monkey (fail) -->
  <rect x="42" y="82" width="470" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)" opacity="0.5"/>
  <text x="60" y="110" font-size="11" fill="#555">0</text>
  <text x="140" y="110" font-size="11.5" fill="#333" font-weight="bold">"monkey"</text>
  <text x="220" y="110" font-size="11" fill="#333">6</text>
  <text x="280" y="104" font-size="10.5" fill="#b85450">s 中无 'm'</text>
  <text x="280" y="118" font-size="10.5" fill="#b85450">首字符即匹配失败</text>
  <text x="470" y="110" font-size="11" fill="#b85450" font-weight="bold">✗ 跳过</text>

  <!-- Row 1: apple (hit) - highlighted -->
  <rect x="42" y="138" width="470" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="174" font-size="11" fill="#555">1</text>
  <text x="140" y="174" font-size="11.5" fill="#333" font-weight="bold">"apple"</text>
  <text x="220" y="174" font-size="11" fill="#333">5</text>
  <!-- matching positions -->
  <text x="280" y="160" font-size="10.5" fill="#4a7a3a">a→s[0], p→s[2], p→s[4]</text>
  <text x="280" y="176" font-size="10.5" fill="#4a7a3a">l→s[5], e→s[6]</text>
  <text x="280" y="192" font-size="9.5" fill="#888" font-style="italic">双指针贪心，全部匹配</text>
  <text x="470" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 返回</text>

  <!-- Row 2: plea (not checked) -->
  <rect x="42" y="210" width="470" height="40" rx="6" fill="#f7f7f7" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="234" font-size="11" fill="#999">2</text>
  <text x="140" y="234" font-size="11.5" fill="#999">"plea"</text>
  <text x="220" y="234" font-size="11" fill="#999">4</text>
  <text x="280" y="234" font-size="10.5" fill="#999" font-style="italic">（已提前返回，无需判定）</text>
  <text x="470" y="234" font-size="11" fill="#999">— 跳过</text>

  <!-- Row 3: ale (not checked) -->
  <rect x="42" y="258" width="470" height="40" rx="6" fill="#f7f7f7" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="11" fill="#999">3</text>
  <text x="140" y="282" font-size="11.5" fill="#999">"ale"</text>
  <text x="220" y="282" font-size="11" fill="#999">3</text>
  <text x="280" y="282" font-size="10.5" fill="#999" font-style="italic">（已提前返回，无需判定）</text>
  <text x="470" y="282" font-size="11" fill="#999">— 跳过</text>

  <!-- s index reference -->
  <rect x="40" y="312" width="470" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="10.5" fill="#888">s 下标:</text>
  <text x="120" y="332" font-size="10.5" fill="#444" font-weight="bold">a(0) b(1) p(2) c(3) p(4) l(5) e(6) a(7)</text>
  <text x="60" y="352" font-size="10.5" fill="#4a7a3a">匹配 "apple":</text>
  <text x="170" y="352" font-size="10.5" fill="#4a7a3a" font-weight="bold">a(0)→p(2)→p(4)→l(5)→e(6) ✓</text>
</svg>
