<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 6, 5, 1, 8]</text>

  <!-- Column x positions: step=70/46, num=116/46, r=162/40, dp0=202/92, dp1=294/92, dp2=386/92 -->
  <!-- Header row -->
  <rect x="70" y="40" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <rect x="116" y="40" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">num</text>
  <rect x="162" y="40" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r</text>
  <rect x="202" y="40" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[0]</text>
  <rect x="294" y="40" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="59" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[1]</text>
  <rect x="386" y="40" width="92" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="59" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp[2]</text>

  <!-- init row -->
  <rect x="70" y="72" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="91" text-anchor="middle" font-size="11" fill="#888">init</text>
  <rect x="116" y="72" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="91" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <rect x="162" y="72" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="182" y="91" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <rect x="202" y="72" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="294" y="72" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="91" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <rect x="386" y="72" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="91" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>

  <!-- step 1: num=3, r=0 -> dp[0]=3 -->
  <rect x="70" y="104" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="123" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="116" y="104" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="162" y="104" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="202" y="104" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="294" y="104" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="123" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <rect x="386" y="104" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="123" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>

  <!-- step 2: num=6, r=0 -> dp[0]=9 -->
  <rect x="70" y="136" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="155" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="116" y="136" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="162" y="136" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="202" y="136" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="294" y="136" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <rect x="386" y="136" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="155" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>

  <!-- step 3: num=5, r=2 -> dp[2]=14 (from dp[0]+5) -->
  <rect x="70" y="168" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="187" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="116" y="168" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="162" y="168" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="187" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="202" y="168" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="187" text-anchor="middle" font-size="11" fill="#888">9</text>
  <rect x="294" y="168" width="92" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="187" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <rect x="386" y="168" width="92" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="187" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">14</text>

  <!-- step 4: num=1, r=1 -> dp[0]=15 (dp[2]+1), dp[1]=10 (dp[0]+1) -->
  <rect x="70" y="200" width="46" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="219" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="116" y="200" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="162" y="200" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="219" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="202" y="200" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">15</text>
  <rect x="294" y="200" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">10</text>
  <rect x="386" y="200" width="92" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="219" text-anchor="middle" font-size="11" fill="#888">14</text>

  <!-- step 5: num=8, r=2 -> dp[0]=18(dp[1]+8), dp[1]=22(dp[2]+8), dp[2]=23(dp[0]+8) -->
  <rect x="70" y="232" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="93" y="251" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="116" y="232" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="162" y="232" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="251" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="202" y="232" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">18</text>
  <rect x="294" y="232" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="251" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">22</text>
  <rect x="386" y="232" width="92" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="251" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">23</text>

  <!-- Summary box -->
  <rect x="70" y="284" width="410" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="275" y="306" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每步读旧 dp、写新 new_dp，加粗为发生变化的格子</text>
  <text x="275" y="326" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 dp[0] = 18 ✓（对应子集 3+6+1+8）</text>

  <!-- Legend -->
  <text x="492" y="306" font-size="9.5" fill="#888">★ 高亮</text>
  <text x="492" y="320" font-size="9.5" fill="#888">＝本步</text>
  <text x="492" y="334" font-size="9.5" fill="#888">更新值</text>
</svg>
