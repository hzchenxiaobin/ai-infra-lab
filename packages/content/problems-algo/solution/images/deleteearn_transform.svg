<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转换：把 nums 按值求和 → 变成打家劫舍</text>

  <!-- nums row label -->
  <text x="30" y="64" font-size="12" fill="#888">nums:</text>
  <!-- nums = [2,2,3,3,3,4] -->
  <rect x="70" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="68" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="116" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="68" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="162" y="48" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="68" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="208" y="48" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="68" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="254" y="48" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="68" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="300" y="48" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="68" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- color legend -->
  <text x="360" y="64" font-size="10.5" fill="#888">值 2 出现 2 次 → 点数 4</text>
  <text x="360" y="80" font-size="10.5" fill="#888">值 3 出现 3 次 → 点数 9</text>

  <!-- Arrow down: transform -->
  <path d="M 200 86 L 200 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="210" y="102" font-size="11" fill="#d6a040" font-weight="bold">统计总值</text>

  <!-- points row label -->
  <text x="20" y="142" font-size="12" fill="#888">points:</text>
  <!-- index header -->
  <text x="91" y="130" text-anchor="middle" font-size="9.5" fill="#aaa">下标1</text>
  <text x="155" y="130" text-anchor="middle" font-size="9.5" fill="#aaa">下标2</text>
  <text x="219" y="130" text-anchor="middle" font-size="9.5" fill="#aaa">下标3</text>
  <text x="283" y="130" text-anchor="middle" font-size="9.5" fill="#aaa">下标4</text>

  <rect x="70" y="134" width="42" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="91" y="154" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="134" y="134" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="154" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="198" y="134" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="262" y="134" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="154" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- conflict annotation: take 3 forbids 2 and 4 -->
  <path d="M 219 168 L 155 188" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 219 168 L 283 188" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="219" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">取 3</text>

  <rect x="120" y="188" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="206" text-anchor="middle" font-size="10.5" fill="#b85450">禁取 2</text>
  <rect x="248" y="188" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="283" y="206" text-anchor="middle" font-size="10.5" fill="#b85450">禁取 4</text>

  <!-- equivalence box -->
  <rect x="80" y="232" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">相邻下标不能同时取 ⟺ 打家劫舍</text>
  <text x="280" y="271" text-anchor="middle" font-size="11" fill="#555">dp[i] = max(dp[i−1], dp[i−2] + points[i])</text>

  <!-- footer -->
  <rect x="80" y="294" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11.5" fill="#444">取了值 x 获点数 points[x]，但 x−1 与 x+1 作废</text>
  <text x="280" y="331" text-anchor="middle" font-size="11" fill="#888">下标天然相邻 → 直接套用 198 打家劫舍模板</text>
</svg>
