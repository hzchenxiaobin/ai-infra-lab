<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [−1, 10, −1, 8]</text>

  <!-- padded array -->
  <text x="30" y="62" font-size="13" fill="#4a7a3a" filter="url(#rough2)">补哨兵后：</text>
  <rect x="120" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="64" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">10</text>
  <rect x="168" y="44" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="64" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">−1</text>
  <rect x="216" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="264" y="44" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="64" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">−1</text>
  <rect x="312" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="360" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="64" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">8</text>
  <text x="418" y="64" font-size="12" fill="#555" filter="url(#rough2)">← 哨兵</text>
  <text x="30" y="96" font-size="13" fill="#555" filter="url(#rough2)">两个间隙：(10,10) 单段、(10,8) 单段；mn = 8</text>

  <!-- d = 0 table -->
  <rect x="36" y="116" width="448" height="110" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="140" font-size="14" fill="#b85450" filter="url(#rough2)">试 d = 0：x = mn + d = 8</text>
  <text x="60" y="162" font-size="12" fill="#555" filter="url(#rough2)">间隙 (10,10)：hi = 10 &gt; mn+2d = 8 → y ∈ [10−0, 10+0] = [10, 10]</text>
  <text x="60" y="182" font-size="12" fill="#555" filter="url(#rough2)">间隙 (10,8)：hi = 10 &gt; 8 → y ∈ [10−0, 8+0] = [10, 8] 空集！</text>
  <text x="60" y="208" font-size="13" fill="#b85450" filter="url(#rough2)">交集为空 → d = 0 不可行 ✗</text>

  <!-- d = 1 table -->
  <rect x="36" y="240" width="448" height="122" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="264" font-size="14" fill="#4a7a3a" filter="url(#rough2)">试 d = 1：x = 8 + 1 = 9，x 够得着 ≤ mn+2d = 10 的一切</text>
  <text x="60" y="286" font-size="12" fill="#555" filter="url(#rough2)">间隙 (10,10)：hi = 10 ≤ 10 → x 单独搞定（|10−9| = 1 ≤ 1 ✓）</text>
  <text x="60" y="306" font-size="12" fill="#555" filter="url(#rough2)">间隙 (10,8)：hi = 10 ≤ 10 → x 单独搞定（max(1,1) ≤ 1 ✓）</text>
  <text x="60" y="330" font-size="12" fill="#555" filter="url(#rough2)">y 无任何约束（比如也取 9）</text>
  <text x="60" y="352" font-size="13" fill="#4a7a3a" filter="url(#rough2)">d = 1 可行 ✓ → 答案 1，如 [9,10,9,8]，与官方 (11,9) 殊途同归</text>

  <path d="M 260 360 L 260 372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" opacity="0"/>
</svg>
