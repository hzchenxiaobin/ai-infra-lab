<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：GROUP BY sell_date → 去重计数 + 拼接产品名</text>
  <text x="330" y="46" text-anchor="middle" font-size="10.5" fill="#888">COUNT(DISTINCT product) + GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',')</text>

  <!-- ===== Activities table (left) ===== -->
  <text x="130" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Activities</text>
  <!-- header -->
  <rect x="20" y="80" width="220" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="97" text-anchor="middle" font-size="10.5" fill="#333">sell_date</text>
  <text x="175" y="97" text-anchor="middle" font-size="10.5" fill="#333">product</text>

  <!-- row 1: 05-30 Headphone -->
  <rect x="20" y="106" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="10.5" fill="#333">2020-05-30</text>
  <text x="175" y="122" text-anchor="middle" font-size="10.5" fill="#446688">Headphone</text>

  <!-- row 2: 05-30 Basketball -->
  <rect x="20" y="130" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="10.5" fill="#333">2020-05-30</text>
  <text x="175" y="146" text-anchor="middle" font-size="10.5" fill="#446688">Basketball</text>

  <!-- row 3: 05-30 T-Shirt -->
  <rect x="20" y="154" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="10.5" fill="#333">2020-05-30</text>
  <text x="175" y="170" text-anchor="middle" font-size="10.5" fill="#446688">T-Shirt</text>

  <!-- row 4: 06-01 Pencil -->
  <rect x="20" y="178" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="194" text-anchor="middle" font-size="10.5" fill="#333">2020-06-01</text>
  <text x="175" y="194" text-anchor="middle" font-size="10.5" fill="#446688">Pencil</text>

  <!-- row 5: 06-01 Bible -->
  <rect x="20" y="202" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="218" text-anchor="middle" font-size="10.5" fill="#333">2020-06-01</text>
  <text x="175" y="218" text-anchor="middle" font-size="10.5" fill="#446688">Bible</text>

  <!-- row 6: 06-02 Mask -->
  <rect x="20" y="226" width="220" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="242" text-anchor="middle" font-size="10.5" fill="#333">2020-06-02</text>
  <text x="175" y="242" text-anchor="middle" font-size="10.5" fill="#446688">Mask</text>

  <!-- row 7: 06-02 Mask (duplicate) -->
  <rect x="20" y="250" width="220" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="266" text-anchor="middle" font-size="10.5" fill="#333">2020-06-02</text>
  <text x="175" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">Mask</text>
  <text x="232" y="264" font-size="9" fill="#b85450">←重复</text>

  <!-- ===== Group brackets ===== -->
  <text x="380" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="380" y="86" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">sell_date</text>

  <!-- bracket 1: 05-30 (rows 1-3) -->
  <path d="M 248 110 L 256 110 L 256 170 L 248 170" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 256 140 L 290 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bracket 2: 06-01 (rows 4-5) -->
  <path d="M 248 182 L 256 182 L 256 222 L 248 222" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 256 202 L 290 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bracket 3: 06-02 (rows 6-7, includes duplicate) -->
  <path d="M 248 230 L 256 230 L 256 270 L 248 270" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 256 250 L 290 250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Result table (right) ===== -->
  <text x="500" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果</text>
  <rect x="300" y="80" width="340" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="97" text-anchor="middle" font-size="10" fill="#333">sell_date</text>
  <text x="430" y="97" text-anchor="middle" font-size="10" fill="#333">num_sold</text>
  <text x="560" y="97" text-anchor="middle" font-size="10" fill="#333">products</text>

  <!-- result row 1: 05-30, 3, Basketball,Headphone,T-Shirt -->
  <rect x="300" y="120" width="340" height="36" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="142" text-anchor="middle" font-size="10.5" fill="#333">2020-05-30</text>
  <rect x="408" y="128" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="560" y="142" text-anchor="middle" font-size="9" fill="#446688">Basketball,Headphone,T-Shirt</text>

  <!-- result row 2: 06-01, 2, Bible,Pencil -->
  <rect x="300" y="182" width="340" height="36" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="10.5" fill="#333">2020-06-01</text>
  <rect x="408" y="190" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="560" y="204" text-anchor="middle" font-size="9" fill="#446688">Bible,Pencil</text>

  <!-- result row 3: 06-02, 1, Mask -->
  <rect x="300" y="232" width="340" height="36" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="254" text-anchor="middle" font-size="10.5" fill="#333">2020-06-02</text>
  <rect x="408" y="240" width="44" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="560" y="254" text-anchor="middle" font-size="9" fill="#446688">Mask</text>

  <!-- ===== Bottom formula box ===== -->
  <rect x="40" y="310" width="580" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">两个聚合函数并行：COUNT(DISTINCT) 去重计数 + GROUP_CONCAT(DISTINCT) 去重拼接</text>
  <text x="330" y="348" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',') → 词典序 + 逗号分隔</text>

  <!-- footer -->
  <text x="330" y="384" text-anchor="middle" font-size="10.5" fill="#888">同日多行 → 一行结果；DISTINCT 去重；ORDER BY product 保证词典序；SEPARATOR ',' 逗号拼接</text>
  <text x="330" y="402" text-anchor="middle" font-size="10" fill="#aaa">06-02 的两行 Mask 去重后仅计 1 个产品，products 列只出现一次 "Mask"</text>
</svg>
