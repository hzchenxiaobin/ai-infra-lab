<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[3,7,8,1,1,5]，space=2，逐元素建表 → 选最大组</text>

  <!-- nums row -->
  <text x="34" y="60" font-size="11" fill="#888">nums=</text>
  <rect x="100" y="40" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="62" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="140" y="40" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="159" y="62" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="180" y="40" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="62" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="220" y="40" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="239" y="62" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="260" y="40" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="279" y="62" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="300" y="40" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="319" y="62" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="360" y="60" font-size="11" fill="#888">space=2</text>

  <!-- Arrow -->
  <path d="M 270 78 L 270 96" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="91" font-size="11" fill="#446688">逐元素按 r=v%2 更新 cnt[r] 与 min[r]</text>

  <!-- Table header -->
  <rect x="30" y="100" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">遍历 v</text>
  <text x="190" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">r = v%2</text>
  <text x="330" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cnt[r] 更新后</text>
  <text x="460" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">min[r] 更新后</text>
  <path d="M 130 100 L 130 268" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 250 100 L 250 268" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 400 100 L 400 268" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Row 1: v=3 r=1 -->
  <rect x="30" y="128" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="147" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="190" y="147" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="330" y="147" text-anchor="middle" font-size="12" fill="#333">cnt[1] = 1</text>
  <text x="460" y="147" text-anchor="middle" font-size="12" fill="#333">min[1] = 3</text>

  <!-- Row 2: v=7 r=1 -->
  <rect x="30" y="156" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="190" y="175" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="330" y="175" text-anchor="middle" font-size="12" fill="#333">cnt[1] = 2</text>
  <text x="460" y="175" text-anchor="middle" font-size="12" fill="#333">min[1] = 3</text>

  <!-- Row 3: v=8 r=0 -->
  <rect x="30" y="184" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="203" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="190" y="203" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="330" y="203" text-anchor="middle" font-size="12" fill="#333">cnt[0] = 1</text>
  <text x="460" y="203" text-anchor="middle" font-size="12" fill="#333">min[0] = 8</text>

  <!-- Row 4: v=1 r=1 -->
  <rect x="30" y="212" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="190" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a">1</text>
  <text x="330" y="231" text-anchor="middle" font-size="12" fill="#333">cnt[1] = 3</text>
  <text x="460" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min[1] = 1 ↓</text>

  <!-- Row 5: v=1 r=1 -->
  <rect x="30" y="240" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="259" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="190" y="259" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="330" y="259" text-anchor="middle" font-size="12" fill="#333">cnt[1] = 4</text>
  <text x="460" y="259" text-anchor="middle" font-size="12" fill="#333">min[1] = 1</text>

  <!-- Row 6: v=5 r=1 -->
  <rect x="30" y="268" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="287" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="190" y="287" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="330" y="287" text-anchor="middle" font-size="12" fill="#333">cnt[1] = 5</text>
  <text x="460" y="287" text-anchor="middle" font-size="12" fill="#333">min[1] = 1</text>

  <!-- Arrow to groups -->
  <path d="M 270 296 L 270 312" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="307" font-size="11" fill="#4a7a3a">建表完成：两组 r=1 与 r=0</text>

  <!-- Group summary boxes -->
  <rect x="30" y="316" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="44" y="338" font-size="12.5" fill="#4a7a3a" font-weight="bold">余数 r=1：cnt = 5，min = 1</text>
  <text x="280" y="338" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold">★ 最大组</text>
  <text x="170" y="357" text-anchor="middle" font-size="11" fill="#4a7a3a">seed = min = 1 即摧毁全组 5 个</text>

  <rect x="330" y="316" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="338" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">余数 r=0：cnt=1，min=8</text>
  <text x="420" y="357" text-anchor="middle" font-size="11" fill="#888">仅摧毁 1 个</text>

  <!-- Arrow to result -->
  <path d="M 170 366 L 170 384" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="180" y="380" font-size="11" fill="#4a7a3a">最大组 cnt=5 → 其 min=1 → ans</text>

  <!-- Result -->
  <rect x="150" y="388" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="416" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 1 ✓</text>

  <!-- Notes -->
  <text x="30" y="448" font-size="10.5" fill="#888">• v=1 时 min[1] 由 3 降为 1（组内最小更新）；最终该组 min=1 即所选 seed</text>
</svg>
