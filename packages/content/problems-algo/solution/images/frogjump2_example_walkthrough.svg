<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：stones = [0,2,5,6,7]，枚举 i 求 stones[i+2]−stones[i]</text>

  <!-- ====== Table header ====== -->
  <rect x="50" y="44" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="240" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">stones[i]</text>
  <text x="360" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">stones[i+2]</text>
  <text x="450" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">差值</text>

  <!-- column separators -->
  <path d="M 180 44 L 180 190" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 300 44 L 300 190" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 410 44 L 410 190" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ====== Row 1: i=0 (max, highlighted) ====== -->
  <rect x="50" y="74" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="240" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="95" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="450" y="95" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">5 ★</text>

  <!-- ====== Row 2: i=1 ====== -->
  <rect x="50" y="110" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="240" y="129" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="360" y="129" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="450" y="129" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- ====== Row 3: i=2 ====== -->
  <rect x="50" y="142" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="240" y="161" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="360" y="161" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="450" y="161" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ====== Max row ====== -->
  <path d="M 270 190 L 270 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="206" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max(5, 4, 2) = 5</text>

  <!-- ====== Two paths verification ====== -->
  <rect x="50" y="250" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a">去路 0→2→4：跳 {5, 2}，max = 5</text>

  <rect x="50" y="276" width="440" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#d6a040">回路 4→3→1→0：跳 {1, 4, 2}，max = 4</text>

  <!-- ====== Bottom note ====== -->
  <rect x="30" y="306" width="480" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="10.5" fill="#555">i 从 0 取到 n−3（=2），逐项算 stones[i+2]−stones[i] 取最大即可</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#b85450">下界（鸽巢）= 上界（交错构造）= 5，故 5 即为最小代价</text>
</svg>
