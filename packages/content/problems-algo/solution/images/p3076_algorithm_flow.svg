<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先全量建表，再逐串回答</text>

  <!-- phase 1 -->
  <rect x="20" y="42" width="250" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：建表</text>

  <rect x="38" y="78" width="214" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">for i in 0..n−1（每个字符串）</text>

  <rect x="38" y="112" width="214" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">for l in 0..m−1, r in l+1..m</text>

  <rect x="38" y="146" width="214" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="164" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">mask[ s[l:r] ] |= 1 &lt;&lt; i</text>

  <text x="145" y="192" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">≤ 21000 个子串键，归属一次算清</text>
  <text x="145" y="210" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">重复出现 → 同一位，天然去重</text>

  <path d="M 145 208 L 145 232" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- phase 2 -->
  <rect x="20" y="236" width="250" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="145" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">阶段二：回答 answer[i]</text>

  <rect x="38" y="270" width="214" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="287" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">枚举 arr[i] 的每个子串 s</text>

  <path d="M 252 282 L 290 282" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamonds -->
  <polygon points="352,258 420,282 352,306 284,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="352" y="280" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">mask[s]</text>
  <text x="352" y="294" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">== 1&lt;&lt;i ?</text>

  <path d="M 420 282 L 452 282" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="352" y="322" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否 → 跳过</text>

  <rect x="456" y="256" width="88" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(len(s), s) &lt;</text>
  <text x="500" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(len(best), best)?</text>

  <path d="M 500 308 L 500 330" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="334" width="152" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="352" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">best = s（打擂更新）</text>

  <rect x="284" y="334" width="118" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="343" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">结束：ans[i] = best</text>

  <!-- right side warning -->
  <rect x="300" y="42" width="244" height="176" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="422" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">⚠️ 两个易错点</text>
  <text x="312" y="92" font-size="10" fill="#555" filter="url(#rough2)">① 同长度候选的「位置序」</text>
  <text x="312" y="108" font-size="10" fill="#555" filter="url(#rough2)">   ≠「字典序」：</text>
  <text x="312" y="124" font-size="10" fill="#555" filter="url(#rough2)">   "cab" 枚举出 ca, ab，</text>
  <text x="312" y="140" font-size="10" fill="#555" filter="url(#rough2)">   胜者却是 ab —— 必须显式</text>
  <text x="312" y="156" font-size="10" fill="#555" filter="url(#rough2)">   用元组比较，不能依赖顺序</text>
  <text x="312" y="182" font-size="10" fill="#555" filter="url(#rough2)">② 子串长度 ≥ 1，空串可安全</text>
  <text x="312" y="198" font-size="10" fill="#555" filter="url(#rough2)">   充当「未命中」哨兵：</text>
  <text x="312" y="214" font-size="10" fill="#555" filter="url(#rough2)">   循环完 best 仍为 "" 即无解</text>
</svg>
