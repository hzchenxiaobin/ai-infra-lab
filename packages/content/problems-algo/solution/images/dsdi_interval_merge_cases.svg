<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">addNum(value) 的五种合并情形</text>
  <path d="M 220 34 Q 380 42 540 34" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#999">floor = 最大 start ≤ value 的区间 · ceiling = 最小 start &gt; value 的区间</text>

  <!-- ===== Case 1: value already inside floor ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="64" width="700" height="74" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>
  </g>
  <text x="44" y="82" font-size="11" fill="#7a5415" font-weight="bold">情形① value 已被 floor 覆盖 → 直接返回（no-op）</text>

  <!-- number line -->
  <g filter="url(#rough2)"><line x1="60" y1="116" x2="520" y2="116" stroke="#bbb" stroke-width="1"/></g>
  <g font-size="9" fill="#aaa">
    <text x="60" y="128">1</text><text x="140" y="128">3</text><text x="200" y="128">5</text><text x="260" y="128">7</text>
  </g>
  <!-- floor interval covering value=5 -->
  <g filter="url(#rough2)"><rect x="80" y="104" width="140" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="150" y="119" text-anchor="middle" font-size="10" fill="#446688">[1, 6]</text>
  <!-- value marker -->
  <g filter="url(#rough2)"><circle cx="200" cy="115" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">value=5</text>
  <!-- result note -->
  <text x="540" y="110" font-size="10" fill="#4a7a3a" font-weight="bold">floor.end ≥ value</text>
  <text x="540" y="124" font-size="10" fill="#4a7a3a">→ 无需操作</text>

  <!-- ===== Case 2: value bridges floor and ceiling ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="146" width="700" height="74" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>
  </g>
  <text x="44" y="164" font-size="11" fill="#7a5415" font-weight="bold">情形② value 恰好桥接 floor 与 ceiling → 三段合一</text>

  <g filter="url(#rough2)"><line x1="60" y1="198" x2="520" y2="198" stroke="#bbb" stroke-width="1"/></g>
  <g font-size="9" fill="#aaa">
    <text x="80" y="210">1</text><text x="200" y="210">4</text><text x="280" y="210">6</text><text x="380" y="210">9</text>
  </g>
  <!-- floor [1,3] -->
  <g filter="url(#rough2)"><rect x="80" y="186" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="201" text-anchor="middle" font-size="10" fill="#446688">[1,3]</text>
  <!-- value=4 -->
  <g filter="url(#rough2)"><circle cx="200" cy="197" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">value=4</text>
  <!-- ceiling [5,8] -->
  <g filter="url(#rough2)"><rect x="220" y="186" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="270" y="201" text-anchor="middle" font-size="10" fill="#446688">[5,8]</text>
  <!-- result -->
  <text x="540" y="190" font-size="10" fill="#d6a040" font-weight="bold">floor.end+1==value</text>
  <text x="540" y="204" font-size="10" fill="#d6a040" font-weight="bold">&amp; ceiling.start==value+1</text>
  <text x="540" y="218" font-size="10" fill="#4a7a3a">→ 合并 [1,8]</text>

  <!-- ===== Case 3: value extends floor ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="228" width="700" height="74" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>
  </g>
  <text x="44" y="246" font-size="11" fill="#7a5415" font-weight="bold">情形③ value 紧贴 floor 右端 → 扩展 floor</text>

  <g filter="url(#rough2)"><line x1="60" y1="280" x2="520" y2="280" stroke="#bbb" stroke-width="1"/></g>
  <g font-size="9" fill="#aaa">
    <text x="80" y="292">1</text><text x="200" y="292">5</text><text x="380" y="292">10</text>
  </g>
  <!-- floor [1,4] -->
  <g filter="url(#rough2)"><rect x="80" y="268" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="283" text-anchor="middle" font-size="10" fill="#446688">[1,4]</text>
  <!-- value=5 -->
  <g filter="url(#rough2)"><circle cx="200" cy="279" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="200" y="264" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">value=5</text>
  <text x="540" y="276" font-size="10" fill="#d6a040" font-weight="bold">floor.end+1==value</text>
  <text x="540" y="290" font-size="10" fill="#4a7a3a">→ 扩展为 [1,5]</text>

  <!-- ===== Case 4: value extends ceiling ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="310" width="700" height="74" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>
  </g>
  <text x="44" y="328" font-size="11" fill="#7a5415" font-weight="bold">情形④ value 紧贴 ceiling 左端 → 扩展 ceiling</text>

  <g filter="url(#rough2)"><line x1="60" y1="362" x2="520" y2="362" stroke="#bbb" stroke-width="1"/></g>
  <g font-size="9" fill="#aaa">
    <text x="120" y="374">3</text><text x="200" y="374">5</text><text x="340" y="374">9</text>
  </g>
  <!-- value=4 -->
  <g filter="url(#rough2)"><circle cx="200" cy="361" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="200" y="346" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">value=4</text>
  <!-- ceiling [5,8] -->
  <g filter="url(#rough2)"><rect x="220" y="350" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="270" y="365" text-anchor="middle" font-size="10" fill="#446688">[5,8]</text>
  <text x="540" y="358" font-size="10" fill="#d6a040" font-weight="bold">ceiling.start==value+1</text>
  <text x="540" y="372" font-size="10" fill="#4a7a3a">→ 扩展为 [4,8]</text>

  <!-- ===== Case 5: standalone ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="392" width="700" height="74" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>
  </g>
  <text x="44" y="410" font-size="11" fill="#7a5415" font-weight="bold">情形⑤ value 孤立 → 新增单点区间 [value, value]</text>

  <g filter="url(#rough2)"><line x1="60" y1="444" x2="520" y2="444" stroke="#bbb" stroke-width="1"/></g>
  <g font-size="9" fill="#aaa">
    <text x="80" y="456">1</text><text x="200" y="456">7</text><text x="380" y="456">15</text>
  </g>
  <!-- floor [1,3] -->
  <g filter="url(#rough2)"><rect x="80" y="432" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="110" y="447" text-anchor="middle" font-size="10" fill="#446688">[1,3]</text>
  <!-- value=7 -->
  <g filter="url(#rough2)"><circle cx="200" cy="443" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="200" y="428" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">value=7</text>
  <!-- ceiling [9,12] -->
  <g filter="url(#rough2)"><rect x="240" y="432" width="80" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="447" text-anchor="middle" font-size="10" fill="#446688">[9,12]</text>
  <text x="540" y="440" font-size="10" fill="#d6a040" font-weight="bold">两端均不邻接</text>
  <text x="540" y="454" font-size="10" fill="#4a7a3a">→ 插入 [7,7]</text>

  <!-- bottom note -->
  <text x="380" y="486" text-anchor="middle" font-size="10" fill="#888">所有情形均由 upper_bound(value) 一次查找定位 floor/ceiling，O(log n) 完成</text>
</svg>
