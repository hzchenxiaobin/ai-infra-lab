<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：command = "G()()()()(al)"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">单指针 i 扫描，每步按首字符分支决定 token 长度与输出</text>

  <!-- Input string strip -->
  <g filter="url(#rough2)">
    <rect x="62" y="56" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="90" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="118" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="146" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="258" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="286" y="56" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="56" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="76" y="78" fill="#4a7a3a">G</text>
    <text x="104" y="78" fill="#446688">(</text>
    <text x="132" y="78" fill="#446688">)</text>
    <text x="160" y="78" fill="#446688">(</text>
    <text x="188" y="78" fill="#446688">)</text>
    <text x="216" y="78" fill="#446688">(</text>
    <text x="244" y="78" fill="#446688">)</text>
    <text x="272" y="78" fill="#446688">(</text>
    <text x="300" y="78" fill="#446688">)</text>
    <text x="342" y="78" fill="#d6a040">(al)</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="76" y="104">0</text>
    <text x="104" y="104">1</text>
    <text x="132" y="104">2</text>
    <text x="160" y="104">3</text>
    <text x="188" y="104">4</text>
    <text x="216" y="104">5</text>
    <text x="244" y="104">6</text>
    <text x="272" y="104">7</text>
    <text x="300" y="104">8</text>
    <text x="342" y="104">9-12</text>
  </g>

  <!-- Table frame -->
  <rect x="40" y="118" width="480" height="252" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="118" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="74" y="136">步</text>
    <text x="120" y="136">i</text>
    <text x="184" y="136">token</text>
    <text x="262" y="136">输出</text>
    <text x="372" y="136">i 跳到</text>
    <text x="466" y="136">res 累积</text>
  </g>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="96" y1="118" x2="96" y2="370"/>
    <line x1="146" y1="118" x2="146" y2="370"/>
    <line x1="222" y1="118" x2="222" y2="370"/>
    <line x1="306" y1="118" x2="306" y2="370"/>
    <line x1="416" y1="118" x2="416" y2="370"/>
  </g>

  <!-- Rows -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="74" y="166">1</text>
    <text x="120" y="166">0</text>
    <text x="184" y="166" fill="#4a7a3a" font-weight="bold">G</text>
    <text x="262" y="166" fill="#4a7a3a" font-weight="bold">G</text>
    <text x="372" y="166">1</text>
    <text x="466" y="166" fill="#4a7a3a" font-weight="bold">"G"</text>

    <text x="74" y="190">2</text>
    <text x="120" y="190">1</text>
    <text x="184" y="190" fill="#446688" font-weight="bold">()</text>
    <text x="262" y="190" fill="#446688" font-weight="bold">o</text>
    <text x="372" y="190">3</text>
    <text x="466" y="190" fill="#446688" font-weight="bold">"Go"</text>

    <text x="74" y="214">3</text>
    <text x="120" y="214">3</text>
    <text x="184" y="214" fill="#446688" font-weight="bold">()</text>
    <text x="262" y="214" fill="#446688" font-weight="bold">o</text>
    <text x="372" y="214">5</text>
    <text x="466" y="214" fill="#446688" font-weight="bold">"Goo"</text>

    <text x="74" y="238">4</text>
    <text x="120" y="238">5</text>
    <text x="184" y="238" fill="#446688" font-weight="bold">()</text>
    <text x="262" y="238" fill="#446688" font-weight="bold">o</text>
    <text x="372" y="238">7</text>
    <text x="466" y="238" fill="#446688" font-weight="bold">"Gooo"</text>

    <text x="74" y="262">5</text>
    <text x="120" y="262">7</text>
    <text x="184" y="262" fill="#446688" font-weight="bold">()</text>
    <text x="262" y="262" fill="#446688" font-weight="bold">o</text>
    <text x="372" y="262">9</text>
    <text x="466" y="262" fill="#446688" font-weight="bold">"Goooo"</text>
  </g>

  <!-- row 6 PEAK -->
  <rect x="42" y="276" width="476" height="26" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="74" y="294">6</text>
    <text x="120" y="294">9</text>
    <text x="184" y="294" fill="#d6a040" font-weight="bold">(al)</text>
    <text x="262" y="294" fill="#d6a040" font-weight="bold">al</text>
    <text x="372" y="294">13</text>
    <text x="466" y="294" fill="#b85450" font-weight="bold">"Gooooal"</text>
  </g>
  <text x="510" y="294" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">← 完成</text>

  <!-- row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="174" x2="520" y2="174"/>
    <line x1="40" y1="198" x2="520" y2="198"/>
    <line x1="40" y1="222" x2="520" y2="222"/>
    <line x1="40" y1="246" x2="520" y2="246"/>
    <line x1="40" y1="270" x2="520" y2="270"/>
    <line x1="40" y1="302" x2="520" y2="302"/>
  </g>

  <!-- End result row -->
  <rect x="40" y="304" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = 13 = n → 扫描结束，返回 "Gooooal" ✓</text>

  <!-- Bottom note -->
  <rect x="40" y="346" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="56" y="382" font-size="11" fill="#555">• i 每步前进 1 / 2 / 4，由首字符决定：'G' → 1，'('+')' → 2，'('+'a' → 4</text>
  <text x="56" y="396" font-size="11" fill="#555">• 5 个 "()" 各贡献一个 o，1 个 "(al)" 贡献 al，1 个 "G" 贡献 G → 共 7 字符</text>
</svg>
