<svg xmlns="http://www.w3.org/2000/svg" width="520" height="540" viewBox="0 0 520 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="540" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 判可达流程</text>
  <path d="M 130 36 Q 260 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start: check arr[start]==0 -->
  <g filter="url(#sk)">
    <rect x="150" y="52" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">初始化</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#555">若 arr[start]==0 返回 true；否则入队 start</text>
  <path d="M 260 98 L 260 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: queue empty? -->
  <g filter="url(#sk)">
    <path d="M 260 120 L 330 156 L 260 192 L 190 156 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">队列空?</text>
  <text x="260" y="170" text-anchor="middle" font-size="9" fill="#888">Yes → return false</text>
  <path d="M 330 156 L 400 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="140" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="446" y="162" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">不可达 false</text>

  <text x="246" y="206" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>
  <path d="M 260 192 L 260 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop i -->
  <g filter="url(#sk)">
    <rect x="150" y="214" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">弹出 i，算 nxt1=i+arr[i], nxt2=i−arr[i]</text>
  <path d="M 260 254 L 260 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- for each nxt -->
  <g filter="url(#sk)">
    <rect x="150" y="274" width="220" height="34" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历 {nxt1, nxt2}</text>
  <path d="M 260 308 L 260 326" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: 越界 or 已访问? -->
  <g filter="url(#sk)">
    <path d="M 260 330 L 340 364 L 260 398 L 180 364 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">越界/已访问?</text>
  <text x="358" y="360" font-size="10" fill="#b03a3a" font-weight="bold">Yes → 跳过</text>
  <path d="M 260 398 L 260 416" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="412" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- diamond: arr[nxt]==0? -->
  <g filter="url(#sk)">
    <path d="M 260 420 L 340 454 L 260 488 L 180 454 Z" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="260" y="452" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">arr[nxt]==0?</text>
  <text x="260" y="466" text-anchor="middle" font-size="9" fill="#888">(命中目标)</text>
  <path d="M 340 454 L 410 454" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="410" y="438" width="84" height="34" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="452" y="460" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return true</text>

  <path d="M 260 488 L 260 506" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="502" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- push -->
  <g filter="url(#sk)">
    <rect x="120" y="508" width="280" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="526" text-anchor="middle" font-size="10" fill="#2b4b6e" font-weight="bold">visited[nxt]=true，nxt 入队</text>

  <!-- loop back arrow -->
  <path d="M 120 521 L 64 521 L 64 156 L 188 156" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="52" y="340" font-size="10" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 52 340)">回到队首判断</text>
</svg>
