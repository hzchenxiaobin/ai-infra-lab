<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">字母频数表 + 逐位比较判可用</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">letters 有重复 → count[26] 取代 bitmask；判可用 ⇔ wordCount[c] ≤ available[c]</text>

  <!-- ===== Available letters frequency ===== -->
  <g filter="url(#rough2)" font-size="11">
    <text x="30" y="74" fill="#446688" font-weight="bold">available[26]</text>
    <text x="30" y="88" font-size="9" fill="#888">letters 频数</text>

    <rect x="110" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="133" y="76" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">a</text>
    <text x="133" y="89" text-anchor="middle" fill="#446688" font-size="10">×2</text>

    <rect x="160" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="183" y="76" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">c</text>
    <text x="183" y="89" text-anchor="middle" fill="#446688" font-size="10">×1</text>

    <rect x="210" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="233" y="76" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">d</text>
    <text x="233" y="89" text-anchor="middle" fill="#446688" font-size="10">×3</text>

    <rect x="260" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="283" y="76" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">g</text>
    <text x="283" y="89" text-anchor="middle" fill="#446688" font-size="10">×1</text>

    <rect x="310" y="60" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="333" y="76" text-anchor="middle" fill="#446688" font-weight="bold" font-size="13">o</text>
    <text x="333" y="89" text-anchor="middle" fill="#446688" font-size="10">×2</text>

    <rect x="360" y="60" width="36" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="5"/>
    <text x="378" y="82" text-anchor="middle" fill="#aaa" font-size="10">…0</text>
  </g>

  <!-- ===== Word "good" needs ===== -->
  <g filter="url(#rough2)" font-size="11">
    <text x="30" y="118" fill="#4a7a3a" font-weight="bold">"good" 需要</text>

    <rect x="110" y="106" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="133" y="122" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="13">g</text>
    <text x="133" y="135" text-anchor="middle" fill="#4a7a3a" font-size="10">×1</text>

    <rect x="160" y="106" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="183" y="122" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="13">o</text>
    <text x="183" y="135" text-anchor="middle" fill="#4a7a3a" font-size="10">×2</text>

    <rect x="210" y="106" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="233" y="122" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="13">d</text>
    <text x="233" y="135" text-anchor="middle" fill="#4a7a3a" font-size="10">×1</text>

    <!-- comparison arrows: g, o, d -->
    <path d="M 133 140 L 133 60" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.4"/>
    <path d="M 183 140 L 183 60" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.4"/>
    <path d="M 233 140 L 233 60" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.4"/>
  </g>

  <!-- ===== Comparison checks (right side) ===== -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="410" y="60" width="130" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="475" y="78" text-anchor="middle" fill="#4a7a3a" font-weight="bold">逐位比较</text>
    <text x="425" y="96" fill="#555" font-family="monospace" font-size="10">g: 1 ≤ 1 ✓</text>
    <text x="425" y="110" fill="#555" font-family="monospace" font-size="10">o: 2 ≤ 2 ✓</text>
    <text x="425" y="124" fill="#555" font-family="monospace" font-size="10">d: 1 ≤ 3 ✓</text>
    <text x="475" y="138" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="10">→ 可拼写！</text>
  </g>

  <!-- ===== Score calculation ===== -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="30" y="158" width="510" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="280" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="11">得分 = Σ score[c] × count[c] = g(3) + o(2)×2 + d(5) = 12</text>
    <text x="280" y="188" text-anchor="middle" fill="#888" font-size="9">每个字母的得分 × 该字母使用次数，再求和</text>
  </g>

  <!-- ===== Contrast: bitmask vs count[26] ===== -->
  <g filter="url(#rough2)" font-size="11">
    <!-- 1239 bitmask box -->
    <rect x="30" y="208" width="245" height="70" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="152" y="226" text-anchor="middle" fill="#555" font-weight="bold">1239：26 位 bitmask</text>
    <text x="50" y="244" fill="#666" font-family="monospace" font-size="10">每个字母 → 1 bit（0/1）</text>
    <text x="50" y="258" fill="#666" font-family="monospace" font-size="10">判冲突：mask &amp; mask == 0</text>
    <text x="50" y="272" fill="#888" font-size="9">✗ 只记「有/无」，无法表达 d×3</text>

    <!-- 1255 count box -->
    <rect x="285" y="208" width="245" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="407" y="226" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1255：频数表 count[26]</text>
    <text x="305" y="244" fill="#4a7a3a" font-family="monospace" font-size="10">每个字母 → 一个整数计数</text>
    <text x="305" y="258" fill="#4a7a3a" font-family="monospace" font-size="10">判可用：cnt[c] ≤ avail[c] ∀c</text>
    <text x="305" y="272" fill="#4a7a3a" font-size="9">✓ 可表达 d×3、用了 2 个剩 1 个</text>
  </g>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="292" width="510" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ 关键区别：letters 含重复字母 → bitmask 不够，必须用频数表；选词时减、回溯时加</text>

  <!-- ===== Backtracking modify/restore ===== -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="328" width="510" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="280" y="346" text-anchor="middle" fill="#446688" font-weight="bold">回溯修改/恢复 available[]</text>
    <text x="50" y="361" fill="#555" font-family="monospace" font-size="9">选词：available[c] -= wordCount[c]</text>
    <text x="300" y="361" fill="#555" font-family="monospace" font-size="9">回溯：available[c] += wordCount[c]</text>
  </g>
</svg>
