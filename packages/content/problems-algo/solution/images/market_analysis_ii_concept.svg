<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：每位卖家按日期排序的第 2 件售出商品 → 品牌 vs 偏好品牌</text>

  <!-- ===== Users table (left) ===== -->
  <text x="90" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Users 表</text>
  <rect x="20" y="60" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="75" font-size="8" fill="#446688" font-weight="bold">user_id</text>
  <text x="92" y="75" font-size="8" fill="#446688" font-weight="bold">favorite_brand</text>
  <line x1="64" y1="60" x2="64" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="82" width="150" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="95" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="92" y="95" text-anchor="middle" font-size="8" fill="#333">Lenovo</text>
  <line x1="64" y1="82" x2="64" y2="100" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="100" width="150" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="42" y="113" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="92" y="113" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Samsung</text>
  <line x1="64" y1="100" x2="64" y2="118" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="20" y="118" width="150" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="42" y="131" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="92" y="131" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">LG</text>
  <line x1="64" y1="118" x2="64" y2="136" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="20" y="136" width="150" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="149" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="92" y="149" text-anchor="middle" font-size="8" fill="#333">HP</text>
  <line x1="64" y1="136" x2="64" y2="154" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- ===== Orders table (center) ===== -->
  <text x="310" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Orders 表（按 seller 排序）</text>
  <rect x="200" y="60" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="75" font-size="7.5" fill="#d6a040" font-weight="bold">order_id</text>
  <text x="262" y="75" font-size="7.5" fill="#d6a040" font-weight="bold">order_date</text>
  <text x="312" y="75" font-size="7.5" fill="#d6a040" font-weight="bold">item_id</text>
  <text x="352" y="75" font-size="7.5" fill="#d6a040" font-weight="bold">buyer</text>
  <text x="392" y="75" font-size="7.5" fill="#d6a040" font-weight="bold">seller</text>
  <line x1="245" y1="60" x2="245" y2="82" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="290" y1="60" x2="290" y2="82" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="335" y1="60" x2="335" y2="82" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="375" y1="60" x2="375" y2="82" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- 6 order rows -->
  <rect x="200" y="82" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="93" text-anchor="middle" font-size="7.5" fill="#888">1</text>
  <text x="267" y="93" text-anchor="middle" font-size="7" fill="#888">08-01</text>
  <text x="312" y="93" text-anchor="middle" font-size="7.5" fill="#888">4</text>
  <text x="352" y="93" text-anchor="middle" font-size="7.5" fill="#888">1</text>
  <text x="392" y="93" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">2</text>

  <rect x="200" y="98" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="109" text-anchor="middle" font-size="7.5" fill="#888">2</text>
  <text x="267" y="109" text-anchor="middle" font-size="7" fill="#888">08-02</text>
  <text x="312" y="109" text-anchor="middle" font-size="7.5" fill="#888">2</text>
  <text x="352" y="109" text-anchor="middle" font-size="7.5" fill="#888">1</text>
  <text x="392" y="109" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="200" y="114" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="125" text-anchor="middle" font-size="7.5" fill="#888">3</text>
  <text x="267" y="125" text-anchor="middle" font-size="7" fill="#888">08-03</text>
  <text x="312" y="125" text-anchor="middle" font-size="7.5" fill="#888">3</text>
  <text x="352" y="125" text-anchor="middle" font-size="7.5" fill="#888">2</text>
  <text x="392" y="125" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="200" y="130" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="141" text-anchor="middle" font-size="7.5" fill="#888">4</text>
  <text x="267" y="141" text-anchor="middle" font-size="7" fill="#888">08-04</text>
  <text x="312" y="141" text-anchor="middle" font-size="7.5" fill="#888">1</text>
  <text x="352" y="141" text-anchor="middle" font-size="7.5" fill="#888">4</text>
  <text x="392" y="141" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">2</text>

  <rect x="200" y="146" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="157" text-anchor="middle" font-size="7.5" fill="#888">5</text>
  <text x="267" y="157" text-anchor="middle" font-size="7" fill="#888">08-04</text>
  <text x="312" y="157" text-anchor="middle" font-size="7.5" fill="#888">1</text>
  <text x="352" y="157" text-anchor="middle" font-size="7.5" fill="#888">3</text>
  <text x="392" y="157" text-anchor="middle" font-size="7.5" fill="#888">4</text>

  <rect x="200" y="162" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="222" y="173" text-anchor="middle" font-size="7.5" fill="#888">6</text>
  <text x="267" y="173" text-anchor="middle" font-size="7" fill="#888">08-05</text>
  <text x="312" y="173" text-anchor="middle" font-size="7.5" fill="#888">2</text>
  <text x="352" y="173" text-anchor="middle" font-size="7.5" fill="#888">2</text>
  <text x="392" y="173" text-anchor="middle" font-size="7.5" fill="#888">4</text>

  <!-- ===== Items table (right) ===== -->
  <text x="525" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Items 表</text>
  <rect x="460" y="60" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="75" font-size="8" fill="#b85450" font-weight="bold">item_id</text>
  <text x="540" y="75" font-size="8" fill="#b85450" font-weight="bold">item_brand</text>
  <line x1="516" y1="60" x2="516" y2="82" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="460" y="82" width="130" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="488" y="95" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="540" y="95" text-anchor="middle" font-size="8" fill="#333">Samsung</text>
  <line x1="516" y1="82" x2="516" y2="100" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="460" y="100" width="130" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="488" y="113" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="540" y="113" text-anchor="middle" font-size="8" fill="#333">Lenovo</text>
  <line x1="516" y1="100" x2="516" y2="118" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="460" y="118" width="130" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="488" y="131" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="540" y="131" text-anchor="middle" font-size="8" fill="#333">LG</text>
  <line x1="516" y1="118" x2="516" y2="136" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="460" y="136" width="130" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="488" y="149" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="540" y="149" text-anchor="middle" font-size="8" fill="#333">HP</text>
  <line x1="516" y1="136" x2="516" y2="154" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- ===== Join arrows ===== -->
  <!-- Users.seller(2) <- Orders.seller : arrow from orders seller col to users -->
  <path d="M200 93 Q183 93 175 113" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="86" font-size="7" fill="#b85450" font-weight="bold">seller→user</text>

  <!-- Orders.item_id -> Items.item_id -->
  <path d="M420 122 L456 122" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="438" y="116" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">item_id</text>

  <!-- ===== Bottom: 2nd item concept ===== -->
  <rect x="20" y="200" width="580" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第 2 件售出商品如何取？</text>

  <!-- seller 2 timeline -->
  <text x="40" y="244" font-size="9" fill="#333">seller 2:</text>
  <rect x="92" y="234" width="78" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="131" y="246" text-anchor="middle" font-size="8" fill="#888">08-01 / HP</text>
  <text x="178" y="246" font-size="9" fill="#888">→</text>
  <rect x="190" y="234" width="92" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="246" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-04 / Samsung</text>
  <text x="292" y="246" font-size="9" fill="#4a7a3a" font-weight="bold">① 第 2 件</text>
  <text x="350" y="246" font-size="9" fill="#333">brand = Samsung ?= fav Samsung</text>
  <text x="540" y="246" font-size="9" fill="#4a7a3a" font-weight="bold">→ yes</text>

  <!-- seller 4 timeline -->
  <text x="40" y="276" font-size="9" fill="#333">seller 4:</text>
  <rect x="92" y="266" width="78" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="131" y="278" text-anchor="middle" font-size="8" fill="#888">08-04 / Samsung</text>
  <text x="178" y="278" font-size="9" fill="#888">→</text>
  <rect x="190" y="266" width="78" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="229" y="278" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">08-05 / Lenovo</text>
  <text x="278" y="278" font-size="9" fill="#d6a040" font-weight="bold">① 第 2 件</text>
  <text x="350" y="278" font-size="9" fill="#333">brand = Lenovo ?= fav HP</text>
  <text x="540" y="278" font-size="9" fill="#b85450" font-weight="bold">→ no</text>

  <!-- seller 1 timeline -->
  <text x="40" y="308" font-size="9" fill="#333">seller 1:</text>
  <rect x="92" y="298" width="120" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="310" text-anchor="middle" font-size="8" fill="#b85450">无售出记录</text>
  <text x="222" y="310" font-size="9" fill="#b85450" font-weight="bold">&lt;2 件 → no</text>

  <!-- ===== Bottom insight box ===== -->
  <rect x="20" y="335" width="580" height="135" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键洞察</text>

  <text x="40" y="376" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">ROW_NUMBER() OVER (PARTITION BY seller_id ORDER BY order_date)</tspan> 给每位卖家的订单按日期编号</text>
  <text x="40" y="394" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">WHERE rn = 2</tspan> 取第 2 单；JOIN Items 拿到该商品品牌</text>
  <text x="40" y="412" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">LEFT JOIN Users</tspan> 保留所有用户；售出 &lt; 2 件者第 2 单为 NULL → 结果 'no'</text>
  <text x="40" y="430" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">IF(brand = favorite_brand, 'yes', 'no')</tspan>：NULL = x 为 NULL（假）→ 自动落 'no'</text>
  <text x="40" y="448" font-size="9.5" fill="#333">• <tspan fill="#888">保证条件</tspan>：每位卖家每日至多售 1 件 → 按日期排序无并列，rn 确定无歧义</text>
  <text x="40" y="464" font-size="9" fill="#888">绿=命中偏好(yes) / 橙=未命中(no) / 红虚线=无第 2 单(no)</text>
</svg>
