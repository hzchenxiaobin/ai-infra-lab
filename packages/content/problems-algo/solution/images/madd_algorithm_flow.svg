<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="600" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：GCD 归约 + 排序扫描</text>

  <!-- step 1 -->
  <rect x="150" y="48" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 计算 g = gcd(numsDivide 全部)</text>
  <text x="270" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐元素累乘 gcd，O(m log M)</text>

  <path d="M270,94 L270,118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="120" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 升序排序 nums</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">使「最小合格元素」排到最前</text>

  <path d="M270,166 L270,190" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3 loop -->
  <rect x="150" y="192" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 从左到右遍历 nums[i]</text>
  <text x="270" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">找第一个满足条件的下标</text>

  <path d="M270,238 L270,262" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,264 400,316 270,368 140,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">g % nums[i] == 0 ?</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（nums[i] 整除 g）</text>

  <!-- yes branch (left) -->
  <path d="M140,316 L70,316 L70,408" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="104" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="20" y="412" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="434" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 i</text>
  <text x="130" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删除次数 = i</text>
  <text x="130" y="468" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（前 i 个更小者全删）</text>

  <!-- no branch (right) -->
  <path d="M400,316 L470,316 L470,360" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="438" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="400" y="364" width="120" height="44" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="382" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i += 1</text>
  <text x="460" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">继续下一个</text>

  <!-- loop back arrow to step 3 -->
  <path d="M460,408 L460,214 L390,214" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="470" y="316" font-size="10" fill="#446688" filter="url(#rough2)">回</text>

  <!-- exhausted branch -->
  <path d="M270,368 L270,492" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="430" font-size="11" fill="#b85450" filter="url(#rough2)">遍历完仍</text>
  <text x="282" y="444" font-size="11" fill="#b85450" filter="url(#rough2)">未命中</text>

  <rect x="150" y="496" width="240" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="518" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="270" y="536" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">nums 中无 g 的因子</text>

  <!-- footnote -->
  <text x="270" y="572" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">瓶颈在排序 O(n log n)；gcd 与扫描各 O(n)/O(m)，整体线性对数</text>
</svg>
