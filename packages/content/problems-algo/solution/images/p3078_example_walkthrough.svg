<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：board=[[1,1,2],[3,3,4],[6,6,6]]，pattern=[[a,b],[6,6]]（示例 2）</text>

  <!-- pattern display -->
  <text x="44" y="49" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pattern：</text>
  <rect x="95" y="32" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="121" y="32" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="95" y="58" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="121" y="58" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="50" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="134" y="50" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="108" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="134" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <text x="180" y="50" font-size="11" fill="#666" filter="url(#rough2)">枚举顺序：行主序 (0,0) → (0,1) → (1,0) → (1,1)</text>
  <text x="180" y="68" font-size="11" fill="#666" filter="url(#rough2)">返回首个命中 ⇒ 行号最小、再列号最小</text>

  <!-- table header -->
  <rect x="28" y="96" width="504" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="56" y="113" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">候选</text>
  <text x="125" y="113" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">子矩阵</text>
  <text x="315" y="113" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定过程</text>
  <text x="490" y="113" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- row 1: (0,0) -->
  <rect x="28" y="124" width="504" height="46" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="152" font-size="11.5" fill="#333" filter="url(#rough2)">(0,0)</text>
  <rect x="105" y="127" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="125" y="127" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="105" y="147" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="147" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="172" y="152" font-size="11" fill="#333" filter="url(#rough2)">a→1 ✓；b→1 ⇒ 数字 1 已属 a，双射冲突</text>
  <text x="490" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- row 2: (0,1) -->
  <rect x="28" y="172" width="504" height="46" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="200" font-size="11.5" fill="#333" filter="url(#rough2)">(0,1)</text>
  <rect x="105" y="175" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="175" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="195" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="125" y="195" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="135" y="210" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="172" y="200" font-size="11" fill="#333" filter="url(#rough2)">a→1、b→2 ✓；数字格 '6' 要求 6 实为 3 ⇒ 锚点失配</text>
  <text x="490" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- row 3: (1,0) -->
  <rect x="28" y="220" width="504" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="56" y="248" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <rect x="105" y="223" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="125" y="223" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="105" y="243" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="243" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="135" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="172" y="241" font-size="11" fill="#333" filter="url(#rough2)">a→3 ✓；b→3 ⇒ 数字 3 已属 a，双射冲突</text>
  <text x="172" y="257" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">（单向映射在此漏判！）</text>
  <text x="490" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="490" y="258" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">教学点</text>

  <!-- row 4: (1,1) -->
  <rect x="28" y="268" width="504" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="56" y="296" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <rect x="105" y="271" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="271" width="20" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="291" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="291" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="286" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="286" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="115" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="135" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="172" y="296" font-size="11" fill="#333" filter="url(#rough2)">a→3、b→4 ✓；'6'=6、'6'=6 ✓ 全部通过</text>
  <text x="490" y="296" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ [1,1]</text>

  <!-- insight box -->
  <rect x="28" y="326" width="504" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">💡 三个失败候选覆盖三类结局：双射冲突 ×2（(0,0)、(1,0)）+ 锚点失配 ×1（(0,1)）。</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">「不同字母撞同一数字」只有数字→字母方向能抓住——这正是双向校验的存在意义。</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">示例 1 同理：(0,0) 先命中即返回，(1,1) 虽也匹配（a→2、b→3）但不再枚举。</text>
</svg>
