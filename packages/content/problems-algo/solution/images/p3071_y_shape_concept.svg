<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">Y 的形状：三条线在中心 (m, m) 汇合（n = 5, m = 2）</text>

  <!-- column labels -->
  <text x="80" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=0</text>
  <text x="124" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="168" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=2</text>
  <text x="212" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=3</text>
  <text x="256" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=4</text>
  <!-- row labels -->
  <text x="52" y="102" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="52" y="146" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="52" y="190" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="52" y="234" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=3</text>
  <text x="52" y="278" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=4</text>

  <!-- grid cells -->
  <!-- row 0 -->
  <rect x="60" y="78" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="78" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="78" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="78" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="78" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="60" y="122" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="122" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="122" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="122" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <!-- row 2: center is shared by all three lines -->
  <rect x="60" y="166" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="166" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="166" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="166" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="166" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <!-- row 3 -->
  <rect x="60" y="210" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="210" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="210" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="210" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="210" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <!-- row 4 -->
  <rect x="60" y="254" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="254" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="254" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="254" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="254" width="40" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- stroke guide lines -->
  <path d="M 80 98 L 168 186" stroke="#446688" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 256 98 L 168 186" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 168 186 L 168 274" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.75" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="302" y="82" width="202" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左对角线：(i, i)，i = 0..m</text>
  <text x="403" y="119" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">共 m + 1 格（蓝）</text>

  <rect x="302" y="136" width="202" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右对角线：(i, n−1−i)，i = 0..m</text>
  <text x="403" y="173" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">共 m + 1 格（绿）</text>

  <rect x="302" y="190" width="202" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="208" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">垂直线：(i, m)，i = m..n−1</text>
  <text x="403" y="227" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">共 n − m 格（橙）</text>

  <rect x="302" y="244" width="202" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">中心 (m, m)：三线共享</text>
  <text x="403" y="281" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">|Y| = 2(m+1)+(n−m)−2</text>
  <text x="403" y="297" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= n + m = 7（n=5 时）</text>

  <!-- bottom note -->
  <rect x="40" y="314" width="452" height="54" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="266" y="336" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">💡 Y 的格子集合只由 n 决定，与 grid 的内容无关（静态几何划分）；</text>
  <text x="266" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一遍扫描即可把 n² 个格子分进 cntY[3] / cntO[3] 两个计数桶。</text>
</svg>
