<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：abbbabbbcabbbabbbc → 2[2[abbb]c]</text>

  <!-- ============ Table grid ============ -->
  <!-- column x boundaries: 20, 96, 300, 484, 580 -->
  <!-- header row y=44 h=28 ; data rows y=74/134/194 h=56 -->

  <!-- header background -->
  <rect x="20" y="44" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="198" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">待编码子串 (长度)</text>
  <text x="392" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">DP 转移</text>
  <text x="532" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp 结果 (长度)</text>

  <!-- vertical separators -->
  <path d="M 96 44 L 96 250" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 300 44 L 300 250" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 484 44 L 484 250" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ============ Row 1: abbbabbb -> 2[abbb] ============ -->
  <rect x="20" y="74" width="560" height="56" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 整段</text>
  <!-- substring with pattern highlight: abbb abbb -->
  <text x="110" y="100" font-size="13" fill="#d6a040" font-weight="bold">abbb</text>
  <text x="150" y="100" font-size="13" fill="#4a7a3a" font-weight="bold">abbb</text>
  <text x="110" y="118" font-size="10" fill="#888">len = 8, 周期 p = 4</text>
  <!-- transfer -->
  <text x="310" y="100" font-size="11" fill="#333">"abbb" 重复 k=2</text>
  <text x="310" y="118" font-size="11" fill="#333">→ 2 + "[" + dp[abbb] + "]"</text>
  <!-- result -->
  <rect x="498" y="88" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="532" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2[abbb]</text>
  <text x="532" y="124" text-anchor="middle" font-size="9" fill="#888">len 7</text>

  <!-- ============ Row 2: abbbabbbc -> 2[abbb]c ============ -->
  <rect x="20" y="134" width="560" height="56" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 分段</text>
  <!-- substring: abbbabbb | c -->
  <text x="110" y="160" font-size="13" fill="#446688" font-weight="bold">abbbabbb</text>
  <text x="190" y="160" font-size="13" fill="#b85450" font-weight="bold">|</text>
  <text x="200" y="160" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <text x="110" y="178" font-size="10" fill="#888">len = 9, 切点 k = 7</text>
  <!-- transfer -->
  <text x="310" y="160" font-size="11" fill="#333">dp[abbbabbb] + dp[c]</text>
  <text x="310" y="178" font-size="11" fill="#333">= "2[abbb]" + "c"</text>
  <!-- result -->
  <rect x="498" y="148" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="532" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2[abbb]c</text>
  <text x="532" y="184" text-anchor="middle" font-size="9" fill="#888">len 8</text>

  <!-- ============ Row 3: full string -> 2[2[abbb]c] ============ -->
  <rect x="20" y="194" width="560" height="56" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 整段</text>
  <!-- substring: abbbabbbc x2 -->
  <text x="110" y="220" font-size="13" fill="#b85450" font-weight="bold">abbbabbbc</text>
  <text x="194" y="220" font-size="13" fill="#b85450" font-weight="bold">abbbabbbc</text>
  <text x="110" y="238" font-size="10" fill="#888">len = 18, 周期 p = 9</text>
  <!-- transfer -->
  <text x="310" y="220" font-size="11" fill="#333">"abbbabbbc" 重复 k=2</text>
  <text x="310" y="238" font-size="11" fill="#333">→ 2 + "[" + dp[abbbabbbc] + "]"</text>
  <!-- result -->
  <rect x="492" y="208" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="532" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2[2[abbb]c]</text>
  <text x="532" y="244" text-anchor="middle" font-size="9" fill="#888">len 11</text>

  <!-- bottom note -->
  <path d="M 300 258 L 300 272" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="278" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">从底向上：先算短子串，结果被外层 k[ ] 复用</text>
</svg>
