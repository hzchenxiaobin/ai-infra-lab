<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种情形一图看清</text>

  <!-- ===== Example 1 ===== -->
  <rect x="20" y="44" width="520" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="64" font-size="12" fill="#446688" font-weight="bold">示例 1：a = "aba", b = "cdc"  →  答案 3</text>

  <text x="36" y="88" font-size="11" fill="#444">a:</text>
  <rect x="60" y="76" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="73" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="86" y="76" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="112" y="76" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <text x="160" y="88" font-size="11" fill="#444">b:</text>
  <rect x="184" y="76" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="197" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="210" y="76" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="223" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
  <rect x="236" y="76" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="249" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>

  <text x="290" y="88" font-size="11" fill="#666">a ≠ b，等长不等 → "aba" 整串即特殊序列</text>
  <text x="290" y="106" font-size="10" fill="#888">len(a) = len(b) = 3，返回 max(3, 3) = 3</text>
  <text x="290" y="124" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 等长但内容不同 → 整串互不为对方子序列</text>

  <!-- ===== Example 2 ===== -->
  <rect x="20" y="156" width="520" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="176" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：a = "aaa", b = "bbb"  →  答案 3</text>

  <text x="36" y="200" font-size="11" fill="#444">a:</text>
  <rect x="60" y="188" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="73" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="86" y="188" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="112" y="188" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <text x="160" y="200" font-size="11" fill="#444">b:</text>
  <rect x="184" y="188" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="197" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="210" y="188" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="223" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="236" y="188" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="249" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <text x="290" y="200" font-size="11" fill="#666">a ≠ b（字符全不同），"aaa" 不可能是 "bbb" 的子序列</text>
  <text x="290" y="218" font-size="10" fill="#888">返回 max(3, 3) = 3</text>
  <text x="290" y="236" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 与示例 1 同类：不等即返回较长串长度</text>

  <!-- ===== Example 3 ===== -->
  <rect x="20" y="268" width="520" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="288" font-size="12" fill="#b85450" font-weight="bold">示例 3：a = "aaa", b = "aaa"  →  答案 -1</text>

  <text x="36" y="312" font-size="11" fill="#444">a:</text>
  <rect x="60" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="73" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="86" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="112" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <text x="160" y="312" font-size="11" fill="#444">b:</text>
  <rect x="184" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="197" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="210" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="223" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="236" y="300" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="249" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <text x="290" y="312" font-size="11" fill="#666">a == b，两串完全相同</text>
  <text x="290" y="330" font-size="10" fill="#888">a 的每个子序列也是 b 的子序列，反之亦然</text>
  <text x="290" y="348" font-size="10" fill="#b85450" font-weight="bold">✗ 无任何「独有」子序列 → 返回 -1</text>

  <!-- bottom note -->
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#888">三例统一规律：a == b ⇒ -1；a ≠ b ⇒ max(len(a), len(b))</text>
</svg>
