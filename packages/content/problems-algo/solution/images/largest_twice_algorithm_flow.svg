<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">至少是其他数字两倍的最大数：一次遍历流程</text>

  <!-- Start node -->
  <ellipse cx="300" cy="60" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#333">开始: max1 = max2 = −1, idx = −1</text>

  <!-- arrow down to i = 0 -->
  <path d="M 300 80 L 300 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: i = 0 -->
  <rect x="236" y="102" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="125" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <!-- arrow down to diamond A -->
  <path d="M 300 138 L 300 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond A: i < n ? -->
  <polygon points="300,154 394,196 300,238 206,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="300" y="208" text-anchor="middle" font-size="10" fill="#888">(遍历下标)</text>

  <!-- A: No -> route right then down to Diamond C -->
  <path d="M 394 196 L 540 196 L 540 460 L 408 460" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- A: Yes -> down to process -->
  <path d="M 300 238 L 300 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="256" font-size="11" fill="#82b366">是</text>

  <!-- Process: update max1 / max2 / idx -->
  <rect x="146" y="266" width="308" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="11" fill="#333">若 nums[i] &gt; max1: max2 ← max1, max1 ← nums[i], idx ← i</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#333">否则若 nums[i] &gt; max2: max2 ← nums[i]</text>

  <!-- arrow down to i++ -->
  <path d="M 300 310 L 300 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: i++ -->
  <rect x="236" y="330" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="353" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- loop back: from i++ up to diamond A (left side, dashed) -->
  <path d="M 236 348 L 50 348 L 50 196 L 202 196" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 272)">继续下一轮</text>

  <!-- Diamond C: max1 >= 2 * max2 ? -->
  <polygon points="300,418 404,460 300,502 196,460" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="456" text-anchor="middle" font-size="11" fill="#333">max1 ≥ 2 × max2 ?</text>
  <text x="300" y="472" text-anchor="middle" font-size="10" fill="#888">(最大值是否压制次大)</text>

  <!-- C: Yes -> down return idx -->
  <path d="M 300 502 L 300 528" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="518" font-size="11" fill="#82b366">是</text>
  <ellipse cx="300" cy="548" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="552" text-anchor="middle" font-size="12" fill="#333">返回 idx</text>

  <!-- C: No -> left return -1 -->
  <path d="M 196 460 L 140 460" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="452" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="90" cy="460" rx="48" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="464" text-anchor="middle" font-size="12" fill="#333">返回 −1</text>
</svg>
