<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">切法与子披萨：送走上 / 左，保留下 / 右</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">剩余子披萨右下角恒为 (m−1, n−1)，仅用左上角 (r, c) 即可标识</text>

  <!-- ===== Left: horizontal cut ===== -->
  <g>
    <rect x="24" y="62" width="252" height="186" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
    <text x="150" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">水平切（沿行方向）</text>

    <!-- grid 3x3, cell 30, origin (84,98) -->
    <!-- row0: A . . -->
    <rect x="84" y="98" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="99" y="119" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="114" y="98" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="129" y="119" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="144" y="98" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="159" y="119" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <!-- row1: A A A -->
    <rect x="84" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="99" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="114" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="129" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="144" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="159" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <!-- row2: . . . -->
    <rect x="84" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="99" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="114" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="129" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="144" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="159" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>

    <!-- cut line between row0 and row1 -->
    <path d="M 78 128 L 180 128" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
    <text x="186" y="132" font-size="11" fill="#b85450" font-weight="bold">✂切</text>

    <!-- give-away arrow (up) -->
    <path d="M 129 124 L 129 92" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <text x="138" y="104" font-size="10" fill="#b85450" font-weight="bold">送人</text>
    <text x="138" y="117" font-size="9" fill="#b85450">(须有苹果)</text>

    <!-- keep bracket rows1-2 -->
    <path d="M 78 162 L 72 162 L 72 192 L 78 192" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <text x="84" y="212" font-size="10" fill="#4a7a3a" font-weight="bold">保留 → 子披萨 (r+1, c)</text>
    <text x="84" y="226" font-size="9" fill="#888">下移一行，继续切</text>
  </g>

  <!-- ===== Right: vertical cut ===== -->
  <g>
    <rect x="284" y="62" width="252" height="186" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
    <text x="410" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">垂直切（沿列方向）</text>

    <!-- grid 3x3, cell 30, origin (344,98) -->
    <!-- row0: A . . -->
    <rect x="344" y="98" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="359" y="119" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="374" y="98" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="389" y="119" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="404" y="98" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="419" y="119" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <!-- row1: A A A -->
    <rect x="344" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="359" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="374" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="389" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <rect x="404" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="419" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">A</text>
    <!-- row2: . . . -->
    <rect x="344" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="359" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="374" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="389" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>
    <rect x="404" y="158" width="30" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="419" y="179" text-anchor="middle" font-size="13" fill="#aaa">.</text>

    <!-- cut line between col0 and col1 -->
    <path d="M 374 92 L 374 194" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
    <text x="378" y="206" font-size="11" fill="#b85450" font-weight="bold">✂切</text>

    <!-- give-away arrow (left) -->
    <path d="M 340 143 L 308 143" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <text x="300" y="136" font-size="10" fill="#b85450" font-weight="bold">送人</text>
    <text x="296" y="149" font-size="9" fill="#b85450">(须有苹果)</text>

    <!-- keep bracket cols1-2 -->
    <path d="M 438 162 L 444 162 L 444 132 L 438 132" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <text x="344" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">保留 → 子披萨 (r, c+1)</text>
    <text x="344" y="240" font-size="9" fill="#888">右移一列，继续切</text>
  </g>

  <!-- ===== Bottom summary ===== -->
  <rect x="40" y="262" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：每次切保留下 / 右部分 → 右下角不变，状态只需 (r, c) 两个坐标</text>
</svg>
