<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两层分解：先切 x/y，再各自生成合法数字</text>

  <!-- Level 0: original string -->
  <rect x="160" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">( 0 0 0 1 1 )</text>
  <text x="400" y="73" font-size="10" fill="#888" filter="url(#rough2)">去掉括号 → "00011"</text>

  <!-- arrows down to splits -->
  <path d="M 220 88 L 150 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 88 L 390 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Level 1: split i=1: "0" | "0011" -->
  <rect x="60" y="122" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x="0"</text>
  <rect x="148" y="122" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="198" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y="0011"</text>
  <text x="100" y="112" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切点 i=1</text>

  <!-- Level 1: split i=4: "0001" | "1" -->
  <rect x="300" y="122" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="350" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x="0001"</text>
  <rect x="408" y="122" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="448" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y="1"</text>
  <text x="350" y="112" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切点 i=4</text>

  <!-- arrows down to valid reprs -->
  <path d="M 100 158 L 100 185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 198 158 L 198 185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 158 L 350 185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 158 L 448 185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Level 2: valid reprs -->
  <rect x="72" y="187" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0"</text>

  <rect x="160" y="187" width="76" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.011"</text>

  <rect x="310" y="187" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.001"</text>

  <rect x="420" y="187" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"1"</text>

  <!-- combine arrows -->
  <path d="M 100 215 L 160 250" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 198 215 L 200 250" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 350 215 L 340 250" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 448 215 L 380 250" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Level 3: results -->
  <rect x="130" y="252" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="205" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 0.011)</text>

  <rect x="290" y="252" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="365" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0.001, 1)</text>

  <!-- explanation box -->
  <rect x="30" y="300" width="480" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="11" fill="#444" filter="url(#rough2)">① 第一层：在 n−1 个位置切，把数字串分成 x 部和 y 部（均非空）</text>
  <text x="50" y="340" font-size="11" fill="#444" filter="url(#rough2)">② 第二层：对每部分枚举所有合法表示——整数形式 or 小数形式（插小数点）</text>
  <text x="50" y="358" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 笛卡尔积：x 的合法集 × y 的合法集 → 所有坐标对</text>
</svg>
