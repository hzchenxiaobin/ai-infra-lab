<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">破环为链：把前 k−1 块接到尾部</text>

  <!-- 环 -->
  <circle cx="135" cy="125" r="64" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">环</text>
  <text x="135" y="137" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">n = 7</text>

  <!-- 环上 7 块瓷砖 colors = [0,1,0,0,1,0,1] -->
  <circle cx="135" cy="61" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="60" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="135" y="72" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">下标0</text>

  <circle cx="185" cy="85" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="96" text-anchor="middle" font-size="7.5" fill="#446688" filter="url(#rough2)">下标1</text>

  <circle cx="197" cy="139" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="197" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="197" y="150" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">下标2</text>

  <circle cx="163" cy="183" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="163" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="163" y="194" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">下标3</text>

  <circle cx="107" cy="183" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="107" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="107" y="194" text-anchor="middle" font-size="7.5" fill="#446688" filter="url(#rough2)">下标4</text>

  <circle cx="73" cy="139" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="73" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="73" y="150" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">下标5</text>

  <circle cx="85" cy="85" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="85" y="96" text-anchor="middle" font-size="7.5" fill="#446688" filter="url(#rough2)">下标6</text>

  <!-- 剪开摊平箭头 -->
  <path d="M148,197 Q100,235 45,260" stroke="#aaa" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="238" font-size="10" fill="#999" filter="url(#rough2)">剪开摊平</text>

  <!-- 框 A：为什么补 k−1 块 -->
  <rect x="295" y="46" width="212" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="401" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">为什么恰好补 k−1 块？</text>
  <text x="401" y="90" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">跨缝窗口绕回开头，最远到下标 k−2</text>
  <text x="401" y="108" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">补 k−1 块 → 跨缝窗口全部被链覆盖</text>
  <text x="401" y="126" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">环上 n 个窗口 ↔ 链上起点 0…n−1</text>

  <!-- 框 B：拼出来的链 -->
  <rect x="295" y="156" width="212" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="401" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">拼出来的链 a</text>
  <text x="401" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a = colors + colors[:k−1]</text>
  <text x="401" y="220" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">链长 n+k−1 = 12，环形边界消失</text>

  <!-- 补充块的花括号 -->
  <path d="M300,262 L300,254 L496,254 L496,262" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">补上的 k−1 = 5 块（虚线框）</text>
  <text x="20" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">链 a = colors + colors[:5]</text>

  <!-- 链上 12 块瓷砖：前 7 块实线，后 5 块虚线 -->
  <rect x="20" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="38" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="38" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">0</text>

  <rect x="60" y="268" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="78" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="100" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="118" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="140" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="158" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="180" y="268" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="198" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="198" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">4</text>

  <rect x="220" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="238" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="238" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">5</text>

  <rect x="260" y="268" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="297" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">6</text>

  <rect x="300" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="318" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="318" y="297" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <rect x="340" y="268" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="358" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="358" y="297" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <rect x="380" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="398" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="398" y="297" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">9</text>

  <rect x="420" y="268" width="36" height="34" rx="4" fill="#fce4ec" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="438" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="438" y="297" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">10</text>

  <rect x="460" y="268" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="478" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="478" y="297" text-anchor="middle" font-size="7.5" fill="#4a7a3a" filter="url(#rough2)">11</text>

  <!-- 跨缝窗口高亮 [3..8] -->
  <rect x="136" y="264" width="244" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 接缝标记 -->
  <path d="M298,262 L298,308" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="298" y="322" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">接缝</text>

  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">高亮窗口 a[3..8] = 0,1,0,1,0,1 ✓ 交替 —— 对应环上下标 3,4,5,6,0,1（跨接缝）</text>
</svg>
