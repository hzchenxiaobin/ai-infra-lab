<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每行 1 在前 / 0 在后（单调）→ 二分找首个 0</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">首个 0 的下标 = 该行 1 的个数（战斗力）；全 1 行战斗力 = n</text>

  <!-- index labels -->
  <g font-size="10" fill="#888">
    <text x="122" y="84" text-anchor="middle">下标 0</text>
    <text x="186" y="84" text-anchor="middle">下标 1</text>
    <text x="250" y="84" text-anchor="middle">下标 2</text>
    <text x="314" y="84" text-anchor="middle">下标 3</text>
    <text x="378" y="84" text-anchor="middle">下标 4</text>
  </g>

  <!-- row label -->
  <text x="60" y="128" font-size="11" fill="#446688" font-weight="bold">某行</text>

  <!-- cells: 1,1,1,1,0 -->
  <g font-size="18">
    <rect x="90" y="96" width="64" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="122" y="130" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="154" y="96" width="64" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="186" y="130" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="218" y="96" width="64" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="250" y="130" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="282" y="96" width="64" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="314" y="130" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="346" y="96" width="64" height="50" rx="4" fill="#f5f5f5" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="378" y="130" text-anchor="middle" fill="#888" font-weight="bold">0</text>
  </g>

  <!-- boundary dashed line between index 3 and 4 -->
  <path d="M 346 88 L 346 152" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="346" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0/1 分界</text>

  <!-- arrow down to 战斗力 -->
  <path d="M 378 152 L 378 180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 战斗力 box -->
  <rect x="318" y="184" width="120" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">战斗力 = 4</text>

  <!-- right side comparison -->
  <rect x="452" y="100" width="130" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="517" y="118" text-anchor="middle" font-size="11" fill="#555">线性扫描数 1</text>
  <text x="517" y="133" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">O(n)</text>

  <rect x="452" y="150" width="130" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="517" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">二分找首个 0</text>
  <text x="517" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">O(log n)</text>

  <!-- bottom note -->
  <rect x="40" y="240" width="520" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每行单调（1…1, 0…0）是二分前提</text>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#666">首个 0 的下标即战斗力；全 1 行（无 0）战斗力 = n，全 0 行战斗力 = 0</text>
</svg>
