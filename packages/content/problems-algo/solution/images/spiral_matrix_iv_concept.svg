<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：链表逐个喂入螺旋顺序，短缺处补 −1</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">2326 = 59 螺旋填数，把自增计数换成「链表值 / 耗尽取 −1」</text>

  <!-- ===== linked list chain (head → 3,0,2,6,8 … 5,0) ===== -->
  <text x="124" y="82" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">head</text>
  <path d="M 126 77 L 138 77" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="164" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="82" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="188" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="198" y="82" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="212" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="222" y="82" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="236" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="246" y="82" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="262" y="82" text-anchor="middle" font-size="13" fill="#888">…</text>
  <rect x="282" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="306" y="66" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="316" y="82" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- arrow: chain → grid -->
  <path d="M 260 92 Q 262 118 262 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="120" font-size="10" fill="#b85450" font-weight="bold">按螺旋顺序填入</text>

  <!-- ===== 4x4 grid, cell=42, origin (176,150) ===== -->
  <!-- Ring1 outer (blue), start (0,0) red -->
  <rect x="176" y="150" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="177" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <rect x="218" y="150" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="177" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="260" y="150" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="177" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="302" y="150" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="177" text-anchor="middle" font-size="13" fill="#333">4</text>

  <rect x="302" y="192" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="219" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="302" y="234" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="261" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="302" y="276" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="303" text-anchor="middle" font-size="13" fill="#333">7</text>

  <rect x="260" y="276" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="303" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="218" y="276" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="303" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="176" y="276" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="303" text-anchor="middle" font-size="13" fill="#333">10</text>

  <rect x="176" y="234" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="261" text-anchor="middle" font-size="13" fill="#333">11</text>
  <rect x="176" y="192" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="219" text-anchor="middle" font-size="13" fill="#333">12</text>

  <!-- Ring2 inner 2x2 (orange) -->
  <rect x="218" y="192" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="219" text-anchor="middle" font-size="13" fill="#333">13</text>
  <rect x="260" y="192" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="219" text-anchor="middle" font-size="13" fill="#333">14</text>
  <rect x="260" y="234" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="261" text-anchor="middle" font-size="13" fill="#333">15</text>
  <rect x="218" y="234" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="261" text-anchor="middle" font-size="13" fill="#333">16</text>

  <!-- ===== outer direction arrows ===== -->
  <path d="M 184 144 L 334 144" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="259" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">①东</text>

  <path d="M 346 158 L 346 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="228" font-size="10" fill="#b85450" font-weight="bold">②南</text>

  <path d="M 334 296 L 184 296" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="259" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③西</text>

  <path d="M 170 290 L 170 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="228" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">④北</text>

  <!-- inner arrow -->
  <path d="M 244 213 L 276 213" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⑤内层同螺旋</text>

  <!-- ===== note + legend ===== -->
  <rect x="24" y="340" width="472" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="359" text-anchor="middle" font-size="11" fill="#5a4a1a">⚠ 链表节点数 &lt; m×n 时，剩余格补 −1；本题 = 59 螺旋填数 + 链表取值 + 短缺补位</text>

  <rect x="40" y="382" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="392" font-size="9" fill="#555">起点 (0,0)</text>
  <rect x="150" y="382" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="392" font-size="9" fill="#555">外圈（第 1 圈）</text>
  <rect x="280" y="382" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="392" font-size="9" fill="#555">内圈（向内收缩一层）</text>
  <rect x="430" y="382" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="392" font-size="9" fill="#555">−1 补位</text>
</svg>
