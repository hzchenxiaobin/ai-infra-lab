<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：nums = [0, 1, 2, 3, 4, 5, 6, 7]
  </text>

  <!-- index ruler -->
  <text x="109" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="147" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="185" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="223" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="261" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="299" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="337" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="375" y="50" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">7</text>

  <!-- Row 1: query [0,3] highlight 0,3,6 -->
  <text x="40" y="80" font-size="12" fill="#b85450" filter="url(#rough2)">[0,3]</text>
  <!-- cell 0 hi -->
  <rect x="90" y="66" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <!-- cell 1 -->
  <rect x="128" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="86" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">1</text>
  <!-- cell 2 -->
  <rect x="166" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="86" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>
  <!-- cell 3 hi -->
  <rect x="204" y="66" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <!-- cell 4 -->
  <rect x="242" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="261" y="86" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">4</text>
  <!-- cell 5 -->
  <rect x="280" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="86" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">5</text>
  <!-- cell 6 hi -->
  <rect x="318" y="66" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <!-- cell 7 -->
  <rect x="356" y="66" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="375" y="86" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="430" y="86" font-size="11" fill="#d6a040" filter="url(#rough2)">0 + 3 + 6 =</text>
  <text x="510" y="86" font-size="13" fill="#b85450" filter="url(#rough2)">9</text>

  <!-- Row 2: query [5,1] highlight 5,6,7 -->
  <text x="40" y="148" font-size="12" fill="#b85450" filter="url(#rough2)">[5,1]</text>
  <rect x="90" y="134" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="109" y="154" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="128" y="134" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="154" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="166" y="134" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="204" y="134" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="154" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="242" y="134" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="261" y="154" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="280" y="134" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="318" y="134" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="356" y="134" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="424" y="154" font-size="11" fill="#d6a040" filter="url(#rough2)">5 + 6 + 7 =</text>
  <text x="510" y="154" font-size="13" fill="#b85450" filter="url(#rough2)">18</text>

  <!-- Row 3: query [4,2] highlight 4,6 -->
  <text x="40" y="216" font-size="12" fill="#b85450" filter="url(#rough2)">[4,2]</text>
  <rect x="90" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="109" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="128" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="166" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="204" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="242" y="202" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="318" y="202" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="356" y="202" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="375" y="222" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="436" y="222" font-size="11" fill="#d6a040" filter="url(#rough2)">4 + 6 =</text>
  <text x="510" y="222" font-size="13" fill="#b85450" filter="url(#rough2)">10</text>

  <!-- divider -->
  <path d="M40,260 L520,260" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- B note for this sample -->
  <rect x="60" y="276" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n = 8 → B = √8 = 2</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[5,1] 与 [4,2] 走预处理表（y ≤ 2）；[0,3] 走直接遍历（y = 3 &gt; 2）</text>

  <!-- result -->
  <rect x="150" y="340" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="14" fill="#7a3a3a" filter="url(#rough2)">输出 = [9, 18, 10]</text>

  <!-- footer note -->
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    每个查询取下标 x, x+y, x+2y, … 直至越界，求和并对 10⁹+7 取模
  </text>
</svg>
