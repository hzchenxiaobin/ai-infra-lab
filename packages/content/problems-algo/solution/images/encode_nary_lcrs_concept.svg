<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心思想：左孩子 = 长子，右孩子 = 下一兄弟</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">N 叉树的多孩子 → 二叉树的两指针：left 管第一个孩子，right 串兄弟链</text>

  <!-- ===== 左半：N 叉树 ===== -->
  <rect x="20" y="56" width="250" height="310" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">N 叉树</text>

  <!-- 根节点 1 -->
  <circle cx="145" cy="106" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="111" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- 三个孩子 3, 2, 4 -->
  <line x1="130" y1="120" x2="75" y2="154" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="145" y1="124" x2="145" y2="154" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="160" y1="120" x2="215" y2="154" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="70" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <circle cx="145" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="175" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <circle cx="220" cy="170" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="175" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- 节点 2 的两个孩子 5, 6 -->
  <line x1="135" y1="184" x2="110" y2="214" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="155" y1="184" x2="180" y2="214" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="105" cy="228" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="185" cy="228" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- 说明 -->
  <rect x="36" y="270" width="218" height="84" fill="#fafafa" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="48" y="290" font-size="10" fill="#555">Node { val, children[] }</text>
  <text x="48" y="308" font-size="10" fill="#888">1.children = [3, 2, 4]</text>
  <text x="48" y="324" font-size="10" fill="#888">2.children = [5, 6]</text>
  <text x="48" y="340" font-size="10" fill="#888">3/4/5/6.children = []</text>

  <!-- ===== 中间：转换箭头 ===== -->
  <path d="M 278 200 L 322 200" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">encode</text>
  <text x="300" y="216" text-anchor="middle" font-size="9" fill="#b85450">LCRS</text>
  <path d="M 322 236 L 278 236" stroke="#446688" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">decode</text>

  <!-- ===== 右半：二叉树 ===== -->
  <rect x="330" y="56" width="250" height="310" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="455" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">二叉树（LCRS 表示）</text>

  <!-- 根节点 1 -->
  <circle cx="455" cy="106" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="111" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- 1.left = 3 (长子) -->
  <path d="M 455 124 L 455 154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="142" font-size="9" fill="#446688" font-weight="bold">L</text>

  <circle cx="455" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- 3.right = 2 (下一兄弟) -->
  <path d="M 471 170 L 510 170" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="486" y="162" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>

  <circle cx="525" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="175" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- 2.right = 4 (下一兄弟) -->
  <path d="M 525 186 L 525 214" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="542" y="204" font-size="9" fill="#b85450" font-weight="bold">R</text>

  <circle cx="525" cy="228" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- 2.left = 5 (长子) -->
  <path d="M 515 180 L 480 214" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="194" font-size="9" fill="#446688" font-weight="bold">L</text>

  <circle cx="470" cy="228" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- 5.right = 6 (下一兄弟) -->
  <path d="M 458 236 L 400 264" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="418" y="244" font-size="9" fill="#b85450" font-weight="bold">R</text>

  <circle cx="385" cy="274" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- 说明 -->
  <rect x="346" y="300" width="218" height="54" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="358" y="320" font-size="10" fill="#555">TreeNode { val, left, right }</text>
  <text x="358" y="336" font-size="10" fill="#446688">left = 第一个孩子（长子）</text>
  <text x="358" y="350" font-size="10" fill="#b85450">right = 下一个兄弟（兄弟链）</text>

  <!-- ===== 底部：编码规则总结 ===== -->
  <rect x="20" y="376" width="560" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="396" font-size="11" fill="#8a6a20" font-weight="bold">编码规则（Left-Child Right-Sibling）：</text>
  <text x="34" y="414" font-size="10" fill="#555">binary.left = encode(children[0])　|　binary.right 链：curr.right = encode(children[i])，i 从 1 起</text>
  <text x="34" y="426" font-size="10" fill="#4a7a3a">解码对称：nary.children = 沿 binary.left 起的 right 链逐个 decode 收集</text>
</svg>
