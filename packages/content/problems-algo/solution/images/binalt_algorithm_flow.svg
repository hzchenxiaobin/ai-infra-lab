<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：异或造全 1，再判全 1</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">输入 n</text>

  <line x1="250" y1="80" x2="250" y2="98" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: x = n ^ (n >> 1) -->
  <rect x="120" y="102" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="124" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">x = n ⊕ (n &gt;&gt; 1)</text>
  <text x="250" y="140" text-anchor="middle" font-size="10.5" fill="#446688">相邻位不同 → 该位变 1</text>

  <line x1="250" y1="150" x2="250" y2="168" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: (x & (x+1)) == 0 ? -->
  <polygon points="250,172 360,218 250,264 140,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(x &amp; (x+1)) == 0 ?</text>
  <text x="250" y="230" text-anchor="middle" font-size="10" fill="#888">x 是否全 1</text>

  <!-- Yes branch (right) to true -->
  <text x="370" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 218 Q 420 218 420 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <rect x="350" y="280" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="302" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <line x1="420" y1="314" x2="420" y2="334" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="420" cy="352" rx="48" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="357" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是交替位</text>

  <!-- No branch (left) to false -->
  <text x="120" y="212" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 140 218 Q 80 218 80 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return false -->
  <rect x="10" y="280" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="302" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return false ✗</text>

  <line x1="80" y1="314" x2="80" y2="334" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="80" cy="352" rx="48" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="357" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非交替位</text>

  <!-- bottom note: dual of 231 -->
  <rect x="70" y="390" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="408" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">x &amp; (x+1)==0 判「全 1」，是 231 题判「单 1」</text>
  <text x="250" y="422" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">用 n &amp; (n−1)==0 的对偶（−1 抹 1 / +1 清 1）</text>
</svg>
