<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：单调递增栈 + 贪心 + 计数</text>
  <path d="M 300 46 Q 460 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入字符串 -->
  <text x="80" y="92" font-size="13" font-weight="bold" fill="#555">输入 s =</text>
  <g filter="url(#sk)">
    <rect x="150" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="194" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="238" y="76" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="282" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="326" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="370" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="414" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="458" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="172" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="216" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">b</text>
  <text x="260" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">a</text>
  <text x="304" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="348" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">d</text>
  <text x="392" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="436" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">b</text>
  <text x="480" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>

  <g filter="url(#sk)">
    <rect x="540" y="74" width="300" height="40" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="690" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">目标三合一</text>
  <text x="690" y="108" text-anchor="middle" font-size="12" fill="#7a5415">每个字母只留一次 · 字典序最小 · 不打乱相对顺序</text>

  <!-- 左侧：单调递增栈示意 -->
  <text x="170" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">维护单调递增栈</text>
  <g filter="url(#sk)">
    <rect x="110" y="172" width="120" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="110" y="200" width="120" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="110" y="228" width="120" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="110" y="256" width="120" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="170" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">b（栈顶）</text>
  <text x="170" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">d</text>
  <text x="170" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="170" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">a（栈底）</text>
  <path d="M 170 296 L 170 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="170" y="330" text-anchor="middle" font-size="12" fill="#666">栈底 → 栈顶 字典序递增</text>
  <text x="170" y="346" text-anchor="middle" font-size="12" fill="#666">（局部尽可能小）</text>

  <!-- 中间：弹出动作 -->
  <text x="460" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">贪心：尽量让栈递增</text>
  <g filter="url(#sk)">
    <rect x="300" y="178" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="360" y="178" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="325" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="385" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040">b</text>
  <text x="318" y="170" text-anchor="middle" font-size="11" fill="#888">栈顶</text>
  <text x="378" y="170" text-anchor="middle" font-size="11" fill="#888">当前</text>
  <path d="M 360 195 L 312 195" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="425" y="200" font-size="12" fill="#b85450">c &gt; b</text>

  <g filter="url(#sk)">
    <rect x="300" y="230" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="325" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">c</text>
  <text x="325" y="222" text-anchor="middle" font-size="11" fill="#b85450">弹出</text>
  <path d="M 325 268 L 325 286" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="325" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a">但仅当 c 后面还会出现</text>
  <text x="325" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a">（cnt[c] &gt; 0）才弹</text>

  <!-- 右侧：三条规则 -->
  <text x="730" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">每个字符 c 的三条规则</text>
  <g filter="url(#sk)">
    <rect x="560" y="172" width="340" height="186" rx="10" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="578" y="198" font-size="13" font-weight="bold" fill="#446688">① 已在栈中？</text>
  <text x="578" y="216" font-size="12" fill="#555">是 ⟹ 直接跳过（保证只留一次）</text>
  <path d="M 570 228 L 890 228" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="578" y="250" font-size="13" font-weight="bold" fill="#b85450">② 栈顶 &gt; c 且后面还有栈顶？</text>
  <text x="578" y="268" font-size="12" fill="#555">是 ⟹ 弹出栈顶（贪心让结果更小）</text>
  <text x="578" y="284" font-size="12" fill="#555">否 ⟹ 停止弹出</text>
  <path d="M 570 296 L 890 296" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <text x="578" y="318" font-size="13" font-weight="bold" fill="#4a7a3a">③ 把 c 入栈，标记在栈中</text>
  <text x="578" y="336" font-size="12" fill="#555">cnt 随遍历递减，记录"后面还剩几个"</text>

  <!-- 底部关键点 -->
  <g filter="url(#sk)">
    <rect x="80" y="386" width="760" height="50" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="460" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">关键：弹不弹取决于"栈顶后面还有没有"</text>
  <text x="460" y="424" text-anchor="middle" font-size="12" fill="#7a5415">cnt[top] = 0 时绝不能弹——它是最后一次出现，丢了就再也补不回，结果会缺字母。</text>

  <!-- 结果链 -->
  <text x="80" y="478" font-size="13" font-weight="bold" fill="#555">最终栈底→栈顶即答案：</text>
  <g filter="url(#sk)">
    <rect x="270" y="462" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="316" y="462" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="362" y="462" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="408" y="462" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="292" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">a</text>
  <text x="338" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="384" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">d</text>
  <text x="430" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <path d="M 460 478 L 500 478" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="510" y="462" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="570" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">"acdb"</text>
  <text x="700" y="483" font-size="12" fill="#888">字典序最小的去重结果</text>

  <text x="460" y="524" text-anchor="middle" font-size="12" fill="#888">栈天然保持了原串的相对顺序，单调递增保证字典序尽可能小。</text>
</svg>
