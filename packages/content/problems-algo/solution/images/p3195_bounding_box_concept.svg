<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最小矩形 = 所有 1 的包围盒</text>

  <!-- 6x6 grid, cell 40, origin (70,70) -->
  <!-- row 0 -->
  <rect x="70" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="190" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="230" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="70" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="70" y="110" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="110" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="110" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="190" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="136" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="230" y="110" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="110" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="70" y="150" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="150" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="150" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="230" y="150" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="150" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- row 3 -->
  <rect x="70" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="190" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="230" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="190" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- row 4 -->
  <rect x="70" y="230" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="230" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="230" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="230" y="230" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="256" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="270" y="230" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- row 5 -->
  <rect x="70" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="190" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="230" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="270" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- bounding box rows 1..4, cols 1..4: x=110 y=110 w=160 h=160 -->
  <rect x="110" y="110" width="160" height="160" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="8 5" rx="3" filter="url(#rough2)"/>

  <!-- row/col indices -->
  <text x="58" y="96" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="58" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="58" y="176" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="58" y="216" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="58" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="58" y="296" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="90" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="130" y="62" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="210" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="250" y="62" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="290" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">5</text>

  <!-- edge labels -->
  <text x="190" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">上边界 = minR = 1</text>
  <text x="190" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">下边界 = maxR = 4</text>
  <text x="105" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">左</text>
  <text x="105" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">边</text>
  <text x="282" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">右</text>
  <text x="282" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">边</text>

  <!-- right panel -->
  <rect x="330" y="70" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="92" text-anchor="middle" font-size="12" fill="#2c4a6b" filter="url(#rough2)">minR=1, maxR=4 → 高 = 4</text>
  <rect x="330" y="114" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="136" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">minC=1, maxC=4 → 宽 = 4</text>
  <rect x="330" y="158" width="210" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="178" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">面积 = 高 × 宽</text>
  <text x="435" y="196" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= 4 × 4 = 16</text>
  <rect x="330" y="218" width="210" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="240" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">行边界只由「最上/最下的 1」决定，</text>
  <text x="435" y="257" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">列边界只由「最左/最右的 1」决定，</text>
  <text x="435" y="274" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">两个维度各自取到独立下界</text>

  <!-- bottom note -->
  <rect x="30" y="312" width="514" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="287" y="330" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">为什么不能更小？任何覆盖全部 1 的轴对齐矩形，</text>
  <text x="287" y="346" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">行跨度 ≥ maxR−minR+1 且列跨度 ≥ maxC−minC+1（否则必有 1 被漏掉）</text>
</svg>
