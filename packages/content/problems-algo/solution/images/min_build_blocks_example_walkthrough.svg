<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：blocks = [1, 2, 3]，split = 1</text>

  <!-- ===== 左侧：堆状态逐步变化 ===== -->

  <text x="40" y="62" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始堆 {1, 2, 3}</text>

  <rect x="40" y="70" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="65" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="96" y="70" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="121" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="152" y="70" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="38" y="64" width="112" height="46" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="94" y="58" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最小两个 1, 2</text>

  <path d="M 94 114 Q 94 128 94 142" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="132" y="132" font-size="10" fill="#b85450" filter="url(#rough2)">max(1,2)+1 = 3</text>

  <text x="40" y="158" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 1 次合并后 {3, 3}</text>

  <rect x="40" y="166" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="72" y="188" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="112" y="166" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="144" y="188" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="190" y="186" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 合并产生</text>

  <rect x="38" y="160" width="142" height="46" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="109" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最小两个 3, 3</text>

  <path d="M 109 210 Q 109 224 109 238" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="148" y="228" font-size="10" fill="#b85450" filter="url(#rough2)">max(3,3)+1 = 4</text>

  <text x="40" y="254" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 次合并后 {4}</text>

  <rect x="40" y="262" width="180" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="290" text-anchor="middle" font-size="16" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">4  ✓ 剩 1 个</text>

  <rect x="40" y="324" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="346" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 4</text>

  <!-- ===== 右侧：合并树 ===== -->
  <rect x="270" y="60" width="270" height="320" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="84" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">对应的合并树</text>

  <!-- 根：合并值 4 -->
  <rect x="370" y="100" width="70" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="405" y="122" text-anchor="middle" font-size="14" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="448" y="120" font-size="9.5" fill="#d6a040" filter="url(#rough2)">=max(3,3)+1</text>

  <!-- 根 → 3(leaf) / 3(merged) -->
  <path d="M 385 134 L 335 168" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 425 134 L 475 168" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 左叶子：街区 3 -->
  <rect x="300" y="168" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="300" y="216" font-size="9.5" fill="#446688" filter="url(#rough2)">街区（叶子）</text>

  <!-- 右内部：合并值 3 -->
  <rect x="440" y="168" width="70" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="475" y="190" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="440" y="216" font-size="9.5" fill="#b85450" filter="url(#rough2)">=max(1,2)+1</text>

  <!-- 3(merged) → 1 / 2 -->
  <path d="M 455 202 L 425 236" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 495 202 L 525 236" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 叶子 1 -->
  <rect x="390" y="236" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="257" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 叶子 2 -->
  <rect x="500" y="236" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="530" y="257" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 路径代价 -->
  <rect x="282" y="288" width="248" height="78" rx="6" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="296" y="308" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路径代价验证：</text>
  <text x="296" y="326" font-size="10" fill="#4a7a3a" filter="url(#rough2)">街区3：1·s + 3 = 1 + 3 = 4</text>
  <text x="296" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">街区1：2·s + 1 = 2 + 1 = 3</text>
  <text x="296" y="358" font-size="10" fill="#4a7a3a" filter="url(#rough2)">街区2：2·s + 2 = 2 + 2 = 4</text>

  <text x="280" y="402" font-size="11" fill="#666" filter="url(#rough2)">注：合并产生的新值（橙/红）代表「子树完工时间」，</text>
  <text x="280" y="418" font-size="11" fill="#666" filter="url(#rough2)">    叶子（蓝）代表「街区建造时间」。最终根值即答案。</text>
</svg>
