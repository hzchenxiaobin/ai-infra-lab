<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [7, 5, 6, 8, 3]</text>

  <!-- Array cells -->
  <text x="40" y="64" font-size="11" fill="#888">nums</text>
  <rect x="80" y="48" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="68" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="128" y="48" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="68" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="176" y="48" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="68" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="224" y="48" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="246" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="272" y="48" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="294" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <text x="330" y="60" font-size="11" fill="#4a7a3a" font-weight="bold">max = 8</text>
  <text x="330" y="76" font-size="11" fill="#b85450" font-weight="bold">min = 3</text>

  <text x="440" y="68" font-size="11" fill="#555">求 gcd(8, 3)</text>

  <line x1="280" y1="86" x2="280" y2="108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step table -->
  <!-- header -->
  <rect x="40" y="112" width="480" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">a</text>
  <text x="240" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b</text>
  <text x="340" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">r = a mod b</text>
  <text x="460" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">下一步</text>

  <!-- row 1 -->
  <rect x="40" y="146" width="480" height="32" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="240" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="340" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="460" y="166" text-anchor="middle" font-size="11" fill="#888">a←3, b←2</text>

  <!-- row 2 -->
  <rect x="40" y="182" width="480" height="32" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="202" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="240" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="340" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="202" text-anchor="middle" font-size="11" fill="#888">a←2, b←1</text>

  <!-- row 3: terminal -->
  <rect x="40" y="218" width="480" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="238" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="160" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="240" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="340" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="460" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b==0, 返回 1</text>

  <!-- trace of remainder drop -->
  <text x="40" y="276" font-size="11" fill="#888">余数递减：</text>
  <text x="120" y="276" font-size="11" fill="#b85450" font-weight="bold">3 &gt; 2 &gt; 1 &gt; 0</text>
  <text x="240" y="276" font-size="11" fill="#555">3 步终止，最后一个非零余数 1 即 gcd(8, 3)</text>

  <!-- insight box -->
  <rect x="40" y="294" width="480" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="316" font-size="11" fill="#555" font-weight="bold">观察要点：</text>
  <text x="56" y="336" font-size="11" fill="#555">① 每步 (a, b) → (b, a mod b)，两数都来自上一轮，无需额外数组；</text>
  <text x="56" y="354" font-size="11" fill="#555">② 余数严格递减保证必终止，最坏情况为相邻斐波那契对（如 gcd(F</text>
  <text x="426" y="358" font-size="9" fill="#555">k+1</text>
  <text x="444" y="354" font-size="11" fill="#555">, F</text>
  <text x="460" y="358" font-size="9" fill="#555">k</text>
  <text x="472" y="354" font-size="11" fill="#555">)），约 O(log)。</text>
  <text x="56" y="368" font-size="10" fill="#888">对照示例 1：gcd(10, 2) → r=0 一步返回 2；示例 3：gcd(3, 3) → r=0 一步返回 3。</text>
</svg>
