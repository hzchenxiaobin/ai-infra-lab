<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建频次表 → 遍历查 freq[v]==v → 取最大</text>

  <!-- Step 1: build freq table -->
  <rect x="60" y="56" width="440" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="80" font-size="12" fill="#4a7a3a" font-weight="bold">① 建频次表 freq</text>
  <text x="84" y="100" font-size="11" fill="#666">遍历 arr，对每个元素 v 执行 freq[v]++，统计各值出现次数</text>
  <text x="436" y="92" font-size="10" fill="#888">O(n)</text>

  <path d="M 280 116 L 280 130" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: init ans -->
  <rect x="60" y="132" width="440" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="156" font-size="12" fill="#446688" font-weight="bold">② 初始化 ans = -1</text>
  <text x="84" y="176" font-size="11" fill="#666">默认无幸运数；遍历频次表时用更大的幸运值覆盖</text>
  <text x="436" y="168" font-size="10" fill="#888">O(1)</text>

  <path d="M 280 192 L 280 208" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="280,210 440,272 280,334 120,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历 freq 每个键 v</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">freq[v] == v ?</text>

  <!-- Yes branch -->
  <path d="M 440 272 L 470 272 L 470 350" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="452" y="264" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="350" width="120" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, v)</text>
  <text x="470" y="388" text-anchor="middle" font-size="10" fill="#888">v 是幸运数</text>

  <!-- No branch -->
  <path d="M 120 272 L 90 272 L 90 350" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="264" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="30" y="350" width="120" height="46" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="372" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">跳过</text>
  <text x="90" y="388" text-anchor="middle" font-size="10" fill="#999">继续下一键</text>

  <!-- return -->
  <path d="M 470 396 L 470 410 L 280 410" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 334 L 280 410" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="220" y="410" width="160" height="22" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">返回 ans</text>
</svg>
