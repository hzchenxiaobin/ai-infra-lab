<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：预存「单词→有序下标列表」哈希表，查询时双指针归并</text>

  <!-- wordsDict array -->
  <text x="24" y="62" font-size="11.5" fill="#888">wordsDict：</text>
  <rect x="96" y="46" width="68" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="65" text-anchor="middle" font-size="10" fill="#333">practice</text>
  <rect x="168" y="46" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="65" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">makes</text>
  <rect x="240" y="46" width="68" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="274" y="65" text-anchor="middle" font-size="10" fill="#aaa">perfect</text>
  <rect x="312" y="46" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="346" y="65" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">coding</text>
  <rect x="384" y="46" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="65" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">makes</text>

  <text x="130" y="88" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="202" y="88" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="274" y="88" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="346" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="418" y="88" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>

  <!-- arrow down to hashmap -->
  <path d="M 280 96 L 280 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="296" y="106" font-size="9.5" fill="#888">遍历收集下标</text>

  <!-- HashMap box -->
  <rect x="40" y="116" width="480" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="64" y="136" font-size="11.5" fill="#446688" font-weight="bold">pos（HashMap）</text>

  <!-- makes → [1, 4] -->
  <rect x="60" y="146" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">makes</text>
  <text x="128" y="164" font-size="12" fill="#888">→</text>
  <rect x="146" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="164" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="184" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="164" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <text x="232" y="164" font-size="10" fill="#446688">pos1</text>

  <!-- coding → [3] -->
  <rect x="60" y="180" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">coding</text>
  <text x="128" y="198" font-size="12" fill="#888">→</text>
  <rect x="146" y="180" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="192" y="198" font-size="10" fill="#4a7a3a">pos2</text>

  <!-- practice → [0], perfect → [2] (smaller, faded) -->
  <rect x="330" y="146" width="66" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="363" y="164" text-anchor="middle" font-size="10" fill="#999">practice</text>
  <text x="402" y="164" font-size="11" fill="#ccc">→ [0]</text>
  <rect x="330" y="180" width="66" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="363" y="198" text-anchor="middle" font-size="10" fill="#999">perfect</text>
  <text x="402" y="198" font-size="11" fill="#ccc">→ [2]</text>

  <!-- query arrow -->
  <path d="M 280 236 L 280 252" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="296" y="248" font-size="9.5" fill="#888">查询 shortest(makes, coding)</text>

  <!-- two pointer merge -->
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">双指针归并求最小差值</text>

  <!-- pos1 row -->
  <text x="40" y="296" font-size="10.5" fill="#446688" font-weight="bold">pos1：</text>
  <rect x="90" y="282" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="301" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="140" y="282" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="301" text-anchor="middle" font-size="12" fill="#446688">4</text>
  <text x="90" y="326" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">↑i</text>

  <!-- pos2 row -->
  <text x="40" y="346" font-size="10.5" fill="#4a7a3a" font-weight="bold">pos2：</text>
  <rect x="90" y="332" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="351" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="90" y="376" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">↑j</text>

  <!-- diff annotation -->
  <text x="260" y="318" font-size="11" fill="#888">|1 − 3| = 2</text>
  <text x="260" y="318" font-size="11" fill="#888"></text>
  <rect x="250" y="306" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="11" fill="#444">1 &lt; 3 → 移动 i 靠近</text>

  <!-- key idea -->
  <rect x="250" y="340" width="270" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="385" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">移动较小侧：让小值往大值靠拢</text>
  <text x="385" y="374" text-anchor="middle" font-size="10.5" fill="#555">移动大的一侧只会让差值更大</text>
</svg>
