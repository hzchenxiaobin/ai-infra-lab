<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：words = [a, b, c, d]，groups = [1, 0, 1, 1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i = 0 必选；此后仅当 groups[i] ≠ groups[i−1] 才选中</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="58" width="65" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="165" y="58" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="235" y="58" width="155" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="58" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="80" y="75" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">i</text>
    <text x="132" y="75" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">words[i]</text>
    <text x="200" y="75" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">groups[i]</text>
    <text x="312" y="75" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">判定 groups[i] vs groups[i−1]</text>
    <text x="450" y="75" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">ans</text>
  </g>

  <!-- row 1: i=0 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="84" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="100" y="84" width="65" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="165" y="84" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="235" y="84" width="155" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="390" y="84" width="120" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="80" y="105" text-anchor="middle" fill="#333">0</text>
    <text x="132" y="105" text-anchor="middle" fill="#333">a</text>
    <text x="200" y="105" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <text x="312" y="105" text-anchor="middle" fill="#555" font-size="11">—（首元素，必选）</text>
    <text x="450" y="105" text-anchor="middle" fill="#2e5c22">[a]</text>
  </g>

  <!-- row 2: i=1 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="118" width="40" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="100" y="118" width="65" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="165" y="118" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="235" y="118" width="155" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="390" y="118" width="120" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="80" y="139" text-anchor="middle" fill="#333">1</text>
    <text x="132" y="139" text-anchor="middle" fill="#333">b</text>
    <text x="200" y="139" text-anchor="middle" fill="#2e5c22" font-weight="bold">0</text>
    <text x="312" y="139" text-anchor="middle" fill="#4a7a3a">0 ≠ 1 ✓</text>
    <text x="450" y="139" text-anchor="middle" fill="#2e5c22">[a, b]</text>
  </g>

  <!-- row 3: i=2 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="152" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="100" y="152" width="65" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="165" y="152" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="235" y="152" width="155" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <rect x="390" y="152" width="120" height="34" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="80" y="173" text-anchor="middle" fill="#333">2</text>
    <text x="132" y="173" text-anchor="middle" fill="#333">c</text>
    <text x="200" y="173" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <text x="312" y="173" text-anchor="middle" fill="#4a7a3a">1 ≠ 0 ✓</text>
    <text x="450" y="173" text-anchor="middle" fill="#2e5c22">[a, b, c]</text>
  </g>

  <!-- row 4: i=3 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="186" width="40" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="100" y="186" width="65" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="165" y="186" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="235" y="186" width="155" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <rect x="390" y="186" width="120" height="34" fill="#fafafa" stroke="#999999" stroke-width="1"/>
    <text x="80" y="207" text-anchor="middle" fill="#333">3</text>
    <text x="132" y="207" text-anchor="middle" fill="#333">d</text>
    <text x="200" y="207" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <text x="312" y="207" text-anchor="middle" fill="#b85450">1 = 1 ✗ 跳过</text>
    <text x="450" y="207" text-anchor="middle" fill="#2e5c22">[a, b, c]</text>
  </g>

  <!-- result box -->
  <rect x="70" y="242" width="420" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="280" y="266" text-anchor="middle" font-weight="bold">输出 [a, b, c]，长度 3 = 段数（[1] [0] [1,1] 共 3 段）✓</text>
    <text x="280" y="290" text-anchor="middle">示例 1 同理：groups = [0,0,1] 共 2 段 → 选中 [e, b]，长度 2</text>
  </g>
</svg>
