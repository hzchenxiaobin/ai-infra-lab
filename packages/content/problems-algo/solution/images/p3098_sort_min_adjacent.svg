<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察一：排序后，能量 = 相邻差的最小值</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">例：nums 排序为 [1, 4, 7, 9]，取出子序列 {1, 7, 9}</text>

  <!-- 排序格子 -->
  <rect x="108" y="62" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="62" width="64" height="36" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">4</text>
  <rect x="268" y="62" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <rect x="348" y="62" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">9</text>
  <text x="140" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选中</text>
  <text x="220" y="110" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">未选</text>
  <text x="300" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选中</text>
  <text x="380" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选中</text>

  <!-- 相邻差弧线 -->
  <path d="M140,116 C180,134 260,134 300,116" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">差 6</text>
  <path d="M300,116 C322,132 358,132 380,116" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">差 2</text>

  <!-- 非相邻对大弧（划掉） -->
  <path d="M140,116 C200,168 320,168 380,116" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">非相邻对：差 8 = 6 + 2 ≥ max(6, 2)</text>

  <!-- 能量强调框 -->
  <rect x="90" y="180" width="340" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">能量 = min(所有对的差) = min(6, 2) = 2</text>

  <!-- 结论框 1 -->
  <rect x="46" y="230" width="428" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">有序序列中，任意两元素之差 = 中间各段差之和</text>
  <text x="260" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇒ 非相邻差必 ≥ 某个相邻差 ⇒ 全对取 min = 相邻取 min</text>

  <!-- 结论框 2 -->
  <rect x="46" y="296" width="428" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">子序列能量只与「选了哪些元素」有关，与顺序无关</text>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇒ 先排序不失一般性，之后按下标递增枚举即可覆盖全部子序列</text>
</svg>
