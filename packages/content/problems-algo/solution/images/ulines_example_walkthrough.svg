<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fdfcf7"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">示例演算：nums1=[2,5,1,2,5] nums2=[10,5,2,1,5,2]</text>
  <path d="M 180 38 Q 310 46 440 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- 列头 nums2 -->
  <text x="60" y="76" font-size="11" fill="#888">nums2→</text>
  <text x="134" y="76" text-anchor="middle" font-size="11" fill="#888">""</text>
  <text x="182" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">10</text>
  <text x="230" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">5</text>
  <text x="278" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">2</text>
  <text x="326" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">1</text>
  <text x="374" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">5</text>
  <text x="422" y="76" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">2</text>

  <!-- 行头 nums1 -->
  <text x="56" y="112" text-anchor="end" font-size="11" fill="#888">""</text>
  <text x="56" y="142" text-anchor="end" font-size="12" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="56" y="172" text-anchor="end" font-size="12" fill="#4a8e4a" font-weight="bold">5</text>
  <text x="56" y="202" text-anchor="end" font-size="12" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="56" y="232" text-anchor="end" font-size="12" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="56" y="262" text-anchor="end" font-size="12" fill="#4a8e4a" font-weight="bold">5</text>

  <!-- dp 表格 6行 x 7列，cell 48x30, 起点 x=110,y=96 -->
  <g filter="url(#sk)">
    <!-- Row 0: all 0 (boundary) -->
    <rect x="110" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="206" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="254" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="302" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="350" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="398" y="96" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <!-- Row 1: nums1[0]=2 → [0,0,0,1,1,1,1] -->
    <rect x="110" y="126" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="126" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="206" y="126" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="254" y="126" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="302" y="126" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="350" y="126" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="398" y="126" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <!-- Row 2: nums1[1]=5 → [0,0,1,1,1,2,2] -->
    <rect x="110" y="156" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="156" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="206" y="156" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="254" y="156" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="302" y="156" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="350" y="156" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="398" y="156" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <!-- Row 3: nums1[2]=1 → [0,0,1,1,2,2,2] -->
    <rect x="110" y="186" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="186" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="206" y="186" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="254" y="186" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="302" y="186" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="350" y="186" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="398" y="186" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <!-- Row 4: nums1[3]=2 → [0,0,1,2,2,2,3] -->
    <rect x="110" y="216" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="216" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="206" y="216" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="254" y="216" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="302" y="216" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="350" y="216" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="398" y="216" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <!-- Row 5: nums1[4]=5 → [0,0,1,2,2,3,3] -->
    <rect x="110" y="246" width="48" height="30" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="158" y="246" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="206" y="246" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="254" y="246" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="302" y="246" width="48" height="30" fill="#fffdf3" stroke="#bbb" rx="3"/>
    <rect x="350" y="246" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="398" y="246" width="48" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="3"/>
  </g>

  <!-- 值 -->
  <!-- Row 0 -->
  <text x="134" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="230" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="278" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="326" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="374" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="422" y="116" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <!-- Row 1 -->
  <text x="134" y="146" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="146" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="230" y="146" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="278" y="146" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="326" y="146" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="374" y="146" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="422" y="146" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <!-- Row 2 -->
  <text x="134" y="176" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="176" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="230" y="176" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="278" y="176" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="326" y="176" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="374" y="176" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="422" y="176" text-anchor="middle" font-size="12" fill="#444">2</text>
  <!-- Row 3 -->
  <text x="134" y="206" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="206" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="230" y="206" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="278" y="206" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="326" y="206" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="374" y="206" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="422" y="206" text-anchor="middle" font-size="12" fill="#444">2</text>
  <!-- Row 4 -->
  <text x="134" y="236" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="236" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="230" y="236" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="278" y="236" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="326" y="236" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="374" y="236" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="422" y="236" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>
  <!-- Row 5 -->
  <text x="134" y="266" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="182" y="266" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="230" y="266" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="278" y="266" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="326" y="266" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="374" y="266" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="422" y="266" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">3</text>

  <!-- 答案标记 -->
  <text x="456" y="266" font-size="11" fill="#c98a2b" font-weight="bold">← 答案</text>

  <!-- 回溯路径箭头：dp[5][6]→dp[4][6]→dp[3][5]→dp[3][4]→dp[2][3]→dp[2][2] -->
  <!-- dp[4][6] match 2, dp[3][4] match 1, dp[2][2] match 5 → LCS=[5,1,2] -->
  <g filter="url(#sk)" stroke="#c98a2b" stroke-width="1.5" fill="none" stroke-dasharray="4,2">
    <path d="M 422 246 L 422 216" marker-end="url(#ar)"/>
    <path d="M 398 231 L 350 201" marker-end="url(#ar)"/>
    <path d="M 326 186 L 326 186" />
    <path d="M 326 201 L 278 171" marker-end="url(#ar)"/>
    <path d="M 254 156 L 206 156" />
  </g>

  <!-- 回溯说明 -->
  <g filter="url(#sk)">
    <rect x="470" y="126" width="140" height="156" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="482" y="148" font-size="11" fill="#2b2b2b" font-weight="bold">回溯求 LCS</text>
  <text x="482" y="168" font-size="10" fill="#444">绿格 = 匹配处</text>
  <text x="482" y="184" font-size="10" fill="#444">（nums1[i]==nums2[j]）</text>
  <text x="482" y="206" font-size="10" fill="#c98a2b">回溯路径：</text>
  <text x="482" y="222" font-size="10" fill="#444">dp[4][6]: 2==2 ✓</text>
  <text x="482" y="238" font-size="10" fill="#444">dp[3][4]: 1==1 ✓</text>
  <text x="482" y="254" font-size="10" fill="#444">dp[2][2]: 5==5 ✓</text>
  <text x="482" y="272" font-size="10" fill="#c98a2b" font-weight="bold">LCS = [5,1,2]</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="500" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="80" y="322" font-size="12" fill="#2b2b2b" font-weight="bold">填表要点</text>
  <text x="80" y="342" font-size="11" fill="#444">绿格（匹配）：dp[i][j] = dp[i-1][j-1]+1，LCS 延长 1</text>
  <text x="80" y="360" font-size="11" fill="#444">白格（不匹配）：dp[i][j] = max(上方, 左方)，继承较大值</text>

  <text x="310" y="410" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">最终 dp[5][6] = 3，对应 3 条不相交连线</text>
  <text x="310" y="428" text-anchor="middle" font-size="10" fill="#888">多条 LCS 长度相同：[5,1,2]、[2,1,2]、[5,1,5] 等</text>
</svg>
