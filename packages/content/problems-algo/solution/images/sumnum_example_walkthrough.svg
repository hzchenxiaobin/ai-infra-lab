<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：num = 443</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">枚举 k 递增，直到 k + rev(k) = 443 命中</text>

  <!-- Table: columns k(46) rev(k)(58) k+rev(k)(66) =443?(60), total 230, start x=145 -->
  <!-- Header row: y=54, h=26 -->
  <rect x="145" y="54" width="230" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="191" y1="54" x2="191" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="249" y1="54" x2="249" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="315" y1="54" x2="315" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">k</text>
  <text x="220" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">rev(k)</text>
  <text x="282" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">k + rev(k)</text>
  <text x="345" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">= 443 ?</text>

  <!-- Row 0: k=0, rev=0, sum=0, ✗ -->
  <rect x="145" y="80" width="230" height="26" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="80" x2="191" y2="106" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="80" x2="249" y2="106" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="80" x2="315" y2="106" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="98" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="220" y="98" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="282" y="98" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="345" y="98" text-anchor="middle" font-size="11" fill="#888">✗</text>

  <!-- Row 1: k=100, rev=1 (001), sum=101, ✗ -->
  <rect x="145" y="106" width="230" height="26" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="106" x2="191" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="106" x2="249" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="106" x2="315" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="124" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <text x="220" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="282" y="124" text-anchor="middle" font-size="10.5" fill="#333">101</text>
  <text x="345" y="124" text-anchor="middle" font-size="11" fill="#888">✗</text>

  <!-- Row 2: k=140, rev=41 (041), sum=181, ✗ (highlight: leading zero) -->
  <rect x="145" y="132" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="132" x2="191" y2="158" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="132" x2="249" y2="158" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="132" x2="315" y2="158" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="150" text-anchor="middle" font-size="10.5" fill="#333">140</text>
  <text x="220" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">41</text>
  <text x="282" y="150" text-anchor="middle" font-size="10.5" fill="#333">181</text>
  <text x="345" y="150" text-anchor="middle" font-size="11" fill="#888">✗</text>

  <!-- Row 3: k=170, rev=71, sum=241, ✗ -->
  <rect x="145" y="158" width="230" height="26" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="158" x2="191" y2="184" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="158" x2="249" y2="184" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="158" x2="315" y2="184" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="176" text-anchor="middle" font-size="10.5" fill="#333">170</text>
  <text x="220" y="176" text-anchor="middle" font-size="10.5" fill="#333">71</text>
  <text x="282" y="176" text-anchor="middle" font-size="10.5" fill="#333">241</text>
  <text x="345" y="176" text-anchor="middle" font-size="11" fill="#888">✗</text>

  <!-- Row 4: k=171, rev=171, sum=342, ✗ -->
  <rect x="145" y="184" width="230" height="26" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="184" x2="191" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="184" x2="249" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="184" x2="315" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="202" text-anchor="middle" font-size="10.5" fill="#333">171</text>
  <text x="220" y="202" text-anchor="middle" font-size="10.5" fill="#333">171</text>
  <text x="282" y="202" text-anchor="middle" font-size="10.5" fill="#333">342</text>
  <text x="345" y="202" text-anchor="middle" font-size="11" fill="#888">✗</text>

  <!-- Row 5: k=172, rev=271, sum=443, ✓ 命中 (highlight) -->
  <rect x="145" y="210" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <line x1="191" y1="210" x2="191" y2="236" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="249" y1="210" x2="249" y2="236" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="315" y1="210" x2="315" y2="236" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="168" y="228" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">172</text>
  <text x="220" y="228" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">271</text>
  <text x="282" y="228" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">443</text>
  <text x="345" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 命中</text>

  <!-- Arrow down to result -->
  <path d="M 260 238 L 260 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="140" y="254" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num = 443 → true（k = 172）</text>

  <!-- Notes -->
  <text x="260" y="302" text-anchor="middle" font-size="10" fill="#b85450">第 2、3 行：rev(100)=1、rev(140)=41，末尾零在反转中自然丢弃</text>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#555">num = 181：k = 140 命中（140 + 041 = 181）→ true</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#555">num = 63：枚举 [0, 63] 无命中（63 非 11 的倍数等）→ false</text>
  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#aaa">末尾零使 140 ↔ 41 不对称，故不能砍半枚举范围</text>
</svg>
