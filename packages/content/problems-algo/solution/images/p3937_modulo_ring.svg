<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：余数在环上走短弧，奇偶两组各算一张代价表</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">左：k = 5 的余数环，从余数 4 走到目标 1；右：示例 1 的分组与代价表</text>

  <text x="135" y="62" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">余数环（k = 5）</text>

  <circle cx="135" cy="178" r="72" fill="none" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <path d="M 51.3 150.9 A 88 88 0 0 1 218.7 150.9" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 方向穿 0 绕行：2 步（短弧）✓</text>

  <path d="M 89.3 163.2 A 48 48 0 1 0 180.7 163.2" fill="none" stroke="#999999" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="135" y="252" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">−1 方向硬走：3 步（长弧）✗</text>

  <rect x="122" y="90" width="26" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="106" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="190.5" y="140.8" width="26" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="203.5" y="156.8" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="164.3" y="221.2" width="26" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.3" y="237.2" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="79.7" y="221.2" width="26" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92.7" y="237.2" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="53.5" y="140.8" width="26" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="66.5" y="156.8" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="135" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dist(4, 1) =</text>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">min(3, 2) = 2</text>

  <text x="135" y="286" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">余数 0..k−1 排成环：+1 越过 k 回到 0，−1 穿过 0 到 k−1</text>
  <text x="135" y="302" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">元素可变成负数 / 超过 k，只要余数达标</text>

  <line x1="255" y1="55" x2="255" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,5" filter="url(#rough2)"/>

  <text x="384" y="62" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">奇偶解耦：两张代价表 + 一次配对</text>

  <rect x="268" y="74" width="110" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="323" y="90" text-anchor="middle" font-size="9.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">偶数位 i = 0, 2</text>
  <rect x="284" y="97" width="32" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="330" y="97" width="32" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">1</text>
  <text x="346" y="112" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">2</text>

  <rect x="390" y="74" width="110" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="90" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">奇数位 i = 1, 3</text>
  <rect x="406" y="97" width="32" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="452" y="97" width="32" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="422" y="112" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="468" y="112" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>

  <path d="M 312 132 C 304 146, 300 152, 296 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 434 132 C 442 146, 446 152, 450 162" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="272" y="166" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="297" y="186" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">x=1</text>
  <rect x="396" y="166" width="50" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="421" y="186" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">y=2</text>

  <line x1="324" y1="182" x2="394" y2="182" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="340" y="170" width="40" height="20" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="184" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">x≠y</text>

  <text x="384" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">代价表（k = 3，示例 1）</text>

  <text x="296" y="248" text-anchor="end" font-size="9.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">evenCost</text>
  <rect x="304" y="234" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="342" y="234" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="380" y="234" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="321" y="250" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">2</text>
  <text x="359" y="250" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="397" y="250" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">1</text>
  <text x="434" y="248" font-size="8.5" fill="#999" filter="url(#rough2)">r: 0 1 2</text>

  <text x="296" y="280" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">oddCost</text>
  <rect x="304" y="266" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="342" y="266" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="266" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="282" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="359" y="282" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="397" y="282" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 359 233 C 340 224, 320 222, 300 200" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="30" y="308" width="460" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans = min over x≠y ( evenCost[x] + oddCost[y] ) = 1 + 1 = 2</text>
  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">先按环形距离算清两张表，再只花 O(k²) 配对——单元素代价与目标选择彻底解耦</text>
</svg>
