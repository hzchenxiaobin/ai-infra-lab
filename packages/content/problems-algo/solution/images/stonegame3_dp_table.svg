<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：values = [1, 2, 3, 7]</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">从右向左填 dp，每行列出 3 个候选 c₁/c₂/c₃，加粗者为 dp[i]</text>

  <!-- table header -->
  <rect x="40" y="62" width="560" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="150" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c₁ = S₁ − dp[i+1]</text>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c₂ = S₂ − dp[i+2]</text>
  <text x="450" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c₃ = S₃ − dp[i+3]</text>
  <text x="572" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp[i]</text>

  <!-- separator -->
  <line x1="40" y1="92" x2="600" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row i=4 (base) -->
  <text x="70" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="150" y="114" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="300" y="114" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="450" y="114" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="572" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="40" y="124" font-size="9" fill="#4a7a3a">基准：无石子</text>

  <!-- row i=3 -->
  <text x="70" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7 − 0 = 7</text>
  <text x="300" y="144" text-anchor="middle" font-size="11" fill="#999">（仅剩 1 堆）</text>
  <text x="450" y="144" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="572" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- row i=2 -->
  <text x="70" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="150" y="174" text-anchor="middle" font-size="11" fill="#999">3 − 7 = −4</text>
  <text x="300" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(3+7) − 0 = 10</text>
  <text x="450" y="174" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="572" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- row i=1 -->
  <text x="70" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="150" y="204" text-anchor="middle" font-size="11" fill="#999">2 − 10 = −8</text>
  <text x="300" y="204" text-anchor="middle" font-size="11" fill="#999">(2+3) − 7 = −2</text>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(2+3+7) − 0 = 12</text>
  <text x="572" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- row i=0 (answer) -->
  <rect x="42" y="214" width="556" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="150" y="234" text-anchor="middle" font-size="11" fill="#999">1 − 12 = −11</text>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="#999">(1+2) − 10 = −7</text>
  <text x="450" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(1+2+3) − 7 = −1</text>
  <text x="572" y="234" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <!-- verdict -->
  <rect x="40" y="258" width="560" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="14" fill="#b85450" font-weight="bold">dp[0] = −1 &lt; 0 → Bob 获胜</text>
  <text x="60" y="302" font-size="11" fill="#666">Alice 最优是拿 3 堆（得 6），但 Bob 拿走末堆 7，净赚 −1。三个候选全为负，Alice 必输。</text>

  <!-- second example note -->
  <rect x="40" y="326" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="348" font-size="12" fill="#4a7a3a" font-weight="bold">对照示例 2：values = [1, 2, 3, −9]</text>
  <text x="60" y="368" font-size="11" fill="#666">dp[3]=−9, dp[2]=12, dp[1]=14, dp[0]=15 → Alice 拿 3 堆留 −9 给 Bob，净赚 15 &gt; 0 → Alice</text>

  <!-- takeaway -->
  <rect x="40" y="392" width="560" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="414" font-size="12" fill="#d6a040" font-weight="bold">💡 负值的意义</text>
  <text x="60" y="432" font-size="11" fill="#666">values 可为负 → 拿得多未必赚；可主动「拿负堆」把烂摊子甩给对手。这正是贪心失效、必须枚举 3 候选取 max 的根因。</text>
</svg>
