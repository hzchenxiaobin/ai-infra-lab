<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 递推结构：枚举 0 号的握手对象 k</text>

  <!-- Top: circle with n people, person 0 picks partner k -->
  <ellipse cx="120" cy="90" rx="50" ry="50" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="120" cy="40" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="44" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>
  <circle cx="170" cy="90" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="94" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">k</text>
  <path d="M 120 40 L 170 90" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="#888">n 人圆环</text>

  <!-- Arrow to split -->
  <path d="M 195 90 L 230 90" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="212" y="82" text-anchor="middle" font-size="9" fill="#888">切分</text>

  <!-- Left subproblem box -->
  <rect x="240" y="50" width="100" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左侧子问题</text>
  <text x="290" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a">人 1…k−1</text>
  <text x="290" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a">k−1 人</text>

  <!-- Multiply sign -->
  <text x="365" y="82" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">×</text>

  <!-- Right subproblem box -->
  <rect x="385" y="50" width="100" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="435" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右侧子问题</text>
  <text x="435" y="86" text-anchor="middle" font-size="10.5" fill="#446688">人 k+1…n−1</text>
  <text x="435" y="100" text-anchor="middle" font-size="10.5" fill="#446688">n−2−k 人</text>

  <!-- Divider -->
  <path d="M 40 140 L 480 140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Recurrence formula -->
  <rect x="50" y="155" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[n] = Σ dp[k−1] × dp[n−2−k],  k = 1,3,5,…,n−1</text>

  <!-- dp[8] expansion -->
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">以 n=8 为例展开：</text>

  <!-- Four terms -->
  <rect x="30" y="240" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a">k=1</text>
  <text x="80" y="273" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">dp[0]×dp[6]</text>

  <text x="140" y="265" text-anchor="middle" font-size="14" fill="#888">+</text>

  <rect x="155" y="240" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="258" text-anchor="middle" font-size="10.5" fill="#446688">k=3</text>
  <text x="205" y="273" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[2]×dp[4]</text>

  <text x="265" y="265" text-anchor="middle" font-size="14" fill="#888">+</text>

  <rect x="280" y="240" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="258" text-anchor="middle" font-size="10.5" fill="#446688">k=5</text>
  <text x="330" y="273" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[4]×dp[2]</text>

  <text x="390" y="265" text-anchor="middle" font-size="14" fill="#888">+</text>

  <rect x="405" y="240" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a">k=7</text>
  <text x="455" y="273" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">dp[6]×dp[0]</text>

  <!-- Values -->
  <rect x="100" y="305" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 1×5 + 1×2 + 2×1 + 5×1 = 14</text>

  <!-- Catalan note -->
  <rect x="60" y="360" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">dp[2m] = C_m（第 m 个卡塔兰数）</text>
  <text x="260" y="393" text-anchor="middle" font-size="10.5" fill="#4a7a3a">dp[0]=1, dp[2]=1, dp[4]=2, dp[6]=5, dp[8]=14…</text>
</svg>
