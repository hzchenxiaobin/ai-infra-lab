<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：预处理一次 + 在线逐条查询
  </text>

  <!-- top row: preprocess -->
  <rect x="22" y="58" width="140" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 建无向邻接表</text>
  <text x="92" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">选节点 0 为根</text>

  <rect x="172" y="58" width="196" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 迭代 DFS 求 depth、pa[0]</text>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[x][w] = cnt[父] + 1</text>

  <rect x="388" y="58" width="112" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 倍增递推</text>
  <text x="444" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">祖先表 pa</text>

  <path d="M162,86 L170,86" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M368,86 L386,86" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- connector down to query row -->
  <path d="M444,114 L444,142 L90,142 L90,184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="267" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">预处理完成（一次）</text>

  <!-- bottom row: per query -->
  <rect x="22" y="186" width="138" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="91" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 倍增求 LCA(a,b)</text>
  <text x="91" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">先抬齐深度，</text>
  <text x="91" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">再手拉手同抬 → c</text>

  <rect x="178" y="186" width="170" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="208" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⑤ L = dep[a]+dep[b]−2dep[c]</text>
  <text x="263" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best = max（w=1..26）</text>
  <text x="263" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt[a][w]+cnt[b][w]</text>
  <text x="263" y="258" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">−2·cnt[c][w]</text>

  <rect x="368" y="186" width="130" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ ans = L − best</text>
  <text x="433" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">收集进 answer</text>

  <path d="M160,225 L176,225" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M348,225 L366,225" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M433,264 L433,286 L91,286 L91,266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">还有查询 → 下一条</text>

  <!-- exit -->
  <path d="M262,286 L262,304" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="300" font-size="10.5" fill="#888" filter="url(#rough2)">查完</text>

  <rect x="177" y="306" width="170" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="331" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⑦ 返回 answer 数组</text>
</svg>
