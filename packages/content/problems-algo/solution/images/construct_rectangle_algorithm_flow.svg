<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从 ⌊√area⌋ 向下递减，命中即返回</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: w = ⌊√area⌋</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: area % w == 0? -->
  <polygon points="270,108 380,160 270,212 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="12" fill="#333">area % w == 0 ?</text>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#666">(w 是 area 的因子)</text>

  <!-- Yes branch -> return -->
  <path d="M 380 160 L 452 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="152" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="446" y="138" width="86" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="489" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">命中</text>
  <text x="489" y="174" text-anchor="middle" font-size="11" fill="#333">w 为最优宽</text>

  <!-- arrow down from return box to end -->
  <path d="M 489 186 L 489 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="489" cy="244" rx="58" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="489" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>
  <text x="489" y="256" text-anchor="middle" font-size="11" fill="#333">[area/w, w]</text>

  <!-- No branch -> w-- -->
  <path d="M 160 160 L 96 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="152" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="14" y="138" width="82" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="160" text-anchor="middle" font-size="11" fill="#333">w 不整除</text>
  <text x="55" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">w = w − 1</text>

  <!-- loop back arrow from w-- box down then right then up to decision -->
  <path d="M 55 182 L 55 300 L 270 300 L 270 212" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#888">继续试探下一个更小的 w</text>

  <!-- termination guarantee note -->
  <rect x="40" y="330" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">终止保证：w 一路递减，最坏到 1，而 area % 1 == 0 恒成立</text>
  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#666">最坏情况 area 为质数 ⇒ 循环 ⌊√area⌋ 次（如 area=37 时减 6 次到 1）</text>
  <text x="270" y="388" text-anchor="middle" font-size="10" fill="#888">时间 O(√area)，空间 O(1)</text>
</svg>
