<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=6 时位置 1 的归位轨迹（mod 5）</text>

  <!-- Row labels -->
  <text x="56" y="72" font-size="11" fill="#888" filter="url(#rough2)">步数 k</text>
  <text x="56" y="120" font-size="11" fill="#888" filter="url(#rough2)">位置 pos</text>
  <text x="56" y="176" font-size="11" fill="#888" filter="url(#rough2)">计算</text>

  <!-- 6 columns: step 0..4, cell width 84, start x=120 -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="148" y="72" filter="url(#rough2)">0</text>
    <text x="232" y="72" filter="url(#rough2)">1</text>
    <text x="316" y="72" filter="url(#rough2)">2</text>
    <text x="400" y="72" filter="url(#rough2)">3</text>
    <text x="484" y="72" filter="url(#rough2)">4</text>
  </g>

  <!-- step row highlight boxes -->
  <g>
    <rect x="108" y="56" width="80" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <rect x="192" y="56" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="276" y="56" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="360" y="56" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="444" y="56" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  </g>

  <!-- pos row circles: 1, 2, 4, 3, 1 -->
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <circle cx="148" cy="116" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="148" y="121" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="148" y="148" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">起点</text>

    <circle cx="232" cy="116" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="232" y="121" fill="#d6a040" filter="url(#rough2)">2</text>

    <circle cx="316" cy="116" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="316" y="121" fill="#d6a040" filter="url(#rough2)">4</text>

    <circle cx="400" cy="116" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="400" y="121" fill="#d6a040" filter="url(#rough2)">3</text>

    <circle cx="484" cy="116" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="484" y="121" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="484" y="148" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">归位 ✓</text>
  </g>

  <!-- arrows between pos circles -->
  <g>
    <path d="M 168 116 L 212 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 252 116 L 296 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 336 116 L 380 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 420 116 L 464 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- computation row -->
  <g font-size="11" text-anchor="middle">
    <text x="148" y="176" fill="#aaa" filter="url(#rough2)">—</text>
    <rect x="192" y="160" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="232" y="176" fill="#446688" filter="url(#rough2)">2×1 = 2</text>
    <text x="232" y="186" font-size="8.5" fill="#888" filter="url(#rough2)">2 &lt; 5</text>

    <rect x="276" y="160" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="316" y="176" fill="#446688" filter="url(#rough2)">2×2 = 4</text>
    <text x="316" y="186" font-size="8.5" fill="#888" filter="url(#rough2)">4 &lt; 5</text>

    <rect x="360" y="160" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="400" y="176" fill="#446688" filter="url(#rough2)">2×4=8≡3</text>
    <text x="400" y="186" font-size="8.5" fill="#888" filter="url(#rough2)">8 mod 5</text>

    <rect x="444" y="160" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="484" y="176" fill="#4a7a3a" filter="url(#rough2)">2×3=6≡1</text>
    <text x="484" y="186" font-size="8.5" fill="#888" filter="url(#rough2)">6 mod 5</text>
  </g>

  <!-- Full-array cross check -->
  <path d="M 40 214 L 520 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">完整数组对照（n=6）</text>

  <!-- array states per step -->
  <g font-size="11" text-anchor="middle">
    <text x="148" y="258" fill="#888" filter="url(#rough2)">初始</text>
    <text x="232" y="258" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第1步</text>
    <text x="316" y="258" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第2步</text>
    <text x="400" y="258" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第3步</text>
    <text x="484" y="258" fill="#b85450" font-weight="bold" filter="url(#rough2)">第4步</text>
  </g>

  <g font-size="11.5" text-anchor="middle">
    <rect x="108" y="266" width="80" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="283" fill="#888" filter="url(#rough2)">0,1,2,3,4,5</text>
    <rect x="192" y="266" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="232" y="283" fill="#555" filter="url(#rough2)">0,3,1,4,2,5</text>
    <rect x="276" y="266" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="316" y="283" fill="#555" filter="url(#rough2)">0,4,3,2,1,5</text>
    <rect x="360" y="266" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="400" y="283" fill="#555" filter="url(#rough2)">0,2,4,1,3,5</text>
    <rect x="444" y="266" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="484" y="283" fill="#b85450" font-weight="bold" filter="url(#rough2)">0,1,2,3,4,5</text>
  </g>

  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">追踪位置 1：元素「1」的所在位置 = 1→2→4→3→1，与数组中值 1 的位移一致</text>

  <!-- Conclusion -->
  <rect x="88" y="328" width="384" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">位置 1 在第 4 步归位 → 2⁴ ≡ 16 ≡ 1 (mod 5)</text>
  <text x="280" y="364" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">step = 4 → 返回 4</text>

  <!-- Footer -->
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">红圈=起点/归位；橙圈=中途位置；2 模 5 的乘法阶 = 4</text>
</svg>
