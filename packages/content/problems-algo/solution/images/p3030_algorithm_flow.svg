<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举窗口 → 判定 → 散射 → 收官</text>

  <!-- step 1 -->
  <rect x="170" y="38" width="180" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举窗口左上角 (i, j)</text>
  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i ∈ [0, m−3]，j ∈ [0, n−3]</text>

  <path d="M 260 84 L 260 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: 12 pairs -->
  <path d="M 260 106 L 350 142 L 260 178 L 170 142 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">12 条相邻对全达标？</text>
  <text x="260" y="156" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（横 6 + 竖 6，|差| ≤ t）</text>

  <!-- no branch loop back -->
  <path d="M 350 142 L 448 142 L 448 61 L 353 61" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否：跳过</text>

  <!-- yes branch -->
  <path d="M 260 178 L 260 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- step 2: avg -->
  <rect x="170" y="200" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">avg = ⌊窗口九格之和 / 9⌋</text>
  <text x="260" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（先向下取整！）</text>

  <path d="M 260 242 L 260 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: scatter -->
  <rect x="170" y="264" width="180" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">散射到窗口内 9 个像素</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">sum[p] += avg；cnt[p] += 1</text>

  <!-- loop back to next window -->
  <path d="M 170 287 L 70 287 L 70 61 L 166 61" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="100" y="278" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下一个窗口</text>

  <path d="M 260 310 L 260 328" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="278" y="324" font-size="10.5" fill="#555" filter="url(#rough2)">枚举完毕</text>

  <!-- final -->
  <rect x="140" y="332" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">收官：cnt &gt; 0 → result = ⌊sum/cnt⌋</text>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">cnt = 0 → 沿用 image[i][j] 原值</text>

  <path d="M 260 382 L 260 398" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="185" y="402" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 result 网格</text>

  <!-- side note: numeric range -->
  <rect x="368" y="200" width="140" height="110" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="438" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">数值范围</text>
  <text x="438" y="242" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">窗口和 ≤ 255×9 = 2295</text>
  <text x="438" y="260" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">聚合 sum ≤ 2295，cnt ≤ 9</text>
  <text x="438" y="278" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">全程 int，无溢出风险</text>
  <text x="438" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（m, n ≤ 500）</text>
</svg>
