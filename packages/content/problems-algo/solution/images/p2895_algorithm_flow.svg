<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 一次线性扫描</text>

  <!-- Start -->
  <ellipse cx="80" cy="60" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 126 60 L 168 60" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort processorTime ascending -->
  <rect x="172" y="42" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="262" y="59" text-anchor="middle" font-size="11" fill="#333">processorTime 升序排序</text>
  <text x="262" y="72" text-anchor="middle" font-size="9" fill="#888">早空闲的排前面</text>

  <path d="M 352 60 L 394 60" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort tasks descending -->
  <rect x="398" y="42" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="478" y="59" text-anchor="middle" font-size="11" fill="#333">tasks 降序排序</text>
  <text x="478" y="72" text-anchor="middle" font-size="9" fill="#888">长任务排前面</text>

  <path d="M 478 78 C 478 100, 478 104, 478 118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="408" y="120" width="140" height="32" fill="#fff" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="478" y="140" text-anchor="middle" font-size="11" fill="#333">ans = 0，i = 0</text>

  <path d="M 408 136 L 340 136" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop body -->
  <rect x="128" y="112" width="212" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="234" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = max(ans,</text>
  <text x="234" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p[i] + tasks[4·i])</text>
  <text x="234" y="104" text-anchor="middle" font-size="9" fill="#d6a040">组内最长任务恰是 tasks[4i]</text>

  <path d="M 234 160 C 234 180, 234 184, 234 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i++ and check -->
  <polygon points="234,200 300,228 234,256 168,228" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234" y="225" text-anchor="middle" font-size="11" fill="#333">i++ 后</text>
  <text x="234" y="240" text-anchor="middle" font-size="11" fill="#333">还有处理器？</text>

  <!-- yes: loop back -->
  <path d="M 168 228 C 110 228, 100 160, 118 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- no: output -->
  <path d="M 300 228 C 350 228, 370 228, 412 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="220" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="416" y="210" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出 ans</text>

  <!-- Bottom complexity note -->
  <rect x="20" y="290" width="540" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="312" font-size="12" fill="#333" font-weight="bold">🔑 为什么每组只看 tasks[4·i] 一个数？</text>
  <text x="35" y="332" font-size="11" fill="#666">降序排列后，第 i 组（4 个连续任务）的最大值就是首元素 tasks[4i]，</text>
  <text x="290" y="332" font-size="11" fill="#666">其余 3 个任务在该处理器上更早完成，不影响答案</text>
</svg>
