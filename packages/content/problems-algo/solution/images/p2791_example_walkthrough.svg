<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1 演算：parent=[−1,0,0,1,1,2], s="acaabc"</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">mask 序列 = [0, 4, 1, 5, 6, 5]（对应 a=bit0, b=bit1, c=bit2）</text>

  <!-- Table header -->
  <rect x="30" y="52" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v</text>
  <rect x="80" y="52" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mask</text>
  <rect x="140" y="52" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">匹配的 u（已入表）</text>
  <rect x="340" y="52" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Δans</text>
  <rect x="400" y="52" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累计 ans</text>

  <!-- Row 0: v=0, mask=0 -->
  <rect x="30" y="82" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="98" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="82" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="140" y="82" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="98" font-size="10" fill="#888">（空表，无匹配）</text>
  <rect x="340" y="82" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="98" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="400" y="82" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <!-- Row 1: v=1, mask=4 -->
  <rect x="30" y="108" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="108" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="140" y="108" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="124" font-size="10" fill="#4a7a3a">u=0 (m=0=4⊕4)</text>
  <rect x="340" y="108" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="108" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: v=2, mask=1 -->
  <rect x="30" y="134" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="134" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="140" y="134" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="150" font-size="10" fill="#4a7a3a">u=0 (m=0=1⊕1)</text>
  <rect x="340" y="134" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="134" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row 3: v=3, mask=5 -->
  <rect x="30" y="160" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="80" y="160" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="140" y="160" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="176" font-size="10" fill="#4a7a3a">u=1(m=4=5⊕1), u=2(m=1=5⊕4)</text>
  <rect x="340" y="160" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="400" y="160" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 4: v=4, mask=6 -->
  <rect x="30" y="186" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="202" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="80" y="186" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="202" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="140" y="186" width="200" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="202" font-size="10" fill="#4a7a3a">u=1 (m=4=6⊕2)</text>
  <rect x="340" y="186" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="186" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 5: v=5, mask=5 -->
  <rect x="30" y="212" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="80" y="212" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="140" y="212" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="228" font-size="10" fill="#b85450">u=3(m=5=5⊕0), u=1(m=4), u=2(m=1)</text>
  <rect x="340" y="212" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="400" y="212" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8</text>

  <!-- Summary box -->
  <rect x="30" y="256" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="278" font-size="11" fill="#4a7a3a" font-weight="bold">匹配规则回顾</text>
  <text x="50" y="296" font-size="10" fill="#666">mask[u] ⊕ mask[v] 的 popcount ≤ 1 即可排回文</text>
  <text x="50" y="308" font-size="10" fill="#666">等价于：mask[u] == mask[v]（全偶）或 mask[u] == mask[v] ⊕ (1&lt;&lt;k)（恰好一个奇）</text>

  <!-- Note -->
  <rect x="30" y="324" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="10" fill="#666" font-weight="bold">注意</text>
  <text x="50" y="360" font-size="10" fill="#666">v=5 时 mask=5 与 v=3 的 mask=5 相同 → ⊕=0（全偶），同时与 m=4(=5⊕1)、m=1(=5⊕4)</text>
  <text x="50" y="374" font-size="10" fill="#666">各匹配一个 → 合计 3 个新增配对，累计 5+3 = 8 ✓</text>
</svg>
