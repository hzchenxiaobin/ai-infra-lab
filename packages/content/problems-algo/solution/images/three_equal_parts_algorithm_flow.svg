<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三等分算法流程</text>

  <!-- Box1: count ones -->
  <rect x="160" y="40" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">扫描数组，收集 1 的下标 ones[]</text>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: m % 3 != 0 ? -->
  <polygon points="280,98 360,140 280,182 200,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333">m % 3 ≠ 0 ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">1 总数被 3 整除?</text>
  <!-- 是 -> return [-1,-1] -->
  <line x1="360" y1="140" x2="398" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="134" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="398" y="124" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return [−1,−1]</text>
  <!-- 否 ↓ -->
  <text x="294" y="200" font-size="10" fill="#4a7a3a">否</text>
  <line x1="280" y1="182" x2="280" y2="206" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond3: m == 0 ? -->
  <polygon points="280,208 352,246 280,284 208,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333">m == 0 ?</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#888">全 0 ?</text>
  <!-- 是 -> return [0,2] -->
  <line x1="352" y1="246" x2="398" y2="246" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="398" y="230" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return [0, 2]</text>
  <!-- 否 ↓ -->
  <text x="294" y="302" font-size="10" fill="#4a7a3a">否</text>
  <line x1="280" y1="284" x2="280" y2="308" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: compute k and trailing -->
  <rect x="120" y="310" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333">k = m / 3</text>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#333">trailing = n − 1 − ones[−1]</text>
  <line x1="280" y1="354" x2="280" y2="372" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5: compute ends -->
  <rect x="110" y="374" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="12" fill="#333">算 p1End, p2End, p3End → 定 i, j</text>
  <line x1="280" y1="414" x2="280" y2="432" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond6: three segments equal ? -->
  <polygon points="280,434 370,476 280,518 190,476" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="12" fill="#333">三段位串</text>
  <text x="280" y="490" text-anchor="middle" font-size="12" fill="#333">完全相等?</text>
  <!-- 否 -> return [-1,-1] -->
  <line x1="370" y1="476" x2="398" y2="476" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="470" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="398" y="460" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="481" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return [−1,−1]</text>

  <!-- 是 ↓ -> return (note: down then to right side green box) -->
  <text x="294" y="534" font-size="10" fill="#4a7a3a">是</text>
  <line x1="280" y1="518" x2="280" y2="540" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final green box -->
  <rect x="150" y="542" width="260" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="563" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return [p1End, p2End + 1]</text>
  <text x="280" y="578" text-anchor="middle" font-size="10" fill="#888">逐位比较通过即得答案</text>
</svg>
