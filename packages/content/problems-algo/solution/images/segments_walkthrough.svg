<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrdown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M 0 0 L 5 9 L 10 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s = "Hello, my name is John"（长度 22）</text>

  <!-- Count labels above segment-start cells -->
  <!-- i=0 center x = 40+11 = 51 -->
  <text x="51" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count→1</text>
  <path d="M 51 56 L 51 66" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrdown)" filter="url(#rough2)"/>

  <!-- i=7 center x = 40+7*22+11 = 205 -->
  <text x="205" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count→2</text>
  <path d="M 205 56 L 205 66" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrdown)" filter="url(#rough2)"/>

  <!-- i=10 center x = 40+10*22+11 = 271 -->
  <text x="271" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count→3</text>
  <path d="M 271 56 L 271 66" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrdown)" filter="url(#rough2)"/>

  <!-- i=15 center x = 40+15*22+11 = 381 -->
  <text x="381" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count→4</text>
  <path d="M 381 56 L 381 66" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrdown)" filter="url(#rough2)"/>

  <!-- i=18 center x = 40+18*22+11 = 447 -->
  <text x="447" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count→5</text>
  <path d="M 447 56 L 447 66" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrdown)" filter="url(#rough2)"/>

  <!-- Cells row at y=70, height=32, cell=22px, start x=40 -->
  <!-- index 0: 'H' (GREEN - seg start) -->
  <rect x="40" y="70" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">H</text>
  <!-- index 1: 'e' -->
  <rect x="62" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="73" y="91" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- index 2: 'l' -->
  <rect x="84" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="91" text-anchor="middle" font-size="12" fill="#333">l</text>
  <!-- index 3: 'l' -->
  <rect x="106" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="117" y="91" text-anchor="middle" font-size="12" fill="#333">l</text>
  <!-- index 4: 'o' -->
  <rect x="128" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="139" y="91" text-anchor="middle" font-size="12" fill="#333">o</text>
  <!-- index 5: ',' -->
  <rect x="150" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="161" y="91" text-anchor="middle" font-size="12" fill="#333">,</text>
  <!-- index 6: ' ' -->
  <rect x="172" y="70" width="22" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="183" y="91" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- index 7: 'm' (GREEN) -->
  <rect x="194" y="70" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m</text>
  <!-- index 8: 'y' -->
  <rect x="216" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="227" y="91" text-anchor="middle" font-size="12" fill="#333">y</text>
  <!-- index 9: ' ' -->
  <rect x="238" y="70" width="22" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="249" y="91" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- index 10: 'n' (GREEN) -->
  <rect x="260" y="70" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="271" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>
  <!-- index 11: 'a' -->
  <rect x="282" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="293" y="91" text-anchor="middle" font-size="12" fill="#333">a</text>
  <!-- index 12: 'm' -->
  <rect x="304" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="91" text-anchor="middle" font-size="12" fill="#333">m</text>
  <!-- index 13: 'e' -->
  <rect x="326" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="91" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- index 14: ' ' -->
  <rect x="348" y="70" width="22" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="359" y="91" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- index 15: 'i' (GREEN) -->
  <rect x="370" y="70" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="381" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <!-- index 16: 's' -->
  <rect x="392" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="403" y="91" text-anchor="middle" font-size="12" fill="#333">s</text>
  <!-- index 17: ' ' -->
  <rect x="414" y="70" width="22" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="91" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- index 18: 'J' (GREEN) -->
  <rect x="436" y="70" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="447" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">J</text>
  <!-- index 19: 'o' -->
  <rect x="458" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="469" y="91" text-anchor="middle" font-size="12" fill="#333">o</text>
  <!-- index 20: 'h' -->
  <rect x="480" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="491" y="91" text-anchor="middle" font-size="12" fill="#333">h</text>
  <!-- index 21: 'n' -->
  <rect x="502" y="70" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="513" y="91" text-anchor="middle" font-size="12" fill="#333">n</text>

  <!-- Index labels for key positions -->
  <text x="51" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="205" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="271" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="381" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="447" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- Step log box -->
  <rect x="30" y="128" width="540" height="190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <!-- Step rows -->
  <rect x="46" y="144" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=0</text>
  <text x="106" y="158" font-size="11" fill="#555">i==0 且 s[0]='H'≠' ' → 段开始, count = 1</text>

  <rect x="46" y="170" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=1~6</text>
  <text x="106" y="184" font-size="11" fill="#555">s[i−1]≠' '（段内字符）或 s[i]==' ' → 不计, count 不变</text>

  <rect x="46" y="196" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=7</text>
  <text x="106" y="210" font-size="11" fill="#555">s[6]==' ' 且 s[7]='m'≠' ' → 段开始, count = 2</text>

  <rect x="46" y="222" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=10</text>
  <text x="106" y="236" font-size="11" fill="#555">s[9]==' ' 且 s[10]='n'≠' ' → 段开始, count = 3</text>

  <rect x="46" y="248" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=15</text>
  <text x="106" y="262" font-size="11" fill="#555">s[14]==' ' 且 s[15]='i'≠' ' → 段开始, count = 4</text>

  <rect x="46" y="274" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=18</text>
  <text x="106" y="288" font-size="11" fill="#555">s[17]==' ' 且 s[18]='J'≠' ' → 段开始, count = 5</text>

  <!-- Result -->
  <rect x="180" y="308" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">段数 = 5</text>

  <!-- Legend -->
  <rect x="430" y="312" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="446" y="322" font-size="9" fill="#888">段开始</text>
  <rect x="430" y="328" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="446" y="338" font-size="9" fill="#888">段内字符</text>
</svg>
