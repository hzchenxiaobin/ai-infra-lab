<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "babacc"，queries = ([1,3,3], "bcb")</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">每步改一个字符，线段树根 maxLen 即答案；红框=改动位，绿底=最长重复段</text>

  <!-- column headers -->
  <text x="40" y="76" font-size="10.5" fill="#446688" font-weight="bold">查询</text>
  <text x="110" y="76" font-size="10.5" fill="#446688" font-weight="bold">操作</text>
  <text x="250" y="76" font-size="10.5" fill="#446688" font-weight="bold">更新后 s</text>
  <text x="470" y="76" font-size="10.5" fill="#446688" font-weight="bold">maxLen</text>

  <line x1="32" y1="84" x2="528" y2="84" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Query 1: s[1]='b' -> "bbbacc" ===== -->
  <text x="40" y="108" font-size="11" fill="#333" font-weight="bold">Q1</text>
  <text x="110" y="108" font-size="10" fill="#555">s[1] ← 'b'</text>
  <!-- string "bbbacc", pos1 changed, run "bbb" (0-2) highlighted -->
  <rect x="180" y="92" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="92" width="34" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="233" y="115" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <rect x="252" y="92" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="288" y="92" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="115" text-anchor="middle" font-size="13" fill="#888">a</text>
  <rect x="324" y="92" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="115" text-anchor="middle" font-size="13" fill="#888">c</text>
  <rect x="360" y="92" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="115" text-anchor="middle" font-size="13" fill="#888">c</text>
  <text x="470" y="115" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="492" y="115" font-size="9.5" fill="#888">"bbb"</text>

  <!-- arrow down -->
  <path d="M 280 130 L 280 142" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Query 2: s[3]='c' -> "bbbccc" ===== -->
  <text x="40" y="166" font-size="11" fill="#333" font-weight="bold">Q2</text>
  <text x="110" y="166" font-size="10" fill="#555">s[3] ← 'c'</text>
  <rect x="180" y="150" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="150" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="252" y="150" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="288" y="150" width="34" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="173" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <rect x="324" y="150" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="360" y="150" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="470" y="173" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="492" y="173" font-size="9.5" fill="#888">"bbb"/"ccc"</text>

  <!-- arrow down -->
  <path d="M 280 188 L 280 200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Query 3: s[3]='b' -> "bbbbcc" ===== -->
  <text x="40" y="224" font-size="11" fill="#333" font-weight="bold">Q3</text>
  <text x="110" y="224" font-size="10" fill="#555">s[3] ← 'b'</text>
  <rect x="180" y="208" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="208" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="252" y="208" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="288" y="208" width="34" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="231" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <rect x="324" y="208" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="231" text-anchor="middle" font-size="13" fill="#888">c</text>
  <rect x="360" y="208" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="231" text-anchor="middle" font-size="13" fill="#888">c</text>
  <text x="470" y="231" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="492" y="231" font-size="9.5" fill="#888">"bbbb"</text>

  <!-- ===== conclusion ===== -->
  <rect x="32" y="262" width="496" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结论</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#333">Q3 把 s[3] 从 'c' 改回 'b'，与左侧 "bbb" 桥接成 "bbbb"</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案数组 = [3, 3, 4]</text>

  <!-- ===== key insight ===== -->
  <text x="32" y="350" font-size="10.5" fill="#444" font-weight="bold">要点：Q3 的改动让左右两段 'b' 连通——这正是 merge 时 L.sufLen + R.preLen 桥接生效的场景。</text>
  <text x="32" y="368" font-size="10.5" fill="#444">单点更新仅 O(log n) 个祖先节点重算，无需扫描整个串；k 次查询共 O(k log n)。</text>
  <text x="32" y="386" font-size="10.5" fill="#888">对比暴力：每次查询后 O(n) 扫描最长重复段，k 次共 O(k·n) ≈ 10^10，超时。</text>
</svg>
