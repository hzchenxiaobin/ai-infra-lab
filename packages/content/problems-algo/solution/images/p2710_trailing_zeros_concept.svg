<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">尾随零概念：掐掉末尾连续的 0</text>

  <!-- ===== input string: 5 1 2 3 0 1 0 0 ===== -->
  <text x="50" y="74" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 num = "51230100"</text>

  <!-- 8 digit boxes, 40px wide each, starting x=50 -->
  <!-- 5 -->
  <rect x="50" y="86" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <!-- 1 -->
  <rect x="92" y="86" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <!-- 2 -->
  <rect x="134" y="86" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <!-- 3 -->
  <rect x="176" y="86" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <!-- 0 (middle, kept) -->
  <rect x="218" y="86" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <!-- 1 (last non-zero, cut point) -->
  <rect x="260" y="86" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- 0 trailing -->
  <rect x="302" y="86" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="115" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">0</text>
  <!-- 0 trailing -->
  <rect x="344" y="86" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="364" y="115" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- bracket for trailing zeros -->
  <path d="M 300 138 L 300 148 L 386 148 L 386 138" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="343" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">尾随零 ×2</text>

  <!-- cut line marker between index 5 and 6 -->
  <path d="M 301 76 L 301 60" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301" y="54" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 i=5</text>

  <!-- strip arrow -->
  <path d="M 322 178 L 322 200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">掐掉</text>

  <!-- ===== output string: 5 1 2 3 0 1 ===== -->
  <text x="50" y="218" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 "512301"</text>

  <!-- 6 digit boxes -->
  <rect x="50" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="259" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="259" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="259" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="259" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="218" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="259" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="230" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- kept bracket -->
  <path d="M 48 282 L 48 292 L 302 292 L 302 282" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="175" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">保留 num[0..5]，含最后一个非零字符</text>

  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">中间的 0 不是尾随零，保留不动</text>
</svg>
