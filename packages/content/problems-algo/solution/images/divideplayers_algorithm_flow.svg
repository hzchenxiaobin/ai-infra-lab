<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 492" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="492" fill="#fafafa"/>

  <text x="270" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求 target → 整除判定 → 排序 → 双指针循环配对</text>

  <!-- N1 输入 -->
  <rect x="195" y="34" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="57" text-anchor="middle" font-size="12.5" fill="#333">输入 skill[ ]，n 为偶数</text>
  <path d="M 270 70 L 270 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2 total -->
  <rect x="210" y="90" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="12.5" fill="#333">total = Σ skill</text>
  <path d="M 270 126 L 270 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 整除判定 -->
  <polygon points="270,148 362,180 270,212 178,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">total mod (n/2)</text>
  <text x="270" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">= 0 ?</text>
  <!-- 否 → return -1 -->
  <path d="M 362 180 L 432 180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="394" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="432" y="162" width="98" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="185" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return −1</text>
  <!-- 是 ↓ -->
  <path d="M 270 212 L 270 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- N3 target + sort -->
  <rect x="140" y="232" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="255" text-anchor="middle" font-size="12.5" fill="#333">target = total/(n/2) ；sort(skill)</text>
  <path d="M 270 268 L 270 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N4 init -->
  <rect x="205" y="288" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="311" text-anchor="middle" font-size="12.5" fill="#333">i=0, j=n−1, ans=0</text>
  <path d="M 270 324 L 270 342" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D_loop i<j? -->
  <polygon points="270,346 360,378 270,410 180,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="383" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i &lt; j ?</text>
  <!-- 否 → return ans -->
  <path d="M 360 378 L 432 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="394" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="432" y="360" width="98" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="383" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return ans</text>
  <!-- 是 ↓ -->
  <path d="M 270 410 L 270 428" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="424" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- D_pair 和==target? -->
  <polygon points="270,432 360,458 270,484 180,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="455" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">a[i]+a[j]</text>
  <text x="270" y="470" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">= target ?</text>
  <!-- 否 → return -1 -->
  <path d="M 360 458 L 432 458" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="394" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="432" y="440" width="98" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="463" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return −1</text>

  <!-- 是 → action → loop back to D_loop (left side) -->
  <path d="M 180 458 L 130 458 L 130 378 L 178 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="74" y="404" font-size="11" fill="#4a7a3a" font-weight="bold">是：ans +=</text>
  <text x="74" y="418" font-size="11" fill="#4a7a3a" font-weight="bold">a[i]·a[j]</text>
  <text x="74" y="432" font-size="11" fill="#4a7a3a" font-weight="bold">i++; j−−</text>
</svg>
