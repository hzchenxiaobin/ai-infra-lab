<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：edges=[2,2,3,-1], node1=0, node2=1</text>

  <!-- graph -->
  <circle cx="70" cy="74" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="70" cy="120" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="180" cy="97" r="15" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="290" cy="97" r="15" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="350" y="101" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">-1</text>
  <line x1="85" y1="80" x2="164" y2="93" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="85" y1="114" x2="164" y2="101" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="195" y1="97" x2="274" y2="97" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <line x1="305" y1="97" x2="335" y2="97" stroke="#999" stroke-width="1.3" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- left: dist1 walk -->
  <text x="30" y="160" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 从 node1=0 行走</text>
  <rect x="30" y="168" width="230" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="100" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="160" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist1[cur]</text>
  <text x="235" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">下一跳</text>

  <rect x="30" y="190" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="204" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="160" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="235" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→2</text>

  <rect x="30" y="210" width="230" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="224" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="160" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="224" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→3</text>

  <rect x="30" y="230" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="160" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="244" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-1 停</text>

  <text x="30" y="266" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dist1 = [0, ∅, 1, 2]</text>

  <!-- right: dist2 walk -->
  <text x="290" y="160" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 从 node2=1 行走</text>
  <rect x="290" y="168" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="360" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="420" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist2[cur]</text>
  <text x="495" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">下一跳</text>

  <rect x="290" y="190" width="230" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="420" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="495" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→2</text>

  <rect x="290" y="210" width="230" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="360" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="495" y="224" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→3</text>

  <rect x="290" y="230" width="230" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="360" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="420" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="495" y="244" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-1 停</text>

  <text x="290" y="266" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dist2 = [∅, 0, 1, 2]</text>

  <!-- bottom: combined max table -->
  <text x="30" y="300" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 逐点取 max，求最小</text>
  <rect x="30" y="308" width="490" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">节点</text>
  <text x="140" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist1</text>
  <text x="220" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dist2</text>
  <text x="300" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">max</text>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">是否候选</text>

  <!-- node 0 -->
  <rect x="30" y="332" width="490" height="22" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="347" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="140" y="347" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="347" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">∅</text>
  <text x="300" y="347" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-</text>
  <text x="430" y="347" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">node2 不可达 ✗</text>

  <!-- node 1 -->
  <rect x="30" y="354" width="490" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="369" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="140" y="369" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">∅</text>
  <text x="220" y="369" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="369" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-</text>
  <text x="430" y="369" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">node1 不可达 ✗</text>

  <!-- node 2 (best) -->
  <rect x="30" y="376" width="490" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="391" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="140" y="391" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="391" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="391" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="430" y="391" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ best=1</text>

  <!-- node 3 -->
  <rect x="30" y="398" width="490" height="22" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="413" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="140" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="220" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="413" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="430" y="413" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2 &gt; 1 ✗</text>

  <!-- result -->
  <rect x="30" y="432" width="490" height="36" rx="8" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold" filter="url(#rough2)">答案 = 2（max(1,1)=1 最小，编号最小优先）</text>
</svg>
