<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个升序数组 → 双指针归并，首次相等即最小公共值</text>

  <!-- nums1 label -->
  <text x="60" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">nums1</text>
  <!-- nums1 cells: [1,2,3] -->
  <rect x="90" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="56" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="178" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- i pointer on nums1[1] (value 2) -->
  <path d="M 156 96 L 156 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i</text>

  <!-- nums2 label -->
  <text x="60" y="172" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">nums2</text>
  <!-- nums2 cells: [2,4] -->
  <rect x="90" y="152" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="174" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="134" y="152" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- j pointer on nums2[0] (value 2) -->
  <path d="M 112 192 L 112 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">j</text>

  <!-- match annotation -->
  <path d="M 156 138 L 156 146 L 112 146 L 112 150" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="210" y="150" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="285" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相等 → 命中，返回 2</text>

  <!-- three-branch rule box -->
  <rect x="40" y="246" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">三分支决策（每步只丢弃严格较小的一侧）</text>
  <text x="60" y="288" font-size="11.5" fill="#446688" font-weight="bold">nums1[i] &lt; nums2[j] → i++</text>
  <text x="60" y="306" font-size="11.5" fill="#4a7a3a" font-weight="bold">nums1[i] &gt; nums2[j] → j++</text>
  <text x="60" y="324" font-size="11.5" fill="#b85450" font-weight="bold">nums1[i] == nums2[j] → 返回 nums1[i]</text>
  <text x="330" y="306" font-size="11" fill="#888">游标越界 → -1</text>
</svg>
