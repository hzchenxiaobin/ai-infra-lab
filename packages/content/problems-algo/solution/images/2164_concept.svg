<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：奇偶下标解耦为两组独立排序</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">偶数下标非递减 ↑ ｜ 奇数下标非递增 ↓</text>

  <!-- ===== Step 1: original array [4,1,2,3] ===== -->
  <text x="60" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 原数组（按下标奇偶着色）</text>

  <!-- index labels -->
  <text x="82" y="76" text-anchor="middle" font-size="9" fill="#888">下标0</text>
  <text x="126" y="76" text-anchor="middle" font-size="9" fill="#888">下标1</text>
  <text x="170" y="76" text-anchor="middle" font-size="9" fill="#888">下标2</text>
  <text x="214" y="76" text-anchor="middle" font-size="9" fill="#888">下标3</text>

  <rect x="60" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="104" y="82" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="82" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="192" y="82" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- legend -->
  <rect x="264" y="86" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="284" y="97" font-size="10" fill="#446688">偶数下标</text>
  <rect x="264" y="104" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="284" y="115" font-size="10" fill="#d6a040">奇数下标</text>

  <!-- split arrows -->
  <path d="M 82 118 L 50 142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 170 118 L 170 142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 126 118 L 126 158" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 214 118 L 246 158" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="34" y="136" font-size="9.5" fill="#666" font-weight="bold">分组</text>

  <!-- ===== Step 2: two groups ===== -->
  <text x="60" y="158" font-size="11.5" fill="#446688" font-weight="bold">② 解耦为两组</text>

  <!-- even group -->
  <rect x="40" y="166" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="76" y="166" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="58" y="206" text-anchor="middle" font-size="9" fill="#446688">偶数下标值</text>

  <!-- odd group -->
  <rect x="108" y="166" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="166" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="144" y="206" text-anchor="middle" font-size="9" fill="#d6a040">奇数下标值</text>

  <!-- sort arrows -->
  <path d="M 76 214 L 76 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="92" y="228" font-size="9.5" fill="#446688" font-weight="bold">升序↑</text>
  <path d="M 144 214 L 144 232" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="160" y="228" font-size="9.5" fill="#d6a040" font-weight="bold">降序↓</text>

  <!-- ===== Step 3: sorted groups ===== -->
  <text x="60" y="248" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 各自排序（互不干扰）</text>

  <rect x="40" y="256" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="76" y="256" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="76" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a">[2, 4] 非递减</text>

  <rect x="108" y="256" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="144" y="256" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="144" y="296" text-anchor="middle" font-size="9" fill="#b85450">[3, 1] 非递增</text>

  <!-- merge arrow -->
  <path d="M 76 304 L 110 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 144 304 L 150 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="318" font-size="9.5" fill="#666" font-weight="bold">回填</text>

  <!-- ===== Step 4: result ===== -->
  <text x="60" y="338" font-size="11.5" fill="#446688" font-weight="bold">④ 回填原位置</text>

  <rect x="40" y="346" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="367" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="346" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="367" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="128" y="346" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="367" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="346" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="367" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="128" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[2, 3, 4, 1]</text>

  <!-- vertical divider -->
  <line x1="320" y1="60" x2="320" y2="380" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: independence note ===== -->
  <text x="440" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">为什么可以解耦？</text>

  <rect x="340" y="88" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">观察一：两组不相交</text>
  <text x="440" y="124" text-anchor="middle" font-size="10" fill="#555">偶数下标 {0,2,4,...}</text>
  <text x="440" y="138" text-anchor="middle" font-size="10" fill="#555">奇数下标 {1,3,5,...}</text>

  <rect x="340" y="160" width="200" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">观察二：排序互不影响</text>
  <text x="440" y="196" text-anchor="middle" font-size="10" fill="#555">偶数下标值只在偶数位移动</text>
  <text x="440" y="210" text-anchor="middle" font-size="10" fill="#555">不会侵入奇数下标位置</text>

  <path d="M 440 226 L 440 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="250" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">观察三：方向由题意给定</text>
  <text x="440" y="286" text-anchor="middle" font-size="10" fill="#555">偶数下标 → 非递减（升序）</text>
  <text x="440" y="300" text-anchor="middle" font-size="10" fill="#555">奇数下标 → 非递增（降序）</text>

  <rect x="340" y="324" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结论：分组 → 各排 → 回填</text>
  <text x="440" y="360" text-anchor="middle" font-size="10" fill="#555">两组独立排序后写回原位</text>
  <text x="440" y="374" text-anchor="middle" font-size="10" fill="#555">三步流水线 O(n log n)</text>
</svg>
