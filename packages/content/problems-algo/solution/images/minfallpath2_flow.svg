<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐行 DP + min1/min2 优化</text>

  <!-- Step 1: Init -->
  <rect x="180" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① dp ← grid[0]（初始化第一行）</text>
  <path d="M 280 82 L 280 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Loop over rows -->
  <rect x="120" y="98" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 1 → n−1（逐行处理）</text>
  <path d="M 280 136 L 280 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Find min1, min2 -->
  <rect x="80" y="152" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 扫描上一行 dp，找 min1（最小值+列号）</text>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">和 min2（次小值）— O(n)</text>
  <path d="M 280 204 L 280 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: Decision diamond -->
  <polygon points="280,220 380,260 280,300 180,260" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j == min1_col ?</text>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#888">（对每个 j=0..n−1）</text>

  <!-- Left branch: No -->
  <path d="M 180 260 L 120 260 L 120 320" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="130" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="30" y="322" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="342" text-anchor="middle" font-size="11" fill="#333">dp[j] = grid[i][j]</text>
  <text x="120" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+ min1</text>

  <!-- Right branch: Yes -->
  <path d="M 380 260 L 440 260 L 440 320" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="252" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="350" y="322" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="342" text-anchor="middle" font-size="11" fill="#333">dp[j] = grid[i][j]</text>
  <text x="440" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+ min2</text>

  <!-- Merge arrows -->
  <path d="M 120 368 L 120 384 L 280 384" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 368 L 440 384 L 280 384" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 384 L 280 398" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop back arrow -->
  <path d="M 480 116 Q 530 116 530 250 Q 530 340 480 340" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="536" y="180" font-size="9" fill="#d6a040" font-style="italic">下一行</text>

  <!-- Step 5: Return -->
  <rect x="160" y="400" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 返回 min(dp)（最后一行最小值）</text>

  <!-- Complexity note -->
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">每行 O(n) 找 min1/min2 + O(n) 填 dp → 总计 O(n²)</text>
</svg>
