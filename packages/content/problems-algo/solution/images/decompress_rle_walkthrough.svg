<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,4] → [2,4,4,4]</text>

  <!-- Input row -->
  <text x="28" y="60" font-size="10.5" fill="#666">输入 nums</text>
  <!-- [1,2,3,4] w=40 gap=8 start=120 -->
  <rect x="120" y="42" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="42" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="188" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <rect x="216" y="42" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="264" y="42" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="284" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>

  <!-- pair brackets labels -->
  <text x="164" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">对0 [1,2]</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">对1 [3,4]</text>

  <!-- Step 1 -->
  <rect x="40" y="104" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="56" y="124" font-size="11.5" fill="#333" font-weight="bold">步骤1  i=0</text>
  <text x="56" y="140" font-size="10.5" fill="#555">freq = nums[0] = 1，val = nums[1] = 2</text>
  <text x="56" y="156" font-size="10.5" fill="#555">→ 追加 1 个 2</text>
  <!-- res after step1: [2] -->
  <text x="320" y="140" font-size="10.5" fill="#666">res =</text>
  <rect x="352" y="126" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="148" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- arrow down -->
  <path d="M 260 170 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="186" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="56" y="206" font-size="11.5" fill="#333" font-weight="bold">步骤2  i=2</text>
  <text x="56" y="222" font-size="10.5" fill="#555">freq = nums[2] = 3，val = nums[3] = 4</text>
  <text x="56" y="238" font-size="10.5" fill="#555">→ 追加 3 个 4</text>
  <!-- res after step2: [2, 4, 4, 4] -->
  <text x="262" y="222" font-size="10.5" fill="#666">res =</text>
  <rect x="294" y="208" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="334" y="208" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="374" y="208" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="414" y="208" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- arrow down -->
  <path d="M 260 252 L 260 266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="110" y="268" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i=4 ≥ n，循环结束 → 返回 [2, 4, 4, 4]</text>
</svg>
