<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：聚合定对象 → 开窗定名次 → 转置定列</text>

  <!-- 阶段1：原始明细行（USA 的 4 行） -->
  <text x="16" y="48" font-size="10.5" fill="#999" filter="url(#rough2)">Wineries 明细行（USA 片段，一酒庄可多行）</text>

  <rect x="12" y="54" width="126" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">RoyalVines · 47</text>

  <rect x="150" y="54" width="126" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">RoyalVines · 39</text>

  <rect x="288" y="54" width="126" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Eagle'sNest · 45</text>

  <rect x="426" y="54" width="126" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="489" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">PacificCrest · 9</text>

  <path d="M 75 88 L 75 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 213 88 L 213 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 351 88 L 351 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 489 88 L 489 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 聚合带 -->
  <rect x="60" y="102" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① GROUP BY country, winery → SUM(points)：一酒庄一行总分</text>

  <path d="M 90 132 L 90 142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 280 132 L 280 142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 470 132 L 470 142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段2：聚合结果 -->
  <rect x="15" y="146" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="164" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">RoyalVines 86</text>
  <text x="90" y="181" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">47 + 39 跨行合并 ★</text>

  <rect x="205" y="146" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">Eagle'sNest 45</text>
  <text x="280" y="181" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单行直通</text>

  <rect x="395" y="146" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">PacificCrest 9</text>
  <text x="470" y="181" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单行直通</text>

  <path d="M 90 192 L 90 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 280 192 L 280 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 470 192 L 470 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 开窗带 -->
  <rect x="30" y="206" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② ROW_NUMBER() OVER (PARTITION BY country ORDER BY 总分 DESC, winery ASC)</text>

  <path d="M 90 236 L 90 246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 280 236 L 280 246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 470 236 L 470 246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段3：排名结果 -->
  <rect x="15" y="250" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="270" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">rn = 1</text>
  <text x="90" y="290" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">RoyalVines (86)</text>

  <rect x="205" y="250" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn = 2</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Eagle'sNest (45)</text>

  <rect x="395" y="250" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">rn = 3</text>
  <text x="470" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">PacificCrest (9)</text>

  <!-- 转置带 -->
  <rect x="60" y="312" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">③ 转置：MAX(CASE WHEN rn = k) 每国三行 → 一行三列</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">rn = 2 / 3 缺位时 COALESCE 填 'No second/third winery'；rn = 1 必存在</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">不先聚合：RoyalVines 的 47 / 39 会错占第 1、2 名两个席位</text>
</svg>
