<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐轮累加 → 负值早停</text>

  <!-- step 1: sort -->
  <rect x="30" y="44" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① happiness 降序排序</text>
  <text x="140" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sort(..., greater) · O(n log n)</text>

  <!-- step 2: loop -->
  <rect x="310" y="44" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">② for i = 0 … k−1</text>
  <text x="420" y="80" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">逐轮计算净贡献</text>

  <!-- step 3: net value -->
  <rect x="130" y="116" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11.5" fill="#2d5a1e" filter="url(#rough2)">③ val = a[i] − i（选中前已熬过 i 轮全场 −1）</text>

  <path d="M 140 88 C 140 100, 200 104, 240 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 88 C 420 100, 360 104, 320 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="280,172 360,204 280,236 200,204" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">val ≤ 0 ?</text>
  <path d="M 280 156 L 280 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- break -->
  <rect x="80" y="258" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">④ 是 → break 提前收工</text>
  <text x="200" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">后面更小，贡献全为 0</text>
  <path d="M 240 234 C 228 244, 218 250, 210 256" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="228" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- accumulate -->
  <rect x="350" y="258" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="276" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">④ 否 → ans += val</text>
  <text x="440" y="294" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">long long 累加</text>
  <text x="356" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- loop back -->
  <path d="M 440 302 C 440 332, 522 328, 522 200 C 522 120, 480 96, 434 90" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="506" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一个 i</text>

  <!-- return -->
  <rect x="130" y="340" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans（上界 ~2×10¹³，必须 64 位）</text>
  <path d="M 200 302 C 200 322, 232 332, 260 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 390 302 C 384 318, 360 330, 332 338" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="388" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">循环走完也到这</text>
</svg>
