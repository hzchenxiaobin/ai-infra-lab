<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：带符号 DFS + 终判归零</text>

  <!-- Section label -->
  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">① DFS 遍历（root1 用 sign=+1，root2 用 sign=−1）</text>

  <!-- Start oval -->
  <rect x="180" y="60" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(node, sign)</text>
  <path d="M 260 96 L 260 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision 1: node null? -->
  <polygon points="260,120 360,160 260,200 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="11.5" fill="#333">node 为空?</text>
  <!-- yes branch (right) -->
  <path d="M 360 160 L 410 160" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="378" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="144" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="453" y="166" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return</text>
  <!-- no branch (down) -->
  <path d="M 260 200 L 260 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="216" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision 2: leaf? -->
  <polygon points="260,226 372,268 260,310 148,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#333">叶子节点?</text>
  <text x="260" y="280" text-anchor="middle" font-size="9.5" fill="#888">(!left &amp;&amp; !right)</text>
  <!-- yes branch (left) -->
  <path d="M 148 268 L 96 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="124" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="18" y="250" width="78" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="57" y="267" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt[val-'a']</text>
  <text x="57" y="281" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+= sign</text>
  <!-- no branch (down) -->
  <path d="M 260 310 L 260 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="326" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Process: recurse left & right -->
  <rect x="150" y="336" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">dfs(node.left, sign)</text>
  <text x="260" y="372" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">dfs(node.right, sign)</text>

  <!-- divider -->
  <line x1="30" y1="396" x2="490" y2="396" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Section 2 label -->
  <text x="30" y="412" font-size="11" fill="#888" font-weight="bold">② 终判：扫描 cnt[0..25]</text>

  <!-- final decision -->
  <rect x="150" y="420" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="11" fill="#333">全部 == 0 ? → true / 否则 false</text>
</svg>
