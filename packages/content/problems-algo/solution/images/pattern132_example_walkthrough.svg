<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [3, 1, 4, 2]，从右向左扫描</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">每步：先判"1"（x&lt;s3?），再弹栈配"3""2"更新 s3，最后 push(x)</text>

  <!-- column headers -->
  <text x="32" y="72" font-size="10" fill="#888" font-weight="bold">步</text>
  <text x="62" y="72" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="92" y="72" font-size="10" fill="#888" font-weight="bold">x</text>
  <text x="150" y="72" font-size="10" fill="#888" font-weight="bold">数组（当前位置高亮）</text>
  <text x="350" y="72" font-size="10" fill="#888" font-weight="bold">栈（底→顶，递减）</text>
  <text x="470" y="72" font-size="10" fill="#888" font-weight="bold">s3</text>
  <text x="528" y="72" font-size="10" fill="#888" font-weight="bold">动作</text>

  <!-- ===== Row 1: i=3, x=2 ===== -->
  <text x="32" y="108" font-size="10" fill="#888">1</text>
  <text x="62" y="108" font-size="11" fill="#444" font-weight="bold">3</text>
  <rect x="78" y="92" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="92" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- array [3,1,4,2], pos 3 highlighted -->
  <rect x="130" y="92" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="147" y="108" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="164" y="92" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="181" y="108" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="198" y="92" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="215" y="108" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="232" y="92" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="249" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="278" y="108" font-size="9" fill="#4a7a3a">← i</text>
  <!-- stack [2] -->
  <rect x="340" y="92" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="357" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="380" y="108" font-size="9" fill="#888">栈顶</text>
  <!-- s3 -->
  <text x="470" y="108" font-size="11" fill="#888">−∞</text>
  <!-- action -->
  <text x="528" y="104" font-size="9" fill="#555">2&lt;−∞? 否</text>
  <text x="528" y="116" font-size="9" fill="#555">栈空→入栈</text>

  <!-- ===== Row 2: i=2, x=4 ===== -->
  <text x="32" y="160" font-size="10" fill="#888">2</text>
  <text x="62" y="160" font-size="11" fill="#444" font-weight="bold">2</text>
  <rect x="78" y="144" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="92" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="130" y="144" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="147" y="160" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="164" y="144" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="181" y="160" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="198" y="144" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="232" y="144" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="249" y="160" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="278" y="160" font-size="9" fill="#4a7a3a">← i</text>
  <!-- stack [4] after pop -->
  <rect x="340" y="144" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="357" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="380" y="156" font-size="9" fill="#b85450">栈顶</text>
  <!-- pop arrow -->
  <path d="M 340 156 L 322 156" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="160" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">弹 2</text>
  <!-- s3 = 2 -->
  <text x="470" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="470" y="172" font-size="8" fill="#4a7a3a">↑当"2"</text>
  <!-- action -->
  <text x="528" y="156" font-size="9" fill="#555">4&lt;−∞? 否</text>
  <text x="528" y="168" font-size="9" fill="#b85450" font-weight="bold">4&gt;2 弹→s3=2</text>

  <!-- ===== Row 3: i=1, x=1 → HIT ===== -->
  <rect x="20" y="180" width="572" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.45"/>
  <text x="32" y="212" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="62" y="212" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="78" y="196" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="130" y="196" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="147" y="212" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="164" y="196" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="181" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="198" y="196" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="215" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="232" y="196" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="249" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="278" y="212" font-size="9" fill="#b85450" font-weight="bold">← i</text>
  <!-- stack unchanged [4] -->
  <rect x="340" y="196" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="357" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <!-- s3 = 2 -->
  <text x="470" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- action: HIT -->
  <text x="528" y="206" font-size="10" fill="#b85450" font-weight="bold">1 &lt; 2? 是！</text>
  <text x="528" y="218" font-size="9" fill="#b85450" font-weight="bold">return true</text>

  <!-- ===== summary: the found pattern ===== -->
  <rect x="30" y="240" width="540" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">命中拆解：1 &lt; 2 &lt; 4，下标 1 &lt; 2 &lt; 3 → 子序列 [1, 4, 2]</text>

  <!-- three role boxes -->
  <rect x="60" y="276" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"1" = nums[1]</text>
  <text x="120" y="312" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">= 1</text>

  <rect x="220" y="276" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"3" = nums[2]</text>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 4</text>

  <rect x="380" y="276" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"2" = s3</text>
  <text x="440" y="312" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">= 2</text>

  <!-- arrows 1 < 2 < 4 -->
  <path d="M 182 301 L 216 301" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 342 301 L 376 301" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== footnote ===== -->
  <rect x="30" y="352" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="374" font-size="11" fill="#d6a040" font-weight="bold">关键观察：</text>
  <text x="50" y="392" font-size="10" fill="#555">• 步骤 2：x=4 比"2"候选栈顶大 → 弹出栈顶(2)记入 s3，4 入栈当"3"候选</text>
  <text x="50" y="408" font-size="10" fill="#555">• 步骤 3：x=1 比 s3=2 小 → 1 当"1"，s3 当"2"，弹 s3 的 4 当"3" → 命中</text>
  <text x="50" y="424" font-size="10" fill="#4a7a3a" font-weight="bold">"3"(4)在"2"(2)左边、"2"在"1"(1)左边，但数值 1&lt;2&lt;4，正是 132 模式</text>
  <text x="50" y="438" font-size="9" fill="#888">s3 = max(被弹元素)，让"1"的门槛尽量宽松——这是本题取最大"2"的妙处</text>
</svg>
