<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以 right 结尾的合法子串数 = 窗口长度</text>

  <!-- left/right markers -->
  <text x="112" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">left=0</text>
  <text x="250" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right=3</text>

  <!-- string cells -->
  <rect x="90" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="136" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="182" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="228" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>

  <!-- index labels -->
  <text x="112" y="112" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="158" y="112" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="204" y="112" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="250" y="112" text-anchor="middle" font-size="10" fill="#999">3</text>

  <!-- window brace -->
  <path d="M 90 120 Q 90 128 96 128 L 266 128 Q 272 128 272 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="181" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [left, right] 内字符全不重复</text>

  <!-- substrings ending at right -->
  <text x="60" y="176" font-size="12" fill="#888">以 right 结尾的合法子串:</text>

  <rect x="90" y="184" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>

  <rect x="150" y="184" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cd</text>

  <rect x="210" y="184" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bcd</text>

  <rect x="270" y="184" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">abcd</text>

  <text x="342" y="203" font-size="13" fill="#b85450" font-weight="bold">= 4 个</text>

  <!-- formula -->
  <rect x="80" y="226" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">每个 right 的贡献 = right − left + 1</text>
  <text x="280" y="263" text-anchor="middle" font-size="11" fill="#666">窗口内任一起点 → right，子串都无重复</text>

  <!-- core idea -->
  <rect x="80" y="282" width="400" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = Σ (right − left + 1)，逐 right 累加</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#666">与第 3 题维护同一个无重复窗口</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888">仅聚合方式从「取 max」改为「求 sum」</text>
</svg>
