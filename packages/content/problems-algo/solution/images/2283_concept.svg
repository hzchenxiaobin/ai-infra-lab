<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：num[i] 规定「数字 i 应出现 num[i] 次」</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">以 num="1210" 为例：位置即「被统计的数字」，值即「期望频数」</text>

  <!-- ===== Row 1: index labels (被统计的数字 i) ===== -->
  <text x="120" y="80" font-size="11" fill="#446688" font-weight="bold">下标 i</text>
  <text x="60" y="80" font-size="10" fill="#888">（数字 i）</text>
  <text x="196" y="80" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="272" y="80" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="348" y="80" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="424" y="80" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- ===== Row 2: num string (期望频数 = 说明书) ===== -->
  <text x="60" y="118" font-size="11" fill="#d6a040" font-weight="bold">期望 E[i]</text>
  <text x="60" y="132" font-size="9.5" fill="#b58840">num[i]−'0'</text>
  <rect x="170" y="88" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="115" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <rect x="246" y="88" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="115" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>
  <rect x="322" y="88" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="115" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <rect x="398" y="88" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="115" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>

  <!-- arrow down with label -->
  <path d="M 270 140 Q 270 152 270 162" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="156" font-size="10" fill="#888">核对</text>

  <!-- ===== Row 3: actual freq (实测频数 = 一趟统计) ===== -->
  <text x="60" y="198" font-size="11" fill="#4a7a3a" font-weight="bold">实测 A[i]</text>
  <text x="60" y="212" font-size="9.5" fill="#3a6a2a">freq[i]</text>
  <rect x="170" y="178" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="205" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="246" y="178" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="205" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="322" y="178" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="205" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="398" y="178" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="205" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== check marks row ===== -->
  <text x="196" y="246" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="272" y="246" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="348" y="246" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="424" y="246" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- ===== result box ===== -->
  <rect x="120" y="262" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">全部相等 → 自描述成立 → true</text>

  <!-- ===== bottom: role swap note ===== -->
  <rect x="40" y="318" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="340" font-size="12" fill="#446688" font-weight="bold">角色互换：下标 i = 被统计的「数字 i」</text>
  <text x="58" y="360" font-size="11" fill="#446688">num[i] = 该数字应出现次数；先建 freq[] 实测表再逐位核对</text>

  <!-- ===== bottom: build-table note ===== -->
  <rect x="40" y="384" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="406" font-size="12" fill="#d6a040" font-weight="bold">一趟扫描建表：freq[c−'0']++（0~9 共 10 桶）</text>
  <text x="58" y="426" font-size="11" fill="#d6a040">把「每位重数 O(n²)」摊销成「一次建表反复查 O(n)」</text>
</svg>
