<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：四段拆分 a(b+c)d，空串当 1</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">左括号必在 + 左侧、右括号必在 + 右侧 → 刚好切成四段</text>

  <!-- ===== Original expression ===== -->
  <text x="28" y="74" font-size="10.5" fill="#666">原式</text>
  <rect x="40" y="82" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">num1 + num2</text>

  <path d="M 260 124 L 260 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== After adding parens: four parts ===== -->
  <text x="28" y="160" font-size="10.5" fill="#666">加括号后</text>

  <!-- a -->
  <rect x="40" y="170" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <text x="75" y="204" text-anchor="middle" font-size="9.5" fill="#555">可空</text>

  <!-- ( -->
  <text x="120" y="200" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">(</text>

  <!-- b -->
  <rect x="132" y="170" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="167" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="167" y="204" text-anchor="middle" font-size="9.5" fill="#555">非空</text>

  <!-- + -->
  <text x="214" y="200" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">+</text>

  <!-- c -->
  <rect x="226" y="170" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="261" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="261" y="204" text-anchor="middle" font-size="9.5" fill="#555">非空</text>

  <!-- ) -->
  <text x="308" y="200" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">)</text>

  <!-- d -->
  <rect x="320" y="170" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="355" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <text x="355" y="204" text-anchor="middle" font-size="9.5" fill="#555">可空</text>

  <!-- split arrows for num1 / num2 -->
  <path d="M 100 224 L 100 240" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="9.5" fill="#446688">num1 = a·b</text>

  <path d="M 290 224 L 290 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a">num2 = c·d</text>

  <!-- ===== Evaluation formula ===== -->
  <text x="28" y="276" font-size="11" fill="#444" font-weight="bold">求值：乘法连乘，空段当 1</text>

  <rect x="40" y="284" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="307" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A = a?int(a):1</text>

  <text x="150" y="307" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">×</text>

  <rect x="162" y="284" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="222" y="307" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(B + C) = int(b)+int(c)</text>

  <text x="292" y="307" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">×</text>

  <rect x="304" y="284" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="354" y="307" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">D = d?int(d):1</text>

  <!-- side note -->
  <rect x="414" y="284" width="92" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="302" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">为什么空当 1？</text>
  <text x="460" y="316" text-anchor="middle" font-size="9" fill="#555">空段不出现</text>
  <text x="460" y="328" text-anchor="middle" font-size="9" fill="#555">= 乘法单位元</text>

  <!-- bottom note -->
  <rect x="40" y="330" width="360" height="22" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="220" y="346" text-anchor="middle" font-size="10" fill="#b85450">b、c 非空：括号至少包住 + 两侧各一位</text>
</svg>
