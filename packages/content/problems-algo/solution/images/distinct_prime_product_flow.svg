<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：试除法逐元素分解，质因子入集合</text>

  <!-- Start: for each num in nums -->
  <rect x="180" y="42" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for each num in nums</text>

  <path d="M 280 76 L 280 96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init x = num, d = 2 -->
  <rect x="180" y="96" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333">x = num，d = 2</text>

  <path d="M 280 130 L 280 150" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: d*d <= x ? -->
  <polygon points="280,150 380,190 280,230 180,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#333">d × d ≤ x ?</text>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#888">（枚举到 √x）</text>

  <!-- No branch: down to remaining -->
  <text x="386" y="186" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 230 L 280 320" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch: right -->
  <text x="174" y="186" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 190 L 430 190 L 430 268 L 360 268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner decision: x % d == 0 ? -->
  <polygon points="280,240 360,278 280,316 200,278" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333">x mod d == 0 ?</text>
  <text x="280" y="291" text-anchor="middle" font-size="10" fill="#888">（d 是质因子）</text>

  <!-- Yes: add to set, x /= d, loop back to inner -->
  <text x="366" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 278 L 430 278" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="294" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="313" text-anchor="middle" font-size="11" fill="#2f5d20">set.add(d)</text>
  <text x="490" y="330" text-anchor="middle" font-size="11" fill="#2f5d20">x = x / d</text>
  <path d="M 490 294 L 490 278" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="286" font-size="9" fill="#888">重检</text>

  <!-- No: d += 1, loop back to outer decision -->
  <text x="194" y="274" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 200 278 L 140 278 L 140 190 L 180 190" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="232" font-size="10" fill="#333">d += 1</text>
  <text x="100" y="246" font-size="10" fill="#888">→ 回到 d×d≤x?</text>

  <!-- After outer No: remaining check -->
  <rect x="160" y="320" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333">if x &gt; 1：set.add(x)</text>

  <path d="M 280 354 L 280 380" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- remaining note -->
  <rect x="100" y="380" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#333">剩余 x &gt; 1 必为质数</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#666">（更小的因子已被试除干净，它本身是最大质因子）</text>

  <!-- next element loop -->
  <path d="M 400 403 L 480 403 L 480 59 L 380 59" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="230" font-size="10" fill="#888" transform="rotate(90 486 230)">取下一个 num</text>

  <path d="M 280 426 L 280 448" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="140" y="448" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="473" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">遍历结束 → return set.size()</text>

  <text x="280" y="508" text-anchor="middle" font-size="11" fill="#888">每个元素 O(√max) ，max ≤ 1000 故 √max ≤ 32，总 O(n·√max)</text>
</svg>
