<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：每日聚合 → 笛卡尔积补齐 → 窗口累计求和</text>

  <!-- ============ Box 1: daily aggregation ============ -->
  <rect x="15" y="46" width="160" height="252" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="15" y="46" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 每日聚合 daily</text>

  <rect x="25" y="80" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="32" y="94" font-size="8.5" fill="#333">GROUP BY gender, day</text>
  <text x="32" y="106" font-size="8.5" fill="#333">SUM(score_points)</text>
  <text x="32" y="118" font-size="8.5" fill="#d6a040" font-weight="bold">→ 每个(g,d)恰一行</text>

  <!-- mini table header -->
  <rect x="30" y="132" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">g</text>
  <rect x="70" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">day</text>
  <rect x="104" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">pts</text>

  <!-- rows -->
  <rect x="30" y="152" width="108" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="87" y="164" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="121" y="164" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">57</text>

  <rect x="30" y="170" width="108" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="182" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="87" y="182" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="121" y="182" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">49</text>

  <!-- missing row highlight -->
  <rect x="30" y="188" width="108" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">F</text>
  <text x="87" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">3</text>
  <text x="121" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">—</text>

  <rect x="30" y="206" width="108" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="218" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="87" y="218" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <text x="121" y="218" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">36</text>

  <rect x="30" y="224" width="108" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="236" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="87" y="236" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">2</text>
  <text x="121" y="236" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">99</text>

  <rect x="30" y="242" width="108" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="254" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="87" y="254" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3</text>
  <text x="121" y="254" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">104</text>

  <text x="95" y="276" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">(F,3) 不存在 → 缺口</text>
  <text x="95" y="289" text-anchor="middle" font-size="8.5" fill="#555">5 行（含缺口标记）</text>

  <!-- arrow 1 -> 2 -->
  <path d="M180 172 L202 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="191" y="165" text-anchor="middle" font-size="8" fill="#d6a040">补齐</text>

  <!-- ============ Box 2: grid fill ============ -->
  <rect x="205" y="46" width="160" height="252" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="205" y="46" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="63" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 网格补齐 grid</text>

  <rect x="215" y="80" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="222" y="94" font-size="8.5" fill="#333">genders CROSS JOIN days</text>
  <text x="222" y="106" font-size="8.5" fill="#333">LEFT JOIN daily</text>
  <text x="222" y="118" font-size="8.5" fill="#d6a040" font-weight="bold">COALESCE(pts, 0)</text>

  <!-- mini grid header -->
  <rect x="220" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="237" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">g</text>
  <rect x="254" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="271" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">d1</text>
  <rect x="288" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">d2</text>
  <rect x="322" y="132" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="339" y="146" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">d3</text>

  <!-- F row -->
  <rect x="220" y="152" width="136" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="237" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="271" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">57</text>
  <text x="305" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">49</text>
  <text x="339" y="167" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <!-- M row -->
  <rect x="220" y="174" width="136" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="237" y="189" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="271" y="189" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">36</text>
  <text x="305" y="189" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">99</text>
  <text x="339" y="189" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">104</text>

  <!-- highlight filled cell -->
  <rect x="322" y="152" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="339" y="167" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">0</text>

  <text x="285" y="216" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">(F,3) 补 0</text>

  <rect x="215" y="226" width="140" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="222" y="240" font-size="8.5" fill="#333">性别数 G × 日期数 d</text>
  <text x="222" y="253" font-size="8.5" fill="#333">= 2 × 3 = 6 个格子</text>
  <text x="222" y="266" font-size="8.5" fill="#4a7a3a" font-weight="bold">缺失格一律填 0</text>
  <text x="222" y="279" font-size="8.5" fill="#555">→ 6 行完整网格</text>

  <!-- arrow 2 -> 3 -->
  <path d="M370 172 L392 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="381" y="165" text-anchor="middle" font-size="8" fill="#d6a040">累计</text>

  <!-- ============ Box 3: window running sum ============ -->
  <rect x="395" y="46" width="160" height="252" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="395" y="46" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 窗口累计 total</text>

  <rect x="405" y="80" width="140" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="94" font-size="8.5" fill="#333">SUM(pts) OVER (</text>
  <text x="412" y="106" font-size="8.5" fill="#333">  PARTITION BY gender</text>
  <text x="412" y="118" font-size="8.5" fill="#333">  ORDER BY day)</text>

  <!-- mini table header -->
  <rect x="410" y="136" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="150" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">g</text>
  <rect x="450" y="136" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="467" y="150" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">day</text>
  <rect x="484" y="136" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="507" y="150" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">total</text>

  <rect x="410" y="156" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="168" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="467" y="168" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="507" y="168" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">57</text>

  <rect x="410" y="174" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="467" y="186" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="507" y="186" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">106</text>

  <rect x="410" y="192" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="430" y="204" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">F</text>
  <text x="467" y="204" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="507" y="204" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">106</text>

  <rect x="410" y="210" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="467" y="222" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <text x="507" y="222" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">36</text>

  <rect x="410" y="228" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="240" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="467" y="240" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">2</text>
  <text x="507" y="240" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">135</text>

  <rect x="410" y="246" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="258" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">M</text>
  <text x="467" y="258" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3</text>
  <text x="507" y="258" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">239</text>

  <text x="475" y="280" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">106+0 = 106 沿用</text>
  <text x="475" y="292" text-anchor="middle" font-size="8.5" fill="#555">6 行完整输出</text>

  <!-- bottom note -->
  <rect x="15" y="306" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="323" font-size="9.5" fill="#333">三步流水线：<tspan fill="#446688" font-weight="bold">聚合</tspan>（去重到每(g,d)一行）→ <tspan fill="#d6a040" font-weight="bold">补齐</tspan>（CROSS JOIN 造骨架 + 填 0）→ <tspan fill="#b85450" font-weight="bold">累计</tspan>（SUM OVER 分区排序）。</text>
</svg>
