<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：7 行 → WHERE 3 行 → DISTINCT 2 行 → 排序输出</text>

  <!-- ===== Step 1: WHERE filter ===== -->
  <text x="30" y="56" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 ①：WHERE author_id = viewer_id</text>

  <!-- Full Views table with comparison -->
  <text x="30" y="74" font-size="9" fill="#888">逐行判定 author_id 是否等于 viewer_id：</text>

  <!-- Table header -->
  <rect x="30" y="80" width="280" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="94" font-size="8" fill="#446688" font-weight="bold">article</text>
  <text x="95" y="94" font-size="8" fill="#446688" font-weight="bold">author</text>
  <text x="140" y="94" font-size="8" fill="#446688" font-weight="bold">viewer</text>
  <text x="185" y="94" font-size="8" fill="#446688" font-weight="bold">date</text>
  <text x="245" y="94" font-size="8" fill="#446688" font-weight="bold">判定</text>
  <line x1="75" y1="80" x2="75" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="120" y1="80" x2="120" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="165" y1="80" x2="165" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="225" y1="80" x2="225" y2="100" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 1: 1,3,5 → 3≠5 ✗ -->
  <rect x="30" y="100" width="280" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="112" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="95" y="112" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="140" y="112" text-anchor="middle" font-size="8" fill="#888">5</text>
  <text x="185" y="112" text-anchor="middle" font-size="7" fill="#aaa">08-01</text>
  <text x="255" y="112" font-size="8" fill="#b85450">3≠5 ✗</text>

  <!-- Row 2: 1,3,6 → 3≠6 ✗ -->
  <rect x="30" y="116" width="280" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="128" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="95" y="128" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="140" y="128" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="185" y="128" text-anchor="middle" font-size="7" fill="#aaa">08-02</text>
  <text x="255" y="128" font-size="8" fill="#b85450">3≠6 ✗</text>

  <!-- Row 3: 2,7,7 → 7=7 ✓ -->
  <rect x="30" y="132" width="280" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="145" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="95" y="145" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="140" y="145" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="185" y="145" text-anchor="middle" font-size="7" fill="#4a7a3a">08-01</text>
  <text x="255" y="145" font-size="8" fill="#4a7a3a" font-weight="bold">7=7 ✓</text>

  <!-- Row 4: 2,7,6 → 7≠6 ✗ -->
  <rect x="30" y="150" width="280" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="162" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="95" y="162" text-anchor="middle" font-size="8" fill="#888">7</text>
  <text x="140" y="162" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="185" y="162" text-anchor="middle" font-size="7" fill="#aaa">08-02</text>
  <text x="255" y="162" font-size="8" fill="#b85450">7≠6 ✗</text>

  <!-- Row 5: 4,7,1 → 7≠1 ✗ -->
  <rect x="30" y="166" width="280" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="178" text-anchor="middle" font-size="8" fill="#888">4</text>
  <text x="95" y="178" text-anchor="middle" font-size="8" fill="#888">7</text>
  <text x="140" y="178" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="185" y="178" text-anchor="middle" font-size="7" fill="#aaa">07-22</text>
  <text x="255" y="178" font-size="8" fill="#b85450">7≠1 ✗</text>

  <!-- Row 6: 3,4,4 → 4=4 ✓ -->
  <rect x="30" y="182" width="280" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="195" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="95" y="195" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="140" y="195" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="185" y="195" text-anchor="middle" font-size="7" fill="#4a7a3a">07-21</text>
  <text x="255" y="195" font-size="8" fill="#4a7a3a" font-weight="bold">4=4 ✓</text>

  <!-- Row 7: 3,4,4 → 4=4 ✓ (duplicate) -->
  <rect x="30" y="200" width="280" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="213" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="95" y="213" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">4</text>
  <text x="140" y="213" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">4</text>
  <text x="185" y="213" text-anchor="middle" font-size="7" fill="#d6a040">07-21</text>
  <text x="255" y="213" font-size="8" fill="#d6a040" font-weight="bold">4=4 ✓⚠</text>

  <!-- arrow down -->
  <path d="M170 220 L170 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="232" font-size="8" fill="#4a7a3a">筛出 3 行自浏览</text>

  <!-- ===== Step 2: DISTINCT ===== -->
  <text x="30" y="256" font-size="11" fill="#d6a040" font-weight="bold">步骤 ②：SELECT DISTINCT author_id AS id</text>

  <!-- Show values before dedup -->
  <text x="30" y="274" font-size="9" fill="#888">投影 author_id 列 → 值序列 {7, 4, 4}，去重 →</text>

  <!-- Before dedup: 3 values -->
  <rect x="30" y="282" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="297" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <rect x="85" y="282" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="297" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="140" y="282" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="297" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="165" y="316" text-anchor="middle" font-size="7" fill="#d6a040">⚠重复</text>

  <!-- arrow -->
  <path d="M200 293 L240 293" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="220" y="287" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">DISTINCT</text>

  <!-- After dedup: 2 values -->
  <rect x="250" y="282" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="297" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>

  <rect x="305" y="282" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="297" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>

  <text x="380" y="297" font-size="9" fill="#888">3 个值 → 去重为 2 个</text>

  <!-- arrow down -->
  <path d="M330 306 L330 326" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 3: ORDER BY ===== -->
  <text x="30" y="346" font-size="11" fill="#b85450" font-weight="bold">步骤 ③：ORDER BY id（升序）</text>

  <!-- Before sort -->
  <rect x="140" y="356" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="371" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>

  <rect x="195" y="356" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="371" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>

  <!-- arrow -->
  <path d="M250 367 L290 367" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="361" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">排序</text>

  <!-- Final result -->
  <rect x="300" y="356" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="371" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <rect x="355" y="356" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="371" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>

  <text x="425" y="371" font-size="9" fill="#b85450" font-weight="bold">← 最终输出</text>

  <!-- bottom note -->
  <rect x="30" y="392" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="45" y="406" font-size="9" fill="#446688">💡 关键：author 4 有两条重复的自浏览行 → DISTINCT 去重为一条；漏写 DISTINCT 会多输出一个 4</text>
</svg>
