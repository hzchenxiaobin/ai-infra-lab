<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：特判 0 + 预合并 1 + 有界回溯 DP</text>

  <!-- start -->
  <rect x="210" y="44" width="200" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始：读入 nums 与 k</text>
  <line x1="310" y1="76" x2="310" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="310,92 410,118 310,144 210,118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="123" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">数组含 0 ？</text>

  <line x1="410" y1="118" x2="452" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="431" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="456" y="101" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="511" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="511" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0×x = 0 ≤ k，吞并一切</text>

  <line x1="310" y1="144" x2="310" y2="164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- merge ones -->
  <rect x="185" y="166" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="187" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">预合并相邻的 1 → b[1..m]（1×1=1 ≤ k）</text>
  <line x1="310" y1="200" x2="310" y2="214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop -->
  <rect x="150" y="216" width="320" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="235" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">外层：for i = 1..m</text>
  <text x="310" y="254" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp[i] = dp[i−1] + 1（单元素组）；p = b[i]，j = i−1</text>
  <line x1="310" y1="266" x2="310" y2="282" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="310,282 425,312 310,342 195,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="317" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j ≥ 1 且 p×b[j] ≤ k ？</text>

  <line x1="425" y1="312" x2="462" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="443" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="466" y="284" width="146" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="539" y="303" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">p *= b[j]（进组）</text>
  <text x="539" y="319" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">dp[i] = min(dp[i], dp[j−1]+1)</text>
  <text x="539" y="335" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">j−−，回到左侧判断</text>
  <path d="M 480 282 C 460 268, 400 266, 380 278" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <line x1="310" y1="342" x2="310" y2="362" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="358" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否（乘积超 k 或 j 到头）</text>

  <rect x="160" y="364" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="385" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i 加一；i ≤ m 则回到外层，否则收尾</text>
  <path d="M 160 381 L 84 381 L 84 241 L 146 241" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="310" y1="398" x2="310" y2="414" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="230" y="416" width="160" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="436" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 dp[m]</text>

  <!-- side note -->
  <rect x="452" y="170" width="158" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="531" y="190" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">回溯步数 ≤ 2·log₂k + 1</text>
  <text x="531" y="207" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">合并 1 后相邻对乘积 ≥ 2</text>
  <text x="531" y="224" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">段每伸长 2 格乘积至少翻倍</text>
</svg>
