<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：旅程拆三段，两张图各自求最短路</text>

  <!-- price tag above store j -->
  <rect x="379" y="82" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="419" y="98" text-anchor="middle" font-size="11" fill="#333">prices[j]</text>

  <!-- store nodes -->
  <rect x="55" y="118" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="101" y="145" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">商店 i</text>
  <rect x="373" y="118" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="419" y="145" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">商店 j</text>

  <!-- top arc: empty trip -->
  <path d="M 150 120 C 215 58, 305 58, 368 120" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12.5" fill="#446688">去程（空手）：d₁(i→j)，每条路花 cost</text>

  <!-- bottom arc: carry trip -->
  <path d="M 368 160 C 305 222, 215 222, 150 160" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12.5" fill="#d6a040">返程（携带）：d₂(j→i)，每条路花 cost × tax</text>

  <!-- middle emphasis -->
  <text x="260" y="138" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">两条路径可以不同！</text>
  <path d="M 205 146 Q 260 154 315 146" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- buy note -->
  <text x="419" y="184" text-anchor="middle" font-size="11.5" fill="#b85450">在这里买 1 个苹果</text>

  <!-- two graphs -->
  <rect x="55" y="258" width="190" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">G₁ 空手图</text>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#444">边权 = cost</text>
  <rect x="275" y="258" width="190" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">G₂ 携带图</text>
  <text x="370" y="296" text-anchor="middle" font-size="11" fill="#444">边权 = cost × tax</text>

  <!-- formula -->
  <rect x="55" y="316" width="410" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="12.5" fill="#333">ans[i] = minⱼ ( d₁[i][j] + prices[j] + d₂[i][j] )</text>

  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#b85450">注意：不能合并成一张图——cost·(1+tax) 会强制往返同一条路</text>
</svg>
