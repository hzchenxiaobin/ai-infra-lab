<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：频次差 = 两端前缀差，左端按奇偶分 4 桶</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例：s = 1122211，k = 3，枚举 (a, b) = ('2', '1')</text>

  <!-- prefix table -->
  <!-- row labels -->
  <text x="108" y="77" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="108" y="101" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">pre_a('2')</text>
  <text x="108" y="125" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">pre_b('1')</text>
  <text x="108" y="58" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">s →</text>

  <!-- chars above columns 1..7 -->
  <text x="134" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="171" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="208" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="245" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="282" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="319" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="356" y="60" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>

  <!-- substring bracket over columns 1..5 -->
  <rect x="117" y="66" width="183" height="66" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="208" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">子串 (l, r] = (0, 5]：s[0..4] = "11222"</text>

  <!-- column l=0 highlight -->
  <rect x="116" y="66" width="37" height="66" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">l=0</text>
  <!-- column r=5 highlight -->
  <rect x="299" y="66" width="37" height="66" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="317" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">r=5</text>

  <!-- index row -->
  <g font-size="11.5" fill="#555">
    <text x="134" y="87" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="171" y="87" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="208" y="87" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="245" y="87" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="282" y="87" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="319" y="87" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="356" y="87" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="393" y="87" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>
  <!-- pre_a row -->
  <g font-size="11.5" fill="#446688">
    <text x="134" y="111" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="171" y="111" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="208" y="111" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="245" y="111" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="282" y="111" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="319" y="111" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="356" y="111" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="393" y="111" text-anchor="middle" filter="url(#rough2)">3</text>
  </g>
  <!-- pre_b row -->
  <g font-size="11.5" fill="#4a7a3a">
    <text x="134" y="135" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="171" y="135" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="208" y="135" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="245" y="135" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="282" y="135" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="319" y="135" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="356" y="135" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="393" y="135" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>

  <!-- formula -->
  <text x="260" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">freq_a − freq_b = <tspan fill="#d6a040" font-weight="bold">(pre_a[r] − pre_b[r])</tspan> − <tspan fill="#4a7a3a" font-weight="bold">(pre_a[l] − pre_b[l])</tspan></text>

  <rect x="92" y="190" width="160" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="210" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">右端：r 固定时是常数</text>
  <rect x="268" y="190" width="160" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="210" text-anchor="middle" font-size="11" fill="#2d4d22" filter="url(#rough2)">左端：按状态取最小</text>
  <path d="M348,220 L348,244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- parity conditions -->
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">freq_a 奇 ⟺ pre_a[r] 与 pre_a[l] 奇偶不同（查询时翻转）；</text>
  <text x="260" y="255" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">freq_b 非 0 偶 ⟺ pre_b 同奇偶 且 pre_b[l] &lt; pre_b[r]（延迟激活）</text>

  <!-- buckets -->
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">左端 l 的 4 个奇偶状态桶（桶存 min(pre_a − pre_b)）</text>

  <rect x="38" y="286" width="92" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="84" y="305" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">状态 (0,0)</text>
  <text x="84" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>

  <rect x="158" y="286" width="92" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="305" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">状态 (0,1)</text>
  <text x="204" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">−1</text>

  <rect x="278" y="286" width="92" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="305" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">状态 (1,0)</text>
  <text x="324" y="323" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅（未激活）</text>

  <rect x="398" y="286" width="92" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="305" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">状态 (1,1)</text>
  <text x="444" y="323" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅（未激活）</text>

  <!-- query arrow into bucket (0,0) -->
  <path d="M300,272 L110,282" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="270" font-size="10.5" fill="#d6a040" filter="url(#rough2)">r=5 查 (1^1, 0)=(0,0)</text>

  <!-- bottom note -->
  <rect x="30" y="338" width="460" height="18" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = (3 − 2) − 0 = 1，对应子串 "11222"（'2'×3 奇，'1'×2 偶）✓</text>
</svg>
