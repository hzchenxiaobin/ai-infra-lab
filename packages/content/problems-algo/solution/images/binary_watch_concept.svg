<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二进制手表：4 位小时(0–11) + 6 位分钟(0–59) = 10 个 LED</text>

  <!-- Watch body -->
  <rect x="90" y="50" width="360" height="220" fill="#ffffff" stroke="#446688" stroke-width="2.5" rx="14" filter="url(#rough2)"/>

  <!-- Hour label -->
  <text x="110" y="88" font-size="11" fill="#446688" font-weight="bold">小时 4 位</text>
  <text x="430" y="88" font-size="10" fill="#888">范围 0–11</text>

  <!-- Hour LEDs: weights 8,4,2,1 at x = 250, 300, 350, 400 ; example 4=0100 → only weight-4 lit -->
  <circle cx="250" cy="115" r="14" fill="#ffffff" stroke="#888888" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="115" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="350" cy="115" r="14" fill="#ffffff" stroke="#888888" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="400" cy="115" r="14" fill="#ffffff" stroke="#888888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Hour bit weights -->
  <text x="250" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <text x="300" y="147" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="350" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="400" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- divider -->
  <path d="M 110 165 L 430 165" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Minute label -->
  <text x="110" y="185" font-size="11" fill="#446688" font-weight="bold">分钟 6 位</text>
  <text x="430" y="185" font-size="10" fill="#888">范围 0–59</text>

  <!-- Minute LEDs: weights 32,16,8,4,2,1 at x = 150, 200, 250, 300, 350, 400 ; 51=110011 → lit 32,16,2,1 -->
  <circle cx="150" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="200" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="250" cy="210" r="14" fill="#ffffff" stroke="#888888" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="210" r="14" fill="#ffffff" stroke="#888888" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="350" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="400" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Minute bit weights -->
  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">32</text>
  <text x="200" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">16</text>
  <text x="250" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <text x="300" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="400" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <!-- Example readout -->
  <rect x="130" y="285" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例读数：4:51</text>
  <text x="270" y="321" text-anchor="middle" font-size="10.5" fill="#555">h=4=0100 (1个1) + m=51=110011 (4个1) = 5 个 LED 亮</text>

  <!-- Footer formula -->
  <text x="270" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">关键：亮灯数 = popcount(h) + popcount(m)</text>
  <text x="270" y="368" text-anchor="middle" font-size="10.5" fill="#555">枚举所有合法 (h, m)，筛选亮灯总数 = turnedOn</text>
</svg>
