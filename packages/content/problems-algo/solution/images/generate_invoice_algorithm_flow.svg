<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：JOIN → 行级金额 → GROUP BY → SUM → ORDER BY</text>

  <!-- Step 1 -->
  <rect x="150" y="48" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① FROM Purchases JOIN Products ON product_id</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#888">每条采购行贴上 unit price</text>
  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="108" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 行级金额 = quantity × price</text>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#888">逐行求该采购项金额</text>
  <path d="M 280 152 L 280 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="150" y="168" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ GROUP BY invoice_id</text>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#888">同一发票的多行折叠成一组</text>
  <path d="M 280 212 L 280 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="150" y="228" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④ SUM(quantity × price) AS price</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888">每组求和 = 该发票总金额</text>
  <path d="M 280 272 L 280 288" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="150" y="288" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ ORDER BY invoice_id</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">按发票号升序输出</text>

  <!-- side note -->
  <rect x="430" y="108" width="116" height="120" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="488" y="128" text-anchor="middle" font-size="10" fill="#888">SQL 子句顺序</text>
  <text x="438" y="146" font-size="9" fill="#888">FROM/JOIN</text>
  <text x="438" y="160" font-size="9" fill="#888">WHERE</text>
  <text x="438" y="174" font-size="9" fill="#888">GROUP BY</text>
  <text x="438" y="188" font-size="9" fill="#888">HAVING</text>
  <text x="438" y="202" font-size="9" fill="#888">SELECT/SUM</text>
  <text x="438" y="216" font-size="9" fill="#888">ORDER BY</text>

  <!-- result strip -->
  <rect x="120" y="350" width="320" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果：invoice_id, price（按 invoice_id 升序）</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">每张发票一行总金额</text>
  <path d="M 280 332 L 280 350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
