<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双重枚举 + 哈希计数 + 排序</text>

  <!-- 开始 -->
  <rect x="200" y="30" width="120" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">a = 1</text>
  <path d="M 260 56 L 260 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：2a³ ≤ n ? -->
  <polygon points="260,72 330,104 260,136 190,104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2a³ ≤ n ?</text>

  <text x="272" y="130" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 136 L 260 146" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- b = a -->
  <rect x="215" y="148" width="90" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">b = a</text>
  <path d="M 260 174 L 260 188" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：a³+b³ ≤ n ? -->
  <polygon points="260,194 334,226 260,258 186,226" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a³+b³ ≤ n ?</text>

  <text x="272" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 258 L 260 268" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="168" y="270" width="184" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#8a6212" filter="url(#rough2)">cnt[a³+b³]++;  b ← b+1</text>

  <!-- 内层回边：计数框 → 判断2 -->
  <path d="M 352 286 L 428 286 L 428 226 L 340 226" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层：判断2 否 → a+1 → 判断1 -->
  <text x="170" y="218" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 186 226 L 96 226 L 96 190" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="160" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="178" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a ← a+1</text>
  <path d="M 96 160 L 96 104 L 184 104" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1 否 → 收集返回 -->
  <text x="340" y="97" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 330 104 L 434 104 L 434 142" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="144" width="152" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="165" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">收集所有 cnt ≥ 2 的值</text>
  <text x="434" y="183" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">排序后返回</text>

  <!-- 备注 -->
  <rect x="24" y="314" width="330" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="336" text-anchor="middle" font-size="11" fill="#8a6212" filter="url(#rough2)">n = 10^9：约 4.4×10^5 对，最终只有 1554 个好整数</text>
</svg>
