<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐行双指针，对称对相等才取反</text>

  <!-- Start oval -->
  <rect x="220" y="42" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 76 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for each row -->
  <rect x="160" y="98" width="240" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#333">遍历每一行 row = 0 … n−1</text>
  <path d="M 280 136 L 280 156" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init pointers -->
  <rect x="160" y="158" width="240" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333">left = 0，right = n−1</text>
  <path d="M 280 196 L 280 218" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: left <= right? -->
  <path d="M 280 222 L 372 262 L 280 302 L 188 262 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#888">（未交叉）</text>

  <!-- No branch to end -->
  <path d="M 372 262 L 470 262 L 470 470" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="254" font-size="11" fill="#888">否</text>
  <rect x="410" y="470" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="470" y="491" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 image</text>

  <!-- Yes branch down -->
  <path d="M 280 302 L 280 326" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="318" font-size="11" fill="#888">是</text>

  <!-- Diamond: image[left] == image[right]? -->
  <path d="M 280 330 L 410 376 L 280 422 L 150 376 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">image[row][left]</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== image[row][right] ?</text>

  <!-- Yes (equal) -> invert both, left side -->
  <path d="M 150 376 L 96 376 L 96 410" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="368" font-size="11" fill="#4a7a3a">是</text>
  <rect x="36" y="412" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="126" y="430" text-anchor="middle" font-size="11" fill="#333">两者都置</text>
  <text x="126" y="446" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 − image[row][left]</text>

  <!-- No (not equal) -> skip, right side -->
  <path d="M 410 376 L 464 376 L 464 410" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="368" font-size="11" fill="#d6a040">否</text>
  <rect x="378" y="412" width="172" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="437" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">跳过（不变）</text>

  <!-- merge to left++, right-- -->
  <path d="M 126 452 L 126 472 L 280 472" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 464 452 L 464 472 L 280 472" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 280 472 L 280 500" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="500" width="200" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="521" text-anchor="middle" font-size="12" fill="#333">left++，right−−</text>

  <!-- loop back arrow: from left++,right-- up to left<=right diamond -->
  <path d="M 180 516 L 60 516 L 60 262 L 188 262" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="392" font-size="10" fill="#888" transform="rotate(-90 48 392)">回到判断</text>
</svg>
