<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "bbcbaba"</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">下标 0..6：b b c b a b a</text>

  <!-- index strip -->
  <g font-size="11">
    <rect x="60" y="64" width="52" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="86" y="80" text-anchor="middle" fill="#446688">0:b</text>
    <rect x="112" y="64" width="52" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="138" y="80" text-anchor="middle" fill="#446688">1:b</text>
    <rect x="164" y="64" width="52" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="80" text-anchor="middle" fill="#d6a040">2:c</text>
    <rect x="216" y="64" width="52" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="242" y="80" text-anchor="middle" fill="#446688">3:b</text>
    <rect x="268" y="64" width="52" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="294" y="80" text-anchor="middle" fill="#b85450">4:a</text>
    <rect x="320" y="64" width="52" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="346" y="80" text-anchor="middle" fill="#446688">5:b</text>
    <rect x="372" y="64" width="52" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="398" y="80" text-anchor="middle" fill="#b85450">6:a</text>
  </g>

  <!-- table header -->
  <g font-size="12">
    <rect x="40" y="108" width="60" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="128" text-anchor="middle" fill="#446688" font-weight="bold">x</text>
    <rect x="100" y="108" width="60" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="128" text-anchor="middle" fill="#446688" font-weight="bold">l</text>
    <rect x="160" y="108" width="60" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">r</text>
    <rect x="220" y="108" width="200" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="320" y="128" text-anchor="middle" fill="#b85450" font-weight="bold">s[l+1..r-1]</text>
    <rect x="420" y="108" width="130" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="485" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">贡献</text>
  </g>

  <!-- row a -->
  <g font-size="12">
    <rect x="40" y="142" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="170" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
    <rect x="100" y="142" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="170" text-anchor="middle" fill="#444">4</text>
    <rect x="160" y="142" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="170" text-anchor="middle" fill="#444">6</text>
    <rect x="220" y="142" width="200" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="320" y="170" text-anchor="middle" fill="#b85450">s[5..5] = "b" → {b}</text>
    <rect x="420" y="142" width="130" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="485" y="166" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="485" y="180" text-anchor="middle" font-size="10" fill="#888">aba</text>
  </g>

  <!-- row b -->
  <g font-size="12">
    <rect x="40" y="190" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="218" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="100" y="190" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="218" text-anchor="middle" fill="#444">0</text>
    <rect x="160" y="190" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="218" text-anchor="middle" fill="#444">5</text>
    <rect x="220" y="190" width="200" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="320" y="218" text-anchor="middle" fill="#b85450">s[1..4] = "bcba" → {b,c,a}</text>
    <rect x="420" y="190" width="130" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="485" y="214" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="485" y="228" text-anchor="middle" font-size="10" fill="#888">bbb,bcb,bab</text>
  </g>

  <!-- row c -->
  <g font-size="12">
    <rect x="40" y="238" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="266" text-anchor="middle" fill="#d6a040" font-weight="bold">c</text>
    <rect x="100" y="238" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="266" text-anchor="middle" fill="#444">2</text>
    <rect x="160" y="238" width="60" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="266" text-anchor="middle" fill="#444">2</text>
    <rect x="220" y="238" width="200" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="320" y="266" text-anchor="middle" fill="#888">l = r，跳过</text>
    <rect x="420" y="238" width="130" height="44" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="485" y="266" text-anchor="middle" fill="#888">0</text>
  </g>

  <!-- total -->
  <rect x="40" y="300" width="510" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="13" fill="#4a7a3a" font-weight="bold">合计：1 + 3 + 0 = 4 ✓</text>

  <!-- key takeaways -->
  <rect x="40" y="358" width="510" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="12" fill="#444" font-weight="bold">观察要点</text>
  <text x="60" y="402" font-size="11" fill="#555">• b 的最右是下标 5（不是 6），区间 s[1..4]="bcba" 含 3 种字符</text>
  <text x="60" y="420" font-size="11" fill="#555">• c 只出现一次 → l=r → 贡献 0；a 在 4、6，中间仅 b → 只得 aba</text>
</svg>
