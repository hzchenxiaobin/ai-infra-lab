<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：时间 t 越大 → 完成旅途数 trips(t) 越多（单调递增）</text>

  <!-- ===== Buses running in parallel ===== -->
  <text x="40" y="52" font-size="12" fill="#888">公交车队:</text>

  <!-- Bus 0: time=1 (fastest) -->
  <rect x="80" y="40" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bus 0</text>
  <text x="160" y="58" font-size="11" fill="#446688">time=1</text>
  <!-- trips for bus 0 at t=3 -->
  <rect x="210" y="40" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="58" text-anchor="middle" font-size="11" fill="#333">⌊3/1⌋=3</text>

  <!-- Bus 1: time=2 -->
  <rect x="80" y="76" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bus 1</text>
  <text x="160" y="94" font-size="11" fill="#446688">time=2</text>
  <rect x="210" y="76" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="94" text-anchor="middle" font-size="11" fill="#333">⌊3/2⌋=1</text>

  <!-- Bus 2: time=3 (slowest) -->
  <rect x="80" y="112" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bus 2</text>
  <text x="160" y="130" font-size="11" fill="#446688">time=3</text>
  <rect x="210" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#333">⌊3/3⌋=1</text>

  <!-- time axis label -->
  <text x="230" y="34" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">t = 3 时</text>

  <!-- Formula box on right -->
  <rect x="290" y="48" width="160" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">给定时间 t</text>
  <text x="370" y="92" text-anchor="middle" font-size="11" fill="#444">各车独立运行</text>
  <text x="370" y="110" text-anchor="middle" font-size="11" fill="#444">总旅途数 =</text>
  <text x="370" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Σ ⌊ t / time[i] ⌋</text>

  <!-- arrow down -->
  <path d="M 280 154 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="166" font-size="11" fill="#888">trips(t) 单调递增</text>

  <!-- ===== Monotonic curve ===== -->
  <!-- axes -->
  <line x1="80" y1="186" x2="80" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="192" text-anchor="end" font-size="10" fill="#888">trips</text>
  <text x="384" y="374" font-size="10" fill="#888">t →</text>
  <text x="74" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- increasing staircase curve -->
  <path d="M 80 370 L 100 370 L 100 348 L 130 348 L 130 326 L 170 326 L 170 304 L 210 304 L 210 282 L 260 282 L 260 260 L 320 260 L 320 238 L 380 238" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="260" y="252" font-size="11" fill="#446688" font-weight="bold">t ↑ ⇒ trips ↑</text>

  <!-- totalTrips threshold line -->
  <line x1="80" y1="290" x2="380" y2="290" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="294" font-size="11" fill="#b85450" font-weight="bold">totalTrips</text>
  <text x="384" y="306" font-size="10" fill="#b85450">= 5</text>

  <!-- answer point at t=3 -->
  <circle cx="170" cy="290" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="170" y1="290" x2="170" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="170" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="110" y="362" font-size="10" fill="#b85450">时间不够 ✗</text>
  <text x="280" y="278" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="392" y="198" width="150" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="467" y="222" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="467" y="244" text-anchor="middle" font-size="11" fill="#666">t ∈ [1, min·T]</text>
  <text x="467" y="262" text-anchor="middle" font-size="11" fill="#666">求最小的 t</text>
  <text x="467" y="280" text-anchor="middle" font-size="11" fill="#666">使 trips(t) ≥ T</text>
  <text x="467" y="300" text-anchor="middle" font-size="11" fill="#666">min = min(time)</text>
  <text x="467" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
