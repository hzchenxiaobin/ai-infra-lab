<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：逐行计算喜欢率，严格低于 60% 的行进入结果集</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="50" width="560" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">problem_id</text>
  <text x="180" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">likes</text>
  <text x="260" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">dislikes</text>
  <text x="360" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">喜欢率</text>
  <text x="460" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">2×likes vs 3×dislikes</text>
  <text x="560" y="67" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">&lt;60%?</text>

  <!-- ===== Data rows ===== -->
  <!-- Row P1: 4446/7206 = 61.7% (pass) -->
  <rect x="40" y="76" width="560" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="180" y="94" text-anchor="middle" font-size="9.5" fill="#333">4446</text>
  <text x="260" y="94" text-anchor="middle" font-size="9.5" fill="#333">2760</text>
  <text x="360" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">61.70%</text>
  <text x="460" y="94" text-anchor="middle" font-size="9" fill="#555">8892 vs 8280</text>
  <text x="560" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✗ 合格</text>

  <!-- Row P6: 1290/1715 = 75.2% (pass) -->
  <rect x="40" y="104" width="560" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="9.5" fill="#4a7a3a">6</text>
  <text x="180" y="122" text-anchor="middle" font-size="9.5" fill="#333">1290</text>
  <text x="260" y="122" text-anchor="middle" font-size="9.5" fill="#333">425</text>
  <text x="360" y="122" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">75.22%</text>
  <text x="460" y="122" text-anchor="middle" font-size="9" fill="#555">2580 vs 1275</text>
  <text x="560" y="122" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✗ 合格</text>

  <!-- Row P7: 8569/14655 = 58.5% (LOW) -->
  <rect x="40" y="132" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">7</text>
  <text x="180" y="150" text-anchor="middle" font-size="9.5" fill="#333">8569</text>
  <text x="260" y="150" text-anchor="middle" font-size="9.5" fill="#333">6086</text>
  <text x="360" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">58.47%</text>
  <text x="460" y="150" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">17138 &lt; 18258 ✓</text>
  <text x="560" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✓ 低质量</text>

  <!-- Row P10: 9002/16448 = 54.7% (LOW) -->
  <rect x="40" y="160" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">10</text>
  <text x="180" y="178" text-anchor="middle" font-size="9.5" fill="#333">9002</text>
  <text x="260" y="178" text-anchor="middle" font-size="9.5" fill="#333">7446</text>
  <text x="360" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">54.73%</text>
  <text x="460" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">18004 &lt; 22338 ✓</text>
  <text x="560" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✓ 低质量</text>

  <!-- Row P11: 2677/11336 = 23.6% (LOW) -->
  <rect x="40" y="188" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">11</text>
  <text x="180" y="206" text-anchor="middle" font-size="9.5" fill="#333">2677</text>
  <text x="260" y="206" text-anchor="middle" font-size="9.5" fill="#333">8659</text>
  <text x="360" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">23.62%</text>
  <text x="460" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5354 &lt; 25977 ✓</text>
  <text x="560" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✓ 低质量</text>

  <!-- Row P13: 2050/6214 = 33.0% (LOW) -->
  <rect x="40" y="216" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">13</text>
  <text x="180" y="234" text-anchor="middle" font-size="9.5" fill="#333">2050</text>
  <text x="260" y="234" text-anchor="middle" font-size="9.5" fill="#333">4164</text>
  <text x="360" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">32.99%</text>
  <text x="460" y="234" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4100 &lt; 12492 ✓</text>
  <text x="560" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✓ 低质量</text>

  <!-- ===== Divider ===== -->
  <path d="M320 248 L320 264" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Output result ===== -->
  <rect x="160" y="268" width="320" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ORDER BY problem_id ASC 后输出</text>
  <line x1="180" y1="294" x2="460" y2="294" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="220" y="312" font-size="10" fill="#b85450" font-weight="bold">problem_id</text>
  <text x="360" y="312" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="360" y="326" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="360" y="340" font-size="11" fill="#b85450" font-weight="bold">11</text>

  <!-- 13 wraps to show it's a column -->
  <rect x="180" y="318" width="40" height="20" fill="none" filter="url(#rough2)"/>
  <text x="360" y="354" font-size="11" fill="#b85450" font-weight="bold">13</text>

  <!-- ===== Bottom callout: cross-multiplication ===== -->
  <rect x="40" y="360" width="560" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="380" font-size="10" fill="#d6a040" font-weight="bold">交叉相乘验证（以 P7 为例）</text>
  <text x="55" y="396" font-size="9.5" fill="#555">原式：8569 / (8569 + 6086) = 8569 / 14655 = 0.5847 &lt; 0.6  ✓ 低质量</text>
  <text x="55" y="412" font-size="9.5" fill="#555">交叉相乘：2 × 8569 = 17138，  3 × 6086 = 18258，  17138 &lt; 18258  ✓ 同样判定低质量</text>
  <text x="55" y="428" font-size="9" fill="#999">两式等价：likes/(likes+dislikes) &lt; 0.6  ⟺  2×likes &lt; 3×dislikes（纯整数运算，无浮点误差、无除零风险）</text>
</svg>
