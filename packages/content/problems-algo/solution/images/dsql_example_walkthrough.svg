<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1：表 "two" 状态演化（nextId 删除后不回退）</text>

  <!-- column x positions: # 30, 操作 70, nextId 300, rows存活 360, 返回 590 -->
  <!-- header -->
  <rect x="14" y="44" width="632" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="30" y="62" font-size="11" fill="#446688" filter="url(#rough2)">#</text>
  <text x="70" y="62" font-size="11" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="300" y="62" font-size="11" fill="#446688" filter="url(#rough2)">nextId</text>
  <text x="360" y="62" font-size="11" fill="#446688" filter="url(#rough2)">rows（存活）</text>
  <text x="590" y="62" font-size="11" fill="#446688" filter="url(#rough2)">返回</text>

  <!-- row template height 38, start y=76 -->
  <!-- row 1 -->
  <rect x="14" y="76" width="632" height="34" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="98" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="98" font-size="11" fill="#333" filter="url(#rough2)">ins(two,[first,second,third])</text>
  <text x="300" y="98" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1→2</text>
  <text x="360" y="98" font-size="11" fill="#333" filter="url(#rough2)">{1:[first,second,third]}</text>
  <text x="590" y="98" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- row 2 -->
  <rect x="14" y="110" width="632" height="34" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="132" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="70" y="132" font-size="11" fill="#333" filter="url(#rough2)">sel(two,1,3)</text>
  <text x="300" y="132" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="360" y="132" font-size="11" fill="#999" filter="url(#rough2)">{1:[…]}（未变）</text>
  <text x="590" y="132" font-size="11" fill="#d6a040" filter="url(#rough2)">"third"</text>

  <!-- row 3 -->
  <rect x="14" y="144" width="632" height="34" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="166" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="70" y="166" font-size="11" fill="#333" filter="url(#rough2)">ins(two,[fourth,fifth,sixth])</text>
  <text x="300" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2→3</text>
  <text x="360" y="166" font-size="11" fill="#333" filter="url(#rough2)">{1:[…],2:[fourth,fifth,sixth]}</text>
  <text x="590" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- row 4 -->
  <rect x="14" y="178" width="632" height="34" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="200" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="70" y="200" font-size="11" fill="#333" filter="url(#rough2)">exp(two)</text>
  <text x="300" y="200" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="360" y="200" font-size="11" fill="#999" filter="url(#rough2)">{1:[…],2:[…]}（未变）</text>
  <text x="588" y="200" font-size="10" fill="#d6a040" filter="url(#rough2)">["1,first,second,third",</text>
  <text x="588" y="212" font-size="10" fill="#d6a040" filter="url(#rough2)"> "2,fourth,fifth,sixth"]</text>

  <!-- row 5: rmv — highlight (nextId unchanged) -->
  <rect x="14" y="212" width="632" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="30" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="70" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">rmv(two,1)  ← 删除</text>
  <text x="300" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">3（不变）</text>
  <text x="360" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">{2:[fourth,fifth,sixth]}</text>
  <text x="590" y="234" font-size="11" fill="#777" filter="url(#rough2)">—</text>

  <!-- row 6 -->
  <rect x="14" y="246" width="632" height="34" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="268" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="70" y="268" font-size="11" fill="#333" filter="url(#rough2)">sel(two,2,2)</text>
  <text x="300" y="268" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="360" y="268" font-size="11" fill="#999" filter="url(#rough2)">{2:[…]}（未变）</text>
  <text x="590" y="268" font-size="11" fill="#d6a040" filter="url(#rough2)">"fifth"</text>

  <!-- row 7 -->
  <rect x="14" y="280" width="632" height="34" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="302" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="70" y="302" font-size="11" fill="#333" filter="url(#rough2)">exp(two)</text>
  <text x="300" y="302" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="360" y="302" font-size="11" fill="#999" filter="url(#rough2)">{2:[…]}（未变）</text>
  <text x="588" y="302" font-size="10" fill="#d6a040" filter="url(#rough2)">["2,fourth,fifth,sixth"]</text>

  <!-- callout -->
  <rect x="14" y="330" width="632" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="354" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">第 5 步删除 id=1 后 nextId 仍为 3 ⇒ 下次插入得 id=3，绝不复用旧号</text>
</svg>
