<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：筛行 → 排序 → 投影（顺序不可换）</text>

  <!-- Step 1: input -->
  <rect x="96" y="52" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入 animals（6 行 × 4 列）</text>
  <text x="62" y="73" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6 行</text>

  <path d="M 216 88 L 216 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: mask -->
  <rect x="96" y="102" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">animals['weight'] &gt; 100 → 布尔掩码</text>
  <text x="62" y="123" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">向量化</text>

  <path d="M 216 138 L 216 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: filter rows -->
  <rect x="96" y="152" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">布尔索引筛行：True 留 / False 弃</text>
  <text x="62" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 → 4 行</text>

  <path d="M 216 188 L 216 200" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: sort -->
  <rect x="96" y="202" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sort_values('weight', ascending=False)</text>
  <text x="62" y="223" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">行内重排</text>

  <path d="M 216 238 L 216 250" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: project -->
  <rect x="96" y="252" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列投影 [['name']]（4 列 → 1 列）</text>
  <text x="62" y="273" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 行 × 1 列</text>

  <path d="M 216 288 L 216 300" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: output -->
  <rect x="96" y="302" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="216" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出：按 weight 降序的 name 列</text>

  <!-- SQL mapping -->
  <rect x="372" y="102" width="166" height="184" fill="#ffffff" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">对应 SQL（逻辑序）</text>
  <text x="455" y="156" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">WHERE weight &gt; 100</text>
  <text x="455" y="188" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ORDER BY weight DESC</text>
  <text x="455" y="220" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">SELECT name</text>
  <text x="455" y="262" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">链的从左到右</text>
  <text x="455" y="274" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">= SQL 的书写倒序</text>

  <!-- Bottom note -->
  <rect x="96" y="352" width="442" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="317" y="373" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">纪律：依赖 weight 列的变换，必须发生在丢弃 weight 列的投影之前</text>
</svg>
