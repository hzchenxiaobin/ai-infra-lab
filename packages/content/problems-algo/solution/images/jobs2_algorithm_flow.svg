<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 同序配对 + 取最大</text>

  <!-- Step 1: sort jobs -->
  <rect x="160" y="42" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">jobs 升序排序</text>
  <text x="260" y="75" text-anchor="middle" font-size="10" fill="#888">小工在前</text>

  <path d="M 260 82 L 260 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: sort workers -->
  <rect x="160" y="98" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">workers 升序排序</text>
  <text x="260" y="131" text-anchor="middle" font-size="10" fill="#888">慢人在前，快人在后</text>

  <path d="M 260 138 L 260 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: init -->
  <rect x="170" y="154" width="180" height="34" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="175" text-anchor="middle" font-size="12" fill="#333">ans = 0</text>

  <path d="M 260 188 L 260 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: loop -->
  <rect x="140" y="204" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i = 0 .. n-1：</text>
  <text x="260" y="237" text-anchor="middle" font-size="10" fill="#888">同下标配对 jobs[i] ↔ workers[i]</text>

  <path d="M 260 244 L 260 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: compute days -->
  <rect x="120" y="260" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d = ⌈ jobs[i] / workers[i] ⌉</text>
  <text x="260" y="295" text-anchor="middle" font-size="10.5" fill="#4a7a3a">向上取整 = (jobs[i] + workers[i] - 1) // workers[i]</text>

  <path d="M 260 304 L 260 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 6: update ans -->
  <rect x="150" y="320" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = max(ans, d)</text>

  <!-- loop back arrow -->
  <path d="M 370 339 L 410 339 L 410 224 L 380 224" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="418" y="284" font-size="10" fill="#888" transform="rotate(-90 418 284)">循环</text>

  <!-- end -->
  <path d="M 260 358 L 260 372" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="160" y="374" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 ans（最少天数）</text>
</svg>
