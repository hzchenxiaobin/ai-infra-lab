<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：按位贪心（桶计数 + 进位 + 就近拆分）</text>

  <!-- A: sum < target ? -->
  <polygon points="155,52 230,28 305,52 230,76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum &lt; target ?</text>

  <path d="M 307 52 L 396 52" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="42" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="400" y="35" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 230 78 L 230 96" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- build buckets -->
  <rect x="150" y="100" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建桶：cnt[log₂x]++</text>
  <text x="230" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = 0；i = 0</text>

  <path d="M 230 142 L 230 152" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: i <= 30 ? -->
  <polygon points="160,170 230,156 300,170 230,184" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≤ 30 ?</text>

  <path d="M 302 170 L 396 170" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="400" y="152" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 230 186 L 230 218" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- C: target bit i = 1 ? -->
  <polygon points="150,250 230,224 310,250 230,276" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">target 第 i 位</text>
  <text x="230" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= 1 ?</text>

  <!-- no-need bypass: right side down to carry box, hop over the "否" arrow -->
  <path d="M 312 250 L 390 250 L 390 328 A 8 8 0 0 1 390 344 L 390 446" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否：该位无需求</text>

  <path d="M 230 278 L 230 308" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D: cnt[i] > 0 ? -->
  <polygon points="155,340 230,314 305,340 230,366" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[i] &gt; 0 ?</text>

  <path d="M 307 340 L 416 340" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- split box -->
  <rect x="420" y="306" width="180" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">就近拆：找最小 j &gt; i</text>
  <text x="510" y="342" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">使 cnt[j] &gt; 0</text>
  <text x="510" y="358" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">ans += j − i；cnt[j] −−</text>
  <text x="510" y="374" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[i, j) 每层桶 +1（副产品）</text>

  <!-- split box output to cnt[i] decrement -->
  <path d="M 510 384 L 510 418 L 306 418" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 230 368 L 230 396" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- cnt[i] decrement box -->
  <rect x="160" y="400" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[i] −−（用掉 2^i）</text>

  <!-- cnt[i] decrement to carry -->
  <path d="M 230 436 L 230 472 L 304 472" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- carry box -->
  <rect x="310" y="450" width="190" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="470" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">进位：cnt[i+1] += cnt[i] / 2</text>
  <text x="405" y="487" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i++，回到「i ≤ 30 ?」</text>

  <!-- loop back edge -->
  <path d="M 308 460 L 80 460 L 80 170 L 154 170" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="500" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)" transform="rotate(-90 60 500)">循环 31 位</text>
</svg>
