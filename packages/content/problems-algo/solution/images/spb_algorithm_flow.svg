<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8 方向 BFS 算法流程</text>
  <path d="M 160 34 Q 280 42 400 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Start -->
  <rect x="230" y="46" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 280 74 L 280 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: grid[0][0]==1 or grid[n-1][n-1]==1? -->
  <polygon points="280,90 380,124 280,158 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">grid[0][0]==1</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">或 grid[n−1][n−1]==1?</text>

  <!-- Yes: return -1 -->
  <text x="390" y="120" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 380 124 L 440 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="442" y="108" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 −1</text>

  <!-- No -->
  <text x="164" y="120" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 158 L 280 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="174" width="180" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#333">grid[0][0] = 1（标记已访问）</text>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333">队列 q ← [(0,0,dist=1)]</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">dist 含起点，初始为 1</text>

  <path d="M 280 226 L 280 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <polygon points="280,242 360,272 280,302 200,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">队列 q 为空?</text>

  <!-- Yes: return -1 -->
  <text x="120" y="268" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 200 272 L 120 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="256" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="73" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 −1</text>

  <!-- No -->
  <text x="372" y="268" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 302 L 280 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pop cell -->
  <rect x="190" y="318" width="180" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333">弹出 (x, y, dist)</text>

  <path d="M 280 354 L 280 362" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: (x,y) == (n-1,n-1)? -->
  <polygon points="280,364 360,392 280,420 200,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(x,y)==终点?</text>

  <!-- Yes: return dist -->
  <text x="372" y="388" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 360 392 L 440 392" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="442" y="376" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="397" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 dist</text>

  <!-- No: explore 8 neighbors, loop back -->
  <text x="164" y="388" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 420 L 280 432" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="434" width="280" height="20" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#2e6e2e">遍历 8 邻居：合法 &amp;&amp; ==0 → 标记 1，入队 dist+1</text>

  <!-- loop back arrow -->
  <path d="M 140 444 L 60 444 L 60 272 L 198 272" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="70" y="360" font-size="9" fill="#888" filter="url(#rough2)">循环</text>
</svg>
