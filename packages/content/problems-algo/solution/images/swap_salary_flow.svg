<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">流程：UPDATE → SET CASE → 逐行翻转 → 全表完成</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">单趟扫描 O(n)：每行独立计算，读旧值 → 映射 → 写新值</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: UPDATE salary -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① UPDATE salary</text>
    <text x="200" y="84" font-family="monospace" font-size="10" fill="#555">指定目标表，逐行触发更新</text>
    <text x="54" y="100" font-size="9" fill="#888">无 WHERE 子句 → 全表所有行参与更新</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: SET sex = CASE -->
    <rect x="40" y="128" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#d6a040" font-weight="bold">② SET sex = CASE sex</text>
    <text x="54" y="166" font-family="monospace" font-size="10" fill="#555">WHEN 'm' THEN 'f'  WHEN 'f' THEN 'm'  END</text>
    <text x="54" y="182" font-size="9" fill="#888">CASE 逐行求值：读取当前行 sex 的旧值，映射为新值</text>
    <text x="54" y="198" font-size="9" fill="#b85450">⚠ 旧值在 CASE 求值时尚未被覆盖 → 信息不丢失</text>
    <text x="54" y="214" font-size="9" fill="#4a7a3a">MySQL 简写：IF(sex='m','f','m')，等价于二选一 CASE</text>

    <path d="M 260 222 L 260 236" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: per-row mapping -->
    <rect x="40" y="240" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="260" font-size="12" fill="#b85450" font-weight="bold">③ 逐行执行：读旧值 → CASE 映射 → 写新值</text>
    <text x="54" y="278" font-size="9" fill="#888">行 sex='m' → CASE 命中 WHEN 'm' → 写 'f'；行 sex='f' → 命中 WHEN 'f' → 写 'm'</text>
    <text x="290" y="278" font-size="9" fill="#888">XOR 捷径：CHAR(ASCII(sex)^ASCII('m')^ASCII('f'))</text>

    <path d="M 260 298 L 260 312" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: output -->
    <rect x="40" y="316" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="336" font-size="12" fill="#4a7a3a" font-weight="bold">④ 全表 sex 列翻转完成</text>
    <text x="54" y="354" font-size="9" fill="#888">原 m 全变 f，原 f 全变 m；id / name / salary 列不变</text>

    <!-- complexity -->
    <rect x="40" y="374" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n)  ·  空间 O(1)（原地更新，无中间表）</text>
    <text x="260" y="406" text-anchor="middle" font-size="10" fill="#888">SQL「UPDATE + 条件派生」最简形态</text>
  </g>
</svg>
