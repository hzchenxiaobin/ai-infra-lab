<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：倒序建 suffMin，正序一遍扫</text>

  <!-- ① 倒序预计算 -->
  <rect x="120" y="34" width="288" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="53" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">① 倒序预计算 suffMin[i] = min(nums[i], suffMin[i+1])</text>

  <path d="M 264 64 L 264 78" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="120" y="80" width="288" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="98" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② i = 0，prefMax = −∞</text>

  <path d="M 264 108 L 264 122" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ③ 循环体 -->
  <rect x="120" y="124" width="288" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="143" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ prefMax = max(prefMax, nums[i])</text>

  <path d="M 264 154 L 264 168" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ 判定菱形 -->
  <polygon points="264,168 356,202 264,236 172,202" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="198" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">prefMax − suffMin[i]</text>
  <text x="264" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">≤ k ?</text>

  <!-- 是 → 返回 i -->
  <path d="M 356 202 L 412 202" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="384" y="194" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="416" y="182" width="94" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="199" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 i ✓</text>
  <text x="463" y="214" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">最小稳定下标</text>

  <!-- 否 → 下一判定 -->
  <path d="M 264 236 L 264 250" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="278" y="248" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ⑤ 循环判定菱形 -->
  <polygon points="264,252 346,284 264,316 182,284" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="280" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i + 1 &lt; n ?</text>
  <text x="264" y="295" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（i 自增）</text>

  <!-- 是 → 回到 ③ -->
  <path d="M 182 284 L 62 284 L 62 139 L 116 139" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="278" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">是，i++</text>
  <text x="52" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回</text>
  <text x="52" y="228" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">到③</text>

  <!-- 否 → 返回 -1 -->
  <path d="M 346 284 L 412 284" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="276" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="416" y="264" width="94" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="281" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <text x="463" y="296" text-anchor="middle" font-size="8.5" fill="#a0433f" filter="url(#rough2)">无稳定下标</text>

  <!-- 底部备注 -->
  <rect x="120" y="330" width="288" height="24" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="264" y="346" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">两趟都是 O(n)：suffMin 一趟建表，prefMax 滚动维护</text>
</svg>
