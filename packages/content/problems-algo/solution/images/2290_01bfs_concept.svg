<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：边权只有 0/1 → 双端队列替代优先队列</text>

  <!-- ===== LEFT: Grid → graph modeling ===== -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">建模：边权 = grid[v]（空格 0 / 障碍 1）</text>

  <!-- 3x3 grid, cell=40px, origin (52, 70) -->
  <!-- Row 0: 0 1 1 -->
  <rect x="52" y="70" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="96" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="92" y="70" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="132" y="70" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 1: 1 1 0 -->
  <rect x="52" y="110" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="92" y="110" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="132" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row 2: 1 1 0 -->
  <rect x="52" y="150" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="92" y="150" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="132" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- S / T markers -->
  <text x="72" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a">S</text>
  <text x="152" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">T</text>

  <!-- edge weight arrows on path (0,0)->(0,1)[w1]->(0,2)[w1]->(1,2)[w0]->(2,2)[w0] -->
  <path d="M 92 90 L 132 90" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w=1</text>
  <path d="M 132 110 L 132 150" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="166" y="132" font-size="9" fill="#4a7a3a" font-weight="bold">w=0</text>
  <path d="M 92 170 L 132 170" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="112" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">w=0</text>

  <!-- legend -->
  <rect x="48" y="214" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="226" font-size="9.5" fill="#666">空格 边权 0</text>
  <rect x="118" y="214" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="138" y="226" font-size="9.5" fill="#666">障碍 边权 1</text>

  <text x="120" y="252" text-anchor="middle" font-size="9.5" fill="#888">路径代价 = Σ 边权 = 1+1+0+0 = 2</text>

  <!-- ===== RIGHT: deque concept ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">双端队列：队首小、队尾大，天然单调</text>

  <!-- deque as horizontal box -->
  <rect x="280" y="120" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dist 值非降排列的双端队列</text>

  <!-- cells inside -->
  <rect x="292" y="128" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="309" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k</text>
  <rect x="328" y="128" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k</text>
  <rect x="436" y="128" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="453" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k+1</text>
  <rect x="472" y="128" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="489" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k+1</text>

  <!-- front / back labels -->
  <text x="288" y="116" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">队首 front</text>
  <text x="506" y="116" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">队尾 back</text>

  <!-- 0-edge enters front -->
  <path d="M 250 132 L 290 132" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="206" y="122" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">w=0 边</text>
  <text x="228" y="158" text-anchor="middle" font-size="8.5" fill="#4a7a3a">nd=k 入队首</text>

  <!-- 1-edge enters back -->
  <path d="M 510 168 L 510 188 L 408 188 L 408 162" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="462" y="186" width="96" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="201" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">w=1 边</text>
  <text x="408" y="200" text-anchor="middle" font-size="8.5" fill="#b85450">nd=k+1 入队尾</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="30" y="300" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：边权只有 0/1 → 队列 dist 至多差 1，天然单调</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#555">① 空格边权 0：邻居 nd=d，与当前同层 → push_front</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#555">② 障碍边权 1：邻居 nd=d+1，比当前大一层 → push_back</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#555">出队顺序按 dist 非降 → 等价优先队列，但入/出队 O(1)，省去 log 因子</text>
</svg>
