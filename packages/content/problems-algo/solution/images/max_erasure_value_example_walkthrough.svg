<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="780" height="520" fill="#fdfcf7"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [4, 2, 4, 5, 6]</text>
  <path d="M 270 40 Q 390 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="390" y="60" text-anchor="middle" font-size="11" fill="#666">维护窗口 [left, right]：元素互异时扩展，遇重复时收缩左端</text>

  <!-- index header -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="110" y="84">0</text><text x="170" y="84">1</text><text x="230" y="84">2</text><text x="290" y="84">3</text><text x="350" y="84">4</text>
  </g>

  <!-- ===== right=0: window [4], sum=4 ===== -->
  <text x="56" y="108" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=0</text>
  <g filter="url(#sk2)"><rect x="80" y="90" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="110" y="112" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="140" y="90" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="170" y="112" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk2)"><rect x="200" y="90" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="230" y="112" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="260" y="90" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="112" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <g filter="url(#sk2)"><rect x="320" y="90" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="112" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="110" y="134" text-anchor="middle" font-size="9" fill="#446688">L=0</text>
  <text x="440" y="108" font-size="12" fill="#888">seen={4}, sum=4, max=4</text>

  <!-- ===== right=1: window [4,2], sum=6 ===== -->
  <text x="56" y="154" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=1</text>
  <g filter="url(#sk2)"><rect x="80" y="136" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="110" y="158" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="140" y="136" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="158" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="200" y="136" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="230" y="158" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="260" y="136" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="158" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <g filter="url(#sk2)"><rect x="320" y="136" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="158" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="110" y="180" text-anchor="middle" font-size="9" fill="#446688">L=0</text>
  <text x="440" y="154" font-size="12" fill="#888">seen={4,2}, sum=6, max=6</text>

  <!-- ===== right=2: 4 in seen → shrink ===== -->
  <text x="56" y="206" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">right=2</text>
  <text x="56" y="220" text-anchor="end" font-size="9" fill="#b85450">缩前</text>
  <g filter="url(#sk2)"><rect x="80" y="188" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="110" y="210" text-anchor="middle" font-size="13" fill="#a03a3a">4</text>
  <g filter="url(#sk2)"><rect x="140" y="188" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="210" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="200" y="188" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="230" y="210" text-anchor="middle" font-size="13" fill="#a03a3a" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="188" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="210" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <g filter="url(#sk2)"><rect x="320" y="188" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="110" y="232" text-anchor="middle" font-size="9" fill="#b85450">移除!</text>
  <text x="440" y="206" font-size="12" fill="#b85450">nums[2]=4 ∈ seen → 缩左</text>

  <!-- shrink result: remove nums[0]=4, then add 4 -->
  <text x="56" y="252" text-anchor="end" font-size="9" fill="#4a7a3a">缩后</text>
  <g filter="url(#sk2)"><rect x="80" y="234" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="256" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="140" y="234" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="256" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="200" y="234" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="230" y="256" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="234" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <g filter="url(#sk2)"><rect x="320" y="234" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="256" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="170" y="278" text-anchor="middle" font-size="9" fill="#446688">L=1</text>
  <g filter="url(#sk2)"><rect x="420" y="242" width="180" height="24" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="510" y="259" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">seen={2,4}, sum=6, max=6</text>

  <!-- divider -->
  <path d="M 60 294 L 720 294" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- ===== right=3: window [2,4,5], sum=11 ===== -->
  <text x="56" y="320" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=3</text>
  <g filter="url(#sk2)"><rect x="80" y="302" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="324" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="140" y="302" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="324" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="200" y="302" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="230" y="324" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="302" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="290" y="324" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">5</text>
  <g filter="url(#sk2)"><rect x="320" y="302" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="324" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="170" y="346" text-anchor="middle" font-size="9" fill="#446688">L=1</text>
  <g filter="url(#sk2)"><rect x="420" y="310" width="180" height="24" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="510" y="327" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">seen={2,4,5}, sum=11, max=11</text>

  <!-- ===== right=4: window [2,4,5,6], sum=17 ===== -->
  <text x="56" y="376" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=4</text>
  <g filter="url(#sk2)"><rect x="80" y="358" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="380" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="140" y="358" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="170" y="380" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="200" y="358" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="380" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="358" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="290" y="380" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">5</text>
  <g filter="url(#sk2)"><rect x="320" y="358" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="350" y="380" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">6</text>
  <text x="170" y="402" text-anchor="middle" font-size="9" fill="#446688">L=1</text>
  <g filter="url(#sk2)"><rect x="420" y="366" width="180" height="24" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="510" y="383" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">seen={2,4,5,6}, sum=17, max=17</text>

  <!-- ===== Result ===== -->
  <path d="M 60 420 L 720 420" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>

  <g filter="url(#sk2)"><rect x="120" y="436" width="240" height="44" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="240" y="456" text-anchor="middle" font-size="12" fill="#7a5415">最优子数组 [2, 4, 5, 6]</text>
  <text x="240" y="472" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">最大得分 = 17</text>

  <g filter="url(#sk2)"><rect x="420" y="436" width="240" height="44" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="540" y="456" text-anchor="middle" font-size="12" fill="#2e5e2e">元素互异，和最大</text>
  <text x="540" y="472" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">right 扫完 → 返回 17</text>

  <text x="390" y="508" text-anchor="middle" font-size="10" fill="#999">两指针各移动一次，总时间 O(n)；哈希集合额外 O(n) 空间</text>
</svg>
