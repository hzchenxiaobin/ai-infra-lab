<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：平衡 ⟺ 长度 = 种类数 × 最大频次</text>

  <!-- 左面板：平衡 -->
  <rect x="25" y="44" width="225" height="214" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="137" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">aabb —— 平衡 ✓</text>

  <rect x="57" y="80" width="32" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="95" y="80" width="32" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="133" y="80" width="32" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="171" y="80" width="32" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="111" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="149" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="187" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <line x1="57" y1="212" x2="203" y2="212" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="76" y="172" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="172" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="91" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a×2</text>
  <text x="153" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b×2</text>
  <text x="137" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">长度 4 = 2 × 2，顶满上界 ✓</text>

  <!-- 右面板：不平衡 -->
  <rect x="270" y="44" width="225" height="214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="382" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">aaab —— 不平衡 ✗</text>

  <rect x="302" y="80" width="32" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="80" width="32" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="378" y="80" width="32" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="80" width="32" height="32" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="356" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="394" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="432" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <line x1="302" y1="212" x2="448" y2="212" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="321" y="152" width="30" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="383" y="192" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="336" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a×3</text>
  <text x="398" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b×1</text>
  <text x="382" y="250" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">长度 4 ≠ 2 × 3，没顶满 ✗</text>

  <!-- 底部说明 -->
  <rect x="25" y="272" width="470" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">长度上界恒成立：len ≤ d × maxf（d 种字符，每种至多 maxf 个）</text>
  <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取到等号 ⇔ 每种字符都顶满 maxf 次 ⇔ 频次全相等 = 平衡</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">向左加字符时 freq 只增 ⇒ distinct、maxf 单调不减，三个量 O(1) 增量维护</text>
</svg>
