<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 条日志 → 分类 → 排序 → 输出</text>

  <!-- Section 1: input classification -->
  <text x="24" y="54" font-size="12" fill="#888">① 分类（看首空格后字符）</text>

  <!-- header -->
  <rect x="80" y="62" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="77" text-anchor="middle" font-size="11" fill="#555">原始日志</text>
  <text x="430" y="77" text-anchor="middle" font-size="11" fill="#555">类型</text>

  <!-- row 1: dig1 8 1 5 1 -->
  <rect x="80" y="86" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="11" fill="#333">dig1 8 1 5 1</text>
  <text x="430" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a">数字（8）</text>

  <!-- row 2: let1 art can -->
  <rect x="80" y="110" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#333">let1 art can</text>
  <text x="430" y="125" text-anchor="middle" font-size="11" fill="#d6a040">字母（a）</text>

  <!-- row 3: dig2 3 6 -->
  <rect x="80" y="134" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="149" text-anchor="middle" font-size="11" fill="#333">dig2 3 6</text>
  <text x="430" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a">数字（3）</text>

  <!-- row 4: let2 own kit dig -->
  <rect x="80" y="158" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="173" text-anchor="middle" font-size="11" fill="#333">let2 own kit dig</text>
  <text x="430" y="173" text-anchor="middle" font-size="11" fill="#d6a040">字母（o）</text>

  <!-- row 5: let3 art zero -->
  <rect x="80" y="182" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#333">let3 art zero</text>
  <text x="430" y="197" text-anchor="middle" font-size="11" fill="#d6a040">字母（a）</text>

  <path d="M 300 210 L 300 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section 2: letter sort -->
  <text x="24" y="250" font-size="12" fill="#888">② 字母日志按 (内容, 标识符) 排序</text>

  <rect x="80" y="258" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="273" text-anchor="middle" font-size="11" fill="#555">日志</text>
  <text x="330" y="273" text-anchor="middle" font-size="11" fill="#555">内容</text>
  <text x="480" y="273" text-anchor="middle" font-size="11" fill="#555">标识符</text>

  <!-- before sort: let1 art can -->
  <rect x="80" y="282" width="500" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="297" text-anchor="middle" font-size="11" fill="#333">let1 art can</text>
  <text x="330" y="297" text-anchor="middle" font-size="11" fill="#333">art can</text>
  <text x="480" y="297" text-anchor="middle" font-size="11" fill="#333">let1</text>

  <rect x="80" y="306" width="500" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="321" text-anchor="middle" font-size="11" fill="#333">let2 own kit dig</text>
  <text x="330" y="321" text-anchor="middle" font-size="11" fill="#333">own kit dig</text>
  <text x="480" y="321" text-anchor="middle" font-size="11" fill="#333">let2</text>

  <rect x="80" y="330" width="500" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="345" text-anchor="middle" font-size="11" fill="#333">let3 art zero</text>
  <text x="330" y="345" text-anchor="middle" font-size="11" fill="#333">art zero</text>
  <text x="480" y="345" text-anchor="middle" font-size="11" fill="#333">let3</text>

  <path d="M 300 358 L 300 378" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="372" font-size="11" fill="#888">内容升序：art can &lt; art zero &lt; own</text>

  <!-- after sort -->
  <rect x="80" y="382" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="397" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">let1 art can → let3 art zero → let2 own kit dig</text>
  <text x="460" y="416" text-anchor="middle" font-size="11" fill="#888">art can 同前缀，标识符 let1 &lt; let3 兜底</text>

  <path d="M 300 424 L 300 444" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section 3: final result -->
  <text x="24" y="464" font-size="12" fill="#888">③ 拼接数字日志（原序）</text>
  <rect x="80" y="472" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="493" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">let1 art can, let3 art zero, let2 own kit dig,</text>
  <text x="300" y="503" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dig1 8 1 5 1, dig2 3 6</text>
</svg>
