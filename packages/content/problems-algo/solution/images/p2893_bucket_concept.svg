<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：⌈minute / 6⌉ 一次除法定桶</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">minute 轴（每格 1 分钟，从 1 开始编号）</text>

  <rect x="47" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="83" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="119" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="155" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="191" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="227" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="263" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="299" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="335" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="371" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="407" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="443" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="62" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="134" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="206" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="242" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="278" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="314" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="350" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="386" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="422" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="458" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <rect x="47" y="98" width="210" height="5" fill="#446688" rx="2" filter="url(#rough2)"/>
  <rect x="263" y="98" width="210" height="5" fill="#4a7a3a" rx="2" filter="url(#rough2)"/>

  <path d="M 152 106 L 152 134" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 368 106 L 368 134" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="138" width="190" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="162" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">区间 1 · 第 1~6 分钟</text>
  <text x="145" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌈m/6⌉ = 1</text>

  <rect x="280" y="138" width="190" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区间 2 · 第 7~12 分钟</text>
  <text x="375" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌈m/6⌉ = 2</text>

  <rect x="40" y="218" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">interval_no = ⌈minute / 6⌉ = (minute − 1) DIV 6 + 1</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">宽度换成任意 w 只改一个常数：⌈m / w⌉</text>

  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ MySQL 的 / 是真除法（5/6=0.833…），CEIL 可用；整除方言请改用 (m−1) DIV 6 + 1</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">桶号由算式决定，与表里「那 6 行是否齐全」无关</text>
</svg>
