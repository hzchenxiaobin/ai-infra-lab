<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：祖先的邻接集 ⊇ 后代的邻接集</text>

  <!-- ===== Left: Tree ===== -->
  <text x="85" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">有根树</text>

  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="85" cy="82" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="85" y="87" fill="#446688">1</text>
    <circle cx="55" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="55" y="147" fill="#4a7a3a">2</text>
    <circle cx="115" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="115" y="147" fill="#4a7a3a">3</text>
    <circle cx="55" cy="202" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="55" y="207" fill="#d6a040">4</text>
  </g>

  <g filter="url(#rough2)" stroke="#888" stroke-width="2" fill="none">
    <path d="M 80 97 L 60 126" marker-end="url(#arr)"/>
    <path d="M 90 97 L 110 126" marker-end="url(#arr)"/>
    <path d="M 55 158 L 55 186" marker-end="url(#arr)"/>
  </g>

  <text x="85" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1→{2,3}, 2→4</text>

  <!-- pairs list -->
  <text x="85" y="262" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">pairs =</text>
  <text x="85" y="276" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">{1,2},{1,3},</text>
  <text x="85" y="290" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">{1,4},{2,4}</text>

  <!-- Arrow: tree → adj -->
  <path d="M 160 160 L 210 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">建表</text>

  <!-- ===== Middle: Adj sets ===== -->
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">邻接表（按度降序）</text>

  <g filter="url(#rough2)" font-size="10">
    <!-- adj[1] root -->
    <rect x="220" y="68" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="230" y="86" font-weight="bold" fill="#446688">adj[1] = {2, 3, 4}</text>
    <text x="230" y="102" fill="#888">deg=3　← 根（n−1=3）</text>

    <!-- adj[2] -->
    <rect x="220" y="122" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="230" y="140" font-weight="bold" fill="#4a7a3a">adj[2] = {1, 4}</text>
    <text x="230" y="154" fill="#888">deg=2</text>

    <!-- adj[4] -->
    <rect x="220" y="170" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <text x="230" y="188" font-weight="bold" fill="#d6a040">adj[4] = {1, 2}</text>
    <text x="230" y="202" fill="#888">deg=2</text>

    <!-- adj[3] -->
    <rect x="220" y="218" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="230" y="236" font-weight="bold" fill="#b85450">adj[3] = {1}</text>
    <text x="230" y="250" fill="#888">deg=1</text>
  </g>

  <!-- Arrow: adj → nesting -->
  <path d="M 410 160 L 440 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="154" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">验证</text>

  <!-- ===== Right: Superset property ===== -->
  <rect x="440" y="48" width="145" height="230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="512" y="68" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">邻接嵌套性质</text>

  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="450" y="88">u 是 v 的祖先 ⟹</text>
    <rect x="448" y="94" width="130" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3"/>
    <text x="513" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">adj[v]\{u} ⊆ adj[u]</text>

    <!-- nesting chain: 1→2→4 -->
    <text x="450" y="134" fill="#888">链 1→2→4：</text>
    <rect x="448" y="140" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="488" y="153" text-anchor="middle" fill="#d6a040">adj[4]={1,2}</text>
    <text x="540" y="153" font-size="8" fill="#888">⊆</text>
    <rect x="448" y="162" width="110" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="503" y="175" text-anchor="middle" fill="#4a7a3a">adj[2]={1,4}</text>
    <text x="540" y="175" font-size="8" fill="#888"></text>
    <rect x="448" y="184" width="130" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="513" y="197" text-anchor="middle" fill="#446688">adj[1]={2,3,4}</text>

    <!-- chain 1→3 -->
    <text x="450" y="222" fill="#888">链 1→3：</text>
    <rect x="448" y="228" width="60" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="478" y="241" text-anchor="middle" fill="#b85450">adj[3]={1}</text>
    <text x="520" y="241" font-size="8" fill="#888">⊆</text>
    <rect x="448" y="250" width="130" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="513" y="263" text-anchor="middle" fill="#446688">adj[1]={2,3,4}</text>
  </g>

  <!-- ===== Bottom: Multiple ways ===== -->
  <rect x="60" y="300" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="320" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">找父节点</text>
  <text x="72" y="336" font-size="9" fill="#555" filter="url(#rough2)">parent = adj[x] 中度最小且</text>
  <text x="72" y="350" font-size="9" fill="#555" filter="url(#rough2)">　≥ deg(x) 的邻居</text>

  <rect x="320" y="300" width="240" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="320" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">多解判定</text>
  <text x="332" y="336" font-size="9" fill="#555" filter="url(#rough2)">deg(x) == deg(parent) ⟹ 可互换</text>
  <text x="332" y="350" font-size="9" fill="#888" filter="url(#rough2)">adj[x]∪{x} = adj[p]∪{p} → 两种树</text>

  <!-- Footer -->
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">按度排序 → 每个节点的父 = 度最小的「≥己度」邻居 → 验证嵌套 → 判多解</text>
</svg>
