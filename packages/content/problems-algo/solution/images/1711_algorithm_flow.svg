<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举 22 个幂 + 哈希计数，一次遍历</text>

  <!-- Step 1: precompute powers -->
  <rect x="60" y="48" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 预处理 22 个 2 的幂</text>
  <text x="160" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">powers = {2⁰, 2¹, … , 2²¹}</text>
  <text x="160" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">最大和 2²⁰+2²⁰ = 2²¹</text>

  <!-- Step 2: init -->
  <rect x="300" y="48" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 初始化</text>
  <text x="400" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt = {}，ans = 0</text>
  <text x="400" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">MOD = 10⁹+7</text>

  <!-- arrows down to loop -->
  <path d="M 160 104 L 160 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 104 L 400 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop header -->
  <rect x="120" y="128" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 遍历数组 deliciousness 中的每个 x</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（边查边存：查的是「之前」见过的元素）</text>

  <path d="M 280 174 L 280 192" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop over powers -->
  <rect x="80" y="196" width="400" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 对每个幂 p ∈ powers：</text>
  <line x1="96" y1="224" x2="464" y2="224" stroke="#e8d090" stroke-width="1" filter="url(#rough2)"/>
  <text x="96" y="240" font-size="10" fill="#555" filter="url(#rough2)">补数 = p − x</text>
  <text x="240" y="240" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">若补数 ∈ cnt：</text>
  <text x="240" y="254" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = (ans + cnt[补数]) % MOD</text>

  <path d="M 280 262 L 280 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: store current -->
  <rect x="140" y="284" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 查完 22 个幂后：cnt[x] += 1</text>
  <text x="280" y="318" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（先查后存，避免元素与自己配对）</text>

  <!-- loop back arrow -->
  <path d="M 420 306 L 510 306 L 510 150 L 440 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="516" y="228" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="516" y="240" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一</text>
  <text x="516" y="252" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">个</text>
  <text x="516" y="264" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>

  <path d="M 280 330 L 280 348" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return -->
  <rect x="180" y="352" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 返回 ans % MOD</text>
  <text x="280" y="386" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（每对 i&lt;j 恰统计一次）</text>

  <!-- complexity note -->
  <rect x="60" y="408" width="440" height="38" fill="#fff" stroke="#eee" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">时间 O(22·n) = O(n)　|　空间 O(n)（哈希表存不同值的频次）</text>
  <text x="280" y="440" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">核心：值域受限 → 目标集合常数化 → 枚举目标 + 哈希查补数</text>
</svg>
