<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">差值 = leftSum − rightSum = 2·leftSum − total，奇偶只看 total</text>

  <text x="76" y="58" text-anchor="end" font-size="11" fill="#888">nums:</text>
  <rect x="90" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="58" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="150" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="58" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="210" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="58" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="270" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="58" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="330" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="58" text-anchor="middle" font-size="11" fill="#333">6</text>

  <text x="117" y="82" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="177" y="82" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="237" y="82" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="297" y="82" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="357" y="82" text-anchor="middle" font-size="9" fill="#999">4</text>

  <text x="70" y="118" text-anchor="end" font-size="11" fill="#444" font-weight="bold">分区 i=1:</text>
  <rect x="90" y="100" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <rect x="150" y="100" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <rect x="210" y="100" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="270" y="100" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="330" y="100" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <path d="M 207 94 L 207 134" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="117" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">leftSum = 20</text>
  <text x="297" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rightSum = 16</text>
  <text x="412" y="112" font-size="10" fill="#333">diff = 20 − 16 = 4</text>
  <text x="412" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">是偶数 ✓</text>

  <rect x="40" y="162" width="440" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">diff(i) = leftSum − (total − leftSum)</text>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 2·leftSum − total</text>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#b85450">2·leftSum 恒为偶数，与分界点 i 无关！</text>

  <rect x="40" y="250" width="440" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total 为偶数（如 36）→ 差恒为偶 → 答案 = n − 1 = 4</text>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total 为奇数（如 5）→ 差恒为奇 → 答案 = 0</text>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#555">挪动分界点只改变 leftSum，永远不改变差的奇偶性 ⭐</text>
</svg>
