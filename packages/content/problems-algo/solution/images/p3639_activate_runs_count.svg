<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：'*' 切段——有效子串数 = 总数 − 无效子串数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以示例 2 为例：s = "cat"，k = 6；子串总数 = 3×4/2 = 6</text>

  <!-- Row t=0 : "*at" -->
  <text x="38" y="92" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">t = 0</text>
  <rect x="70" y="70" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <rect x="110" y="70" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="150" y="70" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="93" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">t</text>
  <path d="M 112 110 L 112 116 L 184 116 L 184 110" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">L = 2</text>
  <text x="240" y="86" font-size="11" fill="#333" filter="url(#rough2)">无效 = 2×3/2 = 3 → 有效 = 6 − 3 = 3</text>
  <text x="240" y="102" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 &lt; k = 6，未激活 ✗</text>

  <path d="M 44 106 L 44 136" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row t=1 : "*a*" -->
  <text x="38" y="164" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">t = 1</text>
  <rect x="70" y="142" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <rect x="110" y="142" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="165" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="150" y="142" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <path d="M 112 182 L 112 188 L 144 188 L 144 182" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">L = 1</text>
  <text x="240" y="158" font-size="11" fill="#333" filter="url(#rough2)">无效 = 1×2/2 = 1 → 有效 = 6 − 1 = 5</text>
  <text x="240" y="174" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &lt; 6，未激活 ✗</text>

  <path d="M 44 178 L 44 208" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row t=2 : "***" -->
  <text x="38" y="236" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">t = 2</text>
  <rect x="70" y="214" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <rect x="110" y="214" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <rect x="150" y="214" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">*</text>
  <text x="240" y="230" font-size="11" fill="#333" filter="url(#rough2)">无完整段 → 无效 = 0 → 有效 = 6</text>
  <text x="240" y="246" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 ≥ 6 → 活跃 ✓（答案 t = 2）</text>

  <!-- note box -->
  <rect x="50" y="264" width="420" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">'*' 把串切成若干极大非 '*' 连续段，段与段互相独立</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">长 L 的段内部恰有 L(L+1)/2 个子串，全部不含 '*'——即全部无效</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">故 f(t) = n(n+1)/2 − Σ L(L+1)/2，一遍扫描 O(n) 求出</text>
</svg>
