<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="480" height="320" fill="#fafafa"/>

  <text x="240" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- start -->
  <rect x="190" y="30" width="90" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="47" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M235 54 L235 66" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- group -->
  <rect x="70" y="66" width="330" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="89" text-anchor="middle" font-size="12" fill="#333">① 按首字母分组：groups[c] = { s[1:] }</text>
  <path d="M235 102 L235 114" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="175" y="114" width="120" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="131" text-anchor="middle" font-size="12" fill="#333">② ans = 0</text>
  <path d="M235 140 L235 162" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="235,162 305,201 235,240 165,201" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="205" text-anchor="middle" font-size="12" fill="#333">③ 还有 (a,b) 对?</text>

  <!-- yes branch -->
  <text x="312" y="196" font-size="11" fill="#4a7a3a">是</text>
  <path d="M305 201 L324 201" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- process box -->
  <rect x="324" y="176" width="146" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="196" text-anchor="middle" font-size="11" fill="#333">common = |A ∩ B|</text>
  <text x="397" y="214" text-anchor="middle" font-size="11" fill="#333">ans += (|A|−c)(|B|−c)</text>

  <!-- loop back: up from process top, over the top, into diamond top-right edge -->
  <path d="M397 176 L397 138 L265 138 L265 182" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="330" y="132" font-size="10" fill="#b85450">下一对</text>

  <!-- no branch -->
  <text x="243" y="256" font-size="11" fill="#888">否</text>
  <path d="M235 240 L235 262" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="160" y="262" width="150" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="281" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans × 2</text>
</svg>
