<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：算幂 → toBase 短除转进制 → 拼接返回（示例 n = 13）</text>

  <rect x="185" y="34" width="150" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输入 n（1 ≤ n ≤ 1000）</text>

  <path d="M 230 66 Q 175 76 137 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 290 66 Q 345 76 383 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="94" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n² = n × n</text>

  <path d="M 130 124 L 130 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="148" width="170" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="167" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">toBase(n², 16)</text>
  <text x="130" y="185" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">短除：除 16 取余</text>

  <path d="M 130 194 L 130 212" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="214" width="84" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"A9"</text>

  <rect x="320" y="94" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n³ = n × n × n</text>

  <path d="M 390 124 L 390 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="305" y="148" width="170" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="167" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">toBase(n³, 36)</text>
  <text x="390" y="185" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">短除：除 36 取余</text>

  <path d="M 390 194 L 390 212" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="348" y="214" width="84" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"1P1"</text>

  <path d="M 130 244 Q 130 262 205 270" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 390 244 Q 390 262 315 270" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="160" y="272" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">字符串拼接：hex + base36</text>

  <path d="M 260 306 L 260 326" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="328" width="180" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出 "A91P1"</text>

  <rect x="24" y="378" width="472" height="90" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="398" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">toBase(x, b) 内部循环（短除法）</text>

  <polygon points="105,408 150,430 105,452 60,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="434" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x &gt; 0 ?</text>

  <text x="158" y="426" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 150 430 L 174 430" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="416" width="146" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="249" y="434" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">res += digits[x % b]</text>

  <path d="M 322 430 L 344 430" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="346" y="416" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="391" y="434" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">x = x ÷ b</text>

  <path d="M 391 416 Q 391 404 366 403 L 138 403 Q 105 403 105 407" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="240" y="399" font-size="10" fill="#446688" filter="url(#rough2)">继续短除</text>

  <path d="M 105 452 L 105 460" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="118" y="464" font-size="10.5" fill="#b85450" filter="url(#rough2)">否 → 倒序 res，返回字符串</text>
</svg>
