<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP：让 s[i..j] 成为回文的最少删除次数</text>

  <!-- String row with pointers i, j -->
  <text x="40" y="64" font-size="12" fill="#888">s =</text>
  <rect x="80" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="116" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="152" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="188" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="70" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="224" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="70" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="260" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="296" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="97" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>
  <text x="313" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>

  <!-- Case 1: s[i] == s[j] -->
  <rect x="30" y="112" width="245" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="152" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情况一：s[i] == s[j]</text>
  <text x="152" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">两端天然配对，无需删除</text>
  <!-- mini string showing matched ends + inner -->
  <rect x="62" y="164" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="90" y="168" width="18" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="99" y="181" text-anchor="middle" font-size="9" fill="#aaa">b</text>
  <rect x="110" y="168" width="18" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="119" y="181" text-anchor="middle" font-size="9" fill="#aaa">c</text>
  <rect x="130" y="168" width="18" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="181" text-anchor="middle" font-size="9" fill="#aaa">d</text>
  <rect x="150" y="168" width="18" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="159" y="181" text-anchor="middle" font-size="9" fill="#aaa">e</text>
  <rect x="170" y="168" width="18" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="179" y="181" text-anchor="middle" font-size="9" fill="#aaa">c</text>
  <rect x="190" y="164" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <!-- brace / arrow to inner -->
  <path d="M 74 190 L 74 198 L 202 198 L 202 190" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="138" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 内部 s[i+1..j−1]</text>
  <text x="152" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] = dp[i+1][j−1]</text>

  <!-- Case 2: s[i] != s[j] -->
  <rect x="285" y="112" width="245" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="407" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情况二：s[i] != s[j]</text>
  <text x="407" y="152" text-anchor="middle" font-size="11" fill="#b85450">必须删除一个字符</text>
  <!-- option A: delete s[i] -->
  <rect x="300" y="166" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="10" fill="#333">删左端 s[i]</text>
  <text x="350" y="193" text-anchor="middle" font-size="10" fill="#b85450">dp[i+1][j] + 1</text>
  <!-- option B: delete s[j] -->
  <rect x="415" y="166" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="178" text-anchor="middle" font-size="10" fill="#333">删右端 s[j]</text>
  <text x="465" y="193" text-anchor="middle" font-size="10" fill="#b85450">dp[i][j−1] + 1</text>
  <text x="407" y="218" text-anchor="middle" font-size="10" fill="#888">取较小者</text>
  <text x="407" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] = min(二者) + 1</text>

  <!-- Dependency arrows -->
  <path d="M 152 242 L 152 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 407 242 L 407 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom: answer -->
  <rect x="80" y="270" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = dp[0][n−1] ≤ k ？返回 true / false</text>

  <!-- Fill order note -->
  <rect x="60" y="324" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">填表顺序：按子串长度 len 从 2 → n 递增</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">dp[i][j] 依赖 dp[i+1][j−1]（左下）、dp[i+1][j]（下）、dp[i][j−1]（左）</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888">三者长度都更短，先填短区间即可保证依赖已就绪</text>
</svg>
