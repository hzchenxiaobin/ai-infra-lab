<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[-1,-8,0,5,-9] → 排序 → 反向累加</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">枚举每个后缀的收益，峰值 14 出现在后缀 [-1,0,5]</text>

  <!-- ===== Step 1: sort ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">① 升序排序：</text>
  <g font-size="11">
    <rect x="130" y="64" width="40" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="150" y="82" text-anchor="middle" fill="#333">-1</text>
    <rect x="172" y="64" width="40" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="192" y="82" text-anchor="middle" fill="#333">-8</text>
    <rect x="214" y="64" width="40" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="234" y="82" text-anchor="middle" fill="#333">0</text>
    <rect x="256" y="64" width="40" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="276" y="82" text-anchor="middle" fill="#333">5</text>
    <rect x="298" y="64" width="40" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="318" y="82" text-anchor="middle" fill="#333">-9</text>
  </g>
  <path d="M 340 77 L 372 77" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g font-size="11">
    <rect x="380" y="64" width="40" height="26" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="400" y="82" text-anchor="middle" fill="#888">-9</text>
    <rect x="422" y="64" width="40" height="26" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="442" y="82" text-anchor="middle" fill="#888">-8</text>
    <rect x="464" y="64" width="40" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="484" y="82" text-anchor="middle" fill="#d6a040" font-weight="bold">-1</text>
    <rect x="506" y="64" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="526" y="82" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="548" y="64" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="568" y="82" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <!-- ===== Step 2: enumerate suffixes table ===== -->
  <text x="40" y="118" font-size="11" fill="#446688" font-weight="bold">② 枚举后缀起点 i，计算收益 f(i) = Σ (j-i+1)·s[j]：</text>

  <!-- table header -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="40" y="126" width="540" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="142" text-anchor="middle">起点 i</text>
    <text x="150" y="142" text-anchor="middle">后缀</text>
    <text x="290" y="142" text-anchor="middle">展开计算</text>
    <text x="430" y="142" text-anchor="middle">收益</text>
    <text x="530" y="142" text-anchor="middle">判定</text>
  </g>

  <!-- rows -->
  <g font-size="10" fill="#333">
    <!-- empty -->
    <text x="70" y="166" text-anchor="middle">空</text>
    <text x="150" y="166" text-anchor="middle" fill="#888">—</text>
    <text x="290" y="166" text-anchor="middle" fill="#888">不选</text>
    <text x="430" y="166" text-anchor="middle" fill="#888">0</text>
    <text x="530" y="166" text-anchor="middle" fill="#888">兜底</text>

    <!-- i=4 -->
    <text x="70" y="186" text-anchor="middle">4</text>
    <text x="150" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[5]</text>
    <text x="290" y="186" text-anchor="middle">1×5</text>
    <text x="430" y="186" text-anchor="middle">5</text>
    <text x="530" y="186" text-anchor="middle" fill="#4a7a3a">↑</text>

    <!-- i=3 -->
    <text x="70" y="206" text-anchor="middle">3</text>
    <text x="150" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0,5]</text>
    <text x="290" y="206" text-anchor="middle">1×0 + 2×5</text>
    <text x="430" y="206" text-anchor="middle">10</text>
    <text x="530" y="206" text-anchor="middle" fill="#4a7a3a">↑</text>

    <!-- i=2 PEAK highlight -->
    <rect x="44" y="214" width="532" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" fill-opacity="0.55" filter="url(#rough2)"/>
    <text x="70" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="150" y="230" text-anchor="middle" fill="#d6a040" font-weight="bold">[-1,0,5]</text>
    <text x="290" y="230" text-anchor="middle" fill="#b85450">1×(-1)+2×0+3×5</text>
    <text x="430" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">14 ★</text>
    <text x="530" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">峰值</text>

    <!-- i=1 -->
    <text x="70" y="250" text-anchor="middle">1</text>
    <text x="150" y="250" text-anchor="middle">[-8,-1,0,5]</text>
    <text x="290" y="250" text-anchor="middle">-8+2×(-1)+3×0+4×5</text>
    <text x="430" y="250" text-anchor="middle">10</text>
    <text x="530" y="250" text-anchor="middle" fill="#b85450">↓</text>

    <!-- i=0 -->
    <text x="70" y="270" text-anchor="middle">0</text>
    <text x="150" y="270" text-anchor="middle">[-9,-8,-1,0,5]</text>
    <text x="290" y="270" text-anchor="middle">-9+2×(-8)+3×(-1)+4×0+5×5</text>
    <text x="430" y="270" text-anchor="middle">-3</text>
    <text x="530" y="270" text-anchor="middle" fill="#b85450">↓</text>
  </g>

  <!-- table outline -->
  <rect x="40" y="126" width="540" height="156" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="126" x2="110" y2="282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="126" x2="220" y2="282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="126" x2="380" y2="282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="490" y1="126" x2="490" y2="282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="300" width="540" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = max(0, 5, 10, 14, 10, -3) = 14</text>
  <text x="310" y="340" text-anchor="middle" font-size="10" fill="#888">峰值在 i=2：保留后缀 [-1,0,5]，做菜顺序 = -1 → 0 → 5</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="368" width="540" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">为什么 i=2 保留 -1 反而赚？</text>
  <text x="56" y="408" font-size="10" fill="#555">• 加入 -1 到队首，自己贡献 1×(-1) = -1；</text>
  <text x="56" y="424" font-size="10" fill="#555">• 但把后面 [0,5] 的系数各 +1：额外 +(0+5) = +5；净增 = -1 + 5 = +4（即 suf[2]=4 &gt; 0）。</text>
  <text x="56" y="438" font-size="10" fill="#888">• 再加 -8 时 suf=-4 &lt; 0，净亏，故丢——这正是「后缀和 ≤ 0 即停」。</text>
</svg>
