<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">祖玛游戏核心机制：插入 → 消除 → 连锁反应</text>

  <!-- Row 1: initial board RRWWRR + hand W -->
  <text x="36" y="72" font-size="11" fill="#888" font-weight="bold">board:</text>
  <circle cx="92" cy="68" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="128" cy="68" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="164" cy="68" r="16" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="73" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">W</text>
  <circle cx="200" cy="68" r="16" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">W</text>
  <circle cx="236" cy="68" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="272" cy="68" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <text x="330" y="72" font-size="11" fill="#888" font-weight="bold">hand:</text>
  <circle cx="382" cy="68" r="14" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="382" y="72" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">W</text>
  <text x="410" y="72" font-size="10" fill="#aaa">×1</text>

  <!-- Arrow: insert W into WW segment -->
  <path d="M 382 84 Q 300 110 182 92" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">插入 1 个 W</text>

  <!-- Row 2: after insertion RR WWW RR -->
  <text x="36" y="148" font-size="11" fill="#888" font-weight="bold">插入后:</text>
  <circle cx="92" cy="144" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="128" cy="144" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <!-- WWW highlighted -->
  <circle cx="164" cy="144" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="164" y="149" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">W</text>
  <circle cx="200" cy="144" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">W</text>
  <circle cx="236" cy="144" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="236" y="149" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">W</text>
  <circle cx="272" cy="144" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="308" cy="144" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <!-- bracket around WWW -->
  <path d="M 148 168 L 148 174 L 252 174 L 252 168" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 连同色 → 消除</text>

  <!-- Arrow down -->
  <path d="M 200 198 L 200 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 3: after removing WWW → RRRR (chain) -->
  <text x="36" y="248" font-size="11" fill="#888" font-weight="bold">消除后:</text>
  <circle cx="110" cy="244" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="110" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="146" cy="244" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="146" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="182" cy="244" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="182" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <circle cx="218" cy="244" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="218" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <path d="M 94 268 L 94 274 L 234 274 L 234 268" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="164" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">连锁：两侧 RR 合并 → RRRR ≥ 3 → 再次消除</text>

  <!-- Arrow down -->
  <path d="M 164 298 L 164 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 4: empty -->
  <text x="36" y="348" font-size="11" fill="#888" font-weight="bold">结果:</text>
  <rect x="90" y="332" width="148" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 棋盘清空，用了 1 球</text>

  <!-- Key insight box -->
  <rect x="300" y="220" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">关键观察</text>
  <text x="312" y="264" font-size="10.5" fill="#666">① 只需在已有同色段旁插入</text>
  <text x="312" y="282" font-size="10.5" fill="#666">② L=2 需补 1 球，L=1 需补 2 球</text>
  <text x="312" y="300" font-size="10.5" fill="#666">③ 消除后连锁自动触发</text>
  <text x="312" y="314" font-size="10.5" fill="#888">（shrink 函数循环消除）</text>
</svg>
