<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：build("1(2(4))(3(5)(6))") 递归展开</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888">每个框 = 一次 build 调用：上方输入子串，下方建出的节点</text>

  <!-- ===== Row 1: root call ===== -->
  <rect x="190" y="56" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#333">输入: "1(2(4))(3(5)(6))"</text>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">rootVal=1 → 拆出 (2(4)) 与 (3(5)(6))</text>

  <!-- arrows to row 2 -->
  <path d="M 260 100 C 200 120, 160 130, 150 146" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 340 100 C 400 120, 440 130, 450 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="188" y="128" font-size="9" fill="#446688" font-weight="bold">左</text>
  <text x="402" y="128" font-size="9" fill="#4a7a3a" font-weight="bold">右</text>

  <!-- ===== Row 2: left=2(4), right=3(5)(6) ===== -->
  <rect x="40" y="150" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="#333">输入: "2(4)"</text>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">rootVal=2 → 拆出 (4)，无右</text>

  <rect x="380" y="150" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="475" y="168" text-anchor="middle" font-size="11" fill="#333">输入: "3(5)(6)"</text>
  <text x="475" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">rootVal=3 → 拆出 (5) 与 (6)</text>

  <!-- arrows to row 3 -->
  <path d="M 130 194 L 100 226" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="100" y="216" font-size="9" fill="#446688" font-weight="bold">左</text>

  <path d="M 440 194 L 380 226" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 510 194 L 540 226" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="216" font-size="9" fill="#446688" font-weight="bold">左</text>
  <text x="530" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">右</text>

  <!-- ===== Row 3: leaves 4, 5, 6 ===== -->
  <rect x="50" y="230" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="11" fill="#333">输入: "4"</text>
  <text x="100" y="266" text-anchor="middle" font-size="11" fill="#666">无 '(' → 叶节点</text>

  <rect x="330" y="230" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="380" y="248" text-anchor="middle" font-size="11" fill="#333">输入: "5"</text>
  <text x="380" y="266" text-anchor="middle" font-size="11" fill="#666">无 '(' → 叶节点</text>

  <rect x="490" y="230" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="540" y="248" text-anchor="middle" font-size="11" fill="#333">输入: "6"</text>
  <text x="540" y="266" text-anchor="middle" font-size="11" fill="#666">无 '(' → 叶节点</text>

  <!-- ===== Bottom: resulting tree ===== -->
  <line x1="20" y1="294" x2="580" y2="294" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">回溯挂接 → 最终二叉树</text>

  <!-- root 1 -->
  <circle cx="300" cy="346" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="351" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <line x1="290" y1="358" x2="240" y2="382" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="232" cy="390" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="394" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <line x1="248" y1="392" x2="218" y2="392" stroke="#446688" stroke-width="1" stroke-dasharray="2,2" fill="none" filter="url(#rough2)"/>

  <line x1="310" y1="358" x2="360" y2="382" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="368" cy="390" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="394" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
</svg>
