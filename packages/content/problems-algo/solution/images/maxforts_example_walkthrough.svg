<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：forts = [1,0,0,−1,0,0,0,0,1]（示例 1）→ ans = 4</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">每行 prev / zeros 为「进入该位置时」的状态，动作给出转移</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="470" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="54" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="104" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">forts[i]</text>
  <text x="155" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">prev</text>
  <text x="204" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">zeros</text>
  <text x="333" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>
  <text x="469" y="71" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- 列分隔线 -->
  <g filter="url(#rough2)">
    <path d="M 78 56 L 78 324" stroke="#446688" stroke-width="1"/>
    <path d="M 130 56 L 130 324" stroke="#446688" stroke-width="1"/>
    <path d="M 180 56 L 180 324" stroke="#446688" stroke-width="1"/>
    <path d="M 228 56 L 228 324" stroke="#446688" stroke-width="1"/>
    <path d="M 438 56 L 438 324" stroke="#446688" stroke-width="1"/>
    <path d="M 30 324 L 500 324" stroke="#446688" stroke-width="1.3"/>
  </g>

  <!-- 行底色 -->
  <g filter="url(#rough2)">
    <rect x="30" y="78" width="470" height="22" fill="#ffffff"/>
    <rect x="30" y="100" width="470" height="22" fill="#fafafa"/>
    <rect x="30" y="122" width="470" height="22" fill="#ffffff"/>
    <rect x="30" y="144" width="470" height="22" fill="#fafafa"/>
    <rect x="30" y="166" width="470" height="22" fill="#fce4ec" fill-opacity="0.45"/>
    <rect x="30" y="188" width="470" height="22" fill="#ffffff"/>
    <rect x="30" y="210" width="470" height="22" fill="#fafafa"/>
    <rect x="30" y="232" width="470" height="22" fill="#ffffff"/>
    <rect x="30" y="254" width="470" height="22" fill="#fafafa"/>
    <rect x="30" y="276" width="470" height="22" fill="#fce4ec" fill-opacity="0.55"/>
    <rect x="30" y="298" width="470" height="22" fill="#e6f4ea" fill-opacity="0.5"/>
  </g>

  <!-- 初始行 -->
  <text x="54" y="93" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="104" y="93" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="155" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="204" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="244" y="93" font-size="10.5" fill="#888">起始状态</text>
  <text x="469" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=0 -->
  <text x="54" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="104" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="155" y="115" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="204" y="115" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="244" y="115" font-size="10.5" fill="#333">prev=0 首现：prev←1</text>
  <text x="469" y="115" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=1 -->
  <text x="54" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="104" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="204" y="137" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="244" y="137" font-size="10.5" fill="#333">zeros←1</text>
  <text x="469" y="137" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=2 -->
  <text x="54" y="159" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="104" y="159" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="159" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="204" y="159" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="244" y="159" font-size="10.5" fill="#333">zeros←2</text>
  <text x="469" y="159" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=3 (update) -->
  <text x="54" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="104" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="155" y="181" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="204" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="244" y="181" font-size="10.5" fill="#b85450" font-weight="bold">异号 → ans←max(0,2)=2；prev←−1</text>
  <text x="469" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- i=4 -->
  <text x="54" y="203" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="104" y="203" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="203" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="204" y="203" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="244" y="203" font-size="10.5" fill="#333">zeros←1</text>
  <text x="469" y="203" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- i=5 -->
  <text x="54" y="225" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="104" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="225" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="204" y="225" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="244" y="225" font-size="10.5" fill="#333">zeros←2</text>
  <text x="469" y="225" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- i=6 -->
  <text x="54" y="247" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="104" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="247" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="204" y="247" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="244" y="247" font-size="10.5" fill="#333">zeros←3</text>
  <text x="469" y="247" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- i=7 -->
  <text x="54" y="269" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="104" y="269" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="155" y="269" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="204" y="269" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="244" y="269" font-size="10.5" fill="#333">zeros←4</text>
  <text x="469" y="269" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- i=8 (update) -->
  <text x="54" y="291" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="104" y="291" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="155" y="291" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="204" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="244" y="291" font-size="10.5" fill="#b85450" font-weight="bold">异号 → ans←max(2,4)=4；prev←1</text>
  <text x="469" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <!-- 结束行 -->
  <text x="54" y="313" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结束</text>
  <text x="104" y="313" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="155" y="313" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="204" y="313" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="244" y="313" font-size="10.5" fill="#4a7a3a" font-weight="bold">遍历结束，return 4</text>
  <text x="469" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- 底部说明 -->
  <rect x="30" y="336" width="470" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#888">两次结算（i=3 得 2、i=8 得 4）取最大 → 答案 4</text>
</svg>
