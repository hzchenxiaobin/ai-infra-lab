<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：[0,2,−5,5,10,−10]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">红色 = 负数节点（头插到表头）；蓝色 = 非负（原地保留）</text>

  <!-- ===== Row 1: initial ===== -->
  <text x="22" y="78" font-size="10.5" fill="#666" font-weight="bold">初始</text>
  <rect x="70" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="94" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="126" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <rect x="182" y="60" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="206" y="83" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−5</text>
  <rect x="238" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="262" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
  <rect x="294" y="60" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="318" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">10</text>
  <rect x="350" y="60" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="374" y="83" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−10</text>

  <path d="M118 77 L124 77" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M174 77 L180 77" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M230 77 L236 77" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M286 77 L292 77" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M342 77 L348 77" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="430" y="78" font-size="10" fill="#888">prev=0→curr=2</text>

  <!-- transition arrow -->
  <path d="M206 100 L206 132" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="120" font-size="9.5" fill="#b85450">curr=−5 &lt; 0，头插</text>

  <!-- ===== Row 2: after inserting -5 ===== -->
  <text x="22" y="158" font-size="10.5" fill="#666" font-weight="bold">第1步</text>
  <rect x="70" y="140" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="94" y="163" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−5</text>
  <rect x="126" y="140" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="182" y="140" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="206" y="163" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <rect x="238" y="140" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="262" y="163" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
  <rect x="294" y="140" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="318" y="163" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">10</text>
  <rect x="350" y="140" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="374" y="163" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−10</text>

  <path d="M118 157 L124 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M174 157 L180 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M230 157 L236 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M286 157 L292 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M342 157 L348 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="430" y="158" font-size="10" fill="#888">head=−5</text>
  <text x="430" y="172" font-size="10" fill="#888">prev=2→curr=5</text>

  <!-- transition arrow -->
  <path d="M374 180 L374 212" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="200" font-size="9.5" fill="#b85450">跳过 5、10（≥0），curr=−10 &lt; 0，头插</text>

  <!-- ===== Row 3: after inserting -10 ===== -->
  <text x="22" y="238" font-size="10.5" fill="#666" font-weight="bold">第2步</text>
  <rect x="70" y="220" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="94" y="243" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−10</text>
  <rect x="126" y="220" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="243" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−5</text>
  <rect x="182" y="220" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="206" y="243" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="238" y="220" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="262" y="243" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <rect x="294" y="220" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="318" y="243" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
  <rect x="350" y="220" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="374" y="243" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">10</text>

  <path d="M118 237 L124 237" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M174 237 L180 237" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M230 237 L236 237" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M286 237 L292 237" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M342 237 L348 237" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="430" y="238" font-size="10" fill="#888">curr=∅ 结束</text>

  <!-- result box -->
  <rect x="60" y="282" width="400" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：−10 → −5 → 0 → 2 → 5 → 10  ✓ 升序</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#555">两次头插把负数逆序搬到表头；非负段 0,2,5,10 自始至终未动。</text>
</svg>
