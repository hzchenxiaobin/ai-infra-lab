<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">关键优化：固定最低未用位，避免按不同顺序重复枚举同一配对方案</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">任意一种完整配对里，最低未用位 i 总要被配掉 → 只枚举 (i, j) 即可覆盖全部方案</text>

  <rect x="60" y="60" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="85" text-anchor="middle" font-size="12" fill="#333">当前状态 mask = 0000，nums = [3, 4, 6, 8]，op = 1</text>

  <path d="M 270 102 L 270 118" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,120 380,160 270,200 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#333">找最低未用位 i</text>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#333">→ i = 0（值 3）</text>

  <path d="M 160 160 L 90 160 L 90 210" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 200 L 270 210" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 160 L 450 160 L 450 210" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="110" y="152" font-size="10" fill="#446688" font-weight="bold">配 j=1</text>
  <text x="278" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">配 j=2</text>
  <text x="410" y="152" font-size="10" fill="#446688" font-weight="bold">配 j=3</text>

  <rect x="20" y="212" width="140" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0 配 j=1</text>
  <text x="90" y="252" text-anchor="middle" font-size="10" fill="#555">gcd(3, 4) = 1</text>
  <text x="90" y="270" text-anchor="middle" font-size="10" fill="#555">得分 1×1 = 1</text>
  <text x="90" y="290" text-anchor="middle" font-size="10" fill="#446688">→ mask = 0011</text>
  <text x="90" y="312" text-anchor="middle" font-size="9" fill="#888">剩余 {6, 8} 待配</text>

  <rect x="200" y="212" width="140" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0 配 j=2</text>
  <text x="270" y="252" text-anchor="middle" font-size="10" fill="#555">gcd(3, 6) = 3</text>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#555">得分 1×3 = 3</text>
  <text x="270" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">→ mask = 0101</text>
  <text x="270" y="312" text-anchor="middle" font-size="9" fill="#888">剩余 {4, 8} 待配</text>

  <rect x="380" y="212" width="140" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0 配 j=3</text>
  <text x="450" y="252" text-anchor="middle" font-size="10" fill="#555">gcd(3, 8) = 1</text>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#555">得分 1×1 = 1</text>
  <text x="450" y="290" text-anchor="middle" font-size="10" fill="#446688">→ mask = 1001</text>
  <text x="450" y="312" text-anchor="middle" font-size="9" fill="#888">剩余 {4, 6} 待配</text>

  <path d="M 90 334 L 90 354 L 270 354" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 334 L 270 354" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 334 L 450 354 L 270 354" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 354 L 270 372" stroke="#666" stroke-width="1.3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="374" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#333">取三者最大：dp[mask] = max(1+dp[0011], 3+dp[0101], 1+dp[1001])</text>

  <rect x="40" y="420" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="270" y="440" text-anchor="middle" font-size="10" fill="#555">每状态只枚举 O(m) 个伙伴 → 总复杂度 O(m · 2^m)，m = 2n ≤ 14</text>
</svg>
