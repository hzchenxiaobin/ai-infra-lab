<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 nums，按当前值 v 触发对应转移</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步「不取 v」+「取 v」两选择相加 → 公式统一为 f_v = 2·f_v + f_(v−1)，其中 f_(−1)=1</text>

  <!-- 起点：遍历 nums -->
  <rect x="250" y="70" width="140" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">for v in nums</text>

  <!-- 判定菱形 -->
  <polygon points="320,130 400,175 320,220 240,175" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">v = ?</text>
  <text x="320" y="190" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个值只触发一条</text>

  <!-- 三条分支线 -->
  <path d="M 240 175 L 130 175 L 130 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="168" font-size="11" fill="#446688" filter="url(#rough2)">v=0</text>
  <path d="M 320 220 L 320 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="236" font-size="11" fill="#4a7a3a" filter="url(#rough2)">v=1</text>
  <path d="M 400 175 L 510 175 L 510 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="168" font-size="11" fill="#d6a040" filter="url(#rough2)">v=2</text>

  <!-- 三个转移框 -->
  <rect x="50" y="245" width="160" height="95" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">更新 f₀</text>
  <text x="130" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f₀ = 2·f₀ + 1</text>
  <text x="130" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不取 + 接旧0⁺ + 新开</text>

  <rect x="240" y="245" width="160" height="95" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">更新 f₁</text>
  <text x="320" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f₁ = 2·f₁ + f₀</text>
  <text x="320" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不取 + 接旧0⁺1⁺ + f₀升级</text>

  <rect x="430" y="245" width="160" height="95" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">更新 f₂</text>
  <text x="510" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f₂ = 2·f₂ + f₁</text>
  <text x="510" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不取 + 接旧0⁺1⁺2⁺ + f₁升级</text>

  <!-- 汇合回循环 -->
  <path d="M 130 340 L 130 370 L 510 370 L 510 340" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 320 340 L 320 370" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 320 370 L 320 392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取模提示 -->
  <rect x="200" y="392" width="240" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">每步立即 % (10⁹+7)</text>

  <!-- 返回 -->
  <path d="M 320 426 L 320 440" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <text x="380" y="436" font-size="11" fill="#888" filter="url(#rough2)">遍历结束 → 返回 f₂</text>

  <!-- 关键提示框 -->
  <rect x="40" y="395" width="150" height="50" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="115" y="414" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">无串扰：每步</text>
  <text x="115" y="430" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">只动一个计数器</text>

  <rect x="450" y="395" width="150" height="50" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="525" y="414" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">f₀/f₁/f₂ 用旧值</text>
  <text x="525" y="430" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">喂养下一阶段</text>
</svg>
