<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">一趟扫描：逐字符乘加</text>

  <!-- 开始 -->
  <rect x="170" y="36" width="180" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：读入 s</text>
  <path d="M 260 66 L 260 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="84" width="180" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，i = 1</text>
  <path d="M 260 114 L 260 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 260 132 L 336 164 L 260 196 L 184 164 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i ≤ n ?</text>

  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 196 L 260 214" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 核心一步 -->
  <rect x="130" y="216" width="260" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">ans += ('z' − s[i−1] + 1) × i</text>
  <path d="M 260 252 L 260 268" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 自增 -->
  <rect x="130" y="270" width="260" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = i + 1</text>

  <!-- 循环回路 -->
  <path d="M 390 284 L 466 284 L 466 164 L 344 164" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">继续循环</text>

  <!-- 否 → 返回 -->
  <text x="176" y="156" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 184 164 L 76 164 L 76 330 L 102 330" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="312" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="333" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 示例注释 -->
  <rect x="352" y="44" width="152" height="86" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="428" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">例：s = "zaza"</text>
  <text x="428" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1×1 + 26×2 + 1×3</text>
  <text x="428" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+ 26×4 = 160</text>
</svg>
