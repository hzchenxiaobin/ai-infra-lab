<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">三步：预处理相邻对 LCP → 前后缀最大值 → 逐 i 三项取 max</text>

  <!-- 开始 -->
  <rect x="203" y="36" width="84" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="55" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 245 64 L 245 78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="60" y="82" width="370" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="103" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① lcp[j] ← LCP(w[j], w[j+1])，j = 0..n−2</text>
  <path d="M 245 114 L 245 128" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="48" y="132" width="394" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="153" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② pre[k] = max(lcp[0..k])，suf[k] = max(lcp[k..n−2])，i ← 0</text>
  <path d="M 245 164 L 245 178" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="245,182 360,222 245,262 130,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 360 222 L 414 222" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="214" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="418" y="204" width="90" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="227" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 三项取最大 -->
  <path d="M 245 262 L 245 278" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="274" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="42" y="282" width="406" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">③ 三项取最大（缺项记 0）</text>
  <text x="245" y="322" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">左 pre[i−2] ｜ 中 LCP(w[i−1], w[i+1]) ｜ 右 suf[i+1]</text>
  <path d="M 245 334 L 245 348" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="192" y="352" width="106" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="371" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回环 -->
  <path d="M 245 380 L 245 404 L 60 404 L 60 222 L 126 222" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- 说明 -->
  <rect x="318" y="352" width="190" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="413" y="372" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">中项总代价 ≤ Σ|words|：</text>
  <text x="413" y="388" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">每个串至多当两次邻居，</text>
  <text x="413" y="403" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">且每次只数 min 侧长度</text>
</svg>
