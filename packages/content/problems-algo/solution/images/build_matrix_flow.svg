<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次拓扑排序 + 按 (rowPos, colPos) 填矩阵</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">开始: 读入 k, rowConditions, colConditions</text>
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step1: build row graph -->
  <rect x="150" y="96" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="12" fill="#333">① 建行图：[above,below] → 边 above→below</text>
  <path d="M 280 130 L 280 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Kahn row -->
  <rect x="150" y="152" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="12" fill="#333">Kahn 拓扑排序 → 出队序记 rowPos</text>
  <path d="M 280 186 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision row: count==k? -->
  <polygon points="280,208 372,244 280,280 188,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="12" fill="#333">行序剥完</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">count==k ?</text>

  <!-- no -> empty -->
  <path d="M 188 244 L 96 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="237" text-anchor="middle" font-size="11" fill="#b85450">否(有环)</text>
  <ellipse cx="60" cy="244" rx="42" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="248" text-anchor="middle" font-size="11" fill="#333">返回 []</text>

  <!-- yes -> step2 -->
  <path d="M 280 280 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="294" font-size="11" fill="#82b366">是</text>

  <!-- Step2: build col graph -->
  <rect x="150" y="302" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#333">② 建列图：[left,right] → 边 left→right；Kahn → colPos</text>
  <path d="M 280 332 L 280 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision col -->
  <polygon points="280,350 358,378 280,406 202,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#333">列序剥完? 否→返回[]</text>

  <!-- yes -> fill matrix (right) -->
  <path d="M 358 378 L 430 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="371" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="432" y="362" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="382" text-anchor="middle" font-size="11" fill="#333">填矩阵后返回</text>
  <text x="492" y="394" text-anchor="middle" font-size="10" fill="#888">M[rowPos[n]][colPos[n]]=n</text>
</svg>
