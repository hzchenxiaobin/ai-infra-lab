<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 逐队长二分计数，O(n log n)</text>

  <!-- 主流程 -->
  <g filter="url(#rough2)">
    <rect x="70" y="40" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="58" text-anchor="middle" font-size="11" fill="#33506b">① 复制两组端点</text>
    <text x="180" y="74" text-anchor="middle" font-size="10" fill="#33506b">各自排序得 S、E　O(n log n)</text>

    <path d="M180 84 L180 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="96" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="116" text-anchor="middle" font-size="11" fill="#33506b">② 枚举队长 i = 0, 1, …, n−1</text>

    <path d="M180 128 L180 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="140" width="220" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="180" y="158" text-anchor="middle" font-size="11" fill="#2f5d24">③ r = upper_bound(S, e_i)</text>
    <text x="180" y="174" text-anchor="middle" font-size="10" fill="#2f5d24">数出 s_j ≤ e_i 的员工数</text>

    <path d="M180 184 L180 196" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="196" width="220" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="180" y="214" text-anchor="middle" font-size="11" fill="#2f5d24">④ l = lower_bound(E, s_i)</text>
    <text x="180" y="230" text-anchor="middle" font-size="10" fill="#2f5d24">数出 e_j &lt; s_i 的员工数</text>

    <path d="M180 240 L180 252" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="252" width="220" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="180" y="272" text-anchor="middle" font-size="11" fill="#8a6d1a">⑤ ans = max(ans, r − l)</text>

    <path d="M180 284 L180 304" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="118,340 180,314 242,340 180,366" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="180" y="344" text-anchor="middle" font-size="10" fill="#8a3030">枚举完所有队长？</text>

    <text x="271" y="332" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M242 340 L300 340" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="300" y="322" width="212" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="406" y="344" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">返回 ans（≥ 1：队长自身恒计入）</text>

    <text x="112" y="332" text-anchor="end" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M118 340 L52 340 L52 162 L70 162" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="85" y="358" text-anchor="middle" font-size="9.5" fill="#8a3030">i ← i + 1</text>
  </g>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)">
    <rect x="310" y="40" width="226" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="423" y="58" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">upper_bound(S, x)：首个 &gt; x 的位置</text>
    <text x="423" y="74" text-anchor="middle" font-size="10" fill="#33506b">→ 恰好数出 ≤ x 的个数（含等号）</text>
    <text x="423" y="90" text-anchor="middle" font-size="10" fill="#33506b">＝「队长收工前已开工」的人数</text>

    <rect x="310" y="108" width="226" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="423" y="126" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">lower_bound(E, x)：首个 ≥ x 的位置</text>
    <text x="423" y="142" text-anchor="middle" font-size="10" fill="#2f5d24">→ 恰好数出 &lt; x 的个数</text>
    <text x="423" y="158" text-anchor="middle" font-size="10" fill="#2f5d24">＝「队长开工前已收工」的人数</text>
    <text x="423" y="174" text-anchor="middle" font-size="10" fill="#2f5d24">（等于保留 ⇒ 端点相接算重叠）</text>

    <rect x="310" y="190" width="226" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="423" y="208" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">队长自身 j = i 恒满足两条件</text>
    <text x="423" y="224" text-anchor="middle" font-size="10" fill="#8a6d1a">→ 每趟计数 ≥ 1，ans ≥ 1</text>
    <text x="423" y="240" text-anchor="middle" font-size="10" fill="#8a6d1a">S、E 排序打乱配对无妨：</text>
    <text x="423" y="256" text-anchor="middle" font-size="10" fill="#8a6d1a">两个条件各只看一维端点值</text>

    <rect x="310" y="272" width="226" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="423" y="288" text-anchor="middle" font-size="10" fill="#8a3030">时间 O(n log n)：排序主导</text>
    <text x="423" y="303" text-anchor="middle" font-size="10" fill="#8a3030">空间 O(n)：两个排序副本</text>
    <text x="423" y="318" text-anchor="middle" font-size="10" fill="#8a3030">值域小 → 桶 + 前缀和 O(n+V)</text>
  </g>
</svg>
