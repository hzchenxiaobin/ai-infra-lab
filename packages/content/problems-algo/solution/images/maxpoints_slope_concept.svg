<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">固定点 i，按斜率分组其他点</text>

  <!-- Coordinate plane -->
  <line x1="80" y1="260" x2="420" y2="260" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="300" x2="120" y2="80" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="264" font-size="10" fill="#888">x</text>
  <text x="116" y="76" font-size="10" fill="#888">y</text>

  <!-- Line y=x (slope 1/1) through points -->
  <line x1="140" y1="240" x2="260" y2="120" stroke="#446688" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="265" y="115" font-size="10" fill="#446688" font-weight="bold">slope (1,1)</text>

  <!-- Line slope 0/1 (horizontal) -->
  <line x1="140" y1="220" x2="380" y2="220" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="385" y="215" font-size="10" fill="#4a7a3a" font-weight="bold">slope (0,1)</text>

  <!-- Line slope 1/0 (vertical) -->
  <line x1="200" y1="280" x2="200" y2="100" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="205" y="96" font-size="10" fill="#d6a040" font-weight="bold">slope (1,0)</text>

  <!-- Points -->
  <!-- Fixed point i (highlighted) -->
  <circle cx="160" cy="220" r="6" fill="#b85450" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="238" font-size="11" fill="#b85450" font-weight="bold">i</text>

  <!-- Points on slope (1,1) line -->
  <circle cx="200" cy="180" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="240" cy="140" r="5" fill="#446688" filter="url(#rough2)"/>

  <!-- Points on slope (0,1) horizontal -->
  <circle cx="260" cy="220" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="320" cy="220" r="5" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- Points on slope (1,0) vertical -->
  <circle cx="200" cy="160" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="200" cy="120" r="5" fill="#d6a040" filter="url(#rough2)"/>

  <!-- Hash table visualization -->
  <text x="440" y="100" font-size="11" fill="#555" font-weight="bold">slope_count</text>
  <rect x="440" y="110" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="455" y="128" font-size="10" fill="#446688" font-weight="bold">(1,1): 2</text>
  <rect x="440" y="142" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="455" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">(0,1): 2</text>
  <rect x="440" y="174" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="455" y="192" font-size="10" fill="#d6a040" font-weight="bold">(1,0): 2</text>

  <!-- Arrows from points to hash table -->
  <path d="M 250 140 Q 350 120 440 124" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 220 Q 390 200 440 156" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 120 Q 340 130 440 188" stroke="#d6a040" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="40" y="310" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="11" fill="#333" font-weight="bold">最大斜率组有 2 个点 + 点 i 自身 = 3 个共线点</text>
  <text x="60" y="348" font-size="10" fill="#888">同斜率的点必在同一直线上（经过点 i），用哈希表 O(1) 统计每种斜率</text>
</svg>
