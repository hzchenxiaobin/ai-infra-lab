<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描，正差才累加</text>

  <!-- 开始 -->
  <rect x="255" y="30" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="46" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">开始</text>
  <path d="M 300 54 L 300 64" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="215" y="66" width="170" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="83" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">d ← dates[0]</text>
  <text x="300" y="100" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">total ← 0（加法幺元）</text>
  <path d="M 300 110 L 300 118" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 初始化 -->
  <rect x="255" y="120" width="90" height="24" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">i ← 1</text>
  <path d="M 300 144 L 300 152" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <polygon points="300,154 382,182 300,210 218,182" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="187" text-anchor="middle" font-size="12" fill="#d6a040"
        filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否：返回 -->
  <path d="M 382 182 L 410 182" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="393" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">否</text>
  <rect x="412" y="166" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="458" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">返回 total</text>

  <!-- 是：算差 -->
  <path d="M 300 210 L 300 224" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="221" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="222" y="226" width="156" height="26" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="243" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">diff ← dates[i] − d</text>
  <path d="M 300 252 L 300 262" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 diff > 0 -->
  <polygon points="300,264 378,292 300,320 222,292" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="297" text-anchor="middle" font-size="12" fill="#d6a040"
        filter="url(#rough2)">diff &gt; 0 ?</text>

  <!-- 是：累加 -->
  <path d="M 378 292 L 400 292" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="284" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">是</text>
  <rect x="402" y="278" width="108" height="28" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="456" y="296" text-anchor="middle" font-size="12" fill="#b85450"
        font-weight="bold" filter="url(#rough2)">total += diff</text>

  <!-- 否：跳过；回环 -->
  <path d="M 222 292 L 130 292" stroke="#446688" stroke-width="1.5" fill="none"
        filter="url(#rough2)"/>
  <text x="182" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">否</text>
  <path d="M 456 306 L 456 336 L 130 336 L 130 186 L 214 186" stroke="#446688"
        stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="330" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">i ← i + 1（回到循环判断）</text>

  <!-- 边界注释 -->
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">⚠️ n = 1（只有应还日没借书）⇒ 循环不进入，直接返回 0</text>
</svg>
