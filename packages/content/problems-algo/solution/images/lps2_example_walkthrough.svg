<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "bbabab" → 答案 "baab"，长度 4</text>

  <!-- ===== String row ===== -->
  <text x="290" y="56" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">原串（下标 0–5）</text>
  <!-- 6 boxes w=44, start x=170 -->
  <rect x="170" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="214" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="258" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="302" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="346" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="390" y="66" width="44" height="40" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <!-- index labels -->
  <text x="192" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="236" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="280" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="324" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="368" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="412" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>

  <!-- ===== Step 1: pair b(0,5) ===== -->
  <text x="60" y="158" font-size="11.5" fill="#446688" font-weight="bold">① dfs(0,5,26)</text>
  <text x="60" y="174" font-size="10.5" fill="#666">s[0]=b=s[5]=b，b≠26 → 配对外层 b</text>
  <!-- highlight pair1 boxes -->
  <rect x="170" y="144" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="170" text-anchor="middle" font-size="16" fill="#335" font-weight="bold">b</text>
  <rect x="390" y="144" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="170" text-anchor="middle" font-size="16" fill="#335" font-weight="bold">b</text>
  <!-- grayed middle boxes for this step -->
  <rect x="214" y="144" width="44" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="170" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="258" y="144" width="44" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <rect x="302" y="144" width="44" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="170" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <rect x="346" y="144" width="44" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="170" text-anchor="middle" font-size="14" fill="#bbb">a</text>
  <!-- pair1 arc -->
  <path d="M 192 140 C 192 132, 412 132, 412 140" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="302" y="202" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">→ 递归内部 dfs(1,4,b) + 2</text>

  <!-- ===== Step 2: dfs(1,4,b): s[1]=b,s[4]=a 不等 → 舍弃一端 ===== -->
  <text x="60" y="232" font-size="11.5" fill="#a87020" font-weight="bold">② dfs(1,4,b)</text>
  <text x="60" y="248" font-size="10.5" fill="#666">s[1]=b ≠ s[4]=a → max(dfs(2,4,b), dfs(1,3,b))</text>
  <text x="60" y="262" font-size="10.5" fill="#666">dfs(1,3,b)：s[1]=b=s[3]=b 但 b==x → 不能配对 → 0</text>
  <text x="60" y="276" font-size="10.5" fill="#4a7a3a" font-weight="bold">取 dfs(2,4,b)</text>

  <!-- ===== Step 3: pair a(2,4) ===== -->
  <text x="60" y="306" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ dfs(2,4,b)</text>
  <text x="60" y="322" font-size="10.5" fill="#666">s[2]=a=s[4]=a，a≠b → 配对 a</text>
  <!-- show boxes 2 and 4 highlighted green -->
  <rect x="258" y="292" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="16" fill="#2a4a1a" font-weight="bold">a</text>
  <rect x="346" y="292" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="318" text-anchor="middle" font-size="16" fill="#2a4a1a" font-weight="bold">a</text>
  <!-- skipped box 3 -->
  <rect x="302" y="292" width="44" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="318" text-anchor="middle" font-size="14" fill="#bbb">b</text>
  <!-- pair2 arc -->
  <path d="M 280 288 C 280 278, 368 278, 368 288" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="324" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">内部 dfs(3,3,a)=0 → 返回 0+2 = 2</text>

  <!-- ===== Result ===== -->
  <path d="M 290 360 L 290 380" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="120" y="386" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="405" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">回溯拼装：b + (a a) + b = "baab"</text>
  <text x="290" y="421" text-anchor="middle" font-size="11" fill="#888">外层 b 与内层 a 相邻 → b≠a ✓ ｜ 中间 a=a ✓</text>

  <!-- bottom note -->
  <rect x="40" y="434" width="500" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="448" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">关键：每次配对把「所用字符」作为约束 x 传入内部，强制相邻配对字符不同</text>
</svg>
