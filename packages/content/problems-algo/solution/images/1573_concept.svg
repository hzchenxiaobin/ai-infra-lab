<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：1 的总数均分三份，切割范围在相邻组的 1 之间</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">s = "10101"，1 的总数 m=3，每组 k=1 个 1</text>

  <!-- ===== 字符串格子 ===== -->
  <g font-size="13">
    <!-- part1 蓝 -->
    <rect x="60" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- 中间可切割区 橙 -->
    <rect x="108" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="84" text-anchor="middle" fill="#333">0</text>
    <rect x="156" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- part2 绿 -->
    <rect x="204" y="62" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="84" text-anchor="middle" fill="#333">0</text>
    <!-- 中间可切割区 橙 -->
    <rect x="252" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="84" text-anchor="middle" fill="#333">0</text>
    <rect x="300" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="322" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- part3 蓝 -->
    <rect x="348" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="370" y="84" text-anchor="middle" fill="#333">0</text>
    <rect x="396" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="418" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- 位置标号 -->
  <g font-size="10" fill="#888">
    <text x="82" y="110" text-anchor="middle">0</text>
    <text x="130" y="110" text-anchor="middle">1</text>
    <text x="178" y="110" text-anchor="middle">2</text>
    <text x="226" y="110" text-anchor="middle">3</text>
    <text x="274" y="110" text-anchor="middle">4</text>
  </g>

  <!-- ===== 第一刀切割范围 ===== -->
  <text x="40" y="140" font-size="11" fill="#d6a040" font-weight="bold">第一刀 i：</text>
  <rect x="108" y="126" width="92" height="20" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="154" y="140" text-anchor="middle" font-size="10" fill="#d6a040">在 p[0] 与 p[1] 之间</text>

  <g font-size="11">
    <rect x="108" y="156" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="174" text-anchor="middle" fill="#333">i=1</text>
    <rect x="156" y="156" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="178" y="174" text-anchor="middle" fill="#333">i=2</text>
    <text x="210" y="174" font-size="11" fill="#d6a040" font-weight="bold">→ 2 种</text>
  </g>

  <!-- ===== 第二刀切割范围 ===== -->
  <text x="40" y="210" font-size="11" fill="#d6a040" font-weight="bold">第二刀 j：</text>
  <rect x="252" y="196" width="92" height="20" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="298" y="210" text-anchor="middle" font-size="10" fill="#d6a040">在 p[1] 与 p[2] 之间</text>

  <g font-size="11">
    <rect x="252" y="226" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="274" y="244" text-anchor="middle" fill="#333">j=3</text>
    <rect x="300" y="226" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="322" y="244" text-anchor="middle" fill="#333">j=4</text>
    <text x="354" y="244" font-size="11" fill="#d6a040" font-weight="bold">→ 2 种</text>
  </g>

  <!-- ===== 乘法原理 ===== -->
  <rect x="60" y="276" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">方案数 = (p[k] − p[k−1]) × (p[2k] − p[2k−1])</text>
  <text x="290" y="318" text-anchor="middle" font-size="12" fill="#333">= (2 − 0) × (4 − 2) = 2 × 2 = 4</text>

  <!-- ===== 三组分色说明 ===== -->
  <g font-size="11">
    <rect x="60" y="344" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="120" y="362" text-anchor="middle" fill="#446688">第 1 组：前 k 个 1</text>

    <rect x="200" y="344" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="260" y="362" text-anchor="middle" fill="#4a7a3a">第 2 组：中 k 个 1</text>

    <rect x="340" y="344" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="410" y="362" text-anchor="middle" fill="#d6a040">橙色区：可切割范围</text>
  </g>

  <!-- ===== 全 0 特例提示 ===== -->
  <rect x="60" y="384" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#b85450">⚠ 全 0 串特例：任意切割都合法 → C(n−1, 2) = (n−1)(n−2)/2</text>
</svg>
