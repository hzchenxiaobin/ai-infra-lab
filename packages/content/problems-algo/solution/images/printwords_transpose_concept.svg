<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    核心观察：单词横向排列 → 左对齐补空格 → 转置读取
  </text>

  <!-- Left: words as rows (left-aligned padded matrix) -->
  <text x="60" y="58" font-size="12" fill="#888" filter="url(#rough2)">单词作行（左对齐补空格）:</text>

  <!-- word TO -->
  <rect x="60" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="90" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>

  <!-- word BE -->
  <rect x="60" y="98" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="90" y="98" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>

  <!-- word OR -->
  <rect x="60" y="128" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="90" y="128" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">R</text>

  <!-- word NOT (longest, 3 chars) -->
  <rect x="60" y="158" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <rect x="90" y="158" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="120" y="158" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- word TO -->
  <rect x="60" y="188" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="90" y="188" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>

  <!-- word BE -->
  <rect x="60" y="218" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="90" y="218" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>

  <!-- column labels on left matrix -->
  <text x="75" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列0</text>
  <text x="105" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列1</text>
  <text x="135" y="264" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">列2</text>

  <!-- transpose arrow -->
  <path d="M 175 148 Q 215 130 255 148" fill="none" stroke="#b85450" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">转置</text>
  <text x="215" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列→行</text>

  <!-- Right: result rows (transposed, trailing spaces trimmed) -->
  <text x="290" y="58" font-size="12" fill="#888" filter="url(#rough2)">转置后每行（去尾空格）:</text>

  <!-- row 0: TBONTB -->
  <rect x="290" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="320" y="68" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="350" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="380" y="68" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <rect x="410" y="68" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="440" y="68" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="486" y="87" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">"TBONTB"</text>

  <!-- row 1: OEROOE -->
  <rect x="290" y="98" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="320" y="98" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="350" y="98" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="380" y="98" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="410" y="98" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="440" y="98" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="486" y="117" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"OEROOE"</text>

  <!-- row 2: "   T" (3 leading spaces + T, trailing trimmed) -->
  <rect x="290" y="128" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="147" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="320" y="128" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="147" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="350" y="128" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="147" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="380" y="128" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="486" y="147" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">"   T"</text>

  <!-- trailing-space trim annotation -->
  <path d="M 418 140 L 470 140" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="444" y="158" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">尾空格已删</text>

  <!-- row label -->
  <text x="270" y="87" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">行0</text>
  <text x="270" y="117" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">行1</text>
  <text x="270" y="147" text-anchor="end" font-size="10" fill="#d6a040" filter="url(#rough2)">行2</text>

  <!-- Core idea box -->
  <rect x="40" y="288" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">本质：字符矩阵的转置（行优先展开后按列读回）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">单词作行、左对齐补空格成矩形 → 逐列读取即为竖直打印</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">输出行数 = 最长单词长度；每行去尾随空格</text>
</svg>
