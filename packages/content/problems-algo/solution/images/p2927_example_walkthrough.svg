<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：n = 5, limit = 2（L = 3）</text>

  <!-- left computation steps -->
  <rect x="25" y="48" width="252" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="66" text-anchor="middle" font-size="12" fill="#333">f(5) = C(7,2) = 21</text>
  <text x="151" y="84" text-anchor="middle" font-size="10" fill="#888">无上限总数</text>
  <path d="M 151 92 L 151 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="106" width="252" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="124" text-anchor="middle" font-size="12" fill="#333">f(5−3) = f(2) = C(4,2) = 6</text>
  <text x="151" y="142" text-anchor="middle" font-size="10" fill="#b85450">恰 1 人超限：− 3 × 6 = −18</text>
  <path d="M 151 150 L 151 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="164" width="252" height="44" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="182" text-anchor="middle" font-size="12" fill="#666">f(5−6) = f(−1) = 0</text>
  <text x="151" y="200" text-anchor="middle" font-size="10" fill="#999">恰 2 人超限：不存在</text>
  <path d="M 151 208 L 151 218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="25" y="222" width="252" height="44" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="240" text-anchor="middle" font-size="12" fill="#666">f(5−9) = f(−4) = 0</text>
  <text x="151" y="258" text-anchor="middle" font-size="10" fill="#999">3 人超限：不存在</text>

  <rect x="25" y="284" width="252" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="151" y="304" text-anchor="middle" font-size="12" fill="#333">ans = 21 − 18 + 0 − 0</text>
  <text x="151" y="324" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">= 3</text>

  <rect x="25" y="348" width="252" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="151" y="371" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">与示例输出 3 一致 ✓</text>

  <!-- right: the 3 solutions -->
  <text x="300" y="58" font-size="12" fill="#555" font-weight="bold">仅有的 3 个合法方案：</text>

  <text x="305" y="100" font-size="11" fill="#446688">(1,2,2)</text>
  <circle cx="370" cy="96" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="382" y="80" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="398" cy="96" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="420" cy="96" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="432" y="80" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="448" cy="96" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="470" cy="96" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="305" y="154" font-size="11" fill="#446688">(2,1,2)</text>
  <circle cx="370" cy="150" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="392" cy="150" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="404" y="134" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="420" cy="150" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="432" y="134" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="448" cy="150" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="470" cy="150" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="305" y="208" font-size="11" fill="#446688">(2,2,1)</text>
  <circle cx="370" cy="204" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="392" cy="204" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="404" y="188" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="420" cy="204" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="442" cy="204" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="454" y="188" width="6" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <circle cx="470" cy="204" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="300" y="262" width="205" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="402" y="286" text-anchor="middle" font-size="11" fill="#333">其余 21 − 3 = 18 个无上限解</text>
  <text x="402" y="304" text-anchor="middle" font-size="11" fill="#b85450">都至少有一人 ≥ 3 颗</text>
  <text x="402" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">被 − 3·f(2) 精确扣掉</text>
</svg>
