<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">地图分析：示例演算（示例 1）</text>
  <path d="M 240 38 Q 440 46 640 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="440" y="58" text-anchor="middle" font-size="11" fill="#888">grid = [[1,0,1],[0,0,0],[1,0,1]] — 4 个陆地(角)同时入队，BFS 逐层扩散</text>

  <!-- ===== Layer 0 ===== -->
  <text x="140" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">第 0 层（dist=0）</text>
  <g font-size="14">
    <g filter="url(#sk)">
      <rect x="80" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="100" y="118" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="120" y="92" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="140" y="118" text-anchor="middle" fill="#bbb">0</text>
      <rect x="160" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="180" y="118" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="80" y="132" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="100" y="158" text-anchor="middle" fill="#bbb">0</text>
      <rect x="120" y="132" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="140" y="158" text-anchor="middle" fill="#bbb">0</text>
      <rect x="160" y="132" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="180" y="158" text-anchor="middle" fill="#bbb">0</text>
      <rect x="80" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="100" y="198" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="120" y="172" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="140" y="198" text-anchor="middle" fill="#bbb">0</text>
      <rect x="160" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="180" y="198" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    </g>
  </g>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#2e6e2e">队列: [(0,0),(0,2),(2,0),(2,2)]</text>

  <!-- arrow -->
  <path d="M 220 152 L 280 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Layer 1 ===== -->
  <text x="360" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb">第 1 层（dist=1）</text>
  <g font-size="14">
    <g filter="url(#sk)">
      <rect x="300" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="320" y="118" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="340" y="92" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/><text x="360" y="118" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
      <rect x="380" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="400" y="118" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="300" y="132" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/><text x="320" y="158" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
      <rect x="340" y="132" width="40" height="40" fill="#fff" stroke="#bbb"/><text x="360" y="158" text-anchor="middle" fill="#bbb">0</text>
      <rect x="380" y="132" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/><text x="400" y="158" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
      <rect x="300" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="320" y="198" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="340" y="172" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/><text x="360" y="198" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
      <rect x="380" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="400" y="198" text-anchor="middle" fill="#2e6e2e">1</text>
    </g>
  </g>
  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#4a8edb">4 个海洋邻居被标记 dist=1</text>

  <!-- arrow -->
  <path d="M 440 152 L 500 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Layer 2 ===== -->
  <text x="580" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">第 2 层（dist=2）</text>
  <g font-size="14">
    <g filter="url(#sk)">
      <rect x="520" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="540" y="118" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="560" y="92" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb"/><text x="580" y="118" text-anchor="middle" fill="#446688">1</text>
      <rect x="600" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="620" y="118" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="520" y="132" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb"/><text x="540" y="158" text-anchor="middle" fill="#446688">1</text>
      <rect x="560" y="132" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/><text x="580" y="158" text-anchor="middle" fill="#b03a3a" font-weight="bold">2</text>
      <rect x="600" y="132" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb"/><text x="620" y="158" text-anchor="middle" fill="#446688">1</text>
      <rect x="520" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="540" y="198" text-anchor="middle" fill="#2e6e2e">1</text>
      <rect x="560" y="172" width="40" height="40" fill="#e8f0fe" stroke="#4a8edb"/><text x="580" y="198" text-anchor="middle" fill="#446688">1</text>
      <rect x="600" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a"/><text x="620" y="198" text-anchor="middle" fill="#2e6e2e">1</text>
    </g>
  </g>
  <text x="580" y="232" text-anchor="middle" font-size="10" fill="#b03a3a">中心格 (1,1) 最后到达 → ans=2</text>

  <!-- arrow to result -->
  <path d="M 660 152 L 720 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Result box ===== -->
  <g filter="url(#sk)">
    <rect x="720" y="100" width="140" height="104" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="790" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">结果</text>
  <g font-size="11" fill="#444">
    <text x="736" y="146">最大距离 = 2</text>
    <text x="736" y="166">位置 = (1,1)</text>
    <text x="736" y="186" fill="#b03a3a" font-weight="bold">BFS 层数 = 2</text>
  </g>

  <!-- ===== Bottom: example 2 summary ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="260" width="800" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="460" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">示例 2：grid = [[1,0,0],[0,0,0],[0,0,0]] — 单源扩散</text>
  <g font-size="11" fill="#444">
    <text x="84" y="310">第 0 层：陆地 (0,0) 入队</text>
    <text x="84" y="328">第 1 层：(0,1) (1,0) → dist=1</text>
    <text x="84" y="346">第 2 层：(0,2) (1,1) (2,0) → dist=2</text>
    <text x="300" y="310">第 3 层：(1,2) (2,1) → dist=3</text>
    <text x="300" y="328">第 4 层：(2,2) → dist=4 ← 最后到达</text>
    <text x="300" y="346" fill="#b03a3a" font-weight="bold">答案 = 4</text>
  </g>
  <text x="540" y="328" font-size="11" fill="#888">仅 1 个陆地 → 退化为单源 BFS</text>
  <text x="540" y="346" font-size="11" fill="#888">最远角 (2,2) 距离 = 2+2 = 4</text>

  <!-- ===== Bottom: comparison table ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="400" width="800" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="460" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">多源 BFS vs 暴力 BFS 对比</text>
  <g font-size="11" fill="#444">
    <text x="84" y="448"><tspan font-weight="bold" fill="#b85450">暴力</tspan>：对每个海洋格做单源 BFS 找最近陆地 → O(n²) 格 × O(n²) BFS = <tspan font-weight="bold" fill="#b03a3a">O(n⁴)</tspan></text>
    <text x="84" y="468"><tspan font-weight="bold" fill="#2e6e2e">多源 BFS</tspan>：所有陆地同时入队 → 一次 BFS 覆盖全网格 → <tspan font-weight="bold" fill="#2e6e2e">O(n²)</tspan></text>
    <text x="84" y="488"><tspan font-weight="bold" fill="#4a8edb">本质</tspan>：多源 BFS = 虚拟超级源点连所有陆地（边权 0）→ 单源 BFS → 每格到最近陆地的最短路</text>
  </g>
</svg>
