  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">LCP</text>
  <text x="360" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">新增</text>

