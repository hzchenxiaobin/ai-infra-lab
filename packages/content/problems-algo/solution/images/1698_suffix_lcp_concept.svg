  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">橙色 = 与上一后缀的公共前缀（LCP），即已被计过的重复子串</text>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold" filter="url(#rough2)">Σ LCP = 1 + 1 + 2 + 0 + 2 + 1 = 7</text>
  <text x="280" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">不同子串 = 28 − 7 = 21 ✓</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个后缀贡献 (n − sa[i]) − LCP[i] 个全新子串</text>
