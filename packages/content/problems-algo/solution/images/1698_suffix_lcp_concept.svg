  <rect x="460" y="56" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="478" y="66" font-size="9.5" fill="#888" filter="url(#rough2)">新增</text>

