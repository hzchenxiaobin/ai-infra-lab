<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP 状态转移：填表顺序与依赖</text>

  <!-- Fill order note -->
  <rect x="30" y="40" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#555">填表顺序：i 从 n−1 → 0（从右到左），j 从 i → n−1（从左到右）</text>

  <!-- dp[i][j] central cell -->
  <rect x="230" y="92" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[i][j]</text>

  <!-- Decision diamond -->
  <polygon points="280,150 340,180 280,210 220,180" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[i]==s[j]?</text>

  <!-- arrow down to diamond -->
  <path d="M 280 132 L 280 148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- YES branch (left) -->
  <path d="M 220 180 L 130 180 L 130 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- YES box -->
  <rect x="40" y="222" width="180" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i][j] = dp[i+1][j−1] + 2</text>
  <text x="130" y="262" text-anchor="middle" font-size="10" fill="#555">两端 s[i], s[j] 入回文</text>
  <text x="130" y="278" text-anchor="middle" font-size="10" fill="#555">j=i+1 时空区间 = 0</text>
  <text x="130" y="292" text-anchor="middle" font-size="9" fill="#888">（无需特判）</text>

  <!-- cross-boundary update -->
  <path d="M 130 300 L 130 326" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="30" y="330" width="200" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若 i &lt; n1 ≤ j：</text>
  <text x="130" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, dp[i][j])</text>

  <!-- NO branch (right) -->
  <path d="M 340 180 L 430 180 L 430 218" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="172" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <!-- NO box -->
  <rect x="340" y="222" width="180" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i][j] = max(...)</text>
  <text x="430" y="268" text-anchor="middle" font-size="10" fill="#555">dp[i+1][j]</text>
  <text x="430" y="284" text-anchor="middle" font-size="10" fill="#555">dp[i][j−1]</text>

  <!-- no update note -->
  <path d="M 430 300 L 430 326" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="330" width="200" height="48" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="430" y="350" text-anchor="middle" font-size="10" fill="#666">两端非 s[i],s[j]</text>
  <text x="430" y="366" text-anchor="middle" font-size="10" fill="#666">无法判定横跨 → 不更新 ans</text>

  <!-- dependency mini-grid (bottom) -->
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888">依赖：dp[i+1][j−1]（下移+左移）、dp[i+1][j]（下移）、dp[i][j−1]（左移）—— 均在 dp[i][j] 之前算好</text>
</svg>
