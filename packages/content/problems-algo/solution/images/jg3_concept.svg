<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arblue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="argreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">下标 = 节点，i ± arr[i] = 出边</text>
  <path d="M 140 38 Q 280 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#888">arr = [4, 2, 3, 0, 3, 1, 2]，每个格子引出两条有向边</text>

  <!-- index row label -->
  <text x="30" y="108" font-size="11" fill="#888">下标</text>
  <text x="30" y="138" font-size="11" fill="#888">值</text>

  <!-- 7 cells: indices 0..6, cell width 60, start x=70 -->
  <!-- cell 0: val 4 -->
  <g filter="url(#sk)">
    <rect x="70" y="92" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="70" y="122" width="56" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="98" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">0</text>
  <text x="98" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- cell 1: val 2 -->
  <g filter="url(#sk)">
    <rect x="134" y="92" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="134" y="122" width="56" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="162" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">1</text>
  <text x="162" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- cell 2: val 3 -->
  <g filter="url(#sk)">
    <rect x="198" y="92" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="198" y="122" width="56" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="226" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">2</text>
  <text x="226" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- cell 3: val 0 (target!) -->
  <g filter="url(#sk)">
    <rect x="262" y="92" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="262" y="122" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="290" y="111" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="290" y="141" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="290" y="86" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">目标</text>

  <!-- cell 4: val 3 -->
  <g filter="url(#sk)">
    <rect x="326" y="92" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="326" y="122" width="56" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="354" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">4</text>
  <text x="354" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- cell 5: val 1 (start) -->
  <g filter="url(#sk)">
    <rect x="390" y="92" width="56" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="390" y="122" width="56" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="418" y="111" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">5</text>
  <text x="418" y="141" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1</text>
  <text x="418" y="86" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">起点</text>

  <!-- cell 6: val 2 -->
  <g filter="url(#sk)">
    <rect x="454" y="92" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="454" y="122" width="56" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="482" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">6</text>
  <text x="482" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- edges: i+arr[i] (blue, forward) and i-arr[i] (green, backward) -->
  <!-- 0 -> 4 (0+4) -->
  <path d="M 98 150 Q 200 186 354 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <!-- 1 -> 3 (1+2) -->
  <path d="M 162 150 Q 226 174 290 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <!-- 2 -> 5 (2+3) -->
  <path d="M 226 150 Q 322 180 418 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <!-- 4 -> 1 (4-3) -->
  <path d="M 354 150 Q 258 196 162 150" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#argreen)" filter="url(#sk)"/>
  <!-- 5 -> 6 (5+1) -->
  <path d="M 418 150 Q 450 170 482 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <!-- 5 -> 4 (5-1) -->
  <path d="M 418 150 Q 386 170 354 150" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#argreen)" filter="url(#sk)"/>
  <!-- 6 -> 4 (6-2) -->
  <path d="M 482 150 Q 418 198 354 150" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#argreen)" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <line x1="70" y1="226" x2="100" y2="226" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="108" y="230" font-size="11" fill="#2b4b6e">i + arr[i]（向前跳）</text>
  <g filter="url(#sk)">
    <line x1="240" y1="226" x2="270" y2="226" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="278" y="230" font-size="11" fill="#2e6e2e">i − arr[i]（向后跳）</text>

  <!-- right info box -->
  <g filter="url(#sk)">
    <rect x="70" y="256" width="440" height="108" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="290" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">隐式图可达性问题</text>
  <path d="M 110 290 Q 290 296 470 290" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="12" fill="#444">
    <text x="86" y="312">· 节点 = 数组下标，出度 ≤ 2（向前 / 向后）</text>
    <text x="86" y="332">· 问题 = 从 start 能否到达某 arr[j]==0 的节点</text>
    <text x="86" y="352" fill="#b03a3a" font-weight="bold">· BFS / DFS + visited，每点只访问一次 → O(n)</text>
  </g>
</svg>
