<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：模拟游走，维护 (r, c, dir)，撞墙即转向</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每步先记录 mat[r][c]，再按方向与边界决定下一格；共 m×n 步</text>

  <!-- Start -->
  <rect x="180" y="60" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">初始化 r=0, c=0, dir=↗, ans=[]</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,110 380,148 280,186 180,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">ans.size == m×n ?</text>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#8a6a20">已遍历完</text>

  <!-- Yes -> return -->
  <text x="392" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 148 L 440 148" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="442" y="132" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return ans</text>

  <!-- No -> record -->
  <text x="296" y="200" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 186 L 280 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="208" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans.push(mat[r][c])</text>

  <path d="M 280 238 L 280 254" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dir diamond -->
  <polygon points="280,256 360,288 280,320 200,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">dir == ↗ ?</text>

  <!-- ===== Up branch (left) ===== -->
  <text x="188" y="282" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">是↗</text>
  <path d="M 200 288 L 150 288" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="256" width="128" height="160" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough)"/>
  <text x="86" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">↗ 方向判定</text>

  <!-- rule 1: c==n-1 -->
  <rect x="34" y="280" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="294" text-anchor="middle" font-size="9" fill="#2a4a66" font-weight="bold">c == n−1 ?</text>
  <text x="86" y="307" text-anchor="middle" font-size="9" fill="#446688">是→ r++; dir=↙</text>

  <!-- rule 2: r==0 -->
  <rect x="34" y="320" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="334" text-anchor="middle" font-size="9" fill="#2a4a66" font-weight="bold">r == 0 ?</text>
  <text x="86" y="347" text-anchor="middle" font-size="9" fill="#446688">是→ c++; dir=↙</text>

  <!-- rule 3: else -->
  <rect x="34" y="360" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="374" text-anchor="middle" font-size="9" fill="#3a5a2a" font-weight="bold">否则</text>
  <text x="86" y="387" text-anchor="middle" font-size="9" fill="#4a7a3a">r−−; c++ (续↗)</text>

  <!-- arrow rules down -->
  <path d="M 86 314 L 86 320" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 86 354 L 86 360" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Down branch (right) ===== -->
  <text x="372" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">否↙</text>
  <path d="M 360 288 L 410 288" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="410" y="256" width="128" height="160" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough)"/>
  <text x="474" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↙ 方向判定</text>

  <!-- rule 1: r==m-1 -->
  <rect x="422" y="280" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="294" text-anchor="middle" font-size="9" fill="#3a5a2a" font-weight="bold">r == m−1 ?</text>
  <text x="474" y="307" text-anchor="middle" font-size="9" fill="#4a7a3a">是→ c++; dir=↗</text>

  <!-- rule 2: c==0 -->
  <rect x="422" y="320" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="334" text-anchor="middle" font-size="9" fill="#3a5a2a" font-weight="bold">c == 0 ?</text>
  <text x="474" y="347" text-anchor="middle" font-size="9" fill="#4a7a3a">是→ r++; dir=↗</text>

  <!-- rule 3: else -->
  <rect x="422" y="360" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="374" text-anchor="middle" font-size="9" fill="#2a4a66" font-weight="bold">否则</text>
  <text x="474" y="387" text-anchor="middle" font-size="9" fill="#446688">r++; c−− (续↙)</text>

  <path d="M 474 314 L 474 320" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 354 L 474 360" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrows to top diamond -->
  <path d="M 86 394 L 86 428 L 280 428 L 280 186" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 394 L 474 428 L 280 428" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="294" y="422" font-size="9" fill="#888">下一格，回到循环判定</text>

  <!-- bottom note -->
  <rect x="40" y="442" width="480" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="457" text-anchor="middle" font-size="10" fill="#555">⚠️ 判定优先级：↗ 先列后行（c==n−1 优先于 r==0）；↙ 先行后列（r==m−1 优先于 c==0）—— 角点不卡死</text>
</svg>
