<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 3, 6], k = 3</text>

  <!-- ===== Initial ===== -->
  <text x="40" y="50" font-size="12" fill="#888" font-weight="bold">初始</text>
  <text x="100" y="50" font-size="11" fill="#555">ans = nums[2] − nums[0] = 6 − 1 = 5（全取相同操作的退化情形）</text>

  <rect x="176" y="58" width="52" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="228" y="58" width="52" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="58" width="52" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- ===== i=0 ===== -->
  <text x="40" y="110" font-size="12" fill="#888" font-weight="bold">i=0</text>
  <text x="100" y="110" font-size="11" fill="#555">前缀 [1]+3 → [4]，后缀 [3,6]−3 → [0,3]</text>

  <!-- Split marker -->
  <text x="176" y="104" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+k</text>
  <text x="254" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">−k −k</text>

  <rect x="176" y="116" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="136" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
  <rect x="228" y="116" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="136" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <rect x="280" y="116" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="136" text-anchor="middle" font-size="14" fill="#b85450">3</text>

  <!-- split dashed line -->
  <path d="M 228 108 L 228 152" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="350" y="128" font-size="11" fill="#444">high = max(1+3, 6−3) = max(4, 3) = 4</text>
  <text x="350" y="144" font-size="11" fill="#444">low = min(1+3, 3−3) = min(4, 0) = 0</text>
  <rect x="350" y="150" width="170" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">score = 4 − 0 = 4</text>

  <text x="40" y="188" font-size="10" fill="#888">→ ans = min(5, 4) = 4</text>

  <!-- ===== i=1 ===== -->
  <text x="40" y="212" font-size="12" fill="#888" font-weight="bold">i=1</text>
  <text x="100" y="212" font-size="11" fill="#555">前缀 [1,3]+3 → [4,6]，后缀 [6]−3 → [3]</text>

  <!-- Split marker -->
  <text x="202" y="206" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+k +k</text>
  <text x="306" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">−k</text>

  <rect x="176" y="218" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="238" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
  <rect x="228" y="218" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="238" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <rect x="280" y="218" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="238" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>

  <!-- split dashed line -->
  <path d="M 280 210 L 280 254" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="350" y="230" font-size="11" fill="#444">high = max(3+3, 6−3) = max(6, 3) = 6</text>
  <text x="350" y="246" font-size="11" fill="#444">low = min(1+3, 6−3) = min(4, 3) = 3</text>
  <rect x="350" y="252" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">score = 6 − 3 = 3 ★</text>

  <text x="40" y="288" font-size="10" fill="#888">→ ans = min(4, 3) = 3</text>

  <!-- ===== Result ===== -->
  <rect x="60" y="310" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最优解：i=1，变换 [4, 6, 3]，分数 = 6 − 3 = 3 ✓</text>

  <!-- ===== Min/max annotation for i=1 ===== -->
  <text x="40" y="372" font-size="11" fill="#888" font-weight="bold">i=1 时的 4 个候选值：</text>

  <rect x="60" y="382" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[0]+k=4</text>

  <rect x="180" y="382" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="235" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[1]+k=6</text>

  <rect x="300" y="382" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="355" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[2]−k=3</text>

  <rect x="420" y="382" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[2]−k=3</text>

  <text x="235" y="424" text-anchor="middle" font-size="10" fill="#446688">↑ high = 6</text>
  <text x="355" y="424" text-anchor="middle" font-size="10" fill="#b85450">↑ low = 3</text>
</svg>
