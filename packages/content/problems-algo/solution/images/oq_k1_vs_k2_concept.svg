<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：k=1 只能旋转，k≥2 可任意排列</text>

  <!-- Divider -->
  <line x1="300" y1="48" x2="300" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ============ LEFT: k = 1 ============ -->
  <rect x="40" y="50" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k = 1：只能把首字符移到尾</text>

  <!-- Row 1: cba -->
  <text x="58" y="100" font-size="10" fill="#888">旋转 0</text>
  <g filter="url(#rough2)">
    <rect x="96" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="113" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
    <rect x="132" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="149" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
    <rect x="168" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="185" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  </g>
  <path d="M 149 120 L 149 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="131" font-size="9" fill="#666">c→尾</text>

  <!-- Row 2: bac -->
  <text x="58" y="148" font-size="10" fill="#888">旋转 1</text>
  <g filter="url(#rough2)">
    <rect x="96" y="134" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="113" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
    <rect x="132" y="134" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="149" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
    <rect x="168" y="134" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="185" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  </g>
  <path d="M 149 168 L 149 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="179" font-size="9" fill="#666">b→尾</text>

  <!-- Row 3: acb (min, highlight) -->
  <text x="58" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">旋转 2 ✓</text>
  <g filter="url(#rough2)">
    <rect x="96" y="182" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="113" y="203" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="132" y="182" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="149" y="203" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="168" y="182" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="185" y="203" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  </g>

  <!-- cycle arrow back up -->
  <path d="M 210 197 C 248 197, 248 101, 210 101" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="152" font-size="9" fill="#888">a→尾</text>

  <rect x="50" y="222" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取所有旋转中字典序最小者</text>

  <text x="150" y="276" text-anchor="middle" font-size="10" fill="#888">"cba" → min{cba,bac,acb} = "acb"</text>

  <!-- ============ RIGHT: k >= 2 ============ -->
  <rect x="340" y="50" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="69" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">k ≥ 2：可交换相邻 → 任意排列</text>

  <!-- Swap maneuver: AB rest -->
  <text x="358" y="100" font-size="10" fill="#888">原串</text>
  <g filter="url(#rough2)">
    <rect x="386" y="86" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="401" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="418" y="86" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="433" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
    <rect x="452" y="86" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4"/>
    <text x="487" y="107" text-anchor="middle" font-size="11" fill="#999">rest...</text>
  </g>
  <path d="M 433 120 L 433 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="131" font-size="9" fill="#666">B→尾</text>

  <!-- Row 2: A rest B -->
  <text x="358" y="148" font-size="10" fill="#888">移 B</text>
  <g filter="url(#rough2)">
    <rect x="386" y="134" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="401" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
    <rect x="420" y="134" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4"/>
    <text x="455" y="155" text-anchor="middle" font-size="11" fill="#999">rest...</text>
    <rect x="494" y="134" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="509" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  </g>
  <path d="M 401 168 L 401 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="179" font-size="9" fill="#666">A→尾</text>

  <!-- Row 3: rest B A (swapped) -->
  <text x="358" y="196" font-size="10" fill="#b85450" font-weight="bold">已交换</text>
  <g filter="url(#rough2)">
    <rect x="386" y="182" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4"/>
    <text x="421" y="203" text-anchor="middle" font-size="11" fill="#999">rest...</text>
    <rect x="460" y="182" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="475" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
    <rect x="492" y="182" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="507" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  </g>

  <rect x="350" y="222" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">相邻对换 ⟹ 生成全排列 S_n</text>
  <text x="450" y="252" text-anchor="middle" font-size="10" fill="#888">配合旋转可换任意相邻位</text>

  <text x="450" y="276" text-anchor="middle" font-size="10" fill="#888">"baaca" → 排序 → "aaabc"</text>

  <!-- ============ BOTTOM: conclusion ============ -->
  <rect x="60" y="308" width="480" height="140" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结论：按 k 分类</text>

  <g filter="url(#rough2)">
    <rect x="80" y="342" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="105" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k=1</text>
    <text x="140" y="360" font-size="12" fill="#333">枚举 n 个旋转 s[i:]+s[:i]，取字典序最小</text>

    <rect x="80" y="378" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="105" y="396" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">k≥2</text>
    <text x="140" y="396" font-size="12" fill="#333">直接排序 sorted(s)（任意排列可达）</text>
  </g>

  <rect x="80" y="414" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分界点在 k=2：两步操作解锁相邻交换，排序幂跃升</text>
</svg>
