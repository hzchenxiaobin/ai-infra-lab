<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">中序遍历拍平 + 双向双指针（利用 BST 升序性质）</text>

  <!-- ===== root1 中序 ===== -->
  <text x="150" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root1 中序 → 升序数组</text>
  <circle cx="150" cy="86" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <circle cx="112" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="138" y1="99" x2="120" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="164" y1="99" x2="180" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 150 158 L 150 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="172" font-size="10" fill="#666">中序</text>

  <!-- arr1 -->
  <rect x="92" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="132" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="172" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="192" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="112" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ L=0</text>

  <!-- ===== root2 中序 ===== -->
  <text x="470" y="54" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">root2 中序 → 升序数组</text>
  <circle cx="470" cy="86" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="432" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <line x1="458" y1="99" x2="440" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="510" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="484" y1="99" x2="500" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 470 158 L 470 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="172" font-size="10" fill="#666">中序</text>

  <!-- arr2 -->
  <rect x="412" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="432" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="452" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="472" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="492" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="512" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="512" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R=2 ↑</text>

  <!-- 双指针说明 -->
  <rect x="60" y="252" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">L 从 arr1 头部（最小）出发 →，R 从 arr2 尾部（最大）出发 ←</text>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#555">arr1[L] + arr2[R] &lt; target → L++（需更大）｜ &gt; target → R−−（需更小）｜ == target → 命中</text>

  <!-- 双指针演算步骤 -->
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">target = 5：逐步双指针</text>

  <!-- 步骤 1 -->
  <rect x="60" y="332" width="520" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="356" font-size="11" fill="#333" font-weight="bold">① L=0, R=2:</text>
  <text x="190" y="356" font-size="11" fill="#446688" font-weight="bold">arr1[0] + arr2[2]</text>
  <text x="320" y="356" font-size="11" fill="#333">= 1 + 3 = 4</text>
  <text x="420" y="356" font-size="11" fill="#d6a040" font-weight="bold">4 &lt; 5 → L++</text>

  <!-- 步骤 2 命中 -->
  <rect x="60" y="378" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="402" font-size="11" fill="#b85450" font-weight="bold">② L=1, R=2:</text>
  <text x="190" y="402" font-size="11" fill="#b85450" font-weight="bold">arr1[1] + arr2[2]</text>
  <text x="320" y="402" font-size="11" fill="#333">= 2 + 3 = 5</text>
  <text x="420" y="402" font-size="11" fill="#b85450" font-weight="bold">== 5 → 命中 true ⭐</text>

  <!-- arr1 高亮 L=1 -->
  <rect x="132" y="184" width="40" height="30" fill="none" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <!-- arr2 高亮 R=2 -->
  <rect x="492" y="184" width="40" height="30" fill="none" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>

  <!-- 说明 -->
  <rect x="60" y="436" width="520" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="80" y="458" font-size="11" fill="#555" font-weight="bold">单调性保证不漏解：</text>
  <text x="80" y="476" font-size="11" fill="#555">• arr1 升序 ⇒ L++ 使和增大；arr2 升序 ⇒ R−− 使和减小。每次移动朝 target 靠拢。</text>
  <text x="80" y="494" font-size="11" fill="#555">• 两棵 BST 中序拍平归约为「两有序数组求两数之和」，承接 167 题双指针思想。</text>
</svg>
