<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">旋转 90° = 转置 + 水平翻转（两步都是原地交换）</text>

  <!-- ===== Matrix 1: original (blue) ===== -->
  <text x="80" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">原始矩阵</text>
  <!-- diagonal stripe highlight (transpose axis) -->
  <line x1="22" y1="82" x2="138" y2="180" stroke="#d6a040" stroke-width="6" stroke-opacity="0.25" filter="url(#rough2)"/>
  <rect x="20" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="60" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="102" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="100" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="20" y="114" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="136" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="60" y="114" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="114" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="20" y="148" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="170" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="60" y="148" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="100" y="148" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="80" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">沿主对角线交换</text>

  <!-- arrow 1 -->
  <path d="M 150 131 L 210 131" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="118" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">转置</text>
  <text x="180" y="150" text-anchor="middle" font-size="9.5" fill="#888">swap(m[i][j],m[j][i])</text>

  <!-- ===== Matrix 2: after transpose (green) ===== -->
  <text x="280" y="66" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">转置后</text>
  <!-- vertical flip axis -->
  <line x1="280" y1="76" x2="280" y2="190" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="220" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="300" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="102" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="220" y="114" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="260" y="114" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="300" y="114" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="220" y="148" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="260" y="148" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="300" y="148" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">每行左右镜像</text>

  <!-- arrow 2 -->
  <path d="M 350 131 L 410 131" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="118" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">水平翻转</text>
  <text x="380" y="150" text-anchor="middle" font-size="9.5" fill="#888">reverse(每行)</text>

  <!-- ===== Matrix 3: rotated result (orange) ===== -->
  <text x="480" y="66" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">旋转结果</text>
  <rect x="420" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="460" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="480" y="102" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="500" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="520" y="102" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="420" y="114" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="136" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="460" y="114" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="480" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="500" y="114" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="520" y="136" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="420" y="148" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="170" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="460" y="148" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="480" y="170" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="500" y="148" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="520" y="170" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- verification box -->
  <rect x="30" y="220" width="520" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="244" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">坐标验证：(i, j) —转置→ (j, i) —行翻转→ (j, n−1−i)</text>
  <text x="290" y="264" text-anchor="middle" font-size="11.5" fill="#555">恰好等于顺时针旋转 90° 的目标位置 (j, n−1−i) ✓</text>

  <!-- footer -->
  <rect x="30" y="294" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">两步均为原地交换：O(n²) 时间，O(1) 空间</text>
</svg>
