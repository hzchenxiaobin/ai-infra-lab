<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀最大值 → 二分配对</text>

  <!-- Step 1: Sort -->
  <rect x="130" y="48" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 按 endTime 升序排序 events</text>

  <path d="M 260 84 L 260 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Build prefMax -->
  <rect x="130" y="108" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 构建 prefMax[i] = max(val[0..i])</text>

  <path d="M 260 144 L 260 164" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Initialize -->
  <rect x="130" y="168" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ ans = 0，遍历每个事件 i</text>

  <path d="M 260 204 L 260 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Binary search (diamond) -->
  <polygon points="260,228 380,270 260,312 140,270" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 二分查找</text>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">最后一个 endTime</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">&lt; startTime[i] 的 j</text>

  <!-- Left branch: j exists -->
  <path d="M 140 270 L 60 270 L 60 330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="75" y="262" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">找到 j</text>

  <rect x="20" y="334" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="354" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">candidate =</text>
  <text x="105" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">val[i] + prefMax[j]</text>

  <!-- Right branch: no j -->
  <path d="M 380 270 L 460 270 L 460 330" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="262" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">无兼容</text>

  <rect x="375" y="334" width="125" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="437" y="354" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">candidate =</text>
  <text x="437" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">val[i]</text>

  <!-- Converge -->
  <path d="M 105 380 L 105 400 L 260 400" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 437 380 L 437 400 L 260 400" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 400 L 260 420" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Update ans -->
  <rect x="130" y="424" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="446" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ ans = max(ans, candidate)</text>

  <!-- Loop back -->
  <path d="M 390 441 L 470 441 L 470 190 L 390 190" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="318" font-size="9.5" fill="#888" filter="url(#rough2)" transform="rotate(90 478 318)">下一个事件 i</text>

  <!-- Step 6: Return -->
  <path d="M 260 460 L 260 480" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="484" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="506" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ 返回 ans</text>

  <!-- Complexity note -->
  <text x="260" y="540" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序 O(n log n) + n 次二分 × O(log n) = O(n log n)</text>
</svg>
