<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">法一：快慢指针找中点，分治递归</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">slow 走 1 步、fast 走 2 步 → fast 到尾时 slow 恰在中点</text>

  <!-- ===== 链表节点 ===== -->
  <g font-size="13">
    <rect x="40" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="70" y="92" text-anchor="middle" fill="#333" font-weight="bold">-10</text>
    <line x1="100" y1="87" x2="128" y2="87" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="134" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="164" y="92" text-anchor="middle" fill="#333" font-weight="bold">-3</text>
    <line x1="194" y1="87" x2="222" y2="87" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="228" y="70" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="258" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="258" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">中点 = slow</text>
    <line x1="288" y1="87" x2="316" y2="87" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="322" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="352" y="92" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="382" y1="87" x2="410" y2="87" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="416" y="70" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="446" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <text x="446" y="120" text-anchor="middle" font-size="10" fill="#b85450">fast 终点</text>
    <line x1="476" y1="87" x2="504" y2="87" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="514" y="92" font-size="12" fill="#888">∅</text>
  </g>

  <!-- ===== slow / fast 起点标注 ===== -->
  <text x="70" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow 起点</text>
  <text x="70" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">fast 起点</text>

  <!-- ===== 中点 → 根 ===== -->
  <path d="M 258 124 L 290 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 构造的 BST ===== -->
  <circle cx="290" cy="172" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <circle cx="220" cy="232" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="236" text-anchor="middle" font-size="11" fill="#333">-3</text>
  <line x1="278" y1="184" x2="230" y2="220" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="370" cy="232" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="236" text-anchor="middle" font-size="11" fill="#333">9</text>
  <line x1="302" y1="184" x2="360" y2="220" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="180" cy="292" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="296" text-anchor="middle" font-size="10" fill="#333">-10</text>
  <line x1="210" y1="242" x2="186" y2="282" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="410" cy="292" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#333">5</text>
  <line x1="380" y1="242" x2="404" y2="282" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- ===== 左右半区间标注 ===== -->
  <path d="M 70 110 Q 50 200 180 282" stroke="#446688" stroke-width="1.1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 352 110 Q 440 200 410 282" stroke="#446688" stroke-width="1.1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="36" y="210" font-size="10" fill="#446688">左半 [head, slow)</text>
  <text x="446" y="210" font-size="10" fill="#446688">右半 [slow.next, tail)</text>

  <!-- ===== 说明框 ===== -->
  <rect x="40" y="324" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="346" font-size="12" fill="#8a6a20" font-weight="bold">分治：取 slow 为根 → 左半递归建左子树，右半递归建右子树</text>
  <text x="52" y="364" font-size="11" fill="#555">每层 O(n) 找中点，共 log n 层 ⇒ 时间 O(n log n)，空间 O(log n)（递归栈）</text>
  <text x="52" y="378" font-size="11" fill="#555">用半开区间 [head, tail) 递归，无需切断链表</text>
</svg>
