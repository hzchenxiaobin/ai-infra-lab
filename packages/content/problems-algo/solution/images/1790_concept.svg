<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1790c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arr1790g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="448" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：差异位置数 d 决定答案 —— d=0 或 (d=2 且交叉相等) 即 true</text>

  <!-- ====== Case 1: d=0, true ====== -->
  <text x="28" y="62" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ d = 0：两串本就相等</text>

  <!-- s1 row: "kelb" -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="110" y="72" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="131" y="90" filter="url(#rough2)">k</text>
    <rect x="152" y="72" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="90" filter="url(#rough2)">e</text>
    <rect x="194" y="72" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="215" y="90" filter="url(#rough2)">l</text>
    <rect x="236" y="72" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="90" filter="url(#rough2)">b</text>
  </g>
  <text x="92" y="90" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>

  <!-- s2 row: "kelb" -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="110" y="104" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="131" y="122" filter="url(#rough2)">k</text>
    <rect x="152" y="104" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="122" filter="url(#rough2)">e</text>
    <rect x="194" y="104" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="215" y="122" filter="url(#rough2)">l</text>
    <rect x="236" y="104" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="122" filter="url(#rough2)">b</text>
  </g>
  <text x="92" y="122" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <text x="300" y="100" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 选 i==j 的"空交换"，返回 true</text>

  <!-- divider -->
  <path d="M 24 150 L 556 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ====== Case 2: d=2 cross-equal, true ====== -->
  <text x="28" y="174" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ d = 2 且交叉相等：差异位 i, j 满足 s1[i]=s2[j], s1[j]=s2[i]</text>

  <!-- s1 row: "bank" highlight 0,3 -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="110" y="186" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="131" y="204" filter="url(#rough2)">b</text>
    <rect x="152" y="186" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="204" filter="url(#rough2)">a</text>
    <rect x="194" y="186" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="215" y="204" filter="url(#rough2)">n</text>
    <rect x="236" y="186" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="257" y="204" filter="url(#rough2)">k</text>
  </g>
  <text x="92" y="204" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>
  <text x="131" y="180" font-size="10.5" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">i=0</text>
  <text x="257" y="180" font-size="10.5" fill="#d6a040" font-weight="bold" text-anchor="middle" filter="url(#rough2)">j=3</text>

  <!-- s2 row: "kanb" highlight 0,3 -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="110" y="222" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="131" y="240" filter="url(#rough2)">k</text>
    <rect x="152" y="222" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="240" filter="url(#rough2)">a</text>
    <rect x="194" y="222" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="215" y="240" filter="url(#rough2)">n</text>
    <rect x="236" y="222" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="257" y="240" filter="url(#rough2)">b</text>
  </g>
  <text x="92" y="240" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <!-- cross arrows: s1[0](b) -> s2[3](b) ; s1[3](k) -> s2[0](k) -->
  <path d="M 131 212 Q 194 232 257 222" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr1790g)" filter="url(#rough2)"/>
  <path d="M 257 212 Q 194 232 131 222" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr1790g)" filter="url(#rough2)"/>
  <text x="194" y="237" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">交叉相等</text>

  <text x="300" y="214" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 交换 s1[i] ↔ s1[j]，</text>
  <text x="300" y="232" font-size="12" fill="#4a7a3a" filter="url(#rough2)">  两串归一，返回 true</text>

  <!-- divider -->
  <path d="M 24 266 L 556 266" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ====== Case 3: d>=3 (or d=1), false ====== -->
  <text x="28" y="290" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ d ∉ {0,2}（如 d=1 或 d≥3）：一次交换最多修 2 位</text>

  <!-- s1 row: "attack" 6 cells, all red -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="110" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="128" y="320" filter="url(#rough2)">a</text>
    <rect x="146" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="164" y="320" filter="url(#rough2)">t</text>
    <rect x="182" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="200" y="320" filter="url(#rough2)">t</text>
    <rect x="218" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="236" y="320" filter="url(#rough2)">a</text>
    <rect x="254" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="272" y="320" filter="url(#rough2)">c</text>
    <rect x="290" y="302" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="308" y="320" filter="url(#rough2)">k</text>
  </g>
  <text x="92" y="320" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>

  <!-- s2 row: "defend" 6 cells, all red -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="110" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="128" y="356" filter="url(#rough2)">d</text>
    <rect x="146" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="164" y="356" filter="url(#rough2)">e</text>
    <rect x="182" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="200" y="356" filter="url(#rough2)">f</text>
    <rect x="218" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="236" y="356" filter="url(#rough2)">e</text>
    <rect x="254" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="272" y="356" filter="url(#rough2)">n</text>
    <rect x="290" y="338" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="308" y="356" filter="url(#rough2)">d</text>
  </g>
  <text x="92" y="356" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <text x="346" y="324" font-size="12" fill="#b85450" filter="url(#rough2)">d = 6 ≥ 3</text>
  <text x="346" y="344" font-size="12" fill="#b85450" filter="url(#rough2)">→ 返回 false</text>

  <!-- ====== conclusion box ====== -->
  <rect x="60" y="386" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="408" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">一趟扫描收集差异下标 d；<tspan fill="#4a7a3a" font-weight="bold">d=0</tspan> 或 <tspan fill="#4a7a3a" font-weight="bold">d=2 且交叉相等</tspan> → true</text>
  <text x="290" y="426" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">其余（d=1 或 d≥3）→ false</text>
</svg>
