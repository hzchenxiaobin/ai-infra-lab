<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">建模：每种题型 = 多重背包的一件物品（count 份，每份 marks 分）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同类型题目不可区分 → 只看「做几道」k ∈ [0, count]</text>

  <!-- Row 0: 题型0 (6,1) -->
  <rect x="30" y="58" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="76" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">题型0 (6, 1)</text>
  <rect x="150" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="182" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="214" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="246" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="278" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="310" y="58" width="28" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="76" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="350" y="76" font-size="11" fill="#7a5a20">⇒ 选 k ∈ [0,6] 道</text>

  <!-- Row 1: 题型1 (3,2) -->
  <rect x="30" y="100" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="118" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">题型1 (3, 2)</text>
  <rect x="150" y="100" width="28" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="118" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="182" y="100" width="28" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="118" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="214" y="100" width="28" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="118" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <text x="350" y="118" font-size="11" fill="#7a5a20">⇒ 选 k ∈ [0,3] 道</text>

  <!-- Row 2: 题型2 (2,3) -->
  <rect x="30" y="142" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="160" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">题型2 (2, 3)</text>
  <rect x="150" y="142" width="28" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="160" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <rect x="182" y="142" width="28" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="160" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <text x="350" y="160" font-size="11" fill="#7a5a20">⇒ 选 k ∈ [0,2] 道</text>

  <!-- arrow down -->
  <line x1="280" y1="176" x2="280" y2="200" stroke="#666" stroke-width="1.8" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- Model box -->
  <rect x="60" y="202" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold">多重背包求方案数（恰好装满 target）</text>
  <text x="280" y="243" text-anchor="middle" font-size="12" fill="#7a5a20" font-family="monospace">dp[j] = 恰好凑出 j 分的方法数</text>

  <!-- arrow down -->
  <line x1="280" y1="252" x2="280" y2="276" stroke="#666" stroke-width="1.8" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="100" y="278" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#3a5a2a">初始化 dp[0]=1（空集得 0 分），dp[j&gt;0]=0</text>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" font-family="monospace">答案 = dp[target] mod (10⁹+7)</text>

  <!-- footnote -->
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#888">示例1：target=6，三种题型 ⇒ dp[6]=7</text>
</svg>
