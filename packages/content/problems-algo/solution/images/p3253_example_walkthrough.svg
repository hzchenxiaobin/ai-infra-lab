<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：target = "abcdef"（起点视角）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">words = abdef(¥100), abc(¥1), d(¥1), def(¥10), ef(¥5)</text>

  <!-- 表头 -->
  <rect x="36" y="52" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">起点 j</text>
  <rect x="84" y="52" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">Trie 下行</text>
  <rect x="238" y="52" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">命中单词</text>
  <rect x="362" y="52" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">dp 更新</text>

  <!-- j=0 -->
  <rect x="36" y="82" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="103" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="84" y="82" width="150" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="103" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a→b→c→d→e→f（走到头）</text>
  <rect x="238" y="82" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">abc ¥1</text>
  <text x="298" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">abdef ¥100</text>
  <rect x="362" y="82" width="132" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="96" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[3] = 0+1 = 1</text>
  <text x="428" y="110" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">dp[5] = 0+100 = 100</text>

  <!-- j=1 -->
  <rect x="36" y="122" width="44" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="139" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="84" y="122" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="139" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首字符 b，root 无出边 → 断</text>
  <rect x="238" y="122" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="139" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="362" y="122" width="132" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="139" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- j=2 -->
  <rect x="36" y="154" width="44" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="171" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="84" y="154" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="171" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首字符 c，root 无出边 → 断</text>
  <rect x="238" y="154" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="171" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="362" y="154" width="132" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="171" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- j=3 -->
  <rect x="36" y="186" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="207" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="84" y="186" width="150" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="207" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d→e→f（走到头）</text>
  <rect x="238" y="186" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="200" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">d ¥1</text>
  <text x="298" y="214" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">def ¥10</text>
  <rect x="362" y="186" width="132" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[4] = 1+1 = 2</text>
  <text x="428" y="214" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">dp[6] = 1+10 = 11</text>

  <!-- j=4 -->
  <rect x="36" y="226" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="247" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>
  <rect x="84" y="226" width="150" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="247" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">e→f（走到头）</text>
  <rect x="238" y="226" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ef ¥5</text>
  <rect x="362" y="226" width="132" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="247" text-anchor="middle" font-size="10" font-weight="bold" fill="#a07830" filter="url(#rough2)">dp[6] = min(11, 2+5) = 7</text>

  <!-- j=5 -->
  <rect x="36" y="266" width="44" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="283" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <rect x="84" y="266" width="150" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="283" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首字符 f，root 无出边 → 断</text>
  <rect x="238" y="266" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="283" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="362" y="266" width="132" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="283" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- 最终 dp -->
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">最终 dp = [0, ∞, ∞, 1, 2, 100, 7] → 返回 7</text>
  <rect x="36" y="322" width="458" height="26" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="265" y="339" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">最优路径 abc(¥1) + d(¥1) + ef(¥5) = 7；dp[5]=100 虽合法（整段 abdef）但贵</text>
</svg>
