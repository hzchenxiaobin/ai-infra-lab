<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍计数奇偶 → 取较小者</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333">开始: even = 0, odd = 0</text>

  <path d="M 270 80 L 270 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more positions? -->
  <polygon points="270,96 390,134 270,172 150,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">还有筹码</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#666">position[i] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 172 L 270 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="184" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 2: even? -->
  <polygon points="270,192 386,228 270,264 154,228" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#333">position[i]</text>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#666">为偶数 ?</text>

  <!-- Yes (even) -> left -->
  <path d="M 154 228 L 110 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是</text>

  <!-- even++ box -->
  <rect x="30" y="214" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="233" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">even++</text>

  <!-- No (odd) -> right -->
  <path d="M 386 228 L 430 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <!-- odd++ box -->
  <rect x="430" y="214" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="233" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">odd++</text>

  <!-- both branches merge down then loop back to diamond1 -->
  <path d="M 70 242 L 70 282 L 270 282" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 242 L 470 282 L 270 282" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 282 L 270 296" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="210" y="298" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i++</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 210 312 L 60 312 L 60 134 L 150 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="224" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 44 224)">下一个</text>

  <!-- No (no more) -> right then down to result -->
  <path d="M 390 134 L 430 134 L 430 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- result: min box -->
  <path d="M 430 350 L 350 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="336" width="230" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="235" y="357" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return min(even, odd)</text>

  <!-- summary -->
  <rect x="60" y="390" width="420" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="11" fill="#444">一遍遍历 O(n)：偶数位计数 even、奇数位计数 odd</text>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#444">让少数派跨奇偶，每个花 1 → min(even, odd) 即最小总代价</text>
</svg>
