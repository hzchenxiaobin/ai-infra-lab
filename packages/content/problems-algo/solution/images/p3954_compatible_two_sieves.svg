<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">两把筛子：距离筛 + 位筛（以 n=2, k=3 为例）</text>

  <!-- 面板 A：距离筛 -->
  <text x="60" y="56" font-size="13" fill="#446688" filter="url(#rough2)">① 距离筛：|n−x| ≤ k ⟺ x ∈ [max(1, n−k), n+k]</text>

  <rect x="104" y="82" width="318" height="58" rx="10" fill="#e8f0fe" fill-opacity="0.55"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="263" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">窗口（长度 ≤ 2k+1）</text>

  <line x1="48" y1="112" x2="472" y2="112" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <line x1="64" y1="107" x2="64" y2="117"/>
    <line x1="130" y1="107" x2="130" y2="117"/>
    <line x1="196" y1="107" x2="196" y2="117"/>
    <line x1="262" y1="107" x2="262" y2="117"/>
    <line x1="328" y1="107" x2="328" y2="117"/>
    <line x1="394" y1="107" x2="394" y2="117"/>
    <line x1="460" y1="107" x2="460" y2="117"/>
  </g>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="64" y="134">0</text>
    <text x="130" y="134">1</text>
    <text x="196" y="134">2</text>
    <text x="262" y="134">3</text>
    <text x="328" y="134">4</text>
    <text x="394" y="134">5</text>
    <text x="460" y="134">6</text>
  </g>

  <!-- n 旗帜 -->
  <path d="M 196 112 L 196 88 L 214 93 L 196 98" fill="#d6a040" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="222" y="95" font-size="12" fill="#d6a040" filter="url(#rough2)">n</text>

  <!-- 兼容数绿圈 -->
  <g fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)">
    <ellipse cx="130" cy="112" rx="13" ry="14"/>
    <ellipse cx="328" cy="112" rx="13" ry="14"/>
    <ellipse cx="394" cy="112" rx="13" ry="14"/>
  </g>
  <g font-size="12" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="150">✓</text>
    <text x="328" y="150">✓</text>
    <text x="394" y="150">✓</text>
    <text x="196" y="150" fill="#b85450">✗</text>
    <text x="262" y="150" fill="#b85450">✗</text>
  </g>

  <text x="60" y="168" font-size="11" fill="#666" filter="url(#rough2)">1、4、5 过距离筛，再等位筛裁决（2、3 位筛淘汰 → 见下）</text>

  <!-- 面板 B：位筛 -->
  <text x="60" y="198" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 位筛：n &amp; x = 0 ⟺ x 的 1 只能落在 n 的 0 位上</text>

  <!-- 列头 -->
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="222" y="222" fill="#4a7a3a">位2 ✓</text>
    <text x="266" y="222" fill="#b85450">位1 ✗</text>
    <text x="310" y="222" fill="#4a7a3a">位0 ✓</text>
  </g>

  <!-- 行1：n -->
  <text x="150" y="245" font-size="12" fill="#333" text-anchor="end" filter="url(#rough2)">n = 2</text>
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <rect x="200" y="230" width="44" height="30" rx="4" fill="#e8f0fe"/>
    <rect x="244" y="230" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="288" y="230" width="44" height="30" rx="4" fill="#e8f0fe"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="222" y="250">0</text>
    <text x="266" y="250" fill="#b85450" font-weight="bold">1</text>
    <text x="310" y="250">0</text>
  </g>
  <path d="M 292 240 C 330 236, 348 244, 366 240" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="244" font-size="11" fill="#b85450" filter="url(#rough2)">n 为 1 的位，x 必须填 0</text>

  <!-- 行2：x -->
  <text x="150" y="285" font-size="12" fill="#333" text-anchor="end" filter="url(#rough2)">x = 5</text>
  <g stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)">
    <rect x="200" y="270" width="44" height="30" rx="4" fill="#e6f4ea"/>
    <rect x="244" y="270" width="44" height="30" rx="4" fill="#e6f4ea"/>
    <rect x="288" y="270" width="44" height="30" rx="4" fill="#e6f4ea"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    <text x="222" y="290">1</text>
    <text x="266" y="290">0</text>
    <text x="310" y="290">1</text>
  </g>

  <text x="60" y="330" font-size="11" fill="#666" filter="url(#rough2)">位 1 被封死，x 只能在位 0、位 2 放 1 → 候选 {0,1,4,5}，</text>
  <text x="60" y="346" font-size="11" fill="#666" filter="url(#rough2)">其中落在窗口 [1,5] 内的正整数恰是 {1, 4, 5}，和 = 10 ✓</text>
</svg>
