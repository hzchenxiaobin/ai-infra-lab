<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">规模鸿沟：n ≤ 10⁵ 把 O(n²) DP 逼死，只剩 O(n) 结构解</text>

  <!-- 左：线性 DP 已死 -->
  <rect x="22" y="40" width="230" height="170" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="137" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">线性 DP O(n²)（3205 的解法）</text>
  <text x="137" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">转移要枚举全部 (i,j) 对</text>
  <text x="137" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n = 10⁵ ⟹ ~n²/2 ≈ 5×10⁹ 次比较</text>
  <text x="137" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">按 10⁹ 次/秒也要跑好几秒</text>
  <text x="137" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">复杂度红线 10¹⁰ 必死 ✗</text>
  <text x="137" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（3205 的 n ≤ 10³ 才养得起它）</text>

  <!-- 右：O(n) 存活 -->
  <rect x="268" y="40" width="230" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="383" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">后缀最大值求和 O(n)（本题解法）</text>
  <text x="383" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从右往左一趟，每个元素看一次</text>
  <text x="383" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">只滚动 ans / mx 两个变量</text>
  <text x="383" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10⁵ 次运算，O(1) 空间</text>
  <text x="383" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">毫秒级出答案 ✓</text>
  <text x="383" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（与 n 的规模线性同阶）</text>

  <!-- VS -->
  <text x="260" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#888" filter="url(#rough2)">vs</text>

  <!-- 底部：两个必答点 -->
  <rect x="22" y="224" width="476" height="124" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">规模放大逼出的两个新考点</text>

  <text x="36" y="272" font-size="11" fill="#333" filter="url(#rough2)">① 超时：O(n²) = 10¹⁰ 级运算量 ⟹ 必须挖出线性结构</text>
  <text x="48" y="290" font-size="11" fill="#555" filter="url(#rough2)">「每段贡献 ≤ 右侧最大值」+ 贪心取满上界 ⟹ 倒序一趟求和</text>

  <text x="36" y="316" font-size="11" fill="#333" filter="url(#rough2)">② 溢出：ans ≤ (n−1) × 10⁵ ≈ 10¹⁰ &gt; int32（≈2.1×10⁹）</text>
  <text x="48" y="334" font-size="11" fill="#b85450" filter="url(#rough2)">⟹ C++ 必须 long long（官方签名 long long maxScore 就是暗示！）</text>
</svg>
