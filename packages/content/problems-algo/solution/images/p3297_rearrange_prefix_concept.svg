<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">「重排后是前缀」⟺「字符袋装得下」</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">顺序无所谓，只比每个字符的数量！</text>

  <!-- 上排：bcca 重排为 abcc -->
  <text x="88" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">子串 x = "bcca"</text>
  <rect x="36" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="74" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="86" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="91" y="86" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="129" y="86" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="167" y="86" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>

  <path d="M 196 80 C 216 74, 236 74, 256 80" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="66" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">重排</text>

  <text x="348" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">一种重排 = "abcc"</text>
  <rect x="280" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="356" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="335" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="373" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="411" y="86" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">c</text>
  <path d="M 281 112 C 315 120, 365 120, 399 112" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="340" y="134" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">word2 = "abc" 是它的前缀 ✓</text>
  <text x="452" y="86" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合法!</text>

  <!-- 中部：计数对比表 -->
  <text x="260" y="160" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">只看字符袋（多重集合）：</text>
  <rect x="120" y="170" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">need (word2)</text>
  <rect x="220" y="170" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="190" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">a:1</text>
  <rect x="290" y="170" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="190" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">b:1</text>
  <rect x="360" y="170" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="190" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c:1</text>
  <rect x="120" y="204" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">have (x)</text>
  <rect x="220" y="204" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="224" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">a:1 ✓</text>
  <rect x="290" y="204" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="224" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">b:1 ✓</text>
  <rect x="360" y="204" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="224" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">c:2 ✓</text>
  <text x="470" y="224" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">都够!</text>

  <!-- 底部：结论 -->
  <rect x="46" y="252" width="428" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">x 合法 ⟺ 对每个字符 c 都有 cntx(c) ≥ need(c)</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">—— 多余的字符（如多出的 c）摆后面就行，无妨</text>

  <rect x="46" y="308" width="428" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">单调性：窗口越扩，have 只增不减</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">合法的超集仍合法 → 固定 right 时合法起点是一段前缀 [0, L]</text>
</svg>
