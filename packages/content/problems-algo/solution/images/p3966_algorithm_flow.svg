<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：F(x) = 记忆化数位 DFS(pos, prev, tight, started)</text>
  <text x="260" y="33" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外层答案 = F(r) − F(l−1)，对 x = r 与 x = l−1 各跑一遍；每个状态只算一次</text>

  <!-- 开始 -->
  <rect x="110" y="42" width="200" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="58" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">count(x)：s = str(x)，L = len(s)</text>

  <path d="M 210 66 L 210 78" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- DFS 入口 -->
  <rect x="110" y="80" width="200" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="97" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">DFS(pos, prev, tight, started)</text>

  <path d="M 210 106 L 210 118" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 终点菱形 -->
  <polygon points="210,120 262,140 210,160 158,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="144" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">pos = L ?</text>

  <path d="M 262 140 L 300 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="272" y="133" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="303" y="126" width="152" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="144" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">return started ? 1 : 0</text>

  <path d="M 210 160 L 210 172" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="220" y="170" font-size="10" fill="#778899" filter="url(#rough2)">否</text>

  <!-- limit -->
  <rect x="110" y="174" width="200" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="191" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">limit = tight ? s[pos] : 9</text>

  <path d="M 210 200 L 210 212" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 枚举 -->
  <rect x="110" y="214" width="200" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="231" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">枚举 d = 0 … limit</text>

  <path d="M 210 240 L 210 252" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 约束菱形 -->
  <polygon points="210,254 274,276 210,298 146,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="273" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">started 且 |d−prev| &gt; k ?</text>
  <text x="210" y="286" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">（相邻差超限）</text>

  <path d="M 274 276 L 330 276" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="269" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="333" y="262" width="140" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="280" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#rough2)">跳过此 d，枚举下一个</text>

  <path d="M 210 298 L 210 310" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="220" y="308" font-size="10" fill="#778899" filter="url(#rough2)">否</text>

  <!-- 累加 -->
  <rect x="95" y="312" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="326" text-anchor="middle" font-size="10" fill="#33507a" filter="url(#rough2)">累加 DFS(pos+1, prev′, tight∧(d=limit), started′)</text>
  <text x="210" y="340" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">prev′：未开始放 0 传 −1，否则传 d；started′ = started ∨ d&gt;0</text>

  <!-- 回路 -->
  <path d="M 325 329 L 350 329" fill="none" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 350 329 L 350 352 L 62 352 L 62 227 L 108 227" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="346" font-size="10" fill="#666" filter="url(#rough2)">d 枚举完 → 返回累加和</text>

  <!-- 记忆化注释框 -->
  <rect x="330" y="42" width="180" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">记忆化与状态：</text>
  <text x="420" y="82" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">memo[pos][prev+1][tight][started]</text>
  <text x="420" y="100" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">prev ∈ {−1, 0..9} 共 11 档</text>
  <text x="420" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">未开始时：d=0 → 仍传 −1（前导 0 跳过）</text>
  <text x="420" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d&gt;0 → 传 d，开始检查相邻差</text>
  <text x="420" y="158" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">状态总数 ≤ 16×11×2×2 ≈ 704</text>
  <text x="420" y="178" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">单状态转移 O(10)，瞬间算完</text>
</svg>
