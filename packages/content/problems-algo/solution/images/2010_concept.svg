<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心思路：贪心 + 窗口累计求和 → 输出被雇 employee_id 列表</text>

  <!-- ===== Budget bar ===== -->
  <text x="60" y="56" font-size="11" fill="#b85450" font-weight="bold">预算 70000</text>
  <rect x="60" y="62" width="500" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="310" y1="58" x2="310" y2="86" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="54" text-anchor="middle" font-size="8.5" fill="#b85450">切分线 70000</text>

  <!-- ===== Senior section ===== -->
  <text x="60" y="104" font-size="11" fill="#446688" font-weight="bold">① 高级组（salary 升序，cur = 累计前缀和）</text>

  <rect x="60" y="110" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="123" text-anchor="middle" font-size="9" fill="#333">id=11  16000</text>
  <text x="103" y="136" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cur=16000 ✓</text>

  <rect x="156" y="110" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="123" text-anchor="middle" font-size="9" fill="#333">id=2  20000</text>
  <text x="199" y="136" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">cur=36000 ✓</text>

  <rect x="252" y="110" width="86" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="123" text-anchor="middle" font-size="9" fill="#999">id=13  50000</text>
  <text x="295" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">cur=86000 ✗</text>

  <!-- spent_senior -->
  <path d="M60 148 L338 148" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="120" y="152" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="165" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">高级花费 spent = 36000 → 剩余 34000</text>

  <path d="M205 172 L205 188" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Junior section ===== -->
  <text x="60" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">② 初级组（cur = 偏移 36000 + 初级前缀和）</text>

  <rect x="60" y="222" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="235" text-anchor="middle" font-size="9" fill="#333">id=1  10000</text>
  <text x="103" y="248" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">cur=46000 ✓</text>

  <rect x="156" y="222" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="235" text-anchor="middle" font-size="9" fill="#333">id=9  15000</text>
  <text x="199" y="248" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">cur=61000 ✓</text>

  <rect x="252" y="222" width="86" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="235" text-anchor="middle" font-size="9" fill="#999">id=4  40000</text>
  <text x="295" y="248" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">cur=101000 ✗</text>

  <!-- 70000 cut line -->
  <line x1="338" y1="218" x2="338" y2="260" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="338" y="214" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">70000</text>

  <!-- ===== Right side: result ===== -->
  <rect x="410" y="110" width="170" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">高级被雇 employee_id</text>
  <text x="495" y="158" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">11, 2</text>

  <rect x="410" y="222" width="170" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">初级被雇 employee_id</text>
  <text x="495" y="270" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1, 9</text>

  <!-- arrows to result -->
  <path d="M338 127 L408 144" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M338 239 L408 256" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== UNION box ===== -->
  <rect x="410" y="300" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">UNION 合并两段 id</text>
  <text x="495" y="332" text-anchor="middle" font-size="9" fill="#777">SELECT employee_id WHERE cur ≤ 70000</text>

  <path d="M495 178 L495 200 L495 220 L495 300" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Bottom callouts ===== -->
  <rect x="60" y="300" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="320" font-size="10" fill="#446688" font-weight="bold">与 2004 的差异：输出 id 而非计数</text>
  <text x="75" y="336" font-size="9.5" fill="#555">2004 用 COUNT(*) 返回人数</text>
  <text x="75" y="350" font-size="9.5" fill="#555">2010 直接 SELECT employee_id 返回清单</text>

  <rect x="60" y="370" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="390" font-size="10" fill="#b85450" font-weight="bold">💡 salary 唯一 → 无并列陷阱</text>
  <text x="75" y="406" font-size="9.5" fill="#555">本题保证每个候选人 salary 唯一，RANGE 与 ROWS 行为一致，直接 ORDER BY salary 即可（对照 2004 须显式写 ROWS）</text>
</svg>
