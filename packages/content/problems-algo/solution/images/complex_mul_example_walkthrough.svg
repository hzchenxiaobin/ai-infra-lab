<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两道用例逐步跟踪</text>

  <!-- ===== Example 1: "1+1i" × "1+1i" ===== -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">用例一："1+1i" × "1+1i"</text>

  <!-- parse row -->
  <rect x="40" y="66" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">解析：find('+') → a=1, b=1, c=1, d=1</text>

  <!-- table header -->
  <rect x="40" y="98" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <rect x="110" y="98" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">计算</text>
  <rect x="310" y="98" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果</text>
  <rect x="410" y="98" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">归入</text>

  <!-- row: ac -->
  <rect x="40" y="122" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="138" text-anchor="middle" font-size="11" fill="#333">ac</text>
  <rect x="110" y="122" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="138" text-anchor="middle" font-size="11" fill="#333">1 × 1</text>
  <rect x="310" y="122" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="410" y="122" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="138" text-anchor="middle" font-size="10.5" fill="#446688">实部</text>

  <!-- row: bd -->
  <rect x="40" y="146" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="162" text-anchor="middle" font-size="11" fill="#333">bd</text>
  <rect x="110" y="146" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#333">1 × 1</text>
  <rect x="310" y="146" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="410" y="146" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="162" text-anchor="middle" font-size="10.5" fill="#b85450">实部(×−1)</text>

  <!-- row: ad -->
  <rect x="40" y="170" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="186" text-anchor="middle" font-size="11" fill="#333">ad</text>
  <rect x="110" y="170" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="186" text-anchor="middle" font-size="11" fill="#333">1 × 1</text>
  <rect x="310" y="170" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="410" y="170" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040">虚部</text>

  <!-- row: bc -->
  <rect x="40" y="194" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="210" text-anchor="middle" font-size="11" fill="#333">bc</text>
  <rect x="110" y="194" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="210" text-anchor="middle" font-size="11" fill="#333">1 × 1</text>
  <rect x="310" y="194" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="410" y="194" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="210" text-anchor="middle" font-size="10.5" fill="#d6a040">虚部</text>

  <!-- combine row -->
  <rect x="40" y="222" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">real = 1 − 1 = 0 ；imag = 1 + 1 = 2 → "0+2i" ✓</text>

  <!-- ===== Example 2: "1+-1i" × "1+-1i" ===== -->
  <text x="40" y="278" font-size="12" fill="#b85450" font-weight="bold">用例二："1+-1i" × "1+-1i"（虚部为负）</text>

  <!-- parse row -->
  <rect x="40" y="286" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">解析：find('+')=1 → a=1, b=stoi("-1")=-1, c=1, d=-1</text>

  <!-- table header ex2 -->
  <rect x="40" y="318" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="334" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <rect x="110" y="318" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="334" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">计算</text>
  <rect x="310" y="318" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="334" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果</text>
  <rect x="410" y="318" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="334" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">归入</text>

  <!-- row: ac -->
  <rect x="40" y="342" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="358" text-anchor="middle" font-size="11" fill="#333">ac</text>
  <rect x="110" y="342" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="358" text-anchor="middle" font-size="11" fill="#333">1 × 1</text>
  <rect x="310" y="342" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="410" y="342" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="358" text-anchor="middle" font-size="10.5" fill="#446688">实部</text>

  <!-- row: bd -->
  <rect x="40" y="366" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="382" text-anchor="middle" font-size="11" fill="#333">bd</text>
  <rect x="110" y="366" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="382" text-anchor="middle" font-size="11" fill="#333">(−1) × (−1)</text>
  <rect x="310" y="366" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="410" y="366" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="382" text-anchor="middle" font-size="10.5" fill="#b85450">实部(×−1)</text>

  <!-- row: ad -->
  <rect x="40" y="390" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="406" text-anchor="middle" font-size="11" fill="#333">ad</text>
  <rect x="110" y="390" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="406" text-anchor="middle" font-size="11" fill="#333">1 × (−1)</text>
  <rect x="310" y="390" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="406" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="410" y="390" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="406" text-anchor="middle" font-size="10.5" fill="#d6a040">虚部</text>

  <!-- row: bc -->
  <rect x="40" y="414" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="430" text-anchor="middle" font-size="11" fill="#333">bc</text>
  <rect x="110" y="414" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="430" text-anchor="middle" font-size="11" fill="#333">(−1) × 1</text>
  <rect x="310" y="414" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="410" y="414" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="475" y="430" text-anchor="middle" font-size="10.5" fill="#d6a040">虚部</text>

  <!-- combine row -->
  <rect x="40" y="442" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="460" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">real = 1 − 1 = 0 ；imag = −1 + (−1) = −2 → "0+-2i" ✓</text>

  <!-- summary note -->
  <rect x="40" y="478" width="500" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="490" text-anchor="middle" font-size="10.5" fill="#888">负虚部直接拼成 "0+-2i"（题目接受此格式），无须额外转成 "0-2i"</text>
</svg>
