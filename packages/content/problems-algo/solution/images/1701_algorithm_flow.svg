<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：单遍历 + next_free 滚动
  </text>

  <!-- Start -->
  <ellipse cx="260" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,70 L260,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="180" y="88" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">next_free=0, total_wait=0</text>
  <path d="M260,118 L260,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 还有顾客? -->
  <polygon points="260,136 330,162 260,188 190,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有顾客?</text>

  <!-- no branch -> return -->
  <path d="M330,162 L388,162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="155" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="392" y="146" width="108" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="446" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return total_wait/n</text>

  <!-- yes branch -->
  <path d="M260,188 L260,204" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- read (a, t) -->
  <rect x="196" y="208" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一位 (a, t)</text>
  <path d="M260,236 L260,248" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- start = max(next_free, a) -->
  <rect x="156" y="252" width="208" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">start = max(next_free, a)</text>
  <path d="M260,280 L260,292" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- finish = start + t ; wait = finish - a -->
  <rect x="120" y="296" width="280" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">finish=start+t; wait=finish−a; total_wait+=wait</text>

  <!-- loop back from right side of finish box up to diamond -->
  <path d="M400,310 L470,310 L470,162 L332,162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="238" font-size="10" fill="#4a7a3a" filter="url(#rough2)">next_free</text>
  <text x="478" y="252" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= finish</text>

  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    O(n) 单遍历；每位顾客 O(1) 状态更新
  </text>
</svg>
