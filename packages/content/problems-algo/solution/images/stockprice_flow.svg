<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：update 推双堆，查询时校验弹顶</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">三个操作共用同一套数据结构，差异仅在查询时的校验-弹顶循环</text>

  <!-- ===== update 流程（左列） ===== -->
  <rect x="30" y="60" width="160" height="325" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">update(t, p)</text>
  <text x="110" y="96" text-anchor="middle" font-size="9.5" fill="#5a7a4a">O(log n) · 只 push 不删</text>

  <rect x="45" y="110" width="130" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="131" text-anchor="middle" font-size="10.5" fill="#333">ts2price[t] = p</text>

  <path d="M 110 146 L 110 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="162" width="130" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="183" text-anchor="middle" font-size="10.5" fill="#333">maxTs = max(maxTs, t)</text>

  <path d="M 110 188 L 110 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="204" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="10.5" fill="#333">maxHeap.push(p, t)</text>

  <path d="M 110 240 L 110 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="256" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="277" text-anchor="middle" font-size="10.5" fill="#333">minHeap.push(p, t)</text>

  <path d="M 110 292 L 110 304" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="308" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="329" text-anchor="middle" font-size="10.5" fill="#6a4a20" font-weight="bold">旧条目残留堆中</text>
  <text x="110" y="343" text-anchor="middle" font-size="9.5" fill="#6a4a20">不主动删 → 延迟</text>
  <text x="110" y="370" text-anchor="middle" font-size="9" fill="#888">真相由 ts2price 覆盖</text>

  <!-- ===== current（中列上） ===== -->
  <rect x="220" y="60" width="150" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="295" y="82" text-anchor="middle" font-size="13" fill="#2a4a6a" font-weight="bold">current()</text>
  <text x="295" y="96" text-anchor="middle" font-size="9.5" fill="#446688">O(1) · 直接查表</text>

  <rect x="235" y="110" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="295" y="131" text-anchor="middle" font-size="10.5" fill="#333">return ts2price[maxTs]</text>
  <text x="295" y="150" text-anchor="middle" font-size="9.5" fill="#446688">最大时间戳 → 最新价格</text>

  <!-- ===== maximum（中列中） ===== -->
  <rect x="220" y="180" width="150" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="295" y="202" text-anchor="middle" font-size="13" fill="#6a4a20" font-weight="bold">maximum()</text>
  <text x="295" y="216" text-anchor="middle" font-size="9.5" fill="#d6a040">均摊 O(log n) · 校验弹顶</text>

  <!-- diamond: 堆顶有效? -->
  <path d="M 295 230 L 345 254 L 295 278 L 245 254 Z" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="252" text-anchor="middle" font-size="9.5" fill="#333">ts2price[t]</text>
  <text x="295" y="265" text-anchor="middle" font-size="9.5" fill="#333">== p ?</text>

  <!-- yes branch -->
  <path d="M 345 254 L 360 254 L 360 290" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="248" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="320" y="294" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">return p</text>

  <!-- no branch: pop -->
  <path d="M 245 254 L 230 254 L 230 290" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="248" font-size="9" fill="#b85450" font-weight="bold" text-anchor="end">否</text>
  <rect x="190" y="294" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="10" fill="#6a2a2a" font-weight="bold">pop，再判</text>

  <!-- loop arrow back to diamond -->
  <path d="M 230 322 L 230 348 L 295 348 L 295 282" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="362" text-anchor="middle" font-size="9" fill="#b85450">循环弹过时条目</text>

  <!-- ===== minimum（右列） ===== -->
  <rect x="400" y="180" width="150" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="475" y="202" text-anchor="middle" font-size="13" fill="#6a2a2a" font-weight="bold">minimum()</text>
  <text x="475" y="216" text-anchor="middle" font-size="9.5" fill="#b85450">均摊 O(log n) · 对称</text>

  <path d="M 475 230 L 525 254 L 475 278 L 425 254 Z" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="252" text-anchor="middle" font-size="9.5" fill="#333">ts2price[t]</text>
  <text x="475" y="265" text-anchor="middle" font-size="9.5" fill="#333">== p ?</text>

  <path d="M 525 254 L 540 254 L 540 290" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="542" y="248" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="500" y="294" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="540" y="312" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">return p</text>

  <path d="M 425 254 L 410 254 L 410 290" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="248" font-size="9" fill="#b85450" font-weight="bold" text-anchor="end">否</text>
  <rect x="370" y="294" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="312" text-anchor="middle" font-size="10" fill="#6a2a2a" font-weight="bold">pop，再判</text>

  <path d="M 410 322 L 410 348 L 475 348 L 475 282" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="362" text-anchor="middle" font-size="9" fill="#b85450">与 maximum 同构</text>

  <!-- current O(1) note arrow -->
  <path d="M 295 165 L 295 175" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="173" font-size="9.5" fill="#888">两查询共用数据结构</text>
</svg>
