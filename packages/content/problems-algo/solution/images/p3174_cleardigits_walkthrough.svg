<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：每读一个字符后的栈状态（书写顺序 = 栈底→栈顶）</text>

  <!-- ============ Band A: s = "abc" ============ -->
  <text x="40" y="66" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "abc"（示例 1）</text>

  <rect x="157" y="52" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="69" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="223" y="52" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="69" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="289" y="52" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="69" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="138" y="88" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="204" y="88" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a b</text>
  <rect x="270" y="88" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="302" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a b c</text>

  <path d="M 336 101 L 356 101" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="88" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "abc" ✓</text>

  <line x1="40" y1="128" x2="480" y2="128" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ============ Band B: s = "cb34" ============ -->
  <text x="40" y="146" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "cb34"（示例 2）</text>

  <rect x="157" y="132" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="223" y="132" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="289" y="132" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="149" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="355" y="132" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="149" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="138" y="168" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="204" y="168" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c b</text>
  <rect x="270" y="168" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="302" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="336" y="168" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="368" y="185" text-anchor="middle" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">∅</text>

  <text x="302" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹 b</text>
  <text x="368" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹 c</text>

  <path d="M 402 181 L 422 181" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="426" y="168" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ""（空）</text>

  <line x1="40" y1="232" x2="480" y2="232" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ============ Band C: s = "abc12" ============ -->
  <text x="40" y="250" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "abc12"（自造：嵌套配对）</text>

  <rect x="157" y="236" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="253" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="223" y="236" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="253" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="289" y="236" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="253" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="355" y="236" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="253" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="421" y="236" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="434" y="253" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="138" y="272" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="204" y="272" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a b</text>
  <rect x="270" y="272" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="302" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a b c</text>
  <rect x="336" y="272" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="368" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a b</text>
  <rect x="402" y="272" width="64" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="434" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="368" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹 c</text>
  <text x="434" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹 b</text>

  <rect x="150" y="336" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终态栈 = "a" → 返回 "a" ✓</text>

  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">外层 2 嵌套越过已消的 (c,1)：弹的是幸存的 b，不是原串里更近的 c</text>
</svg>
