<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：子序列可排序 + 前缀和单调 → 二分计数</text>

  <!-- ===== Step 1: original nums ===== -->
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① nums = [4, 5, 2, 1]（子序列：可任意删减，顺序无关）</text>
  <g filter="url(#rough2)">
    <rect x="206" y="66" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="228" y="87" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
    <rect x="254" y="66" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="276" y="87" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
    <rect x="302" y="66" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="324" y="87" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <rect x="350" y="66" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="372" y="87" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- arrow down -->
  <path d="M 300 100 L 300 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="113" font-size="11" fill="#888">sort 升序</text>

  <!-- ===== Step 2: sorted ===== -->
  <text x="300" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 排序后取最小 k 个优先（贪心：选最小元素使和最小）</text>
  <g filter="url(#rough2)">
    <rect x="206" y="142" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="228" y="163" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
    <rect x="254" y="142" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="276" y="163" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
    <rect x="302" y="142" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="324" y="163" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
    <rect x="350" y="142" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="372" y="163" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <!-- arrow down -->
  <path d="M 300 176 L 300 194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="189" font-size="11" fill="#888">原地累加 → 前缀和</text>

  <!-- ===== Step 3: prefix sums ===== -->
  <text x="300" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 前缀和 S = [1, 3, 7, 12]（nums[i] ≥ 1 ⇒ 严格递增）</text>
  <!-- monotonic arrow above row -->
  <path d="M 210 222 L 392 222" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="219" text-anchor="middle" font-size="10" fill="#4a7a3a">严格递增 ↑</text>
  <g filter="url(#rough2)">
    <!-- first three: ≤ 10 (green) -->
    <rect x="206" y="228" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="228" y="249" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="254" y="228" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="276" y="249" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="302" y="228" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="324" y="249" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>
    <!-- fourth: > 10 (red) -->
    <rect x="350" y="228" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="372" y="249" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">12</text>
  </g>

  <!-- bracket under the three ≤10 cells -->
  <path d="M 206 262 L 206 270 L 346 270 L 346 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="276" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">和 ≤ 10 共 3 个</text>
  <text x="372" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt; 10</text>

  <!-- query explanation -->
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#333">query q = 10：upper_bound(S, 10) 返回首个 &gt; 10 的下标 <tspan fill="#b85450" font-weight="bold">3</tspan> ⇒ 答案 = <tspan fill="#4a7a3a" font-weight="bold">3</tspan></text>

  <!-- ===== Insight box 1 ===== -->
  <rect x="40" y="324" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="12" fill="#4a7a3a" font-weight="bold">关键一：子序列 ⟹ 顺序无关 ⟹ 可排序</text>
  <text x="56" y="366" font-size="11" fill="#444">"选 k 个元素之和最小"等价于取最小 k 个，与原顺序无关；故可对 nums 升序排序后贪心取前缀。</text>

  <!-- ===== Insight box 2 ===== -->
  <rect x="40" y="392" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="414" font-size="12" fill="#d6a040" font-weight="bold">关键二：nums[i] ≥ 1 ⟹ 前缀和严格递增 ⟹ 二分</text>
  <text x="56" y="434" font-size="11" fill="#444">upper_bound(S, q) = 首个 &gt; q 的下标 = 满足"前缀和 ≤ q"的元素个数，即所求最大长度。</text>
  <text x="56" y="452" font-size="11" fill="#888">⚠️ 若是"子数组"（连续）则不可排序，须改用滑动窗口——审题先分清两者。</text>
</svg>
