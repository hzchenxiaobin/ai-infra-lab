<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：筛选 invoice &gt; 20 → 按月分组计数</text>

  <!-- ===== Left: Orders table with filter ===== -->
  <text x="20" y="50" font-size="10" fill="#888">Orders（10 行）</text>
  <rect x="20" y="56" width="240" height="200" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="72" font-size="9" fill="#446688" font-weight="bold">id  date    cust inv</text>
  <line x1="20" y1="78" x2="260" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: #1 inv=30 ✓ -->
  <text x="30" y="92" font-size="9" fill="#4a7a3a">#1  09-15  c1  30 ✓</text>
  <!-- Row 2: #2 inv=90 ✓ -->
  <text x="30" y="106" font-size="9" fill="#4a7a3a">#2  09-17  c2  90 ✓</text>
  <!-- Row 3: #3 inv=20 ✗ -->
  <text x="30" y="120" font-size="9" fill="#b85450">#3  10-06  c3  20 ✗</text>
  <line x1="28" y1="118" x2="232" y2="118" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <!-- Row 4: #4 inv=21 ✓ -->
  <text x="30" y="134" font-size="9" fill="#4a7a3a">#4  10-20  c3  21 ✓</text>
  <!-- Row 5: #5 inv=10 ✗ -->
  <text x="30" y="148" font-size="9" fill="#b85450">#5  11-10  c1  10 ✗</text>
  <line x1="28" y1="146" x2="232" y2="146" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <!-- Row 6: #6 inv=15 ✗ -->
  <text x="30" y="162" font-size="9" fill="#b85450">#6  11-21  c2  15 ✗</text>
  <line x1="28" y1="160" x2="232" y2="160" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <!-- Row 7: #7 inv=55 ✓ -->
  <text x="30" y="176" font-size="9" fill="#4a7a3a">#7  12-01  c4  55 ✓</text>
  <!-- Row 8: #8 inv=77 ✓ -->
  <text x="30" y="190" font-size="9" fill="#4a7a3a">#8  12-03  c4  77 ✓</text>
  <!-- Row 9: #9 inv=31 ✓ -->
  <text x="30" y="204" font-size="9" fill="#4a7a3a">#9  01-07  c3  31 ✓</text>
  <!-- Row 10: #10 inv=20 ✗ -->
  <text x="30" y="218" font-size="9" fill="#b85450">#10 01-15  c2  20 ✗</text>
  <line x1="28" y1="216" x2="232" y2="216" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="240" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 保留 6 行</text>
  <text x="120" y="240" font-size="9" fill="#b85450">✗ 丢弃 4 行</text>

  <!-- Arrow to right -->
  <path d="M 264 156 L 300 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="150" text-anchor="middle" font-size="8" fill="#888">按月</text>
  <text x="282" y="164" text-anchor="middle" font-size="8" fill="#888">分组</text>

  <!-- ===== Right: Grouped results ===== -->
  <text x="320" y="50" font-size="10" fill="#888">分组聚合结果</text>
  <rect x="320" y="56" width="220" height="200" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="72" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">month   ord  cust</text>
  <line x1="320" y1="78" x2="540" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 2020-09 -->
  <rect x="330" y="84" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="340" y="98" font-size="9" fill="#446688" font-weight="bold">2020-09</text>
  <text x="440" y="98" font-size="9" fill="#4a7a3a">2</text>
  <text x="500" y="98" font-size="9" fill="#4a7a3a">2</text>
  <text x="340" y="108" font-size="8" fill="#888">#1(c1) #2(c2)</text>

  <!-- 2020-10 -->
  <rect x="330" y="116" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="340" y="130" font-size="9" fill="#446688" font-weight="bold">2020-10</text>
  <text x="440" y="130" font-size="9" fill="#4a7a3a">1</text>
  <text x="500" y="130" font-size="9" fill="#4a7a3a">1</text>
  <text x="340" y="140" font-size="8" fill="#888">#4(c3) [#3 丢弃]</text>

  <!-- 2020-11 (missing) -->
  <rect x="330" y="148" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="340" y="164" font-size="9" fill="#b85450">2020-11</text>
  <text x="440" y="164" font-size="9" fill="#b85450">—</text>
  <text x="500" y="164" font-size="9" fill="#b85450">—</text>
  <text x="340" y="172" font-size="8" fill="#888" opacity="0.6">两单均 ≤ 20</text>

  <!-- 2020-12 -->
  <rect x="330" y="176" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="340" y="190" font-size="9" fill="#446688" font-weight="bold">2020-12</text>
  <text x="440" y="190" font-size="9" fill="#4a7a3a">2</text>
  <text x="500" y="190" font-size="9" fill="#4a7a3a">1</text>
  <text x="340" y="200" font-size="8" fill="#888">#7(c4) #8(c4) → DISTINCT</text>

  <!-- 2021-01 -->
  <rect x="330" y="208" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="340" y="222" font-size="9" fill="#446688" font-weight="bold">2021-01</text>
  <text x="440" y="222" font-size="9" fill="#4a7a3a">1</text>
  <text x="500" y="222" font-size="9" fill="#4a7a3a">1</text>
  <text x="340" y="232" font-size="8" fill="#888">#9(c3) [#10 丢弃]</text>

  <text x="430" y="250" text-anchor="middle" font-size="8" fill="#888">ord = COUNT(order_id)</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="280" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：WHERE 先过滤行 → GROUP BY 按月折叠 → COUNT / COUNT(DISTINCT)</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666">2020-12 的 #7 #8 同为 c4 → order_count=2 但 customer_count=1（DISTINCT 去重）</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#666">2020-11 全部被 WHERE 丢弃 → 该月不出现（无分组）</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="346" width="180" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="360" font-size="9" fill="#4a7a3a">✓ invoice &gt; 20（保留）</text>
  <text x="50" y="374" font-size="9" fill="#b85450">✗ invoice ≤ 20（丢弃）</text>

  <rect x="240" y="346" width="280" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="250" y="360" font-size="9" fill="#4a7a3a">order_count = COUNT(order_id)</text>
  <text x="250" y="374" font-size="9" fill="#446688">customer_count = COUNT(DISTINCT customer_id)</text>
</svg>
