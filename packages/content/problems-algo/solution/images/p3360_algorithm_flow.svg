<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：k 递减 + 换手标志，至多 10 轮</text>

  <!-- 开始 -->
  <rect x="175" y="44" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始：k = 10，alice = true</text>
  <path d="M 260 78 L 260 106" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,110 350,152 260,194 170,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">剩余 n ≥ k ？</text>
  <text x="260" y="164" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（这一手移得动吗）</text>

  <!-- 是：向下 -->
  <text x="272" y="212" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 194 L 260 228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="150" y="232" width="220" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">n −= k；k −= 1</text>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">alice = !alice（换手）</text>

  <!-- 回边 -->
  <path d="M 370 259 L 430 259 L 430 152 L 356 152" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="438" y="146" font-size="9" fill="#666" filter="url(#rough2)">下一手</text>

  <!-- 否：向左 -->
  <text x="152" y="146" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 170 152 L 100 152 L 100 318 L 116 318" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="240" font-size="9" fill="#b85450" filter="url(#rough2)">移</text>
  <text x="88" y="252" font-size="9" fill="#b85450" filter="url(#rough2)">不</text>
  <text x="88" y="264" font-size="9" fill="#b85450" filter="url(#rough2)">动</text>

  <!-- 返回 -->
  <rect x="120" y="292" width="290" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="312" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 !alice</text>
  <text x="265" y="330" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">此时 alice 标记的是移不动的玩家：是 Bob → Alice 赢</text>

  <!-- 底注 -->
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">k 每轮严格减 1（10 → 9 → …），n ≤ 50 &lt; 55 = 10+9+…+1 ⇒ 至多 10 轮必退出</text>
</svg>
