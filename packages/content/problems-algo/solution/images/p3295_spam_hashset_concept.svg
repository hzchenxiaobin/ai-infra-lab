<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心概念：黑名单建集合，消息逐词查询计数</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 1：bannedWords = [world, hello]，message = [hello, world, leetcode]</text>

  <!-- 左：bannedWords -->
  <text x="80" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bannedWords</text>
  <rect x="38" y="82" width="84" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="99" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">"world"</text>
  <rect x="38" y="122" width="84" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">"hello"</text>
  <path d="M 124 95 Q 148 95 168 116" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 124 135 Q 148 135 168 143" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="147" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">插入 ×m</text>

  <!-- 中：哈希集合 -->
  <rect x="172" y="78" width="152" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">哈希集合 bannedSet</text>
  <rect x="190" y="110" width="116" height="24" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="126" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">"world"</text>
  <rect x="190" y="142" width="116" height="24" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="158" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">"hello"</text>
  <text x="248" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">成员查询平均 O(1)</text>

  <!-- 右：message 逐词查询 -->
  <text x="426" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">message（逐词查询）</text>
  <rect x="382" y="82" width="88" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">"hello" ✓</text>
  <rect x="382" y="122" width="88" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="139" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">"world" ✓</text>
  <rect x="382" y="162" width="88" height="26" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="179" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">"leetcode" ✗</text>
  <path d="M 380 95 Q 352 95 332 114" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 380 135 Q 352 135 332 147" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 380 175 Q 352 175 332 176" fill="none" stroke="#999999" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="353" y="166" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">查询 ×n</text>

  <!-- 命中计数链 -->
  <rect x="40" y="240" width="115" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="261" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">hello ✓ → cnt=1</text>
  <path d="M 157 257 L 178 257" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="182" y="240" width="115" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="261" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">world ✓ → cnt=2</text>
  <path d="M 299 257 L 316 257" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="356,236 392,257 356,278 320,257" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="261" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt≥2?</text>
  <path d="M 394 257 L 410 257" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="414" y="240" width="82" height="34" rx="7" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="254" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">true</text>
  <text x="455" y="268" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">(垃圾信息)</text>

  <!-- 底部要点框 -->
  <rect x="40" y="296" width="460" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">暴力逐词比对黑名单是 O(n·m) ≈ 10^10 次比较，必超时；集合把单次查询压到平均 O(1)</text>
  <text x="270" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">计数按出现位置：同一个单词命中两次也计 2 次；第 2 次命中可当场返回</text>
</svg>
