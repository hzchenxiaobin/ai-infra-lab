<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：91 合法指示 0/1 → 639 合法方式数 m₁ / m₂</text>

  <!-- 91 (左) -->
  <rect x="30" y="56" width="230" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="145" y="78" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">91 解码方法</text>
  <text x="145" y="100" text-anchor="middle" font-size="11.5" fill="#333">f[i] = [1位合法]·f[i−1]</text>
  <text x="145" y="118" text-anchor="middle" font-size="11.5" fill="#333">     + [2位合法]·f[i−2]</text>
  <text x="145" y="140" text-anchor="middle" font-size="10.5" fill="#888">系数只有 0 或 1（布尔合法性）</text>

  <!-- 箭头 -->
  <path d="M 262 104 L 298 104" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">加 '*'</text>
  <text x="280" y="118" text-anchor="middle" font-size="9.5" fill="#b85450">通配符</text>

  <!-- 639 (右) -->
  <rect x="300" y="56" width="230" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="78" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">639 解码方法 II</text>
  <text x="415" y="100" text-anchor="middle" font-size="11.5" fill="#333">f[i] = m₁·f[i−1]</text>
  <text x="415" y="118" text-anchor="middle" font-size="11.5" fill="#333">     + m₂·f[i−2]</text>
  <text x="415" y="140" text-anchor="middle" font-size="10.5" fill="#888">系数 = 合法方式数（0..15）</text>

  <!-- '*' 展开说明 -->
  <rect x="30" y="178" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">'*' 通配符的展开</text>
  <text x="280" y="220" text-anchor="middle" font-size="11.5" fill="#333">'*' → { '1', '2', …, '9' }  共 9 种（⚠ 不含 '0'）</text>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" fill="#888">单字符 '*' 有 9 种解码；双字符按 (十位, 个位) 组合计数</text>

  <!-- 单字符 m1 -->
  <rect x="30" y="256" width="240" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="276" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">单字符系数 m₁(c₁)</text>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#333">c₁='0' → 0</text>
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#333">c₁='1'..'9' → 1</text>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c₁='*' → 9</text>

  <!-- 双字符 m2 -->
  <rect x="290" y="256" width="240" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="276" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">双字符系数 m₂(c₂,c₁)</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#333">十位 d₂ ∈ {1,2} 才合法</text>
  <text x="410" y="312" text-anchor="middle" font-size="11" fill="#333">值 10d₂+d₁ ∈ [10,26]</text>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c₂='*' 行 = '1'行 + '2'行</text>

  <!-- 底部递推 -->
  <rect x="30" y="360" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">状态转移（全程 mod 10⁹+7）</text>
  <text x="280" y="402" text-anchor="middle" font-size="11.5" fill="#333">f[i] = m₁(s[i−1])·f[i−1] + m₂(s[i−2], s[i−1])·f[i−2]</text>

  <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#888">f[0]=1 种子；'*' 多可能性全吸收进 m₁、m₂，递推结构不变</text>
</svg>
