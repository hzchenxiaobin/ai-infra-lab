<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：grid = [[0,0,0],[1,1,0],[1,1,0]]</text>
  <path d="M 220 34 Q 380 42 540 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 1: dist=1, queue=[(0,0,1)] ===== -->
  <text x="110" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">dist = 1</text>
  <g filter="url(#rough2)" font-size="14">
    <!-- 3x3 grid, cell=44, origin (40, 70) -->
    <rect x="40" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/><text x="62" y="98" text-anchor="middle" fill="#b03a3a" font-weight="bold">0*</text>
    <rect x="84" y="70" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="106" y="98" text-anchor="middle" fill="#888">0</text>
    <rect x="128" y="70" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="150" y="98" text-anchor="middle" fill="#888">0</text>
    <rect x="40" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="62" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="84" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="106" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="128" y="114" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="150" y="142" text-anchor="middle" fill="#888">0</text>
    <rect x="40" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="62" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="84" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="106" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="128" y="158" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="150" y="186" text-anchor="middle" fill="#888">0</text>
  </g>
  <text x="106" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">弹出 (0,0,dist=1)</text>
  <text x="106" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">标记 0* 为已访问</text>

  <!-- arrow -->
  <path d="M 188 128 L 238 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: dist=2, explore neighbors of (0,0) ===== -->
  <text x="320" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">dist = 2</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="250" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="272" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="294" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="316" y="98" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="338" y="70" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="360" y="98" text-anchor="middle" fill="#888">0</text>
    <rect x="250" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="272" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="294" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="316" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="338" y="114" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="360" y="142" text-anchor="middle" fill="#888">0</text>
    <rect x="250" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="272" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="294" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="316" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="338" y="158" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="360" y="186" text-anchor="middle" fill="#888">0</text>
  </g>
  <text x="316" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,0) 的 8 邻居：</text>
  <text x="316" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(0,1)=0 入队，(1,0)/(1,1)=1 跳过</text>

  <!-- arrow -->
  <path d="M 398 128 L 448 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: dist=3 ===== -->
  <text x="530" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">dist = 3</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="460" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="482" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="504" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="526" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="548" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="570" y="98" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="460" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="482" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="504" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="526" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="548" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="570" y="142" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <rect x="460" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="482" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="504" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="526" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="548" y="158" width="44" height="44" fill="#fff" stroke="#bbb"/><text x="570" y="186" text-anchor="middle" fill="#888">0</text>
  </g>
  <text x="570" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,1) 的 8 邻居：</text>
  <text x="570" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,2)=0、(1,2)=0 入队（dist=3）</text>

  <!-- arrow -->
  <path d="M 608 128 L 648 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: dist=4, reach end ===== -->
  <text x="695" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">dist = 4 ✓</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="640" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="662" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="684" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="706" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="728" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="750" y="98" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="640" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="662" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="684" y="114" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="526" y="142" text-anchor="middle" fill="#888">1</text>
    <rect x="728" y="114" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="750" y="142" text-anchor="middle" fill="#b03a3a">0*</text>
    <rect x="640" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="662" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="684" y="158" width="44" height="44" fill="#eee" stroke="#bbb"/><text x="706" y="186" text-anchor="middle" fill="#888">1</text>
    <rect x="728" y="158" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/><text x="750" y="186" text-anchor="middle" fill="#b03a3a" font-weight="bold">0!</text>
  </g>
  <text x="695" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">从 (0,2)/(1,2) 扩展</text>
  <text x="695" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2,2) 入队 dist=4 = 终点</text>

  <!-- ===== Bottom: path summary ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="260" width="680" height="140" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最短路径还原</text>

  <!-- path cells -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="80" y="302" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="120" y="323" text-anchor="middle" fill="#b03a3a" font-weight="bold">(0,0)</text>

    <path d="M 162 318 L 198 318" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <rect x="200" y="302" width="80" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="323" text-anchor="middle" fill="#333" font-weight="bold">(0,1)</text>

    <path d="M 282 318 L 318 318" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <rect x="320" y="302" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="360" y="323" text-anchor="middle" fill="#2e6e2e" font-weight="bold">(1,2)</text>

    <path d="M 402 318 L 438 318" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <rect x="440" y="302" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="480" y="323" text-anchor="middle" fill="#b03a3a" font-weight="bold">(2,2)</text>
  </g>

  <text x="380" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4 格 = 路径长度 4（8 方向 BFS 第 4 层到达终点）</text>
  <text x="380" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键：(0,1)→(1,2) 是对角移动，4 方向 BFS 会漏掉这条路径！</text>
</svg>
