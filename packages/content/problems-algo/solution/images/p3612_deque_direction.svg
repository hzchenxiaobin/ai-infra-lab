<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：result = 双端队列 D + 方向标记 rev</text>

  <!-- 左：双端队列与两种读法 -->
  <text x="122" y="46" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rev = false：正读 → "aab"</text>
  <path d="M 46 58 L 196 58" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="54" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="124" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="172" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="50" y="62" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">front</text>
  <text x="198" y="62" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">back</text>

  <path d="M 198 114 L 48 114" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="122" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">rev = true：逆读 → "baa"</text>

  <!-- 右：两条洞察 -->
  <rect x="250" y="44" width="255" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="377" y="62" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">'%' ⇒ 只翻转 rev 标记（O(1)）</text>
  <text x="377" y="78" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">D 一字不动——反转推迟到读取时兑现</text>

  <rect x="250" y="96" width="255" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="377" y="113" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">'#' ⇒ D := D + D，与 rev 无关</text>
  <text x="377" y="129" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">正序翻倍与逆序翻倍是同一个 D</text>

  <!-- 恒等式条 -->
  <rect x="30" y="148" width="460" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">恒等式 reverse(A+B) = reverse(B)+reverse(A)　⇒　reverse(D+D) = reverse(D)+reverse(D)</text>

  <!-- 操作映射表 -->
  <rect x="30" y="192" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="192" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="192" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="205" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">rev = false</text>
  <text x="395" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">rev = true</text>

  <rect x="30" y="220" width="80" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="220" width="190" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="220" width="190" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">字母 c</text>
  <text x="205" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">push_back(c)</text>
  <text x="395" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">push_front(c)</text>

  <rect x="30" y="252" width="80" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="252" width="190" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="252" width="190" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'*'</text>
  <text x="205" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pop_back()（空则跳过）</text>
  <text x="395" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pop_front()（空则跳过）</text>

  <rect x="30" y="284" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="110" y="284" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="300" y="284" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'#'</text>
  <text x="205" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">D := D + D</text>
  <text x="395" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">D := D + D（相同！）</text>

  <rect x="30" y="316" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="110" y="316" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="300" y="316" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'%'</text>
  <text x="205" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rev ← true</text>
  <text x="395" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rev ← false</text>
</svg>
