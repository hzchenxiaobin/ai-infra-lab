<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：按乘积给数对分组，同组任取两对 × 4 种排列</text>

  <!-- ===== Section A: tuple definition ===== -->
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">元组 (a,b,c,d)：a·b = c·d，且 a,b,c,d 四数互异</text>

  <!-- pair A: 2 x 6 -->
  <g filter="url(#rough2)">
    <rect x="60" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="80" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <text x="108" y="92" font-size="13" fill="#555" font-weight="bold">×</text>
    <rect x="118" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="138" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  </g>
  <text x="172" y="92" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 12</text>

  <!-- pair B: 3 x 4 -->
  <g filter="url(#rough2)">
    <rect x="240" y="72" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="260" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="288" y="92" font-size="13" fill="#555" font-weight="bold">×</text>
    <rect x="298" y="72" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="318" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="352" y="92" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 12</text>

  <!-- equality bracket -->
  <text x="200" y="92" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒</text>
  <text x="430" y="92" font-size="11" fill="#888" filter="url(#rough2)">同乘积 ⇒ 可凑成元组</text>

  <!-- ===== Section B: group pairs by product ===== -->
  <text x="40" y="128" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">数组 nums = [2,3,4,6]</text>

  <!-- pair list -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="40" y="150">枚举 i&lt;j 的数对：</text>
    <text x="40" y="166">(2,3)→6   (2,4)→8   (2,6)→12</text>
    <text x="40" y="182">(3,4)→12  (3,6)→18  (4,6)→24</text>
  </g>

  <!-- arrow to freq map -->
  <path d="M 200 174 L 240 174" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- freq map -->
  <rect x="244" y="140" width="160" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="324" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">freq：乘积 → 数对数</text>
  <line x1="256" y1="164" x2="392" y2="164" stroke="#e8d090" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="256" y="178">6:1   8:1</text>
    <text x="256" y="194" fill="#b85450" font-weight="bold">12:2  ← 命中</text>
    <text x="256" y="210">18:1  24:1</text>
  </g>

  <!-- key insight callout -->
  <rect x="420" y="140" width="124" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="158" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键观察：</text>
  <text x="432" y="174" font-size="9" fill="#555" filter="url(#rough2)">元素互异 ⇒ 同积</text>
  <text x="432" y="186" font-size="9" fill="#555" filter="url(#rough2)">两对必不相交</text>
  <text x="432" y="200" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 四下标天然互异</text>

  <!-- ===== Section C: counting formula ===== -->
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">计数公式：freq = c 时，贡献 4·c·(c−1)</text>

  <!-- step 1: choose ordered 2 pairs -->
  <rect x="40" y="260" width="220" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="280" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 选有序两对 (A, B)</text>
  <line x1="52" y1="286" x2="248" y2="286" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="302" font-size="10" fill="#555" filter="url(#rough2)">A 作 (i,j)，B 作 (k,l)</text>
  <text x="52" y="318" font-size="10" fill="#555" filter="url(#rough2)">同积 c 对中选有序 2 对：</text>
  <text x="52" y="332" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">c·(c−1) 种</text>

  <!-- arrow right -->
  <path d="M 262 300 L 300 300" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: intra-pair swaps -->
  <rect x="304" y="260" width="220" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="316" y="280" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 每对内可交换</text>
  <line x1="316" y1="286" x2="512" y2="286" stroke="#e8d090" stroke-width="1" filter="url(#rough2)"/>
  <text x="316" y="302" font-size="10" fill="#555" filter="url(#rough2)">(i,j) 或 (j,i)：2 种</text>
  <text x="316" y="318" font-size="10" fill="#555" filter="url(#rough2)">(k,l) 或 (l,k)：2 种</text>
  <text x="316" y="332" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 × 2 = 4 种</text>

  <!-- arrow down merge -->
  <path d="M 150 342 L 150 362" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 342 L 414 362" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result formula -->
  <rect x="40" y="366" width="484" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="282" y="386" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">每组贡献 = 4·c·(c−1)，答案 = Σ_p 4·freq[p]·(freq[p]−1)</text>
  <text x="282" y="402" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c=2 ⇒ 4·2·1 = 8 个元组（与示例 1 吻合）</text>

  <!-- footer -->
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有序选两对保证 (A,B) 与 (B,A) 各算一次 → 元组按位置计数不重不漏</text>
  <text x="280" y="450" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">时间 O(n²) 枚举数对 + O(数对数) 求和；空间 O(数对数)</text>
</svg>
