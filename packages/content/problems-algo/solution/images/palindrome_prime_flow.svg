<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：生成奇数位回文 + 试除判质数</text>

  <rect x="40" y="46" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#b85450" font-weight="bold">步骤 1：特判 8 ≤ n ≤ 11</text>
  <text x="60" y="84" font-size="11" fill="#444">偶数位回文中唯一的质数是 11，直接返回 11</text>
  <text x="60" y="98" font-size="10" fill="#888">例：n=8 → 11；n=9 → 11；n=10 → 11；n=11 → 11</text>

  <path d="M 280 106 L 280 126" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="130" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="150" font-size="12" fill="#446688" font-weight="bold">步骤 2：枚举 root = 1, 2, 3, …</text>
  <text x="60" y="168" font-size="11" fill="#444" font-family="monospace">s = str(root)</text>
  <text x="60" y="182" font-size="11" fill="#444" font-family="monospace">p = int(s + s[:-1][::-1])    # 生成奇数位回文</text>

  <path d="M 280 190 L 280 210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="214" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">p ≥ n 且 isPrime(p)？</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#888">试除到 √p 判质数</text>

  <path d="M 460 236 L 500 236" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="505" y="254" font-size="10" fill="#888">→ 返回 p</text>

  <path d="M 280 258 L 280 278 L 120 278 L 120 130" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="272" font-size="11" fill="#b85450" font-weight="bold">否 → root+1 继续</text>

  <rect x="40" y="296" width="480" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="316" font-size="12" fill="#4a7a3a" font-weight="bold">isPrime(x)：试除法</text>
  <text x="60" y="334" font-size="11" fill="#444" font-family="monospace">if x &lt; 2: return False</text>
  <text x="60" y="350" font-size="11" fill="#444" font-family="monospace">for i in range(2, int(sqrt(x))+1):</text>
  <text x="80" y="366" font-size="11" fill="#444" font-family="monospace">if x % i == 0: return False</text>

  <rect x="40" y="390" width="480" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="60" y="410" font-size="11" fill="#888" font-weight="bold">关键剪枝：</text>
  <text x="60" y="426" font-size="11" fill="#444">① 跳过所有偶数位回文（必被 11 整除） ② 只需枚举 root 到 10⁵（生成 9 位回文覆盖 2×10⁸）</text>
  <text x="60" y="438" font-size="10" fill="#888">root 枚举量 ≈ 10⁵，每次判质数 O(√p) ≈ 10⁴，总操作量可控</text>
</svg>
