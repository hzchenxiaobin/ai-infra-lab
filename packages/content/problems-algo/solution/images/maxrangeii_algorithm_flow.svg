<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">算法流程：空隙切分 + 逐段二分 cnt（取最小批量计数）</text>

  <!-- 1. preprocess -->
  <rect x="150" y="44" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序 banned、去重、仅留 ∈ [1, n]</text>
  <text x="270" y="78" text-anchor="middle" font-size="10" fill="#446688">末尾追加哨兵 n+1，统一处理末段空隙</text>
  <line x1="270" y1="86" x2="270" y2="104" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. init -->
  <rect x="150" y="106" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left ← 1, ans ← 0, rem ← maxSum</text>
  <line x1="270" y1="140" x2="270" y2="158" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. loop header -->
  <rect x="150" y="160" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对每个 x ∈ banned（含哨兵）：</text>
  <line x1="270" y1="194" x2="270" y2="210" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. gap extraction -->
  <rect x="150" y="212" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">空隙 [left, x−1]，段长 sz = x − left</text>
  <line x1="270" y1="246" x2="270" y2="262" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. decision: L > rem? -->
  <polygon points="270,264 360,296 270,328 180,296" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left &gt; rem ?</text>
  <!-- yes -> break right -->
  <line x1="360" y1="296" x2="440" y2="296" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="282" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="483" y="301" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">break（终止）</text>
  <!-- no -> down -->
  <line x1="270" y1="328" x2="270" y2="346" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="342" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 6. binary search cnt -->
  <rect x="120" y="348" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">二分最大 cnt ∈ [0, sz]：</text>
  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt·(2·left + cnt − 1)/2 ≤ rem</text>
  <line x1="270" y1="388" x2="270" y2="404" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. update -->
  <rect x="120" y="406" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans += cnt；rem −= sum；left ← x+1</text>

  <!-- 8. decision: cnt < sz ? loop vs break -->
  <line x1="120" y1="423" x2="60" y2="423" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="423" x2="60" y2="178" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="178" x2="148" y2="178" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="300" font-size="9.5" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 64 300)">cnt == sz：整段取完，回循环取下一段</text>

  <line x1="420" y1="423" x2="470" y2="423" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="416" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt &lt; sz</text>
  <rect x="470" y="409" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="498" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">break</text>

  <!-- return -->
  <rect x="150" y="452" width="240" height="0" fill="none"/>
  <text x="270" y="464" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>
</svg>
