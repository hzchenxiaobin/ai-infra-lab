<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二叉树最长连续序列：父→子 val 每步 +1，绿色路径 3→4→5 长度 3</text>

  <!-- 边（先画，后被节点覆盖端点） -->
  <!-- 1 -> 3 断：3 != 1+1 -->
  <line x1="184" y1="92" x2="316" y2="152" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="232" y="118" font-size="10" fill="#b85450" font-weight="bold">3≠2 断</text>

  <!-- 3 -> 2 断：2 != 3+1 -->
  <line x1="318" y1="168" x2="262" y2="220" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="262" y="200" font-size="10" fill="#b85450" font-weight="bold">2≠4 断</text>

  <!-- 3 -> 4 续接：4 == 3+1 -->
  <line x1="344" y1="168" x2="391" y2="220" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="356" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">4=3+1 ✓</text>

  <!-- 4 -> 5 续接：5 == 4+1 -->
  <line x1="419" y1="256" x2="461" y2="298" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="448" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">5=4+1 ✓</text>

  <!-- 节点 1（中性，streak 起点） -->
  <circle cx="170" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="148" y="74" font-size="10" fill="#888">len=1</text>

  <!-- 节点 3（绿，新 streak 起点） -->
  <circle cx="330" cy="160" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="308" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">len=1</text>

  <!-- 节点 2（中性，断后重置） -->
  <circle cx="255" cy="230" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="234" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="236" y="226" font-size="9" fill="#888">len=1</text>

  <!-- 节点 4（绿，续接） -->
  <circle cx="405" cy="230" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="425" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">len=2</text>

  <!-- 节点 5（绿，续接） -->
  <circle cx="470" cy="310" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="470" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="490" y="306" font-size="10" fill="#4a7a3a" font-weight="bold">len=3</text>

  <!-- streak 标注 -->
  <rect x="430" y="160" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">streak = 3</text>

  <!-- 说明框 -->
  <rect x="40" y="348" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11" fill="#555">续接：node.val == parentVal + 1 → length += 1（绿色 3→4→5）</text>
  <text x="60" y="384" font-size="11" fill="#b85450">重置：否则 → length = 1（红色虚线 1→3、3→2，streak 归 1 重开）</text>
</svg>
