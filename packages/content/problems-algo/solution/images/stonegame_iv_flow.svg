<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：博弈型 DP（枚举平方数找对手必败态）</text>

  <!-- 1. 初始化 -->
  <rect x="30" y="50" width="130" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="95" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#333">dp[0] = false</text>
  <text x="95" y="96" text-anchor="middle" font-size="9.5" fill="#888">预计算 squares 表</text>

  <path d="M 160 76 L 196 76" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 外层循环 i -->
  <polygon points="280,50 380,76 280,102 180,76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i ≤ n ?</text>
  <text x="280" y="88" text-anchor="middle" font-size="10" fill="#888">for i = 1..n</text>

  <!-- no → return -->
  <path d="M 380 76 L 470 76" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="68" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="56" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="507" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>
  <text x="507" y="89" text-anchor="middle" font-size="11" fill="#333">dp[n]</text>

  <!-- yes → 内层枚举平方数 -->
  <path d="M 280 102 L 280 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="120" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 3. 枚举平方数 k² -->
  <polygon points="390,128 470,158 390,188 310,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="155" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">还有 k² ?</text>
  <text x="390" y="172" text-anchor="middle" font-size="9.5" fill="#888">k² ≤ i, k=1,2,…</text>

  <!-- no 平方数用尽 → dp[i]=false -->
  <path d="M 470 158 L 510 158 L 510 226 L 470 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="486" y="150" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="350" y="206" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i] = false</text>
  <text x="410" y="240" text-anchor="middle" font-size="9.5" fill="#888">无路可走，我负</text>

  <!-- yes 平方数 → 判断 dp[i−k²] -->
  <path d="M 310 158 L 230 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 4. 判 dp[i−k²] -->
  <polygon points="230,128 310,158 230,188 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">dp[i−k²]==false ?</text>
  <text x="230" y="172" text-anchor="middle" font-size="9.5" fill="#888">对手是否必败</text>

  <!-- yes → dp[i]=true -->
  <path d="M 150 158 L 110 158 L 110 226 L 150 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="206" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[i] = true ⭐</text>
  <text x="105" y="240" text-anchor="middle" font-size="9.5" fill="#888">甩必败态给对手，我胜</text>

  <!-- no → 试下一个平方数（回枚举） -->
  <path d="M 230 188 L 230 250 L 390 250 L 390 188" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="266" text-anchor="middle" font-size="9.5" fill="#888">否：换下一个 k² 继续试</text>

  <!-- i++ 回外层 -->
  <path d="M 95 258 L 95 300 L 280 300 L 280 102" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="294" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i++，处理下一格</text>

  <!-- ===== 底部对照条 ===== -->
  <rect x="30" y="312" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">状态定义：dp[i] = 面对 i 颗石子的玩家是否必胜</text>
  <text x="50" y="350" font-size="10.5" fill="#333">转移：dp[i] = ∃ 平方数 k²≤i 使 dp[i−k²] == false（存在性 OR，找到即停）。基例 dp[0]=false（无石子即输）。</text>
  <text x="50" y="364" font-size="10.5" fill="#b85450" font-weight="bold">⇒ 平方数集「不规则」，无奇偶/同余不变量，必须老老实实 DP（与 1025/292 不同）</text>
</svg>
