<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">三示例演算：for...in 命中首个属性即短路返回</text>

  <!-- ===== Example 1: {} ===== -->
  <text x="30" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① obj = {}</text>

  <rect x="30" y="64" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">{ }</text>

  <path d="M 100 81 L 130 81" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="74" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">for...in</text>

  <rect x="135" y="64" width="120" height="34" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">无可枚举属性</text>

  <path d="M 260 81 L 290 81" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="276" y="74" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">不进入</text>

  <rect x="295" y="64" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="345" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true ✓</text>

  <text x="410" y="86" font-size="10" fill="#4a7a3a" filter="url(#rough2)">空对象 → 0 个键</text>

  <!-- ===== Example 2: {"x":5,"y":42} ===== -->
  <text x="30" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② obj = {"x":5,"y":42}</text>

  <!-- key x: hit (red), key y: skipped (grey) -->
  <rect x="30" y="134" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x:5</text>
  <rect x="84" y="134" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="156" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">y:42</text>
  <line x1="88" y1="162" x2="130" y2="162" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- hit arrow to x -->
  <path d="M 55 168 L 55 134" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="140" y="148" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 命中 x</text>
  <text x="140" y="162" font-size="9" fill="#bbb" filter="url(#rough2)">y 未触及</text>

  <path d="M 145 151 L 290 151" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="295" y="134" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="345" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <text x="410" y="156" font-size="10" fill="#b85450" filter="url(#rough2)">首键即退，O(1)</text>

  <!-- ===== Example 3: [null, false, 0] ===== -->
  <text x="30" y="198" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ obj = [null, false, 0]</text>

  <!-- three falsy elements, index 0 hit -->
  <rect x="30" y="204" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="219" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">索引 0</text>
  <text x="58" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">null</text>

  <rect x="90" y="204" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="219" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">索引 1</text>
  <text x="118" y="232" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">false</text>

  <rect x="150" y="204" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="219" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">索引 2</text>
  <text x="178" y="232" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- hit arrow to index 0 -->
  <path d="M 58 238 L 58 204" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="210" y="218" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 命中 "0"</text>
  <text x="210" y="232" font-size="9" fill="#bbb" filter="url(#rough2)">1、2 未触及</text>

  <path d="M 220 221 L 290 221" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="295" y="204" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="345" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <text x="410" y="218" font-size="10" fill="#b85450" filter="url(#rough2)">假值仍是元素</text>
  <text x="410" y="232" font-size="10" fill="#888" filter="url(#rough2)">空性看计数非真假</text>

  <!-- ===== summary box ===== -->
  <rect x="40" y="260" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="284" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">关键结论</text>
  <text x="60" y="304" font-size="11" fill="#555" filter="url(#rough2)">• for...in 命中第一个可枚举属性即 return false，数组枚举的是索引串 "0"</text>
  <text x="60" y="322" font-size="11" fill="#555" filter="url(#rough2)">• 空判定看「键/元素个数是否为 0」，与值的真假无关（null/false/0 仍是元素）</text>
  <text x="60" y="338" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三条均 O(1)：① 不进循环 ② 命中 x 退出 ③ 命中 "0" 退出</text>
</svg>
