<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">插入区间：三阶段线性扫描</text>
  <path d="M 220 36 Q 380 44 540 36" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== Number line with intervals ===== -->
  <text x="50" y="68" font-size="11" fill="#888" font-weight="bold">原始区间（已排序、不重叠）+ 新区间 [4,8]</text>

  <!-- Phase background zones -->
  <g filter="url(#rough2)">
    <rect x="50" y="80" width="150" height="44" fill="#e6f4ea" stroke="none" opacity="0.5"/>
    <rect x="200" y="80" width="260" height="44" fill="#fff8e1" stroke="none" opacity="0.5"/>
    <rect x="460" y="80" width="250" height="44" fill="#e6f4ea" stroke="none" opacity="0.5"/>
  </g>

  <!-- Phase labels -->
  <text x="125" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① 左侧（跳过）</text>
  <text x="330" y="76" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② 中间（合并）</text>
  <text x="585" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ 右侧（拷贝）</text>

  <!-- number line -->
  <g filter="url(#rough2)">
    <line x1="50" y1="118" x2="710" y2="118" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="9" fill="#999">
    <text x="50" y="132">0</text>
    <text x="170" y="132">4</text>
    <text x="290" y="132">8</text>
    <text x="410" y="132">12</text>
    <text x="530" y="132">16</text>
    <text x="650" y="132">20</text>
  </g>

  <!-- Original intervals as bars -->
  <g font-size="10">
    <!-- [1,2] - phase 1 -->
    <g filter="url(#rough2)"><rect x="62" y="90" width="30" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
    <text x="77" y="104" text-anchor="middle" fill="#446688">[1,2]</text>

    <!-- [3,5] - phase 2 -->
    <g filter="url(#rough2)"><rect x="170" y="90" width="60" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="200" y="104" text-anchor="middle" fill="#b85450">[3,5]</text>

    <!-- [6,7] - phase 2 -->
    <g filter="url(#rough2)"><rect x="260" y="90" width="30" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="275" y="104" text-anchor="middle" fill="#b85450">[6,7]</text>

    <!-- [8,10] - phase 2 -->
    <g filter="url(#rough2)"><rect x="290" y="90" width="60" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="320" y="104" text-anchor="middle" fill="#b85450">[8,10]</text>

    <!-- [12,16] - phase 3 -->
    <g filter="url(#rough2)"><rect x="410" y="90" width="120" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
    <text x="470" y="104" text-anchor="middle" fill="#446688">[12,16]</text>
  </g>

  <!-- New interval highlighted -->
  <g filter="url(#rough2)">
    <rect x="170" y="150" width="180" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6,3"/>
  </g>
  <text x="260" y="167" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">newInterval = [4,8]</text>

  <!-- arrow down from new interval to merge zone -->
  <path d="M 260 176 L 260 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <text x="50" y="210" font-size="11" fill="#888" font-weight="bold">合并结果</text>

  <!-- number line for result -->
  <g filter="url(#rough2)">
    <line x1="50" y1="228" x2="710" y2="228" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- Result intervals -->
  <g font-size="10">
    <!-- [1,2] copied -->
    <g filter="url(#rough2)"><rect x="62" y="200" width="30" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="77" y="214" text-anchor="middle" fill="#446688">[1,2]</text>

    <!-- [3,10] merged -->
    <g filter="url(#rough2)"><rect x="170" y="200" width="180" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
    <text x="260" y="214" text-anchor="middle" fill="#d6a040" font-weight="bold">[3,10] ← 合并</text>

    <!-- [12,16] copied -->
    <g filter="url(#rough2)"><rect x="410" y="200" width="120" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="470" y="214" text-anchor="middle" fill="#446688">[12,16]</text>
  </g>

  <!-- ===== Decision logic box ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="250" width="660" height="170" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="380" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">三阶段判定逻辑（intervals[i] = [a, b]，新区间 [ns, ne]）</text>

  <g font-size="11">
    <!-- Phase 1 -->
    <g filter="url(#rough2)"><rect x="70" y="286" width="200" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="82" y="308" fill="#2e6e2e" font-weight="bold">① b &lt; ns → 直接加入结果</text>

    <!-- Phase 2 -->
    <g filter="url(#rough2)"><rect x="280" y="286" width="200" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
    <text x="292" y="300" fill="#7a5415" font-weight="bold">② a ≤ ne → 重叠，合并</text>
    <text x="292" y="314" fill="#7a5415" font-size="10">ns=min, ne=max</text>

    <!-- Phase 3 -->
    <g filter="url(#rough2)"><rect x="490" y="286" width="200" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="502" y="308" fill="#2e6e2e" font-weight="bold">③ a &gt; ne → 直接加入结果</text>

    <!-- Key notes -->
    <text x="70" y="346" fill="#888" font-size="10">阶段①用 &lt;（严格小于）：端点接触（b == ns）划入②合并，保证结果不出现相邻接触区间</text>
    <text x="70" y="366" fill="#888" font-size="10">阶段②结束后统一加入合并后的 [ns, ne]（即使无重叠也加入新区间本身）</text>
    <text x="70" y="386" fill="#888" font-size="10">输入已排序 → 省去排序步骤 → O(n) 一次遍历（56 题需 O(n log n) 排序）</text>
    <text x="70" y="406" fill="#888" font-size="10">关联：[56. 合并区间] 排序+扫描 · [435. 无重叠区间] 贪心去重 · [253. 会议室II] 扫描线</text>
  </g>
</svg>
