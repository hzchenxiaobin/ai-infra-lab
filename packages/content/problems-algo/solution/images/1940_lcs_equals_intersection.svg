<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：严格递增数组 → LCS = 交集</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">公共元素天然升序，任一公共子序列必为公共元素集的子集</text>

  <!-- Array A label -->
  <text x="48" y="92" font-size="12" fill="#446688" font-weight="bold">A</text>
  <g font-size="13">
    <rect x="80" y="72" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="106" y="94" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="134" y="72" width="52" height="34" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="160" y="94" text-anchor="middle" fill="#666">3</text>
    <rect x="188" y="72" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="214" y="94" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>

  <!-- Array B label -->
  <text x="48" y="148" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <g font-size="13">
    <rect x="80" y="128" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="106" y="150" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="134" y="128" width="52" height="34" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="160" y="150" text-anchor="middle" fill="#666">4</text>
    <rect x="188" y="128" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="214" y="150" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="242" y="128" width="52" height="34" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="268" y="150" text-anchor="middle" fill="#666">7</text>
    <rect x="296" y="128" width="52" height="34" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="322" y="150" text-anchor="middle" fill="#666">9</text>
  </g>

  <!-- highlight note for common cells -->
  <text x="360" y="94" font-size="11" fill="#b85450">← 1 出现在两数组</text>
  <text x="360" y="150" font-size="11" fill="#b85450">← 4 出现在两数组</text>

  <!-- arrows down to intersection -->
  <path d="M 106 110 Q 130 168 180 210" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 166 Q 220 188 230 210" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- intersection = LCS row -->
  <text x="48" y="236" font-size="12" fill="#4a7a3a" font-weight="bold">交集</text>
  <g font-size="13">
    <rect x="80" y="218" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="106" y="240" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="134" y="218" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="160" y="240" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- equals sign + LCS -->
  <text x="210" y="240" font-size="16" fill="#444" font-weight="bold">=</text>
  <rect x="232" y="218" width="120" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">LCS = [1,4]</text>

  <!-- reasoning box -->
  <rect x="40" y="278" width="540" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="13" fill="#444" font-weight="bold">为什么相等？三条性质连缀</text>
  <text x="60" y="326" font-size="12" fill="#4a7a3a">① 严格递增 ⇒ 每个数组内部无重复，公共元素在每个数组中至多出现一次</text>
  <text x="60" y="346" font-size="12" fill="#4a7a3a">② 公共元素按数值升序出现在每个数组中 ⇒ 它们本身构成一条合法公共子序列</text>
  <text x="60" y="366" font-size="12" fill="#4a7a3a">③ 任意公共子序列的元素都必须「每个数组都有」⇒ 必为公共元素集的子集</text>
  <text x="60" y="392" font-size="13" fill="#b85450" font-weight="bold">∴ 最长公共子序列 = 全部公共元素 = 交集</text>
</svg>
