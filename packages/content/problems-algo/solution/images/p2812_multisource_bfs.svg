<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    多源 BFS：所有小偷同时入队，逐层扩散
  </text>

  <!-- 3x3 grid: example 2, thief at (0,2) -->
  <!-- col0 x=90..160, col1 160..230, col2 230..300 ; row0 y=70..140 ... -->
  <!-- dist0 thief (0,2) red -->
  <rect x="230" y="70" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="265" y="58" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">贼</text>

  <!-- dist1: (0,1)(1,2) orange -->
  <rect x="160" y="70" width="70" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="110" text-anchor="middle" font-size="20" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="230" y="140" width="70" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="265" y="180" text-anchor="middle" font-size="20" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- dist2: (0,0)(1,1)(2,2) green -->
  <rect x="90" y="70" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="110" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="160" y="140" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="180" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="230" y="210" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="265" y="250" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- dist3: (1,0)(2,1) blue -->
  <rect x="90" y="140" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="180" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="160" y="210" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="250" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">3</text>

  <!-- dist4: (2,0) blue dark -->
  <rect x="90" y="210" width="70" height="70" fill="#d6e4f7" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="250" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">4</text>

  <!-- wave arrows from thief outward (layer expansion) -->
  <path d="M228,105 L233,105" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M265,143 L265,148" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend on right -->
  <text x="345" y="70" font-size="13" fill="#333" filter="url(#rough2)">每格值 = dist</text>
  <text x="345" y="88" font-size="12" fill="#666" filter="url(#rough2)">到最近小偷的</text>
  <text x="345" y="104" font-size="12" fill="#666" filter="url(#rough2)">曼哈顿距离</text>

  <rect x="345" y="120" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="133" font-size="12" fill="#333" filter="url(#rough2)">层0：小偷(源)</text>
  <rect x="345" y="145" width="22" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="158" font-size="12" fill="#333" filter="url(#rough2)">层1</text>
  <rect x="345" y="170" width="22" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="183" font-size="12" fill="#333" filter="url(#rough2)">层2</text>
  <rect x="345" y="195" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="374" y="208" font-size="12" fill="#333" filter="url(#rough2)">层3/4</text>

  <text x="345" y="240" font-size="12" fill="#b85450" filter="url(#rough2)">红色箭头 =</text>
  <text x="345" y="256" font-size="12" fill="#b85450" filter="url(#rough2)">BFS 扩散方向</text>

  <!-- caption bottom -->
  <text x="180" y="312" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    所有 grid[i][j]==1 的格同时入队(d=0)，逐层 +1
  </text>
  <text x="180" y="328" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    BFS 天然保证：首次到达 = 最近源 → dist 即最近小偷距离
  </text>
</svg>
