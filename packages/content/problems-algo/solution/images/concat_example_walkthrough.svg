<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="barfoothefoobarman"，words=["foo","bar"]，offset=0</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">w=3，m=2，target={foo:1, bar:1}，窗口凑满 2 个词即命中</text>

  <!-- index labels -->
  <text x="50" y="68" font-size="10" fill="#888">下标:</text>
  <text x="115" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="185" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="255" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="325" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">9</text>
  <text x="395" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">12</text>
  <text x="465" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">15</text>

  <!-- chunk cells reference -->
  <rect x="80" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bar</text>
  <rect x="150" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">foo</text>
  <rect x="220" y="74" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="94" text-anchor="middle" font-size="12" fill="#999">the</text>
  <rect x="290" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">foo</text>
  <rect x="360" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bar</text>
  <rect x="430" y="74" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="94" text-anchor="middle" font-size="12" fill="#999">man</text>

  <!-- Table header -->
  <text x="40" y="128" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="95" y="128" font-size="11" fill="#444" font-weight="bold">right</text>
  <text x="150" y="128" font-size="11" fill="#444" font-weight="bold">word</text>
  <text x="230" y="128" font-size="11" fill="#444" font-weight="bold">动作</text>
  <text x="380" y="128" font-size="11" fill="#444" font-weight="bold">窗口(cur)</text>
  <text x="475" y="128" font-size="11" fill="#444" font-weight="bold">count</text>
  <text x="555" y="128" font-size="11" fill="#444" font-weight="bold">ans</text>
  <line x1="24" y1="134" x2="600" y2="134" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="40" y="154" font-size="11" fill="#333">1</text>
  <text x="95" y="154" font-size="11" fill="#333">0</text>
  <text x="150" y="154" font-size="11" fill="#333" font-weight="bold">bar</text>
  <text x="230" y="154" font-size="11" fill="#82b366">加入，未超量</text>
  <text x="380" y="154" font-size="11" fill="#4a7a3a" font-weight="bold">{bar:1}</text>
  <text x="475" y="154" font-size="11" fill="#333">1</text>
  <text x="555" y="154" font-size="11" fill="#888">—</text>

  <!-- Row 2 -->
  <text x="40" y="176" font-size="11" fill="#333">2</text>
  <text x="95" y="176" font-size="11" fill="#333">3</text>
  <text x="150" y="176" font-size="11" fill="#333" font-weight="bold">foo</text>
  <text x="230" y="176" font-size="11" fill="#d6a040">凑满 m=2 ✓ 收缩</text>
  <text x="380" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">{bar:1,foo:1}</text>
  <text x="475" y="176" font-size="11" fill="#333">2</text>
  <text x="555" y="176" font-size="11" fill="#b85450" font-weight="bold">[0]</text>

  <!-- Row 3 -->
  <text x="40" y="198" font-size="11" fill="#333">3</text>
  <text x="95" y="198" font-size="11" fill="#333">6</text>
  <text x="150" y="198" font-size="11" fill="#999" font-weight="bold">the</text>
  <text x="230" y="198" font-size="11" fill="#b85450">不在目标 → 重置</text>
  <text x="380" y="198" font-size="11" fill="#888">{}</text>
  <text x="475" y="198" font-size="11" fill="#333">0</text>
  <text x="555" y="198" font-size="11" fill="#888">left=9</text>

  <!-- Row 4 -->
  <text x="40" y="220" font-size="11" fill="#333">4</text>
  <text x="95" y="220" font-size="11" fill="#333">9</text>
  <text x="150" y="220" font-size="11" fill="#333" font-weight="bold">foo</text>
  <text x="230" y="220" font-size="11" fill="#82b366">加入，未超量</text>
  <text x="380" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">{foo:1}</text>
  <text x="475" y="220" font-size="11" fill="#333">1</text>
  <text x="555" y="220" font-size="11" fill="#888">—</text>

  <!-- Row 5 -->
  <text x="40" y="242" font-size="11" fill="#333">5</text>
  <text x="95" y="242" font-size="11" fill="#333">12</text>
  <text x="150" y="242" font-size="11" fill="#333" font-weight="bold">bar</text>
  <text x="230" y="242" font-size="11" fill="#d6a040">凑满 m=2 ✓ 收缩</text>
  <text x="380" y="242" font-size="11" fill="#4a7a3a" font-weight="bold">{foo:1,bar:1}</text>
  <text x="475" y="242" font-size="11" fill="#333">2</text>
  <text x="555" y="242" font-size="11" fill="#b85450" font-weight="bold">[0,9]</text>

  <!-- Row 6 -->
  <text x="40" y="264" font-size="11" fill="#333">6</text>
  <text x="95" y="264" font-size="11" fill="#333">15</text>
  <text x="150" y="264" font-size="11" fill="#999" font-weight="bold">man</text>
  <text x="230" y="264" font-size="11" fill="#b85450">不在目标 → 重置</text>
  <text x="380" y="264" font-size="11" fill="#888">{}</text>
  <text x="475" y="264" font-size="11" fill="#333">0</text>
  <text x="555" y="264" font-size="11" fill="#888">left=18,结束</text>

  <!-- result box -->
  <rect x="70" y="296" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = [0, 9]：合法子串 "barfoo"(0) 与 "foobar"(9)</text>
  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#888">命中后立即收缩左端一个词，保证窗口继续滑动找下一个解</text>

  <!-- legend -->
  <rect x="70" y="372" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="90" y="383" font-size="11" fill="#555">加入/命中</text>
  <rect x="180" y="372" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="200" y="383" font-size="11" fill="#555">重置/记录</text>
  <rect x="300" y="372" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="320" y="383" font-size="11" fill="#555">凑满收缩</text>
  <text x="430" y="383" font-size="11" fill="#888">注：仅展示 offset=0，offset=1/2 同理</text>

  <!-- key insight -->
  <rect x="70" y="408" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="428" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">不变式：窗口内任一词频 ≤ 目标词频</text>
  <text x="310" y="446" text-anchor="middle" font-size="11" fill="#666">→ 当 count==m 时，窗口 m 个词的频次恰好等于目标，必为合法串联</text>
</svg>
