<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：answers = [1, 1, 2] → 5</text>

  <!-- ===== table header ===== -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">answers:</text>
  <rect x="120" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="44" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- ===== step 1: cnt ===== -->
  <text x="40" y="100" font-size="11" fill="#888" font-weight="bold">① cnt 频次:</text>
  <rect x="120" y="86" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 → 2 只</text>
  <rect x="216" y="86" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="256" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 → 1 只</text>

  <!-- ===== step 2: x=1 ===== -->
  <rect x="40" y="130" width="480" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="152" font-size="11.5" fill="#446688" font-weight="bold">② 处理 x=1，c=2</text>
  <text x="52" y="170" font-size="11" fill="#333">x+1 = 2（每组上限 2 只）</text>
  <text x="52" y="186" font-size="11" fill="#333">group = ⌈2 / 2⌉ = 1 组</text>
  <text x="52" y="202" font-size="11" fill="#333">贡献 = 1 × 2 = 2 只</text>

  <!-- visual: 1 group of 2 blue rabbits -->
  <ellipse cx="330" cy="160" rx="13" ry="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="325" cy="156" r="1.8" fill="#446688"/>
  <circle cx="335" cy="156" r="1.8" fill="#446688"/>
  <ellipse cx="360" cy="160" rx="13" ry="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="355" cy="156" r="1.8" fill="#446688"/>
  <circle cx="365" cy="156" r="1.8" fill="#446688"/>
  <path d="M 316 172 Q 345 166 374 172" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="430" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">组1(蓝)</text>
  <text x="430" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">= 2 只</text>
  <text x="430" y="194" font-size="10" fill="#888">小计: 2</text>

  <!-- ===== step 3: x=2 ===== -->
  <rect x="40" y="220" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="242" font-size="11.5" fill="#d6a040" font-weight="bold">③ 处理 x=2，c=1</text>
  <text x="52" y="260" font-size="11" fill="#333">x+1 = 3（每组上限 3 只）</text>
  <text x="52" y="276" font-size="11" fill="#333">group = ⌈1 / 3⌉ = 1 组</text>
  <text x="52" y="292" font-size="11" fill="#333">贡献 = 1 × 3 = 3 只</text>

  <!-- visual: 1 group of 3 orange rabbits (2 unseen) -->
  <ellipse cx="330" cy="250" rx="13" ry="11" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="325" cy="246" r="1.8" fill="#d6a040"/>
  <circle cx="335" cy="246" r="1.8" fill="#d6a040"/>
  <ellipse cx="360" cy="250" rx="13" ry="11" fill="#ffe0b2" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="360" y="254" text-anchor="middle" font-size="9" fill="#d6a040">?</text>
  <ellipse cx="390" cy="250" rx="13" ry="11" fill="#ffe0b2" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="9" fill="#d6a040">?</text>
  <path d="M 316 262 Q 353 256 404 262" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="430" y="248" font-size="11" fill="#d6a040" font-weight="bold">组1(橙)</text>
  <text x="430" y="266" font-size="11" fill="#d6a040" font-weight="bold">= 3 只</text>
  <text x="430" y="284" font-size="10" fill="#888">2 只未被问</text>

  <!-- ===== result ===== -->
  <rect x="40" y="316" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="52" y="340" font-size="12" fill="#333" font-weight="bold">④ 求和：ans = 2 + 3 = </text>
  <rect x="220" y="324" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="248" y="346" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <text x="300" y="346" font-size="11" fill="#888">← 森林中兔子总数的最小值</text>

  <!-- note -->
  <rect x="40" y="372" width="480" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">虚线 = 未被询问的同色伙伴（它们没在 answers 里出现，但仍须计入）</text>
</svg>
