<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：restricted = [4, 5] → 可达 4 个节点</text>

  <!-- ===== 树（上半） ===== -->
  <!-- 受限边（红虚线） -->
  <line x1="252" y1="96" x2="156" y2="58" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="268" y1="96" x2="364" y2="58" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="386" y1="62" x2="432" y2="112" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 可达边（绿实线） -->
  <line x1="260" y1="108" x2="260" y2="156" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="253" y1="172" x2="210" y2="214" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="267" y1="172" x2="312" y2="214" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 节点 0 -->
  <circle cx="260" cy="96" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- 节点 1 -->
  <circle cx="260" cy="166" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- 节点 2 -->
  <circle cx="206" cy="222" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <!-- 节点 3 -->
  <circle cx="314" cy="222" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="314" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <!-- 节点 4 受限 -->
  <circle cx="146" cy="50" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="164" y="44" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <!-- 节点 5 受限 -->
  <circle cx="374" cy="50" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="374" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="392" y="44" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <!-- 节点 6 不可达 -->
  <circle cx="440" cy="118" r="13" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">6</text>

  <!-- ===== 步骤表（下半） ===== -->
  <!-- 表头 -->
  <rect x="30" y="252" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">出队 u</text>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">邻居处理</text>
  <text x="420" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">队列</text>

  <!-- 行 1 -->
  <text x="70" y="296" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#333">4✗ 5✗ 1✓入队</text>
  <text x="420" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="500" y="296" text-anchor="middle" font-size="11" fill="#333">[1]</text>

  <line x1="40" y1="306" x2="520" y2="306" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 2 -->
  <text x="70" y="326" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="326" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="290" y="326" text-anchor="middle" font-size="11" fill="#333">0已访 2✓ 3✓入队</text>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="500" y="326" text-anchor="middle" font-size="11" fill="#333">[2,3]</text>

  <line x1="40" y1="336" x2="520" y2="336" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <text x="70" y="356" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#333">1已访 → 跳过</text>
  <text x="420" y="356" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="500" y="356" text-anchor="middle" font-size="11" fill="#333">[3]</text>

  <line x1="40" y1="366" x2="520" y2="366" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 4 -->
  <text x="70" y="386" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="150" y="386" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="290" y="386" text-anchor="middle" font-size="11" fill="#333">1已访 → 跳过</text>
  <text x="420" y="386" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="500" y="386" text-anchor="middle" font-size="11" fill="#333">[]</text>

  <!-- 结论 -->
  <rect x="120" y="404" width="320" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">队空 → 返回 ans = 4 ✓</text>
</svg>
