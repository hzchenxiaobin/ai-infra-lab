<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：用户 1 逐行走查（09-03 缺数据）</text>

  <rect x="22" y="44" width="476" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="61" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">日期</text>
  <text x="139" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">上上行</text>
  <text x="203" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">差</text>
  <text x="303" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口（最近 3 行）</text>
  <text x="418" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">AVG</text>
  <text x="479" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">保留</text>

  <rect x="22" y="74" width="476" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="61" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-02</text>
  <text x="139" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="203" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="303" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">687</text>
  <text x="418" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">687.00</text>
  <text x="479" y="96" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="22" y="108" width="476" height="34" fill="#fff8e1" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="61" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-04</text>
  <text x="139" y="130" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="203" y="130" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="303" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">687, 395</text>
  <text x="418" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">541.00 ⚠</text>
  <text x="479" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="22" y="142" width="476" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="61" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-05</text>
  <text x="139" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-02</text>
  <text x="203" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="303" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">687, 395, 499</text>
  <text x="418" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">527.00</text>
  <text x="479" y="164" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="22" y="176" width="476" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="61" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">09-06</text>
  <text x="139" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-04</text>
  <text x="203" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ✓</text>
  <text x="303" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">395, 499, 712</text>
  <text x="418" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">535.33</text>
  <text x="479" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="22" y="210" width="476" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="61" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">09-07</text>
  <text x="139" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">09-05</text>
  <text x="203" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ✓</text>
  <text x="303" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">499, 712, 576</text>
  <text x="418" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">595.67</text>
  <text x="479" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <path d="M 100 44 L 100 244 M 178 44 L 178 244 M 228 44 L 228 244 M 378 44 L 378 244 M 458 44 L 458 244" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="262" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 09-04 的 541.00 = (687+395)/2：退化窗口的「合理假象」，并非 NULL</text>

  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">09-05 与 09-02 差 3 天（缺 09-03）→ 剔除；09-06、09-07 差恰 2 天 → 保留</text>

  <rect x="40" y="326" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">用户 6 的 09-05：行窗口 (480, 191, 303) 平均 324.67，但差 4 天 → 剔除</text>

  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">守门员是「差 = 2 天」；最终输出 5 行（用户 1×2、2×1、3×2）与示例一致</text>
</svg>
