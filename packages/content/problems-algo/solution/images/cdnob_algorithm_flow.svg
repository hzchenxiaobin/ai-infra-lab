<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：判断 n 是否为 1，O(1) 直接返回</text>

  <!-- ====== Input ====== -->
  <rect x="200" y="42" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="13" fill="#333">输入 n（1 ≤ n ≤ 100）</text>

  <path d="M 270 82 L 270 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Diamond: n == 1? ====== -->
  <polygon points="270,108 370,162 270,216 170,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">n == 1 ?</text>
  <text x="270" y="178" text-anchor="middle" font-size="10" fill="#888">（1 无法触发任何添加）</text>

  <!-- Yes branch (left) -->
  <path d="M 170 162 L 90 162 L 90 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="126" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="30" y="200" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="218" text-anchor="middle" font-size="10.5" fill="#888">桌面 = {1}</text>
  <text x="90" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return 1</text>

  <!-- No branch (right) -->
  <path d="M 370 162 L 450 162 L 450 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="154" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <rect x="390" y="200" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="218" text-anchor="middle" font-size="10.5" fill="#888">桌面 = {2,…,n}</text>
  <text x="450" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return n − 1</text>

  <!-- converge arrows down -->
  <path d="M 90 244 L 90 270 L 270 270" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 450 244 L 450 270 L 270 270" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 270 L 270 286" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== unified formula ====== -->
  <rect x="150" y="290" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">等价：return max(n − 1, 1)</text>

  <!-- ====== bottom note ====== -->
  <rect x="30" y="332" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="10.5" fill="#555">n≥3 时 x%(x−1)=1 保证链 n→…→2；10⁹ 天远超收敛所需（≤n 天即稳定）</text>
</svg>
