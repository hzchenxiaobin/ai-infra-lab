<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">五个示例演算：逐个算出两针角度与最终较小角</text>

  <!-- ===== Table ===== -->
  <!-- column x: hour 30-90, minutes 90-150, 分针 150-260, 时针 260-380, diff 380-450, 答案 450-530 -->

  <!-- header row -->
  <rect x="30" y="48" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="68">hour</text>
    <text x="120" y="68">minutes</text>
    <text x="205" y="68">分针角度</text>
    <text x="320" y="68">时针角度</text>
    <text x="415" y="68">diff</text>
    <text x="490" y="68">答案</text>
  </g>

  <!-- vertical separators -->
  <g stroke="#ccd5e0" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="48" x2="90" y2="248"/>
    <line x1="150" y1="48" x2="150" y2="248"/>
    <line x1="260" y1="48" x2="260" y2="248"/>
    <line x1="380" y1="48" x2="380" y2="248"/>
    <line x1="450" y1="48" x2="450" y2="248"/>
  </g>

  <!-- horizontal separators -->
  <g stroke="#ccd5e0" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="92" x2="530" y2="92"/>
    <line x1="30" y1="124" x2="530" y2="124"/>
    <line x1="30" y1="156" x2="530" y2="156"/>
    <line x1="30" y1="188" x2="530" y2="188"/>
    <line x1="30" y1="220" x2="530" y2="220"/>
  </g>

  <!-- answer column highlight -->
  <rect x="450" y="78" width="80" height="170" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>

  <!-- row 3 (7.5 case) highlight to show half-degree importance -->
  <rect x="30" y="156" width="500" height="32" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>

  <!-- outer border -->
  <rect x="30" y="48" width="500" height="200" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- data text -->
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <!-- row1: 12,30 -->
    <text x="60" y="112">12</text>
    <text x="120" y="112">30</text>
    <text x="205" y="112">180°</text>
    <text x="320" y="112">15°</text>
    <text x="415" y="112">165°</text>
    <text x="490" y="112" fill="#4a7a3a" font-weight="bold">165</text>
    <!-- row2: 3,30 -->
    <text x="60" y="144">3</text>
    <text x="120" y="144">30</text>
    <text x="205" y="144">180°</text>
    <text x="320" y="144">105°</text>
    <text x="415" y="144">75°</text>
    <text x="490" y="144" fill="#4a7a3a" font-weight="bold">75</text>
    <!-- row3: 3,15 -->
    <text x="60" y="176">3</text>
    <text x="120" y="176">15</text>
    <text x="205" y="176">90°</text>
    <text x="320" y="176">97.5°</text>
    <text x="415" y="176">7.5°</text>
    <text x="490" y="176" fill="#4a7a3a" font-weight="bold">7.5</text>
    <!-- row4: 4,50 -->
    <text x="60" y="208">4</text>
    <text x="120" y="208">50</text>
    <text x="205" y="208">300°</text>
    <text x="320" y="208">145°</text>
    <text x="415" y="208">155°</text>
    <text x="490" y="208" fill="#4a7a3a" font-weight="bold">155</text>
    <!-- row5: 12,0 -->
    <text x="60" y="240">12</text>
    <text x="120" y="240">0</text>
    <text x="205" y="240">0°</text>
    <text x="320" y="240">0°</text>
    <text x="415" y="240">0°</text>
    <text x="490" y="240" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <!-- footnote -->
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 第 3 行：时针 97.5° 正是"每分钟漂移 0.5°"的体现，漏掉则得 0° 的错误答案</text>
</svg>
