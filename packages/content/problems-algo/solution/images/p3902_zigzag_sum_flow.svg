<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="240" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：BFS 逐层 + 方向标志位</text>

  <!-- 开始 -->
  <ellipse cx="135" cy="56" rx="78" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">root 入队，dir = L→R</text>

  <path d="M 215 56 L 243 56" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形A：队列空? -->
  <polygon points="300,34 368,56 300,78 232,56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">队列空?</text>

  <text x="382" y="48" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 368 56 L 398 56" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="452" cy="56" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="310" y="92" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 300 78 L 300 100" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 矩形1 -->
  <rect x="215" y="100" width="170" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">m = 队列大小</text>
  <text x="300" y="128" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">vals = [ ]，sign = +1</text>

  <path d="M 300 132 L 300 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 矩形2：收集本层 -->
  <rect x="205" y="156" width="190" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">出队 m 次：vals ← u.val</text>
  <text x="300" y="194" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">孩子按 left→right 入队</text>

  <path d="M 300 204 L 300 228" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形B：方向? -->
  <polygon points="300,228 364,252 300,276 236,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">dir = L→R ?</text>

  <!-- 左分支 -->
  <text x="204" y="244" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 236 252 L 176 252" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="230" width="146" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="248" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">正序扫 vals（j = 0…m−1）</text>
  <text x="103" y="264" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">s += sign·vals[j]，sign 取反</text>

  <!-- 右分支 -->
  <text x="396" y="244" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 364 252 L 424 252" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="230" width="146" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="248" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">逆序扫 vals（j = m−1…0）</text>
  <text x="427" y="264" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">s += sign·vals[j]，sign 取反</text>

  <!-- 汇聚 -->
  <path d="M 103 274 L 103 300 L 242 300 L 242 320" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 427 274 L 427 300 L 318 300 L 318 320" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 矩形3：记录并翻转 -->
  <rect x="205" y="320" width="190" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">ans ← s；dir 翻转</text>

  <!-- 回流 -->
  <path d="M 395 338 L 502 338 L 502 10 L 300 10 L 300 30" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="330" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">下一层</text>

  <text x="260" y="384" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⚠️ 孩子永远按 left→right 入队（保下一层的 L→R 序），方向只作用于「取值求和」阶段</text>
</svg>
