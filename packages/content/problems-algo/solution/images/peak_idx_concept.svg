<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">山脉数组：先严格递增 → 峰顶 → 后严格递减（唯一峰）</text>

  <!-- ===== Mountain array cells ===== -->
  <!-- indices -->
  <text x="56" y="58" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="110" y="58" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="164" y="58" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="218" y="58" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="272" y="58" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="326" y="58" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="380" y="58" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="434" y="58" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- values: 0,2,4,6,5,3,1 with heights proportional -->
  <rect x="87" y="148" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="141" y="124" width="46" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="195" y="100" width="46" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="249" y="76" width="46" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="303" y="94" width="46" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="357" y="118" width="46" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="411" y="142" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- baseline -->
  <line x1="80" y1="178" x2="470" y2="178" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- peak marker -->
  <text x="272" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">峰顶 i=3</text>

  <!-- ascending / descending brackets -->
  <path d="M 110 192 L 110 198 L 272 198 L 272 192" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="191" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">严格递增 ↑</text>
  <path d="M 272 192 L 272 198 L 434 198 L 434 192" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="353" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">严格递减 ↓</text>

  <!-- ===== Two slope cases ===== -->
  <text x="280" y="244" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">二分判据：比较 arr[mid] 与 arr[mid+1] 判定斜率方向</text>

  <!-- left case: ascending -->
  <rect x="30" y="260" width="240" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">上升坡：arr[mid] &lt; arr[mid+1]</text>
  <!-- mini slope going up -->
  <line x1="60" y1="350" x2="240" y2="300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="120" cy="325" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="180" cy="305" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="318" text-anchor="middle" font-size="10" fill="#446688">mid</text>
  <text x="180" y="298" text-anchor="middle" font-size="10" fill="#d6a040">mid+1</text>
  <path d="M 250 320 L 268 320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">峰在右侧 → lo = mid + 1</text>

  <!-- right case: descending -->
  <rect x="290" y="260" width="240" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">下降坡：arr[mid] &gt; arr[mid+1]</text>
  <!-- mini slope going down -->
  <line x1="320" y1="300" x2="500" y2="350" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="380" cy="320" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="440" cy="340" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="313" text-anchor="middle" font-size="10" fill="#d6a040">mid</text>
  <text x="440" y="333" text-anchor="middle" font-size="10" fill="#b85450">mid+1</text>
  <path d="M 310 320 L 292 320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">峰在左侧 → hi = mid</text>
</svg>
