<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：h=5, w=4, hCuts=[1,2,4], vCuts=[1,3]</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#888">补边界 → 排序 → 相邻差分取最大 → 相乘取余</text>

  <!-- Header row: 步骤 | 操作 | 数组状态 | 间距 | 最大 -->
  <!-- cols: 步骤 x=50/40, 操作 x=90/120, 数组 x=210/210, 间距 x=420/130, 最大 x=550/50 -->
  <rect x="50" y="50" width="40" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步</text>
  <rect x="90" y="50" width="120" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">操作</text>
  <rect x="210" y="50" width="210" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">数组状态（含边界）</text>
  <rect x="420" y="50" width="130" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">相邻差分</text>
  <rect x="550" y="50" width="50" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="575" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">max</text>

  <!-- Row 1: 补边界 H -->
  <rect x="50" y="74" width="550" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="150" y="92" text-anchor="middle" font-size="10.5" fill="#333">水平补 0,h</text>
  <text x="315" y="92" text-anchor="middle" font-size="11" fill="#333">[0, 1, 2, 4, 5]</text>
  <text x="485" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="575" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: 补边界 V -->
  <rect x="50" y="100" width="550" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="150" y="118" text-anchor="middle" font-size="10.5" fill="#333">竖直补 0,w</text>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="#333">[0, 1, 3, 4]</text>
  <text x="485" y="118" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="575" y="118" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 3: 排序（已有序） -->
  <rect x="50" y="126" width="550" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="144" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="150" y="144" text-anchor="middle" font-size="10.5" fill="#333">排序</text>
  <text x="315" y="144" text-anchor="middle" font-size="11" fill="#333">（本例天然有序）</text>
  <text x="485" y="144" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="575" y="144" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 4: 水平差分 HIGHLIGHT -->
  <rect x="50" y="152" width="550" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="150" y="170" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">水平差分</text>
  <text x="315" y="170" text-anchor="middle" font-size="11" fill="#333">[0,1,2,4,5]</text>
  <text x="485" y="170" text-anchor="middle" font-size="11" fill="#333">1, 1, 2, 1</text>
  <text x="575" y="170" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row 5: 竖直差分 HIGHLIGHT -->
  <rect x="50" y="178" width="550" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5</text>
  <text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">竖直差分</text>
  <text x="315" y="196" text-anchor="middle" font-size="11" fill="#333">[0,1,3,4]</text>
  <text x="485" y="196" text-anchor="middle" font-size="11" fill="#333">1, 2, 1</text>
  <text x="575" y="196" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row 6: 相乘取余 HIGHLIGHT green -->
  <rect x="50" y="204" width="550" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6</text>
  <text x="150" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">相乘取余</text>
  <text x="315" y="222" text-anchor="middle" font-size="11" fill="#333">maxH=2, maxV=2</text>
  <text x="485" y="222" text-anchor="middle" font-size="11" fill="#333">2 × 2 = 4</text>
  <text x="575" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4 ★</text>

  <!-- annotation arrow to row 6 -->
  <path d="M 600 217 L 566 217" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="598" y="212" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">答案</text>

  <!-- Summary box -->
  <rect x="80" y="260" width="460" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">最大水平间距 2（切口 2 与 4 之间）× 最大竖直间距 2（切口 1 与 3 之间）</text>
  <text x="310" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">面积 = 2 × 2 = 4 → return 4 ✓</text>
  <text x="310" y="322" text-anchor="middle" font-size="10.5" fill="#555">每个方向只需一次扫描取最大，无需枚举 4×3=12 个小块</text>
</svg>
