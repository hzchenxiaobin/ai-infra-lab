<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分层 BFS 流程：每处理完一整层，学期数 +1</text>

  <!-- Step 1: init -->
  <text x="30" y="58" font-size="11" fill="#446688" font-weight="bold">① 建图 + 初始化</text>
  <rect x="30" y="66" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="84" font-size="10.5" fill="#333">建邻接表 adj + 入度数组 indegree；把所有 indegree=0 的节点入队 q；</text>
  <text x="46" y="99" font-size="10.5" fill="#333">semester = 0，studied = 0</text>

  <!-- Step 2: while loop -->
  <text x="30" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">② 当队列非空，逐层处理（每层 = 一个学期）</text>

  <!-- loop box -->
  <rect x="30" y="140" width="500" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- semester++ -->
  <rect x="50" y="152" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">semester += 1</text>

  <path d="M 230 169 L 270 169" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- size = q.size() -->
  <rect x="276" y="152" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="366" y="173" text-anchor="middle" font-size="11" fill="#333">size = len(q)  # 本层节点数</text>

  <path d="M 366 186 L 366 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- for loop: process this layer -->
  <text x="50" y="206" font-size="11" fill="#555" font-weight="bold">for i in range(size):</text>
  <rect x="50" y="214" width="410" height="84" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <text x="64" y="234" font-size="10.5" fill="#333">u = q.popleft();  studied += 1</text>

  <text x="64" y="254" font-size="10.5" fill="#333">for v in adj[u]:</text>
  <text x="84" y="272" font-size="10.5" fill="#333">indegree[v] -= 1</text>

  <polygon points="300,262 332,276 300,290 268,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">入度=0?</text>

  <path d="M 332 276 L 362 276" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="270" font-size="9" fill="#d6a040">是</text>
  <rect x="366" y="262" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="280" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">q.append(v)</text>

  <!-- Step 3: judge -->
  <text x="30" y="338" font-size="11" fill="#b85450" font-weight="bold">③ 判环 + 返回</text>

  <polygon points="160,346 240,376 160,406 80,376" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="372" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">studied</text>
  <text x="160" y="386" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">== n?</text>

  <path d="M 240 376 L 300 376" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="370" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="304" y="360" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return semester</text>

  <path d="M 80 376 L 40 376 L 40 416" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="370" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="408" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="425" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>

  <text x="430" y="386" font-size="10" fill="#888">studied &lt; n → 有环</text>
</svg>
