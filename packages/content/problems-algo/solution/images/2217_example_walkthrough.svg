<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：queries=[1,2,3,4,5,90], intLength=3</text>

  <!-- preprocess summary -->
  <rect x="60" y="44" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">L = 2， start = 10， total = 90</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#888">左半 ∈ {10,11,…,99}，共 90 个回文</text>

  <!-- Table header -->
  <rect x="60" y="104" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">q (查询)</text>

  <rect x="160" y="104" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">first = 10+(q−1)</text>

  <rect x="300" y="104" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">左半 str</text>

  <rect x="400" y="104" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回文 answer</text>

  <!-- Rows -->
  <!-- row 1: q=1 -->
  <rect x="60" y="136" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="160" y="136" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="154" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="300" y="136" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="12" fill="#333">"10"</text>
  <rect x="400" y="136" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">101</text>

  <!-- row 2: q=2 -->
  <rect x="60" y="164" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="160" y="164" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="182" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="300" y="164" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="182" text-anchor="middle" font-size="12" fill="#333">"11"</text>
  <rect x="400" y="164" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">111</text>

  <!-- row 3: q=3 -->
  <rect x="60" y="192" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="160" y="192" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="300" y="192" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#333">"12"</text>
  <rect x="400" y="192" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">121</text>

  <!-- row 4: q=4 -->
  <rect x="60" y="220" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="160" y="220" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="238" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="300" y="220" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="238" text-anchor="middle" font-size="12" fill="#333">"13"</text>
  <rect x="400" y="220" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">131</text>

  <!-- row 5: q=5 -->
  <rect x="60" y="248" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="160" y="248" width="140" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="266" text-anchor="middle" font-size="12" fill="#333">14</text>
  <rect x="300" y="248" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="266" text-anchor="middle" font-size="12" fill="#333">"14"</text>
  <rect x="400" y="248" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">141</text>

  <!-- ellipsis row -->
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">⋮  （q = 6 … 89 同理递推） ⋮</text>

  <!-- row 6: q=90 (highlight) -->
  <rect x="60" y="308" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">90</text>
  <rect x="160" y="308" width="140" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="230" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">99</text>
  <rect x="300" y="308" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="350" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"99"</text>
  <rect x="400" y="308" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">999</text>

  <!-- mirror hint -->
  <rect x="60" y="350" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">镜像规则：pal = s + s[:n−L][::-1]</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#666">n=3, L=2 → s[:1][::-1]，如 "12"+"1"="121"；q=90 时 "99"+"9"="999"</text>
</svg>
