<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：层序含 null 入队，遇 null 后必须全是 null</text>

  <!-- ===== 左侧：完全二叉树 [1,2,3,4,5,6] ===== -->
  <text x="135" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">完全二叉树 → true</text>
  <g font-size="12">
    <!-- root 1 -->
    <circle cx="135" cy="96" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="135" y="101" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- L1: 2, 3 -->
    <circle cx="90" cy="148" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="90" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="180" cy="148" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="180" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <line x1="124" y1="108" x2="100" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="146" y1="108" x2="170" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2: 4,5,6,null -->
    <circle cx="68" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="68" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="112" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="112" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="158" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="158" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="190" y="188" width="28" height="24" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="204" y="204" text-anchor="middle" font-size="10" fill="#aaa">∅</text>
    <line x1="82" y1="160" x2="72" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="98" y1="160" x2="108" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="172" y1="160" x2="158" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- 队列序列：全实节点在前，null 在后 -->
  <text x="135" y="244" text-anchor="middle" font-size="10" fill="#888">层序序列（含 null）</text>
  <g font-size="10">
    <rect x="40" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="53" y="268" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="68" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="81" y="268" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="96" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="109" y="268" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="124" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="137" y="268" text-anchor="middle" fill="#4a7a3a">4</text>
    <rect x="152" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="165" y="268" text-anchor="middle" fill="#4a7a3a">5</text>
    <rect x="180" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="193" y="268" text-anchor="middle" fill="#4a7a3a">6</text>
    <rect x="208" y="254" width="26" height="20" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="221" y="268" text-anchor="middle" fill="#aaa">∅</text>
    <text x="240" y="268" fill="#aaa">…</text>
  </g>
  <path d="M 208 282 L 208 288 L 234 288 L 234 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="135" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a">实节点全在前，null 全在后 ✓</text>

  <!-- ===== 右侧：非完全 [1,2,3,4,5,null,7] ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">非完全二叉树 → false</text>
  <g font-size="12">
    <!-- root 1 -->
    <circle cx="430" cy="96" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="430" y="101" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- L1: 2, 3 -->
    <circle cx="385" cy="148" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="385" y="153" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="475" cy="148" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="475" y="153" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <line x1="419" y1="108" x2="395" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="441" y1="108" x2="465" y2="134" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2: 4,5,null,7 -->
    <circle cx="363" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="363" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="407" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="407" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="445" y="188" width="28" height="24" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="459" y="204" text-anchor="middle" font-size="10" fill="#aaa">∅</text>
    <circle cx="492" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="492" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>
    <line x1="377" y1="160" x2="367" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="393" y1="160" x2="403" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="481" y1="160" x2="492" y2="186" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <!-- 指出 7 偏右，左侧有空缺 -->
    <text x="446" y="186" text-anchor="middle" font-size="9" fill="#b85450">空缺</text>
  </g>

  <!-- 队列序列：实节点 → null → 7（非null） -->
  <text x="430" y="244" text-anchor="middle" font-size="10" fill="#888">层序序列（含 null）</text>
  <g font-size="10">
    <rect x="320" y="254" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="333" y="268" text-anchor="middle" fill="#446688">1</text>
    <rect x="348" y="254" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="361" y="268" text-anchor="middle" fill="#446688">2</text>
    <rect x="376" y="254" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="389" y="268" text-anchor="middle" fill="#446688">3</text>
    <rect x="404" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="417" y="268" text-anchor="middle" fill="#4a7a3a">4</text>
    <rect x="432" y="254" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="445" y="268" text-anchor="middle" fill="#4a7a3a">5</text>
    <rect x="460" y="254" width="26" height="20" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="473" y="268" text-anchor="middle" fill="#aaa">∅</text>
    <rect x="488" y="254" width="26" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="501" y="268" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
  </g>
  <!-- 标出 null 之后出现非 null -->
  <path d="M 473 274 L 501 274" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="304" text-anchor="middle" font-size="10" fill="#b85450">null 之后又出现实节点 7 ✗</text>

  <!-- ===== 底部总结条 ===== -->
  <rect x="30" y="328" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">判定法则：BFS 逐个出队（含 null），首次遇到 null 后标记结束段</text>
  <text x="290" y="370" text-anchor="middle" font-size="11" fill="#7a5a20">若结束段里再冒出任何非 null 节点 → 不完全；否则完全</text>
</svg>
