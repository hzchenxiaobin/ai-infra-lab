<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个长度 k 窗口 = 一个 k 位整数，滚动哈希 O(1) 维护</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">s = "00110110", k = 2  →  统计不同窗口值的个数 = 2^k 即 true</text>

  <!-- String chars: 8 boxes, width 42, start x=142 -->
  <rect x="142" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="184" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="226" y="60" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="247" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="268" y="60" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="289" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="331" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="352" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="86" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="394" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="436" y="60" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>

  <!-- index labels -->
  <text x="163" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="205" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="247" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="289" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="331" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="373" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="415" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>
  <text x="457" y="114" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>

  <!-- current window bracket on [2,3] -->
  <path d="M 228 128 L 228 136 L 310 136 L 310 128" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="269" y="152" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">窗口 "11" → 整数 3</text>

  <!-- Rolling hash formula box -->
  <rect x="50" y="172" width="520" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">滚动哈希（位运算）：val = ((val &lt;&lt; 1) | bit) &amp; mask</text>
  <text x="310" y="214" text-anchor="middle" font-size="11.5" fill="#333">mask = (1 &lt;&lt; k) − 1 = 3（只保留末 k 位）；bit = s[i] − '0'</text>
  <text x="310" y="236" text-anchor="middle" font-size="11.5" fill="#555">例：前窗口 "01"=1 → 新 bit=1 → val = ((1&lt;&lt;1)|1)&amp;3 = 3 ✓（即 "11"）</text>

  <!-- 4 distinct windows with values -->
  <text x="50" y="276" font-size="11.5" fill="#666">长度 k=2 的全部 2^k = 4 种编码，按首次出现顺序入集：</text>
  <!-- group 1: "00"=0 -->
  <rect x="80" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="94" y="307" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="108" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="307" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="108" y="332" text-anchor="middle" font-size="11" fill="#666">"00" → 0</text>

  <!-- group 2: "01"=1 -->
  <rect x="200" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="307" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="228" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="242" y="307" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="228" y="332" text-anchor="middle" font-size="11" fill="#666">"01" → 1</text>

  <!-- group 3: "11"=3 (highlighted, matches current window) -->
  <rect x="320" y="288" width="28" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="348" y="288" width="28" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="362" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="348" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"11" → 3</text>

  <!-- group 4: "10"=2 -->
  <rect x="440" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="454" y="307" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="468" y="288" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="307" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="468" y="332" text-anchor="middle" font-size="11" fill="#666">"10" → 2</text>

  <!-- arrows between groups -->
  <path d="M 142 302 L 192 302" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 262 302 L 312 302" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 302 L 432 302" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Set + check -->
  <rect x="50" y="352" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">seen = {0, 1, 3, 2}，|seen| = 4 = 2^k → return true</text>
  <text x="310" y="388" text-anchor="middle" font-size="11" fill="#555">每步 O(1) 更新 + O(1) 入集，整体 O(n) 时间</text>

  <!-- footer -->
  <text x="310" y="418" text-anchor="middle" font-size="10.5" fill="#888">类比 187 重复的 DNA 序列：定长窗口 + 滚动哈希，只是本题哈希键 = 整数本身</text>
</svg>
