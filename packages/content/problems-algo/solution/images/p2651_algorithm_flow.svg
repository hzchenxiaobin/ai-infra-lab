<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求和 → 取模 24 → 返回</text>

  <!-- Step 1: inputs + sum -->
  <rect x="40" y="70" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">输入</text>
  <text x="100" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">arrivalTime, delayedTime</text>

  <line x1="160" y1="93" x2="206" y2="93" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sum -->
  <rect x="210" y="70" width="110" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="265" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">求和</text>
  <text x="265" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">sum = a + b</text>

  <line x1="320" y1="93" x2="366" y2="93" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: mod -->
  <rect x="370" y="70" width="110" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="90" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">取模</text>
  <text x="425" y="107" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">sum % 24</text>

  <!-- arrow down to return -->
  <line x1="425" y1="116" x2="425" y2="168" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="350" y="172" width="150" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回</text>
  <text x="425" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">return sum % 24</text>

  <!-- Decision note box (left) -->
  <rect x="40" y="172" width="300" height="110" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="192" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">取模同时处理两种情况：</text>
  <text x="50" y="212" font-size="11" fill="#4a7a3a" filter="url(#rough2)">• sum &lt; 24 → 原样返回（如 15+5=20）</text>
  <text x="50" y="230" font-size="11" fill="#b85450" filter="url(#rough2)">• sum ≥ 24 → 回绕到 0~23（如 13+11=24→0）</text>
  <text x="50" y="252" font-size="10" fill="#888" filter="url(#rough2)">等价写法：if (sum &gt;= 24) sum -= 24;</text>
  <text x="50" y="268" font-size="10" fill="#888" filter="url(#rough2)">（本题 sum ≤ 47，减一次即可）</text>

  <!-- connector from sum box down to note -->
  <path d="M 265 116 Q 265 144 200 172" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Complexity footer -->
  <rect x="40" y="300" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">时间 <tspan font-weight="bold" fill="#446688">O(1)</tspan> · 空间 <tspan font-weight="bold" fill="#446688">O(1)</tspan> · 仅一次加法与一次取模</text>
</svg>
