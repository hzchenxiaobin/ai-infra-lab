<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历 + 反转 + 入集合</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="54" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11" fill="#333">set = ∅</text>

  <!-- Arrow down -->
  <path d="M 260 76 L 260 90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有 num? -->
  <polygon points="260,94 340,130 260,166 180,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#333">遍历 nums</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#333">还有 num?</text>

  <!-- No -> return -->
  <path d="M 340 130 L 408 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="124" font-size="10" fill="#888">否</text>

  <rect x="408" y="112" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return |set|</text>

  <!-- Yes -> down -->
  <path d="M 260 166 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="178" font-size="10" fill="#888">是</text>

  <!-- Process: reverse digits -->
  <rect x="120" y="188" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反转数位</text>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#555">rev = 0; while x: rev = rev×10 + x%10; x //= 10</text>

  <!-- Arrow down -->
  <path d="M 260 242 L 260 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: add to set -->
  <rect x="120" y="262" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">set.add(num);  set.add(rev)</text>

  <!-- Loop back arrow -->
  <path d="M 120 282 L 72 282 L 72 130 L 178 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="56" y="210" font-size="10" fill="#888">下一个 num</text>

  <!-- Note -->
  <rect x="100" y="318" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#555">集合自动去重：重复加入无副作用</text>
</svg>
