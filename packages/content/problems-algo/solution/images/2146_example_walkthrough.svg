<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 逐层演算：BFS 从 (0,0) 出发，d=3 时停止</text>

  <!-- ====== Left: Grid with distance annotations ====== -->
  <text x="155" y="50" text-anchor="middle" font-size="11" fill="#888">grid 中标注：价格 / [距离d]</text>

  <!-- column indices -->
  <text x="80" y="66" text-anchor="middle" font-size="9" fill="#999">c=0</text>
  <text x="130" y="66" text-anchor="middle" font-size="9" fill="#999">c=1</text>
  <text x="180" y="66" text-anchor="middle" font-size="9" fill="#999">c=2</text>
  <text x="230" y="66" text-anchor="middle" font-size="9" fill="#999">c=3</text>

  <!-- row 0: (0,0)=1/d0, (0,1)=2/d1✓, (0,2)=0/wall, (0,3)=1/d2 -->
  <rect x="55" y="72" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="80" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">d=0</text>
  <circle cx="80" cy="84" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="80" y="88" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">S</text>

  <rect x="105" y="72" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="94" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="130" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">d=1✓</text>

  <rect x="155" y="72" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="14" fill="#666">■</text>

  <rect x="205" y="72" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="230" y="110" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">d=2</text>

  <!-- row 1: (1,0)=1/d1, (1,1)=3/d2✓, (1,2)=0/wall, (1,3)=1/d3 -->
  <rect x="55" y="122" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="144" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="80" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">d=1</text>

  <rect x="105" y="122" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="130" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">d=2✓</text>

  <rect x="155" y="122" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="14" fill="#666">■</text>

  <rect x="205" y="122" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="230" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">d=3</text>

  <!-- row 2: (2,0)=0/wall, (2,1)=2/d3✓stop, (2,2)=5/d4skip, (2,3)=1/d4skip -->
  <rect x="55" y="172" width="50" height="50" fill="#ccc" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="14" fill="#666">■</text>

  <rect x="105" y="172" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="194" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="130" y="210" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">d=3✓</text>
  <!-- stop marker -->
  <rect x="103" y="170" width="54" height="54" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" rx="3" filter="url(#rough2)"/>

  <rect x="155" y="172" width="50" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="180" y="210" text-anchor="middle" font-size="8" fill="#aaa">d=4</text>

  <rect x="205" y="172" width="50" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="194" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <text x="230" y="210" text-anchor="middle" font-size="8" fill="#aaa">d=4</text>

  <!-- BFS expansion arrows -->
  <!-- d=0 -> d=1: (0,0) to (0,1) -->
  <path d="M 105 97 L 103 97" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- d=0 -> d=1: (0,0) to (1,0) -->
  <path d="M 80 122 L 80 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stop label -->
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ d=3: 累计 3 ≥ k=3, 停止</text>

  <!-- ====== Right: Collection log ====== -->
  <rect x="300" y="56" width="250" height="200" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="425" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">收集日志 (pricing=[2,5])</text>

  <!-- table header -->
  <rect x="310" y="88" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="330" y="102" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">d</text>
  <rect x="350" y="88" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="370" y="102" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">价格</text>
  <rect x="390" y="88" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="415" y="102" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">坐标</text>
  <rect x="440" y="88" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="490" y="102" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">累计</text>

  <!-- row d=0: no collection -->
  <rect x="310" y="110" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <rect x="350" y="110" width="80" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="124" text-anchor="middle" font-size="10" fill="#999">— (价格1不在范围)</text>
  <rect x="440" y="110" width="100" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="490" y="124" text-anchor="middle" font-size="10" fill="#999">0</text>

  <!-- row d=1: collected (0,1) price=2 -->
  <rect x="310" y="132" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="330" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="350" y="132" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="370" y="146" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="390" y="132" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="415" y="146" text-anchor="middle" font-size="10" fill="#333">(0,1)</text>
  <rect x="440" y="132" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="490" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 &lt; 3, 继续</text>

  <!-- row d=2: collected (1,1) price=3 -->
  <rect x="310" y="154" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="330" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <rect x="350" y="154" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="370" y="168" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="390" y="154" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="415" y="168" text-anchor="middle" font-size="10" fill="#333">(1,1)</text>
  <rect x="440" y="154" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2 &lt; 3, 继续</text>

  <!-- row d=3: collected (2,1) price=2, stop -->
  <rect x="310" y="176" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="350" y="176" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="370" y="190" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="390" y="176" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="415" y="190" text-anchor="middle" font-size="10" fill="#333">(2,1)</text>
  <rect x="440" y="176" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="490" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 ≥ 3, 停!</text>

  <!-- d=4 skipped -->
  <rect x="310" y="198" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="330" y="212" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <rect x="350" y="198" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="390" y="212" text-anchor="middle" font-size="9" fill="#aaa">(2,2)价格5 — 未访问</text>
  <rect x="440" y="198" width="100" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="490" y="212" text-anchor="middle" font-size="10" fill="#aaa">跳过</text>

  <!-- ====== Bottom: Final sorted result ====== -->
  <rect x="300" y="270" width="250" height="150" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序结果 (距离,价格,行,列)</text>

  <!-- result row 1 -->
  <rect x="315" y="302" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="330" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">#1</text>
  <rect x="345" y="302" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="385" y="318" text-anchor="middle" font-size="10" fill="#333">(1, 2, 0, 1)</text>
  <rect x="425" y="302" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="455" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">→ [0,1]</text>

  <!-- result row 2 -->
  <rect x="315" y="328" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="330" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">#2</text>
  <rect x="345" y="328" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="385" y="344" text-anchor="middle" font-size="10" fill="#333">(2, 3, 1, 1)</text>
  <rect x="425" y="328" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="455" y="344" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">→ [1,1]</text>

  <!-- result row 3 -->
  <rect x="315" y="354" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="330" y="370" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">#3</text>
  <rect x="345" y="354" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="385" y="370" text-anchor="middle" font-size="10" fill="#333">(3, 2, 2, 1)</text>
  <rect x="425" y="354" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="455" y="370" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">→ [2,1]</text>

  <!-- final answer -->
  <rect x="315" y="386" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = [[0,1],[1,1],[2,1]] ✓</text>

  <!-- bottom note -->
  <text x="155" y="290" text-anchor="middle" font-size="10" fill="#888">■ = 墙(不可通行), 数字 = 价格, d = BFS距离</text>
  <text x="155" y="305" text-anchor="middle" font-size="10" fill="#888">✓ = 价格在[2,5]内被收集</text>
  <text x="155" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">虚线框 = 提前终止处</text>
</svg>
