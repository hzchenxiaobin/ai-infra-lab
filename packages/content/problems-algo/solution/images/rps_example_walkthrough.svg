<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三个示例演算</text>

  <rect x="20" y="48" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入</text>
  <text x="170" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">回文?</text>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删除过程</text>
  <text x="450" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案</text>

  <rect x="20" y="86" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ababa</text>
  <text x="170" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="170" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(a-b-a-b-a)</text>
  <text x="300" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整串即回文，1 次删完</text>
  <text x="450" y="122" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="20" y="152" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abb</text>
  <text x="170" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="170" y="198" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(a≠b)</text>
  <text x="300" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">①删 a 子序列 → "bb"</text>
  <text x="300" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">②删 bb → 空</text>
  <text x="450" y="188" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="20" y="218" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">baabb</text>
  <text x="170" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="170" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(b≠b 末)</text>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">①删 baab 子序列 → "b"</text>
  <text x="300" y="264" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">②删 b → 空</text>
  <text x="450" y="254" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="20" y="296" width="480" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">规律：整串回文 → 1 次</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">否则按字符种类删子序列，2 次必空</text>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">答案 ∈ {1, 2}（s 非空时）</text>
</svg>
