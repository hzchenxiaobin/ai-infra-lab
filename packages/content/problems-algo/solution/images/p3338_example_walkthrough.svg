<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：分区排名 → rn = 2 全保留 → HR 缺档缺席</text>

  <rect x="16" y="38" width="124" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Sales</text>

  <rect x="16" y="70" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 : 90000 → rn 1</text>

  <rect x="16" y="100" width="124" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="117" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 : 80000 → rn 2 ✓</text>

  <rect x="16" y="130" width="124" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="147" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3 : 80000 → rn 2 ✓</text>

  <rect x="16" y="160" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="177" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1 : 70000 → rn 3</text>

  <rect x="148" y="38" width="124" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">IT</text>

  <rect x="148" y="70" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 : 65000 → rn 1</text>

  <rect x="148" y="100" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 : 65000 → rn 1</text>

  <rect x="148" y="130" width="124" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="147" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5 : 55000 → rn 2 ✓</text>

  <rect x="280" y="38" width="124" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="342" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Marketing</text>

  <rect x="280" y="70" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 : 55000 → rn 1</text>

  <rect x="280" y="100" width="124" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="117" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8 : 50000 → rn 2 ✓</text>

  <rect x="412" y="38" width="124" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="474" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">HR</text>

  <rect x="412" y="70" width="124" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10 : 55000 → rn 1</text>

  <rect x="412" y="100" width="124" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="474" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">仅 1 档薪水</text>
  <text x="474" y="131" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">无 rn = 2 → 缺席</text>

  <path d="M 280 196 Q 280 210 280 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="214" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">WHERE rn = 2 → ORDER BY emp_id</text>

  <rect x="190" y="228" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">emp_id | dept</text>

  <rect x="190" y="258" width="180" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 | Sales</text>

  <rect x="190" y="284" width="180" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 | Sales</text>

  <rect x="190" y="310" width="180" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 | IT</text>

  <rect x="190" y="336" width="180" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 | Marketing</text>

  <text x="470" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙色 = rn 2</text>
  <text x="470" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">= 第二高档</text>
</svg>
