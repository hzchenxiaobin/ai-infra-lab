<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">有效单词的三条规则（须同时满足）</text>

  <!-- Rule 1 panel -->
  <rect x="30" y="40" width="500" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="64" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="56" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="78" y="68" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">不含数字 0-9</text>

  <!-- Rule 1 valid examples -->
  <rect x="80" y="92" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cat</text>

  <rect x="148" y="92" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a-b.</text>

  <!-- Rule 1 invalid examples -->
  <rect x="248" y="92" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1-s</text>

  <rect x="316" y="92" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b8d</text>

  <!-- check/cross labels -->
  <text x="100" y="128" font-size="9" fill="#4a7a3a" filter="url(#rough2)">valid</text>
  <text x="268" y="128" font-size="9" fill="#b85450" filter="url(#rough2)">invalid</text>

  <!-- Rule 2 panel -->
  <rect x="30" y="144" width="500" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="168" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="56" y="172" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="78" y="172" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">至多一个连字符 '-'，两侧须为小写字母</text>

  <!-- Rule 2 valid examples -->
  <rect x="80" y="196" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a-b</text>

  <rect x="148" y="196" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ba-c</text>

  <!-- Rule 2 invalid examples -->
  <rect x="248" y="196" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">-ab</text>

  <rect x="316" y="196" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ab-</text>

  <rect x="384" y="196" width="68" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a-b-c</text>

  <!-- Rule 3 panel -->
  <rect x="30" y="248" width="500" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="56" cy="272" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="56" y="276" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="78" y="276" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">至多一个标点 (! . ,)，须在 token 末尾</text>

  <!-- Rule 3 valid examples -->
  <rect x="80" y="300" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a!</text>

  <rect x="148" y="300" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a-b.</text>

  <rect x="216" y="300" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">!</text>

  <!-- Rule 3 invalid examples -->
  <rect x="316" y="300" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a!b</text>

  <rect x="384" y="300" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c.,</text>

  <!-- Bottom note -->
  <rect x="80" y="358" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">三条规则全部通过 → 该 token 是有效单词</text>
</svg>
