<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：四个 '?' 逐位贪心判定（顺序 h1 → h2 → m1 → m2）</text>

  <!-- ===== Step order labels on left ===== -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <circle cx="64" cy="115" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="64" y="119" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="64" cy="195" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="64" y="199" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="64" cy="265" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="64" y="269" fill="#d6a040" font-weight="bold">3</text>
    <circle cx="64" cy="335" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="64" y="339" fill="#d6a040" font-weight="bold">4</text>
  </g>

  <!-- ===== Input ===== -->
  <g filter="url(#rough2)">
    <rect x="210" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17"/>
    <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 time</text>
  </g>
  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== h1 decision ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="98" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="270" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">h1 == '?' ?</text>
  </g>
  <!-- Yes branch to right -->
  <path d="M 360 115 L 388 115" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="392" y="86" width="176" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="404" y="104" font-size="10" fill="#555">h2=='?' 或 h2≤'3' → <tspan fill="#b85450" font-weight="bold">'2'</tspan></text>
    <text x="404" y="120" font-size="10" fill="#555">否则（h2≥'4'）     → <tspan fill="#b85450" font-weight="bold">'1'</tspan></text>
    <text x="404" y="136" font-size="9" fill="#888">h1 取最大可行十位</text>
  </g>
  <!-- No branch down -->
  <path d="M 270 134 L 270 152" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="148" font-size="9" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- ===== h2 decision ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="178" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="270" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">h2 == '?' ?</text>
  </g>
  <path d="M 360 195 L 388 195" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="190" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="392" y="166" width="176" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="404" y="184" font-size="10" fill="#555">h1=='2' → <tspan fill="#b85450" font-weight="bold">'3'</tspan></text>
    <text x="404" y="200" font-size="10" fill="#555">h1=='0'/'1' → <tspan fill="#b85450" font-weight="bold">'9'</tspan></text>
    <text x="404" y="216" font-size="9" fill="#888">依赖已填好的 h1</text>
  </g>
  <path d="M 270 214 L 270 232" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="228" font-size="9" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- dependency note between h1 and h2 -->
  <path d="M 480 144 L 480 166" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="488" y="158" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">h1 已定</text>

  <!-- ===== m1 decision ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="248" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="270" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">m1 == '?' ?</text>
  </g>
  <path d="M 360 265 L 388 265" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="260" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="392" y="248" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="480" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ '5'  （分钟十位上限）</text>
  </g>
  <path d="M 270 284 L 270 302" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="298" font-size="9" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- ===== m2 decision ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="318" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="270" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">m2 == '?' ?</text>
  </g>
  <path d="M 360 335 L 388 335" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="330" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="392" y="318" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="480" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ '9'  （分钟个位上限）</text>
  </g>
  <path d="M 270 354 L 270 372" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="368" font-size="9" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- ===== Output ===== -->
  <g filter="url(#rough2)">
    <rect x="190" y="384" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="270" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回最晚时间</text>
    <text x="270" y="420" text-anchor="middle" font-size="10" fill="#555">O(1)，4 次条件判定</text>
  </g>

  <!-- ===== Footer note ===== -->
  <rect x="40" y="448" width="500" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="468" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 易错点：必须先填 h1 再填 h2</text>
  <text x="52" y="486" font-size="10" fill="#555" filter="url(#rough2)">h2 的判定（取 '3' 还是 '9'）依赖 h1 的最终取值。若 h1 本是 '?'，必须先填好它，h2 才能据此选择。</text>
  <text x="52" y="502" font-size="10" fill="#555" filter="url(#rough2)">反向顺序会让 h2 看到的 h1 仍是 '?'，需额外特判，徒增分支。</text>
  <text x="52" y="518" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">分钟 m1、m2 互不依赖，顺序可任意。</text>
</svg>
