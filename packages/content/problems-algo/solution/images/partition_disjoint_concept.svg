<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：max(left) ≤ min(right)，left 尽可能短</text>

  <!-- ===== Goal row ===== -->
  <text x="40" y="52" font-size="12" fill="#888">目标：在分界点切一刀，左侧最大 ≤ 右侧最小</text>
  <!-- left partition -->
  <rect x="76" y="60" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left: max = leftMax</text>
  <!-- right partition -->
  <rect x="256" y="60" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">right: min ≥ leftMax</text>
  <!-- separator arrow -->
  <path d="M 256 52 L 256 44" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="40" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">切分点</text>

  <!-- ===== Key insight ===== -->
  <text x="40" y="112" font-size="12" fill="#888">关键：扫描时遇到 nums[i] &lt; leftMax 怎么办？</text>

  <!-- Case A: element >= leftMax, can stay in right -->
  <text x="40" y="134" font-size="11" fill="#555" font-weight="bold">情形 A：nums[i] ≥ leftMax → 可留在 right</text>
  <!-- cells -->
  <rect x="76" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="159" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="120" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="159" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="164" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="159" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="208" y="140" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="252" y="140" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="159" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="306" y="159" font-size="10" fill="#82b366" font-weight="bold">8 ≥ leftMax=5 ✓ 留 right</text>

  <!-- Case B: element < leftMax, must join left -->
  <text x="40" y="186" font-size="11" fill="#555" font-weight="bold">情形 B：nums[i] &lt; leftMax → 必须并入 left</text>
  <!-- cells: boundary before 0 -->
  <rect x="76" y="192" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="211" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="120" y="192" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="192" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="211" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="208" y="192" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="211" text-anchor="middle" font-size="12" fill="#999">8</text>
  <rect x="252" y="192" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="211" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="306" y="211" font-size="10" fill="#b85450" font-weight="bold">0 &lt; leftMax=5 ✗ 必入 left</text>

  <!-- ===== Two maxima tracking ===== -->
  <text x="40" y="238" font-size="12" fill="#888">双最值同步追踪：leftMax（左段最大）+ curMax（已扫最大）</text>

  <rect x="60" y="246" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="263" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leftMax</text>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#666">左段 [0..boundary] 的最大值</text>

  <rect x="300" y="246" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="263" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">curMax</text>
  <text x="400" y="278" text-anchor="middle" font-size="10" fill="#666">已扫 [0..i] 的最大值</text>

  <!-- update arrow: when extend boundary, leftMax <- curMax -->
  <path d="M 300 266 L 264 266" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="258" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">并入时</text>
  <text x="282" y="280" text-anchor="middle" font-size="9" fill="#d6a040">leftMax=curMax</text>

  <!-- Core idea box -->
  <rect x="40" y="300" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一次扫描：nums[i] &lt; leftMax ⇒ boundary=i, leftMax=curMax</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">因为并入 left 的是整段 [旧 boundary+1 .. i]，其最大值正是 curMax</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">不会遗漏被跳过的大数；最终 boundary+1 即为 left 长度</text>
</svg>
