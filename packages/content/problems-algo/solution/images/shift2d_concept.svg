<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：2D 网格迁移 = 1D 数组右旋
  </text>

  <!-- Left: original 2D grid -->
  <text x="90" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">原始网格 (3×3)</text>
  <rect x="40" y="68" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="68" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="68" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="40" y="104" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="104" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="104" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="100" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="140" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <rect x="40" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="140" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="100" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="140" y="162" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- Arrow: flatten -->
  <path d="M 165 120 Q 210 120 250 120" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="207" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">行优先展开</text>

  <!-- Middle: 1D array -->
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">一维数组 (长度 9)</text>
  <rect x="255" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="291" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="327" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="363" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="399" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="435" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="471" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="507" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="543" y="68" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>

  <text x="273" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="309" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="345" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="381" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="417" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="453" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="489" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="525" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="561" y="90" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="273" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="309" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="345" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="381" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="417" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="453" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="489" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <text x="525" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="561" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>

  <!-- Arrow: right rotate k=1 -->
  <path d="M 370 132 Q 370 160 280 175" fill="none" stroke="#b85450" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">右旋 k=1</text>

  <!-- Bottom: rotated 1D array -->
  <text x="360" y="175" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">迁移后一维数组</text>
  <rect x="255" y="185" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="291" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="327" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="363" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="399" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="435" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="471" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="507" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="543" y="185" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="273" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="309" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="381" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="417" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="453" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="489" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="525" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="561" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- Arrow: reshape back -->
  <path d="M 255 210 Q 200 210 165 210" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="207" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">折回 3×3</text>

  <!-- Bottom-left: result grid -->
  <text x="90" y="175" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">迁移后网格</text>
  <rect x="40" y="185" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="185" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="185" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="207" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="100" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="40" y="221" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="221" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="221" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="243" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="243" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="243" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <rect x="40" y="257" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="257" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="257" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="100" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="140" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- Formula box -->
  <rect x="50" y="312" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    元素从位置 p 移到 (p + k) mod (m×n)
  </text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    k ≥ m×n 时取 k mod (m×n)，一个周期后回到原位
  </text>
</svg>
