<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">好二进制字符串数量 DP 流程</text>

  <!-- init -->
  <rect x="170" y="46" width="220" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">f[0]=1； f[1..maxLength]=0</text>
  <path d="M 280 82 L 280 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop label -->
  <rect x="180" y="100" width="200" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">对 i = 1 … maxLength 重复</text>
  <path d="M 280 128 L 280 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box1: if i>=oneGroup -->
  <rect x="110" y="146" width="340" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">若 i ≥ oneGroup： f[i] += f[i-oneGroup]</text>
  <path d="M 280 180 L 280 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box2: if i>=zeroGroup -->
  <rect x="110" y="196" width="340" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">若 i ≥ zeroGroup： f[i] += f[i-zeroGroup]</text>
  <path d="M 280 230 L 280 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box3: mod -->
  <rect x="160" y="246" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">f[i] %= 10⁹+7</text>

  <!-- back edge: i++ -->
  <path d="M 400 263 L 472 263 L 472 163 L 452 163" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="216" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">i++</text>

  <!-- exit arrow -->
  <path d="M 280 280 L 280 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="294" text-anchor="middle" font-size="11" fill="#9aa8b4" filter="url(#rough2)">i &gt; maxLength 退出</text>

  <!-- ans box -->
  <rect x="60" y="302" width="440" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">ans = Σ f[i]  (i = minLength … maxLength) mod 10⁹+7</text>
  <path d="M 280 342 L 280 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="190" y="358" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="14" fill="#2c4a22" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
