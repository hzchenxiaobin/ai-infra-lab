<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[1,3][2,3][3,7][6,6] / queries [2,3,1,7,6,8]</text>

  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查询升序处理：(1,#2) (2,#0) (3,#1) (6,#4) (7,#3) (8,#5)</text>

  <!-- Table header -->
  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold">
    <rect x="20" y="60" width="560" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="40" y="77" text-anchor="start">q,#j</text>
    <text x="120" y="77" text-anchor="start">入堆区间(left≤q)</text>
    <text x="300" y="77" text-anchor="start">弹堆(right&lt;q)</text>
    <text x="430" y="77" text-anchor="start">堆内(len,r)</text>
    <text x="560" y="77" text-anchor="end">ans[j]</text>
  </g>

  <!-- Row 1: q=1,#2 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="88" width="560" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="40" y="105" text-anchor="start" fill="#4a7a3a" font-weight="bold">1,#2</text>
    <text x="120" y="105" text-anchor="start">[1,3]→len3</text>
    <text x="300" y="105" text-anchor="start" fill="#aaa">—</text>
    <text x="430" y="105" text-anchor="start" fill="#446688" font-weight="bold">(3,3)</text>
    <text x="560" y="105" text-anchor="end" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Row 2: q=2,#0 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="116" width="560" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="40" y="133" text-anchor="start" fill="#4a7a3a" font-weight="bold">2,#0</text>
    <text x="120" y="133" text-anchor="start">[2,3]→len2</text>
    <text x="300" y="133" text-anchor="start" fill="#aaa">—</text>
    <text x="430" y="133" text-anchor="start" fill="#446688" font-weight="bold">(2,3),(3,3)</text>
    <text x="560" y="133" text-anchor="end" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row 3: q=3,#1 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="144" width="560" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="40" y="161" text-anchor="start" fill="#4a7a3a" font-weight="bold">3,#1</text>
    <text x="120" y="161" text-anchor="start">[3,7]→len5</text>
    <text x="300" y="161" text-anchor="start" fill="#aaa">—</text>
    <text x="430" y="161" text-anchor="start" fill="#446688" font-weight="bold">(2,3),(3,3),(5,7)</text>
    <text x="560" y="161" text-anchor="end" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row 4: q=6,#4 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="172" width="560" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="40" y="189" text-anchor="start" fill="#4a7a3a" font-weight="bold">6,#4</text>
    <text x="120" y="189" text-anchor="start">[6,6]→len1</text>
    <text x="300" y="189" text-anchor="start" fill="#b85450" font-weight="bold">弹(2,3),(3,3)</text>
    <text x="430" y="189" text-anchor="start" fill="#446688" font-weight="bold">(1,6),(5,7)</text>
    <text x="560" y="189" text-anchor="end" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- Row 5: q=7,#3 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="200" width="560" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="40" y="217" text-anchor="start" fill="#4a7a3a" font-weight="bold">7,#3</text>
    <text x="120" y="217" text-anchor="start" fill="#aaa">无新增</text>
    <text x="300" y="217" text-anchor="start" fill="#b85450" font-weight="bold">弹(1,6)</text>
    <text x="430" y="217" text-anchor="start" fill="#446688" font-weight="bold">(5,7)</text>
    <text x="560" y="217" text-anchor="end" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- Row 6: q=8,#5 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="20" y="228" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="40" y="245" text-anchor="start" fill="#4a7a3a" font-weight="bold">8,#5</text>
    <text x="120" y="245" text-anchor="start" fill="#aaa">无新增</text>
    <text x="300" y="245" text-anchor="start" fill="#b85450" font-weight="bold">弹(5,7)→堆空</text>
    <text x="430" y="245" text-anchor="start" fill="#aaa">∅</text>
    <text x="560" y="245" text-anchor="end" fill="#b85450" font-weight="bold">-1</text>
  </g>

  <!-- Result -->
  <rect x="20" y="266" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">恢复原序：ans = [2, 2, 3, 5, 1, -1] ✓</text>

  <!-- Key insight box -->
  <rect x="20" y="312" width="560" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="334" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键观察</text>

  <text x="36" y="356" font-size="11" fill="#555" filter="url(#rough2)">① q=6 时一次弹掉 (2,3) 与 (3,3)：它们的 right=3 &lt; 6，对 q=6 及后续 7、8 全部失效，</text>
  <text x="36" y="372" font-size="11" fill="#555" filter="url(#rough2)">   永久丢弃不回头。这正是「查询升序 → 过期即弃」的摊还保证。</text>

  <text x="36" y="396" font-size="11" fill="#555" filter="url(#rough2)">② 堆按 length 排序，弹尽无效后堆顶必是「含 q 的最短区间」，无需遍历整个堆。</text>

  <text x="36" y="420" font-size="11" fill="#555" filter="url(#rough2)">③ q=8 弹空堆 → -1：所有区间 right &lt; 8，没有区间能覆盖 8。</text>

  <text x="36" y="446" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">对照 1847：彼题按 minSize 降序累积候选 + 有序集合二分找最近；本题按 q 升序 + 最小堆取最短。</text>
</svg>
