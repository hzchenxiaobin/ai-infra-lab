<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：pos 滚动累加，移动完成后检查是否为 0</text>

  <!-- Example A title -->
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [2, 3, −5] → 答案 1</text>

  <!-- Example A table bg -->
  <rect x="40" y="64" width="600" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="40" y="160" width="600" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="64" width="600" height="130" fill="none" filter="url(#rough2)"/>

  <g stroke="#999" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="64" x2="40" y2="194"/>
    <line x1="90" y1="64" x2="90" y2="194"/>
    <line x1="160" y1="64" x2="160" y2="194"/>
    <line x1="320" y1="64" x2="320" y2="194"/>
    <line x1="420" y1="64" x2="420" y2="194"/>
    <line x1="520" y1="64" x2="520" y2="194"/>
    <line x1="640" y1="64" x2="640" y2="194"/>
    <line x1="40" y1="64" x2="640" y2="64"/>
    <line x1="40" y1="92" x2="640" y2="92"/>
    <line x1="40" y1="126" x2="640" y2="126"/>
    <line x1="40" y1="160" x2="640" y2="160"/>
    <line x1="40" y1="194" x2="640" y2="194"/>
  </g>

  <!-- A header -->
  <text x="65" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="125" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="240" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">移动</text>
  <text x="370" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos（移动后）</text>
  <text x="470" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos == 0 ?</text>
  <text x="580" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- A row 0 -->
  <text x="65" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="125" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+2</text>
  <text x="240" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右移 2：0 → 2</text>
  <text x="370" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="113" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="580" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- A row 1 -->
  <text x="65" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="125" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+3</text>
  <text x="240" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右移 3：2 → 5</text>
  <text x="370" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="470" y="147" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="580" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- A row 2 (green) -->
  <text x="65" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="125" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="240" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">左移 5：5 → 0</text>
  <text x="370" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">0</text>
  <text x="470" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 停在边界</text>
  <text x="580" y="181" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Example B title -->
  <text x="340" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：nums = [3, 2, −3, −4] → 答案 0</text>

  <!-- Example B table bg -->
  <rect x="40" y="234" width="600" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="40" y="364" width="600" height="34" fill="#fff8e1" filter="url(#rough2)"/>

  <g stroke="#999" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="234" x2="40" y2="398"/>
    <line x1="90" y1="234" x2="90" y2="398"/>
    <line x1="160" y1="234" x2="160" y2="398"/>
    <line x1="320" y1="234" x2="320" y2="398"/>
    <line x1="420" y1="234" x2="420" y2="398"/>
    <line x1="520" y1="234" x2="520" y2="398"/>
    <line x1="640" y1="234" x2="640" y2="398"/>
    <line x1="40" y1="234" x2="640" y2="234"/>
    <line x1="40" y1="262" x2="640" y2="262"/>
    <line x1="40" y1="296" x2="640" y2="296"/>
    <line x1="40" y1="330" x2="640" y2="330"/>
    <line x1="40" y1="364" x2="640" y2="364"/>
    <line x1="40" y1="398" x2="640" y2="398"/>
  </g>

  <!-- B header -->
  <text x="65" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="125" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">移动</text>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos（移动后）</text>
  <text x="470" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos == 0 ?</text>
  <text x="580" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- B row 0 -->
  <text x="65" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="125" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+3</text>
  <text x="240" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右移 3：0 → 3</text>
  <text x="370" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="283" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="580" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- B row 1 -->
  <text x="65" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="125" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+2</text>
  <text x="240" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右移 2：3 → 5</text>
  <text x="370" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="470" y="317" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="580" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- B row 2 -->
  <text x="65" y="351" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="125" y="351" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−3</text>
  <text x="240" y="351" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">左移 3：5 → 2</text>
  <text x="370" y="351" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="351" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="580" y="351" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- B row 3 (orange) -->
  <text x="65" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="125" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="240" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">左移 4：2 → −2</text>
  <text x="370" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">−2</text>
  <text x="470" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">✗ 途中路过 0</text>
  <text x="580" y="385" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- note strip -->
  <rect x="40" y="414" width="600" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="340" y="434" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">补充：nums = [1, −1, 1, −1] → pos 依次为 1, 0, 1, 0，答案 2 —— 可以多次返回，模拟不提前终止；</text>
  <text x="340" y="451" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点 pos = 0 不计入：「返回」只统计移动完成后恰好停在边界的次数。</text>
</svg>
