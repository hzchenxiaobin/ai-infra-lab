<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">合法重新排列数对：每对数对 = 有向边，重排 = 欧拉路径</text>
  <path d="M 185 44 Q 360 52 535 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="360" y="76" text-anchor="middle" font-size="12" fill="#666">示例 1：4 对数对构成有向图，重排后首尾相接</text>

  <!-- input pairs (left) -->
  <text x="60" y="108" font-size="12" font-weight="bold" fill="#446688">输入 pairs：</text>
  <g filter="url(#rough2)"><rect x="40" y="118" width="110" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="95" y="138" text-anchor="middle" font-size="12" fill="#2b4a6b">[5, 1]</text>
  <g filter="url(#rough2)"><rect x="40" y="154" width="110" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="95" y="174" text-anchor="middle" font-size="12" fill="#2b4a6b">[4, 5]</text>
  <g filter="url(#rough2)"><rect x="40" y="190" width="110" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="95" y="210" text-anchor="middle" font-size="12" fill="#2b4a6b">[11, 9]</text>
  <g filter="url(#rough2)"><rect x="40" y="226" width="110" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="95" y="246" text-anchor="middle" font-size="12" fill="#2b4a6b">[9, 4]</text>

  <!-- arrow from pairs to graph -->
  <path d="M 158 186 L 198 186" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="178" text-anchor="middle" font-size="10" fill="#888">建图</text>

  <!-- directed graph (chain) -->
  <text x="430" y="108" font-size="12" font-weight="bold" fill="#446688">有向图：</text>

  <g filter="url(#rough2)"><rect x="210" y="166" width="60" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="240" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">11</text>
  <text x="240" y="226" text-anchor="middle" font-size="10" fill="#d6a040">起点</text>

  <g filter="url(#rough2)"><rect x="320" y="166" width="60" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="350" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">9</text>

  <g filter="url(#rough2)"><rect x="430" y="166" width="60" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="460" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">4</text>

  <g filter="url(#rough2)"><rect x="540" y="166" width="60" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="570" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">5</text>

  <g filter="url(#rough2)"><rect x="650" y="166" width="56" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="678" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a2b28">1</text>
  <text x="678" y="226" text-anchor="middle" font-size="10" fill="#b85450">终点</text>

  <!-- arrows between graph nodes -->
  <path d="M 272 187 L 318 187" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 187 L 428 187" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 492 187 L 538 187" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 602 187 L 648 187" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edge labels -->
  <text x="295" y="180" text-anchor="middle" font-size="9" fill="#888">[11,9]</text>
  <text x="405" y="180" text-anchor="middle" font-size="9" fill="#888">[9,4]</text>
  <text x="515" y="180" text-anchor="middle" font-size="9" fill="#888">[4,5]</text>
  <text x="625" y="180" text-anchor="middle" font-size="9" fill="#888">[5,1]</text>

  <!-- note box -->
  <g filter="url(#rough2)"><rect x="80" y="262" width="560" height="60" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="360" y="286" text-anchor="middle" font-size="12" fill="#444">每对数对 = 一条有向边，要求全部用且只用一次</text>
  <text x="360" y="306" text-anchor="middle" font-size="12" fill="#444">→ 即「欧拉路径」：经过每条边恰好一次的迹</text>
</svg>
