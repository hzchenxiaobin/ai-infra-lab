<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：全配对网格 — 每个 a 出现 m 次、每个 b 出现 n 次</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">x ⊕ x = 0 ⇒ 重复偶数次抵消为 0，奇数次留下自身</text>

  <!-- Axis labels -->
  <text x="96" y="74" text-anchor="end" font-size="10.5" fill="#666">nums2 →</text>
  <text x="60" y="140" font-size="10.5" fill="#666">nums1</text>
  <text x="60" y="154" font-size="10.5" fill="#666">↓</text>

  <!-- Column headers (nums2 = 10,2,5,0) -->
  <text x="141" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="183" y="80" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="225" y="80" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="267" y="80" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- Row labels (nums1 = 2,1,3) -->
  <text x="110" y="111" text-anchor="end" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="110" y="141" text-anchor="end" font-size="12" fill="#333">1</text>
  <text x="110" y="171" text-anchor="end" font-size="12" fill="#333">3</text>

  <!-- Grid cells: 3 rows x 4 cols, cell 42x30, origin (120,92) -->
  <!-- Col 0 cells (rows 1,2) green highlight -->
  <rect x="120" y="122" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="152" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Row 0 cells (cols 0..3) orange highlight (col0,row0 overlapped: orange fill + green thick border) -->
  <rect x="120" y="92" width="42" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="162" y="92" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="204" y="92" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="92" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Remaining plain cells -->
  <rect x="162" y="122" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="204" y="122" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="122" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="162" y="152" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="204" y="152" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="152" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Right-side legend -->
  <rect x="306" y="100" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="326" y="110" font-size="10.5" fill="#444">整行：a 配全部 m 个 b → 出现 m 次</text>
  <rect x="306" y="122" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="326" y="132" font-size="10.5" fill="#444">整列：b 配全部 n 个 a → 出现 n 次</text>
  <path d="M 312 140 L 312 156" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="162" font-size="10.5" fill="#666">格子 = 一对 (a⊕b)</text>

  <!-- Rule box -->
  <rect x="40" y="206" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⊕ 的交换+结合律：⊕₍ᵢ,ⱼ₎(aᵢ ⊕ bⱼ) = ⊕ᵢ(aᵢ 重复 m 次) ⊕ ⊕ⱼ(bⱼ 重复 n 次)</text>
  <text x="260" y="236" text-anchor="middle" font-size="10.5" fill="#555">m=len(nums2)，n=len(nums1)；同一值出现偶数次自我抵消</text>

  <!-- Formula box -->
  <rect x="40" y="250" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果 = (m 奇 ? ⊕nums1 : 0) ⊕ (n 奇 ? ⊕nums2 : 0)</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#555">只关心两数组长度奇偶 + 各自异或和，与元素如何配对无关</text>

  <!-- Footer -->
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#888">关键不变式：每个 aᵢ 恰被各 bⱼ 配一次（共 m 次），每个 bⱼ 恰被各 aᵢ 配一次（共 n 次）</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#aaa">对比逐位计数：第 k 位结果 = (n·c2 + m·c1) mod 2，c1/c2 为两数组第 k 位 1 的个数</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">→ 二者等价，本式更简洁，无需逐位</text>
</svg>
