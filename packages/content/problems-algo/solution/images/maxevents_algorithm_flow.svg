<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="620" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按天扫描 + 小根堆（跳天优化）</text>

  <!-- 1. Start oval -->
  <ellipse cx="200" cy="62" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <!-- 2. sort rect -->
  <rect x="110" y="96" width="180" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="11" fill="#333">events 按 startDay 升序排序</text>

  <!-- 3. init rect -->
  <rect x="110" y="146" width="180" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="167" text-anchor="middle" font-size="11" fill="#333">i=0, d=1, pq=∅, ans=0</text>

  <!-- 4. loop diamond: i<n or pq!=∅ -->
  <polygon points="200,196 300,242 200,288 100,242" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="238" text-anchor="middle" font-size="11" fill="#333">i&lt;n 或</text>
  <text x="200" y="252" text-anchor="middle" font-size="11" fill="#333">pq≠∅ ?</text>

  <!-- loop No -> return ans (right) -->
  <rect x="360" y="225" width="120" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <path d="M 300 242 L 356 242" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="328" y="234" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- arrow 3->4 -->
  <path d="M 200 180 L 200 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow 2->3 -->
  <path d="M 200 130 L 200 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow 1->2 -->
  <path d="M 200 80 L 200 96" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow 4 Yes -> 5 (down) -->
  <path d="M 200 288 L 200 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="302" font-size="10" fill="#4a7a3a">是</text>

  <!-- 5. diamond: pq empty? -->
  <polygon points="200,308 286,348 200,388 114,348" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#333">pq 为空 ?</text>

  <!-- 5 Yes -> jump rect (right) -->
  <rect x="330" y="332" width="150" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="347" text-anchor="middle" font-size="10" fill="#333">d ← events[i].start</text>
  <text x="405" y="360" text-anchor="middle" font-size="9" fill="#d6a040">（跳天，避免空转）</text>
  <path d="M 286 348 L 326 348" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="340" text-anchor="middle" font-size="10" fill="#d6a040">是</text>

  <!-- jump rect -> merge down to push (go down then left) -->
  <path d="M 405 366 L 405 398 L 290 398 L 290 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5 No -> down to push -->
  <path d="M 200 388 L 200 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="404" font-size="10" fill="#4a7a3a">否</text>

  <!-- 6. push rect -->
  <rect x="90" y="410" width="220" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="431" text-anchor="middle" font-size="10" fill="#333">入堆：start≤d 的 endDay，i++</text>

  <!-- 7. clean rect -->
  <rect x="90" y="460" width="220" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="481" text-anchor="middle" font-size="10" fill="#333">清过期：弹出堆顶 end&lt;d</text>

  <!-- arrow 6->7 -->
  <path d="M 200 444 L 200 460" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 8. diamond pq!=∅? -->
  <polygon points="200,506 286,542 200,578 114,542" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="546" text-anchor="middle" font-size="11" fill="#333">pq≠∅ ?</text>
  <!-- arrow 7->8 -->
  <path d="M 200 494 L 200 506" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 8 No -> loop back (left up to node 4 left side at 100,242) -->
  <path d="M 114 542 L 50 542 L 50 242 L 96 242" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="10" fill="#b85450">否，回循环</text>

  <!-- 8 Yes -> 9 attend rect -->
  <path d="M 200 578 L 200 592" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="588" font-size="10" fill="#4a7a3a">是</text>
  <rect x="90" y="592" width="220" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="608" text-anchor="middle" font-size="10" fill="#2f5a22" font-weight="bold">弹堆顶参加, ans++, d++</text>

  <!-- 9 -> loop back up the right side to node 4 right (300,242) -->
  <path d="M 310 603 L 540 603 L 540 242 L 304 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="552" y="424" font-size="10" fill="#4a7a3a">回循环</text>
</svg>
