<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 + 前缀和</text>

  <!-- ① -->
  <rect x="120" y="38" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="58" text-anchor="middle" font-size="11" fill="#333">① 统计频次 cnt[a], a ∈ [1,120]</text>
  <path d="M 230 68 L 230 82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="120" y="82" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="102" text-anchor="middle" font-size="11" fill="#333">② 构建前缀和 prefix[i]</text>
  <path d="M 230 112 L 230 126" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ loop header -->
  <rect x="120" y="126" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="11" fill="#333">③ for x = 15 .. 120</text>
  <path d="M 230 156 L 230 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond cnt[x]==0? -->
  <polygon points="230,170 300,194 230,218 160,194" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="11" fill="#333">cnt[x]==0 ?</text>
  <!-- Yes -> 跳过 -->
  <path d="M 300 194 L 345 194" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="188" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="345" y="180" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="391" y="198" text-anchor="middle" font-size="10" fill="#333">跳过 continue</text>
  <!-- No -> down -->
  <path d="M 230 218 L 230 234" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="230" font-size="9" fill="#4a7a3a">否</text>

  <!-- ④ -->
  <rect x="100" y="234" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="251" text-anchor="middle" font-size="11" fill="#333">④ lower = x/2 + 8</text>
  <text x="230" y="264" text-anchor="middle" font-size="11" fill="#333">count = prefix[x] − prefix[lower−1]</text>
  <path d="M 230 268 L 230 280" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ -->
  <rect x="100" y="280" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="300" text-anchor="middle" font-size="11" fill="#333">⑤ ans += cnt[x] × (count − 1)</text>

  <!-- loop back: from ⑤ right -> up to ③ ; and 跳过 merges in -->
  <path d="M 360 295 L 460 295 L 460 141 L 340 141" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="468" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 468 218)">下一 x</text>
  <!-- 跳过 merges into loopback vertical at x=460 -->
  <path d="M 437 194 L 460 194" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- exit to return -->
  <path d="M 230 310 L 230 326" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="322" font-size="9" fill="#888">遍历结束</text>
  <rect x="120" y="326" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="343" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
</svg>
