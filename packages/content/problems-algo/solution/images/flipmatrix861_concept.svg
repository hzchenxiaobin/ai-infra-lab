<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：最高位权重压倒 + 两阶段贪心</text>

  <!-- ===== Section 1: MSB dominance ===== -->
  <text x="310" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">观察一：第 0 列权重 &gt; 其余各列权重之和</text>

  <!-- bit row labels -->
  <text x="150" y="86" font-size="11" fill="#888">某行</text>
  <!-- bit cells: [1,0,1,1] -->
  <rect x="210" y="70" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="90" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="260" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="310" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="90" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="360" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="90" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- weight labels under each col -->
  <text x="150" y="124" font-size="11" fill="#888">位权</text>
  <rect x="210" y="110" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2^(n−1)</text>
  <rect x="260" y="110" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#446688">2^(n−2)</text>
  <rect x="310" y="110" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="128" text-anchor="middle" font-size="11" fill="#446688">2^1</text>
  <rect x="360" y="110" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="128" text-anchor="middle" font-size="11" fill="#446688">2^0</text>

  <!-- comparison: n=4 -> 8 vs 7 -->
  <rect x="120" y="150" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="205" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最高位 = 2^(n−1) = 8</text>
  <rect x="330" y="150" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">其余之和 = 4+2+1 = 7</text>
  <text x="310" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="310" y="196" text-anchor="middle" font-size="11" fill="#b85450">故最高位 0→1 的收益压倒一切，必须先让第 0 列全 1</text>

  <!-- divider -->
  <line x1="40" y1="214" x2="580" y2="214" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Section 2: two-phase greedy ===== -->
  <text x="310" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">观察二：两阶段贪心（行翻锁最高位，列翻各列独立）</text>

  <!-- Phase 1 box (left) -->
  <rect x="30" y="252" width="270" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="165" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">阶段一：行翻转</text>

  <!-- before flip: col0 = [0,1,1] -->
  <text x="50" y="300" font-size="11" fill="#444">翻前第 0 列</text>
  <rect x="60" y="306" width="30" height="26" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="60" y="336" width="30" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="354" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="60" y="366" width="30" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="384" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- arrow: flip rows whose col0 == 0 -->
  <path d="M 100 346 L 140 346" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a">翻 row0</text>

  <!-- after flip: col0 = [1,1,1] -->
  <text x="170" y="300" font-size="11" fill="#444">翻后第 0 列</text>
  <rect x="190" y="306" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="190" y="336" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="190" y="366" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="165" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a">grid[i][0]==0 则翻第 i 行</text>
  <text x="165" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">锁定贡献 m × 2^(n−1)</text>

  <!-- Phase 2 box (right) -->
  <rect x="320" y="252" width="270" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="455" y="274" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">阶段二：逐列最大化</text>

  <!-- col j: ones vs m-ones -->
  <text x="455" y="300" text-anchor="middle" font-size="11" fill="#444">对每个列 j ≥ 1 统计 1 的个数</text>

  <rect x="350" y="312" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="332" text-anchor="middle" font-size="12" fill="#446688">ones 个 1</text>

  <rect x="470" y="312" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="515" y="332" text-anchor="middle" font-size="12" fill="#446688">m−ones 个 0</text>

  <text x="455" y="360" text-anchor="middle" font-size="11" fill="#444">翻 / 不翻该列二选一：</text>
  <rect x="360" y="370" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="390" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">取 max(ones, m−ones)</text>

  <text x="455" y="418" text-anchor="middle" font-size="11" fill="#d6a040">各列互不影响，独立取 max</text>
  <text x="455" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">累加 × 2^(n−1−j)</text>

  <!-- arrow between two phases -->
  <path d="M 300 352 L 320 352" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
