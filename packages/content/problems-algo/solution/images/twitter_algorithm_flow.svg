<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="600" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">四个操作的算法流程</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== postTweet ===== -->
  <g filter="url(#sk)"><rect x="60" y="72" width="360" height="170" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="240" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">postTweet(userId, tweetId)</text>

  <g filter="url(#sk)"><rect x="84" y="114" width="312" height="34" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="136" text-anchor="middle" font-size="12" fill="#333">① time++（获取全局递增时间戳）</text>

  <g filter="url(#sk)"><rect x="84" y="156" width="312" height="34" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="240" y="178" text-anchor="middle" font-size="12" fill="#333">② userTweets[userId].push_back({time, tweetId})</text>

  <g filter="url(#sk)"><rect x="84" y="198" width="312" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">完成  O(1)  ← 尾插 + 计数器自增</text>

  <!-- ===== follow / unfollow ===== -->
  <g filter="url(#sk)"><rect x="480" y="72" width="320" height="170" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="640" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">follow / unfollow</text>

  <g filter="url(#sk)"><rect x="504" y="114" width="272" height="34" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="640" y="136" text-anchor="middle" font-size="12" fill="#333">follow(f, t):  following[f].insert(t)</text>

  <g filter="url(#sk)"><rect x="504" y="156" width="272" height="34" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="640" y="178" text-anchor="middle" font-size="12" fill="#333">unfollow(f, t): following[f].erase(t)</text>

  <g filter="url(#sk)"><rect x="504" y="198" width="272" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="640" y="220" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">完成  O(1)  ← 哈希集合增删</text>

  <!-- ===== getNewsFeed (big) ===== -->
  <g filter="url(#sk)"><rect x="60" y="266" width="740" height="300" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="430" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">getNewsFeed(userId)  ← 核心操作</text>

  <!-- Step 1 -->
  <g filter="url(#sk)"><rect x="84" y="308" width="692" height="40" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="100" y="328" font-size="12" font-weight="bold" fill="#b03a3a">①</text>
  <text x="120" y="328" font-size="12" fill="#333">收集用户集合 users = {userId} ∪ following[userId]</text>
  <text x="540" y="328" font-size="10.5" fill="#888">（用户自己 + 所有关注的人）</text>

  <!-- Step 2 -->
  <g filter="url(#sk)"><rect x="84" y="356" width="692" height="40" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="100" y="376" font-size="12" font-weight="bold" fill="#b03a3a">②</text>
  <text x="120" y="376" font-size="12" fill="#333">建最大堆，遍历 users：若该用户有推文，取其最后一条（最新）入堆</text>
  <text x="580" y="376" font-size="10.5" fill="#888">堆元素 = (time, userId, index)</text>

  <!-- Step 3 - decision -->
  <g filter="url(#sk)"><polygon points="330,406 530,406 510,438 350,438" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="430" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">结果 < 10 条 且 堆非空?</text>

  <!-- Yes branch -->
  <path d="M 330 422 Q 200 422 180 460" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="442" font-size="10.5" fill="#2e6e2e" font-weight="bold">是 ↓</text>

  <g filter="url(#sk)"><rect x="84" y="468" width="240" height="82" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="96" y="488" font-size="11" font-weight="bold" fill="#2b6e9e">③a. 堆顶出列</text>
  <text x="96" y="506" font-size="10.5" fill="#555">→ 取 tweetId 加入结果</text>
  <text x="96" y="522" font-size="10.5" fill="#555">→ 该用户 index−1</text>
  <text x="96" y="538" font-size="10.5" fill="#555">→ 若还有推文，下一条入堆</text>

  <!-- loop back -->
  <path d="M 204 468 Q 204 430 330 422" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="180" y="448" font-size="9.5" fill="#888">循环</text>

  <!-- No branch -->
  <path d="M 530 422 Q 640 422 660 460" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="570" y="442" font-size="10.5" fill="#b85450" font-weight="bold">否 ↓</text>

  <g filter="url(#sk)"><rect x="540" y="468" width="236" height="82" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="658" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">④ 返回结果列表</text>
  <text x="658" y="510" text-anchor="middle" font-size="10.5" fill="#555">已收集 10 条 或 堆已空</text>
  <text x="658" y="528" text-anchor="middle" font-size="10.5" fill="#555">O(10 · log F)</text>
  <text x="658" y="544" text-anchor="middle" font-size="9.5" fill="#888">F = 关注人数 + 1</text>

  <!-- bottom note -->
  <text x="430" y="584" text-anchor="middle" font-size="10.5" fill="#888">getNewsFeed 只取 10 条 → 堆中每次只放每路当前最新一条 → 高效归并，无需全量排序</text>
</svg>
