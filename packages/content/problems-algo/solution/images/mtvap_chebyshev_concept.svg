<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：两点间最短时间 = max(|dx|, |dy|)
  </text>

  <!-- ====== Left: coordinate grid with path ====== -->
  <text x="160" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    A(1,1) → B(4,3)，dx=3, dy=2
  </text>

  <!-- grid lines -->
  <path d="M 70 128 L 70 280 M 108 128 L 108 280 M 146 128 L 146 280 M 184 128 L 184 280 M 222 128 L 222 280 M 260 128 L 260 280"
        fill="none" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 70 280 L 260 280 M 70 242 L 260 242 M 70 204 L 260 204 M 70 166 L 260 166 M 70 128 L 260 128"
        fill="none" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- axes labels -->
  <text x="266" y="284" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="66" y="124" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="68" y="294" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="108" y="294" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="146" y="294" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="184" y="294" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="222" y="294" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- dx projection (dashed) -->
  <path d="M 108 242 L 222 242" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="165" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">|dx|=3</text>

  <!-- dy projection (dashed) -->
  <path d="M 222 242 L 222 166" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="240" y="208" font-size="11" fill="#b85450" filter="url(#rough2)">|dy|=2</text>

  <!-- optimal path: 2 diagonal (green) + 1 straight (orange) -->
  <path d="M 108 242 L 146 204" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 146 204 L 184 166" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 184 166 L 222 166" fill="none" stroke="#d6a040" stroke-width="2.5"
        marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- waypoint dots -->
  <circle cx="108" cy="242" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="146" cy="204" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="184" cy="166" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="222" cy="166" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- point labels -->
  <text x="98" y="238" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A(1,1)</text>
  <text x="232" y="162" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B(4,3)</text>

  <!-- step labels -->
  <text x="127" y="230" font-size="9" fill="#4a7a3a" filter="url(#rough2)">对角</text>
  <text x="165" y="192" font-size="9" fill="#4a7a3a" filter="url(#rough2)">对角</text>
  <text x="203" y="158" font-size="9" fill="#d6a040" filter="url(#rough2)">水平</text>

  <!-- ====== Right: formula breakdown ====== -->
  <rect x="300" y="68" width="240" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">
    时间拆解
  </text>

  <text x="320" y="120" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    ① 对角步数 = min(|dx|, |dy|)
  </text>
  <text x="340" y="140" font-size="11" fill="#555" filter="url(#rough2)">
    每步同时推进 x、y 各 1
  </text>

  <text x="320" y="166" font-size="12" fill="#d6a040" filter="url(#rough2)">
    ② 直线步数 = | |dx| − |dy| |
  </text>
  <text x="340" y="186" font-size="11" fill="#555" filter="url(#rough2)">
    补齐多出来的单方向距离
  </text>

  <line x1="320" y1="202" x2="520" y2="202" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="320" y="224" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    总时间 = ① + ②
  </text>
  <text x="340" y="246" font-size="12" fill="#333" filter="url(#rough2)">
    = max(|dx|, |dy|)
  </text>

  <!-- example numbers -->
  <rect x="300" y="284" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    本例：min(3,2)=2 对角 + 1 直线
  </text>
  <text x="420" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    = max(3, 2) = 3 秒
  </text>

  <!-- bottom note -->
  <text x="160" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    对角线「买一送一」——同时消化 x、y
  </text>
</svg>
