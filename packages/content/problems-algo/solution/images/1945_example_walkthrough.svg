<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "zbax", k = 2</text>

  <!-- ===== Step 1: convert + first digit sum ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">步骤 1：字母 → 数值 → 数位和（逐字母累加）</text>

  <!-- Table header -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="90" y="80">字母</text>
    <text x="180" y="80">数值 v</text>
    <text x="290" y="80">v / 10</text>
    <text x="380" y="80">v % 10</text>
    <text x="470" y="80">数位和</text>
  </g>

  <!-- Row z -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="88" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="107">z</text>
    <rect x="150" y="88" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="107">26</text>
    <text x="290" y="107">2</text>
    <text x="380" y="107">6</text>
    <rect x="430" y="88" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="107" fill="#4a7a3a" font-weight="bold">8</text>
  </g>

  <!-- Row b -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="120" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="139">b</text>
    <rect x="150" y="120" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="139">2</text>
    <text x="290" y="139">0</text>
    <text x="380" y="139">2</text>
    <rect x="430" y="120" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="139" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- Row a -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="152" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="171">a</text>
    <rect x="150" y="152" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="171">1</text>
    <text x="290" y="171">0</text>
    <text x="380" y="171">1</text>
    <rect x="430" y="152" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="171" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- Row x -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="184" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="203">x</text>
    <rect x="150" y="184" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="203">24</text>
    <text x="290" y="203">2</text>
    <text x="380" y="203">4</text>
    <rect x="430" y="184" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="203" fill="#4a7a3a" font-weight="bold">6</text>
  </g>

  <!-- R1 sum -->
  <path d="M 470 216 L 470 234" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="370" y="238" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="258" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">R₁ = 8 + 2 + 1 + 6 = 17</text>

  <!-- Divider -->
  <path d="M 30 286 L 530 286" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step 2: second digit sum (k=2, so 1 more iteration) ===== -->
  <text x="40" y="312" font-size="12" fill="#555" font-weight="bold">步骤 2：第 2 次数位和（k = 2，再做 1 次）</text>

  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="324" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="344">R₁ = 17</text>
    <text x="180" y="342" font-size="11" fill="#888">数位和：</text>
    <rect x="230" y="324" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="344">1 + 7</text>
    <path d="M 300 339 L 340 339" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <rect x="350" y="324" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
    <text x="390" y="344" fill="#4a7a3a" font-weight="bold">= 8</text>
  </g>

  <!-- Result -->
  <rect x="100" y="374" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果：k 次转换后 → 8 ✓</text>

  <!-- note -->
  <text x="40" y="428" font-size="10.5" fill="#888">验证："zbax" → 262124 → 17 → 8，与暴力路径完全一致，但全程未构造大整数。</text>
</svg>
