<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU2" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,8 L5,2 L10,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树 DP：最远路 = 先上到某祖先 A，再下钻 A 的另一棵子树</text>

  <circle cx="280" cy="78" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <text x="280" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">转折点（含 start 的子树的祖先）</text>

  <circle cx="196" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="152" text-anchor="middle" font-size="10" fill="#333">c</text>
  <text x="160" y="150" font-size="10" fill="#446688">含 start 的孩子</text>

  <circle cx="136" cy="230" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="136" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">start</text>

  <path d="M 196 133 L 268 94" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrU2)" filter="url(#rough2)"/>
  <path d="M 136 214 L 188 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrU2)" filter="url(#rough2)"/>
  <text x="120" y="190" font-size="10" fill="#b85450">↑ dist(start→A)</text>

  <circle cx="362" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="362" y="152" text-anchor="middle" font-size="10" fill="#333">s</text>
  <text x="382" y="146" font-size="10" fill="#4a7a3a">另一棵子树</text>

  <path d="M 292 94 L 350 136" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <circle cx="430" cy="210" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="214" text-anchor="middle" font-size="10" fill="#333">叶</text>
  <path d="M 372 162 L 418 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="400" y="176" font-size="10" fill="#4a7a3a">↓ height(s)</text>

  <rect x="100" y="268" width="360" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#8a6a20">在转折点 A 处用「上行距离 + 兄弟子树高度」更新答案：</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = max(ans, dist(start→A) + 1 + height(兄弟子树))</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888">每个候选转折点（含 start 自身向下）取 max，即得离心率</text>
</svg>
