<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：chars="atach"，逐词统计频率并比较</text>

  <!-- ===== supply row ===== -->
  <text x="36" y="52" font-size="11" fill="#446688" font-weight="bold">supply（公共供应，所有词共用）：</text>
  <g filter="url(#rough2)">
    <!-- letters header -->
    <rect x="36" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="56" y="74" text-anchor="middle" font-size="11" fill="#888">a</text>
    <rect x="76" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="96" y="74" text-anchor="middle" font-size="11" fill="#888">b</text>
    <rect x="116" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="136" y="74" text-anchor="middle" font-size="11" fill="#888">c</text>
    <rect x="156" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="176" y="74" text-anchor="middle" font-size="11" fill="#888">e</text>
    <rect x="196" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="216" y="74" text-anchor="middle" font-size="11" fill="#888">h</text>
    <rect x="236" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="256" y="74" text-anchor="middle" font-size="11" fill="#888">r</text>
    <rect x="276" y="60" width="40" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="296" y="74" text-anchor="middle" font-size="11" fill="#888">t</text>
    <!-- values -->
    <rect x="36" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="56" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="76" y="80" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="96" y="96" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="116" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="136" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="156" y="80" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="176" y="96" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="196" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="216" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="236" y="80" width="40" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="256" y="96" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="276" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="296" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- divider -->
  <line x1="36" y1="116" x2="540" y2="116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== per-word rows ===== -->
  <text x="36" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">逐词判定（need 只列出该词涉及的字母，与 supply 对位比较）：</text>

  <!-- column headers for rows -->
  <text x="56" y="156" text-anchor="middle" font-size="10" fill="#888">单词</text>
  <text x="160" y="156" text-anchor="middle" font-size="10" fill="#888">need vs supply（仅列涉及字母）</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#888">判定</text>
  <text x="510" y="156" text-anchor="middle" font-size="10" fill="#888">ans</text>

  <!-- ===== Row 1: cat (good) ===== -->
  <g filter="url(#rough2)">
    <rect x="36" y="164" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="56" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cat</text>
    <!-- c:1<=1, a:1<=2, t:1<=1 -->
    <rect x="100" y="166" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="140" y="180" text-anchor="middle" font-size="11" fill="#333">c:1≤1 ✓</text>
    <rect x="186" y="166" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="226" y="180" text-anchor="middle" font-size="11" fill="#333">a:1≤2 ✓</text>
    <rect x="272" y="166" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="312" y="180" text-anchor="middle" font-size="11" fill="#333">t:1≤1 ✓</text>
    <rect x="400" y="166" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="430" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好词</text>
    <text x="510" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- ===== Row 2: bt (bad) ===== -->
  <g filter="url(#rough2)">
    <rect x="36" y="194" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="56" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bt</text>
    <rect x="100" y="196" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="140" y="210" text-anchor="middle" font-size="11" fill="#333">b:1&gt;0 ✗</text>
    <rect x="186" y="196" width="80" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="226" y="210" text-anchor="middle" font-size="11" fill="#aaa">t:1≤1 ✓</text>
    <rect x="400" y="196" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="430" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">淘汰</text>
    <text x="510" y="211" text-anchor="middle" font-size="12" fill="#888">3</text>
  </g>

  <!-- ===== Row 3: hat (good) ===== -->
  <g filter="url(#rough2)">
    <rect x="36" y="224" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="56" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hat</text>
    <rect x="100" y="226" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="140" y="240" text-anchor="middle" font-size="11" fill="#333">h:1≤1 ✓</text>
    <rect x="186" y="226" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="226" y="240" text-anchor="middle" font-size="11" fill="#333">a:1≤2 ✓</text>
    <rect x="272" y="226" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="312" y="240" text-anchor="middle" font-size="11" fill="#333">t:1≤1 ✓</text>
    <rect x="400" y="226" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="430" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好词</text>
    <text x="510" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  </g>

  <!-- ===== Row 4: tree (bad) ===== -->
  <g filter="url(#rough2)">
    <rect x="36" y="254" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="56" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">tree</text>
    <rect x="100" y="256" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="140" y="270" text-anchor="middle" font-size="11" fill="#333">t:1≤1 ✓</text>
    <rect x="186" y="256" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="226" y="270" text-anchor="middle" font-size="11" fill="#333">r:1&gt;0 ✗</text>
    <rect x="272" y="256" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="312" y="270" text-anchor="middle" font-size="11" fill="#333">e:2&gt;0 ✗</text>
    <rect x="400" y="256" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="430" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">淘汰</text>
    <text x="510" y="271" text-anchor="middle" font-size="12" fill="#888">6</text>
  </g>

  <!-- divider -->
  <line x1="36" y1="296" x2="540" y2="296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== note: tree length passes prune but fails freq ===== -->
  <text x="36" y="318" font-size="11" fill="#888">注：tree 长度 4 ≤ 5 通过长度剪枝，但频率比较时 r、e 供应不足被淘汰</text>
  <text x="36" y="336" font-size="11" fill="#888">　　→ 长度剪枝只看总量，频率比较看分布，更精确</text>

  <!-- ===== accumulate arrows ===== -->
  <text x="36" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">好词长度累加：</text>

  <g filter="url(#rough2)">
    <rect x="120" y="358" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="150" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cat:3</text>
    <text x="195" y="373" text-anchor="middle" font-size="12" fill="#888">+</text>
    <rect x="210" y="358" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="240" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hat:3</text>
  </g>

  <path d="M 240 380 L 240 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="394" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 3 + 3 = 6</text>

  <text x="240" y="438" text-anchor="middle" font-size="10" fill="#888">bt、tree 因字符供应不足被淘汰，不计入</text>
</svg>
