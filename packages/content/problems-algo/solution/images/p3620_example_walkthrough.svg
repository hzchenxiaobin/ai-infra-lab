<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：k = 12，节点 3 离线，答案 6</text>

  <text x="408" y="56" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最优路径 0→2→4，分数 = min(6,6) = 6</text>

  <circle cx="55" cy="125" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="185" cy="75" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="185" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="330" cy="200" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="330" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="330" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">离线 ✗</text>
  <circle cx="445" cy="125" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 70 119 L 165 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">7</text>
  <path d="M 70 131 L 165 168" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="112" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 201 78 L 423 121" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="313" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <path d="M 201 172 L 423 129" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="313" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 201 178 L 310 197" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="252" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6</text>
  <path d="M 343 191 L 425 136" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>

  <text x="52" y="258" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">vals：</text>
  <rect x="100" y="244" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <rect x="156" y="244" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <rect x="212" y="244" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="260" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6 ✓</text>
  <rect x="268" y="244" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7 ✗</text>
  <text x="400" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">check(2)、check(5) 同样 true</text>
  <text x="400" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（最短路都是 12）—— 前缀 true 泾渭分明</text>

  <rect x="30" y="284" width="460" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="306" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① lo=0, hi=3 → mid=2：check(6)？</text>
  <text x="62" y="323" font-size="9.5" fill="#555" filter="url(#rough2)">只留 cost≥6 且在线：0→2(6)、2→4(6)、0→1(7)；1→4(5) 被滤掉</text>
  <text x="62" y="338" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">dp[4] = 6 + 6 = 12 ≤ 12 ✓ → lo = 2</text>
  <text x="46" y="360" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② lo=2, hi=3 → mid=3：check(7)？</text>
  <text x="62" y="377" font-size="9.5" fill="#555" filter="url(#rough2)">仅剩 0→1(7)，1→4(5) 被滤 → 节点 4 不可达</text>
  <text x="62" y="392" font-size="9.5" fill="#b85450" filter="url(#rough2)">dp[4] = ∞ ✗ → hi = 2</text>
  <text x="46" y="408" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ lo = hi = 2 → 答案 vals[2] = 6</text>

  <text x="260" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">拓扑序（如 0,1,2,3,4）预处理一次，两次 check 都只是按序扫邻接表</text>
</svg>
