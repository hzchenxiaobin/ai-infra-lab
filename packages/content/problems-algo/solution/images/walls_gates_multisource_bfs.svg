<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">墙与门：多源 BFS — 所有门同时出发</text>
  <path d="M 250 40 Q 440 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="60" text-anchor="middle" font-size="11" fill="#888">把每个「门 0」当源点同时入队，BFS 逐层填距离，最先到达的层数即最短距离</text>

  <!-- ===== Left: naive per-room BFS ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="86" width="360" height="300" rx="8" fill="#fff3f3" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="220" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">❌ 对每个空房做单源 BFS</text>
  <g font-size="11" fill="#444">
    <text x="60" y="138">对每个 INF 格子从自己出发 BFS，</text>
    <text x="60" y="156">找到最近的门停止。</text>
    <text x="60" y="184" fill="#b03a3a">· 每个 INF 都跑一次 BFS</text>
    <text x="60" y="202" fill="#b03a3a">· 重复扩展大量重叠区域</text>
    <text x="60" y="220" fill="#b03a3a">· 最坏 O((mn)²)</text>
  </g>
  <g font-size="12" filter="url(#sk)">
    <rect x="80" y="246" width="36" height="36" fill="#fce4ec" stroke="#b85450"/><text x="98" y="269" text-anchor="middle" fill="#b03a3a" font-weight="bold">INF</text>
    <rect x="116" y="246" width="36" height="36" fill="#e8f0fe" stroke="#446688"/><text x="134" y="269" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="152" y="246" width="36" height="36" fill="#e6f4ea" stroke="#4a8e4a"/><text x="170" y="269" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="188" y="246" width="36" height="36" fill="#fce4ec" stroke="#b85450"/><text x="206" y="269" text-anchor="middle" fill="#b03a3a" font-weight="bold">INF</text>
  </g>
  <g font-size="10" fill="#888">
    <text x="100" y="306">左上 INF 各自搜索 → 重复扫整张图</text>
  </g>
  <text x="220" y="338" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">门少房多时极度浪费</text>
  <text x="220" y="362" text-anchor="middle" font-size="10" fill="#888">同一片区域被反复遍历</text>

  <!-- arrow -->
  <path d="M 410 236 L 470 236" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="440" y="228" text-anchor="middle" font-size="10" fill="#888">反转源汇</text>

  <!-- ===== Right: multi-source BFS ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="86" width="360" height="300" rx="8" fill="#eef7ff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="660" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">✓ 所有门同时入队（多源 BFS）</text>
  <g font-size="11" fill="#444">
    <text x="500" y="138">把每个「门」当源点同时入队，</text>
    <text x="500" y="156">BFS 逐层向外填距离。</text>
    <text x="500" y="184" fill="#2e6e2e">· 每格只入队一次</text>
    <text x="500" y="202" fill="#2e6e2e">· 先到先填 = 最近门</text>
    <text x="500" y="220" fill="#2e6e2e">· O(mn) 一遍扫完</text>
  </g>

  <!-- ripple illustration: gates as source, expanding rings -->
  <g filter="url(#sk)">
    <circle cx="560" cy="282" r="58" fill="none" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <circle cx="560" cy="282" r="40" fill="none" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
    <circle cx="560" cy="282" r="22" fill="none" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="560" cy="282" r="7" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="10" fill="#2e6e2e">
    <text x="560" y="285" text-anchor="middle" font-weight="bold">门</text>
    <text x="560" y="262" text-anchor="middle">d=1</text>
    <text x="560" y="244" text-anchor="middle">d=2</text>
    <text x="560" y="226" text-anchor="middle">d=3</text>
  </g>
  <!-- second gate ripple -->
  <g filter="url(#sk)">
    <circle cx="760" cy="300" r="46" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <circle cx="760" cy="300" r="28" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>
    <circle cx="760" cy="300" r="7" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="10" fill="#7a5415">
    <text x="760" y="303" text-anchor="middle" font-weight="bold">门</text>
    <text x="760" y="278" text-anchor="middle">d=1</text>
  </g>
  <text x="660" y="362" text-anchor="middle" font-size="10" fill="#2b6e9e">两门涟漪交汇处自动取较小值（先到先填）</text>
  <text x="660" y="378" text-anchor="middle" font-size="10" fill="#888">等价于「超级源点」连到所有门的单源 BFS</text>
</svg>
