<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[1,1,0],[0,1,1],[1,1,1]] → 输出 3</text>

  <!-- ===== Step 1: Original grid ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">Step 1 原始矩阵</text>
  <!-- 3x3 grid, cell 42x32, start (50, 58) -->
  <rect x="50" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="58" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="138" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="159" y="79" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="50" y="92" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="71" y="113" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="94" y="92" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="113" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="138" y="92" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="113" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="50" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="147" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="126" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="147" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="138" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="147" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Arrow right -->
  <line x1="195" y1="108" x2="225" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Bipartite graph with matching ===== -->
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Step 2 二分图 + 匈牙利匹配（红边）</text>

  <!-- Left nodes -->
  <ellipse cx="260" cy="78" rx="22" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="8" fill="#333">(0,0)</text>
  <ellipse cx="260" cy="113" rx="22" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="8" fill="#333">(1,1)</text>
  <ellipse cx="260" cy="148" rx="22" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="8" fill="#333">(2,0)</text>
  <ellipse cx="260" cy="183" rx="22" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="8" fill="#333">(2,2)</text>

  <!-- Right nodes -->
  <ellipse cx="370" cy="88" rx="22" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="92" text-anchor="middle" font-size="8" fill="#333">(0,1)</text>
  <ellipse cx="370" cy="128" rx="22" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="132" text-anchor="middle" font-size="8" fill="#333">(1,2)</text>
  <ellipse cx="370" cy="168" rx="22" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="8" fill="#333">(2,1)</text>

  <!-- Non-matching edges -->
  <line x1="282" y1="113" x2="348" y2="88" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="282" y1="113" x2="348" y2="168" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="282" y1="183" x2="348" y2="128" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="282" y1="183" x2="348" y2="168" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Matching edges (red, bold) -->
  <line x1="282" y1="78" x2="348" y2="88" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="282" y1="113" x2="348" y2="128" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="282" y1="148" x2="348" y2="168" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="315" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大匹配 = 3</text>

  <!-- Arrow down -->
  <line x1="315" y1="220" x2="315" y2="245" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="237" font-size="10" fill="#666">König → 最小顶点覆盖 = 3</text>

  <!-- ===== Step 3: Vertex cover = remove these cells ===== -->
  <text x="40" y="260" font-size="11" fill="#888" font-weight="bold">Step 3 移除顶点覆盖中的 1（打 ✗）</text>

  <!-- Grid with X marks -->
  <rect x="50" y="270" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="291" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="270" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="291" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <rect x="138" y="270" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="159" y="291" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="50" y="304" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="71" y="325" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="94" y="304" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="325" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="138" y="304" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="325" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <rect x="50" y="338" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="359" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="338" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="359" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <rect x="138" y="338" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="359" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="115" y="385" text-anchor="middle" font-size="10" fill="#b85450">移除 (0,1),(1,2),(2,1)</text>

  <!-- Arrow right -->
  <line x1="195" y1="320" x2="225" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Result grid ===== -->
  <text x="300" y="260" font-size="11" fill="#888" font-weight="bold">Step 4 结果（well-isolated）</text>
  <rect x="260" y="270" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="291" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="304" y="270" width="42" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="291" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="348" y="270" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="369" y="291" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="260" y="304" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="281" y="325" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="304" y="304" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="325" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="348" y="304" width="42" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="325" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="260" y="338" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="359" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="304" y="338" width="42" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="359" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="348" y="338" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="359" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="325" y="385" text-anchor="middle" font-size="10" fill="#4a7a3a">无相邻 1 ✓ → 答案 = 3</text>

  <!-- Bottom note -->
  <rect x="40" y="400" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">匈牙利算法求最大匹配 = 3 → König 定理 → 最小操作数 = 3</text>
</svg>
