<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">四状态转移：箭头系数 = 来源类中能一步走进目标格的格子数</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888">g[j'] = Σ f[j] × c[j→j']，每走一步用旧 f 算出新 g</text>

  <!-- f0 node -->
  <rect x="95" y="80" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="101" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[0]：source 本身</text>
  <text x="160" y="119" text-anchor="middle" font-size="10" fill="#b85450">1 个格子</text>

  <!-- f1 node -->
  <rect x="325" y="80" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="101" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[1]：同列不同行</text>
  <text x="400" y="119" text-anchor="middle" font-size="10" fill="#446688">n−1 个格子</text>

  <!-- f2 node -->
  <rect x="95" y="280" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="301" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[2]：同行不同列</text>
  <text x="170" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a">m−1 个格子</text>

  <!-- f3 node -->
  <rect x="325" y="280" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="301" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[3]：行列都不同</text>
  <text x="400" y="319" text-anchor="middle" font-size="10" fill="#d6a040">(n−1)(m−1) 个格子</text>

  <!-- f1 -> f0 : n-1 -->
  <path d="M 325 92 Q 272 64 225 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="275" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n−1</text>
  <!-- f0 -> f1 : 1 -->
  <path d="M 225 118 Q 272 148 325 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="146" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- f2 -> f0 : m-1 -->
  <path d="M 145 280 Q 102 200 145 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="204" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">m−1</text>
  <!-- f0 -> f2 : 1 -->
  <path d="M 180 128 Q 222 200 180 280" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="204" text-anchor="start" font-size="11" fill="#555">1</text>

  <!-- f1 self loop : n-2 -->
  <path d="M 358 80 C 352 56 442 56 436 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="397" y="56" text-anchor="middle" font-size="11" fill="#446688">n−2</text>

  <!-- f2 self loop : m-2 -->
  <path d="M 122 328 C 108 360 236 360 222 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a">m−2</text>

  <!-- f3 self loop : n+m-4 -->
  <path d="M 352 328 C 338 360 466 360 452 328" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="354" text-anchor="middle" font-size="11" fill="#d6a040">n+m−4</text>

  <!-- f3 -> f1 : m-1 -->
  <path d="M 388 280 L 388 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="380" y="207" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">m−1</text>
  <!-- f1 -> f3 : 1 -->
  <path d="M 438 128 L 438 280" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="207" text-anchor="start" font-size="11" fill="#555">1</text>

  <!-- f3 -> f2 : n-1 -->
  <path d="M 325 298 Q 285 330 245 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n−1</text>
  <!-- f2 -> f3 : 1 -->
  <path d="M 245 314 Q 285 286 325 314" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="287" y="282" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- f0 crossed self loop -->
  <path d="M 128 80 C 118 60 195 54 187 80" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 150 58 L 166 70" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 166 58 L 150 70" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="214" y="64" text-anchor="start" font-size="9" fill="#b85450">原地禁止</text>

  <!-- answer mapping -->
  <rect x="45" y="386" width="435" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="262" y="410" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">迭代 k 轮后，按 dest 与 source 的关系读答案：</text>
  <text x="262" y="434" text-anchor="middle" font-size="11" fill="#555">行列都相同 → f[0] ｜ 仅 x 不同（同列）→ f[1]</text>
  <text x="262" y="456" text-anchor="middle" font-size="11" fill="#555">仅 y 不同（同行）→ f[2] ｜ 行列都不同 → f[3]</text>
</svg>
