<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：句 → 词 → 段两级爆炸，段 → 词 → 句两级拼回</text>

  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 3368 的单层流水线在本题失手</text>
  <rect x="30" y="60" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="9.5" fill="#8a3030" filter="url(#rough2)">把 "QUICK-brown" 当一个单词整体变形</text>
  <text x="150" y="93" text-anchor="middle" font-size="9" fill="#8a3030" filter="url(#rough2)">→ "Quick-brown"（第二段没大写！）</text>
  <text x="150" y="108" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">词内还有「段」，一层爆炸不够用</text>

  <text x="410" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 框架照抄，词内再复制同一层</text>
  <rect x="290" y="60" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="78" text-anchor="middle" font-size="9.5" fill="#2d5a1e" filter="url(#rough2)">"QUICK-brown" 再按 '-' 拆两段</text>
  <text x="410" y="93" text-anchor="middle" font-size="9" fill="#2d5a1e" filter="url(#rough2)">QUICK | brown → Quick | Brown</text>
  <text x="410" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ "Quick-Brown" ✓</text>

  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两级 explode（拆）+ 两级 implode（拼），同一 idiom 用两次</text>

  <rect x="30" y="152" width="104" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="82" y="170" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">explode①</text>
  <text x="82" y="184" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">按 ' ' 拆词</text>
  <text x="82" y="197" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(word_pos, word)</text>

  <path d="M 138 178 L 156 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="152" width="104" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="212" y="170" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">explode②</text>
  <text x="212" y="184" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">词内按 '-' 拆段</text>
  <text x="212" y="197" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(…, part_pos, part)</text>

  <path d="M 268 178 L 286 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="290" y="152" width="104" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="342" y="170" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">transform</text>
  <text x="342" y="184" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">逐段首大余小</text>
  <text x="342" y="197" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">QUICK → Quick</text>

  <path d="M 398 178 L 416 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="152" width="110" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">implode①</text>
  <text x="475" y="184" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">按 part_pos 拼回词</text>
  <text x="475" y="197" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">SEPARATOR '-'</text>

  <path d="M 475 208 L 475 226" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="280" y="230" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">implode②</text>
  <text x="405" y="262" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">按 word_pos 拼回句子</text>
  <text x="405" y="275" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">GROUP_CONCAT(… SEPARATOR ' ')</text>

  <rect x="30" y="230" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="9.5" fill="#a07820" font-weight="bold" filter="url(#rough2)">两把「计数尺」同一公式</text>
  <text x="145" y="262" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">词数 = 空格数 + 1；段数 = '-' 数 + 1</text>
  <text x="145" y="275" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">CHAR_LENGTH 相减即可数出</text>

  <rect x="30" y="296" width="520" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">无 '-' 的普通词段数 = 1，两层结构自动退化为 3368 —— 新规则是旧框架的级联扩展</text>
  <text x="290" y="328" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">"the QUICK-brown fox" → the / QUICK-brown / fox → (QUICK|brown) → The / Quick-Brown / Fox</text>

  <rect x="30" y="348" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="364" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">拆到「最小可变形单元」再逐级拼回 —— 分隔符层级化是字符串 SQL 的通用武器</text>
  <text x="290" y="379" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">输出两列：original_text（原样保留）+ converted_text（两级拼回的结果）</text>
</svg>
