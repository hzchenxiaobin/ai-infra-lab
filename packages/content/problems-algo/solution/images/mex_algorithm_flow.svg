<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="420" fill="#fafafa"/>

  <text x="250" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- start -->
  <rect x="210" y="50" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="250" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M250,82 L250,108" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="80" y="110" width="340" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历 nums，按余数计数</text>
  <text x="250" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">r = ((x mod value) + value) mod value；cnt[r] += 1</text>

  <path d="M250,170 L250,196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="110" y="198" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">求最小计数</text>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">min_cnt = min(cnt[0 … value−1])</text>

  <path d="M250,248 L250,274" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 (loop) -->
  <rect x="80" y="276" width="340" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">线性扫描 r = 0 → value−1</text>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">找第一个 cnt[r] == min_cnt 的 r，跳出</text>

  <path d="M250,336 L250,362" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="90" y="364" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="384" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 MEX = min_cnt × value + r</text>
</svg>
