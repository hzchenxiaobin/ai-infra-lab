<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">步进数：逐位构造（BFS 生成树）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">只“生成”步进数，不“检验”每个数 —— 以种子 3 为例</text>

  <!-- seed row 1..9 -->
  <text x="34" y="78" font-size="11" fill="#888">种子</text>
  <rect x="78" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="97" y="84" text-anchor="middle" font-size="14" fill="#446688">1</text>
  <rect x="126" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="84" text-anchor="middle" font-size="14" fill="#446688">2</text>
  <rect x="174" y="62" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="193" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="222" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="84" text-anchor="middle" font-size="14" fill="#446688">4</text>
  <rect x="270" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="84" text-anchor="middle" font-size="14" fill="#446688">5</text>
  <rect x="318" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="84" text-anchor="middle" font-size="14" fill="#446688">6</text>
  <rect x="366" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="84" text-anchor="middle" font-size="14" fill="#446688">7</text>
  <rect x="414" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="84" text-anchor="middle" font-size="14" fill="#446688">8</text>
  <rect x="462" y="62" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="481" y="84" text-anchor="middle" font-size="14" fill="#446688">9</text>
  <text x="510" y="82" font-size="10" fill="#888">(+0)</text>

  <!-- tree from seed 3 -->
  <!-- 3 -> 32 (green), 3 -> 34 -->
  <path d="M 185 96 L 130 138" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 96 L 250 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="106" y="140" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">32</text>
  <rect x="226" y="140" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="162" text-anchor="middle" font-size="14" fill="#446688">34</text>

  <!-- 32 -> 321 (green), 32 -> 323 -->
  <path d="M 122 176 L 86 218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 138 176 L 158 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 34 -> 343, 345 -->
  <path d="M 242 176 L 222 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 176 L 294 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="220" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="86" y="242" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">321</text>
  <rect x="130" y="220" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="242" text-anchor="middle" font-size="14" fill="#446688">323</text>
  <rect x="194" y="220" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="242" text-anchor="middle" font-size="14" fill="#446688">343</text>
  <rect x="266" y="220" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="294" y="242" text-anchor="middle" font-size="14" fill="#446688">345</text>

  <text x="86" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3→2→1 ✓</text>

  <!-- rule box on right -->
  <rect x="350" y="140" width="196" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="448" y="162" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">构造规则</text>
  <text x="362" y="184" font-size="11" fill="#555">末位 d = num % 10</text>
  <text x="362" y="204" font-size="11" fill="#555">若 d &gt; 0 → 追加 num×10+(d−1)</text>
  <text x="362" y="224" font-size="11" fill="#555">若 d &lt; 9 → 追加 num×10+(d+1)</text>
  <text x="362" y="246" font-size="10.5" fill="#b85450" font-weight="bold">num=0 不扩展（防前导零）</text>

  <!-- bottom note -->
  <rect x="30" y="300" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">所有“被生成”的数天然就是步进数</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">BFS 按位数分层、层内有序 → 输出天然升序，无需排序；总量仅约 10⁴ 量级</text>

  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888">对比暴力：逐个检验 [low,high] 每个数 = O((high−low)·log high)，high≤2×10⁹ 时必 TLE</text>
</svg>
