<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数器扫描 → 归零即切</text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#333">balance = 0, count = 0</text>

  <path d="M 270 72 L 270 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more chars? -->
  <polygon points="270,88 380,124 270,160 160,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#333">还有字符</text>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#666">s[i] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 160 L 270 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="170" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 2: char == 'R'? -->
  <polygon points="270,176 376,210 270,244 164,210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#333">s[i]</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#666">== 'R' ?</text>

  <!-- Yes (R) -> left -->
  <path d="M 164 210 L 120 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是</text>

  <!-- balance++ box -->
  <rect x="40" y="196" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="215" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">balance++</text>

  <!-- No (L) -> right -->
  <path d="M 376 210 L 420 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <!-- balance-- box -->
  <rect x="420" y="196" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="215" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">balance--</text>

  <!-- merge down -->
  <path d="M 80 224 L 80 258 L 270 258" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 460 224 L 460 258 L 270 258" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 258 L 270 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 3: balance == 0? -->
  <polygon points="270,272 366,304 270,336 174,304" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#333">balance</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#666">== 0 ?</text>

  <!-- Yes -> left: count++ -->
  <path d="M 174 304 L 130 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="50" y="290" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count++</text>

  <!-- No -> right: skip -->
  <path d="M 366 304 L 410 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="296" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <rect x="410" y="290" width="80" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="309" text-anchor="middle" font-size="11" fill="#888">继续</text>

  <!-- merge down then loop back -->
  <path d="M 90 318 L 90 350 L 270 350" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 450 318 L 450 350 L 270 350" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="210" y="352" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="371" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i++</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 210 366 L 50 366 L 50 124 L 160 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="246" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 34 246)">下一个字符</text>

  <!-- No (no more) -> right then down to result -->
  <path d="M 380 124 L 440 124 L 440 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="116" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- result: return count -->
  <path d="M 440 396 L 360 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="382" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="403" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return count</text>

  <!-- summary -->
  <rect x="60" y="422" width="420" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="433" text-anchor="middle" font-size="10" fill="#444">一遍遍历 O(n)：R 记 +1、L 记 -1，归零即切，count 累加</text>
</svg>
