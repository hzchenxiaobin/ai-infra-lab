<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">Alice 的获胜区间（1 ≤ n ≤ 50）</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m 为奇 ⇒ 赢：按 T(m) = m(21−m)/2 切出 4 段绿灯区间</text>

  <!-- T 里程碑标签 -->
  <text x="132" y="64" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T(1)=10</text>
  <text x="204" y="64" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">T(2)=19</text>
  <text x="268" y="64" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T(3)=27</text>
  <text x="324" y="64" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">T(4)=34</text>
  <text x="372" y="64" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T(5)=40</text>
  <text x="412" y="64" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">T(6)=45</text>
  <text x="448" y="64" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T(7)=49</text>

  <!-- 里程碑虚线 -->
  <path d="M 132 68 L 132 82" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 204 68 L 204 82" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 268 68 L 268 82" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 324 68 L 324 82" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 372 68 L 372 82" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 412 68 L 412 82" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 444 68 L 444 82" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- 数轴条：每格 8px，n=1 起点 x=60 -->
  <rect x="60" y="86" width="72" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="132" y="86" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="204" y="86" width="64" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="268" y="86" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="324" y="86" width="48" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="372" y="86" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="86" width="32" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="86" width="16" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <text x="168" y="110" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10–18</text>
  <text x="296" y="110" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">27–33</text>
  <text x="392" y="110" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">40–44</text>
  <text x="452" y="132" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">49–50</text>
  <text x="96" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">输…</text>
  <text x="236" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">输…</text>
  <text x="348" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">输</text>
  <text x="428" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">输</text>

  <!-- 刻度 -->
  <text x="60" y="142" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="132" y="142" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="204" y="142" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">19</text>
  <text x="268" y="142" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">27</text>
  <text x="324" y="142" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">34</text>
  <text x="372" y="142" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">40</text>
  <text x="412" y="142" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">45</text>
  <text x="446" y="142" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">49</text>

  <!-- 区间规律 -->
  <rect x="30" y="156" width="460" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="176" font-size="10" fill="#333" filter="url(#rough2)">· 赢区间 [T(2j+1), T(2j+2))，长度 = 第 2j+2 手的移除量：9, 7, 5, 3 —— 越往后每手移得越少，</text>
  <text x="44" y="192" font-size="10" fill="#333" filter="url(#rough2)">  绿灯区间越来越窄，输区间（8, 6, 4 个）同样在收窄，两串区间交替压缩到尽头。</text>

  <!-- 闭式 -->
  <rect x="30" y="220" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">O(1) 闭式：m_max = ⌊(21 − √(441 − 8n)) / 2⌋，m_max 为奇 ⇒ true</text>
  <text x="44" y="258" font-size="9.5" fill="#7a5c1e" filter="url(#rough2)">· 由 m(21−m)/2 ≤ n 即 m² − 21m + 2n ≥ 0 解小根（m ≤ 10 &lt; 21），8n ≤ 400 &lt; 441 根号内非负；</text>
  <text x="44" y="274" font-size="9.5" fill="#7a5c1e" filter="url(#rough2)">· 验证：n=50 → m=7（奇）→ true ✓；n=12 → m=1（奇）→ true ✓；n=19 → m=2（偶）→ false ✓</text>
  <text x="44" y="290" font-size="9.5" fill="#b85450" filter="url(#rough2)">· ⚠️ 规则只定义到「移除 1 个」：n ≥ 55 会出现「移除 0 个」的规则空白，LC 用 n ≤ 50 规避。</text>
</svg>
