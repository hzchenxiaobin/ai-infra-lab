<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：奇偶交错填充，最高频占偶数位天然不相邻</text>

  <!-- Input barcodes -->
  <text x="40" y="62" font-size="12" fill="#888">输入 barcodes:</text>
  <rect x="130" y="46" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="166" y="46" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="46" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="238" y="46" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="274" y="46" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="310" y="46" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Frequency table -->
  <text x="40" y="104" font-size="12" fill="#888">统计频率:</text>
  <rect x="130" y="88" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1: 3</text>
  <rect x="200" y="88" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2: 2</text>
  <rect x="270" y="88" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3: 1</text>
  <path d="M 345 102 L 380 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="385" y="86" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="101" text-anchor="middle" font-size="11" fill="#333">max_count = 3</text>
  <text x="460" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ ⌈6/2⌉ = 3 ✓ 必有解</text>

  <!-- chars sequence (sorted by freq desc) -->
  <text x="40" y="150" font-size="12" fill="#888">按频率降序展开:</text>
  <rect x="160" y="134" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="134" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="224" y="134" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="134" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="288" y="134" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="320" y="134" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="365" y="152" font-size="11" fill="#888">同值连续，高频在前</text>

  <!-- Result array: even positions blue, odd positions green -->
  <text x="40" y="200" font-size="12" fill="#888">结果数组:</text>

  <!-- index labels -->
  <text x="148" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">下标0</text>
  <text x="184" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="220" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="256" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="292" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="328" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- even slots (0,2,4) blue -->
  <rect x="130" y="196" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="196" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="274" y="196" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- odd slots (1,3,5) green -->
  <rect x="166" y="196" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="238" y="196" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="310" y="196" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- annotations -->
  <text x="380" y="206" font-size="11" fill="#446688" font-weight="bold">蓝 = 偶数位</text>
  <text x="380" y="222" font-size="10" fill="#666">0,2,4… 间隔 2，互不相邻</text>
  <text x="380" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">绿 = 奇数位</text>
  <text x="380" y="254" font-size="10" fill="#666">1,3,5… 间隔 2，互不相邻</text>

  <!-- Fill order arrows -->
  <text x="40" y="266" font-size="12" fill="#888">填充顺序:</text>
  <text x="130" y="266" font-size="11" fill="#446688" font-weight="bold">先填偶数位</text>
  <path d="M 200 262 L 230 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">再填奇数位</text>
  <text x="380" y="266" font-size="11" fill="#888">chars 按序灌入即可</text>

  <!-- Result check -->
  <text x="40" y="296" font-size="12" fill="#888">结果:</text>
  <text x="130" y="296" font-size="13" fill="#4a7a3a" font-weight="bold">[1, 2, 1, 2, 1, 3] ✓ 相邻无重复</text>

  <!-- Core idea box -->
  <rect x="40" y="312" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：偶数位与奇数位各自间隔 2，天然不相邻</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666">最高频 ≤ ⌈n/2⌉ = 偶数位个数 → 恰好填满偶数位，绝不溢出到相邻奇数位</text>
</svg>
