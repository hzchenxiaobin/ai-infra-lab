<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：new Promise 内手动调度，计数器收尾</text>

  <!-- Step 1: new Promise -->
  <rect x="120" y="48" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return new Promise((resolve, reject) =&gt; { ... })</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#888">外层立即返回 pending Promise，resolve/reject 在闭包内捕获</text>

  <path d="M 280 100 L 280 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="120" y="124" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">const results = [], count = 0, n = functions.length</text>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#666">预分配结果槽位，计数器从 0 起步</text>

  <path d="M 280 176 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="100" y="200" width="360" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for (let i = 0; i &lt; n; i++)</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#666">functions[i]().then(v =&gt; { results[i] = v;  ← 按索引落位</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#666">  if (++count === n) resolve(results) }).catch(reject)</text>

  <!-- side annotation: parallel -->
  <rect x="470" y="208" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="510" y="226" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">同步循环</text>
  <text x="510" y="240" text-anchor="middle" font-size="9" fill="#888">全部触发</text>
  <text x="510" y="252" text-anchor="middle" font-size="9" fill="#888">无 await</text>

  <path d="M 280 262 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: branch -->
  <!-- resolve branch (left) -->
  <rect x="40" y="286" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">全部 resolve（count 达 n）</text>
  <text x="160" y="320" text-anchor="middle" font-size="10" fill="#666">resolve(results)</text>
  <text x="160" y="334" text-anchor="middle" font-size="9" fill="#4a7a3a">数组按原顺序排列，与完成先后无关</text>

  <!-- reject branch (right) -->
  <rect x="300" y="286" width="240" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">任一 reject</text>
  <text x="420" y="320" text-anchor="middle" font-size="10" fill="#666">reject(reason) ← 首拒原因</text>
  <text x="420" y="334" text-anchor="middle" font-size="9" fill="#b85450">短路：第一个 reject 即收尾，不等其它</text>

  <!-- arrows to branches -->
  <path d="M 200 282 L 160 286" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 282 L 420 286" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="40" y="372" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#333">为何不用 await 串行？await 会让「触发下一个」依赖「上一个完成」</text>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">同步循环 + .then 回调 = 所有 promise 同时发起 = 真并发</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">总耗时 ≈ max(各 promise 耗时)，而非 sum</text>
</svg>
