<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：r − l + 1 == 出现次数 ⟺ 连成一整块</text>
    <text x="260" y="35" text-anchor="middle" font-size="10.5" fill="#555">示例：nums = [3, 3, 1, 2, 2, 1]</text>

    <!-- array cells -->
    <rect x="40" y="42" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="90" y="42" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="42" width="50" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="190" y="42" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="240" y="42" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="42" width="50" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="65" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="115" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="165" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <text x="215" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="265" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="315" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

    <!-- index labels -->
    <text x="65" y="94" text-anchor="middle" font-size="9" fill="#777">0</text>
    <text x="115" y="94" text-anchor="middle" font-size="9" fill="#777">1</text>
    <text x="165" y="94" text-anchor="middle" font-size="9" fill="#777">2</text>
    <text x="215" y="94" text-anchor="middle" font-size="9" fill="#777">3</text>
    <text x="265" y="94" text-anchor="middle" font-size="9" fill="#777">4</text>
    <text x="315" y="94" text-anchor="middle" font-size="9" fill="#777">5</text>
    <text x="345" y="94" font-size="9" fill="#777">下标 i</text>

    <!-- lane 1: value 3 -->
    <path d="M 40 122 H 140 M 40 122 V 115 M 140 122 V 115" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <text x="150" y="126" font-size="10" fill="#2f5527">3：l=0，r=1，跨度 2 == 频次 2 → ✓ 特殊</text>

    <!-- lane 2: value 2 -->
    <path d="M 190 157 H 290 M 190 157 V 150 M 290 157 V 150" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <text x="300" y="161" font-size="10" fill="#2f5527">2：l=3，r=4，跨度 2 == 频次 2 → ✓ 特殊</text>

    <!-- lane 3: value 1 -->
    <path d="M 140 192 H 340 M 140 192 V 185 M 340 192 V 185" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="348" y="196" font-size="10" fill="#8a3a35" font-weight="bold">1：跨度 4 ≠ 频次 2 → ✗</text>
    <text x="150" y="209" font-size="9" fill="#8a3a35">（下标 3、4 被 2 占据，1 断成两块）</text>

    <!-- formula box -->
    <rect x="40" y="222" width="440" height="168" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">为什么只看 first / last / cnt 三个数就够？</text>
    <text x="58" y="270" font-size="10" fill="#333">⇒ 若 x 连成一整块：块内全是 x，块长 r − l + 1 恰好等于频次 cnt</text>
    <text x="58" y="290" font-size="10" fill="#333">⇐ 若 r − l + 1 == cnt：cnt 个出现占满 [l, r] 的 r − l + 1 个位置，无缝隙</text>
    <text x="58" y="310" font-size="10" fill="#333" font-weight="bold">∴ x 特殊 ⟺ last[x] − first[x] + 1 == cnt[x]</text>
    <line x1="58" y1="324" x2="462" y2="324" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="58" y="344" font-size="9.5" fill="#555">💡 只出现一次的值天然特殊：l == r 且 cnt == 1，判定式恒成立</text>
    <text x="58" y="362" font-size="9.5" fill="#555">💡 一般化：x 的块数 = 相邻出现位置差 &gt; 1 的次数 + 1；特殊 ⟺ 恰好 1 块</text>
  </g>
</svg>
