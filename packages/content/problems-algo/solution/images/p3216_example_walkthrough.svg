<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "45320"</text>

  <!-- 表头 -->
  <rect x="36" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="74" y="44" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">相邻对</text>
  <rect x="156" y="44" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奇偶相同？</text>
  <rect x="272" y="44" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前面更大？</text>
  <rect x="372" y="44" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">动作</text>

  <!-- 行 i=0 -->
  <rect x="36" y="74" width="34" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="74" y="74" width="78" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, 5)</text>
  <rect x="156" y="74" width="112" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="93" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">偶 ≠ 奇 ✗</text>
  <rect x="272" y="74" width="96" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—</text>
  <rect x="372" y="74" width="116" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="93" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">跳过</text>

  <!-- 行 i=1：命中 -->
  <rect x="36" y="104" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="53" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="104" width="78" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="113" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 3)</text>
  <rect x="156" y="104" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">奇 = 奇 ✓</text>
  <rect x="272" y="104" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 &gt; 3 ✓</text>
  <rect x="372" y="104" width="116" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">交换 + break！</text>

  <text x="36" y="152" font-size="11" fill="#555" filter="url(#rough2)">首个命中在 i=1，换完立即收工；更右的 (2,0) 虽也合法，但已轮不到它</text>

  <!-- 结果串 -->
  <text x="36" y="189" font-size="12" fill="#333" filter="url(#rough2)">i=1 交换 →</text>
  <path d="M183,166 Q211,147 239,166" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">互换</text>
  <rect x="130" y="168" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="190" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="168" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="214" y="168" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="256" y="168" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="190" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="298" y="168" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="190" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="352" y="190" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输出 "43520" ✓</text>

  <!-- 两个可行交换对比 -->
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两个可行交换的结果对比：谁更小？</text>

  <rect x="60" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="234" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="109" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="128" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="162" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="177" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="196" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="143" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">换 i=1：位置 1 得 '3' ✓</text>

  <text x="263" y="256" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">&lt;</text>

  <rect x="300" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="334" y="234" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="349" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="368" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="402" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="417" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="436" y="234" width="30" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="451" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="383" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">换 i=3：位置 1 仍 '5' ✗</text>

  <!-- 底部说明 -->
  <text x="36" y="308" font-size="11" fill="#555" filter="url(#rough2)">前缀 "4" 相同时先比位置 1：'3' &lt; '5'，</text>
  <text x="36" y="326" font-size="11" fill="#555" filter="url(#rough2)">更左的改动完胜 —— 这就是贪心正确的现场演示</text>

  <rect x="340" y="296" width="152" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：s = "001"</text>
  <text x="416" y="331" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无同奇偶降序对</text>
  <text x="416" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">原样返回 "001"</text>
</svg>
