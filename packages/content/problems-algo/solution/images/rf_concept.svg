<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：三条件 AND 过滤 + 双关键字排序</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">veganFriendly 是条件性过滤——为 0 时自动放行</text>

  <!-- Input row: 5 restaurant cards id|rating -->
  <text x="28" y="76" font-size="10.5" fill="#666" filter="url(#rough2)">输入</text>
  <rect x="68" y="56" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1|4</text>
  <rect x="130" y="56" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2|8</text>
  <rect x="192" y="56" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3|8</text>
  <rect x="254" y="56" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4|10</text>
  <rect x="316" y="56" width="58" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5|1</text>

  <path d="M 260 92 L 260 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Filter box -->
  <rect x="40" y="108" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">过滤条件（AND：全部满足才保留）</text>
  <text x="260" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① veganFriendly=1 → 要求 vegan=1；为 0 → 自动放行</text>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② price ≤ maxPrice　　　③ distance ≤ maxDistance</text>

  <path d="M 260 170 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Survivors row -->
  <text x="28" y="206" font-size="10.5" fill="#666" filter="url(#rough2)">通过</text>
  <rect x="140" y="188" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1|4</text>
  <rect x="210" y="188" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3|8</text>
  <rect x="280" y="188" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5|1</text>

  <path d="M 260 224 L 260 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort box -->
  <rect x="80" y="240" width="360" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">排序：rating ↓ 为主，id ↓ 为辅（同 rating 比 id）</text>

  <path d="M 260 282 L 260 296" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output row -->
  <text x="28" y="318" font-size="10.5" fill="#666" filter="url(#rough2)">输出</text>
  <rect x="140" y="300" width="58" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="321" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="210" y="300" width="58" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="321" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="300" width="58" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="321" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">卡片格式 id|rating　示例：veganFriendly=1, maxPrice=50, maxDistance=10</text>
</svg>
