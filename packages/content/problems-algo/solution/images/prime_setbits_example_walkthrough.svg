<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：left = 6, right = 10</text>

  <!-- Table header -->
  <rect x="40" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n</text>
  <rect x="104" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">二进制</text>
  <rect x="228" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">置位 k</text>
  <rect x="312" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">质数？</text>
  <rect x="416" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计数</text>

  <!-- Row: n=6 -->
  <rect x="40" y="84" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="104" y="84" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 1 0</text>
  <rect x="228" y="84" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="312" y="84" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 质数</text>
  <rect x="416" y="84" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row: n=7 -->
  <rect x="40" y="120" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="104" y="120" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 1 1</text>
  <rect x="228" y="120" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="141" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="312" y="120" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 质数</text>
  <rect x="416" y="120" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="141" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row: n=8 -->
  <rect x="40" y="156" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="104" y="156" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 0 0 0</text>
  <rect x="228" y="156" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="177" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="312" y="156" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="177" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非质数</text>
  <rect x="416" y="156" width="100" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="177" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">2</text>

  <!-- Row: n=9 -->
  <rect x="40" y="192" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="213" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="104" y="192" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="213" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 0 0 1</text>
  <rect x="228" y="192" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="312" y="192" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 质数</text>
  <rect x="416" y="192" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row: n=10 -->
  <rect x="40" y="228" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="249" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="104" y="228" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="249" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 0 1 0</text>
  <rect x="228" y="228" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="312" y="228" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 质数</text>
  <rect x="416" y="228" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Result -->
  <rect x="40" y="280" width="476" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="278" y="305" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold">结果：count = 4 （6, 7, 9, 10 的置位数为质数）</text>

  <!-- Bitmask note -->
  <rect x="40" y="336" width="476" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="11" fill="#446688" font-weight="bold">位掩码技巧（O(1) 判定质数）</text>
  <text x="60" y="374" font-size="10.5" fill="#444">令 mask 的第 k 位为 1 当且仅当 k 是质数；判定时 (mask &gt;&gt; k) &amp; 1 即可。</text>
  <text x="60" y="386" font-size="10" fill="#888">k ≤ 20 时 mask = 0b10100010100010101100 = 665772</text>
</svg>
