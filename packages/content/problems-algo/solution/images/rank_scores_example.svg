<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种排名函数对比（同一组分数降序后）</text>

  <!-- Header row -->
  <rect x="60" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">score</text>

  <rect x="160" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="62" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ROW_NUMBER</text>
  <text x="215" y="74" text-anchor="middle" font-size="8" fill="#888">唯一序号</text>

  <rect x="270" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">RANK</text>
  <text x="320" y="74" text-anchor="middle" font-size="8" fill="#888">并列但跳号</text>

  <rect x="370" y="48" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">DENSE_RANK ✓</text>
  <text x="435" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a">并列不跳号</text>

  <!-- Row 1: 4.00 -->
  <rect x="60" y="78" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="11" fill="#333">4.00</text>

  <rect x="160" y="78" width="110" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="270" y="78" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="370" y="78" width="130" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="435" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Row 2: 4.00 (tie) -->
  <rect x="60" y="106" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#333">4.00</text>

  <rect x="160" y="106" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="215" y="134" text-anchor="middle" font-size="7" fill="#b85450">✗ 不并列</text>

  <rect x="270" y="106" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="370" y="106" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Row 3: 3.85 (the key row - shows gap vs no gap) -->
  <rect x="60" y="134" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="11" fill="#333">3.85</text>

  <rect x="160" y="134" width="110" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>

  <rect x="270" y="134" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="320" y="158" text-anchor="middle" font-size="7" fill="#b85450">✗ 跳号!</text>

  <rect x="370" y="134" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="435" y="158" text-anchor="middle" font-size="7" fill="#4a7a3a">✓ 不跳号</text>

  <!-- Row 4: 3.65 -->
  <rect x="60" y="162" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#333">3.65</text>

  <rect x="160" y="162" width="110" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="180" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="270" y="162" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="370" y="162" width="130" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="435" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Row 5: 3.65 (tie) -->
  <rect x="60" y="190" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#333">3.65</text>

  <rect x="160" y="190" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="215" y="218" text-anchor="middle" font-size="7" fill="#b85450">✗ 不并列</text>

  <rect x="270" y="190" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="208" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="370" y="190" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Row 6: 3.50 -->
  <rect x="60" y="218" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="236" text-anchor="middle" font-size="11" fill="#333">3.50</text>

  <rect x="160" y="218" width="110" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="236" text-anchor="middle" font-size="11" fill="#333">6</text>

  <rect x="270" y="218" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="320" y="244" text-anchor="middle" font-size="7" fill="#b85450">✗ 跳号!</text>

  <rect x="370" y="218" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="435" y="244" text-anchor="middle" font-size="7" fill="#4a7a3a">✓ 不跳号</text>

  <!-- Bottom summary -->
  <rect x="40" y="260" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键区别在「并列后下一个名次」</text>
  <text x="60" y="300" font-size="10" fill="#333">ROW_NUMBER：强制唯一序号，同分也分 1/2/3 —— 不并列</text>
  <text x="60" y="316" font-size="10" fill="#333">RANK：同分同名次，但跳过被占的位置 —— 1,1,3,4,4,6（跳号）</text>
  <text x="60" y="332" font-size="10" fill="#4a7a3a" font-weight="bold">DENSE_RANK：同分同名次，下一名紧接 —— 1,1,2,3,3,4（不跳号）← 本题</text>
</svg>
