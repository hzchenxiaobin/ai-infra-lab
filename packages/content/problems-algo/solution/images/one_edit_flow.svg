<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="480" height="560" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">相隔为 1 的编辑距离：算法流程</text>

  <!-- Step 1: ensure s shorter -->
  <rect x="70" y="44" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="240" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">m = len(s), n = len(t)</text>
  <text x="240" y="84" text-anchor="middle" font-size="10.5" fill="#446688">若 m &gt; n：交换 s, t（保证 s 不更长）</text>

  <path d="M 240 96 L 240 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: length diff guard -->
  <polygon points="240,116 380,162 240,208 100,162" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n − m &gt; 1 ?</text>
  <text x="240" y="176" text-anchor="middle" font-size="10" fill="#777">长度差超过 1</text>

  <!-- Yes: false -->
  <path d="M 380 162 L 430 162 L 430 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="388" y="154" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="372" y="214" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return false</text>
  <text x="420" y="248" text-anchor="middle" font-size="9" fill="#b85450">一招修不了</text>

  <!-- No: continue -->
  <path d="M 240 208 L 240 226" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="250" y="222" font-size="11" fill="#82b366" font-weight="bold">No</text>

  <!-- Step 3: loop find first diff -->
  <rect x="70" y="230" width="340" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="240" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i in 0..m-1:</text>
  <text x="240" y="270" text-anchor="middle" font-size="10.5" fill="#888">从左到右逐字符比较</text>
  <text x="240" y="286" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">找到第一个 s[i] != t[i] 即停下</text>

  <path d="M 240 296 L 240 312" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: decision branch -->
  <polygon points="240,316 380,360 240,404 100,360" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="356" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">m == n ?</text>
  <text x="240" y="374" text-anchor="middle" font-size="10" fill="#777">等长还是差一</text>

  <!-- Yes equal: replace -->
  <path d="M 100 360 L 50 360 L 50 432" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="58" y="352" font-size="11" fill="#d6a040" font-weight="bold">Yes</text>
  <rect x="8" y="436" width="148" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="82" y="456" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">替换 s[i]</text>
  <text x="82" y="474" text-anchor="middle" font-size="10" fill="#888">比 s[i+1:] 与 t[i+1:]</text>
  <text x="82" y="492" text-anchor="middle" font-size="9.5" fill="#d6a040" font-style="italic">return 比较结果</text>

  <!-- No: insert -->
  <path d="M 380 360 L 430 360 L 430 432" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="324" y="436" width="148" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="398" y="456" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">插入 t[i] 到 s</text>
  <text x="398" y="474" text-anchor="middle" font-size="10" fill="#888">比 s[i:] 与 t[i+1:]</text>
  <text x="398" y="492" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-style="italic">return 比较结果</text>

  <!-- loop-fell-through path (no diff found) -->
  <path d="M 240 294 L 372 294 L 372 230 L 372 540 L 240 540" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="376" y="312" font-size="9.5" fill="#888">没找到分歧</text>
  <text x="376" y="324" font-size="9.5" fill="#888">循环正常结束</text>

  <!-- final return -->
  <rect x="100" y="516" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="538" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return (m + 1 == n)</text>
  <path d="M 240 540 L 300 540" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- complexity badge -->
  <text x="468" y="552" text-anchor="end" font-size="9.5" fill="#d6a040" font-style="italic">O(n), O(1)</text>
</svg>
