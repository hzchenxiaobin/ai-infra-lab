<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：你挑一块 ⇒ 朋友拿走两侧邻居 ⇒ 你挑的块互不相邻</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">环形首尾(1,6)也是邻居 ⇒ 拆成「去尾」「去头」两条线性取 max</text>

  <!-- ===== Left: circular pizza ===== -->
  <text x="140" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">环形披萨 slices = [1,2,3,4,5,6]</text>

  <!-- 6 slices arranged as a circle (hexagon of boxes) -->
  <!-- center (140, 200), radius 78 -->
  <!-- top: index 3 (value 4) picked-red ; bottom-left: index 5 (value 6) picked-green ; others blue -->
  <!-- positions: 0=right, 1=bottom-right, 2=bottom-left, 3=left, 4=top-left, 5=top-right (clockwise) -->
  <!-- We want picked = value 4 (idx3) and value 6 (idx5); value 4 at top, value 6 at top-right -->

  <!-- redraw positions: angle 0 at top, going clockwise -->
  <!-- idx0 value1: top  (140, 122) -->
  <!-- idx1 value2: top-right (208, 161) -->
  <!-- idx2 value3: bottom-right (208, 239) -->
  <!-- idx3 value4: bottom (140, 278) -->
  <!-- idx4 value5: bottom-left (72, 239) -->
  <!-- idx5 value6: top-left (72, 161) -->
  <!-- picked: value4 (idx3, bottom) red ; value6 (idx5, top-left) green -->

  <g font-size="14">
    <!-- idx0 value1 (top) - neighbor of picked 6 -->
    <rect x="116" y="108" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="140" y="131" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- idx1 value2 -->
    <rect x="184" y="147" width="48" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="208" y="170" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- idx2 value3 - neighbor of picked 4 -->
    <rect x="184" y="225" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="208" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <!-- idx3 value4 picked (red) -->
    <rect x="116" y="264" width="48" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="140" y="287" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <!-- idx4 value5 - neighbor of picked 4 -->
    <rect x="48" y="225" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="72" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <!-- idx5 value6 picked (green) -->
    <rect x="48" y="147" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="72" y="170" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
  </g>

  <!-- ring arrows (clockwise) small curved arrows between adjacent boxes -->
  <!-- arrow from 1(top) to 2(top-right) -->
  <path d="M 166 132 Q 188 138 184 150" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 2 -> 3 -->
  <path d="M 210 184 Q 216 210 210 226" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 3 -> 4 -->
  <path d="M 184 252 Q 162 258 166 268" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 4 -> 5 -->
  <path d="M 114 280 Q 92 274 96 262" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 5 -> 6 -->
  <path d="M 70 226 Q 64 200 70 184" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 6 -> 1 (the wrap-around, highlighted as the circular adjacency) -->
  <path d="M 98 156 Q 120 150 114 144" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首尾相邻!</text>

  <!-- legend for picked / friend-taken / idle -->
  <g font-size="10" fill="#555">
    <rect x="36" y="316" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="56" y="326">你挑的(红/绿)</text>
    <rect x="36" y="334" width="14" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="56" y="344">朋友拿走(邻居)</text>
    <rect x="180" y="316" width="14" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="200" y="326">未被取</text>
  </g>
  <text x="140" y="372" text-anchor="middle" font-size="10" fill="#888">挑 4、6：环上不相邻，和=10 ✓</text>

  <!-- ===== divider ===== -->
  <path d="M 300 70 L 300 400" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="320" y="208" font-size="20" fill="#aaa" filter="url(#rough2)">⇒</text>

  <!-- ===== Right: split into two linear cases ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">拆环为两条线性（取 max）</text>

  <!-- Case A: drop last (6), array [1,2,3,4,5] -->
  <text x="330" y="110" font-size="10" fill="#b85450" font-weight="bold">情况 A：去掉末尾 6</text>
  <g font-size="11">
    <rect x="332" y="120" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="348" y="138" text-anchor="middle" fill="#333">1</text>
    <rect x="366" y="120" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="382" y="138" text-anchor="middle" fill="#333">2</text>
    <rect x="400" y="120" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="416" y="138" text-anchor="middle" fill="#333">3</text>
    <rect x="434" y="120" width="32" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="450" y="138" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="468" y="120" width="32" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="484" y="138" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <!-- dropped 6 -->
    <rect x="502" y="120" width="32" height="26" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="518" y="138" text-anchor="middle" fill="#bbb" font-size="10">6</text>
  </g>
  <text x="470" y="166" text-anchor="middle" font-size="10" fill="#666">线性挑 2 个 ⇒ 挑 3、5 = 8</text>

  <!-- Case B: drop first (1), array [2,3,4,5,6] -->
  <text x="330" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">情况 B：去掉开头 1</text>
  <g font-size="11">
    <rect x="298" y="216" width="32" height="26" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="314" y="234" text-anchor="middle" fill="#bbb" font-size="10">1</text>
    <rect x="332" y="216" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="348" y="234" text-anchor="middle" fill="#333">2</text>
    <rect x="366" y="216" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="382" y="234" text-anchor="middle" fill="#333">3</text>
    <rect x="400" y="216" width="32" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="416" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="434" y="216" width="32" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="450" y="234" text-anchor="middle" fill="#333">5</text>
    <rect x="468" y="216" width="32" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="484" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#666">线性挑 2 个 ⇒ 挑 4、6 = 10</text>

  <!-- max box -->
  <rect x="332" y="288" width="200" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="432" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = max(A, B)</text>
  <text x="432" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= max(8, 10) = 10 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="392" width="600" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">环形唯一比线性多的约束：首尾不能同时挑 ⇒ 枚举「不挑尾 / 不挑头」两类</text>
  <text x="320" y="426" text-anchor="middle" font-size="10" fill="#888">每类都是线性「挑 n 个互不相邻」= 打家劫舍 + 个数约束（与 213 打家劫舍 II 同源）</text>
</svg>
