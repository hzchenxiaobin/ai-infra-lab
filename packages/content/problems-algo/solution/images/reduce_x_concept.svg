<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fdfcf7"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">将 x 减到 0：两端删除 → 中间保留</text>
  <path d="M 250 42 Q 380 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12" fill="#666">从左右两端删除元素使和为 x ⟺ 中间保留子数组和为 total − x</text>

  <!-- ===== Top: original problem ===== -->
  <text x="60" y="100" font-size="14" font-weight="bold" fill="#2b6e9e">原问题：从两端删除，使删除元素之和 = x</text>
  <text x="60" y="118" font-size="11" fill="#888">nums = [3, 2, 20, 1, 1, 3], x = 10, total = 30</text>

  <!-- array cells: 6 cells, width 72, start x=60, y=140 -->
  <!-- cell 0: 3 (removed, red) -->
  <g filter="url(#sk2)"><rect x="60" y="140" width="72" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="96" y="170" text-anchor="middle" font-size="16" fill="#a03a3a" font-weight="bold">3</text>
  <text x="96" y="200" text-anchor="middle" font-size="10" fill="#b85450">删左</text>

  <!-- cell 1: 2 (removed, red) -->
  <g filter="url(#sk2)"><rect x="140" y="140" width="72" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="176" y="170" text-anchor="middle" font-size="16" fill="#a03a3a" font-weight="bold">2</text>
  <text x="176" y="200" text-anchor="middle" font-size="10" fill="#b85450">删左</text>

  <!-- cell 2: 20 (kept, green) -->
  <g filter="url(#sk2)"><rect x="220" y="140" width="72" height="46" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="256" y="170" text-anchor="middle" font-size="16" fill="#2e5e2e" font-weight="bold">20</text>
  <text x="256" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">保留</text>

  <!-- cell 3: 1 (removed, red) -->
  <g filter="url(#sk2)"><rect x="300" y="140" width="72" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="336" y="170" text-anchor="middle" font-size="16" fill="#a03a3a" font-weight="bold">1</text>
  <text x="336" y="200" text-anchor="middle" font-size="10" fill="#b85450">删右</text>

  <!-- cell 4: 1 (removed, red) -->
  <g filter="url(#sk2)"><rect x="380" y="140" width="72" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="416" y="170" text-anchor="middle" font-size="16" fill="#a03a3a" font-weight="bold">1</text>
  <text x="416" y="200" text-anchor="middle" font-size="10" fill="#b85450">删右</text>

  <!-- cell 5: 3 (removed, red) -->
  <g filter="url(#sk2)"><rect x="460" y="140" width="72" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="496" y="170" text-anchor="middle" font-size="16" fill="#a03a3a" font-weight="bold">3</text>
  <text x="496" y="200" text-anchor="middle" font-size="10" fill="#b85450">删右</text>

  <!-- bracket: removed sum -->
  <path d="M 60 214 L 60 222 L 532 222 L 532 214" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="296" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">删除和 = 3+2+1+1+3 = 10 = x ✓　操作数 = 5</text>

  <!-- arrow down -->
  <path d="M 380 256 L 380 282" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="274" font-size="11" fill="#3a3a3a">等价转换</text>

  <!-- ===== Bottom: transformed problem ===== -->
  <text x="60" y="306" font-size="14" font-weight="bold" fill="#4a7a3a">等价问题：找最长子数组，使其和 = total − x = 20</text>
  <text x="60" y="324" font-size="11" fill="#888">保留的中间段越长 → 删除的元素越少 → 操作数越少</text>

  <!-- array cells again -->
  <!-- cell 0: 3 (gray, removed) -->
  <g filter="url(#sk2)"><rect x="60" y="346" width="72" height="46" rx="5" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="96" y="376" text-anchor="middle" font-size="16" fill="#aaa">3</text>

  <!-- cell 1: 2 (gray, removed) -->
  <g filter="url(#sk2)"><rect x="140" y="346" width="72" height="46" rx="5" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="176" y="376" text-anchor="middle" font-size="16" fill="#aaa">2</text>

  <!-- cell 2: 20 (kept, green, highlighted) -->
  <g filter="url(#sk2)"><rect x="220" y="346" width="72" height="46" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="256" y="376" text-anchor="middle" font-size="16" fill="#2e5e2e" font-weight="bold">20</text>
  <text x="256" y="406" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最长子数组 = 20</text>

  <!-- cell 3: 1 (gray) -->
  <g filter="url(#sk2)"><rect x="300" y="346" width="72" height="46" rx="5" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="336" y="376" text-anchor="middle" font-size="16" fill="#aaa">1</text>

  <!-- cell 4: 1 (gray) -->
  <g filter="url(#sk2)"><rect x="380" y="346" width="72" height="46" rx="5" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="416" y="376" text-anchor="middle" font-size="16" fill="#aaa">1</text>

  <!-- cell 5: 3 (gray) -->
  <g filter="url(#sk2)"><rect x="460" y="346" width="72" height="46" rx="5" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="496" y="376" text-anchor="middle" font-size="16" fill="#aaa">3</text>

  <!-- bracket: kept subarray -->
  <path d="M 220 398 L 220 404 L 292 404 L 292 398" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- answer box -->
  <g filter="url(#sk2)"><rect x="570" y="350" width="170" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="655" y="368" text-anchor="middle" font-size="11" fill="#7a5415">最长子数组长度 = 1</text>
  <text x="655" y="384" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">答案 = n − 1 = 5</text>
</svg>
