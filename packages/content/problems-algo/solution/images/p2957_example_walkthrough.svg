<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：word = "zyxyxyz"（整串是一条 L = 7 的链）</text>

  <!-- 表头 -->
  <rect x="15" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="35" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="55" y="40" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">w[i−1]</text>
  <rect x="125" y="40" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">w[i]</text>
  <rect x="195" y="40" width="95" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">|差| ≤ 1 ?</text>
  <rect x="290" y="40" width="155" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="367" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="445" y="40" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="57" text-anchor="middle" font-size="11" fill="#33476b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 1：i=1 -->
  <rect x="15" y="70" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="35" y="90" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="55" y="70" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="90" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">z</text>
  <rect x="125" y="70" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="90" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">y</text>
  <rect x="195" y="70" width="95" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="90" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✓ |1|</text>
  <rect x="290" y="70" width="155" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="90" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">冲突 → 改，i += 2</text>
  <rect x="445" y="70" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="90" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 2：i=3 -->
  <rect x="15" y="104" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="35" y="124" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <rect x="55" y="104" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="124" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="125" y="104" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="124" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">y</text>
  <rect x="195" y="104" width="95" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="124" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✓ |1|</text>
  <rect x="290" y="104" width="155" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">冲突 → 改，i += 2</text>
  <rect x="445" y="104" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="124" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 3：i=5 -->
  <rect x="15" y="138" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="35" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5</text>
  <rect x="55" y="138" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="125" y="138" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">y</text>
  <rect x="195" y="138" width="95" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="158" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✓ |1|</text>
  <rect x="290" y="138" width="155" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="158" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">冲突 → 改，i += 2</text>
  <rect x="445" y="138" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="158" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 4：i=7 越界 -->
  <rect x="15" y="172" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="35" y="192" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">7</text>
  <rect x="55" y="172" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="125" y="172" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="192" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="195" y="172" width="95" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="192" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="290" y="172" width="155" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i ≥ n = 7，结束</text>
  <rect x="445" y="172" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="192" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 跳过说明 -->
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i = 2、4、6 不必比较：word[i−1] 已被改成安全字符 ✱，(i−1,i) 必然安全</text>

  <!-- 结果 -->
  <rect x="170" y="242" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 3 ✓（示例 3）</text>

  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">链视角：z~y~x~y~x~y~z 全冲突，L = 7 → ⌊7/2⌋ = 3，两条路互相印证</text>
</svg>
