<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心观察：每本书「未归还数」对上「总副本数」——可用 = 总数 − 未归还</text>

  <!-- Left: library_books table -->
  <text x="150" y="46" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">library_books</text>
  <rect x="25" y="52" width="250" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="68" font-size="9.5" fill="#333">book_id</text>
  <text x="95" y="68" font-size="9.5" fill="#333">title</text>
  <text x="215" y="68" font-size="9.5" fill="#b85450">total_copies</text>
  <line x1="85" y1="52" x2="85" y2="208" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="52" x2="205" y2="208" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="76" width="250" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="91" font-size="9.5" fill="#333">1</text>
  <text x="95" y="91" font-size="9" fill="#333">The Great Gatsby</text>
  <text x="225" y="91" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="85" y1="76" x2="85" y2="98" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="76" x2="205" y2="98" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="98" width="250" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="113" font-size="9.5" fill="#333">2</text>
  <text x="95" y="113" font-size="9" fill="#333">To Kill a Mockingbird</text>
  <text x="225" y="113" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="85" y1="98" x2="85" y2="120" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="98" x2="205" y2="120" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="120" width="250" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="135" font-size="9.5" fill="#333">3</text>
  <text x="95" y="135" font-size="9" fill="#333">1984</text>
  <text x="225" y="135" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <line x1="85" y1="120" x2="85" y2="142" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="120" x2="205" y2="142" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="142" width="250" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="157" font-size="9.5" fill="#333">4</text>
  <text x="95" y="157" font-size="9" fill="#333">Pride and Prejudice</text>
  <text x="225" y="157" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="85" y1="142" x2="85" y2="164" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="142" x2="205" y2="164" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="164" width="250" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="179" font-size="9.5" fill="#333">5</text>
  <text x="95" y="179" font-size="9" fill="#333">The Catcher in the Rye</text>
  <text x="225" y="179" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <line x1="85" y1="164" x2="85" y2="186" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="164" x2="205" y2="186" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="186" width="250" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="201" font-size="9.5" fill="#333">6</text>
  <text x="95" y="201" font-size="9" fill="#333">Brave New World</text>
  <text x="225" y="201" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <line x1="85" y1="186" x2="85" y2="208" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="186" x2="205" y2="208" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Right: active (unreturned) records per book -->
  <text x="422" y="46" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">每本书的未归还记录（return_date IS NULL）</text>

  <rect x="300" y="56" width="245" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="72" font-size="9" fill="#333">book 1</text>
  <text x="352" y="72" font-size="9.5" fill="#b85450" font-weight="bold">×3</text>
  <text x="378" y="72" font-size="8.5" fill="#888">Alice、Bob、Grace</text>

  <rect x="300" y="84" width="245" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="100" font-size="9" fill="#333">book 2</text>
  <text x="352" y="100" font-size="9.5" fill="#b85450" font-weight="bold">×2</text>
  <text x="378" y="100" font-size="8.5" fill="#888">Ivan、Jane</text>

  <rect x="300" y="112" width="245" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="128" font-size="9" fill="#333">book 3</text>
  <text x="352" y="128" font-size="9.5" fill="#b85450" font-weight="bold">×1</text>
  <text x="378" y="128" font-size="8.5" fill="#888">David</text>

  <rect x="300" y="140" width="245" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="156" font-size="9" fill="#333">book 4</text>
  <text x="352" y="156" font-size="9.5" fill="#b85450" font-weight="bold">×1</text>
  <text x="378" y="156" font-size="8.5" fill="#888">Emma</text>

  <rect x="300" y="168" width="245" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="184" font-size="9" fill="#333">book 6</text>
  <text x="352" y="184" font-size="9.5" fill="#b85450" font-weight="bold">×1</text>
  <text x="378" y="184" font-size="8.5" fill="#888">Henry</text>

  <text x="305" y="208" font-size="8.5" fill="#888">Carol、Frank 已归还 → 不计入；book 5 未归还数 = 0</text>

  <!-- Arrows into comparison table -->
  <path d="M150 212 L167 245" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="142" y="234" text-anchor="end" font-size="8.5" fill="#446688">total_copies</text>

  <path d="M425 212 L408 245" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="437" y="234" text-anchor="start" font-size="8.5" fill="#4a7a3a">GROUP BY book_id 计数</text>

  <!-- Comparison table -->
  <rect x="75" y="248" width="410" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="264" text-anchor="middle" font-size="9.5" fill="#333">book_id</text>
  <text x="170" y="264" text-anchor="middle" font-size="9.5" fill="#333">total_copies</text>
  <text x="240" y="264" text-anchor="middle" font-size="9.5" fill="#333">未归还数</text>
  <text x="320" y="264" text-anchor="middle" font-size="9.5" fill="#333">可用副本</text>
  <text x="425" y="264" text-anchor="middle" font-size="9.5" fill="#333">入选？</text>
  <line x1="135" y1="248" x2="135" y2="398" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="205" y1="248" x2="205" y2="398" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="275" y1="248" x2="275" y2="398" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="365" y1="248" x2="365" y2="398" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="75" y="272" width="410" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="105" y="286" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="170" y="286" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="240" y="286" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="320" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3−3=0</text>
  <text x="425" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 入选</text>

  <rect x="75" y="293" width="410" height="21" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="307" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="170" y="307" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="240" y="307" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="320" y="307" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="425" y="307" text-anchor="middle" font-size="9" fill="#888">✗</text>

  <rect x="75" y="314" width="410" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="105" y="328" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="170" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="240" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="320" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1−1=0</text>
  <text x="425" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 入选</text>

  <rect x="75" y="335" width="410" height="21" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="349" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="170" y="349" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="240" y="349" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="320" y="349" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="425" y="349" text-anchor="middle" font-size="9" fill="#888">✗</text>

  <rect x="75" y="356" width="410" height="21" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="370" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="170" y="370" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="240" y="370" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="320" y="370" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="425" y="370" text-anchor="middle" font-size="9" fill="#888">✗</text>

  <rect x="75" y="377" width="410" height="21" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="391" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="170" y="391" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="240" y="391" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="320" y="391" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="425" y="391" text-anchor="middle" font-size="9" fill="#888">✗</text>

  <!-- Bottom summary -->
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">「无可用副本」⇔ 未归还数 ≥ total_copies（INNER JOIN 已保证当前在借）</text>
  <text x="280" y="440" text-anchor="middle" font-size="9.5" fill="#555">→ 仅 book 1、book 3 入选；按 current_borrowers 降序输出</text>
</svg>
