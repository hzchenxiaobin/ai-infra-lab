<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：翻转即 XOR，每格只翻 0/1 次，顺序无关</text>

  <!-- ===== Section 1: one flip = plus shape ===== -->
  <text x="40" y="58" font-size="12" fill="#d6a040" font-weight="bold">① 一次翻转 = 十字形（自身 + 4 邻居取反）</text>

  <!-- 3x3 grid centered at (1,1) -->
  <!-- cell size 38, origin x=60 y=70 -->
  <!-- row0 -->
  <rect x="98" y="70" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="94" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="136" y="70" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="94" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="174" y="70" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="94" text-anchor="middle" font-size="13" fill="#333">0</text>
  <!-- row1 -->
  <rect x="98" y="108" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="132" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="136" y="108" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="132" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <rect x="174" y="108" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="132" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <!-- row2 -->
  <rect x="98" y="146" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="136" y="146" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="170" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="174" y="146" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>

  <text x="155" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">点中心格 → 红=自身 橙=四邻居</text>

  <!-- arrow to section 2 -->
  <path d="M 232 127 L 268 127" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 2: XOR cancels ===== -->
  <text x="280" y="58" font-size="12" fill="#b85450" font-weight="bold">② 翻两次 = 没翻（XOR 自抵消）</text>

  <!-- flip once -->
  <rect x="290" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="94" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="340" y="94" font-size="12" fill="#888">翻1次</text>
  <path d="M 372 89 L 398 89" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="74" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="94" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- flip twice -->
  <rect x="290" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="138" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="340" y="138" font-size="12" fill="#888">翻2次</text>
  <path d="M 372 133 L 398 133" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="138" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <rect x="280" y="158" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a ⊕ a = 0，故每格只需决定翻 / 不翻</text>
  <text x="370" y="194" text-anchor="middle" font-size="10" fill="#888">且 ⊕ 可交换 → 顺序无关</text>

  <!-- divider -->
  <path d="M 40 214 L 520 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Section 3: reduce to subset ===== -->
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 转化为：选最少格子子集，使其翻转 XOR = 初始状态</text>

  <!-- equation boxes -->
  <rect x="40" y="256" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始态 init</text>
  <text x="100" y="292" text-anchor="middle" font-size="10" fill="#666">矩阵编码为位掩码</text>

  <text x="174" y="282" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">⊕</text>

  <rect x="190" y="256" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">所选格子的翻转掩码</text>
  <text x="265" y="292" text-anchor="middle" font-size="10" fill="#666">XOR of flip_mask[b]</text>

  <text x="354" y="282" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">=</text>

  <rect x="370" y="256" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全 0</text>

  <text x="466" y="282" font-size="11" fill="#888">即子集 XOR = init</text>

  <!-- bottom summary -->
  <rect x="40" y="316" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">m, n ≤ 3 → 最多 9 格 → 2^9 = 512 个子集</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#666">枚举全部子集，记录使结果归零的最小 popcount，无解返回 −1</text>
</svg>
