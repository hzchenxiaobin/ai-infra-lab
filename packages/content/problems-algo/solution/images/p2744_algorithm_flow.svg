<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：哈希集合一次扫描</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="55" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：set = ∅, ans = 0</text>

  <line x1="280" y1="82" x2="280" y2="108" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each word w -->
  <rect x="180" y="108" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个 word = w</text>

  <line x1="280" y1="148" x2="280" y2="168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute rev -->
  <rect x="190" y="168" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">rev = reverse(w)</text>

  <line x1="280" y1="204" x2="280" y2="222" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,222 380,272 280,322 180,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rev ∈ set ?</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(集合中已有未配的反转)</text>

  <!-- Yes branch -->
  <line x1="380" y1="272" x2="450" y2="272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="450" y="248" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="268" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">ans += 1</text>
  <text x="500" y="285" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">set.erase(rev)</text>

  <!-- No branch -->
  <line x1="180" y1="272" x2="110" y2="272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="30" y="248" width="80" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">set.add(w)</text>

  <!-- loop back arrow -->
  <path d="M500,296 C500,360 280,360 280,150" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">处理完所有 word 后结束</text>

  <!-- end -->
  <ellipse cx="280" cy="392" rx="70" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">返回 ans</text>
  <line x1="280" y1="322" x2="280" y2="372" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
