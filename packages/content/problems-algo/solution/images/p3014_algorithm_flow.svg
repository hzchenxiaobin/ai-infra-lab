<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：拿到 n，一步公式出答案</text>

  <!-- start -->
  <rect x="140" y="44" width="90" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 185 74 L 185 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- n = len(word) -->
  <rect x="100" y="94" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = len(word)</text>
  <path d="M 185 126 L 185 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- divmod -->
  <rect x="80" y="146" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="167" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">q = n ÷ 8（整除），r = n mod 8</text>
  <path d="M 185 178 L 185 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- formula -->
  <rect x="85" y="200" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="223" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = (q + 1) × (4q + r)</text>
  <path d="M 185 236 L 185 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="125" y="258" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- side box: loop version -->
  <path d="M 290 162 C 312 162 316 166 330 170" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="334" y="118" width="172" height="132" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="420" y="142" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">等价写法（逐项累加）</text>
  <text x="420" y="166" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans = 0</text>
  <text x="420" y="186" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">for i in 0 .. n−1:</text>
  <text x="420" y="206" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans += i // 8 + 1</text>
  <text x="420" y="234" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 i 个字母放第 ⌊i/8⌋+1 层</text>

  <!-- verification chips -->
  <rect x="60" y="308" width="400" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">自检：n=5 → 5 ✓　　n=10 → 12 ✓　　n=26 → 56 ✓</text>
</svg>
