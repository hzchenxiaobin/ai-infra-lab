<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 522" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3648a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="522" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：覆盖区域是 s×s 正方形 ⟹ 分块计数，上界 = 下界</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">s = 2k+1；切成 ⌈n/s⌉ × ⌈m/s⌉ 块每块放一个传感器，锚点论证逼出下界</text>

  <!-- ============ Panel 1: coverage shape ============ -->
  <text x="30" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一个传感器罩住边长 s = 2k+1 的轴对齐正方形（图示 k=1, s=3）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="72" width="112" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <path d="M 76 72 V 184 M 92 72 V 184 M 108 72 V 184 M 124 72 V 184 M 140 72 V 184 M 156 72 V 184" stroke="#ccc" stroke-width="1" fill="none"/>
    <path d="M 60 88 H 172 M 60 104 H 172 M 60 120 H 172 M 60 136 H 172 M 60 152 H 172 M 60 168 H 172" stroke="#ccc" stroke-width="1" fill="none"/>
    <rect x="92" y="104" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="116" cy="128" r="4.5" fill="#b85450"/>
    <path d="M 120 128 H 136" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr3648a)"/>
    <text x="128" y="122" font-size="9" fill="#8a6d1f">k</text>
    <text x="116" y="199" text-anchor="middle" font-size="9.5" fill="#555">覆盖正方形 s×s = 3×3</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="200" y="95">max(|Δr|, |Δc|) ≤ k</text>
    <text x="200" y="113">⟺ |Δr| ≤ k 且 |Δc| ≤ k</text>
    <text x="200" y="131">⟺ 覆盖 [r₀−k, r₀+k] × [c₀−k, c₀+k]</text>
    <text x="200" y="149">即边长 s = 2k+1 的正方形</text>
    <text x="200" y="167" fill="#8a6d1f">贴边放置时越界部分被浪费</text>
  </g>

  <!-- ============ Panel 2: tiling upper bound ============ -->
  <text x="30" y="218" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 上界：切成 ⌈n/s⌉ × ⌈m/s⌉ 块，每块放一个传感器（n=m=5, k=1）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="230" width="66" height="66" fill="#fff8e1" stroke="#999" stroke-width="1"/>
    <rect x="126" y="230" width="44" height="66" fill="#fff8e1" stroke="#999" stroke-width="1"/>
    <rect x="60" y="296" width="66" height="44" fill="#fff8e1" stroke="#999" stroke-width="1"/>
    <rect x="126" y="296" width="44" height="44" fill="#fff8e1" stroke="#999" stroke-width="1"/>
    <path d="M 82 230 V 340 M 104 230 V 340 M 148 230 V 340" stroke="#ddd" stroke-width="1" fill="none"/>
    <path d="M 60 252 H 170 M 60 274 H 170 M 60 318 H 170" stroke="#ddd" stroke-width="1" fill="none"/>
    <path d="M 60 296 H 170" stroke="#d6a040" stroke-width="2.5" fill="none"/>
    <path d="M 126 230 V 340" stroke="#d6a040" stroke-width="2.5" fill="none"/>
    <rect x="60" y="230" width="66" height="66" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4"/>
    <circle cx="93" cy="263" r="4.5" fill="#b85450"/>
    <circle cx="159" cy="263" r="4.5" fill="#b85450"/>
    <circle cx="93" cy="329" r="4.5" fill="#b85450"/>
    <circle cx="159" cy="329" r="4.5" fill="#b85450"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="200" y="255">s = 3 ⇒ 行块 {0..2}, {3..4}；列块同</text>
    <text x="200" y="273">⌈5/3⌉ = 2 行块 × 2 列块 = 4 块</text>
    <text x="200" y="291">每块 ≤ 3×3，块中心放一个传感器</text>
    <text x="200" y="309">（虚线 = 左上那块的覆盖范围）</text>
    <text x="200" y="327" fill="#2a5a2a" font-weight="bold">⇒ 4 个传感器足够（上界 4）</text>
  </g>

  <!-- ============ Panel 3: anchor lower bound ============ -->
  <text x="30" y="362" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 下界：锚点 (i·s, j·s) 两两距离 &gt; 2k，一个传感器至多罩住一个</text>

  <g filter="url(#rough2)">
    <rect x="60" y="374" width="90" height="90" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <path d="M 78 374 V 464 M 96 374 V 464 M 114 374 V 464 M 132 374 V 464" stroke="#ccc" stroke-width="1" fill="none"/>
    <path d="M 60 392 H 150 M 60 410 H 150 M 60 428 H 150 M 60 446 H 150" stroke="#ccc" stroke-width="1" fill="none"/>
    <polygon points="69,378 74,383 69,388 64,383" fill="#d6a040" stroke="#8a6d1f" stroke-width="1"/>
    <polygon points="123,378 128,383 123,388 118,383" fill="#d6a040" stroke="#8a6d1f" stroke-width="1"/>
    <polygon points="69,432 74,437 69,442 64,437" fill="#d6a040" stroke="#8a6d1f" stroke-width="1"/>
    <polygon points="123,432 128,437 123,442 118,437" fill="#d6a040" stroke="#8a6d1f" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="185" y="392">锚点 = (i·s, j·s)，共 ⌈n/s⌉×⌈m/s⌉ 个</text>
    <text x="185" y="410">任两锚点行差或列差 ≥ s = 2k+1</text>
    <text x="185" y="428">⇒ 两两切比雪夫距离 &gt; 2k</text>
    <text x="185" y="446" fill="#b85450">若一器同罩两个 ⟹ 距离 ≤ 2k，矛盾！</text>
    <text x="185" y="464" fill="#2a5a2a" font-weight="bold">⇒ 器数 ≥ 锚点数 = 4（下界 4）</text>
  </g>

  <!-- ============ Bottom note ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="478" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="501" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">上界 = 下界 ⟹ 最少传感器数 = ⌈n/(2k+1)⌉ × ⌈m/(2k+1)⌉</text>
  </g>
</svg>
