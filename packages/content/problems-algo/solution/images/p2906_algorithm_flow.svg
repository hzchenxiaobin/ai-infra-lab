<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍线性扫描 + 两个滚动变量，O(1) 额外空间</text>

  <!-- start box -->
  <rect x="175" y="44" width="270" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">拍扁：k = i×m + j，N = n·m</text>

  <path d="M 310 82 L 310 104" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 1 box -->
  <rect x="95" y="106" width="430" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一遍 · 从右往左（攒后缀积 suf）</text>
  <text x="310" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">suf ← 1 ；  for k = N−1 downto 0:</text>
  <text x="310" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">res[k] ← suf ；  suf ← suf · (a[k] % 12345) % 12345</text>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⟲</text>

  <path d="M 310 202 L 310 224" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 2 box -->
  <rect x="95" y="226" width="430" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第二遍 · 从左往右（乘前缀积 pre）</text>
  <text x="310" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">pre ← 1 ；  for k = 0 to N−1:</text>
  <text x="310" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">res[k] ← res[k] · pre % 12345 ；  pre ← pre · (a[k] % 12345) % 12345</text>
  <text x="540" y="250" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⟲</text>

  <path d="M 310 322 L 310 344" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end box -->
  <rect x="175" y="346" width="270" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还原二维 p[i][j] = res[i·m+j]，返回</text>

  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">a[k] ≤ 10⁹：乘之前先 % 12345；12345² ≈ 1.5×10⁸，long long 双保险</text>
</svg>
