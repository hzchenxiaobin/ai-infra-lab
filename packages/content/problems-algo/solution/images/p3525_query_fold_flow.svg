<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">每次查询：单点更新 → 后缀区间从左到右折叠</text>

  <rect x="160" y="38" width="200" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">查询 (idx, val, start, x)</text>
  <path d="M 260 70 L 260 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="84" width="280" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 叶子 idx 重置：prod = val%k，cnt[val%k] = 1</text>
  <text x="410" y="106" font-size="9" fill="#888" filter="url(#rough2)">O(k)</text>
  <path d="M 260 120 L 260 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="134" width="280" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② 自底向上 pull 祖先链（每层做一次 O(k) 合并）</text>
  <text x="410" y="156" font-size="9" fill="#888" filter="url(#rough2)">O(k·log n)</text>
  <path d="M 260 170 L 260 182" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="184" width="280" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ DFS 收集覆盖 [start, n−1] 的 O(log n) 个节点</text>
  <text x="410" y="206" font-size="9" fill="#888" filter="url(#rough2)">O(log n)</text>
  <path d="M 260 220 L 260 232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="234" width="330" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">④ 从左到右折叠进累加器 acc（初值 = 幺元）</text>
  <text x="260" y="272" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">acc_cnt[acc_prod·z mod k] += cnt_z；acc_prod ← acc_prod·prod</text>
  <text x="85" y="264" text-anchor="end" font-size="9" fill="#d6a040" filter="url(#rough2)">O(k·log n)</text>
  <path d="M 260 288 L 260 300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="302" width="200" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">⑤ 答案 = acc_cnt[x]</text>

  <rect x="30" y="348" width="460" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⚠️ 折叠顺序必须从左到右：(prod, cnt) 的合并不满足交换律</text>
  <text x="260" y="380" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">单点修改持久保留——前一个查询的更新对后续所有查询可见</text>
</svg>
