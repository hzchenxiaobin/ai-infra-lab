<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两步判定</text>

  <!-- ===== example 1: true ===== -->
  <text x="42" y="88" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <rect x="100" y="52" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="52" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="52" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="90" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="90" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="90" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="153" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="153" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="240" y="72" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① 每一行都等于第一行 ✓</text>
  <text x="240" y="94" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">② 第一行 1 ≠ 0，0 ≠ 2 ✓</text>
  <text x="240" y="114" font-size="10.5" fill="#999" filter="url(#rough2)">两步全部通过</text>

  <rect x="460" y="72" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <path d="M 40 132 L 540 132" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ===== example 2: false, row-adjacent equal ===== -->
  <text x="42" y="186" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <rect x="100" y="150" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="150" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="150" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="188" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="188" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="188" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="153" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="191" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="153" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="240" y="170" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① 每一行都等于第一行 ✓</text>
  <text x="240" y="192" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 第一行 1 == 1 ✗（右邻相等）</text>
  <text x="240" y="212" font-size="10.5" fill="#999" filter="url(#rough2)">同一行取值全相等 → 横向约束必违反</text>

  <rect x="460" y="170" width="66" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="190" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 40 230 L 540 230" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ===== example 3: false, column not all equal ===== -->
  <text x="42" y="300" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3</text>
  <rect x="100" y="250" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="282" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="314" width="30" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="302" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="115" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="240" y="272" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 第二行 [2] ≠ 第一行 [1] ✗</text>
  <text x="240" y="294" font-size="11.5" fill="#999" filter="url(#rough2)">② 只有一列，无右邻 → 豁免 —</text>
  <text x="240" y="314" font-size="10.5" fill="#999" filter="url(#rough2)">列内不全等 → 纵向约束违反</text>

  <rect x="460" y="282" width="66" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="302" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
</svg>
