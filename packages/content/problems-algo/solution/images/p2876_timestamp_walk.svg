<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 478" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="478" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：edges = [1,2,0,0] —— 时间戳法两轮走图</text>

  <!-- ======== Round 1 panel ======== -->
  <rect x="26" y="40" width="568" height="196" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 5" rx="12" filter="url(#rough2)"/>
  <text x="46" y="64" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 轮：i = 0 出发（未访问）</text>

  <rect x="46" y="80" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="85" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t = 0</text>

  <path d="M 128 102 L 148 102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="80" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="191" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="191" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t = 1</text>

  <path d="M 234 102 L 254 102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="258" y="80" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="297" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="297" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t = 2</text>

  <path d="M 340 102 L 360 102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="364" y="80" width="210" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="469" y="98" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">再走到 0：已访问！</text>
  <text x="469" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">vis_time[0] = 0</text>

  <rect x="46" y="140" width="528" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">vis_time[0] = 0 ≥ vis_time[i] = 0 ⟹ 本轮撞环：0 是环入口</text>

  <rect x="46" y="186" width="528" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环长 = clock − vis_time[0] = 3 − 0 = 3，path = [0,1,2] 全是环</text>
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans[0] = ans[1] = ans[2] = 3</text>

  <!-- ======== Round 2 panel ======== -->
  <rect x="26" y="252" width="568" height="196" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 5" rx="12" filter="url(#rough2)"/>
  <text x="46" y="276" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 轮：i = 3 出发（未访问）</text>

  <rect x="46" y="292" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="310" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="85" y="327" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t = 3</text>

  <path d="M 128 314 L 148 314" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="292" width="210" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="257" y="310" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">再走到 0：已访问！</text>
  <text x="257" y="327" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">vis_time[0] = 0</text>

  <rect x="46" y="352" width="528" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">vis_time[0] = 0 &lt; vis_time[i] = 3 ⟹ 历史轮次：整条 path = [3] 是树枝</text>

  <rect x="46" y="398" width="528" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">倒序递推：ans[3] = ans[edges[3]] + 1 = ans[0] + 1 = 4</text>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">后继 0 的答案在第 1 轮已算好，一步接上</text>

  <text x="310" y="468" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">最终 answer = [3, 3, 3, 4] ✓</text>
</svg>
