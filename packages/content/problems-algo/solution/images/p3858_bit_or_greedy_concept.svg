<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">逐位贪心：从高位到低位，能归零的位就归零</text>

  <!-- 左列：zero_mask / ans 位条（示例 2 终态） -->
  <g filter="url(#rough2)">
    <text x="28" y="54" font-size="12" fill="#2f5d24" font-weight="bold">zero_mask：已归零的位</text>
    <rect x="28"  y="62" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="61"  y="62" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="94"  y="62" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="127" y="62" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="160" y="62" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="193" y="62" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="226" y="62" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="259" y="62" width="14" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="43"  y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="76"  y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="109" y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="142" y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="175" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">1</text>
    <text x="208" y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="241" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">1</text>
    <text x="43"  y="106" text-anchor="middle" font-size="9" fill="#999">b7</text>
    <text x="76"  y="106" text-anchor="middle" font-size="9" fill="#999">b6</text>
    <text x="109" y="106" text-anchor="middle" font-size="9" fill="#999">b5</text>
    <text x="142" y="106" text-anchor="middle" font-size="9" fill="#999">b4</text>
    <text x="175" y="106" text-anchor="middle" font-size="9" fill="#999">b3</text>
    <text x="208" y="106" text-anchor="middle" font-size="9" fill="#999">b2</text>
    <text x="241" y="106" text-anchor="middle" font-size="9" fill="#999">b1</text>
    <text x="266" y="106" text-anchor="middle" font-size="9" fill="#999">b0</text>

    <text x="28" y="132" font-size="12" fill="#8a3030" font-weight="bold">ans：卡壳必为 1 的位</text>
    <rect x="28"  y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="61"  y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="94"  y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="127" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="160" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="193" y="140" width="30" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="226" y="140" width="30" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="259" y="140" width="14" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="43"  y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="76"  y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="109" y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="142" y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="175" y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="208" y="160" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">1</text>
    <text x="241" y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="266" y="160" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">1</text>

    <rect x="20" y="182" width="256" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="148" y="204" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">检查位 b 失败 = 存在「卡壳行」：</text>
    <text x="148" y="222" text-anchor="middle" font-size="11.5" fill="#8a6d1a">该行所有数都撞 cand，于是只要保住</text>
    <text x="148" y="239" text-anchor="middle" font-size="11.5" fill="#8a6d1a">已归零高位，这行怎么选，位 b 都是 1</text>

    <rect x="20" y="258" width="256" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="148" y="280" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">答案 = ans = 卡壳位的并集</text>
  </g>

  <!-- 右列：一次检查（示例 2，b = 1） -->
  <g filter="url(#rough2)">
    <text x="416" y="54" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">检查位 b = 1（示例 2）</text>
    <rect x="300" y="62" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="337" y="62" width="34" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="374" y="62" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="411" y="62" width="34" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="317" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">1</text>
    <text x="354" y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="391" y="82" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">1</text>
    <text x="428" y="82" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="317" y="106" text-anchor="middle" font-size="9" fill="#999">b3 旧</text>
    <text x="354" y="106" text-anchor="middle" font-size="9" fill="#999">b2</text>
    <text x="391" y="106" text-anchor="middle" font-size="9" fill="#8a6d1a">b1 试</text>
    <text x="428" y="106" text-anchor="middle" font-size="9" fill="#999">b0</text>
    <text x="416" y="124" text-anchor="middle" font-size="11" fill="#666">cand = zero_mask | (1 &lt;&lt; b)</text>

    <text x="300" y="138" font-size="12" fill="#333" font-weight="bold">行1</text>
    <rect x="336" y="126" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="388" y="126" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="358" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="358" y="158" text-anchor="middle" font-size="10" fill="#666">0011</text>
    <text x="410" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <text x="410" y="158" text-anchor="middle" font-size="10" fill="#666">0101</text>
    <text x="452" y="148" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">&#10007;</text>
    <text x="496" y="148" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">&#10003;</text>

    <text x="300" y="184" font-size="12" fill="#333" font-weight="bold">行2</text>
    <rect x="336" y="172" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="388" y="172" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="358" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <text x="358" y="204" text-anchor="middle" font-size="10" fill="#666">0110</text>
    <text x="410" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
    <text x="410" y="204" text-anchor="middle" font-size="10" fill="#666">0100</text>
    <text x="452" y="194" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">&#10007;</text>
    <text x="496" y="194" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">&#10003;</text>

    <rect x="288" y="222" width="252" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="414" y="244" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">两行都有 &#10003; &#8594; zero_mask |= 010</text>
    <text x="414" y="272" text-anchor="middle" font-size="11" fill="#666">构造答案：每行取 x &amp; zero_mask == 0</text>
  </g>

  <!-- 底部警示：不能用行 OR 判断 -->
  <g filter="url(#rough2)">
    <rect x="20" y="306" width="520" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="328" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">&#9888;&#65039; 别拿「行的 OR」偷懒判断</text>
    <text x="280" y="347" text-anchor="middle" font-size="11.5" fill="#8a3030">行 [1, 2] 的 row_or = 3；取 cand = 01 时 row_or &amp; cand &#8800; 0，看似无解</text>
    <text x="280" y="365" text-anchor="middle" font-size="11.5" fill="#8a3030">但 2 &amp; 01 = 0，其实存在合法选择！不同数可以撞 cand 的不同位</text>
    <text x="280" y="383" text-anchor="middle" font-size="11.5" fill="#8a3030">row_or &amp; cand == 0 只能「全票通过」，不能「一票否决」</text>
  </g>
</svg>
