<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,2,1,5,6,4],  k = 2,  target = 4</text>

  <!-- Panel 1: Round 1 -->
  <rect x="10" y="40" width="540" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 1 轮：lo=0, hi=5，随机 pivot = 4</text>

  <!-- array row 1 -->
  <rect x="80" y="78" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="97" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="128" y="78" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="176" y="78" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="224" y="78" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="97" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="272" y="78" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="97" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="320" y="78" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <text x="102" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">≤4</text>
  <text x="150" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">≤4</text>
  <text x="198" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">≤4</text>
  <text x="246" y="122" text-anchor="middle" font-size="9" fill="#b85450">&gt;4</text>
  <text x="294" y="122" text-anchor="middle" font-size="9" fill="#b85450">&gt;4</text>
  <text x="342" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">pivot</text>

  <text x="380" y="88" font-size="11" fill="#888">划分得 p = 3</text>
  <text x="380" y="106" font-size="11" fill="#d6a040" font-weight="bold">p(3) &lt; target(4)</text>
  <text x="380" y="124" font-size="11" fill="#4a7a3a">→ 答案在右段，lo = 4</text>

  <!-- Panel 2: Round 2 -->
  <rect x="10" y="170" width="540" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="170" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 2 轮：lo=4, hi=5，子段 [6,5]，随机 pivot = 6</text>

  <!-- array row 2 (after round1 partition) -->
  <rect x="80" y="208" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="227" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <rect x="128" y="208" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="227" text-anchor="middle" font-size="11" fill="#aaa">2</text>
  <rect x="176" y="208" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="198" y="227" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <rect x="224" y="208" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="246" y="227" text-anchor="middle" font-size="11" fill="#aaa">4</text>
  <rect x="272" y="208" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="227" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="320" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- brackets showing subarray [4,5] -->
  <path d="M 270 244 L 270 250 L 366 250 L 366 244" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="318" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040">子段 [4,5]</text>

  <text x="380" y="218" font-size="11" fill="#888">划分得 p = 5</text>
  <text x="380" y="236" font-size="11" fill="#b85450" font-weight="bold">p(5) &gt; target(4)</text>
  <text x="380" y="254" font-size="11" fill="#4a7a3a">→ 答案在左段，hi = 4</text>

  <!-- Panel 3: converge -->
  <rect x="10" y="300" width="540" height="124" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="300" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">收敛：lo = hi = 4  →  返回 nums[4]</text>

  <!-- array row 3 -->
  <rect x="80" y="338" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="357" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <rect x="128" y="338" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="357" text-anchor="middle" font-size="11" fill="#aaa">2</text>
  <rect x="176" y="338" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="198" y="357" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <rect x="224" y="338" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="246" y="357" text-anchor="middle" font-size="11" fill="#aaa">4</text>
  <rect x="272" y="338" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="357" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="320" y="338" width="44" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="342" y="357" text-anchor="middle" font-size="11" fill="#aaa">6</text>

  <text x="294" y="382" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">★ target=4</text>

  <rect x="380" y="338" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="360" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 5 ✓</text>

  <rect x="20" y="386" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#444">只划分 2 次即定位，远少于完整排序 O(n log n)</text>
</svg>
