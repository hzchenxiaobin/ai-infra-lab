<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="260" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：digits = [8, 6, 7, 1, 0]</text>

  <!-- Header row: 步骤|操作|余0|余1|余2|sum%3|结果 -->
  <rect x="40" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <rect x="94" y="40" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <rect x="190" y="40" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">余 0</text>
  <rect x="270" y="40" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="59" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">余 1</text>
  <rect x="350" y="40" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="59" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">余 2</text>
  <rect x="420" y="40" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sum%3</text>
  <rect x="490" y="40" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="535" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果</text>

  <!-- Row 1: 统计 -->
  <rect x="40" y="72" width="54" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="91" text-anchor="middle" font-size="11" fill="#888">①统计</text>
  <rect x="94" y="72" width="96" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="91" text-anchor="middle" font-size="10.5" fill="#444">求和分桶</text>
  <rect x="190" y="72" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="91" text-anchor="middle" font-size="11" fill="#333">6, 0</text>
  <rect x="270" y="72" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="91" text-anchor="middle" font-size="11" fill="#333">7, 1</text>
  <rect x="350" y="72" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="91" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="420" y="72" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="91" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="490" y="72" width="90" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="535" y="91" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 2: 删除 -->
  <rect x="40" y="104" width="54" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="123" text-anchor="middle" font-size="11" fill="#888">②删除</text>
  <rect x="94" y="104" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="142" y="123" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删最小余1=1</text>
  <rect x="190" y="104" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="123" text-anchor="middle" font-size="11" fill="#333">6, 0</text>
  <rect x="270" y="104" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <path d="M 310 100 L 310 92" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="350" y="104" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="123" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="420" y="104" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="490" y="104" width="90" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="535" y="123" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 3: 拼接 -->
  <rect x="40" y="136" width="54" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="155" text-anchor="middle" font-size="11" fill="#888">③拼接</text>
  <rect x="94" y="136" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="142" y="155" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">降序连接</text>
  <rect x="190" y="136" width="80" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="270" y="136" width="80" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="350" y="136" width="70" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="385" y="155" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="420" y="136" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="490" y="136" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="535" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">"8760"</text>

  <!-- Summary -->
  <rect x="60" y="184" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="205" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">sum%3=1 → 余1非空 → 删 1 个最小余1（=1）→ 数位和归 0</text>
  <text x="300" y="224" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">剩余 {8,7,6,0} 降序拼接 = "8760" ✓（8760 / 3 = 2920）</text>
</svg>
