<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫 + 滚动两个状态</text>

  <!-- Start -->
  <ellipse cx="260" cy="54" rx="56" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 72 L 260 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="88" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="11" fill="#333">dp0 = dp1 = 1,  ans = 1,  i = 1</text>
  <path d="M 260 128 L 260 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop check diamond -->
  <path d="M 260 146 L 330 188 L 260 230 L 190 188 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#333">（还有位置）</text>

  <!-- No branch -> return -->
  <path d="M 330 188 L 400 188 L 400 372 L 300 372" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="182" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes -> compute -->
  <path d="M 260 230 L 260 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Compute box: cur0 / cur1 with 4 conditions -->
  <rect x="60" y="248" width="400" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">取 a=nums1[i], b=nums2[i], pa=…[i−1], pb=…[i−1]</text>
  <text x="72" y="288" font-size="11" fill="#333">cur0 = 1;  a≥pa ⇒ max(cur0, dp0+1);  a≥pb ⇒ max(cur0, dp1+1)</text>
  <text x="72" y="306" font-size="11" fill="#333">cur1 = 1;  b≥pa ⇒ max(cur1, dp0+1);  b≥pb ⇒ max(cur1, dp1+1)</text>
  <text x="72" y="320" font-size="11" fill="#555">（4 条比较，成立才续接 +1，否则该方向贡献 0 → 从 1 起算）</text>

  <!-- update + loop back -->
  <path d="M 260 326 L 260 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="130" y="342" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#333">dp0=cur0, dp1=cur1, ans=max(ans,dp0,dp1), i++</text>

  <!-- loop back arrow to diamond -->
  <path d="M 130 359 L 60 359 L 60 188 L 190 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="68" y="278" font-size="10" fill="#888">回到循环判定</text>

  <!-- Return box -->
  <ellipse cx="238" cy="372" rx="60" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="376" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>
</svg>
