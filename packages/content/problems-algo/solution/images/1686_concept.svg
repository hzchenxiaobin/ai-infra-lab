<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：取一个石子 = 自己得分 + 剥夺对手得分</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">石子 i 有两套价值：Alice 视为 a[i]，Bob 视为 b[i]；取走它同时令对手失去那份</text>

  <!-- ===== Stone i: two halves ===== -->
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">石子 i</text>
  <rect x="72" y="86" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="114" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a[i]</text>
  <text x="120" y="146" text-anchor="middle" font-size="9" fill="#446688">Alice 眼中的价值</text>

  <rect x="72" y="156" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="184" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b[i]</text>
  <text x="120" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a">Bob 眼中的价值</text>

  <!-- ===== Alice picks stone i ===== -->
  <path d="M 172 108 L 232 108" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="9" fill="#446688">Alice 取</text>

  <rect x="236" y="86" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="306" y="114" text-anchor="middle" font-size="12" fill="#333">Alice <tspan fill="#446688" font-weight="bold">+a[i]</tspan>（自己得分）</text>

  <path d="M 306 132 L 306 250" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="192" font-size="9" fill="#b85450">同时剥夺</text>

  <!-- ===== Bob loses b[i] ===== -->
  <rect x="236" y="252" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="306" y="280" text-anchor="middle" font-size="12" fill="#333">Bob <tspan fill="#b85450" font-weight="bold">−b[i]</tspan>（被剥夺）</text>

  <!-- ===== Effective value ===== -->
  <path d="M 172 178 L 210 178 L 210 340 L 234 340" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="236" y="316" width="288" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="346" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">有效优先级 s[i] = a[i] + b[i]</text>
  <text x="380" y="374" text-anchor="middle" font-size="10" fill="#888">取走石子 i 对“分差”的净影响 = a[i] + b[i]（自己进账 + 对手少拿）</text>

  <!-- ===== Two stones comparison ===== -->
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#555">s[i] 越大越该先取 —— <tspan fill="#b85450" font-weight="bold">Alice 与 Bob 对优先级排序完全一致</tspan>，无博弈分歧</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">故两人都贪心取当前 s 最大的石子 → 排序后交替取即可</text>
</svg>
