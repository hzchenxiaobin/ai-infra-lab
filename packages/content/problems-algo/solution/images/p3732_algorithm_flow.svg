<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 → 三候选取最大 → × 10⁵</text>

  <!-- 开始 -->
  <rect x="60" y="36" width="130" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="57" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 125 68 L 125 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="40" y="86" width="170" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="107" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">max1 = max2 = −∞</text>
  <text x="125" y="125" text-anchor="middle" font-size="11" fill="#2f5d28" filter="url(#rough2)">min1 = min2 = +∞</text>
  <path d="M 125 136 L 125 152" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：还有元素？ -->
  <polygon points="125,154 197,192 125,230 53,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="196" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">还有元素？</text>

  <!-- 是 → 读入 x -->
  <path d="M 125 230 L 125 252" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="133" y="246" font-size="10" fill="#33506b" filter="url(#rough2)">是</text>
  <rect x="40" y="254" width="170" height="54" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="276" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">读入 x，更新两个最大值</text>
  <text x="125" y="294" text-anchor="middle" font-size="11" fill="#2f5d28" filter="url(#rough2)">与两个最小值（规则见右）</text>

  <!-- 循环回边 -->
  <path d="M 40 281 L 26 281 L 26 192 L 49 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="240" font-size="9" fill="#446688" transform="rotate(-90 20 240)" filter="url(#rough2)">下一轮</text>

  <!-- 否 → 结算 -->
  <path d="M 197 192 L 248 192" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="218" y="184" font-size="10" fill="#8a6d1f" filter="url(#rough2)">否</text>

  <rect x="252" y="158" width="282" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="393" y="184" text-anchor="middle" font-size="11.5" fill="#2f5d28" filter="url(#rough2)">t = max( max1·max2, min1·min2,</text>
  <text x="393" y="204" text-anchor="middle" font-size="11.5" fill="#2f5d28" filter="url(#rough2)">|min1·max1| )</text>
  <path d="M 393 222 L 393 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="252" y="244" width="282" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="393" y="268" text-anchor="middle" font-size="12" fill="#2f5d28" font-weight="bold" filter="url(#rough2)">返回 t × 10⁵（long long）</text>

  <!-- 更新规则便签 -->
  <rect x="252" y="86" width="282" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="106" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">更新规则（打破纪录则整体下移）：</text>
  <text x="266" y="122" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x &gt; max1 ⟹ max2←max1, max1←x</text>
  <text x="266" y="136" font-size="10" fill="#8a6d1f" filter="url(#rough2)">elif x &gt; max2 ⟹ max2←x（min 对称）</text>

  <!-- 底部提醒 -->
  <rect x="40" y="330" width="494" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 三个候选先按 long long 结算再 × 10⁵（上限 10¹⁵，超 int32）</text>
  <text x="56" y="369" font-size="10.5" fill="#b85450" filter="url(#rough2)">复杂度：时间 O(n)（一趟扫描）· 空间 O(1)；排序写法 O(n log n) 同样可过</text>
</svg>
