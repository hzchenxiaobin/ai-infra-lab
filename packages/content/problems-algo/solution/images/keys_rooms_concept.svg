<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">房间 = 节点，钥匙 = 有向边，从 0 出发判可达</text>

  <!-- Edges among reachable {0,1,3} in blue -->
  <!-- 0 -> 1 -->
  <path d="M 130 190 L 260 122" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 0 -> 3 -->
  <path d="M 130 218 L 260 288" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 290 138 L 290 272" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 0 (back edge, slightly curved left) -->
  <path d="M 258 118 Q 180 95 118 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 3 -> 0 (back edge, slightly curved left) -->
  <path d="M 258 296 Q 180 320 118 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 1 self loop (top) -->
  <path d="M 295 92 C 330 70 335 110 300 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2 -> 2 self loop (red, isolated) -->
  <path d="M 478 168 C 520 140 525 195 470 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Reachable nodes: 0,1,3 (blue/green fill) -->
  <!-- Node 0 (start, highlighted) -->
  <circle cx="110" cy="205" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="110" cy="205" r="18" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="110" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">起点</text>

  <!-- Node 1 -->
  <circle cx="280" cy="115" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- Node 3 -->
  <circle cx="280" cy="295" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- Unreachable node: 2 (pink) -->
  <circle cx="460" cy="205" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="460" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="460" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">不可达</text>

  <!-- Dashed boundary around reachable set -->
  <path d="M 70 80 Q 60 200 70 320 Q 200 350 340 320 Q 350 200 340 80 Q 200 55 70 80 Z"
        fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)" opacity="0.7"/>
  <text x="200" y="355" text-anchor="middle" font-size="10" fill="#4a7a3a">从 0 可达的子图（visited = {0,1,3}）</text>

  <!-- Annotation for node 2 -->
  <rect x="395" y="60" width="135" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="462" y="76" text-anchor="middle" font-size="10" fill="#444">2 号钥匙只在 2 号房自己手里</text>
  <text x="462" y="90" text-anchor="middle" font-size="10" fill="#666">无外部边指向 2 → 不可达</text>

  <!-- Legend -->
  <rect x="30" y="335" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="50" y="347" font-size="11" fill="#555">可达(蓝)</text>
  <rect x="120" y="335" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="347" font-size="11" fill="#555">不可达(粉)</text>
  <line x1="220" y1="342" x2="250" y2="342" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="258" y="347" font-size="11" fill="#555">有向边=钥匙</text>
</svg>
