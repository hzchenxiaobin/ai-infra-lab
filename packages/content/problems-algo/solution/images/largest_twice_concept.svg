<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最大值只需「打过」次大值这一个对手</text>

  <!-- index labels -->
  <text x="40" y="78" font-size="11" fill="#888">下标:</text>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="380" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <text x="40" y="104" font-size="12" fill="#888">nums:</text>

  <!-- idx 0: 3 -> second max (blue) -->
  <rect x="172" y="88" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="200" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">次大 second</text>

  <!-- idx 1: 6 -> max (orange) -->
  <rect x="232" y="88" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">最大 max</text>

  <!-- idx 2: 1 -> other (green) -->
  <rect x="292" y="88" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- idx 3: 0 -> other (green) -->
  <rect x="352" y="88" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- arrow from max down to "only need to beat second" -->
  <path d="M 260 156 L 260 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- equation derivation box -->
  <rect x="40" y="180" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="206" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">只需验证：max ≥ 2 × second_max</text>
  <text x="290" y="230" text-anchor="middle" font-size="12" fill="#444">因为 second_max ≥ 其他所有元素</text>
  <text x="290" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⇒ max ≥ 2 × second_max 蕴含 max ≥ 2 × 其他所有</text>

  <!-- numeric check -->
  <rect x="40" y="284" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="306" text-anchor="middle" font-size="12" fill="#444">代入：6 ≥ 2 × 3 = 6 ✓ 命中 → 返回下标 1</text>
  <text x="290" y="322" text-anchor="middle" font-size="10" fill="#888">无需拿 max 逐一比较每个元素，次大值是「最强对手」</text>

  <!-- footer hint -->
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#888">一次遍历同时维护 max1 与 max2，O(n) / O(1)</text>
</svg>
