<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按长度 n 分三种情况拼串</text>

  <!-- start: input nums -->
  <rect x="220" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 nums，n = len(nums)</text>

  <path d="M 290 78 L 290 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: n == 1 ? -->
  <polygon points="290,98 380,138 290,178 200,138" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n == 1 ?</text>
  <text x="290" y="150" text-anchor="middle" font-size="10" fill="#888">单元素</text>

  <!-- Yes branch (right) -->
  <path d="M 380 138 L 420 138" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="420" y="120" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return str(nums[0])</text>
  <text x="490" y="152" text-anchor="middle" font-size="9.5" fill="#888">无 "/"，原样返回</text>

  <!-- No branch (down) -->
  <path d="M 290 178 L 290 198" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="192" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- diamond: n == 2 ? -->
  <polygon points="290,200 380,240 290,280 200,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n == 2 ?</text>
  <text x="290" y="252" text-anchor="middle" font-size="10" fill="#888">两元素</text>

  <!-- Yes branch (right) -->
  <path d="M 380 240 L 420 240" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="420" y="222" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return "a₀/a₁"</text>
  <text x="490" y="254" text-anchor="middle" font-size="9.5" fill="#888">无括号可加，唯一式</text>

  <!-- No branch (down) -->
  <path d="M 290 280 L 290 300" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="294" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- n >= 3 box -->
  <rect x="100" y="302" width="380" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">n ≥ 3：return "a₀/(a₁/a₂/.../aₙ₋₁)"</text>
  <text x="290" y="340" text-anchor="middle" font-size="10" fill="#555">a₀ 后接 "(/"，a₁..aₙ₋₁ 用 "/" 连接，末尾加 ")"</text>

  <path d="M 290 352 L 290 370" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="372" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="393" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">输出最优表达式字符串</text>
</svg>
