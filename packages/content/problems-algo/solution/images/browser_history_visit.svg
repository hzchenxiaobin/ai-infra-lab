<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">visit(url)：右移 cur、写入新页、把 last 拉回 cur（清空前进）</text>

  <!-- BEFORE row -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">visit 前：cur=1（在 google）</text>

  <rect x="40" y="66" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leetcode</text>
  <text x="88" y="98" text-anchor="middle" font-size="9.5" fill="#888">[0]</text>

  <rect x="136" y="66" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">google</text>
  <text x="184" y="98" text-anchor="middle" font-size="9.5" fill="#888">[1]</text>

  <rect x="232" y="66" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">facebook</text>
  <text x="280" y="98" text-anchor="middle" font-size="9.5" fill="#888">[2]</text>

  <rect x="328" y="66" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">youtube</text>
  <text x="376" y="98" text-anchor="middle" font-size="9.5" fill="#888">[3]</text>

  <text x="442" y="90" font-size="11" fill="#888">last=3</text>
  <text x="184" y="120" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">↑ cur</text>

  <!-- operation arrow -->
  <path d="M 280 128 L 280 148" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="130" width="240" height="0" fill="none"/>
  <rect x="120" y="130" width="320" height="20" fill="#fce4ec" stroke="none" opacity="0"/>
  <text x="280" y="144" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">visit("linkedin.com")</text>

  <!-- AFTER row -->
  <text x="40" y="178" font-size="12" fill="#888" font-weight="bold">visit 后：cur=2、last=2（linkedin 覆盖 facebook，youtube 被丢弃）</text>

  <rect x="40" y="186" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leetcode</text>
  <text x="88" y="218" text-anchor="middle" font-size="9.5" fill="#888">[0]</text>

  <rect x="136" y="186" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">google</text>
  <text x="184" y="218" text-anchor="middle" font-size="9.5" fill="#888">[1]</text>

  <rect x="232" y="186" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">linkedin</text>
  <text x="280" y="218" text-anchor="middle" font-size="9.5" fill="#888">[2]</text>

  <rect x="328" y="186" width="96" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="376" y="204" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold">youtube</text>
  <text x="376" y="218" text-anchor="middle" font-size="9.5" fill="#aaa">[3] 失效</text>

  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">↑ cur</text>
  <text x="442" y="210" font-size="11" fill="#b85450" font-weight="bold">last=2</text>

  <!-- three steps -->
  <rect x="40" y="262" width="480" height="142" fill="#f8f8f8" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="284" font-size="12" fill="#333" font-weight="bold">三步操作（均为 O(1)）</text>

  <!-- step 1 -->
  <rect x="60" y="294" width="190" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="314" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① cur += 1</text>
  <text x="155" y="332" text-anchor="middle" font-size="10" fill="#555">游标右移一格</text>

  <!-- arrow -->
  <path d="M 252 318 L 268 318" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="272" y="294" width="100" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="322" y="314" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 写入新页</text>
  <text x="322" y="332" text-anchor="middle" font-size="9.5" fill="#555">history[cur]=url</text>

  <!-- arrow -->
  <path d="M 374 318 L 390 318" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="394" y="294" width="116" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ last = cur</text>
  <text x="452" y="332" text-anchor="middle" font-size="9.5" fill="#555">截断前进历史</text>

  <!-- key insight -->
  <rect x="60" y="352" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键：last = cur 让 cur 之后的老页全部"失效"</text>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#4a7a3a">无需真删除数组元素，forward 时自然不超过 last</text>
</svg>
