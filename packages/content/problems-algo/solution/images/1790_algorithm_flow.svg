<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1790f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="404" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描收集 diff，按 d 分类判定</text>

  <!-- Start: 输入 s1, s2 -->
  <rect x="220" y="38" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入等长字符串 s1, s2</text>

  <!-- arrow down to process -->
  <path d="M 290 72 L 290 86" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>

  <!-- Process: 扫描收集 diff -->
  <rect x="170" y="90" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">扫描 i = 0 .. n−1</text>
  <text x="290" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">收集 s1[i] ≠ s2[i] 的下标到 diff</text>

  <!-- arrow down to diamond1 -->
  <path d="M 290 134 L 290 150" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>

  <!-- Diamond1: len(diff)==0? -->
  <polygon points="290,154 366,196 290,238 214,196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="193" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">len(diff)</text>
  <text x="290" y="209" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">== 0 ?</text>

  <!-- yes arrow right to true box -->
  <path d="M 366 196 L 416 196" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>
  <text x="391" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="420" y="180" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="202" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- no arrow down to diamond2 -->
  <path d="M 290 238 L 290 256" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>
  <text x="305" y="252" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Diamond2: len(diff)==2? -->
  <polygon points="290,260 366,302 290,344 214,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="299" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">len(diff)</text>
  <text x="290" y="315" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">== 2 ?</text>

  <!-- no arrow left to false box -->
  <path d="M 214 302 L 164 302" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>
  <text x="189" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="30" y="286" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="95" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- yes arrow down to diamond3 -->
  <path d="M 290 344 L 290 358" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>

  <!-- Diamond3: cross-equal? placed lower -->
  <polygon points="290,362 388,374 290,386 192,374" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s1[i]==s2[j] 且 s1[j]==s2[i] ?</text>

  <!-- yes arrow right -->
  <path d="M 388 374 L 416 374" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>
  <text x="402" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="420" y="358" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="380" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- no arrow left -->
  <path d="M 192 374 L 164 374" stroke="#555" stroke-width="1.6" marker-end="url(#arr1790f)" filter="url(#rough2)"/>
  <text x="178" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="30" y="358" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="95" y="380" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
</svg>
