<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有效单词缩写：双指针流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">开始: i=0, j=0</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: j < len(abbr) ? -->
  <polygon points="280,94 412,146 280,198 148,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333">j &lt; len(abbr) ?</text>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#888">（abbr 还有字符待处理）</text>

  <!-- No -> final check -->
  <path d="M 412 146 L 470 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="138" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="420" y="170" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="192" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i==n &amp;&amp; j==m</text>
  <path d="M 480 146 L 480 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> down to type check -->
  <path d="M 280 198 L 280 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="214" font-size="11" fill="#82b366">是</text>

  <!-- Diamond: abbr[j] is digit ? -->
  <polygon points="280,222 412,274 280,326 148,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333">abbr[j] 是数字 ?</text>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#888">isdigit(abbr[j])</text>

  <!-- Yes (digit) -> right: parse number -->
  <path d="M 412 274 L 470 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="266" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <!-- leading zero check -->
  <polygon points="500,276 540,300 500,324 460,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="297" text-anchor="middle" font-size="10" fill="#333">abbr[j]</text>
  <text x="500" y="311" text-anchor="middle" font-size="10" fill="#333">=='0'?</text>
  <path d="M 540 300 L 552 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="296" font-size="9" fill="#b85450">是→</text>
  <text x="556" y="308" font-size="9" fill="#b85450" font-weight="bold">false</text>

  <!-- parse num box -->
  <rect x="430" y="332" width="120" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="352" text-anchor="middle" font-size="11" fill="#333">num = 0</text>
  <text x="490" y="370" text-anchor="middle" font-size="10" fill="#446688">while 数字:</text>
  <text x="490" y="384" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">num=num*10+d</text>
  <path d="M 500 324 L 500 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="330" font-size="9" fill="#82b366">否</text>

  <!-- i += num, overflow check -->
  <rect x="430" y="402" width="120" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="422" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i += num</text>
  <text x="490" y="440" text-anchor="middle" font-size="10" fill="#b85450">if i &gt; n: false</text>
  <text x="490" y="454" text-anchor="middle" font-size="10" fill="#888">（越界即不匹配）</text>
  <path d="M 490 390 L 490 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No (letter) -> left: match letter -->
  <path d="M 148 274 L 96 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="266" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <rect x="40" y="332" width="120" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="354" text-anchor="middle" font-size="11" fill="#333">i &gt;= n 或</text>
  <text x="100" y="372" text-anchor="middle" font-size="11" fill="#333">word[i] != abbr[j]</text>
  <text x="100" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ false</text>
  <text x="100" y="406" text-anchor="middle" font-size="10" fill="#888">否则 i++, j++</text>
  <path d="M 100 290 L 100 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge: both branches loop back -->
  <path d="M 100 410 L 100 470 L 490 470 L 490 460" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="486" text-anchor="middle" font-size="10" fill="#888">下一轮（回到 j &lt; m 判定）</text>

  <!-- bottom notes -->
  <rect x="40" y="504" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="524" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两个指针只前进不回退 → O(n + m) 时间、O(1) 空间</text>
  <text x="280" y="540" text-anchor="middle" font-size="10" fill="#666">数字段一次解析完毕，避免与相邻数字合并歧义</text>
</svg>
