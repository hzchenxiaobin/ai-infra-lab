<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：左most 捉人者 ↔ 左most 逃跑者，贪心配对</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">team = [0, 0, 1, 0, 0, 1, 0]，dist = 1：捉人者(1)与逃跑者(0)各取最左候选</text>

  <!-- ===== Team array row ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">team[]</text>
  <g font-size="11">
    <!-- index 0: runner -->
    <rect x="30" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="55" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="55" y="76" text-anchor="middle" font-size="8" fill="#888">[0]</text>
    <text x="55" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a">逃跑</text>

    <!-- index 1: runner -->
    <rect x="84" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="109" y="76" text-anchor="middle" font-size="8" fill="#888">[1]</text>
    <text x="109" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a">逃跑</text>

    <!-- index 2: it (catcher) -->
    <rect x="138" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="163" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <text x="163" y="76" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">[2]</text>
    <text x="163" y="136" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">捉人</text>

    <!-- index 3: runner -->
    <rect x="192" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="217" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="217" y="76" text-anchor="middle" font-size="8" fill="#888">[3]</text>
    <text x="217" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a">逃跑</text>

    <!-- index 4: runner -->
    <rect x="246" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="271" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="271" y="76" text-anchor="middle" font-size="8" fill="#888">[4]</text>
    <text x="271" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a">逃跑</text>

    <!-- index 5: it (catcher) -->
    <rect x="300" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="325" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <text x="325" y="76" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">[5]</text>
    <text x="325" y="136" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">捉人</text>

    <!-- index 6: runner -->
    <rect x="354" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="379" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="379" y="76" text-anchor="middle" font-size="8" fill="#888">[6]</text>
    <text x="379" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a">逃跑</text>
  </g>

  <!-- ===== dist range brackets for it at [2] ===== -->
  <path d="M 113 148 L 113 154 L 213 154 L 213 148" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="163" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dist=1 的捕获范围</text>

  <!-- ===== Two pointers ===== -->
  <rect x="30" y="184" width="374" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="203" font-size="11" fill="#d6a040" font-weight="bold">双指针：i → 最左未配对的「捉人者」，j → 最左未配对的「逃跑者」</text>

  <!-- ===== Three cases ===== -->
  <!-- Case A: catch -->
  <rect x="30" y="226" width="160" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="248" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：可捕获</text>
  <text x="48" y="268" font-size="11" fill="#555">|i − j| ≤ dist</text>
  <text x="48" y="286" font-size="11" fill="#4a7a3a" font-weight="bold">→ 配对！count++</text>
  <text x="48" y="302" font-size="10" fill="#555">i++, j++ 各走一步</text>

  <!-- Case B: skip j -->
  <rect x="200" y="226" width="160" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="248" font-size="12" fill="#b85450" font-weight="bold">情况 B：j 永不可抓</text>
  <text x="218" y="268" font-size="11" fill="#555">|i − j| &gt; dist 且 j &lt; i</text>
  <text x="218" y="286" font-size="11" fill="#b85450" font-weight="bold">→ 跳过 j</text>
  <text x="218" y="302" font-size="10" fill="#555">所有捉人者都在 i 右侧，更远</text>

  <!-- Case C: skip i -->
  <rect x="370" y="226" width="160" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="248" font-size="12" fill="#d6a040" font-weight="bold">情况 C：i 抓不到人</text>
  <text x="388" y="268" font-size="11" fill="#555">|i − j| &gt; dist 且 i &lt; j</text>
  <text x="388" y="286" font-size="11" fill="#d6a040" font-weight="bold">→ 跳过 i</text>
  <text x="388" y="302" font-size="10" fill="#555">所有逃跑者都在 j 右侧，更远</text>

  <!-- arrows between cases -->
  <path d="M 190 272 L 200 272" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 272 L 370 272" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pairing illustration ===== -->
  <rect x="30" y="334" width="500" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="356" font-size="12" fill="#446688" font-weight="bold">配对结果（贪心从左到右）：</text>
  <g font-size="11">
    <!-- pair 1: it[2] catches runner[1] -->
    <rect x="60" y="368" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="90" y="384" text-anchor="middle" fill="#446688" font-weight="bold">it[2]</text>
    <path d="M 120 380 L 150 380" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
    <rect x="154" y="368" width="70" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="189" y="384" text-anchor="middle" fill="#4a7a3a" font-weight="bold">runner[1]</text>
    <text x="234" y="384" font-size="10" fill="#4a7a3a">✓ 第 1 对</text>

    <!-- pair 2: it[5] catches runner[4] -->
    <rect x="60" y="398" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="90" y="414" text-anchor="middle" fill="#446688" font-weight="bold">it[5]</text>
    <path d="M 120 410 L 150 410" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
    <rect x="154" y="398" width="70" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="189" y="414" text-anchor="middle" fill="#4a7a3a" font-weight="bold">runner[4]</text>
    <text x="234" y="414" font-size="10" fill="#4a7a3a">✓ 第 2 对</text>
  </g>
  <text x="320" y="384" font-size="11" fill="#b85450" font-weight="bold">runner[0] 被跳过</text>
  <text x="320" y="402" font-size="10" fill="#b85450">（在 it[2] 左侧且超距）</text>
  <text x="400" y="420" font-size="12" fill="#446688" font-weight="bold">答案 = 2</text>
</svg>
