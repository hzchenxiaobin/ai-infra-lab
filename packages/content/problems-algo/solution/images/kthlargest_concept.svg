<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">第 k 大 ⇔ 升序下标 n − k</text>

  <!-- sorted ascending row -->
  <text x="30" y="74" font-size="12" fill="#888">升序：</text>
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="135" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="190" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="300" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="355" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- index labels -->
  <text x="105" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="160" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="215" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="325" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4 ← target</text>
  <text x="380" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- big labels below -->
  <text x="105" y="126" text-anchor="middle" font-size="10" fill="#888">第6大</text>
  <text x="160" y="126" text-anchor="middle" font-size="10" fill="#888">第5大</text>
  <text x="215" y="126" text-anchor="middle" font-size="10" fill="#888">第4大</text>
  <text x="270" y="126" text-anchor="middle" font-size="10" fill="#888">第3大</text>
  <text x="325" y="126" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第2大 ★</text>
  <text x="380" y="126" text-anchor="middle" font-size="10" fill="#888">第1大</text>

  <!-- arrow from index5(6) up-right to title showing largest -->
  <path d="M 380 140 L 380 150" stroke="#aaa" stroke-width="1" fill="none"/>

  <!-- conversion box -->
  <rect x="70" y="150" width="380" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">n = 6,  k = 2</text>
  <text x="260" y="196" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">target = n − k = 6 − 2 = 4</text>

  <!-- key idea box -->
  <rect x="30" y="232" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">只需让下标 n−k 的位置放对元素</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#555">左右两侧各自内部是否有序无所谓 → 快速选择</text>

  <!-- footer note -->
  <rect x="30" y="300" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#444">快速选择 = 快排的 partition，但每轮只进一侧</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#777">平均 O(n)，而非 O(n log n)</text>
</svg>
