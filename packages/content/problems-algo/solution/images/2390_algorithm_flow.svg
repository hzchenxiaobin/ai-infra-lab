<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遇字母入栈、遇 * 弹栈顶，一遍扫描</text>

  <!-- Start oval -->
  <ellipse cx="300" cy="56" rx="74" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">stack = []（空栈）</text>

  <!-- arrow down -->
  <path d="M 300 78 L 300 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop rect -->
  <rect x="180" y="108" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历 s 中每个字符 c</text>

  <!-- arrow down to diamond -->
  <path d="M 300 146 L 300 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: c == '*' ? -->
  <polygon points="300,180 380,220 300,260 220,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c == '*' ?</text>

  <!-- Yes branch: left -->
  <path d="M 220 220 L 144 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="204" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">stack.pop()</text>
  <text x="92" y="252" text-anchor="middle" font-size="10" fill="#888">删栈顶 = 左侧最近字符</text>

  <!-- No branch: right -->
  <path d="M 380 220 L 456 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="456" y="204" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">stack.push(c)</text>
  <text x="508" y="252" text-anchor="middle" font-size="10" fill="#888">字母入栈</text>

  <!-- merge arrows back to loop (dashed) -->
  <path d="M 92 204 L 92 156 L 180 128" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 508 204 L 508 156 L 420 128" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="172" font-size="10" fill="#888">回到循环</text>

  <!-- exit: from loop right, around to End -->
  <path d="M 420 126 L 580 126 L 580 400 L 410 400" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="572" y="262" text-anchor="middle" font-size="11" fill="#888">遍历完</text>

  <!-- End oval -->
  <ellipse cx="300" cy="400" rx="112" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="405" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return ''.join(stack)</text>

  <!-- bottom note -->
  <rect x="60" y="438" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="455" text-anchor="middle" font-size="11" fill="#666">单遍 O(n) 扫描，O(n) 空间；原地写指针版可 O(1) 额外空间</text>
</svg>
