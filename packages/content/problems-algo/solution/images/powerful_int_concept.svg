<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两列幂各自有界 → 两两求和 → 集合去重</text>

  <!-- ===== Left panel: x^i ===== -->
  <text x="50" y="56" font-size="12.5" fill="#446688" font-weight="bold">x 的幂 xⁱ（以 x=2 为例）</text>

  <!-- bound ceiling line for x -->
  <line x1="44" y1="66" x2="288" y2="66" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="292" y="70" font-size="10.5" fill="#b85450" font-weight="bold">≤ bound</text>

  <!-- x^i boxes: 1, 2, 4, 8, (16 cut off) -->
  <rect x="50" y="78" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="72" y="122" text-anchor="middle" font-size="9.5" fill="#888">2⁰</text>

  <rect x="100" y="78" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="122" y="122" text-anchor="middle" font-size="9.5" fill="#888">2¹</text>

  <rect x="150" y="78" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="172" y="122" text-anchor="middle" font-size="9.5" fill="#888">2²</text>

  <rect x="200" y="78" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="222" y="122" text-anchor="middle" font-size="9.5" fill="#888">2³</text>

  <!-- 16 cut off -->
  <rect x="250" y="78" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <line x1="252" y1="108" x2="292" y2="78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="272" y="98" text-anchor="middle" font-size="12" fill="#b85450">16</text>
  <text x="272" y="122" text-anchor="middle" font-size="9" fill="#b85450">&gt; bound ✗</text>

  <!-- ===== Right panel: y^j ===== -->
  <text x="350" y="56" font-size="12.5" fill="#4a7a3a" font-weight="bold">y 的幂 yʲ（以 y=3 为例）</text>

  <line x1="344" y1="66" x2="528" y2="66" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="532" y="70" font-size="10.5" fill="#b85450" font-weight="bold">≤ bound</text>

  <rect x="350" y="78" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="372" y="122" text-anchor="middle" font-size="9.5" fill="#888">3⁰</text>

  <rect x="400" y="78" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="422" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="422" y="122" text-anchor="middle" font-size="9.5" fill="#888">3¹</text>

  <rect x="450" y="78" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="472" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="472" y="122" text-anchor="middle" font-size="9.5" fill="#888">3²</text>

  <!-- 27 cut off -->
  <rect x="500" y="78" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <line x1="502" y1="108" x2="542" y2="78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="522" y="98" text-anchor="middle" font-size="12" fill="#b85450">27</text>
  <text x="522" y="122" text-anchor="middle" font-size="9" fill="#b85450">&gt; bound ✗</text>

  <!-- ===== Combine arrow ===== -->
  <path d="M 172 138 Q 172 156 200 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 138 Q 422 156 360 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- combine box -->
  <rect x="150" y="150" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两两求和：xⁱ + yʲ ≤ bound ?</text>

  <line x1="280" y1="184" x2="280" y2="202" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set box -->
  <rect x="100" y="206" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">哈希集合去重 → {2, 3, 4, 5, 7, 9, 10}</text>

  <!-- ===== Notes ===== -->
  <line x1="40" y1="266" x2="520" y2="266" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- note 1: x=1 -->
  <rect x="40" y="278" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="52" y="298" font-size="11.5" fill="#333">⚠️ <tspan fill="#b85450" font-weight="bold">x = 1</tspan> → xⁱ 恒为 1，幂列只有 {1}，只取 i=0 一次（否则死循环）</text>

  <!-- note 2: y=1 -->
  <rect x="40" y="316" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="52" y="336" font-size="11.5" fill="#333">⚠️ <tspan fill="#b85450" font-weight="bold">y = 1</tspan> → yʲ 恒为 1，幂列只有 {1}，只取 j=0 一次（否则死循环）</text>

  <!-- note 3: dedup -->
  <rect x="40" y="354" width="470" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="52" y="374" font-size="11.5" fill="#333">💡 不同 (i,j) 可能产生相同和（如 1+4 = 2+3 = 5）→ <tspan fill="#d6a040" font-weight="bold">set 天然去重</tspan></text>
</svg>
