<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：操作只删「相等」的元素 → 按值分组，各组独立</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">nums = [2, 3, 3, 2, 2, 4, 2, 3, 4]</text>

  <!-- input array -->
  <g filter="url(#rough2)">
    <rect x="118" y="66" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <rect x="158" y="66" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="176" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="198" y="66" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="216" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="238" y="66" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <rect x="278" y="66" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="296" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <rect x="318" y="66" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="336" y="88" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">4</text>
    <rect x="358" y="66" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="376" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
    <rect x="398" y="66" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="416" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="438" y="66" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="456" y="88" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">4</text>
  </g>

  <!-- gather arrows: value 2 -->
  <path d="M 136 104 C 136 142, 92 150, 92 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 256 104 C 256 148, 118 152, 118 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 296 104 C 296 150, 142 156, 142 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 376 104 C 376 152, 166 152, 166 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <!-- gather arrows: value 3 -->
  <path d="M 176 104 C 176 146, 258 152, 258 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 216 104 C 216 146, 282 152, 282 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 416 104 C 416 152, 306 154, 306 180" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <!-- gather arrows: value 4 -->
  <path d="M 336 104 C 336 152, 422 156, 422 180" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 456 104 C 456 146, 446 152, 446 180" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- bucket 1: value 2 -->
  <rect x="40" y="186" width="150" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="115" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">值 2：f = 4</text>
  <g filter="url(#rough2)">
    <rect x="86" y="222" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="106" y="222" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="126" y="222" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="146" y="222" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="115" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ops = ⌈4/3⌉ = 2</text>

  <!-- bucket 2: value 3 -->
  <rect x="205" y="186" width="150" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值 3：f = 3</text>
  <g filter="url(#rough2)">
    <rect x="251" y="222" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="271" y="222" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="291" y="222" width="14" height="14" fill="#4a7a3a" rx="2"/>
  </g>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ops = ⌈3/3⌉ = 1</text>

  <!-- bucket 3: value 4 -->
  <rect x="370" y="186" width="150" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="445" y="210" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#rough2)">值 4：f = 2</text>
  <g filter="url(#rough2)">
    <rect x="418" y="222" width="14" height="14" fill="#d6a040" rx="2"/>
    <rect x="438" y="222" width="14" height="14" fill="#d6a040" rx="2"/>
  </g>
  <text x="445" y="266" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">ops = ⌈2/3⌉ = 1</text>

  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">三个组互不相干 —— 每组独立求最少次数，再直接相加</text>

  <!-- formula -->
  <rect x="90" y="330" width="380" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = ops(4) + ops(3) + ops(2) = 2 + 1 + 1 = 4</text>

  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">删除值 x 的操作永远不会碰到值 y —— 值与值零耦合</text>
</svg>
