<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,5,1,1] → 排序后 [1,1,1,2,5]</text>

  <!-- table header -->
  <rect x="40" y="42" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="61" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">本轮 x</text>
  <rect x="110" y="42" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="61" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① f[x+1] ← max(旧, f[x]+1)</text>
  <rect x="290" y="42" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="61" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② f[x] ← max(旧, f[x−1]+1)</text>
  <rect x="430" y="42" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="61" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1 -->
  <rect x="40" y="74" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="74" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">f[2] = 0+1 = 1</text>
  <rect x="290" y="74" width="140" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f[1] = 0+1 = 1</text>
  <rect x="430" y="74" width="50" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="40" y="108" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="108" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="129" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">f[2] = max(1, 2) = 2</text>
  <rect x="290" y="108" width="140" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f[1] 不变</text>
  <rect x="430" y="108" width="50" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <rect x="40" y="142" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="142" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="163" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">f[2] = max(2, 2) 不变</text>
  <rect x="290" y="142" width="140" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不变</text>
  <rect x="430" y="142" width="50" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 4 (highlight) -->
  <rect x="40" y="176" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="197" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="110" y="176" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f[3] = 2+1 = 3 ★</text>
  <rect x="290" y="176" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f[2] = max(2, 2) = 2</text>
  <rect x="430" y="176" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="455" y="197" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 5 -->
  <rect x="40" y="210" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="210" width="180" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">f[6] = 0+1 = 1</text>
  <rect x="290" y="210" width="140" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f[5] = 0+1 = 1</text>
  <rect x="430" y="210" width="50" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- key notes -->
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">关键：前两轮把两个 1 分工成「一个保持、一个升 2」（f[2] = 2，值 {1,2}）</text>
  <text x="260" y="289" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 4 轮元素 2 升成 3，接上 f[2] = 2 得 f[3] = 3 —— 值 {1,2,3} 各占一个元素</text>

  <!-- scheme box -->
  <rect x="40" y="304" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">选出方案（ans = 3）：第 1 个 1 保持 → 1，第 2 个 1 升 1 → 2，元素 2 升 1 → 3</text>
  <text x="260" y="350" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">选出 [1, 2, 3]，排序后连续</text>
  <text x="260" y="371" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 3 个 1 与 5 不用：它们另起的段长度只有 1</text>
</svg>
