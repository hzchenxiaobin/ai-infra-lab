<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,4,5,6]</text>

  <!-- 原树 -->
  <circle cx="310" cy="56" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="60" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="260" cy="108" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="300" y1="68" x2="268" y2="97" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="360" cy="108" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="320" y1="68" x2="352" y2="97" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="235" cy="158" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235" y="162" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="252" y1="119" x2="240" y2="148" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="285" cy="158" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="162" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="268" y1="119" x2="280" y2="148" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="335" cy="158" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="162" text-anchor="middle" font-size="9" fill="#333">6</text>
  <line x1="352" y1="119" x2="340" y2="148" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <line x1="40" y1="186" x2="580" y2="186" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="310" y="182" text-anchor="middle" font-size="11" fill="#888">递归调用过程</text>

  <!-- count(1) -->
  <rect x="220" y="200" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count(1)</text>
  <text x="310" y="234" text-anchor="middle" font-size="10" fill="#555">lh=3, rh=2 → 不等 → 递归</text>

  <path d="M 280 240 L 200 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 240 L 420 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count(2) 完美 -->
  <rect x="120" y="274" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count(2)</text>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="#555">lh=2=rh → 完美</text>
  <text x="200" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 2² − 1 = 3</text>

  <!-- count(3) 不等 -->
  <rect x="360" y="274" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count(3)</text>
  <text x="445" y="308" text-anchor="middle" font-size="10" fill="#555">lh=2, rh=1 → 不等</text>
  <text x="445" y="321" text-anchor="middle" font-size="10" fill="#b85450">→ 递归</text>

  <path d="M 420 318 L 380 348" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 318 L 510 348" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count(6) -->
  <rect x="320" y="352" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="369" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count(6)</text>
  <text x="380" y="383" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">lh=1=rh → 1</text>

  <!-- count(null) -->
  <rect x="470" y="352" width="100" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="520" y="369" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">count(∅)</text>
  <text x="520" y="383" text-anchor="middle" font-size="10" fill="#888">= 0</text>

  <path d="M 445 390 L 445 408" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇总 -->
  <rect x="320" y="412" width="250" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="445" y="429" text-anchor="middle" font-size="11" fill="#333">count(3) = 1 + 1 + 0 = 2</text>

  <path d="M 200 318 L 200 412" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 445 436 L 310 448" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="442" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="458" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count(1) = 1 + 3 + 2 = 6 ✓</text>
</svg>
