<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：相邻攻击的有效贡献 = min(duration, 间隔)</text>

  <!-- ============ Case A: gap >= duration ============ -->
  <rect x="32" y="50" width="220" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="142" y="66" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">A. 间隔 ≥ duration（不重叠）</text>

  <!-- timeline A -->
  <line x1="70" y1="120" x2="450" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="58" y="124" font-size="10" fill="#888">t</text>

  <!-- tick marks A: t=1..6 -> x=120,170,220,270,320,370 -->
  <line x1="120" y1="116" x2="120" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="10" fill="#666">1</text>
  <line x1="170" y1="116" x2="170" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="140" text-anchor="middle" font-size="10" fill="#666">2</text>
  <line x1="220" y1="116" x2="220" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="10" fill="#666">3</text>
  <line x1="270" y1="116" x2="270" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#666">4</text>
  <line x1="320" y1="116" x2="320" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#666">5</text>
  <line x1="370" y1="116" x2="370" y2="126" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="140" text-anchor="middle" font-size="10" fill="#666">6</text>

  <!-- poison bar A1: attack@1 duration 2 -> [120,220] -->
  <rect x="120" y="88" width="100" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="104" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">中毒 [1,3)</text>
  <!-- poison bar A2: attack@4 duration 2 -> [270,370] -->
  <rect x="270" y="88" width="100" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">中毒 [4,6)</text>

  <!-- gap bracket A: 120 -> 270 -->
  <path d="M 120 152 L 120 160 L 270 160 L 270 152" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="174" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">间隔 = 4−1 = 3 ≥ duration</text>
  <text x="195" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 第 1 次贡献满 duration = 2</text>

  <!-- ============ Case B: gap < duration ============ -->
  <rect x="32" y="206" width="240" height="22" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">B. 间隔 &lt; duration（重叠，重置计时）</text>

  <!-- timeline B -->
  <line x1="70" y1="276" x2="370" y2="276" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="58" y="280" font-size="10" fill="#888">t</text>

  <!-- tick marks B: t=1..4 -> x=120,170,220,270 -->
  <line x1="120" y1="272" x2="120" y2="282" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="10" fill="#666">1</text>
  <line x1="170" y1="272" x2="170" y2="282" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="296" text-anchor="middle" font-size="10" fill="#666">2</text>
  <line x1="220" y1="272" x2="220" y2="282" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="296" text-anchor="middle" font-size="10" fill="#666">3</text>
  <line x1="270" y1="272" x2="270" y2="282" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="10" fill="#666">4</text>

  <!-- poison bar B1: attack@1 duration 2 -> [120,220], overlap part [170,220] -->
  <rect x="120" y="244" width="50" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="170" y="244" width="50" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="260" text-anchor="middle" font-size="9" fill="#2a4a66" font-weight="bold">独占</text>
  <text x="195" y="260" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">被覆盖</text>
  <!-- poison bar B2: attack@2 duration 2 -> [170,270] -->
  <rect x="170" y="316" width="100" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="332" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">中毒 [2,4)</text>

  <!-- gap bracket B: 120 -> 170 -->
  <path d="M 120 352 L 120 360 L 170 360 L 170 352" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="374" text-anchor="middle" font-size="10" fill="#a67830" font-weight="bold">间隔=1</text>

  <!-- reset arrow from B2 start back to B1 (timer reset) -->
  <path d="M 170 312 L 170 248" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="184" y="284" font-size="10" fill="#b85450" font-weight="bold">重置</text>

  <text x="300" y="374" font-size="11" fill="#b85450">→ 第 1 次只贡献间隔 = 1（被第 2 次打断）</text>

  <!-- ============ formula box ============ -->
  <rect x="40" y="392" width="520" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="412" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">贡献_i = min(duration, timeSeries[i+1] − timeSeries[i])；末次贡献 = duration</text>
</svg>
