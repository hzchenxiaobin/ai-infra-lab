<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    贪心策略：所有箱子占 1 车位，按单元数降序装车
  </text>

  <!-- Section 1: Box types sorted descending -->
  <text x="48" y="62" font-size="11" fill="#888" filter="url(#rough2)">箱子类型（按单元数降序）</text>

  <!-- Type 0: 3 units, blue (highest) -->
  <rect x="60" y="72" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3单元</text>
  <text x="82" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">×1箱</text>

  <!-- Type 1: 2 units, green -->
  <rect x="120" y="72" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2单元</text>
  <text x="142" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">×2箱</text>

  <!-- Type 2: 1 unit, orange (lowest) -->
  <rect x="180" y="72" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1单元</text>
  <text x="202" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">×3箱</text>

  <!-- sort arrow -->
  <path d="M238,90 L268,90" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">降序</text>

  <!-- Priority label -->
  <text x="305" y="82" font-size="10" fill="#b85450" filter="url(#rough2)">优先装 ↑</text>
  <text x="305" y="96" font-size="10" fill="#888" filter="url(#rough2)">最后装 ↑</text>

  <!-- Section 2: Truck with 4 slots -->
  <text x="48" y="140" font-size="11" fill="#888" filter="url(#rough2)">卡车（truckSize = 4 车位）</text>

  <!-- Truck body -->
  <rect x="56" y="150" width="340" height="56" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>

  <!-- Slot 1: filled with 3-unit box -->
  <rect x="62" y="156" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3单元</text>
  <text x="101" y="190" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">车位1</text>

  <!-- Slot 2: filled with 2-unit box -->
  <rect x="144" y="156" width="78" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2单元</text>
  <text x="183" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">车位2</text>

  <!-- Slot 3: filled with 2-unit box -->
  <rect x="226" y="156" width="78" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2单元</text>
  <text x="265" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">车位3</text>

  <!-- Slot 4: filled with 1-unit box -->
  <rect x="308" y="156" width="78" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1单元</text>
  <text x="347" y="190" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">车位4</text>

  <!-- Fill direction arrow -->
  <path d="M60,130 L390,130" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="225" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">装车方向：从高单元到低单元</text>

  <!-- Total -->
  <rect x="56" y="224" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="245" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">总单元 = 3+2+2+1 = 8</text>

  <!-- Insight box -->
  <rect x="50" y="276" width="420" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    核心洞察：每个箱子无论类型都消耗 1 个车位
  </text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    → 代价相同，收益不同 → 优先选高单元箱子
  </text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    （若箱子体积不同则退化为背包 DP）
  </text>
</svg>
