<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">判定算法流程</text>

  <!-- 开始 -->
  <rect x="220" y="50" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 word1, word2</text>
  <line x1="280" y1="84" x2="280" y2="104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判 长度 -->
  <polygon points="280,104 380,140 280,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">长度相等?</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">len1 == len2</text>
  <!-- 否 -->
  <line x1="380" y1="140" x2="440" y2="140" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="440" y="124" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>
  <!-- 是 -->
  <line x1="280" y1="176" x2="280" y2="196" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="190" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 统计频次 -->
  <rect x="200" y="196" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计频次 freq1[26], freq2[26]</text>
  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">遍历各一次，O(n)</text>
  <line x1="280" y1="236" x2="280" y2="256" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判 字符集合 -->
  <polygon points="280,256 390,292 280,328 170,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">字符集合相同?</text>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">非零位一一对应</text>
  <line x1="390" y1="292" x2="440" y2="292" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="286" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="440" y="276" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>
  <line x1="280" y1="328" x2="280" y2="348" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 排序并比较 -->
  <rect x="190" y="348" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序后比较 sorted(freq1)==sorted(freq2)</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">O(|Σ| log |Σ|), |Σ|=26</text>
  <line x1="280" y1="388" x2="280" y2="404" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="220" y="404" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return 比较结果</text>
</svg>
