<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：s ≤ j(i) ⟺ 平衡，转移取 f[j-1]</text>

  <!-- 数组格子 -->
  <text x="343" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w[j] &gt; w[i]（严格更大）</text>

  <rect x="106" y="48" width="52" height="40" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="48" width="52" height="40" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="48" width="52" height="40" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="298" y="48" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="362" y="48" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="132" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="196" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="324" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="388" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=4</text>

  <!-- 起点可行域：绿色前缀区 + 红色禁区 -->
  <rect x="106" y="116" width="244" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="228" y="133" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#rough2)">s ≤ j：段内有更大者 → 平衡 ✓</text>
  <rect x="362" y="116" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388" y="134" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="420" y="126" font-size="9" fill="#b85450" filter="url(#rough2)">s &gt; j：无更大者</text>
  <text x="420" y="138" font-size="9" fill="#b85450" filter="url(#rough2)">max = 末尾 → 不平衡</text>

  <path d="M 60 156 L 500 156" fill="none" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- DP 转移 -->
  <rect x="86" y="170" width="348" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f[i] = max( f[i-1] , <tspan fill="#b85450" font-weight="bold">f[j(i) - 1]</tspan> + 1 )</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">f[4] = max( f[3] , f[2] + 1 ) = max(1, 2) = 2 ✓</text>

  <rect x="70" y="244" width="380" height="22" fill="#fce4ec" stroke="none" rx="6" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 前一段装运须整体落在 [0..j-1] 内 —— 是 f[j-1]，不是 f[j]！</text>

  <!-- 两条装运 -->
  <path d="M 106 290 L 106 298 L 286 298 L 286 290" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="196" y="314" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">装运 1 = [2,5,1]</text>
  <text x="196" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">落在前缀 [0..2]，贡献 f[2]</text>

  <path d="M 298 290 L 298 298 L 414 298 L 414 290" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="356" y="314" text-anchor="middle" font-size="10.5" fill="#a07818" filter="url(#rough2)">装运 2 = [4,3]</text>
  <text x="356" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">以 i = 4 收尾</text>

  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（对应 weight = [2,5,1,4,3]，答案 f[4] = 2）</text>
</svg>
