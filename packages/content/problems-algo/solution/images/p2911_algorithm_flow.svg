<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：先打代价表，再跑划分 DP</text>

  <rect x="160" y="42" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 s, k（n ≤ 200，k ≤ n/2）</text>

  <path d="M 185 76 L 185 94" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段一 -->
  <rect x="36" y="98" width="298" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="185" y="122" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">阶段一：打 v 表（子串代价）</text>

  <rect x="52" y="134" width="266" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="185" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 枚举子串 [i, j]，m = j − i + 1</text>

  <rect x="52" y="176" width="266" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="185" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 枚举 m 的真因数 d，按 mod d 分 d 组</text>

  <rect x="52" y="218" width="266" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="185" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 组内首尾双指针数不同对，取 min</text>

  <rect x="348" y="140" width="148" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">v 表 ≈ 3.1×10⁶ 次</text>
  <text x="422" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">字符比较（n = 200）</text>

  <path d="M 185 258 L 185 276" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段二 -->
  <rect x="36" y="280" width="298" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="185" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">阶段二：划分 DP</text>

  <rect x="52" y="316" width="266" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="185" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ dp[0][n] = 0；j = 1..k，i = n−2j..0</text>

  <rect x="52" y="358" width="266" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="185" y="380" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ dp[j][i] = min{ v[i][x]+dp[j−1][x+1] }</text>

  <rect x="348" y="320" width="148" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">DP 转移 O(n²k)</text>
  <text x="422" y="360" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">≤ 4×10⁶（n = 200）</text>

  <path d="M 185 400 L 185 418" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="422" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 dp[k][0]</text>
</svg>
