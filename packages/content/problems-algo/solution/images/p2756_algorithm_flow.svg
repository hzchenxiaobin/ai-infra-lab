<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：请求到达 → 入队 → 定时器到期 → 刷新批次</text>

  <!-- Step 1: request arrives via setTimeout -->
  <rect x="200" y="46" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">setTimeout 到期 → query(key) 调用</text>

  <path d="M 320 84 L 320 104" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: push to pending -->
  <rect x="190" y="110" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pendingKeys.push(key) + pendingResolvers.push(resolve)</text>

  <path d="M 320 148 L 320 168" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: timer === null? -->
  <polygon points="320,174 440,214 320,254 200,214" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">timer === null?</text>
  <text x="320" y="228" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（批次窗口是否已关闭）</text>

  <!-- Yes branch -->
  <text x="160" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 200 214 L 120 214" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="30" y="198" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="73" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开新窗口</text>

  <path d="M 73 232 L 73 270" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="14" y="276" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="73" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">timer = setTimeout</text>
  <text x="73" y="310" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(flush, batchTime)</text>

  <!-- No branch -->
  <text x="480" y="216" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 440 214 L 520 214" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="524" y="198" width="96" height="34" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="572" y="220" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">仅入队，等待</text>

  <!-- merge -->
  <path d="M 73 314 Q 73 350 200 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 572 232 Q 572 350 440 350" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- timer fires (flush) -->
  <rect x="190" y="336" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">定时器到期 → flush()</text>

  <path d="M 320 374 L 320 394" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- flush actions -->
  <rect x="150" y="400" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="420" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">清空 timer + 取出 keys/resolvers</text>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">batchFn(keys).then → 逐位 resolve(values[i])</text>
</svg>
