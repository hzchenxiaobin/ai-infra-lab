<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心模型：双向哈希 + 回收堆</text>

  <!-- next_id counter -->
  <rect x="36" y="48" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">next_id 计数器</text>
  <text x="96" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">当前最大已分配号</text>

  <!-- recycled min-heap -->
  <rect x="36" y="104" width="120" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">recycled 小顶堆</text>
  <text x="96" y="136" text-anchor="middle" font-size="10" fill="#888">已离开用户的 ID</text>
  <rect x="60" y="146" width="72" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="96" y="161" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[1, 2, ...]</text>
  <text x="96" y="186" text-anchor="middle" font-size="9.5" fill="#888">堆顶 = 最小可用号</text>

  <!-- join assigns smallest id -->
  <path d="M 96 196 L 96 214" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="210" font-size="10" fill="#d6a040" font-weight="bold">join：取最小可用 ID</text>

  <!-- user_chunks map -->
  <rect x="200" y="48" width="180" height="148" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">user_chunks（用户→块集）</text>
  <line x1="214" y1="78" x2="366" y2="78" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="222" y="96" font-size="11" fill="#333" font-weight="bold">userID=1</text>
  <text x="312" y="96" font-size="11" fill="#446688">→ {1, 2, 3}</text>
  <text x="222" y="118" font-size="11" fill="#333" font-weight="bold">userID=2</text>
  <text x="312" y="118" font-size="11" fill="#446688">→ {2, 3}</text>
  <text x="222" y="140" font-size="11" fill="#333" font-weight="bold">userID=3</text>
  <text x="312" y="140" font-size="11" fill="#446688">→ {4}</text>
  <text x="222" y="170" font-size="10" fill="#888">查询某用户持有哪些块</text>
  <text x="222" y="186" font-size="10" fill="#888">leave 时遍历它清反向表</text>

  <!-- chunk_users map -->
  <rect x="400" y="48" width="160" height="148" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">chunk_users（块→用户集）</text>
  <line x1="412" y1="78" x2="548" y2="78" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="412" y="96" font-size="11" fill="#333" font-weight="bold">chunk=1</text>
  <text x="490" y="96" font-size="11" fill="#b85450">→ {1}</text>
  <text x="412" y="118" font-size="11" fill="#333" font-weight="bold">chunk=2</text>
  <text x="490" y="118" font-size="11" fill="#b85450">→ {1, 2}</text>
  <text x="412" y="140" font-size="11" fill="#333" font-weight="bold">chunk=3</text>
  <text x="490" y="140" font-size="11" fill="#b85450">→ {1, 2}</text>
  <text x="412" y="162" font-size="11" fill="#333" font-weight="bold">chunk=4</text>
  <text x="490" y="162" font-size="11" fill="#b85450">→ {3}</text>
  <text x="412" y="186" font-size="10" fill="#888">request 按 chunkID 查</text>

  <!-- bidirectional link between the two maps -->
  <path d="M 380 96 C 400 96, 400 96, 400 96" stroke="#888" stroke-width="1.6" fill="none"/>
  <path d="M 380 110 L 400 110" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 400 130 L 380 130" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="390" y="160" text-anchor="middle" font-size="9" fill="#888">双向同步</text>

  <!-- operations legend at bottom -->
  <rect x="36" y="228" width="524" height="152" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="12" fill="#555" font-weight="bold">三个操作的落点</text>

  <!-- join -->
  <rect x="56" y="262" width="150" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="131" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">join(chunks)</text>
  <text x="64" y="298" font-size="10" fill="#555">① 取最小可用 ID</text>
  <text x="64" y="314" font-size="10" fill="#555">② 写 user_chunks[id]</text>
  <text x="64" y="330" font-size="10" fill="#555">③ 每块加 chunk_users</text>
  <text x="64" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">O(k log U)</text>

  <!-- leave -->
  <rect x="222" y="262" width="150" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="297" y="280" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">leave(userID)</text>
  <text x="230" y="298" font-size="10" fill="#555">① 遍历用户各块</text>
  <text x="230" y="314" font-size="10" fill="#555">② 从 chunk_users 移除</text>
  <text x="230" y="330" font-size="10" fill="#555">③ ID 压入 recycled 堆</text>
  <text x="230" y="350" font-size="10" fill="#d6a040" font-weight="bold">O(k log U)</text>

  <!-- request -->
  <rect x="388" y="262" width="150" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="463" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">request(uid, cid)</text>
  <text x="396" y="298" font-size="10" fill="#555">① chunk_users[cid] 取主</text>
  <text x="396" y="314" font-size="10" fill="#555">② 排序返回</text>
  <text x="396" y="330" font-size="10" fill="#555">③ 非空且未有→双写</text>
  <text x="396" y="350" font-size="10" fill="#b85450" font-weight="bold">O(u log u)</text>
</svg>
