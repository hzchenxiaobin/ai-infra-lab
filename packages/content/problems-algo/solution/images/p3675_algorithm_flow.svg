<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="385" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描取最大循环距离</text>

  <!-- 开始 -->
  <rect x="205" y="42" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 260 70 L 260 88" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="190" y="92" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="13" fill="#b3541e" filter="url(#rough2)">ans ← 0，i ← 0</text>

  <path d="M 260 124 L 260 146" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：i < n ? -->
  <polygon points="260,150 330,190 260,230 190,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是 → 处理框 -->
  <text x="336" y="180" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 330 190 L 358 190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="145" width="148" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="436" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c = s[i]</text>
  <text x="436" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = (26−(c−'a'))%26</text>
  <text x="436" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = max(ans, d)</text>
  <text x="436" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回环：处理框 → 菱形左侧 -->
  <path d="M 436 235 L 436 258 L 66 258 L 66 190" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 66 190 L 184 190" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 否 → 输出 -->
  <text x="268" y="248" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 230 L 260 264" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="268" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 302 L 260 320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="205" y="324" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 左下旁注：距离速查 -->
  <rect x="30" y="286" width="140" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="308" text-anchor="middle" font-size="12" fill="#b3541e" font-weight="bold" filter="url(#rough2)">距离速查 need(c)</text>
  <text x="100" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'a'→0，'z'→1</text>
  <text x="100" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'y'→2，'b'→25</text>
  <text x="100" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'a'−c (mod 26)</text>

  <!-- 右下旁注：复杂度 -->
  <rect x="352" y="292" width="152" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(n)</text>
  <text x="428" y="340" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">空间 O(1)</text>
</svg>
