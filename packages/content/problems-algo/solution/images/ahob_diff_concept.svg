<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：只在 start/end 事件点处状态变化，段内恒定</text>

  <!-- Building 1: [1,4) h=2  (blue) -->
  <rect x="112" y="150" width="156" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">建筑1 [1,4) h=2</text>

  <!-- Building 2: [3,9) h=4  (green) -->
  <rect x="216" y="112" width="312" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">建筑2 [3,9) h=4</text>

  <!-- Number line -->
  <line x1="50" y1="230" x2="590" y2="230" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 590 230 L 580 226 L 580 234 z" fill="#666" filter="url(#rough2)"/>
  <text x="595" y="234" font-size="11" fill="#888">x</text>

  <!-- Tick marks and event points -->
  <!-- pos 1 -->
  <line x1="112" y1="224" x2="112" y2="236" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- pos 3 -->
  <line x1="216" y1="224" x2="216" y2="236" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <!-- pos 4 -->
  <line x1="268" y1="224" x2="268" y2="236" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="268" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <!-- pos 9 -->
  <line x1="528" y1="224" x2="528" y2="236" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="528" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>

  <!-- Event point labels above buildings -->
  <text x="112" y="100" text-anchor="middle" font-size="9" fill="#b85450">事件点</text>
  <text x="216" y="100" text-anchor="middle" font-size="9" fill="#b85450">事件点</text>
  <text x="268" y="100" text-anchor="middle" font-size="9" fill="#b85450">事件点</text>
  <text x="528" y="100" text-anchor="middle" font-size="9" fill="#b85450">事件点</text>

  <!-- Dashed verticals from buildings down to line at event points -->
  <line x1="112" y1="178" x2="112" y2="224" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="216" y1="140" x2="216" y2="224" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="268" y1="178" x2="268" y2="224" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="528" y1="140" x2="528" y2="224" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Result segments below the line -->
  <text x="40" y="285" font-size="11" fill="#888">输出段：</text>

  <!-- segment [1,3) avg=2 -->
  <rect x="112" y="272" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="290" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,3) avg=2</text>

  <!-- segment [3,4) avg=3 -->
  <rect x="216" y="272" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="290" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[3,4) avg=3</text>

  <!-- segment [4,9) avg=4 -->
  <rect x="268" y="272" width="260" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="290" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[4,9) avg=4</text>

  <!-- Diff annotation -->
  <text x="40" y="328" font-size="11" fill="#888">差分增量：</text>
  <rect x="112" y="316" width="104" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="331" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">cnt+1, d+2</text>
  <rect x="216" y="316" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="331" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">cnt+1,d+4</text>
  <rect x="268" y="316" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="331" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">cnt−1,d−2</text>
  <rect x="468" y="316" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="498" y="331" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">cnt−1,d−4</text>

  <!-- Key insight box -->
  <rect x="50" y="356" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="378" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相邻事件点之间活跃建筑集合恒定 → avg 恒定</text>
  <text x="310" y="396" text-anchor="middle" font-size="10" fill="#666">用差分记录每个事件点的净增量，扫描时维护前缀和 m 与 s 即得每段 avg</text>
</svg>
