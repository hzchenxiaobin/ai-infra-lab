<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <pattern id="wallHatchW" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5a5a5a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3a3a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：两条最短路径距离均为 6，"lul" 字典序更小</text>

  <!-- 5x5 maze grid: cell 40x40, origin (40,50) -->
  <g filter="url(#rough2)" font-size="11">
    <!-- row 0 -->
    <rect x="40" y="50" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="80" y="50" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="120" y="50" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="160" y="50" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="200" y="50" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <!-- row 1 -->
    <rect x="40" y="90" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <rect x="80" y="90" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <rect x="120" y="90" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="160" y="90" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="200" y="90" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <!-- row 2 -->
    <rect x="40" y="130" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="80" y="130" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="120" y="130" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="160" y="130" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="200" y="130" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <!-- row 3 -->
    <rect x="40" y="170" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="80" y="170" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <rect x="120" y="170" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="160" y="170" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="200" y="170" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <!-- row 4 -->
    <rect x="40" y="210" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="80" y="210" width="40" height="40" fill="url(#wallHatchW)" stroke="#3a3a3a" stroke-width="1.3" rx="3"/>
    <rect x="120" y="210" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
    <rect x="160" y="210" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="200" y="210" width="40" height="40" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3"/>
  </g>

  <!-- hole at (0,1) center (100, 70) -->
  <g filter="url(#rough2)">
    <circle cx="100" cy="70" r="8" fill="#2a2a2a" stroke="#000" stroke-width="1.4"/>
    <text x="100" y="74" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">洞</text>
  </g>
  <!-- ball at (4,3) center (180, 230) -->
  <g filter="url(#rough2)">
    <circle cx="180" cy="230" r="9" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <text x="180" y="234" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">球</text>
  </g>

  <!-- Path "lul" (green, solid): (4,3)->(4,2)->(0,2)->(0,1) -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2.2" fill="none">
    <path d="M 168 230 L 160 230" marker-end="url(#arrG3)"/>
    <path d="M 140 220 L 140 80" marker-end="url(#arrG3)"/>
    <path d="M 128 70 L 112 70" marker-end="url(#arrG3)" stroke-width="2.6"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#4a7a3a" font-weight="bold">
    <text x="155" y="222">l</text>
    <text x="146" y="150">u</text>
    <text x="118" y="62">l</text>
  </g>

  <!-- Path "ul" (blue, dashed): (4,3)->(0,3)->(0,1) -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3">
    <path d="M 180 220 L 180 80" marker-end="url(#arrB3)"/>
    <path d="M 160 74 L 112 74" marker-end="url(#arrB3)"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#446688" font-weight="bold">
    <text x="186" y="150">u</text>
    <text x="130" y="68">l</text>
  </g>

  <!-- step table: "lul" (left-bottom) -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="280" y="50" width="280" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" opacity="0.35"/>
    <text x="420" y="70" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="12">路径 "lul"（距离 6）✓ 胜出</text>
    <!-- table header -->
    <text x="295" y="90" fill="#4a7a3a" font-weight="bold">步</text>
    <text x="320" y="90" fill="#4a7a3a" font-weight="bold">方向</text>
    <text x="360" y="90" fill="#4a7a3a" font-weight="bold">滚动路径</text>
    <text x="510" y="90" fill="#4a7a3a" font-weight="bold">累计距离</text>
    <line x1="290" y1="96" x2="550" y2="96" stroke="#4a7a3a" stroke-width="1"/>
    <!-- step 1 -->
    <text x="295" y="112" fill="#555">1</text>
    <text x="320" y="112" fill="#4a7a3a" font-weight="bold">l</text>
    <text x="360" y="112" fill="#555">(4,3)→(4,2) 撞墙停</text>
    <text x="510" y="112" fill="#555">1</text>
    <line x1="290" y1="118" x2="550" y2="118" stroke="#ccc" stroke-width="0.8"/>
    <!-- step 2 -->
    <text x="295" y="134" fill="#555">2</text>
    <text x="320" y="134" fill="#4a7a3a" font-weight="bold">u</text>
    <text x="360" y="134" fill="#555">(4,2)→(3,2)→…→(0,2)</text>
    <text x="510" y="134" fill="#555">5</text>
    <line x1="290" y1="140" x2="550" y2="140" stroke="#ccc" stroke-width="0.8"/>
    <!-- step 3 -->
    <text x="295" y="156" fill="#555">3</text>
    <text x="320" y="156" fill="#4a7a3a" font-weight="bold">l</text>
    <text x="360" y="156" fill="#b85450" font-weight="bold">(0,2)→(0,1)=洞 掉入</text>
    <text x="510" y="156" fill="#555">6</text>
    <line x1="290" y1="162" x2="550" y2="162" stroke="#ccc" stroke-width="0.8"/>
    <!-- summary -->
    <text x="420" y="182" text-anchor="middle" fill="#4a7a3a" font-size="9">path="lul", dist=6</text>
  </g>

  <!-- step table: "ul" (right-bottom) -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="280" y="200" width="280" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" opacity="0.35"/>
    <text x="420" y="220" text-anchor="middle" fill="#446688" font-weight="bold" font-size="12">路径 "ul"（距离 6）✗ 字典序更大</text>
    <text x="295" y="240" fill="#446688" font-weight="bold">步</text>
    <text x="320" y="240" fill="#446688" font-weight="bold">方向</text>
    <text x="360" y="240" fill="#446688" font-weight="bold">滚动路径</text>
    <text x="510" y="240" fill="#446688" font-weight="bold">累计距离</text>
    <line x1="290" y1="246" x2="550" y2="246" stroke="#446688" stroke-width="1"/>
    <text x="295" y="262" fill="#555">1</text>
    <text x="320" y="262" fill="#446688" font-weight="bold">u</text>
    <text x="360" y="262" fill="#555">(4,3)→(3,3)→…→(0,3)</text>
    <text x="510" y="262" fill="#555">4</text>
    <line x1="290" y1="268" x2="550" y2="268" stroke="#ccc" stroke-width="0.8"/>
    <text x="295" y="284" fill="#555">2</text>
    <text x="320" y="284" fill="#446688" font-weight="bold">l</text>
    <text x="360" y="284" fill="#b85450" font-weight="bold">(0,3)→(0,2)→(0,1)=洞</text>
    <text x="510" y="284" fill="#555">6</text>
    <line x1="290" y1="290" x2="550" y2="290" stroke="#ccc" stroke-width="0.8"/>
    <text x="420" y="310" text-anchor="middle" fill="#446688" font-size="9">path="ul", dist=6</text>
  </g>

  <!-- comparison box -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="340" width="520" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="300" y="362" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="12">字典序比较：dist 相同 → 比路径字符串</text>
    <text x="300" y="380" text-anchor="middle" fill="#555" font-size="10">"lul" vs "ul"：首字符 'l'(108) &lt; 'u'(117) → "lul" 胜出</text>
    <text x="300" y="394" text-anchor="middle" fill="#888" font-size="9">PQ 按 (距离, 路径) 排序，dist=6 时 "lul" 先于 "ul" 弹出，到达洞即返回</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="9">
    <line x1="50" y1="420" x2="72" y2="420" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="78" y="424" fill="#555">lul 路径 (d=6, 胜出)</text>
    <line x1="220" y1="420" x2="242" y2="420" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="248" y="424" fill="#555">ul 路径 (d=6, 字典序更大)</text>
    <rect x="400" y="414" width="12" height="10" fill="url(#wallHatchW)" stroke="#3a3a3a" rx="2"/>
    <text x="416" y="424" fill="#555">墙</text>
  </g>
</svg>
