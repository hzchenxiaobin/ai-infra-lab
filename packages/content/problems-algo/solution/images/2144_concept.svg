<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDn" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序降序后每 3 个一组，第 3 个（最便宜）免费</text>

  <text x="50" y="68" font-size="12" fill="#888">原数组</text>
  <rect x="90" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="73" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="148" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="73" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="206" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="73" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="274" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="73" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="332" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="73" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="390" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="73" text-anchor="middle" font-size="13" fill="#333">2</text>

  <path d="M 260 94 L 260 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <text x="272" y="112" font-size="11" fill="#888">排序降序</text>

  <rect x="84" y="128" width="176" height="52" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="172" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 1 组</text>
  <rect x="90" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="148" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="206" y="150" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="171" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="231" y="196" text-anchor="middle" font-size="10" fill="#b85450">免费</text>

  <rect x="268" y="128" width="176" height="52" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="356" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第 2 组</text>
  <rect x="274" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="332" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="390" y="150" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="171" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="415" y="196" text-anchor="middle" font-size="10" fill="#b85450">免费</text>

  <rect x="60" y="216" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="12" fill="#444">每组最小值免费 → 免费糖果 = 6 + 2 = 8</text>

  <text x="60" y="276" font-size="12" fill="#888">付费糖果</text>
  <rect x="120" y="260" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="172" y="281" font-size="14" fill="#4a7a3a">+</text>
  <rect x="186" y="260" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="242" y="281" font-size="14" fill="#4a7a3a">+</text>
  <rect x="252" y="260" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="308" y="281" font-size="14" fill="#4a7a3a">+</text>
  <rect x="318" y="260" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="378" y="281" font-size="14" fill="#d6a040" font-weight="bold">= 23</text>

  <rect x="120" y="312" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总花费 = 9 + 7 + 5 + 2 = 23</text>

  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#888">绿色=付费 · 红色=免费（每组第 3 个）</text>
</svg>
