<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：断点决定一切 —— 第一处断裂就是最长顺序前缀的终点</text>

  <!-- 顺序前缀虚线框 -->
  <rect x="15" y="66" width="162" height="64" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="96" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">顺序前缀</text>

  <!-- 数组格子 nums = [3,4,5,1,12,14,13] -->
  <rect x="22" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="108" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="84" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="108" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="146" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="108" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="208" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="108" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="270" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="108" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="332" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="108" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="394" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="419" y="108" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">13</text>

  <!-- 下标 -->
  <text x="47" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="109" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="171" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="233" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="295" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="357" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="419" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <!-- 相邻关系标记 -->
  <text x="78" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 ✓</text>
  <text x="140" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 ✓</text>
  <text x="202" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 断！</text>
  <text x="264" y="78" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>
  <text x="326" y="78" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>
  <text x="388" y="78" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">✗</text>

  <!-- 断点标注 -->
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">断点：nums[3]=1 ≠ nums[2]+1=6，前缀到此为止，后面再长都不顺序</text>

  <!-- 中间结论行 -->
  <rect x="22" y="174" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="137" y="199" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最长顺序前缀 = [3, 4, 5]</text>
  <line x1="258" y1="194" x2="290" y2="194" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="298" y="174" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="398" y="199" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 3+4+5 = 12</text>

  <!-- 底部说明 -->
  <rect x="14" y="234" width="492" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">• 顺序前缀：对 1 ≤ j ≤ i 均有 nums[j] = nums[j−1] + 1（单独 [nums[0]] 恒为顺序前缀）</text>
  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">• 断点决定论：顺序性要求逐位成立，一处断裂 ⇒ 其后所有前缀统统不顺序</text>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">  所以从左扫到第一断点即得最长，无需枚举每个前缀逐一验证（省掉 O(n²)）</text>
  <text x="260" y="323" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">sum 求出后，缺失搜索从 x = sum 起步（问的是 ≥ sum 的缺失整数，不是 ≥ 1）</text>
</svg>
