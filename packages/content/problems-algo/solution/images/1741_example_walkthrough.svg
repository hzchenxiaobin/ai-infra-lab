<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 → 4 组 → 4 行结果</text>

  <!-- ===== Left: Input table ===== -->
  <text x="40" y="56" font-size="10" fill="#888">输入：Employees</text>
  <g filter="url(#rough2)"><rect x="30" y="62" width="230" height="178" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="145" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Employees</text>
  <line x1="30" y1="86" x2="260" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="100" font-size="9" fill="#888" font-weight="bold">emp</text>
  <text x="96" y="100" font-size="9" fill="#888" font-weight="bold">event_day</text>
  <text x="180" y="100" font-size="9" fill="#888" font-weight="bold">in</text>
  <text x="218" y="100" font-size="9" fill="#888" font-weight="bold">out</text>
  <line x1="86" y1="88" x2="86" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="168" y1="88" x2="168" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="206" y1="88" x2="206" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="34" y="106" width="222" height="22" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="48" y="121" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="92" y="121" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="178" y="121" font-size="10" fill="#4a8edb">4</text>
  <text x="216" y="121" font-size="10" fill="#4a8edb">32</text>

  <g filter="url(#rough2)"><rect x="34" y="130" width="222" height="22" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="48" y="145" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="92" y="145" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="178" y="145" font-size="10" fill="#4a8edb">55</text>
  <text x="216" y="145" font-size="10" fill="#4a8edb">200</text>

  <g filter="url(#rough2)"><rect x="34" y="154" width="222" height="22" fill="#fff8e1" stroke="none" rx="2"/></g>
  <text x="48" y="169" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="92" y="169" font-size="9" fill="#d6a040">2020-12-03</text>
  <text x="178" y="169" font-size="10" fill="#d6a040">1</text>
  <text x="216" y="169" font-size="10" fill="#d6a040">42</text>

  <g filter="url(#rough2)"><rect x="34" y="178" width="222" height="22" fill="#e6f4ea" stroke="none" rx="2"/></g>
  <text x="48" y="193" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="92" y="193" font-size="9" fill="#4a7a3a">2020-11-28</text>
  <text x="178" y="193" font-size="10" fill="#4a7a3a">3</text>
  <text x="216" y="193" font-size="10" fill="#4a7a3a">33</text>

  <g filter="url(#rough2)"><rect x="34" y="202" width="222" height="22" fill="#fce4ec" stroke="none" rx="2"/></g>
  <text x="48" y="217" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="92" y="217" font-size="9" fill="#b85450">2020-12-09</text>
  <text x="178" y="217" font-size="10" fill="#b85450">47</text>
  <text x="216" y="217" font-size="10" fill="#b85450">74</text>

  <text x="145" y="234" text-anchor="middle" font-size="9" fill="#999">共 5 行（颜色 = 分组）</text>

  <!-- Arrow: input -> grouping -->
  <path d="M 266 151 L 302 151" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: Grouping + SUM ===== -->
  <text x="312" y="56" font-size="10" fill="#888">GROUP BY + SUM(out_time - in_time)</text>

  <!-- group (11-28, 1) -->
  <g filter="url(#rough2)"><rect x="308" y="72" width="200" height="46" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.5" rx="6"/></g>
  <text x="320" y="90" font-size="10" fill="#4a8edb" font-weight="bold">11-28, emp 1</text>
  <text x="320" y="106" font-size="9" fill="#4a8edb">(32-4) + (200-55) = 28+145 = </text>
  <text x="492" y="106" font-size="11" fill="#4a8edb" font-weight="bold">173</text>

  <!-- group (11-28, 2) -->
  <g filter="url(#rough2)"><rect x="308" y="124" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="320" y="142" font-size="10" fill="#4a7a3a" font-weight="bold">11-28, emp 2</text>
  <text x="320" y="158" font-size="9" fill="#4a7a3a">(33-3) = </text>
  <text x="492" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>

  <!-- group (12-03, 1) -->
  <g filter="url(#rough2)"><rect x="308" y="176" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/></g>
  <text x="320" y="194" font-size="10" fill="#d6a040" font-weight="bold">12-03, emp 1</text>
  <text x="320" y="210" font-size="9" fill="#d6a040">(42-1) = </text>
  <text x="492" y="210" font-size="11" fill="#d6a040" font-weight="bold">41</text>

  <!-- group (12-09, 2) -->
  <g filter="url(#rough2)"><rect x="308" y="228" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/></g>
  <text x="320" y="246" font-size="10" fill="#b85450" font-weight="bold">12-09, emp 2</text>
  <text x="320" y="262" font-size="9" fill="#b85450">(74-47) = </text>
  <text x="492" y="262" font-size="11" fill="#b85450" font-weight="bold">27</text>

  <!-- Arrow: grouping -> result -->
  <path d="M 514 173 L 550 173" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: Result ===== -->
  <text x="560" y="56" font-size="10" fill="#888">输出（顺序无要求）</text>
  <g filter="url(#rough2)"><rect x="554" y="62" width="186" height="178" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="647" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <line x1="554" y1="86" x2="740" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="566" y="100" font-size="9" fill="#888" font-weight="bold">day</text>
  <text x="640" y="100" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="700" y="100" font-size="9" fill="#888" font-weight="bold">total_time</text>
  <line x1="628" y1="88" x2="628" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="688" y1="88" x2="688" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="558" y="106" width="178" height="24" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="566" y="122" font-size="9" fill="#4a8edb">2020-11-28</text>
  <text x="646" y="122" font-size="11" fill="#4a8edb" font-weight="bold">1</text>
  <text x="714" y="122" font-size="11" fill="#4a8edb" font-weight="bold">173</text>

  <g filter="url(#rough2)"><rect x="558" y="132" width="178" height="24" fill="#e6f4ea" stroke="none" rx="2"/></g>
  <text x="566" y="148" font-size="9" fill="#4a7a3a">2020-11-28</text>
  <text x="646" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="714" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>

  <g filter="url(#rough2)"><rect x="558" y="158" width="178" height="24" fill="#fff8e1" stroke="none" rx="2"/></g>
  <text x="566" y="174" font-size="9" fill="#d6a040">2020-12-03</text>
  <text x="646" y="174" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="714" y="174" font-size="11" fill="#d6a040" font-weight="bold">41</text>

  <g filter="url(#rough2)"><rect x="558" y="184" width="178" height="24" fill="#fce4ec" stroke="none" rx="2"/></g>
  <text x="566" y="200" font-size="9" fill="#b85450">2020-12-09</text>
  <text x="646" y="200" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="714" y="200" font-size="11" fill="#b85450" font-weight="bold">27</text>

  <text x="647" y="226" text-anchor="middle" font-size="9" fill="#888">event_day AS day</text>

  <!-- ===== Bottom: explanation ===== -->
  <g filter="url(#rough2)"><rect x="40" y="270" width="680" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="294" font-size="12" fill="#a06a10" font-weight="bold">逐步追踪：</text>

  <text x="60" y="318" font-size="11" fill="#4a8edb">• (11-28, emp 1)：2 条事件 → (32-4)+(200-55) = 28+145 = 173 → 输出 (2020-11-28, 1, 173)</text>
  <text x="60" y="340" font-size="11" fill="#4a7a3a">• (11-28, emp 2)：1 条事件 → (33-3) = 30 → 输出 (2020-11-28, 2, 30)</text>
  <text x="60" y="362" font-size="11" fill="#d6a040">• (12-03, emp 1)：1 条事件 → (42-1) = 41 → 输出 (2020-12-03, 1, 41)</text>
  <text x="60" y="384" font-size="11" fill="#b85450">• (12-09, emp 2)：1 条事件 → (74-47) = 27 → 输出 (2020-12-09, 2, 27)</text>

  <text x="60" y="408" font-size="11" fill="#a06a10" font-weight="bold">⭐ 关键：同人同天的多条事件被二维分组折叠；单行组 SUM 退化为该行差值本身，无需特判。</text>
</svg>
