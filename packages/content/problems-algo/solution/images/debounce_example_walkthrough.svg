<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：t = 150（call1 正常触发，call2 被 call3 取消）</text>

  <!-- baseline -->
  <line x1="40" y1="190" x2="600" y2="190" stroke="#bbb" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- tick marks -->
  <line x1="60" y1="184" x2="60" y2="196" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="115" y1="184" x2="115" y2="196" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="280" y1="184" x2="280" y2="196" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="390" y1="184" x2="390" y2="196" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="555" y1="184" x2="555" y2="196" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- tick labels above baseline -->
  <text x="60" y="178" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="115" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">t=50</text>
  <text x="280" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t=200</text>
  <text x="390" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">t=300</text>
  <text x="555" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t=450</text>

  <!-- call1 box [1,2] @ x=115 -->
  <rect x="80" y="110" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call1 [1,2]</text>
  <path d="M 115 136 L 115 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call2 box [3,4] @ x=390 (upper) -->
  <rect x="355" y="100" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call2 [3,4]</text>
  <path d="M 390 126 L 390 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call3 box [5,6] @ x=390 (lower, stacked) -->
  <rect x="355" y="136" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call3 [5,6]</text>
  <path d="M 390 162 L 390 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- band1 (call1, fires) 115 -> 280 -->
  <rect x="115" y="198" width="165" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="213" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">call1 定时器 → 到期</text>

  <!-- fire1 marker + box @ 280 -->
  <line x1="280" y1="220" x2="280" y2="252" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="252" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="281" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ fn(1,2)</text>

  <!-- band2 (call2, cancelled) 390 -> 555, red dashed -->
  <rect x="390" y="198" width="165" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="472" y="213" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">call2 定时器（被 call3 取消）</text>

  <!-- band3 (call3, fires) 390 -> 555 -->
  <rect x="390" y="226" width="165" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="241" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">call3 定时器 → 到期</text>

  <!-- fire3 marker + box @ 555 -->
  <line x1="555" y1="248" x2="555" y2="252" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="500" y="252" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="556" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ fn(5,6) @450</text>

  <!-- cancel arrow: call3 -> band2 (shows call3 cancels call2) -->
  <path d="M 390 162 C 360 175, 350 195, 392 198" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="338" y="186" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">clearTimeout</text>

  <!-- footer note -->
  <rect x="40" y="300" width="560" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">call1 期间无新调用 → 正常到期触发 fn(1,2)；</text>
  <text x="320" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">call2 与 call3 同刻到来，call2 的定时器被 call3 的 clearTimeout 作废，call3 到期触发 fn(5,6)</text>
</svg>
