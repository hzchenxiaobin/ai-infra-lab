  <text x="220" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="235" y="110" width="80" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-03</text>
  <rect x="315" y="110" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="405" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">20 &lt; 25 ✗</text>
  <rect x="470" y="110" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过</text>

  <rect x="20" y="152" width="30" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="35" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="50" y="152" width="80" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-03</text>
  <rect x="130" y="152" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>
