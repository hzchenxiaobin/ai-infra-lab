<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：逐对比较，累积结果 id</text>

  <text x="90" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">昨天 w2</text>
  <text x="275" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">今天 w1</text>
  <text x="405" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">比较</text>
  <text x="495" y="54" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="20" y="68" width="30" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="35" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="50" y="68" width="80" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-01</text>
  <rect x="130" y="68" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <path d="M 175 83 L 200 83" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="205" y="68" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="220" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="235" y="68" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="275" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-02</text>
  <rect x="315" y="68" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="335" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25</text>
  <text x="405" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25 &gt; 10 ✓</text>
  <rect x="470" y="68" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">id=2</text>

