  <rect x="50" y="110" width="80" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-02</text>
  <rect x="130" y="110" width="40" height="30" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">25</text>
  <path d="M 175 125 L 200 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
