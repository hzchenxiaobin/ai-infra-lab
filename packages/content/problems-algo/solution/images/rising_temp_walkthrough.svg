  <rect x="205" y="152" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="235" y="152" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="275" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">01-04</text>
  <rect x="315" y="152" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="335" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30</text>
  <text x="405" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30 &gt; 20 ✓</text>
  <rect x="470" y="152" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">id=4</text>

  <line x1="20" y1="208" x2="540" y2="208" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">累积结果</text>
  <rect x="240" y="254" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="276" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="300" y="254" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="276" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">仅 DATEDIFF=1 且温度更高者入选；中间无记录的日期不参与比较</text>
</svg>
