<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5, limit = 2</text>

  <!-- step 1: x1 range -->
  <rect x="30" y="38" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#333">x₁ 范围 = [max(0, 5−2×2), min(5, 2)] = [1, 2]，只需枚举两个值</text>

  <!-- table header -->
  <rect x="30" y="86" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="86" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="86" width="178" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="320" y="86" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="372" y="86" width="118" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="53" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x₁</text>
  <text x="109" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">m=5−x₁</text>
  <text x="231" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x₂ 区间 [lo, hi]</text>
  <text x="346" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">个数</text>
  <text x="431" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方案</text>

  <!-- row 1 -->
  <rect x="30" y="114" width="46" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="114" width="66" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="114" width="178" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="320" y="114" width="52" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="372" y="114" width="118" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="109" y="138" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="231" y="131" text-anchor="middle" font-size="10" fill="#555">lo = max(0, 4−2) = 2</text>
  <text x="231" y="146" text-anchor="middle" font-size="10" fill="#555">hi = min(2, 4) = 2 → [2, 2]</text>
  <text x="346" y="138" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="431" y="138" text-anchor="middle" font-size="11" fill="#333">(1, 2, 2)</text>

  <!-- row 2 -->
  <rect x="30" y="152" width="46" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="76" y="152" width="66" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="152" width="178" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="320" y="152" width="52" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="372" y="152" width="118" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="109" y="176" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="231" y="169" text-anchor="middle" font-size="10" fill="#555">lo = max(0, 3−2) = 1</text>
  <text x="231" y="184" text-anchor="middle" font-size="10" fill="#555">hi = min(2, 3) = 2 → [1, 2]</text>
  <text x="346" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="431" y="176" text-anchor="middle" font-size="10" fill="#333">(2, 1, 2)</text>
  <text x="431" y="186" text-anchor="middle" font-size="10" fill="#333">(2, 2, 1)</text>

  <!-- sum row -->
  <rect x="30" y="190" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 1 + 2 = 3 ✓</text>

  <!-- result box -->
  <rect x="30" y="242" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#333">全部方案：(1,2,2)、(2,1,2)、(2,2,1) —— 与示例 1 一致 ✓</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#d6a040">每人封顶 2，分掉 5 颗 → 必然两人拿满 2、一人拿 1，共 3 种排列</text>

  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888">对照示例 2（n=3, limit=3）：cnt(3)+cnt(2)+cnt(1)+cnt(0) = 4+3+2+1 = 10 ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#888">limit ≥ n 时上限形同虚设，一切 a+b+c=n 的非负解都合法</text>
</svg>
