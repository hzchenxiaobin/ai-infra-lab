<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：LAG/LEAD 拉相邻座位 free 到当前行，OR 判定连续</text>

  <!-- Cinema table header -->
  <text x="100" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Cinema（按 seat_id 排序）</text>
  <rect x="20" y="60" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="76" font-size="9" fill="#333">seat_id</text>
  <text x="92" y="76" font-size="9" fill="#333">free</text>
  <text x="138" y="76" font-size="9" fill="#888">prev</text>
  <text x="178" y="76" font-size="9" fill="#888">next</text>
  <text x="218" y="76" font-size="9" fill="#888">valid?</text>
  <line x1="64" y1="60" x2="64" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="60" x2="116" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="60" x2="158" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="60" x2="198" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: seat_id=1, free=1, prev=NULL, next=0, invalid -->
  <rect x="20" y="84" width="220" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="100" font-size="10" fill="#333">1</text>
  <text x="92" y="100" font-size="10" fill="#4a7a3a">1</text>
  <text x="138" y="100" font-size="9" fill="#aaa">NULL</text>
  <text x="178" y="100" font-size="9" fill="#aaa">0</text>
  <text x="218" y="100" font-size="10" fill="#b85450">✗</text>
  <line x1="64" y1="84" x2="64" y2="108" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="84" x2="116" y2="108" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="84" x2="158" y2="108" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="84" x2="198" y2="108" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 2: seat_id=2, free=0, prev=1, next=1, invalid -->
  <rect x="20" y="108" width="220" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="124" font-size="10" fill="#999">2</text>
  <text x="92" y="124" font-size="10" fill="#999">0</text>
  <text x="138" y="124" font-size="9" fill="#aaa">1</text>
  <text x="178" y="124" font-size="9" fill="#aaa">1</text>
  <text x="218" y="124" font-size="10" fill="#b85450">✗</text>
  <line x1="64" y1="108" x2="64" y2="132" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="108" x2="116" y2="132" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="108" x2="158" y2="132" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="108" x2="198" y2="132" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 3: seat_id=3, free=1, prev=0, next=1, HIT -->
  <rect x="20" y="132" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="148" font-size="10" fill="#333">3</text>
  <text x="92" y="148" font-size="10" fill="#4a7a3a">1</text>
  <text x="138" y="148" font-size="9" fill="#aaa">0</text>
  <text x="178" y="148" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="218" y="148" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <line x1="64" y1="132" x2="64" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="132" x2="116" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="132" x2="158" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="132" x2="198" y2="156" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 4: seat_id=4, free=1, prev=1, next=1, HIT -->
  <rect x="20" y="156" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="172" font-size="10" fill="#333">4</text>
  <text x="92" y="172" font-size="10" fill="#4a7a3a">1</text>
  <text x="138" y="172" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="178" y="172" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="218" y="172" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <line x1="64" y1="156" x2="64" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="156" x2="116" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="156" x2="158" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="156" x2="198" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 5: seat_id=5, free=1, prev=1, next=NULL, HIT -->
  <rect x="20" y="180" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="196" font-size="10" fill="#333">5</text>
  <text x="92" y="196" font-size="10" fill="#4a7a3a">1</text>
  <text x="138" y="196" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="178" y="196" font-size="9" fill="#aaa">NULL</text>
  <text x="218" y="196" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <line x1="64" y1="180" x2="64" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="116" y1="180" x2="116" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="180" x2="158" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="198" y1="180" x2="198" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- LAG/LEAD arrows for row 4 (prev from row 3, next from row 5) -->
  <path d="M116 168 C150 168, 150 144, 116 144" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="158" font-size="8" fill="#b85450">LAG↑</text>
  <path d="M116 172 C150 172, 150 192, 116 192" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="186" font-size="8" fill="#b85450">LEAD↓</text>

  <!-- Arrow to result -->
  <path d="M130 224 L130 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="242" font-size="9" fill="#4a7a3a">命中 3 行</text>

  <!-- Right side: analysis steps -->
  <rect x="270" y="60" width="270" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逐行判定（free=1 且 prev=1 或 next=1?）</text>

  <text x="285" y="100" font-size="9" fill="#333">sid=1: 1 且 (NULL 或 0) → ✗ 后继被占</text>
  <text x="285" y="118" font-size="9" fill="#333">sid=2: 0 且 (...) → ✗ 自身被占（短路）</text>
  <text x="285" y="136" font-size="9" fill="#b85450" font-weight="bold">sid=3: 1 且 (0 或 1) → ✓ next=1 命中</text>
  <text x="285" y="154" font-size="9" fill="#b85450" font-weight="bold">sid=4: 1 且 (1 或 1) → ✓ 前后皆空余</text>
  <text x="285" y="172" font-size="9" fill="#b85450" font-weight="bold">sid=5: 1 且 (1 或 NULL) → ✓ prev=1 命中</text>
  <text x="285" y="192" font-size="9" fill="#888">→ sid=3,4,5 命中</text>
  <text x="285" y="212" font-size="9" fill="#4a7a3a">NULL=1 为 UNKNOWN，OR 自动过滤边界</text>

  <!-- Result -->
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">按 seat_id 升序输出</text>
  <rect x="180" y="278" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#333">seat_id</text>
  <rect x="180" y="302" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="213" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="246" y="302" width="2" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="313" y="302" width="2" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="347" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <!-- Bottom note -->
  <rect x="30" y="338" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#d6a040">⚠ 无需 DISTINCT：每行最多判定一次，不存在重复行（对比自连接解法 A 中间座位被双向匹配需去重）</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a">💡 NULL 由三值逻辑天然过滤边界：首行 prev=NULL、尾行 next=NULL，无需 COALESCE 判空</text>
</svg>
