<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">墙与门：示例演算（4×4 网格）</text>
  <path d="M 250 40 Q 450 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g font-size="10.5" fill="#444">
    <rect x="60" y="58" width="14" height="14" fill="#e6f4ea" stroke="#4a8e4a" filter="url(#sk)"/><text x="80" y="69">0 门</text>
    <rect x="130" y="58" width="14" height="14" fill="#e8f0fe" stroke="#446688" filter="url(#sk)"/><text x="150" y="69">-1 墙</text>
    <rect x="200" y="58" width="14" height="14" fill="#fce4ec" stroke="#b85450" filter="url(#sk)"/><text x="220" y="69">INF 空房</text>
    <rect x="290" y="58" width="14" height="14" fill="#fef6e6" stroke="#c98a2b" filter="url(#sk)"/><text x="310" y="69">已填距离</text>
    <rect x="380" y="58" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/><text x="400" y="69">本轮新填</text>
  </g>

  <!-- ===== Grid 1: initial ===== -->
  <text x="120" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">初始</text>
  <g font-size="12" filter="url(#sk)">
    <!-- row0: INF -1 0 INF -->
    <rect x="56" y="112" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="72" y="133" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="88" y="112" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="104" y="133" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="120" y="112" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="136" y="133" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="152" y="112" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="168" y="133" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <!-- row1: INF INF INF -1 -->
    <rect x="56" y="144" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="72" y="165" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="88" y="144" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="104" y="165" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="120" y="144" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="136" y="165" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="152" y="144" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="168" y="165" text-anchor="middle" fill="#2e4e7e">-1</text>
    <!-- row2: INF -1 INF -1 -->
    <rect x="56" y="176" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="72" y="197" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="88" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="104" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="120" y="176" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="136" y="197" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="152" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="168" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <!-- row3: 0 -1 INF INF -->
    <rect x="56" y="208" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="72" y="229" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="88" y="208" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="104" y="229" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="120" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="136" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="152" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="168" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
  </g>
  <text x="120" y="262" text-anchor="middle" font-size="9.5" fill="#888">2 个门入队：(0,2),(3,0)</text>

  <path d="M 195 176 L 235 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- ===== Grid 2: d=1 ===== -->
  <text x="300" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">d = 1</text>
  <g font-size="12" filter="url(#sk)">
    <!-- row0 -->
    <rect x="236" y="112" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="252" y="133" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="268" y="112" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="284" y="133" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="300" y="112" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="316" y="133" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="332" y="112" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="348" y="133" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <!-- row1 -->
    <rect x="236" y="144" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="252" y="165" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="268" y="144" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="284" y="165" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="300" y="144" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="316" y="165" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <rect x="332" y="144" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="348" y="165" text-anchor="middle" fill="#2e4e7e">-1</text>
    <!-- row2 -->
    <rect x="236" y="176" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="252" y="197" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <rect x="268" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="284" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="300" y="176" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="316" y="197" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="332" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="348" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <!-- row3 -->
    <rect x="236" y="208" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="252" y="229" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="268" y="208" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="284" y="229" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="300" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="316" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="332" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="348" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="9.5" fill="#c98a2b">门感染 3 邻居 → 填 1</text>

  <path d="M 375 176 L 415 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- ===== Grid 3: d=2 ===== -->
  <text x="480" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">d = 2</text>
  <g font-size="12" filter="url(#sk)">
    <rect x="416" y="112" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="432" y="133" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="448" y="112" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="464" y="133" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="480" y="112" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="496" y="133" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="512" y="112" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="528" y="133" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="416" y="144" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="432" y="165" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="448" y="144" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="464" y="165" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="480" y="144" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="496" y="165" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="512" y="144" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="528" y="165" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="416" y="176" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="432" y="197" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="448" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="464" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="480" y="176" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="496" y="197" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="512" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="528" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="416" y="208" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="432" y="229" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="448" y="208" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="464" y="229" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="480" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="496" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
    <rect x="512" y="208" width="32" height="32" fill="#fce4ec" stroke="#b85450"/><text x="528" y="229" text-anchor="middle" fill="#b03a3a" font-weight="bold">∞</text>
  </g>
  <text x="480" y="262" text-anchor="middle" font-size="9.5" fill="#c98a2b">填 (1,0),(1,1),(2,2) = 2</text>

  <path d="M 555 176 L 595 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- ===== Grid 4: final ===== -->
  <text x="660" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">最终结果</text>
  <g font-size="12" filter="url(#sk)">
    <rect x="596" y="112" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="612" y="133" text-anchor="middle" fill="#7a5415">3</text>
    <rect x="628" y="112" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="644" y="133" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="660" y="112" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="676" y="133" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="692" y="112" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="708" y="133" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="596" y="144" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="612" y="165" text-anchor="middle" fill="#7a5415">2</text>
    <rect x="628" y="144" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="644" y="165" text-anchor="middle" fill="#7a5415">2</text>
    <rect x="660" y="144" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="676" y="165" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="692" y="144" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="708" y="165" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="596" y="176" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="612" y="197" text-anchor="middle" fill="#7a5415">1</text>
    <rect x="628" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="644" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="660" y="176" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="676" y="197" text-anchor="middle" fill="#7a5415">2</text>
    <rect x="692" y="176" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="708" y="197" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="596" y="208" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/><text x="612" y="229" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="628" y="208" width="32" height="32" fill="#e8f0fe" stroke="#446688"/><text x="644" y="229" text-anchor="middle" fill="#2e4e7e">-1</text>
    <rect x="660" y="208" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="676" y="229" text-anchor="middle" fill="#7a5415">3</text>
    <rect x="692" y="208" width="32" height="32" fill="#fef6e6" stroke="#c98a2b"/><text x="708" y="229" text-anchor="middle" fill="#7a5415">4</text>
  </g>
  <text x="660" y="262" text-anchor="middle" font-size="9.5" fill="#2e6e2e">d=3 填 (0,0),(3,2)；d=4 填 (3,3)</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="780" height="110" rx="8" fill="#eef7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="450" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">关键不变式：格子一旦被填入距离 d，就一定是到最近门的距离</text>
  <g font-size="11" fill="#444">
    <text x="84" y="350">· BFS 按层扩展：d=1 的格子必紧邻某门，d=2 的格子必紧邻某 d=1 格子，…… 距离严格递增</text>
    <text x="84" y="372">· 先到先填：若一个空房被多个门的涟漪同时触及，最先把它「从 INF 变实」的那次入队即最近门</text>
    <text x="84" y="394" fill="#b03a3a" font-weight="bold">· 判定「未填」只需检查 grid[ni][nj] == INF</text>
    <text x="500" y="394" fill="#888">（已被填的不再是 INF，天然不会重复入队，无需额外 visited）</text>
  </g>
</svg>
