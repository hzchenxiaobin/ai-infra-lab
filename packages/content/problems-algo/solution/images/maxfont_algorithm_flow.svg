<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分查找最大可行字号</text>

  <!-- Start -->
  <rect x="210" y="42" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">left = 0, right = n - 1</text>

  <line x1="280" y1="72" x2="280" y2="88" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While condition -->
  <polygon points="280,90 370,120 280,150 190,120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#333">left &lt; right ?</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333">（还有区间）</text>

  <!-- No branch: exit -->
  <line x1="370" y1="120" x2="430" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="114" text-anchor="middle" font-size="10" fill="#888">否</text>

  <rect x="430" y="104" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="120" text-anchor="middle" font-size="10" fill="#333">check(fonts[left]) ?</text>
  <text x="485" y="132" text-anchor="middle" font-size="10" fill="#333">return fonts[left] : -1</text>

  <!-- Yes branch: compute mid -->
  <line x1="280" y1="150" x2="280" y2="168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="164" font-size="10" fill="#888">是</text>

  <rect x="180" y="170" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#333">mid = (left + right + 1) / 2</text>

  <line x1="280" y1="200" x2="280" y2="216" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check decision -->
  <polygon points="280,218 380,252 280,286 180,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#333">check(fonts[mid]) ?</text>
  <text x="280" y="264" text-anchor="middle" font-size="9" fill="#888">高≤h 且 宽≤w</text>

  <!-- Yes: left = mid -->
  <line x1="180" y1="252" x2="120" y2="252" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 放得下</text>

  <rect x="20" y="236" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="252" text-anchor="middle" font-size="11" fill="#333">left = mid</text>
  <text x="70" y="264" text-anchor="middle" font-size="9" fill="#888">右移左边界</text>

  <!-- No: right = mid - 1 -->
  <line x1="380" y1="252" x2="440" y2="252" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 放不下</text>

  <rect x="440" y="236" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="252" text-anchor="middle" font-size="11" fill="#333">right = mid - 1</text>
  <text x="495" y="264" text-anchor="middle" font-size="9" fill="#888">左移右边界</text>

  <!-- Loop back arrows -->
  <path d="M 70 236 L 70 120 L 190 120" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 495 236 L 495 120 L 370 120" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check() detail box -->
  <rect x="30" y="310" width="500" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="330" font-size="12" fill="#d6a040" font-weight="bold">check(fontSize) 判定函数：</text>
  <text x="48" y="350" font-size="11" fill="#555">1. 若 getHeight(fontSize) &gt; h → 直接 false（高度不够，一次调用即可排除）</text>
  <text x="48" y="370" font-size="11" fill="#555">2. 逐字符累加 width += getWidth(fontSize, text[i])，超过 w 立即 false（提前终止）</text>
  <text x="48" y="390" font-size="11" fill="#555">3. 全部累加后 width ≤ w → true</text>
  <text x="48" y="410" font-size="11" fill="#446688" font-weight="bold">💡 mid 向上取整 (left+right+1)/2：找右边界时防死循环（见 2.3 节说明）</text>
</svg>
