<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [2, 4, 5, 10]，答案 = 7</text>

  <!-- dp table header -->
  <text x="70" y="58" text-anchor="middle" font-size="10" fill="#aaa">值 x</text>
  <text x="180" y="58" text-anchor="middle" font-size="10" fill="#aaa">因子对(a,b)</text>
  <text x="340" y="58" text-anchor="middle" font-size="10" fill="#aaa">贡献</text>
  <text x="460" y="58" text-anchor="middle" font-size="10" fill="#aaa">dp[x]</text>

  <!-- row x=2 -->
  <rect x="40" y="68" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="90" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="130" y="68" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="11" fill="#888">无（质因数&gt;1）</text>
  <rect x="290" y="68" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="90" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="68" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- row x=4 -->
  <rect x="40" y="106" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="130" y="106" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#333">(2, 2)</text>
  <rect x="290" y="106" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#333">1×1 = 1</text>
  <rect x="420" y="106" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- row x=5 -->
  <rect x="40" y="144" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="130" y="144" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="166" text-anchor="middle" font-size="11" fill="#888">无</text>
  <rect x="290" y="144" width="100" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="166" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="420" y="144" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- row x=10 -->
  <rect x="40" y="182" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="204" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="130" y="182" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#333">(2, 5)</text>
  <text x="180" y="214" text-anchor="middle" font-size="11" fill="#333">(5, 2)</text>
  <rect x="290" y="182" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#333">1×1 = 1</text>
  <text x="340" y="214" text-anchor="middle" font-size="11" fill="#333">1×1 = 1</text>
  <rect x="420" y="182" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- legend -->
  <rect x="40" y="232" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="242" font-size="9" fill="#666">无因子（叶）dp=1</text>
  <rect x="180" y="232" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="200" y="242" font-size="9" fill="#666">a=b 一对</text>
  <rect x="280" y="232" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="300" y="242" font-size="9" fill="#666">a≠b 两对（左右各一）</text>

  <!-- trees illustration -->
  <rect x="30" y="262" width="480" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">7 棵合法二叉树（每个值作根的所有形态）</text>

  <!-- tree [2] -->
  <rect x="50" y="300" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="316" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="65" y="340" text-anchor="middle" font-size="9" fill="#888">[2]</text>

  <!-- tree [4] -->
  <rect x="108" y="300" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="316" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="123" y="340" text-anchor="middle" font-size="9" fill="#888">[4]</text>

  <!-- tree [4,2,2] -->
  <rect x="158" y="300" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="316" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="140" y="338" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="151" y="352" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="184" y="338" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="352" text-anchor="middle" font-size="9" fill="#333">2</text>
  <path d="M 168 324 L 152 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 178 324 L 194 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="173" y="372" text-anchor="middle" font-size="9" fill="#888">[4,2,2]</text>

  <!-- tree [5] -->
  <rect x="232" y="300" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="316" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="247" y="340" text-anchor="middle" font-size="9" fill="#888">[5]</text>

  <!-- tree [10] -->
  <rect x="290" y="300" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="316" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="305" y="340" text-anchor="middle" font-size="9" fill="#888">[10]</text>

  <!-- tree [10,2,5] -->
  <rect x="350" y="300" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="316" text-anchor="middle" font-size="10" fill="#333">10</text>
  <rect x="332" y="338" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="343" y="352" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="376" y="338" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="387" y="352" text-anchor="middle" font-size="9" fill="#333">5</text>
  <path d="M 360 324 L 344 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 370 324 L 386 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="365" y="372" text-anchor="middle" font-size="9" fill="#888">[10,2,5]</text>

  <!-- tree [10,5,2] -->
  <rect x="430" y="300" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="10" fill="#333">10</text>
  <rect x="412" y="338" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="423" y="352" text-anchor="middle" font-size="9" fill="#333">5</text>
  <rect x="456" y="338" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="467" y="352" text-anchor="middle" font-size="9" fill="#333">2</text>
  <path d="M 440 324 L 424 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 450 324 L 466 338" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="445" y="372" text-anchor="middle" font-size="9" fill="#888">[10,5,2]</text>
</svg>
