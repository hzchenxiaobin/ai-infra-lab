<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">O(1) 判定流程：答案只看 n = len(nums)</text>

  <!-- 起点 -->
  <rect x="185" y="44" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n = len(nums)</text>

  <path d="M 260 78 L 260 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,102 345,138 260,174 175,138" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">n &lt; 3 ?</text>

  <!-- 是：返回 n -->
  <path d="M 345 138 L 383 138" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="362" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="386" y="120" width="108" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">return n</text>

  <text x="440" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">n = 1 → {1}</text>
  <text x="440" y="188" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">n = 2 → {1, 2}</text>
  <text x="440" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">互异三元组凑不齐</text>

  <!-- 否：计算 b -->
  <path d="M 260 174 L 260 194" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="185" y="197" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">b = ⌊log₂ n⌋</text>

  <text x="345" y="218" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">n 的二进制最高位位置</text>

  <path d="M 260 231 L 260 251" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 2^(b+1) -->
  <rect x="185" y="254" width="150" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">return 2^(b+1)</text>

  <text x="345" y="277" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">= 大于 n 的最小 2 的幂</text>

  <!-- 左侧样例 -->
  <text x="100" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">样例：</text>
  <text x="100" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 3 → 4</text>
  <text x="100" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 5 → 8</text>
  <text x="100" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 8 → 16</text>

  <!-- O(1) 徽章 -->
  <rect x="225" y="308" width="70" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">O(1)</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不必读数组内容：排列条件已把值集合钉死为 [1, n]</text>
</svg>
