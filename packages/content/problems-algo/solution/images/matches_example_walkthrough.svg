<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    示例演算：n = 7
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">
    逐轮记录队伍数 / 配对次数 / 晋级数，并验证总数 = n − 1
  </text>

  <!-- Table frame -->
  <rect x="40" y="58" width="480" height="220" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="58" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="100" y="78">轮次</text>
    <text x="190" y="78">队伍数 n</text>
    <text x="270" y="78">奇/偶</text>
    <text x="370" y="78">配对次数</text>
    <text x="470" y="78">晋级数</text>
  </g>
  <!-- column separators -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="140" y1="58" x2="140" y2="278"/>
    <line x1="230" y1="58" x2="230" y2="278"/>
    <line x1="310" y1="58" x2="310" y2="278"/>
    <line x1="420" y1="58" x2="420" y2="278"/>
  </g>

  <!-- Rows -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- Round 1: 7 odd -> 3 matches, 4 advance -->
    <text x="100" y="112">第 1 轮</text>
    <text x="190" y="112" font-weight="bold">7</text>
    <text x="270" y="112" fill="#b85450" font-weight="bold">奇</text>
    <text x="370" y="112">3</text>
    <text x="470" y="112">4</text>

    <!-- Round 2: 4 even -> 2 matches, 2 advance -->
    <text x="100" y="146">第 2 轮</text>
    <text x="190" y="146" font-weight="bold">4</text>
    <text x="270" y="146" fill="#4a7a3a" font-weight="bold">偶</text>
    <text x="370" y="146">2</text>
    <text x="470" y="146">2</text>

    <!-- Round 3: 2 even -> 1 match, 1 winner -->
    <text x="100" y="180">第 3 轮</text>
    <text x="190" y="180" font-weight="bold">2</text>
    <text x="270" y="180" fill="#4a7a3a" font-weight="bold">偶</text>
    <text x="370" y="180">1</text>
    <text x="470" y="180" fill="#b85450" font-weight="bold">1 ← 冠军</text>
  </g>

  <!-- row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="122" x2="520" y2="122"/>
    <line x1="40" y1="156" x2="520" y2="156"/>
    <line x1="40" y1="190" x2="520" y2="190"/>
  </g>

  <!-- Total row -->
  <rect x="40" y="216" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="12" text-anchor="middle">
    <text x="100" y="238" fill="#5a4a1a" font-weight="bold">合计</text>
    <text x="370" y="238" fill="#b85450" font-weight="bold">3 + 2 + 1 = 6</text>
    <text x="470" y="238" fill="#b85450" font-weight="bold">= n − 1 ✓</text>
  </g>

  <!-- Elimination tally -->
  <rect x="40" y="258" width="480" height="20" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    每轮淘汰数 = 配对次数：3 + 2 + 1 = 6 支被淘汰，恰好 7 − 1
  </text>

  <!-- Bottom note -->
  <rect x="40" y="294" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">观察</text>
  <text x="56" y="330" font-size="11" fill="#555" filter="url(#rough2)">• 奇数轮：1 支轮空 + (n−1)/2 场配对，淘汰 (n−1)/2 支，晋级 (n−1)/2 + 1 支</text>
  <text x="56" y="344" font-size="11" fill="#555" filter="url(#rough2)">• 偶数轮：n/2 场配对，淘汰 n/2 支，晋级 n/2 支；无论奇偶，每场必淘汰 1 支</text>
</svg>
