<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：答案 = nums 中缺失的最小 2 的幂</text>

  <!-- ===== Left: bit-union idea ===== -->
  <text x="40" y="58" font-size="12" fill="#888">x 的二进制 = 选中子序列的「位并集」</text>

  <!-- nums = [2,1] bits boxes -->
  <text x="40" y="86" font-size="11" fill="#888">nums = [2, 1]</text>

  <!-- element 2 = 10 -->
  <text x="40" y="112" font-size="11" fill="#444">2 =</text>
  <rect x="74" y="100" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="91" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="110" y="100" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="152" y="116" font-size="10" fill="#888">bit1 bit0</text>

  <!-- element 1 = 01 -->
  <text x="40" y="146" font-size="11" fill="#444">1 =</text>
  <rect x="74" y="134" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="91" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <rect x="110" y="134" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="127" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <!-- OR result -->
  <path d="M 144 145 Q 168 145 168 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 144 111 Q 168 111 168 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">2|1 = 3</text>
  <rect x="74" y="168" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="91" y="184" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="110" y="168" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="127" y="184" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <!-- explain -->
  <text x="40" y="214" font-size="10.5" fill="#444">OR 只能把位「点亮」，不能「熄灭」。</text>
  <text x="40" y="230" font-size="10.5" fill="#444">要凑出只有 bit k 的 2^k，所选</text>
  <text x="40" y="246" font-size="10.5" fill="#444">元素的位必须 ⊆ {k} ⟹ 必须出现</text>
  <text x="40" y="262" font-size="10.5" fill="#b85450" font-weight="bold">纯净的 2^k 本身。</text>

  <!-- ===== Right: power-of-2 ladder ===== -->
  <rect x="300" y="60" width="260" height="290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">逐个 2^k 查是否在 nums</text>

  <!-- row 2^0 = 1, in set -->
  <text x="312" y="112" font-size="11" fill="#444">2^0 = 1</text>
  <rect x="372" y="100" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">在 nums ✓</text>
  <text x="466" y="115" font-size="11" fill="#888">1 可表达</text>

  <!-- row 2^1 = 2, in set -->
  <text x="312" y="138" font-size="11" fill="#444">2^1 = 2</text>
  <rect x="372" y="126" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="141" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">在 nums ✓</text>
  <text x="466" y="141" font-size="11" fill="#888">2 可表达</text>

  <!-- row 2^2 = 4, NOT in set -> answer -->
  <text x="312" y="164" font-size="11" fill="#b85450" font-weight="bold">2^2 = 4</text>
  <rect x="372" y="152" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不在 nums ✗</text>
  <text x="466" y="167" font-size="11" fill="#b85450" font-weight="bold">答案!</text>

  <!-- consequence -->
  <rect x="312" y="184" width="236" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="202" font-size="10.5" fill="#446688" font-weight="bold">推论：</text>
  <text x="320" y="218" font-size="10" fill="#444">若 2^0..2^m 都在 nums，</text>
  <text x="320" y="233" font-size="10" fill="#444">则 1..2^(m+1)-1 全部可表达</text>
  <text x="320" y="248" font-size="10" fill="#444">（OR 出所需位即可）。</text>

  <!-- arrow down to answer -->
  <path d="M 412 172 L 412 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom result -->
  <rect x="312" y="266" width="236" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 缺失的最小 2^k</text>
  <text x="320" y="312" font-size="10" fill="#444">2^(m+1) 不可表达：要凑 {m+1}</text>
  <text x="320" y="327" font-size="10" fill="#444">所选元素位必 ⊆{m+1}，但 2^(m+1)</text>
  <text x="320" y="337" font-size="10" fill="#444">∉ nums ⟹ 无法表达。</text>
</svg>
