<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    算法流程：双向 LIS + 枚举峰顶
  </text>

  <!-- Step 1: 正序算 lis -->
  <rect x="170" y="56" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">① 正序算 lis[i]</text>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">以 nums[i] 结尾的最长递增子序列</text>

  <path d="M280,114 L280,138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 倒序算 lds -->
  <rect x="170" y="142" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">② 倒序算 lds[i]</text>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">从 nums[i] 出发的最长递减子序列</text>

  <path d="M280,200 L280,224" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 枚举峰顶 (菱形判定) -->
  <polygon points="280,228 410,278 280,328 150,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 枚举峰顶 i</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">lis[i]≥2 且 lds[i]≥2 ?</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(i ∈ [1, n−2])</text>

  <!-- 否分支 -->
  <path d="M150,278 L80,278 L80,378" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="112" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="36" y="378" width="88" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="400" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过 i</text>

  <!-- 是分支 -->
  <path d="M410,278 L480,278 L480,378" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="448" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="406" y="378" width="148" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">更新 ans</text>
  <text x="480" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= max(ans, lis+lds−1)</text>

  <!-- 汇合到返回 -->
  <path d="M80,412 L80,432 L240,432" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M480,426 L480,432 L320,432" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="200" y="424" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 n − ans</text>
</svg>
