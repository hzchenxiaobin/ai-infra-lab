<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sorted = [0,1,4,4,5,7]，countPairs(6)</text>

  <!-- Panel 0: step1 left=0 right=5, sum 7 greater than 6, decrement right -->
  <rect x="10" y="40" width="130" height="262" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">step 1</text>
  <!-- cells: left=0 blue, right=5 red -->
  <rect x="21" y="80" width="16" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="29" y="95" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">0</text>
  <rect x="39" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="95" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="57" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="75" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="83" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="93" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="101" y="95" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <rect x="111" y="80" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="119" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7</text>
  <!-- pointers -->
  <text x="29" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">L</text>
  <text x="119" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>
  <text x="75" y="140" text-anchor="middle" font-size="10" fill="#888">和 = 0+7</text>
  <text x="75" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 7</text>
  <text x="75" y="180" text-anchor="middle" font-size="9.5" fill="#888">7 &gt; 6</text>
  <rect x="25" y="190" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right−−</text>
  <text x="75" y="236" text-anchor="middle" font-size="9" fill="#888">cnt</text>
  <rect x="40" y="244" width="70" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 0</text>

  <!-- ============ Panel 1: step2 left=0 right=4, 0+5=5<=6 -> cnt+=4, left++ ============ -->
  <rect x="147" y="40" width="130" height="262" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="147" y="40" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="212" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">step 2 ★</text>
  <rect x="158" y="80" width="16" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="166" y="95" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">0</text>
  <rect x="176" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="95" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="194" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="212" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="230" y="80" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="238" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <rect x="248" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="256" y="95" text-anchor="middle" font-size="9" fill="#ccc">7</text>
  <text x="166" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">L</text>
  <text x="238" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>
  <text x="212" y="140" text-anchor="middle" font-size="10" fill="#888">和 = 0+5</text>
  <text x="212" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 5</text>
  <text x="212" y="180" text-anchor="middle" font-size="9.5" fill="#888">5 ≤ 6</text>
  <rect x="162" y="190" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="212" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt += 4；left++</text>
  <text x="212" y="236" text-anchor="middle" font-size="9" fill="#888">cnt</text>
  <rect x="177" y="244" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="212" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 4</text>

  <!-- ============ Panel 2: step3 left=1 right=4, 1+5=6<=6 -> cnt+=3, left++ ============ -->
  <rect x="284" y="40" width="130" height="262" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="284" y="40" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="349" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">step 3 ★</text>
  <rect x="295" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="303" y="95" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <rect x="313" y="80" width="16" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="321" y="95" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="331" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="339" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="349" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="357" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="367" y="80" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="375" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <rect x="385" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="393" y="95" text-anchor="middle" font-size="9" fill="#ccc">7</text>
  <text x="321" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">L</text>
  <text x="375" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>
  <text x="349" y="140" text-anchor="middle" font-size="10" fill="#888">和 = 1+5</text>
  <text x="349" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 6</text>
  <text x="349" y="180" text-anchor="middle" font-size="9.5" fill="#888">6 ≤ 6</text>
  <rect x="299" y="190" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="349" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt += 3；left++</text>
  <text x="349" y="236" text-anchor="middle" font-size="9" fill="#888">cnt</text>
  <rect x="314" y="244" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="349" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 7</text>

  <!-- ============ Panel 3: step4 left=2 right=4->3->2, end ============ -->
  <rect x="421" y="40" width="130" height="262" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="421" y="40" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">step 4</text>
  <rect x="432" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="95" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <rect x="450" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="458" y="95" text-anchor="middle" font-size="9" fill="#ccc">1</text>
  <rect x="468" y="80" width="16" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="476" y="95" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="486" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="494" y="95" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="504" y="80" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="512" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <rect x="522" y="80" width="16" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="530" y="95" text-anchor="middle" font-size="9" fill="#ccc">7</text>
  <text x="476" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">L</text>
  <text x="512" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>
  <text x="486" y="140" text-anchor="middle" font-size="10" fill="#888">4+5=9&gt;6 → R−−</text>
  <text x="486" y="156" text-anchor="middle" font-size="10" fill="#888">4+4=8&gt;6 → R−−</text>
  <text x="486" y="180" text-anchor="middle" font-size="9.5" fill="#b85450">L ≥ R，结束</text>
  <rect x="436" y="190" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">退出循环</text>
  <text x="486" y="236" text-anchor="middle" font-size="9" fill="#888">cnt</text>
  <rect x="451" y="244" width="70" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="486" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 7</text>

  <!-- Bottom summary -->
  <rect x="10" y="318" width="540" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">countPairs(6) = 7；同理 countPairs(2) = 1</text>
  <text x="280" y="358" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = 7 − 1 = 6 ✓（每次合法时 left..right−1 共 right−left 对全计入）</text>
</svg>
