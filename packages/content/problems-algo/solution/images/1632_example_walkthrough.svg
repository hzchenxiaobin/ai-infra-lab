<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix = [[2,2,5],[3,2,4]] → ans = [[1,1,4],[2,1,3]]</text>

  <!-- Input matrix -->
  <text x="80" y="58" text-anchor="middle" font-size="11" fill="#888">输入</text>
  <rect x="35" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="75" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="115" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">5</text>
  <rect x="35" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">3</text>
  <rect x="75" y="98" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="115" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">4</text>

  <!-- arrow to output -->
  <path d="M 170 98 L 215 98" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 210 94 L 218 98 L 210 102" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- Output matrix -->
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#888">输出 ans</text>
  <rect x="245" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="285" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="325" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="88" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">4</text>
  <rect x="245" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">2</text>
  <rect x="285" y="98" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="325" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="120" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">3</text>

  <!-- Step table -->
  <!-- header -->
  <rect x="20" y="160" width="580" height="28" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">值 v</text>
  <text x="160" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">格子（union）</text>
  <text x="320" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">连通分量</text>
  <text x="450" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">max(row,col)</text>
  <text x="555" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">秩</text>

  <!-- row v=2 -->
  <rect x="20" y="190" width="580" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="160" y="208" text-anchor="middle" font-size="10.5" fill="#333">(0,0),(0,1),(1,1)</text>
  <text x="160" y="223" text-anchor="middle" font-size="9.5" fill="#888">union(0,2),(0,3),(1,3)</text>
  <text x="320" y="216" text-anchor="middle" font-size="10.5" fill="#333">{R0,R1,C0,C1}</text>
  <text x="450" y="216" text-anchor="middle" font-size="11" fill="#333">max(0,0,0,0)=0</text>
  <text x="555" y="216" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- row v=3 -->
  <rect x="20" y="236" width="580" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="160" y="254" text-anchor="middle" font-size="10.5" fill="#333">(1,0)</text>
  <text x="160" y="269" text-anchor="middle" font-size="9.5" fill="#888">union(1,2)</text>
  <text x="320" y="262" text-anchor="middle" font-size="10.5" fill="#333">{R1,C0}</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#333">max(1,1)=1</text>
  <text x="555" y="262" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- row v=4 -->
  <rect x="20" y="282" width="580" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <text x="160" y="300" text-anchor="middle" font-size="10.5" fill="#333">(1,2)</text>
  <text x="160" y="315" text-anchor="middle" font-size="9.5" fill="#888">union(1,4)</text>
  <text x="320" y="308" text-anchor="middle" font-size="10.5" fill="#333">{R1,C2}</text>
  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#333">max(2,0)=2</text>
  <text x="555" y="308" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>

  <!-- row v=5 -->
  <rect x="20" y="328" width="580" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="354" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  <text x="160" y="346" text-anchor="middle" font-size="10.5" fill="#333">(0,2)</text>
  <text x="160" y="361" text-anchor="middle" font-size="9.5" fill="#888">union(0,4)</text>
  <text x="320" y="354" text-anchor="middle" font-size="10.5" fill="#333">{R0,C2}</text>
  <text x="450" y="354" text-anchor="middle" font-size="11" fill="#333">max(1,3)=3</text>
  <text x="555" y="354" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>

  <!-- footer note -->
  <rect x="20" y="382" width="580" height="22" fill="#f0f7ff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="397" text-anchor="middle" font-size="10" fill="#555">每行秩 = 1 + 涉及行/列的已有最大秩 → 满足约束的最小值</text>
</svg>
