<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums1=[[1,2],[2,3],[4,5]]，nums2=[[1,4],[3,2],[4,1]]</text>

  <!-- table header -->
  <rect x="24" y="44" width="512" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步</text>
  <text x="118" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i,j</text>
  <text x="208" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">比较 id1,id2</text>
  <text x="330" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">动作</text>
  <text x="470" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans（追加后）</text>

  <!-- row 0: id1=1 == id2=1 -> sum -->
  <rect x="24" y="76" width="512" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="105" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="118" y="105" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0,0</text>
  <text x="208" y="105" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1 == 1</text>
  <text x="330" y="99"  text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合并 [1, 2+4]</text>
  <text x="330" y="115" text-anchor="middle" font-size="11" fill="#333">i=1, j=1</text>
  <text x="470" y="105" text-anchor="middle" font-size="11" fill="#333">[[1,6]]</text>

  <!-- row 1: id1=2 < id2=3 -> take nums1 -->
  <rect x="24" y="128" width="512" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="157" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="118" y="157" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1,1</text>
  <text x="208" y="157" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2 &lt; 3</text>
  <text x="330" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取 nums1[i]=[2,3]</text>
  <text x="330" y="167" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <text x="470" y="157" text-anchor="middle" font-size="11" fill="#333">[[1,6],[2,3]]</text>

  <!-- row 2: id1=4 > id2=3 -> take nums2 -->
  <rect x="24" y="180" width="512" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="209" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="118" y="209" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2,1</text>
  <text x="208" y="209" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4 &gt; 3</text>
  <text x="330" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取 nums2[j]=[3,2]</text>
  <text x="330" y="219" text-anchor="middle" font-size="11" fill="#333">j=2</text>
  <text x="470" y="209" text-anchor="middle" font-size="11" fill="#333">…,[3,2]</text>

  <!-- row 3: id1=4 == id2=4 -> sum -->
  <rect x="24" y="232" width="512" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="261" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="118" y="261" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2,2</text>
  <text x="208" y="261" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4 == 4</text>
  <text x="330" y="255" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合并 [4, 5+1]</text>
  <text x="330" y="271" text-anchor="middle" font-size="11" fill="#333">i=3, j=3</text>
  <text x="470" y="261" text-anchor="middle" font-size="11" fill="#333">…,[4,6]</text>

  <!-- row 4: i==n,j==m -> drain empty, done -->
  <rect x="24" y="284" width="512" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="313" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="118" y="313" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3,3</text>
  <text x="208" y="313" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">i=n,j=m</text>
  <text x="330" y="307" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扫尾（两侧均空）</text>
  <text x="330" y="323" text-anchor="middle" font-size="11" fill="#333">退出循环</text>
  <text x="470" y="313" text-anchor="middle" font-size="11" fill="#333">结束</text>

  <!-- result box -->
  <rect x="60" y="350" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终结果 ans =</text>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[[1,6],[2,3],[3,2],[4,6]]</text>
</svg>
