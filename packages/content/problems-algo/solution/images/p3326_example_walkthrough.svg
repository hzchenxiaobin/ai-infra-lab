<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">橙色 = 已定型（pre 的来源），绿色 = 操作后的新值，红色 = 死子</text>

  <!-- 面板1：[12, 9, 6] -->
  <rect x="16" y="50" width="488" height="172" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① nums = [12, 9, 6] → 答案 2</text>

  <text x="30" y="96" font-size="10" fill="#555" filter="url(#rough2)">初始：尾元素 6 直接定型</text>
  <text x="30" y="110" font-size="10" fill="#a07830" filter="url(#rough2)">pre = 6</text>
  <rect x="330" y="82" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">12</text>
  <rect x="378" y="82" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <rect x="426" y="82" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="101" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">6</text>

  <path d="M 448 112 L 448 120" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="140" font-size="10" fill="#555" filter="url(#rough2)">i=1：9 &gt; 6 → 被迫操作</text>
  <text x="30" y="154" font-size="10" fill="#2f5d24" filter="url(#rough2)">SPF(9) = 3 ≤ 6 ✓ ans=1，pre=3</text>
  <rect x="330" y="126" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="145" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">12</text>
  <rect x="378" y="126" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="426" y="126" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="145" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">6</text>

  <path d="M 448 156 L 448 164" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="184" font-size="10" fill="#555" filter="url(#rough2)">i=0：12 &gt; 3 → 被迫操作</text>
  <text x="30" y="198" font-size="10" fill="#2f5d24" filter="url(#rough2)">SPF(12) = 2 ≤ 3 ✓ ans=2，pre=2</text>
  <rect x="330" y="170" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="189" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="378" y="170" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="189" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">3</text>
  <rect x="426" y="170" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="189" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">6</text>

  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">终态 [2, 3, 6] 非递减 ✓ 返回 2</text>

  <!-- 面板2：[7, 7, 6] -->
  <rect x="16" y="232" width="488" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">② nums = [7, 7, 6] → 答案 −1（死子挡路）</text>

  <rect x="330" y="260" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="279" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">7</text>
  <rect x="378" y="260" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="279" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">7</text>
  <rect x="426" y="260" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="279" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">6</text>

  <text x="30" y="274" font-size="10" fill="#555" filter="url(#rough2)">i=1：7 &gt; 6 → 必须操作</text>
  <text x="30" y="288" font-size="10" fill="#8a3833" filter="url(#rough2)">但 SPF(7) = 7（质数）</text>

  <path d="M 400 290 C 400 304, 300 300, 250 306" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="30" y="316" font-size="10" fill="#8a3833" filter="url(#rough2)">两个候选 {7, 7} 都 &gt; pre(6)，压不进去 → 返回 −1</text>
  <text x="30" y="332" font-size="10" fill="#555" filter="url(#rough2)">（对照：若是 [9, 6]，SPF(9)=3 ≤ 6 就有解）</text>

  <!-- 面板3：[25, 7] -->
  <rect x="16" y="354" width="488" height="104" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ nums = [25, 7] → 答案 1（官方示例 1）</text>

  <rect x="354" y="382" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="401" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">25</text>
  <path d="M 376 412 L 376 420" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="424" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="376" y="443" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">5</text>

  <rect x="426" y="382" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="401" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">7</text>
  <rect x="426" y="424" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="448" y="443" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">7</text>

  <text x="30" y="396" font-size="10" fill="#555" filter="url(#rough2)">i=0：25 &gt; 7 → 操作</text>
  <text x="30" y="410" font-size="10" fill="#2f5d24" filter="url(#rough2)">25 = 5×5，SPF(25) = 5 ≤ 7 ✓</text>
  <text x="30" y="430" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans=1，终态 [5, 7]</text>
</svg>
