<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：R[i] = 右侧第一个「≥ nums[i]」的下标</text>

  <!-- array -->
  <text x="98" y="64" text-anchor="end" font-size="12" fill="#999" filter="url(#rough2)">nums =</text>
  <rect x="112" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="65" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="154" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="196" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="238" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="322" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="364" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="406" y="46" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="448" y="46" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="65" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="490" y="46" width="42" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="511" y="65" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">11</text>

  <text x="133" y="92" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="469" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R[0]=8</text>

  <!-- arrow from i=0 up over to cell 8 -->
  <path d="M 133 40 Q 133 20 300 18 Q 462 18 465 40" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="14" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">右侧第一个 ≥ 7 的元素</text>

  <!-- bracket -->
  <path d="M 112 102 L 112 114 L 448 114 L 448 102" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[i .. R[i]−1] 全部 &lt; nums[i]，恰是从 i 出发的最长半递减子数组</text>

  <!-- formula box -->
  <rect x="60" y="150" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max( R[i] − i )，R[i] 不存在时取哨兵 n</text>

  <!-- table of R values -->
  <text x="60" y="216" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">逐个 i 验证（nums = [7,6,5,4,3,2,1,6,10,11]）：</text>
  <rect x="60" y="228" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="130" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">起点值</text>
  <text x="210" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i]（第一个 ≥ 起点的）</text>
  <text x="400" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R[i]−i</text>
  <text x="490" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">子数组</text>

  <rect x="60" y="252" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="267" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="130" y="267" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="210" y="267" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8（10 ≥ 7）</text>
  <text x="400" y="267" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 ★</text>
  <text x="490" y="267" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[7,…,6]</text>

  <rect x="60" y="274" width="480" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="289" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="130" y="289" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="210" y="289" font-size="10.5" fill="#555" filter="url(#rough2)">7（6 = 6，相等也挡路）</text>
  <text x="400" y="289" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="490" y="289" font-size="10.5" fill="#555" filter="url(#rough2)">[6,…,1,6]</text>

  <rect x="60" y="296" width="480" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="311" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="130" y="311" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="210" y="311" font-size="10.5" fill="#555" filter="url(#rough2)">8（10 ≥ 6）</text>
  <text x="400" y="311" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="490" y="311" font-size="10.5" fill="#555" filter="url(#rough2)">[6]</text>

  <rect x="60" y="318" width="480" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="130" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">11</text>
  <text x="210" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">10 = n（哨兵，右侧没有更大的）</text>
  <text x="400" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="490" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">[11]</text>

  <!-- insight -->
  <text x="60" y="364" font-size="11.5" fill="#555" filter="url(#rough2)">于是问题塌缩成经典任务：批量求「下一个更大或相等元素」→ 单调栈 O(n)，或排序 O(n log n)</text>
  <text x="60" y="384" font-size="10.5" fill="#999" filter="url(#rough2)">合法性只看 i 的右侧，左边有什么都不影响——所以每个 i 都可直接当候选起点，无需额外筛选</text>
</svg>
