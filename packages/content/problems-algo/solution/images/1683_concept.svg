<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：CHAR_LENGTH(content) &gt; 15 → 无效推文</text>

  <!-- ===== Threshold axis ===== -->
  <line x1="60" y1="150" x2="600" y2="150" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="154" text-anchor="end" font-size="10" fill="#888">长度</text>

  <!-- Tick marks: 0, 15, ... -->
  <line x1="60" y1="146" x2="60" y2="154" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="9.5" fill="#888">0</text>

  <!-- threshold 15 -->
  <line x1="250" y1="138" x2="250" y2="162" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="250" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">阈值 15</text>
  <text x="250" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">15</text>

  <!-- valid zone -->
  <rect x="60" y="142" width="190" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="155" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">≤ 15：有效</text>

  <!-- invalid zone -->
  <rect x="250" y="142" width="350" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="425" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">&gt; 15：无效</text>

  <!-- ===== Row 1: tweet 1 (valid, length 14) ===== -->
  <text x="50" y="56" font-size="10.5" fill="#888">tweet_id = 1</text>
  <rect x="110" y="42" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="63" text-anchor="middle" font-size="11.5" fill="#333">Vote for Biden</text>

  <!-- bar to 14 -->
  <rect x="60" y="98" width="190" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="258" y="110" font-size="10" fill="#4a7a3a" font-weight="bold">CHAR_LENGTH = 14</text>

  <!-- ===== Row 2: tweet 2 (invalid, length 32) ===== -->
  <text x="50" y="232" font-size="10.5" fill="#888">tweet_id = 2</text>
  <rect x="110" y="218" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="239" text-anchor="middle" font-size="10" fill="#333">Let us make America great again!</text>

  <!-- bar to 32 (overshoot threshold) -->
  <rect x="60" y="274" width="433" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="274" width="190" height="14" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="501" y="286" font-size="10" fill="#b85450" font-weight="bold">CHAR_LENGTH = 32</text>

  <!-- arrow from threshold crossing -->
  <path d="M250 270 L250 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Key points ===== -->
  <rect x="30" y="304" width="600" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="324" font-size="10.5" fill="#333">① CHAR_LENGTH(content) 返回字符数（含空格），与字节数无关</text>
  <text x="50" y="340" font-size="10.5" fill="#333">② 严格 &gt; 15 为无效；长度恰为 15 的推文有效（边界勿写成 &gt;=）</text>
</svg>
