<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心思路：CROSS JOIN 全组合 + LEFT JOIN 保全 + COUNT(列) 计 0</text>

  <!-- Students table -->
  <text x="40" y="62" font-size="11" fill="#446688" font-weight="bold">Students</text>
  <g filter="url(#rough2)">
    <rect x="30" y="68" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="30" y="90" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="30" y="110" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="30" y="130" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="30" y="150" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="80" y="83" text-anchor="middle" font-weight="bold">student_id/name</text>
    <text x="80" y="104" text-anchor="middle">1  Alice</text>
    <text x="80" y="124" text-anchor="middle">2  Bob</text>
    <text x="80" y="144" text-anchor="middle">6  Alex</text>
    <text x="80" y="164" text-anchor="middle">13 John</text>
  </g>

  <!-- times sign -->
  <text x="150" y="122" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">×</text>
  <text x="150" y="140" text-anchor="middle" font-size="8.5" fill="#888">CROSS JOIN</text>

  <!-- Subjects table -->
  <text x="195" y="62" font-size="11" fill="#4a7a3a" font-weight="bold">Subjects</text>
  <g filter="url(#rough2)">
    <rect x="180" y="68" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="180" y="90" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="180" y="110" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
    <rect x="180" y="130" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="2"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="230" y="83" text-anchor="middle" font-weight="bold">subject_name</text>
    <text x="230" y="104" text-anchor="middle">Math</text>
    <text x="230" y="124" text-anchor="middle">Physics</text>
    <text x="230" y="144" text-anchor="middle">Programming</text>
  </g>

  <!-- arrow to matrix -->
  <path d="M 285 130 L 320 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="300" y="122" text-anchor="middle" font-size="8.5" fill="#888">4×3</text>

  <!-- Result matrix: 4 students x 3 subjects -->
  <text x="475" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">全组合矩阵（12 格，每格必出现）</text>
  <!-- header row -->
  <g filter="url(#rough2)" font-size="9" fill="#333">
    <rect x="360" y="68" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3"/>
    <text x="397" y="83" text-anchor="middle" font-weight="bold">学生＼科目</text>
    <rect x="434" y="68" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3"/>
    <text x="465" y="83" text-anchor="middle" font-weight="bold">Math</text>
    <rect x="496" y="68" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3"/>
    <text x="527" y="83" text-anchor="middle" font-weight="bold">Physics</text>
    <rect x="558" y="68" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3"/>
    <text x="589" y="83" text-anchor="middle" font-weight="bold">Prog</text>
  </g>
  <!-- Alice row -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="360" y="90" width="74" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="397" y="104" text-anchor="middle" font-weight="bold">Alice</text>
    <rect x="434" y="90" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="465" y="104" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="496" y="90" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="527" y="104" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="558" y="90" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="589" y="104" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <!-- Bob row -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="360" y="110" width="74" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="397" y="124" text-anchor="middle" font-weight="bold">Bob</text>
    <rect x="434" y="110" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="465" y="124" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="496" y="110" width="62" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="2"/>
    <text x="527" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="558" y="110" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="589" y="124" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <!-- Alex row (all 0) -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="360" y="130" width="74" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="397" y="144" text-anchor="middle" font-weight="bold" fill="#b85450">Alex</text>
    <rect x="434" y="130" width="62" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="2"/>
    <text x="465" y="144" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="496" y="130" width="62" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="2"/>
    <text x="527" y="144" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="558" y="130" width="62" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="2"/>
    <text x="589" y="144" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>
  <!-- John row -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="360" y="150" width="74" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="397" y="164" text-anchor="middle" font-weight="bold">John</text>
    <rect x="434" y="150" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="465" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="496" y="150" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="527" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="558" y="150" width="62" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="589" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="475" y="186" text-anchor="middle" font-size="8.5" fill="#b85450">红框虚线 = 未参加（须补 0，不能丢）</text>

  <!-- divider -->
  <path d="M 30 206 L 620 206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Three-step insight box -->
  <rect x="30" y="222" width="590" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="325" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三步拆解：为什么不能直接 GROUP BY Examinations？</text>

  <g filter="url(#rough2)">
    <circle cx="52" cy="276" r="11" fill="#446688"/>
    <circle cx="52" cy="316" r="11" fill="#4a7a3a"/>
    <circle cx="52" cy="356" r="11" fill="#b85450"/>
  </g>
  <text x="52" y="280" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="52" y="320" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="52" y="360" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>

  <text x="74" y="272" font-size="11" fill="#446688" font-weight="bold">CROSS JOIN Students × Subjects</text>
  <text x="74" y="288" font-size="10" fill="#555">先生成 4×3 = 12 个「学生 × 科目」全组合——无论是否参加过考试，每对都占一行</text>
  <text x="74" y="302" font-size="9.5" fill="#888">直接 GROUP BY Examinations 只能得到参加过的组合，Alex（全未参加）会整行消失 → 漏数据</text>

  <text x="74" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">LEFT JOIN Examinations</text>
  <text x="74" y="328" font-size="10" fill="#555">把全组合作为左表，LEFT JOIN 考试记录——未匹配的组合保留为 NULL 行（不丢）</text>
  <text x="74" y="342" font-size="9.5" fill="#888">JOIN 条件 ON e.student_id = s.student_id AND e.subject_name = sub.subject_name（两列同时匹配）</text>

  <text x="74" y="352" font-size="11" fill="#b85450" font-weight="bold">GROUP BY + COUNT(e.student_id)</text>
  <text x="74" y="368" font-size="10" fill="#555">按 (student_id, subject_name) 分组，COUNT(列) 自动忽略 NULL → 未参加的组合得 0</text>
  <text x="74" y="382" font-size="9.5" fill="#b85450">⚠️ 用 COUNT(*) 会把 NULL 行也算成 1 → 错！必须 COUNT(e.student_id)</text>

  <!-- summary -->
  <rect x="30" y="416" width="590" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="325" y="437" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">CROSS JOIN 造格 → LEFT JOIN 填数 → COUNT(列) 计 0，三步保证「不漏一格」</text>
</svg>
