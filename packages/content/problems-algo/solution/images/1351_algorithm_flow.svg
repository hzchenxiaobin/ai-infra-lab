<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：阶梯法 O(m+n)</text>

  <!-- Step 1: init -->
  <rect x="160" y="44" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#555">row=0, col=n-1, count=0</text>

  <!-- arrow down -->
  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: loop condition diamond -->
  <polygon points="260,110 380,160 260,210 140,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">② row &lt; m</text>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">且 col ≥ 0 ?</text>

  <!-- No branch: right to return -->
  <path d="M 380 160 L 430 160 L 430 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="395" y="152" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- return box -->
  <rect x="380" y="250" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 count</text>
  <text x="430" y="282" text-anchor="middle" font-size="10" fill="#888">结束</text>

  <!-- Yes branch: down -->
  <path d="M 260 210 L 260 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="224" font-size="11" fill="#888" font-weight="bold">是</text>

  <!-- Step 3: inner decision diamond -->
  <polygon points="260,230 370,275 260,320 150,275" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ grid[row][col]</text>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&lt; 0 ?</text>

  <!-- Yes branch: left -->
  <path d="M 150 275 L 90 275 L 90 330" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="268" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- negative action box -->
  <rect x="30" y="330" width="160" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">count += m - row</text>
  <text x="110" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">col --</text>
  <text x="110" y="380" text-anchor="middle" font-size="9" fill="#888">吃掉该列剩余负数</text>

  <!-- No branch: right -->
  <path d="M 370 275 L 430 275 L 430 330" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="395" y="268" font-size="11" fill="#446688" font-weight="bold">否</text>

  <!-- non-negative action box -->
  <rect x="350" y="330" width="160" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">row ++</text>
  <text x="430" y="366" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(下移)</text>
  <text x="430" y="380" text-anchor="middle" font-size="9" fill="#888">当前列上方非负</text>

  <!-- loop back arrows: both go down then left/right back to step 2 -->
  <!-- from negative box: down to y=410, then right to x=260, then up to diamond top -->
  <path d="M 110 388 L 110 410 L 260 410 L 260 110" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- from non-negative box: down to y=410, then left to x=260 -->
  <path d="M 430 388 L 430 410 L 260 410" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="200" y="404" font-size="10" fill="#888">循环回 ②</text>

  <!-- bottom note -->
  <rect x="40" y="424" width="440" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="442" text-anchor="middle" font-size="11" fill="#555">每步 row++ 或 col--，总步数 ≤ m+n ⇒ O(m+n)</text>
</svg>
