<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：m=2, n=3 → total=6，连续 3 次 flip + reset</text>

  <text x="40" y="56" font-size="11" fill="#888">一维索引 → 二维：i = r·n + c，故 [0..5] 对应 (0,0)(0,1)(0,2)(1,0)(1,1)(1,2)</text>

  <rect x="40" y="68" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="75" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步骤</text>

  <rect x="110" y="68" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="135" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">r</text>

  <rect x="160" y="68" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="215" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">actual</text>

  <rect x="270" y="68" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="335" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">map 操作</text>

  <rect x="400" y="68" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">map 状态</text>

  <rect x="510" y="68" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="530" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">total</text>

  <rect x="40" y="104" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="123" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">初始</text>
  <rect x="110" y="104" width="50" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="123" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="160" y="104" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="123" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="270" y="104" width="130" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="123" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="400" y="104" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="123" text-anchor="middle" font-size="10.5" fill="#d6a040">{ }</text>
  <rect x="510" y="104" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="123" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">6</text>

  <rect x="40" y="136" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="75" y="161" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">flip #1</text>
  <rect x="110" y="136" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="160" y="136" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="154" text-anchor="middle" font-size="10.5" fill="#446688">map.get(1,1)=1</text>
  <text x="215" y="169" text-anchor="middle" font-size="9.5" fill="#888">→ [0,1] ✓</text>
  <rect x="270" y="136" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a">map[1]=map[5]=5</text>
  <text x="335" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a">remove map[5]</text>
  <rect x="400" y="136" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="161" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">{1:5}</text>
  <rect x="510" y="136" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="161" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">5</text>

  <rect x="40" y="180" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="75" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">flip #2</text>
  <rect x="110" y="180" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="160" y="180" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="198" text-anchor="middle" font-size="10.5" fill="#446688">map.get(1,1)=5</text>
  <text x="215" y="213" text-anchor="middle" font-size="9.5" fill="#888">→ [1,2] ✓</text>
  <rect x="270" y="180" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">map[1]=map[4]=4</text>
  <text x="335" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a">remove map[4]</text>
  <rect x="400" y="180" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="205" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">{1:4}</text>
  <rect x="510" y="180" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="205" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>

  <rect x="40" y="224" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="75" y="249" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">flip #3</text>
  <rect x="110" y="224" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="160" y="224" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="242" text-anchor="middle" font-size="10.5" fill="#446688">map.get(2,2)=2</text>
  <text x="215" y="257" text-anchor="middle" font-size="9.5" fill="#888">→ [0,2] ✓</text>
  <rect x="270" y="224" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">map[2]=map[3]=3</text>
  <text x="335" y="257" text-anchor="middle" font-size="10" fill="#4a7a3a">remove map[3]</text>
  <rect x="400" y="224" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="249" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">{1:4, 2:3}</text>
  <rect x="510" y="224" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="249" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">3</text>

  <rect x="40" y="268" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="75" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">reset</text>
  <rect x="110" y="268" width="50" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="290" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="160" y="268" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">map.clear()</text>
  <rect x="270" y="268" width="130" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="290" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="400" y="268" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="290" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">{ }</text>
  <rect x="510" y="268" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="290" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">6</text>

  <path d="M 455 134 L 455 132 L 455 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="318" width="528" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="12" fill="#4a7a3a" font-weight="bold">关键观察</text>
  <text x="56" y="364" font-size="11" fill="#555">• flip #2 再次抽到 r=1，但 map[1]=5 把它重定向到 cell 5 —— 已用过的位置 1 不浪费，复用存「末尾值」</text>
  <text x="56" y="382" font-size="11" fill="#555">• 每个 actual ∈ [0, m·n) 至多被返回一次；剩余 total 个候选各占虚拟数组一个位置 → 均匀</text>
  <text x="56" y="400" font-size="11" fill="#b85450" font-weight="bold">• 全程哈希表 size ≤ 3，与 m·n=6 无关；m·n=10⁸ 时仍 O(flip 次数) 空间</text>
</svg>
