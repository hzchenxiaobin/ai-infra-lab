<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：一场比赛 ⇔ 淘汰一支队伍
  </text>

  <!-- ===== One match illustration (left) ===== -->
  <!-- Two input teams -->
  <ellipse cx="70" cy="92" rx="26" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队伍 A</text>
  <ellipse cx="70" cy="148" rx="26" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队伍 B</text>

  <!-- arrows into match box -->
  <path d="M96,96 L150,116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M96,148 L150,128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Match box -->
  <rect x="152" y="100" width="76" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">1 场比赛</text>
  <text x="190" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">配对</text>

  <!-- winner out (right, green) -->
  <path d="M228,112 L262,92" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <ellipse cx="294" cy="84" rx="30" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="294" y="88" text-anchor="middle" font-size="11" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">胜者晋级</text>

  <!-- loser out (down, red, crossed out) -->
  <path d="M190,144 L190,176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="166" font-size="10" fill="#b85450" filter="url(#rough2)">淘汰</text>
  <ellipse cx="190" cy="196" rx="30" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">败者出局</text>
  <!-- cross out -->
  <path d="M168,184 L212,208" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- invariant label under match -->
  <rect x="120" y="232" width="240" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="240" y="252" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    不变量：1 场比赛 → 恰好淘汰 1 支队伍
  </text>

  <!-- ===== Counting argument (right) ===== -->
  <rect x="382" y="78" width="146" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">计数论证</text>
  <line x1="394" y1="108" x2="516" y2="108" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="398" y="128" font-size="11" fill="#333" filter="url(#rough2)">• 初始：n 支队伍</text>
  <text x="398" y="150" font-size="11" fill="#333" filter="url(#rough2)">• 终局：1 个冠军</text>
  <text x="398" y="172" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">• 需淘汰 n − 1 支</text>
  <text x="398" y="194" font-size="11" fill="#333" filter="url(#rough2)">• 每场淘汰恰好 1 支</text>
  <text x="398" y="216" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 场数 = n − 1</text>

  <!-- ===== Bottom formula box ===== -->
  <rect x="40" y="284" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="13" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">
    比赛场数 ≡ 被淘汰队伍数 = n − 1
  </text>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    （奇偶轮次只影响分配方式，不影响总淘汰数）
  </text>
</svg>
