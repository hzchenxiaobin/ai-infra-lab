<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">用队列实现栈：单队列旋转法</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#666">队列保序——无法靠“倒”逆转，只能“旋转”把新元素从队尾绕到队首</text>

  <!-- 三阶段：push(3) 进入已有 [2,1] 的队列（队首=栈顶=2） -->
  <!-- 阶段1: push(3) 后 -->
  <text x="120" y="104" font-size="13" font-weight="bold" fill="#2b6e9e">① push(3) 入队尾</text>
  <g filter="url(#sk)">
    <rect x="60" y="120" width="60" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="120" y="120" width="60" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="180" y="120" width="60" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="90" y="144" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="150" y="144" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="210" y="144" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="64" y="112" font-size="10" fill="#2e6e2e">队首</text>
  <text x="206" y="112" font-size="10" fill="#b85450">队尾(x)</text>
  <text x="120" y="172" font-size="11" fill="#666">队列 = [2, 1, 3]，3 在队尾 ≠ 栈顶</text>

  <!-- 旋转箭头 1 -->
  <path d="M 90 158 Q 90 188 90 178" stroke="none" fill="none"/>
  <path d="M 300 138 L 340 138" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="#444">旋转</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="#444">size-1 次</text>

  <!-- 阶段2: 旋转中 -->
  <text x="470" y="104" font-size="13" font-weight="bold" fill="#7a5415">② 出队首再入队尾</text>
  <g filter="url(#sk)">
    <rect x="380" y="120" width="60" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="440" y="120" width="60" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="3 2"/>
    <rect x="500" y="120" width="60" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="410" y="144" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="470" y="144" text-anchor="middle" font-size="14" fill="#7a5415">2</text>
  <text x="530" y="144" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="384" y="112" font-size="10" fill="#2e6e2e">队首</text>
  <!-- 旋转循环箭头：队首→队尾 -->
  <path d="M 410 158 C 410 200 530 200 530 158" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="470" y="218" text-anchor="middle" font-size="10" fill="#2e6e2e">2 出队首 → 入队尾</text>
  <text x="470" y="172" font-size="11" fill="#666">老元素依次“绕”到 3 后面</text>

  <!-- 旋转箭头 2 -->
  <path d="M 600 138 L 640 138" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="620" y="128" text-anchor="middle" font-size="10" fill="#444">旋转</text>
  <text x="620" y="152" text-anchor="middle" font-size="10" fill="#444">完成</text>

  <!-- 阶段3: 旋转后 -->
  <text x="760" y="104" font-size="13" font-weight="bold" fill="#2e6e2e">③ x 到队首=栈顶</text>
  <g filter="url(#sk)">
    <rect x="680" y="120" width="60" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="740" y="120" width="60" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="800" y="120" width="60" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="710" y="144" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="770" y="144" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="830" y="144" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="684" y="112" font-size="10" fill="#2e6e2e">队首=栈顶</text>
  <text x="826" y="112" font-size="10" fill="#666">队尾</text>
  <path d="M 680 162 L 670 162" stroke="#2e6e2e" stroke-width="2" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="760" y="172" font-size="11" fill="#2e6e2e">队列 = [3, 2, 1]，pop 直接取队首</text>

  <!-- 不变量框 -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="780" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="450" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">不变量：任何时刻，队首 = 栈顶（最后压入且未弹出的元素）</text>
  <text x="450" y="296" text-anchor="middle" font-size="11" fill="#444">push 后立刻旋转 size-1 次维持不变量；pop/top 直接操作队首，O(1)</text>

  <!-- 与 232 的不对称对比 -->
  <g filter="url(#sk)">
    <rect x="60" y="328" width="380" height="148" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="460" y="328" width="380" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="250" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">232：栈 → 队列（倒换逆转）</text>
  <text x="250" y="376" text-anchor="middle" font-size="11" fill="#444">栈 A 倒进栈 B：顺序逆转一次</text>
  <g filter="url(#sk)">
    <rect x="100" y="388" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="140" y="388" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="180" y="388" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="120" y="408" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="160" y="408" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="200" y="408" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="240" y="404" font-size="16" fill="#b85450">→</text>
  <g filter="url(#sk)">
    <rect x="260" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="300" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="340" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="320" y="408" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="360" y="408" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="250" y="436" text-anchor="middle" font-size="11" fill="#2e6e2e">逆转 → 可懒倒换，摊还 O(1)</text>
  <text x="250" y="456" text-anchor="middle" font-size="10" fill="#666">一次倒空 out_stack，后续多次 pop 受益</text>

  <text x="650" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">225：队列 → 栈（搬运保序）</text>
  <text x="650" y="376" text-anchor="middle" font-size="11" fill="#444">队列 A 搬进队列 B：顺序不变</text>
  <g filter="url(#sk)">
    <rect x="500" y="388" width="40" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="540" y="388" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="580" y="388" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="520" y="408" text-anchor="middle" font-size="12" fill="#2e6e2e">3</text>
  <text x="560" y="408" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="600" y="408" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="640" y="404" font-size="16" fill="#b85450">→</text>
  <g filter="url(#sk)">
    <rect x="660" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="700" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="740" y="388" width="40" height="28" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="680" y="408" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="720" y="408" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="760" y="408" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="650" y="436" text-anchor="middle" font-size="11" fill="#b85450">保序 → 无法懒倒换，必须当场旋转</text>
  <text x="650" y="456" text-anchor="middle" font-size="10" fill="#666">push 旋转 size-1 次，最坏 O(n)</text>
</svg>
