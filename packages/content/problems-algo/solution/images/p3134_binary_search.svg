<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">count(t) 单调不减 ⇒ 二分最小 t 使 count(t) ≥ k</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（示例 2：nums = [3,4,3,4,5]，m = 15，k = 8）</text>

  <!-- axis -->
  <line x1="60" y1="240" x2="480" y2="240" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="66" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">count</text>

  <!-- bars: t=1..5, base y=240, max h=170 for count=15 -->
  <rect x="70" y="183" width="44" height="57" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="176" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="92" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t=1</text>

  <rect x="150" y="93" width="44" height="147" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="172" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t=2</text>

  <rect x="230" y="70" width="44" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="63" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="252" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t=3</text>

  <rect x="310" y="70" width="44" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="63" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="332" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t=4</text>

  <rect x="390" y="70" width="44" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="63" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="412" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">t=5</text>

  <!-- k line: y = 240 - 8/15*170 ≈ 149 -->
  <line x1="60" y1="149" x2="480" y2="149" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="448" y="142" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 8</text>

  <!-- t=2 highlight note -->
  <text x="172" y="200" text-anchor="middle" font-size="10" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">首个达标</text>

  <!-- conclusion boxes -->
  <rect x="40" y="272" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">夹逼：count(1) = 5 &lt; 8 ⇒ 第 8 小 ≥ 2；count(2) = 13 ≥ 8 ⇒ 第 8 小 ≤ 2</text>

  <rect x="40" y="312" width="440" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 最小 t 使 count(t) ≥ k ——「第 k 小 ≤ t」谓词随 t 单调，二分找首个 true</text>
</svg>
