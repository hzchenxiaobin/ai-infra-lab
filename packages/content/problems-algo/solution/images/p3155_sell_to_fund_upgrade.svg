<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：卖掉不升级的机器筹钱 —— 一个不等式定答案</text>

  <rect x="28" y="64" width="118" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="87" y="88" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">初始预算</text>
  <text x="87" y="108" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">money[i]</text>

  <rect x="178" y="52" width="314" height="182" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="335" y="74" text-anchor="middle" font-size="12.5" fill="#666" font-weight="bold" filter="url(#rough2)">数据中心 i（共 count[i] 台服务器）</text>

  <text x="335" y="98" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">升级 x 台（每台花 upgrade[i]）</text>
  <rect x="206" y="106" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="240" y="106" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <rect x="274" y="106" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="287" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <text x="320" y="124" font-size="12" fill="#4a7a3a" filter="url(#rough2)">… 共 x 台</text>

  <text x="335" y="164" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">卖掉 count[i]−x 台（每台得 sell[i]）</text>
  <rect x="206" y="172" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="190" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">$</text>
  <rect x="240" y="172" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="190" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">$</text>
  <rect x="274" y="172" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="287" y="190" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">$</text>
  <text x="320" y="190" font-size="12" fill="#8a6d3b" filter="url(#rough2)">… 共 count−x 台</text>

  <path d="M 150 90 Q 178 92 200 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="163" y="80" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">出资</text>

  <path d="M 202 196 Q 172 178 150 122" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="163" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">回款</text>

  <rect x="28" y="254" width="464" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">收支可行：x·upgrade[i] ≤ money[i] + (count[i] − x)·sell[i]</text>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">移项合并：x·(upgrade[i] + sell[i]) ≤ money[i] + count[i]·sell[i]</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（右边记作 budget，左边系数记作 unit）</text>
  <text x="260" y="356" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans[i] = min( count[i], ⌊ budget / unit ⌋ )</text>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">隐性上界 x ≤ count[i]：卖掉的机器不能拿来升级</text>
</svg>
