<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：查开关 → 调 fn / 跳过</text>

  <!-- Start -->
  <rect x="185" y="48" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">收到调用 (...args)</text>
  <path d="M270,84 L270,100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="270,102 348,150 270,198 192,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">called ?</text>
  <text x="270" y="167" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">已调过？</text>

  <!-- No branch (left) -->
  <text x="160" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否（首次）</text>
  <path d="M192,150 L108,150 L108,212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="28" y="215" width="160" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">result = fn(...args)</text>
  <path d="M108,248 L108,268" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="28" y="271" width="160" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">called = true</text>
  <path d="M108,304 L108,322" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="28" y="325" width="160" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return result</text>

  <!-- Yes branch (right) -->
  <text x="378" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">是（已调）</text>
  <path d="M348,150 L432,150 L432,212" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="352" y="215" width="160" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">return undefined</text>

  <!-- note on the fast path -->
  <text x="432" y="275" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">不触碰 fn</text>
  <text x="432" y="292" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">仅一次查表即返回</text>

  <!-- bottom note -->
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左路三步、右路一步——首次做实事，其后纯跳过</text>
</svg>
