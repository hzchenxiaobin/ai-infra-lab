<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数学规律：n ≥ 5 时，clumsy(n) 由 n mod 4 决定</text>

  <!-- 关键观察框 -->
  <rect x="30" y="46" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#444">对 k ≥ 5：k × (k−1) ÷ (k−2) = ⌊(k²−k)/(k−2)⌋ = k + 1</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#888">因为 (k²−k)/(k−2) = k+1 + 2/(k−2)，余项 0 &lt; 2/(k−2) &lt; 1 被截断</text>

  <!-- 表头 -->
  <rect x="60" y="108" width="120" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">n mod 4</text>
  <rect x="180" y="108" width="140" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="128" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">clumsy(n)</text>
  <rect x="320" y="108" width="200" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">验证</text>

  <!-- 行 0 -->
  <rect x="60" y="142" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="163" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">0</text>
  <rect x="180" y="142" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n + 1</text>
  <rect x="320" y="142" width="200" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="163" text-anchor="middle" font-size="11.5" fill="#555">8→9, 12→13, 16→17</text>

  <!-- 行 1 -->
  <rect x="60" y="178" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="199" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">1</text>
  <rect x="180" y="178" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="199" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n + 2</text>
  <rect x="320" y="178" width="200" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="199" text-anchor="middle" font-size="11.5" fill="#555">5→7, 9→11, 13→15</text>

  <!-- 行 2 -->
  <rect x="60" y="214" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="235" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">2</text>
  <rect x="180" y="214" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n + 2</text>
  <rect x="320" y="214" width="200" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="235" text-anchor="middle" font-size="11.5" fill="#555">6→8, 10→12, 14→16</text>

  <!-- 行 3 -->
  <rect x="60" y="250" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="271" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">3</text>
  <rect x="180" y="250" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n − 1</text>
  <rect x="320" y="250" width="200" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="271" text-anchor="middle" font-size="11.5" fill="#555">7→6, 11→10, 15→14</text>

  <!-- 小 n 特判 -->
  <rect x="30" y="300" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="12" fill="#b85450" font-weight="bold">n ≤ 4 特判：</text>
  <text x="180" y="322" font-size="12" fill="#444">clumsy(1)=1, clumsy(2)=2, clumsy(3)=6, clumsy(4)=7</text>
  <text x="50" y="340" font-size="11" fill="#888">这 4 个不满足 k≥5 的化简条件，单独返回即可</text>
</svg>
