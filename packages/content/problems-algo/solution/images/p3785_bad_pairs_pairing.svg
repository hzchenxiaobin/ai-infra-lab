<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：坏位修复 —— 异值配对一换修俩，同值抱团逐个单修</text>

  <!-- ========= 左面板：示例 2 具体演算 ========= -->
  <text x="14" y="54" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 示例 2：3 个坏位，2 次修完</text>

  <text x="16" y="92" font-size="10" fill="#666" filter="url(#rough2)">nums</text>
  <!-- nums 行：4 6 6 5，坏位 0/1/3 红，好位 2 绿 -->
  <g filter="url(#rough2)">
    <rect x="60" y="72" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="108" y="72" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="156" y="72" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="204" y="72" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="81" y="92" text-anchor="middle" font-size="12.5" fill="#333">4</text>
    <text x="129" y="92" text-anchor="middle" font-size="12.5" fill="#333">6</text>
    <text x="177" y="92" text-anchor="middle" font-size="12.5" fill="#333">6</text>
    <text x="225" y="92" text-anchor="middle" font-size="12.5" fill="#333">5</text>
  </g>

  <text x="16" y="127" font-size="10" fill="#666" filter="url(#rough2)">禁值</text>
  <!-- forbidden 行：4 6 5 5 -->
  <g filter="url(#rough2)">
    <rect x="60" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="108" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="156" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="204" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="81" y="125" text-anchor="middle" font-size="11" fill="#777">4</text>
    <text x="129" y="125" text-anchor="middle" font-size="11" fill="#777">6</text>
    <text x="177" y="125" text-anchor="middle" font-size="11" fill="#777">5</text>
    <text x="225" y="125" text-anchor="middle" font-size="11" fill="#777">5</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#888">
    <text x="81" y="146" text-anchor="middle">i=0</text>
    <text x="129" y="146" text-anchor="middle">i=1</text>
    <text x="177" y="146" text-anchor="middle">i=2</text>
    <text x="225" y="146" text-anchor="middle">i=3</text>
  </g>

  <!-- swap 弧线 -->
  <path d="M 81 154 C 81 176, 177 176, 177 154" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="129" y="182" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">swap(0,2)：坏位↔安全位，单修</text>
  <path d="M 129 192 C 129 214, 225 214, 225 192" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="177" y="226" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">swap(1,3)：异值坏位互救，一换修俩</text>

  <text x="14" y="250" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">两步后 [6,5,4,6] 全合规 = max(⌈3/2⌉, 1) = 2</text>

  <!-- ========= 右面板：同值坏位互救无效 ========= -->
  <text x="278" y="54" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 同值坏位：互救无效</text>

  <g filter="url(#rough2)">
    <rect x="296" y="72" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="384" y="72" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="317" y="92" text-anchor="middle" font-size="12.5" fill="#333">v</text>
    <text x="405" y="92" text-anchor="middle" font-size="12.5" fill="#333">v</text>
    <rect x="296" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="384" y="108" width="42" height="26" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="317" y="125" text-anchor="middle" font-size="11" fill="#777">v</text>
    <text x="405" y="125" text-anchor="middle" font-size="11" fill="#777">v</text>
  </g>

  <path d="M 342 87 L 380 87" stroke="#446688" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="78" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">swap</text>

  <text x="278" y="156" font-size="10.5" fill="#b85450" filter="url(#rough2)">互换 v ↔ v，坏位纹丝不动</text>

  <g filter="url(#rough2)">
    <rect x="272" y="166" width="232" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="388" y="186" text-anchor="middle" font-size="10.5" fill="#8a6d1f">每次交换至多修复 1 个值为 v 的坏位</text>
    <text x="388" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d1f">⇒ b_v 个同值坏位至少要 b_v 次交换</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="272" y="230" width="232" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="388" y="249" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">单修搭档 = 安全位 j</text>
    <text x="388" y="266" text-anchor="middle" font-size="10" fill="#2f5d24">nums[j]≠v 且 forbidden[j]≠v，永远够用</text>
  </g>

  <!-- ========= 底部公式 ========= -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="400" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#33506b">k = 坏位总数 ⇒ 下界 ⌈k/2⌉ ；m = 最大同值坏位簇 ⇒ 下界 m</text>
    <text x="260" y="338" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold">ans = max( ⌈k/2⌉ , m )</text>
  </g>
</svg>
