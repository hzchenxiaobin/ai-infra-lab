<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心：按 booking_time 排序取序号 rn，rn ≤ capacity → Confirmed</text>

  <!-- flight label + capacity pill -->
  <text x="36" y="104" font-size="13" fill="#888" font-weight="bold">航班 1</text>
  <rect x="36" y="112" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">capacity=2</text>

  <!-- ordering bracket -->
  <path d="M140,74 Q140,66 148,66 L336,66 Q344,66 344,74" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="242" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">按 booking_time 升序</text>

  <!-- passenger boxes: 103(12:00) 101(16:30) green ; 102(17:45) orange -->
  <g font-size="16" font-weight="bold">
    <rect x="140" y="76" width="64" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="172" y="100" text-anchor="middle" fill="#333">103</text>
    <text x="172" y="120" text-anchor="middle" fill="#888" font-size="10">12:00</text>

    <rect x="210" y="76" width="64" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="242" y="100" text-anchor="middle" fill="#333">101</text>
    <text x="242" y="120" text-anchor="middle" fill="#888" font-size="10">16:30</text>

    <rect x="280" y="76" width="64" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="312" y="100" text-anchor="middle" fill="#333">102</text>
    <text x="312" y="120" text-anchor="middle" fill="#888" font-size="10">17:45</text>
  </g>

  <!-- rn labels below -->
  <g font-size="11" fill="#aaa">
    <text x="172" y="148" text-anchor="middle">rn=1</text>
    <text x="242" y="148" text-anchor="middle">rn=2</text>
    <text x="312" y="148" text-anchor="middle">rn=3</text>
  </g>

  <!-- capacity cutoff dashed line -->
  <path d="M277,68 L277,172" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="282" y="76" font-size="11" fill="#b85450" font-weight="bold">capacity 截断</text>

  <!-- confirmed / waitlist spans -->
  <path d="M140,162 Q140,170 148,170 L266,170 Q274,170 274,162" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Confirmed ✓ (rn ≤ 2)</text>

  <path d="M280,162 Q280,170 288,170 L336,170 Q344,170 344,162" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Waitlist ✗</text>

  <!-- formula box -->
  <rect x="40" y="212" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rn = ROW_NUMBER() OVER (PARTITION BY flight_id ORDER BY booking_time)</text>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">status = CASE WHEN rn ≤ capacity THEN 'Confirmed' ELSE 'Waitlist' END</text>

  <!-- key insight -->
  <rect x="40" y="288" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">明细必须排序（ROW_NUMBER 定序号）· booking_time 定先后</text>
  <text x="270" y="320" text-anchor="middle" font-size="10" fill="#6688aa">对照 2783 聚合版：只需 LEAST/GREATEST 计数，无需排序</text>
</svg>
