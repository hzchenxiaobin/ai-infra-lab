  <rect x="40" y="104" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="100" y="104" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="180" y="104" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
