  <rect x="270" y="104" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="11" fill="#555">5</text>
  <rect x="350" y="104" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="450" y="104" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- Row zone 8 -->
  <rect x="40" y="134" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="100" y="134" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="180" y="134" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="152" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="270" y="134" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#555">8</text>
  <rect x="350" y="134" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="450" y="134" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">17</text>

  <!-- Row zone 9 -->
  <rect x="40" y="164" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="100" y="164" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
