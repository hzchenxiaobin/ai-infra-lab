<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：numArrows=9, alice=[1,1,0,1,0,0,2,1,0,1,2,0]</text>

  <!-- Table header -->
  <rect x="40" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">区域 k</text>
  <rect x="100" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">alice[k]</text>
  <rect x="180" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">代价 = alice+1</text>
  <rect x="270" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">得分 k</text>
  <rect x="350" y="44" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累计代价</text>
  <rect x="450" y="44" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累计得分</text>

  <!-- Row zone 4 -->
  <rect x="40" y="74" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="100" y="74" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="180" y="74" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="92" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="270" y="74" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="11" fill="#555">4</text>
  <rect x="350" y="74" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="450" y="74" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

