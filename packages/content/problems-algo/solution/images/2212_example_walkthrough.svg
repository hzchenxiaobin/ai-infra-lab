  <rect x="180" y="164" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="182" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="270" y="164" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="182" text-anchor="middle" font-size="11" fill="#555">9</text>
  <rect x="350" y="164" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="450" y="164" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">26</text>

  <!-- Row zone 10 -->
  <rect x="40" y="194" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <rect x="100" y="194" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="180" y="194" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="212" text-anchor="middle" font-size="11" fill="#555">3</text>
  <rect x="270" y="194" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="11" fill="#555">10</text>
  <rect x="350" y="194" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>
  <rect x="450" y="194" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">36</text>

  <!-- Row zone 11 -->
  <rect x="40" y="224" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">11</text>
  <rect x="100" y="224" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="180" y="224" width="90" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="242" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="270" y="224" width="80" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="242" text-anchor="middle" font-size="11" fill="#555">11</text>
  <rect x="350" y="224" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9 ✓</text>
  <rect x="450" y="224" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="500" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">47 ✓</text>

  <!-- summary box -->
  <rect x="60" y="276" width="440" height="48" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总代价 = 9 = numArrows → 恰好用完，无需补 0 号区</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">bobArrows = [0,0,0,0,1,1,0,0,1,2,3,1]，得分 = 47</text>

  <!-- note -->
  <rect x="60" y="340" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为何不赢 6 号区？alice=2 需 3 支，但 6 分 &lt; 3 支代价</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 同样 3 支投到 10 号区（alice=2）得 10 分更划算</text>
</svg>
