<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 4 / 2 / 7 的字符频次校验</text>

  <text x="30" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① n = 4（偶）→ 输出 "pppz"</text>

  <rect x="40" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="78" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="116" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="154" y="68" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">z</text>

  <text x="210" y="88" font-size="11" fill="#333" filter="url(#rough2)">p×3（奇）✓　z×1（奇）✓　3+1=4</text>

  <text x="30" y="132" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② n = 2（偶）→ 输出 "xy"</text>

  <rect x="40" y="142" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="78" y="142" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y</text>

  <text x="130" y="162" font-size="11" fill="#333" filter="url(#rough2)">x×1（奇）✓　y×1（奇）✓　1+1=2</text>

  <text x="30" y="206" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ n = 7（奇）→ 输出 "aaaaaaa"（算法构造）</text>

  <rect x="40" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="72" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="104" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="136" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="168" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="200" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="232" y="216" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="290" y="236" font-size="11" fill="#333" filter="url(#rough2)">count(a)=7（奇）✓　只用 1 种字符</text>

  <rect x="30" y="268" width="480" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">频次校验汇总</text>

  <text x="50" y="314" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">n</text>
  <text x="110" y="314" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶</text>
  <text x="180" y="314" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">构造输出</text>
  <text x="330" y="314" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">各字符频次</text>
  <text x="470" y="314" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">合法?</text>

  <text x="50" y="336" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="110" y="336" font-size="12" fill="#b85450" filter="url(#rough2)">偶</text>
  <text x="180" y="336" font-size="12" fill="#333" filter="url(#rough2)">"pppz" / "aaab"</text>
  <text x="330" y="336" font-size="12" fill="#333" filter="url(#rough2)">p×3, z×1</text>
  <text x="470" y="336" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="50" y="358" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="110" y="358" font-size="12" fill="#b85450" filter="url(#rough2)">偶</text>
  <text x="180" y="358" font-size="12" fill="#333" filter="url(#rough2)">"xy" / "ab"</text>
  <text x="330" y="358" font-size="12" fill="#333" filter="url(#rough2)">x×1, y×1</text>
  <text x="470" y="358" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="50" y="380" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="110" y="380" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="180" y="380" font-size="12" fill="#333" filter="url(#rough2)">"aaaaaaa"</text>
  <text x="330" y="380" font-size="12" fill="#333" filter="url(#rough2)">a×7</text>
  <text x="470" y="380" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="50" y="400" font-size="11" fill="#888" filter="url(#rough2)">注：题目允许任意合法串，官方示例与算法构造均正确</text>
</svg>
