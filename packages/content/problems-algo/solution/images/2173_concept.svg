<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双 ROW_NUMBER 差值识别连胜「岛」</text>
  <text x="320" y="46" text-anchor="middle" font-size="10" fill="#888">player_id = 1 的比赛记录，按 match_day 排序</text>

  <!-- ===== Table ===== -->
  <rect x="48" y="64" width="384" height="220" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <text x="68" y="84" font-size="10" fill="#446688" font-weight="bold">match_day</text>
  <text x="186" y="84" font-size="10" fill="#446688" font-weight="bold">result</text>
  <text x="262" y="84" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">rn</text>
  <text x="320" y="84" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">result_rn</text>
  <text x="400" y="84" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">grp</text>
  <line x1="48" y1="92" x2="432" y2="92" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 01-17 Win 1 1 0 -->
  <rect x="50" y="98" width="380" height="24" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <text x="68" y="114" font-size="10" fill="#4a7a3a" font-weight="bold">2022-01-17</text>
  <text x="186" y="114" font-size="10" fill="#4a7a3a" font-weight="bold">Win</text>
  <text x="262" y="114" font-size="10" fill="#4a7a3a" text-anchor="middle">1</text>
  <text x="320" y="114" font-size="10" fill="#4a7a3a" text-anchor="middle">1</text>
  <text x="400" y="114" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>

  <!-- Row 2: 01-18 Win 2 2 0 -->
  <rect x="50" y="122" width="380" height="24" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <text x="68" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">2022-01-18</text>
  <text x="186" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">Win</text>
  <text x="262" y="138" font-size="10" fill="#4a7a3a" text-anchor="middle">2</text>
  <text x="320" y="138" font-size="10" fill="#4a7a3a" text-anchor="middle">2</text>
  <text x="400" y="138" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>

  <!-- Row 3: 01-25 Win 3 3 0 -->
  <rect x="50" y="146" width="380" height="24" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <text x="68" y="162" font-size="10" fill="#4a7a3a" font-weight="bold">2022-01-25</text>
  <text x="186" y="162" font-size="10" fill="#4a7a3a" font-weight="bold">Win</text>
  <text x="262" y="162" font-size="10" fill="#4a7a3a" text-anchor="middle">3</text>
  <text x="320" y="162" font-size="10" fill="#4a7a3a" text-anchor="middle">3</text>
  <text x="400" y="162" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>

  <!-- Row 4: 01-31 Draw 4 1 3 -->
  <rect x="50" y="170" width="380" height="24" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.55"/>
  <text x="68" y="186" font-size="10" fill="#b85450" font-weight="bold">2022-01-31</text>
  <text x="186" y="186" font-size="10" fill="#b85450" font-weight="bold">Draw</text>
  <text x="262" y="186" font-size="10" fill="#b85450" text-anchor="middle">4</text>
  <text x="320" y="186" font-size="10" fill="#b85450" text-anchor="middle">1</text>
  <text x="400" y="186" font-size="11" fill="#b85450" font-weight="bold" text-anchor="middle">3</text>

  <!-- Row 5: 02-08 Win 5 4 1 -->
  <rect x="50" y="194" width="380" height="24" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)" opacity="0.85"/>
  <text x="68" y="210" font-size="10" fill="#d6a040" font-weight="bold">2022-02-08</text>
  <text x="186" y="210" font-size="10" fill="#d6a040" font-weight="bold">Win</text>
  <text x="262" y="210" font-size="10" fill="#d6a040" text-anchor="middle">5</text>
  <text x="320" y="210" font-size="10" fill="#d6a040" text-anchor="middle">4</text>
  <text x="400" y="210" font-size="11" fill="#d6a040" font-weight="bold" text-anchor="middle">1</text>

  <!-- grp formula note under table -->
  <text x="320" y="240" text-anchor="middle" font-size="9" fill="#888" font-style="italic">grp = rn − result_rn（连续同 result → 差值不变；result 切换 → 差值跳变）</text>

  <!-- ===== Right annotations ===== -->
  <!-- Island #0 (3 wins) -->
  <rect x="452" y="100" width="168" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="536" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连胜岛 #0</text>
  <text x="536" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">grp = 0</text>
  <text x="536" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">COUNT(*) = 3</text>
  <!-- arrow rows1-3 -> island0 -->
  <path d="M 432 122 C 442 122, 442 130, 452 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Break box (Draw) -->
  <rect x="452" y="172" width="168" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="536" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">连胜被打断</text>
  <text x="536" y="206" text-anchor="middle" font-size="9" fill="#b85450">result ≠ 'Win' → 非胜场</text>
  <path d="M 432 182 C 442 182, 442 194, 452 194" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Island #1 (1 win) -->
  <rect x="452" y="232" width="168" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="536" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">连胜岛 #1</text>
  <text x="536" y="266" text-anchor="middle" font-size="10" fill="#d6a040">grp = 1，COUNT = 1</text>
  <path d="M 432 206 C 442 206, 442 256, 452 256" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.9"/>

  <!-- ===== Principle note (yellow) ===== -->
  <rect x="40" y="300" width="560" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="11" fill="#d6a040" font-weight="bold">为什么「rn − result_rn」能识别连续段？</text>
  <text x="60" y="342" font-size="10" fill="#555">• rn：按 match_day 排序的行号，每行 +1（与 result 无关）</text>
  <text x="60" y="358" font-size="10" fill="#555">• result_rn：在同一 result 分区内的行号，切换 result 时重置为 1</text>
  <text x="60" y="374" font-size="10" fill="#555">• 连续相同 result 时两者同步 +1 → 差值 <tspan font-weight="bold" fill="#4a7a3a">不变</tspan>（同一岛）；result 切换时 result_rn 重置 → 差值 <tspan font-weight="bold" fill="#b85450">跳变</tspan>（新岛）</text>
  <text x="60" y="388" font-size="10" fill="#555">• 只取 result = 'Win' 的岛，COUNT(*) 即连胜长度，再取 MAX 得最长连胜</text>

  <!-- ===== Bottom: result ===== -->
  <rect x="40" y="408" width="560" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取所有 Win 岛的 COUNT 之 MAX → player 1 最长连胜 = 3</text>
  <text x="320" y="444" text-anchor="middle" font-size="9" fill="#666">岛#0(COUNT 3) 与 岛#1(COUNT 1) 取最大 → 3</text>
</svg>
