<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一层一份计数 + 一棵「影子」有序集合</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3D 矩阵按第一维 x 切成 n 张二维矩阵，每层只需维护 1 的个数 cnt[x]</text>

  <!-- ① 按 x 切层 -->
  <text x="34" y="66" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 按 x 切层（n = 3）</text>

  <!-- 层 0 -->
  <path d="M 90 78 L 190 78 L 228 98 L 128 98 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x=0</text>
  <circle cx="150" cy="85" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="176" cy="92" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <!-- 层 1 -->
  <path d="M 90 120 L 190 120 L 228 140 L 128 140 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x=1</text>
  <circle cx="168" cy="128" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <!-- 层 2 -->
  <path d="M 90 162 L 190 162 L 228 182 L 128 182 Z" fill="#f4f4f4" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="176" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">x=2</text>

  <!-- cnt 徽章 -->
  <path d="M 232 88 L 266 88" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 232 130 L 266 130" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 232 172 L 266 172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="272" y="76" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="92" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">cnt[0] = 2</text>
  <rect x="272" y="118" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="134" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">cnt[1] = 1</text>
  <rect x="272" y="160" width="92" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="176" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cnt[2] = 0</text>

  <text x="368" y="88" font-size="9.5" fill="#666" filter="url(#rough2)">← 计数就是</text>
  <text x="368" y="101" font-size="9.5" fill="#666" filter="url(#rough2)">每层的「1」</text>
  <text x="368" y="114" font-size="9.5" fill="#666" filter="url(#rough2)">的个数</text>

  <!-- ② 有序集合 -->
  <text x="34" y="214" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 影子结构：有序集合，键 = (−cnt[x], x)，按字典序升序</text>

  <text x="176" y="245" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">begin() ⇒</text>
  <path d="M 180 241 L 188 241" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="190" y="228" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="245" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(−2, 0)</text>
  <rect x="190" y="262" width="84" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="232" y="279" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(−1, 1)</text>
  <rect x="190" y="296" width="84" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="232" y="313" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(0, 2)</text>

  <path d="M 280 241 L 298 241" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="302" y="228" width="186" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="247" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">largestMatrix() = 0</text>

  <text x="302" y="274" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">首键 (−2, 0)：1 的个数 2 最大</text>
  <text x="302" y="288" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">→ 层 0，查询 O(1) 读现成答案</text>

  <!-- 洞察框 -->
  <rect x="30" y="336" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">键设计的巧妙：字典序一箭双雕</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">−cnt 最小 ⇒ 该层 1 最多；−cnt 并列 ⇒ x 小者排前 ⇒ 下标最小</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">cnt[x] 每次增删：先 erase 旧键、再 insert 新键，键与计数永远同步</text>
</svg>
