<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单趟扫描 + 两个计数器</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">初始化 balance=0, need=0；逐字符处理 s</text>

  <!-- ===== start ===== -->
  <rect x="220" y="62" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始 balance=need=0</text>

  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== loop decision ===== -->
  <polygon points="280,112 400,160 280,208 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">还有字符?</text>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#888">c = 下一个字符</text>

  <!-- ===== no → end ===== -->
  <path d="M 400 160 L 470 160 L 470 350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="154" font-size="10" fill="#888">否</text>

  <rect x="380" y="344" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 balance + need</text>
  <text x="470" y="378" text-anchor="middle" font-size="10" fill="#555">即最少添加数</text>

  <!-- ===== yes → char type ===== -->
  <path d="M 280 208 L 280 226" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="222" font-size="10" fill="#888">是</text>

  <polygon points="280,228 380,268 280,308 180,268" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c 的类型?</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#888">'(' 或 ')'</text>

  <!-- ===== left branch ===== -->
  <path d="M 180 268 L 90 268 L 90 330" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="262" font-size="10" fill="#446688" font-weight="bold">c == '('</text>

  <rect x="30" y="332" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">balance++</text>
  <text x="90" y="366" text-anchor="middle" font-size="10" fill="#555">多一个待闭合 '('</text>

  <!-- loop back from left -->
  <path d="M 90 332 L 90 160 L 160 160" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== right branch ===== -->
  <path d="M 380 268 L 470 268" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="262" font-size="10" fill="#b85450" font-weight="bold">c == ')'</text>

  <polygon points="470,232 540,268 470,304 400,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">balance&gt;0?</text>

  <!-- balance>0: pop -->
  <path d="M 400 268 L 360 268 L 360 330" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="262" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="300" y="332" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">balance--</text>
  <text x="360" y="366" text-anchor="middle" font-size="10" fill="#555">配对一个 '('</text>

  <!-- balance==0: need++ -->
  <path d="M 540 268 L 540 318" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="296" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <rect x="470" y="320" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="515" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">need++</text>
  <text x="515" y="350" text-anchor="middle" font-size="9" fill="#555">缺一个 '('</text>

  <!-- loop back from right branches -->
  <path d="M 360 332 L 360 130 L 280 130 L 280 112" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 515 320 L 515 130 L 280 130" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
</svg>
