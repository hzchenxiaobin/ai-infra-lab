<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三操作流水线：共用闸门①（编号合法），withdraw/transfer 额外过闸门②（余额充足）</text>

  <!-- Column headers -->
  <text x="70" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="225" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">闸门① 编号合法</text>
  <text x="395" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">闸门② 余额充足</text>
  <text x="555" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">动作</text>
  <text x="665" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果</text>

  <!-- ============ Row 1: deposit (y center = 110) ============ -->
  <rect x="20" y="95" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">deposit</text>
  <line x1="120" y1="111" x2="150" y2="111" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="95" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="115" text-anchor="middle" font-size="11" fill="#2f5a22">1 ≤ acc ≤ n ✓</text>
  <line x1="300" y1="111" x2="330" y2="111" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="95" width="130" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="395" y="115" text-anchor="middle" font-size="11" fill="#999">不适用</text>
  <line x1="460" y1="111" x2="490" y2="111" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="95" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="555" y="115" text-anchor="middle" font-size="11" fill="#333">bal[acc−1] += m</text>
  <line x1="620" y1="111" x2="640" y2="111" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="640" y="95" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="670" y="115" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold">true</text>

  <!-- ============ Row 2: withdraw (y center = 200) ============ -->
  <rect x="20" y="185" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">withdraw</text>
  <line x1="120" y1="201" x2="150" y2="201" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="185" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="205" text-anchor="middle" font-size="11" fill="#2f5a22">1 ≤ acc ≤ n ✓</text>
  <line x1="300" y1="201" x2="330" y2="201" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="185" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="395" y="205" text-anchor="middle" font-size="11" fill="#a87a26" font-weight="bold">bal ≥ m ✓</text>
  <line x1="460" y1="201" x2="490" y2="201" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="185" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="555" y="205" text-anchor="middle" font-size="11" fill="#333">bal[acc−1] −= m</text>
  <line x1="620" y1="201" x2="640" y2="201" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="640" y="185" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="670" y="205" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold">true</text>

  <!-- ============ Row 3: transfer (y center = 290) ============ -->
  <rect x="20" y="275" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="295" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">transfer</text>
  <line x1="120" y1="291" x2="150" y2="291" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="275" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="295" text-anchor="middle" font-size="11" fill="#2f5a22">1 ≤ a1,a2 ≤ n ✓</text>
  <line x1="300" y1="291" x2="330" y2="291" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="275" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="395" y="295" text-anchor="middle" font-size="11" fill="#a87a26" font-weight="bold">bal1 ≥ m ✓</text>
  <line x1="460" y1="291" x2="490" y2="291" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="275" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="555" y="292" text-anchor="middle" font-size="10" fill="#333">bal[a1−1]−=m</text>
  <text x="555" y="304" text-anchor="middle" font-size="10" fill="#333">bal[a2−1]+=m</text>
  <line x1="620" y1="291" x2="640" y2="291" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="640" y="275" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="670" y="295" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold">true</text>

  <!-- Fail branch note -->
  <rect x="150" y="334" width="420" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="354" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">任一闸门 ✗ → return false（不修改任何余额）</text>
  <line x1="395" y1="217" x2="395" y2="334" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="225" y1="127" x2="225" y2="334" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
</svg>
