<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">因子成对出现：只有完全平方数的因子个数为奇</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">灯泡 k 被切换 d(k) 次（其因子个数）；奇数次 → 亮，偶数次 → 灭</text>

  <!-- ===== Left panel: k = 6 (non-square) ===== -->
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k = 6　（非完全平方数）</text>
  <text x="140" y="94" text-anchor="middle" font-size="10" fill="#888">因子：1, 2, 3, 6　共 4 个 → 偶 → 灭</text>

  <g filter="url(#rough2)">
    <!-- pair (1, 6) -->
    <circle cx="70" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
    <circle cx="210" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="210" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
    <path d="M 86 130 L 194 130" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="140" y="124" text-anchor="middle" font-size="9" fill="#446688">1 × 6 = 6</text>

    <!-- pair (2, 3) -->
    <circle cx="90" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <circle cx="190" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <path d="M 105 190 L 175 190" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="140" y="184" text-anchor="middle" font-size="9" fill="#446688">2 × 3 = 6</text>
  </g>

  <text x="140" y="236" text-anchor="middle" font-size="10" fill="#888">2 对配对 × 每对 2 个 = 4 个因子（偶）</text>

  <!-- bulb off -->
  <circle cx="140" cy="280" r="20" fill="#fff" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="16" fill="#888">○</text>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">灯泡 6 → 灭</text>

  <!-- ===== Right panel: k = 9 (square) ===== -->
  <text x="420" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k = 9　（完全平方数 = 3²）</text>
  <text x="420" y="94" text-anchor="middle" font-size="10" fill="#888">因子：1, 3, 9　共 3 个 → 奇 → 亮</text>

  <g filter="url(#rough2)">
    <!-- pair (1, 9) -->
    <circle cx="350" cy="130" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="350" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <circle cx="490" cy="130" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="490" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
    <path d="M 366 130 L 474 130" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="420" y="124" text-anchor="middle" font-size="9" fill="#b85450">1 × 9 = 9</text>

    <!-- self-pair (3, 3) -->
    <circle cx="420" cy="190" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="420" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
    <!-- self loop -->
    <path d="M 437 184 C 470 176 470 204 437 196" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)"/>
    <text x="486" y="184" font-size="9" fill="#d6a040">自配</text>
    <text x="486" y="196" font-size="9" fill="#d6a040">3 × 3 = 9</text>
  </g>

  <text x="420" y="236" text-anchor="middle" font-size="10" fill="#888">1 对配对（2 个）+ 1 个自配 = 3 个因子（奇）</text>

  <!-- bulb on -->
  <circle cx="420" cy="280" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="16" fill="#d6a040">●</text>
  <text x="420" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">灯泡 9 → 亮 ⭐</text>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="340" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结论：d(k) 为奇 ⇔ k 是完全平方数 ⇔ k = m²</text>
</svg>
