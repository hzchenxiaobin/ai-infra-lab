<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：方向数组顺时针排列，转向 = 下标取模</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">北→东→南→西 循环，右转 +1，左转 +3（等价 −1），均 mod 4</text>

  <!-- ===== Left: compass ===== -->
  <rect x="24" y="56" width="230" height="284" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="139" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">方向罗盘（顺时针）</text>

  <!-- compass circle -->
  <circle cx="139" cy="180" r="74" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- North (index 0) -->
  <rect x="120" y="112" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">北</text>
  <text x="180" y="124" font-size="9.5" fill="#4a7a3a">d=0</text>
  <text x="180" y="136" font-size="9" fill="#888">(0,1)</text>

  <!-- East (index 1) -->
  <rect x="168" y="168" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">东</text>
  <text x="212" y="180" font-size="9.5" fill="#d6a040">d=1</text>
  <text x="212" y="192" font-size="9" fill="#888">(1,0)</text>

  <!-- South (index 2) -->
  <rect x="120" y="222" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">南</text>
  <text x="180" y="234" font-size="9.5" fill="#b85450">d=2</text>
  <text x="180" y="246" font-size="9" fill="#888">(0,-1)</text>

  <!-- West (index 3) -->
  <rect x="72" y="168" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">西</text>
  <text x="40" y="180" font-size="9.5" fill="#446688">d=3</text>
  <text x="40" y="192" font-size="9" fill="#888">(-1,0)</text>

  <!-- clockwise arrows (right turn direction) -->
  <path d="M 158 130 Q 180 150 175 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 175 196 Q 170 215 148 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 120 224 Q 100 215 103 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 103 168 Q 100 150 120 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- center origin -->
  <circle cx="139" cy="181" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="139" y="286" text-anchor="middle" font-size="9.5" fill="#888">绿色弧 = 右转方向（顺时针）</text>
  <text x="139" y="302" text-anchor="middle" font-size="9.5" fill="#888">dirs = [(0,1),(1,0),(0,-1),(-1,0)]</text>
  <text x="139" y="318" text-anchor="middle" font-size="9.5" fill="#888">初始 d = 0（面朝北）</text>

  <!-- ===== Right: turning rules ===== -->
  <rect x="270" y="56" width="226" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="383" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">指令 −1：右转 90°</text>
  <text x="383" y="94" text-anchor="middle" font-size="10.5" fill="#555">d = (d + 1) % 4</text>
  <!-- example: d=0 -> d=1 -->
  <rect x="300" y="104" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="10.5" fill="#333">d=0</text>
  <text x="320" y="142" text-anchor="middle" font-size="9" fill="#888">北</text>
  <path d="M 342 116 L 380 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="361" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
  <rect x="386" y="104" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="120" text-anchor="middle" font-size="10.5" fill="#333">d=1</text>
  <text x="406" y="142" text-anchor="middle" font-size="9" fill="#888">东</text>
  <rect x="440" y="104" width="40" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="120" text-anchor="middle" font-size="9.5" fill="#888">d=3</text>
  <text x="460" y="142" text-anchor="middle" font-size="9" fill="#888">西</text>
  <path d="M 440 116 L 422 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="431" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
  <text x="383" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3→0：3+1=4，4%4=0 ✓</text>

  <rect x="270" y="200" width="226" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="383" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">指令 −2：左转 90°</text>
  <text x="383" y="238" text-anchor="middle" font-size="10.5" fill="#555">d = (d + 3) % 4</text>
  <rect x="300" y="248" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#333">d=0</text>
  <text x="320" y="286" text-anchor="middle" font-size="9" fill="#888">北</text>
  <path d="M 342 260 L 380 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="361" y="254" text-anchor="middle" font-size="9" fill="#d6a040">+3</text>
  <rect x="386" y="248" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="264" text-anchor="middle" font-size="10.5" fill="#333">d=3</text>
  <text x="406" y="286" text-anchor="middle" font-size="9" fill="#888">西</text>
  <rect x="440" y="248" width="40" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="264" text-anchor="middle" font-size="9.5" fill="#888">d=1</text>
  <text x="460" y="286" text-anchor="middle" font-size="9" fill="#888">东</text>
  <path d="M 440 260 L 422 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="431" y="254" text-anchor="middle" font-size="9" fill="#d6a040">+3</text>
  <text x="383" y="306" text-anchor="middle" font-size="9.5" fill="#d6a040">1→0：1+3=4，4%4=0 ✓</text>

  <!-- bottom note -->
  <rect x="270" y="342" width="226" height="0" fill="none"/>
</svg>
