<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,3,4,7,8]，d = 5（余数 [3,3,4,2,3]）</text>

  <rect x="28" y="44" width="504" height="284" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <rect x="30" y="94" width="500" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="146" width="500" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="224" width="500" height="26" fill="#e6f4ea" filter="url(#rough2)"/>

  <text x="72" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">L（值）</text>
  <text x="142" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">R（值）</text>
  <text x="212" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">两端和</text>
  <text x="274" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">need</text>
  <text x="360" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">查 cnt[need]</text>
  <text x="472" y="60" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">插入 r[R]</text>

  <line x1="30" y1="68" x2="530" y2="68" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="72" y="85" text-anchor="middle" font-size="12" fill="#333">0（3）</text>
  <text x="142" y="85" text-anchor="middle" font-size="12" fill="#333">1（3）</text>
  <text x="212" y="85" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="274" y="85" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="360" y="85" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="85" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <text x="142" y="111" text-anchor="middle" font-size="12" fill="#333">2（4）</text>
  <text x="212" y="111" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="274" y="111" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="360" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 ✓ (0,1,2)</text>
  <text x="472" y="111" text-anchor="middle" font-size="12" fill="#333">+4</text>

  <text x="142" y="137" text-anchor="middle" font-size="12" fill="#333">3（7）</text>
  <text x="212" y="137" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="274" y="137" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="137" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="137" text-anchor="middle" font-size="12" fill="#333">+2</text>

  <text x="142" y="163" text-anchor="middle" font-size="12" fill="#333">4（8）</text>
  <text x="212" y="163" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="274" y="163" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="360" y="163" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 ✓ (0,2,4)</text>
  <text x="472" y="163" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <text x="72" y="189" text-anchor="middle" font-size="12" fill="#333">1（3）</text>
  <text x="142" y="189" text-anchor="middle" font-size="12" fill="#333">2（4）</text>
  <text x="212" y="189" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="274" y="189" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="360" y="189" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="189" text-anchor="middle" font-size="12" fill="#333">+4</text>

  <text x="142" y="215" text-anchor="middle" font-size="12" fill="#333">3（7）</text>
  <text x="212" y="215" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="274" y="215" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="215" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="215" text-anchor="middle" font-size="12" fill="#333">+2</text>

  <text x="142" y="241" text-anchor="middle" font-size="12" fill="#333">4（8）</text>
  <text x="212" y="241" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="274" y="241" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="360" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 ✓ (1,2,4)</text>
  <text x="472" y="241" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <text x="72" y="267" text-anchor="middle" font-size="12" fill="#333">2（4）</text>
  <text x="142" y="267" text-anchor="middle" font-size="12" fill="#333">3（7）</text>
  <text x="212" y="267" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="274" y="267" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="360" y="267" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="267" text-anchor="middle" font-size="12" fill="#333">+2</text>

  <text x="142" y="293" text-anchor="middle" font-size="12" fill="#333">4（8）</text>
  <text x="212" y="293" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="274" y="293" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="360" y="293" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="293" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <text x="72" y="319" text-anchor="middle" font-size="12" fill="#333">3（7）</text>
  <text x="142" y="319" text-anchor="middle" font-size="12" fill="#333">4（8）</text>
  <text x="212" y="319" text-anchor="middle" font-size="12" fill="#333">15</text>
  <text x="274" y="319" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="319" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="472" y="319" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <line x1="30" y1="94" x2="530" y2="94" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="120" x2="530" y2="120" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="146" x2="530" y2="146" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="172" x2="530" y2="172" stroke="#999999" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="30" y1="198" x2="530" y2="198" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="224" x2="530" y2="224" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="250" x2="530" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="30" y1="276" x2="530" y2="276" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="302" x2="530" y2="302" stroke="#cccccc" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="344" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="369" text-anchor="middle" font-size="12" fill="#333">ans = 3：命中 (0,1,2)、(0,2,4)、(1,2,4)，和为 10、15、15，均被 5 整除 ✓</text>

  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#888">查询时 cnt 只含严格介于 L、R 之间的元素余数（先查后插），</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#888">R 自己此刻还不能入表——否则 (L, R, R) 这种重复下标会被多算</text>
</svg>
