<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：n = 37,  limit = 9  →  b = 14</text>

  <!-- ===== b-search table ===== -->
  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="60" y="46" width="400" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- data rows -->
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="400" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="118" width="400" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <!-- vertical separators -->
  <g stroke="#888" stroke-width="1" filter="url(#rough2)">
    <line x1="105" y1="46" x2="105" y2="154"/>
    <line x1="150" y1="46" x2="150" y2="154"/>
    <line x1="220" y1="46" x2="220" y2="154"/>
    <line x1="380" y1="46" x2="380" y2="154"/>
  </g>

  <!-- header text -->
  <g filter="url(#rough2)" font-size="12" fill="#334455" text-anchor="middle">
    <text x="82" y="69">b</text>
    <text x="127" y="69">Lb</text>
    <text x="185" y="69">digitSum</text>
    <text x="300" y="69">totalCap = b·(9−3−Lb) − digitSum</text>
    <text x="420" y="69">≥ 37 ?</text>
  </g>

  <!-- data text -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <!-- b=13 -->
    <text x="82" y="105">13</text>
    <text x="127" y="105">2</text>
    <text x="185" y="105">17</text>
    <text x="300" y="105">13×4 − 17 = 35</text>
    <text x="420" y="105" fill="#999">否</text>
    <!-- b=14 (hit) -->
    <text x="82" y="141" fill="#7a4a10" font-weight="bold">14</text>
    <text x="127" y="141" fill="#7a4a10">2</text>
    <text x="185" y="141" fill="#7a4a10">19</text>
    <text x="300" y="141" fill="#b85450" font-weight="bold">14×4 − 19 = 37</text>
    <text x="420" y="141" fill="#d6a040" font-weight="bold">是 ✓</text>
  </g>

  <!-- ===== split illustration ===== -->
  <text x="280" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">切分：9 部分各 3 字 + 5 部分各 2 字 = 27 + 10 = 37</text>

  <!-- part 1 sample : content 3 + suffix 6 = 9 -->
  <g filter="url(#rough2)">
    <rect x="80" y="196" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="116" y="221" text-anchor="middle" font-size="13" fill="#334455">thi</text>
    <rect x="152" y="196" width="144" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="224" y="221" text-anchor="middle" font-size="13" fill="#7a4a10">&lt;1/14&gt;</text>
    <text x="320" y="221" text-anchor="start" font-size="12" fill="#888">内容 3 + 后缀 6 = 9</text>
  </g>
  <text x="116" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 1–9 部分</text>

  <!-- part 10 sample : content 2 + suffix 7 = 9 -->
  <g filter="url(#rough2)">
    <rect x="80" y="262" width="48" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="104" y="287" text-anchor="middle" font-size="13" fill="#334455">me</text>
    <rect x="128" y="262" width="168" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <text x="212" y="287" text-anchor="middle" font-size="13" fill="#7a4a10">&lt;10/14&gt;</text>
    <text x="320" y="287" text-anchor="start" font-size="12" fill="#888">内容 2 + 后缀 7 = 9</text>
  </g>
  <text x="148" y="318" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 10–14 部分</text>

  <!-- answer caption -->
  <g filter="url(#rough2)">
    <rect x="130" y="334" width="300" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">14 部分，每段总长 = 9 = limit ✓</text>
  </g>
</svg>
