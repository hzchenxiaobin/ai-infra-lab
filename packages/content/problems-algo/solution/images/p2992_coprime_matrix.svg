<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：数字 k 只能放进与它互质的位置 i（gcd(i, k) = 1）</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">n = 6 的兼容矩阵：行 = 位置 i，列 = 数字 k；✓ 可放 / ✗ 禁放</text>

  <!-- captions -->
  <text x="88" y="58" text-anchor="start" font-size="11" fill="#777" filter="url(#rough2)">位置 i ↓</text>
  <text x="328" y="58" text-anchor="end" font-size="11" fill="#777" filter="url(#rough2)">数字 k →</text>

  <!-- column headers -->
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="108" y="70" text-anchor="middle">1</text>
    <text x="148" y="70" text-anchor="middle">2</text>
    <text x="188" y="70" text-anchor="middle">3</text>
    <text x="228" y="70" text-anchor="middle">4</text>
    <text x="268" y="70" text-anchor="middle">5</text>
    <text x="308" y="70" text-anchor="middle">6</text>
  </g>

  <!-- row headers -->
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="80" y="99" text-anchor="end">i=1</text>
    <text x="80" y="139" text-anchor="end">i=2</text>
    <text x="80" y="179" text-anchor="end">i=3</text>
    <text x="80" y="219" text-anchor="end">i=4</text>
    <text x="80" y="259" text-anchor="end">i=5</text>
    <text x="80" y="299" text-anchor="end">i=6</text>
  </g>

  <!-- grid row 1: all coprime -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="148" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="168" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="188" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="208" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="228" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="248" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="268" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="288" y="74" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="308" y="99" text-anchor="middle" fill="#2e5c22">✓</text>
  </g>

  <!-- grid row 2: odd k only -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="114" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="139" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="114" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="148" y="139" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="168" y="114" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="188" y="139" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="208" y="114" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="228" y="139" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="248" y="114" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="268" y="139" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="288" y="114" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="308" y="139" text-anchor="middle" fill="#8c3a36">✗</text>
  </g>

  <!-- grid row 3: k not divisible by 3 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="154" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="179" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="154" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="148" y="179" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="168" y="154" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="188" y="179" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="208" y="154" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="228" y="179" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="248" y="154" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="268" y="179" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="288" y="154" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="308" y="179" text-anchor="middle" fill="#8c3a36">✗</text>
  </g>

  <!-- grid row 4: odd k only, highlight cell (i=4, k=2) -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="194" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="219" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="194" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.8"/>
    <text x="148" y="219" text-anchor="middle" fill="#8c3a36" font-weight="bold">✗</text>
    <rect x="168" y="194" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="188" y="219" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="208" y="194" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="228" y="219" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="248" y="194" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="268" y="219" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="288" y="194" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="308" y="219" text-anchor="middle" fill="#8c3a36">✗</text>
  </g>

  <!-- grid row 5: all but k=5, highlight cell (i=5, k=3) -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="234" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="259" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="234" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="148" y="259" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="168" y="234" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8"/>
    <text x="188" y="259" text-anchor="middle" fill="#2e5c22" font-weight="bold">✓</text>
    <rect x="208" y="234" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="228" y="259" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="248" y="234" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="268" y="259" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="288" y="234" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="308" y="259" text-anchor="middle" fill="#2e5c22">✓</text>
  </g>

  <!-- grid row 6: only k=1,5 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="88" y="274" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="108" y="299" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="128" y="274" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="148" y="299" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="168" y="274" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="188" y="299" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="208" y="274" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="228" y="299" text-anchor="middle" fill="#8c3a36">✗</text>
    <rect x="248" y="274" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="268" y="299" text-anchor="middle" fill="#2e5c22">✓</text>
    <rect x="288" y="274" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="308" y="299" text-anchor="middle" fill="#8c3a36">✗</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="208" y="332" text-anchor="middle">如 i=4 放 k=2：gcd=2 ✗；i=5 放 k=3：gcd=1 ✓</text>
    <text x="208" y="350" text-anchor="middle">第 1 行全 ✓：gcd(1,k)=1，数字 1 可放任何位置</text>
  </g>

  <!-- right box 1: permanent -->
  <rect x="352" y="88" width="192" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#33507a">
    <text x="448" y="110" text-anchor="middle" font-weight="bold">答案 = 矩阵的积和式</text>
    <text x="448" y="132" text-anchor="middle">每行恰选一个 ✓ 格</text>
    <text x="448" y="152" text-anchor="middle">每列（数字）恰用一次</text>
    <text x="448" y="172" text-anchor="middle">合法选法数 = 合法排列数</text>
    <text x="448" y="192" text-anchor="middle">状压 DP 求 permanent</text>
  </g>

  <!-- right box 2: relation with 526 -->
  <rect x="352" y="228" width="192" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#b07818">
    <text x="448" y="250" text-anchor="middle" font-weight="bold" font-size="12">与 526 同构</text>
    <text x="448" y="272" text-anchor="middle">526：k%pos==0 或 pos%k==0</text>
    <text x="448" y="292" text-anchor="middle">2992：gcd(pos, k)==1</text>
    <text x="448" y="308" text-anchor="middle">模板不变，只换判定函数</text>
  </g>
</svg>
