<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：子矩阵 ⇔ 右下角，非负 ⇒ 前缀和单调</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：grid（左）与其前缀和 P（右），k = 20</text>

  <!-- 左：grid -->
  <text x="112" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">grid</text>
  <!-- (0,0) 锚点（橙） -->
  <rect x="46" y="86" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="90" y="86" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="86" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="46" y="130" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="130" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="130" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="46" y="174" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="174" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="174" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="113" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="112" y="113" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="156" y="113" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">9</text>
  <text x="68" y="157" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="157" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="156" y="157" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="68" y="201" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="201" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="156" y="201" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <!-- 虚线框：含 (0,0) 的子矩阵 (0,0)~(1,1) -->
  <rect x="40" y="80" width="100" height="100" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="68" y="72" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">右下角 (1,1) ⇒ 和 15 ✓</text>

  <path d="M196,150 C230,150 240,150 262,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">逐格累加</text>

  <!-- 右：P 矩阵 -->
  <text x="366" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">P[i][j] = grid[0..i][0..j] 之和</text>
  <!-- 行 0：全 ✓ -->
  <rect x="300" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="388" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 行 1：8 ✓ 15 ✓ 24 ✗ -->
  <rect x="300" y="130" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="130" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="388" y="130" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- 行 2：10 ✓ 21 ✗ 32 ✗ -->
  <rect x="300" y="174" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="174" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="388" y="174" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7✓</text>
  <text x="366" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9✓</text>
  <text x="410" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18✓</text>
  <text x="322" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8✓</text>
  <text x="366" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15✓</text>
  <text x="410" y="152" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">24✗</text>
  <text x="322" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10✓</text>
  <text x="366" y="196" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">21✗</text>
  <text x="410" y="196" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">32✗</text>

  <!-- 阶梯虚线 -->
  <path d="M438,152 C450,160 450,172 440,176" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="466" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">≤k 的格子
呈阶梯形</text>

  <rect x="36" y="238" width="448" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="259" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">观察 1：必须包含左上角 (0,0) ⇒ 子矩阵由右下角 (i,j) 唯一确定</text>
  <text x="52" y="278" font-size="12" fill="#333" filter="url(#rough2)">候选从 O(m²n²) 个骤减为 O(mn) 个：答案 = 满足 P[i][j] ≤ k 的格子数</text>

  <rect x="36" y="300" width="448" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="320" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">观察 2：元素非负 ⇒ P[i][j] 随 j 单调不减</text>
  <text x="52" y="338" font-size="12" fill="#333" filter="url(#rough2)">每行 ≤k 的是一段前缀，一旦超过 k，同行更右的全超标 ⇒ 可提前 break</text>
</svg>
