<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [5,7,11,13]，n = 4，d = 2</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="46" width="40" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>

  <rect x="80" y="46" width="60" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">arr[i]</text>

  <rect x="140" y="46" width="110" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="65" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">expect = 5 + i·2</text>

  <rect x="250" y="46" width="70" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">相符?</text>

  <rect x="320" y="46" width="170" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">说明</text>

  <!-- ===== Row 0: i=0, arr=5, expect=5, ok ===== -->
  <rect x="40" y="78" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="78" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="97" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="140" y="78" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="97" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="250" y="78" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <text x="330" y="97" font-size="10" fill="#888">对齐</text>

  <!-- ===== Row 1: i=1, arr=7, expect=7, ok ===== -->
  <rect x="40" y="108" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="108" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="127" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="140" y="108" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="127" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="250" y="108" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <text x="330" y="127" font-size="10" fill="#888">对齐</text>

  <!-- ===== Row 2: i=2, arr=11, expect=9, MISMATCH -> answer ===== -->
  <rect x="40" y="138" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="138" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <rect x="140" y="138" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>
  <rect x="250" y="138" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <text x="330" y="157" font-size="10" fill="#b85450" font-weight="bold">首个错位 → 返回 9 ⭐</text>

  <!-- ===== Row 3: i=3 (not reached) ===== -->
  <rect x="40" y="168" width="40" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="187" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <rect x="80" y="168" width="60" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="187" text-anchor="middle" font-size="11" fill="#aaa">13</text>
  <rect x="140" y="168" width="110" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="187" text-anchor="middle" font-size="11" fill="#aaa">11</text>
  <rect x="250" y="168" width="70" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="187" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="330" y="187" font-size="10" fill="#aaa">已提前返回，不执行</text>

  <!-- ===== Annotation: shift explanation ===== -->
  <rect x="40" y="214" width="450" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="236" text-anchor="middle" font-size="11" fill="#444">从 i=2 起，arr[i] = 完整数列第 i+1 项，整体比 expect 多一个 d=2 → 首个错位的 expect 即缺失项</text>

  <!-- ===== Result box ===== -->
  <rect x="120" y="258" width="280" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 9，完整数列 [5, 7, 9, 11, 13]</text>
</svg>
