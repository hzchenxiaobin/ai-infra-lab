<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：n=5, source=0, dest=1, target=5</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">可改边 4-1、2-0、0-3、4-3（原图全为 -1）</text>

  <!-- ===== Panel A: set -1 = 1, first Dijkstra ===== -->
  <text x="20" y="66" font-size="11" fill="#446688" font-weight="bold">① -1 全设 1，Dijkstra(0)：d = dist[1] = 3 &lt; 5</text>

  <!-- edges -->
  <path d="M 72 116 L 168 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 192 116 L 282 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="237" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 306 116 L 392 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="349" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 56 128 L 56 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="44" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- nodes -->
  <ellipse cx="50" cy="116" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="180" cy="116" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="121" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <ellipse cx="294" cy="116" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="121" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <ellipse cx="410" cy="116" rx="20" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="121" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <ellipse cx="50" cy="166" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="171" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <!-- dist labels -->
  <text x="50" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a">d=0</text>
  <text x="180" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a">d=1</text>
  <text x="294" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="410" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">d=3 ←</text>
  <text x="440" y="120" font-size="10" fill="#888">最短路 0-3-4-1</text>

  <path d="M 280 188 L 280 204" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel B: find edge on shortest path, bump ===== -->
  <text x="20" y="220" font-size="11" fill="#d6a040" font-weight="bold">② deficit = 5−3 = 2；边 (4,1) 在最短路上：d[4]+1+dd[1]=2+1+0=3=d → 抬升 w=1+2=3</text>

  <!-- edges (4-1 now bumped red) -->
  <path d="M 72 270 L 168 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 192 270 L 282 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="237" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 306 270 L 392 270" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="349" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ←抬</text>
  <path d="M 56 282 L 56 304" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="44" y="296" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <ellipse cx="50" cy="270" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="275" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="180" cy="270" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="275" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <ellipse cx="294" cy="270" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="294" y="275" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <ellipse cx="410" cy="270" rx="20" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="275" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <ellipse cx="50" cy="320" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="325" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <!-- annotation: the bumped path becomes 5 -->
  <text x="440" y="270" font-size="10" fill="#b85450">该路 =1+1+3=5=target</text>

  <path d="M 280 342 L 280 358" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel C: re-run Dijkstra, verify ===== -->
  <text x="20" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">③ 重跑 Dijkstra(0)：dist[1] = 0-3-4-1 = 1+1+3 = 5 == target ✓ 返回</text>

  <path d="M 72 412 L 168 412" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="406" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 192 412 L 282 412" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="237" y="406" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <path d="M 306 412 L 392 412" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="349" y="404" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <path d="M 56 424 L 56 446" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="44" y="438" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <ellipse cx="50" cy="412" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="417" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="180" cy="412" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="417" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <ellipse cx="294" cy="412" rx="20" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="417" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <ellipse cx="410" cy="412" rx="20" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="410" y="417" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="440" y="412" font-size="10" fill="#4a7a3a" font-weight="bold">d=5 ✓</text>
  <text x="440" y="426" font-size="9" fill="#888">输出</text>
  <text x="440" y="438" font-size="9" fill="#888">[[4,1,3],</text>
  <text x="440" y="449" font-size="9" fill="#888">[2,0,1],...]</text>
</svg>
