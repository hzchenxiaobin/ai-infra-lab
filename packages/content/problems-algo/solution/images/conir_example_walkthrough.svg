<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个用例验证公式</text>

  <!-- Example 1 -->
  <text x="40" y="62" font-size="12.5" fill="#555" font-weight="bold">示例 1：low = 3, high = 7</text>
  <text x="280" y="62" font-size="11" fill="#888">区间内奇数应为 3, 5, 7</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="120" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="140" y="94" font-weight="bold">3</text>
    <rect x="160" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="94">4</text>
    <rect x="200" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="220" y="94" font-weight="bold">5</text>
    <rect x="240" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="94">6</text>
    <rect x="280" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="300" y="94" font-weight="bold">7</text>
  </g>
  <text x="40" y="128" font-size="12" fill="#555">公式：(7+1)/2 − 3/2 = <tspan fill="#d6a040" font-weight="bold">4</tspan> − <tspan fill="#d6a040" font-weight="bold">1</tspan> = <tspan fill="#b85450" font-weight="bold">3</tspan> ✓</text>

  <!-- Divider -->
  <path d="M 40 152 L 520 152" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="40" y="178" font-size="12.5" fill="#555" font-weight="bold">示例 2：low = 8, high = 10</text>
  <text x="280" y="178" font-size="11" fill="#888">区间内奇数应为 9</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="160" y="190" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="210">8</text>
    <rect x="200" y="190" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="220" y="210" font-weight="bold">9</text>
    <rect x="240" y="190" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="210">10</text>
  </g>
  <text x="40" y="244" font-size="12" fill="#555">公式：(10+1)/2 − 8/2 = <tspan fill="#d6a040" font-weight="bold">5</tspan> − <tspan fill="#d6a040" font-weight="bold">4</tspan> = <tspan fill="#b85450" font-weight="bold">1</tspan> ✓</text>

  <!-- Divider -->
  <path d="M 40 270 L 520 270" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Boundary note -->
  <text x="40" y="296" font-size="11.5" fill="#555">• 边界 low = 0：f(low−1) = f(−1) 视为 0，公式 (high+1)/2 − 0/2 仍成立（0/2 = 0）</text>
  <text x="40" y="316" font-size="11.5" fill="#555">• 边界 low = high：若该数为奇数返回 1，偶数返回 0，公式自洽</text>

  <!-- Conclusion box -->
  <rect x="60" y="332" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">两例均与枚举一致，O(1) 公式成立 ⭐</text>
</svg>
