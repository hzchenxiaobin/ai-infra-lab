<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐行构造（DP 四步法）</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">上一行先算完，再算下一行 → 自顶向下无后效性</text>

  <!-- ===== Left: vertical flow of boxes ===== -->
  <g font-size="11" fill="#333">
    <!-- Start -->
    <rect x="40" y="58" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
    <text x="125" y="77" text-anchor="middle" font-weight="bold" fill="#446688">输入 numRows</text>

    <!-- Step 1 -->
    <rect x="40" y="102" width="220" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
    <text x="150" y="121" text-anchor="middle">① 状态: triangle[i][j]</text>

    <!-- Step 2 (highlight) -->
    <rect x="40" y="146" width="300" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="190" y="166" text-anchor="middle" fill="#d6a040" font-weight="bold">② 递推: [i][j]=[i-1][j-1]+[i-1][j]</text>

    <!-- Step 3 -->
    <rect x="40" y="192" width="260" height="30" fill="#f6f6f6" stroke="#999" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
    <text x="170" y="211" text-anchor="middle">③ 边界: [i][0]=[i][i]=1</text>

    <!-- Step 4 (loop) -->
    <rect x="40" y="236" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="190" y="254" text-anchor="middle" fill="#4a7a3a" font-weight="bold">④ for i in 1..n-1:</text>
    <text x="190" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a7a3a">for j in 1..i-1: 填中间</text>

    <!-- End -->
    <rect x="40" y="294" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
    <text x="125" y="313" text-anchor="middle" font-weight="bold" fill="#b85450">返回 res</text>
  </g>

  <!-- arrows between boxes (left column) -->
  <path d="M 125 88 L 125 100" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 125 132 L 125 144" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 125 178 L 125 190" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 125 222 L 125 234" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 125 280 L 125 292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: dependency illustration ===== -->
  <text x="410" y="100" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">行依赖关系</text>
  <!-- row i-1 -->
  <rect x="350" y="112" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="392" y="112" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="412" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="440" y="100" font-size="9" fill="#888">第 i-1 行</text>

  <!-- row i -->
  <rect x="392" y="166" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="412" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a+b</text>
  <text x="440" y="154" font-size="9" fill="#888">第 i 行</text>

  <!-- arrows a -> a+b, b -> a+b -->
  <path d="M 370 148 Q 388 158 408 166" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 412 148 Q 412 158 412 166" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="338" y="220" width="160" height="50" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="418" y="240" text-anchor="middle" font-size="10" fill="#555">第 i 行只看第 i-1 行</text>
  <text x="418" y="256" text-anchor="middle" font-size="10" fill="#555">更早的行不再引用</text>
  <text x="418" y="270" text-anchor="middle" font-size="9" fill="#888">→ 可滚动数组优化空间</text>

  <!-- ===== Bottom tip ===== -->
  <rect x="40" y="330" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="345" text-anchor="middle" font-size="10" fill="#d6a040">技巧：整行先初始化为 1，循环只填中间 1 ≤ j ≤ i-1</text>
</svg>
