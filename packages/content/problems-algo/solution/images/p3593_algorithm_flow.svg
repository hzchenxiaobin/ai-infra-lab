<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：三趟线性扫描数下跌边</text>

  <!-- 开始 -->
  <rect x="210" y="40" width="100" height="30" rx="15" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M260,70 L260,84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 建图 -->
  <rect x="160" y="86" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建双向邻接表 g（edges 无向）</text>
  <path d="M260,122 L260,136" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- BFS 定序 -->
  <rect x="150" y="138" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">BFS(0)：得 parent[] 与 order[]</text>
  <text x="378" y="158" font-size="9" fill="#888" filter="url(#rough2)">迭代防爆栈</text>
  <path d="M260,174 L260,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 逆序求 down -->
  <rect x="120" y="190" width="280" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">逆序扫 order（= 后序）：down[v] 初值 cost[v]</text>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">down[p] ← max(down[p], down[v] + cost[p])</text>
  <path d="M260,242 L260,256" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 顺序求 best -->
  <rect x="120" y="258" width="280" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">顺序扫 order：S[v] = S[p] + cost[v]</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">best[v] = S[p] + down[v]（经过 v 的最大得分）</text>
  <text x="408" y="278" font-size="9" fill="#b85450" filter="url(#rough2)">long long!</text>
  <path d="M260,310 L260,324" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,326 345,360 260,394 175,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">best[v] ≠ best[p] ？</text>

  <!-- 否：直接到返回 -->
  <text x="270" y="406" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M260,394 L260,412" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 是：ans++ -->
  <text x="356" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M345,360 L398,360" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="400" y="342" width="84" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans++</text>
  <path d="M442,378 L442,430 L342,430" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="185" y="414" width="155" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans（= 下跌边数）</text>

  <!-- 底部注意事项 -->
  <rect x="25" y="462" width="470" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="481" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⚠️ 逆 BFS 序 = 孩子先于父亲（后序等价），链状树 n=10⁵ 不爆栈；路径和上界 10¹⁴ 用 long long</text>
  <text x="260" y="499" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⚠️ edges 无向且不保证 (父,子) 顺序：双向建图 + 从 0 BFS 定父</text>
</svg>
