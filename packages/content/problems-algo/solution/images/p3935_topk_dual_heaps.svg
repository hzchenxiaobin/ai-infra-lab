<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：对顶双堆——L 管「前 k 大」，堆顶就是第 k 大</text>
  <text x="260" y="48" text-anchor="middle" font-size="11.5" fill="#666">以多重集 {2, 4, 5, 7, 9}、k = 3 为例：L = {9, 7, 5}，R = {4, 2}，第 3 大 = 5</text>

  <!-- band 1: sorted cells with threshold divider -->
  <rect x="112" y="62" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="87" text-anchor="middle" font-size="14" fill="#333">9</text>
  <rect x="178" y="62" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="87" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="244" y="62" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="336" y="62" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="402" y="62" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="87" text-anchor="middle" font-size="14" fill="#333">2</text>

  <path d="M 322 54 L 322 108" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="141" y="120" text-anchor="middle" font-size="10.5" fill="#666">第1大</text>
  <text x="207" y="120" text-anchor="middle" font-size="10.5" fill="#666">第2大</text>
  <text x="273" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第3大=门槛</text>
  <text x="365" y="120" text-anchor="middle" font-size="10.5" fill="#666">第4大</text>
  <text x="431" y="120" text-anchor="middle" font-size="10.5" fill="#666">第5大</text>

  <text x="217" y="140" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">L：前 k 大</text>
  <text x="369" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">R：其余</text>

  <!-- band 2: two heaps -->
  <rect x="45" y="152" width="200" height="125" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L：小根堆</text>
  <rect x="116" y="180" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="80" y="232" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="257" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="152" y="232" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="257" text-anchor="middle" font-size="14" fill="#333">9</text>

  <rect x="275" y="152" width="200" height="125" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="375" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">R：大根堆</text>
  <rect x="346" y="180" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="346" y="232" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="257" text-anchor="middle" font-size="14" fill="#333">2</text>

  <text x="145" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">堆顶 5 = min(L) = 第 k 大</text>
  <text x="375" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">堆顶 4 = max(R) = 晋升候选人</text>

  <!-- insert note -->
  <rect x="85" y="302" width="350" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#333">插入 x：x ≥ 门槛（第 k 大）→ 入 L；x &lt; 门槛 → 入 R</text>

  <!-- band 3: boundary movement -->
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a">k 增大 ⇒ R 堆顶晋升进 L（|Δk| 人）</text>
  <path d="M 420 342 L 100 342" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#d6a040">k 减小 ⇒ L 堆顶降级去 R（|Δk| 人）</text>
  <path d="M 100 368 L 420 368" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="260" y="391" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">约束 |Δk| &lt; 10 ⇒ 每查询只搬 O(1) 个元素，均摊 O(log n)</text>
</svg>
