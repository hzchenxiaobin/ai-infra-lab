<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="460" height="410" fill="#fafafa"/>

  <rect x="90" y="20" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">① Boyer-Moore 投票找支配元素 x</text>
  <text x="230" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(n) 时间 O(1) 空间</text>

  <path d="M230,70 L230,86" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="86" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② 统计 x 的总频次 f</text>

  <path d="M230,126 L230,144" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="144" width="320" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">③ 从左扫描 i = 0 .. n−2</text>
  <text x="230" y="186" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">维护 cnt = x 在 [0..i] 的频次</text>

  <path d="M230,196 L230,214" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="230,214 360,258 230,302 100,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt×2 &gt; i+1</text>
  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 (f−cnt)×2 &gt; n−1−i ?</text>

  <text x="86" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M100,258 L72,258" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="8" y="238" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="39" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">返回 i</text>
  <text x="39" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最小下标</text>

  <text x="244" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M230,302 L230,320" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="320" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++，回到 ③ 继续扫描</text>
  <text x="230" y="364" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">全部扫完仍无解 → 返回 −1</text>
</svg>
