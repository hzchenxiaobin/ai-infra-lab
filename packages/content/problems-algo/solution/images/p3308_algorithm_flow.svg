<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：stats 聚合 → ranked 窗口排名 → 取冠军 → 排序输出</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">左侧为 SQL 流水线，右侧为示例数据在每一步的形态</text>

  <rect x="30" y="48" width="340" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="70" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① stats：事实表聚合（算成绩）</text>
  <text x="50" y="92" font-size="9.5" fill="#333" filter="url(#rough2)">FROM Trips t JOIN Vehicles v ON v.vehicle_id = t.vehicle_id</text>
  <text x="50" y="110" font-size="9.5" fill="#333" filter="url(#rough2)">GROUP BY v.fuel_type, v.driver_id</text>
  <text x="50" y="128" font-size="9.5" fill="#333" filter="url(#rough2)">SELECT ROUND(AVG(t.rating),2) rating, SUM(t.distance) distance</text>
  <text x="50" y="148" font-size="9" fill="#446688" filter="url(#rough2)">先舍入再比较；无行程的司机在此消失</text>

  <rect x="390" y="48" width="160" height="112" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="68" text-anchor="middle" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">stats（3 行）</text>
  <text x="470" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(Gasoline,1) 4.50 / 80</text>
  <text x="470" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(Gasoline,3) 5.00 / 100</text>
  <text x="470" y="124" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(Electric,2) 4.50 / 180</text>
  <text x="470" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">＝选手积分榜</text>

  <path d="M 200 162 L 200 182" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="184" width="340" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="206" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② ranked：维表补键 + 窗口排名（排座次）</text>
  <text x="50" y="228" font-size="9.5" fill="#333" filter="url(#rough2)">FROM stats s JOIN Drivers d ON d.driver_id = s.driver_id</text>
  <text x="50" y="246" font-size="9.5" fill="#333" filter="url(#rough2)">RANK() OVER ( PARTITION BY s.fuel_type</text>
  <text x="50" y="264" font-size="9.5" fill="#333" filter="url(#rough2)">　ORDER BY rating DESC, distance DESC, accidents )</text>
  <text x="50" y="284" font-size="9" fill="#4a7a3a" filter="url(#rough2)">Drivers 迟到连接：accidents 以原始值进第三级排序键</text>
  <text x="50" y="300" font-size="9" fill="#4a7a3a" filter="url(#rough2)">三级平局链全部写进 ORDER BY，一级不能少</text>

  <rect x="390" y="184" width="160" height="122" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="204" text-anchor="middle" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">ranked（分赛道名次）</text>
  <text x="470" y="224" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Gasoline: Charlie rk=1</text>
  <text x="470" y="242" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">　　　　 Alice rk=2</text>
  <text x="470" y="260" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Electric: Bob rk=1</text>
  <text x="470" y="284" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">两个赛道的名次互不干扰</text>
  <text x="470" y="298" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">（PARTITION BY 的意义）</text>

  <path d="M 200 308 L 200 328" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="330" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="348" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ WHERE rk = 1：取每个赛道的冠军</text>
  <text x="50" y="366" font-size="9" fill="#8a6d1a" filter="url(#rough2)">RANK 允许并列冠军；全平改 ROW_NUMBER + driver_id</text>

  <rect x="390" y="330" width="160" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="348" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(Electric, 2)</text>
  <text x="470" y="366" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(Gasoline, 3)</text>

  <path d="M 200 376 L 200 396" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="398" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="419" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ ORDER BY fuel_type：赛道升序输出</text>

  <rect x="390" y="398" width="160" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="419" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Electric 排在 Gasoline 前</text>
</svg>
