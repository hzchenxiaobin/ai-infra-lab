<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">贪心为何翻车：最大的 10「抢错了行」</text>

  <!-- 左：网格 [[10,9],[10,1]] -->
  <text x="94" y="48" text-anchor="middle" font-size="11" fill="#7a6a50" filter="url(#rough2)">反例网格</text>
  <text x="36" y="84" font-size="10" fill="#888" filter="url(#rough2)">r0</text>
  <text x="36" y="120" font-size="10" fill="#888" filter="url(#rough2)">r1</text>

  <rect x="48" y="62" width="46" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="71" y="82" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="98" y="62" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="121" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="48" y="98" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="71" y="118" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="98" y="98" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="118" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>

  <text x="94" y="152" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">绿框 = 最优解选中</text>
  <text x="94" y="167" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">红框 = 贪心误抓</text>

  <!-- 右上：贪心路径 -->
  <rect x="182" y="46" width="312" height="98" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="66" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">贪心：按值从大到小「能用就拿」</text>
  <text x="338" y="85" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">① 见 10 最大，顺手抓走 r0 的 10</text>
  <text x="338" y="103" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">② 9 在 r0：同行冲突 ✗；10(r1)：同值冲突 ✗</text>
  <text x="338" y="121" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">③ 只剩 1(r1) 可拿 → 得分 10 + 1 =</text>
  <text x="448" y="121" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- 右下：最优路径 -->
  <rect x="182" y="154" width="312" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338" y="174" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最优：让 10 住进 r1，把 r0 留给 9</text>
  <text x="338" y="194" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">10(r1) + 9(r0) = 19，比贪心多 8 分！</text>

  <!-- 底部总结 -->
  <rect x="30" y="228" width="460" height="116" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">行是「共享资源」：拿走一个大值时，你并不知道它该住哪一行</text>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">住错行会把后面的大值（本例的 9）整个堵死——局部最优 ≠ 全局最优</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">值与行的配对必须全局统筹，这正是 DP（或二分图匹配）的用武之地</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">注：交换论证也救不了简单贪心——「大值优先」并不蕴含「大值该占它首次出现的行」</text>
</svg>
