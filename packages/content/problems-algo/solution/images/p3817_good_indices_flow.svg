<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="16" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描，每个下标一次 O(d) 对齐比较</text>

  <!-- A: init -->
  <rect x="75" y="36" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="54" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = [ ]，i = 0</text>
  <path d="M 160 64 L 160 76" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B: build pattern -->
  <rect x="75" y="78" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">t = str(i)，d = len(t)</text>
  <path d="M 160 108 L 160 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D: compare decision -->
  <polygon points="160,128 255,170 160,212 65,170" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">s[i−d+1..i] == t ?</text>

  <path d="M 160 212 L 160 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="227" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- E: record -->
  <rect x="75" y="232" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="251" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">ans.push_back(i)</text>

  <!-- D-no to hub -->
  <path d="M 255 170 L 415 170 L 415 227" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="282" y="163" font-size="9" fill="#888" filter="url(#rough2)">否</text>

  <!-- E-out to hub -->
  <path d="M 245 247 L 320 247 L 320 265 L 347 265" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <!-- G': increment & test -->
  <polygon points="415,231 477,265 415,299 353,265" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i = i + 1</text>
  <text x="415" y="274" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- G' yes: loop back to B -->
  <path d="M 415 299 L 415 318 L 40 318 L 40 95 L 69 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="312" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">是（下一轮）</text>

  <!-- G' no: return -->
  <path d="M 477 265 L 508 265 L 508 347 L 501 347" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="486" y="258" font-size="9" fill="#888" filter="url(#rough2)">否</text>

  <!-- H: return -->
  <rect x="395" y="330" width="102" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="446" y="357" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">（升序、天然无重）</text>

  <!-- insight box -->
  <rect x="300" y="36" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="54" text-anchor="middle" font-size="10" fill="#335" font-weight="bold" filter="url(#rough2)">位长视角</text>
  <text x="400" y="70" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d=1 → i ∈ {0..9}；d=2 → [10,99]</text>
  <text x="400" y="86" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d=3 → [100,999]…… d ≤ 7</text>

  <!-- footnotes -->
  <text x="205" y="346" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">窗口永不越界：d 位下标 i ≥ 10^(d−1) ≥ d−1 恒成立（防御检查可省）</text>
  <text x="205" y="362" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">比较至多 d ≤ 7 位，首位不同即短路；升序枚举答案天然有序</text>
</svg>
