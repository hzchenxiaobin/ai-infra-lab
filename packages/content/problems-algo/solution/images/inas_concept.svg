<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：token 流 → 过滤数字 → 严格递增判定</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">数字 token 必须满足 prev &lt; cur，遇到相等或下降即 false</text>

  <!-- Row 1: token stream -->
  <text x="22" y="86" font-size="11" fill="#446688" font-weight="bold">token 流</text>
  <text x="22" y="100" font-size="9.5" fill="#888">split(' ')</text>

  <!-- tokens: 1, box, has, 3, blue, 4, red, 6, ... -->
  <g filter="url(#rough2)">
    <rect x="74" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="96" y="91" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <rect x="122" y="68" width="44" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="144" y="91" text-anchor="middle" font-size="11" fill="#888">box</text>
    <rect x="170" y="68" width="44" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="192" y="91" text-anchor="middle" font-size="11" fill="#888">has</text>
    <rect x="218" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="240" y="91" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
    <rect x="266" y="68" width="44" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="288" y="91" text-anchor="middle" font-size="11" fill="#888">blue</text>
    <rect x="314" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="336" y="91" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
    <rect x="362" y="68" width="44" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="384" y="91" text-anchor="middle" font-size="11" fill="#888">red</text>
    <rect x="410" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="432" y="91" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
    <text x="464" y="91" font-size="11" fill="#aaa">…</text>
  </g>

  <!-- Arrow down: filter -->
  <text x="280" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↓ 只保留数字 token（isdigit 判定）</text>

  <!-- Row 2: numbers only -->
  <text x="22" y="166" font-size="11" fill="#d6a040" font-weight="bold">数字序列</text>
  <g filter="url(#rough2)">
    <rect x="120" y="148" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="144" y="172" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
    <rect x="216" y="148" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="240" y="172" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
    <rect x="312" y="148" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="336" y="172" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
    <rect x="408" y="148" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="432" y="172" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">6</text>
  </g>

  <!-- comparisons between numbers -->
  <path d="M 168 166 L 216 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <path d="M 264 166 L 312 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <path d="M 360 166 L 408 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>

  <!-- Arrow down -->
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↓ 逐对比较 prev &lt; cur ?</text>

  <!-- Result box -->
  <rect x="180" y="222" width="200" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全部满足严格递增？</text>
  <text x="280" y="270" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold">→ true</text>

  <!-- Counter example box -->
  <rect x="40" y="298" width="480" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">反例：s = "hello world 5 x 5"</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#555">数字序列 [5, 5]：5 &lt; 5 不成立（非严格递增）→ false</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#888">同理 7, 51, 50, 60 中 51 &lt; 50 不成立 → false</text>
</svg>
