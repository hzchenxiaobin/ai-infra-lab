  <!-- ===== Step 2: Sliding window ===== -->
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二步：3 月滑动窗口（窗口大小 = 3，步长 = 1，共 10 个窗口）</text>

  <!-- Window bracket over months 6,7,8 -->
  <g filter="url(#rough2)">
    <rect x="270" y="156" width="146" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.5"/>
  </g>
  <text x="343" y="174" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">窗口 = 6,7,8 月</text>
  <text x="343" y="190" text-anchor="middle" font-size="9" fill="#b85450">73 + 100 + 119 = 292</text>
  <text x="343" y="202" text-anchor="middle" font-size="9" fill="#b85450">292 ÷ 3 = 97.33</text>

  <!-- Slide arrows -->
  <path d="M140 178 L260 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M430 178 L550 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="8.5" fill="#888">向左滑</text>
  <text x="490" y="170" text-anchor="middle" font-size="8.5" fill="#888">向右滑</text>

  <!-- ===== Formula ===== -->
  <rect x="120" y="220" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">avg(m) = [ total(m) + total(m+1) + total(m+2) ] ÷ 3 ，m = 1..10</text>

  <!-- ===== Output: 10 windows ===== -->
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出：10 个窗口的 average_ride_distance / average_ride_duration</text>

