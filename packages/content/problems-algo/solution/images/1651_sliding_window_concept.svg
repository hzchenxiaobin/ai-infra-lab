  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一步：月度汇总（AcceptedRides JOIN Rides → GROUP BY MONTH → SUM + 补零）</text>

  <!-- 12 monthly boxes: distance values -->
