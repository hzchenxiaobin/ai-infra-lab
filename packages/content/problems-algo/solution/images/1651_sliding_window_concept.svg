    <text x="160" y="303" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">month</text>
    <rect x="200" y="288" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="280" y="303" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">avg_distance</text>
