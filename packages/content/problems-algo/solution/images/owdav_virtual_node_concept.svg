<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">虚拟节点转化：建井 + 铺管 → 统一图上的 MST</text>

  <!-- ===== Left: original problem ===== -->
  <rect x="20" y="44" width="220" height="300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="130" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">原始问题</text>

  <!-- village 1 -->
  <circle cx="80" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="80" y="156" text-anchor="middle" font-size="10" fill="#d6a040">井=1</text>

  <!-- village 2 -->
  <circle cx="180" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="180" y="156" text-anchor="middle" font-size="10" fill="#d6a040">井=2</text>

  <!-- pipe 1-2 -->
  <line x1="98" y1="120" x2="162" y2="120" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">管=1</text>

  <!-- village 3 -->
  <circle cx="130" cy="230" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="130" y="266" text-anchor="middle" font-size="10" fill="#d6a040">井=2</text>

  <!-- pipe 2-3 -->
  <line x1="178" y1="135" x2="142" y2="216" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="180" font-size="10" fill="#4a7a3a">管=1</text>

  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#888">每村可选：建井 or 接管</text>
  <text x="130" y="318" text-anchor="middle" font-size="10" fill="#888">两类决策混合 → 难以直接 MST</text>

  <!-- arrow: transformation -->
  <line x1="250" y1="194" x2="290" y2="194" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">转化</text>
  <text x="270" y="212" text-anchor="middle" font-size="9" fill="#b85450">加虚拟源点 0</text>

  <!-- ===== Right: unified graph with virtual node ===== -->
  <rect x="300" y="44" width="240" height="300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="420" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">统一图：虚拟源点 0 + 全部边</text>

  <!-- virtual node 0 -->
  <circle cx="420" cy="110" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="420" y="115" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="420" y="86" text-anchor="middle" font-size="9.5" fill="#b85450">水源(虚拟)</text>

  <!-- well edges: 0->1, 0->2, 0->3 -->
  <line x1="404" y1="126" x2="352" y2="168" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="360" y="138" font-size="9.5" fill="#d6a040">1</text>

  <line x1="420" y1="132" x2="420" y2="200" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="434" y="168" font-size="9.5" fill="#d6a040">2</text>

  <line x1="436" y1="126" x2="488" y2="168" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="476" y="138" font-size="9.5" fill="#d6a040">2</text>

  <!-- village nodes -->
  <circle cx="340" cy="186" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <circle cx="420" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <circle cx="500" cy="186" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- pipe edges: 1-2 cost 1, 2-3 cost 1 -->
  <line x1="356" y1="198" x2="404" y2="214" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="368" y="220" font-size="9.5" fill="#4a7a3a">1</text>

  <line x1="436" y1="214" x2="484" y2="198" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="220" font-size="9.5" fill="#4a7a3a">1</text>

  <!-- legend -->
  <rect x="320" y="270" width="200" height="60" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <line x1="334" y1="286" x2="360" y2="286" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="368" y="290" font-size="9.5" fill="#666">虚线 = 井（0→i）</text>
  <line x1="334" y1="306" x2="360" y2="306" stroke="#4a7a3a" stroke-width="2"/>
  <text x="368" y="310" font-size="9.5" fill="#666">实线 = 管道（i→j）</text>
  <text x="420" y="326" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4 节点 5 边 → Kruskal 选 3 条</text>
</svg>
