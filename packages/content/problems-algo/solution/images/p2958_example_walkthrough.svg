<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,3,1,2,3,1,2]，k = 2</text>
  <text x="280" y="38" text-anchor="middle" font-size="11" fill="#888">「入窗后频率」列出的是 cnt[x]++ 之后、收缩之前的瞬时状态</text>

  <!-- 表头 -->
  <rect x="10" y="48" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="32" y="66" font-size="11" fill="#446688" font-weight="bold">right</text>
  <text x="64" y="66" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">入窗后频率</text>
  <text x="304" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收缩动作</text>
  <text x="439" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">窗口 [l,r]·长度</text>
  <text x="527" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- 行 0 -->
  <rect x="10" y="76" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="32" y="94" font-size="11" fill="#333">0</text>
  <text x="70" y="94" font-size="11" fill="#333">1</text>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#333">1:1</text>
  <text x="304" y="94" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="94" text-anchor="middle" font-size="11" fill="#333">[0,0]·1</text>
  <text x="527" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 行 1 -->
  <rect x="10" y="103" width="540" height="27" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="32" y="121" font-size="11" fill="#333">1</text>
  <text x="70" y="121" font-size="11" fill="#333">2</text>
  <text x="140" y="121" text-anchor="middle" font-size="11" fill="#333">1:1 2:1</text>
  <text x="304" y="121" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="121" text-anchor="middle" font-size="11" fill="#333">[0,1]·2</text>
  <text x="527" y="121" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 行 2 -->
  <rect x="10" y="130" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="32" y="148" font-size="11" fill="#333">2</text>
  <text x="70" y="148" font-size="11" fill="#333">3</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" fill="#333">1:1 2:1 3:1</text>
  <text x="304" y="148" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="148" text-anchor="middle" font-size="11" fill="#333">[0,2]·3</text>
  <text x="527" y="148" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 行 3 -->
  <rect x="10" y="157" width="540" height="27" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="32" y="175" font-size="11" fill="#333">3</text>
  <text x="70" y="175" font-size="11" fill="#333">1</text>
  <text x="140" y="175" text-anchor="middle" font-size="11" fill="#333">1:2 2:1 3:1</text>
  <text x="304" y="175" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="175" text-anchor="middle" font-size="11" fill="#333">[0,3]·4</text>
  <text x="527" y="175" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 行 4 -->
  <rect x="10" y="184" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="32" y="202" font-size="11" fill="#333">4</text>
  <text x="70" y="202" font-size="11" fill="#333">2</text>
  <text x="140" y="202" text-anchor="middle" font-size="11" fill="#333">1:2 2:2 3:1</text>
  <text x="304" y="202" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="202" text-anchor="middle" font-size="11" fill="#333">[0,4]·5</text>
  <text x="527" y="202" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 行 5 -->
  <rect x="10" y="211" width="540" height="27" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="32" y="229" font-size="11" fill="#333">5</text>
  <text x="70" y="229" font-size="11" fill="#333">3</text>
  <text x="140" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1:2 2:2 3:2 全部 = k</text>
  <text x="304" y="229" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="439" y="229" text-anchor="middle" font-size="11" fill="#333">[0,5]·6</text>
  <text x="527" y="229" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 行 6：收缩 -->
  <rect x="10" y="238" width="540" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="32" y="256" font-size="11" fill="#333">6</text>
  <text x="70" y="256" font-size="11" fill="#333">1</text>
  <text x="140" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1:3 ✗ 2:2 3:2</text>
  <text x="304" y="256" text-anchor="middle" font-size="11" fill="#b85450">弹 1，left 0→1</text>
  <text x="439" y="256" text-anchor="middle" font-size="11" fill="#333">[1,6]·6</text>
  <text x="527" y="256" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 行 7：收缩 -->
  <rect x="10" y="265" width="540" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="32" y="283" font-size="11" fill="#333">7</text>
  <text x="70" y="283" font-size="11" fill="#333">2</text>
  <text x="140" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1:2 2:3 ✗ 3:2</text>
  <text x="304" y="283" text-anchor="middle" font-size="11" fill="#b85450">弹 2，left 1→2</text>
  <text x="439" y="283" text-anchor="middle" font-size="11" fill="#333">[2,7]·6</text>
  <text x="527" y="283" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- 表格外框与列线 -->
  <path d="M 10 48 L 550 48 L 550 292 L 10 292 Z" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 54 48 L 54 292" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 94 48 L 94 292" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 224 48 L 224 292" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 384 48 L 384 292" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 504 48 L 504 292" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="10" y="308" width="540" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = 6</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">最长好子数组 [1,2,3,1,2,3]，[2,3,1,2,3,1] 与 [3,1,2,3,1,2] 同样合法</text>
</svg>
