<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按周分层递推，本周落脚 c 赚 days[c][w]，前驱取 max</text>

  <!-- ===== Left layer: week w-1 ===== -->
  <text x="132" y="78" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">第 w−1 周</text>
  <!-- city 0 (p) -->
  <rect x="108" y="96" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="132" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">城市 0</text>
  <text x="92" y="119" text-anchor="end" font-size="10" fill="#888">p=0</text>
  <!-- city 1 (p) -->
  <rect x="108" y="168" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="132" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">城市 1</text>
  <text x="92" y="191" text-anchor="end" font-size="10" fill="#888">p=1</text>
  <!-- city 2 (p) -->
  <rect x="108" y="240" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="132" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">城市 2</text>
  <text x="92" y="263" text-anchor="end" font-size="10" fill="#888">p=2</text>

  <!-- ===== Right layer: week w ===== -->
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">第 w 周</text>
  <!-- city 0 -->
  <rect x="376" y="96" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="119" text-anchor="middle" font-size="12" fill="#aaa">城市 0</text>
  <!-- city 1 (c) highlighted -->
  <rect x="376" y="168" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">城市 1</text>
  <text x="440" y="178" font-size="10" fill="#b85450" font-weight="bold">← 当前 c</text>
  <!-- city 2 -->
  <rect x="376" y="240" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="263" text-anchor="middle" font-size="12" fill="#aaa">城市 2</text>

  <!-- ===== Edges feeding into c=1 ===== -->
  <!-- p=0 -> c=1 (fly) green -->
  <path d="M 156 114 C 250 150 300 170 376 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">飞 flights[0][1]=1</text>
  <!-- p=1 -> c=1 (stay) blue -->
  <path d="M 156 186 L 376 186" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="248" y="180" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">留 p == c（原地停留，恒成立）</text>
  <!-- p=2 -> c=1 (fly) green -->
  <path d="M 156 258 C 250 222 300 202 376 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">飞 flights[2][1]=1</text>

  <!-- earn badge -->
  <rect x="372" y="300" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+days[c][w]</text>
  <path d="M 400 204 C 400 250 404 270 404 300" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="300" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[w][c] = days[c][w] + max{ dp[w−1][p] }</text>
  <text x="190" y="336" text-anchor="middle" font-size="10" fill="#666">p 满足：p == c  或  flights[p][c] == 1</text>
</svg>
