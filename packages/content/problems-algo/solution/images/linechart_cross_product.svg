<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">精度陷阱：用叉积（交叉相乘）判共线，杜绝浮点除法</text>

  <!-- ============ Left panel: floating division (wrong) ============ -->
  <rect x="24" y="48" width="240" height="240" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="144" y="70" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 浮点除法 dy/dx</text>

  <!-- three collinear points P1(1,3) P2(2,6) P3(3,9) -->
  <!-- map: x 60,130,200 ; y bottom=210(price1) top=110(price9) ... just illustrative -->
  <line x1="60" y1="210" x2="200" y2="110" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="60" cy="210" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="130" cy="160" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="200" cy="110" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="226" font-size="9.5" fill="#666">P1</text>
  <text x="122" y="176" font-size="9.5" fill="#666">P2</text>
  <text x="192" y="126" font-size="9.5" fill="#666">P3</text>

  <!-- division formulas -->
  <rect x="40" y="232" width="210" height="46" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="10.5" fill="#333">slope1 = 6/2 = 0.666…</text>
  <text x="145" y="263" text-anchor="middle" font-size="10.5" fill="#333">slope2 = 9/3 = 0.666…</text>
  <text x="145" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">浮点近似 → 可能判不等 ✗</text>

  <!-- ============ Right panel: cross product (correct) ============ -->
  <rect x="276" y="48" width="240" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="396" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 交叉相乘（叉积）</text>

  <!-- same three points (offset +252) -->
  <line x1="312" y1="210" x2="452" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="312" cy="210" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="382" cy="160" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="452" cy="110" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="226" font-size="9.5" fill="#666">P1</text>
  <text x="374" y="176" font-size="9.5" fill="#666">P2</text>
  <text x="444" y="126" font-size="9.5" fill="#666">P3</text>

  <!-- cross product formulas -->
  <rect x="292" y="232" width="210" height="46" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="397" y="248" text-anchor="middle" font-size="10.5" fill="#333">6×3 == 9×2</text>
  <text x="397" y="263" text-anchor="middle" font-size="10.5" fill="#333">18 == 18 ✓</text>
  <text x="397" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">整数精确 → 判等可靠 ✓</text>

  <!-- big vs arrow between panels -->
  <path d="M 268 168 L 280 168" stroke="#666" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="40" y="300" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">三点共线 ⟺ (y2−y1)(x3−x2) == (y3−y2)(x2−x1)</text>
</svg>
