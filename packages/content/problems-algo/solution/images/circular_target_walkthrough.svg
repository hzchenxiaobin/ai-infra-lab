<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：words=["hello","i","am","leetcode","hello"]，start=1，n=5</text>

  <!-- Table frame -->
  <rect x="28" y="44" width="504" height="280" fill="none" stroke="#cfcfcf" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="28" y="44" width="504" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68"  y="63" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">下标 i</text>
  <text x="150" y="63" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">words[i]</text>
  <text x="238" y="63" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">是否 target</text>
  <text x="340" y="63" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">顺时针 r</text>
  <text x="438" y="63" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">逆时针 l / min</text>
  <line x1="108" y1="44" x2="108" y2="324" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="44" x2="196" y2="324" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="288" y1="44" x2="288" y2="324" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="392" y1="44" x2="392" y2="324" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: i=0 hello target, r=4, l=1, min=1 (best) -->
  <rect x="28" y="72" width="504" height="44" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <text x="68"  y="99" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="150" y="99" text-anchor="middle" font-size="12" fill="#333">hello</text>
  <text x="238" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a">(0−1+5)%5 = 4</text>
  <text x="340" y="107" text-anchor="middle" font-size="10" fill="#888">绕大半圈·长</text>
  <text x="438" y="92" text-anchor="middle" font-size="11" fill="#b85450">(1−0+5)%5 = 1</text>
  <text x="438" y="107" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min = 1 ← 最小</text>
  <line x1="28" y1="116" x2="532" y2="116" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: i=1 i (start) -->
  <text x="68"  y="139" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="150" y="139" text-anchor="middle" font-size="12" fill="#333">i</text>
  <text x="238" y="139" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✗（起点）</text>
  <text x="340" y="139" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="438" y="139" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <line x1="28" y1="156" x2="532" y2="156" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: i=2 am -->
  <text x="68"  y="179" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="150" y="179" text-anchor="middle" font-size="12" fill="#333">am</text>
  <text x="238" y="179" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="340" y="179" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="438" y="179" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <line x1="28" y1="196" x2="532" y2="196" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: i=3 leetcode -->
  <text x="68"  y="219" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="150" y="219" text-anchor="middle" font-size="11.5" fill="#333">leetcode</text>
  <text x="238" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="340" y="219" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="438" y="219" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <line x1="28" y1="236" x2="532" y2="236" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 5: i=4 hello target, r=3, l=2, min=2 -->
  <rect x="28" y="236" width="504" height="44" fill="#fce4ec" opacity="0.45" filter="url(#rough2)"/>
  <text x="68"  y="263" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="150" y="263" text-anchor="middle" font-size="12" fill="#333">hello</text>
  <text x="238" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a">(4−1+5)%5 = 3</text>
  <text x="340" y="271" text-anchor="middle" font-size="10" fill="#888">向右 3 步</text>
  <text x="438" y="256" text-anchor="middle" font-size="11" fill="#b85450">(1−4+5)%5 = 2</text>
  <text x="438" y="271" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min = 2</text>
  <line x1="28" y1="280" x2="532" y2="280" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Result row -->
  <rect x="28" y="280" width="504" height="44" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = min( dist(0), dist(4) ) = min(1, 2)</text>
  <text x="280" y="317" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">= 1 ✓</text>

  <!-- Bottom note -->
  <text x="48" y="352" font-size="11" fill="#555">• 下标 0 虽顺时针要走 4 步，但逆时针仅 1 步 → 取小后是 1（向左 1 步那条路）</text>
  <text x="48" y="370" font-size="11" fill="#555">• 两处 hello 都要算，取所有出现位置的最小，而非首个撞上的</text>
</svg>
