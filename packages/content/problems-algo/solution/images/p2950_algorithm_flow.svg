<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 575" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="575" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和预处理 + 双重枚举，O(n²)</text>

  <ellipse cx="280" cy="54" rx="52" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 280 72 L 280 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="120" y="88" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333">预处理前缀和：pre[0]=0；pre[i+1]=pre[i]+val(word[i])</text>

  <path d="M 280 124 L 280 136" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="150" y="140" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="12" fill="#333">ans = 0；左端点 i = 0</text>

  <path d="M 280 172 L 280 182" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="170" y="188" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="12" fill="#333">右端点 j = i</text>

  <path d="M 280 220 L 280 230" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="120" y="236" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333">sum = pre[j+1] − pre[i]；len = j − i + 1</text>

  <path d="M 280 272 L 280 278" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,282 392,318 280,354 168,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333">sum % len == 0？</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#888">（和能被长度整除？）</text>

  <path d="M 392 318 L 418 318" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="404" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <rect x="424" y="300" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="472" y="322" text-anchor="middle" font-size="12" fill="#333">ans += 1</text>

  <path d="M 472 336 L 472 362 L 292 362" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <path d="M 280 354 L 280 366" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="362" font-size="11" fill="#b85450">否</text>

  <polygon points="280,370 372,404 280,438 188,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#333">j &lt; n？</text>

  <path d="M 188 404 L 110 404 L 110 204 L 166 204" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="164" y="394" text-anchor="middle" font-size="11" fill="#446688">是</text>
  <text x="60" y="396" font-size="11" fill="#446688">j++（右移）</text>

  <path d="M 280 438 L 280 450" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="448" font-size="11" fill="#b85450">否</text>

  <polygon points="280,454 372,488 280,522 188,488" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="493" text-anchor="middle" font-size="12" fill="#333">i &lt; n？</text>

  <path d="M 372 488 L 534 488 L 534 156 L 414 156" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="386" y="478" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <text x="444" y="514" font-size="11" fill="#d6a040">i++（换左端点）</text>

  <path d="M 280 522 L 280 534" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="532" font-size="11" fill="#b85450">否</text>

  <ellipse cx="280" cy="552" rx="62" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="557" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>
</svg>
