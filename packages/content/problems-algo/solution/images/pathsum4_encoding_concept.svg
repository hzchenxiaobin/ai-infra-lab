<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三位数编码：百位=深度 D，十位=位置 P，个位=值 V</text>

  <!-- ===== Encoding decomposition: 3 1 4 ===== -->
  <g font-size="18">
    <rect x="195" y="48" width="50" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="76" text-anchor="middle" fill="#8a6a20" font-weight="bold">3</text>

    <rect x="255" y="48" width="50" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="280" y="76" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <rect x="315" y="48" width="50" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="340" y="76" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <g font-size="10">
    <text x="220" y="104" text-anchor="middle" fill="#8a6a20">深度 D=3</text>
    <text x="280" y="104" text-anchor="middle" fill="#446688">位置 P=1</text>
    <text x="340" y="104" text-anchor="middle" fill="#4a7a3a">值 V=4</text>
  </g>

  <!-- key hint -->
  <rect x="380" y="52" width="150" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">key = 31 = D×10+P</text>
  <text x="455" y="98" text-anchor="middle" font-size="10" fill="#b85450">= num ÷ 10</text>

  <!-- arrow from encoding to tree node (3,1) -->
  <path d="M 220 112 Q 200 130 175 150" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Tree with (D,P) labels ===== -->
  <g font-size="12">
    <!-- D=1 P=1 val=3 (root) -->
    <circle cx="175" cy="170" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="175" y="175" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="175" y="206" text-anchor="middle" font-size="9" fill="#888">(1,1)</text>

    <!-- D=2 P=1 val=5 -->
    <circle cx="120" cy="232" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="120" y="237" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="120" y="262" text-anchor="middle" font-size="9" fill="#888">(2,1)</text>

    <!-- D=2 P=2 val=7 -->
    <circle cx="230" cy="232" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="230" y="237" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <text x="230" y="262" text-anchor="middle" font-size="9" fill="#888">(2,2)</text>

    <!-- edges D1->D2 -->
    <line x1="162" y1="184" x2="132" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="188" y1="184" x2="218" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- D=3 P=1 val=4 (highlighted = the decomposed node) -->
    <circle cx="90" cy="300" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="90" y="305" text-anchor="middle" fill="#8a6a20" font-weight="bold">4</text>
    <text x="90" y="330" text-anchor="middle" font-size="9" fill="#888">(3,1)</text>

    <!-- D=3 P=2 val=8 -->
    <circle cx="150" cy="300" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="150" y="305" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <text x="150" y="330" text-anchor="middle" font-size="9" fill="#888">(3,2)</text>

    <!-- D=3 P=3 val=6 -->
    <circle cx="260" cy="300" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="260" y="305" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="260" y="330" text-anchor="middle" font-size="9" fill="#888">(3,3)</text>

    <!-- edges D2->D3 -->
    <line x1="108" y1="246" x2="96" y2="286" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="132" y1="246" x2="144" y2="286" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="218" y1="246" x2="250" y2="286" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>

    <!-- D=4 P=1 val=1 -->
    <circle cx="62" cy="370" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="62" y="375" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="62" y="397" text-anchor="middle" font-size="9" fill="#888">(4,1)</text>

    <!-- D=4 P=6 val=2 -->
    <circle cx="290" cy="370" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="290" y="375" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="290" y="397" text-anchor="middle" font-size="9" fill="#888">(4,6)</text>

    <!-- edges D3->D4 -->
    <line x1="78" y1="314" x2="66" y2="356" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="274" y1="314" x2="286" y2="356" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  </g>

  <!-- ===== Right side: position formula ===== -->
  <rect x="360" y="130" width="186" height="156" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="453" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">满二叉树位置法则</text>
  <line x1="380" y1="164" x2="526" y2="164" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="378" y="186" font-size="11" fill="#444">节点 (D, P)：</text>
  <text x="378" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">左孩子 = (D+1, 2P−1)</text>
  <text x="378" y="230" font-size="11" fill="#b85450" font-weight="bold">右孩子 = (D+1, 2P)</text>
  <line x1="380" y1="242" x2="526" y2="242" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="378" y="262" font-size="10" fill="#555">例：(2,1) 的孩子</text>
  <text x="378" y="276" font-size="10" fill="#4a7a3a">→ 左 (3,1) ✓</text>

  <!-- example arrow: (2,1) -> (3,1) -->
  <path d="M 134 240 Q 100 260 92 286" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: hash map hint ===== -->
  <rect x="30" y="410" width="500" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="11" fill="#7a5a20">无需建树：哈希表 key=D×10+P → V，DFS 按位置法则找孩子</text>
</svg>
