<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [12, 6, 3, 14, 8]</text>

  <!-- ===== table grid ===== -->
  <!-- columns: 步骤(60) | x(60) | g(前)(90) | gcd(g,x)(110) | 动作(130) | ans(70) -->
  <!-- x origins: 40, 100, 160, 250, 360, 430 ... let's define -->
  <text x="76" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="136" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">x</text>
  <text x="206" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">g（前）</text>
  <text x="306" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">gcd(g, x)</text>
  <text x="406" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">动作</text>
  <text x="506" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">ans</text>

  <!-- header underline -->
  <line x1="40" y1="66" x2="548" y2="66" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- column separators (light) -->
  <line x1="106" y1="44" x2="106" y2="226" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="166" y1="44" x2="166" y2="226" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="246" y1="44" x2="246" y2="226" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="366" y1="44" x2="366" y2="226" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="446" y1="44" x2="446" y2="226" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>

  <!-- row data: y centers 86, 116, 146, 176, 206 -->
  <!-- row1: step1, x=12, g=0, gcd(0,12)=12, 同段, ans=1 -->
  <text x="76" y="90" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="136" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="206" y="90" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="306" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">12</text>
  <text x="406" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a">g≠1，留本段</text>
  <text x="506" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- row2: x=6, g=12, gcd=6 -->
  <text x="76" y="120" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="136" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="206" y="120" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="306" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="406" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">g≠1，留本段</text>
  <text x="506" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- row3: x=3, g=6, gcd=3 -->
  <text x="76" y="150" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="136" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="206" y="150" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="306" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="406" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">g≠1，留本段</text>
  <text x="506" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- row4: x=14, g=3, gcd(3,14)=1 → CUT (red highlight) -->
  <rect x="42" y="166" width="506" height="24" fill="#fce4ec" stroke="none" opacity="0.55" filter="url(#rough2)"/>
  <text x="76" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="136" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">14</text>
  <text x="206" y="180" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="306" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="406" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">切！新开段 g=14</text>
  <text x="506" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- row5: x=8, g=14, gcd=2 -->
  <text x="76" y="210" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="136" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="206" y="210" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="306" y="210" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="406" y="210" text-anchor="middle" font-size="11" fill="#446688">g≠1，留本段</text>
  <text x="506" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <line x1="40" y1="226" x2="548" y2="226" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- result line -->
  <text x="48" y="250" font-size="12.5" fill="#333" font-weight="bold">结果：</text>
  <text x="92" y="250" font-size="12" fill="#333">[12,6,3] gcd=3 &gt; 1　·　[14,8] gcd=2 &gt; 1　→　ans = </text>
  <text x="466" y="250" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- divider -->
  <line x1="40" y1="270" x2="548" y2="270" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- example 2 mini box -->
  <rect x="40" y="284" width="500" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#446688" font-weight="bold">示例 2：nums = [4, 12, 6, 14]</text>
  <text x="56" y="326" font-size="11.5" fill="#333">g：4 → gcd(4,12)=4 → gcd(4,6)=2 → gcd(2,14)=2，全程 &gt; 1，从不触发切点。</text>
  <text x="56" y="346" font-size="11.5" fill="#333">整个数组即一段，ans = </text>
  <text x="196" y="346" font-size="12.5" fill="#446688" font-weight="bold">1</text>
  <text x="216" y="346" font-size="11.5" fill="#888">（全数组 gcd = 2，无需拆分）</text>
</svg>
