<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,null,2,null,3,null,4]</text>

  <!-- 上排：原树（右倾链） -->
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#888">原树：右倾链（高度 4）</text>
  <circle cx="80" cy="86" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="90" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="120" cy="130" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="88" y1="98" x2="114" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="160" cy="174" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="128" y1="142" x2="154" y2="162" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="200" cy="218" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="222" text-anchor="middle" font-size="11" fill="#333">4</text>
  <line x1="168" y1="186" x2="194" y2="206" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 中序展开箭头 -->
  <path d="M 120 250 L 120 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="264" font-size="10" fill="#b85450" font-weight="bold">中序遍历</text>

  <!-- 升序数组 -->
  <text x="120" y="288" text-anchor="middle" font-size="11" fill="#888">nums（升序）</text>
  <rect x="50" y="296" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="314" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="86" y="296" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="314" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="122" y="296" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="158" y="296" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="314" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="68" y="338" text-anchor="middle" font-size="9" fill="#888">[0]</text>
  <text x="104" y="338" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[1]=mid</text>
  <text x="140" y="338" text-anchor="middle" font-size="9" fill="#888">[2]</text>
  <text x="176" y="338" text-anchor="middle" font-size="9" fill="#888">[3]</text>

  <!-- 取中点重建箭头 -->
  <path d="M 220 310 L 360 310" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">build(0,3) → 取 mid=1</text>

  <!-- 右侧：重建步骤表 -->
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#888">分治重建步骤</text>
  <rect x="360" y="72" width="240" height="200" fill="none" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <text x="372" y="92" font-size="10" fill="#555" font-weight="bold">步骤  区间      mid  根值</text>
  <line x1="372" y1="98" x2="590" y2="98" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="372" y="116" font-size="11" fill="#333">  1   [0,3]     1     2</text>
  <text x="372" y="138" font-size="11" fill="#333">  2   [0,0]     0     1</text>
  <text x="372" y="160" font-size="11" fill="#333">  3   [2,3]     2     3</text>
  <text x="372" y="182" font-size="11" fill="#333">  4   [3,3]     3     4</text>

  <text x="372" y="212" font-size="10" fill="#4a7a3a">根 2: 左 [0,0]=1, 右 [2,3]</text>
  <text x="372" y="230" font-size="10" fill="#4a7a3a">根 3: 左 空, 右 [3,3]=4</text>
  <text x="372" y="252" font-size="10" fill="#888">每步左右节点数差 ≤ 1</text>

  <!-- 下排：重建后的平衡 BST -->
  <text x="490" y="300" text-anchor="middle" font-size="12" fill="#888">平衡 BST（高度 3）</text>
  <circle cx="490" cy="326" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <circle cx="450" cy="376" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#333">1</text>
  <line x1="482" y1="338" x2="456" y2="364" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="530" cy="376" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="380" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="498" y1="338" x2="524" y2="364" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="560" cy="422" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="426" text-anchor="middle" font-size="10" fill="#333">4</text>
  <line x1="538" y1="388" x2="556" y2="412" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 验证说明 -->
  <rect x="40" y="392" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="412" font-size="11" fill="#333" font-weight="bold">验证平衡：</text>
  <text x="56" y="428" font-size="10" fill="#555">根 2: 左高 1 / 右高 2，差 1 ✓</text>
  <text x="56" y="442" font-size="10" fill="#555">节点 3: 左高 0 / 右高 1，差 1 ✓</text>
</svg>
