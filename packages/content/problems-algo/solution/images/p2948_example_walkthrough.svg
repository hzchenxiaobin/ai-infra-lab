<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2：nums = [1,7,6,18,2,1]，limit = 3</text>

  <text x="200" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4&gt;3</text>
  <text x="316" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">11&gt;3</text>

  <rect x="70" y="48" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="69" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="116" y="48" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="69" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="162" y="48" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="69" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="230" y="48" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="69" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="276" y="48" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="69" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="346" y="48" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="69" text-anchor="middle" font-size="13" fill="#333">18</text>

  <text x="91" y="94" text-anchor="middle" font-size="10" fill="#888">i0</text>
  <text x="137" y="94" text-anchor="middle" font-size="10" fill="#888">i5</text>
  <text x="183" y="94" text-anchor="middle" font-size="10" fill="#888">i4</text>
  <text x="251" y="94" text-anchor="middle" font-size="10" fill="#888">i2</text>
  <text x="297" y="94" text-anchor="middle" font-size="10" fill="#888">i1</text>
  <text x="367" y="94" text-anchor="middle" font-size="10" fill="#888">i3</text>

  <path d="M 195 48 L 203 55 L 194 62 L 204 69 L 196 76 L 202 80" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 311 48 L 319 55 L 310 62 L 320 69 L 312 76 L 318 80" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="40" y="108" width="155" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="117" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">块 A</text>
  <text x="117" y="148" text-anchor="middle" font-size="11" fill="#555">值↑：1, 1, 2</text>
  <text x="117" y="165" text-anchor="middle" font-size="11" fill="#555">下标↑：0, 4, 5</text>
  <text x="117" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[0]=1, ans[4]=1</text>
  <text x="117" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[5]=2</text>

  <rect x="215" y="108" width="140" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">块 B</text>
  <text x="285" y="148" text-anchor="middle" font-size="11" fill="#555">值↑：6, 7</text>
  <text x="285" y="165" text-anchor="middle" font-size="11" fill="#555">下标↑：1, 2</text>
  <text x="285" y="184" text-anchor="middle" font-size="10" fill="#d6a040">ans[1]=6</text>
  <text x="285" y="198" text-anchor="middle" font-size="10" fill="#d6a040">ans[2]=7</text>

  <rect x="375" y="108" width="115" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">块 C</text>
  <text x="432" y="148" text-anchor="middle" font-size="11" fill="#555">值↑：18</text>
  <text x="432" y="165" text-anchor="middle" font-size="11" fill="#555">下标↑：3</text>
  <text x="432" y="184" text-anchor="middle" font-size="10" fill="#446688">ans[3]=18</text>

  <path d="M 117 204 C 117 228 117 236 118 248" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 285 204 C 285 228 240 230 233 248" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 432 204 C 432 228 380 230 373 248" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="95" y="252" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="276" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="147" y="252" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="276" text-anchor="middle" font-size="14" fill="#333">6</text>
  <rect x="199" y="252" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="276" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="251" y="252" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="276" text-anchor="middle" font-size="14" fill="#333">18</text>
  <rect x="303" y="252" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="276" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="355" y="252" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="276" text-anchor="middle" font-size="14" fill="#333">2</text>

  <text x="118" y="306" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="170" y="306" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="222" y="306" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="274" y="306" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="326" y="306" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="378" y="306" text-anchor="middle" font-size="10" fill="#888">5</text>

  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = [1, 6, 7, 18, 1, 2] ✓</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#555">最小的值给最靠前的下标，逐位贪心</text>
</svg>
