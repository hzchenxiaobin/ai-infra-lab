<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个典型情形的字符串比较</text>

  <!-- timeline -->
  <line x1="40" y1="58" x2="520" y2="58" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 520 58 L 512 54 L 512 62 Z" fill="#888" filter="url(#rough2)"/>
  <text x="48" y="52" font-size="10" fill="#888">00:00</text>
  <text x="500" y="52" font-size="10" fill="#888">24:00</text>

  <!-- Example 1 -->
  <text x="40" y="90" font-size="11" fill="#446688" font-weight="bold">示例1</text>
  <text x="90" y="90" font-size="10.5" fill="#333">event1=["01:15","02:00"]　event2=["02:00","03:00"]</text>
  <rect x="95" y="98" width="85" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="111" text-anchor="middle" font-size="9" fill="#446688">01:15–02:00</text>
  <rect x="180" y="98" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a">02:00–03:00</text>
  <circle cx="180" cy="107" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="330" y="111" font-size="10.5" fill="#333">e1&lt;s2? "02:00"&lt;"02:00"=否</text>
  <rect x="470" y="96" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Example 2 -->
  <text x="40" y="160" font-size="11" fill="#446688" font-weight="bold">示例2</text>
  <text x="90" y="160" font-size="10.5" fill="#333">event1=["01:00","02:00"]　event2=["01:20","03:00"]</text>
  <rect x="80" y="168" width="100" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="181" text-anchor="middle" font-size="9" fill="#446688">01:00–02:00</text>
  <rect x="116" y="188" width="184" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="201" text-anchor="middle" font-size="9" fill="#4a7a3a">01:20–03:00</text>
  <rect x="116" y="168" width="64" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="181" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">交集</text>
  <text x="330" y="181" font-size="10.5" fill="#333">e1&lt;s2? "02:00"&lt;"01:20"=否</text>
  <rect x="470" y="166" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Example 3 -->
  <text x="40" y="250" font-size="11" fill="#b85450" font-weight="bold">示例3</text>
  <text x="90" y="250" font-size="10.5" fill="#333">event1=["10:00","11:00"]　event2=["14:00","15:00"]</text>
  <rect x="200" y="258" width="90" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="271" text-anchor="middle" font-size="9" fill="#446688">10:00–11:00</text>
  <rect x="300" y="258" width="90" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="271" text-anchor="middle" font-size="9" fill="#4a7a3a">14:00–15:00</text>
  <text x="330" y="291" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">e1&lt;s2: "11:00"&lt;"14:00"=是 → 相离</text>
  <rect x="470" y="256" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="271" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- note -->
  <rect x="40" y="312" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键："HH:MM" 零填充定长 → 字典序即时间序</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#446688">故全程用字符串 ≤/&lt; 直接比较，无需转分钟，O(1) 两次比较即定结论</text>
</svg>
