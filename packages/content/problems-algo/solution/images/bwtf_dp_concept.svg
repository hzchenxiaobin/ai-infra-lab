<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：非叶 = 左子×右子，按值排序后因子必更小（已算好）</text>

  <!-- binary tree: root 10, left 2, right 5 -->
  <rect x="230" y="52" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="258" y="76" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">10</text>
  <text x="294" y="72" font-size="10" fill="#888">根 = 非叶</text>

  <!-- edges to children -->
  <path d="M 244 90 Q 190 110 160 132" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 272 90 Q 326 110 356 132" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- left child 2 -->
  <rect x="130" y="134" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="155" y="184" text-anchor="middle" font-size="10" fill="#888">左子 a</text>

  <!-- right child 5 -->
  <rect x="330" y="134" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="355" y="156" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="355" y="184" text-anchor="middle" font-size="10" fill="#888">右子 b</text>

  <!-- product equation -->
  <text x="258" y="120" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a × b = x</text>
  <text x="155" y="208" text-anchor="middle" font-size="10" fill="#888">dp[a] 棵子树</text>
  <text x="355" y="208" text-anchor="middle" font-size="10" fill="#888">dp[b] 棵子树</text>

  <!-- merge arrows down -->
  <path d="M 155 216 Q 155 240 220 248" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 355 216 Q 355 240 296 248" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- recurrence box -->
  <rect x="40" y="254" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[x] = 1（单叶）+ Σ dp[a] × dp[b]</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#888">对所有满足 a×b=x 且 a,b∈arr 的因子对求和</text>

  <!-- ordering note -->
  <rect x="40" y="322" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a">a≠b 时遍历 a 与遍历 b 各贡献一次 → 左右两种排列都计入</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a">a=b 时只遇一次 → dp[a]² 一种排列</text>
</svg>
