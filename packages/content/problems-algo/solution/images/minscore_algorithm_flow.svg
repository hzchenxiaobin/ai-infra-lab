<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：BFS 标可达 + 扫一遍边取最小</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">等价于：求城市1所在连通块的最小边权</text>

  <!-- Step 1: start -->
  <rect x="200" y="56" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>
  <path d="M 260 88 L 260 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: build adjacency -->
  <rect x="150" y="104" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="11" fill="#333">建邻接表 g[a].push((b,d)), g[b].push((a,d))</text>
  <path d="M 260 140 L 260 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: BFS from 1 -->
  <rect x="150" y="156" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="11" fill="#333">BFS/DFS 从城市1出发，vis[] 标记可达节点</text>
  <path d="M 260 192 L 260 204" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: init ans -->
  <rect x="200" y="208" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = +∞</text>
  <path d="M 260 240 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: loop over edges (diamond) -->
  <path d="M 260 256 L 360 290 L 260 324 L 160 290 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">遍历每条边 (a,b,d)</text>
  <text x="260" y="301" text-anchor="middle" font-size="10" fill="#555">vis[a]? → ans = min(ans, d)</text>

  <!-- loop back arrow -->
  <path d="M 160 290 L 110 290 L 110 273" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="284" text-anchor="middle" font-size="9.5" fill="#888">下一条</text>

  <!-- Step 6: return -->
  <path d="M 360 290 L 420 290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="276" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="463" y="296" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>

  <!-- side note -->
  <rect x="390" y="150" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="167" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">并查集也可</text>
  <text x="450" y="181" text-anchor="middle" font-size="9.5" fill="#888">union 后取 find(1) 同根边最小权</text>
  <path d="M 390 170 L 372 170" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
