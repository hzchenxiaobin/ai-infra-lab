<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：[1,2,3,4,5], k = 2</text>
  <path d="M 280 38 Q 450 46 620 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Phase 1: first walks k-1 = 1 step -->
  <text x="40" y="74" font-size="13" font-weight="bold" fill="#2b6e9e">① first 从 head 走 k−1 = 1 步 → first 落在节点 2（正数第 k）</text>

  <g filter="url(#sk)"><rect x="60" y="90" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="90" y="114" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="160" y="90" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="190" y="114" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="260" y="90" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="290" y="114" text-anchor="middle" font-size="14" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="360" y="90" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="390" y="114" text-anchor="middle" font-size="14" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="460" y="90" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="490" y="114" text-anchor="middle" font-size="14" fill="#444">5</text>
  <text x="540" y="114" font-size="11" fill="#888">→ null</text>

  <path d="M 120 110 L 156 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 220 110 L 256 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 110 L 356 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 110 L 456 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 110 L 556 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">first ✓</text>
  <path d="M 190 144 L 190 130" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- Phase 2: second walks with first until first.next==null -->
  <text x="40" y="186" font-size="13" font-weight="bold" fill="#a06a10">② second = head；与 first 同速推进，直到 first.next == null</text>

  <g filter="url(#sk)"><rect x="60" y="202" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="90" y="226" text-anchor="middle" font-size="14" fill="#a06a10" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="160" y="202" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="190" y="226" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="260" y="202" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="290" y="226" text-anchor="middle" font-size="14" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="360" y="202" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="390" y="226" text-anchor="middle" font-size="14" fill="#a06a10" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="460" y="202" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="490" y="226" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="540" y="226" font-size="11" fill="#888">→ null</text>

  <path d="M 120 222 L 156 222" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 220 222 L 256 222" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 222 L 356 222" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 222 L 456 222" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 222 L 556 222" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="490" y="262" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">first（到尾，停）</text>
  <path d="M 490 258 L 490 244" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="390" y="262" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold">second ✓（倒数第 k）</text>
  <path d="M 390 258 L 390 244" stroke="#a06a10" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- push trace table -->
  <text x="600" y="216" font-size="11" fill="#555">同速推进轨迹：</text>
  <text x="600" y="234" font-size="11" fill="#888">first: 2→3→4→5（停）</text>
  <text x="600" y="252" font-size="11" fill="#888">second: 1→2→3→4（停）</text>
  <text x="600" y="270" font-size="11" fill="#888">各走 3 步，间距恒 1</text>

  <!-- Phase 3: swap values -->
  <text x="40" y="302" font-size="13" font-weight="bold" fill="#b85450">③ swap(first.val, second.val)：交换值 2 与 4</text>

  <g filter="url(#sk)"><rect x="60" y="318" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="90" y="342" text-anchor="middle" font-size="14" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="160" y="318" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="190" y="342" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="260" y="318" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="290" y="342" text-anchor="middle" font-size="14" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="360" y="318" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="390" y="342" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="460" y="318" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="490" y="342" text-anchor="middle" font-size="14" fill="#444">5</text>
  <text x="540" y="342" font-size="11" fill="#888">→ null</text>

  <path d="M 120 338 L 156 338" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 220 338 L 256 338" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 338 L 356 338" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 338 L 456 338" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 338 L 556 338" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- swap arrow between 2 and 4 positions -->
  <path d="M 190 360 Q 290 392 390 360" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 390 360 Q 290 392 190 360" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结果：1 → 4 → 3 → 2 → 5</text>
</svg>
