<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + 各取最大间距，O(n log n)</text>

  <!-- Start -->
  <ellipse cx="220" cy="52" rx="44" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="56" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 220 67 L 220 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Input -->
  <rect x="90" y="78" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333">读入 h, w, horizontalCuts, verticalCuts</text>
  <path d="M 220 112 L 220 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Add boundaries -->
  <rect x="70" y="122" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#333">加入边界：hCuts 追加 0 与 h</text>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#333">vCuts 追加 0 与 w</text>
  <path d="M 220 162 L 220 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort -->
  <rect x="120" y="172" width="200" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="193" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">分别排序 hCuts / vCuts</text>
  <path d="M 220 204 L 220 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute maxH gap (loop) -->
  <rect x="60" y="214" width="320" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="232" text-anchor="middle" font-size="11" fill="#333">遍历相邻对，maxH = max(hCuts[i] − hCuts[i−1])</text>
  <text x="220" y="248" text-anchor="middle" font-size="10" fill="#888">i 从 1 到 len−1</text>
  <path d="M 220 254 L 220 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute maxV gap -->
  <rect x="60" y="264" width="320" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="282" text-anchor="middle" font-size="11" fill="#333">遍历相邻对，maxV = max(vCuts[j] − vCuts[j−1])</text>
  <text x="220" y="298" text-anchor="middle" font-size="10" fill="#888">j 从 1 到 len−1</text>
  <path d="M 220 304 L 220 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Multiply + mod -->
  <rect x="70" y="314" width="300" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = (maxH × maxV) mod (10⁹+7)</text>
  <text x="220" y="348" text-anchor="middle" font-size="10" fill="#888">乘法用 64 位避免溢出</text>
  <path d="M 220 354 L 220 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="150" y="364" width="140" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="384" text-anchor="middle" font-size="11.5" fill="#333">return ans</text>
  <path d="M 220 396 L 220 404" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="220" cy="420" rx="44" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="424" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- Side notes -->
  <rect x="430" y="214" width="150" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="505" y="234" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">要点</text>
  <text x="505" y="252" text-anchor="middle" font-size="10" fill="#888">排序 O(n log n)</text>
  <text x="505" y="268" text-anchor="middle" font-size="10" fill="#888">取最大 O(n)</text>
  <text x="505" y="286" text-anchor="middle" font-size="10" fill="#888">不枚举 m×n 块：</text>
  <text x="505" y="300" text-anchor="middle" font-size="10" fill="#888">正数 → 乘积最大</text>
  <text x="505" y="314" text-anchor="middle" font-size="10" fill="#888">= 各自最大相乘</text>
  <text x="505" y="332" text-anchor="middle" font-size="10" fill="#888">h,w ≤ 10⁹</text>
  <text x="505" y="346" text-anchor="middle" font-size="10" fill="#888">→ 乘积达 10¹⁸</text>
  <text x="505" y="360" text-anchor="middle" font-size="10" fill="#888">须 long long + mod</text>
</svg>
