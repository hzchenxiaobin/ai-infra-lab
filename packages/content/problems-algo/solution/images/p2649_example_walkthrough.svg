<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [[[6]],[1,3],[]]，逐次 next() 取出 6、1、3</text>

  <!-- left: tree -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">嵌套结构</text>

  <!-- root -->
  <rect x="20" y="80" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="40" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arr</text>

  <!-- depth1 -->
  <rect x="120" y="70" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="148" y="87" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[[6]]</text>
  <rect x="120" y="108" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="148" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,3]</text>
  <rect x="120" y="146" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="148" y="163" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[]</text>

  <!-- depth2 -->
  <rect x="220" y="68" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="245" y="85" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[6]</text>
  <rect x="220" y="100" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="233" y="116" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="250" y="100" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="263" y="116" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- depth3: 6 -->
  <rect x="320" y="74" width="26" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="90" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- edges -->
  <path d="M 60 93 C 90 93, 95 82, 120 82" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 93 C 90 93, 95 120, 120 120" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 93 C 90 93, 95 158, 120 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 82 L 220 80" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 120 C 196 120, 200 111, 220 111" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 120 C 196 120, 200 111, 250 111" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 80 C 295 80, 300 85, 320 85" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right: step table -->
  <text x="410" y="56" font-size="12" fill="#446688" font-weight="bold">逐次 next() 调用</text>

  <!-- table header -->
  <rect x="395" y="66" width="300" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="82" font-size="10" fill="#446688" font-weight="bold">调用</text>
  <text x="560" y="82" font-size="10" fill="#446688" font-weight="bold">返回</text>
  <text x="625" y="82" font-size="10" fill="#446688" font-weight="bold">说明</text>

  <!-- row1 -->
  <rect x="395" y="92" width="300" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="113" font-size="10" fill="#333">gen.next()</text>
  <rect x="540" y="100" width="42" height="20" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="561" y="114" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="586" y="113" font-size="9" fill="#888">钻入 [[6]]→[6]→6</text>

  <!-- row2 -->
  <rect x="395" y="128" width="300" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="149" font-size="10" fill="#333">gen.next()</text>
  <rect x="540" y="136" width="42" height="20" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="561" y="150" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="586" y="149" font-size="9" fill="#888">回到 [1,3]，产出 1</text>

  <!-- row3 -->
  <rect x="395" y="164" width="300" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="185" font-size="10" fill="#333">gen.next()</text>
  <rect x="540" y="172" width="42" height="20" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="561" y="186" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="586" y="185" font-size="9" fill="#888">续 [1,3]，产出 3</text>

  <!-- row4 done -->
  <rect x="395" y="200" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="221" font-size="10" fill="#333">gen.next()</text>
  <rect x="540" y="208" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="568" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">done</text>
  <text x="600" y="221" font-size="9" fill="#888">空数组 [] 跳过</text>

  <!-- step labels on tree (1)(2)(3) -->
  <circle cx="333" cy="74" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="333" y="78" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <circle cx="233" cy="100" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="233" y="104" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <circle cx="263" cy="100" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="263" y="104" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>

  <!-- bottom note -->
  <rect x="20" y="252" width="680" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="36" y="270" font-size="11" fill="#333">惰性证据：生成器只在 <tspan font-weight="bold" fill="#b85450">next()</tspan> 被调用时才推进；不调用就停在原地，不预计算后面的值。</text>
  <text x="36" y="286" font-size="11" fill="#888">空数组 [] 不产生任何值，next() 直接跳过——递归对空输入天然收敛。</text>
</svg>
