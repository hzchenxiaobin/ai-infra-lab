<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">排序后划分：前缀抬升最小值 · 后缀补齐完善</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">示例：target=6，k=4 个不完善（前缀），m=4</text>

  <!-- target line (red dashed) -->
  <path d="M70,138 L394,138" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="400" y="142" font-size="10.5" fill="#b85450" font-weight="bold">target = 6</text>

  <!-- m line (orange dashed) over prefix region -->
  <path d="M80,182 L284,182" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">m = 4（抬升后的最小值）</text>

  <!-- divider between prefix (4 bars) and suffix (2 bars) -->
  <path d="M284,120 L284,278" stroke="#888" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="284" y="116" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">划分 k=4</text>

  <!-- ===== 6 garden bars: values [1,2,3,4,5,6], scale 22px/unit, baseline y=270 ===== -->
  <!-- bar0 val1 -> prefix, raise to m=4 -->
  <rect x="80" y="248" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="182" width="44" height="66" fill="#aecbe6" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <!-- bar1 val2 -> prefix, raise to m=4 -->
  <rect x="132" y="226" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="132" y="182" width="44" height="44" fill="#aecbe6" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <!-- bar2 val3 -> prefix, raise to m=4 -->
  <rect x="184" y="204" width="44" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="182" width="44" height="22" fill="#aecbe6" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <!-- bar3 val4 -> prefix, already >= m, no topup -->
  <rect x="236" y="182" width="44" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="258" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <!-- bar4 val5 -> suffix, raise to target=6 -->
  <rect x="288" y="160" width="44" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="138" width="44" height="22" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- bar5 val6 -> suffix, already >= target -->
  <rect x="340" y="138" width="44" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="362" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- baseline -->
  <path d="M70,270 L394,270" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- region labels -->
  <rect x="92" y="292" width="176" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="307" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">前缀·不完善 → ×partial</text>
  <rect x="300" y="292" width="84" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="342" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">后缀·完善 → ×full</text>

  <!-- cost formula annotations -->
  <text x="180" y="338" text-anchor="middle" font-size="10" fill="#446688">成本 = m·p − S_p（p 个 &lt; m 的花园补到 m）</text>
  <text x="342" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a">成本 = Σ(target − flowers[j])</text>

  <!-- beauty formula -->
  <rect x="90" y="354" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">美丽值 = (n − k)·full + m·partial</text>

  <!-- legend -->
  <rect x="448" y="292" width="12" height="12" fill="#aecbe6" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="464" y="302" font-size="9" fill="#666">补花</text>
  <rect x="448" y="312" width="12" height="12" fill="#b8dab0" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="464" y="322" font-size="9" fill="#666">补花</text>
</svg>
