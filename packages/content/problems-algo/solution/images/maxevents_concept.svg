<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按天扫描 + 最早截止优先（EDF）</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">events = [[1,3],[1,3],[2,2]]，可用天数 1~3，最多应参加 3 个</text>

  <!-- ============ ① 贪心 EDF ✓ ============ -->
  <text x="30" y="74" font-size="12" fill="#4a7a3a" font-weight="bold">① 贪心 EDF：每天挑结束最早的 → 参加 3 个 ✓</text>

  <!-- day axis -->
  <line x1="150" y1="92" x2="470" y2="92" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="10" fill="#555">
    <line x1="150" y1="88" x2="150" y2="96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="150" y="86" text-anchor="middle">1</text>
    <line x1="250" y1="88" x2="250" y2="96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="86" text-anchor="middle">2</text>
    <line x1="350" y1="88" x2="350" y2="96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="86" text-anchor="middle">3</text>
    <line x1="450" y1="88" x2="450" y2="96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="450" y="86" text-anchor="middle">end</text>
  </g>

  <!-- event bars (greedy section, y center 110-170) -->
  <!-- A [1,3]: x 150-450, y 108-126 -->
  <rect x="150" y="108" width="300" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="121" font-size="10" fill="#446688" text-anchor="end">A[1,3]</text>
  <!-- B [1,3]: x 150-450, y 132-150 -->
  <rect x="150" y="132" width="300" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="145" font-size="10" fill="#446688" text-anchor="end">B[1,3]</text>
  <!-- C [2,2]: x 250-350, y 156-174 -->
  <rect x="250" y="156" width="100" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="169" font-size="10" fill="#d6a040" text-anchor="end">C[2,2]</text>

  <!-- attended marks (green circles with ✓) -->
  <!-- day1 attend A -->
  <circle cx="200" cy="117" r="9" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="200" y="121" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
  <text x="200" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a">d1→A</text>
  <!-- day2 attend C (urgent) -->
  <circle cx="300" cy="165" r="9" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="169" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
  <text x="300" y="194" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">d2→C 最紧急！</text>
  <!-- day3 attend B -->
  <circle cx="400" cy="141" r="9" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400" y="145" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
  <text x="400" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a">d3→B</text>

  <!-- result badge -->
  <rect x="490" y="108" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3/3 全参加</text>
  <text x="545" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a">C 留给它唯一可行的 d2</text>

  <!-- divider -->
  <line x1="30" y1="216" x2="590" y2="216" stroke="#ddd" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- ============ ② 错误：先占长会议 ✗ ============ -->
  <text x="30" y="242" font-size="12" fill="#b85450" font-weight="bold">② 错误：先占长会议 A、B → C 错过第 2 天，过期 ✗</text>

  <!-- day axis -->
  <line x1="150" y1="260" x2="470" y2="260" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="10" fill="#555">
    <line x1="150" y1="256" x2="150" y2="264" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="150" y="254" text-anchor="middle">1</text>
    <line x1="250" y1="256" x2="250" y2="264" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="254" text-anchor="middle">2</text>
    <line x1="350" y1="256" x2="350" y2="264" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="254" text-anchor="middle">3</text>
    <line x1="450" y1="256" x2="450" y2="264" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="450" y="254" text-anchor="middle">end</text>
  </g>

  <!-- event bars (bad section) -->
  <rect x="150" y="276" width="300" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="289" font-size="10" fill="#446688" text-anchor="end">A[1,3]</text>
  <rect x="150" y="300" width="300" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="313" font-size="10" fill="#446688" text-anchor="end">B[1,3]</text>
  <!-- C expired: red dashed overlay -->
  <rect x="250" y="324" width="100" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="120" y="337" font-size="10" fill="#b85450" text-anchor="end">C[2,2]</text>

  <!-- attended marks -->
  <!-- day1 attend A -->
  <circle cx="200" cy="285" r="9" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="200" y="289" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
  <text x="200" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">d1→A</text>
  <!-- day2 attend B -->
  <circle cx="300" cy="309" r="9" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✓</text>
  <text x="300" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">d2→B（抢了 C 的唯一天！）</text>
  <!-- day3 C expired: red X -->
  <g stroke="#b85450" stroke-width="2.2" filter="url(#rough2)">
    <line x1="290" y1="328" x2="310" y2="346"/>
    <line x1="310" y1="328" x2="290" y2="346"/>
  </g>
  <text x="400" y="362" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">d3：C 已过期 end=2&lt;3</text>

  <!-- result badge -->
  <rect x="490" y="276" width="110" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">仅 2 个 ✗</text>
  <text x="545" y="309" text-anchor="middle" font-size="9" fill="#b85450">C 无天可用</text>

  <!-- bottom note -->
  <rect x="30" y="384" width="560" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="408" font-size="12" fill="#444" font-weight="bold">一句话：当天可选的会议里，先参加「结束最早」的——它最接近过期</text>
  <text x="50" y="428" font-size="11" fill="#555">· 用小根堆维护「已开始、未结束」会议的 endDay，每天弹堆顶参加</text>
  <text x="50" y="446" font-size="11" fill="#555">· 交换论证：把当天较晚结束的会议换成堆里更早结束的，仍合法且不减少总数</text>
</svg>
