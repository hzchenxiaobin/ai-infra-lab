<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：set / snap / get 全流程</text>

  <!-- operation timeline -->
  <text x="40" y="56" font-size="11.5" fill="#888" font-weight="bold">操作序列（cur_snap 从 0 递增）：</text>

  <rect x="30" y="64" width="480" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="10.5" fill="#444">SnapshotArray(3)</text>
  <text x="40" y="100" font-size="10.5" fill="#444">set(0,5); snap()→0</text>
  <text x="40" y="116" font-size="10.5" fill="#444">set(0,6); set(2,3); snap()→1</text>
  <text x="40" y="132" font-size="10.5" fill="#444">set(0,9)</text>

  <text x="200" y="84" font-size="10.5" fill="#888">→ 各 index 预置哨兵 (0,0)</text>
  <text x="200" y="100" font-size="10.5" fill="#888">→ arr[0] 覆盖为 (0,5)</text>
  <text x="200" y="116" font-size="10.5" fill="#888">→ arr[0] 追加 (1,6); arr[2] 追加 (1,3)</text>
  <text x="200" y="132" font-size="10.5" fill="#888">→ arr[0] 追加 (2,9)</text>

  <!-- arr[0] version list -->
  <text x="40" y="166" font-size="11.5" fill="#888" font-weight="bold">最终 arr[0] 版本列表：</text>

  <text x="40" y="196" font-size="11" fill="#888">snap:</text>
  <rect x="90" y="180" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="160" y="180" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="180" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <text x="40" y="232" font-size="11" fill="#888">val:</text>
  <rect x="90" y="216" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="160" y="216" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="230" y="216" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="125" y="268" text-anchor="middle" font-size="9" fill="#aaa">idx 0</text>
  <text x="195" y="268" text-anchor="middle" font-size="9" fill="#aaa">idx 1</text>
  <text x="265" y="268" text-anchor="middle" font-size="9" fill="#aaa">idx 2</text>

  <!-- query table header -->
  <rect x="340" y="160" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="179" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">get(idx, snap)</text>
  <text x="495" y="179" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">返回</text>
  <line x1="455" y1="160" x2="455" y2="188" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="340" y="190" width="180" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="10.5" fill="#333">get(0, 0)</text>
  <text x="495" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <line x1="455" y1="190" x2="455" y2="216" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="340" y="218" width="180" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="236" text-anchor="middle" font-size="10.5" fill="#333">get(0, 1)</text>
  <text x="495" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <line x1="455" y1="218" x2="455" y2="244" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="340" y="246" width="180" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="10.5" fill="#333">get(2, 1)</text>
  <text x="495" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="455" y1="246" x2="455" y2="272" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="340" y="274" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="292" text-anchor="middle" font-size="10.5" fill="#333">get(1, 1)</text>
  <text x="495" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <line x1="455" y1="274" x2="455" y2="300" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- annotation for sentinel -->
  <rect x="30" y="286" width="290" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">get(1, 1) → 0：index 1 从未 set</text>
  <text x="175" y="322" text-anchor="middle" font-size="10.5" fill="#555">版本列表仅哨兵 (0,0)，命中返回 0</text>

  <!-- footer -->
  <rect x="30" y="344" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="275" y="364" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">规律：找「≤ snap_id 的最大版本」对应的 val</text>
  <text x="275" y="380" text-anchor="middle" font-size="10.5" fill="#555">同周期多次 set 只保留最新；从未 set 命中哨兵 0</text>
</svg>
