<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：FROM → GROUP BY → MIN 聚合 → SELECT 输出</text>

  <!-- Step boxes -->
  <rect x="30" y="70" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM</text>
  <text x="90" y="108" text-anchor="middle" font-size="9.5" fill="#333">Activity 全表</text>

  <rect x="170" y="70" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② GROUP BY</text>
  <text x="230" y="108" text-anchor="middle" font-size="9.5" fill="#333">按 player_id 分桶</text>

  <rect x="310" y="70" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ MIN</text>
  <text x="370" y="108" text-anchor="middle" font-size="9.5" fill="#333">组内取最小日期</text>

  <rect x="430" y="70" width="110" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ SELECT</text>
  <text x="485" y="108" text-anchor="middle" font-size="9.5" fill="#333">输出两列</text>

  <path d="M150 95 L170 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M290 95 L310 95" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M430 95 L430 95" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M430 95 L430 95" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- transformation row: show data shape changing -->
  <text x="90" y="148" text-anchor="middle" font-size="9.5" fill="#555">5 行</text>
  <text x="230" y="148" text-anchor="middle" font-size="9.5" fill="#555">3 桶</text>
  <text x="370" y="148" text-anchor="middle" font-size="9.5" fill="#555">3 个最小值</text>
  <text x="485" y="148" text-anchor="middle" font-size="9.5" fill="#555">3 行结果</text>

  <!-- arrow between MIN and SELECT -->
  <path d="M430 95 L430 95" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M430 95 L430 95" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Logical vs written order note -->
  <rect x="30" y="180" width="510" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⚠ 逻辑执行顺序 ≠ 书写顺序</text>
  <text x="50" y="230" font-size="10.5" fill="#333">书写：SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY</text>
  <text x="50" y="250" font-size="10.5" fill="#b85450" font-weight="bold">执行：FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</text>
  <text x="50" y="276" font-size="10.5" fill="#555">→ WHERE 在 GROUP BY 之前：不能写聚合函数（聚合还没发生）</text>
  <text x="50" y="294" font-size="10.5" fill="#555">→ HAVING 在 GROUP BY 之后：可写聚合函数（如 HAVING MIN(event_date) &lt; '2017-01-01'）</text>
  <text x="50" y="312" font-size="10.5" fill="#555">→ SELECT 别名在最后才生效：WHERE 里不能用 first_login 这个别名</text>
</svg>
