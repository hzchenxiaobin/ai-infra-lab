<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 700" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="700" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">旋转图像算法流程（转置 + 水平翻转）</text>

  <!-- Start -->
  <rect x="165" y="40" width="130" height="32" fill="#f0f0f0" stroke="#888" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="230" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始 rotate()</text>
  <path d="M 230 72 L 230 88" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Phase 1 header -->
  <rect x="55" y="90" width="350" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">阶段 ① 转置：沿主对角线交换</text>
  <path d="M 230 126 L 230 142" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond i<n (phase1) -->
  <polygon points="230,144 320,177 230,210 140,177" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="189" text-anchor="middle" font-size="10" fill="#777">还有行？</text>

  <!-- Yes down -->
  <path d="M 230 210 L 230 226" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="245" y="222" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- j = i+1 -->
  <rect x="150" y="228" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="248" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">j = i + 1</text>
  <path d="M 230 258 L 230 274" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond j<n -->
  <polygon points="230,276 322,309 230,342 138,309" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j &lt; n ?</text>
  <text x="230" y="321" text-anchor="middle" font-size="10" fill="#777">上三角元素？</text>

  <!-- Yes: swap, loop back -->
  <path d="M 230 342 L 230 358" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="245" y="354" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="105" y="360" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="381" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">swap(m[i][j], m[j][i]);  j++</text>
  <!-- loop back to j<n -->
  <path d="M 355 377 L 415 377 L 415 309 L 324 309" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- No from j<n: i++ and back to i<n -->
  <path d="M 138 309 L 62 309 L 62 177 L 138 177" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="10.5" fill="#b85450" font-weight="bold">No</text>
  <text x="66" y="245" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">i++</text>

  <!-- No from i<n: go to phase 2 -->
  <path d="M 320 177 L 435 177 L 435 460 L 230 460 L 230 468" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="335" y="170" font-size="11" fill="#b85450" font-weight="bold">No · 转置完成</text>

  <!-- Phase 2 header -->
  <rect x="55" y="470" width="350" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="493" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">阶段 ② 水平翻转：每行左右镜像</text>
  <path d="M 230 506 L 230 522" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond i<n (phase2) -->
  <polygon points="230,524 320,557 230,590 140,557" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="553" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="569" text-anchor="middle" font-size="10" fill="#777">还有行？</text>

  <!-- Yes: reverse row, loop back -->
  <path d="M 230 590 L 230 606" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="245" y="602" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="110" y="608" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="629" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">reverse(row i);  i++</text>
  <path d="M 350 625 L 405 625 L 405 557 L 322 557" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- No from i<n2: end -->
  <path d="M 320 557 L 435 557 L 435 676 L 297 676" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="335" y="550" font-size="11" fill="#b85450" font-weight="bold">No · 完成</text>

  <!-- End -->
  <rect x="165" y="660" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="230" y="680" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束 ✓</text>
</svg>
