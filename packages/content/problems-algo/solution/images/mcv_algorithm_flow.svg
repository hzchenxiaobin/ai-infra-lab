<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针归并，三分支决策，命中即返回</text>

  <!-- start -->
  <rect x="215" y="40" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i = 0, j = 0</text>

  <path d="M 270 74 L 270 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <path d="M 270 94 L 332 140 L 270 186 L 208 140 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n 且 j &lt; m ?</text>
  <text x="270" y="152" text-anchor="middle" font-size="10.5" fill="#888">（两侧都未耗尽）</text>

  <!-- No branch: loop end -> -1 -->
  <path d="M 208 140 L 120 140 L 120 232" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="132" font-size="10.5" fill="#888">否</text>
  <rect x="60" y="234" width="120" height="34" fill="#eeeeee" stroke="#888" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="256" text-anchor="middle" font-size="12.5" fill="#666" font-weight="bold">return -1</text>

  <!-- Yes: down to compare -->
  <path d="M 270 186 L 270 204" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="200" font-size="10.5" fill="#446688" font-weight="bold">是</text>

  <!-- compare diamond -->
  <path d="M 270 206 L 360 250 L 270 294 L 180 250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">比较 nums1[i]</text>
  <text x="270" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">与 nums2[j]</text>

  <!-- left branch: < -> i++ -->
  <path d="M 180 250 L 150 250 L 150 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">&lt;</text>
  <rect x="100" y="320" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++ → 回环</text>

  <!-- right branch: > -> j++ -->
  <path d="M 360 250 L 390 250 L 390 318" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">&gt;</text>
  <rect x="340" y="320" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j++ → 回环</text>

  <!-- bottom branch: == -> return -->
  <path d="M 270 294 L 270 304" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="208" y="306" width="124" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">== 返回 nums1[i]</text>

  <!-- loop back arrows -->
  <path d="M 150 320 L 150 308 L 50 308 L 50 116 L 208 116" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 390 320 L 390 308 L 490 308 L 490 116 L 332 116" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="40" y="354" width="460" height="2" fill="none"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#888">每次比较至少推进一个游标，合计 ≤ n+m 步；命中提前终止</text>
</svg>
