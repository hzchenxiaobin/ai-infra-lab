  <text x="237" y="117" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="117" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="354" y="117" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="422" y="117" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

