  <text x="354" y="221" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="422" y="221" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <text x="89" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="163" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">111</text>
  <text x="237" y="247" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="354" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="422" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>

  <text x="89" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="163" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1000</text>
  <text x="237" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="295" y="273" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="422" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <text x="89" y="299" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="163" y="299" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1001</text>
  <text x="237" y="299" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">0</text>
  <text x="295" y="299" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="299" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">1</text>
  <text x="422" y="299" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="468" y="299" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 ✓</text>

  <text x="89" y="325" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="163" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1010</text>
  <text x="237" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="325" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
