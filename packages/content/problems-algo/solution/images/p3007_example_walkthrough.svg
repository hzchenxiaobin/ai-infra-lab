  <text x="468" y="325" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">超支 ✗</text>

  <!-- formula verification boxes -->
  <rect x="40" y="348" width="282" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="181" y="367" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">acc(9) = C(9,2) + C(9,4) = 4 + 2 = 6 ≤ 7 ✓</text>

  <rect x="40" y="384" width="282" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="181" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">acc(10) = C(10,2) + C(10,4) = 5 + 3 = 8 &gt; 7 ✗</text>

  <rect x="336" y="358" width="148" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="388" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 9</text>
</svg>
