  <text x="163" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">11</text>
  <text x="237" y="143" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="354" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="422" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <text x="89" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="163" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">100</text>
  <text x="237" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="295" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="354" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
