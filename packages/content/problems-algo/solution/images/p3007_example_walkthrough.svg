<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 7, x = 2 —— 找最后一个累加价格 ≤ 7 的 num</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#a87020" filter="url(#rough2)">计费位 = 第 2、4、6… 位（橙色表头列），价格 = 这两列之和</text>

  <!-- table header -->
  <rect x="60" y="48" width="400" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="89" y="65" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">num</text>
  <text x="163" y="65" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">二进制</text>
  <text x="237" y="65" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">第 2 位</text>
  <text x="295" y="65" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">第 4 位</text>
  <text x="354" y="65" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">价格</text>
  <text x="422" y="65" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">累加价格</text>

  <!-- table body -->
  <rect x="60" y="74" width="400" height="260" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- highlight rows 9 and 10 -->
  <rect x="62" y="283" width="396" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="62" y="309" width="396" height="24" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- column separators -->
  <path d="M 118 48 L 118 334" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 208 48 L 208 334" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 266 48 L 266 334" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 324 48 L 324 334" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 384 48 L 384 334" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row separators -->
  <path d="M 60 100 L 460 100" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 126 L 460 126" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 152 L 460 152" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 178 L 460 178" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 204 L 460 204" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 230 L 460 230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 256 L 460 256" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 282 L 460 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 308 L 460 308" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 60 334 L 460 334" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row data -->
  <text x="89" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="163" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="237" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="295" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="354" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="422" y="91" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>

  <text x="89" y="117" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
