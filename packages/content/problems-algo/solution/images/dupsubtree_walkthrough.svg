<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,2,3,4,null,2,4,null,null,4] 后序逐节点序列化与计数</text>

  <!-- 小树 -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序 ①→⑦</text>
  <!-- 根 1 -->
  <line x1="120" y1="82" x2="80" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="82" x2="180" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="130" cy="70" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="146" y="64" font-size="9" fill="#b85450" font-weight="bold">⑦</text>
  <!-- 节点 2 (左) -->
  <line x1="72" y1="128" x2="52" y2="172" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="80" cy="118" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="94" y="114" font-size="8" fill="#b85450" font-weight="bold">②</text>
  <!-- 节点 3 -->
  <line x1="172" y1="128" x2="148" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="188" y1="128" x2="212" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="118" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="122" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="194" y="114" font-size="8" fill="#b85450" font-weight="bold">⑥</text>
  <!-- 叶 4 (左下) -->
  <circle cx="50" cy="182" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="186" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="62" y="178" font-size="8" fill="#4a7a3a" font-weight="bold">①</text>
  <!-- 节点 2 (3 的左子) -->
  <line x1="142" y1="182" x2="128" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="146" cy="172" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="176" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="160" y="168" font-size="8" fill="#4a7a3a" font-weight="bold">④</text>
  <!-- 叶 4 (3 的右子) -->
  <circle cx="216" cy="172" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="176" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="228" y="168" font-size="8" fill="#4a7a3a" font-weight="bold">⑤</text>
  <!-- 叶 4 (B 的左子) -->
  <circle cx="126" cy="236" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="240" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="138" y="232" font-size="8" fill="#4a7a3a" font-weight="bold">③</text>

  <!-- 表格 -->
  <rect x="270" y="48" width="400" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="288" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步</text>
  <text x="335" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="470" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">key (序列化)</text>
  <text x="600" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">count / 收录</text>
  <line x1="305" y1="48" x2="305" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="380" y1="48" x2="380" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="555" y1="48" x2="555" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① -->
  <rect x="270" y="74" width="400" height="28" fill="#fafafa" filter="url(#rough2)"/>
  <text x="288" y="92" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="335" y="92" text-anchor="middle" font-size="10" fill="#333">叶 4</text>
  <text x="470" y="92" text-anchor="middle" font-size="9" fill="#555">"4,#,#"</text>
  <text x="600" y="92" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- 行 ② -->
  <rect x="270" y="102" width="400" height="28" fill="#fafafa" filter="url(#rough2)"/>
  <text x="288" y="120" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="335" y="120" text-anchor="middle" font-size="10" fill="#333">2 (左)</text>
  <text x="470" y="120" text-anchor="middle" font-size="9" fill="#555">"2,4,#,#,#"</text>
  <text x="600" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- 行 ③ -->
  <rect x="270" y="130" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="288" y="148" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="335" y="148" text-anchor="middle" font-size="10" fill="#333">叶 4</text>
  <text x="470" y="148" text-anchor="middle" font-size="9" fill="#555">"4,#,#"</text>
  <text x="600" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 收 ✓</text>

  <!-- 行 ④ -->
  <rect x="270" y="158" width="400" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="288" y="176" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="335" y="176" text-anchor="middle" font-size="10" fill="#333">2 (右)</text>
  <text x="470" y="176" text-anchor="middle" font-size="9" fill="#555">"2,4,#,#,#"</text>
  <text x="600" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 收 ✓</text>

  <!-- 行 ⑤ -->
  <rect x="270" y="186" width="400" height="28" fill="#fafafa" filter="url(#rough2)"/>
  <text x="288" y="204" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="335" y="204" text-anchor="middle" font-size="10" fill="#333">叶 4</text>
  <text x="470" y="204" text-anchor="middle" font-size="9" fill="#555">"4,#,#"</text>
  <text x="600" y="204" text-anchor="middle" font-size="10" fill="#888">3 (已收)</text>

  <!-- 行 ⑥ -->
  <rect x="270" y="214" width="400" height="28" fill="#fafafa" filter="url(#rough2)"/>
  <text x="288" y="232" text-anchor="middle" font-size="10" fill="#333">⑥</text>
  <text x="335" y="232" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="232" text-anchor="middle" font-size="9" fill="#555">"3,2,4,#,#,#,4,#,#"</text>
  <text x="600" y="232" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- 行 ⑦ -->
  <rect x="270" y="242" width="400" height="28" fill="#fafafa" filter="url(#rough2)"/>
  <text x="288" y="260" text-anchor="middle" font-size="10" fill="#333">⑦</text>
  <text x="335" y="260" text-anchor="middle" font-size="10" fill="#333">根 1</text>
  <text x="470" y="260" text-anchor="middle" font-size="9" fill="#888">"1,2,4,...,3,..."</text>
  <text x="600" y="260" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- 表格边框 -->
  <rect x="270" y="48" width="400" height="222" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="305" y1="74" x2="305" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="74" x2="380" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="555" y1="74" x2="555" y2="270" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="40" y="290" width="600" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = [③的 4, ④的 2] → [[4],[2,4]] ✓</text>
  <text x="340" y="332" text-anchor="middle" font-size="10" fill="#555">"4,#,#" 出现 3 次仅收首个；"2,4,#,#,#" 出现 2 次仅收首个</text>

  <!-- 关键观察 -->
  <rect x="40" y="358" width="600" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="340" y="378" text-anchor="middle" font-size="10" fill="#555">count == 2 时收录：首次重复即记录，后续同型不再重复加入</text>
  <text x="340" y="396" text-anchor="middle" font-size="10" fill="#555">后序保证：拼 key 时左右子树序列已就绪（自底向上）</text>
</svg>
