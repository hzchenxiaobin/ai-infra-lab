<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：奇偶性决定字符数 —— 至多 2 种字符</text>

  <text x="40" y="60" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">奇数 n = 7：单个字符出现 7 次（奇）✓</text>

  <rect x="60" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="104" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="148" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="192" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="236" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="280" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="324" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="392" y="76" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count(a)=7（奇）✓</text>

  <text x="40" y="146" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶数 n = 6：拆成 (n−1) 个 a + 1 个 b</text>

  <rect x="60" y="158" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="181" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="104" y="158" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="181" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="148" y="158" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="181" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="192" y="158" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="181" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="236" y="158" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="181" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="280" y="158" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="181" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="256" y="212" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">↑ 前 5 个 a（n−1=5，奇）　↑ 1 个 b（奇）</text>

  <rect x="60" y="222" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count(a)=5（奇）✓　count(b)=1（奇）✓</text>

  <rect x="30" y="270" width="480" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">构造策略（奇偶分治）</text>
  <text x="50" y="316" font-size="12" fill="#333" filter="url(#rough2)">• 奇数 n：直接用 1 种字符 'a' 重复 n 次，count(a)=n 为奇 ✓</text>
  <text x="50" y="338" font-size="12" fill="#333" filter="url(#rough2)">• 偶数 n：用 'a'×(n−1) + 'b'×1，n−1 为奇、1 为奇，两奇相加 = n（偶）</text>
  <text x="50" y="360" font-size="12" fill="#333" filter="url(#rough2)">• 任何 n ≥ 1 都可在 1～2 种字符内构造完成，无需枚举划分</text>
  <text x="50" y="378" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键：奇 + 奇 = 偶，故偶数 n 必能拆成两个奇数之和（至少含 1）</text>
</svg>
