<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：反转 → 取 min/max → 埃氏筛 → 区间累加</text>

  <!-- start -->
  <rect x="210" y="46" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 n（1 ≤ n ≤ 1000）</text>

  <path d="M 280 82 L 280 100" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- reverse -->
  <rect x="105" y="104" width="350" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 反转数字得 r</text>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#666">x 从 n 逐位取出：r = r·10 + x mod 10，x ÷= 10</text>

  <path d="M 280 150 L 280 168" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- min/max -->
  <rect x="105" y="172" width="350" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② lo = min(n, r)，hi = max(n, r)</text>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#666">r 可能大于 n（13→31）也可能小于（10→1）</text>

  <path d="M 280 214 L 280 232" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- sieve -->
  <rect x="100" y="236" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ 埃氏筛 is_prime[0..hi]</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#666">i 从 2 到 √hi，从 i² 起划掉 i 的倍数</text>
  <text x="480" y="256" text-anchor="middle" font-size="10.5" fill="#999">hi ≤ 1000</text>
  <text x="480" y="271" text-anchor="middle" font-size="10.5" fill="#999">一遍筛足够</text>

  <path d="M 280 286 L 280 304" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- iterate -->
  <rect x="105" y="308" width="350" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ i 从 lo 遍历到 hi</text>

  <path d="M 280 348 L 280 366" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,370 372,404 280,438 188,404" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">is_prime[i] ?</text>

  <!-- yes branch -->
  <path d="M 372 404 L 424 404" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="394" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="428" y="384" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="484" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sum += i</text>

  <!-- loop back -->
  <path d="M 484 382 L 484 330 L 458 330" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="505" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i++ 继续</text>

  <!-- no branch -->
  <path d="M 280 438 L 280 458" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="294" y="452" font-size="11" fill="#888" font-weight="bold">否（跳过）</text>
  <text x="294" y="471" font-size="10.5" fill="#999">遍历结束后向下</text>

  <!-- end -->
  <rect x="205" y="462" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="486" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 sum</text>

  <text x="280" y="524" text-anchor="middle" font-size="11" fill="#999">总复杂度 O(hi log log hi)，hi ≤ 1000，常数级</text>
</svg>
