<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先扫前缀求 sum，再从 sum 起找缺失</text>

  <!-- 阶段一标签 -->
  <rect x="18" y="36" width="168" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="102" y="50" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">阶段一：最长顺序前缀</text>

  <!-- 开始 -->
  <rect x="22" y="64" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="52" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <line x1="82" y1="80" x2="108" y2="80" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="112" y="64" width="132" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sum=nums[0]，i=1</text>
  <line x1="244" y1="80" x2="270" y2="80" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- 菱形：继续顺序？ -->
  <polygon points="356,50 440,80 356,110 272,80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="76" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i&lt;n 且</text>
  <text x="356" y="90" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">nums[i]=nums[i−1]+1?</text>

  <!-- 是：累加回环 -->
  <line x1="356" y1="110" x2="356" y2="128" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="366" y="124" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="280" y="132" width="152" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="356" y="151" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum += nums[i]，i += 1</text>
  <path d="M 280 147 L 250 147 L 250 80 L 268 80" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- 否：进入阶段二 -->
  <path d="M 440 80 L 478 80 L 478 200 L 356 200 L 348 200" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="462" y="140" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="462" y="154" font-size="9" fill="#b85450" filter="url(#rough2)">断点</text>

  <!-- 阶段二标签 -->
  <rect x="18" y="176" width="188" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="112" y="190" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">阶段二：找 ≥ sum 的最小缺失</text>

  <!-- 建集合 -->
  <rect x="22" y="212" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="81" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">vis=set(nums)</text>
  <line x1="140" y1="228" x2="164" y2="228" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- x=sum -->
  <rect x="168" y="212" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="206" y="232" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x = sum</text>
  <line x1="244" y1="228" x2="268" y2="228" stroke="#888" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- 菱形：在集合中？ -->
  <polygon points="334,196 410,228 334,260 258,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="232" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">x ∈ vis ?</text>

  <!-- 是：x+1 回环 -->
  <line x1="334" y1="260" x2="334" y2="276" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="344" y="272" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="288" y="280" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="334" y="298" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">x += 1</text>
  <path d="M 380 294 L 448 294 L 448 228 L 414 228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- 否：返回 -->
  <path d="M 410 228 L 440 228" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="422" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="444" y="210" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="14" filter="url(#rough2)"/>
  <text x="476" y="232" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 x</text>

  <!-- 底部说明 -->
  <rect x="14" y="318" width="492" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">终止性：数组至多 n 个不同值，候选 sum..sum+n 共 n+1 个 → 抽屉原理保证至多 n+1 步命中缺失</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">剪枝：值域 1 ≤ nums[i] ≤ 50，一旦 x &gt; 50 必然不在数组中，可直接返回</text>
</svg>
