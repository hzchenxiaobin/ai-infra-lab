<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：埃氏筛 + 后序 DFS 逐子树合并贡献</text>

  <!-- step 1 -->
  <rect x="60" y="40" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 埃氏筛 [1, n] 质数表</text>

  <path d="M 260 60 L 330 60" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="340" y="40" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 建邻接表，根 = 1</text>

  <path d="M 440 80 L 440 108" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="250" y="112" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="137" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 迭代 DFS 记 parent + 前序，逆序即后序</text>

  <path d="M 440 152 L 440 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: merge detail -->
  <rect x="36" y="184" width="528" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 逆序逐节点 u：初始 s，逐个子树 v 合并（c = dp[v]）</text>

  <rect x="60" y="224" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="244" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">u 非质数：初始 s = (1, 0)</text>
  <rect x="310" y="224" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">u 是质数：初始 s = (0, 1)</text>

  <text x="300" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += s₀ × c₁ + s₁ × c₀　（先统计，再更新）</text>

  <text x="175" y="304" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">更新（u 非质数）：</text>
  <text x="175" y="322" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">s₀ += c₀，s₁ += c₁</text>
  <text x="425" y="304" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">更新（u 是质数）：</text>
  <text x="425" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">s₁ += c₀（c₁ 接上 u 变 2 个质数，作废）</text>
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">处理完所有子树 后 dp[u] = s</text>

  <path d="M 300 364 L 300 392" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="160" y="396" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="419" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 全部处理完，返回 ans（long long）</text>
</svg>
