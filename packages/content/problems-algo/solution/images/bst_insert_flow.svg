<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 插入算法流程（递归）</text>

  <!-- 入口 -->
  <rect x="190" y="46" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333">insertIntoBST(root, val)</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 root 为空 -->
  <polygon points="280,96 390,130 280,164 170,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">root == null ?</text>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#888">走到空位</text>

  <!-- 是 → 返回新节点 -->
  <path d="M 170 130 L 120 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="122" font-size="10" fill="#b85450">是</text>
  <rect x="20" y="114" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="129" text-anchor="middle" font-size="10" fill="#333">return new</text>
  <text x="70" y="140" text-anchor="middle" font-size="10" fill="#333">TreeNode(val)</text>

  <!-- 否 → 继续 -->
  <path d="M 280 164 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="176" font-size="10" fill="#82b366">否</text>

  <!-- 判断 val vs root.val -->
  <polygon points="280,182 400,218 280,254 160,218" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#333">val &lt; root.val ?</text>
  <text x="280" y="230" text-anchor="middle" font-size="9" fill="#888">val≠root.val (保证不重复)</text>

  <!-- 是 → 左 -->
  <path d="M 160 218 L 110 218" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="210" font-size="9" fill="#446688">是</text>
  <rect x="20" y="202" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="217" text-anchor="middle" font-size="9" fill="#333">root.left =</text>
  <text x="65" y="228" text-anchor="middle" font-size="9" fill="#333">insert(left, val)</text>

  <!-- 否 → 右 -->
  <path d="M 400 218 L 450 218" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="210" font-size="9" fill="#4a7a3a">否</text>
  <rect x="450" y="202" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="217" text-anchor="middle" font-size="9" fill="#333">root.right =</text>
  <text x="500" y="228" text-anchor="middle" font-size="9" fill="#333">insert(right, val)</text>

  <!-- 两分支汇聚到 return root -->
  <path d="M 65 234 L 65 300 L 190 300" stroke="#666" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 234 L 500 300 L 370 300" stroke="#666" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return root -->
  <rect x="190" y="284" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#333">return root</text>

  <!-- 底部说明 -->
  <rect x="30" y="340" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="362" font-size="11" fill="#333" font-weight="bold">递归精髓：</text>
  <text x="48" y="384" font-size="11" fill="#555">root-&gt;left = insert(root-&gt;left, val) 同时完成「搜索」与「重连」——</text>
  <text x="48" y="402" font-size="11" fill="#555">递归返回插入后的子树根，直接挂到父节点指针；走到 null 返回新节点即落点</text>
</svg>
