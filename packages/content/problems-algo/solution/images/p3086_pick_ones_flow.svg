<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 534" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="534" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：pos + 前缀和 → 两类候选 → 取最小</text>

  <!-- box 1 -->
  <rect x="150" y="40" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 收集 1 的位置 pos，前缀和 pre</text>
  <path d="M 260 72 L 260 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 2 -->
  <rect x="140" y="88" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② cost(l,r)：窗口 1 挪到中位数的步数</text>

  <!-- split -->
  <path d="M 260 120 L 260 130" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 140 130 L 380 130" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 140 130 L 140 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 130 L 380 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- branch A -->
  <rect x="34" y="140" width="212" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="159" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">形态 A：change 用满</text>
  <text x="140" y="177" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">c = min(maxChanges, k)，s = k − c</text>
  <path d="M 140 186 L 140 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="24" y="202" width="232" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s = 0 → 候选 2k</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否则滑窗枚举长度 s 的窗口</text>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">候选 = 2c + cost(l, l+s−1)</text>

  <!-- branch B -->
  <rect x="274" y="140" width="212" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">形态 B：只拿小窗口</text>
  <text x="380" y="177" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">s = 1..3，且 k − s ≤ maxChanges</text>
  <path d="M 380 186 L 380 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="264" y="202" width="232" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">枚举长度 s 的连续窗口</text>
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选 = 2(k−s) + cost(l, l+s−1)</text>
  <text x="380" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（s ≤ 3 时边缘 1 可能只要 1 步）</text>

  <!-- converge -->
  <path d="M 140 266 L 140 290 L 254 290" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 266 L 380 290 L 266 290" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 260 290 L 260 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ans box -->
  <rect x="160" y="304" width="200" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = min(ans, 候选)</text>

  <!-- loop back -->
  <path d="M 160 319 L 56 319 L 56 133" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 56 133 L 138 133" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="46" y="230" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 46 230)" filter="url(#rough2)">枚举每个窗口 / 每个 s</text>

  <!-- return -->
  <path d="M 260 334 L 260 348" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="200" y="350" width="120" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- note box -->
  <rect x="24" y="404" width="472" height="116" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="428" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么只需枚举这两类？</text>
  <text x="260" y="450" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">① p 固定时拿「离 p 最近的 s 个」最优 → pos 中连续窗口，p 取中位数</text>
  <text x="260" y="470" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">② 造 1 的单价恒为 2；窗口长 ≥ 4 时，最远的 1 距中位数 ≥ 2</text>
  <text x="260" y="490" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">③ 扔掉最远的 1、换一次造 1，代价不增 → 最优解必属形态 A 或 B</text>
  <text x="260" y="510" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（两轮滑窗各 O(m)，每个窗口代价用前缀和 O(1) 求出）</text>
</svg>
