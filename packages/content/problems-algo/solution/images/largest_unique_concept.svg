<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：值域 0–1000 小 → 定长频率表 + 从高到低扫描</text>

  <!-- ===== Section A: input array ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">输入数组 A（10 个数，值域 0–1000）：</text>

  <!-- 10 cells: 5 7 3 9 4 9 8 4 9 3 ; cell w=36 gap=2 start x=81 -->
  <g filter="url(#rough2)">
    <rect x="81"  y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="119" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="157" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="195" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="233" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="271" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="309" y="58" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="347" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="385" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="423" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="99"  y="74">5</text>
    <text x="137" y="74">7</text>
    <text x="175" y="74">3</text>
    <text x="213" y="74">9</text>
    <text x="251" y="74">4</text>
    <text x="289" y="74">9</text>
    <text x="327" y="74" fill="#b85450">8</text>
    <text x="365" y="74">4</text>
    <text x="403" y="74">9</text>
    <text x="441" y="74">3</text>
  </g>
  <text x="327" y="46" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↓ 唯一次的最大值</text>

  <!-- arrow down -->
  <path d="M 270 88 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section B: frequency table ===== -->
  <text x="40" y="118" font-size="11" fill="#888" font-weight="bold">一遍扫描建频率表 cnt[0..1001]（只列出现过的值，按值降序排）：：</text>

  <!-- 6 buckets high->low : 9->3, 8->1, 7->1, 5->1, 4->2, 3->2 -->
  <g filter="url(#rough2)">
    <rect x="60"  y="128" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="134" y="128" width="62" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="208" y="128" width="62" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="282" y="128" width="62" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="356" y="128" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="430" y="128" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="91"  y="144">值 9</text>
    <text x="165" y="144">值 8</text>
    <text x="239" y="144">值 7</text>
    <text x="313" y="144">值 5</text>
    <text x="387" y="144">值 4</text>
    <text x="461" y="144">值 3</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="91"  y="160">cnt=3</text>
    <text x="165" y="160" fill="#d6a040">cnt=1</text>
    <text x="239" y="160">cnt=1</text>
    <text x="313" y="160">cnt=1</text>
    <text x="387" y="160">cnt=2</text>
    <text x="461" y="160">cnt=2</text>
  </g>

  <!-- arrow down -->
  <path d="M 270 172 L 270 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section C: scan from high ===== -->
  <text x="40" y="202" font-size="11" fill="#888" font-weight="bold">从 1000 往下扫描，首个 cnt == 1 即答案（红叉=跳过，绿勾=命中）：</text>

  <!-- scan checks -->
  <g filter="url(#rough2)">
    <rect x="60"  y="212" width="62" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="134" y="212" width="62" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="91"  y="231">9: cnt=3 ✗</text>
    <text x="165" y="231" fill="#4a7a3a">8: cnt=1 ✓</text>
  </g>
  <text x="300" y="231" font-size="11" fill="#888">→ 后续无需再看</text>

  <!-- arrow to result -->
  <path d="M 165 246 L 165 258 L 270 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 270 258 L 270 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="170" y="274" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 8（最大的唯一次数）</text>

  <!-- footer note -->
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#888">值域 V = 1001 为常数 → 数组代哈希，空间 O(1)；</text>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#888">计数 O(n) + 从高扫到低 O(V) → 时间 O(n)</text>

  <!-- value-range clue callout -->
  <rect x="60" y="362" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">线索：0 ≤ A[i] ≤ 1000 → 桶数固定 1001，可用定长数组替代哈希表</text>
</svg>
