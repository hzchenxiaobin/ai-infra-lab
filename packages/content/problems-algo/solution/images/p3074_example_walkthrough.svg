<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：降序累加，首次 ≥ total 即停</text>

  <!-- example 1 -->
  <rect x="20" y="40" width="480" height="150" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="34" y="64" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：apple = [1,3,2] → total = 6</text>

  <text x="40" y="96" font-size="10.5" fill="#888" filter="url(#rough2)">箱子(降序)</text>
  <rect x="40" y="102" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="122" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="92" y="102" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="122" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="144" y="102" width="44" height="30" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="122" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">3</text>
  <rect x="196" y="102" width="44" height="30" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="122" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">2</text>
  <rect x="248" y="102" width="44" height="30" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#8aa0b8" filter="url(#rough2)">1</text>

  <path d="M 62 132 L 62 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 114 132 L 114 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="40" y="158" font-size="10.5" fill="#888" filter="url(#rough2)">容量累计</text>
  <rect x="40" y="164" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="62" y="181" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="92" y="164" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4" filter="url(#rough2)"/>
  <text x="114" y="181" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="352" y="96" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &lt; 6，还差 1 个</text>
  <text x="352" y="118" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5+4 = 9 ≥ 6 ✓ 收工</text>
  <rect x="352" y="136" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="412" y="158" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 2</text>

  <!-- example 2 -->
  <rect x="20" y="210" width="480" height="150" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="34" y="234" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：apple = [5,5,5] → total = 15</text>

  <text x="40" y="266" font-size="10.5" fill="#888" filter="url(#rough2)">箱子(降序)</text>
  <rect x="40" y="272" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="92" y="272" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="144" y="272" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="196" y="272" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 62 302 L 62 310" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 114 302 L 114 310" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 166 302 L 166 310" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 218 302 L 218 310" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="40" y="328" font-size="10.5" fill="#888" filter="url(#rough2)">容量累计</text>
  <rect x="40" y="334" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="350" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="92" y="334" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="350" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="144" y="334" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="350" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="196" y="334" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4" filter="url(#rough2)"/>
  <text x="218" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="292" y="266" font-size="11" fill="#b85450" filter="url(#rough2)">7、11、13 都 &lt; 15</text>
  <text x="292" y="288" font-size="11" fill="#b85450" filter="url(#rough2)">差一点点，只能继续拿</text>
  <text x="292" y="310" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7+4+2+2 = 15 ≥ 15 ✓</text>
  <rect x="292" y="328" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 4（全用上）</text>
</svg>
