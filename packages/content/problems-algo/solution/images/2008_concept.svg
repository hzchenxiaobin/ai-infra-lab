<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心思想：每个子表达式携带 (值, 翻转代价) 二元组</text>

  <!-- Leaf nodes -->
  <text x="120" y="70" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">叶子节点</text>
  <rect x="60" y="84" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="100" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">'0'</text>
  <text x="88" y="116" text-anchor="middle" font-size="10.5" fill="#555">(0, 1)</text>

  <rect x="124" y="84" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="100" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">'1'</text>
  <text x="152" y="116" text-anchor="middle" font-size="10.5" fill="#555">(1, 1)</text>

  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#888">翻转 = 改数字，代价 1</text>

  <!-- arrow to merge -->
  <path d="M 200 104 L 250 104" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Merge box -->
  <text x="400" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">复合表达式 A op B</text>
  <rect x="290" y="80" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#335">合并 A 的 (av, ac) 与 B 的 (bv, bc)</text>
  <text x="400" y="118" text-anchor="middle" font-size="11" fill="#335">op = '&amp;' 或 '|'</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">→ 新二元组 (r, cost)</text>

  <!-- r and cost explanation -->
  <path d="M 400 150 L 400 174" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="100" y="178" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">r = av op bv</text>
  <text x="200" y="215" text-anchor="middle" font-size="10" fill="#777">子表达式的当前值（0 或 1）</text>

  <rect x="320" y="178" width="200" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">cost = 翻转 r 的最少操作数</text>
  <text x="420" y="215" text-anchor="middle" font-size="10" fill="#777">由 av/bv/op 三者联合决定</text>

  <!-- Expression tree example -->
  <text x="290" y="256" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">示例：表达式树自底向上传播二元组</text>

  <!-- tree: (0&0)&(0|0) -->
  <!-- root & -->
  <rect x="268" y="270" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">&amp;</text>
  <text x="340" y="290" font-size="10" fill="#b85450">(0, 3)</text>

  <!-- left child: 0&0 -->
  <path d="M 278 302 L 180 326" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="138" y="326" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="346" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">&amp;</text>
  <text x="192" y="346" font-size="10" fill="#b85450">(0, 2)</text>

  <!-- right child: 0|0 -->
  <path d="M 302 302 L 400 326" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="378" y="326" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">|</text>
  <text x="432" y="346" font-size="10" fill="#b85450">(0, 1)</text>

  <!-- leaves -->
  <path d="M 148 358 L 110 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="86" y="384" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="404" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">0</text>

  <path d="M 172 358 L 210 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="190" y="384" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="404" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">0</text>

  <path d="M 388 358 L 350 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="326" y="384" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="346" y="404" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">0</text>

  <path d="M 412 358 L 450 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="430" y="384" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="404" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">0</text>

  <!-- annotation -->
  <rect x="486" y="270" width="84" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="528" y="288" text-anchor="middle" font-size="9.5" fill="#a87020">0&amp;0 → r=0</text>
  <text x="528" y="302" text-anchor="middle" font-size="9.5" fill="#a87020">翻转需 2 次</text>
  <text x="528" y="316" text-anchor="middle" font-size="9.5" fill="#a87020">(两 0 都改 1)</text>
</svg>
