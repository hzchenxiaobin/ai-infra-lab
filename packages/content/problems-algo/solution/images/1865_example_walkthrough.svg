<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：freq 表随 add 增量维护、count 查表累加</text>
  <text x="300" y="38" text-anchor="middle" font-size="10.5" fill="#888">nums1 = [1,1,2,2,2,3]（固定），重点关注 nums2 与 freq 的联动</text>

  <!-- ====== Table header ====== -->
  <rect x="24" y="52" width="552" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="68" font-size="10.5" fill="#333" font-weight="bold">步</text>
  <text x="100" y="68" font-size="10.5" fill="#333" font-weight="bold">操作</text>
  <text x="210" y="68" font-size="10.5" fill="#333" font-weight="bold">nums2</text>
  <text x="410" y="68" font-size="10.5" fill="#333" font-weight="bold">freq 关键项</text>
  <text x="540" y="68" font-size="10.5" fill="#333" font-weight="bold">结果</text>

  <!-- helper: each row y starts at 84, step height 44 -->

  <!-- ===== Row 0: init ===== -->
  <rect x="24" y="84" width="552" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="108" font-size="11" fill="#666">0</text>
  <text x="100" y="108" font-size="10.5" fill="#446688" font-weight="bold">init</text>
  <!-- nums2 cells [1,4,5,2,5,4] -->
  <rect x="200" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="211" y="108" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="224" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="108" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="248" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="259" y="108" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="272" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="283" y="108" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="296" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="108" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="320" y="92" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="108" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="410" y="108" font-size="10" fill="#333">{1:1, 2:1, 4:2, 5:2}</text>
  <text x="540" y="108" font-size="10" fill="#888">—</text>

  <!-- ===== Row 1: count(7) -> 8 ===== -->
  <rect x="24" y="128" width="552" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="152" font-size="11" fill="#666">1</text>
  <text x="100" y="152" font-size="10.5" fill="#b85450" font-weight="bold">count(7)</text>
  <text x="210" y="152" font-size="10" fill="#888">不变</text>
  <text x="410" y="148" font-size="9.5" fill="#333">x=2→freq[5]=2 (×3)</text>
  <text x="410" y="160" font-size="9.5" fill="#333">x=3→freq[4]=2 (×1)</text>
  <text x="540" y="152" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <!-- ===== Row 2: add(3,2) ===== -->
  <rect x="24" y="172" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="196" font-size="11" fill="#666">2</text>
  <text x="100" y="196" font-size="10.5" fill="#d6a040" font-weight="bold">add(3,2)</text>
  <!-- nums2 [1,4,5,4,5,4] with index3 changed 2->4 highlighted -->
  <rect x="200" y="180" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="211" y="196" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="224" y="180" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="196" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="248" y="180" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="259" y="196" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="272" y="180" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="283" y="196" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <rect x="296" y="180" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="196" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="320" y="180" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="196" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="410" y="192" font-size="9.5" fill="#b85450">freq[2]−− → 删除</text>
  <text x="410" y="204" font-size="9.5" fill="#4a7a3a">freq[4]++ → 3</text>
  <text x="540" y="196" font-size="10" fill="#888">null</text>

  <!-- ===== Row 3: count(8) -> 2 ===== -->
  <rect x="24" y="216" width="552" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="240" font-size="11" fill="#666">3</text>
  <text x="100" y="240" font-size="10.5" fill="#b85450" font-weight="bold">count(8)</text>
  <text x="210" y="240" font-size="10" fill="#888">不变</text>
  <text x="410" y="240" font-size="9.5" fill="#333">x=3→freq[5]=2</text>
  <text x="540" y="240" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row 4: count(4) -> 1 ===== -->
  <rect x="24" y="260" width="552" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="284" font-size="11" fill="#666">4</text>
  <text x="100" y="284" font-size="10.5" fill="#b85450" font-weight="bold">count(4)</text>
  <text x="210" y="284" font-size="10" fill="#888">不变</text>
  <text x="410" y="284" font-size="9.5" fill="#333">x=3→freq[1]=1</text>
  <text x="540" y="284" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row 5: add(0,1) ===== -->
  <rect x="24" y="304" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="328" font-size="11" fill="#666">5</text>
  <text x="100" y="328" font-size="10.5" fill="#d6a040" font-weight="bold">add(0,1)</text>
  <!-- nums2 [2,4,5,4,5,4] index0 changed 1->2 -->
  <rect x="200" y="312" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="211" y="328" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <rect x="224" y="312" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="328" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="248" y="312" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="259" y="328" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="272" y="312" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="283" y="328" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="296" y="312" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="328" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="320" y="312" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="328" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="410" y="324" font-size="9.5" fill="#b85450">freq[1]−− → 删除</text>
  <text x="410" y="336" font-size="9.5" fill="#4a7a3a">freq[2]++ → 1</text>
  <text x="540" y="328" font-size="10" fill="#888">null</text>

  <!-- ===== Row 6: add(1,1) ===== -->
  <rect x="24" y="348" width="552" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="372" font-size="11" fill="#666">6</text>
  <text x="100" y="372" font-size="10.5" fill="#d6a040" font-weight="bold">add(1,1)</text>
  <!-- nums2 [2,5,5,4,5,4] index1 changed 4->5 -->
  <rect x="200" y="356" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="211" y="372" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="224" y="356" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="372" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <rect x="248" y="356" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="259" y="372" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="272" y="356" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="283" y="372" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="296" y="356" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="372" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="320" y="356" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="372" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="410" y="368" font-size="9.5" fill="#b85450">freq[4]−− → 2</text>
  <text x="410" y="380" font-size="9.5" fill="#4a7a3a">freq[5]++ → 3</text>
  <text x="540" y="372" font-size="10" fill="#888">null</text>

  <!-- ===== Row 7: count(7) -> 11 ===== -->
  <rect x="24" y="392" width="552" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="48" y="416" font-size="11" fill="#666">7</text>
  <text x="100" y="416" font-size="10.5" fill="#b85450" font-weight="bold">count(7)</text>
  <text x="210" y="416" font-size="10" fill="#888">不变</text>
  <text x="410" y="412" font-size="9.5" fill="#333">x=2→freq[5]=3 (×3) = 9</text>
  <text x="410" y="424" font-size="9.5" fill="#333">x=3→freq[4]=2 = 2</text>
  <text x="540" y="416" font-size="11" fill="#b85450" font-weight="bold">11</text>
</svg>
