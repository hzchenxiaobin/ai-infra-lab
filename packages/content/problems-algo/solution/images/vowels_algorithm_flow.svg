<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历 + 元音判定累加贡献</text>

  <!-- Step 1: init -->
  <rect x="70" y="56" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="190" y="94" text-anchor="middle" font-size="10" fill="#666">ans = 0，n = word.size()</text>

  <path d="M 190 104 L 190 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="50" y="128" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i = 0 .. n−1：</text>
  <text x="190" y="166" text-anchor="middle" font-size="10" fill="#666">逐个遍历字符位置</text>

  <path d="M 190 176 L 190 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: vowel check -->
  <rect x="30" y="200" width="320" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定 word[i] 是否元音 (aeiou)</text>
  <text x="190" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">if word[i] ∈ {a, e, i, o, u}：</text>
  <text x="190" y="254" text-anchor="middle" font-size="10" fill="#888">（O(1) 查表，5 元素集合）</text>

  <!-- branch: yes -->
  <path d="M 190 264 L 190 284" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="278" font-size="10" fill="#b85450" font-weight="bold">是元音</text>

  <!-- Step 4: add contribution -->
  <rect x="40" y="288" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">累加贡献</text>
  <text x="190" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += (long long)(i+1) * (n−i)</text>
  <text x="190" y="342" text-anchor="middle" font-size="10" fill="#888">（先转型防 int 溢出）</text>

  <!-- branch: no, skip -->
  <path d="M 350 230 Q 410 230 410 318" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="222" font-size="10" fill="#888">辅音 → 跳过</text>

  <!-- loop back arrow -->
  <path d="M 40 318 Q 20 318 20 200 Q 20 150 50 150" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="10" y="234" font-size="10" fill="#888" transform="rotate(-90 10 234)">继续下一个 i</text>

  <!-- Step 5: return -->
  <path d="M 190 352 L 190 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="376" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="398" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束</text>
  <text x="190" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- side notes: complexity -->
  <rect x="400" y="56" width="180" height="92" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">复杂度</text>
  <line x1="415" y1="86" x2="565" y2="86" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="412" y="104" font-size="10" fill="#555">• 时间 O(n)：</text>
  <text x="424" y="118" font-size="10" fill="#555">单层循环 + O(1) 判定</text>
  <text x="412" y="134" font-size="10" fill="#555">• 空间 O(1)：</text>
  <text x="424" y="142" font-size="10" fill="#555">只用 ans / n 常数变量</text>

  <!-- side notes: overflow -->
  <rect x="400" y="160" width="180" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 溢出陷阱</text>
  <line x1="415" y1="190" x2="565" y2="190" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="412" y="208" font-size="10" fill="#555">n=10⁵ 全元音时</text>
  <text x="412" y="222" font-size="10" fill="#555">ans ≈ 1.67 × 10¹⁴</text>
  <text x="412" y="236" font-size="10" fill="#555">远超 int 上限 2.1×10⁹</text>
  <text x="412" y="254" font-size="10" fill="#b85450" font-weight="bold">必须用 long long</text>
</svg>
