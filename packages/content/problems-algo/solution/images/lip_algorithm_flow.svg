<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">记忆化搜索算法流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333">① memo 全置 0，ans = 0</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop decision -->
  <polygon points="280,104 420,154 280,204 140,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12.5" fill="#333">② 遍历每个格子 (i,j)</text>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#666">ans = max(ans, dfs(i,j))</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#888">主程序入口</text>

  <path d="M 280 204 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dfs entry -->
  <rect x="120" y="226" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333">③ 进入 dfs(i,j)</text>

  <path d="M 280 266 L 280 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- memo check decision -->
  <polygon points="280,288 400,326 280,364 160,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333">④ memo[i][j] ≠ 0 ?</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#888">已算过直接返回</text>

  <!-- yes branch -->
  <path d="M 400 326 L 470 326 L 470 246 L 440 246" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="486" y="288" text-anchor="middle" font-size="10" fill="#b85450">return memo</text>

  <!-- no branch -->
  <path d="M 280 364 L 280 382" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="378" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- explore neighbors -->
  <rect x="80" y="386" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#333">⑤ best = 1；枚举 4 邻居 (ni,nj)</text>
  <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">若 matrix[ni][nj] &gt; matrix[i][j]：</text>
  <text x="280" y="438" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">best = max(best, 1 + dfs(ni,nj))</text>

  <path d="M 280 442 L 280 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- write memo + return -->
  <rect x="100" y="462" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="480" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⑥ memo[i][j] = best；return best</text>
  <text x="280" y="496" text-anchor="middle" font-size="10" fill="#888">缓存后再回到 ② 继续遍历，全部完成后返回 ans</text>

  <!-- loop-back arrow from ⑥ back to ② -->
  <path d="M 100 482 L 50 482 L 50 154 L 140 154" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="320" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 36 320)">逐格遍历</text>
</svg>
