<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分层状态空间：(城市, 已用券数 k) 的状态图</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">同层转移 = 全价；跨层向下 = 用一张券（费用减半）</text>

  <!-- layer labels -->
  <rect x="20" y="110" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k=0 层</text>
  <rect x="20" y="300" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="318" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k=1 层</text>

  <!-- ===== top layer edges (full toll) ===== -->
  <!-- 0-1 w=4 highlighted (red, optimal segment) -->
  <path d="M 98 168 L 196 168" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="147" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">w=4</text>

  <!-- 1-2 w=3 -->
  <path d="M 214 168 L 306 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#446688">w=3</text>

  <!-- 1-4 w=11 (long arc) -->
  <path d="M 206 158 Q 290 110 514 158" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="10" fill="#446688">w=11</text>

  <!-- 2-3 w=3 -->
  <path d="M 324 168 L 416 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="160" text-anchor="middle" font-size="10" fill="#446688">w=3</text>

  <!-- 3-4 w=2 -->
  <path d="M 434 168 L 526 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="160" text-anchor="middle" font-size="10" fill="#446688">w=2</text>

  <!-- ===== top layer nodes ===== -->
  <!-- 0 start (green) -->
  <ellipse cx="90" cy="168" rx="22" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="173" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="90" y="206" text-anchor="middle" font-size="9" fill="#4a7a3a">起点</text>

  <!-- 1 -->
  <ellipse cx="206" cy="168" rx="20" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="173" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- 2 -->
  <ellipse cx="316" cy="168" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="173" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <!-- 3 -->
  <ellipse cx="426" cy="168" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="173" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <!-- 4 -->
  <ellipse cx="524" cy="168" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="524" y="173" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <!-- ===== bottom layer nodes (k=1) ===== -->
  <ellipse cx="90" cy="358" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="363" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>

  <ellipse cx="206" cy="358" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="363" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <ellipse cx="316" cy="358" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="363" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <ellipse cx="426" cy="358" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="363" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <!-- 4 in k=1 layer = goal (red) -->
  <ellipse cx="524" cy="358" rx="22" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="524" y="363" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="524" y="396" text-anchor="middle" font-size="9" fill="#b85450">终点</text>

  <!-- ===== cross-layer discount arrows (dashed, orange) ===== -->
  <!-- (0,k=0) -> (1,k=1): discount on edge 0-1, w=4 -> 2 -->
  <path d="M 104 178 Q 150 270 196 348" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="128" y="266" text-anchor="middle" font-size="10" fill="#d6a040">⌊4/2⌋=2</text>

  <!-- (1,k=0) -> (4,k=1): discount on edge 1-4, w=11 -> 5  HIGHLIGHTED optimal -->
  <path d="M 220 178 Q 380 270 510 348" stroke="#b85450" stroke-width="2.4" fill="none" stroke-dasharray="6 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⌊11/2⌋=5 ✓</text>

  <!-- (3,k=0) -> (4,k=1): discount on edge 3-4, w=2 -> 1 -->
  <path d="M 440 178 Q 482 270 514 348" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="486" y="276" text-anchor="middle" font-size="9" fill="#d6a040">⌊2/2⌋=1</text>

  <!-- ===== legend ===== -->
  <rect x="180" y="410" width="14" height="3" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="415" font-size="10" fill="#666">同层全价</text>
  <line x1="262" y1="411" x2="280" y2="411" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="286" y="415" font-size="10" fill="#666">跨层用券</text>
  <line x1="348" y1="411" x2="366" y2="411" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="372" y="415" font-size="10" fill="#666">最优路径 (0,0)→(1,0)→(4,1) = 4+5 = 9</text>
</svg>
