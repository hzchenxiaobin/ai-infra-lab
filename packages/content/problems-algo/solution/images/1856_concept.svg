<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心直觉：固定每个元素作为最小值，找左右"第一个更小"划定子数组</text>

  <!-- Array bars: [3,1,5,6,4,2] -->
  <text x="30" y="58" font-size="12" fill="#888" filter="url(#rough2)">数组 nums=[3,1,5,6,4,2]：</text>

  <!-- ground line -->
  <line x1="80" y1="280" x2="440" y2="280" stroke="#7f8c8d" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- bar 0: height 3 -->
  <rect x="90" y="205" width="40" height="75" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="110" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <!-- bar 1: height 1 -->
  <rect x="135" y="255" width="40" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <!-- bar 2: height 5 -->
  <rect x="180" y="155" width="40" height="125" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="200" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <!-- bar 3: height 6 -->
  <rect x="225" y="130" width="40" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="245" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <!-- bar 4: height 4 -->
  <rect x="270" y="180" width="40" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="290" y="296" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=4 ★</text>
  <!-- bar 5: height 2 -->
  <rect x="315" y="230" width="40" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="335" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=5</text>

  <!-- Highlight the subarray [5,6,4] (i=2,3,4) where 4 is the min -->
  <rect x="180" y="155" width="130" height="125" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="245" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">子数组 [5,6,4]</text>

  <!-- arrows for left/right first smaller of bar i=4 -->
  <text x="155" y="200" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">←左更小(i=1, v=1)</text>
  <path d="M 270 195 L 175 252" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="200" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">右更小(i=5, v=2)→</text>
  <path d="M 310 195 L 335 228" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right side: the formula -->
  <text x="470" y="58" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">最小乘积公式：</text>
  <rect x="450" y="72" width="140" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min-product</text>
  <text x="520" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= min × sum</text>
  <text x="520" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">sum = 前缀和 O(1)</text>
  <text x="520" y="142" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">min = nums[i]</text>

  <text x="470" y="174" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">关键转化：</text>
  <rect x="450" y="186" width="140" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举每个元素</text>
  <text x="520" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">作为子数组最小值</text>
  <text x="520" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 找左右第一个更小</text>
  <text x="520" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 前缀和求子数组和</text>

  <!-- bottom -->
  <rect x="50" y="330" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">i=4: min=4, sum=5+6+4=15, product=4×15=60 ✓</text>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">"左右第一个更小"用单调栈 → O(n)；与 84 题柱状图最大矩形同构</text>

  <!-- Connection note -->
  <rect x="50" y="390" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="406" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">84 题：面积 = 高 × 宽（宽=下标差）｜本题：乘积 = min × sum（sum=前缀和差）</text>
</svg>
