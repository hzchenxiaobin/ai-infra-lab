<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[2,1,3]，nums2=[10,2,5,0]</text>

  <!-- Strip 1: lengths -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#444">n = len(nums1) = <tspan font-weight="bold" fill="#b85450">3</tspan>（奇）</text>
  <text x="370" y="52" text-anchor="middle" font-size="11" fill="#444">m = len(nums2) = <tspan font-weight="bold" fill="#b85450">4</tspan>（偶）</text>

  <!-- Strip 2: xor1 = 2 ⊕ 1 ⊕ 3 = 0 ; cards y=86..120 -->
  <text x="145" y="108" text-anchor="end" font-size="11" fill="#666">xor1 =</text>
  <rect x="157" y="86" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="108" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="204" y="108" text-anchor="middle" font-size="13" fill="#666">⊕</text>
  <rect x="213" y="86" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="108" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="260" y="108" text-anchor="middle" font-size="13" fill="#666">⊕</text>
  <rect x="269" y="86" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="108" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="316" y="108" text-anchor="middle" font-size="13" fill="#666">=</text>
  <rect x="325" y="86" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="344" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="260" y="132" text-anchor="middle" font-size="10" fill="#888">2⊕1=3，3⊕3=0</text>

  <!-- Strip 3: xor2 = 10 ⊕ 2 ⊕ 5 ⊕ 0 = 13 ; cards y=140..174 -->
  <text x="118" y="162" text-anchor="end" font-size="11" fill="#666">xor2 =</text>
  <rect x="129" y="140" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="162" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="176" y="162" text-anchor="middle" font-size="13" fill="#666">⊕</text>
  <rect x="185" y="140" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="162" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="232" y="162" text-anchor="middle" font-size="13" fill="#666">⊕</text>
  <rect x="241" y="140" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="288" y="162" text-anchor="middle" font-size="13" fill="#666">⊕</text>
  <rect x="297" y="140" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="162" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="344" y="162" text-anchor="middle" font-size="13" fill="#666">=</text>
  <rect x="353" y="140" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <text x="260" y="186" text-anchor="middle" font-size="10" fill="#888">10⊕2=8，8⊕5=13，13⊕0=13</text>

  <!-- Strip 4: parity logic -->
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#444">m = 4 为偶 ⇒ <tspan fill="#b85450">项₁ = ⊕nums1 = 0 抵消</tspan>（xor1 不入结果）</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#444">n = 3 为奇 ⇒ <tspan fill="#4a7a3a" font-weight="bold">项₂ = ⊕nums2 = 13 保留</tspan>（xor2 入结果）</text>

  <!-- Strip 5: result banner -->
  <rect x="80" y="250" width="360" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果 = 项₁ ⊕ 项₂ = 0 ⊕ 13 = 13</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#555">与示例 1 输出 13 一致 ✓</text>

  <!-- Footer: example 2 check -->
  <rect x="40" y="302" width="440" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对照示例 2：nums1=[1,2]，nums2=[3,4]</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#555">m=2 偶、n=2 偶 → 项₁=0 且 项₂=0 → 结果 = 0 ✓</text>
</svg>
