<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,1,4,0], n = 5</text>

  <!-- Table header -->
  <rect x="20" y="40" width="40" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="57" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">i</text>
  <rect x="60" y="40" width="40" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="57" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">a</text>
  <rect x="100" y="40" width="56" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="57" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">条件</text>
  <rect x="156" y="40" width="140" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="57" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">计分 k 区间</text>
  <rect x="296" y="40" width="244" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="57" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">diff 标记</text>

  <!-- Row i=0: a=2, a>i, [1,3] -->
  <rect x="20" y="68" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="85" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="60" y="68" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="68" width="56" height="24" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="85" text-anchor="middle" font-size="10" fill="#b85450">a&gt;i</text>
  <rect x="156" y="68" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a">[1, 3]</text>
  <rect x="296" y="68" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="85" text-anchor="middle" font-size="10" fill="#666">+1@1, −1@4</text>

  <!-- Row i=1: a=3, a>i, [2,3] -->
  <rect x="20" y="94" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="60" y="94" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="94" width="56" height="24" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="111" text-anchor="middle" font-size="10" fill="#b85450">a&gt;i</text>
  <rect x="156" y="94" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a">[2, 3]</text>
  <rect x="296" y="94" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="111" text-anchor="middle" font-size="10" fill="#666">+1@2, −1@4</text>

  <!-- Row i=2: a=1, a<=i, [0,1]∪[3,4] -->
  <rect x="20" y="120" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="137" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="60" y="120" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="120" width="56" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="137" text-anchor="middle" font-size="10" fill="#446688">a≤i</text>
  <rect x="156" y="120" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a">[0,1] ∪ [3,4]</text>
  <rect x="296" y="120" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="137" text-anchor="middle" font-size="10" fill="#666">+1@0, −1@2, +1@3, −1@5</text>

  <!-- Row i=3: a=4, a>i, [4,4] -->
  <rect x="20" y="146" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="163" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="60" y="146" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="146" width="56" height="24" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="163" text-anchor="middle" font-size="10" fill="#b85450">a&gt;i</text>
  <rect x="156" y="146" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a">[4, 4]</text>
  <rect x="296" y="146" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="163" text-anchor="middle" font-size="10" fill="#666">+1@4, −1@5</text>

  <!-- Row i=4: a=0, a<=i, [0,4] -->
  <rect x="20" y="172" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="189" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="60" y="172" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="100" y="172" width="56" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="189" text-anchor="middle" font-size="10" fill="#446688">a≤i</text>
  <rect x="156" y="172" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[0, 4]（全计分）</text>
  <rect x="296" y="172" width="244" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="189" text-anchor="middle" font-size="10" fill="#666">+1@0, −1@5</text>

  <!-- Divider -->
  <line x1="20" y1="212" x2="540" y2="212" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- diff array -->
  <text x="30" y="232" font-size="11" fill="#446688" font-weight="bold">diff 数组（累加后）</text>
  <text x="30" y="250" font-size="9" fill="#888">下标</text>
  <rect x="60" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="255" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="112" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="255" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="255" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="216" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="255" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="268" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="292" y="255" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="320" y="238" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="255" text-anchor="middle" font-size="11" fill="#aaa">5</text>

  <text x="30" y="280" font-size="9" fill="#888">值</text>
  <rect x="60" y="268" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="285" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+2</text>
  <rect x="112" y="268" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="285" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+1</text>
  <rect x="164" y="268" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="216" y="268" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="285" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+1</text>
  <rect x="268" y="268" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="292" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>

  <!-- Arrow down -->
  <text x="360" y="282" font-size="10" fill="#888">→ 前缀和</text>

  <!-- Prefix sum / scores -->
  <text x="30" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">score（前缀和）</text>
  <text x="30" y="340" font-size="9" fill="#888">k=</text>
  <rect x="60" y="328" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="345" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="112" y="328" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="345" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="164" y="328" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="345" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="216" y="328" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="345" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <rect x="268" y="328" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="292" y="345" text-anchor="middle" font-size="10" fill="#888">4</text>

  <text x="30" y="372" font-size="9" fill="#888">得分</text>
  <rect x="60" y="358" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="378" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="112" y="358" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="378" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="164" y="358" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="378" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="216" y="358" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="378" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="268" y="358" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="292" y="378" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Result -->
  <rect x="30" y="404" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="424" font-size="12" fill="#4a7a3a" font-weight="bold">最高得分 = 4，对应最小 k = 3 ✓</text>
  <text x="50" y="440" font-size="10" fill="#666">scores = [2, 3, 3, 4, 3]，k=3 时得分最高</text>

  <!-- verification note -->
  <rect x="30" y="456" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="44" y="476" font-size="10" fill="#d6a040">验证：k=3 轮调后 [4,0,2,3,1]，0≤1 ✓ 2≤2 ✓ 3≤3 ✓ 1≤4 ✓ → 4 分</text>
</svg>
