<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：建表 → 从长到短探测，命中即停</text>

  <!-- row 1: example 1 -->
  <rect x="16" y="38" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="53" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <text x="88" y="53" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">arr1 = [1,10,100] → 表 { 1, 10, 100 }</text>

  <text x="24" y="86" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">y = 1000 探测：</text>
  <rect x="110" y="68" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="148" y="87" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1000 ✗</text>
  <path d="M 190 82 L 208 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="212" y="68" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="246" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">100 ✓</text>
  <text x="292" y="86" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 停！len = 3</text>

  <rect x="414" y="62" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="459" y="85" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 3</text>

  <path d="M 16 124 L 504 124" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 2: supplement -->
  <rect x="16" y="140" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">补充</text>
  <text x="88" y="155" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">arr1 = [5655359, 1223] → 表 = {5, 56, 565, 5655, 56553, …, 1223}（共 11 个）</text>

  <text x="24" y="188" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">y = 56554：</text>
  <rect x="104" y="172" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="146" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">56554 ✗</text>
  <path d="M 192 185 L 208 185" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="212" y="172" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="248" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5655 ✓</text>
  <text x="296" y="190" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ len = 4</text>

  <text x="24" y="224" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">y = 43456：</text>
  <rect x="104" y="208" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="146" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">43456 ✗</text>
  <path d="M 192 221 L 208 221" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="212" y="208" width="72" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="248" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4345 ✗</text>
  <text x="296" y="226" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">… 一路折到 4 全 ✗ → 贡献 0</text>

  <rect x="414" y="184" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="459" y="207" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 4</text>

  <path d="M 16 252 L 504 252" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 3: example 2 -->
  <rect x="16" y="268" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="283" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <text x="88" y="283" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">arr1 = [1,2,3] → 表 { 1, 2, 3 }；arr2 = [4,4,4]</text>

  <text x="24" y="316" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">y = 4（三个都一样）：</text>
  <rect x="150" y="300" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="172" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 ✗</text>
  <text x="206" y="316" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">× 3 次全不命中 → 贡献 0</text>

  <rect x="414" y="292" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="459" y="315" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0</text>

  <!-- bottom warning -->
  <rect x="16" y="340" width="488" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">⚠️ 若把 arr1、arr2 的前缀混进同一张表：查询侧 y 的前缀必命中自己那侧的表项，</text>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">答案恒等于 max len(y)——「数对必须跨数组」的语义就丢了（示例 2 会错答 1）。</text>
</svg>
