<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：中枢 x 使 1..x 之和 = x..n 之和，化简得 x² = n(n+1)/2</text>

  <text x="30" y="48" font-size="12" fill="#888">以 n = 8 为例：</text>

  <text x="342" y="42" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">中枢 x=6</text>
  <path d="M 342 46 L 342 55" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="81" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="129" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="177" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="80" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="225" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="80" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="273" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="80" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="321" y="58" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="369" y="58" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="80" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="417" y="58" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="80" text-anchor="middle" font-size="14" fill="#333">8</text>

  <path d="M 81 96 L 81 106 L 363 106 L 363 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 222 106 L 222 114" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 321 96 L 321 106 L 459 106 L 459 96" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 390 106 L 390 114" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="222" y="128" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1+2+3+4+5+6 = 21</text>
  <text x="390" y="128" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">6+7+8 = 21</text>

  <text x="270" y="148" text-anchor="middle" font-size="10.5" fill="#888">红框 x 同时计入左右两段，故两段和都含 x</text>

  <rect x="30" y="160" width="480" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">代数化简：把「搜索 x」压缩成「开一次平方」</text>

  <text x="50" y="208" font-size="12" fill="#446688" font-weight="bold">左和</text>
  <text x="92" y="208" font-size="12" fill="#333">S_L = 1+2+…+x = x(x+1)/2</text>

  <text x="50" y="232" font-size="12" fill="#d6a040" font-weight="bold">右和</text>
  <text x="92" y="232" font-size="12" fill="#333">S_R = x+(x+1)+…+n = n(n+1)/2 − x(x−1)/2</text>

  <text x="50" y="260" font-size="12" fill="#555" font-weight="bold">令 S_L = S_R：</text>
  <text x="92" y="280" font-size="12" fill="#333">x(x+1)/2 + x(x−1)/2 = n(n+1)/2</text>
  <text x="92" y="300" font-size="12" fill="#333">→ x·(2x)/2 = n(n+1)/2</text>

  <rect x="80" y="312" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ x² = n(n+1)/2 → x = √( n(n+1)/2 )，取整数</text>
</svg>
