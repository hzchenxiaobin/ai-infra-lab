<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "Hello" → "hello"</text>

  <text x="44" y="78" font-size="12" fill="#888">输入</text>
  <rect x="80" y="56" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">H</text>
  <rect x="140" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="78" text-anchor="middle" font-size="15" fill="#999">e</text>
  <rect x="200" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="78" text-anchor="middle" font-size="15" fill="#999">l</text>
  <rect x="260" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="78" text-anchor="middle" font-size="15" fill="#999">l</text>
  <rect x="320" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="78" text-anchor="middle" font-size="15" fill="#999">o</text>

  <text x="44" y="128" font-size="11" fill="#888" font-weight="bold">判定</text>
  <rect x="80" y="108" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">大写</text>
  <rect x="140" y="108" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">小写</text>
  <rect x="200" y="108" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">小写</text>
  <rect x="260" y="108" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">小写</text>
  <rect x="320" y="108" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">小写</text>

  <text x="44" y="168" font-size="11" fill="#888" font-weight="bold">操作</text>
  <rect x="80" y="148" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">|0x20</text>
  <rect x="140" y="148" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="168" text-anchor="middle" font-size="10" fill="#999">—</text>
  <rect x="200" y="148" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="228" y="168" text-anchor="middle" font-size="10" fill="#999">—</text>
  <rect x="260" y="148" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="288" y="168" text-anchor="middle" font-size="10" fill="#999">—</text>
  <rect x="320" y="148" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="348" y="168" text-anchor="middle" font-size="10" fill="#999">—</text>

  <path d="M 108 188 L 108 206" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <polygon points="104,204 112,204 108,210" fill="#d6a040"/>

  <text x="44" y="226" font-size="12" fill="#888">输出</text>
  <rect x="80" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="230" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">h</text>
  <rect x="140" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="230" text-anchor="middle" font-size="15" fill="#333">e</text>
  <rect x="200" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="230" text-anchor="middle" font-size="15" fill="#333">l</text>
  <rect x="260" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="230" text-anchor="middle" font-size="15" fill="#333">l</text>
  <rect x="320" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="230" text-anchor="middle" font-size="15" fill="#333">o</text>

  <rect x="40" y="262" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：仅大写字母触发 |0x20，其余字符原样保留</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#666">H(72) | 32 = 104 = h；e/l/o 已是小写，跳过；</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#888">原地修改 s，无需额外空间</text>
</svg>
