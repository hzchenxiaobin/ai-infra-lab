<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#556677"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">二分答案 ×「先分裂、再贪心分配」检查</text>

  <rect x="100" y="38" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">① timeReq 降序排序</text>

  <path d="M180,68 V82" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="86" width="180" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="106" text-anchor="middle" font-size="11.5" fill="#33445c" filter="url(#rough2)">② lo = max(timeReq) + s</text>
  <text x="180" y="124" text-anchor="middle" font-size="11.5" fill="#33445c" filter="url(#rough2)">hi = (n−1)·s + max</text>

  <path d="M180,134 V144" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,148 252,186 180,224 108,186" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="191" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">lo &lt; hi ?</text>

  <text x="94" y="177" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M108,186 H90" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="8" y="170" width="78" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="47" y="190" text-anchor="middle" font-size="12" fill="#2f5e23" filter="url(#rough2)">返回 lo</text>

  <text x="188" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M180,224 V240" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="244" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="264" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">mid = ⌊(lo+hi)/2⌋</text>

  <path d="M180,274 V288" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,292 258,332 180,372 102,332" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="337" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">check(mid) ?</text>

  <path d="M258,332 H283" fill="none" stroke="#556677" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="188" y="386" font-size="11" fill="#b85450" filter="url(#rough2)">不可行</text>
  <path d="M180,372 V386" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="390" width="160" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="407" text-anchor="middle" font-size="12" fill="#7a5b1e" filter="url(#rough2)">lo = mid + 1</text>

  <path d="M260,403 H285 V186 H258" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 297 292)" x="297" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">可行 → hi = mid</text>

  <rect x="312" y="38" width="238" height="378" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1e" filter="url(#rough2)">check(T)：先分裂，再贪心分配</text>

  <text x="328" y="90" font-size="11.5" fill="#555" filter="url(#rough2)">① 各菌株的极限深度</text>
  <text x="340" y="109" font-size="11.5" fill="#555" filter="url(#rough2)">D_i = ⌊(T − t_i) / s⌋</text>
  <text x="340" y="128" font-size="11" fill="#888" filter="url(#rough2)">（耗时降序 ⇒ D 升序）</text>

  <text x="328" y="154" font-size="11.5" fill="#555" filter="url(#rough2)">② 若最小 D &lt; 1 ⇒ 不可行</text>
  <text x="340" y="173" font-size="11" fill="#888" filter="url(#rough2)">（根必须先分裂一次）</text>

  <text x="328" y="199" font-size="11.5" fill="#555" filter="url(#rough2)">③ 从第 1 层出发（idle = 2）：</text>
  <text x="340" y="218" font-size="11.5" fill="#555" filter="url(#rough2)">· D_i = 当前层 → 占用一个</text>
  <text x="352" y="237" font-size="11.5" fill="#555" filter="url(#rough2)">白细胞</text>
  <text x="340" y="256" font-size="11.5" fill="#555" filter="url(#rough2)">· 剩余白细胞全体分裂</text>
  <text x="352" y="275" font-size="11.5" fill="#555" filter="url(#rough2)">→ 下一层 idle 翻倍</text>
  <text x="340" y="294" font-size="11.5" fill="#555" filter="url(#rough2)">· 白细胞不够 ⇒ 不可行</text>

  <text x="328" y="320" font-size="11.5" fill="#555" filter="url(#rough2)">④ 所有菌株安排完 ⇒ 可行</text>

  <text x="328" y="348" font-size="11" fill="#7a5b1e" filter="url(#rough2)">※ 本质是 Kraft 不等式：</text>
  <text x="340" y="367" font-size="11" fill="#7a5b1e" filter="url(#rough2)">Σ 2^(−D_i) ≤ 1</text>
  <text x="328" y="392" font-size="10.5" fill="#999" filter="url(#rough2)">（深度 d 的叶子消耗 2^(−d)</text>
  <text x="328" y="408" font-size="10.5" fill="#999" filter="url(#rough2)">份「分裂容量」）</text>
</svg>
