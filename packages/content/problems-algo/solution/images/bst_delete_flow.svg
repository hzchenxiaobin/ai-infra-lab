<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 删除节点算法流程</text>

  <!-- 入口 -->
  <rect x="190" y="46" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333">deleteNode(root, key)</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 root 为空 -->
  <polygon points="280,96 390,130 280,164 170,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">root == null ?</text>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#888">空树/未找到</text>

  <!-- 是 → 返回 null -->
  <path d="M 170 130 L 120 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="122" font-size="10" fill="#b85450">是</text>
  <rect x="40" y="114" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="11" fill="#333">return null</text>

  <!-- 否 → 继续 -->
  <path d="M 280 164 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="176" font-size="10" fill="#82b366">否</text>

  <!-- 判断 key vs root.val -->
  <polygon points="280,182 400,218 280,254 160,218" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#333">key vs root.val</text>
  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#888">三路比较</text>

  <!-- key < root.val → 左 -->
  <path d="M 160 218 L 110 218" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="210" font-size="9" fill="#446688">key &lt;</text>
  <rect x="30" y="202" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="217" text-anchor="middle" font-size="9" fill="#333">root.left =</text>
  <text x="70" y="229" text-anchor="middle" font-size="9" fill="#333">del(left)</text>

  <!-- key > root.val → 右 -->
  <path d="M 400 218 L 450 218" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="210" font-size="9" fill="#4a7a3a">key &gt;</text>
  <rect x="450" y="202" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="217" text-anchor="middle" font-size="9" fill="#333">root.right =</text>
  <text x="490" y="229" text-anchor="middle" font-size="9" fill="#333">del(right)</text>

  <!-- key == root.val → 找到 -->
  <path d="M 280 254 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="266" font-size="10" fill="#b85450">等于</text>

  <!-- 判断有无左孩子 -->
  <polygon points="280,272 380,306 280,340 180,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#333">root.left</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#888">== null ?</text>

  <!-- 是 → 返回 right -->
  <path d="M 180 306 L 130 306" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="298" font-size="9" fill="#b85450">是</text>
  <rect x="40" y="290" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="85" y="311" text-anchor="middle" font-size="10" fill="#333">return root.right</text>

  <!-- 否 → 判断有无右孩子 -->
  <path d="M 280 340 L 280 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="352" font-size="10" fill="#82b366">否</text>

  <polygon points="280,358 380,392 280,426 180,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#333">root.right</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888">== null ?</text>

  <!-- 是 → 返回 left -->
  <path d="M 180 392 L 130 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="384" font-size="9" fill="#b85450">是</text>
  <rect x="40" y="376" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="85" y="397" text-anchor="middle" font-size="10" fill="#333">return root.left</text>

  <!-- 否 → 两个孩子，找后继 -->
  <path d="M 380 392 L 430 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="384" font-size="9" fill="#b85450">否</text>

  <rect x="430" y="376" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="391" text-anchor="middle" font-size="9" fill="#333">succ = 右子树最左</text>
  <text x="490" y="402" text-anchor="middle" font-size="9" fill="#333">root.val=succ.val</text>

  <path d="M 490 408 L 490 422" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="426" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="441" text-anchor="middle" font-size="9" fill="#333">root.right =</text>
  <text x="490" y="452" text-anchor="middle" font-size="9" fill="#333">del(right, succ.val)</text>

  <!-- return root 回流箭头 -->
  <path d="M 280 254 Q 280 458 420 458" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="465" font-size="10" fill="#b85450">return root</text>
</svg>
