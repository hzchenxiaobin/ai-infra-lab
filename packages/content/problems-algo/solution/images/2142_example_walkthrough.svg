<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：累积计数 → LAG 差分 → 本车乘客数</text>

  <!-- ===== Step 1: LEFT JOIN result ===== -->
  <text x="40" y="52" font-size="10" fill="#888">① LEFT JOIN 后：每辆巴士关联 arrival_time ≤ 自身的全部乘客</text>

  <!-- Bus 1 row -->
  <g filter="url(#rough2)"><rect x="30" y="60" width="660" height="40" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.2" rx="4"/></g>
  <text x="42" y="78" font-size="10" fill="#4a8edb" font-weight="bold">Bus 1 (t=2)</text>
  <text x="42" y="92" font-size="9" fill="#666">关联乘客：</text>
  <g filter="url(#rough2)"><rect x="110" y="72" width="40" height="20" fill="#fff" stroke="#4a8edb" stroke-width="1" rx="3"/></g>
  <text x="130" y="86" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">P11</text>
  <text x="160" y="86" font-size="9" fill="#888">(t=1 ≤ 2 ✓)</text>
  <text x="300" y="86" font-size="10" fill="#4a8edb" font-weight="bold">累积 COUNT = 1</text>

  <!-- Bus 2 row -->
  <g filter="url(#rough2)"><rect x="30" y="106" width="660" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/></g>
  <text x="42" y="124" font-size="10" fill="#446688" font-weight="bold">Bus 2 (t=4)</text>
  <text x="42" y="138" font-size="9" fill="#666">关联乘客：</text>
  <g filter="url(#rough2)"><rect x="110" y="118" width="40" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3"/></g>
  <text x="130" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">P11</text>
  <text x="160" y="132" font-size="9" fill="#888">(t=1 ≤ 4 ✓)</text>
  <text x="300" y="132" font-size="10" fill="#446688" font-weight="bold">累积 COUNT = 1</text>
  <text x="440" y="132" font-size="9" fill="#b85450">P12(t=5) &gt; 4 ✗</text>

  <!-- Bus 3 row -->
  <g filter="url(#rough2)"><rect x="30" y="152" width="660" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/></g>
  <text x="42" y="170" font-size="10" fill="#d6a040" font-weight="bold">Bus 3 (t=7)</text>
  <text x="42" y="184" font-size="9" fill="#666">关联乘客：</text>
  <g filter="url(#rough2)"><rect x="110" y="164" width="40" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3"/></g>
  <text x="130" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P11</text>
  <g filter="url(#rough2)"><rect x="156" y="164" width="40" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3"/></g>
  <text x="176" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P12</text>
  <g filter="url(#rough2)"><rect x="202" y="164" width="40" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3"/></g>
  <text x="222" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P13</text>
  <g filter="url(#rough2)"><rect x="248" y="164" width="40" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3"/></g>
  <text x="268" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P14</text>
  <text x="300" y="178" font-size="10" fill="#d6a040" font-weight="bold">累积 COUNT = 4</text>

  <!-- Arrow down -->
  <path d="M 360 196 L 360 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: LAG + diff table ===== -->
  <text x="40" y="228" font-size="10" fill="#888">② LAG 窗口取前车累积值 + 差分 = 本车乘客数</text>

  <!-- Table header -->
  <g filter="url(#rough2)"><rect x="80" y="236" width="560" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/></g>
  <text x="130" y="254" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">bus_id</text>
  <text x="210" y="254" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">arrival_time</text>
  <text x="340" y="254" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">cum (COUNT)</text>
  <text x="460" y="254" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">lag (前车 cum)</text>
  <text x="580" y="254" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">cnt = cum−lag</text>

  <!-- Row Bus 1 -->
  <g filter="url(#rough2)"><rect x="80" y="264" width="560" height="28" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">1</text>
  <text x="210" y="282" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">2</text>
  <text x="340" y="282" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">1</text>
  <text x="460" y="282" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="580" y="282" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">1</text>

  <!-- Row Bus 2 -->
  <g filter="url(#rough2)"><rect x="80" y="294" width="560" height="28" fill="#e8f0fe" stroke="none" rx="2"/></g>
  <text x="130" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="210" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="340" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="580" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <!-- Row Bus 3 -->
  <g filter="url(#rough2)"><rect x="80" y="324" width="560" height="28" fill="#fff8e1" stroke="none" rx="2"/></g>
  <text x="130" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="210" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="340" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="460" y="342" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="580" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <!-- Arrow down -->
  <path d="M 360 356 L 360 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Final result ===== -->
  <text x="40" y="388" font-size="10" fill="#888">③ 最终输出（ORDER BY bus_id）</text>
  <g filter="url(#rough2)"><rect x="240" y="394" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="270" y="414" font-size="10" fill="#4a7a3a" font-weight="bold">bus_id</text>
  <text x="370" y="414" font-size="10" fill="#4a7a3a" font-weight="bold">passengers_cnt</text>
  <line x1="260" y1="400" x2="260" y2="444" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="400" x2="360" y2="444" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="280" y="432" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="380" y="432" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="300" y="432" font-size="9" fill="#446688">2</text>
  <text x="400" y="432" font-size="9" fill="#446688">0</text>
  <text x="320" y="432" font-size="9" fill="#d6a040">3</text>
  <text x="420" y="432" font-size="9" fill="#d6a040">3</text>

  <!-- ===== Side note ===== -->
  <g filter="url(#rough2)"><rect x="540" y="264" width="100" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="590" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ 关键</text>
  <text x="552" y="302" font-size="9" fill="#b85450">累积计数包含</text>
  <text x="552" y="316" font-size="9" fill="#b85450">被前车接走的</text>
  <text x="552" y="330" font-size="9" fill="#b85450">乘客；差分后</text>
  <text x="552" y="344" font-size="9" fill="#b85450">仅留本车新增</text>
</svg>
