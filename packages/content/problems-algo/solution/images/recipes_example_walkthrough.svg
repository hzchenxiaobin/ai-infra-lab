<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 3 BFS 演算</text>
  <text x="270" y="38" text-anchor="middle" font-size="10" fill="#888">supplies = {yeast, flour, meat}</text>

  <!-- Table outer border -->
  <rect x="20" y="50" width="500" height="232" fill="none" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="20" y="50" width="500" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="69" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="115" y="69" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">弹出</text>
  <text x="210" y="69" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">bread</text>
  <text x="290" y="69" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">sandwich</text>
  <text x="370" y="69" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">burger</text>
  <text x="445" y="69" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">队列</text>
  <text x="505" y="69" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans</text>

  <!-- Column dividers -->
  <path d="M 80 50 L 80 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 155 50 L 155 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 265 50 L 265 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 330 50 L 330 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 410 50 L 410 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 480 50 L 480 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: 初始 -->
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="210" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="290" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="445" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[bread]</text>
  <text x="505" y="100" text-anchor="middle" font-size="10" fill="#aaa">[]</text>
  <path d="M 20 112 L 520 112" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: pop bread -->
  <rect x="80" y="112" width="75" height="42" fill="#fce4ec" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="115" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bread</text>
  <text x="210" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="290" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="370" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="445" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[sandwich]</text>
  <text x="505" y="138" text-anchor="middle" font-size="9.5" fill="#555">[bread]</text>
  <path d="M 20 154 L 520 154" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: pop sandwich -->
  <rect x="80" y="154" width="75" height="42" fill="#fce4ec" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="50" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="115" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">sandwich</text>
  <text x="210" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="290" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="370" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="445" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[burger]</text>
  <text x="505" y="180" text-anchor="middle" font-size="9" fill="#555">[b,sand]</text>
  <path d="M 20 196 L 520 196" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: pop burger -->
  <rect x="80" y="196" width="75" height="42" fill="#fce4ec" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="50" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="115" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">burger</text>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="290" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="370" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="445" y="222" text-anchor="middle" font-size="11" fill="#aaa">∅</text>
  <text x="505" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[全部]</text>

  <!-- Annotation -->
  <rect x="40" y="250" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">红=缺料  橙=刚归零入队  绿=已做出 ✓</text>

  <!-- arrow showing missing decrement flow -->
  <path d="M 250 100 L 250 130" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="256" y="118" font-size="9" fill="#d6a040">bread 解锁</text>
  <path d="M 330 138 L 330 168" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 250 180 L 250 210" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="256" y="198" font-size="9" fill="#d6a040">sandwich 解锁</text>
</svg>
