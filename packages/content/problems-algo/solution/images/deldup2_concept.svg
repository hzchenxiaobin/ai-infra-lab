<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">哑节点 + 双指针：重复值整段跳过</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">prev 锚定保留段尾，curr 扫过重复组，prev.next 直接跨过</text>

  <!-- ===== 上半：初始链表 dummy → 1 → 2 → 3 → 3 → 4 → 4 → 5 ===== -->
  <g font-size="13">
    <rect x="20" y="78" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="44" y="98" text-anchor="middle" fill="#8a6a20" font-size="10" font-weight="bold">dummy</text>

    <rect x="76" y="78" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="98" y="98" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <rect x="128" y="78" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="150" y="98" text-anchor="middle" fill="#333" font-weight="bold">2</text>

    <rect x="180" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="202" y="98" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <rect x="232" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="254" y="98" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <rect x="284" y="78" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="306" y="98" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <rect x="336" y="78" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="358" y="98" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <rect x="388" y="78" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="410" y="98" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- arrows between nodes -->
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="68" y1="94" x2="76" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="120" y1="94" x2="128" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="172" y1="94" x2="180" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="224" y1="94" x2="232" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="276" y1="94" x2="284" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="328" y1="94" x2="336" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="380" y1="94" x2="388" y2="94" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- prev pointer -->
  <text x="150" y="70" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">prev</text>
  <path d="M 150 72 L 150 78" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <!-- curr pointer -->
  <text x="202" y="70" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 202 72 L 202 78" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <!-- 重复组 label -->
  <rect x="178" y="118" width="100" height="18" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="131" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">重复组 3→3</text>

  <!-- skip arrow: prev over 3→3 to 4 -->
  <path d="M 150 80 Q 228 44 306 80" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">prev.next = curr（跨过整组）</text>

  <!-- ===== 下半：跳过后 ===== -->
  <text x="20" y="166" font-size="12" fill="#444" font-weight="bold">跳过 3 后：</text>
  <g font-size="13">
    <rect x="86" y="176" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="110" y="196" text-anchor="middle" fill="#8a6a20" font-size="10" font-weight="bold">dummy</text>

    <rect x="142" y="176" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="164" y="196" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <rect x="194" y="176" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="216" y="196" text-anchor="middle" fill="#333" font-weight="bold">2</text>

    <rect x="246" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="268" y="196" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <rect x="298" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="320" y="196" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <rect x="350" y="176" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="372" y="196" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="134" y1="192" x2="142" y2="192" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="186" y1="192" x2="194" y2="192" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="238" y1="192" x2="246" y2="192" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="290" y1="192" x2="298" y2="192" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="342" y1="192" x2="350" y2="192" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="216" y="166" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">prev</text>
  <text x="268" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">curr</text>
  <text x="420" y="196" font-size="10" fill="#888">3→3 已移除</text>

  <!-- 重复组 4→4 label -->
  <rect x="244" y="216" width="100" height="18" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="229" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">重复组 4→4</text>

  <!-- ===== 对比总结 ===== -->
  <rect x="20" y="252" width="540" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="274" font-size="11" fill="#8a6a20" font-weight="bold">与 83 题的核心差异：</text>
  <text x="34" y="296" font-size="11" fill="#555">83（留一）：单指针比相邻，跳过后续重复，保留首次出现 → head 不变</text>
  <text x="34" y="316" font-size="11" fill="#555">82（全删）：一旦重复整组跳过，一个不留 → 头节点可能被删，需哑节点</text>
  <text x="34" y="340" font-size="11" fill="#b85450" font-weight="bold">为什么用哑节点？</text>
  <text x="34" y="360" font-size="11" fill="#555">头节点本身可能重复（如 [1,1,2]→[2]），哑节点让 prev.next 安全跨过</text>
  <text x="34" y="376" font-size="11" fill="#555">头节点，统一处理"头删"边界，最终返回 dummy.next</text>
</svg>
