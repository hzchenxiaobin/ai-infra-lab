<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：ans[v] = 子树内最优 + 子树外最优（示例 2，v = 3）</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <circle cx="400" cy="46" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="414" y="50" font-size="11" fill="#444">好节点 +1</text>
    <circle cx="400" cy="66" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="414" y="70" font-size="11" fill="#444">坏节点 −1</text>
  </g>

  <!-- up 标签 -->
  <text x="152" y="48" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">up[v]：经父节点向外长 = +1（只带节点 1）</text>

  <!-- up 椭圆（蓝）：父节点一侧 {0,1,2} -->
  <ellipse cx="150" cy="140" rx="88" ry="84" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- down 椭圆（绿）：v 的子树 {3,4} -->
  <ellipse cx="274" cy="236" rx="54" ry="52" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- down 标签 -->
  <text x="274" y="306" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">down[v]：只往子树里长 = (+1)+(+1) = +2</text>

  <!-- 树边 -->
  <g filter="url(#rough2)">
    <line x1="195" y1="88" x2="195" y2="146" stroke="#888" stroke-width="1.6"/>
    <line x1="195" y1="146" x2="110" y2="206" stroke="#888" stroke-width="1.6"/>
    <line x1="195" y1="146" x2="272" y2="206" stroke="#888" stroke-width="1.6"/>
    <line x1="272" y1="206" x2="272" y2="266" stroke="#888" stroke-width="1.6"/>
  </g>

  <!-- 节点 0（坏） -->
  <g filter="url(#rough2)">
    <circle cx="195" cy="88" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="195" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <text x="216" y="82" font-size="11" fill="#b85450">−1</text>
  </g>
  <!-- 节点 1（好） -->
  <g filter="url(#rough2)">
    <circle cx="195" cy="146" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="195" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="216" y="140" font-size="11" fill="#4a7a3a">+1</text>
  </g>
  <!-- 节点 2（坏） -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="206" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="110" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="88" y="200" font-size="11" fill="#b85450">−1</text>
  </g>
  <!-- 节点 3（好，v 高亮） -->
  <g filter="url(#rough2)">
    <circle cx="272" cy="206" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="272" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="293" y="200" font-size="11" fill="#4a7a3a">+1</text>
    <text x="248" y="199" font-size="13" fill="#d6a040" font-weight="bold">v</text>
  </g>
  <!-- 节点 4（好） -->
  <g filter="url(#rough2)">
    <circle cx="272" cy="266" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="272" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <text x="293" y="260" font-size="11" fill="#4a7a3a">+1</text>
  </g>

  <!-- 拼接箭头：down 块 + up 块 在 v 处会合 -->
  <path d="M 380 216 Q 340 204 292 206" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="212" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">两块在 v 处拼接</text>
  <path d="M 60 110 Q 130 96 186 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部公式框 -->
  <rect x="60" y="322" width="400" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans[3] = down[3] + max(0, up[3]) = 2 + 1 = 3</text>
</svg>
