<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：分段统计连续段长度，取各自最大值比较</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "110100010" → max₁ = 2, max₀ = 3 → 2 &gt; 3 ? false</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="102" y="60">0</text>
    <text x="146" y="60">1</text>
    <text x="190" y="60">2</text>
    <text x="234" y="60">3</text>
    <text x="278" y="60">4</text>
    <text x="322" y="60">5</text>
    <text x="366" y="60">6</text>
    <text x="410" y="60">7</text>
    <text x="454" y="60">8</text>
  </g>

  <!-- character boxes -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <!-- run "11" len=2 (max1, orange highlight) -->
    <rect x="80" y="64" width="44" height="36" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="102" y="87" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="124" y="64" width="44" height="36" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="146" y="87" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- run "0" len=1 -->
    <rect x="168" y="64" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="87" fill="#446688" font-weight="bold">0</text>
    <!-- run "1" len=1 -->
    <rect x="212" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="234" y="87" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- run "000" len=3 (max0, orange highlight) -->
    <rect x="256" y="64" width="44" height="36" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="278" y="87" fill="#446688" font-weight="bold">0</text>
    <rect x="300" y="64" width="44" height="36" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="322" y="87" fill="#446688" font-weight="bold">0</text>
    <rect x="344" y="64" width="44" height="36" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="366" y="87" fill="#446688" font-weight="bold">0</text>
    <!-- run "1" len=1 -->
    <rect x="388" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="410" y="87" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- run "0" len=1 -->
    <rect x="432" y="64" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="454" y="87" fill="#446688" font-weight="bold">0</text>
  </g>

  <!-- run brackets -->
  <path d="M 82 108 L 82 114 L 166 114 L 166 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="124" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1×2 ★max₁</text>

  <path d="M 170 108 L 170 114 L 210 114 L 210 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0×1</text>

  <path d="M 214 108 L 214 114 L 254 114 L 254 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="234" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1×1</text>

  <path d="M 258 108 L 258 114 L 386 114 L 386 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="322" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0×3 ★max₀</text>

  <path d="M 390 108 L 390 114 L 430 114 L 430 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="410" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1×1</text>

  <path d="M 434 108 L 434 114 L 474 114 L 474 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="454" y="128" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0×1</text>

  <!-- max1 and max0 boxes -->
  <rect x="60" y="156" width="190" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最长 1 连续段</text>
  <text x="155" y="208" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max₁ = 2</text>

  <rect x="310" y="156" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">最长 0 连续段</text>
  <text x="405" y="208" text-anchor="middle" font-size="20" fill="#446688" font-weight="bold" filter="url(#rough2)">max₀ = 3</text>

  <!-- comparison symbol -->
  <text x="280" y="198" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;?</text>

  <!-- result -->
  <rect x="100" y="244" width="360" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">max₁ &gt; max₀ ? 2 &gt; 3 ? → false</text>

  <!-- note -->
  <rect x="50" y="304" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">一趟扫描：字符变化时结算前一段长度并更新对应 max</text>
  <text x="280" y="336" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">遍历结束后务必再结算一次末段（易漏！）</text>
</svg>
