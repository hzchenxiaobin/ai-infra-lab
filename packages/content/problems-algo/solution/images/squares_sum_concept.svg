<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：a、b 同在 [0, ⌊√c⌋] 上，a²+b² 双向单调 ⇒ 双指针逼近</text>

  <!-- ===== Top: search space as sorted array ===== -->
  <text x="40" y="60" font-size="12" fill="#888" font-weight="bold">搜索空间：把 [0, ⌊√c⌋] 视作升序数组（以 c=18, ⌊√c⌋=4 为例）</text>

  <!-- number line / array cells -->
  <g filter="url(#rough2)">
    <rect x="80"  y="80" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="80" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="80" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="80" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="80" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="103">0</text>
    <text x="200" y="103">1</text>
    <text x="280" y="103">2</text>
    <text x="360" y="103">3</text>
    <text x="440" y="103">4</text>
  </g>

  <!-- a pointer (left, green) -->
  <path d="M 120 70 L 112 60 L 128 60 z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="120" y="54" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>

  <!-- b pointer (right, red) -->
  <path d="M 440 126 L 432 136 L 448 136 z" fill="#b85450" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>

  <!-- bidirectional arrows -->
  <path d="M 130 142 L 430 142" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#888">a ≤ b 时循环（含相等）</text>

  <!-- ===== Middle: monotonicity illustration ===== -->
  <text x="40" y="190" font-size="12" fill="#888" font-weight="bold">双向单调性</text>

  <!-- two arrows: a→ (sum increases), ←b (sum decreases) -->
  <rect x="80" y="206" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a 增大 ⇒ a²+b² 增大</text>
  <text x="180" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">和小：a++</text>
  <path d="M 100 240 L 270 240" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="300" y="206" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b 减小 ⇒ a²+b² 减小</text>
  <text x="400" y="244" text-anchor="middle" font-size="11" fill="#b85450">和大：b--</text>
  <path d="M 490 240 L 320 240" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Bottom: equation invariant ===== -->
  <rect x="80" y="270" width="400" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">问题归约</text>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#444">在有序数组 [0, 1, …, ⌊√c⌋] 中</text>
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">找两个数 a, b 使 a² + b² = c</text>

  <!-- tiny note: a may equal b -->
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#999">注：a 可等于 b（如 c=8=2²+2²），故循环用 a ≤ b</text>
</svg>
