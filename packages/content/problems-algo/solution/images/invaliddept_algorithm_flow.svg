<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种"反连接"写法对比：LEFT JOIN / NOT IN / NOT EXISTS</text>

  <!-- Column A: LEFT JOIN -->
  <rect x="20" y="42" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">A. LEFT JOIN（推荐）</text>

  <rect x="20" y="80" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="96" text-anchor="middle" font-size="9.5" fill="#333">① Students 左连</text>
  <text x="100" y="110" text-anchor="middle" font-size="9.5" fill="#333">Departments ON dept_id</text>

  <path d="M100 122 L100 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="20" y="136" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="152" text-anchor="middle" font-size="9.5" fill="#333">② 匹配上 d.id 非空</text>
  <text x="100" y="166" text-anchor="middle" font-size="9.5" fill="#333">未匹配 d.id = NULL</text>

  <path d="M100 178 L100 190" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="20" y="192" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="208" text-anchor="middle" font-size="9.5" fill="#333">③ WHERE d.id IS NULL</text>
  <text x="100" y="222" text-anchor="middle" font-size="9.5" fill="#333">筛出"悬空"行</text>

  <path d="M100 234 L100 246" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="20" y="250" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">✓ 输出 Ann</text>

  <!-- Column B: NOT IN -->
  <rect x="200" y="42" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B. NOT IN</text>

  <rect x="200" y="80" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="9.5" fill="#333">① 取 Departments.id</text>
  <text x="280" y="110" text-anchor="middle" font-size="9.5" fill="#333">集合 {1, 7, 15}</text>

  <path d="M280 122 L280 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="200" y="136" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="9.5" fill="#333">② 逐行判定</text>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#333">dept_id ∉ {1,7,15}?</text>

  <path d="M280 178 L280 190" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="200" y="192" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="9.5" fill="#333">③ 13 不在集合 → 真</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">⚠ NULL → 未知（陷阱）</text>

  <path d="M280 234 L280 246" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="200" y="250" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">✓ 输出 Ann（无 NULL 时）</text>

  <!-- Column C: NOT EXISTS -->
  <rect x="380" y="42" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C. NOT EXISTS</text>

  <rect x="380" y="80" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="96" text-anchor="middle" font-size="9.5" fill="#333">① 外层遍历每行</text>
  <text x="460" y="110" text-anchor="middle" font-size="9.5" fill="#333">Student</text>

  <path d="M460 122 L460 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="380" y="136" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="152" text-anchor="middle" font-size="9.5" fill="#333">② 相关子查询：</text>
  <text x="460" y="166" text-anchor="middle" font-size="9.5" fill="#333">dept_id 能否在 D 匹配</text>

  <path d="M460 178 L460 190" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="380" y="192" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="208" text-anchor="middle" font-size="9.5" fill="#333">③ 找不到 → NOT EXISTS 真</text>
  <text x="460" y="222" text-anchor="middle" font-size="9.5" fill="#4a7a3a">✓ NULL 安全</text>

  <path d="M460 234 L460 246" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="380" y="250" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="460" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">✓ 输出 Ann</text>

  <!-- comparison table -->
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">三法对比</text>
  <rect x="40" y="314" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="329" font-size="9.5" fill="#446688" font-weight="bold">维度</text>
  <text x="160" y="329" font-size="9.5" fill="#446688" font-weight="bold">LEFT JOIN</text>
  <text x="300" y="329" font-size="9.5" fill="#446688" font-weight="bold">NOT IN</text>
  <text x="430" y="329" font-size="9.5" fill="#446688" font-weight="bold">NOT EXISTS</text>

  <rect x="40" y="336" width="480" height="20" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="350" font-size="9.5" fill="#333">NULL 安全</text>
  <text x="160" y="350" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="300" y="350" font-size="9.5" fill="#b85450" font-weight="bold">✗</text>
  <text x="430" y="350" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="40" y="356" width="480" height="20" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="370" font-size="9.5" fill="#333">性能</text>
  <text x="160" y="370" font-size="9.5" fill="#333">优（Hash/NL）</text>
  <text x="300" y="370" font-size="9.5" fill="#333">优（可展开）</text>
  <text x="430" y="370" font-size="9.5" fill="#333">优（半连接）</text>

  <rect x="40" y="376" width="480" height="20" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="390" font-size="9.5" fill="#333">推荐度</text>
  <text x="160" y="390" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 首选</text>
  <text x="300" y="390" font-size="9.5" fill="#d6a040">△ 仅无 NULL</text>
  <text x="430" y="390" font-size="9.5" fill="#4a7a3a">✓ 备选</text>

  <text x="280" y="412" text-anchor="middle" font-size="9.5" fill="#888">三法语义等价（无 NULL 时），优化器常相互改写；差异在 NULL 处理与可读性</text>
</svg>
