<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐行递推 + 滑动窗口 O(1) 转移</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">外层枚举 i（排列长度），内层枚举 j（逆序对数），滚动数组优化空间</text>

  <!-- ===== Init ===== -->
  <rect x="180" y="58" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#3a5a2a">初始化：dp[0] = 1（i=1 时唯一排列）</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Outer for loop ===== -->
  <rect x="160" y="110" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#3a4a66">for i = 2 .. n</text>

  <path d="M 280 144 L 280 160" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== cur[0] = 1 ===== -->
  <rect x="180" y="162" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="10.5" fill="#7a3a3a">cur[0] = 1（升序排列，0 逆序对）</text>

  <path d="M 280 196 L 280 212" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Inner for loop ===== -->
  <rect x="160" y="214" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#3a4a66">for j = 1 .. k</text>

  <path d="M 280 248 L 280 264" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: j >= i? ===== -->
  <polygon points="280,266 420,308 280,350 140,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#6a4a10">j ≥ i ?</text>
  <text x="280" y="320" text-anchor="middle" font-size="9" fill="#888">(窗口是否已满)</text>

  <!-- Yes branch (right) -->
  <path d="M 420 308 L 460 308" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="302" font-size="10" fill="#4a7a3a">是</text>
  <rect x="460" y="290" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="505" y="306" text-anchor="middle" font-size="9" fill="#3a5a2a">cur[j] = cur[j−1]</text>
  <text x="505" y="318" text-anchor="middle" font-size="9" fill="#3a5a2a">+ dp[j] − dp[j−i]</text>

  <!-- No branch (left) -->
  <path d="M 140 308 L 100 308" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="302" font-size="10" fill="#b85450">否</text>
  <rect x="10" y="290" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="55" y="306" text-anchor="middle" font-size="9" fill="#7a3a3a">cur[j] = cur[j−1]</text>
  <text x="55" y="318" text-anchor="middle" font-size="9" fill="#7a3a3a">+ dp[j]</text>

  <!-- merge down -->
  <path d="M 505 326 L 505 360 L 280 360" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 55 326 L 55 360 L 280 360" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 280 350 L 280 360" stroke="#666" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- loop back j++ -->
  <path d="M 280 360 L 280 376" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 376 L 380 376 L 380 231 L 400 231" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="370" font-size="9" fill="#888">j++</text>

  <!-- dp = cur -->
  <path d="M 160 231 L 120 231 L 120 400 L 160 400" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="9" fill="#888">j 循环结束</text>
  <text x="60" y="252" font-size="9" fill="#888">dp ← cur</text>
  <text x="60" y="264" font-size="9" fill="#888">（滚动数组）</text>

  <!-- loop back i++ -->
  <path d="M 160 400 L 160 127 L 150 127" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="396" font-size="9" fill="#888">i++</text>

  <!-- ===== Return ===== -->
  <rect x="180" y="408" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 dp[k] mod (10⁹+7)</text>
</svg>
