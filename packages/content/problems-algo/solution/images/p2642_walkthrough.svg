<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：四次操作</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">同一张图随 addEdge 演变，最短路动态重算</text>

  <!-- ===== Stage 1: shortestPath(3,2) = 6 ===== -->
  <text x="34" y="70" font-size="11" fill="#4a7a3a" font-weight="bold">① shortestPath(3, 2) → 6</text>
  <text x="200" y="70" font-size="10" fill="#888">路径 3→0→1→2 = 3+2+1</text>

  <!-- mini graph 1 -->
  <ellipse cx="60" cy="120" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="180" cy="92" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <ellipse cx="300" cy="120" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <ellipse cx="120" cy="160" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <path d="M 76 124 L 282 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 74 116 L 164 96" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 198 98 L 282 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 108 146 L 74 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="360" y="104" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dist[3]=0 → 0(3) → 1(5) → 2(6)</text>
  <text x="450" y="136" text-anchor="middle" font-size="9" fill="#666">弹出 2 时 dist[2]=6 已确定</text>

  <!-- ===== Stage 2: shortestPath(0,3) = -1 ===== -->
  <text x="34" y="196" font-size="11" fill="#b85450" font-weight="bold">② shortestPath(0, 3) → -1</text>
  <text x="200" y="196" font-size="10" fill="#888">无 0→3 的路（边方向都是离开 0）</text>

  <ellipse cx="60" cy="240" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="244" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <ellipse cx="180" cy="212" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <ellipse cx="300" cy="240" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <ellipse cx="120" cy="280" rx="18" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <path d="M 76 244 L 282 242" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 74 236 L 164 216" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 198 218 L 282 236" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 108 266 L 74 252" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="262" text-anchor="middle" font-size="9" fill="#b85450">3→0 反向，用不上</text>

  <rect x="360" y="224" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">堆空，dist[3]=∞</text>
  <text x="450" y="256" text-anchor="middle" font-size="9" fill="#666">不可达 → 返回 -1</text>

  <!-- ===== Stage 3: addEdge([1,3,4]) ===== -->
  <text x="34" y="316" font-size="11" fill="#d6a040" font-weight="bold">③ addEdge([1, 3, 4])</text>
  <text x="200" y="316" font-size="10" fill="#888">adj[1].push((3,4))，O(1) 追加</text>

  <ellipse cx="60" cy="360" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="364" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="180" cy="332" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <ellipse cx="300" cy="360" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <ellipse cx="120" cy="400" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="404" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <path d="M 168 346 L 132 386" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 (新)</text>

  <!-- ===== Stage 4: shortestPath(0,3) = 6 ===== -->
  <text x="34" y="436" font-size="11" fill="#4a7a3a" font-weight="bold">④ shortestPath(0, 3) → 6</text>
  <text x="200" y="436" font-size="10" fill="#888">路径 0→1→3 = 2+4（新边打通）</text>
</svg>
