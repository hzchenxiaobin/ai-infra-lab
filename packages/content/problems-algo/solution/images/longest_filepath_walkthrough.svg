<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：dir\n\tsubdir1\n\tsubdir2\n\t\tfile.ext</text>
  <text x="290" y="42" text-anchor="middle" font-size="10" fill="#888">逐行解析，path_len[d] 记录深度 d 的累计路径长度</text>

  <!-- Column headers -->
  <text x="40" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步</text>
  <text x="140" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">行内容</text>
  <text x="220" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">depth</text>
  <text x="340" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">path_len 数组</text>
  <text x="490" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">说明</text>
  <line x1="15" y1="74" x2="565" y2="74" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 1: dir ===== -->
  <circle cx="40" cy="104" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">dir</text>
  <text x="220" y="108" text-anchor="middle" font-size="11" fill="#555">0</text>
  <!-- path_len = [3] -->
  <rect x="300" y="92" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="108" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="288" y="108" text-anchor="middle" font-size="9" fill="#888">[</text>
  <text x="342" y="108" text-anchor="middle" font-size="9" fill="#888">]</text>
  <text x="490" y="108" text-anchor="middle" font-size="10" fill="#888">目录，depth=0</text>

  <!-- arrow down -->
  <path d="M 40 120 L 40 134" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: \tsubdir1 ===== -->
  <circle cx="40" cy="152" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="140" y="156" text-anchor="middle" font-size="10" fill="#333" font-family="monospace"><tspan fill="#b85450">\t</tspan>subdir1</text>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#555">1</text>
  <!-- path_len = [3, 11] -->
  <rect x="300" y="140" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="140" width="36" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11</text>
  <text x="288" y="156" text-anchor="middle" font-size="9" fill="#888">[</text>
  <text x="382" y="156" text-anchor="middle" font-size="9" fill="#888">]</text>
  <text x="490" y="156" text-anchor="middle" font-size="9" fill="#888">3+1+7=11，新增 d=1</text>

  <path d="M 40 168 L 40 182" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: \tsubdir2 ===== -->
  <circle cx="40" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="140" y="204" text-anchor="middle" font-size="10" fill="#333" font-family="monospace"><tspan fill="#b85450">\t</tspan>subdir2</text>
  <text x="220" y="204" text-anchor="middle" font-size="11" fill="#555">1</text>
  <!-- path_len = [3, 11] (overwrite d=1) -->
  <rect x="300" y="188" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="204" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="188" width="36" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11</text>
  <text x="288" y="204" text-anchor="middle" font-size="9" fill="#888">[</text>
  <text x="382" y="204" text-anchor="middle" font-size="9" fill="#888">]</text>
  <!-- overwrite annotation -->
  <path d="M 376 188 L 376 178 L 396 178" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="204" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">覆盖 d=1（兄弟节点）</text>

  <path d="M 40 216 L 40 230" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: \t\tfile.ext ===== -->
  <circle cx="40" cy="248" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#333" font-family="monospace"><tspan fill="#b85450">\t\t</tspan><tspan fill="#d6a040" font-weight="bold">file.ext</tspan></text>
  <text x="220" y="252" text-anchor="middle" font-size="11" fill="#555">2</text>
  <!-- path_len = [3, 11, 20] -->
  <rect x="300" y="236" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="252" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="236" width="36" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="358" y="252" text-anchor="middle" font-size="11" fill="#333">11</text>
  <rect x="380" y="236" width="36" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">20</text>
  <text x="288" y="252" text-anchor="middle" font-size="9" fill="#888">[</text>
  <text x="422" y="252" text-anchor="middle" font-size="9" fill="#888">]</text>
  <text x="490" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">文件！max=20</text>

  <!-- ===== Result box ===== -->
  <line x1="15" y1="282" x2="565" y2="282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="300" width="380" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">路径拼接：dir / subdir2 / file.ext</text>
  <text x="290" y="346" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3 + 1 + 7 + 1 + 8 = 20</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#555">第 3 步覆盖 d=1 后，第 4 步用的正是 subdir2 的 11</text>
</svg>
