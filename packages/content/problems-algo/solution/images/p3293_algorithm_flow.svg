<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外连接带出折扣 → NULL 兜底成 0 → 一条公式算到底</text>

  <rect x="150" y="42" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① FROM Products（n 行产品）</text>

  <path d="M 260 78 L 260 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="115" y="96" width="290" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② LEFT JOIN Discounts USING (category)</text>

  <path d="M 210 132 C 188 148, 170 156, 150 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 310 132 C 332 148, 350 156, 370 166" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="168" width="190" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">命中：discount = 10 / 20</text>

  <rect x="290" y="168" width="190" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="191" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">未命中：discount = NULL</text>

  <path d="M 135 206 C 162 224, 200 234, 230 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 385 206 C 358 224, 320 234, 290 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="242" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">③ IFNULL(discount, 0)：NULL → 0</text>

  <path d="M 260 280 L 260 294" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="85" y="298" width="350" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ final_price = price × (100 − d) / 100</text>

  <path d="M 260 336 L 260 350" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="354" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ ORDER BY product_id 升序</text>

  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一条公式统一「有折扣 / 无折扣」两种情况，无需 UNION 两个分支</text>
</svg>
