<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="#fdfcf7"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 3 逐步演算：3 次翻转使数组全 1</text>
  <path d="M 260 40 Q 410 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="410" y="60" text-anchor="middle" font-size="11" fill="#888">nums = [0,0,0,1,0,1,1,0]，k = 3；每行展示该 i 处理后的状态</text>

  <!-- column headers -->
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="50" y="92" font-weight="bold" fill="#444">i</text>
    <text x="90" y="92" font-weight="bold" fill="#444">flip</text>
    <text x="135" y="92" font-weight="bold" fill="#444">nums[i]</text>
    <text x="195" y="92" font-weight="bold" fill="#444">有效位</text>
    <text x="255" y="92" font-weight="bold" fill="#444">动作</text>
    <text x="430" y="92" font-weight="bold" fill="#444">处理后数组（红=刚翻转）</text>
  </g>

  <!-- helper: each row y from 110 step 52 -->
  <!-- i=0 -->
  <g filter="url(#sk)"><rect x="30" y="100" width="760" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="128">0</text>
    <text x="90" y="128" fill="#b85450" font-weight="bold">0→1</text>
    <text x="135" y="128">0</text>
    <text x="195" y="128" fill="#b03a3a" font-weight="bold">0</text>
    <text x="255" y="128" fill="#b03a3a" font-weight="bold">翻转[0,2]</text>
  </g>
  <g font-size="12" filter="url(#sk)">
    <rect x="430" y="110" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="446" y="130" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="462" y="110" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="478" y="130" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="494" y="110" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="510" y="130" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="526" y="110" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="542" y="130" text-anchor="middle" fill="#888">1</text>
    <rect x="558" y="110" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="574" y="130" text-anchor="middle" fill="#888">0</text>
    <rect x="590" y="110" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="606" y="130" text-anchor="middle" fill="#888">1</text>
    <rect x="622" y="110" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="638" y="130" text-anchor="middle" fill="#888">1</text>
    <rect x="654" y="110" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="670" y="130" text-anchor="middle" fill="#888">0</text>
  </g>
  <text x="710" y="128" font-size="10" fill="#b85450" font-weight="bold">ans=1</text>

  <!-- i=1,2,3 (skip rows, combined) -->
  <g filter="url(#sk)"><rect x="30" y="148" width="760" height="40" rx="4" fill="#fff" stroke="#e0e0e0" stroke-width="1"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="173">1·2</text>
    <text x="90" y="173" fill="#4a7a3a">1</text>
    <text x="135" y="173">0·0</text>
    <text x="195" y="173" fill="#4a7a3a">1·1</text>
    <text x="255" y="173" fill="#888">跳过</text>
  </g>
  <text x="430" y="173" font-size="10" fill="#888">有效位已是 1，无需翻转（翻转[0,2] 仍覆盖）</text>

  <!-- i=3 -->
  <g filter="url(#sk)"><rect x="30" y="192" width="760" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="217">3</text>
    <text x="90" y="217" fill="#d6a040" font-weight="bold">1→0</text>
    <text x="135" y="217">1</text>
    <text x="195" y="217" fill="#4a7a3a">1</text>
    <text x="255" y="217" fill="#888">跳过（撤销翻转[0,2]）</text>
  </g>
  <text x="430" y="217" font-size="10" fill="#d6a040">diff[3]=1 生效，flip 1→0；翻转[0,2] 影响结束</text>

  <!-- i=4 -->
  <g filter="url(#sk)"><rect x="30" y="236" width="760" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="264">4</text>
    <text x="90" y="264" fill="#b85450" font-weight="bold">0→1</text>
    <text x="135" y="264">0</text>
    <text x="195" y="264" fill="#b03a3a" font-weight="bold">0</text>
    <text x="255" y="264" fill="#b03a3a" font-weight="bold">翻转[4,6]</text>
  </g>
  <g font-size="12" filter="url(#sk)">
    <rect x="430" y="246" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="446" y="266" text-anchor="middle" fill="#888">1</text>
    <rect x="462" y="246" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="478" y="266" text-anchor="middle" fill="#888">1</text>
    <rect x="494" y="246" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="510" y="266" text-anchor="middle" fill="#888">1</text>
    <rect x="526" y="246" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="542" y="266" text-anchor="middle" fill="#888">1</text>
    <rect x="558" y="246" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="574" y="266" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="590" y="246" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="606" y="266" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="622" y="246" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="638" y="266" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="654" y="246" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="670" y="266" text-anchor="middle" fill="#888">0</text>
  </g>
  <text x="710" y="264" font-size="10" fill="#b85450" font-weight="bold">ans=2</text>

  <!-- i=5 -->
  <g filter="url(#sk)"><rect x="30" y="284" width="760" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="312">5</text>
    <text x="90" y="312" fill="#b85450" font-weight="bold">1→0</text>
    <text x="135" y="312">1</text>
    <text x="195" y="312" fill="#b03a3a" font-weight="bold">0</text>
    <text x="255" y="312" fill="#b03a3a" font-weight="bold">翻转[5,7]</text>
  </g>
  <g font-size="12" filter="url(#sk)">
    <rect x="430" y="294" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="446" y="314" text-anchor="middle" fill="#888">1</text>
    <rect x="462" y="294" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="478" y="314" text-anchor="middle" fill="#888">1</text>
    <rect x="494" y="294" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="510" y="314" text-anchor="middle" fill="#888">1</text>
    <rect x="526" y="294" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="542" y="314" text-anchor="middle" fill="#888">1</text>
    <rect x="558" y="294" width="32" height="28" fill="#fff" stroke="#bbb" rx="3"/><text x="574" y="314" text-anchor="middle" fill="#888">1</text>
    <rect x="590" y="294" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="606" y="314" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="622" y="294" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="638" y="314" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="654" y="294" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/><text x="670" y="314" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
  </g>
  <text x="710" y="312" font-size="10" fill="#b85450" font-weight="bold">ans=3</text>

  <!-- i=6,7 (skip) -->
  <g filter="url(#sk)"><rect x="30" y="332" width="760" height="40" rx="4" fill="#fff" stroke="#e0e0e0" stroke-width="1"/></g>
  <g font-size="11" fill="#333">
    <text x="50" y="357">6·7</text>
    <text x="90" y="357" fill="#4a7a3a">0·1</text>
    <text x="135" y="357">1·0</text>
    <text x="195" y="357" fill="#4a7a3a">1·1</text>
    <text x="255" y="357" fill="#888">跳过</text>
  </g>
  <text x="430" y="357" font-size="10" fill="#888">有效位全为 1，无需翻转（i=7 撤销翻转[4,6]）</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="30" y="384" width="760" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="410" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">最终数组全 1 ✓  返回 ans = 3</text>
  <g font-size="12" filter="url(#sk)">
    <rect x="430" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="446" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="462" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="478" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="494" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="510" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="526" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="542" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="558" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="574" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="590" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="606" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="622" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="638" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="654" y="418" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="670" y="434" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="30" y="460" width="760" height="84" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="484" font-size="11" font-weight="bold" fill="#444">图例</text>
  <g font-size="10" fill="#444">
    <rect x="90" y="476" width="16" height="14" fill="#fce4ec" stroke="#b85450" rx="2" filter="url(#sk)"/>
    <text x="112" y="487">刚翻转的位</text>
    <rect x="200" y="476" width="16" height="14" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#sk)"/>
    <text x="222" y="487">撤销翻转的时机</text>
    <rect x="330" y="476" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#sk)"/>
    <text x="352" y="487">最终全 1</text>
  </g>
  <g font-size="10" fill="#666">
    <text x="50" y="510">flip = 进入 i 并累加 diff[i] 后的活跃翻转奇偶性；有效位 = nums[i] ⊕ flip</text>
    <text x="50" y="528">翻转[0,2] 在 i=3 撤销（diff[3]=1）；翻转[4,6] 在 i=7 撤销（diff[7]=1）；翻转[5,7] 在 i=8 越界不写</text>
  </g>
</svg>
