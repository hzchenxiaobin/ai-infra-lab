<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：记忆化 DFS + 双向扫描</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i] = 从 i 出发最多能访问的下标数；答案 = max dp[i]</text>

  <!-- start node -->
  <rect x="240" y="62" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(i)：已算则返回 dp[i]</text>

  <path d="M 300 98 L 300 118" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- init dp[i]=1 -->
  <rect x="232" y="120" width="136" height="30" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#555">best = 1 （至少访问 i 自己）</text>

  <path d="M 300 152 L 300 168" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- diamond: scan left -->
  <polygon points="300,172 372,206 300,240 228,206" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">向左扫 j=i−1…i−d</text>
  <text x="300" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">arr[j] ≥ arr[i] ?</text>

  <!-- left: yes break -->
  <path d="M 228 206 L 150 206" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="158" y="200" font-size="10" fill="#b85450" font-weight="bold">是 → 停止左扫</text>
  <rect x="58" y="218" width="100" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108" y="236" text-anchor="middle" font-size="10" fill="#b85450">break（挡路）</text>

  <!-- left: no -> recurse -->
  <path d="M 300 240 L 300 262" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="256" font-size="10" fill="#4a7a3a">否，j 合法</text>

  <rect x="196" y="266" width="208" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">best = max(best, 1 + dfs(j))</text>

  <path d="M 300 298 L 300 316" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- diamond: scan right (mirror) -->
  <polygon points="300,320 372,348 300,376 228,348" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">向右扫 j=i+1…i+d</text>
  <text x="300" y="360" text-anchor="middle" font-size="10" fill="#446688">同理遇阻即停</text>

  <path d="M 372 348 L 452 348" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="452" y="332" width="120" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="512" y="354" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">return dp[i]=best</text>

  <!-- side note -->
  <rect x="40" y="332" width="170" height="68" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="352" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">主程序</text>
  <text x="50" y="370" font-size="10" fill="#888">ans = 0</text>
  <text x="50" y="384" font-size="10" fill="#888">for i in range(n):</text>
  <text x="50" y="396" font-size="10" fill="#888">    ans = max(ans, dfs(i))</text>
</svg>
