<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐访问判定 → 按顾客计数</text>

  <!-- ===== Left: Visits with status ===== -->
  <text x="20" y="50" font-size="10" fill="#888">Visits 逐行判定</text>
  <rect x="20" y="56" width="300" height="212" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="72" font-size="9" fill="#446688" font-weight="bold">visit cust  交易?     计入</text>
  <line x1="20" y1="78" x2="320" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- v1 c23 has trans -->
  <text x="30" y="94" font-size="9" fill="#4a7a3a">1    23   ✓有(t12)   ✗</text>
  <!-- v2 c9 has trans -->
  <text x="30" y="112" font-size="9" fill="#4a7a3a">2    9    ✓有(t13)   ✗</text>
  <!-- v4 c30 no trans -->
  <rect x="22" y="118" width="296" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="130" font-size="9" fill="#b85450" font-weight="bold">4    30   ✗无        +1 → c30</text>
  <!-- v5 c54 has trans -->
  <text x="30" y="148" font-size="9" fill="#4a7a3a">5    54   ✓有(3笔)   ✗</text>
  <!-- v6 c96 no trans -->
  <rect x="22" y="154" width="296" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="166" font-size="9" fill="#b85450" font-weight="bold">6    96   ✗无        +1 → c96</text>
  <!-- v7 c54 no trans -->
  <rect x="22" y="172" width="296" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="184" font-size="9" fill="#b85450" font-weight="bold">7    54   ✗无        +1 → c54</text>
  <!-- v8 c54 no trans -->
  <rect x="22" y="190" width="296" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="30" y="202" font-size="9" fill="#b85450" font-weight="bold">8    54   ✗无        +1 → c54</text>

  <text x="30" y="226" font-size="9" fill="#4a7a3a">✓ 有交易 3 次访问（丢弃）</text>
  <text x="30" y="240" font-size="9" fill="#b85450" font-weight="bold">✗ 无交易 4 次访问（保留计数）</text>
  <text x="30" y="258" font-size="8" fill="#888">c54 的 v5 有交易，但 v7/v8 无 → 仍计 2</text>

  <!-- Arrow to right -->
  <path d="M 324 162 L 360 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="156" text-anchor="middle" font-size="8" fill="#888">按顾客</text>
  <text x="342" y="166" text-anchor="middle" font-size="8" fill="#888">聚合</text>

  <!-- ===== Right: aggregation result ===== -->
  <text x="380" y="50" font-size="10" fill="#888">GROUP BY customer_id</text>
  <rect x="370" y="56" width="170" height="212" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="72" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">cust   count</text>
  <line x1="370" y1="78" x2="540" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- c23 excluded -->
  <rect x="376" y="84" width="158" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.35"/>
  <text x="386" y="98" font-size="9" fill="#b85450">23     0（不出现）</text>
  <text x="386" y="108" font-size="7" fill="#888">v1 有交易</text>

  <!-- c9 excluded -->
  <rect x="376" y="112" width="158" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.35"/>
  <text x="386" y="126" font-size="9" fill="#b85450">9      0（不出现）</text>
  <text x="386" y="136" font-size="7" fill="#888">v2 有交易</text>

  <!-- c30 = 1 -->
  <rect x="376" y="140" width="158" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.55"/>
  <text x="386" y="156" font-size="9" fill="#446688" font-weight="bold">30     1</text>
  <text x="386" y="164" font-size="7" fill="#888">v4 无交易</text>

  <!-- c54 = 2 -->
  <rect x="376" y="170" width="158" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)" opacity="0.65"/>
  <text x="386" y="186" font-size="9" fill="#446688" font-weight="bold">54     2</text>
  <text x="386" y="194" font-size="7" fill="#888">v7 + v8 无交易</text>

  <!-- c96 = 1 -->
  <rect x="376" y="200" width="158" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.55"/>
  <text x="386" y="216" font-size="9" fill="#446688" font-weight="bold">96     1</text>
  <text x="386" y="224" font-size="7" fill="#888">v6 无交易</text>

  <text x="455" y="248" text-anchor="middle" font-size="8" fill="#888">count = COUNT(*)</text>
  <text x="455" y="260" text-anchor="middle" font-size="8" fill="#888">仅含无交易访问</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="290" width="520" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：判定粒度是「访问」而非「顾客」</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#666">c54 三次进店：v5 有交易（不计）+ v7/v8 无交易（各计 1）→ count_no_trans = 2</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#666">完全无交易顾客才出现；有交易的顾客若也有无交易访问仍会计数</text>

  <!-- ===== Legend ===== -->
  <rect x="20" y="362" width="240" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="378" font-size="9" fill="#4a7a3a">✓ 有交易：LEFT JOIN 匹配到 → 丢弃</text>
  <text x="30" y="392" font-size="9" fill="#b85450">✗ 无交易：IS NULL → 保留并计数</text>

  <rect x="300" y="362" width="240" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="378" font-size="9" fill="#446688">count_no_trans = COUNT(*)</text>
  <text x="310" y="392" font-size="9" fill="#888">按 customer_id 分组数无交易访问</text>
</svg>
