<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：两种选择取较大值</text>

  <!-- ===== top: dp[i][j][k] node ===== -->
  <rect x="200" y="46" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">dp[i][j][k]</text>

  <!-- two branches -->
  <path d="M 240 88 L 130 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 88 L 430 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Choice A (left) ===== -->
  <rect x="40" y="120" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">选择 A：立即消掉 boxes[i]</text>

  <!-- illustration: k boxes + boxes[i] removed together -->
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="#888">左侧 k 个 + boxes[i] 一起消</text>
  <rect x="64" y="178" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="178" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="193" font-size="10" fill="#446688" font-weight="bold">k</text>
  <rect x="130" y="176" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <path d="M 158 188 L 188 188" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="192" font-size="11" fill="#b85450" font-weight="bold">(k+1)²</text>

  <!-- A result -->
  <path d="M 130 210 L 130 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="236" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="11" fill="#444">(k+1)² + dp[i+1][j][0]</text>
  <text x="130" y="272" text-anchor="middle" font-size="10" fill="#888">剩下 boxes[i+1..j]，左侧无挂载</text>

  <!-- ===== Choice B (right) ===== -->
  <rect x="340" y="120" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">选择 B：找同色 m 合并</text>

  <!-- illustration: boxes[i] ... boxes[m](same color) -->
  <text x="430" y="170" text-anchor="middle" font-size="10" fill="#888">消干净中间，让 i 贴到 m</text>
  <rect x="356" y="178" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="367" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <rect x="380" y="180" width="22" height="20" fill="#eeeeee" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="194" text-anchor="middle" font-size="9" fill="#777">…</text>
  <rect x="404" y="178" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">m</text>
  <text x="430" y="214" text-anchor="middle" font-size="9" fill="#d6a040">boxes[m]==boxes[i]</text>
  <!-- brace under mid -->
  <path d="M 367 206 L 367 212 L 415 212 L 415 206" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="391" y="226" text-anchor="middle" font-size="9" fill="#b85450">先消中间 i+1..m-1</text>

  <!-- B result -->
  <path d="M 430 232 L 430 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="258" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="11" fill="#444">dp[i+1][m-1][0] + dp[m][j][k+1]</text>
  <text x="430" y="294" text-anchor="middle" font-size="10" fill="#888">挂载数 k → k+1（boxes[i] 也挂到 m 左侧）</text>

  <!-- ===== combine: take max ===== -->
  <path d="M 130 284 L 130 312 L 430 312 L 430 284" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 312 L 280 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="338" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j][k] = max { 选择 A, 选择 B }</text>

  <!-- ===== formula box ===== -->
  <rect x="30" y="380" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">完整转移</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#b85450">dp[i][j][k] = max&#123; (k+1)² + dp[i+1][j][0],  max_m&#123; dp[i+1][m-1][0] + dp[m][j][k+1] &#125; &#125;</text>
  <text x="280" y="430" text-anchor="middle" font-size="9" fill="#888">其中 boxes[m] == boxes[i]，m ∈ (i, j]；边界 i&gt;j 时 dp=0</text>
</svg>
