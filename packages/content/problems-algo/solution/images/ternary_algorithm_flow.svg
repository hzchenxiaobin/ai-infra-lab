<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三元表达式解析器算法流程（从右向左）</text>

  <!-- Init -->
  <rect x="70" y="42" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="10.5" fill="#555">i = n − 1，栈 stk = []</text>

  <path d="M 230 96 L 230 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,116 340,156 230,196 120,156" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≥ 0 ?</text>
  <text x="230" y="170" text-anchor="middle" font-size="10.5" fill="#777">未扫完？</text>

  <!-- No -> return ans -->
  <path d="M 340 156 L 400 156 L 400 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="148" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="330" y="244" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="269" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return stk[-1]</text>

  <!-- Yes down -->
  <path d="M 230 196 L 230 212" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="208" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- read c -->
  <rect x="90" y="216" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="241" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">c = expression[i]</text>

  <path d="M 230 256 L 230 272" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: c == '?' ? -->
  <polygon points="230,276 330,316 230,356 130,316" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c == '?' ?</text>

  <!-- Yes: reduce -->
  <path d="M 130 316 L 60 316 L 60 376" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="80" y="308" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="380" width="170" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="91" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">归约</text>
  <text x="91" y="416" text-anchor="middle" font-size="10" fill="#555">cond = expr[i−1]</text>
  <text x="91" y="430" text-anchor="middle" font-size="10" fill="#555">first=pop, second=pop</text>
  <text x="91" y="446" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">push cond==T?first:second</text>
  <text x="91" y="460" text-anchor="middle" font-size="10" fill="#b85450">i −= 2（跳过 ? 与条件）</text>

  <!-- middle: c == ':' ? -->
  <path d="M 230 356 L 230 372" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <polygon points="230,376 300,408 230,440 160,408" fill="#f0f0f0" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c == ':' ?</text>

  <!-- Yes: skip -->
  <path d="M 160 408 L 120 408 L 120 460" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="132" y="400" font-size="10.5" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="70" y="464" width="100" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="484" text-anchor="middle" font-size="10.5" fill="#555">跳过，i −= 1</text>

  <!-- No: push -->
  <path d="M 300 408 L 360 408 L 360 376" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="332" y="400" font-size="10.5" fill="#b85450" font-weight="bold">No</text>
  <rect x="316" y="372" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="376" y="390" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">普通字符</text>
  <text x="376" y="406" text-anchor="middle" font-size="10" fill="#555">stk.push(c); i −= 1</text>

  <!-- c==? No branch to push box -->
  <path d="M 330 316 L 376 316 L 376 372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="340" y="308" font-size="10.5" fill="#b85450" font-weight="bold">No</text>

  <!-- loop back -->
  <path d="M 91 466 L 91 500 L 440 500 L 440 156 L 340 156" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 120 496 L 200 500" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="434" y="330" font-size="9.5" fill="#888" transform="rotate(-90 434 330)">i 左移，回到循环</text>
</svg>
