<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建哈希集合 → 循环倍增 → 返回</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 80 L 280 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build hash set -->
  <rect x="180" y="100" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333">构建哈希集合</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a">set = { nums 中所有元素 }</text>
  <path d="M 280 146 L 280 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While original in set? (diamond) -->
  <polygon points="280,166 380,212 280,258 180,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#333">original</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333">在 set 中?</text>

  <!-- Yes: original *= 2 -->
  <path d="M 380 212 L 440 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="408" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="190" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="492" y="210" text-anchor="middle" font-size="11" fill="#333">original *= 2</text>
  <text x="492" y="226" text-anchor="middle" font-size="9" fill="#d6a040">（继续循环）</text>

  <!-- loop back to while -->
  <path d="M 492 190 L 492 150 L 280 150 L 280 166" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="146" text-anchor="middle" font-size="9" fill="#888">回到判定</text>

  <!-- No: return original -->
  <path d="M 280 258 L 280 278" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="272" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Return -->
  <rect x="200" y="282" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 original</text>

  <!-- ====== Bottom: complexity note ====== -->
  <path d="M 30 346 L 530 346" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Complexity box -->
  <rect x="56" y="362" width="210" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="161" y="382" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间复杂度</text>
  <text x="161" y="400" text-anchor="middle" font-size="10" fill="#333">建表 O(n) + 倍增 O(k)</text>
  <text x="161" y="414" text-anchor="middle" font-size="10" fill="#333">k ≤ ⌈log₂ V⌉，总计 O(n)</text>

  <rect x="290" y="362" width="210" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="395" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">空间复杂度</text>
  <text x="395" y="400" text-anchor="middle" font-size="10" fill="#333">哈希集合存 n 个元素</text>
  <text x="395" y="414" text-anchor="middle" font-size="10" fill="#333">O(n)</text>
</svg>
