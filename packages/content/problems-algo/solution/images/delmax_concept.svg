<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="40" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">排序后矩阵（每行升序）</text>

  <!-- legend -->
  <rect x="34" y="96" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="111" font-size="12" fill="#7a5a10" filter="url(#rough2)">列最大所在格</text>
  <rect x="34" y="124" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="139" font-size="12" fill="#333" filter="url(#rough2)">普通格</text>

  <!-- column index labels -->
  <text x="202" y="78" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="278" y="78" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="354" y="78" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">j=2</text>

  <!-- row 0: [1, 2, 4]; highlight (0,0)=1 and (0,2)=4 -->
  <rect x="170" y="86" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="202" y="120" text-anchor="middle" font-size="20" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="246" y="86" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="278" y="120" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>
  <rect x="322" y="86" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="354" y="120" text-anchor="middle" font-size="20" fill="#7a5a10" filter="url(#rough2)">4</text>

  <!-- row 1: [1, 3, 3]; highlight (1,1)=3 -->
  <rect x="170" y="148" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="202" y="182" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="148" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="278" y="182" text-anchor="middle" font-size="20" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="322" y="148" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="354" y="182" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">3</text>

  <!-- arrows down to column-max boxes -->
  <path d="M202,204 L202,236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M278,204 L278,236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M354,204 L354,236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="128" y="268" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">列最大</text>

  <!-- column-max boxes -->
  <rect x="170" y="240" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="269" text-anchor="middle" font-size="18" fill="#2f5a22" filter="url(#rough2)">1</text>
  <rect x="246" y="240" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="278" y="269" text-anchor="middle" font-size="18" fill="#2f5a22" filter="url(#rough2)">3</text>
  <rect x="322" y="240" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="354" y="269" text-anchor="middle" font-size="18" fill="#2f5a22" filter="url(#rough2)">4</text>

  <!-- sum line -->
  <text x="260" y="325" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 1 + 3 + 4 = 8</text>
</svg>
