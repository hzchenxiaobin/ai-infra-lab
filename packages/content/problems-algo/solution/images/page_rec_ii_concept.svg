<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    页面推荐Ⅱ 核心思路
  </text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    好友喜欢的页面 − 自己喜欢的页面 = 推荐页面
  </text>

  <!-- User 1 (center top) -->
  <rect x="245" y="62" width="70" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">User 1</text>

  <!-- Own likes badge -->
  <rect x="235" y="104" width="90" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="11" fill="#8a6d20" filter="url(#rough2)">已赞: {88}</text>

  <!-- Friends row -->
  <!-- Friend 2 -->
  <rect x="50" y="170" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">友 2</text>
  <rect x="38" y="208" width="80" height="20" rx="3" fill="#f0f7ee" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">赞: 23, 77</text>

  <!-- Friend 3 -->
  <rect x="155" y="170" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">友 3</text>
  <rect x="143" y="208" width="80" height="20" rx="3" fill="#f0f7ee" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">赞: 24, 77</text>

  <!-- Friend 4 -->
  <rect x="335" y="170" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">友 4</text>
  <rect x="328" y="208" width="70" height="20" rx="3" fill="#f0f7ee" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="363" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">赞: 56</text>

  <!-- Friend 6 -->
  <rect x="440" y="170" width="56" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">友 6</text>
  <rect x="428" y="208" width="80" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="468" y="222" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">赞: 33, 88</text>

  <!-- Bidirectional arrows User1 ↔ friends -->
  <!-- to Friend 2 -->
  <path d="M255,96 Q150,120 82,168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M95,168 Q200,120 305,96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- to Friend 3 -->
  <path d="M265,96 Q210,120 183,168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M195,168 Q250,120 295,96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- to Friend 4 -->
  <path d="M295,96 Q340,120 363,168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M355,168 Q310,120 265,96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- to Friend 6 (highlighted: only stored as (6,1), reverse direction!) -->
  <path d="M305,96 Q400,120 468,168" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M460,168 Q360,120 260,96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="140" font-size="9" fill="#b85450" filter="url(#rough2)">⚠ 仅存(6,1)</text>

  <!-- Set operation section -->
  <line x1="30" y1="255" x2="530" y2="255" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Friend likes (union) -->
  <rect x="40" y="272" width="230" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">好友赞的页面: {23, 24, 56, 77, 33, 88}</text>

  <!-- Minus sign -->
  <text x="285" y="291" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">−</text>

  <!-- Own likes -->
  <rect x="300" y="272" width="110" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">自己已赞: {88}</text>

  <!-- Equals -->
  <text x="425" y="291" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">=</text>

  <!-- Result -->
  <rect x="440" y="272" width="105" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="291" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">推荐: {23,24,56,77,33}</text>

  <!-- Key insight box -->
  <rect x="40" y="328" width="480" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#8a6d20" filter="url(#rough2)">
    💡 两大难点：① Friendship 存储不对称（如 6→1 但无 1→6），必须 UNION 两个方向
  </text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#8a6d20" filter="url(#rough2)">
    ② 多个好友可能赞同一页 → 需 DISTINCT 去重；排除自己已赞 → 反连接（NOT EXISTS）
  </text>
</svg>
