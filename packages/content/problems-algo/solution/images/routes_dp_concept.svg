<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">记忆化搜索：状态 (city, fuel) 与转移</text>

  <!-- 当前状态框 -->
  <rect x="60" y="56" width="170" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">dfs(city, f)</text>
  <text x="145" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">当前城市 city</text>
  <text x="145" y="114" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">剩余油量 f</text>

  <!-- 在此结束分支 -->
  <rect x="290" y="56" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="345" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">city==finish?</text>
  <text x="345" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是 → +1（结束）</text>
  <path d="M230 85 L286 73" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <!-- 继续前进分支 -->
  <rect x="420" y="56" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="78" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">枚举 j != city</text>
  <path d="M230 95 L416 73" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 三个目标城市 -->
  <rect x="370" y="150" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="167" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">城市 j₁</text>
  <text x="410" y="182" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">cost = c₁</text>

  <rect x="460" y="150" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="167" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">城市 j₂</text>
  <text x="500" y="182" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">cost = c₂</text>

  <path d="M475 92 Q 410 120 410 148" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M475 92 Q 500 120 500 148" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 子状态 -->
  <rect x="370" y="225" width="80" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="245" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dfs(j₁,</text>
  <text x="410" y="260" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)"> f - c₁)</text>
  <path d="M410 192 L410 223" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="460" y="225" width="80" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="245" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dfs(j₂,</text>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)"> f - c₂)</text>
  <path d="M500 192 L500 223" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- memo 缓存标注 -->
  <rect x="370" y="290" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="308" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">memo[city][f] 缓存</text>
  <text x="455" y="322" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">命中即返回，避免重复</text>
  <path d="M410 275 L410 288" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M500 275 L500 288" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>

  <!-- 公式框 -->
  <rect x="40" y="300" width="300" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="324" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dfs(city, f) = [city==finish]</text>
  <text x="190" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">  + Σ dfs(j, f - |loc[city]-loc[j]|)</text>
  <text x="190" y="364" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j != city 且 cost ≤ f   答案 dfs(start, fuel)</text>
</svg>
