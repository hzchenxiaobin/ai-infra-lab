<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：滚动数组逐位入场，O(n · min(n,x))</text>

  <!-- 开始 -->
  <rect x="150" y="42" width="220" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：m = min(n, x)，dp[0] = 1</text>
  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="140" y="92" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">外层 i = 1 … n：第 i 位表演者入场</text>
  <path d="M 260 126 L 260 142" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 内层倒序更新 -->
  <rect x="110" y="146" width="300" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">内层 j = min(i, m) … 1（倒序滚动）</text>
  <text x="260" y="186" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">dp[j] ← ( j·dp[j] + (x−j+1)·dp[j−1] ) mod p，随后 dp[0] ← 0</text>
  <path d="M 260 198 L 260 214" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="260,218 330,244 260,270 190,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i ≤ n ?</text>
  <!-- 循环回边 -->
  <path d="M 330 244 C 400 244, 410 109, 382 109" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="432" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是：i 加 1</text>
  <text x="432" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">继续入场</text>
  <path d="M 260 270 L 260 286" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="290" y="283" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 打分求和 -->
  <rect x="120" y="290" width="280" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">累加 ans = Σ dp[k] · y^k（y^k 顺路迭代）</text>

  <!-- 返回 -->
  <rect x="150" y="330" width="220" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans（已对 10⁹ + 7 取模）</text>

  <!-- 侧注 -->
  <rect x="16" y="146" width="86" height="52" rx="6" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="59" y="166" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">倒序 = 读旧写新</text>
  <text x="59" y="180" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（0-1 背包同款）</text>
  <rect x="418" y="290" width="94" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="465" y="304" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">空节目不打分</text>
  <text x="465" y="317" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">最后统一乘 y^k</text>
</svg>
