<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">算法流程：名单 → 过滤 → LAG 配对 → 折叠计数 → 三键排序</text>

  <!-- 左列流水线 -->
  <g filter="url(#rough2)">
    <rect x="36" y="40" width="282" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="177" y="64" text-anchor="middle" font-size="10" fill="#446688">FROM：读入 course_completions 全表</text>

    <rect x="36" y="94" width="282" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="177" y="110" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">① 名单：GROUP BY user_id</text>
    <text x="177" y="126" text-anchor="middle" font-size="9" fill="#d6a040">HAVING COUNT(*) ≥ 5 AND AVG(rating) ≥ 4</text>

    <rect x="36" y="148" width="282" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="177" y="164" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② WHERE user_id IN 顶尖名单</text>
    <text x="177" y="180" text-anchor="middle" font-size="8.5" fill="#666">先筛后配——顺序不可颠倒</text>

    <rect x="36" y="202" width="282" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="177" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ LAG(course_name) OVER (...)</text>
    <text x="177" y="233" text-anchor="middle" font-size="8.5" fill="#4a7a3a">PARTITION BY user_id ORDER BY completion_date</text>

    <rect x="36" y="256" width="282" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="177" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④ 去首行 + ⑤ 折叠计数</text>
    <text x="177" y="287" text-anchor="middle" font-size="9" fill="#4a7a3a">WHERE prev IS NOT NULL → GROUP BY 对 + COUNT(*)</text>

    <rect x="36" y="310" width="282" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="177" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑥ 三键排序输出</text>
    <text x="177" y="338" text-anchor="middle" font-size="8.5" fill="#b85450">count DESC, first ASC, second ASC</text>

    <path d="M 177 81 L 177 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 177 135 L 177 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 177 189 L 177 200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 177 243 L 177 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 177 297 L 177 308" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- 右列示例注记 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#4a7a3a">
    <text x="340" y="64">示例：全表 19 行</text>
    <text x="340" y="118">名单 = {1, 2}</text>
    <text x="340" y="172">剩 11 行（用户 1、2）</text>
    <text x="340" y="218">每行补 prev_course</text>
    <text x="340" y="233" fill="#666">首行得 NULL，自动出局</text>
    <text x="340" y="287">9 个对 → 7 组计数</text>
  </g>

  <!-- 陷阱提示 -->
  <g filter="url(#rough2)">
    <rect x="336" y="310" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="416" y="324" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⚠️ 顺序不可颠倒</text>
    <text x="416" y="338" text-anchor="middle" font-size="8.5" fill="#b85450">先筛名单、再配对</text>
  </g>
</svg>
