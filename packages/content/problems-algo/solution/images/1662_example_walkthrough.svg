<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：true 与 false 对比</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">示例 1：word1 = ["ab", "c"],  word2 = ["a", "bc"]  →  true</text>

  <rect x="40" y="56" width="480" height="138" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="56" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="74">步</text>
    <text x="150" y="74">(i, ci)</text>
    <text x="240" y="74">word1[i][ci]</text>
    <text x="330" y="74">(j, cj)</text>
    <text x="420" y="74">word2[j][cj]</text>
    <text x="490" y="74">比对</text>
  </g>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="56" x2="100" y2="194"/>
    <line x1="200" y1="56" x2="200" y2="194"/>
    <line x1="280" y1="56" x2="280" y2="194"/>
    <line x1="380" y1="56" x2="380" y2="194"/>
    <line x1="460" y1="56" x2="460" y2="194"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="102">1</text>
    <text x="150" y="102">(0, 0)</text>
    <text x="240" y="102" font-weight="bold" fill="#446688">a</text>
    <text x="330" y="102">(0, 0)</text>
    <text x="420" y="102" font-weight="bold" fill="#4a7a3a">a</text>
    <text x="490" y="102" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="128">2</text>
    <text x="150" y="128">(0, 1)</text>
    <text x="240" y="128" font-weight="bold" fill="#446688">b</text>
    <text x="330" y="128">(1, 0)</text>
    <text x="420" y="128" font-weight="bold" fill="#4a7a3a">b</text>
    <text x="490" y="128" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="154">3</text>
    <text x="150" y="154">(1, 0)</text>
    <text x="240" y="154" font-weight="bold" fill="#446688">c</text>
    <text x="330" y="154">(1, 1)</text>
    <text x="420" y="154" font-weight="bold" fill="#4a7a3a">c</text>
    <text x="490" y="154" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="110" x2="520" y2="110"/>
    <line x1="40" y1="136" x2="520" y2="136"/>
    <line x1="40" y1="162" x2="520" y2="162"/>
  </g>
  <rect x="40" y="162" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i == 2 == n₁  且  j == 2 == n₂  →  两串同时耗尽  →  return true</text>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="218" font-size="11" fill="#b85450" font-weight="bold">示例 2：word1 = ["a", "cb"],  word2 = ["ab", "c"]  →  false</text>

  <rect x="40" y="226" width="480" height="112" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="226" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="244">步</text>
    <text x="150" y="244">(i, ci)</text>
    <text x="240" y="244">word1[i][ci]</text>
    <text x="330" y="244">(j, cj)</text>
    <text x="420" y="244">word2[j][cj]</text>
    <text x="490" y="244">比对</text>
  </g>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="226" x2="100" y2="338"/>
    <line x1="200" y1="226" x2="200" y2="338"/>
    <line x1="280" y1="226" x2="280" y2="338"/>
    <line x1="380" y1="226" x2="380" y2="338"/>
    <line x1="460" y1="226" x2="460" y2="338"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="272">1</text>
    <text x="150" y="272">(0, 0)</text>
    <text x="240" y="272" font-weight="bold" fill="#446688">a</text>
    <text x="330" y="272">(0, 0)</text>
    <text x="420" y="272" font-weight="bold" fill="#4a7a3a">a</text>
    <text x="490" y="272" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>
  <rect x="42" y="280" width="476" height="26" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="298">2</text>
    <text x="150" y="298">(1, 0)</text>
    <text x="240" y="298" font-weight="bold" fill="#b85450">c</text>
    <text x="330" y="298">(0, 1)</text>
    <text x="420" y="298" font-weight="bold" fill="#b85450">b</text>
    <text x="490" y="298" fill="#b85450" font-weight="bold">✗</text>
  </g>
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="280" x2="520" y2="280"/>
  </g>
  <rect x="40" y="306" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c₁ = 'c' ≠ c₂ = 'b'  →  立即返回 false</text>

  <!-- Bottom note -->
  <rect x="40" y="356" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="376" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="56" y="392" font-size="11" fill="#555">• 双指针不显式拼接，逐字符比对即可判定</text>
  <text x="56" y="406" font-size="11" fill="#555">• 示例 1：总长均为 3，三步后同步耗尽 → true</text>
  <text x="56" y="420" font-size="11" fill="#555">• 示例 2：第 2 步 'c' ≠ 'b'，立即返回 false，无需继续</text>
</svg>
