<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一侧 g(i) 递推，再平方得答案</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">g(0)=1, g(1)=2，递推 g(i)=g(i-1)+g(i-2)；ans = g(n)²</text>

  <!-- ===== g array ===== -->
  <g font-size="10" fill="#333">
    <text x="70" y="82" font-size="10" fill="#888" font-weight="bold">i:</text>
    <text x="110" y="82" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="170" y="82" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="230" y="82" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="290" y="82" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="350" y="82" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="410" y="82" text-anchor="middle" font-size="10" fill="#888">5</text>

    <!-- init cells -->
    <rect x="90" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="110" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <rect x="150" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="170" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

    <!-- derived -->
    <rect x="210" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="230" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="270" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="290" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="330" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="350" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="390" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="410" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">13</text>
  </g>

  <!-- addition hints -->
  <text x="200" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">1+2=3</text>
  <text x="260" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">2+3=5</text>
  <text x="320" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">3+5=8</text>
  <text x="380" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">5+8=13</text>

  <!-- ===== Legend ===== -->
  <rect x="70" y="176" width="420" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="86" y="183" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="104" y="193" font-size="9" fill="#555">初值 g(0),g(1)</text>
  <rect x="200" y="183" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="218" y="193" font-size="9" fill="#555">递推得到 g(i)=g(i-1)+g(i-2)</text>

  <!-- ===== Square table ===== -->
  <text x="70" y="230" font-size="11" fill="#b85450" font-weight="bold">平方得答案 ans = g(n)²：</text>
  <g font-size="10" fill="#333">
    <!-- header -->
    <rect x="90" y="238" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="120" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">n</text>
    <rect x="150" y="238" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="200" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">g(n) 一侧</text>
    <rect x="250" y="238" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="300" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">g(n)² ans</text>

    <!-- row 1 -->
    <rect x="90" y="264" width="60" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="120" y="280" text-anchor="middle" font-size="9" fill="#333">1</text>
    <rect x="150" y="264" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="200" y="280" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="250" y="264" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="300" y="280" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>

    <!-- row 2 -->
    <rect x="90" y="286" width="60" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="120" y="302" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="150" y="286" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="200" y="302" text-anchor="middle" font-size="9" fill="#333">3</text>
    <rect x="250" y="286" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="300" y="302" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">9</text>

    <!-- row 3 -->
    <rect x="90" y="308" width="60" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="120" y="324" text-anchor="middle" font-size="9" fill="#333">3</text>
    <rect x="150" y="308" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="200" y="324" text-anchor="middle" font-size="9" fill="#333">5</text>
    <rect x="250" y="308" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
    <text x="300" y="324" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">25</text>
  </g>
  <text x="380" y="292" font-size="10" fill="#446688">n=1 → 2²=4 ✓</text>
  <text x="380" y="308" font-size="10" fill="#446688">n=2 → 3²=9 ✓</text>
  <text x="380" y="324" font-size="10" fill="#446688">n=3 → 5²=25 ✓</text>
</svg>
