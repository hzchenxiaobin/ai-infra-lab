<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">并查集 + 前缀累加 算法流程</text>

  <!-- Step 1: init -->
  <rect x="160" y="50" width="220" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 初始化并查集</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">parent[i]=i, size[i]=1</text>
  <line x1="270" y1="98" x2="270" y2="120" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: union all edges -->
  <rect x="140" y="124" width="260" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 逐边合并 (u,v)</text>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">find 两端 → 小树挂大树 → size[新根]+=size[旧根]</text>
  <text x="270" y="177" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">路径压缩 + 按规模合并，均摊 O(α(n))</text>
  <line x1="270" y1="180" x2="270" y2="202" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: collect roots -->
  <rect x="140" y="206" width="260" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 收集各分量根及规模</text>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对每个 i 调 find(i)（触发压缩）</text>
  <text x="270" y="259" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">find(i)==i 的即为根，size[i] 即分量规模</text>
  <line x1="270" y1="262" x2="270" y2="284" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: prefix accumulate -->
  <rect x="120" y="288" width="300" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 前缀累加求跨分量点对数</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans += size[i] × seen；seen += size[i]</text>
  <text x="270" y="341" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">遍历各根，O(k) 一遍流式求和</text>
  <line x1="270" y1="344" x2="270" y2="366" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="210" y="370" width="120" height="24" rx="12" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- Side notes -->
  <text x="430" y="156" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m 条边</text>
  <text x="430" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">O(m·α)</text>
  <text x="430" y="238" font-size="11" fill="#d6a040" filter="url(#rough2)">n 个点</text>
  <text x="430" y="254" font-size="11" fill="#d6a040" filter="url(#rough2)">O(n·α)</text>
  <text x="30" y="320" font-size="11" fill="#b85450" filter="url(#rough2)">注意：</text>
  <text x="30" y="336" font-size="10" fill="#666" filter="url(#rough2)">ans, seen 须用</text>
  <text x="30" y="350" font-size="10" fill="#666" filter="url(#rough2)">long long (≥5×10⁹)</text>
</svg>
