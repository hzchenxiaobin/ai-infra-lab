<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2787a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
    <marker id="arr2787b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">把「不同正整数的 x 次幂之和」翻译成 0-1 背包计数</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">以 n = 10, x = 2 为例，m = ⌊√10⌋ = 3</text>

  <!-- Left: positive integers 1..m -->
  <text x="40" y="92" font-size="12" fill="#446688" font-weight="bold">正整数 i</text>
  <rect x="40" y="100" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="119" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="40" y="136" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="155" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="40" y="172" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="191" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="40" y="220" font-size="10" fill="#888">... 到 i^x &gt; n 止</text>

  <!-- arrow column -->
  <path d="M 96 114 L 150 114" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <path d="M 96 150 L 150 150" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <path d="M 96 186 L 150 186" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <text x="123" y="100" text-anchor="middle" font-size="9" fill="#888">i^x</text>

  <!-- Middle: item weights w = i^x -->
  <text x="200" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">物品重量 w</text>
  <rect x="160" y="100" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="119" text-anchor="middle" font-size="13" fill="#333">1²=1</text>
  <rect x="160" y="136" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="155" text-anchor="middle" font-size="13" fill="#333">2²=4</text>
  <rect x="160" y="172" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="191" text-anchor="middle" font-size="13" fill="#333">3²=9</text>

  <!-- arrow to knapsack -->
  <path d="M 246 114 L 312 150" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <path d="M 246 150 L 312 158" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <path d="M 246 186 L 312 166" stroke="#888" stroke-width="1.4" marker-end="url(#arr2787a)" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="9" fill="#888">选/不选</text>

  <!-- Right: knapsack target n -->
  <rect x="318" y="118" width="130" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="383" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">背包容量 = n</text>
  <text x="383" y="162" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">凑出 sum = 10</text>
  <text x="383" y="182" text-anchor="middle" font-size="10" fill="#888">每个物品最多选一次</text>

  <!-- candidate subsets -->
  <text x="470" y="110" font-size="11" fill="#888">候选子集：</text>
  <rect x="458" y="118" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="503" y="134" text-anchor="middle" font-size="10" fill="#333">{1,4,9} sum=14 ✗</text>
  <rect x="458" y="144" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="503" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">{1,9} sum=10 ✓</text>
  <rect x="458" y="170" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="503" y="186" text-anchor="middle" font-size="10" fill="#333">{4} sum=4 ✗</text>

  <!-- Explanation box -->
  <rect x="30" y="250" width="500" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心转化：互不相同 ⟺ 每个正整数最多用一次</text>
  <text x="50" y="298" font-size="11" fill="#666">① 物品集 = { i^x | i=1..m }，m = ⌊n^(1/x)⌋（i^x &gt; n 即停）</text>
  <text x="50" y="320" font-size="11" fill="#666">② 物品重量 = i^x，价值 = 方案数计数，容量 = n</text>
  <text x="50" y="342" font-size="11" fill="#666">③ 求「凑满容量 n」的子集数 → 经典 0-1 背包计数</text>
  <text x="50" y="364" font-size="11" fill="#4a7a3a" font-weight="bold">④ i^x 随 i 严格递增 → 不同 i 对应不同重量，天然无需去重</text>

  <!-- key arrow callout -->
  <path d="M 383 198 L 383 240" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr2787b)" filter="url(#rough2)"/>
</svg>
