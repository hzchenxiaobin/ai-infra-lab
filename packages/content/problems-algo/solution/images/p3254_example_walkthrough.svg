<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,4,3,2,5]，k = 3</text>

  <!-- 表头 -->
  <rect x="30" y="38" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="85" y="38" width="75" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <rect x="160" y="38" width="165" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i] = nums[i−1]+1 ?</text>
  <rect x="325" y="38" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <rect x="405" y="38" width="125" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">res[i−k+1]</text>

  <!-- 行 0 -->
  <rect x="30" y="64" width="500" height="27" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="82" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#rough2)">0</text>
  <text x="122" y="82" text-anchor="middle" font-size="10.5" fill="#556" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="242" y="82" text-anchor="middle" font-size="10" fill="#8899aa" filter="url(#rough2)">—（i = 0，自成一段）</text>
  <text x="365" y="82" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="467" y="82" text-anchor="middle" font-size="9.5" fill="#8899aa" filter="url(#rough2)">（i &lt; k−1，未就位）</text>

  <!-- 行 1 -->
  <rect x="30" y="91" width="500" height="27" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="109" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#rough2)">1</text>
  <text x="122" y="109" text-anchor="middle" font-size="10.5" fill="#556" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="242" y="109" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 2 = 1+1</text>
  <text x="365" y="109" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="467" y="109" text-anchor="middle" font-size="9.5" fill="#8899aa" filter="url(#rough2)">（i &lt; k−1，未就位）</text>

  <!-- 行 2：合法 -->
  <rect x="30" y="118" width="500" height="27" fill="#e6f4ea" stroke="#a8c8a0" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="136" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">2</text>
  <text x="122" y="136" text-anchor="middle" font-size="10.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="242" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 3 = 2+1</text>
  <text x="365" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="467" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 3：合法 -->
  <rect x="30" y="145" width="500" height="27" fill="#e6f4ea" stroke="#a8c8a0" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="163" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">3</text>
  <text x="122" y="163" text-anchor="middle" font-size="10.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="242" y="163" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 4 = 3+1</text>
  <text x="365" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="467" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行 4：断点 -->
  <rect x="30" y="172" width="500" height="27" fill="#fce4ec" stroke="#e0b0ba" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="190" text-anchor="middle" font-size="10.5" fill="#7a3a3e" filter="url(#rough2)">4</text>
  <text x="122" y="190" text-anchor="middle" font-size="10.5" fill="#7a3a3e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="242" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 3 ≠ 4+1（断点）</text>
  <text x="365" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="467" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 行 5：断点 -->
  <rect x="30" y="199" width="500" height="27" fill="#fce4ec" stroke="#e0b0ba" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="217" text-anchor="middle" font-size="10.5" fill="#7a3a3e" filter="url(#rough2)">5</text>
  <text x="122" y="217" text-anchor="middle" font-size="10.5" fill="#7a3a3e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="242" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 2 ≠ 3+1（断点）</text>
  <text x="365" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="467" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 行 6：断点 -->
  <rect x="30" y="226" width="500" height="27" fill="#fce4ec" stroke="#e0b0ba" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="244" text-anchor="middle" font-size="10.5" fill="#7a3a3e" filter="url(#rough2)">6</text>
  <text x="122" y="244" text-anchor="middle" font-size="10.5" fill="#7a3a3e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="242" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 5 ≠ 2+1（断点）</text>
  <text x="365" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="467" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 底部结论 -->
  <rect x="30" y="272" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">输出 res = [3, 4, −1, −1, −1]</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#7a5a18" filter="url(#rough2)">前两个窗口整段绿灯 → 取右端点；i = 4 断点把 cnt 打回 1，</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#7a5a18" filter="url(#rough2)">此后 cnt 再没养到 k = 3，后三个窗口维持预填的 −1</text>
</svg>
