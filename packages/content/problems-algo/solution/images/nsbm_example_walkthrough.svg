<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,1,4,3]，left = 2，right = 3</text>

  <!-- Header row -->
  <rect x="30" y="46" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="66" y="46" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="98" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <rect x="130" y="46" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lastInvalid</text>
  <rect x="216" y="46" width="82" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="257" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lastValid</text>
  <rect x="298" y="46" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="334" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">本轮计数</text>
  <rect x="370" y="46" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="400" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans 累计</text>
  <rect x="430" y="46" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="505" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法子数组(以 i 结尾)</text>

  <!-- Row 1: i=0, nums=2 (green/in-range) -->
  <rect x="30" y="78" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="98" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="66" y="78" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="130" y="78" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="98" text-anchor="middle" font-size="12" fill="#888">−1</text>
  <rect x="216" y="78" width="82" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="257" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="298" y="78" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="78" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="430" y="78" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="98" text-anchor="middle" font-size="12" fill="#446688">[2]</text>

  <!-- Row 2: i=1, nums=1 (yellow/neutral < left) -->
  <rect x="30" y="110" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="130" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="66" y="110" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="110" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="130" text-anchor="middle" font-size="12" fill="#888">−1</text>
  <rect x="216" y="110" width="82" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="257" y="130" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="298" y="110" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="110" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="430" y="110" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="130" text-anchor="middle" font-size="12" fill="#446688">[2,1]</text>

  <!-- Row 3: i=2, nums=4 (red/wall > right) -->
  <rect x="30" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="162" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="66" y="142" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="162" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="130" y="142" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="216" y="142" width="82" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="257" y="162" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="298" y="142" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="370" y="142" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="162" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="430" y="142" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="162" text-anchor="middle" font-size="12" fill="#888">—（含 4，超界）</text>

  <!-- Row 4: i=3, nums=3 (green/in-range) -->
  <rect x="30" y="174" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="194" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="66" y="174" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="130" y="174" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="194" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="216" y="174" width="82" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="257" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="298" y="174" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="174" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="430" y="174" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="194" text-anchor="middle" font-size="12" fill="#446688">[3]</text>

  <!-- summary callout -->
  <rect x="80" y="222" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="244" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终 ans = 1 + 1 + 0 + 1 = 3</text>
  <text x="300" y="264" text-anchor="middle" font-size="11" fill="#666">本轮计数 = max(0, lastValid − lastInvalid)，遇「墙」则 lastInvalid 跃迁，计数归 0</text>
</svg>
