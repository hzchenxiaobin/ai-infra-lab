<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">枚举字符对 (x, y) 的判定流程</text>

  <!-- Start: 预处理 -->
  <rect x="170" y="44" width="220" height="40" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">建 cnt1/cnt2，算 d1/d2</text>
  <path d="M 280 84 L 280 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="150" y="100" width="260" height="40" rx="6" fill="#f0f4f8" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">for x in word1, y in word2（cnt&gt;0）</text>
  <path d="M 280 140 L 280 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: x == y ? -->
  <polygon points="280,158 376,206 280,254 184,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">x == y ?</text>

  <!-- Yes branch (left): 空操作 -->
  <path d="M 184 206 L 120 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <!-- Decision 1b: d1 == d2 ? -->
  <polygon points="120,180 170,206 120,232 70,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">d1==d2?</text>
  <path d="M 120 180 L 120 168 L 60 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="92" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="150" width="86" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="57" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a22" filter="url(#rough2)">return</text>
  <text x="57" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a22" filter="url(#rough2)">true</text>
  <!-- no: continue -->
  <path d="M 70 206 L 50 206 L 50 282 L 280 282" stroke="#9aa8b4" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="92" y="230" text-anchor="middle" font-size="11" fill="#9aa8b4" filter="url(#rough2)">否</text>
  <text x="60" y="278" font-size="10" fill="#9aa8b4" filter="url(#rough2)">继续下对</text>

  <!-- No branch (right): 算增量 -->
  <path d="M 376 206 L 440 206" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="186" width="130" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="481" y="211" text-anchor="middle" font-size="11" fill="#7a2230" filter="url(#rough2)">算 nd1, nd2 增量</text>
  <path d="M 481 226 L 481 250 L 280 250 L 280 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: nd1 == nd2 ? -->
  <polygon points="280,268 376,316 280,364 184,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">nd1 == nd2 ?</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">(交换后不同数)</text>

  <!-- Yes -> return true (left) -->
  <path d="M 184 316 L 110 316" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="22" y="294" width="88" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a22" filter="url(#rough2)">return</text>
  <text x="66" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a22" filter="url(#rough2)">true</text>

  <!-- No -> continue (right) loops back -->
  <path d="M 376 316 L 450 316" stroke="#9aa8b4" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="310" text-anchor="middle" font-size="12" fill="#9aa8b4" filter="url(#rough2)">否</text>
  <path d="M 450 316 L 470 316 L 470 120 L 410 120" stroke="#9aa8b4" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="220" font-size="10" fill="#9aa8b4" filter="url(#rough2)">下一对</text>

  <!-- loop exhausted -> return false -->
  <path d="M 280 100 L 280 88 L 540 88 L 540 400 L 280 400" stroke="#9aa8b4" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="420" y="82" font-size="10" fill="#9aa8b4" filter="url(#rough2)">枚举完</text>
  <rect x="220" y="384" width="120" height="40" rx="6" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#445" filter="url(#rough2)">return false</text>
  <path d="M 280 400 L 280 384" stroke="#9aa8b4" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- side note -->
  <rect x="150" y="424" width="360" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="442" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">x==y 为空操作：失即得，频次不动，仅判本就 d1==d2</text>
</svg>
