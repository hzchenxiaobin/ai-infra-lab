<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 流程：每个节点检查孩子数，恰好一个则收集</text>

  <!-- 开始：dfs(node) 圆角矩形 -->
  <rect x="210" y="42" width="100" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">dfs(node)</text>

  <!-- 箭头 ↓ -->
  <path d="M 260 76 L 260 88" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：node == null? 菱形 -->
  <polygon points="260,92 330,112 260,132 190,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#333">node == null?</text>

  <!-- 是 → return -->
  <path d="M 330 112 L 372 112" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="106" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="374" y="98" width="72" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="116" text-anchor="middle" font-size="11" fill="#333">return</text>

  <!-- 否 ↓ -->
  <path d="M 260 132 L 260 148" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 判定2：left≠null 且 right==null? 菱形 -->
  <polygon points="260,152 360,174 260,196 160,174" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#333">left≠null 且 right==null?</text>

  <!-- 是 → 收集 left.val -->
  <path d="M 360 174 L 372 174" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="168" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="374" y="160" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="178" text-anchor="middle" font-size="11" fill="#333">收集 left.val</text>

  <!-- 否 ↓ -->
  <path d="M 260 196 L 260 212" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="208" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- 判定3：left==null 且 right≠null? 菱形 -->
  <polygon points="260,216 360,238 260,260 160,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#333">left==null 且 right≠null?</text>

  <!-- 是 → 收集 right.val -->
  <path d="M 360 238 L 372 238" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="374" y="224" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="242" text-anchor="middle" font-size="11" fill="#333">收集 right.val</text>

  <!-- 否 ↓（无孩子/双孩子 → 不收集）-->
  <path d="M 260 260 L 260 282" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="276" font-size="10" fill="#888" font-weight="bold">否</text>
  <text x="282" y="276" font-size="9" fill="#888">（无/双孩子）</text>

  <!-- 收集分支汇合：从 收集left/right 框向下汇合到主流程 -->
  <path d="M 429 188 L 429 296 L 264 296" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 252 L 429 296" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- 递归处理框 -->
  <rect x="150" y="296" width="220" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333">dfs(node.left) ; dfs(node.right)</text>

  <!-- 箭头 ↓ -->
  <path d="M 260 330 L 260 348" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="210" y="350" width="100" height="30" rx="15" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#555">继续遍历 / 完成</text>

  <!-- 说明小字 -->
  <text x="54" y="412" font-size="10" fill="#888">步骤 2、3 互斥（if-else if）：一个节点不可能同时"只左"和"只右"</text>
</svg>
