<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：质因子是连接数字的「桥」</text>

  <!-- nums row label -->
  <text x="26" y="78" font-size="11" fill="#888">nums：</text>
  <!-- number circles -->
  <circle cx="80" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <circle cx="170" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <circle cx="260" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <circle cx="350" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="450" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>

  <!-- edges from numbers to their prime factors -->
  <line x1="80" y1="96" x2="120" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="96" x2="420" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="170" y1="96" x2="420" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="260" y1="96" x2="270" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="350" y1="96" x2="270" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="450" y1="96" x2="270" y2="230" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="450" y1="96" x2="420" y2="230" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- prime factor bridge label -->
  <text x="26" y="248" font-size="11" fill="#888">质因子桥：</text>
  <!-- prime nodes (hubs) -->
  <rect x="104" y="230" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="122" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="252" y="230" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="402" y="230" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- component bubble -->
  <rect x="50" y="120" width="470" height="160" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="14" filter="url(#rough2)"/>
  <text x="285" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">同一连通分量（可互相交换）</text>

  <!-- key idea box -->
  <rect x="40" y="300" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gcd(a, b) &gt; 1  ⟺  a, b 共享至少一个质因子</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#555">把每个数与它的所有质因子 union，质因子充当「中转站」</text>

  <rect x="40" y="354" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">同分量内可任意重排 → 逐位比对原值与排序值是否同根</text>
</svg>
