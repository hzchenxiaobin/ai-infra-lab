<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [−1,3,5,1,4,2,−9], target = 6</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="35" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <text x="77" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">元素</text>
  <text x="117" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum</text>
  <text x="165" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum−6</text>
  <text x="215" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">∈seen?</text>
  <text x="305" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">操作</text>
  <text x="387" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans</text>
  <text x="475" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">seen</text>

  <!-- Row 0: init -->
  <rect x="10" y="66" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="84" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="77" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="117" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="165" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="215" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="305" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="387" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="475" y="84" text-anchor="middle" font-size="10" fill="#333">{0}</text>

  <!-- Row 1: i=0, num=-1 -->
  <rect x="10" y="96" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="114" text-anchor="middle" font-size="10.5" fill="#888">i=0</text>
  <text x="77" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−1</text>
  <text x="117" y="114" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="165" y="114" text-anchor="middle" font-size="11" fill="#333">−7</text>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="305" y="114" text-anchor="middle" font-size="10" fill="#555">seen.add(−1)</text>
  <text x="387" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="475" y="114" text-anchor="middle" font-size="9.5" fill="#333">{0,−1}</text>

  <!-- Row 2: i=1, num=3 -->
  <rect x="10" y="126" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="144" text-anchor="middle" font-size="10.5" fill="#888">i=1</text>
  <text x="77" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="117" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="165" y="144" text-anchor="middle" font-size="11" fill="#333">−4</text>
  <text x="215" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="305" y="144" text-anchor="middle" font-size="10" fill="#555">seen.add(2)</text>
  <text x="387" y="144" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="475" y="144" text-anchor="middle" font-size="9.5" fill="#333">{0,−1,2}</text>

  <!-- Row 3: i=2, num=5 -->
  <rect x="10" y="156" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="174" text-anchor="middle" font-size="10.5" fill="#888">i=2</text>
  <text x="77" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <text x="117" y="174" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="165" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="215" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="305" y="174" text-anchor="middle" font-size="10" fill="#555">seen.add(7)</text>
  <text x="387" y="174" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="475" y="174" text-anchor="middle" font-size="9" fill="#333">{0,−1,2,7}</text>

  <!-- Row 4: i=3, num=1, MATCH! -->
  <rect x="10" y="186" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="204" text-anchor="middle" font-size="10.5" fill="#888">i=3 ★</text>
  <text x="77" y="204" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="117" y="204" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="165" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="215" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ←</text>
  <text x="305" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">ans++, reset={8}</text>
  <text x="387" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="475" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">{8}</text>

  <!-- Row 5: i=4, num=4 -->
  <rect x="10" y="216" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="234" text-anchor="middle" font-size="10.5" fill="#888">i=4</text>
  <text x="77" y="234" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="117" y="234" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="165" y="234" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="215" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="305" y="234" text-anchor="middle" font-size="10" fill="#555">seen.add(12)</text>
  <text x="387" y="234" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="475" y="234" text-anchor="middle" font-size="9.5" fill="#333">{8,12}</text>

  <!-- Row 6: i=5, num=2, MATCH! -->
  <rect x="10" y="246" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="264" text-anchor="middle" font-size="10.5" fill="#888">i=5 ★</text>
  <text x="77" y="264" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="117" y="264" text-anchor="middle" font-size="11" fill="#333">14</text>
  <text x="165" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="215" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ←</text>
  <text x="305" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">ans++, reset={14}</text>
  <text x="387" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="475" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">{14}</text>

  <!-- Row 7: i=6, num=-9 -->
  <rect x="10" y="276" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="294" text-anchor="middle" font-size="10.5" fill="#888">i=6</text>
  <text x="77" y="294" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−9</text>
  <text x="117" y="294" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="165" y="294" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="215" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="305" y="294" text-anchor="middle" font-size="10" fill="#555">seen.add(5)</text>
  <text x="387" y="294" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="475" y="294" text-anchor="middle" font-size="9.5" fill="#333">{14,5}</text>

  <!-- Explanation box 1 -->
  <rect x="10" y="316" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 命中时：选取该子数组</text>
  <text x="140" y="352" text-anchor="middle" font-size="10" fill="#555">ans++, 清空 seen, 仅放入当前 sum</text>
  <text x="140" y="366" text-anchor="middle" font-size="10" fill="#555">→ 保证下一个子数组不重叠</text>

  <!-- Explanation box 2 -->
  <rect x="290" y="316" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">未命中时：继续累积</text>
  <text x="420" y="352" text-anchor="middle" font-size="10" fill="#555">seen.add(sum)</text>
  <text x="420" y="366" text-anchor="middle" font-size="10" fill="#555">→ 为后续查找保留前缀和</text>

  <!-- Summary box -->
  <rect x="10" y="382" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">最终 ans = 2   （选取 [5,1] 和 [4,2]，[3,5,1,4,2,−9] 因重叠丢弃）</text>
</svg>
