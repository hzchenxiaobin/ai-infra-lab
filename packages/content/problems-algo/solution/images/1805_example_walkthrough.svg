<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "a123bc34d8ef34" 的分块提取过程</text>

  <!-- String display: a 1 2 3 b c 3 4 d 8 e f 3 4 (14 chars, 36px cells, start x=28) -->
  <g font-size="14" text-anchor="middle">
    <!-- a: gray -->
    <rect x="28" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="46" y="68" fill="#888" filter="url(#rough2)">a</text>
    <!-- 1 2 3: block 1 orange -->
    <rect x="66" y="46" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="84" y="68" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="104" y="46" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="122" y="68" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="142" y="46" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="160" y="68" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
    <!-- b c: gray -->
    <rect x="180" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="198" y="68" fill="#888" filter="url(#rough2)">b</text>
    <rect x="218" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="236" y="68" fill="#888" filter="url(#rough2)">c</text>
    <!-- 3 4: block 2 green -->
    <rect x="256" y="46" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="274" y="68" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="294" y="46" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="312" y="68" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <!-- d: gray -->
    <rect x="332" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="350" y="68" fill="#888" filter="url(#rough2)">d</text>
    <!-- 8: block 3 blue -->
    <rect x="370" y="46" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="388" y="68" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
    <!-- e f: gray -->
    <rect x="408" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="426" y="68" fill="#888" filter="url(#rough2)">e</text>
    <rect x="446" y="46" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="464" y="68" fill="#888" filter="url(#rough2)">f</text>
    <!-- 3 4: block 4 red -->
    <rect x="484" y="46" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="502" y="68" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="522" y="46" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="540" y="68" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- block labels -->
  <text x="120" y="92" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">块1</text>
  <text x="294" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">块2</text>
  <text x="388" y="92" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">块3</text>
  <text x="522" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">块4</text>

  <!-- Column headers -->
  <path d="M 20 108 L 540 108" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="124" font-size="10" fill="#888" filter="url(#rough2)">步骤</text>
  <text x="120" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原始块</text>
  <text x="230" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">去前导零</text>
  <text x="340" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">操作</text>
  <text x="470" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">seen 集合</text>

  <!-- Step 1: block "123" -->
  <text x="40" y="148" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">①</text>
  <rect x="96" y="136" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">"123"</text>
  <path d="M 148 149 L 186 149" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="136" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"123"</text>
  <text x="340" y="154" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">add("123")</text>
  <rect x="416" y="136" width="108" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">{"123"}</text>

  <!-- Step 2: block "34" -->
  <text x="40" y="186" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">②</text>
  <rect x="100" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"34"</text>
  <path d="M 142 187 L 186 187" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"34"</text>
  <text x="340" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">add("34")</text>
  <rect x="400" y="174" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="192" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">{"123", "34"}</text>

  <!-- Step 3: block "8" -->
  <text x="40" y="224" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">③</text>
  <rect x="108" y="212" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">"8"</text>
  <path d="M 134 225 L 186 225" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="198" y="212" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"8"</text>
  <text x="340" y="230" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">add("8")</text>
  <rect x="390" y="212" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">{"123", "34", "8"}</text>

  <!-- Step 4: block "34" (duplicate) -->
  <text x="40" y="262" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">④</text>
  <rect x="100" y="250" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">"34"</text>
  <path d="M 142 263 L 186 263" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="250" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"34"</text>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">已存在，跳过</text>
  <rect x="390" y="250" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="268" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不变</text>

  <!-- Conclusion -->
  <path d="M 20 294 L 540 294" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="120" y="308" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 个数字块 → 去前导零 → 哈希去重</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">seen = {"123", "34", "8"}（块4 "34" 重复，被去重）</text>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">不同整数数目 = |seen| = 3</text>

  <!-- Footer -->
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">四色块对应四个数字段；块4 与块2 归一化后相同，哈希集合自动去重</text>
</svg>
