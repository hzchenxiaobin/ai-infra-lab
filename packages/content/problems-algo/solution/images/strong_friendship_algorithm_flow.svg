<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CTE 双向展开 + 自连接求交集</text>

  <!-- Input -->
  <rect x="30" y="46" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：Friendship(user1_id, user2_id)</text>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#888">主键 (user1_id, user2_id)，且 user1_id &lt; user2_id（有向存储）</text>

  <path d="M 270 92 L 270 116" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: UNION ALL -->
  <rect x="30" y="120" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="12" fill="#4a7a3a" font-weight="bold">① CTE friend：UNION ALL 展开为无向图</text>
  <text x="40" y="158" font-size="11" fill="#333">SELECT user1_id AS u, user2_id AS v FROM Friendship</text>
  <text x="40" y="174" font-size="11" fill="#333">UNION ALL SELECT user2_id, user1_id FROM Friendship;</text>
  <text x="438" y="158" font-size="10.5" fill="#888">→ 每条关系</text>
  <text x="438" y="172" font-size="10.5" fill="#888">双向各一行</text>

  <path d="M 270 186 L 270 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: self join -->
  <rect x="30" y="214" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="234" font-size="12" fill="#d6a040" font-weight="bold">② 自连接求共同好友</text>
  <text x="40" y="252" font-size="11" fill="#333">FROM Friendship f</text>
  <text x="40" y="268" font-size="11" fill="#333">JOIN friend fa ON fa.u = f.user1_id          — user1 的每个好友 fa.v</text>
  <text x="40" y="284" font-size="11" fill="#333">JOIN friend fb ON fb.u = f.user2_id AND fb.v = fa.v   — fa.v 也是 user2 的好友</text>
  <text x="40" y="300" font-size="10.5" fill="#b85450" font-weight="bold">→ 保留的 fa.v 即 friends(user1) ∩ friends(user2)</text>

  <path d="M 270 296 L 270 320" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: group + having -->
  <rect x="30" y="324" width="480" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="12" fill="#b85450" font-weight="bold">③ GROUP BY + HAVING 计数筛阈值</text>
  <text x="40" y="362" font-size="11" fill="#333">GROUP BY f.user1_id, f.user2_id</text>
  <text x="40" y="378" font-size="11" fill="#333">HAVING COUNT(*) &gt;= 3   — 共同好友数 ≥ 3 即坚定</text>

  <path d="M 270 390 L 270 414" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="90" y="418" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="441" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">输出 (user1_id, user2_id, common_friend)</text>
</svg>
