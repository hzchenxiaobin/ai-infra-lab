<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：96 个集合逐个求「&gt; n 的最小回文」，再取全局最小</text>

  <!-- 枚举 -->
  <rect x="160" y="36" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">枚举集合 (E, c)，算位数 L = Σ数字</text>

  <!-- 菱形：L < len(n) -->
  <polygon points="260,110 330,140 260,170 190,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">L &lt; len(n) ？</text>
  <text x="260" y="150" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">位数不够必然 ≤ n</text>
  <path d="M 260 68 L 260 104" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 330 140 L 424 140" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="377" y="132" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="428" y="124" width="78" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃</text>

  <path d="M 260 170 L 260 192" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="186" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 菱形：L > len(n) -->
  <polygon points="260,196 330,226 260,256 190,226" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">L &gt; len(n) ？</text>
  <text x="260" y="236" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">位数多必然 &gt; n</text>

  <path d="M 190 226 L 108 226" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="18" y="204" width="88" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Q 升序拼出</text>
  <text x="62" y="237" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">最小回文 ✓</text>

  <path d="M 260 256 L 260 274" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="268" font-size="10" fill="#666" filter="url(#rough2)">否（L = len(n)）</text>

  <!-- L == len(n) 贪心 -->
  <rect x="88" y="278" width="344" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">「贴齐 - 抬高」贪心（s = str(n)，h = L/2）：</text>
  <text x="260" y="312" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">① Q 全贴 s[:h] 且 c = s[h] → 整串比较 x &gt; s 才收；② c &gt; s[h] → 必大，直接收；</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">③ 自由位 i = h-1 → 0：贴齐 s[:i]，i 处放「&gt; s[i] 的最小剩余」，其余升序（越晚抬高越小）</text>

  <path d="M 62 248 L 62 300 L 84 300" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 汇聚取最小 -->
  <path d="M 432 300 L 462 300 L 462 336" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 462 336 L 344 336" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="176" y="324" width="164" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="341" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">候选按（位数，字典序）取最小</text>
</svg>
