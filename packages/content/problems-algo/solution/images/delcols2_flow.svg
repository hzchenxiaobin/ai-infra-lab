<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐列贪心，维护 decided 数组</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11" fill="#333">开始: ans=0, decided=[False]*(n−1)</text>

  <path d="M 270 78 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init j -->
  <rect x="210" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j = 0</text>

  <path d="M 270 134 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: j < m? -->
  <polygon points="270,158 386,196 270,234 154,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">j &lt; m ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#666">(还有列未处理)</text>

  <!-- No -> end -->
  <path d="M 386 196 L 430 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="472" cy="196" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="200" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes -> down -->
  <path d="M 270 234 L 270 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="252" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: check violation -->
  <polygon points="270,262 440,310 270,358 100,310" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#333">未定序行对中存在</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#333">strs[i][j] &gt; strs[i+1][j] ?</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#666">(遍历 decided[i]==False 的 i)</text>

  <!-- Yes (violation) -> ans++, j++ (right loop back) -->
  <path d="M 440 310 L 478 310 L 478 117 L 330 117" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 482 214)">ans++, j++</text>
  <text x="452" y="302" text-anchor="middle" font-size="10" fill="#b85450">是</text>

  <!-- No -> down -->
  <path d="M 270 358 L 270 382" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="376" font-size="11" fill="#82b366">否</text>

  <!-- Update decided -->
  <rect x="120" y="384" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新 decided：遍历未定序行对 i</text>
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a">若 strs[i][j] &lt; strs[i+1][j] → decided[i] = True</text>

  <!-- j++ loop back -->
  <path d="M 270 434 L 270 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="458" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="476" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j++</text>

  <path d="M 230 472 L 80 472 L 80 117 L 210 117" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="506" text-anchor="middle" font-size="11" fill="#888">每列扫描 n−1 行对，共 m 列 → O(n·m)；decided 数组 → O(n) 空间</text>
</svg>
