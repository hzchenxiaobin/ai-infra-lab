<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保留无行程用户，IFNULL 把 NULL 转 0</text>

  <!-- ============ Users table (left) ============ -->
  <text x="80" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Users（左表）</text>
  <rect x="22" y="68" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="85" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="92" y="85" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">name</text>

  <rect x="22" y="96" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="111" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="92" y="111" text-anchor="middle" font-size="9.5" fill="#333">Alice</text>

  <rect x="22" y="120" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="135" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="92" y="135" text-anchor="middle" font-size="9.5" fill="#333">Bob</text>

  <rect x="22" y="144" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="159" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <text x="92" y="159" text-anchor="middle" font-size="9.5" fill="#333">Alex</text>

  <!-- Donald highlighted (no rides) -->
  <rect x="22" y="168" width="116" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="183" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <text x="92" y="183" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Donald</text>

  <rect x="22" y="192" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="207" text-anchor="middle" font-size="9.5" fill="#333">7</text>
  <text x="92" y="207" text-anchor="middle" font-size="9.5" fill="#333">Lee</text>

  <rect x="22" y="216" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="231" text-anchor="middle" font-size="9.5" fill="#333">13</text>
  <text x="92" y="231" text-anchor="middle" font-size="9.5" fill="#333">Jonathan</text>

  <rect x="22" y="240" width="116" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="255" text-anchor="middle" font-size="9.5" fill="#333">19</text>
  <text x="92" y="255" text-anchor="middle" font-size="9.5" fill="#333">Elvis</text>

  <!-- ============ Rides table (right) ============ -->
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Rides（右表）</text>
  <rect x="300" y="68" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">user_id</text>
  <text x="395" y="85" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">distance</text>

  <rect x="300" y="96" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="395" y="110" text-anchor="middle" font-size="9" fill="#333">120</text>

  <rect x="300" y="116" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="130" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="395" y="130" text-anchor="middle" font-size="9" fill="#333">317</text>

  <rect x="300" y="136" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="395" y="150" text-anchor="middle" font-size="9" fill="#333">222</text>

  <rect x="300" y="156" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="395" y="170" text-anchor="middle" font-size="9" fill="#333">100</text>

  <rect x="300" y="176" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="9" fill="#333">13</text>
  <text x="395" y="190" text-anchor="middle" font-size="9" fill="#333">312</text>

  <rect x="300" y="196" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="9" fill="#333">19</text>
  <text x="395" y="210" text-anchor="middle" font-size="9" fill="#333">50</text>

  <rect x="300" y="216" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="230" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="395" y="230" text-anchor="middle" font-size="9" fill="#333">120</text>

  <rect x="300" y="236" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="250" text-anchor="middle" font-size="9" fill="#333">19</text>
  <text x="395" y="250" text-anchor="middle" font-size="9" fill="#333">400</text>

  <rect x="300" y="256" width="180" height="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="395" y="270" text-anchor="middle" font-size="9" fill="#333">230</text>

  <!-- ============ LEFT JOIN arrow ============ -->
  <text x="220" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">LEFT JOIN</text>
  <text x="220" y="72" text-anchor="middle" font-size="8.5" fill="#888">ON u.id = r.user_id</text>
  <path d="M150,160 Q220,160 290,160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Donald no match indicator -->
  <path d="M150,180 Q220,200 220,300" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="288" font-size="9" fill="#b85450" font-weight="bold">无匹配</text>
  <text x="232" y="300" font-size="9" fill="#b85450">r.* = NULL</text>

  <!-- ============ After JOIN result (bottom) ============ -->
  <rect x="20" y="320" width="540" height="108" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="320" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY u.id, u.name  →  IFNULL(SUM(r.distance), 0)</text>

  <text x="40" y="362" font-size="9.5" fill="#333">Alice (1):</text>
  <text x="120" y="362" font-size="9.5" fill="#4a7a3a">SUM(120) = 120</text>
  <text x="40" y="378" font-size="9.5" fill="#333">Lee (7):</text>
  <text x="120" y="378" font-size="9.5" fill="#4a7a3a">SUM(100,120,230) = 450</text>
  <text x="40" y="394" font-size="9.5" fill="#333">Elvis (19):</text>
  <text x="120" y="394" font-size="9.5" fill="#4a7a3a">SUM(50,400) = 450</text>

  <!-- Donald NULL -> 0 -->
  <text x="310" y="362" font-size="9.5" fill="#b85450" font-weight="bold">Donald (4):</text>
  <text x="392" y="362" font-size="9.5" fill="#b85450">SUM(空集) = NULL</text>
  <text x="310" y="380" font-size="9.5" fill="#b85450" font-weight="bold">IFNULL(NULL, 0)</text>
  <path d="M408,384 L408,396" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="310" y="408" font-size="10" fill="#b85450" font-weight="bold">= 0  ✓</text>

  <text x="392" y="394" font-size="8.5" fill="#888">SUM 对空集</text>
  <text x="392" y="406" font-size="8.5" fill="#888">返回 NULL</text>

  <text x="20" y="432" font-size="9" fill="#888">关键：LEFT JOIN 保住 Donald（左表全保留）→ 但他那一组 SUM 得 NULL → IFNULL 兜底为 0。INNER JOIN 会直接丢掉 Donald。</text>
</svg>
