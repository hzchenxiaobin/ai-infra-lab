<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">核心观察：打怪前强度 = max(0, S − P_i)；bonus 用差分数组一趟求出</text>

  <!-- Panel A: 差分求 bonus -->
  <text x="36" y="44" text-anchor="start" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 差分数组一趟求出 bonus</text>

  <path d="M 200 34 L 200 40 L 260 40 L 260 34" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="30" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">加成 [1,1] v=10</text>

  <text x="150" y="52" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="230" y="52" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="310" y="52" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">i=2</text>

  <rect x="120" y="56" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="56" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="56" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="75" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m=5</text>
  <text x="230" y="75" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m=10</text>
  <text x="310" y="75" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m=15</text>
  <text x="112" y="75" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">怪力</text>

  <rect x="120" y="94" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="94" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="94" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="113" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">b=0</text>
  <text x="230" y="113" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">b=10</text>
  <text x="310" y="113" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">b=0</text>
  <text x="112" y="113" text-anchor="end" font-size="9" fill="#2f5527" filter="url(#rough2)">加成</text>

  <rect x="356" y="56" width="148" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#446688" filter="url(#rough2)">差分建表 O(n+m)</text>
  <text x="430" y="86" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">diff[l] += v</text>
  <text x="430" y="99" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">diff[r+1] −= v</text>
  <text x="430" y="112" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">前缀和还原出 bonus</text>

  <text x="36" y="142" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">示例 1：monsters=[5,10,15]，boosts=[[1,1,10]]（区间 [l,r] 按下标，重叠相加）</text>

  <!-- Panel B: 强度轨迹 -->
  <text x="36" y="166" text-anchor="start" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">② 强度轨迹（S=30）：打怪 i 前强度 = max(0, S − P_i)</text>
  <text x="36" y="180" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">P_i = 前 i 只怪力之和；强度减到负数会被钳为 0 —— 钳位让强度与路径无关</text>

  <line x1="66" y1="192" x2="66" y2="330" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="66" y1="330" x2="350" y2="330" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="196" text-anchor="end" font-size="9" fill="#666" filter="url(#rough2)">强度</text>
  <text x="58" y="333" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <line x1="66" y1="210" x2="330" y2="210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="58" y="213" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">30</text>

  <polyline points="110,210 180,230 250,270 320,330" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="110" cy="210" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="180" cy="230" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="250" cy="270" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="320" cy="330" r="3.5" fill="#446688" filter="url(#rough2)"/>

  <text x="110" y="199" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">30</text>
  <text x="180" y="219" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">25</text>
  <text x="250" y="259" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">15</text>
  <text x="334" y="326" text-anchor="start" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>

  <text x="148" y="233" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">−5</text>
  <text x="218" y="263" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">−10</text>
  <text x="288" y="313" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">−15</text>

  <text x="110" y="344" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">打 m₀ 前</text>
  <text x="180" y="344" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">打 m₁ 前</text>
  <text x="250" y="344" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">打 m₂ 前</text>
  <text x="320" y="344" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">结束</text>

  <text x="188" y="357" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">强度减到负数会被钳为 0 —— 打怪 i 前强度恒为 max(0, S − P_i)</text>

  <rect x="364" y="188" width="142" height="116" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="206" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">逐怪下界（仅 b_i &lt; m_i 时）</text>
  <text x="435" y="224" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">i=0：S ≥ 0+5−0 = 5</text>
  <text x="435" y="240" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">i=1：b₁ ≥ m₁，免检</text>
  <text x="435" y="256" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">i=2：S ≥ 15+15−0 = 30</text>
  <line x1="376" y1="266" x2="494" y2="266" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="435" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = max(0, 5, 30)</text>
  <text x="435" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 30 ★</text>
</svg>
