<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：合法方案 ⇔ 网格上一条「阶梯链」（行、列都严格递增）</text>

  <!-- 轴标签 -->
  <text x="88" y="46" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1 ↓</text>
  <text x="296" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2 的下标 j →</text>

  <!-- 列头 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#33506b" text-anchor="middle">
    <text x="198" y="66">j=0（4）</text>
    <text x="296" y="66">j=1（5）</text>
    <text x="394" y="66">j=2（1）</text>
  </g>
  <!-- 行头 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#33506b" text-anchor="end">
    <text x="146" y="114">i=0（1）</text>
    <text x="146" y="176">i=1（3）</text>
    <text x="146" y="238">i=2（2）</text>
  </g>

  <!-- 未选中格子 -->
  <g filter="url(#rough2)">
    <rect x="152" y="86" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="250" y="86" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="348" y="86" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="250" y="148" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="348" y="148" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="152" y="210" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="348" y="210" width="92" height="56" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#999" text-anchor="middle">
    <text x="198" y="118">4</text>
    <text x="296" y="118">5</text>
    <text x="394" y="118">1</text>
    <text x="296" y="180">15</text>
    <text x="394" y="180">3</text>
    <text x="198" y="242">8</text>
    <text x="394" y="242">2</text>
  </g>

  <!-- 选中格子 -->
  <g filter="url(#rough2)">
    <rect x="152" y="148" width="92" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="250" y="210" width="92" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2f5d24" font-weight="bold" text-anchor="middle">
    <text x="198" y="182">12</text>
    <text x="296" y="244">10</text>
  </g>

  <!-- 阶梯箭头 -->
  <path d="M 224 186 C 244 198, 256 206, 272 218" stroke="#d6a040" stroke-width="2.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧摘要 -->
  <g filter="url(#rough2)">
    <text x="452" y="98" font-size="11.5" fill="#444" font-weight="bold">选中 k=2 个格子</text>
    <text x="452" y="122" font-size="10.5" fill="#2f5d24" font-weight="bold">① (i=1, j=0)</text>
    <text x="452" y="137" font-size="10.5" fill="#2f5d24">3 × 4 = 12</text>
    <text x="452" y="161" font-size="10.5" fill="#2f5d24" font-weight="bold">② (i=2, j=1)</text>
    <text x="452" y="176" font-size="10.5" fill="#2f5d24">2 × 5 = 10</text>
    <text x="452" y="202" font-size="10.5" fill="#a07020" font-weight="bold">行号 1 → 2 ↗</text>
    <text x="452" y="218" font-size="10.5" fill="#a07020" font-weight="bold">列号 0 → 1 ↗</text>
    <rect x="448" y="230" width="106" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="501" y="250" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">总分 = 22</text>
    <text x="501" y="267" text-anchor="middle" font-size="10" fill="#2f5d24">12 + 10</text>
  </g>

  <!-- 底部解释框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="284" width="520" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">i、j 都严格递增 ⇒ 同一行、同一列至多选一格，k 个格子连成 ↗ 阶梯</text>
    <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#33506b">这正是 LCS 的「匹配链」结构：dp[i][j][t] = 前 i 个 × 前 j 个、恰好 t 对的最大得分</text>
    <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">dp[i][j][t] = max(跳过 nums1[i−1]，跳过 nums2[j−1]，dp[i−1][j−1][t−1] + 乘积)</text>
  </g>
</svg>
