<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同期群 Day1 留存：按 install_date 分组 + 次日存在性判定</text>

  <!-- Activity source (left) -->
  <text x="95" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Activity（源表）</text>
  <rect x="20" y="62" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="80" font-size="9.5" fill="#333">player_id</text>
  <text x="100" y="80" font-size="9.5" fill="#333">event_date</text>
  <line x1="72" y1="62" x2="72" y2="90" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="90" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="46" y="105" font-size="10" fill="#333">1</text>
  <text x="100" y="105" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="72" y1="90" x2="72" y2="112" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="112" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="127" font-size="10" fill="#333">1</text>
  <text x="100" y="127" font-size="9.5" fill="#b85450">2016-03-02</text>
  <line x1="72" y1="112" x2="72" y2="134" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="134" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="149" font-size="10" fill="#333">2</text>
  <text x="100" y="149" font-size="9.5" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <line x1="72" y1="134" x2="72" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="156" width="150" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="46" y="171" font-size="10" fill="#333">3</text>
  <text x="100" y="171" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-01</text>
  <line x1="72" y1="156" x2="72" y2="178" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="178" width="150" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="193" font-size="10" fill="#333">3</text>
  <text x="100" y="193" font-size="9.5" fill="#d6a040">2018-07-03</text>
  <line x1="72" y1="178" x2="72" y2="200" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- GROUP BY MIN bracket -->
  <path d="M172 101 L184 101 L184 167 L172 167" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="190" y="128" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="190" y="140" font-size="9" fill="#446688" font-weight="bold">player_id</text>
  <text x="190" y="152" font-size="9" fill="#446688" font-weight="bold">MIN(date)</text>

  <!-- arrow to install subquery -->
  <path d="M250 134 L270 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- install subquery a (middle) -->
  <text x="355" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">首登子查询 a</text>
  <rect x="275" y="62" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="80" font-size="9.5" fill="#333">player_id</text>
  <text x="370" y="80" font-size="9.5" fill="#333">install_dt</text>
  <line x1="335" y1="62" x2="335" y2="90" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="275" y="90" width="160" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="304" y="106" font-size="10" fill="#333">1</text>
  <text x="370" y="106" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="335" y1="90" x2="335" y2="114" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="275" y="114" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="304" y="130" font-size="10" fill="#333">2</text>
  <text x="370" y="130" font-size="9.5" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <line x1="335" y1="114" x2="335" y2="138" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="275" y="138" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="304" y="154" font-size="10" fill="#333">3</text>
  <text x="370" y="154" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-01</text>
  <line x1="335" y1="138" x2="335" y2="162" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- DATE_ADD annotation -->
  <text x="355" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LEFT JOIN + DATE_ADD(+1 天)</text>
  <path d="M355 186 L355 206" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- per-player Day1 check (right) -->
  <text x="565" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">每人次日是否登录</text>
  <rect x="465" y="62" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="80" font-size="9.5" fill="#333">player_id</text>
  <text x="556" y="80" font-size="9.5" fill="#333">次日目标</text>
  <text x="630" y="80" font-size="9.5" fill="#333">Day1?</text>
  <line x1="535" y1="62" x2="535" y2="90" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="608" y1="62" x2="608" y2="90" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="465" y="90" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="106" font-size="10" fill="#333">1</text>
  <text x="556" y="106" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-02</text>
  <text x="632" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="535" y1="90" x2="535" y2="114" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="608" y1="90" x2="608" y2="114" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="465" y="114" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="130" font-size="10" fill="#333">2</text>
  <text x="556" y="130" font-size="9.5" fill="#333">2017-06-26</text>
  <text x="632" y="130" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <line x1="535" y1="114" x2="535" y2="138" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="608" y1="114" x2="608" y2="138" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="465" y="138" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="154" font-size="10" fill="#333">3</text>
  <text x="556" y="154" font-size="9.5" fill="#d6a040">2016-03-02</text>
  <text x="632" y="154" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <line x1="535" y1="138" x2="535" y2="162" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="608" y1="138" x2="608" y2="162" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrows install -> day1 check -->
  <path d="M437 102 L463 102" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M437 126 L463 126" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M437 150 L463 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- GROUP BY install_dt funnel to cohort -->
  <text x="360" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY install_dt → COUNT(*)=amount，SUM(Day1 标志)=Day1</text>
  <path d="M250 240 L470 240" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M360 240 L360 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cohort result table -->
  <text x="360" y="278" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">同期群留存结果</text>
  <rect x="180" y="284" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="303" font-size="10.5" fill="#333" font-weight="bold">install_dt</text>
  <text x="350" y="303" font-size="10.5" fill="#333" font-weight="bold">amount</text>
  <text x="470" y="303" font-size="10.5" fill="#333" font-weight="bold">Day1</text>
  <line x1="300" y1="284" x2="300" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="284" x2="410" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="314" width="360" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="331" font-size="10" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="354" y="331" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="472" y="331" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="300" y1="314" x2="300" y2="340" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="314" x2="410" y2="340" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="340" width="360" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="357" font-size="10" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <text x="354" y="357" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="472" y="357" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <line x1="300" y1="340" x2="300" y2="366" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="340" x2="410" y2="366" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- key takeaway box -->
  <rect x="30" y="384" width="660" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="406" font-size="11.5" fill="#333" font-weight="bold">核心：两级聚合——先 per-player 定位首登 + 次日标志，再按 install_dt 分组计数</text>
  <text x="50" y="426" font-size="10.5" fill="#555">• 第一级（复用 511/550）：GROUP BY player_id + MIN → 每人 install_dt；LEFT JOIN +1 天 → 每人 Day1 标志</text>
  <text x="50" y="444" font-size="10.5" fill="#555">• 第二级（新增）：GROUP BY install_dt → COUNT(*)=安装量 amount，SUM(Day1 标志)=次日留存 Day1</text>
  <text x="50" y="460" font-size="10.5" fill="#b85450">⚠️ 同一 install_dt 上多玩家共用日期→需先 per-player 判 Day1 再汇总，不能直接对日期 GROUP BY</text>
</svg>
