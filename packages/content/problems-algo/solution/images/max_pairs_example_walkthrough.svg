<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：频次表 → 累加 ⌊c/2⌋ 与 c mod 2</text>

  <!-- Example 1 main -->
  <text x="40" y="54" font-size="12.5" fill="#446688" font-weight="bold">例1：nums = [1,3,2,1,3,2,2]</text>

  <!-- Table header -->
  <rect x="40" y="64" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">值 v</text>
  <text x="260" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">次数 c</text>
  <text x="380" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">对数 c/2</text>
  <text x="480" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">余数 c%2</text>

  <!-- Row: value 1 -->
  <rect x="40" y="96" width="480" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="380" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="480" y="116" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- Row: value 2 -->
  <rect x="40" y="128" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="380" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="480" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: value 3 -->
  <rect x="40" y="160" width="480" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="480" y="180" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- Total row -->
  <rect x="40" y="192" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Σ</text>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="380" y="213" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="480" y="213" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- Result -->
  <text x="40" y="246" font-size="12.5" fill="#b85450" font-weight="bold">→ answer = [3, 1] ✓  （3 对，剩 1 个）</text>

  <!-- Divider -->
  <path d="M 40 262 L 520 262" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <rect x="40" y="276" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="12.5" fill="#446688" font-weight="bold">例2：nums = [1,1]</text>
  <text x="56" y="316" font-size="11" fill="#555">freq = {1:2} → 对数 2/2=1，余数 2%2=0</text>
  <text x="56" y="334" font-size="11.5" fill="#b85450" font-weight="bold">→ answer = [1, 0] ✓</text>

  <!-- Example 3 -->
  <rect x="40" y="348" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="370" font-size="12.5" fill="#d6a040" font-weight="bold">例3：nums = [0]</text>
  <text x="56" y="388" font-size="11" fill="#555">freq = {0:1} → 对数 1/2=0，余数 1%2=1</text>
  <text x="56" y="406" font-size="11.5" fill="#b85450" font-weight="bold">→ answer = [0, 1] ✓</text>

  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#888">余数之和 ≡ n (mod 2)：剩的个数与原长同奇偶</text>
</svg>
