<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：2n+2 个计数器代替 n×n 棋盘</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 3x3 board (sample final state) ===== -->
  <g filter="url(#sk)"><rect x="40" y="72" width="320" height="320" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="200" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">棋盘（仅用于理解，实际不存储）</text>

  <!-- grid lines -->
  <g stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)">
    <line x1="146" y1="112" x2="146" y2="382"/>
    <line x1="253" y1="112" x2="253" y2="382"/>
    <line x1="54"  y1="202" x2="346" y2="202"/>
    <line x1="54"  y1="292" x2="346" y2="292"/>
  </g>

  <!-- marks: X = player 1 (blue), O = player 2 (orange) -->
  <!-- (0,0)=X, (0,2)=O, (1,0)=O, (1,1)=O, (2,0)=X, (2,1)=X, (2,2)=X -->
  <g font-size="34" font-weight="bold" filter="url(#sk2)">
    <text x="100" y="166" text-anchor="middle" fill="#2b6e9e">X</text>
    <text x="300" y="166" text-anchor="middle" fill="#c98a2b">O</text>
    <text x="100" y="256" text-anchor="middle" fill="#c98a2b">O</text>
    <text x="200" y="256" text-anchor="middle" fill="#c98a2b">O</text>
    <text x="100" y="346" text-anchor="middle" fill="#2b6e9e">X</text>
    <text x="200" y="346" text-anchor="middle" fill="#2b6e9e">X</text>
    <text x="300" y="346" text-anchor="middle" fill="#2b6e9e">X</text>
  </g>

  <!-- highlight winning row -->
  <g filter="url(#sk)"><rect x="54" y="300" width="292" height="82" rx="6" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4"/></g>
  <text x="345" y="316" font-size="10" fill="#b03a3a" font-weight="bold">↑ 第 2 行</text>
  <text x="345" y="330" font-size="10" fill="#b03a3a">3 个 X 连成</text>

  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#5a7a9e">行号 0/1/2，列号 0/1/2</text>

  <!-- ===== Right: 4 counter structures ===== -->
  <g filter="url(#sk)"><rect x="400" y="72" width="420" height="320" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="610" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">计数器（实际存储）</text>

  <!-- rows array -->
  <text x="416" y="126" font-size="12" font-weight="bold" fill="#2b6e9e">rows[3]</text>
  <g font-size="11" filter="url(#sk2)">
    <g filter="url(#sk)"><rect x="470" y="112" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="492" y="128" text-anchor="middle" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="516" y="112" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="538" y="128" text-anchor="middle" fill="#333">−2</text>
    <g filter="url(#sk)"><rect x="562" y="112" width="44" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="584" y="128" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <text x="616" y="128" font-size="9.5" fill="#b03a3a">← |3|=n 胜！</text>
  </g>

  <!-- cols array -->
  <text x="416" y="164" font-size="12" font-weight="bold" fill="#2b6e9e">cols[3]</text>
  <g font-size="11" filter="url(#sk2)">
    <g filter="url(#sk)"><rect x="470" y="150" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="492" y="166" text-anchor="middle" fill="#333">1</text>
    <g filter="url(#sk)"><rect x="516" y="150" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="538" y="166" text-anchor="middle" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="562" y="150" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="584" y="166" text-anchor="middle" fill="#333">0</text>
  </g>

  <!-- diag -->
  <text x="416" y="202" font-size="12" font-weight="bold" fill="#2b6e9e">diag</text>
  <g font-size="11" filter="url(#sk2)">
    <g filter="url(#sk)"><rect x="470" y="188" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="492" y="204" text-anchor="middle" fill="#333">1</text>
    <text x="528" y="204" font-size="9.5" fill="#888">主对角线 (i==j)</text>
  </g>

  <!-- antiDiag -->
  <text x="416" y="240" font-size="12" font-weight="bold" fill="#2b6e9e">antiDiag</text>
  <g font-size="11" filter="url(#sk2)">
    <g filter="url(#sk)"><rect x="470" y="226" width="44" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="492" y="242" text-anchor="middle" fill="#333">−1</text>
    <text x="528" y="242" font-size="9.5" fill="#888">副对角线 (i+j==n−1)</text>
  </g>

  <!-- +1 / -1 mechanic -->
  <g filter="url(#sk)"><rect x="416" y="268" width="388" height="108" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="610" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">+1 / −1 技巧</text>
  <text x="426" y="312" font-size="11" fill="#2b6e9e">● 玩家 1 落子 → 对应行/列/对角线 <tspan font-weight="bold">+1</tspan></text>
  <text x="426" y="332" font-size="11" fill="#c98a2b">● 玩家 2 落子 → 对应行/列/对角线 <tspan font-weight="bold">−1</tspan></text>
  <text x="426" y="352" font-size="11" fill="#b03a3a">● 任一计数器 |值| == n → 该玩家获胜</text>
  <text x="426" y="370" font-size="10" fill="#888">单数组天然区分双方，无需为每玩家各开一套</text>

  <!-- arrow connecting board to counters -->
  <path d="M 360 232 L 396 232" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="378" y="222" text-anchor="middle" font-size="9.5" fill="#5a5a5a">压缩</text>

  <!-- ===== Bottom: complexity summary ===== -->
  <g filter="url(#sk)"><rect x="40" y="416" width="780" height="100" rx="12" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="430" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">空间从 O(n²) 棋盘压成 O(n) 计数器，move 仍 O(1)</text>
  <text x="430" y="468" text-anchor="middle" font-size="12" fill="#555">每次落子只需更新 4 个计数器（行、列、可能的两条对角线）</text>
  <text x="430" y="488" text-anchor="middle" font-size="12" fill="#555">计数器达到 ±n 即意味着该方向 n 子连成 → 胜负已分</text>
  <text x="430" y="508" text-anchor="middle" font-size="10.5" fill="#888">关键：井字棋判胜只关心「某方向上某玩家的子数」，不关心具体位置</text>
</svg>
