<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按发件人哈希聚合单词数</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">单词数 = 空格数 + 1；平局取字典序最大的名字</text>

  <text x="144" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">messages[i] → sender · 词数</text>
  <text x="448" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">哈希桶 cnt[sender] 累加</text>

  <rect x="24" y="62" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"Hello userTwooo"</text>
  <text x="144" y="94" text-anchor="middle" font-size="9.5" fill="#446688">空格 1 → 2 词 · sender: Alice</text>

  <rect x="24" y="110" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"Hi userThree"</text>
  <text x="144" y="142" text-anchor="middle" font-size="9.5" fill="#d6a040">空格 1 → 2 词 · sender: userTwo</text>

  <rect x="24" y="158" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"Wonderful day Alice"</text>
  <text x="144" y="190" text-anchor="middle" font-size="9.5" fill="#4a7a3a">空格 2 → 3 词 · sender: userThree</text>

  <rect x="24" y="206" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"Nice day userThree"</text>
  <text x="144" y="238" text-anchor="middle" font-size="9.5" fill="#446688">空格 2 → 3 词 · sender: Alice</text>

  <path d="M 264 82 Q 312 82 358 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 264 130 Q 312 130 358 172" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 264 178 Q 312 178 358 256" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 264 226 C 318 226 318 96 358 96" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="360" y="68" width="176" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Alice</text>
  <text x="440" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 2 + 3 = 5 ★</text>
  <rect x="494" y="72" width="40" height="16" fill="#b85450" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="514" y="84" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">MAX</text>

  <rect x="360" y="148" width="176" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="170" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">userTwo</text>
  <text x="448" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 2</text>

  <rect x="360" y="232" width="176" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">userThree</text>
  <text x="448" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 3</text>

  <rect x="24" y="300" width="512" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 单词数 = 空格数 + 1</text>
  <text x="40" y="338" font-size="10.5" fill="#4a7a3a">单空格分隔、无首尾空格 → 数 ' ' 即可，免 split 分配；cnt[sender] += 空格数+1 一趟聚合</text>

  <rect x="24" y="354" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="374" font-size="12" fill="#d6a040" font-weight="bold">⚠ 平局取字典序最大的名字（不是最小！）</text>
  <text x="40" y="392" font-size="10.5" fill="#d6a040">ASCII 序：'A'(65) &lt; 'a'(97)，大写 &lt; 小写；默认字符串比较即满足，勿 case-fold</text>
</svg>
