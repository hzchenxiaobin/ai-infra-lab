<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：清洗 → 分组计数 → 排序输出</text>

  <!-- Step 1: TRIM -->
  <rect x="160" y="48" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① TRIM 去首尾空格</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#666">'  LCPHONE  ' → 'LCPHONE'</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: case normalize -->
  <rect x="120" y="110" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 大小写归一化（首字母大写+其余小写）</text>
  <text x="280" y="148" text-anchor="middle" font-size="9" fill="#666">CONCAT(UPPER(LEFT(s,1)), LOWER(SUBSTRING(s,2)))</text>
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#666">'LCPHONE' → 'Lcphone'</text>

  <path d="M 280 166 L 280 182" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY + COUNT -->
  <rect x="130" y="184" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ GROUP BY 清洗名, sale_date</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#666">同名同日折叠 → COUNT(*) AS total</text>

  <path d="M 280 234 L 280 250" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: ORDER BY (decision) -->
  <rect x="140" y="252" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ ORDER BY 输出排序</text>
  <text x="280" y="288" text-anchor="middle" font-size="9" fill="#666">product_name ASC, sale_date ASC</text>

  <path d="M 280 296 L 280 312" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output table -->
  <rect x="140" y="314" width="280" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="329" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_name</text>
  <text x="306" y="329" text-anchor="middle" font-size="9" fill="white" font-weight="bold">sale_date</text>
  <text x="376" y="329" text-anchor="middle" font-size="9" fill="white" font-weight="bold">total</text>

  <rect x="140" y="336" width="280" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="196" y="350" text-anchor="middle" font-size="9" fill="#333">Lckeychain</text>
  <text x="306" y="350" text-anchor="middle" font-size="9" fill="#333">2000-02-19</text>
  <text x="376" y="350" text-anchor="middle" font-size="9" fill="#333">1</text>

  <rect x="140" y="356" width="280" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="196" y="370" text-anchor="middle" font-size="9" fill="#333">Lcphone</text>
  <text x="306" y="370" text-anchor="middle" font-size="9" fill="#333">2000-01-16</text>
  <text x="376" y="370" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="50" y="392" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">GROUP BY 须重复清洗表达式，或用 CTE 先算清洗名再分组</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#666">ORDER BY 可直接引用 SELECT 中的别名 product_name</text>
</svg>
