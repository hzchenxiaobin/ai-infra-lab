<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：归一化 (min,max) 让等价多米诺落进同一桶</text>

  <!-- ===== Section A: equivalence via rotation ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">等价 = 可 180° 旋转重合：[a,b] ~ [b,a]</text>

  <!-- domino [1,2] -->
  <text x="92" y="74" text-anchor="middle" font-size="10" fill="#888">原样</text>
  <rect x="72" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="72" y="102" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- rotate arrow -->
  <path d="M 120 108 C 170 88 200 88 220 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">180°</text>

  <!-- domino [2,1] -->
  <text x="250" y="74" text-anchor="middle" font-size="10" fill="#888">旋转后</text>
  <rect x="230" y="80" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="102" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- both converge down to normalize -->
  <path d="M 92 124 L 92 138 L 170 138 L 170 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 124 L 250 138 L 170 138" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- normalize box -->
  <rect x="40" y="152" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="172" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">归一化：(min, max) = (1, 2)  →  编码 key = min×10 + max = 12</text>

  <!-- ===== Section B: bucketing example ===== -->
  <text x="40" y="204" font-size="11" fill="#888" font-weight="bold">逐张归一化 → 相同编码落进同一桶（用示例 2 的 5 张牌演示）：</text>

  <!-- 5 dominoes with codes -->
  <!-- d0 [1,2] -> 12 -->
  <rect x="50" y="216" width="34" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="67" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="50" y="234" width="34" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="67" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="67" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">12</text>

  <!-- d1 [2,1] -> 12 -->
  <rect x="120" y="216" width="34" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="137" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="234" width="34" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="137" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="137" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">12</text>

  <!-- d2 [1,1] -> 11 -->
  <rect x="190" y="216" width="34" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="207" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="234" width="34" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="207" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="207" y="266" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">11</text>

  <!-- d3 [1,2] -> 12 -->
  <rect x="260" y="216" width="34" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="277" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="234" width="34" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="277" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="277" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">12</text>

  <!-- d4 [2,2] -> 22 -->
  <rect x="330" y="216" width="34" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="347" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="330" y="234" width="34" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="347" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="347" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">22</text>

  <!-- buckets -->
  <text x="40" y="288" font-size="11" fill="#888" font-weight="bold">分桶结果：</text>
  <rect x="110" y="276" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 12 → 3 张</text>
  <rect x="220" y="276" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 11 → 1 张</text>
  <rect x="330" y="276" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="376" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 22 → 1 张</text>

  <!-- ===== Section C: pairs ===== -->
  <text x="40" y="324" font-size="11" fill="#888" font-weight="bold">每桶任取两张即一对等价对：</text>
  <text x="230" y="324" font-size="12" fill="#d6a040" font-weight="bold">C(c, 2) = c × (c − 1) / 2</text>

  <!-- pairs per bucket -->
  <text x="156" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C(3,2) = 3</text>
  <text x="266" y="346" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">C(1,2) = 0</text>
  <text x="376" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">C(1,2) = 0</text>

  <!-- arrows down to total -->
  <path d="M 156 352 L 156 362 L 270 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 266 352 L 270 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 376 352 L 376 362 L 270 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 270 362 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="190" y="374" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 3 + 0 + 0 = 3</text>
</svg>
