<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">入度刻画合法二叉树：一根 + 单父 + 全连通</text>

  <!-- ===== Panel 1: valid ===== -->
  <rect x="20" y="44" width="500" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合法：恰一个根（入度 0），其余入度 1，从根可达全部</text>

  <line x1="262" y1="86" x2="234" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="278" y1="86" x2="306" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="320" y1="124" x2="320" y2="144" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="270" cy="78" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="224" cy="116" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="320" cy="116" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="320" cy="154" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <text x="294" y="72" font-size="9.5" fill="#4a7a3a" font-weight="bold">入度0</text>
  <text x="180" y="120" font-size="9.5" fill="#666">入度1</text>
  <text x="340" y="112" font-size="9.5" fill="#666">入度1</text>
  <text x="340" y="160" font-size="9.5" fill="#666">入度1</text>

  <text x="50" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">根 = 0 ✓</text>
  <text x="50" y="120" font-size="10.5" fill="#666">边数 = n−1 = 3</text>
  <text x="50" y="140" font-size="10.5" fill="#666">BFS 访问 4 = n ✓</text>

  <!-- ===== Panel 2: invalid two parents ===== -->
  <rect x="20" y="172" width="500" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非法①：节点 3 有两个父亲（入度 = 2）</text>

  <line x1="262" y1="214" x2="236" y2="234" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="278" y1="214" x2="304" y2="234" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="234" y1="252" x2="262" y2="266" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="306" y1="252" x2="278" y2="266" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <circle cx="270" cy="206" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="226" cy="244" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="226" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="314" cy="244" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="314" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="270" cy="272" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <text x="296" y="276" font-size="9.5" fill="#b85450" font-weight="bold">入度2 ✗</text>
  <text x="48" y="232" font-size="10.5" fill="#b85450">1→3 且 2→3</text>
  <text x="48" y="250" font-size="10.5" fill="#b85450">一个孩子两父 ✗</text>

  <!-- ===== Panel 3: invalid cycle ===== -->
  <rect x="20" y="294" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">非法②：存在环，无入度 0 节点（找不到根）</text>

  <line x1="236" y1="346" x2="304" y2="346" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="310" y1="360" x2="284" y2="382" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="258" y1="382" x2="232" y2="360" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <circle cx="222" cy="346" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="318" cy="346" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="318" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="270" cy="392" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <text x="200" y="338" font-size="9.5" fill="#666">入度1</text>
  <text x="340" y="338" font-size="9.5" fill="#666">入度1</text>
  <text x="292" y="410" font-size="9.5" fill="#666">入度1</text>

  <text x="392" y="346" font-size="10.5" fill="#d6a040" font-weight="bold">0→1→2→0</text>
  <text x="392" y="366" font-size="10.5" fill="#d6a040" font-weight="bold">全员入度1</text>
  <text x="392" y="386" font-size="10.5" fill="#d6a040" font-weight="bold">无根 ✗</text>
</svg>
