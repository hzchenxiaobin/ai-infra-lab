<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同余 + 最早下标：余数再现且跨度 ≥ 2 即命中</text>

  <!-- nums row -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="95" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#333">23</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="295" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>

  <text x="120" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="320" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- prefix row -->
  <text x="40" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="45" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="95" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#333">23</text>
  <rect x="145" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">25</text>
  <rect x="195" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333">29</text>
  <rect x="245" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">35</text>
  <rect x="295" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#333">42</text>

  <text x="70" y="176" text-anchor="middle" font-size="9" fill="#aaa">init</text>
  <text x="120" y="176" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="170" y="176" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="220" y="176" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="320" y="176" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- remainder row -->
  <text x="40" y="214" font-size="12" fill="#888">% 6 :</text>
  <rect x="45" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="95" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="145" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="195" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="245" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="295" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>

  <!-- bracket 1: r=5 at index 0 and index 2 -->
  <path d="M 120 252 Q 120 264 130 264 L 210 264 Q 220 264 220 252" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余数同为 5，下标差 2−0 = 2 ≥ 2 ✓ → [2,4] 和=6</text>

  <!-- bracket 2: r=0 at index -1(init) and index 4 -->
  <path d="M 70 290 Q 70 302 80 302 L 310 302 Q 320 302 320 290" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="195" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">余数同为 0，下标差 4−(−1) = 5 ≥ 2 ✓ → 整段和=42</text>

  <!-- equation box -->
  <rect x="40" y="332" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#333">子数组和 = 两端前缀和之差</text>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k | 子数组和  ⇔  两端前缀和同余</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#888">存余数最早下标 first[r]，再现时 i − first[r] ≥ 2 → true</text>
</svg>
