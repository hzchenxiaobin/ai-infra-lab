<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：piles = [5,3,4,5]，答案格 dp[0][3] 的递推</text>

  <!-- column header j -->
  <text x="120" y="60" text-anchor="middle" font-size="10" fill="#aaa">i \ j</text>
  <text x="170" y="60" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="220" y="60" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="270" y="60" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="320" y="60" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- row header i -->
  <text x="120" y="88" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="120" y="128" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="120" y="168" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="120" y="208" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- row 0: dp[0][0]=5 dp[0][1]=2 dp[0][2]=4 dp[0][3]=1(answer) -->
  <rect x="145" y="70" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="93" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="195" y="70" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="93" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="245" y="70" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="93" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="295" y="70" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- row 1: dp[1][1]=3 dp[1][2]=1 dp[1][3]=4(dep) -->
  <rect x="195" y="110" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="133" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="245" y="110" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="133" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="295" y="110" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="133" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- row 2: dp[2][2]=4 dp[2][3]=1 -->
  <rect x="245" y="150" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="173" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="295" y="150" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="173" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- row 3: dp[3][3]=5 -->
  <rect x="295" y="190" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="213" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- dependency arrows into dp[0][3]: from dp[1][3](below) and dp[0][2](left) -->
  <path d="M 320 146 L 320 110" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="130" font-size="9" fill="#b85450">依赖↓</text>
  <path d="M 293 88 L 297 88" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="62" font-size="9" fill="#b85450">依赖←</text>

  <!-- computation box -->
  <rect x="40" y="246" width="440" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[0][3] = max( piles[0] − dp[1][3] , piles[3] − dp[0][2] )</text>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#444">= max( 5 − 4 , 5 − 4 ) = max( 1 , 1 )</text>
  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 1 &gt; 0  →  亚历克斯净赢 1 颗（9 vs 8）→ true</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#888">两选项净赚相同，先手拿左或右均可，最终 9:8 取胜</text>
</svg>
