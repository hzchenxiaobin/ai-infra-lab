<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按步数递推 + 四方向累加</text>

  <!-- Step 1: init -->
  <rect x="160" y="46" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#444">初始化 dp[0][i][j] = 0（0 步无法出界）</text>
  <path d="M 260 84 L 260 98" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop move -->
  <rect x="140" y="100" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for move = 1 … maxMove</text>
  <path d="M 260 138 L 260 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: cell loop -->
  <rect x="140" y="154" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#333">for 每个格子 (i, j) in 网格</text>
  <path d="M 260 192 L 260 206" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: direction loop -->
  <rect x="140" y="208" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333">for 每个方向 d ∈ {上, 下, 左, 右}</text>
  <path d="M 260 246 L 260 260" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: neighbor out of bounds? -->
  <polygon points="260,262 350,300 260,338 170,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">邻居 (ni,nj)</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">越界?</text>

  <!-- Yes branch (left) -->
  <path d="M 170 300 L 110 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="280" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="65" y="298" text-anchor="middle" font-size="10" fill="#333">直接出界</text>
  <text x="65" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+= 1</text>

  <!-- No branch (right) -->
  <path d="M 350 300 L 410 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="292" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="410" y="280" width="90" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="298" text-anchor="middle" font-size="10" fill="#333">留在界内</text>
  <text x="455" y="314" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+= dp[move−1]</text>
  <text x="455" y="326" text-anchor="middle" font-size="9" fill="#446688">[ni][nj]</text>

  <!-- bottom: return -->
  <path d="M 260 338 L 260 358" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="360" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">返回 dp[maxMove][startRow][startColumn]</text>
</svg>
