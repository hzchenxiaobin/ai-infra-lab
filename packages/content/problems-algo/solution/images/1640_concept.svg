<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：首元素即 piece 的「身份证」</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">pieces 扁平化后互不相同 → 首元素唯一 → 可作哈希键；按 arr 顺序查表取货</text>

  <!-- Row 1: pieces, first element highlighted -->
  <text x="60" y="86" font-size="11" fill="#446688" font-weight="bold">pieces</text>
  <g font-size="13">
    <!-- piece [78] -->
    <rect x="150" y="74" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="172" y="94" text-anchor="middle" fill="#d6a040" font-weight="bold">78</text>
    <!-- piece [4,64] -->
    <rect x="220" y="74" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="242" y="94" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="264" y="74" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="286" y="94" text-anchor="middle" fill="#446688">64</text>
    <!-- piece [91] -->
    <rect x="334" y="74" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="356" y="94" text-anchor="middle" fill="#d6a040" font-weight="bold">91</text>
  </g>
  <text x="400" y="94" font-size="10" fill="#d6a040" font-weight="bold">← 首元素高亮</text>

  <!-- bracket grouping pieces -->
  <path d="M 148 110 L 148 116 L 378 116 L 378 110" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- arrow down: build hash map -->
  <path d="M 263 118 L 263 142" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="273" y="134" font-size="10" fill="#888">以首元素为键建表</text>

  <!-- Row 2: hash map entries -->
  <text x="60" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">哈希表</text>
  <g font-size="11" fill="#333">
    <rect x="120" y="154" width="100" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="170" y="173" text-anchor="middle"><tspan fill="#d6a040" font-weight="bold">91</tspan> → [91]</text>
    <rect x="240" y="154" width="120" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="300" y="173" text-anchor="middle"><tspan fill="#d6a040" font-weight="bold">4</tspan> → [4, 64]</text>
    <rect x="380" y="154" width="100" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="430" y="173" text-anchor="middle"><tspan fill="#d6a040" font-weight="bold">78</tspan> → [78]</text>
  </g>

  <!-- arrow down: scan arr -->
  <path d="M 263 184 L 263 208" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="273" y="200" font-size="10" fill="#888">扫描 arr，arr[i] 查表取货</text>

  <!-- Row 3: arr with pointer i -->
  <text x="60" y="240" font-size="11" fill="#b85450" font-weight="bold">arr</text>
  <g font-size="13">
    <rect x="150" y="224" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="172" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">91</text>
    <rect x="194" y="224" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="216" y="245" text-anchor="middle" fill="#446688">4</text>
    <rect x="238" y="224" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="245" text-anchor="middle" fill="#446688">64</text>
    <rect x="282" y="224" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="304" y="245" text-anchor="middle" fill="#446688">78</text>
  </g>
  <!-- pointer i -->
  <path d="M 172 268 L 172 258" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="172" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=0</text>

  <!-- lookup arrow: arr[0]=91 -> hash map entry 91 -->
  <path d="M 172 222 Q 172 200 170 184" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="120" y="200" font-size="10" fill="#b85450" font-weight="bold">查表</text>

  <!-- matched piece returned -->
  <rect x="150" y="296" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[91]</text>
  <text x="210" y="313" font-size="10" fill="#4a7a3a">核对 arr[0..0]==[91] ✓ → i 跳到 1</text>

  <!-- bottom note -->
  <rect x="40" y="338" width="500" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="360" font-size="11" fill="#d6a040" font-weight="bold">为什么是 O(n) 线性？</text>
  <text x="58" y="378" font-size="11" fill="#555">• arr 元素互不相同 → arr[i] 至多属于一个 piece，匹配无分支</text>
  <text x="58" y="396" font-size="11" fill="#555">• pieces 元素互不相同 → 首元素唯一，哈希查找 O(1) 命中</text>
  <text x="58" y="414" font-size="11" fill="#b85450" font-weight="bold">• 指数级排列枚举 → 退化为确定性线性取货，关键在「互不相同」</text>
</svg>
