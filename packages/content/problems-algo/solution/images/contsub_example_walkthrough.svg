<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [23,2,4,6,7],  k = 6</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <text x="95" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">元素</text>
  <text x="155" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prefix</text>
  <text x="215" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">r=%6</text>
  <text x="295" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">first[r]</text>
  <text x="375" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i−first[r]</text>
  <text x="485" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">first 更新</text>

  <!-- Row 0: init -->
  <rect x="10" y="66" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="84" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="155" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="215" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="295" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="375" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="485" y="84" text-anchor="middle" font-size="10" fill="#333">{0:−1}</text>

  <!-- Row 1: i=0, x=23 -->
  <rect x="10" y="96" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="114" text-anchor="middle" font-size="10.5" fill="#888">i=0</text>
  <rect x="82" y="100" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">23</text>
  <text x="155" y="114" text-anchor="middle" font-size="11" fill="#333">23</text>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="295" y="114" text-anchor="middle" font-size="10.5" fill="#aaa">无</text>
  <text x="375" y="114" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="485" y="114" text-anchor="middle" font-size="9.5" fill="#333">写入 {5:0}</text>

  <!-- Row 2: i=1, x=2 -->
  <rect x="10" y="126" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="144" text-anchor="middle" font-size="10.5" fill="#888">i=1</text>
  <rect x="86" y="130" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="155" y="144" text-anchor="middle" font-size="11" fill="#333">25</text>
  <text x="215" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="295" y="144" text-anchor="middle" font-size="10.5" fill="#aaa">无</text>
  <text x="375" y="144" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="485" y="144" text-anchor="middle" font-size="9.5" fill="#333">写入 {1:1}</text>

  <!-- Row 3: i=2, x=4  HIT -->
  <rect x="10" y="156" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="38" y="174" text-anchor="middle" font-size="10.5" fill="#888">i=2 ★</text>
  <rect x="86" y="160" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="155" y="174" text-anchor="middle" font-size="11" fill="#333">29</text>
  <text x="215" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="295" y="174" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">0 ←</text>
  <text x="375" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2−0 = 2 ✓</text>
  <text x="485" y="174" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">命中! return true</text>

  <!-- Explanation box 1: same remainder reappears -->
  <rect x="10" y="198" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 余数 5 再现</text>
  <text x="140" y="234" text-anchor="middle" font-size="10" fill="#555">i=0 时 r=5 已存 first[5]=0</text>
  <text x="140" y="248" text-anchor="middle" font-size="10" fill="#555">i=2 再现，跨度 2−0 = 2 ≥ 2</text>

  <!-- Explanation box 2: keep earliest -->
  <rect x="290" y="198" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠ 只存最早下标</text>
  <text x="420" y="234" text-anchor="middle" font-size="10" fill="#555">已存在绝不覆盖</text>
  <text x="420" y="248" text-anchor="middle" font-size="10" fill="#555">覆盖会使跨度变小而漏判</text>

  <!-- Summary box -->
  <rect x="10" y="266" width="540" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">命中！子数组 nums[1..2] = [2,4]，和 = 6 = 6×1</text>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#555">余数 5 配对：first[5]=0（最早）与 i=2，长度 = i − first[r] = 2</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#aaa">一次遍历，命中即返回，O(n)</text>
</svg>
