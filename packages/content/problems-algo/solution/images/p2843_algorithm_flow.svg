<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐数扫描 → 奇偶位过滤 → 前后半和差</text>

  <!-- Start -->
  <rect x="210" y="38" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x 从 low 遍历到 high</text>
  <path d="M 310 70 L 310 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- to string -->
  <rect x="195" y="88" width="230" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = str(x)，n = len(s)</text>
  <path d="M 310 120 L 310 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: odd digits -->
  <polygon points="310,138 388,174 310,210 232,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">n 为奇数？</text>

  <path d="M 388 174 L 448 174" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="450" y="156" width="130" height="36" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="178" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">跳过 x（不对称）</text>
  <path d="M 515 156 L 515 54 L 414 54" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="110" font-size="11" fill="#999" filter="url(#rough2)">下一个 x</text>

  <path d="M 310 210 L 310 226" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="224" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diff -->
  <rect x="180" y="228" width="260" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">diff = 前半数位和 − 后半数位和</text>
  <path d="M 310 260 L 310 276" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: diff == 0 -->
  <polygon points="310,278 382,314 310,350 238,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">diff == 0 ？</text>

  <path d="M 238 314 L 180 314" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="58" y="296" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++ ✓</text>

  <path d="M 382 314 L 440 314" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="442" y="296" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">丢弃 x ✗</text>

  <!-- merge to return -->
  <path d="M 118 332 L 118 392 L 226 392" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 497 332 L 497 392 L 394 392" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="228" y="376" width="164" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">循环结束，返回 ans</text>

  <text x="20" y="424" font-size="11" fill="#999" filter="url(#rough2)">在 [1, 10^4] 内仅 2 位与 4 位数可能通过奇偶过滤；两位数可速判 x % 11 == 0</text>
</svg>
