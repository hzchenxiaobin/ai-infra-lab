<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n = 1 + k + k² + … + k^(m−1) = (k^m − 1)/(k − 1)，固定 m 二分 k</text>

  <!-- ===== Left panel: all-ones representation ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">好进制表示（全 1）</text>

  <!-- base-k digits row: 1 1 1 1 ... 1 -->
  <rect x="60" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="96" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="132" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <text x="182" y="100" font-size="16" fill="#888">…</text>

  <rect x="200" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- brace and m label -->
  <path d="M 60 122 Q 60 130 70 130 L 130 130 Q 140 130 140 138 L 140 138 Q 140 130 150 130 L 210 130 Q 220 130 220 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="140" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">m 个 1</text>

  <!-- place values -->
  <text x="77" y="166" text-anchor="middle" font-size="10" fill="#888">k⁰</text>
  <text x="113" y="166" text-anchor="middle" font-size="10" fill="#888">k¹</text>
  <text x="149" y="166" text-anchor="middle" font-size="10" fill="#888">k²</text>
  <text x="217" y="166" text-anchor="middle" font-size="10" fill="#888">k^(m−1)</text>

  <!-- sum formula box -->
  <rect x="40" y="186" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n = Σ k^i  (i=0..m−1)</text>
  <text x="150" y="228" text-anchor="middle" font-size="12" fill="#444">= (k^m − 1) / (k − 1)</text>
  <text x="150" y="243" text-anchor="middle" font-size="10" fill="#888">等比求和闭式</text>

  <!-- m vs k tradeoff note -->
  <rect x="40" y="262" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">m 越大 → 项越多 → k 越小</text>
  <text x="150" y="298" text-anchor="middle" font-size="10" fill="#888">求最小 k ⇔ 从最大 m 开始试</text>
  <text x="150" y="312" text-anchor="middle" font-size="10" fill="#888">m_max = ⌊log₂(n+1)⌋ ≤ 60</text>

  <!-- ===== Right panel: for fixed m, f(k) monotone ===== -->
  <text x="310" y="58" font-size="12" fill="#888" font-weight="bold">固定 m：f(k) 关于 k 单调递增</text>

  <!-- axes -->
  <line x1="320" y1="250" x2="530" y2="250" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="320" y1="250" x2="320" y2="80" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="254" font-size="10" fill="#888">k</text>
  <text x="316" y="76" text-anchor="end" font-size="10" fill="#888">f(k)</text>

  <!-- n horizontal line -->
  <line x1="320" y1="140" x2="530" y2="140" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="528" y="134" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">n</text>

  <!-- monotone curve (sketched) -->
  <path d="M 330 245 Q 360 240 380 225 Q 410 205 430 175 Q 450 145 470 110" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- intersection point -->
  <circle cx="448" cy="140" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k*</text>

  <!-- lo / hi region labels -->
  <text x="360" y="268" text-anchor="middle" font-size="10" fill="#b85450">f(k) &lt; n</text>
  <text x="490" y="268" text-anchor="middle" font-size="10" fill="#82b366">f(k) &gt; n</text>

  <!-- arrow: binary search finds unique k* -->
  <path d="M 448 270 L 448 254" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">唯一解</text>

  <!-- formula box right -->
  <rect x="310" y="300" width="230" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每个 m 最多一个 k</text>
  <text x="425" y="340" text-anchor="middle" font-size="10" fill="#555">k 上界 ≈ n^(1/(m−1))</text>
  <text x="425" y="354" text-anchor="middle" font-size="10" fill="#888">二分 [2, ⌊n^(1/(m−1))⌋+2]</text>

  <!-- arrow connecting left m to right binary search -->
  <path d="M 260 145 L 308 145" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="138" text-anchor="middle" font-size="9" fill="#888">枚举 m</text>
</svg>
