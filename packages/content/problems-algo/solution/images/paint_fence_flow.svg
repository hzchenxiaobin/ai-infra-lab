<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两变量滚动递推（same / diff）</text>

  <!-- Step 1: init -->
  <rect x="30" y="46" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">① 初始化（i = 0，第一根）</text>
  <text x="46" y="88" font-size="12" fill="#333">diff = k     same = 0     （第一根无前驱，必属 diff 态，有 k 种选法；same 态不存在）</text>

  <!-- Step 2: loop -->
  <rect x="30" y="112" width="480" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="134" font-size="12" fill="#446688" font-weight="bold">② 循环 i = 1 … n−1：用「旧 same/diff」算「新 same/diff」</text>

  <rect x="60" y="146" width="200" height="34" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="167" text-anchor="middle" font-size="12" fill="#333">new_diff = (same + diff) × (k−1)</text>

  <rect x="60" y="186" width="200" height="34" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="207" text-anchor="middle" font-size="12" fill="#333">new_same = diff</text>

  <path d="M 270 163 L 300 163" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 203 L 300 203" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="146" width="180" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">滚动赋值</text>
  <text x="396" y="190" text-anchor="middle" font-size="11" fill="#444">diff ← new_diff</text>
  <text x="396" y="208" text-anchor="middle" font-size="11" fill="#444">same ← new_same</text>

  <text x="46" y="222" font-size="10" fill="#666">⚠️ 先算 new_diff 再覆盖 diff：new_same 依赖旧 diff，不能先改 same</text>

  <!-- Step 3: answer -->
  <rect x="30" y="238" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="260" font-size="12" fill="#b85450" font-weight="bold">③ 收尾：返回 same + diff（最后一根两种状态之和）</text>
  <text x="46" y="280" font-size="12" fill="#333">特判 n == 1：直接返回 k（不进循环，初值 diff=k 已是答案）</text>

  <!-- invariant box -->
  <rect x="30" y="304" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">不变式：total[i] = diff[i] + same[i]</text>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#444">每根的合法涂法 = 「异于前一根」+「同于前一根」两类之和</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">只依赖前一根两状态 → 滚动到 O(1) 空间</text>
</svg>
