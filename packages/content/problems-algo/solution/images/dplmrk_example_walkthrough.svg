<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：arr = [1,2,4,4,4,4]，m=1，k=3，目标 = m×(k−1) = 2</text>

  <!-- Table header -->
  <rect x="50" y="40" width="460" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="59" text-anchor="start" font-size="11" fill="#555" font-weight="bold">i</text>
  <text x="120" y="59" text-anchor="start" font-size="11" fill="#555" font-weight="bold">arr[i]</text>
  <text x="180" y="59" text-anchor="start" font-size="11" fill="#555" font-weight="bold">arr[i+m]</text>
  <text x="255" y="59" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">匹配?</text>
  <text x="305" y="59" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">count</text>
  <text x="345" y="59" text-anchor="start" font-size="11" fill="#555" font-weight="bold">动作</text>

  <!-- Column separators -->
  <line x1="110" y1="40" x2="110" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="40" x2="170" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="40" x2="230" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="40" x2="280" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="40" x2="330" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: i=0, arr[0]=1, arr[1]=2, no match, count=0 -->
  <rect x="50" y="68" width="460" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="87" text-anchor="start" font-size="11" fill="#333">0</text>
  <text x="120" y="87" text-anchor="start" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="180" y="87" text-anchor="start" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="255" y="87" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="305" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="345" y="87" text-anchor="start" font-size="11" fill="#666">1≠2 → count=0</text>

  <!-- Row 1: i=1, arr[1]=2, arr[2]=4, no match, count=0 -->
  <rect x="50" y="96" width="460" height="28" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="115" text-anchor="start" font-size="11" fill="#333">1</text>
  <text x="120" y="115" text-anchor="start" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="180" y="115" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="255" y="115" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="305" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="345" y="115" text-anchor="start" font-size="11" fill="#666">2≠4 → count=0</text>

  <!-- Row 2: i=2, arr[2]=4, arr[3]=4, match, count=1 -->
  <rect x="50" y="124" width="460" height="28" fill="#e6f4ea" stroke="#a0c8a0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="143" text-anchor="start" font-size="11" fill="#333">2</text>
  <text x="120" y="143" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="180" y="143" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="255" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="305" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="345" y="143" text-anchor="start" font-size="11" fill="#666">4==4 → count++ → 1</text>

  <!-- Row 3: i=3, arr[3]=4, arr[4]=4, match, count=2 → return true -->
  <rect x="50" y="152" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="171" text-anchor="start" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="120" y="171" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="180" y="171" text-anchor="start" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="255" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>
  <text x="305" y="171" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="345" y="171" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">count++ → 2 ≥ 2 → true ⭐</text>

  <!-- Row 4: i=4, not reached -->
  <rect x="50" y="180" width="460" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="199" text-anchor="start" font-size="11" fill="#aaa">4</text>
  <text x="120" y="199" text-anchor="start" font-size="11" fill="#aaa" font-weight="bold">4</text>
  <text x="180" y="199" text-anchor="start" font-size="11" fill="#aaa">—</text>
  <text x="255" y="199" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="305" y="199" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="345" y="199" text-anchor="start" font-size="11" fill="#aaa">未执行（已短路返回）</text>

  <!-- Summary box -->
  <rect x="80" y="224" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=3 时 count 达到 m×(k−1)=2，立即返回 true</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#888">模式 [4] 重复 3 次：下标 2,3,4 连续三个 4</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#aaa">m=1 时只需相邻元素相等，count 累计 2 即找到 3 个相同块</text>
</svg>
