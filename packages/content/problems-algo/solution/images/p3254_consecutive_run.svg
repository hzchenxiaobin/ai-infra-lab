<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：维护「以 i 结尾」的连续递增段长度 cnt</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [1, 2, 3, 4, 3, 2, 5]，k = 3</text>

  <!-- 数组格子：7 个，宽 44，间距 12，x = 60 + 56*i -->
  <rect x="60" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="172" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="228" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="284" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="340" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="396" y="64" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 相邻判定徽章：✓ 绿 / ✗ 红，圆心在 gap 中心 -->
  <circle cx="110" cy="83" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="87" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <circle cx="166" cy="83" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="87" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <circle cx="222" cy="83" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="87" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <circle cx="278" cy="83" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="87" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <circle cx="334" cy="83" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="87" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <circle cx="390" cy="83" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="87" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 断点注释 -->
  <text x="278" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">断点！cnt 清 1</text>

  <!-- cnt 行 -->
  <text x="30" y="142" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="82" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="138" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="194" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="250" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="306" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="362" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="418" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 窗口括弧 -->
  <path d="M 116 156 L 116 164 L 272 164 L 272 156" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 [2,3,4]：cnt=4 ≥ 3 → 能量 4</text>
  <path d="M 284 156 L 284 164 L 440 164 L 440 156" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="362" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 [3,2,5]：含断点 → 能量 −1</text>

  <!-- 底部左：cnt 更新规则 -->
  <rect x="25" y="205" width="225" height="135" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="137" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt：以 i 结尾的段长</text>
  <text x="40" y="252" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">· nums[i] = nums[i−1]+1 → cnt++</text>
  <text x="40" y="274" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">· 否则断点 → cnt ← 1（自成新段）</text>
  <text x="40" y="296" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">· cnt ≥ k ⇔ 窗口 [i−k+1, i] 合法</text>
  <text x="40" y="318" font-size="9.5" fill="#6a8a5e" filter="url(#rough2)">（= 距最近断点的元素个数）</text>

  <!-- 底部右：答案写入规则 -->
  <rect x="270" y="205" width="225" height="135" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="382" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">res：预填 −1，只写合法窗口</text>
  <text x="285" y="252" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">· i ≥ k−1 且 cnt ≥ k 时</text>
  <text x="285" y="274" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">· res[i−k+1] ← nums[i]（右端点即 max）</text>
  <text x="285" y="296" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">· 非法窗口维持预填的 −1</text>
  <text x="285" y="318" font-size="9.5" fill="#a08040" filter="url(#rough2)">（非法分支零代码）</text>
</svg>
