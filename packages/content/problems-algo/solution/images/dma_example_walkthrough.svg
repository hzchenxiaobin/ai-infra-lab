<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：内存数组状态随各操作演化（· = 空闲/0）</text>

  <!-- header -->
  <rect x="14" y="38" width="632" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="28" y="56" font-size="11" fill="#446688" filter="url(#rough2)">#</text>
  <text x="60" y="56" font-size="11" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="240" y="56" font-size="11" fill="#446688" filter="url(#rough2)">内存数组（下标 0–9）</text>
  <text x="572" y="56" font-size="11" fill="#446688" filter="url(#rough2)">返回</text>

  <!-- row 1: alloc(1,1)->0 -->
  <rect x="14" y="66" width="632" height="27" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="84" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="84" font-size="11" fill="#333" filter="url(#rough2)">allocate(1, 1)</text>
  <text x="240" y="84" font-size="11" fill="#444" filter="url(#rough2)">[<tspan fill="#2a6a2a" font-weight="bold">1</tspan>,·,·,·,·,·,·,·,·,·]</text>
  <text x="572" y="84" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- row 2: alloc(1,2)->1 -->
  <rect x="14" y="95" width="632" height="27" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="113" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="60" y="113" font-size="11" fill="#333" filter="url(#rough2)">allocate(1, 2)</text>
  <text x="240" y="113" font-size="11" fill="#444" filter="url(#rough2)">[1,<tspan fill="#2a6a2a" font-weight="bold">2</tspan>,·,·,·,·,·,·,·,·]</text>
  <text x="572" y="113" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- row 3: alloc(1,3)->2 -->
  <rect x="14" y="124" width="632" height="27" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="142" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="60" y="142" font-size="11" fill="#333" filter="url(#rough2)">allocate(1, 3)</text>
  <text x="240" y="142" font-size="11" fill="#444" filter="url(#rough2)">[1,2,<tspan fill="#2a6a2a" font-weight="bold">3</tspan>,·,·,·,·,·,·,·]</text>
  <text x="572" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- row 4: free(2)->1 -->
  <rect x="14" y="153" width="632" height="27" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="28" y="171" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="60" y="171" font-size="11" fill="#b85450" filter="url(#rough2)">freeMemory(2)</text>
  <text x="240" y="171" font-size="11" fill="#444" filter="url(#rough2)">[1,<tspan fill="#b85450" font-weight="bold">·</tspan>,3,·,·,·,·,·,·,·]</text>
  <text x="572" y="171" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- row 5: alloc(3,4)->3 -->
  <rect x="14" y="182" width="632" height="27" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="200" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="60" y="200" font-size="11" fill="#333" filter="url(#rough2)">allocate(3, 4)</text>
  <text x="240" y="200" font-size="11" fill="#444" filter="url(#rough2)">[1,·,3,<tspan fill="#2a6a2a" font-weight="bold">4,4,4</tspan>,·,·,·,·]</text>
  <text x="572" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- row 6: alloc(1,1)->1 -->
  <rect x="14" y="211" width="632" height="27" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="229" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="60" y="229" font-size="11" fill="#333" filter="url(#rough2)">allocate(1, 1)</text>
  <text x="240" y="229" font-size="11" fill="#444" filter="url(#rough2)">[1,<tspan fill="#2a6a2a" font-weight="bold">1</tspan>,3,4,4,4,·,·,·,·]</text>
  <text x="572" y="229" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- row 7: alloc(1,1)->6 -->
  <rect x="14" y="240" width="632" height="27" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="258" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="60" y="258" font-size="11" fill="#333" filter="url(#rough2)">allocate(1, 1)</text>
  <text x="240" y="258" font-size="11" fill="#444" filter="url(#rough2)">[1,1,3,4,4,4,<tspan fill="#2a6a2a" font-weight="bold">1</tspan>,·,·,·]</text>
  <text x="572" y="258" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <!-- row 8: free(1)->3 -->
  <rect x="14" y="269" width="632" height="27" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="28" y="287" font-size="11" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="60" y="287" font-size="11" fill="#b85450" filter="url(#rough2)">freeMemory(1)</text>
  <text x="240" y="287" font-size="11" fill="#444" filter="url(#rough2)">[<tspan fill="#b85450" font-weight="bold">·,·</tspan>,3,4,4,4,<tspan fill="#b85450" font-weight="bold">·</tspan>,·,·,·]</text>
  <text x="572" y="287" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- row 9: alloc(10,2)->-1 -->
  <rect x="14" y="298" width="632" height="27" rx="3" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="316" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <text x="60" y="316" font-size="11" fill="#555" filter="url(#rough2)">allocate(10, 2)</text>
  <text x="240" y="316" font-size="11" fill="#888" filter="url(#rough2)">[·,·,3,4,4,4,·,·,·,·]  （未变）</text>
  <text x="572" y="316" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- row 10: free(7)->0 -->
  <rect x="14" y="327" width="632" height="27" rx="3" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="345" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="60" y="345" font-size="11" fill="#555" filter="url(#rough2)">freeMemory(7)</text>
  <text x="240" y="345" font-size="11" fill="#888" filter="url(#rough2)">[·,·,3,4,4,4,·,·,·,·]  （未变）</text>
  <text x="572" y="345" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <!-- callout -->
  <rect x="14" y="362" width="632" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="381" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">第 5 步跳过中间已占段命中 idx3 起的 3 格；第 7 步从左到右跳过 idx2–5 命中 idx6；第 8 步一次释放 idx0/1/6 共 3 格（多个块同 mID）</text>
</svg>
