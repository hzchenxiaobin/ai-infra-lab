<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 顶部：状态三元组 -->
  <rect x="130" y="12" width="260" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">状态 = (mask, stage, side)</text>
  <text x="260" y="50" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">mask=营地人员集合 · stage=阶段 · side=船在哪岸</text>

  <!-- 营地 -->
  <rect x="36" y="86" width="150" height="116" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="111" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">营地（mask 的人）</text>
  <circle cx="70" cy="128" r="9" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="100" cy="128" r="9" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="130" cy="128" r="9" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="111" y="160" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">side = 0 时船停在这</text>
  <rect x="86" y="172" width="50" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="185" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">船 ≤ k 人</text>

  <!-- 对岸 -->
  <rect x="334" y="86" width="150" height="116" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="409" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">对岸（~mask 的人）</text>
  <circle cx="380" cy="128" r="9" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="438" cy="128" r="9" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">…</text>
  <text x="409" y="160" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">返回人 r 从这里挑（r ∉ mask）</text>
  <rect x="384" y="172" width="50" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="185" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">side = 1</text>

  <!-- 渡河边（橙） -->
  <path d="M 192 112 Q 260 96 328 112" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">渡河：选组 g ⊆ mask，|g| ≤ k</text>

  <!-- 返回边（红） -->
  <path d="M 328 176 Q 260 192 192 176" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回：恰 1 人 r 带船回来</text>

  <!-- 两条边的代价公式 -->
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = gmax[g] × mul[stage] ，rt = time[r] × mul[stage′]</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每次行动后 stage ← (stage + ⌊耗时⌋) mod m</text>

  <!-- 阶段时钟 -->
  <circle cx="128" cy="298" r="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">阶段时钟</text>
  <circle cx="128" cy="258" r="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="262" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="168" cy="298" r="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="128" cy="338" r="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="342" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="88" cy="298" r="11" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 140 266 Q 158 276 160 288" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="272" font-size="9.5" fill="#666" filter="url(#rough2)">每阶段一个倍率 mul[j]</text>
  <text x="196" y="285" font-size="9.5" fill="#666" filter="url(#rough2)">走 ⌊d⌋ mod m 步，循环不归零</text>

  <!-- 结论框 -->
  <rect x="268" y="268" width="236" height="82" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边权全为正 + 阶段取模循环</text>
  <text x="386" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">状态图有环 ⇒ 无拓扑序</text>
  <text x="386" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ Dijkstra：首次出堆即最优</text>
  <text x="386" y="340" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">k=1 且 n≥2：净迁移 0 人 → -1</text>
</svg>
