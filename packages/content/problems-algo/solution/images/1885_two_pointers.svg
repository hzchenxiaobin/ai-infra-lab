<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">排序 + 双指针计数：diff[left] + diff[right] &gt; 0 时按区间计数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">升序保证 left..right−1 配 right 全部合法，一次性计数 right − left 对</text>

  <!-- sorted diff array: [-2, 0, 0, 2] -->
  <text x="20" y="86" font-size="12" fill="#888">diff(已排序)：</text>
  <rect x="120" y="70" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="184" y="70" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="70" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="312" y="70" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="150" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="214" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="278" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="342" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>

  <!-- left pointer (blue) pointing to index 1 -->
  <path d="M 214 200 L 214 110" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="214" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left</text>

  <!-- right pointer (red) pointing to index 3 -->
  <path d="M 342 200 L 342 110" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="342" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">right</text>

  <!-- bracket showing left..right-1 all valid with right -->
  <path d="M 214 232 L 214 238 L 278 238 L 278 232" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="246" y="256" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">left..right−1 配 right 全合法</text>

  <!-- sum check box -->
  <rect x="60" y="276" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定：0 + 2 = 2 &gt; 0 ✓   →   count += right − left = 3 − 1 = 2</text>

  <!-- move rule box -->
  <rect x="60" y="314" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#444">diff[l] + diff[r] &gt; 0 → count += right − left, right −−</text>
  <text x="280" y="348" text-anchor="middle" font-size="11.5" fill="#444">diff[l] + diff[r] ≤ 0 → left++   （换更大的 left）</text>
</svg>
