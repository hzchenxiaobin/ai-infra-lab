<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">Promise.race：fn 与超时定时器竞速，先敲定者获胜</text>

  <!-- outer wrapper: timeLimit(fn, t) -->
  <rect x="200" y="48" width="240" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">limited = timeLimit(fn, t)</text>

  <path d="M 320 90 L 320 110" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Promise.race arena -->
  <rect x="60" y="116" width="520" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Promise.race([ ... ])</text>

  <!-- lane 1: fn(...args) -->
  <rect x="90" y="152" width="210" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="174" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">fn(...args)</text>
  <text x="195" y="194" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">真实异步任务</text>
  <text x="195" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">耗时未知</text>

  <!-- lane 2: timeout -->
  <rect x="340" y="152" width="210" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">timeout Promise</text>
  <text x="445" y="194" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">setTimeout(reject, t)</text>
  <text x="445" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t ms 后必 reject</text>

  <!-- VS in middle -->
  <circle cx="320" cy="188" r="16" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="193" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">VS</text>

  <!-- outcome arrows down -->
  <path d="M 195 226 L 195 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 445 226 L 445 252" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- outcome boxes -->
  <rect x="80" y="256" width="230" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">fn 先敲定 → resolve(result)</text>
  <text x="195" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">耗时 &lt; t，正常返回</text>

  <rect x="330" y="256" width="230" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">超时先到 → reject("TLE")</text>
  <text x="445" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">耗时 ≥ t，超时拒绝</text>

  <!-- key note -->
  <rect x="60" y="332" width="520" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不变式：race 的外层 Promise 由"第一个敲定"的内部 Promise 决定终态</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">另一条 Promise 无论之后如何敲定，都不会再改变外层状态（一次性）</text>
</svg>
