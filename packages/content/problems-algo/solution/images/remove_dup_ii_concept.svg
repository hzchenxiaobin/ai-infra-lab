<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：栈存 (字符, 计数)，凑满 k 即弹</text>

  <!-- Left: naive repeated scanning -->
  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">朴素做法：反复扫描</text>
  <rect x="40" y="72" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="90" text-anchor="middle" font-size="11" fill="#333">deeedbbcccbdaa</text>
  <text x="155" y="105" text-anchor="middle" font-size="10" fill="#b85450">删 "eee" → dddbbcccbdaa</text>

  <rect x="40" y="120" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="138" text-anchor="middle" font-size="11" fill="#333">dddbbcccbdaa</text>
  <text x="155" y="153" text-anchor="middle" font-size="10" fill="#b85450">删 "ccc" → dddbbbdaa</text>

  <rect x="40" y="168" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="186" text-anchor="middle" font-size="11" fill="#333">dddbbbdaa</text>
  <text x="155" y="201" text-anchor="middle" font-size="10" fill="#b85450">删 "bbb" → ddddaa …</text>

  <text x="155" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最坏 O(n²/k) 轮 × O(n) = O(n²)</text>
  <text x="155" y="244" text-anchor="middle" font-size="10" fill="#888">删除后两侧拼接，可能再凑出 k 个</text>

  <line x1="285" y1="220" x2="320" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">优化</text>

  <!-- Right: stack with (char,count) -->
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">栈做法：边走边数</text>

  <!-- stack boxes (char,count) -->
  <rect x="335" y="74" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <line x1="385" y1="78" x2="385" y2="104" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="96" text-anchor="middle" font-size="11" fill="#446688">cnt=1</text>
  <text x="478" y="96" font-size="10" fill="#888">栈底</text>

  <rect x="335" y="112" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <line x1="385" y1="116" x2="385" y2="142" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=2</text>

  <rect x="335" y="150" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <line x1="385" y1="154" x2="385" y2="180" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt=3=k</text>
  <text x="478" y="172" font-size="10" fill="#888">栈顶</text>

  <!-- pop arrow -->
  <path d="M 470 167 Q 510 150 500 120" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="525" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop!</text>
  <text x="525" y="160" text-anchor="middle" font-size="10" fill="#b85450">凑满 k 弹出</text>

  <!-- after pop, top becomes d -->
  <rect x="335" y="200" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#446688">弹出后栈顶又变 d</text>
  <text x="400" y="234" text-anchor="middle" font-size="10" fill="#888">下个 d 来了 cnt 续上 → 无需重扫</text>

  <!-- Bottom insight box -->
  <rect x="40" y="270" width="500" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么计数能省掉反复扫描？</text>
  <text x="60" y="316" font-size="11" fill="#555">• 删除 k 个 e 后，左右两侧的 d 拼接，可能再凑成新的 k 个 d。</text>
  <text x="60" y="336" font-size="11" fill="#555">• 栈里保留的 (d, cnt) 记录了左侧已有几个 d，新来的 d 直接 cnt+1，</text>
  <text x="60" y="352" font-size="11" fill="#555">  一旦 cnt==k 立刻弹出——拼接后的“连锁删除”被自然吸收进单次遍历。</text>
  <text x="60" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">→ 一次遍历 O(n) 搞定，每个字符至多入栈/出栈各一次。</text>
</svg>
