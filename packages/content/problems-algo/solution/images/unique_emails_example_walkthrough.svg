<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 封邮件 → 规范化 → 2 个唯一地址</text>

  <!-- Row labels -->
  <text x="24" y="62" font-size="12" fill="#888">邮件①</text>
  <text x="24" y="158" font-size="12" fill="#888">邮件②</text>
  <text x="24" y="254" font-size="12" fill="#888">邮件③</text>

  <!-- Email 1 -->
  <rect x="80" y="44" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="12" fill="#333">test.email+alex@leetcode.com</text>
  <rect x="80" y="78" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="330" y="94" text-anchor="middle" font-size="12" fill="#333">→ testemail@leetcode.com</text>
  <path d="M 330 104 L 330 122" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Email 2 -->
  <rect x="80" y="140" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#333">test.e.mail+bob.cathy@leetcode.com</text>
  <rect x="80" y="174" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="330" y="190" text-anchor="middle" font-size="12" fill="#333">→ testemail@leetcode.com  （同①）</text>
  <path d="M 330 200 L 330 218" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Email 3 -->
  <rect x="80" y="236" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="12" fill="#333">testemail+david@lee.tcode.com</text>
  <rect x="80" y="270" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="330" y="286" text-anchor="middle" font-size="12" fill="#333">→ testemail@lee.tcode.com  （domain 不同）</text>
  <path d="M 330 296 L 330 314" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Set box -->
  <text x="24" y="340" font-size="12" fill="#888">哈希集合:</text>
  <rect x="80" y="322" width="500" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="100" y="334" width="220" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="350" text-anchor="middle" font-size="12" fill="#333">testemail@leetcode.com</text>
  <rect x="100" y="360" width="220" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="376" text-anchor="middle" font-size="12" fill="#333">testemail@lee.tcode.com</text>
  <text x="350" y="356" font-size="12" fill="#4a7a3a">邮件①② 落同一条目</text>
  <text x="350" y="376" font-size="12" fill="#4a7a3a">邮件③ 单独一条</text>

  <!-- Result -->
  <rect x="150" y="396" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="416" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回集合大小 = 2</text>
  <text x="300" y="430" text-anchor="middle" font-size="11" fill="#666">|set| = 2</text>

  <!-- note -->
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#888">注意：domain 里的 . 不可删（lee.tcode 保留原样）</text>
</svg>
