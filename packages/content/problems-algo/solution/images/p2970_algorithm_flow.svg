<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="448" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两趟预处理 + 枚举端点 + O(1) 判定</text>

  <!-- Box A: preprocess -->
  <rect x="150" y="46" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理 incPre / incSuf</text>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（从左、从右各线性扫一遍）</text>

  <path d="M 260 94 L 260 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box B: enumerate -->
  <rect x="150" y="114" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">双重循环枚举子数组 [l, r]</text>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">（l ≤ r，共 n(n+1)/2 个）</text>

  <path d="M 260 158 L 260 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,180 368,232 260,284 152,232" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">三个条件</text>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">同时成立？</text>

  <!-- side note -->
  <rect x="14" y="188" width="126" height="112" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="77" y="208" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">判定条件</text>
  <text x="77" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 前缀递增或空</text>
  <text x="77" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 后缀递增或空</text>
  <text x="77" y="268" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③ 拼接不断崖</text>
  <text x="77" y="288" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">nums[l-1]&lt;nums[r+1]</text>

  <!-- yes branch -->
  <path d="M 260 284 L 260 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="300" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Box C: count -->
  <rect x="195" y="306" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- no branch -->
  <path d="M 368 232 L 430 232 L 430 352" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="382" y="224" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- loop-back bus -->
  <path d="M 430 352 L 76 352 L 76 138 L 146 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 340 L 260 352" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="100" y="346" font-size="10.5" fill="#888" filter="url(#rough2)">下一个 (l, r)</text>

  <!-- exit branch -->
  <path d="M 370 136 L 468 136 L 468 378" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="474" y="252" font-size="10.5" fill="#888" filter="url(#rough2)">全部试完</text>

  <!-- final box -->
  <rect x="388" y="380" width="124" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="407" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
