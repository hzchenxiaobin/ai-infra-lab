<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>

  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一次遍历建边 + 一次扫描找根</text>
  <path d="M 180 40 Q 350 48 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="350" cy="74" rx="46" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="350" y="79" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始</text>
  <path d="M 350 92 L 350 108" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="220" y="112" width="260" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="350" y="132" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">nodes = {}（val→TreeNode*）</text>
  <text x="350" y="148" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">children = {}（被当 child 的值集）</text>
  <path d="M 350 156 L 350 172" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 循环头 -->
  <g filter="url(#sk)"><rect x="200" y="176" width="300" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="350" y="196" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">for [p, c, isLeft] in descriptions</text>

  <!-- 循环体大框 -->
  <g filter="url(#sk)"><rect x="120" y="220" width="460" height="160" rx="8" fill="#fffdf5" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 4"/></g>
  <text x="140" y="240" font-size="10" fill="#888" font-weight="bold">循环体（每条边做 5 个原子动作）</text>

  <g filter="url(#sk)"><rect x="140" y="250" width="420" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="150" y="266" font-size="11" fill="#2b6e9e">① 若 p 不在 nodes：nodes[p] = new TreeNode(p)</text>

  <g filter="url(#sk)"><rect x="140" y="276" width="420" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="150" y="292" font-size="11" fill="#2b6e9e">② 若 c 不在 nodes：nodes[c] = new TreeNode(c)</text>

  <g filter="url(#sk)"><rect x="140" y="302" width="420" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="150" y="318" font-size="11" fill="#b85450" font-weight="bold">③ isLeft==1 → p.left = nodes[c]；否则 p.right = nodes[c]</text>

  <g filter="url(#sk)"><rect x="140" y="328" width="420" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="150" y="344" font-size="11" fill="#2e6e2e" font-weight="bold">④ children.insert(c)   ⚠️ 易漏，决定找根成败</text>

  <text x="350" y="372" text-anchor="middle" font-size="10" fill="#888">原子动作：建节点 / 连指针 / 标 child 三合一</text>

  <!-- 循环回边 -->
  <path d="M 580 290 Q 620 290 620 192 L 500 192" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="624" y="244" font-size="10" fill="#888">下一条边</text>

  <path d="M 350 380 L 350 398" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 找根阶段 -->
  <g filter="url(#sk)"><rect x="190" y="402" width="320" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="350" y="421" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">for [v, node] in nodes：找根</text>
  <path d="M 350 430 L 350 448" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定菱形 -->
  <g filter="url(#sk)"><polygon points="350,452 440,488 350,524 260,488" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="350" y="484" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v ∈ children ?</text>
  <text x="350" y="500" text-anchor="middle" font-size="10" fill="#b85450">(有父吗)</text>

  <!-- yes 回边 -->
  <path d="M 260 488 Q 180 488 180 416 L 190 416" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="452" font-size="11" fill="#2e6e2e" font-weight="bold">是 →</text>
  <text x="120" y="468" font-size="10" fill="#888">继续扫下一个</text>

  <!-- no 分支 -->
  <path d="M 440 488 Q 520 488 520 460 L 520 416" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="528" y="452" font-size="11" fill="#b85450" font-weight="bold">否 →</text>
  <text x="528" y="468" font-size="10" fill="#b85450">根！返回 node</text>

  <path d="M 520 416 L 460 416" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
</svg>
