<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">max(↑增, ↓减) 呈 V 形：谷底即最优扔蛋楼层</text>

  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="272" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="88" y1="270" x2="432" y2="270" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="82" y="64" text-anchor="end" font-size="9" fill="#888">次数</text>
  <text x="436" y="284" font-size="10" fill="#888">楼层 x</text>

  <!-- y labels: 0..5 at py 270,232,194,156,118,80 -->
  <text x="82" y="274" text-anchor="end" font-size="9" fill="#aaa">0</text>
  <text x="82" y="236" text-anchor="end" font-size="9" fill="#aaa">1</text>
  <text x="82" y="198" text-anchor="end" font-size="9" fill="#aaa">2</text>
  <text x="82" y="160" text-anchor="end" font-size="9" fill="#aaa">3</text>
  <text x="82" y="122" text-anchor="end" font-size="9" fill="#aaa">4</text>
  <text x="82" y="84" text-anchor="end" font-size="9" fill="#aaa">5</text>

  <!-- gridlines (faint) -->
  <line x1="90" y1="232" x2="430" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="90" y1="194" x2="430" y2="194" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="90" y1="156" x2="430" y2="156" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- x labels: 1..6 at px 120,176,232,288,344,400 -->
  <text x="120" y="286" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="176" y="286" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="232" y="286" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="288" y="286" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="344" y="286" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="400" y="286" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- red increasing f1 = dp[k-1][x-1]: (120,270)(176,232)(232,194)(288,156)(344,118)(400,80) -->
  <path d="M 120 270 L 176 232 L 232 194 L 288 156 L 344 118 L 400 80" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="120" cy="270" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="176" cy="232" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="232" cy="194" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="288" cy="156" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="344" cy="118" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="400" cy="80" r="3" fill="#b85450" filter="url(#rough2)"/>

  <!-- green decreasing f2 = dp[k][n-x]: (120,156)(176,156)(232,194)(288,194)(344,232)(400,270) -->
  <path d="M 120 156 L 176 156 L 232 194 L 288 194 L 344 232 L 400 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="117" y="153" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="173" y="153" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="229" y="191" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="285" y="191" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="341" y="229" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="397" y="267" width="6" height="6" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- orange V-shape = max(f1,f2): (120,156)(176,156)(232,194)(288,156)(344,118)(400,80) -->
  <path d="M 120 156 L 176 156 L 232 194 L 288 156 L 344 118 L 400 80" stroke="#d6a040" stroke-width="2.5" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <!-- crossing point marker at x=3 (232,194) -->
  <circle cx="232" cy="194" r="6" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="232" y1="200" x2="232" y2="268" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="232" y="300" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x* = 3 (谷底)</text>

  <!-- annotations on left/right regions -->
  <text x="150" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a">f2 主导, max 递减</text>
  <text x="360" y="100" text-anchor="middle" font-size="9" fill="#b85450">f1 主导, max 递增</text>

  <!-- legend -->
  <rect x="380" y="44" width="8" height="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="394" y="52" font-size="9" fill="#b85450">f1 = dp[k−1][x−1] ↑</text>
  <rect x="380" y="56" width="8" height="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="394" y="64" font-size="9" fill="#4a7a3a">f2 = dp[k][n−x] ↓</text>

  <!-- bottom binary search box -->
  <rect x="60" y="312" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">二分找首个 x 使 f1(x) ≥ f2(x)，谷底在 x* 与 x*−1 之间</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#888">复杂度 O(kn log n)：外层 kn 个状态 × 内层二分 log n</text>
</svg>
