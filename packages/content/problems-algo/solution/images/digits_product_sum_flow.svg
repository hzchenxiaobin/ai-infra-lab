<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍循环逐位取模，同时累乘与累加</text>

  <!-- Step 1: 初始化 -->
  <rect x="40" y="46" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#b85450" font-weight="bold">步骤 1：初始化</text>
  <text x="60" y="84" font-size="11" fill="#444">product = 1（累乘恒等元），sum = 0（累加恒等元）</text>
  <text x="60" y="98" font-size="10" fill="#888">注意：product 不能初始化为 0，否则恒为 0；sum 不能初始化为 1，否则多算一位</text>

  <path d="M 280 104 L 280 124" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 循环 -->
  <rect x="40" y="128" width="480" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="148" font-size="12" fill="#446688" font-weight="bold">步骤 2：逐位循环（n = 0 时停止）</text>
  <text x="60" y="168" font-size="11" fill="#444" font-family="monospace">while (n &gt; 0) {</text>
  <text x="80" y="186" font-size="11" fill="#444" font-family="monospace">digit = n % 10;        // 取末位</text>
  <text x="80" y="204" font-size="11" fill="#444" font-family="monospace">product = product * digit;   // 累乘</text>
  <text x="80" y="222" font-size="11" fill="#444" font-family="monospace">sum = sum + digit;     // 累加</text>
  <text x="80" y="238" font-size="11" fill="#444" font-family="monospace">n = n / 10;            // 截短原数</text>

  <path d="M 280 248 L 280 268" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 返回 -->
  <rect x="40" y="272" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="292" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：返回积与和之差</text>
  <text x="60" y="310" font-size="11" fill="#444">return product − sum</text>
  <text x="60" y="324" font-size="10" fill="#888">循环中 product 与 sum 同步增长，无需遍历两次</text>

  <path d="M 280 332 L 280 352" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="356" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一遍遍历，O(log n) 时间 / O(1) 空间</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">循环次数 = 数字位数</text>
</svg>
