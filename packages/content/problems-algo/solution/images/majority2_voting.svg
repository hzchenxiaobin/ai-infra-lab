<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双候选 Boyer-Moore 投票：四种情况</text>

  <!-- Case 1: x == cand1 (top-left, green) -->
  <rect x="20" y="46" width="250" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情况一：x == cand1</text>
  <text x="145" y="90" text-anchor="middle" font-size="11" fill="#555">遇到候选 1 的盟友</text>
  <rect x="60" y="104" width="170" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="125" text-anchor="middle" font-size="11" fill="#333">cand1 不变</text>
  <text x="145" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cnt1 += 1</text>
  <text x="145" y="174" text-anchor="middle" font-size="10.5" fill="#888">盟友加入，票数 +1</text>
  <text x="145" y="194" text-anchor="middle" font-size="10" fill="#888">cnt2 不变</text>

  <!-- Case 2: x == cand2 (top-right, blue) -->
  <rect x="290" y="46" width="250" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">情况二：x == cand2</text>
  <text x="415" y="90" text-anchor="middle" font-size="11" fill="#555">遇到候选 2 的盟友</text>
  <rect x="330" y="104" width="170" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="125" text-anchor="middle" font-size="11" fill="#333">cand2 不变</text>
  <text x="415" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">cnt2 += 1</text>
  <text x="415" y="174" text-anchor="middle" font-size="10.5" fill="#888">盟友加入，票数 +1</text>
  <text x="415" y="194" text-anchor="middle" font-size="10" fill="#888">cnt1 不变</text>

  <!-- Case 3: empty slot (bottom-left, orange) -->
  <rect x="20" y="226" width="250" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情况三：有空槽</text>
  <text x="145" y="270" text-anchor="middle" font-size="11" fill="#555">cnt1==0 或 cnt2==0</text>
  <rect x="60" y="284" width="170" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="305" text-anchor="middle" font-size="11" fill="#333">cand = x（占坑）</text>
  <text x="145" y="334" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">cnt = 1</text>
  <text x="145" y="354" text-anchor="middle" font-size="10.5" fill="#888">新元素立山头</text>
  <text x="145" y="374" text-anchor="middle" font-size="10" fill="#888">先查 cnt1==0 再查 cnt2==0</text>

  <!-- Case 4: both decrement (bottom-right, red) -->
  <rect x="290" y="226" width="250" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况四：三方混战</text>
  <text x="415" y="270" text-anchor="middle" font-size="11" fill="#555">x 不匹配任一候选</text>
  <text x="415" y="290" text-anchor="middle" font-size="11" fill="#555">且两个槽都有人</text>
  <rect x="330" y="300" width="170" height="32" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="321" text-anchor="middle" font-size="11" fill="#333">两个候选不变</text>
  <text x="415" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt1 -= 1, cnt2 -= 1</text>
  <text x="415" y="370" text-anchor="middle" font-size="10.5" fill="#888">一敌抵消两个阵营各一</text>

  <!-- Footer -->
  <rect x="40" y="400" width="480" height="24" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#888">检查顺序：==cand1 → ==cand2 → cnt1==0 → cnt2==0 → 双减</text>
</svg>
