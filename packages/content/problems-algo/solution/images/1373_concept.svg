<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">后序返回四元组 (isBST, min, max, sum)：一趟判定 BST + 累加和</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">BST 合法性只需 node.val &gt; left.max 且 node.val &lt; right.min（两子树均 BST 的前提下）</text>

  <!-- ===== Center: node X with two subtree clouds ===== -->
  <text x="310" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 递归左右子树，各拿一个四元组</text>

  <!-- left subtree cloud -->
  <path d="M 130 150 Q 95 120 110 165 Q 80 175 120 185 Q 100 210 145 195 Q 175 210 165 180 Q 195 170 160 150 Q 150 125 130 150 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左子树</text>

  <!-- right subtree cloud -->
  <path d="M 470 150 Q 435 120 450 165 Q 420 175 460 185 Q 440 210 485 195 Q 515 210 505 180 Q 535 170 500 150 Q 490 125 470 150 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右子树</text>

  <!-- node X -->
  <circle cx="310" cy="110" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">X</text>

  <!-- edges -->
  <line x1="295" y1="124" x2="160" y2="158" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="325" y1="124" x2="460" y2="158" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- return arrows from subtrees -->
  <path d="M 160 200 L 220 235" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 460 200 L 400 235" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- left return tuple box -->
  <rect x="150" y="240" width="170" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(isBST, Lmin, Lmax, Lsum)</text>

  <!-- right return tuple box -->
  <rect x="300" y="240" width="170" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(isBST, Rmin, Rmax, Rsum)</text>

  <!-- ===== BST condition ===== -->
  <text x="310" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② BST 合法性判定（核心）</text>

  <rect x="50" y="304" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">isBST = L.isBST ∧ R.isBST ∧ (X &gt; Lmax) ∧ (X &lt; Rmin)</text>

  <!-- ===== combine: if valid ===== -->
  <rect x="50" y="346" width="520" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">③ 若 isBST：</text>
  <text x="70" y="386" font-size="11" fill="#333" font-family="monospace">min = min(X, Lmin)   max = max(X, Rmax)   sum = X + Lsum + Rsum</text>
  <text x="70" y="400" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">best = max(best, sum)   // 全局最大 BST 子树和</text>
</svg>
