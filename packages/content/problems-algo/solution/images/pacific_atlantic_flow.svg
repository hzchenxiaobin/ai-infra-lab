<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两轮反向 DFS 求 P、A，取交集即答案</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. start -->
    <rect x="170" y="50" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="68" text-anchor="middle" fill="#446688" font-weight="bold">初始化</text>
    <text x="280" y="83" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">pac / atl 两个布尔矩阵，初值 false</text>

    <!-- split arrows -->
    <path d="M 250 92 L 250 104 L 145 104 L 145 116" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
    <path d="M 310 92 L 310 104 L 415 104 L 415 116" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)"/>

    <!-- ===== Left branch: Pacific ===== -->
    <rect x="40" y="118" width="210" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="145" y="136" text-anchor="middle" fill="#446688" font-weight="bold">太平洋边界格</text>
    <text x="145" y="151" text-anchor="middle" fill="#555" font-size="10">第 0 行 + 第 0 列作起点</text>

    <path d="M 145 160 L 145 174" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <rect x="30" y="176" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="145" y="196" text-anchor="middle" fill="#446688" font-weight="bold">DFS 逆流标记 pac</text>
    <text x="145" y="212" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">pac[i][j]=1</text>
    <text x="145" y="225" text-anchor="middle" fill="#555" font-size="10">递归 height≥当前 且未访问邻居</text>

    <path d="M 145 234 L 145 250" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <rect x="50" y="252" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="145" y="274" text-anchor="middle" fill="#446688" font-weight="bold">得到太平洋可达集 P</text>

    <!-- ===== Right branch: Atlantic ===== -->
    <rect x="310" y="118" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="415" y="136" text-anchor="middle" fill="#d6a040" font-weight="bold">大西洋边界格</text>
    <text x="415" y="151" text-anchor="middle" fill="#555" font-size="10">末行 + 末列作起点</text>

    <path d="M 415 160 L 415 174" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <rect x="300" y="176" width="230" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="415" y="196" text-anchor="middle" fill="#d6a040" font-weight="bold">DFS 逆流标记 atl</text>
    <text x="415" y="212" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">atl[i][j]=1</text>
    <text x="415" y="225" text-anchor="middle" fill="#555" font-size="10">递归 height≥当前 且未访问邻居</text>

    <path d="M 415 234 L 415 250" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <rect x="320" y="252" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="415" y="274" text-anchor="middle" fill="#d6a040" font-weight="bold">得到大西洋可达集 A</text>

    <!-- converge to intersection -->
    <path d="M 145 288 L 145 308 L 280 308 L 280 322" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 415 288 L 415 308 L 280 308" stroke="#4a7a3a" stroke-width="1.3" fill="none"/>

    <!-- intersection diamond -->
    <polygon points="280,324 380,354 280,384 180,354" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="350" text-anchor="middle" fill="#4a7a3a" font-weight="bold">遍历所有 (i,j)</text>
    <text x="280" y="366" text-anchor="middle" fill="#4a7a3a" font-size="10">pac[i][j] &amp;&amp; atl[i][j] ?</text>

    <!-- yes -> answer -->
    <path d="M 280 386 L 280 402" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="296" y="398" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="190" y="404" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="280" y="419" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="11">加入答案 [i, j]</text>
  </g>
</svg>
