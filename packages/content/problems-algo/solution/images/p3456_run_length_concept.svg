<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：合法子串 ⇔ 存在长度恰好为 k 的连续段</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按「连续相同字符」把 s 切段（run-length 分组），段外邻居必然异色</text>

  <!-- ===== 正例区 ===== -->
  <text x="40" y="66" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 例：s = "aaabaaa", k = 3</text>

  <!-- 7 格：aaa | b | aaa -->
  <g filter="url(#rough2)">
    <rect x="90"  y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="130" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="170" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="210" y="74" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="290" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="110" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="150" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="190" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="230" y="98" text-anchor="middle" font-size="15" fill="#333">b</text>
    <text x="270" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="310" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
    <text x="350" y="98" text-anchor="middle" font-size="15" fill="#333">a</text>
  </g>
  <!-- 段长标注 -->
  <g filter="url(#rough2)">
    <text x="150" y="130" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">L=3 ✓</text>
    <text x="230" y="130" text-anchor="middle" font-size="10" fill="#55677d">L=1</text>
    <text x="310" y="130" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">L=3 ✓</text>
  </g>
  <!-- 正例结论框 -->
  <g filter="url(#rough2)">
    <rect x="386" y="72" width="124" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="448" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">存在 L=3 的段</text>
    <text x="448" y="110" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">→ 返回 true</text>
  </g>

  <!-- ===== 反例区 ===== -->
  <text x="40" y="170" font-size="11.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">✗ 反例：s = "aaaa", k = 2（唯一段 L=4 &gt; k）</text>

  <!-- 行1：贴左边界 -->
  <text x="36" y="202" font-size="10" fill="#55677d" filter="url(#rough2)">取贴左边界</text>
  <g filter="url(#rough2)">
    <rect x="128" y="182" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="162" y="182" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="196" y="182" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="230" y="182" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <text x="144" y="200" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="178" y="200" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="212" y="200" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="246" y="200" text-anchor="middle" font-size="13" fill="#333">a</text>
    <path d="M 232 195 L 254 195" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none"/>
    <text x="286" y="200" font-size="10" fill="#8f3a35">右邻 s[2]='a' 相同 → ✗</text>
  </g>

  <!-- 行2：取中间 -->
  <text x="36" y="242" font-size="10" fill="#55677d" filter="url(#rough2)">取中间</text>
  <g filter="url(#rough2)">
    <rect x="128" y="222" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="162" y="222" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="196" y="222" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="230" y="222" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <text x="144" y="240" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="178" y="240" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="212" y="240" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="246" y="240" text-anchor="middle" font-size="13" fill="#333">a</text>
    <path d="M 196 235 L 174 235" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none"/>
    <path d="M 226 235 L 248 235" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none"/>
    <text x="286" y="240" font-size="10" fill="#8f3a35">左右邻居都是 'a' → ✗</text>
  </g>

  <!-- 行3：贴右边界 -->
  <text x="36" y="282" font-size="10" fill="#55677d" filter="url(#rough2)">取贴右边界</text>
  <g filter="url(#rough2)">
    <rect x="128" y="262" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="162" y="262" width="32" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="196" y="262" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="230" y="262" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="144" y="280" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="178" y="280" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="212" y="280" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="246" y="280" text-anchor="middle" font-size="13" fill="#333">a</text>
    <path d="M 192 275 L 170 275" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none"/>
    <text x="286" y="280" font-size="10" fill="#8f3a35">左邻 s[1]='a' 相同 → ✗</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="52" y="310" width="212" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="158" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3a35">L &gt; k：贴边 / 居中都被同字符挡住</text>
    <text x="158" y="348" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3a35">L &lt; k：长度不够 → 都不行</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="284" y="310" width="212" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="390" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">L == k：整段即子串</text>
    <text x="390" y="348" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">两侧邻居必然不同 → 唯一可行 ✓</text>
  </g>
</svg>
