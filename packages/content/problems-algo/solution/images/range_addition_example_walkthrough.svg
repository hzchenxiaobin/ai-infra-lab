<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：length=5, updates = [[1,3,2],[2,4,3],[0,2,−2]]</text>

  <!-- header: index labels 0..5 -->
  <text x="40" y="56" font-size="11" fill="#888">下标 →</text>
  <rect x="120" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="59" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="180" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="59" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="240" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="300" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="59" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="360" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="59" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="420" y="42" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#b85450">5=n</text>

  <!-- row 0: initial -->
  <text x="40" y="92" font-size="11" fill="#888">初始 diff</text>
  <rect x="120" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="180" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="300" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="360" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="420" y="78" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 1: +[1,3,2] -->
  <text x="40" y="126" font-size="11" fill="#888">+[1,3,2]</text>
  <rect x="120" y="112" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="180" y="112" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="240" y="112" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="300" y="112" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="360" y="112" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="420" y="112" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 2: +[2,4,3] -->
  <text x="40" y="160" font-size="11" fill="#888">+[2,4,3]</text>
  <rect x="120" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="180" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="163" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="240" y="146" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="300" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="360" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="163" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="420" y="146" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−3</text>

  <!-- row 3: +[0,2,-2] (final diff) -->
  <text x="40" y="194" font-size="11" fill="#888" font-weight="bold">+[0,2,−2]</text>
  <rect x="120" y="180" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−2</text>
  <rect x="180" y="180" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="197" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="240" y="180" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="300" y="180" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="360" y="180" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="197" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="420" y="180" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="#333">−3</text>

  <!-- separator -->
  <path d="M 110 218 L 490 218" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="500" y="222" font-size="10" fill="#d6a040" font-weight="bold">前缀和</text>

  <!-- answer row: ans[0..4] -->
  <text x="40" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">answer</text>
  <rect x="120" y="234" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="180" y="234" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="240" y="234" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="300" y="234" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="234" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- index 5 ignored -->
  <rect x="420" y="234" width="60" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="253" text-anchor="middle" font-size="10" fill="#bbb">忽略</text>

  <!-- verification -->
  <rect x="60" y="284" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#444">前缀和：ans[i] = ans[i−1] + diff[i]（ans[0]=diff[0]）</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333">−2 → 0 → 3 → 5 → 3</text>
  <text x="280" y="349" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">answer = [−2, 0, 3, 5, 3]  ✓</text>
</svg>
