<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：只看「是否含 1」</text>

  <!-- Start node -->
  <g filter="url(#rough2)">
    <rect x="180" y="56" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="20"/>
  </g>
  <text x="280" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">统计 s、target 中是否含有 1</text>

  <line x1="280" y1="98" x2="280" y2="128" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Single decision: equivalence -->
  <g filter="url(#rough2)">
    <polygon points="280,130 440,195 280,260 120,195" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="190" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">(s 含 1) ⟺ (target 含 1) ?</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两方「有没有 1」是否一致</text>

  <!-- Left: Yes -> true -->
  <text x="95" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <line x1="120" y1="195" x2="75" y2="195" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="75" y1="195" x2="75" y2="320" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="75" y1="320" x2="115" y2="320" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="115" y="300" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="180" y="326" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true ✓</text>

  <!-- Right: No -> false -->
  <text x="465" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <line x1="440" y1="195" x2="485" y2="195" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="485" y1="195" x2="485" y2="320" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="485" y1="320" x2="445" y2="320" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="315" y="300" width="130" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="380" y="326" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">false ✗</text>

  <!-- Bottom note box -->
  <g filter="url(#rough2)">
    <rect x="55" y="360" width="450" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="386" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">「是」= 两种情形：① 两方都全 0；② 两方都至少含一个 1</text>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">「否」= 一方全 0、另一方含 1（造不出 1 / 灭不掉 1）</text>
</svg>
