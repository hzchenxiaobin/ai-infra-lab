<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：去括号 → 枚举切点 → 各自生成 → 笛卡尔积</text>

  <!-- step 1 -->
  <rect x="140" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 去掉首尾括号，得到数字串 t</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">"(00011)" → "00011"，长度 n</text>

  <path d="M 260 88 L 260 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="120" y="102" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 枚举切点 i = 1 … n−1</text>
  <text x="260" y="138" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x 部 = t[0:i]，y 部 = t[i:n]，两部分均非空</text>

  <path d="M 260 146 L 260 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: generate valid -->
  <rect x="60" y="160" width="400" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 对 x 部和 y 部分别生成所有合法表示</text>
  <text x="80" y="204" font-size="11" fill="#444" filter="url(#rough2)">整数形式：len==1 或 首位≠'0' → 直接取原串</text>
  <text x="80" y="222" font-size="11" fill="#444" filter="url(#rough2)">小数形式：插小数点于位置 k，整数部合法 且 小数部末位≠'0'</text>
  <text x="80" y="236" font-size="10" fill="#888" filter="url(#rough2)">→ 得到合法集合 left[] 和 right[]</text>

  <path d="M 260 240 L 260 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: cartesian product -->
  <rect x="80" y="254" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 笛卡尔积：left × right</text>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">for x in left:  for y in right:  res.append("(x, y)")</text>

  <path d="M 260 310 L 260 322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="140" y="324" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ 返回所有合法坐标对</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">注意逗号后有一个空格</text>

  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">复杂度：时间 O(n³) · 空间 O(输出大小)，n ≤ 12 极小</text>
</svg>
