<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Hopper 公司查询 II：两表 JOIN → 月度均值（AVG + ROUND）</text>

  <!-- ===== 左侧两张表 ===== -->

  <!-- Rides 表（左上） -->
  <text x="80" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Rides 表</text>
  <rect x="18" y="64" width="124" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="36" y="79" text-anchor="middle" font-size="8" fill="#333">ride_id</text>
  <text x="72" y="79" text-anchor="middle" font-size="8" fill="#333">user_id</text>
  <text x="106" y="79" text-anchor="middle" font-size="8" fill="#333">requested_at</text>
  <rect x="18" y="86" width="124" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="98" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="72" y="98" text-anchor="middle" font-size="8.5" fill="#333">63</text>
  <text x="106" y="98" text-anchor="middle" font-size="8.5" fill="#333">2020-3-4</text>
  <rect x="18" y="102" width="124" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="114" text-anchor="middle" font-size="8.5" fill="#333">20</text>
  <text x="72" y="114" text-anchor="middle" font-size="8.5" fill="#333">81</text>
  <text x="106" y="114" text-anchor="middle" font-size="8.5" fill="#333">2020-11-2</text>
  <text x="80" y="130" text-anchor="middle" font-size="9" fill="#888">…（提供 requested_at）</text>

  <!-- AcceptedRides 表（左下） -->
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AcceptedRides 表</text>
  <rect x="18" y="164" width="124" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="36" y="179" text-anchor="middle" font-size="7.5" fill="#333">ride_id</text>
  <text x="66" y="179" text-anchor="middle" font-size="7.5" fill="#333">driver_id</text>
  <text x="95" y="179" text-anchor="middle" font-size="7.5" fill="#333">distance</text>
  <text x="121" y="179" text-anchor="middle" font-size="7.5" fill="#333">duration</text>
  <rect x="18" y="186" width="124" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="198" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="66" y="198" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="95" y="198" text-anchor="middle" font-size="8.5" fill="#333">63</text>
  <text x="121" y="198" text-anchor="middle" font-size="8.5" fill="#333">38</text>
  <rect x="18" y="202" width="124" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="214" text-anchor="middle" font-size="8.5" fill="#333">20</text>
  <text x="66" y="214" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="95" y="214" text-anchor="middle" font-size="8.5" fill="#333">121</text>
  <text x="121" y="214" text-anchor="middle" font-size="8.5" fill="#333">92</text>
  <text x="80" y="230" text-anchor="middle" font-size="9" fill="#888">…（提供 distance/duration）</text>

  <!-- ===== JOIN 区域 ===== -->
  <path d="M145 100 L195 165" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M145 198 L195 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="178" y="158" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">JOIN</text>
  <text x="178" y="170" text-anchor="middle" font-size="8" fill="#888">ON ride_id</text>

  <!-- ===== 月度均值计算框（右中） ===== -->
  <path d="M205 175 L228 175" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="230" y="120" width="200" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">月度均值（按月分组）</text>
  <text x="240" y="162" font-size="9.5" fill="#b85450">AVG(ride_distance)</text>
  <text x="240" y="178" font-size="9.5" fill="#b85450">AVG(ride_duration)</text>
  <text x="240" y="194" font-size="9.5" fill="#b85450">WHERE YEAR=2020</text>
  <text x="240" y="210" font-size="9.5" fill="#b85450">GROUP BY MONTH</text>
  <text x="330" y="230" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ 仅 6 行（有接单月）</text>

  <!-- ===== 补零 + 取整（右上下） ===== -->
  <rect x="450" y="120" width="172" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="536" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">补零 + 取整</text>
  <text x="460" y="162" font-size="9.5" fill="#d6a040">months LEFT JOIN</text>
  <text x="460" y="178" font-size="9.5" fill="#d6a040">accepted_monthly</text>
  <text x="460" y="194" font-size="9.5" fill="#d6a040">COALESCE(avg, 0)</text>
  <text x="460" y="210" font-size="9.5" fill="#d6a040">ROUND(…, 2)</text>
  <text x="536" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ 补全 12 行</text>

  <path d="M430 180 L450 180" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== 12 个月时间轴（底部） ===== -->
  <rect x="30" y="258" width="580" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2020 年 12 个月输出（month: 1→12，格式：avg_dist / avg_dur）</text>

  <g filter="url(#rough2)">
    <rect x="46" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="67" y="304" text-anchor="middle" font-size="9" fill="#333">1月</text>
    <rect x="90" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="111" y="304" text-anchor="middle" font-size="9" fill="#333">2月</text>
    <rect x="134" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="155" y="304" text-anchor="middle" font-size="9" fill="#333">3月</text>
    <rect x="178" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="199" y="304" text-anchor="middle" font-size="9" fill="#333">4月</text>
    <rect x="222" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="243" y="304" text-anchor="middle" font-size="9" fill="#333">5月</text>
    <rect x="266" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="287" y="304" text-anchor="middle" font-size="9" fill="#333">6月</text>
    <rect x="310" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="331" y="304" text-anchor="middle" font-size="9" fill="#333">7月</text>
    <rect x="354" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="375" y="304" text-anchor="middle" font-size="9" fill="#333">8月</text>
    <rect x="398" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="419" y="304" text-anchor="middle" font-size="9" fill="#333">9月</text>
    <rect x="442" y="290" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="463" y="304" text-anchor="middle" font-size="9" fill="#333">10月</text>
    <rect x="486" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="507" y="304" text-anchor="middle" font-size="9" fill="#333">11月</text>
    <rect x="530" y="290" width="42" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="551" y="304" text-anchor="middle" font-size="9" fill="#333">12月</text>
  </g>

  <text x="67" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="111" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="155" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">63/38</text>
  <text x="199" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="243" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="287" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">73/96</text>
  <text x="331" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">100/28</text>
  <text x="375" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">119/68</text>
  <text x="419" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="463" y="324" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0/0</text>
  <text x="507" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">81.5/96.5</text>
  <text x="551" y="324" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">6/38</text>

  <text x="320" y="352" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">11 月特写：两单 → 取均值</text>
  <rect x="150" y="362" width="340" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="170" y="380" font-size="9.5" fill="#333">ride 20: dist=121, dur=92</text>
  <text x="170" y="396" font-size="9.5" fill="#333">ride  5: dist= 42, dur=101</text>
  <text x="360" y="380" font-size="9.5" fill="#b85450" font-weight="bold">avg_dist = (121+42)/2</text>
  <text x="360" y="396" font-size="9.5" fill="#b85450" font-weight="bold">avg_dur  = (92+101)/2</text>
  <text x="360" y="408" text-anchor="middle" font-size="9" fill="#d6a040">= 81.50 / 96.50</text>

  <text x="320" y="428" text-anchor="middle" font-size="9" fill="#888">蓝色 = 无接单月（COALESCE 补 0.00）| 红色 = 有接单月（3/6/7/8/11/12 月）</text>
</svg>
