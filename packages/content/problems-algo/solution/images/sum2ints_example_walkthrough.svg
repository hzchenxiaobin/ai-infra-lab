<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a = 5, b = 7，3 轮迭代得 12</text>

  <!-- column headers -->
  <text x="44" y="48" font-size="10.5" fill="#888">轮次</text>
  <text x="168" y="48" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">a（4 位）</text>
  <text x="398" y="48" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">b = 进位（4 位）</text>

  <!-- ===== Row 0: 初始 a=5(0101), b=7(0111) ===== -->
  <rect x="22" y="60" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="52" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">初始</text>
  <text x="104" y="80" font-size="11.5" fill="#446688" font-weight="bold">a=5</text>
  <rect x="150" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="270" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="318" y="80" font-size="11.5" fill="#4a7a3a" font-weight="bold">b=7</text>
  <rect x="360" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="378" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="400" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="440" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="458" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="480" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="498" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- arrow 0 -->
  <path d="M 280 94 Q 280 104 280 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="106" font-size="10.5" fill="#888">a←a⊕b, b←(a&amp;b)&lt;&lt;1</text>

  <!-- ===== Row 1: a=2(0010), b=10(1010) ===== -->
  <rect x="22" y="120" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="52" y="140" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">第 1 轮</text>
  <text x="104" y="140" font-size="11.5" fill="#446688" font-weight="bold">a=2</text>
  <rect x="150" y="118" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="118" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="118" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="140" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="270" y="118" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="318" y="140" font-size="11.5" fill="#4a7a3a" font-weight="bold">b=10</text>
  <rect x="360" y="118" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="118" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="418" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="440" y="118" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="480" y="118" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="498" y="140" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- arrow 1 -->
  <path d="M 280 154 Q 280 164 280 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="166" font-size="10.5" fill="#888">进位左移一位</text>

  <!-- ===== Row 2: a=8(1000), b=4(0100) ===== -->
  <rect x="22" y="180" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="52" y="200" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">第 2 轮</text>
  <text x="104" y="200" font-size="11.5" fill="#446688" font-weight="bold">a=8</text>
  <rect x="150" y="178" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="200" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="190" y="178" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="178" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="270" y="178" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="318" y="200" font-size="11.5" fill="#4a7a3a" font-weight="bold">b=4</text>
  <rect x="360" y="178" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="378" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="400" y="178" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="440" y="178" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="458" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="480" y="178" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="498" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- arrow 2 -->
  <path d="M 280 214 Q 280 224 280 232" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="226" font-size="10.5" fill="#888">进位再左移一位</text>

  <!-- ===== Row 3: a=12(1100), b=0(0000) ===== -->
  <rect x="22" y="240" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">第 3 轮</text>
  <text x="104" y="260" font-size="11.5" fill="#446688" font-weight="bold">a=12</text>
  <rect x="150" y="238" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="260" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="190" y="238" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="260" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="230" y="238" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="270" y="238" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="318" y="260" font-size="11.5" fill="#888" font-weight="bold">b=0</text>
  <rect x="360" y="238" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="378" y="260" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">0</text>
  <rect x="400" y="238" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="418" y="260" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">0</text>
  <rect x="440" y="238" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="458" y="260" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">0</text>
  <rect x="480" y="238" width="36" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="498" y="260" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">0</text>
  <text x="524" y="260" font-size="10.5" fill="#888" font-weight="bold">停止</text>

  <!-- arrow to result -->
  <path d="M 168 274 Q 168 290 168 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="304" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">b = 0，循环结束，返回 a = 12 ✓</text>

  <!-- bottom note -->
  <rect x="60" y="352" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">进位 b 每轮左移：1010 → 0100 → 0000</text>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#d6a040">3 轮把进位「挤出」4 位字长，无进位和即为答案</text>
</svg>
