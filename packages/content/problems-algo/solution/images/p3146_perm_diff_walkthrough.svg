<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcde"，t = "edbac"（按扫 t 的顺序逐步累加）</text>

  <!-- header row -->
  <rect x="80" y="48" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="152" y="48" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">t[j]</text>
  <rect x="224" y="48" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos[t[j]]</text>
  <rect x="296" y="48" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">|pos − j|</text>
  <rect x="368" y="48" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1 -->
  <rect x="80" y="76" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="96" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0</text>
  <rect x="152" y="76" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="96" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="224" y="76" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="296" y="76" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="96" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="368" y="76" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="96" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- row 2 -->
  <rect x="80" y="106" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <rect x="152" y="106" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="126" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="224" y="106" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="296" y="106" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="368" y="106" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="126" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- row 3 -->
  <rect x="80" y="136" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="156" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <rect x="152" y="136" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="156" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="224" y="136" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="296" y="136" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="368" y="136" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="156" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row 4 -->
  <rect x="80" y="166" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="186" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <rect x="152" y="166" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="186" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="224" y="166" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="296" y="166" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="368" y="166" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="186" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- row 5 -->
  <rect x="80" y="196" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="216" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="152" y="196" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="216" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="224" y="196" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="296" y="196" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="368" y="196" width="72" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>

  <!-- final bar -->
  <rect x="80" y="226" width="360" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 12 —— e 挪得最远（4 → 0），单独贡献 4</text>

  <!-- bottom notes -->
  <rect x="12" y="272" width="496" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">每步 = 查表（如 pos[e] = 4）+ 一次减法 + 一次绝对值 + 一次累加，共 n 步</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">例 1：s = "abc"，t = "bac" → |0−1| + |1−0| + |2−2| = 2（a、b 互换，c 原地不动）</text>
</svg>
