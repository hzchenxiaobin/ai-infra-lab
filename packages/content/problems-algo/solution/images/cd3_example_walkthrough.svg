<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 5, 9, 1, 5, 9], indexDiff = 2, valueDiff = 3</text>
  <path d="M 180 42 Q 360 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#888">w = t + 1 = 4，桶号 = ⌊v / 4⌋：1→桶0, 5→桶1, 9→桶2</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="25" y="74" width="40" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="65" y="74" width="60" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="74" width="55" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="74" width="180" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="360" y="74" width="165" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="525" y="74" width="190" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="45" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">i</text>
  <text x="95" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">nums[i]</text>
  <text x="152.5" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">bucket</text>
  <text x="270" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">buckets（查前）</text>
  <text x="442.5" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">命中？</text>
  <text x="620" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">buckets（查后）</text>

  <!-- 第 0 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="112" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="112" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="112" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="112" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="112" width="165" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="525" y="112" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="137" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="95" y="137" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="152.5" y="137" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="270" y="137" text-anchor="middle" font-size="11" fill="#888">{ }</text>
  <text x="442.5" y="137" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="620" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 0:1 }</text>

  <!-- 第 1 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="156" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="156" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="156" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="156" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="156" width="165" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="525" y="156" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="181" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="95" y="181" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="152.5" y="181" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="270" y="181" text-anchor="middle" font-size="11" fill="#888">{ 0:1 }</text>
  <text x="442.5" y="181" text-anchor="middle" font-size="11" fill="#d6a040">✗ |5−1|=4&gt;3</text>
  <text x="620" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 0:1, 1:5 }</text>

  <!-- 第 2 步（开始删旧） -->
  <g filter="url(#rough2)">
    <rect x="25" y="200" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="200" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="200" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="200" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="200" width="165" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="525" y="200" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="225" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="95" y="225" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="152.5" y="225" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="270" y="225" text-anchor="middle" font-size="11" fill="#888">{ 0:1, 1:5 }</text>
  <text x="442.5" y="225" text-anchor="middle" font-size="11" fill="#d6a040">✗ |9−5|=4&gt;3</text>
  <text x="620" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 1:5, 2:9 } −桶0</text>

  <!-- 第 3 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="244" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="244" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="244" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="244" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="244" width="165" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="525" y="244" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="269" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="95" y="269" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="152.5" y="269" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="270" y="269" text-anchor="middle" font-size="11" fill="#888">{ 1:5, 2:9 }</text>
  <text x="442.5" y="269" text-anchor="middle" font-size="11" fill="#d6a040">✗ |1−5|=4&gt;3</text>
  <text x="620" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 0:1, 2:9 } −桶1</text>

  <!-- 第 4 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="288" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="288" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="288" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="288" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="288" width="165" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="525" y="288" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="313" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="95" y="313" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="152.5" y="313" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="270" y="313" text-anchor="middle" font-size="11" fill="#888">{ 0:1, 2:9 }</text>
  <text x="442.5" y="313" text-anchor="middle" font-size="11" fill="#d6a040">✗ 两邻桶均&gt;3</text>
  <text x="620" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 0:1, 1:5 } −桶2</text>

  <!-- 第 5 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="332" width="40" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="65" y="332" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="125" y="332" width="55" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="180" y="332" width="180" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="332" width="165" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="525" y="332" width="190" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="45" y="357" text-anchor="middle" font-size="12" fill="#555">5</text>
  <text x="95" y="357" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="152.5" y="357" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="270" y="357" text-anchor="middle" font-size="11" fill="#888">{ 0:1, 1:5 }</text>
  <text x="442.5" y="357" text-anchor="middle" font-size="11" fill="#d6a040">✗ |9−5|=4&gt;3</text>
  <text x="620" y="357" text-anchor="middle" font-size="11" fill="#4a7a3a">{ 1:5, 2:9 } −桶0</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="25" y="384" width="690" height="44" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="42" y="406" font-size="12" fill="#555">每步：先查同桶+左右邻桶（邻桶需验证 |差|≤3），再入桶，i≥2 时删 i-indexDiff 对应旧桶。</text>
  <text x="42" y="422" font-size="12" fill="#555">全程所有邻桶值差均为 4 &gt; 3，窗口内无满足条件者 → 返回 false。</text>
</svg>
