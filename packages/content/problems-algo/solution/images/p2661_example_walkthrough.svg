<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：arr=[2,8,7,4,…] mat=[[3,2,5],[1,4,6],[8,7,9]]</text>

  <!-- ===== Step i=0, X=20, v=2 -> (0,1) ===== -->
  <text x="59" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=0  v=2</text>
  <g filter="url(#rough2)">
    <!-- (0,0)=3 unpainted --><rect x="20" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (0,1)=2 current --><rect x="46" y="80" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <!-- (0,2)=5 --><rect x="72" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (1,0)=1 --><rect x="20" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (1,1)=4 --><rect x="46" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (1,2)=6 --><rect x="72" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (2,0)=8 --><rect x="20" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (2,1)=7 --><rect x="46" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <!-- (2,2)=9 --><rect x="72" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="33" y="98" text-anchor="middle" font-size="12" fill="#aaa">3</text>
    <text x="59" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07020">2</text>
    <text x="85" y="98" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <text x="33" y="124" text-anchor="middle" font-size="12" fill="#aaa">1</text>
    <text x="59" y="124" text-anchor="middle" font-size="12" fill="#aaa">4</text>
    <text x="85" y="124" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <text x="33" y="150" text-anchor="middle" font-size="12" fill="#aaa">8</text>
    <text x="59" y="150" text-anchor="middle" font-size="12" fill="#aaa">7</text>
    <text x="85" y="150" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="59" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">col1 = 1</text>

  <!-- ===== Step i=1, X=160, v=8 -> (2,0) ===== -->
  <text x="199" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=1  v=8</text>
  <g filter="url(#rough2)">
    <rect x="160" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="186" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="212" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="160" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="186" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="212" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="160" y="132" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <rect x="186" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="212" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="173" y="98" text-anchor="middle" font-size="12" fill="#aaa">3</text>
    <text x="199" y="98" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="225" y="98" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <text x="173" y="124" text-anchor="middle" font-size="12" fill="#aaa">1</text>
    <text x="199" y="124" text-anchor="middle" font-size="12" fill="#aaa">4</text>
    <text x="225" y="124" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <text x="173" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07020">8</text>
    <text x="199" y="150" text-anchor="middle" font-size="12" fill="#aaa">7</text>
    <text x="225" y="150" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="199" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">col1 = 1</text>

  <!-- ===== Step i=2, X=300, v=7 -> (2,1) ===== -->
  <text x="339" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i=2  v=7</text>
  <g filter="url(#rough2)">
    <rect x="300" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="326" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="352" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="300" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="326" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="352" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="300" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="326" y="132" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <rect x="352" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="313" y="98" text-anchor="middle" font-size="12" fill="#aaa">3</text>
    <text x="339" y="98" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="365" y="98" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <text x="313" y="124" text-anchor="middle" font-size="12" fill="#aaa">1</text>
    <text x="339" y="124" text-anchor="middle" font-size="12" fill="#aaa">4</text>
    <text x="365" y="124" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <text x="313" y="150" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="339" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07020">7</text>
    <text x="365" y="150" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="339" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">col1 = 2</text>

  <!-- ===== Step i=3, X=440, v=4 -> (1,1), col1 完成 ===== -->
  <text x="479" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">i=3  v=4</text>
  <!-- red outline around col1 -->
  <rect x="464" y="78" width="30" height="86" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6,3" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="440" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="466" y="80" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="492" y="80" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="440" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="466" y="106" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <rect x="492" y="106" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="440" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="466" y="132" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="492" y="132" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="453" y="98" text-anchor="middle" font-size="12" fill="#aaa">3</text>
    <text x="479" y="98" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="505" y="98" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <text x="453" y="124" text-anchor="middle" font-size="12" fill="#aaa">1</text>
    <text x="479" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07020">4</text>
    <text x="505" y="124" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <text x="453" y="150" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="479" y="150" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="505" y="150" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="479" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">col1 = 3 ✓ 满列</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="30" y="210" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="54" y="221" font-size="11" fill="#333">本次涂色</text>
    <rect x="130" y="210" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="154" y="221" font-size="11" fill="#333">已涂色</text>
    <rect x="230" y="210" width="18" height="14" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,2" rx="3"/>
    <text x="254" y="221" font-size="11" fill="#333">完成行/列</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="40" y="250" width="460" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="270" y="278" text-anchor="middle" font-size="13" fill="#333">i=3 时涂 arr[3]=4 于 (1,1)，第二列 col1 三个格全涂满</text>
    <text x="270" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2a">colCnt[1] == m(3) 成立 → 返回 3</text>
    <text x="270" y="322" text-anchor="middle" font-size="11" fill="#888">与示例输出 3 一致</text>
  </g>
</svg>
