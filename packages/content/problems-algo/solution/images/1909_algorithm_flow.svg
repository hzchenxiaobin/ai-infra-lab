<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：找首违例 → 试删两候选 → 整体验证</text>

  <!-- Step 1: scan for first violation -->
  <rect x="60" y="50" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 1：从 i=1 扫描数组</text>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#555">找首个 nums[i] ≤ nums[i−1] 的位置 i</text>

  <path d="M 260 94 L 260 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: violation found? -->
  <polygon points="260,112 360,150 260,188 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找到违例?</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888">(nums[i] ≤ nums[i−1])</text>

  <!-- No violation -> true -->
  <path d="M 160 150 L 100 150 L 100 210" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="108" y="142" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="50" y="210" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return True</text>
  <text x="100" y="258" text-anchor="middle" font-size="9" fill="#888">数组已严格递增</text>

  <!-- Yes violation -> try candidates -->
  <path d="M 360 150 L 420 150 L 420 210" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="142" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- Step 2: try removing i -->
  <rect x="300" y="210" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 2：试删 nums[i]</text>
  <text x="420" y="246" text-anchor="middle" font-size="10" fill="#888">跳过下标 i，检查剩余数组严格递增?</text>

  <path d="M 420 254 L 420 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: try removing i-1 -->
  <rect x="300" y="270" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 3：试删 nums[i−1]</text>
  <text x="420" y="306" text-anchor="middle" font-size="10" fill="#888">跳过下标 i−1，检查剩余数组严格递增?</text>

  <path d="M 420 314 L 420 328" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: either works? -->
  <polygon points="420,332 500,360 420,388 340,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">任一通过?</text>

  <path d="M 340 360 L 280 360 L 280 410" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="352" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="230" y="410" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return True</text>

  <path d="M 500 360 L 460 360 L 460 410" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="352" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="410" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="433" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return False</text>

  <!-- complexity note -->
  <rect x="50" y="300" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="320" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">复杂度</text>
  <text x="60" y="338" font-size="9" fill="#333">时间 O(n)：一次扫描 + 两次校验</text>
  <text x="60" y="352" font-size="9" fill="#333">空间 O(1)：原地跳过下标</text>
</svg>
