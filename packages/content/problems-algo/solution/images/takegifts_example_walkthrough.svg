<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="312" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：gifts=[25,64,9,4,100], k=4 → 剩余 29</text>

  <!-- header row 40-76 -->
  <rect x="20" y="40" width="560" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="45" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="115" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取出 max v</text>
  <text x="200" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⌊√v⌋</text>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">移走 v−⌊√v⌋</text>
  <text x="410" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">堆内剩余（降序）</text>
  <text x="540" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合计</text>

  <!-- vertical separators -->
  <line x1="70" y1="40" x2="70" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="40" x2="160" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="40" x2="240" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="40" x2="320" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="500" y1="40" x2="500" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row separators -->
  <line x1="20" y1="76" x2="580" y2="76" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="112" x2="580" y2="112" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="148" x2="580" y2="148" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="184" x2="580" y2="184" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="220" x2="580" y2="220" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- outer borders -->
  <line x1="20" y1="40" x2="20" y2="256" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="580" y1="40" x2="580" y2="256" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="20" y1="256" x2="580" y2="256" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 初始 76-112 -->
  <text x="45" y="99" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="115" y="99" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="200" y="99" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="280" y="99" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="410" y="99" text-anchor="middle" font-size="11" fill="#333">{100, 64, 25, 9, 4}</text>
  <text x="540" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">202</text>

  <!-- step1 112-148 -->
  <text x="45" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="115" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">100</text>
  <text x="200" y="135" text-anchor="middle" font-size="11" fill="#446688">10</text>
  <text x="280" y="135" text-anchor="middle" font-size="11" fill="#b85450">90</text>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="#333">{64, 25, 10, 9, 4}</text>
  <text x="540" y="135" text-anchor="middle" font-size="11" fill="#333">112</text>

  <!-- step2 148-184 -->
  <text x="45" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="115" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">64</text>
  <text x="200" y="171" text-anchor="middle" font-size="11" fill="#446688">8</text>
  <text x="280" y="171" text-anchor="middle" font-size="11" fill="#b85450">56</text>
  <text x="410" y="171" text-anchor="middle" font-size="11" fill="#333">{25, 10, 9, 8, 4}</text>
  <text x="540" y="171" text-anchor="middle" font-size="11" fill="#333">56</text>

  <!-- step3 184-220 -->
  <text x="45" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="115" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25</text>
  <text x="200" y="207" text-anchor="middle" font-size="11" fill="#446688">5</text>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#b85450">20</text>
  <text x="410" y="207" text-anchor="middle" font-size="11" fill="#333">{10, 9, 8, 5, 4}</text>
  <text x="540" y="207" text-anchor="middle" font-size="11" fill="#333">36</text>

  <!-- step4 220-256 -->
  <text x="45" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="115" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="200" y="243" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#b85450">7</text>
  <text x="410" y="243" text-anchor="middle" font-size="11" fill="#333">{9, 8, 5, 4, 3}</text>
  <text x="540" y="243" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">29</text>

  <!-- result note -->
  <rect x="140" y="270" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">合计 202 − (90+56+20+7) = 29 ✓</text>
</svg>
