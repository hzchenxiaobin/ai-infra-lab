<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">最小包围圆概念</text>

  <!-- Enclosing circle -->
  <circle cx="260" cy="195" r="105" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Boundary points (red, on circle) -->
  <circle cx="260" cy="90" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="169" cy="248" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="351" cy="248" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Interior points (blue) -->
  <circle cx="225" cy="165" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="305" cy="215" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="250" cy="130" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="285" cy="245" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="295" cy="150" r="5" fill="#446688" filter="url(#rough2)"/>

  <!-- Center (orange) -->
  <circle cx="260" cy="195" r="3" fill="#d6a040" filter="url(#rough2)"/>

  <!-- Radius line -->
  <line x1="260" y1="195" x2="260" y2="90" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Labels -->
  <text x="272" y="86" font-size="11" fill="#b85450" filter="url(#rough2)">边界点</text>
  <text x="232" y="160" font-size="11" fill="#446688" filter="url(#rough2)">内部点</text>
  <text x="268" y="200" font-size="11" fill="#d6a040" filter="url(#rough2)">圆心</text>
  <text x="268" y="145" font-size="11" fill="#d6a040" filter="url(#rough2)">r</text>

  <!-- Insight box -->
  <rect x="30" y="295" width="460" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">关键：最小包围圆至多由 3 个边界点确定</text>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">所有点在圆内或圆上，圆的半径尽可能小</text>
</svg>
