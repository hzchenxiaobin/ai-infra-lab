<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 1994 → "MCMXCIV"</text>

  <!-- Table header -->
  <text x="28" y="56" font-size="10" fill="#444" font-weight="bold">步</text>
  <text x="62" y="56" font-size="10" fill="#444" font-weight="bold">面值 v</text>
  <text x="148" y="56" font-size="10" fill="#444" font-weight="bold">符号 s</text>
  <text x="210" y="56" font-size="10" fill="#444" font-weight="bold">num ≥ v ?</text>
  <text x="312" y="56" font-size="10" fill="#444" font-weight="bold">操作</text>
  <text x="412" y="56" font-size="10" fill="#444" font-weight="bold">ans</text>
  <text x="528" y="56" font-size="10" fill="#444" font-weight="bold">剩余 num</text>

  <line x1="20" y1="62" x2="600" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: v=1000 M, 1994>=1000 yes, +M -->
  <text x="28" y="80" font-size="10" fill="#333">1</text>
  <text x="62" y="80" font-size="10" fill="#333">1000</text>
  <text x="148" y="80" font-size="11" fill="#333" font-weight="bold">M</text>
  <text x="210" y="80" font-size="10" fill="#4a7a3a">1994 ≥ 1000 ✓</text>
  <text x="312" y="80" font-size="10" fill="#4a7a3a" font-weight="bold">拼接 M</text>
  <text x="412" y="80" font-size="10" fill="#333" font-weight="bold">"M"</text>
  <text x="528" y="80" font-size="10" fill="#333" font-weight="bold">994</text>

  <!-- Step 2: v=1000 M, 994>=1000 no, skip -->
  <text x="28" y="100" font-size="10" fill="#333">2</text>
  <text x="62" y="100" font-size="10" fill="#333">1000</text>
  <text x="148" y="100" font-size="11" fill="#333" font-weight="bold">M</text>
  <text x="210" y="100" font-size="10" fill="#b85450">994 &lt; 1000 ✗</text>
  <text x="312" y="100" font-size="10" fill="#888">跳过，取下一个</text>
  <text x="412" y="100" font-size="10" fill="#aaa">"M"</text>
  <text x="528" y="100" font-size="10" fill="#333">994</text>

  <!-- Step 3: v=900 CM, 994>=900 yes, +CM -->
  <text x="28" y="120" font-size="10" fill="#333">3</text>
  <text x="62" y="120" font-size="10" fill="#333">900</text>
  <text x="148" y="120" font-size="11" fill="#333" font-weight="bold">CM</text>
  <text x="210" y="120" font-size="10" fill="#4a7a3a">994 ≥ 900 ✓</text>
  <text x="312" y="120" font-size="10" fill="#4a7a3a" font-weight="bold">拼接 CM</text>
  <text x="412" y="120" font-size="10" fill="#333" font-weight="bold">"MCM"</text>
  <text x="528" y="120" font-size="10" fill="#333" font-weight="bold">94</text>

  <!-- Step 4: v=900..100, 94 all no, skip -->
  <text x="28" y="140" font-size="10" fill="#333">4</text>
  <text x="62" y="140" font-size="10" fill="#888">900→100</text>
  <text x="148" y="140" font-size="10" fill="#888">…</text>
  <text x="210" y="140" font-size="10" fill="#b85450">94 全不够 ✗</text>
  <text x="312" y="140" font-size="10" fill="#888">连续跳过</text>
  <text x="412" y="140" font-size="10" fill="#aaa">"MCM"</text>
  <text x="528" y="140" font-size="10" fill="#333">94</text>

  <!-- Step 5: v=90 XC, 94>=90 yes, +XC -->
  <text x="28" y="160" font-size="10" fill="#333">5</text>
  <text x="62" y="160" font-size="10" fill="#333">90</text>
  <text x="148" y="160" font-size="11" fill="#333" font-weight="bold">XC</text>
  <text x="210" y="160" font-size="10" fill="#4a7a3a">94 ≥ 90 ✓</text>
  <text x="312" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">拼接 XC</text>
  <text x="412" y="160" font-size="10" fill="#333" font-weight="bold">"MCMXC"</text>
  <text x="528" y="160" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- Step 6: v=50..5, 4 all no, skip -->
  <text x="28" y="180" font-size="10" fill="#333">6</text>
  <text x="62" y="180" font-size="10" fill="#888">50→5</text>
  <text x="148" y="180" font-size="10" fill="#888">…</text>
  <text x="210" y="180" font-size="10" fill="#b85450">4 全不够 ✗</text>
  <text x="312" y="180" font-size="10" fill="#888">连续跳过</text>
  <text x="412" y="180" font-size="10" fill="#aaa">"MCMXC"</text>
  <text x="528" y="180" font-size="10" fill="#333">4</text>

  <!-- Step 7: v=4 IV, 4>=4 yes, +IV -->
  <text x="28" y="200" font-size="10" fill="#333">7</text>
  <text x="62" y="200" font-size="10" fill="#333">4</text>
  <text x="148" y="200" font-size="11" fill="#333" font-weight="bold">IV</text>
  <text x="210" y="200" font-size="10" fill="#4a7a3a">4 ≥ 4 ✓</text>
  <text x="312" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">拼接 IV</text>
  <text x="412" y="200" font-size="10" fill="#333" font-weight="bold">"MCMXCIV"</text>
  <text x="528" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- separator -->
  <line x1="20" y1="214" x2="600" y2="214" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="228" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="252" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果："MCMXCIV" = M + CM + XC + IV</text>
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#888">= 1000 + 900 + 90 + 4 = 1994 ✓</text>

  <!-- bottom note -->
  <rect x="60" y="292" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">观察：每次尽量减最大面值，6 个减法组合（CM/XC/IV）自动出现</text>
  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#888">面值 1 兜底，num 最终必归零，无需额外判空</text>

  <!-- star on final ans -->
  <text x="466" y="200" font-size="10" fill="#d6a040">⭐</text>
</svg>
