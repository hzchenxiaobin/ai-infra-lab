<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：positions = [[1,2],[2,3],[6,1]]</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">半开区间方块0 [1,3)、方块1 [2,5)、方块2 [6,7)</text>

  <!-- ===== Table grid ===== -->
  <!-- column x ranges: 步 30-70, 方块 70-160, 重叠检查 160-348, base 348-402, tops 402-462, ans 462-522 -->
  <!-- header row y 56-80, data rows y 80-130, 130-180, 180-230 -->

  <!-- header background -->
  <rect x="30" y="56" width="492" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#666" text-anchor="middle" font-weight="bold">
    <text x="50" y="73">步</text>
    <text x="115" y="73">方块 [L,R)</text>
    <text x="254" y="73">与已有方块严格重叠？</text>
    <text x="375" y="73">base</text>
    <text x="432" y="73">tops[i]</text>
    <text x="492" y="73">ans[i]</text>
  </g>

  <!-- column separators -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="56" x2="70" y2="232"/>
    <line x1="160" y1="56" x2="160" y2="232"/>
    <line x1="348" y1="56" x2="348" y2="232"/>
    <line x1="402" y1="56" x2="402" y2="232"/>
    <line x1="462" y1="56" x2="462" y2="232"/>
  </g>
  <!-- row separators -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="82" x2="522" y2="82"/>
    <line x1="30" y1="132" x2="522" y2="132"/>
    <line x1="30" y1="182" x2="522" y2="182"/>
  </g>
  <!-- outer border -->
  <rect x="30" y="56" width="492" height="176" fill="none" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- ===== Row 0: i=0, [1,3), no prev ===== -->
  <g font-size="10.5" text-anchor="middle">
    <text x="50" y="110" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="78" y="94" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="115" y="111" fill="#446688" font-weight="bold">[1,3)</text>
    <text x="254" y="111" fill="#888">无已有方块</text>
    <text x="375" y="111" fill="#444">0</text>
    <text x="432" y="111" fill="#b85450" font-weight="bold">2</text>
    <text x="492" y="111" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== Row 1: i=1, [2,5), overlaps sq0 ===== -->
  <g font-size="10.5" text-anchor="middle">
    <text x="50" y="160" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="78" y="144" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="115" y="161" fill="#4a7a3a" font-weight="bold">[2,5)</text>
    <text x="180" y="158" font-size="9.5" fill="#555" text-anchor="start">方块0 [1,3)：</text>
    <text x="180" y="172" font-size="9.5" fill="#b85450" text-anchor="start">max(1,2)=2 &lt; min(3,5)=3 ✓</text>
    <text x="375" y="161" fill="#444">2</text>
    <text x="432" y="161" fill="#b85450" font-weight="bold">5</text>
    <text x="492" y="161" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- ===== Row 2: i=2, [6,7), no overlap ===== -->
  <g font-size="10.5" text-anchor="middle">
    <text x="50" y="210" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="78" y="194" width="74" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="115" y="211" fill="#d6a040" font-weight="bold">[6,7)</text>
    <text x="180" y="202" font-size="9" fill="#555" text-anchor="start">方块0：max(1,6)=6 &lt; min(3,7)=3？否</text>
    <text x="180" y="216" font-size="9" fill="#555" text-anchor="start">方块1：max(2,6)=6 &lt; min(5,7)=5？否</text>
    <text x="375" y="211" fill="#444">0</text>
    <text x="432" y="211" fill="#d6a040" font-weight="bold">1</text>
    <text x="492" y="211" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="252" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans = [2, 5, 5] ✓</text>

  <!-- ===== key note ===== -->
  <rect x="40" y="294" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="11" fill="#d6a040" font-weight="bold">注意</text>
  <text x="60" y="330" font-size="10.5" fill="#555">• ans[i] 记全局最高，非 tops[i]：第 2 步 tops=1 但 ans=5。</text>
  <text x="60" y="344" font-size="10.5" fill="#555">• 擦边（共享端点）不算重叠：max(L)=min(R) 时 &lt; 不成立。</text>
</svg>
