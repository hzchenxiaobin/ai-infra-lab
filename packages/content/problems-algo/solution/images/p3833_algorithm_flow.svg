<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从右往左一遍扫描，增量维护「右侧和 s」</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">循环从 i = n−2 起步——最右元素天然不算主导</text>

  <!-- Start -->
  <rect x="168" y="46" width="224" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="10" fill="#223" font-weight="bold" filter="url(#rough2)">开始：ans = 0，s = 0，i = n − 2</text>

  <path d="M 280 74 L 280 84" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Diamond 1: i >= 0? -->
  <polygon points="232,116 280,90 328,116 280,142" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i ≥ 0 ?</text>

  <!-- no -> return -->
  <path d="M 328 116 L 388 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="109" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="392" y="100" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="120" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -->
  <path d="M 280 142 L 280 156" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="291" y="153" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process box: accumulate -->
  <rect x="160" y="158" width="240" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">s += nums[i+1]（刚跨过的元素入帐）</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt = n − 1 − i（右侧元素个数）</text>

  <path d="M 280 196 L 280 210" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Diamond 2: nums[i]*cnt > s? -->
  <polygon points="216,242 280,212 344,242 280,272" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums[i] × cnt</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">&gt; s ?</text>

  <!-- yes -> ans++ -->
  <path d="M 344 242 L 380 242" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="235" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="384" y="222" width="132" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">ans += 1</text>
  <text x="450" y="254" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">（下标 i 是主导）</text>

  <!-- no -> i-- -->
  <path d="M 280 272 L 280 286" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="291" y="283" font-size="9.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ans++ branch merges into i-- box -->
  <path d="M 450 262 L 450 304 L 394 304" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- i-- box -->
  <rect x="168" y="288" width="224" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i ← i − 1（左移一格）</text>

  <!-- loop back -->
  <path d="M 168 304 L 126 304 L 126 116 L 228 116" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="118" y="212" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下一轮</text>

  <!-- bottom notes -->
  <rect x="48" y="330" width="424" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">一遍从右往左：时间 O(n)、空间 O(1)——不建后缀和数组，变量 s 增量维护</text>
  <text x="260" y="364" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">n = 1 时循环不执行返回 0；乘积上界 100 × 100 = 10⁴，int 无溢出风险</text>
</svg>
