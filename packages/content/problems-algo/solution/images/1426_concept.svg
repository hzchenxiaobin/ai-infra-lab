<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：存在性查询 → 哈希集合 O(1) 判定</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">先建集合（哪些值出现过），再遍历原数组查 x+1 是否在集合中</text>

  <!-- ===== Row A: original array arr ===== -->
  <text x="40" y="78" font-size="11" fill="#666" font-weight="bold">原数组 arr</text>
  <text x="40" y="94" font-size="10" fill="#888">含重复，按位置</text>

  <!-- arr = [1, 3, 2, 3, 5, 0]   box w=46 h=42 step=54 start x=150 -->
  <rect x="150" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="90" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="204" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="227" y="90" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="258" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="281" y="90" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="312" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="90" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="366" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="389" y="90" text-anchor="middle" font-size="15" fill="#333">5</text>
  <rect x="420" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="443" y="90" text-anchor="middle" font-size="15" fill="#333">0</text>

  <!-- arrow down: build set -->
  <path d="M 308 106 L 308 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="124" font-size="10.5" fill="#4a7a3a" font-weight="bold">第一趟：全部插入 seen</text>

  <!-- ===== Row B: hash set seen ===== -->
  <text x="40" y="158" font-size="11" fill="#666" font-weight="bold">哈希集合 seen</text>
  <text x="40" y="174" font-size="10" fill="#888">自动去重</text>

  <!-- set container (rounded rect) with member circles -->
  <rect x="130" y="140" width="360" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="140" y="158" font-size="10" fill="#4a7a3a">{</text>
  <!-- member circles: 0 1 2 3 5 -->
  <circle cx="170" cy="162" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="166" text-anchor="middle" font-size="12" fill="#333">0</text>
  <circle cx="208" cy="162" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="166" text-anchor="middle" font-size="12" fill="#333">1</text>
  <circle cx="246" cy="162" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>
  <circle cx="284" cy="162" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="166" text-anchor="middle" font-size="12" fill="#333">3</text>
  <circle cx="322" cy="162" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="166" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="346" y="166" font-size="10" fill="#4a7a3a">}</text>
  <text x="370" y="166" font-size="10" fill="#888">重复的 3 只留一个</text>

  <!-- arrow down: query -->
  <path d="M 308 188 L 308 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">第二趟：遍历原 arr，查 x+1 ∈ seen?</text>

  <!-- ===== Row C: query example + contrast ===== -->
  <!-- left: query x=1 -> 2 in seen? -->
  <rect x="50" y="222" width="220" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="242" font-size="11" fill="#555" font-weight="bold">查 x = 1</text>
  <text x="60" y="258" font-size="11" fill="#555">x+1 = 2 ∈ seen?</text>
  <text x="60" y="272" font-size="12" fill="#b85450" font-weight="bold">✓ 在 → ans += 1   (O(1))</text>

  <!-- right: contrast brute force -->
  <rect x="290" y="222" width="220" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="242" font-size="11" fill="#555" font-weight="bold">暴力：找 x+1=2</text>
  <text x="300" y="258" font-size="11" fill="#555">从头扫整张 arr</text>
  <text x="300" y="272" font-size="12" fill="#b85450" font-weight="bold">扫 n 个 → O(n)</text>

  <!-- bottom takeaway -->
  <rect x="50" y="294" width="460" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建集合 O(n) + n 次 O(1) 查询 = 整体 O(n)</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#555">⚠️ 计数遍历的是原数组 arr（保留重复），不是去重后的集合</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555">⚠️ 必须先建完集合再计数，否则会漏判后续才入集的值</text>
</svg>
