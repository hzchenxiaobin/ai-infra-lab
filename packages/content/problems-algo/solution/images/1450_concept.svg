<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：queryTime 落在 [startTime[i], endTime[i]] 区间内即计数</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">startTime = [1,2,3]，endTime = [3,2,7]，queryTime = 4</text>

  <!-- Timeline axis: t=0..10, x = 70 + 50*t -->
  <!-- axis line -->
  <path d="M 60 300 L 580 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- tick marks and labels -->
  <text x="70" y="318" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="120" y="318" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="170" y="318" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="220" y="318" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="270" y="318" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="370" y="318" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="420" y="318" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="470" y="318" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="520" y="318" text-anchor="middle" font-size="10" fill="#888">9</text>
  <text x="570" y="318" text-anchor="middle" font-size="10" fill="#888">10</text>
  <!-- tick marks -->
  <path d="M 70 296 L 70 304 M 120 296 L 120 304 M 170 296 L 170 304 M 220 296 L 220 304 M 270 296 L 270 304 M 320 296 L 320 304 M 370 296 L 370 304 M 420 296 L 420 304 M 470 296 L 470 304 M 520 296 L 520 304 M 570 296 L 570 304" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="590" y="304" font-size="10.5" fill="#888">时间</text>

  <!-- Student 0: [1,3] -> x=120 to 220, bar y=96, height 26. NOT containing q=4 -->
  <rect x="120" y="96" width="100" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="113" text-anchor="middle" font-size="11" fill="#333">学生 0: [1,3]</text>
  <text x="170" y="86" text-anchor="middle" font-size="10.5" fill="#888">startTime=1, endTime=3</text>

  <!-- Student 1: [2,2] -> point at x=170, bar y=146. NOT containing q=4 -->
  <circle cx="170" cy="159" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="163" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="170" y="138" text-anchor="middle" font-size="10.5" fill="#888">学生 1: [2,2]（瞬时）</text>

  <!-- Student 2: [3,7] -> x=220 to 420, bar y=196, height 26. CONTAINS q=4 -> highlight green -->
  <rect x="220" y="196" width="200" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">学生 2: [3,7]</text>
  <text x="320" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a">startTime=3, endTime=7</text>

  <!-- queryTime = 4 vertical dashed line at x=270, from y=80 to y=300 -->
  <path d="M 270 76 L 270 300" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <rect x="244" y="58" width="52" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q = 4</text>

  <!-- check marks / crosses for each student -->
  <!-- Student 0: 4 > endTime=3, miss -->
  <text x="270" y="113" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <!-- Student 1: 4 > endTime=2, miss -->
  <text x="270" y="163" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <!-- Student 2: 3 ≤ 4 ≤ 7, hit -->
  <text x="270" y="213" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- bottom note box -->
  <rect x="60" y="336" width="500" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定：startTime[i] ≤ queryTime ≤ endTime[i] → 计数 +1</text>
</svg>
