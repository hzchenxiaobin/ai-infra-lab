<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：标记 → 扫描插标签</text>

  <!-- Example 1 header -->
  <text x="20" y="52" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "aabcd"，words = ["ab","bc"]（重叠合并）</text>

  <!-- s cells: 5 chars width 48 -->
  <text x="40" y="86" font-size="11" fill="#888">s：</text>
  <rect x="100" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="124" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="148" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="196" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="244" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="292" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="316" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>

  <!-- index labels -->
  <text x="124" y="110" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="172" y="110" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="110" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="268" y="110" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="316" y="110" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- bold array -->
  <text x="40" y="140" font-size="11" fill="#888">bold：</text>
  <rect x="100" y="122" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="124" y="141" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">F</text>
  <rect x="148" y="122" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="172" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="196" y="122" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="244" y="122" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="268" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="292" y="122" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="316" y="141" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">F</text>

  <!-- transition table headers -->
  <text x="20" y="174" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="80" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">s[i]</text>
  <text x="170" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">bold[i]</text>
  <text x="270" y="174" font-size="10.5" fill="#888" font-weight="bold">状态变化</text>
  <text x="490" y="174" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <line x1="10" y1="180" x2="590" y2="180" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 -->
  <text x="20" y="196" font-size="10.5" fill="#333">0</text>
  <text x="80" y="196" text-anchor="middle" font-size="10.5" fill="#333">a</text>
  <text x="170" y="196" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">F</text>
  <text x="270" y="196" font-size="10.5" fill="#888">F → F</text>
  <text x="490" y="196" text-anchor="middle" font-size="10.5" fill="#446688">+'a'</text>

  <!-- i=1 -->
  <text x="20" y="214" font-size="10.5" fill="#333">1</text>
  <text x="80" y="214" text-anchor="middle" font-size="10.5" fill="#333">a</text>
  <text x="170" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="270" y="214" font-size="10.5" fill="#b85450" font-weight="bold">F → T</text>
  <text x="490" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">+&lt;b&gt;, +'a'</text>

  <!-- i=2 -->
  <text x="20" y="232" font-size="10.5" fill="#333">2</text>
  <text x="80" y="232" text-anchor="middle" font-size="10.5" fill="#333">b</text>
  <text x="170" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="270" y="232" font-size="10.5" fill="#888">T → T</text>
  <text x="490" y="232" text-anchor="middle" font-size="10.5" fill="#446688">+'b'</text>

  <!-- i=3 -->
  <text x="20" y="250" font-size="10.5" fill="#333">3</text>
  <text x="80" y="250" text-anchor="middle" font-size="10.5" fill="#333">c</text>
  <text x="170" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="270" y="250" font-size="10.5" fill="#d6a040" font-weight="bold">T → F</text>
  <text x="490" y="250" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+'c', +&lt;/b&gt;</text>

  <!-- i=4 -->
  <text x="20" y="268" font-size="10.5" fill="#333">4</text>
  <text x="80" y="268" text-anchor="middle" font-size="10.5" fill="#333">d</text>
  <text x="170" y="268" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">F</text>
  <text x="270" y="268" font-size="10.5" fill="#888">F → F</text>
  <text x="490" y="268" text-anchor="middle" font-size="10.5" fill="#446688">+'d'</text>

  <line x1="10" y1="278" x2="590" y2="278" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result 1 -->
  <rect x="40" y="288" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输出：a&lt;b&gt;abc&lt;/b&gt;d  ✓（"ab"[1,2] 与 "bc"[2,3] 重叠于位置 2 → 合并 [1,3]）</text>

  <!-- Example 2 -->
  <text x="20" y="346" font-size="12" fill="#446688" font-weight="bold">示例 2：s = "abcd"，words = ["ab","cd"]（相邻合并）</text>

  <!-- Example 2 cells: 4 chars width 48 -->
  <text x="40" y="380" font-size="11" fill="#888">s：</text>
  <rect x="100" y="360" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="124" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="148" y="360" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="172" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="360" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="244" y="360" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="268" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>

  <!-- bold labels example 2 -->
  <text x="40" y="412" font-size="11" fill="#888">bold：</text>
  <rect x="100" y="396" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="124" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="148" y="396" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="172" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="196" y="396" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="244" y="396" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="268" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">T</text>

  <!-- result 2 -->
  <rect x="40" y="428" width="520" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="444" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">输出：&lt;b&gt;abcd&lt;/b&gt;  ✓（"ab"[0,1] 与 "cd"[2,3] 相邻 → 合并 [0,3]）</text>
</svg>
