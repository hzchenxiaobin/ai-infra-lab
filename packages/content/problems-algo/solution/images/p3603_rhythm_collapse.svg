<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：时间节律被坐标锁死，每个格子恰好等一次</text>

  <!-- left panel: rhythm -->
  <text x="140" y="48" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">奇偶节律（与路径无关）</text>

  <!-- timeline -->
  <rect x="30" y="62" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="78" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">入场</text>
  <text x="56" y="91" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">(0,0) 花1</text>

  <line x1="82" y1="79" x2="96" y2="79" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="98" y="62" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="78" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第1秒</text>
  <text x="124" y="91" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">移动→↓</text>

  <line x1="150" y1="79" x2="164" y2="79" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="166" y="62" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="78" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">第2秒</text>
  <text x="192" y="91" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">等待⏸</text>

  <line x1="218" y1="79" x2="232" y2="79" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="234" y="62" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第3秒</text>
  <text x="260" y="91" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">移动→↓</text>

  <text x="298" y="82" font-size="12" fill="#666" filter="url(#rough2)">…</text>

  <!-- key insight box -->
  <rect x="30" y="112" width="270" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="130" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">到 (i, j) 恒需 i + j 次移动</text>
  <text x="165" y="146" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">每走一步 i+j 恰 +1，与走哪条路无关</text>
  <text x="165" y="161" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⇒ 在 (i,j) 的下一秒必为奇数秒，必须移动</text>

  <!-- 2x3 grid example -->
  <text x="140" y="200" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 3 的 2×3 网格（entry / waitCost）</text>

  <!-- row 0 -->
  <rect x="60" y="212" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="228" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">入场 1</text>
  <text x="88" y="242" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">不等 ✓</text>

  <rect x="120" y="212" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="228" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">入场 2</text>
  <text x="148" y="242" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">等 1</text>

  <rect x="180" y="212" width="56" height="42" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="208" y="228" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">入场 3</text>
  <text x="208" y="242" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">等 4</text>

  <!-- row 1 -->
  <rect x="60" y="258" width="56" height="42" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="88" y="274" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">入场 2</text>
  <text x="88" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">等 3</text>

  <rect x="120" y="258" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="274" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">入场 4</text>
  <text x="148" y="288" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">等 2</text>

  <rect x="180" y="258" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="208" y="274" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">入场 6</text>
  <text x="208" y="288" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">不等 ✓</text>

  <!-- path arrows -->
  <line x1="148" y1="233" x2="148" y2="254" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="148" y1="279" x2="174" y2="279" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="88" y1="233" x2="112" y2="233" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- right panel: accounting -->
  <text x="430" y="48" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">逐格记账 → 经典最小路径和 DP</text>

  <rect x="330" y="62" width="200" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">中间格子：入场 + 等待 打包</text>
  <text x="430" y="102" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">dp[i][j] = min(上, 左)</text>
  <text x="430" y="120" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">+ (i+1)(j+1) + waitCost[i][j]</text>
  <text x="430" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">dp[0][0] = 1（只付入场费）</text>

  <line x1="430" y1="150" x2="430" y2="166" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="168" width="200" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="188" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">终点到达即停，不等待</text>
  <text x="430" y="208" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">答案 = dp[m−1][n−1] − waitCost[m−1][n−1]</text>

  <!-- note box -->
  <rect x="330" y="240" width="200" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="258" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">奇偶状态位是冗余的</text>
  <text x="430" y="273" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">节律 = 坐标的函数</text>
  <text x="430" y="288" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">不必带进 DP 状态 / Dijkstra</text>

  <!-- footer -->
  <rect x="30" y="320" width="500" height="60" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">对照 3596（I 版）：偶数步若改成「向左/向上」，偶数步必回 (0,0)</text>
  <text x="280" y="357" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">轨迹锁死 3 格、多数网格不可达 → O(1) 脑筋急转弯</text>
  <text x="280" y="373" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">本题偶数步是「原地等待」→ 坐标单调前进 → 线性网格 DP</text>
</svg>
