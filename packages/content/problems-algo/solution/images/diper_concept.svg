<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">相对排名 DP：只记排名，不记数值</text>

  <!-- s = DID label -->
  <text x="45" y="62" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <text x="158" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">D</text>
  <text x="238" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">I</text>
  <text x="318" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">D</text>

  <!-- Permutation values row -->
  <text x="45" y="112" font-size="13" fill="#555" filter="url(#rough2)">perm =</text>
  <rect x="90" y="88" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="170" y="88" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="88" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="330" y="88" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="115" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <!-- D/I arrows between permutation boxes -->
  <path d="M 158 95 L 158 78" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 238 78 L 238 95" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowG)" filter="url(#rough2)"/>
  <path d="M 318 95 L 318 78" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- Position labels -->
  <text x="117" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pos 0</text>
  <text x="197" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pos 1</text>
  <text x="277" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pos 2</text>
  <text x="357" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pos 3</text>

  <!-- Relative ranks row -->
  <text x="45" y="182" font-size="13" fill="#555" filter="url(#rough2)">rank =</text>
  <rect x="90" y="160" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="187" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="160" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="187" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="250" y="160" width="55" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="187" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="330" y="160" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="187" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <!-- j label annotation -->
  <text x="415" y="187" font-size="12" fill="#888" filter="url(#rough2)">← j (排名)</text>

  <!-- Insertion concept: show how rank 1 at pos 2 works -->
  <path d="M 277 205 L 277 225" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowB)" filter="url(#rough2)"/>
  <rect x="195" y="228" width="165" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="277" y="244" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">pos2=2 在 {3,1,2} 中排名第1小</text>

  <!-- Key insight note box -->
  <rect x="50" y="265" width="420" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">核心洞察</text>
  <text x="70" y="307" font-size="11.5" fill="#555" filter="url(#rough2)">• D/I 约束只依赖相邻元素的大小关系，与具体数值无关</text>
  <text x="70" y="324" font-size="11.5" fill="#555" filter="url(#rough2)">• 状态 dp[i][j] = 填好前 i+1 位、末位排名第 j 小的方案数</text>
  <text x="70" y="341" font-size="11.5" fill="#555" filter="url(#rough2)">• 无需记录"用了哪些数"，只需"末位的相对排名 j"</text>
</svg>
