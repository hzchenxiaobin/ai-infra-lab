<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "()))(("</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">逐字符推进 balance 与 need，最终答案 = balance + need = 4</text>

  <!-- ===== header row ===== -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="30" y="60" width="50" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="75" text-anchor="middle">步骤</text>
    <rect x="80" y="60" width="50" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="105" y="75" text-anchor="middle">字符</text>
    <rect x="130" y="60" width="210" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="75" text-anchor="middle">操作</text>
    <rect x="340" y="60" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="75" text-anchor="middle" fill="#446688">balance</text>
    <rect x="430" y="60" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="75" text-anchor="middle" fill="#b85450">need</text>
  </g>

  <!-- ===== initial ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="84" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="100" text-anchor="middle">0</text>
    <rect x="80" y="84" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="105" y="100" text-anchor="middle">—</text>
    <rect x="130" y="84" width="210" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="100" text-anchor="middle">初始</text>
    <rect x="340" y="84" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="100" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="430" y="84" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="100" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== step 1: '(' ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="110" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="126" text-anchor="middle">1</text>
    <rect x="80" y="110" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="126" text-anchor="middle" fill="#446688" font-weight="bold">(</text>
    <rect x="130" y="110" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="126" text-anchor="middle" fill="#446688">左括号 → balance++</text>
    <rect x="340" y="110" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="385" y="126" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="430" y="110" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== step 2: ')' match ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="136" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="152" text-anchor="middle">2</text>
    <rect x="80" y="136" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">)</text>
    <rect x="130" y="136" width="210" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="152" text-anchor="middle" fill="#4a7a3a">balance&gt;0 → balance--</text>
    <rect x="340" y="136" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="385" y="152" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="430" y="136" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== step 3: ')' need ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="162" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="178" text-anchor="middle">3</text>
    <rect x="80" y="162" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="178" text-anchor="middle" fill="#b85450" font-weight="bold">)</text>
    <rect x="130" y="162" width="210" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="178" text-anchor="middle" fill="#b85450">balance==0 → need++</text>
    <rect x="340" y="162" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="178" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="430" y="162" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="475" y="178" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- ===== step 4: ')' need ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="188" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="204" text-anchor="middle">4</text>
    <rect x="80" y="188" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="204" text-anchor="middle" fill="#b85450" font-weight="bold">)</text>
    <rect x="130" y="188" width="210" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="204" text-anchor="middle" fill="#b85450">balance==0 → need++</text>
    <rect x="340" y="188" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="204" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="430" y="188" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="475" y="204" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== step 5: '(' ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="214" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="230" text-anchor="middle">5</text>
    <rect x="80" y="214" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="230" text-anchor="middle" fill="#446688" font-weight="bold">(</text>
    <rect x="130" y="214" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="230" text-anchor="middle" fill="#446688">左括号 → balance++</text>
    <rect x="340" y="214" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="385" y="230" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="430" y="214" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="230" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== step 6: '(' ===== -->
  <g font-size="11" fill="#333">
    <rect x="30" y="240" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="256" text-anchor="middle">6</text>
    <rect x="80" y="240" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="105" y="256" text-anchor="middle" fill="#446688" font-weight="bold">(</text>
    <rect x="130" y="240" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="256" text-anchor="middle" fill="#446688">左括号 → balance++</text>
    <rect x="340" y="240" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="385" y="256" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="430" y="240" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="256" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== result ===== -->
  <path d="M 290 268 L 290 286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="290" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">扫完：balance=2, need=2 → 答案 = 2+2 = 4</text>
  <text x="290" y="322" text-anchor="middle" font-size="10" fill="#555">补 2 个 '(' 给中间无主的 '))', 再补 2 个 ')' 给末尾的 '(('</text>

  <!-- ===== visual proof ===== -->
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">添加后变合法（在原串基础上插入 4 个字符）：</text>

  <rect x="30" y="364" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="384" text-anchor="middle" font-size="10" fill="#888">原串</text>
  <text x="110" y="402" text-anchor="middle" font-family="monospace" font-size="14" fill="#b85450" font-weight="bold">()))((</text>

  <path d="M 190 386 L 220 386" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="378" text-anchor="middle" font-size="9" fill="#888">+4</text>

  <rect x="225" y="364" width="325" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="387" y="384" text-anchor="middle" font-size="10" fill="#888">合法结果之一</text>
  <text x="387" y="402" text-anchor="middle" font-family="monospace" font-size="14" fill="#4a7a3a" font-weight="bold">()()()(())  ✓</text>

  <text x="290" y="436" text-anchor="middle" font-size="10" fill="#888">中间两个 ')' 各补一个 '(' 凑成 "()", 末尾两个 '(' 补 "))" 凑成 "(())"</text>
</svg>
