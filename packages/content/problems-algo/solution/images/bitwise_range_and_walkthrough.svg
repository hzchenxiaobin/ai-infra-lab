<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：left = 5, right = 7 → 期望 4</text>

  <!-- 中间分隔虚线 -->
  <path d="M 290 44 L 290 380" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：位移法 ===== -->
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">位移法</text>

  <!-- 表头 -->
  <rect x="30" y="76" width="240" height="28" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="55" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">轮次</text>
  <text x="110" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">left</text>
  <text x="170" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">right</text>
  <text x="235" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">shift</text>

  <!-- 行 0 初始 -->
  <rect x="30" y="108" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="110" y="138" text-anchor="middle" font-size="9.5" fill="#888">101</text>
  <text x="170" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="170" y="138" text-anchor="middle" font-size="9.5" fill="#888">111</text>
  <text x="235" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>

  <path d="M 150 144 L 150 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <rect x="30" y="156" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="178" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="110" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="110" y="186" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="170" y="186" text-anchor="middle" font-size="9.5" fill="#888">11</text>
  <text x="235" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <path d="M 150 192 L 150 200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2 相等 -->
  <rect x="30" y="204" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="226" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="110" y="234" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="170" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="234" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="235" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="150" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">left == right → 相等，停止</text>

  <!-- 返回框 -->
  <rect x="40" y="270" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return left &lt;&lt; shift</text>
  <text x="150" y="310" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">= 1 &lt;&lt; 2 = 4 ✓</text>

  <!-- 注解 -->
  <text x="150" y="346" text-anchor="middle" font-size="10" fill="#888">右移 2 次后两者相等</text>
  <text x="150" y="362" text-anchor="middle" font-size="10" fill="#888">「1」即公共前缀，左移 2 位补零复原</text>

  <!-- ===== 右：Brian Kernighan ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Brian Kernighan 法</text>

  <rect x="310" y="76" width="240" height="28" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="345" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">轮次</text>
  <text x="400" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">right</text>
  <text x="495" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">动作</text>

  <!-- 行 0 -->
  <rect x="310" y="108" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <text x="400" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="400" y="138" text-anchor="middle" font-size="9.5" fill="#888">111</text>
  <text x="495" y="130" text-anchor="middle" font-size="10.5" fill="#b85450">7 &gt; 5，清最低1</text>

  <path d="M 430 144 L 430 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <rect x="310" y="156" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="178" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="400" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="400" y="186" text-anchor="middle" font-size="9.5" fill="#888">110</text>
  <text x="495" y="178" text-anchor="middle" font-size="10.5" fill="#b85450">6 &gt; 5，清最低1</text>

  <path d="M 430 192 L 430 200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2 停止 -->
  <rect x="310" y="204" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="226" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="400" y="234" text-anchor="middle" font-size="9.5" fill="#4a7a3a">100</text>
  <text x="495" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4 ≤ 5，停</text>

  <text x="430" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">right ≤ left → 剩余位即公共前缀</text>

  <rect x="320" y="270" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return right</text>
  <text x="430" y="310" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">= 4 ✓</text>

  <text x="430" y="346" text-anchor="middle" font-size="10" fill="#888">7→6→4：消了 2 个最低位 1</text>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#888">与位移法的 shift=2 完全对应</text>
</svg>
