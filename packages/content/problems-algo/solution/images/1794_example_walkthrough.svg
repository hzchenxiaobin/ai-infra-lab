<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：first = "abcd", second = "bccda"</text>

  <!-- ====== Two strings with indices ====== -->
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">first</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="46" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="65" filter="url(#rough2)" font-weight="bold">a</text>
    <rect x="128" y="46" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="147" y="65" filter="url(#rough2)">b</text>
    <rect x="166" y="46" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="185" y="65" filter="url(#rough2)">c</text>
    <rect x="204" y="46" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="223" y="65" filter="url(#rough2)">d</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="109" y="42" filter="url(#rough2)">0</text>
    <text x="147" y="42" filter="url(#rough2)">1</text>
    <text x="185" y="42" filter="url(#rough2)">2</text>
    <text x="223" y="42" filter="url(#rough2)">3</text>
  </g>

  <text x="40" y="96" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">second</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="84" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="109" y="103" filter="url(#rough2)">b</text>
    <rect x="128" y="84" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="147" y="103" filter="url(#rough2)">c</text>
    <rect x="166" y="84" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="185" y="103" filter="url(#rough2)">c</text>
    <rect x="204" y="84" width="38" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="223" y="103" filter="url(#rough2)">d</text>
    <rect x="242" y="84" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="261" y="103" filter="url(#rough2)" font-weight="bold">a</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="109" y="80" filter="url(#rough2)">0</text>
    <text x="147" y="80" filter="url(#rough2)">1</text>
    <text x="185" y="80" filter="url(#rough2)">2</text>
    <text x="223" y="80" filter="url(#rough2)">3</text>
    <text x="261" y="80" filter="url(#rough2)">4</text>
  </g>

  <!-- ====== Table header ====== -->
  <rect x="80" y="126" width="400" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="120" y="144" filter="url(#rough2)">字符 c</text>
    <text x="210" y="144" filter="url(#rough2)">first[c]</text>
    <text x="310" y="144" filter="url(#rough2)">last[c]</text>
    <text x="420" y="144" filter="url(#rough2)">diff = first − last</text>
  </g>

  <!-- ====== Table rows ====== -->
  <!-- Row 'a': highlighted (minimum) -->
  <rect x="80" y="156" width="400" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="174" filter="url(#rough2)" font-weight="bold" fill="#b85450">a</text>
    <text x="210" y="174" filter="url(#rough2)">0</text>
    <text x="310" y="174" filter="url(#rough2)">4</text>
    <text x="420" y="174" filter="url(#rough2)" font-weight="bold" fill="#b85450">−4 ← 最小</text>
  </g>

  <!-- Row 'b' -->
  <rect x="80" y="186" width="400" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="204" filter="url(#rough2)">b</text>
    <text x="210" y="204" filter="url(#rough2)">1</text>
    <text x="310" y="204" filter="url(#rough2)">0</text>
    <text x="420" y="204" filter="url(#rough2)">1</text>
  </g>

  <!-- Row 'c' -->
  <rect x="80" y="216" width="400" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="234" filter="url(#rough2)">c</text>
    <text x="210" y="234" filter="url(#rough2)">2</text>
    <text x="310" y="234" filter="url(#rough2)">2</text>
    <text x="420" y="234" filter="url(#rough2)">0</text>
  </g>

  <!-- Row 'd' -->
  <rect x="80" y="246" width="400" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="120" y="264" filter="url(#rough2)">d</text>
    <text x="210" y="264" filter="url(#rough2)">3</text>
    <text x="310" y="264" filter="url(#rough2)">3</text>
    <text x="420" y="264" filter="url(#rough2)">0</text>
  </g>

  <!-- ====== Result box ====== -->
  <rect x="100" y="296" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最小 diff = <tspan fill="#b85450" font-weight="bold">−4</tspan>（仅字符 'a' 达到）</text>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">四元组 (0, 0, 4, 4) → 返回 1</text>
</svg>
