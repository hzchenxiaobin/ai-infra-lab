<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二叉树剪枝：后序 DFS 流程</text>

  <!-- 入口 -->
  <rect x="210" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="68" text-anchor="middle" font-size="12" fill="#333">prune(root)</text>

  <path d="M 290 80 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,98 400,138 290,178 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#333">root == null ?</text>
  <text x="290" y="152" text-anchor="middle" font-size="11" fill="#888">空节点</text>

  <path d="M 400 138 L 460 138 L 460 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="130" font-size="10" fill="#b85450">是</text>
  <rect x="400" y="80" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="460" y="101" text-anchor="middle" font-size="12" fill="#888">返回 null</text>

  <path d="M 290 178 L 290 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="192" font-size="10" fill="#82b366">否</text>

  <!-- 递归左右 -->
  <rect x="100" y="200" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="222" text-anchor="middle" font-size="11" fill="#333">root.left = prune(root.left)</text>

  <rect x="310" y="200" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="222" text-anchor="middle" font-size="11" fill="#333">root.right = prune(root.right)</text>

  <path d="M 290 234 L 290 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定是否删除自身 -->
  <polygon points="290,254 460,304 290,354 120,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#333">val == 0 且</text>
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#333">left == null 且 right == null ?</text>
  <text x="290" y="328" text-anchor="middle" font-size="10" fill="#888">自身不含 1 → 删除</text>

  <!-- 是 → 删除 -->
  <path d="M 120 304 L 60 304 L 60 360" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="75" y="296" font-size="10" fill="#b85450">是</text>
  <rect x="10" y="362" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="383" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 null</text>

  <!-- 否 → 保留 -->
  <path d="M 460 304 L 520 304 L 520 360" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="485" y="296" font-size="10" fill="#82b366">否</text>
  <rect x="470" y="362" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="520" y="383" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 root</text>

  <text x="290" y="410" text-anchor="middle" font-size="11" fill="#888">后序：先剪子树再判自身 → O(n) 时间 / O(h) 栈空间</text>
</svg>
