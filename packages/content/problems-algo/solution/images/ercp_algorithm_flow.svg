<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建行索引 → 列查索引 → 累加返回</text>

  <!-- Step 0: input -->
  <rect x="180" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入：n×n 矩阵 grid</text>
  <path d="M 280 86 L 280 104" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 1: init rowMap -->
  <rect x="180" y="108" width="200" height="40" fill="#fff" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="12.5" fill="#333">rowMap = {}（行序列 → 计数）</text>
  <path d="M 280 148 L 280 166" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: build index (loop over rows) -->
  <rect x="140" y="170" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">① 遍历每行 R_i</text>
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#333">key = 序列化(R_i)；rowMap[key] ++</text>
  <path d="M 280 218 L 280 236" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: query index (loop over cols), with running ans -->
  <rect x="140" y="240" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② 遍历每列 C_j</text>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#333">key = 序列化(C_j)；ans += rowMap[key]</text>
  <path d="M 280 288 L 280 306" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: return ans -->
  <rect x="180" y="310" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Side annotations -->
  <text x="60" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a">建索引</text>
  <text x="60" y="210" text-anchor="middle" font-size="10.5" fill="#888">O(n²) · n 行</text>
  <text x="500" y="266" text-anchor="middle" font-size="11" fill="#d6a040">查索引</text>
  <text x="500" y="280" text-anchor="middle" font-size="10.5" fill="#888">O(n²) · n 列</text>

  <!-- Bottom note -->
  <path d="M 40 366 L 520 366" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11.5" fill="#888">两次独立线性扫描：先建索引（写入），后查索引（只读）——无回溯、无嵌套逐元素比较</text>
</svg>
