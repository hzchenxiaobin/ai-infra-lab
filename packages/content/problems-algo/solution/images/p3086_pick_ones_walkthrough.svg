<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 3，maxChanges = 1</text>
  <text x="260" y="48" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">nums = [1,1,0,0,0,1,1,0,0,1] → 1 的位置 pos = [0, 1, 5, 6, 9]</text>

  <!-- pos strip -->
  <rect x="130" y="60" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="182" y="60" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="204" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="234" y="60" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="256" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="286" y="60" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="308" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="338" y="60" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="152" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">pos[0]</text>
  <text x="204" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">pos[1]</text>
  <text x="256" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">pos[2]</text>
  <text x="308" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">pos[3]</text>
  <text x="360" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">pos[4]</text>

  <!-- candidate 1: s=3 c=0, window [5,6,9], p=6 -->
  <rect x="30" y="132" width="100" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="151" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">候选① s=3 c=0</text>
  <rect x="150" y="134" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="166" y="151" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="186" y="134" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="151" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="222" y="134" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="151" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="258" y="134" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="274" y="151" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="294" y="134" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="151" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="432" y="132" width="52" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="151" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">总 4</text>
  <text x="150" y="182" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">窗口 [5,6,9]，中位数 p=6（粗框）：|5−6|+|6−6|+|9−6| = 1+0+3 = 4</text>

  <!-- candidate 2: s=2 c=1, window [0,1], p=1 -->
  <rect x="30" y="198" width="100" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选② s=2 c=1</text>
  <rect x="150" y="200" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="166" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="186" y="200" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="202" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="222" y="200" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="238" y="217" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="258" y="200" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="217" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <rect x="294" y="200" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="217" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9</text>
  <rect x="432" y="198" width="52" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总 3 ✓</text>
  <text x="150" y="248" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口 [0,1]，中位数 p=1：|0−1|+|1−1| = 1，再 + 2×1 步造 1 → 3</text>

  <!-- candidate 3: s=2 c=1, window [5,6], p=6 -->
  <rect x="30" y="264" width="100" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="283" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选③ s=2 c=1</text>
  <rect x="150" y="266" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="166" y="283" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="186" y="266" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="283" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="222" y="266" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="283" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="258" y="266" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="274" y="283" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="294" y="266" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="283" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9</text>
  <rect x="432" y="264" width="52" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总 3 ✓</text>
  <text x="150" y="314" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口 [5,6]，中位数 p=6：|5−6|+|6−6| = 1，再 + 2×1 步造 1 → 3</text>

  <!-- footnote -->
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余候选更贵：[0,1,5]→5、[1,5,6]→6、[6,9]→2+3=5、[1,5]→2+4=6……</text>

  <!-- result box -->
  <rect x="60" y="348" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">站 1 白嫖 0 步 → 隔壁的 1 一步换入 → 造 1 个再花 2 步拿入</text>
</svg>
