<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：把 [0, sz) 内的黑名单重映射到 [sz, n) 内的白名单</text>

  <text x="40" y="64" font-size="11.5" fill="#888" font-weight="bold">例：n = 7, blacklist = [2, 3, 5]</text>
  <text x="40" y="80" font-size="10.5" fill="#888">sz = n − |blacklist| = 7 − 3 = 4（白名单总数）</text>

  <text x="40" y="108" font-size="11" fill="#888" font-weight="bold">[0, sz)  = [0, 4)</text>
  <rect x="80" y="118" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <rect x="130" y="118" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <rect x="180" y="118" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="230" y="118" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <text x="105" y="170" text-anchor="middle" font-size="9.5" fill="#888">白</text>
  <text x="155" y="170" text-anchor="middle" font-size="9.5" fill="#888">白</text>
  <text x="205" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">黑名单</text>
  <text x="255" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">黑名单</text>

  <text x="300" y="108" font-size="11" fill="#888" font-weight="bold">[sz, n) = [4, 7)</text>
  <rect x="330" y="118" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="380" y="118" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <rect x="430" y="118" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <text x="355" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">白（目标）</text>
  <text x="405" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">黑名单</text>
  <text x="455" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">白（目标）</text>

  <path d="M 205 158 C 240 210, 320 210, 355 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 255 158 C 290 220, 420 220, 455 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="226" y="196" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">重映射：2 → 4, 3 → 6</text>

  <path d="M 240 235 L 240 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="252" font-size="11.5" fill="#888" font-weight="bold">压缩后：pick 只在 [0, sz) 投点</text>
  <rect x="80" y="266" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="290" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <rect x="130" y="266" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <rect x="180" y="266" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="290" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="230" y="266" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="290" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <text x="105" y="318" text-anchor="middle" font-size="9.5" fill="#888">r=0 → 0</text>
  <text x="155" y="318" text-anchor="middle" font-size="9.5" fill="#888">r=1 → 1</text>
  <text x="205" y="318" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">r=2 → map[2]=4</text>
  <text x="255" y="318" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">r=3 → map[3]=6</text>

  <text x="330" y="276" font-size="11.5" fill="#888" font-weight="bold">哈希表 map（仅存差异）</text>
  <rect x="330" y="286" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{ 2 → 4,  3 → 6 }</text>
  <text x="330" y="330" font-size="10" fill="#888">size ≤ |blacklist∩[0,sz)|</text>

  <rect x="36" y="348" width="488" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="370" font-size="12" fill="#4a7a3a" font-weight="bold">为什么均匀且省空间？</text>
  <text x="56" y="390" font-size="11" fill="#555">• sz = n − |blacklist| 恰为白名单总数；[0, sz) 投点等概率，map 把黑的改写成白的</text>
  <text x="56" y="408" font-size="11" fill="#555">• 哈希表只存「[0, sz) 内的黑名单」：size ≤ |blacklist| ≤ 10⁵，与 n ≤ 10⁹ 解耦</text>
  <text x="56" y="424" font-size="11" fill="#b85450" font-weight="bold">→ n = 10⁹ 也只需 O(10⁵) 空间，pick 每次 O(1) 一次 rand + 一次查表</text>
</svg>
