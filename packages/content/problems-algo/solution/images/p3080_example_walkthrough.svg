<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,2,1,2,3,1]，初始 sum = 12</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序序列：(1,0) (1,3) (1,6) (2,1) (2,2) (2,4) (3,5)</text>

  <!-- table header -->
  <rect x="30" y="48" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="64" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="100" y="64" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">query</text>
  <text x="178" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">点名 idx</text>
  <text x="330" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">指针 j 沿排序序列的动作</text>
  <text x="500" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>

  <!-- row 1 -->
  <rect x="30" y="72" width="500" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="103" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="100" y="103" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="178" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">标记 idx=1（值 2）</text>
  <text x="178" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum: 12→10</text>
  <text x="330" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,0) 标记 → 9；(1,3) 标记 → 8</text>
  <text x="330" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">k=2 用完，j 停在 (1,6)</text>
  <text x="500" y="103" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- row 2 -->
  <rect x="30" y="126" width="500" height="54" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="157" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="100" y="157" font-size="11" fill="#333" filter="url(#rough2)">[3,3]</text>
  <text x="178" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">idx=3 已标</text>
  <text x="178" y="164" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">忽略点名</text>
  <text x="330" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,6) 标记 → 7；(2,1) 已标 → 滑过</text>
  <text x="330" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,2) 标记 → 5；(2,4) 标记 → 3</text>
  <text x="500" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 3 -->
  <rect x="30" y="180" width="500" height="54" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="211" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="100" y="211" font-size="11" fill="#333" filter="url(#rough2)">[4,2]</text>
  <text x="178" y="202" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">idx=4 已标</text>
  <text x="178" y="218" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">忽略点名</text>
  <text x="330" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(3,5) 标记 → 0；j 到头（j = n）</text>
  <text x="330" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">只剩 1 个，不足 k=2，全标完</text>
  <text x="500" y="211" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- insight box -->
  <rect x="30" y="246" width="500" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">💡 教学点在操作②：(2,1) 已被操作①点名标记，指针滑过它时</text>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">不消耗 k——若误把它算进 k 个名额，会少标 (2,4)，答案错成 5 而非 3</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">sum 每标记一次减一次，answer[i] 随时 O(1) 读出</text>

  <!-- warn box -->
  <rect x="30" y="324" width="500" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ 操作③：k=2 但未标记只剩 (3,5) 一个，循环条件 j &lt; n 兜底，</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">剩余不足 k 个就全标完；最终 answer = [8, 3, 0]，与官方示例一致</text>
</svg>
