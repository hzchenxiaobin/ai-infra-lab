<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">行成本模型：(k − n)² ，末行免费</text>

  <!-- Row 1 -->
  <text x="40" y="72" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 行</text>
  <rect x="80" y="54" width="360" height="32" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="54" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="74" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">单词 (长度 n)</text>
  <rect x="280" y="54" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="360" y="74" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">浪费 (k−n)</text>
  <text x="452" y="74" font-size="10" fill="#446688" filter="url(#rough2)">←k→</text>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">成本 = (k − n)²</text>

  <!-- Row 2 -->
  <text x="40" y="148" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 行</text>
  <rect x="80" y="130" width="360" height="32" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="130" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">单词</text>
  <rect x="200" y="130" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">浪费</text>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">成本 = (k − n₂)²</text>

  <!-- Last row -->
  <text x="40" y="224" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末行</text>
  <rect x="80" y="206" width="360" height="32" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="206" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">单词</text>
  <rect x="360" y="206" width="80" height="32" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">不计</text>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">成本 = 0 ✓</text>

  <!-- Total -->
  <rect x="120" y="284" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">总成本 = Σ(非末行成本)</text>

  <!-- note -->
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 该行所有单词长度 + 单词间空格数</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">约束：每行 n ≤ k，单词不能跨行</text>
</svg>
