<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：8 名学生 → 编号 → 行转列 → 3 行报告</text>

  <!-- ============ Stage 1: Original data + sort ============ -->
  <text x="90" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 1: 按洲分组 + 字母序编号</text>

  <!-- America -->
  <text x="50" y="74" font-size="9" fill="#446688" font-weight="bold">America (3人)</text>
  <rect x="30" y="80" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="95" font-size="9" fill="#333">Jane</text>
  <text x="100" y="95" font-size="9" fill="#446688" font-weight="bold">rn=1</text>

  <rect x="30" y="104" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="119" font-size="9" fill="#333">Sarah</text>
  <text x="100" y="119" font-size="9" fill="#446688" font-weight="bold">rn=2</text>

  <rect x="30" y="128" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="143" font-size="9" fill="#333">Tom</text>
  <text x="100" y="143" font-size="9" fill="#446688" font-weight="bold">rn=3</text>

  <!-- Asia -->
  <text x="50" y="168" font-size="9" fill="#4a7a3a" font-weight="bold">Asia (3人)</text>
  <rect x="30" y="174" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="189" font-size="9" fill="#333">Aamir</text>
  <text x="100" y="189" font-size="9" fill="#4a7a3a" font-weight="bold">rn=1</text>

  <rect x="30" y="198" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="213" font-size="9" fill="#333">Adam</text>
  <text x="100" y="213" font-size="9" fill="#4a7a3a" font-weight="bold">rn=2</text>

  <rect x="30" y="222" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="237" font-size="9" fill="#333">Aman</text>
  <text x="100" y="237" font-size="9" fill="#4a7a3a" font-weight="bold">rn=3</text>

  <!-- Europe -->
  <text x="50" y="262" font-size="9" fill="#d6a040" font-weight="bold">Europe (2人)</text>
  <rect x="30" y="268" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="283" font-size="9" fill="#333">Jesus</text>
  <text x="100" y="283" font-size="9" fill="#d6a040" font-weight="bold">rn=1</text>

  <rect x="30" y="292" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="307" font-size="9" fill="#333">Jose</text>
  <text x="100" y="307" font-size="9" fill="#d6a040" font-weight="bold">rn=2</text>

  <!-- arrow to stage 2 -->
  <path d="M 165 190 L 215 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="190" y="182" text-anchor="middle" font-size="8" fill="#888">展开</text>

  <!-- ============ Stage 2: Flattened with rn ============ -->
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Step 2: 拼成带 rn 的行表</text>

  <!-- header -->
  <rect x="220" y="60" width="200" height="24" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="76" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">name</text>
  <text x="315" y="76" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">continent</text>
  <text x="390" y="76" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">rn</text>

  <!-- rn=1 rows -->
  <rect x="220" y="86" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="101" text-anchor="middle" font-size="9" fill="#446688">Jane</text>
  <text x="315" y="101" text-anchor="middle" font-size="9" fill="#446688">America</text>
  <text x="390" y="101" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <rect x="220" y="110" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">Aamir</text>
  <text x="315" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">Asia</text>
  <text x="390" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <rect x="220" y="134" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="149" text-anchor="middle" font-size="9" fill="#d6a040">Jesus</text>
  <text x="315" y="149" text-anchor="middle" font-size="9" fill="#d6a040">Europe</text>
  <text x="390" y="149" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <!-- rn=2 rows -->
  <rect x="220" y="158" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="173" text-anchor="middle" font-size="9" fill="#446688">Sarah</text>
  <text x="315" y="173" text-anchor="middle" font-size="9" fill="#446688">America</text>
  <text x="390" y="173" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <rect x="220" y="182" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="197" text-anchor="middle" font-size="9" fill="#4a7a3a">Adam</text>
  <text x="315" y="197" text-anchor="middle" font-size="9" fill="#4a7a3a">Asia</text>
  <text x="390" y="197" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <rect x="220" y="206" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="221" text-anchor="middle" font-size="9" fill="#d6a040">Jose</text>
  <text x="315" y="221" text-anchor="middle" font-size="9" fill="#d6a040">Europe</text>
  <text x="390" y="221" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <!-- rn=3 rows -->
  <rect x="220" y="230" width="200" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="245" text-anchor="middle" font-size="9" fill="#446688">Tom</text>
  <text x="315" y="245" text-anchor="middle" font-size="9" fill="#446688">America</text>
  <text x="390" y="245" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>

  <rect x="220" y="254" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="269" text-anchor="middle" font-size="9" fill="#4a7a3a">Aman</text>
  <text x="315" y="269" text-anchor="middle" font-size="9" fill="#4a7a3a">Asia</text>
  <text x="390" y="269" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>

  <!-- note: no Europe rn=3 -->
  <text x="320" y="294" text-anchor="middle" font-size="8" fill="#b85450">↑ Europe 无 rn=3 → MAX(NULL) = NULL</text>

  <!-- arrow to stage 3 -->
  <path d="M 435 180 L 470 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="452" y="172" text-anchor="middle" font-size="8" fill="#888">GROUP BY rn</text>

  <!-- ============ Stage 3: Output ============ -->
  <text x="510" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Step 3: 输出</text>

  <!-- header -->
  <rect x="455" y="80" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="96" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">America</text>
  <text x="500" y="96" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Asia</text>
  <text x="530" y="96" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">Europe</text>

  <!-- rn=1 -->
  <rect x="455" y="106" width="90" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="470" y="122" text-anchor="middle" font-size="8" fill="#446688">Jane</text>
  <text x="500" y="122" text-anchor="middle" font-size="8" fill="#4a7a3a">Aamir</text>
  <text x="530" y="122" text-anchor="middle" font-size="8" fill="#d6a040">Jesus</text>

  <!-- rn=2 -->
  <rect x="455" y="134" width="90" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="8" fill="#446688">Sarah</text>
  <text x="500" y="150" text-anchor="middle" font-size="8" fill="#4a7a3a">Adam</text>
  <text x="530" y="150" text-anchor="middle" font-size="8" fill="#d6a040">Jose</text>

  <!-- rn=3 -->
  <rect x="455" y="162" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="178" text-anchor="middle" font-size="8" fill="#446688">Tom</text>
  <text x="500" y="178" text-anchor="middle" font-size="8" fill="#4a7a3a">Aman</text>
  <text x="530" y="178" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">null</text>

  <!-- rn labels -->
  <text x="448" y="122" text-anchor="end" font-size="8" fill="#b85450" font-weight="bold">rn=1</text>
  <text x="448" y="150" text-anchor="end" font-size="8" fill="#b85450" font-weight="bold">rn=2</text>
  <text x="448" y="178" text-anchor="end" font-size="8" fill="#b85450" font-weight="bold">rn=3</text>

  <!-- bottom summary -->
  <rect x="30" y="340" width="515" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="287" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">关键洞察：rn 是行转列的「对齐键」</text>
  <text x="287" y="374" text-anchor="middle" font-size="9" fill="#555">同 rn 的不同洲学生 → 同一输出行；某洲无此 rn → MAX(NULL)=NULL 自动补位</text>

  <!-- NULL explanation -->
  <rect x="30" y="392" width="515" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="287" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Europe 只有 2 人 → rn=3 缺失 → MAX(CASE...THEN name END) 对全 NULL 组聚合 = NULL</text>
  <text x="287" y="424" text-anchor="middle" font-size="9" fill="#888">行数 = max(3, 3, 2) = 3，Europe 第 3 行自动填 NULL</text>
</svg>
