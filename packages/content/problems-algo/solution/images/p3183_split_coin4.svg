<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：把「限量的 4」从背包里拎出来，按使用枚数拆三块</text>

  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">手里的硬币：三种「无限」+ 一种「只有 2 枚」</text>

  <ellipse cx="86" cy="74" rx="34" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="71" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="86" y="84" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">∞ 无限</text>

  <ellipse cx="166" cy="74" rx="34" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="71" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="166" y="84" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">∞ 无限</text>

  <ellipse cx="246" cy="74" rx="34" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="71" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="246" y="84" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">∞ 无限</text>

  <ellipse cx="360" cy="74" rx="38" ry="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="71" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="360" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">只有 2 枚！</text>

  <text x="462" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">混合背包</text>
  <text x="462" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">= 完全 + 限量</text>

  <path d="M 260 102 L 260 126" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="268" y="120" font-size="10" fill="#446688" filter="url(#rough2)">每个方案「用了几枚 4」是唯一确定的 → 互斥且完备的划分</text>

  <rect x="16" y="134" width="58" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="45" y="155" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">0 枚 4</text>
  <rect x="90" y="134" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="155" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">用 {1, 2, 6} 凑出 n　　　　　→ f[n]</text>
  <rect x="434" y="134" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="469" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">f[n]</text>

  <rect x="16" y="178" width="58" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="45" y="199" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1 枚 4</text>
  <rect x="70" y="182" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="83" y="200" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 100 195 L 116 195" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="120" y="178" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="199" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">用 {1, 2, 6} 凑出 n − 4　→ f[n−4]</text>
  <rect x="434" y="178" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="469" y="199" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">f[n−4]</text>

  <rect x="16" y="222" width="58" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="45" y="243" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2 枚 4</text>
  <rect x="60" y="226" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="73" y="244" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="90" y="226" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="103" y="244" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 120 239 L 136 239" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="140" y="222" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">用 {1, 2, 6} 凑出 n − 8　→ f[n−8]</text>
  <rect x="434" y="222" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="469" y="243" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">f[n−8]</text>

  <rect x="16" y="272" width="488" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = f[n] + f[n−4] + f[n−8]</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">f：只用无限硬币 {1,2,6} 的完全背包计数（f[0] = 1）· 后两项越界（n &lt; 4 / n &lt; 8）时跳过</text>

  <rect x="16" y="338" width="488" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别把「两枚 4」拆成两个 0-1 物品塞进背包</text>
  <text x="260" y="380" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">计数背包里同值硬币不可分辨：转移两轮 = old + 2·old[−4] + old[−8]，</text>
  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">「恰好一枚 4」被数两次 → n=4 时得 5（正确为 4），n=12 时得 29（正确为 22）</text>
</svg>
