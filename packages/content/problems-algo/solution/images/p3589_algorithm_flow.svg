<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">流程：埃氏筛 → 质数序列双单调队列滑窗 → 间隔乘积计数</text>

  <!-- 前置 -->
  <rect x="90" y="32" width="340" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">埃氏筛 is_prime[0..V]，扫 nums 收集质数位置 q[] 与值 v[]</text>
  <path d="M 260 62 L 260 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="150,104 260,76 370,104 260,132" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">质数个数 m &lt; 2 ?</text>
  <text x="378" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 370 104 L 406 104" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="408" y="88" width="96" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 0</text>
  <text x="268" y="144" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 132 L 260 146" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="185" y="148" width="150" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">for j = 0 … m−1</text>
  <text x="390" y="186" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">j = 子数组的最右质数</text>
  <path d="M 260 178 L 260 188" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 入队 -->
  <rect x="48" y="188" width="424" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① v[j] 入两条单调队列（存质数序号）：</text>
  <text x="260" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">maxDq 值递减 / minDq 值递增，队尾破坏单调先弹出</text>
  <path d="M 260 228 L 260 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 判定菱形 -->
  <polygon points="145,282 260,252 375,282 260,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">队首 max − min &gt; k ?</text>
  <text x="378" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 375 282 L 387 282" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="390" y="262" width="100" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">队首==i₀ 则出队</text>
  <text x="440" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i₀ ← i₀ + 1</text>
  <path d="M 420 262 C 400 246, 175 246, 145 276" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="295" y="238" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">缩完重判</text>
  <text x="268" y="324" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 312 L 260 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ③ 计数 -->
  <rect x="48" y="328" width="424" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">③ 窗口内 ≥ 2 个质数（i₀ ≤ j−1）时，long long 累加：</text>
  <text x="260" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans += (q[j−1] − q[i₀−1]) × (q[j+1] − q[j])</text>

  <!-- 循环回边 -->
  <path d="M 472 350 C 500 350, 500 163, 342 163" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="460" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">j++</text>

  <path d="M 260 372 L 260 384" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="120" y="386" width="280" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">j 走完质数序列 → 返回 ans</text>
  <text x="260" y="418" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">i₀、j 单向右移，每个序号至多出入队一次 ⇒ 均摊 O(m)</text>
</svg>
