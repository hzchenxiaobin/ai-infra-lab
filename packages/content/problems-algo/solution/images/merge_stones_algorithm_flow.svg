<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">区间 DP 流程：按长度递增 + 切分点 k</text>

  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">对区间 [i..j]，枚举切分点 k（步长 K−1）拼左右两段</text>

  <rect x="40" y="70" width="500" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">区间 [i .. j]，长度 len = j − i + 1</text>

  <rect x="60" y="104" width="150" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左段 [i..k]</text>

  <text x="232" y="127" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="250" y="104" width="150" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右段 [k+1..j]</text>

  <text x="430" y="127" font-size="11" fill="#888" filter="url(#rough2)">k 步长 K−1</text>

  <path d="M 290 156 Q 290 174 290 192" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="196" width="500" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="218" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">dp[i][j] = min(dp[i][k] + dp[k+1][j])</text>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">k = i, i+(K−1), i+2(K−1), …  （保证左段能合到 1 堆）</text>

  <path d="M 290 256 Q 290 274 290 292" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,294 470,330 290,366 110,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(len−1) % (K−1)</text>
  <text x="290" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">== 0 ?</text>

  <path d="M 200 340 Q 150 360 130 388" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="372" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 380 340 Q 430 360 450 388" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="372" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="50" y="392" width="190" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="414" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">触发最终合并</text>
  <text x="145" y="434" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dp[i][j] += sum(i..j)</text>
  <text x="145" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">K 堆 → 1 堆的成本</text>

  <rect x="340" y="392" width="190" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="414" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">不额外加成本</text>
  <text x="435" y="434" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">仅拼接，堆数尚不够 K</text>
  <text x="435" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">等待更长区间再合并</text>
</svg>
