<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：等式移项拆成左右两组，左半存和，右半查差</text>

  <!-- Original equation -->
  <rect x="120" y="46" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">nums[a] + nums[b] + nums[c] = nums[d]</text>

  <!-- Arrow down: 移项 -->
  <path d="M 300 84 L 300 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="96" font-size="10" fill="#888">移项</text>

  <!-- Rearranged equation -->
  <rect x="100" y="102" width="400" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">
    <tspan fill="#446688">nums[a] + nums[b]</tspan>
    <tspan fill="#444"> = </tspan>
    <tspan fill="#b85450">nums[d] - nums[c]</tspan>
  </text>

  <!-- Left group label -->
  <rect x="30" y="158" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左半：(a, b)  a &lt; b</text>

  <!-- Left array: indices a, b -->
  <text x="42" y="202" font-size="10" fill="#888">下标</text>
  <text x="100" y="202" font-size="10" fill="#446688" font-weight="bold">a</text>
  <text x="160" y="202" font-size="10" fill="#446688" font-weight="bold">b</text>
  <rect x="82" y="208" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="208" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="120" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a">存入哈希表 cnt[和]++</text>
  <path d="M 120 256 L 240 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Right group label -->
  <rect x="390" y="158" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">右半：(c, d)  c &lt; d</text>

  <!-- Right array: indices c, d -->
  <text x="402" y="202" font-size="10" fill="#888">下标</text>
  <text x="460" y="202" font-size="10" fill="#b85450" font-weight="bold">c</text>
  <text x="520" y="202" font-size="10" fill="#b85450" font-weight="bold">d</text>
  <rect x="442" y="208" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="502" y="208" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <text x="480" y="252" text-anchor="middle" font-size="10" fill="#b85450">查 cnt[nums[d]-nums[c]]</text>
  <path d="M 480 256 L 360 256" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Hash map box -->
  <rect x="210" y="244" width="180" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">哈希表 cnt</text>
  <line x1="300" y1="270" x2="300" y2="316" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="245" y="286" font-size="10" fill="#888">差值</text>
  <text x="350" y="286" font-size="10" fill="#888">次数</text>
  <text x="245" y="302" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="350" y="302" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="245" y="314" font-size="9" fill="#999">= 5-3</text>

  <!-- Ordering constraint -->
  <rect x="80" y="338" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键约束：a &lt; b &lt; c &lt; d  →  从右往左扫 b，cnt 只装右侧 (c,d) 对</text>

  <!-- complexity -->
  <rect x="150" y="372" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(n²) 建表 + O(n²) 查表 = O(n²)</text>
</svg>
