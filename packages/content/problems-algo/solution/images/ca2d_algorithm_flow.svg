<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历，按「出现序号」投放</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">第 k 次出现的 x → 第 k 行；同值副本各去不同行，天然不重复</text>

  <!-- ① freq -->
  <rect x="120" y="58" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#224">① 统计频次：freq[x] += 1</text>
  <path d="M 260 94 L 260 110" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② R = maxFreq -->
  <rect x="120" y="110" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#224">② R = max(freq)；预建 R 个空行</text>
  <path d="M 260 144 L 260 160" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ loop header -->
  <rect x="120" y="160" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#243">③ for x in nums：</text>
  <path d="M 260 190 L 260 206" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ④ k = seen[x] -->
  <rect x="120" y="206" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#5a3a00">④ k = seen[x]   （第 k 次出现）</text>
  <path d="M 260 236 L 260 252" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ⑤ append -->
  <rect x="120" y="252" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#5a3a00">⑤ ans[k].append(x)；seen[x] += 1</text>
  <path d="M 260 286 L 260 302" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,300 330,328 260,356 190,328" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遍历完?</text>

  <!-- loop back: no -->
  <path d="M 190 328 L 70 328 L 70 175 L 118 175" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="76" y="252" font-size="10" fill="#b85450">否（下个 x）</text>

  <!-- yes: down -->
  <path d="M 260 356 L 260 372" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="368" font-size="10" fill="#4a7a3a">是</text>

  <!-- return -->
  <rect x="120" y="372" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="12" fill="#243" font-weight="bold">返回 ans（共 maxFreq 行）</text>

  <text x="400" y="80" font-size="9" fill="#888">O(n)</text>
  <text x="400" y="132" font-size="9" fill="#888">空间 O(n)</text>
  <text x="400" y="274" font-size="9" fill="#888">O(1) / 元素</text>
</svg>
