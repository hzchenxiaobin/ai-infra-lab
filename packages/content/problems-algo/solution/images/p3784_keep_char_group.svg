<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">留下谁？—— 按字母分桶，留「代价和」最大的那组</text>

  <!-- 字符格子 s = "aabaac" -->
  <rect x="118" y="42" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="42" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="42" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="268" y="42" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="318" y="42" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="368" y="42" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="142" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="192" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="242" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#d6a040" filter="url(#rough2)">b</text>
  <text x="292" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="342" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="392" y="66" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c</text>

  <text x="100" y="98" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">cost:</text>
  <text x="142" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="192" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="242" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="292" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="342" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="392" y="98" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">10</text>

  <rect x="432" y="44" width="62" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">Σ = 21</text>

  <path d="M 264 106 L 264 130" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="124" font-size="12" fill="#666" filter="url(#rough2)">按字母分桶累加</text>

  <!-- 三个桶 -->
  <rect x="56" y="138" width="120" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">桶 a</text>
  <text x="116" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1+2+4+1</text>
  <text x="116" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ = 8</text>

  <rect x="200" y="138" width="120" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">桶 b</text>
  <text x="260" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">Σ = 3</text>

  <rect x="344" y="138" width="120" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="404" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">桶 c</text>
  <text x="404" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="404" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Σ = 10</text>

  <rect x="346" y="116" width="86" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">保留这组!</text>

  <!-- 公式框 -->
  <rect x="68" y="244" width="384" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = Σcost − max(Σ桶)</text>
  <text x="260" y="294" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 21 − 10 = 11</text>

  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">删掉 a、b 两组共付 8+3=11，只留代价和最大的 "c" 组</text>
</svg>
