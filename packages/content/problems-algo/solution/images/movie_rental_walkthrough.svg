<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：7 步操作全流程</text>

  <!-- Column headers -->
  <text x="45" y="52" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="110" y="52" font-size="10" fill="#888" font-weight="bold">操作</text>
  <text x="240" y="52" font-size="10" fill="#4a7a3a" font-weight="bold">available[movie]</text>
  <text x="430" y="52" font-size="10" fill="#b85450" font-weight="bold">rented</text>
  <text x="535" y="52" font-size="10" fill="#d6a040" font-weight="bold">输出</text>

  <!-- Header separator -->
  <line x1="20" y1="60" x2="560" y2="60" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: init -->
  <rect x="20" y="66" width="540" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="86" font-size="10" fill="#333">0</text>
  <text x="100" y="86" font-size="10" fill="#333">init(3, entries)</text>
  <text x="210" y="80" font-size="9" fill="#4a7a3a">m1:{(4,1),(5,0),(5,2)}</text>
  <text x="210" y="94" font-size="9" fill="#4a7a3a">m2:{(6,0),(7,1)} m3:{(7,0)}</text>
  <text x="400" y="86" font-size="9" fill="#b85450">{ } 空</text>
  <text x="520" y="86" font-size="10" fill="#d6a040">null</text>

  <!-- Step 1: search(1) -->
  <rect x="20" y="110" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="130" font-size="10" fill="#333">1</text>
  <text x="100" y="130" font-size="10" fill="#333">search(1)</text>
  <text x="210" y="130" font-size="9" fill="#4a7a3a">取 m1 前 5：(4,1)(5,0)(5,2)</text>
  <text x="400" y="130" font-size="9" fill="#888">不变</text>
  <text x="520" y="130" font-size="10" fill="#d6a040" font-weight="bold">[1,0,2]</text>

  <!-- Step 2: rent(0,1) -->
  <rect x="20" y="154" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="174" font-size="10" fill="#333">2</text>
  <text x="100" y="174" font-size="10" fill="#333">rent(0,1)</text>
  <text x="210" y="170" font-size="9" fill="#d6a040">m1: erase (5,0)</text>
  <text x="210" y="184" font-size="9" fill="#4a7a3a">→ {(4,1),(5,2)}</text>
  <text x="400" y="174" font-size="9" fill="#d6a040">insert (5,0,1)</text>
  <text x="400" y="188" font-size="9" fill="#b85450">→ {(5,0,1)}</text>
  <text x="520" y="178" font-size="10" fill="#d6a040">null</text>

  <!-- Step 3: rent(1,2) -->
  <rect x="20" y="202" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="222" font-size="10" fill="#333">3</text>
  <text x="100" y="222" font-size="10" fill="#333">rent(1,2)</text>
  <text x="210" y="218" font-size="9" fill="#d6a040">m2: erase (7,1)</text>
  <text x="210" y="232" font-size="9" fill="#4a7a3a">→ {(6,0)}</text>
  <text x="400" y="218" font-size="9" fill="#d6a040">insert (7,1,2)</text>
  <text x="400" y="232" font-size="9" fill="#b85450">→ {(5,0,1),(7,1,2)}</text>
  <text x="520" y="226" font-size="10" fill="#d6a040">null</text>

  <!-- Step 4: report() -->
  <rect x="20" y="250" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="270" font-size="10" fill="#333">4</text>
  <text x="100" y="270" font-size="10" fill="#333">report()</text>
  <text x="210" y="270" font-size="9" fill="#888">不变</text>
  <text x="400" y="270" font-size="9" fill="#b85450">取前 5：(5,0,1)(7,1,2)</text>
  <text x="510" y="270" font-size="9.5" fill="#d6a040" font-weight="bold">[[0,1],[1,2]]</text>

  <!-- Step 5: drop(1,2) -->
  <rect x="20" y="294" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="314" font-size="10" fill="#333">5</text>
  <text x="100" y="314" font-size="10" fill="#333">drop(1,2)</text>
  <text x="210" y="310" font-size="9" fill="#d6a040">m2: insert (7,1)</text>
  <text x="210" y="324" font-size="9" fill="#4a7a3a">→ {(6,0),(7,1)}</text>
  <text x="400" y="310" font-size="9" fill="#d6a040">erase (7,1,2)</text>
  <text x="400" y="324" font-size="9" fill="#b85450">→ {(5,0,1)}</text>
  <text x="520" y="318" font-size="10" fill="#d6a040">null</text>

  <!-- Step 6: search(2) -->
  <rect x="20" y="342" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="35" y="362" font-size="10" fill="#333">6</text>
  <text x="100" y="362" font-size="10" fill="#333">search(2)</text>
  <text x="210" y="362" font-size="9" fill="#4a7a3a">取 m2 前 5：(6,0)(7,1)</text>
  <text x="400" y="362" font-size="9" fill="#888">不变</text>
  <text x="520" y="362" font-size="10" fill="#d6a040" font-weight="bold">[0,1]</text>

  <!-- Arrows down -->
  <path d="M290 106 L290 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M290 150 L290 154" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M290 198 L290 202" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M290 246 L290 250" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M290 290 L290 294" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M290 338 L290 342" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Key observation footer ===== -->
  <rect x="20" y="400" width="540" height="64" fill="#f6f8fa" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键观察</text>
  <text x="40" y="442" font-size="11" fill="#555">rent/drop 是一对逆操作：在 available 和 rented 之间做对称的 erase + insert</text>
  <text x="40" y="458" font-size="11" fill="#555">有序集合自带排序，search/report 只需取前 5 个元素，无需额外排序</text>
</svg>
