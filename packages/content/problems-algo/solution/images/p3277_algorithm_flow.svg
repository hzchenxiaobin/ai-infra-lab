<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：O(n²) 预处理两张表，查询 O(1) 读表</text>

  <!-- input -->
  <rect x="100" y="42" width="320" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">输入：nums（n ≤ 2000）、queries（q ≤ 10⁵）</text>
  <path d="M 260 78 L 260 90" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: f table -->
  <rect x="80" y="92" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建分数表 f：f[i][j] = f[i][j−1] ⊕ f[i+1][j]</text>
  <text x="260" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">行 i 自底向上 · 列 j 自左向右 · O(n²)</text>
  <path d="M 260 142 L 260 154" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: g table -->
  <rect x="80" y="156" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 建查询表 g：g[i][j] = max(g[i][j−1], g[i+1][j], f[i][j])</text>
  <text x="260" y="194" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">与 f 同一个双循环里顺手填 · O(n²)</text>
  <path d="M 260 206 L 260 218" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: queries -->
  <rect x="80" y="220" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 每条查询 [l, r] → 直接读 g[l][r]</text>
  <text x="260" y="258" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">查询侧零枚举 · O(1) × q</text>
  <path d="M 260 270 L 260 282" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="100" y="284" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">总复杂度 O(n² + q)</text>
  <text x="260" y="320" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">预处理约 4×10⁶ 格 O(1) 转移 + 10⁵ 次读表</text>
</svg>
