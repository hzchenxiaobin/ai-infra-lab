<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：建表 → 叠加（命中则浅合并）→ 取值 → 排序</text>

  <!-- Step 1: 建表 -->
  <rect x="180" y="46" width="260" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">① 建表：遍历 arr1</text>
  <text x="310" y="84" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">map.set(obj.id, obj)</text>

  <path d="M 310 96 L 310 120" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 叠加 arr2 -->
  <rect x="180" y="124" width="260" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">② 遍历 arr2：逐个判定 id</text>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">对每个 obj2 ∈ arr2</text>

  <!-- 决策菱形 -->
  <path d="M 310 184 L 410 220 L 310 256 L 210 220 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)" font-weight="bold">map.has(id)?</text>
  <text x="310" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">id 是否已存在</text>

  <path d="M 310 174 L 310 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是: 浅合并 -->
  <rect x="30" y="206" width="160" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">是 → 浅合并</text>
  <text x="110" y="244" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">{...old, ...obj2}</text>
  <path d="M 210 220 L 190 220" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="212" font-size="9" fill="#b85450" filter="url(#rough2)" font-weight="bold">是</text>

  <!-- 否: 直接入表 -->
  <rect x="430" y="206" width="160" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">否 → 直接入表</text>
  <text x="510" y="244" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">map.set(id, obj2)</text>
  <path d="M 410 220 L 430 220" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="416" y="212" font-size="9" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">否</text>

  <!-- 两路汇合 -->
  <path d="M 110 256 C 110 286, 240 292, 300 300" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 510 256 C 510 286, 380 292, 320 300" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: 取值 -->
  <rect x="180" y="304" width="260" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">③ 取全部值</text>
  <text x="310" y="342" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">result = [...map.values()]</text>

  <path d="M 310 354 L 310 378" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 排序 -->
  <rect x="180" y="382" width="260" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="402" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)" font-weight="bold">④ 按 id 升序排序</text>
  <text x="310" y="420" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">result.sort((a,b) =&gt; a.id - b.id)</text>

  <path d="M 310 432 L 310 450" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="310" y="472" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">return joinedArray</text>
</svg>
