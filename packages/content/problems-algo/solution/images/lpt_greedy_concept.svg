<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：排序后检查相邻三元组</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">固定最大边 c，最优 a、b 就是相邻的两个较大元素</text>

  <!-- sorted array: [2, 3, 4, 8] -->
  <text x="30" y="82" font-size="12" fill="#888">升序排序：</text>
  <rect x="110" y="66" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="170" y="66" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="198" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a = nums[i]</text>

  <rect x="230" y="66" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="258" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = nums[i+1]</text>

  <rect x="290" y="66" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="318" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c = nums[i+2]</text>

  <!-- bracket showing the triple -->
  <path d="M 170 130 L 170 136 L 318 136 L 318 130" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="244" y="152" text-anchor="middle" font-size="11" fill="#888">相邻三元组 (a, b, c)</text>

  <!-- check box: fail -->
  <rect x="40" y="168" width="460" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">检查：a + b &gt; c ?   3 + 4 = 7 ≤ 8  ✗ → c=8 无法作为最大边，跳过</text>

  <!-- next check: success -->
  <rect x="40" y="212" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i−− → 检查 (2, 3, 4)：2 + 3 = 5 &gt; 4  ✓ → 周长 = 2 + 3 + 4 = 9</text>

  <!-- insight box -->
  <rect x="40" y="258" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">贪心关键：固定 c 后，a、b 取相邻的两个最大元素即可</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#666">若相邻的 a + b ≤ c，则任何更小的配对也必 ≤ c，c 必失败</text>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#666">从最大的 c 往左扫，首个合法三元组即为最大周长</text>
</svg>
