<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：±1 转化 + 前缀和</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1,2,2,3]，target = 2</text>

  <!-- nums 行 -->
  <text x="72" y="80" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="90" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="178" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="222" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 180 94 L 180 110" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="106" font-size="11" fill="#666" filter="url(#rough2)">target 记 +1，其余记 −1</text>

  <!-- B 行 -->
  <text x="72" y="136" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">B</text>
  <rect x="90" y="114" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="135" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−1</text>
  <rect x="134" y="114" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="178" y="114" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="222" y="114" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="135" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−1</text>

  <path d="M 180 150 L 180 166" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="162" font-size="11" fill="#666" filter="url(#rough2)">前缀和，哨兵 P[0] = 0 打头</text>

  <!-- P 行：5 个格子，对齐 B 格子边界 -->
  <text x="56" y="192" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">P</text>
  <rect x="68" y="170" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="191" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="112" y="170" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="156" y="170" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="170" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="170" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="90" y="216" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">P[0]</text>
  <text x="134" y="216" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">P[1]</text>
  <text x="178" y="216" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">P[2]</text>
  <text x="222" y="216" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">P[3]</text>
  <text x="266" y="216" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">P[4]</text>

  <!-- 右侧公式框 -->
  <rect x="340" y="58" width="170" height="146" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="425" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2·cnt &gt; len</text>
  <text x="425" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇔ cnt−(len−cnt) &gt; 0</text>
  <text x="425" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇔ ΣB(l..r) &gt; 0</text>
  <text x="425" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇔ P[l] &lt; P[r+1]</text>
  <text x="425" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">答案 = 顺序对数</text>

  <!-- 绿色配对弧线：P[1] → P[3] -->
  <path d="M 134 220 Q 178 254 220 220" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">P[1] &lt; P[3]：B 区间和 = 2 &gt; 0，[2,2] 合法 ✓</text>

  <!-- 红色虚线弧：P[0] → P[2]（相等，不配对） -->
  <path d="M 90 224 Q 134 292 176 224" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="210" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">P[0] = P[2]：和 = 0 恰好一半，✗</text>

  <text x="140" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">值域 [−n, n] 平移 +n+1 进树状数组</text>
  <text x="140" y="348" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">数出所有 i &lt; j 且 P[i] &lt; P[j] 的对</text>
</svg>
