<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最小体力消耗路径：路径代价 = 相邻格高度差的最大值</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">找一条 (0,0)→(m−1,n−1) 的路，使「最大单步落差」尽量小</text>

  <!-- ===== Grid 3x3 : heights = [[1,2,2],[3,8,2],[5,3,5]] ===== -->
  <text x="90" y="86" font-size="11" fill="#446688" font-weight="bold">示例网格（数字 = 格子高度）</text>

  <!-- row 0 -->
  <rect x="90" y="110" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="146" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <text x="120" y="100" text-anchor="middle" font-size="8" fill="#d6a040">起点</text>

  <rect x="150" y="110" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="146" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>

  <rect x="210" y="110" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="146" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>

  <!-- row 1 -->
  <rect x="90" y="170" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="206" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="150" y="170" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="206" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">8</text>

  <rect x="210" y="170" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="206" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>

  <!-- row 2 -->
  <rect x="90" y="230" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="266" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="150" y="230" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="266" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="210" y="230" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="266" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <text x="240" y="306" text-anchor="middle" font-size="8" fill="#b85450">终点</text>

  <!-- path arrows (between shared edges) -->
  <path d="M 120 156 L 120 184" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="174" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <path d="M 120 216 L 120 244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="234" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <path d="M 136 260 L 164 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <path d="M 196 260 L 224 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <!-- ===== Right panel: path effort ===== -->
  <text x="310" y="86" font-size="11" fill="#4a7a3a" font-weight="bold">路径代价拆解</text>

  <rect x="310" y="98" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="120" text-anchor="middle" font-size="12" fill="#333">高度序列：1 → 3 → 5 → 3 → 5</text>
  <text x="425" y="140" text-anchor="middle" font-size="12" fill="#333">单步差值：2, 2, 2, 2</text>
  <text x="425" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">effort = max{2,2,2,2} = 2</text>
  <text x="425" y="180" text-anchor="middle" font-size="9" fill="#666">不是求和、不是平均值，只看最陡的那一步</text>

  <!-- ===== Monotonicity panel ===== -->
  <text x="310" y="214" font-size="11" fill="#b85450" font-weight="bold">关键单调性（二分答案的依据）</text>

  <rect x="310" y="226" width="230" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="322" y="248" font-size="11" fill="#333">设 reachable(t) = 只走高度差 ≤ t 的边</text>
  <text x="322" y="264" font-size="11" fill="#333">能否从起点到达终点。</text>
  <text x="322" y="286" font-size="11" fill="#b85450" font-weight="bold">t 越大 → 可走的边越多 → reachable(t)</text>
  <text x="322" y="300" font-size="11" fill="#b85450" font-weight="bold">单调不减（false…false, true…true）</text>
  <text x="322" y="316" font-size="9" fill="#666">→ 存在分界点 t*，即所求最小体力</text>

  <!-- footer -->
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">把「最小化最大落差」转化为：在阈值 t 上二分，BFS/DFS 判连通 → 二分答案 + 连通性判定</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#aaa">同源思想：410 分割数组最大值、1011 送达包裹能力——都是「最小化最大值 + 单调 check」</text>
</svg>
