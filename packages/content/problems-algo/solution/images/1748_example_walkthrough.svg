<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 3, 2] → ans = 4</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一趟 cnt[v]++ 填桶，第二趟累加 cnt==1 的 v</text>

  <!-- Phase 1 header -->
  <text x="40" y="68" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一趟：计数</text>

  <!-- Header row -->
  <rect x="30" y="76" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="94">步骤 i</text>
    <text x="180" y="94">nums[i]</text>
    <text x="320" y="94">cnt 变化</text>
    <text x="500" y="94">cnt 状态（v=1,2,3）</text>
  </g>

  <!-- Row i=0 -->
  <rect x="30" y="108" width="540" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="126" font-weight="bold">0</text>
    <text x="180" y="126" fill="#d6a040" font-weight="bold">1</text>
    <text x="320" y="126">cnt[1]++</text>
    <text x="500" y="126">{1, 0, 0}</text>
  </g>

  <!-- Row i=1 -->
  <rect x="30" y="138" width="540" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="156" font-weight="bold">1</text>
    <text x="180" y="156" fill="#d6a040" font-weight="bold">2</text>
    <text x="320" y="156">cnt[2]++</text>
    <text x="500" y="156">{1, 1, 0}</text>
  </g>

  <!-- Row i=2 -->
  <rect x="30" y="168" width="540" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="186" font-weight="bold">2</text>
    <text x="180" y="186" fill="#d6a040" font-weight="bold">3</text>
    <text x="320" y="186">cnt[3]++</text>
    <text x="500" y="186">{1, 1, 1}</text>
  </g>

  <!-- Row i=3 HIGHLIGHTED (2 becomes duplicate) -->
  <rect x="30" y="198" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="216" fill="#333" font-weight="bold">3</text>
    <text x="180" y="216" fill="#d6a040" font-weight="bold">2</text>
    <text x="320" y="216" fill="#b85450" font-weight="bold">cnt[2]++</text>
    <text x="500" y="216" fill="#b85450" font-weight="bold">{1, 2, 1} ← 2 不再唯一</text>
  </g>

  <!-- Phase 2 header -->
  <text x="40" y="250" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二趟：求和（遍历 v = 1..100）</text>

  <!-- Header row 2 -->
  <rect x="30" y="258" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80" y="276">值 v</text>
    <text x="220" y="276">cnt[v]</text>
    <text x="360" y="276">唯一？</text>
    <text x="510" y="276">ans</text>
  </g>

  <!-- v=1 HIGHLIGHTED -->
  <rect x="30" y="290" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="80" y="308" fill="#333" font-weight="bold">1</text>
    <text x="220" y="308" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="360" y="308" fill="#4a7a3a" font-weight="bold">✓ 是</text>
    <text x="510" y="308" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- v=2 -->
  <rect x="30" y="320" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="80" y="338" fill="#333" font-weight="bold">2</text>
    <text x="220" y="338" fill="#b85450" font-weight="bold">2</text>
    <text x="360" y="338" fill="#b85450">✗ 否</text>
    <text x="510" y="338" fill="#888">1</text>
  </g>

  <!-- v=3 HIGHLIGHTED -->
  <rect x="30" y="350" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="80" y="368" fill="#333" font-weight="bold">3</text>
    <text x="220" y="368" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="360" y="368" fill="#4a7a3a" font-weight="bold">✓ 是</text>
    <text x="510" y="368" fill="#4a7a3a" font-weight="bold">4 ←</text>
  </g>

  <!-- Result -->
  <path d="M 510 380 L 510 396" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="380" y="398" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="510" y="414" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans = 4 ✓</text>
</svg>
