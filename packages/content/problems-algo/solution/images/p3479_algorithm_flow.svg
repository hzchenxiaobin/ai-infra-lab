<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">算法流程：逐水果在线分配——descend 与置 0 回溯都是 O(log n)</text>

  <!-- step 1 -->
  <rect x="80" y="30" width="360" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 建最大值线段树：叶 i 存 baskets[i]，内部结点存区间 max</text>
  <path d="M260,56 L260,66" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: loop -->
  <rect x="80" y="70" width="360" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 从左到右逐个处理水果 f</text>
  <path d="M260,96 L260,110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="260,114 364,150 260,186 156,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">根 max &lt; f ？</text>

  <!-- yes branch -->
  <path d="M364,150 L375,150" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="369" y="141" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="378" y="133" width="120" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="147" text-anchor="middle" font-size="10.5" fill="#7a2f2b" filter="url(#rough2)">unplaced++</text>
  <text x="438" y="160" text-anchor="middle" font-size="8.5" fill="#7a2f2b" filter="url(#rough2)">整棵树都装不下</text>

  <!-- right return -->
  <path d="M498,150 L508,150 L508,83 L444,83" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="76" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">取下一个水果</text>

  <!-- no branch -->
  <path d="M260,186 L260,197" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="196" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">否（有解）</text>

  <!-- step 4 -->
  <rect x="80" y="200" width="360" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ 树上二分：左子 max ≥ f ? 往左 : 往右 → 落到叶子 j</text>
  <path d="M260,226 L260,237" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="110" y="240" width="300" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑤ 占用：叶 j 置 0，自底向上回溯刷新祖先 max</text>

  <!-- left return -->
  <path d="M110,253 L34,253 L34,83 L74,83" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="247" font-size="8.5" fill="#888" filter="url(#rough2)">下一个</text>

  <!-- exit -->
  <path d="M260,266 L260,294" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="284" font-size="9" fill="#4a7a3a" filter="url(#rough2)">全部处理完</text>

  <!-- step 6 -->
  <rect x="160" y="298" width="260" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="315" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">⑥ 返回未放置的水果数 unplaced</text>

  <!-- note -->
  <rect x="80" y="340" width="360" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">单次水果：descend O(log n) + 置 0 回溯 O(log n)</text>
  <text x="260" y="374" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">总计 O(n log n) 时间 / O(n) 空间，n ≤ 10⁵ 稳过</text>
</svg>
