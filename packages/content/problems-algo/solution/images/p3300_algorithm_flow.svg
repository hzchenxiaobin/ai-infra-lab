<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：外层遍历数组 + 内层取数位 + 在线 min</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="48" rx="36" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 64 L 260 73" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="180" y="76" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">ans = +∞，i = 0</text>
  <path d="M 260 102 L 260 109" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="180" y="112" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">x = nums[i]，s = 0</text>

  <!-- 内层循环回边（先画，压在底层） -->
  <path d="M 431 170 L 431 150 L 260 150 L 260 162" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="144" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">继续取位</text>
  <path d="M 260 138 L 260 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形1：x > 0 ? -->
  <polygon points="195,186 260,166 325,186 260,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">x &gt; 0 ?</text>

  <path d="M 325 186 L 369 186" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="345" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 内层取位框 -->
  <rect x="372" y="172" width="118" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="431" y="184" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">s += x % 10</text>
  <text x="431" y="197" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">x /= 10</text>

  <path d="M 260 206 L 260 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="271" y="217" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ans 更新 -->
  <rect x="180" y="224" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">ans = min(ans, s)</text>
  <path d="M 260 250 L 260 272" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形2：还有元素？ -->
  <polygon points="190,298 260,276 330,298 260,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">还有元素？</text>
  <text x="260" y="308" text-anchor="middle" font-size="9.5" fill="#7a5c1e" filter="url(#rough2)">(++i &lt; n ?)</text>

  <!-- 是：回到取元素 -->
  <path d="M 190 298 L 105 298 L 105 125 L 177 125" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 330 298 L 364 298" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="343" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="368" y="284" width="112" height="28" rx="7" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="302" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 底部要点 -->
  <rect x="40" y="338" width="440" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">内层 while 每元素最多 5 次（nums[i] ≤ 10⁴）；min 只对完整的数位和生效</text>
  <text x="260" y="367" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans 初始化为 +∞（min 的幺元），首个元素必然更新，无需特判</text>
</svg>
