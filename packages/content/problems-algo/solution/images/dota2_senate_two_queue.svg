<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双队列贪心：按投票序排队的两个阵营</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">senate="RDDDR"，R 队与 D 队各存原始下标</text>

  <!-- ===== senate row ===== -->
  <text x="30" y="74" font-size="11" fill="#666">原始字符串（下标即投票顺序）：</text>
  <g font-size="13">
    <rect x="150" y="82" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="104" text-anchor="middle" fill="#446688" font-weight="bold">R</text>
    <rect x="186" y="82" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">D</text>
    <rect x="222" y="82" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">D</text>
    <rect x="258" y="82" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">D</text>
    <rect x="294" y="82" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="104" text-anchor="middle" fill="#446688" font-weight="bold">R</text>
    <text x="168" y="134" text-anchor="middle" font-size="9" fill="#888">0</text>
    <text x="204" y="134" text-anchor="middle" font-size="9" fill="#888">1</text>
    <text x="240" y="134" text-anchor="middle" font-size="9" fill="#888">2</text>
    <text x="276" y="134" text-anchor="middle" font-size="9" fill="#888">3</text>
    <text x="312" y="134" text-anchor="middle" font-size="9" fill="#888">4</text>
  </g>

  <!-- ===== two queues ===== -->
  <line x1="20" y1="150" x2="520" y2="150" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="172" font-size="12" fill="#446688" font-weight="bold">R 队（qr）</text>
  <g font-size="12">
    <rect x="110" y="180" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="200" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="150" y="180" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="200" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="210" y="200" font-size="10" fill="#888">← 队首</text>
    <path d="M 240 195 L 270 195" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="300" y="198" font-size="10" fill="#888">按 FIFO 出队</text>
  </g>

  <text x="30" y="232" font-size="12" fill="#b85450" font-weight="bold">D 队（qd）</text>
  <g font-size="12">
    <rect x="110" y="240" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="260" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="150" y="240" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="260" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="190" y="240" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="260" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="250" y="260" font-size="10" fill="#888">← 队首</text>
    <path d="M 280 255 L 310 255" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="340" y="258" font-size="10" fill="#888">按 FIFO 出队</text>
  </g>

  <!-- ===== compare + ban ===== -->
  <line x1="20" y1="288" x2="520" y2="288" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="298" width="490" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="318" font-size="11" fill="#d6a040" font-weight="bold">每一步：比较两队首下标 r 与 d</text>
  <text x="50" y="336" font-size="10" fill="#555">r &lt; d → R 先投票，禁掉队首 D（qd 出队），R 入下一轮：qr.push(r + n)</text>
  <text x="50" y="352" font-size="10" fill="#555">d &lt; r → D 先投票，禁掉队首 R（qr 出队），D 入下一轮：qd.push(d + n)</text>
  <text x="50" y="366" font-size="10" fill="#d6a040" font-weight="bold">+n 把"下一轮"展平到线性时间线，FIFO 保轮内顺序 → 谁先到谁先动</text>
</svg>
