<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，数出小于 k 的元素个数</text>

  <!-- start -->
  <ellipse cx="210" cy="46" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="51" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 210 62 L 210 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="118" y="78" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="98" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 0</text>
  <path d="M 210 108 L 210 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="210,124 270,150 210,176 150,150" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="210" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">还有元素 x ?</text>

  <!-- no -> return -->
  <path d="M 150 150 L 108 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="130" y="141" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否·扫完</text>
  <ellipse cx="60" cy="150" rx="46" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -->
  <path d="M 210 176 L 210 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="191" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 2 -->
  <polygon points="210,196 272,226 210,256 148,226" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="210" y="231" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x &lt; k ?</text>

  <!-- yes -> ans++ -->
  <path d="M 148 226 L 116 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是·不合格</text>
  <rect x="24" y="210" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="230" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- no -->
  <path d="M 210 256 L 210 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="224" y="280" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否·已达标</text>

  <!-- ans++ merge -->
  <path d="M 68 242 L 68 311 L 116 311" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- next element -->
  <rect x="118" y="296" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="316" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x = 下一个元素</text>

  <!-- loop back -->
  <path d="M 302 311 L 430 311 L 430 150 L 274 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="368" y="332" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">继续扫</text>

  <!-- bottom notes -->
  <rect x="40" y="352" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不用排序、不用堆：删除顺序不影响要删的集合 → 单遍扫描，O(n) 时间 / O(1) 空间</text>
  <text x="260" y="385" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">注意是严格小于 k：等于 k 的元素已经合格，一个都不用删</text>
</svg>
