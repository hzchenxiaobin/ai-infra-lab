<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：枚举「值组合」而非「下标三元组」，天然去重</text>

  <!-- ===== 左：下标枚举 ===== -->
  <rect x="18" y="36" width="238" height="240" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="137" y="56" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">下标枚举：先重复，再去重</text>

  <text x="28" y="90" font-size="11" fill="#555" filter="url(#rough2)">digits =</text>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="89" y="68" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="123" y="68" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="157" y="68" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="103" y="87" filter="url(#rough2)">0</text>
    <text x="137" y="87" filter="url(#rough2)">2</text>
    <text x="171" y="87" filter="url(#rough2)">2</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="103" y="108" filter="url(#rough2)">i=0</text>
    <text x="137" y="108" filter="url(#rough2)">i=1</text>
    <text x="171" y="108" filter="url(#rough2)">i=2</text>
  </g>

  <text x="26" y="140" font-size="11" fill="#333" filter="url(#rough2)">(i,j,k)=(1,2,0)</text>
  <text x="180" y="140" font-size="12" fill="#333" filter="url(#rough2)">→</text>
  <rect x="196" y="124" width="42" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">220</text>

  <text x="26" y="168" font-size="11" fill="#333" filter="url(#rough2)">(i,j,k)=(2,1,0)</text>
  <text x="180" y="168" font-size="12" fill="#333" filter="url(#rough2)">→</text>
  <rect x="196" y="152" width="42" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">220</text>

  <path d="M 217 148 C 217 172, 190 190, 172 200" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 176 C 215 192, 202 200, 192 206" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="137" cy="216" rx="58" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="221" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">HashSet 去重</text>

  <text x="137" y="252" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">同一数值 220 被生成了两次</text>
  <text x="137" y="268" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">重复源自「不同元素、相同数值」</text>

  <!-- ===== 右：值域枚举 ===== -->
  <rect x="266" y="36" width="238" height="240" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值域枚举：天然互异，免 set</text>

  <g text-anchor="middle">
    <rect x="275" y="68" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="310" y="86" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">百位 h</text>
    <text x="310" y="101" font-size="10" fill="#555" filter="url(#rough2)">∈ 1…9</text>

    <rect x="350" y="68" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="385" y="86" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">十位 t</text>
    <text x="385" y="101" font-size="10" fill="#555" filter="url(#rough2)">∈ 0…9</text>

    <rect x="425" y="68" width="70" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="460" y="86" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">个位 u</text>
    <text x="460" y="101" font-size="9" fill="#555" filter="url(#rough2)">∈{0,2,4,6,8}</text>
  </g>

  <text x="385" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个 (h,t,u) 组合 ↔ 唯一三位数</text>

  <text x="278" y="152" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">(2,2,0)→220 ✓  cnt[2]=2 刚好够</text>
  <text x="278" y="172" font-size="10.5" fill="#b85450" filter="url(#rough2)">(2,2,2)→222 ✗  要 3 个 2，只有 2</text>
  <text x="278" y="192" font-size="10.5" fill="#b85450" filter="url(#rough2)">(0,2,2)→022 ✗  前导零，直接排除</text>

  <rect x="278" y="204" width="214" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="385" y="219" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">可用性判定：cnt 扣掉 h、t、u 各一个</text>
  <text x="385" y="234" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">后均 ≥ 0（多重集不透支）</text>

  <text x="385" y="258" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">计数数组 cnt[10] 取代哈希 set</text>
  <text x="385" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">值组合总共只有 9×10×5 = 450 种</text>

  <!-- ===== 底部结论横幅 ===== -->
  <rect x="18" y="288" width="486" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="309" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">三重约束一次过滤：h ≠ 0（无前导零）· u 为偶数 · 计数不透支（每个数字只用一次）</text>
  <text x="261" y="332" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 = 可用值组合数 —— 组合互不相同，全程无需去重容器</text>
</svg>
