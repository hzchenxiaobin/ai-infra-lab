<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 444"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="444" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：位置从左数 ⟹ 奇偶只看「已填几位」，diff 随手记账</text>

  <!-- 面板一：拆 112233 -->
  <rect x="20" y="38" width="520" height="138" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 拆一个平衡数 112233：奇位和 = 偶位和</text>

  <text x="73" y="74" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">奇</text>
  <text x="115" y="74" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">偶</text>
  <text x="157" y="74" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">奇</text>
  <text x="199" y="74" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">偶</text>
  <text x="241" y="74" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">奇</text>
  <text x="283" y="74" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">偶</text>

  <rect x="56" y="80" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="80" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="80" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="80" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="80" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="80" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="73" y="102" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="115" y="102" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="157" y="102" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="199" y="102" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="241" y="102" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="283" y="102" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">3</text>

  <text x="36" y="130" font-size="9" fill="#999" filter="url(#rough2)">位置</text>
  <text x="73" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <text x="115" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">2</text>
  <text x="157" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">3</text>
  <text x="199" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">4</text>
  <text x="241" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">5</text>
  <text x="283" y="130" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">6</text>

  <text x="340" y="88" font-size="11" fill="#33506b" filter="url(#rough2)">奇位（1,3,5）和：1 + 2 + 3 = 6</text>
  <text x="340" y="108" font-size="11" fill="#2f5d24" filter="url(#rough2)">偶位（2,4,6）和：1 + 2 + 3 = 6</text>
  <text x="340" y="130" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">diff = 6 − 6 = 0 ✓ 平衡</text>

  <text x="36" y="160" font-size="10" fill="#33506b" filter="url(#rough2)">记账规则：填奇位置 +d，填偶位置 −d；走到终态 diff = 0 ⟺ 平衡</text>

  <!-- 面板二：两条白送的便宜 -->
  <rect x="20" y="192" width="520" height="116" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="214" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 两条白送的便宜</text>

  <text x="36" y="240" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">从左数位置 ⟹ 奇偶只看已填几位</text>

  <rect x="36" y="252" width="52" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="270" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">奇 +d</text>
  <path d="M 90 265 L 98 265" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="102" y="252" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">偶 −d</text>
  <path d="M 156 265 L 164 265" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="168" y="252" width="52" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="270" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">奇 +d</text>
  <path d="M 222 265 L 230 265" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="234" y="252" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">偶 −d</text>
  <text x="298" y="270" font-size="12" fill="#2f5d24" filter="url(#rough2)">⋯</text>

  <text x="36" y="298" font-size="10" fill="#2f5d24" filter="url(#rough2)">首位必奇、随后交替——与总位数无关！</text>

  <text x="330" y="240" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">「至少两位」免费白送</text>
  <text x="330" y="262" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">一位数：diff = d ≥ 1 ≠ 0</text>
  <text x="330" y="280" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⟹ 永不命中终态 diff = 0</text>
  <text x="330" y="300" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">约束自动成立，零特判</text>

  <!-- 面板三：前缀相减 -->
  <rect x="20" y="324" width="520" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="346" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 区间计数 → 前缀相减</text>

  <text x="120" y="374" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">f(low−1)</text>
  <text x="352" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = f(high) − f(low−1)</text>

  <path d="M 48 388 L 192 388" stroke="#999" stroke-width="5" filter="url(#rough2)"/>
  <path d="M 208 388 L 496 388" stroke="#b85450" stroke-width="5" filter="url(#rough2)"/>
  <path d="M 48 382 L 48 394" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 192 382 L 192 394" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 208 382 L 208 394" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 496 382 L 496 394" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="48" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="182" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">low−1</text>
  <text x="224" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">low</text>
  <text x="496" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">high</text>

  <text x="36" y="426" font-size="10" fill="#8a6d1f" filter="url(#rough2)">f(x) = [1, x] 内平衡数的个数；low = 1 时 f(0) = 0（0 不是平衡数）</text>
</svg>
