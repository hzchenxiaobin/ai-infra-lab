<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">Brian Kernighan 技巧：x &amp;= x − 1，一轮消掉最低位的 1</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 x = 13（1101₂）为例 —— 循环次数恰好等于置位数</text>

  <!-- 行 1：x = 13 -->
  <text x="160" y="96" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">x = 13</text>
  <rect x="180" y="78" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="96" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="208" y="78" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="236" y="78" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="96" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="264" y="78" width="24" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="276" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="326" y="94" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">← 最低位的 1（即将被消掉）</text>
  <rect x="470" y="79" width="90" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="12" filter="url(#rough2)"/>
  <text x="515" y="95" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c = 0</text>

  <path d="M 230 106 L 230 149" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="132" font-size="11" fill="#446688" filter="url(#rough2)">x &amp;= x − 1</text>

  <!-- 行 2：x = 12 -->
  <text x="160" y="170" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">x = 12</text>
  <rect x="180" y="152" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="170" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="208" y="152" width="24" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="220" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="236" y="152" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="170" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="264" y="152" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="276" y="170" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="470" y="153" width="90" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="12" filter="url(#rough2)"/>
  <text x="515" y="169" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c = 1</text>

  <path d="M 230 180 L 230 223" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="206" font-size="11" fill="#446688" filter="url(#rough2)">x &amp;= x − 1</text>

  <!-- 行 3：x = 8 -->
  <text x="160" y="244" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">x = 8</text>
  <rect x="180" y="226" width="24" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="192" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="208" y="226" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="244" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="236" y="226" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="244" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="264" y="226" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="276" y="244" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="470" y="227" width="90" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="12" filter="url(#rough2)"/>
  <text x="515" y="243" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c = 2</text>

  <path d="M 230 254 L 230 297" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="280" font-size="11" fill="#446688" filter="url(#rough2)">x &amp;= x − 1</text>

  <!-- 行 4：x = 0 -->
  <text x="160" y="318" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">x = 0</text>
  <rect x="180" y="300" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="208" y="300" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="236" y="300" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="264" y="300" width="24" height="26" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="276" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="330" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全 0，循环终止</text>
  <rect x="470" y="301" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="515" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c = 3 ✓</text>

  <!-- 结论框 -->
  <rect x="60" y="340" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">x − 1 的借位：把最低位的 1 变 0、其后的 0 全变 1；x &amp; (x−1) 恰好抹掉最低位的 1</text>
  <text x="310" y="380" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">循环了 3 轮 ⟹ popcount(13) = 3 —— 循环次数 = 置位数</text>

  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">对比：逐位移位法固定循环 ⌊log₂x⌋ + 1 次；Kernighan 只循环「1 的个数」次</text>
</svg>
