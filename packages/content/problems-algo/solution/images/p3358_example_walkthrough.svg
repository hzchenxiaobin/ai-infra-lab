<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：6 行过 IS NULL 闸门，2 / 4 / 6 命中升序输出</text>

  <!-- 表头 -->
  <rect x="30" y="40" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="55" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">id</text>
  <rect x="78" y="40" width="196" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="55" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">title</text>
  <rect x="274" y="40" width="72" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="55" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">rating</text>
  <rect x="346" y="40" width="104" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="55" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">IS NULL ?</text>
  <rect x="450" y="40" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="55" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- 行 1 -->
  <rect x="30" y="66" width="48" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78" y="66" width="196" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="86" y="82" font-size="9" fill="#333" filter="url(#rough2)">The Great Gatsby</text>
  <rect x="274" y="66" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.5</text>
  <rect x="346" y="66" width="104" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="82" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">FALSE</text>
  <rect x="450" y="66" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="82" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">滤</text>

  <!-- 行 2（命中） -->
  <rect x="30" y="94" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="110" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="78" y="94" width="196" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="86" y="110" font-size="9" fill="#333" filter="url(#rough2)">To Kill a Mockingbird</text>
  <rect x="274" y="94" width="72" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">null</text>
  <rect x="346" y="94" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="110" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">TRUE</text>
  <rect x="450" y="94" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="110" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 留</text>

  <!-- 行 3 -->
  <rect x="30" y="122" width="48" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="138" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="78" y="122" width="196" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="86" y="138" font-size="9" fill="#333" filter="url(#rough2)">Pride and Prejudice</text>
  <rect x="274" y="122" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="138" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.8</text>
  <rect x="346" y="122" width="104" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">FALSE</text>
  <rect x="450" y="122" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">滤</text>

  <!-- 行 4（命中） -->
  <rect x="30" y="150" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="166" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="78" y="150" width="196" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="86" y="166" font-size="9" fill="#333" filter="url(#rough2)">The Catcher in the Rye</text>
  <rect x="274" y="150" width="72" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">null</text>
  <rect x="346" y="150" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="166" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">TRUE</text>
  <rect x="450" y="150" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="166" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 留</text>

  <!-- 行 5 -->
  <rect x="30" y="178" width="48" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="194" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <rect x="78" y="178" width="196" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="86" y="194" font-size="9" fill="#333" filter="url(#rough2)">Animal Farm</text>
  <rect x="274" y="178" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="194" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.2</text>
  <rect x="346" y="178" width="104" height="24" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="194" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">FALSE</text>
  <rect x="450" y="178" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="194" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">滤</text>

  <!-- 行 6（命中） -->
  <rect x="30" y="206" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="222" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="78" y="206" width="196" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="86" y="222" font-size="9" fill="#333" filter="url(#rough2)">Lord of the Flies</text>
  <rect x="274" y="206" width="72" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">null</text>
  <rect x="346" y="206" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="222" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">TRUE</text>
  <rect x="450" y="206" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="222" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 留</text>

  <!-- 箭头到输出 -->
  <path d="M 280 236 L 280 254" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="250" font-size="8.5" fill="#888" filter="url(#rough2)">幸存 3 行</text>

  <!-- 输出框 -->
  <rect x="30" y="260" width="500" height="90" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：ORDER BY book_id 升序 → 2 → 4 → 6</text>

  <rect x="60" y="292" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="130" y="308" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2　To Kill a Mockingbird</text>
  <text x="130" y="324" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">Harper Lee · 1960 · null</text>

  <rect x="212" y="292" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="282" y="308" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4　The Catcher in the Rye</text>
  <text x="282" y="324" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">J.D. Salinger · 1951 · null</text>

  <rect x="364" y="292" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="434" y="308" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">6　Lord of the Flies</text>
  <text x="434" y="324" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">W. Golding · 1954 · null</text>

  <path d="M 202 313 L 210 313" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 354 313 L 362 313" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="374" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">对照：换成 rating = NULL 走一遍，六行全是 UNKNOWN，一行都出不来</text>
</svg>
