<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">流程：两遍扫描 —— 先计数，后过滤</text>

  <!-- start -->
  <ellipse cx="300" cy="46" rx="38" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 300,61 L 300,72" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box1: first pass counting -->
  <rect x="170" y="74" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第一遍扫描：cnt[s[i]]++（26 个计数器）</text>

  <path d="M 300,112 L 300,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box2: init second pass -->
  <rect x="170" y="126" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第二遍初始化：res = ""，i = 0</text>

  <path d="M 300,158 L 300,170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: i < n ? -->
  <polygon points="300,172 378,202 300,232 222,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no branch: to end -->
  <text x="398" y="195" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 378,202 L 526,202 L 526,412" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes branch -->
  <text x="312" y="246" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300,232 L 300,246" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond2: cnt < k ? -->
  <polygon points="300,248 388,280 300,312 212,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[s[i]] &lt; k ?</text>

  <!-- yes: append -->
  <text x="196" y="273" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 212,280 L 166,280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="262" width="134" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="99" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">res += s[i]</text>

  <!-- no: skip -->
  <text x="396" y="273" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 388,280 L 402,280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="262" width="116" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">跳过 s[i]</text>

  <!-- both branches converge to i++ -->
  <path d="M 99,298 L 99,328 L 228,328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462,298 L 462,328 L 372,328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="310" width="136" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i++，继续</text>

  <!-- loop back to diamond1 -->
  <path d="M 300,346 L 300,368 L 190,368 L 190,202 L 218,202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="361" font-size="9.5" fill="#888" filter="url(#rough2)">回到「i &lt; n ?」</text>

  <!-- end -->
  <ellipse cx="478" cy="412" rx="48" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="416" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 res</text>

  <!-- bottom note -->
  <rect x="20" y="390" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="32" y="408" font-size="10.5" fill="#333" filter="url(#rough2)">两遍各 O(n)：计数一遍 + 过滤一遍；计数器仅 26 个 → 额外空间 O(1)</text>
  <text x="32" y="424" font-size="10.5" fill="#333" filter="url(#rough2)">去留判定是一次 O(1) 查表比较，全程无排序、无堆</text>
</svg>
