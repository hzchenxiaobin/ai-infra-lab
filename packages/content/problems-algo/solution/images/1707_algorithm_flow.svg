<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：排序 + 增量建 Trie + 逐位贪心查询
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,70 L270,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: sort nums -->
  <rect x="170" y="88" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">排序 nums（升序）</text>
  <path d="M270,118 L270,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort queries by m, keep original index -->
  <rect x="120" y="136" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">查询按 m 升序排序（保留原下标）</text>
  <path d="M270,166 L270,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init ptr=0, ans[] -->
  <rect x="180" y="184" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ptr = 0, ans = [−1] × q</text>
  <path d="M270,212 L270,226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有查询? -->
  <polygon points="270,230 350,256 270,282 190,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有查询?</text>

  <!-- no branch -> return -->
  <path d="M350,256 L408,256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="249" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="412" y="240" width="108" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="466" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M270,282 L270,296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="292" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step: take next query (x, m, idx) -->
  <rect x="160" y="300" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一条查询 (x, m, idx)</text>
  <path d="M270,328 L270,340" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: while ptr < n and nums[ptr] <= m: insert Trie -->
  <rect x="100" y="344" width="340" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">while ptr&lt;n &amp;&amp; nums[ptr]≤m: 插入Trie; ptr++</text>
  <path d="M270,372 L270,384" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: Trie 非空? -->
  <polygon points="270,388 330,408 270,428 210,408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="412" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Trie 非空?</text>
  <!-- yes: query max XOR -->
  <path d="M330,408 L376,408" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="401" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="380" y="396" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="412" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans[idx]=查询x的maxXOR</text>
  <!-- no: keep -1 -->
  <path d="M210,408 L170,408" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="401" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="150" y="412" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">ans[idx]=−1</text>

  <!-- loop back from right side up to diamond -->
  <path d="M520,408 L536,408 L536,256 L350,256" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M150,408 L100,408 L100,256 L190,256" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="436" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    排序 O(n log n + q log q)；主循环 O((n+q)·31)
  </text>
</svg>
