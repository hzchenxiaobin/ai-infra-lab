<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">猜数字游戏：两遍扫描流程</text>

  <rect x="140" y="46" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bulls=0; sCnt[10]=0; gCnt[10]=0</text>
  <line x1="280" y1="80" x2="280" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="102" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i = 0 .. n-1</text>
  <line x1="280" y1="136" x2="280" y2="156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,158 380,198 280,238 180,198" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">secret[i]</text>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== guess[i] ?</text>
  <line x1="180" y1="198" x2="135" y2="198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="380" y1="198" x2="425" y2="198" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="192" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="70" y="250" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bulls++</text>
  <rect x="380" y="250" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sCnt[s]++</text>
  <text x="440" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">gCnt[g]++</text>

  <path d="M 125 286 L 125 320 L 280 320" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 286 L 440 320 L 280 320" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="320" x2="280" y2="340" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="342" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">end for：i++，i&lt;n 回到上方，否则继续</text>

  <path d="M 440 357 L 520 357 L 520 119 L 420 119" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="240" font-size="10" fill="#666" filter="url(#rough2)">下</text>
  <text x="528" y="252" font-size="10" fill="#666" filter="url(#rough2)">一</text>
  <text x="528" y="264" font-size="10" fill="#666" filter="url(#rough2)">个</text>
  <text x="528" y="276" font-size="10" fill="#666" filter="url(#rough2)">i</text>

  <line x1="280" y1="372" x2="280" y2="396" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="398" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cows = Σ min(sCnt[d], gCnt[d]) , d=0..9</text>
  <line x1="280" y1="432" x2="280" y2="452" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="454" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="478" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">return "{bulls}A{cows}B"</text>
</svg>
