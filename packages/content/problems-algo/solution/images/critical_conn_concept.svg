<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">关键连接（桥）：删掉后图不再连通的边</text>

  <!-- ===== Top: original graph ===== -->
  <rect x="30" y="44" width="480" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">原图：0—1—2 构成环，3 仅通过 (1,3) 连入</text>

  <!-- cycle edges: 0-1, 1-2, 2-0 (green, not bridge) -->
  <line x1="148" y1="130" x2="232" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="268" y1="130" x2="352" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- 2-0 back edge as arc above -->
  <path d="M 360 122 Q 250 80 140 122" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- bridge edge 1-3 (red, dashed, bold) -->
  <line x1="250" y1="148" x2="250" y2="170" stroke="#b85450" stroke-width="2.8" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="130" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <circle cx="250" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="370" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="250" cy="186" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">(0,1) 非桥</text>
  <text x="320" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">(1,2) 非桥</text>
  <text x="250" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">(2,0) 非桥：环上</text>
  <text x="278" y="164" font-size="10" fill="#b85450" font-weight="bold">(1,3) 桥</text>

  <!-- arrow down: remove bridge -->
  <line x1="270" y1="206" x2="270" y2="232" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="224" font-size="11" fill="#b85450" font-weight="bold">删掉桥 (1,3)</text>

  <!-- ===== Bottom: disconnected ===== -->
  <rect x="30" y="234" width="480" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">删掉桥后：3 与 {0,1,2} 不再连通 → 图被切成两块</text>

  <line x1="148" y1="300" x2="232" y2="300" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="268" y1="300" x2="352" y2="300" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 360 292 Q 250 250 140 292" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <circle cx="130" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <circle cx="250" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="370" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- isolated node 3 -->
  <circle cx="460" cy="300" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="460" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="460" y="334" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">孤岛</text>

  <!-- gap symbol between components -->
  <text x="418" y="292" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">⫻</text>
  <text x="418" y="312" text-anchor="middle" font-size="9" fill="#b85450">断开</text>

  <!-- summary box -->
  <rect x="40" y="366" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="10.5" fill="#444">关键：桥 = 删掉后使连通分量数增加的边；环上的边都不是桥</text>
</svg>
