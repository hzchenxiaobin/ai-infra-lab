<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：前缀和初始化 → 套限制 → 双向传播 → 取峰值</text>

  <!-- ① 初始化 -->
  <rect x="42" y="44" width="300" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① up[i] = diff 前缀和（up[0] = 0）</text>
  <text x="192" y="79" text-anchor="middle" font-size="9.5" fill="#668" filter="url(#rough2)">起点这把伞：无限制位置的天花板</text>
  <text x="356" y="68" font-size="9.5" fill="#999" filter="url(#rough2)">O(n)</text>

  <line x1="192" y1="88" x2="192" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 套限制 -->
  <rect x="42" y="108" width="300" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 套用限制：up[idx] = min(up[idx], maxVal)</text>
  <text x="192" y="143" text-anchor="middle" font-size="9.5" fill="#966" filter="url(#rough2)">R 条限制逐条打入，idx 互不相同</text>
  <text x="356" y="132" font-size="9.5" fill="#999" filter="url(#rough2)">O(R)</text>

  <line x1="192" y1="152" x2="192" y2="168" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 正向传播 -->
  <rect x="42" y="172" width="300" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 正向传播（i：0 → n−2）</text>
  <text x="192" y="207" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">up[i+1] = min(up[i+1], up[i] + diff[i])</text>

  <rect x="362" y="180" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="392" y="180" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="422" y="180" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="452" y="180" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="180" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <line x1="381" y1="188" x2="390" y2="188" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="411" y1="188" x2="420" y2="188" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="441" y1="188" x2="450" y2="188" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="471" y1="188" x2="480" y2="188" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="431" y="212" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">把左侧的约束推向右侧</text>

  <line x1="192" y1="216" x2="192" y2="232" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 反向传播 -->
  <rect x="42" y="236" width="300" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 反向传播（i：n−2 → 0）</text>
  <text x="192" y="271" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">up[i] = min(up[i], up[i+1] + diff[i])</text>

  <rect x="362" y="244" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="392" y="244" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="422" y="244" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="452" y="244" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="244" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <line x1="390" y1="252" x2="381" y2="252" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="420" y1="252" x2="411" y2="252" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="450" y1="252" x2="441" y2="252" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="480" y1="252" x2="471" y2="252" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="431" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">把右侧的约束推向左侧</text>

  <line x1="192" y1="280" x2="192" y2="296" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 取峰值 -->
  <rect x="42" y="300" width="300" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a1f" filter="url(#rough2)">⑤ 返回 max(up)</text>
  <text x="192" y="335" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">包络 M 的峰值即答案</text>

  <text x="352" y="316" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">两遍后 up ≡ M（唯一不动点）</text>
  <text x="352" y="332" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">M 自身满足全部约束 ✓</text>
</svg>
