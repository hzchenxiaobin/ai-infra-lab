<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：jobs=[3,18,15,9], workers=[6,5,1,3]</text>

  <!-- Original arrays -->
  <text x="40" y="52" font-size="11" fill="#888">原数组：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="90" y="38" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="58">3</text>
    <rect x="140" y="38" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="162" y="58">18</text>
    <rect x="190" y="38" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="212" y="58">15</text>
    <rect x="240" y="38" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="262" y="58">9</text>
    <text x="296" y="58" font-size="11" fill="#888">jobs</text>

    <rect x="90" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="94">6</text>
    <rect x="140" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="162" y="94">5</text>
    <rect x="190" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="212" y="94">1</text>
    <rect x="240" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="262" y="94">3</text>
    <text x="296" y="94" font-size="11" fill="#888">workers</text>
  </g>

  <!-- sort arrow -->
  <path d="M 280 110 L 280 124" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="120" font-size="10.5" fill="#888">分别升序</text>

  <!-- Sorted + paired: jobs row -->
  <text x="40" y="152" font-size="11" fill="#888">jobs↑</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="80" y="138" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="108" y="159">3</text>
    <rect x="158" y="138" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="159">9</text>
    <rect x="236" y="138" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="264" y="159">15</text>
    <rect x="314" y="138" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="159">18</text>
  </g>

  <!-- pairing arrows -->
  <path d="M 108 172 L 108 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 186 172 L 186 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 264 172 L 264 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 342 172 L 342 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ratio labels -->
  <text x="132" y="190" font-size="11" fill="#4a7a3a">⌈3/1⌉=3</text>
  <text x="210" y="190" font-size="11" fill="#4a7a3a">⌈9/3⌉=3</text>
  <text x="288" y="190" font-size="11" fill="#4a7a3a">⌈15/5⌉=3</text>
  <text x="366" y="190" font-size="11" fill="#4a7a3a">⌈18/6⌉=3</text>

  <!-- workers row sorted -->
  <text x="40" y="222" font-size="11" fill="#888">work↑</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="80" y="208" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="108" y="229">1</text>
    <rect x="158" y="208" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="229">3</text>
    <rect x="236" y="208" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="264" y="229">5</text>
    <rect x="314" y="208" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="229">6</text>
  </g>

  <!-- result -->
  <path d="M 342 246 L 342 262" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="100" y="266" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">max(3, 3, 3, 3) = 3 → ans = 3</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#b85450">每对恰好 3 天，瓶颈均匀，无更优空间</text>

  <!-- Divider -->
  <path d="M 40 320 L 520 320" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Contrast: bad pairing -->
  <text x="280" y="340" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">对照：交叉配对（大工给慢人）更差</text>

  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="60" y="352" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="120" y="371">大工 18</text>
    <rect x="60" y="388" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="120" y="407">慢人 1</text>
    <text x="200" y="390" font-size="12" fill="#b85450" font-weight="bold">⌈18/1⌉=18</text>
  </g>
  <path d="M 240 388 L 268 388" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="392" font-size="12" fill="#b85450" font-weight="bold">max 飙到 18</text>

  <!-- conclusion note -->
  <rect x="60" y="424" width="440" height="34" fill="#fafafa" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="11.5" fill="#666">交换论证：任何「小工配快人」的交叉都能消去而不增 max → 同序配对最优</text>
</svg>
