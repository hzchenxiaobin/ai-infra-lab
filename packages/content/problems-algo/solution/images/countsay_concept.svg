<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">外观数列：把连续相同的字符「分组读出」</text>

  <!-- Previous term: 1211 -->
  <text x="40" y="74" font-size="12" fill="#888">上一项:</text>
  <rect x="96" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="56" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="188" y="56" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="56" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Group brackets -->
  <path d="M 96 96 Q 96 104 102 104 L 134 104 Q 140 104 140 96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="118" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1 个 '1'</text>

  <path d="M 142 96 Q 142 104 148 104 L 180 104 Q 186 104 186 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="164" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 个 '2'</text>

  <path d="M 188 96 Q 188 104 194 104 L 270 104 Q 276 104 276 96" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="232" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 个 '1'</text>

  <!-- Arrow down -->
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#888">↓ 每组写成「个数 + 字符」</text>
  <path d="M 200 132 L 200 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output fragments -->
  <text x="40" y="180" font-size="12" fill="#888">读作:</text>
  <rect x="96" y="164" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="146" y="164" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <rect x="196" y="164" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">21</text>

  <!-- Arrow down to result -->
  <path d="M 200 196 L 200 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#888">拼接</text>

  <!-- Result: 111221 -->
  <text x="40" y="244" font-size="12" fill="#888">下一项:</text>
  <rect x="96" y="228" width="264" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="228" y="250" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">111221</text>

  <!-- Core idea box -->
  <rect x="50" y="284" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：游程编码 (RLE) — 扫描连续相同字符</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#666">每组输出「出现次数 + 该字符」，拼接即得下一项</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#888">从 countAndSay(1)="1" 迭代 n−1 次即得答案</text>
</svg>
