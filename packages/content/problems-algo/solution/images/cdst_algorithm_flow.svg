<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析 → 前缀和转天数 → 闭区间交公式</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="46" rx="42" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <path d="M 260 64 L 260 78" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Box 1: parse -->
  <rect x="110" y="80" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 解析日期串 "MM-DD"</text>
  <text x="260" y="119" text-anchor="middle" font-size="10.5" fill="#333">m = 前两位；d = 后两位</text>

  <path d="M 260 130 L 260 146" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Box 2: convert to day-of-year -->
  <rect x="70" y="148" width="380" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 日期 → 年内天数</text>
  <text x="260" y="185" text-anchor="middle" font-size="10.5" fill="#333">day = cum[m] + d （cum 为各月天数前缀和）</text>
  <text x="260" y="201" text-anchor="middle" font-size="10.5" fill="#333">得 4 个坐标 a1, a2, b1, b2</text>

  <path d="M 260 210 L 260 226" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,226 360,266 260,306 160,266" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min(a2,b2)</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">≥ max(a1,b1) ?</text>

  <!-- No branch (left) -> return 0 -->
  <path d="M 160 266 L 110 266" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="135" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="248" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 0</text>

  <!-- Yes branch (down) -> formula -->
  <path d="M 260 306 L 260 318" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="274" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="120" y="316" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return min(a2,b2) − max(a1,b1) + 1</text>
</svg>
