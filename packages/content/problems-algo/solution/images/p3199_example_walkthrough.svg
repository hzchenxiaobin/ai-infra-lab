<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：a = [1,1]，b = [2,3]，c = [1,5]</text>

  <!-- 分桶 -->
  <rect x="30" y="36" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a = [1,1]</text>
  <text x="105" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶 0 个 · 奇 2 个（E_a=0, O_a=2）</text>

  <rect x="195" y="36" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">b = [2,3]</text>
  <text x="270" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶 1 个（3）· 奇 1 个（2）</text>

  <rect x="360" y="36" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c = [1,5]</text>
  <text x="435" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶 1 个（5）· 奇 1 个（1）</text>

  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">i = 0 的四个三元组逐个验证：</text>

  <!-- 表头 -->
  <rect x="60" y="112" width="45" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="82" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">j</text>
  <rect x="105" y="112" width="45" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="127" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k</text>
  <rect x="150" y="112" width="165" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a⊕b⊕c</text>
  <rect x="315" y="112" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">popcount</text>
  <rect x="385" y="112" width="85" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">判定</text>

  <!-- 行 1 -->
  <rect x="60" y="134" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="105" y="134" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="134" width="165" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1⊕2⊕1 = 2（10）</text>
  <rect x="315" y="134" width="70" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="385" y="134" width="85" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="149" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">奇 ✗</text>

  <!-- 行 2 -->
  <rect x="60" y="156" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="105" y="156" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="156" width="165" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="171" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1⊕2⊕5 = 6（110）</text>
  <rect x="315" y="156" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="171" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="385" y="156" width="85" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="171" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶 ✓</text>

  <!-- 行 3 -->
  <rect x="60" y="178" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="105" y="178" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="193" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="178" width="165" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1⊕3⊕1 = 3（11）</text>
  <rect x="315" y="178" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="385" y="178" width="85" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶 ✓</text>

  <!-- 行 4 -->
  <rect x="60" y="200" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="215" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="105" y="200" width="45" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="215" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="200" width="165" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="215" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1⊕3⊕5 = 7（111）</text>
  <rect x="315" y="200" width="70" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="385" y="200" width="85" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="215" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">奇 ✗</text>

  <rect x="60" y="228" width="410" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="244" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">i = 1 的四行与 i = 0 完全相同（a[0] = a[1] = 1）→ 合法 2 × 2 = 4</text>

  <rect x="60" y="262" width="410" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组合计数复核：O_a·O_b·E_c + O_a·E_b·O_c = 2·1·1 + 2·1·1 = 4 ✓</text>
  <text x="265" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">命中的两种模式：奇奇偶（b 取 2、c 取 5）与 奇偶奇（b 取 3、c 取 1），各 ×2</text>
</svg>
