<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abbaca" → "ca"</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">栈从左到右为 底→顶；红框=被抵消，绿框=新入栈</text>

  <!-- Header -->
  <text x="30" y="68" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="80" y="68" font-size="12" fill="#444" font-weight="bold">字符 c</text>
  <text x="150" y="68" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="270" y="68" font-size="12" fill="#444" font-weight="bold">栈（底→顶）</text>
  <text x="510" y="68" font-size="12" fill="#444" font-weight="bold">说明</text>
  <line x1="20" y1="76" x2="600" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- init -->
  <text x="30" y="100" font-size="11" fill="#888">初始</text>
  <text x="80" y="100" font-size="11" fill="#999">—</text>
  <text x="150" y="100" font-size="11" fill="#999">—</text>
  <rect x="270" y="88" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="104" text-anchor="middle" font-size="10" fill="#999">空</text>
  <text x="510" y="100" font-size="11" fill="#888">栈为空</text>

  <!-- step1: a push -->
  <text x="30" y="132" font-size="11" fill="#333">1</text>
  <rect x="78" y="120" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="150" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="270" y="120" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="510" y="132" font-size="11" fill="#888">栈空，直接入栈</text>

  <!-- step2: b push -->
  <text x="30" y="164" font-size="11" fill="#333">2</text>
  <rect x="78" y="152" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="150" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="270" y="152" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="316" y="152" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="510" y="164" font-size="11" fill="#888">栈顶 a ≠ b，入栈</text>

  <!-- step3: b pop -->
  <text x="30" y="196" font-size="11" fill="#333">3</text>
  <rect x="78" y="184" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="150" y="196" font-size="11" fill="#b85450" font-weight="bold">pop 抵消</text>
  <rect x="270" y="184" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="316" y="184" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="200" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">b</text>
  <text x="362" y="196" font-size="14" fill="#b85450" font-weight="bold">✕</text>
  <text x="510" y="196" font-size="11" fill="#b85450">栈顶 b == b，弹出</text>

  <!-- step4: a pop -->
  <text x="30" y="228" font-size="11" fill="#333">4</text>
  <rect x="78" y="216" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="150" y="228" font-size="11" fill="#b85450" font-weight="bold">pop 抵消</text>
  <rect x="270" y="216" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="232" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">a</text>
  <text x="316" y="228" font-size="14" fill="#b85450" font-weight="bold">✕</text>
  <text x="510" y="228" font-size="11" fill="#b85450">栈顶 a == a，弹出</text>

  <!-- step5: c push -->
  <text x="30" y="260" font-size="11" fill="#333">5</text>
  <rect x="78" y="248" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="150" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="270" y="248" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="264" text-anchor="middle" font-size="10" fill="#999">空</text>
  <rect x="316" y="248" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="510" y="260" font-size="11" fill="#888">栈空，c 入栈</text>

  <!-- step6: a push -->
  <text x="30" y="292" font-size="11" fill="#333">6</text>
  <rect x="78" y="280" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="150" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="270" y="280" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="316" y="280" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="510" y="292" font-size="11" fill="#888">栈顶 c ≠ a，入栈</text>

  <!-- Result box -->
  <line x1="20" y1="316" x2="600" y2="316" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="330" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果：栈 = [c, a] → 拼接得 "ca"</text>

  <!-- Second example -->
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">再演算 s = "azxxzy" → "ay"</text>
  <text x="310" y="418" text-anchor="middle" font-size="11" fill="#666">a→[a]　z→[a,z]　x→[a,z,x]</text>
  <text x="310" y="436" text-anchor="middle" font-size="11" fill="#b85450">x 抵消 → [a,z]　z 抵消 → [a]　y→[a,y]</text>
  <text x="310" y="454" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终栈 [a, y] → "ay"</text>
</svg>
