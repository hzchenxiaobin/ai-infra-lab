<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：拆出 prefix[i] —— 转移只依赖「窗口内 f[c−1][j] − prefix[j] 的最大值」</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1：nums = [4, 1, −5, 2]，m = 2，l = 1，r = 3；图中算第 c = 2 层的 f[2][4]（i = 4）</text>

  <!-- prefix 行 -->
  <text x="142" y="52" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下标</text>
  <text x="176" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="238" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="300" y="52" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="362" y="52" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3 = j*</text>
  <text x="424" y="52" text-anchor="middle" font-size="9.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">4 = i</text>

  <text x="142" y="78" text-anchor="end" font-size="9.5" fill="#778899" filter="url(#rough2)">P[j]</text>

  <rect x="150" y="58" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="58" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="58" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="58" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="58" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="78" text-anchor="middle" font-size="12" fill="#778899" filter="url(#rough2)">0</text>
  <text x="238" y="78" text-anchor="middle" font-size="12" fill="#778899" filter="url(#rough2)">4</text>
  <text x="300" y="78" text-anchor="middle" font-size="12" fill="#778899" filter="url(#rough2)">5</text>
  <text x="362" y="78" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="424" y="78" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 子数组括号 -->
  <path d="M 340 94 L 340 99 L 444 99 L 444 94" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="393" y="114" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">最后一段子数组 (j*, i]：和 = P[i] − P[j*] = 2</text>

  <!-- 转移公式 -->
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">f[c][i] = max( f[c][i−1], <tspan fill="#33507a">P[i]</tspan> + max{ <tspan fill="#b85450">f[c−1][j] − P[j]</tspan> : j ∈ [i−r, i−l] } )</text>

  <!-- 窗口标签 -->
  <text x="300" y="154" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">候选窗口 [i−r, i−l] = [1, 3]（i = 4，段长 i−j ∈ [1, 3]）</text>

  <!-- 窗口底色 -->
  <rect x="206" y="160" width="190" height="62" rx="8" fill="#fff8e1" fill-opacity="0.45" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- j 行 -->
  <text x="142" y="176" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下标 j</text>
  <rect x="150" y="162" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="212" y="162" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="162" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="162" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="162" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="176" y="177" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">j=0</text>
  <text x="238" y="177" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j=1</text>
  <text x="300" y="177" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j=2</text>
  <text x="362" y="177" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="424" y="177" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">j=4</text>

  <!-- v 行 -->
  <text x="142" y="203" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">v[j] = f[1][j] − P[j]</text>
  <rect x="150" y="188" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="212" y="188" width="52" height="22" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="188" width="52" height="22" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="188" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="188" width="52" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="176" y="203" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">−∞</text>
  <text x="238" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="300" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="362" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="424" y="203" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">3</text>

  <text x="362" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 max = 5 ✓</text>

  <!-- 两个说明框 -->
  <rect x="24" y="244" width="235" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="141" y="261" text-anchor="middle" font-size="9.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">单调队列：值从队首到队尾递减</text>
  <text x="141" y="275" text-anchor="middle" font-size="9" fill="#33507a" filter="url(#rough2)">i = 4 时队列只剩 [ j=3 : 5 ]；</text>
  <text x="141" y="289" text-anchor="middle" font-size="9" fill="#33507a" filter="url(#rough2)">更小更老的 j=2(0)、j=1(0) 永无出头日</text>

  <rect x="271" y="244" width="225" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="383" y="261" text-anchor="middle" font-size="9.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">定长滑动：i 每右移一格</text>
  <text x="383" y="275" text-anchor="middle" font-size="9" fill="#3a6a2a" filter="url(#rough2)">新 j = i−l 入队尾，过期 j &lt; i−r 出队首</text>
  <text x="383" y="289" text-anchor="middle" font-size="9" fill="#3a6a2a" filter="url(#rough2)">每个 j 进出各一次 ⟹ 均摊 O(1)</text>

  <path d="M 424 214 L 460 214 L 460 250 L 448 252" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="486" y="238" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">i=5 时</text>
  <text x="486" y="249" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">j=4 入窗</text>

  <!-- 结果框 -->
  <rect x="24" y="306" width="472" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">f[2][4] = P[4] + 5 = 2 + 5 = 7 ⟹ 答案 = max(f[1][4], f[2][4]) = max(5, 7) = 7 ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">全负数组时段数越多未必越好（示例 4 答案 −1）⟹ 须对 c = 1 … m 逐层取最大</text>
</svg>
