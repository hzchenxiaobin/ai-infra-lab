<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：建图 + 沿链逐步遍历</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">prev 定方向 → next = 邻居中 ≠ prev 的那个</text>

  <!-- ===== Example 1 (left half, x: 20-270) ===== -->
  <text x="145" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 1：[[2,1],[3,4],[3,2]]</text>

  <!-- chain mini graph -->
  <g font-size="11">
    <circle cx="50" cy="100" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="50" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="50" y="128" text-anchor="middle" font-size="8" fill="#b85450">度1★</text>
    <path d="M 65 100 L 95 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="110" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="104" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="110" y="128" text-anchor="middle" font-size="8" fill="#446688">度2</text>
    <path d="M 125 100 L 165 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="180" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="104" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="180" y="128" text-anchor="middle" font-size="8" fill="#446688">度2</text>
    <path d="M 195 100 L 225 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="240" cy="100" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="240" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="240" y="128" text-anchor="middle" font-size="8" fill="#b85450">度1★</text>
  </g>

  <text x="145" y="146" text-anchor="middle" font-size="10" fill="#888">端点 start = 1（度数 1）</text>

  <!-- step table for example 1 -->
  <g font-size="9" fill="#666">
    <rect x="20" y="154" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="167" text-anchor="middle" font-weight="bold">步</text>
    <rect x="70" y="154" width="45" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="92" y="167" text-anchor="middle" font-weight="bold">prev</text>
    <rect x="115" y="154" width="45" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="137" y="167" text-anchor="middle" font-weight="bold">curr</text>
    <rect x="160" y="154" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="185" y="167" text-anchor="middle" font-weight="bold">next</text>
    <rect x="210" y="154" width="60" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="167" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <!-- init row -->
  <g font-size="9" fill="#333">
    <rect x="20" y="172" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="185" text-anchor="middle" font-weight="bold">init</text>
    <rect x="70" y="172" width="45" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="92" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="115" y="172" width="45" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="137" y="185" text-anchor="middle">2</text>
    <rect x="160" y="172" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="185" y="185" text-anchor="middle">—</text>
    <rect x="210" y="172" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="185" text-anchor="middle">[1]</text>
  </g>

  <!-- step 1 -->
  <g font-size="9" fill="#333">
    <rect x="20" y="190" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="203" text-anchor="middle">①</text>
    <rect x="70" y="190" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="92" y="203" text-anchor="middle">1→2</text>
    <rect x="115" y="190" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="137" y="203" text-anchor="middle">2</text>
    <rect x="160" y="190" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="185" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="210" y="190" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="203" text-anchor="middle">[1,2]</text>
  </g>

  <!-- step 2 -->
  <g font-size="9" fill="#333">
    <rect x="20" y="208" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="221" text-anchor="middle">②</text>
    <rect x="70" y="208" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="92" y="221" text-anchor="middle">2→3</text>
    <rect x="115" y="208" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="137" y="221" text-anchor="middle">3</text>
    <rect x="160" y="208" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="185" y="221" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="210" y="208" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="221" text-anchor="middle">[…,3]</text>
  </g>

  <!-- step 3 -->
  <g font-size="9" fill="#333">
    <rect x="20" y="226" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="45" y="239" text-anchor="middle">③</text>
    <rect x="70" y="226" width="45" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="92" y="239" text-anchor="middle">3→4</text>
    <rect x="115" y="226" width="45" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="239" text-anchor="middle">4</text>
    <rect x="160" y="226" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="185" y="239" text-anchor="middle">终点</text>
    <rect x="210" y="226" width="60" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="239" text-anchor="middle">[…,4]</text>
  </g>

  <!-- result -->
  <rect x="20" y="250" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = [1, 2, 3, 4] ✓</text>

  <!-- ===== divider ===== -->
  <path d="M 285 60 L 285 520" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Example 2 (right half, x: 300-550) ===== -->
  <text x="425" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 2：[[4,-2],[1,4],[-3,1]]</text>

  <!-- chain mini graph -->
  <g font-size="10">
    <circle cx="320" cy="100" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="320" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
    <text x="320" y="128" text-anchor="middle" font-size="8" fill="#b85450">度1★</text>
    <path d="M 336 100 L 368 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="384" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="384" y="104" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="384" y="128" text-anchor="middle" font-size="8" fill="#446688">度2</text>
    <path d="M 400 100 L 432 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="448" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="448" y="104" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="448" y="128" text-anchor="middle" font-size="8" fill="#446688">度2</text>
    <path d="M 464 100 L 496 100" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="512" cy="100" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="512" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">-3</text>
    <text x="512" y="128" text-anchor="middle" font-size="8" fill="#b85450">度1★</text>
  </g>

  <text x="425" y="146" text-anchor="middle" font-size="10" fill="#888">端点 start = -2（度数 1）</text>

  <!-- step table for example 2 -->
  <g font-size="9" fill="#666">
    <rect x="300" y="154" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="325" y="167" text-anchor="middle" font-weight="bold">步</text>
    <rect x="350" y="154" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="375" y="167" text-anchor="middle" font-weight="bold">prev</text>
    <rect x="400" y="154" width="45" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="422" y="167" text-anchor="middle" font-weight="bold">curr</text>
    <rect x="445" y="154" width="55" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="472" y="167" text-anchor="middle" font-weight="bold">next</text>
    <rect x="500" y="154" width="55" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="527" y="167" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <!-- init row -->
  <g font-size="9" fill="#333">
    <rect x="300" y="172" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="325" y="185" text-anchor="middle" font-weight="bold">init</text>
    <rect x="350" y="172" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="375" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">-2</text>
    <rect x="400" y="172" width="45" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="422" y="185" text-anchor="middle">4</text>
    <rect x="445" y="172" width="55" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="472" y="185" text-anchor="middle">—</text>
    <rect x="500" y="172" width="55" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="527" y="185" text-anchor="middle">[-2]</text>
  </g>

  <!-- step 1 -->
  <g font-size="9" fill="#333">
    <rect x="300" y="190" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="325" y="203" text-anchor="middle">①</text>
    <rect x="350" y="190" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="375" y="203" text-anchor="middle">-2→4</text>
    <rect x="400" y="190" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="422" y="203" text-anchor="middle">4</text>
    <rect x="445" y="190" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="472" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="500" y="190" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="527" y="203" text-anchor="middle">[-2,4]</text>
  </g>

  <!-- step 2 -->
  <g font-size="9" fill="#333">
    <rect x="300" y="208" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="325" y="221" text-anchor="middle">②</text>
    <rect x="350" y="208" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="375" y="221" text-anchor="middle">4→1</text>
    <rect x="400" y="208" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="422" y="221" text-anchor="middle">1</text>
    <rect x="445" y="208" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="472" y="221" text-anchor="middle" fill="#b85450" font-weight="bold">-3</text>
    <rect x="500" y="208" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="527" y="221" text-anchor="middle">[…,1]</text>
  </g>

  <!-- step 3 -->
  <g font-size="9" fill="#333">
    <rect x="300" y="226" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="325" y="239" text-anchor="middle">③</text>
    <rect x="350" y="226" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="375" y="239" text-anchor="middle">1→-3</text>
    <rect x="400" y="226" width="45" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="422" y="239" text-anchor="middle">-3</text>
    <rect x="445" y="226" width="55" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="472" y="239" text-anchor="middle">终点</text>
    <rect x="500" y="226" width="55" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="527" y="239" text-anchor="middle">[…,-3]</text>
  </g>

  <!-- result -->
  <rect x="300" y="250" width="255" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="427" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = [-2, 4, 1, -3] ✓</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="300" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键规则：next = 邻居中 ≠ prev 的那个</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">内部节点度数 = 2 → 恰有 [prev, next] 两个邻居</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333">端点度数 = 1 → 只有一个邻居 = prev → 到达终点</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">从任一端点出发均可；选另一端点得到逆序数组（同样正确）</text>

  <!-- both-directions note -->
  <rect x="40" y="416" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">两种合法答案</text>
  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#333">从端点 1 出发 → [1,2,3,4]　　从端点 4 出发 → [4,3,2,1]（逆序，亦正确）</text>
  <text x="280" y="470" text-anchor="middle" font-size="10" fill="#333">从端点 -2 出发 → [-2,4,1,-3]　从端点 -3 出发 → [-3,1,4,-2]（逆序，亦正确）</text>
</svg>
