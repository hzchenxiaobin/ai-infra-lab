<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心技巧：累计 COUNT 造「岛屿」，组内 MAX 即填充值</text>
  <text x="330" y="44" text-anchor="middle" font-size="9.5" fill="#888">grp = COUNT(drink) 累计非空值个数 → NULL 与上一个非空值同组</text>

  <!-- ===== table: id | drink | grp ===== -->
  <!-- columns: id (x 60-110), drink (x 110-330), grp (x 330-400) -->
  <rect x="60" y="60" width="340" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="85" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="220" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">drink</text>
  <text x="365" y="76" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">grp</text>
  <line x1="110" y1="60" x2="110" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="60" x2="330" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- group1 rows: id1, id2 (blue) -->
  <rect x="60" y="84" width="340" height="36" fill="#e8f0fe" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="106" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="120" y="106" font-size="9.5" fill="#446688" font-weight="bold">Orange Margarita</text>
  <text x="365" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="110" y1="84" x2="110" y2="120" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="84" x2="330" y2="120" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="120" width="340" height="36" fill="#e8f0fe" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="142" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="120" y="142" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="365" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="110" y1="120" x2="110" y2="156" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="120" x2="330" y2="156" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- partition divider (thicker) -->
  <line x1="60" y1="156" x2="400" y2="156" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- group2 rows: id3, id6, id7 (green) -->
  <rect x="60" y="156" width="340" height="36" fill="#e6f4ea" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="178" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="120" y="178" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz</text>
  <text x="365" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="110" y1="156" x2="110" y2="192" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="156" x2="330" y2="192" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="192" width="340" height="36" fill="#e6f4ea" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="120" y="214" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="365" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="110" y1="192" x2="110" y2="228" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="192" x2="330" y2="228" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="228" width="340" height="36" fill="#e6f4ea" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="250" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="120" y="250" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="365" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="110" y1="228" x2="110" y2="264" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="228" x2="330" y2="264" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- partition divider -->
  <line x1="60" y1="264" x2="400" y2="264" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- group3 row: id9 (orange) -->
  <rect x="60" y="264" width="340" height="36" fill="#fff8e1" stroke="#bbb" stroke-width="0.7" rx="2" filter="url(#rough2)"/>
  <text x="85" y="286" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="120" y="286" font-size="9.5" fill="#d6a040" font-weight="bold">Rum and Coke</text>
  <text x="365" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <line x1="110" y1="264" x2="110" y2="300" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="264" x2="330" y2="300" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- left brace for partitions -->
  <path d="M55 84 C 48 84, 48 156, 55 156" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="38" y="124" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">组1</text>
  <path d="M55 156 C 48 156, 48 264, 55 264" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="38" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">组2</text>
  <path d="M55 264 C 48 264, 48 300, 55 300" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="38" y="286" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">组3</text>

  <!-- ===== right side: MAX(drink) over partition ===== -->
  <text x="540" y="76" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">MAX(drink)</text>
  <text x="540" y="88" text-anchor="middle" font-size="8.5" fill="#888">OVER (PARTITION BY grp)</text>

  <!-- arrow from grp col to right -->
  <path d="M400 100 L 470 100" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="470" y="90" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="111" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Orange Margarita</text>
  <text x="550" y="138" text-anchor="middle" font-size="8" fill="#446688">→ 填给组1 的 NULL 行</text>

  <path d="M400 210 L 470 210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="470" y="196" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="217" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">St Germain Spritz</text>
  <text x="550" y="244" text-anchor="middle" font-size="8" fill="#4a7a3a">→ 填给组2 的 NULL 行</text>

  <path d="M400 282 L 470 282" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="470" y="268" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="289" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Rum and Coke</text>
  <text x="550" y="316" text-anchor="middle" font-size="8" fill="#d6a040">→ 组3 无 NULL，原值保留</text>

  <!-- bottom: formula -->
  <rect x="60" y="350" width="540" height="60" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="80" y="372" font-size="9.5" fill="#333" font-weight="bold">① grp = COUNT(drink) OVER (ORDER BY id ROWS UNBOUNDED PRECEDING)</text>
  <text x="80" y="388" font-size="9" fill="#888">　 累计非空值个数；NULL 不计数 → 与上方非空值同 grp</text>
  <text x="80" y="404" font-size="9.5" fill="#333" font-weight="bold">② drink = COALESCE(drink, MAX(drink) OVER (PARTITION BY grp))</text>
</svg>
