<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "FFF"（δ(F,F)=0，δ(W,F)=+1，δ(E,F)=−1）</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">格子内容：该分差下各出招的状态数（F:· W:· E:·）</text>

  <!-- 表头 -->
  <text x="40" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">回合 ↓</text>
  <text x="40" y="84" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">分差 →</text>

  <rect x="80" y="56" width="56" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="136" y="56" width="56" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="164" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="192" y="56" width="56" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="248" y="56" width="56" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="304" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="72" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="360" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="72" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="416" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="72" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="472" y="50" text-anchor="end" font-size="9" fill="#8a6a20" filter="url(#rough2)">分差 &gt; 0 ⇒ Bob 获胜</text>

  <!-- 回合 0 -->
  <text x="40" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">回合 0</text>
  <rect x="80" y="84" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="136" y="84" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="84" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">E:1</text>
  <rect x="248" y="84" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">F:1</text>
  <rect x="304" y="84" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="332" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W:1</text>
  <rect x="360" y="84" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="416" y="84" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 回合 1 -->
  <text x="40" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">回合 1</text>
  <rect x="80" y="128" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="136" y="128" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="128" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">F:1 E:1</text>
  <rect x="248" y="128" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W:1 E:1</text>
  <rect x="304" y="128" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="332" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">F:1 W:1</text>
  <rect x="360" y="128" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="416" y="128" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="276" y="176" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">总和 6 = 3·2（相邻不同的序列数）</text>

  <!-- 回合 2 -->
  <text x="40" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">回合 2</text>
  <rect x="80" y="172" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="136" y="172" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">E:1</text>
  <rect x="192" y="172" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">F:1 E:1</text>
  <rect x="248" y="172" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">F:2 W:2 E:2</text>
  <rect x="304" y="172" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="196" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">F:1 W:1</text>
  <rect x="360" y="172" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388" y="196" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">W:1</text>
  <rect x="416" y="172" width="56" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 求和标注 -->
  <path d="M 332 218 C 332 232, 360 234, 388 234 C 410 234, 430 232, 436 224" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="388" y="248" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">求和 = 3</text>

  <!-- 获胜序列 -->
  <rect x="15" y="262" width="270" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三条获胜序列：</text>
  <text x="150" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">FWF（+1）· WEW（+1）· WFW（+2）</text>

  <!-- 总和自查 -->
  <rect x="300" y="262" width="205" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="402" y="280" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">每层总和 = 3·2^i</text>
  <text x="402" y="298" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">末层 12 = 胜 3 + 平 6 + 负 3</text>

  <!-- 底部注 -->
  <rect x="15" y="316" width="490" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">例：(0, F) 出 W 走到 (+1, W)；每个状态恰好分裂成「与上一步不同」的两条出路</text>
</svg>
