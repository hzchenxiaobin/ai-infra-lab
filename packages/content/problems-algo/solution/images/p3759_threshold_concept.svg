<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：排序定门槛，值小于门槛的全合格</text>

  <!-- ① 原数组 -->
  <text x="30" y="46" font-size="12" fill="#555" filter="url(#rough2)">① 原数组 nums，k = 2</text>

  <rect x="106" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="210" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="262" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="314" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="366" y="54" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 排序箭头 -->
  <path d="M 260 94 L 260 126" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="114" font-size="11" fill="#446688" filter="url(#rough2)">排序</text>

  <!-- ② 排序后 + 门槛 -->
  <text x="30" y="150" font-size="12" fill="#555" filter="url(#rough2)">② 排序后 a</text>
  <text x="318" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">门槛 v = a[n−k] = a[4] = 8</text>

  <line x1="312" y1="144" x2="312" y2="210" stroke="#b85450" stroke-width="2"
        stroke-dasharray="6 4" filter="url(#rough2)"/>

  <rect x="106" y="156" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="156" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="210" y="156" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="262" y="156" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="286" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="314" y="156" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="366" y="156" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <text x="130" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="182" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="234" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="286" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="338" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="390" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <!-- 说明框 -->
  <rect x="30" y="228" width="225" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="142" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 合格：值 &lt; v</text>
  <text x="142" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">右边至少 k = 2 个更大</text>

  <rect x="265" y="228" width="225" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="377" y="250" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 不合格：值 ≥ v</text>
  <text x="377" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">严格更大的至多 k − 1 个</text>

  <!-- 公式框 -->
  <rect x="40" y="302" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = #{ x ∈ nums : x &lt; a[n−k] } = lower_bound(a, v)</text>
  <text x="260" y="339" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">本例：{1, 2, 4, 7} 共 4 个</text>
</svg>
