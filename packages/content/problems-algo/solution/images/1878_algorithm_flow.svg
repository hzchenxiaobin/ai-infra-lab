<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：对角线前缀和 + 枚举菱形</text>

  <!-- Step 1: build prefix sums -->
  <rect x="110" y="46" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 建主/副对角线前缀和</text>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">preMain[r][c], preAnti[r][c]   // O(mn)</text>
  <path d="M 260 94 L 260 110" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate centers -->
  <rect x="110" y="110" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 枚举中心 (cx, cy) 与半径 k</text>
  <text x="260" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">k = 0 … maxK = min(cx, m−1−cx, cy, n−1−cy)</text>
  <path d="M 260 158 L 260 178" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: k == 0 ? -->
  <polygon points="260,180 340,212 260,244 180,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k == 0 ?</text>
  <text x="260" y="224" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">退化单格?</text>

  <!-- left branch: k==0 -->
  <path d="M 180 212 L 90 212 L 90 244" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="36" y="246" width="108" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">和 = grid[cx][cy]</text>
  <text x="90" y="280" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">面积 0 菱形</text>

  <!-- right branch: k>=1 -->
  <path d="M 340 212 L 430 212 L 430 244" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="206" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="376" y="246" width="108" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="266" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">四角 T,R,B,L</text>
  <text x="430" y="280" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">定位四边</text>

  <!-- merge arrow down -->
  <path d="M 90 286 L 90 308 L 250 308" stroke="#666" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 430 286 L 430 308 L 270 308" stroke="#666" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Step: compute boundary sum -->
  <rect x="70" y="312" width="380" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 求菱形边界和</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s = sTR + sRB + sBL + sLT − (g_T+g_R+g_B+g_L)</text>
  <text x="260" y="364" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">四边闭区间和减四角，每段 O(1)</text>
  <path d="M 260 368 L 260 384" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: maintain top-3 distinct -->
  <rect x="90" y="386" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 加入去重容器，维持前三不同</text>
  <text x="260" y="420" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">set / top3 sorted desc</text>
  <path d="M 260 426 L 260 440" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="150" y="440" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="456" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ 返回前三（降序）</text>
</svg>
