<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">签名构造：偶位与奇位分离 → 各自排序 → 拼接成规范签名</text>

  <!-- Word "abcd" with index boxes -->
  <text x="100" y="64" font-size="11" fill="#446688" font-weight="bold">原串：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="172" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
    <rect x="200" y="50" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="222" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
    <rect x="250" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="272" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
    <rect x="300" y="50" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="322" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
    <text x="172" y="98" text-anchor="middle" font-size="9" fill="#446688">下标 0</text>
    <text x="222" y="98" text-anchor="middle" font-size="9" fill="#d6a040">下标 1</text>
    <text x="272" y="98" text-anchor="middle" font-size="9" fill="#446688">下标 2</text>
    <text x="322" y="98" text-anchor="middle" font-size="9" fill="#d6a040">下标 3</text>
  </g>

  <!-- Legend -->
  <g font-size="9" filter="url(#rough2)">
    <rect x="380" y="56" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2"/>
    <text x="398" y="66" fill="#446688">偶位</text>
    <rect x="440" y="56" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="458" y="66" fill="#d6a040">奇位</text>
  </g>

  <!-- Arrow down: split -->
  <path d="M 272 108 L 272 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="122" font-size="10" fill="#666">分离</text>

  <!-- Even chars -->
  <text x="100" y="142" font-size="11" fill="#446688" font-weight="bold">偶位：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="130" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="190" y="149" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="218" y="130" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="238" y="149" text-anchor="middle" font-size="13" fill="#333">c</text>
  </g>

  <!-- Odd chars -->
  <text x="100" y="180" font-size="11" fill="#d6a040" font-weight="bold">奇位：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="168" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="190" y="187" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="218" y="168" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="238" y="187" text-anchor="middle" font-size="13" fill="#333">d</text>
  </g>

  <!-- Arrow down: sort -->
  <path d="M 272 206 L 272 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="220" font-size="10" fill="#666">各自排序</text>

  <!-- Sorted even -->
  <text x="100" y="242" font-size="11" fill="#446688" font-weight="bold">排序偶：</text>
  <rect x="180" y="228" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ac</text>

  <!-- Sorted odd -->
  <text x="100" y="280" font-size="11" fill="#d6a040" font-weight="bold">排序奇：</text>
  <rect x="180" y="266" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bd</text>

  <!-- Arrow down: concat -->
  <path d="M 210 304 L 210 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="318" font-size="10" fill="#666">拼接</text>

  <!-- Signature -->
  <rect x="150" y="326" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="350" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">acbd</text>

  <!-- Right side: other words same signature -->
  <text x="360" y="142" font-size="11" fill="#888" font-weight="bold">其他原串 → 签名：</text>
  <g font-size="12" filter="url(#rough2)">
    <rect x="360" y="156" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="395" y="175" text-anchor="middle" fill="#333">cdab</text>
    <text x="442" y="175" fill="#666">→</text>
    <rect x="460" y="156" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="495" y="175" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acbd</text>

    <rect x="360" y="192" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="395" y="211" text-anchor="middle" fill="#333">cbad</text>
    <text x="442" y="211" fill="#666">→</text>
    <rect x="460" y="192" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="495" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acbd</text>

    <rect x="360" y="228" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="395" y="247" text-anchor="middle" fill="#333">xyzz</text>
    <text x="442" y="247" fill="#666">→</text>
    <rect x="460" y="228" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="495" y="247" text-anchor="middle" fill="#b85450" font-weight="bold">xzyz</text>

    <rect x="360" y="264" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="395" y="283" text-anchor="middle" fill="#333">zzyx</text>
    <text x="442" y="283" fill="#666">→</text>
    <rect x="460" y="264" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="495" y="283" text-anchor="middle" fill="#b85450" font-weight="bold">yzxz</text>
  </g>
  <text x="360" y="306" font-size="10" fill="#888">同色签名 = 同组；不同色 = 不同组</text>

  <!-- Conclusion -->
  <rect x="80" y="372" width="420" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">特殊等价 ⟺ 偶位多重集相同 ∧ 奇位多重集相同</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#666">排序后的偶位串 + 排序后的奇位串 = 规范签名</text>

  <!-- Takeaway -->
  <rect x="80" y="424" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="447" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">不同签名数 = 特殊等价字符串组数</text>
</svg>
