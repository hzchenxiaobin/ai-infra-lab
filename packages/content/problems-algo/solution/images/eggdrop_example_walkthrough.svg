<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：k = 2, n = 6，枚举楼层 x 求最优扔蛋点</text>

  <!-- header row -->
  <rect x="70" y="48" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <rect x="122" y="48" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">f1 = dp[1][x−1]</text>
  <rect x="240" y="48" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">f2 = dp[2][6−x]</text>
  <rect x="358" y="48" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">max(f1, f2)</text>

  <!-- row x=1 -->
  <rect x="70" y="80" width="52" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="122" y="80" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="97" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <rect x="240" y="80" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="358" y="80" width="92" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="97" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- row x=2 -->
  <rect x="70" y="108" width="52" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="125" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="122" y="108" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="125" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <rect x="240" y="108" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="358" y="108" width="92" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="125" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- row x=3 HIGHLIGHTED -->
  <rect x="70" y="136" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="153" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="122" y="136" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="240" y="136" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="358" y="136" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="153" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 ← 最小</text>

  <!-- row x=4 -->
  <rect x="70" y="164" width="52" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="181" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="122" y="164" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="181" text-anchor="middle" font-size="11" fill="#b85450">3</text>
  <rect x="240" y="164" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="358" y="164" width="92" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="181" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- row x=5 -->
  <rect x="70" y="192" width="52" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="209" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="122" y="192" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="209" text-anchor="middle" font-size="11" fill="#b85450">4</text>
  <rect x="240" y="192" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="358" y="192" width="92" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="209" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- row x=6 -->
  <rect x="70" y="220" width="52" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="237" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="122" y="220" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="181" y="237" text-anchor="middle" font-size="11" fill="#b85450">5</text>
  <rect x="240" y="220" width="118" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <rect x="358" y="220" width="92" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="237" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- note arrows: f1 increases, f2 decreases -->
  <text x="181" y="258" text-anchor="middle" font-size="9" fill="#b85450">↑ 单调增</text>
  <text x="299" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a">↓ 单调减</text>

  <!-- computation box -->
  <rect x="50" y="270" width="420" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">x = 3 时 f1 = f2 = 2（两线交汇），max 取到全局最小 2</text>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#444">dp[2][6] = 1 + min(max) = 1 + 2 = 3</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 先在 3 楼扔：碎了查 1–2 楼(1 蛋)，没碎查 4–6 楼(2 蛋)，均 2 次</text>
</svg>
