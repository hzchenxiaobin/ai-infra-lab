<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：滚动 prev × cur 累加</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">空行跳过；遇非空行：若 prev&gt;0 则 ans += prev×cur，再 prev=cur</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">示例 1：bank = ["011001","000000","010100","001000"]  →  ans = 8</text>

  <!-- table header -->
  <g font-size="10" fill="#666">
    <rect x="40" y="86" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="101" text-anchor="middle" font-weight="bold">行</text>
    <rect x="90" y="86" width="130" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="101" text-anchor="middle" font-weight="bold">bank[i]</text>
    <rect x="220" y="86" width="60" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="101" text-anchor="middle" font-weight="bold">cur</text>
    <rect x="280" y="86" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="315" y="101" text-anchor="middle" font-weight="bold">动作</text>
    <rect x="350" y="86" width="60" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="380" y="101" text-anchor="middle" font-weight="bold">prev</text>
    <rect x="410" y="86" width="90" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="455" y="101" text-anchor="middle" font-weight="bold">ans 累加后</text>
  </g>

  <g font-size="11">
    <!-- init row -->
    <rect x="40" y="110" width="50" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="126" text-anchor="middle" fill="#888">初始</text>
    <rect x="90" y="110" width="130" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="126" text-anchor="middle" fill="#888">—</text>
    <rect x="220" y="110" width="60" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="126" text-anchor="middle" fill="#888">—</text>
    <rect x="280" y="110" width="70" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="315" y="126" text-anchor="middle" fill="#888">—</text>
    <rect x="350" y="110" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <rect x="410" y="110" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row 0 -->
    <rect x="40" y="136" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="152" text-anchor="middle" fill="#446688">0</text>
    <rect x="90" y="136" width="130" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="152" text-anchor="middle" fill="#446688">011001</text>
    <rect x="220" y="136" width="60" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="152" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="280" y="136" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="315" y="152" text-anchor="middle" fill="#4a7a3a">首个非空</text>
    <rect x="350" y="136" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="410" y="136" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row 1 (empty) -->
    <rect x="40" y="162" width="50" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="178" text-anchor="middle" fill="#888">1</text>
    <rect x="90" y="162" width="130" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="178" text-anchor="middle" fill="#888">000000</text>
    <rect x="220" y="162" width="60" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="178" text-anchor="middle" fill="#888">0</text>
    <rect x="280" y="162" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="315" y="178" text-anchor="middle" fill="#b85450">跳过</text>
    <rect x="350" y="162" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="410" y="162" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row 2 -->
    <rect x="40" y="188" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="204" text-anchor="middle" fill="#446688">2</text>
    <rect x="90" y="188" width="130" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="204" text-anchor="middle" fill="#446688">010100</text>
    <rect x="220" y="188" width="60" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="204" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="280" y="188" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="315" y="204" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+3×2</text>
    <rect x="350" y="188" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="410" y="188" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="455" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>

    <!-- row 3 -->
    <rect x="40" y="214" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="230" text-anchor="middle" fill="#446688">3</text>
    <rect x="90" y="214" width="130" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="230" text-anchor="middle" fill="#446688">001000</text>
    <rect x="220" y="214" width="60" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="230" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="280" y="214" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="315" y="230" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+2×1</text>
    <rect x="350" y="214" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="230" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="410" y="214" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="455" y="230" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
  </g>

  <rect x="40" y="244" width="460" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="10" fill="#555">最终 ans = 0 + 0 + 3×2 + 2×1 = 8 ✓  （空行 row1 被跳过，prev 保持 3 直到 row2）</text>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="296" font-size="12" fill="#446688" font-weight="bold">示例 2：bank = ["000","111","000"]  →  ans = 0</text>

  <g font-size="10" fill="#666">
    <rect x="40" y="304" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="319" text-anchor="middle" font-weight="bold">行</text>
    <rect x="90" y="304" width="130" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="319" text-anchor="middle" font-weight="bold">bank[i]</text>
    <rect x="220" y="304" width="60" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="319" text-anchor="middle" font-weight="bold">cur</text>
    <rect x="280" y="304" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="315" y="319" text-anchor="middle" font-weight="bold">动作</text>
    <rect x="350" y="304" width="60" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="380" y="319" text-anchor="middle" font-weight="bold">prev</text>
    <rect x="410" y="304" width="90" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="455" y="319" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <g font-size="11">
    <!-- init -->
    <rect x="40" y="328" width="50" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="343" text-anchor="middle" fill="#888">初始</text>
    <rect x="90" y="328" width="130" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="343" text-anchor="middle" fill="#888">—</text>
    <rect x="220" y="328" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="343" text-anchor="middle" fill="#888">—</text>
    <rect x="280" y="328" width="70" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="315" y="343" text-anchor="middle" fill="#888">—</text>
    <rect x="350" y="328" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="343" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <rect x="410" y="328" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="343" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row0 empty -->
    <rect x="40" y="352" width="50" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="367" text-anchor="middle" fill="#888">0</text>
    <rect x="90" y="352" width="130" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="367" text-anchor="middle" fill="#888">000</text>
    <rect x="220" y="352" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="367" text-anchor="middle" fill="#888">0</text>
    <rect x="280" y="352" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="315" y="367" text-anchor="middle" fill="#b85450">跳过</text>
    <rect x="350" y="352" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="367" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <rect x="410" y="352" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="367" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row1 -->
    <rect x="40" y="376" width="50" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="391" text-anchor="middle" fill="#446688">1</text>
    <rect x="90" y="376" width="130" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="391" text-anchor="middle" fill="#446688">111</text>
    <rect x="220" y="376" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="391" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="280" y="376" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="315" y="391" text-anchor="middle" fill="#4a7a3a">首个非空</text>
    <rect x="350" y="376" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="391" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="410" y="376" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="455" y="391" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row2 empty -->
    <rect x="40" y="400" width="50" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="415" text-anchor="middle" fill="#888">2</text>
    <rect x="90" y="400" width="130" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="415" text-anchor="middle" fill="#888">000</text>
    <rect x="220" y="400" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="250" y="415" text-anchor="middle" fill="#888">0</text>
    <rect x="280" y="400" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="315" y="415" text-anchor="middle" fill="#b85450">跳过</text>
    <rect x="350" y="400" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="415" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="410" y="400" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
    <text x="455" y="415" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <rect x="40" y="428" width="460" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="444" font-size="10" fill="#555">只有 1 个非空行 → 没有相邻对 → ans = 0 ✓</text>
</svg>
