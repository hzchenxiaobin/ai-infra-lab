<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">长度 i：每步 +zero 个 '0' 或 +one 个 '1'</text>

  <!-- main row of dp cells (zero=1, one=2 illustration -> Fibonacci-like) -->
  <g filter="url(#rough2)" font-size="14" fill="#333">
    <!-- i=0 -->
    <rect x="24" y="62" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="54" y="91" text-anchor="middle">1</text>
    <!-- i=1 -->
    <rect x="98" y="62" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="128" y="91" text-anchor="middle">1</text>
    <!-- i=2 (in range) -->
    <rect x="172" y="62" width="60" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="202" y="91" text-anchor="middle" fill="#7a4a10">2</text>
    <!-- i=3 (in range) -->
    <rect x="246" y="62" width="60" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="276" y="91" text-anchor="middle" fill="#7a4a10">3</text>
    <!-- i=4 -->
    <rect x="320" y="62" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="350" y="91" text-anchor="middle">5</text>
    <!-- i=5 -->
    <rect x="394" y="62" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="424" y="91" text-anchor="middle">8</text>
    <!-- i=6 -->
    <rect x="468" y="62" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="498" y="91" text-anchor="middle">13</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="54" y="128">i=0</text>
    <text x="128" y="128">i=1</text>
    <text x="202" y="128">i=2</text>
    <text x="276" y="128">i=3</text>
    <text x="350" y="128">i=4</text>
    <text x="424" y="128">i=5</text>
    <text x="498" y="128">i=6</text>
  </g>

  <!-- range bracket + caption -->
  <path d="M172,138 L172,148 L306,148 L306,138" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="239" y="166" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">好字符串区间 [low, high]</text>
  <text x="239" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans = dp[2] + dp[3] = 5</text>

  <!-- recurrence inset -->
  <text x="280" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">递推关系</text>

  <!-- left cell i-zero -->
  <g filter="url(#rough2)">
    <rect x="60" y="232" width="96" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="108" y="260" text-anchor="middle" font-size="14" fill="#446688">i − zero</text>
  </g>
  <!-- middle cell i -->
  <g filter="url(#rough2)">
    <rect x="232" y="224" width="96" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="280" y="260" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">i</text>
  </g>
  <!-- right cell i-one -->
  <g filter="url(#rough2)">
    <rect x="404" y="232" width="96" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="452" y="260" text-anchor="middle" font-size="14" fill="#d6a040">i − one</text>
  </g>

  <!-- blue arrow: i-zero -> i (append zeros) -->
  <path d="M156,256 L228,256" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr_blue)" filter="url(#rough2)"/>
  <text x="192" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">加 '0'×zero</text>

  <!-- orange arrow: i-one -> i (append ones) -->
  <path d="M404,256 L332,256" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr_orange)" filter="url(#rough2)"/>
  <text x="368" y="248" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">加 '1'×one</text>

  <!-- formula caption -->
  <text x="280" y="318" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[i] = dp[i−zero] + dp[i−one]</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（zero==one 时两项代表不同字符块，仍要相加，不去重）</text>
</svg>
