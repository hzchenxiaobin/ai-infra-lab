<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：停机条件成立后，操作变成可快进的轮转周期</text>

  <!-- ============ 左：阶段一 堆模拟 ============ -->
  <text x="128" y="52" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">阶段一：堆模拟（真值比较，不取模）</text>

  <rect x="34" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="49" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="62" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="83" y="81" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="102" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="62" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="81" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="170" y="62" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="185" y="81" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="185" y="58" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">mx</text>
  <text x="83" y="58" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">min</text>

  <text x="128" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">执行条件：min × m ≤ mx（如 1×2=2 ≤ 6 ✓）</text>
  <text x="128" y="130" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 每次乘积都不超过 mx，mx 恒不变</text>
  <text x="128" y="148" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 真值全程 ≤ 10^9，64 位整数安全</text>
  <text x="128" y="166" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 每元素每乘至少翻倍又 ≤ mx，至多 ~30 次</text>
  <text x="128" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">总模拟步数 ≤ 30n（n=10^4 也只要 ~3×10^5 步）</text>

  <path d="M232,80 C 254,80 262,96 276,102" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="258" y="92" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">越过门槛</text>

  <!-- ============ 右：阶段二 轮转周期 ============ -->
  <text x="396" y="52" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">阶段二：轮转周期（剩余 k 次快进）</text>

  <rect x="316" y="60" width="160" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">停机条件：min × m &gt; mx</text>

  <rect x="306" y="100" width="52" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(4,0)</text>
  <path d="M358,112 L374,112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="100" width="52" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(4,1)</text>
  <path d="M432,112 L448,112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="454" y="100" width="52" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(5,3)</text>

  <path d="M480,124 C 480,136 420,134 338,144" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="146" width="52" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(6,2)</text>
  <path d="M358,158 L374,158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="146" width="52" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(6,4)</text>

  <path d="M432,158 C 500,156 500,86 340,96" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="486" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">n 次一轮</text>

  <text x="396" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每乘一个 ⇒ 变成全场最大 ⇒ 严格按升序轮转</text>
  <text x="396" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 次一轮、全体同乘 m ⇒ 次序复原，周期永续</text>
  <text x="396" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">剩余 k = q·n + r：每人 ×m^q，前 r 名多乘一次</text>

  <!-- ============ 底部要点框 ============ -->
  <rect x="28" y="244" width="464" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① multiplier = 1：停机条件永假（min×1 ≤ mx 恒成立），必须特判直接返回</text>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 模拟阶段用真值比较——绝不能取模，取模会破坏大小关系、堆顶失真</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 分配阶段指数 q 可达 10^9：快速幂 O(log k) 求模意义下的 m^q</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红 = 当前堆顶（下一个被乘）；绿 = mx；橙箭头 = 轮转顺序；绿虚线 = 一轮后的回环</text>
</svg>
