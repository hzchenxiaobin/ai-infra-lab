<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：贪心跳「右侧最大值」⟹ 答案 = 后缀最大值之和</text>

  <!-- nums 行：7 格 w=44 gap=8，start x=82 -->
  <rect x="82" y="48" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="104" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>

  <rect x="134" y="48" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="156" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>

  <rect x="186" y="48" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>

  <rect x="238" y="48" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="260" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>

  <rect x="290" y="48" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="69" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="312" y="96" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">4</text>

  <rect x="342" y="48" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="364" y="96" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>

  <rect x="394" y="48" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="69" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="416" y="96" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">6</text>

  <!-- 贪心跳跃弧线 -->
  <path d="M 104 86 Q 208 134 308 86" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳 0→4：4 × 9 = 36</text>

  <path d="M 316 86 Q 366 120 412 86" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="116" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4→6：2 × 3 = 6</text>

  <!-- 单位段行 -->
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">把每一跳按单位长度摊开：段 [t−1, t] 的贡献 = 覆盖它的那一跳的落点值</text>

  <rect x="67" y="160" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="95" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=1</text>

  <rect x="133" y="160" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="161" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=2</text>

  <rect x="199" y="160" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="227" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=3</text>

  <rect x="265" y="160" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="293" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="293" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=4</text>

  <rect x="331" y="160" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="181" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="359" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=5</text>

  <rect x="397" y="160" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="181" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="425" y="210" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=6</text>

  <!-- 逐段相等 -->
  <text x="95" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="161" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="227" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="293" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="359" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="425" y="234" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">=</text>

  <text x="260" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">而落点只能往右（落点(t) ≥ t）⟹ 每段贡献 ≤ m(t) = max(nums[t..n−1])</text>

  <!-- 上界行 -->
  <rect x="67" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="133" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="199" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="227" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="265" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="293" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="331" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="397" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 公式框 -->
  <rect x="45" y="306" width="430" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = Σ max(nums[t..n−1])（t = 1..n−1）= 9+9+9+9+3+3 = 42</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">贪心链每段恰好取满上界 ⟹ 上界可达 ⟹ 这就是最终答案</text>

  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">官方 hint：永远跳到右侧最大值处（并列时任取其一，得分相同）</text>
</svg>
