<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">平面上若干点：找任意两点的最短距离</text>

  <!-- Coordinate plane axes -->
  <line x1="40" y1="170" x2="290" y2="170" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="50" x2="170" y2="300" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="174" font-size="10" fill="#446688">x</text>
  <text x="163" y="48" font-size="10" fill="#446688">y</text>
  <text x="158" y="184" font-size="9" fill="#888">O</text>

  <!-- Grid marks on x-axis -->
  <line x1="130" y1="166" x2="130" y2="174" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="123" y="186" font-size="8" fill="#888">-1</text>
  <line x1="210" y1="166" x2="210" y2="174" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="207" y="186" font-size="8" fill="#888">1</text>

  <!-- Grid marks on y-axis -->
  <line x1="166" y1="210" x2="174" y2="210" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="148" y="214" font-size="8" fill="#888">-1</text>
  <line x1="166" y1="250" x2="174" y2="250" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="148" y="254" font-size="8" fill="#888">-2</text>

  <!-- Points: P1=(-1,-1)->(130,210), P2=(0,0)->(170,170), P3=(-1,-2)->(130,250) -->

  <!-- Distance lines (draw before points so points are on top) -->
  <!-- P1-P2: dashed blue, dist=√2≈1.41 -->
  <line x1="130" y1="210" x2="170" y2="170" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="148" y="186" font-size="8.5" fill="#446688">√2≈1.41</text>

  <!-- P2-P3: dashed blue, dist=√5≈2.24 -->
  <line x1="170" y1="170" x2="130" y2="250" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="148" y="218" font-size="8.5" fill="#446688">√5≈2.24</text>

  <!-- P1-P3: solid red (shortest!), dist=1.00 -->
  <line x1="130" y1="210" x2="130" y2="250" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="86" y="234" font-size="10" fill="#b85450" font-weight="bold">1.00 ★</text>

  <!-- Points -->
  <circle cx="130" cy="210" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="226" font-size="9.5" fill="#446688" font-weight="bold">(-1,-1)</text>

  <circle cx="170" cy="170" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="164" font-size="9.5" fill="#446688" font-weight="bold">(0,0)</text>

  <circle cx="130" cy="250" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="266" font-size="9.5" fill="#446688" font-weight="bold">(-1,-2)</text>

  <!-- Formula box (right top) -->
  <rect x="320" y="60" width="220" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">欧几里得距离公式</text>
  <text x="430" y="108" text-anchor="middle" font-size="13" fill="#333" font-family="Georgia, serif">d = √((x₁-x₂)² + (y₁-y₂)²)</text>
  <line x1="340" y1="120" x2="520" y2="120" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="138" text-anchor="middle" font-size="10" fill="#555">√ 是单调递增函数</text>
  <text x="430" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 先比 d²，最后只开一次 √</text>

  <!-- Self-join box (right bottom) -->
  <rect x="320" y="185" width="220" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="207" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">自连接：每个点配对所有其他点</text>
  <text x="335" y="228" font-size="10" fill="#555">• n 个点 → C(n,2) 对组合</text>
  <text x="335" y="244" font-size="10" fill="#555">• 排除自身配对：</text>
  <text x="335" y="258" font-size="9" fill="#446688">  p1.x ≠ p2.x OR p1.y ≠ p2.y</text>
  <text x="335" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">优化：字典序去半 ↓</text>
  <text x="335" y="288" font-size="9" fill="#4a7a3a">  p1.x&lt;p2.x OR (x=p2.x AND y&lt;p2.y)</text>

  <!-- Bottom note -->
  <rect x="30" y="315" width="510" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="10.5" fill="#333" font-weight="bold">核心思路：</text>
  <text x="50" y="356" font-size="10" fill="#555">自连接产生所有点对 → 计算平方距离 (dx²+dy²) → MIN 取最小平方 → SQRT 开方 → ROUND(,2) 取两位小数</text>
  <text x="50" y="374" font-size="10" fill="#b85450" font-weight="bold">关键优化：先比平方距离（免每对 SQRT），最后对 MIN 只开一次方；字典序条件每对只算一次</text>
</svg>
