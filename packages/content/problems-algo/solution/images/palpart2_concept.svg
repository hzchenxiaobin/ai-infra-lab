<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分割回文串 II：两阶段 DP（预处理 + 最小切割）</text>

  <!-- String row -->
  <text x="40" y="62" font-size="12" fill="#888">s =</text>
  <rect x="80" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="124" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="68" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="168" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="68" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="220" y="68" font-size="11" fill="#888">下标 0  1  2</text>

  <!-- Phase 1 box -->
  <rect x="30" y="95" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Phase 1：预处理回文表 isPal[i][j]（区间 DP）</text>

  <!-- mini isPal table -->
  <text x="60" y="142" font-size="11" fill="#888">isPal:</text>
  <!-- header -->
  <text x="130" y="142" font-size="10" fill="#888">j=0</text>
  <text x="175" y="142" font-size="10" fill="#888">j=1</text>
  <text x="220" y="142" font-size="10" fill="#888">j=2</text>
  <!-- i=0 -->
  <text x="105" y="162" font-size="10" fill="#888">i=0</text>
  <rect x="120" y="150" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="165" text-anchor="middle" font-size="10" fill="#333">T</text>
  <rect x="160" y="150" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="165" text-anchor="middle" font-size="10" fill="#333">T</text>
  <rect x="200" y="150" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="165" text-anchor="middle" font-size="10" fill="#333">F</text>
  <!-- i=1 -->
  <text x="105" y="187" font-size="10" fill="#888">i=1</text>
  <rect x="120" y="175" width="36" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="138" y="190" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="160" y="175" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="190" text-anchor="middle" font-size="10" fill="#333">T</text>
  <rect x="200" y="175" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="190" text-anchor="middle" font-size="10" fill="#333">F</text>
  <!-- i=2 -->
  <text x="105" y="207" font-size="10" fill="#888">i=2</text>
  <rect x="120" y="195" width="36" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="138" y="210" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="160" y="195" width="36" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="178" y="210" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="200" y="195" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="210" text-anchor="middle" font-size="10" fill="#333">T</text>

  <!-- formula right side -->
  <text x="300" y="150" font-size="11" fill="#555">递推式：</text>
  <text x="300" y="170" font-size="11" fill="#333">isPal[i][j] =</text>
  <text x="300" y="188" font-size="11" fill="#333">(s[i]==s[j]) &amp;&amp;</text>
  <text x="300" y="206" font-size="11" fill="#333">(j−i&lt;2 || isPal[i+1][j−1])</text>

  <!-- Arrow between phases -->
  <path d="M 280 215 L 280 235" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="230" font-size="10" fill="#888">查表 O(1)</text>

  <!-- Phase 2 box -->
  <rect x="30" y="240" width="500" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Phase 2：最小分割次数 DP</text>

  <!-- dp array -->
  <text x="60" y="290" font-size="11" fill="#888">dp[i]:</text>
  <rect x="100" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="152" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="204" y="276" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="100" y="318" font-size="9" fill="#888">"a"不需切</text>
  <text x="152" y="318" font-size="9" fill="#888">"aa"不需切</text>
  <text x="204" y="318" font-size="9" fill="#888">"aa|b"切1刀</text>

  <!-- dp formula -->
  <text x="300" y="286" font-size="11" fill="#555">递推式：</text>
  <text x="300" y="304" font-size="11" fill="#333">dp[i] = min(dp[j−1] + 1)</text>
  <text x="300" y="322" font-size="10" fill="#888">对所有 isPal[j][i]=true 的 j</text>

  <!-- Result -->
  <rect x="150" y="358" width="260" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = dp[n−1] = dp[2] = 1 ⭐</text>
</svg>
