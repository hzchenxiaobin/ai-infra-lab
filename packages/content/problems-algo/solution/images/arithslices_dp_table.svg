<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">等差数列划分 DP 填表过程</text>
  <path d="M 170 40 Q 280 48 390 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#888">nums = [1, 2, 3, 4, 5]　公差恒为 1</text>

  <text x="40" y="88" font-size="12" fill="#888" font-weight="bold">nums</text>
  <g filter="url(#rough2)">
    <rect x="100" y="72" width="70" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="170" y="72" width="70" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="240" y="72" width="70" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="310" y="72" width="70" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="380" y="72" width="70" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="135" y="92" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="205" y="92" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="275" y="92" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="345" y="92" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="415" y="92" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>

  <text x="40" y="120" font-size="11" fill="#888">i</text>
  <text x="135" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="205" y="120" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="275" y="120" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="345" y="120" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="415" y="120" text-anchor="middle" font-size="11" fill="#888">4</text>

  <text x="40" y="152" font-size="11" fill="#888">公差</text>
  <text x="135" y="152" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="205" y="152" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="275" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="345" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="415" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

  <text x="40" y="186" font-size="12" fill="#888" font-weight="bold">dp[i]</text>
  <g filter="url(#rough2)">
    <rect x="100" y="170" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2"/>
    <rect x="170" y="170" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2"/>
    <rect x="240" y="170" width="70" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="310" y="170" width="70" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="380" y="170" width="70" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="135" y="190" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="205" y="190" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="275" y="190" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="345" y="190" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="415" y="190" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">3</text>

  <text x="40" y="226" font-size="12" fill="#888" font-weight="bold">total</text>
  <g filter="url(#rough2)">
    <rect x="100" y="210" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <rect x="170" y="210" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <rect x="240" y="210" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="310" y="210" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="380" y="210" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <text x="135" y="230" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <text x="205" y="230" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <text x="275" y="230" text-anchor="middle" font-size="13" fill="#b85450">1</text>
  <text x="345" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="415" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <path d="M 275 242 L 275 248" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345 242 L 345 248" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 242 L 415 248" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="262" width="440" height="78" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="80" y="284" font-size="11" fill="#444" font-weight="bold">每步新增的子数组：</text>
  <text x="80" y="304" font-size="11" fill="#4a8e4a">i=2: dp=1 → [1,2,3]</text>
  <text x="80" y="322" font-size="11" fill="#4a8e4a">i=3: dp=2 → [2,3,4]、[1,2,3,4]</text>
  <text x="290" y="304" font-size="11" fill="#c98a2b">i=4: dp=3 → [3,4,5]、</text>
  <text x="290" y="322" font-size="11" fill="#c98a2b">　　　　　[2,3,4,5]、[1,2,3,4,5]</text>

  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = total = 1+2+3 = 6 ⭐ 　时间 O(n)，空间 O(1)</text>
</svg>
