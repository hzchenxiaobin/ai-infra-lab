<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 + 双计数器库存</text>

  <!-- 开始 -->
  <rect x="170" y="38" width="220" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">开始：one = t 中 '1' 数，zero = 其余</text>

  <path d="M 280 68 L 280 84" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：i < n ? -->
  <polygon points="210,114 280,84 350,114 280,144" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 350 114 L 424 114" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="106" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="428" y="98" width="122" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="489" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">返回 ans（答案串）</text>
  <text x="290" y="160" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- 处理：want 取反 -->
  <path d="M 280 144 L 280 164" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="166" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">want = s[i] 取反（'0'↔'1'）</text>
  <text x="280" y="201" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（s[i]='0' 查 one，s[i]='1' 查 zero）</text>

  <path d="M 280 210 L 280 230" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：want 的库存 > 0 ? -->
  <polygon points="150,264 280,232 410,264 280,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">want 的库存 &gt; 0 ?</text>

  <!-- 是：向下 -->
  <path d="M 280 296 L 280 318" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="312" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="175" y="320" width="210" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">ans[i] = '1'，该类库存 −1</text>

  <!-- 否：向右 -->
  <path d="M 410 264 L 444 264" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="256" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="448" y="246" width="104" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03028" filter="url(#rough2)">ans[i] = '0'</text>
  <text x="500" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03028" filter="url(#rough2)">同位库存 −1</text>

  <!-- 否分支汇回主流 -->
  <path d="M 500 284 L 500 336 L 391 336" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <path d="M 280 352 L 280 370" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="372" width="190" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">i ← i + 1</text>

  <!-- 循环回边 -->
  <path d="M 185 387 L 108 387 L 108 114 L 202 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="250" font-size="11" fill="#888" transform="rotate(-90 98 250)" text-anchor="middle" filter="url(#rough2)">下一位置</text>

  <!-- 底部提示 -->
  <rect x="90" y="414" width="380" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">不变量：剩余库存 ≡ 剩余格数 ⇒ 任意决策都能补全，贪心永不卡死</text>
</svg>
