<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [9,12,3,7,15]，target = 5</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每轮维护 S_r 与 ans，关注 r=2 处的碰撞去重</text>

  <!-- ===== 表头 ===== -->
  <g font-size="12">
    <rect x="40" y="62" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="75"  y="82" text-anchor="middle" fill="#444" font-weight="bold">r</text>
    <text x="130" y="82" text-anchor="middle" fill="#444" font-weight="bold">arr[r]</text>
    <text x="230" y="82" text-anchor="middle" fill="#444" font-weight="bold">S_{r-1}</text>
    <text x="395" y="82" text-anchor="middle" fill="#444" font-weight="bold">S_r（去重后）</text>
    <text x="505" y="82" text-anchor="middle" fill="#444" font-weight="bold">ans</text>
  </g>

  <!-- 列分隔线 -->
  <line x1="100" y1="62" x2="100" y2="296" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="160" y1="62" x2="160" y2="296" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="300" y1="62" x2="300" y2="296" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="490" y1="62" x2="490" y2="296" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2 2" filter="url(#rough2)"/>

  <!-- ===== Row r=0 ===== -->
  <g font-size="12">
    <rect x="40" y="94" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="75"  y="116" text-anchor="middle" fill="#333">0</text>
    <text x="130" y="116" text-anchor="middle" fill="#333">9</text>
    <text x="230" y="116" text-anchor="middle" fill="#888">—</text>
    <text x="395" y="116" text-anchor="middle" fill="#333" font-weight="bold">{9}</text>
    <text x="505" y="116" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- ===== Row r=1 ===== -->
  <g font-size="12">
    <rect x="40" y="130" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="75"  y="152" text-anchor="middle" fill="#333">1</text>
    <text x="130" y="152" text-anchor="middle" fill="#333">12</text>
    <text x="230" y="152" text-anchor="middle" fill="#333">{9}</text>
    <text x="395" y="152" text-anchor="middle" fill="#333" font-weight="bold">{12, 8}</text>
    <text x="395" y="152" text-anchor="middle" fill="#888" font-size="9" dx="48">9&amp;12=8</text>
    <text x="505" y="152" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- ===== Row r=2 (碰撞行，高亮) ===== -->
  <g font-size="12">
    <rect x="40" y="166" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="75"  y="190" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="130" y="190" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="230" y="190" text-anchor="middle" fill="#333">{12, 8}</text>
    <text x="395" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">{3, 0}</text>
    <text x="395" y="198" text-anchor="middle" font-size="9" fill="#b85450">12&amp;3=0, 8&amp;3=0 → 碰撞</text>
    <text x="505" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== Row r=3 ===== -->
  <g font-size="12">
    <rect x="40" y="208" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="75"  y="230" text-anchor="middle" fill="#333">3</text>
    <text x="130" y="230" text-anchor="middle" fill="#333">7</text>
    <text x="230" y="230" text-anchor="middle" fill="#333">{3, 0}</text>
    <text x="395" y="230" text-anchor="middle" fill="#333" font-weight="bold">{7, 3, 0}</text>
    <text x="505" y="230" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- ===== Row r=4 ===== -->
  <g font-size="12">
    <rect x="40" y="244" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="75"  y="266" text-anchor="middle" fill="#333">4</text>
    <text x="130" y="266" text-anchor="middle" fill="#333">15</text>
    <text x="230" y="266" text-anchor="middle" fill="#333">{7, 3, 0}</text>
    <text x="395" y="266" text-anchor="middle" fill="#333" font-weight="bold">{15, 7, 3, 0}</text>
    <text x="505" y="266" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- ===== 结论框 ===== -->
  <rect x="40" y="296" width="500" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案：ans = 2 ✓</text>
  <text x="290" y="338" text-anchor="middle" font-size="11" fill="#333">r=2 时 12&amp;3 与 8&amp;3 都得 0，碰撞合并 → |S_r| 不增反减</text>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#333">这正是 |S_r| ≤ 21 的来源：每次 &amp; 都可能让多个旧值塌缩为一个</text>
</svg>
