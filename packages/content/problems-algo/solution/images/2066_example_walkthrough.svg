<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个账户逐笔余额推演</text>

  <!-- Account 1 header -->
  <rect x="30" y="50" width="560" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="12" fill="#446688" font-weight="bold">账户 1（PARTITION 切窗，累加器从 0 起）</text>

  <!-- Account 1 table header -->
  <rect x="30" y="88" width="560" height="22" fill="#fafafa" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="103" font-size="9.5" fill="#888">day</text>
  <text x="140" y="103" font-size="9.5" fill="#888">type</text>
  <text x="240" y="103" font-size="9.5" fill="#888">amount</text>
  <text x="330" y="103" font-size="9.5" fill="#888">带符号值</text>
  <text x="430" y="103" font-size="9.5" fill="#888">累加器（余额）</text>

  <!-- Account 1 rows -->
  <rect x="30" y="110" width="560" height="26" fill="#ffffff" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="127" font-size="10.5" fill="#333">2021-11-07</text>
  <text x="140" y="127" font-size="10.5" fill="#4a7a3a">Deposit</text>
  <text x="240" y="127" font-size="10.5" fill="#333">2000</text>
  <text x="330" y="127" font-size="10.5" fill="#4a7a3a" font-weight="bold">+2000</text>
  <text x="430" y="127" font-size="10.5" fill="#333">0 + 2000 = </text>
  <text x="500" y="127" font-size="10.5" fill="#b85450" font-weight="bold">2000</text>

  <rect x="30" y="136" width="560" height="26" fill="#f7fbff" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="153" font-size="10.5" fill="#333">2021-11-09</text>
  <text x="140" y="153" font-size="10.5" fill="#b85450">Withdraw</text>
  <text x="240" y="153" font-size="10.5" fill="#333">1000</text>
  <text x="330" y="153" font-size="10.5" fill="#b85450" font-weight="bold">−1000</text>
  <text x="430" y="153" font-size="10.5" fill="#333">2000 − 1000 = </text>
  <text x="500" y="153" font-size="10.5" fill="#b85450" font-weight="bold">1000</text>

  <rect x="30" y="162" width="560" height="26" fill="#ffffff" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="179" font-size="10.5" fill="#333">2021-11-11</text>
  <text x="140" y="179" font-size="10.5" fill="#4a7a3a">Deposit</text>
  <text x="240" y="179" font-size="10.5" fill="#333">3000</text>
  <text x="330" y="179" font-size="10.5" fill="#4a7a3a" font-weight="bold">+3000</text>
  <text x="430" y="179" font-size="10.5" fill="#333">1000 + 3000 = </text>
  <text x="500" y="179" font-size="10.5" fill="#b85450" font-weight="bold">4000</text>

  <rect x="30" y="188" width="560" height="26" fill="#f7fbff" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="205" font-size="10.5" fill="#333">2021-11-13</text>
  <text x="140" y="205" font-size="10.5" fill="#b85450">Withdraw</text>
  <text x="240" y="205" font-size="10.5" fill="#333">5000</text>
  <text x="330" y="205" font-size="10.5" fill="#b85450" font-weight="bold">−5000</text>
  <text x="430" y="205" font-size="10.5" fill="#333">4000 − 5000 = </text>
  <text x="500" y="205" font-size="10.5" fill="#b85450" font-weight="bold">−1000</text>

  <!-- Note about negative balance -->
  <rect x="30" y="220" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="236" font-size="10" fill="#b85450" font-weight="bold">⚠️ 余额可为负：取出超过存入时 SUM 对带符号列天然支持负值</text>

  <!-- Partition reset arrow -->
  <path d="M 310 248 L 310 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="262" font-size="9.5" fill="#888">PARTITION 切窗 → 累加器清零</text>

  <!-- Account 2 header -->
  <rect x="30" y="272" width="560" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="12" fill="#4a7a3a" font-weight="bold">账户 2（新窗口，累加器清零重启，不接续账户 1 的 −1000）</text>

  <!-- Account 2 table header -->
  <rect x="30" y="310" width="560" height="22" fill="#fafafa" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="325" font-size="9.5" fill="#888">day</text>
  <text x="140" y="325" font-size="9.5" fill="#888">type</text>
  <text x="240" y="325" font-size="9.5" fill="#888">amount</text>
  <text x="330" y="325" font-size="9.5" fill="#888">带符号值</text>
  <text x="430" y="325" font-size="9.5" fill="#888">累加器（余额）</text>

  <!-- Account 2 rows -->
  <rect x="30" y="332" width="560" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="349" font-size="10.5" fill="#333">2021-12-07</text>
  <text x="140" y="349" font-size="10.5" fill="#4a7a3a">Deposit</text>
  <text x="240" y="349" font-size="10.5" fill="#333">7000</text>
  <text x="330" y="349" font-size="10.5" fill="#4a7a3a" font-weight="bold">+7000</text>
  <text x="430" y="349" font-size="10.5" fill="#333">0 + 7000 = </text>
  <text x="500" y="349" font-size="10.5" fill="#b85450" font-weight="bold">7000</text>

  <rect x="30" y="358" width="560" height="26" fill="#f5fbf6" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="50" y="375" font-size="10.5" fill="#333">2021-12-12</text>
  <text x="140" y="375" font-size="10.5" fill="#b85450">Withdraw</text>
  <text x="240" y="375" font-size="10.5" fill="#333">7000</text>
  <text x="330" y="375" font-size="10.5" fill="#b85450" font-weight="bold">−7000</text>
  <text x="430" y="375" font-size="10.5" fill="#333">7000 − 7000 = </text>
  <text x="500" y="375" font-size="10.5" fill="#b85450" font-weight="bold">0</text>

  <!-- Key insights box -->
  <rect x="30" y="396" width="560" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="416" font-size="10.5" fill="#d6a040" font-weight="bold">💡 三个观察要点</text>
  <text x="50" y="432" font-size="9.5" fill="#555">① 余额可为负：SUM 对带符号列天然支持，账户 1 末行 −1000</text>
  <text x="50" y="446" font-size="9.5" fill="#555">② PARTITION 重置：账户 2 首行从 0 起算，不接续账户 1 末行</text>
  <text x="50" y="460" font-size="9.5" fill="#555">③ ORDER BY day 定向：日期是业务上唯一有意义的累计方向</text>
</svg>
