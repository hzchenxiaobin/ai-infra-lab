<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "ababbb"</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Manacher → 惰性传播 → 前后缀最大值 → 枚举分割点</text>

  <!-- Column positions: 6 cells + label column -->
  <!-- label area: x=20..100, cells: x=110,175,240,305,370,435 each 55 wide -->

  <!-- Row labels and data -->
  <!-- Row 1: s[i] -->
  <text x="90" y="82" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <g font-size="13">
    <rect x="110" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="137" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">a</text>
    <rect x="175" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="202" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="240" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="267" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">a</text>
    <rect x="305" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="332" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="370" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="397" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="435" y="66" width="55" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="462" y="86" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
  </g>

  <!-- index labels -->
  <g font-size="9" fill="#aaa">
    <text x="137" y="110" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="202" y="110" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="267" y="110" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="332" y="110" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="397" y="110" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="462" y="110" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>

  <!-- Row 2: d[i] -->
  <text x="90" y="148" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d[i]</text>
  <g font-size="12">
    <rect x="110" y="132" width="55" height="30" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="137" y="152" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
    <rect x="175" y="132" width="55" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="202" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="240" y="132" width="55" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="267" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="305" y="132" width="55" height="30" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="332" y="152" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
    <rect x="370" y="132" width="55" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="397" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="435" y="132" width="55" height="30" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="462" y="152" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
  </g>
  <text x="510" y="152" font-size="10" fill="#888" filter="url(#rough2)">← Manacher 半径</text>

  <!-- Row 3: maxEndAt -->
  <text x="90" y="198" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">maxEndAt</text>
  <g font-size="11">
    <rect x="110" y="182" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="137" y="200" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="175" y="182" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="202" y="200" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="240" y="182" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="267" y="200" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <rect x="305" y="182" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="332" y="200" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <rect x="370" y="182" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="397" y="200" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="435" y="182" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="462" y="200" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">3</text>
  </g>
  <text x="510" y="200" font-size="10" fill="#888" filter="url(#rough2)">← 反向传播后</text>

  <!-- Row 4: prefixMax -->
  <text x="90" y="244" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">prefixMax</text>
  <g font-size="11">
    <rect x="110" y="228" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="137" y="246" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="175" y="228" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="202" y="246" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="240" y="228" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="267" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="305" y="228" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="332" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="370" y="228" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="397" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="435" y="228" width="55" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="462" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  </g>

  <!-- Row 5: maxStartAt -->
  <text x="90" y="300" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">maxStartAt</text>
  <g font-size="11">
    <rect x="110" y="284" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="137" y="302" text-anchor="middle" fill="#b85450" filter="url(#rough2)">3</text>
    <rect x="175" y="284" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="202" y="302" text-anchor="middle" fill="#b85450" filter="url(#rough2)">3</text>
    <rect x="240" y="284" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="267" y="302" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="305" y="284" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="332" y="302" text-anchor="middle" fill="#b85450" filter="url(#rough2)">3</text>
    <rect x="370" y="284" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="397" y="302" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="435" y="284" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="462" y="302" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
  </g>
  <text x="510" y="302" font-size="10" fill="#888" filter="url(#rough2)">← 正向传播后</text>

  <!-- Row 6: suffixMax -->
  <text x="90" y="346" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">suffixMax</text>
  <g font-size="11">
    <rect x="110" y="330" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="137" y="348" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="175" y="330" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="202" y="348" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="240" y="330" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="267" y="348" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="305" y="330" width="55" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="332" y="348" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="370" y="330" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="397" y="348" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
    <rect x="435" y="330" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="462" y="348" text-anchor="middle" fill="#888" filter="url(#rough2)">1</text>
  </g>

  <!-- divider line -->
  <line x1="50" y1="378" x2="560" y2="378" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Row 7: products -->
  <text x="90" y="410" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">乘积</text>
  <g font-size="11">
    <rect x="110" y="394" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="137" y="412" text-anchor="middle" fill="#888" filter="url(#rough2)">3</text>
    <rect x="175" y="394" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="202" y="412" text-anchor="middle" fill="#888" filter="url(#rough2)">3</text>
    <rect x="240" y="394" width="55" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="267" y="412" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>
    <rect x="305" y="394" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="332" y="412" text-anchor="middle" fill="#888" filter="url(#rough2)">3</text>
    <rect x="370" y="394" width="55" height="28" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="397" y="412" text-anchor="middle" fill="#888" filter="url(#rough2)">3</text>
  </g>
  <text x="510" y="412" font-size="10" fill="#888" filter="url(#rough2)">prefixMax[i]×suffixMax[i+1]</text>

  <!-- split point annotation -->
  <path d="M 267 425 L 267 440" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 262 438 L 267 442 L 272 438" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="267" y="458" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">i=2: 3×3=9 ✓</text>

  <!-- result box -->
  <rect x="160" y="470" width="340" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="495" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 9（"aba" × "bbb" = 3 × 3）</text>
</svg>
