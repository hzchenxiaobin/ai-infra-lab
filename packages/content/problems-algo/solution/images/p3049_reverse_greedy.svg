<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">反向扫描 + 小根堆：名额不够就踢掉「省得最少」的</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">从第 x 秒倒着扫回第 1 秒（示例 1，x = 6），橙色 = 最早出现秒</text>

  <!-- 左侧：时间轴倒序（从下往上？不，从上往下=从晚到早） -->
  <rect x="56" y="80" width="72" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="118" width="72" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="156" width="72" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="194" width="72" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="56" y="232" width="72" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="56" y="270" width="72" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="92" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒6: 2</text>
  <text x="92" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒5: 2</text>
  <text x="92" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒4: 2</text>
  <text x="92" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒3: 2★</text>
  <text x="92" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒2: 3★</text>
  <text x="92" y="291" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">秒1: 1★</text>

  <path d="M132,86 C146,100 146,108 140,116" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M132,268 C150,262 162,250 176,240" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="36" y="330" font-size="11" fill="#666" filter="url(#rough2)" transform="rotate(-90 36,330)">扫描方向 ⬇</text>

  <!-- 右上：名额池 -->
  <rect x="182" y="80" width="300" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="102" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">空闲名额 cnt（标记秒池）</text>
  <text x="196" y="122" font-size="12" fill="#333" filter="url(#rough2)">非首次出现的秒 → cnt + 1，随时可拿来当标记</text>

  <!-- 右中：小根堆 -->
  <rect x="182" y="156" width="300" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="178" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">小根堆（清零候选）</text>
  <text x="196" y="198" font-size="12" fill="#333" filter="url(#rough2)">首次出现且 nums[v] &gt; 0 → 入堆 nums[v]：total −= nums[v]−1</text>

  <!-- 右下：踢人规则 -->
  <rect x="182" y="232" width="300" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="254" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆大小 &gt; cnt（名额不够）</text>
  <text x="196" y="274" font-size="12" fill="#333" filter="url(#rough2)">弹出最小 w：total += w − 1（还回省时）</text>
  <text x="196" y="292" font-size="12" fill="#333" filter="url(#rough2)">cnt += 1：被踢者的清零秒还给名额池</text>

  <path d="M332,218 C332,220 332,222 332,230" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="340" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">若超员</text>

  <!-- 底部：不变式 -->
  <rect x="36" y="316" width="448" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">不变式：每个入选者占 2 秒（清零秒 + 更晚的标记秒）⇒ 任意后缀中 2×入选数 ≤ 秒数</text>
</svg>
