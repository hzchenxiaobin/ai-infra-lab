<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 445" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="445" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一切围绕最小值 m —— 两种情况定答案</text>
  <text x="310" y="46" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">操作 = 删二插一（长度恰 −1），操作数必须 &gt; 0，产生的 0 是死元素</text>

  <!-- Section 1: two pairing directions -->
  <text x="44" y="74" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 最小值 m 的两种配对方向</text>

  <!-- direction A: m % y -->
  <rect x="58" y="88" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m</text>
  <text x="108" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">%</text>
  <rect x="120" y="88" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y&gt;m</text>
  <text x="178" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="190" y="88" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m</text>
  <text x="246" y="101" font-size="11" fill="#333" filter="url(#rough2)">m % y = m：删 (m, y)，插回一个 m</text>
  <text x="246" y="119" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">消灭一个大数 y，m 无损复活 ✓</text>

  <!-- direction B: y % m -->
  <rect x="58" y="140" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>
  <text x="108" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">%</text>
  <rect x="120" y="140" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m</text>
  <text x="178" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="190" y="140" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="161" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">r</text>
  <text x="246" y="153" font-size="11" fill="#333" filter="url(#rough2)">y % m = r：两种结局</text>
  <text x="246" y="171" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">r ≠ 0 → 造出比 m 更小的唯一最小值！</text>
  <text x="246" y="189" font-size="11" fill="#999" filter="url(#rough2)">r = 0 → 白亏一个 m，纯亏 ✗</text>

  <!-- dead zero note -->
  <rect x="442" y="88" width="148" height="92" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="516" y="112" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">0 是死元素</text>
  <text x="516" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">操作要求两数 &gt; 0</text>
  <text x="516" y="150" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0 一旦产生</text>
  <text x="516" y="168" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">只能躺尸占长度</text>

  <!-- Section 2: two cases -->
  <text x="44" y="226" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 按「是否存在 m 的非倍数」分类</text>

  <rect x="40" y="238" width="272" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="176" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情况一：存在 y 使 y % m ≠ 0</text>
  <text x="176" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一步造出 r = y % m &lt; m</text>
  <text x="176" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r 成为全数组唯一的最小值</text>
  <text x="176" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再用 m % y = m 逐个清场其余</text>
  <text x="176" y="334" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 1</text>

  <rect x="328" y="238" width="252" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情况二：所有元素都是 m 的倍数</text>
  <text x="454" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a % b 仍是 m 的倍数（或 0）</text>
  <text x="454" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 最小值永远是 m，造不出更小</text>
  <text x="454" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt 个 m 两两同归于尽：m % m = 0</text>
  <text x="454" y="334" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = ⌈cnt / 2⌉</text>

  <!-- formula box -->
  <rect x="40" y="356" width="540" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="379" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 1（存在 x 使 x % m ≠ 0）；否则 ans = ⌈cnt / 2⌉（cnt 为 m 的出现次数）</text>
  <text x="310" y="401" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">数论等价：存在非倍数 ⟺ gcd(nums) &lt; m；全是倍数 ⟺ gcd(nums) = m</text>
  <text x="310" y="421" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">两趟扫描：求 m → 查非倍数 + 数 cnt，O(n) 时间 / O(1) 空间</text>
</svg>
