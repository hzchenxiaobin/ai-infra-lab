<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪吃蛇穿迷宫：BFS 逐层扩散算法流程</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: flowchart ===== -->
  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="70" y="68" width="240" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="190" y="92" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">开始：读入 n×n 网格 grid</text>
  </g>
  <path d="M 190 106 L 190 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="60" y="130" width="260" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="150" text-anchor="middle" font-size="11.5" fill="#333">队列入 (0,0,0)，dist[0][0][0]=0</text>
    <text x="190" y="166" text-anchor="middle" font-size="11" fill="#666">dist 三维数组 [n][n][2] 初始化 −1</text>
  </g>
  <path d="M 190 174 L 190 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop: pop -->
  <g filter="url(#sk)">
    <rect x="60" y="198" width="260" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="190" y="223" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">队列非空 → 取出队首 (r,c,o)</text>
  </g>
  <path d="M 190 238 L 190 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: is target? -->
  <g filter="url(#sk)">
    <path d="M 190 262 L 276 300 L 190 338 L 104 300 Z" fill="#fff3cd" stroke="#d6a040" stroke-width="1.5"/>
    <text x="190" y="296" text-anchor="middle" font-size="11" fill="#7a5415">(r,c,o) ==</text>
    <text x="190" y="312" text-anchor="middle" font-size="11" fill="#7a5415">(n−1,n−2,0) ?</text>
  </g>

  <!-- yes -> return -->
  <path d="M 276 300 L 372 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="372" y="281" width="160" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="452" y="305" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 dist[r][c][o]</text>
  </g>

  <!-- no -> expand 4 moves -->
  <path d="M 190 338 L 190 362" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="202" y="356" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="48" y="362" width="284" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="382" text-anchor="middle" font-size="11.5" fill="#333">枚举 4 种移动，计算新状态 (nr,nr,no)</text>
    <text x="190" y="398" text-anchor="middle" font-size="10.5" fill="#666">右移 / 下移 / 顺时针 / 逆时针</text>
  </g>
  <path d="M 190 406 L 190 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- legal & visited decision -->
  <g filter="url(#sk)">
    <path d="M 190 430 L 290 468 L 190 506 L 90 468 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="190" y="460" text-anchor="middle" font-size="10" fill="#b85450">越界 / 撞障碍</text>
    <text x="190" y="476" text-anchor="middle" font-size="10" fill="#b85450">或已访问 ?</text>
  </g>

  <!-- yes skip -->
  <path d="M 90 468 L 44 468 L 44 218 L 60 218" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="50" y="340" font-size="10" fill="#888">跳过</text>

  <!-- no enqueue -->
  <path d="M 290 468 L 360 468 L 360 218 L 320 218" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="368" y="340" font-size="10" fill="#4a8edb" font-weight="bold">入队</text>
  <text x="368" y="354" font-size="10" fill="#4a8edb" font-weight="bold">dist=</text>
  <text x="368" y="368" font-size="10" fill="#4a8edb" font-weight="bold">d+1</text>

  <!-- loop back note -->
  <g filter="url(#sk)">
    <rect x="300" y="170" width="120" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="360" y="190" text-anchor="middle" font-size="10.5" fill="#7a5415">继续取下一队首</text>
  </g>

  <!-- queue empty -> -1 -->
  <g filter="url(#sk)">
    <rect x="372" y="332" width="160" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="452" y="354" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">队列空未命中 → 返回 −1</text>
  </g>
  <path d="M 190 218 L 30 218 L 30 349 L 372 349" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- ===== Right: key points ===== -->
  <g filter="url(#sk)">
    <rect x="540" y="68" width="290" height="460" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="685" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">关键不变式</text>
  <g font-size="11" fill="#444">
    <text x="558" y="122"><tspan font-weight="bold" fill="#446688">① 状态三分量</tspan></text>
    <text x="570" y="140">(r, c, 朝向)，朝向 0=水平</text>
    <text x="570" y="156">1=竖直，蛇身由锚点+朝向唯一确定</text>

    <text x="558" y="186"><tspan font-weight="bold" fill="#b85450">② O(1) 转移判定</tspan></text>
    <text x="570" y="204">每种移动只查 1~2 个格子是否为 0</text>
    <text x="570" y="220">旋转要求 2×2 块「另一对角」为空</text>

    <text x="558" y="250"><tspan font-weight="bold" fill="#d6a040">③ 逐层 BFS</tspan></text>
    <text x="570" y="268">每条边权 = 1（一次移动）</text>
    <text x="570" y="284">首次到达终点的层数 = 最少移动数</text>

    <text x="558" y="314"><tspan font-weight="bold" fill="#4a8e4a">④ 三维去重</tspan></text>
    <text x="570" y="332">dist[n][n][2] 兼做访问标记与步数</text>
    <text x="570" y="348">初值 −1，首次入队时写入 d+1</text>

    <text x="558" y="378"><tspan font-weight="bold" fill="#446688">⑤ 终止</tspan></text>
    <text x="570" y="396">弹出状态 == 终点即返回</text>
    <text x="570" y="412">队列空仍未命中 → 不可达，返回 −1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="556" y="432" width="258" height="82" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="685" y="456" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">为什么 BFS 必然高效？</text>
  <text x="566" y="476" font-size="10" fill="#444">状态总数 2n² ≤ 2×10⁴，每个状态</text>
  <text x="566" y="492" font-size="10" fill="#444">只扩展 4 条出边，总转移 ≤ 8×10⁴，</text>
  <text x="566" y="508" font-size="10" fill="#444">BFS 在有限步内必终止或判不可达。</text>
</svg>
