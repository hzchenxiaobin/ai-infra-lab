<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：cnt ≥ k 的最深层即答案；删除只发生在一条路径上</text>

  <!-- ================= left panel: trie ================= -->
  <rect x="14" y="36" width="286" height="256" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="157" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">带计数的 Trie（示例 1，k = 2）</text>

  <!-- depth labels -->
  <text x="44" y="130" font-size="9.5" fill="#999" filter="url(#rough2)">d=1</text>
  <text x="44" y="172" font-size="9.5" fill="#999" filter="url(#rough2)">d=2</text>
  <text x="44" y="214" font-size="9.5" fill="#999" filter="url(#rough2)">d=3</text>
  <text x="44" y="256" font-size="9.5" fill="#999" filter="url(#rough2)">d=4</text>

  <!-- root -->
  <circle cx="165" cy="82" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">根</text>
  <text x="184" y="86" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">cnt 5→4 ✓</text>

  <!-- edges root -> j / r -->
  <path d="M 157 93 L 103 116" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 173 93 L 222 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- j path (removal path, red) -->
  <path d="M 95 139 L 95 154" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 95 181 L 95 196" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 95 223 L 95 238" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- r path (untouched, blue) -->
  <path d="M 230 139 L 230 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 230 181 L 230 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- j-path nodes -->
  <circle cx="95" cy="126" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="113" y="122" font-size="9.5" fill="#b85450" filter="url(#rough2)">2→1 ✗</text>

  <circle cx="95" cy="168" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ju</text>
  <text x="113" y="164" font-size="9.5" fill="#b85450" filter="url(#rough2)">2→1 ✗</text>

  <circle cx="95" cy="210" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">jum</text>
  <text x="113" y="206" font-size="9.5" fill="#b85450" filter="url(#rough2)">2→1 ✗</text>

  <circle cx="95" cy="252" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="256" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">jump</text>
  <text x="113" y="248" font-size="9.5" fill="#b85450" filter="url(#rough2)">2→1 ✗</text>

  <!-- r-path nodes -->
  <circle cx="230" cy="126" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="212" y="122" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">cnt 3 ✓</text>

  <circle cx="230" cy="168" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ru</text>
  <text x="212" y="164" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">cnt 3 ✓</text>

  <circle cx="230" cy="210" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">run</text>
  <text x="212" y="206" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">cnt 3 ✓</text>

  <text x="157" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">移除 words[0]="jump"：红色路径 cnt 各减 1</text>

  <!-- ================= right panel: good table ================= -->
  <rect x="312" y="36" width="194" height="256" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="409" y="57" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">good[d]：满足层的账本</text>

  <!-- table header -->
  <rect x="324" y="68" width="42" height="24" fill="#eef2f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="68" width="64" height="24" fill="#eef2f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="68" width="64" height="24" fill="#eef2f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">深度</text>
  <text x="398" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删前</text>
  <text x="462" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删后</text>

  <!-- row d=4 (best before) -->
  <rect x="324" y="92" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="92" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="92" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="398" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="462" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ✗</text>

  <!-- row d=3 (best after) -->
  <rect x="324" y="120" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="120" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="120" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="398" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="462" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- row d=2 -->
  <rect x="324" y="148" width="42" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="148" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="148" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="398" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="462" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- row d=1 -->
  <rect x="324" y="176" width="42" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="176" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="176" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="462" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- row d=0 (root) -->
  <rect x="324" y="204" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="204" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="204" width="64" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0 根</text>
  <text x="398" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="462" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>

  <!-- best transition -->
  <path d="M 409 236 L 409 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="409" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">best：4 ⟶ 3（下探一层）</text>
  <rect x="349" y="268" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="409" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer[0] = 3</text>

  <!-- ================= bottom strip ================= -->
  <rect x="14" y="302" width="492" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">只有 cnt 恰好 = k 的节点会出局：&gt; k 的减 1 后仍满足，&lt; k 的本就不满足</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">答案 = 最大的 d 使 good[d] &gt; 0；祖先 cnt ≥ 后代 ⟹ good 在 [0, best] 上层层非零</text>
</svg>
