<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 四步法 + 终点取 min</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">楼顶在第 n 阶（虚拟终点），可从 n−1 或 n−2 跨出</text>

  <!-- ===== Four steps as boxes ===== -->
  <g font-size="10" fill="#333">
    <!-- Step 1: 状态定义 -->
    <rect x="40" y="68" width="220" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="150" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 状态定义</text>
    <text x="150" y="106" text-anchor="middle" font-size="10" fill="#555">dp(i) = 到达并支付第 i 阶的最小花费</text>
    <text x="150" y="122" text-anchor="middle" font-size="9" fill="#888">「站在 i 阶且已掏过 cost[i]」</text>

    <path d="M 150 130 L 150 144" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: 转移方程 -->
    <rect x="40" y="146" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="150" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 转移方程</text>
    <text x="150" y="184" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">dp(i) = min(dp(i−1), dp(i−2)) + cost[i]</text>
    <text x="150" y="200" text-anchor="middle" font-size="9" fill="#888">「最后一步从哪跨来更省？」</text>

    <path d="M 150 208 L 150 222" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: 初始条件 -->
    <rect x="40" y="224" width="220" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="150" y="244" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 初始条件</text>
    <text x="150" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">dp(0) = cost[0], dp(1) = cost[1]</text>
    <text x="150" y="278" text-anchor="middle" font-size="9" fill="#888">「起点 0/1 直接出发，付自身 cost」</text>

    <path d="M 150 286 L 150 300" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: 计算顺序 + 答案 -->
    <rect x="40" y="302" width="220" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="150" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 计算 + 取答案</text>
    <text x="150" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">i = 2 → 3 → ... → n−1</text>
    <text x="150" y="358" text-anchor="middle" font-family="monospace" font-size="11" fill="#b85450" font-weight="bold">ans = min(dp(n−1), dp(n−2))</text>
    <text x="150" y="374" text-anchor="middle" font-size="9" fill="#888">「楼顶在 n，最后一步跨 1 或 2」</text>
  </g>

  <!-- ===== Right: rolling array note ===== -->
  <rect x="290" y="146" width="200" height="120" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="168" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">滚动数组优化</text>
  <text x="302" y="188" font-family="monospace" font-size="10" fill="#333">prev2 = cost[0]; // dp(i−2)</text>
  <text x="302" y="204" font-family="monospace" font-size="10" fill="#333">prev1 = cost[1]; // dp(i−1)</text>
  <text x="302" y="220" font-family="monospace" font-size="10" fill="#4a7a3a">cur = min(prev1, prev2) + cost[i];</text>
  <text x="302" y="236" font-family="monospace" font-size="10" fill="#446688">prev2 = prev1;</text>
  <text x="302" y="252" font-family="monospace" font-size="10" fill="#b85450">prev1 = cur;</text>

  <rect x="290" y="282" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">空间：O(n) → O(1)</text>
  <text x="390" y="320" text-anchor="middle" font-size="9" fill="#555">dp(i) 只依赖前 2 个状态</text>

  <rect x="290" y="344" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="362" text-anchor="middle" font-size="9.5" fill="#444">爬楼梯 70 的「min 花费」镜像</text>
  <text x="390" y="376" text-anchor="middle" font-size="9" fill="#888">加法计数 → 取 min 求最值</text>
</svg>
