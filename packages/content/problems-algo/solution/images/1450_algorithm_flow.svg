<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历，判定 queryTime 是否落在每个学生区间内</text>

  <!-- Start -->
  <ellipse cx="220" cy="44" rx="36" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="48" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 220 57 L 220 67" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: count = 0; i = 0 -->
  <rect x="140" y="69" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="88" text-anchor="middle" font-size="11.5" fill="#333">count = 0；i = 0</text>
  <path d="M 220 99 L 220 109" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i &lt; n ? -->
  <polygon points="220,111 296,143 220,175 144,143" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- No branch left -> return count -->
  <path d="M 144 143 L 130 143" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="137" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="127" width="90" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="147" text-anchor="middle" font-size="11.5" fill="#333">返回 count</text>
  <path d="M 85 159 L 85 171" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="85" cy="184" rx="30" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="188" text-anchor="middle" font-size="11.5" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 220 175 L 220 185" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: start[i] &le; q &le; end[i] ? -->
  <polygon points="220,187 312,223 220,259 128,223" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="11" fill="#333">start[i] ≤ q</text>
  <text x="220" y="234" text-anchor="middle" font-size="11" fill="#333">≤ end[i] ?</text>

  <!-- Yes branch left -> count += 1 -->
  <path d="M 128 223 L 116 223" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="217" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="34" y="209" width="82" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="227" text-anchor="middle" font-size="11.5" fill="#333">count += 1</text>
  <!-- join count+=1 down to i+=1 line -->
  <path d="M 75 237 L 75 285 L 220 285" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch right -> i += 1 -->
  <path d="M 312 223 L 380 223" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="217" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="380" y="209" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="227" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back from i+=1 to i<n? diamond (right side up) -->
  <path d="M 420 209 L 420 143 L 296 143" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="137" font-size="10" fill="#4a7a3a">回到判断</text>

  <!-- i += 1 box for "yes" path (after count+=1, also need i+=1) -->
  <rect x="220" y="271" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>
  <!-- loop back from i+=1 (yes path) to i<n? diamond -->
  <path d="M 300 285 L 420 285 L 420 143" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="40" y="330" width="480" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">一趟遍历 O(n)，每个学生 O(1) 区间包含判定</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888">判定式：startTime[i] ≤ queryTime ≤ endTime[i]</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#888">两个不等式同时成立才计数（闭区间，端点也算做作业）</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888">n ≤ 100，无需优化即可 AC；多次查询见差分数组扩展</text>
</svg>
