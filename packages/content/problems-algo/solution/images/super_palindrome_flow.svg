<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：枚举 012 回文 → 平方 → 验回文</text>

  <rect x="160" y="46" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 root（数字仅取 0, 1, 2）</text>

  <path d="M 280 86 L 280 106" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="110" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">翻转镜像构造回文 y</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888">偶数位: root + root[::-1]  奇数位: root + root[:-1][::-1]</text>

  <path d="M 280 162 L 280 182" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="186" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算 sq = y × y</text>

  <path d="M 280 224 L 280 244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,248 370,280 280,312 190,280" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sq 是回文？</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#888">str(sq) == str(sq)[::-1]</text>

  <path d="M 190 280 L 110 280" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="264" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="70" y="284" text-anchor="middle" font-size="11" fill="#888">跳过</text>

  <path d="M 280 312 L 280 332" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <polygon points="280,336 370,368 280,400 190,368" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">L ≤ sq ≤ R ?</text>

  <path d="M 190 368 L 110 368" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="352" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="70" y="372" text-anchor="middle" font-size="11" fill="#888">跳过</text>

  <path d="M 280 400 L 280 420" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="414" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="200" y="424" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <text x="460" y="140" font-size="10" fill="#888" font-weight="bold">关键剪枝</text>
  <text x="420" y="158" font-size="9" fill="#666">y 的数字仅含 0,1,2</text>
  <text x="420" y="172" font-size="9" fill="#666">因 y≥3 时乘法进位</text>
  <text x="420" y="186" font-size="9" fill="#666">破坏 y² 的回文性</text>

  <rect x="410" y="196" width="140" height="80" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="216" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">搜索空间对比</text>
  <text x="420" y="236" font-size="9" fill="#b85450">全部回文: ~110000</text>
  <text x="420" y="252" font-size="9" fill="#4a7a3a">012回文: ~500</text>
  <text x="420" y="268" font-size="9" fill="#888">缩减 200 倍</text>
</svg>
