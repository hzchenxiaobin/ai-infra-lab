<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：从 dp[mask] 尝试把每个未用数字放到下一位置</text>

  <!-- current state box -->
  <rect x="40" y="60" width="170" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="125" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">当前状态 dp[mask]</text>
  <text x="125" y="104" text-anchor="middle" font-size="11" fill="#555">已用数字集合 = mask</text>
  <text x="125" y="122" text-anchor="middle" font-size="11" fill="#555">下一位置 pos = popcount+1</text>

  <!-- try k=2 (valid) -->
  <rect x="300" y="48" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">放 k=2 ✓（满足整除）</text>
  <text x="390" y="82" text-anchor="middle" font-size="11" fill="#555">dp[mask | 1&lt;&lt;(k−1)] += dp[mask]</text>

  <path d="M 210 90 L 296 70" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- try k=5 (invalid) -->
  <rect x="300" y="108" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">放 k=5 ✗（不整除）</text>
  <text x="390" y="142" text-anchor="middle" font-size="11" fill="#999">跳过，不产生转移</text>

  <path d="M 210 110 L 296 130" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- condition box -->
  <rect x="40" y="160" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">「优美」判定（位置 pos 与 数字 k，1-indexed）</text>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#555">k % pos == 0   或   pos % k == 0   →  二选一即可</text>

  <!-- base & answer -->
  <rect x="40" y="235" width="210" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始：dp[0] = 1</text>
  <text x="145" y="278" text-anchor="middle" font-size="11" fill="#555">空排列算 1 种（什么都没放）</text>

  <rect x="270" y="235" width="210" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="375" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案：dp[(1&lt;&lt;n) − 1]</text>
  <text x="375" y="278" text-anchor="middle" font-size="11" fill="#555">所有 n 位都为 1 = 全部放完</text>

  <!-- complexity footnote -->
  <rect x="40" y="310" width="440" height="38" fill="#fafafa" stroke="#888" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#666">状态 2ⁿ 个 × 每个枚举 n 个数字 → O(n · 2ⁿ)，n ≤ 15 约 5×10⁵ 次</text>
</svg>
