<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：成功(示例3) vs 环路失败(示例2)</text>

  <!-- ===== Left: example 3 (true) ===== -->
  <rect x="24" y="44" width="252" height="150" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">示例3：0→1→3 与 0→2→3 都到终点 ✓</text>

  <!-- edges -->
  <path d="M 92 128 L 150 78" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 92 138 L 150 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 74 L 240 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 178 L 240 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nodes (all done=green) -->
  <circle cx="74" cy="133" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="74" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="168" cy="68" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="168" cy="182" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="256" cy="130" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="256" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="256" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">dest</text>
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">全部节点最终标记黑 → return True</text>

  <!-- ===== Right: example 2 (false) ===== -->
  <rect x="284" y="44" width="252" height="150" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例2：1↔2 成环，绕不到 dest=3 ✗</text>

  <!-- edges 0->1, 0->3, 1->2(red), 2->1(red) -->
  <path d="M 352 128 L 410 78" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 138 L 410 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 78 L 428 162" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 410 178 L 352 142" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <circle cx="334" cy="133" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="334" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="428" cy="68" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="428" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="428" cy="182" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="428" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="516" cy="130" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="516" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="516" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">dest</text>

  <!-- ===== Bottom: recursion trace for example 2 ===== -->
  <rect x="24" y="208" width="512" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">示例2 递归栈轨迹（颜色变化）</text>

  <!-- table header -->
  <text x="60" y="254" font-size="11" fill="#888" font-weight="bold">调用</text>
  <text x="200" y="254" font-size="11" fill="#888" font-weight="bold">栈中灰节点</text>
  <text x="400" y="254" font-size="11" fill="#888" font-weight="bold">动作 / 结果</text>
  <line x1="40" y1="260" x2="520" y2="260" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="60" y="280" font-size="11" fill="#333">dfs(0)</text>
  <text x="200" y="280" font-size="11" fill="#d6a040" font-weight="bold">[0]</text>
  <text x="400" y="280" font-size="11" fill="#333">进入，邻接 [1,3]</text>

  <text x="60" y="302" font-size="11" fill="#333">  dfs(1)</text>
  <text x="200" y="302" font-size="11" fill="#d6a040" font-weight="bold">[0,1]</text>
  <text x="400" y="302" font-size="11" fill="#333">进入，邻接 [2]</text>

  <text x="60" y="324" font-size="11" fill="#333">    dfs(2)</text>
  <text x="200" y="324" font-size="11" fill="#d6a040" font-weight="bold">[0,1,2]</text>
  <text x="400" y="324" font-size="11" fill="#333">进入，邻接 [1]</text>

  <text x="60" y="346" font-size="11" fill="#333">      dfs(1)</text>
  <text x="200" y="346" font-size="11" fill="#b85450" font-weight="bold">1 已是灰!</text>
  <text x="400" y="346" font-size="11" fill="#b85450" font-weight="bold">回边 → return False</text>

  <text x="60" y="368" font-size="11" fill="#333">    ↑回溯</text>
  <text x="200" y="368" font-size="11" fill="#888">[0,1,2]</text>
  <text x="400" y="368" font-size="11" fill="#b85450">dfs(2) 收到 False → False</text>

  <text x="60" y="390" font-size="11" fill="#333">  ↑一路回溯</text>
  <text x="200" y="390" font-size="11" fill="#888">→[0]</text>
  <text x="400" y="390" font-size="11" fill="#b85450" font-weight="bold">最终 return False（存在环）</text>
</svg>
