<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：哈希分组 + 二分找环形邻居</text>

  <!-- 开始 -->
  <rect x="40" y="44" width="90" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <!-- 建 pos 表 -->
  <rect x="165" y="44" width="165" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">建 pos：值 → 有序下标表</text>

  <!-- 循环取查询 -->
  <rect x="365" y="44" width="125" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">循环：取查询 q</text>

  <path d="M 130 59 L 163 59" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 59 L 363 59" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：该值唯一? -->
  <polygon points="427,116 507,150 427,184 347,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="146" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">该值唯一？</text>
  <text x="427" y="162" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">（len = 1）</text>

  <path d="M 427 74 L 427 112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是：answer = -1 -->
  <path d="M 507 150 L 513 150" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="508" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="515" y="133" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="147" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">answer[i]</text>
  <text x="555" y="161" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">← −1</text>

  <!-- 否：二分定位 -->
  <path d="M 427 184 L 427 212" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="203" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="320" y="216" width="215" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二分定位 idx（v[idx] = q）</text>
  <text x="427" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev = v[idx−1]，next = v[idx+1]（取模环绕）</text>

  <path d="M 427 260 L 427 280" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 环距取 min -->
  <rect x="330" y="284" width="195" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">环距取 min → answer[i]</text>

  <!-- answer=-1 分支汇入 -->
  <path d="M 555 167 C 555 235, 545 301, 527 301" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 还有查询? -->
  <path d="M 427 318 L 427 334" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="427,338 489,362 427,386 365,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="367" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">还有查询？</text>

  <!-- 是：回到取查询 q -->
  <path d="M 365 362 C 110 362, 260 12, 427 42" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：返回 answer -->
  <path d="M 489 362 L 503 362" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="352" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="505" y="345" width="90" height="34" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="550" y="367" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 answer</text>
</svg>
