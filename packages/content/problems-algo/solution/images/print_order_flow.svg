<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">条件变量同步流程：stage 计数器驱动</text>

  <text x="90" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">first()</text>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">second()</text>
  <text x="430" y="55" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">third()</text>

  <rect x="35" y="70" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="90" text-anchor="middle" font-size="11" fill="#333">直接执行</text>

  <path d="M 90 100 L 90 115" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="35" y="118" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="138" text-anchor="middle" font-size="11" fill="#333">printFirst()</text>

  <path d="M 90 148 L 90 163" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="35" y="166" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="181" text-anchor="middle" font-size="10" fill="#333">lock + cv.notify</text>
  <text x="90" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">stage = 2</text>

  <path d="M 145 183 L 205 183" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="175" y="176" text-anchor="middle" font-size="10" fill="#b85450">唤醒</text>

  <rect x="205" y="70" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#333">lock + cv.wait</text>
  <text x="260" y="103" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">stage &lt; 2? 阻塞</text>

  <path d="M 260 108 L 260 140" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="285" y="128" font-size="10" fill="#888" font-style="italic">等待唤醒</text>

  <rect x="205" y="143" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#333">printSecond()</text>

  <path d="M 260 173 L 260 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="205" y="191" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="10" fill="#333">lock + cv.notify</text>
  <text x="260" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">stage = 3</text>

  <path d="M 315 208 L 375 208" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="345" y="201" text-anchor="middle" font-size="10" fill="#b85450">唤醒</text>

  <rect x="375" y="70" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="90" text-anchor="middle" font-size="10" fill="#333">lock + cv.wait</text>
  <text x="430" y="103" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">stage &lt; 3? 阻塞</text>

  <path d="M 430 108 L 430 165" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="458" y="140" font-size="10" fill="#888" font-style="italic">等待</text>
  <text x="458" y="153" font-size="10" fill="#888" font-style="italic">唤醒</text>

  <rect x="375" y="168" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#333">printThird()</text>

  <rect x="35" y="255" width="450" height="50" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">stage 计数器状态转移</text>
  <text x="260" y="293" text-anchor="middle" font-size="11" fill="#555">stage=1 (初始) → first 完成 → stage=2 → second 完成 → stage=3 → third 完成</text>

  <rect x="35" y="320" width="450" height="105" fill="#fff8e1" fill-opacity="0.4" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">同步原语：mutex + condition_variable</text>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#555">1. second/third 调用时先加锁，检查 stage 是否达标</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#555">2. 未达标 → cv.wait() 释放锁并阻塞，被唤醒后重新检查</text>
  <text x="260" y="397" text-anchor="middle" font-size="11" fill="#555">3. first/second 完成后 → stage++ 并 cv.notify_one() 唤醒等待者</text>
  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#555">4. wait 用 lambda 谓词防虚假唤醒：cv.wait(lock, [&]{ return stage &gt;= N; })</text>
</svg>
