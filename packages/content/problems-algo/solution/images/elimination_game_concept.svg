<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">消除游戏：交替「从左 / 从右」删奇数位</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每轮删一半，剩余元素始终保持等差数列 (head, step, count)</text>

  <!-- direction labels on left -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="42" y="88" fill="#b85450">L→R</text>
    <text x="42" y="148" fill="#d6a040">R←L</text>
    <text x="42" y="208" fill="#b85450">L→R</text>
    <text x="42" y="268" fill="#4a7a3a">剩 1</text>
  </g>

  <!-- Row A: [1..9], strike odd-indexed (1,3,5,7,9) in red -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="104" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="120" y="92" fill="#b85450" font-weight="bold">1</text>
    <rect x="144" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="160" y="92" fill="#446688">2</text>
    <rect x="184" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="200" y="92" fill="#b85450" font-weight="bold">3</text>
    <rect x="224" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="240" y="92" fill="#446688">4</text>
    <rect x="264" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="280" y="92" fill="#b85450" font-weight="bold">5</text>
    <rect x="304" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="320" y="92" fill="#446688">6</text>
    <rect x="344" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="360" y="92" fill="#b85450" font-weight="bold">7</text>
    <rect x="384" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="400" y="92" fill="#446688">8</text>
    <rect x="424" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="440" y="92" fill="#b85450" font-weight="bold">9</text>
    <path d="M 108 76 L 132 96" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 188 76 L 212 96" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 268 76 L 292 96" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 348 76 L 372 96" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 428 76 L 452 96" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <path d="M 280 104 L 280 124" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>

  <!-- Row B: [2,4,6,8], strike from-right odd positions (8,4) in orange -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="144" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="160" y="152" fill="#d6a040" font-weight="bold">2</text>
    <rect x="224" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="240" y="152" fill="#d6a040" font-weight="bold">4</text>
    <rect x="304" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="320" y="152" fill="#d6a040" font-weight="bold">6</text>
    <rect x="384" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="400" y="152" fill="#d6a040" font-weight="bold">8</text>
    <path d="M 388 136 L 412 156" stroke="#d6a040" stroke-width="2" fill="none"/>
    <path d="M 228 136 L 252 156" stroke="#d6a040" stroke-width="2" fill="none"/>
  </g>
  <path d="M 280 164 L 280 184" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>

  <!-- Row C: [2,6], strike 2 (odd position from left) red -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="184" y="192" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="200" y="212" fill="#b85450" font-weight="bold">2</text>
    <rect x="264" y="192" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="280" y="212" fill="#446688">6</text>
    <path d="M 188 196 L 212 216" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <path d="M 280 224 L 280 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>

  <!-- Row D: [6] highlighted -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="264" y="252" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/><text x="280" y="272" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="318" y="270" font-size="11" fill="#4a7a3a">← 答案</text>
  </g>

  <!-- invariant box -->
  <rect x="40" y="302" width="480" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">不变式：剩余序列 = 等差数列 (head, step, count)</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#555">每轮删奇数位 → count ÷ 2，相邻间隔翻倍 → step × 2，方向翻转</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">head 是否前移 = (从左删) ∨ (从右删 ∧ count 为奇)</text>
</svg>
