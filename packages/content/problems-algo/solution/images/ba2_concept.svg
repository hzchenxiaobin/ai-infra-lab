<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">构造核心：前段递增造差 1，尾段交错造差 k→1（以 n=7, k=4 为例）</text>

  <!-- diff pills above gaps -->
  <g filter="url(#rough2)">
    <!-- gap centers: 141,197,255,313,369,425 -->
    <rect x="128" y="46" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="141" y="59" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="184" y="46" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="197" y="59" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="242" y="44" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="255" y="59" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <rect x="300" y="46" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="313" y="59" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">3</text>
    <rect x="356" y="46" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="369" y="59" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">2</text>
    <rect x="412" y="46" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="425" y="59" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- main array row: cells at x=90,146,202,258,314,370,426 -->
  <g filter="url(#rough2)">
    <rect x="90" y="78" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="113" y="106" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
    <rect x="146" y="78" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="169" y="106" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="202" y="78" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="225" y="106" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">3</text>
    <rect x="258" y="78" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="281" y="106" text-anchor="middle" font-size="15" fill="#a07820" font-weight="bold">7</text>
    <rect x="314" y="78" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="337" y="106" text-anchor="middle" font-size="15" fill="#a07820" font-weight="bold">4</text>
    <rect x="370" y="78" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="393" y="106" text-anchor="middle" font-size="15" fill="#a07820" font-weight="bold">6</text>
    <rect x="426" y="78" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="449" y="106" text-anchor="middle" font-size="15" fill="#a07820" font-weight="bold">5</text>
  </g>

  <!-- region brackets below -->
  <path d="M 90 140 L 90 150 L 248 150 L 248 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="169" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前段 [1..n−k]：递增 → 差值恒为 1</text>

  <path d="M 258 140 L 258 150 L 472 150 L 472 140" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="365" y="168" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">尾段交错 [hi, lo, hi, lo…]：差值 k, k−1, …, 1</text>

  <!-- divider -->
  <path d="M 40 188 L 520 188" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- two side notes -->
  <rect x="40" y="206" width="230" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="230" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">前段：1, 2, …, n−k</text>
  <text x="155" y="250" text-anchor="middle" font-size="10.5" fill="#555">相邻差恒为 1（已贡献 1）</text>
  <text x="155" y="268" text-anchor="middle" font-size="10.5" fill="#555">长度 n−k，为尾段留出 k 个数</text>
  <text x="155" y="283" text-anchor="middle" font-size="10" fill="#888">尾段首数 n 与 n−k 相差 k</text>

  <rect x="290" y="206" width="230" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="230" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">尾段：hi, lo, hi, lo… 交替</text>
  <text x="405" y="250" text-anchor="middle" font-size="10.5" fill="#555">每取一对，间距缩 1</text>
  <text x="405" y="268" text-anchor="middle" font-size="10.5" fill="#555">差值序列：k, k−1, k−2, …, 1</text>
  <text x="405" y="283" text-anchor="middle" font-size="10" fill="#888">共贡献 k 个不同差值</text>

  <!-- result box -->
  <rect x="40" y="306" width="480" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">差值集合 = {1, 2, 3, 4} = {1, 2, …, k}</text>
  <text x="280" y="354" text-anchor="middle" font-size="11.5" fill="#555">前段贡献 {1}，尾段贡献 {k, k−1, …, 1}，并集恰为 {1, …, k}</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#555">不同整数个数 = k ✓ 满足题意</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#888">关键：n−k 与 n 相差 k；之后 lo、hi 各向中间走 1，差值每次递减 1</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">故交错段天然生成 k, k−1, …, 1 的递减差值链</text>
</svg>
