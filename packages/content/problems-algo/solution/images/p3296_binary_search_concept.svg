<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">二分的不是山高，是总时限 T</text>
  <text x="260" y="38" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">T 越大 → 每人能挖的米数不减 → 可行性单调！</text>

  <!-- 左上：单个工人的边际耗时柱状图 -->
  <text x="140" y="70" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">工人 w：第 k 米的边际耗时 = w·k（越挖越贵）</text>
  <rect x="40" y="128" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="58" y="143" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">w·1</text>
  <rect x="82" y="106" width="36" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="131" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">w·2</text>
  <rect x="124" y="84" width="36" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="119" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">w·3</text>
  <path d="M 34 150 L 168 150" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">第1米</text>
  <text x="100" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">第2米</text>
  <text x="142" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">第3米</text>

  <path d="M 140 168 L 140 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 左下：求和公式 -->
  <rect x="30" y="184" width="222" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="141" y="198" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">挖 x 米总耗时 = w·(1+2+…+x)</text>
  <text x="141" y="211" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">= w·x(x+1)/2 ←等差求和</text>

  <!-- 右侧：容量公式三连 -->
  <rect x="268" y="56" width="228" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="74" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">时限 T：单个工人最多挖几米？</text>
  <path d="M 382 84 L 382 92" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="268" y="94" width="228" height="28" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="382" y="112" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w·x(x+1)/2 ≤ T ⟺ x(x+1) ≤ q := ⌊2T/w⌋</text>
  <path d="M 382 122 L 382 130" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="268" y="132" width="228" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="146" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">x_max(T) = ⌊(√(4q+1) − 1) / 2⌋</text>
  <text x="382" y="158" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">（整数开方 isqrt，零浮点误差）</text>

  <path d="M 382 162 L 382 176" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 中部：可行性判定 -->
  <rect x="110" y="180" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">可行(T) ⟺ Σ x_max(T) ≥ 山高 H</text>
  <text x="260" y="208" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">—— n 个工人的容量求和，O(n) 判一次</text>

  <!-- 底部：数轴 -->
  <path d="M 70 288 L 450 288" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 110 284 L 110 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 150 284 L 150 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 190 284 L 190 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 290 284 L 290 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 330 284 L 330 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 370 284 L 370 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 410 284 L 410 292" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="150" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="190" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="290" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="370" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="410" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <path d="M 240 252 L 240 302" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="240" y="246" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">答案 = 最小的可行 T</text>

  <text x="140" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">T 太小：Σ x_max &lt; H</text>
  <text x="350" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">T 足够：Σ x_max ≥ H</text>

  <rect x="60" y="326" width="400" height="26" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">单调性：T↑ ⇒ q=⌊2T/w⌋ 不减 ⇒ x_max 不减 ⇒ Σ 不减 ⇒ 可行域是后缀</text>
</svg>
