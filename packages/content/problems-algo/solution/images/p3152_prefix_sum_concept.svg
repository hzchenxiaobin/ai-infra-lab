<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：违规对做成前缀和，区间查询变两数相减</text>

  <text x="32" y="86" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">nums =</text>

  <rect x="120" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="150" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <rect x="196" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="226" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇</text>

  <rect x="272" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="302" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="302" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇</text>

  <rect x="348" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="378" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <circle cx="188" cy="80" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <circle cx="264" cy="80" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <circle cx="340" cy="80" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="188" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d₁ = 0</text>
  <text x="264" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3 与 1 同奇 → d₂ = 1</text>
  <text x="340" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d₃ = 0</text>

  <text x="32" y="202" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">pre =</text>

  <rect x="120" y="176" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="196" y="176" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="201" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="272" y="176" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="201" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="348" y="176" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="201" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="264" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>

  <text x="150" y="232" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <text x="226" y="232" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 1</text>
  <text x="302" y="232" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 2</text>
  <text x="378" y="232" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i = 3</text>

  <rect x="36" y="256" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="146" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">查询 [2, 3]</text>
  <text x="146" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">pre[3] − pre[2] = 0 → true ✓</text>

  <rect x="276" y="256" width="212" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">查询 [0, 2]</text>
  <text x="382" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">pre[2] − pre[0] = 1 → false ✗</text>

  <rect x="32" y="338" width="456" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">子数组 [l, r] 特殊 ⟺ 区间 (l, r] 内违规对数为 0</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">⟺ pre[r] − pre[l] = 0（l = r 时差为 0，单元素天然特殊）</text>

  <rect x="32" y="396" width="456" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理 O(n) 一趟 + 每查询 O(1)：总复杂度 O(n + q)</text>
  <text x="260" y="434" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">对比逐查询暴力 O(n·q)：10⁵ × 10⁵ = 10¹⁰ 必然超时</text>
</svg>
