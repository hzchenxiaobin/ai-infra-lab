<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">贪心陷阱：从小到大开锁不一定最优</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">反例 strength = [1,1,4,6]，k = 1 —— 升序花 6 分钟，把 4 和 6 换位只花 5 分钟</text>

  <!-- ===== 方案一：升序 ===== -->
  <text x="20" y="76" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案一 · 升序</text>

  <rect x="96" y="84" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="124" y="106" text-anchor="middle" font-size="13.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="124" y="124" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x=1 · 1 分</text>

  <rect x="176" y="84" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="204" y="106" text-anchor="middle" font-size="13.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="204" y="124" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x=2 · 1 分</text>

  <rect x="256" y="84" width="56" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="284" y="106" text-anchor="middle" font-size="13.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="284" y="124" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">x=3 · 2 分</text>

  <rect x="336" y="84" width="56" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="364" y="106" text-anchor="middle" font-size="13.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="364" y="124" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">x=4 · 2 分</text>

  <rect x="412" y="84" width="92" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="458" y="106" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">共 6 分钟</text>
  <text x="458" y="124" text-anchor="middle" font-size="8.5" fill="#8a3833" filter="url(#rough2)">非最优</text>

  <!-- ===== 换位弧线 ===== -->
  <path d="M 284 138 C 302 156, 346 158, 360 176" fill="none" stroke="#d6a040" stroke-width="1.8"
        stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 364 138 C 346 156, 302 158, 288 176" fill="none" stroke="#d6a040" stroke-width="1.8"
        stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="324" y="154" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">互换</text>

  <!-- ===== 方案二：换位 ===== -->
  <text x="20" y="178" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案二 · 换位</text>

  <rect x="96" y="176" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="124" y="198" text-anchor="middle" font-size="13.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="124" y="216" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x=1 · 1 分</text>

  <rect x="176" y="176" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="204" y="198" text-anchor="middle" font-size="13.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="204" y="216" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x=2 · 1 分</text>

  <rect x="256" y="176" width="56" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="284" y="198" text-anchor="middle" font-size="13.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="284" y="216" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">x=3 · 2 分</text>

  <rect x="336" y="176" width="56" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="364" y="198" text-anchor="middle" font-size="13.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="364" y="216" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">x=4 · 1 分</text>

  <rect x="412" y="176" width="92" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="458" y="198" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">共 5 分钟</text>
  <text x="458" y="216" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">最优</text>

  <!-- ===== 解释 ===== -->
  <rect x="15" y="246" width="490" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⌈6/3⌉ = ⌈6/4⌉ = 2：锁 6 放第 3、4 位都要 2 分钟，换到前面不亏</text>
  <text x="260" y="284" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⌈4/3⌉ = 2 但 ⌈4/4⌉ = 1：锁 4 恰好被 x = 4 一步充满，放到最后赚 1 分钟</text>
  <text x="260" y="304" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">上取整的分段边界让「大数在前」偶尔更划算 —— 排序贪心不可靠，老实枚举集合</text>
</svg>
