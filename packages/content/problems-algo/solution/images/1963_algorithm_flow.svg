<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描 + 跌负即交换，O(n) / O(1)</text>

  <!-- Start -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">开始：balance = 0, swaps = 0</text>

  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- For each char c -->
  <rect x="170" y="104" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">对 s 中每个字符 c</text>

  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Update balance -->
  <rect x="150" y="164" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c == '[' ? balance++ : balance--</text>

  <path d="M 280 200 L 280 222" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: balance < 0 ? -->
  <polygon points="280,226 380,266 280,306 180,266" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">balance &lt; 0 ?</text>
  <text x="280" y="278" text-anchor="middle" font-size="9.5" fill="#888">(出现超前 ])</text>

  <!-- Yes -> swaps++, balance += 2 -->
  <path d="M 380 266 L 432 266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="258" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="436" y="250" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="492" y="271" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">swaps++; bal+=2</text>

  <!-- path from swaps box back down to merge -->
  <path d="M 492 282 L 492 322 L 280 322" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- No -> down to merge -->
  <path d="M 280 306 L 280 322" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- loop back to "for each char" -->
  <path d="M 280 322 L 120 322 L 120 121 L 168 121" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="84" y="226" font-size="10" fill="#888" transform="rotate(-90 84 226)">下一字符</text>

  <!-- loop end exit: from for-box right side to return swaps -->
  <path d="M 390 121 L 470 121 L 470 430" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="200" font-size="10" fill="#4a7a3a" transform="rotate(-90 478 200)">字符用尽</text>

  <!-- return swaps -->
  <rect x="190" y="430" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 swaps</text>

  <path d="M 470 430 L 370 447" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="60" y="478" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="498" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">触发次数 = ⌈k/2⌉（k 为栈消配对后剩余 ] 数），即为最小交换次数</text>
</svg>
