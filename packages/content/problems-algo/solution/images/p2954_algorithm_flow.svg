<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">切段 → 预处理逆元表 → 一趟累乘 → 补 2^k</text>

  <!-- step 1 -->
  <rect x="90" y="40" width="360" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">切段：首段长 sick[0]，末段长 n−1−sick.back()</text>
  <text x="270" y="86" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">内部段长 sick[i]−sick[i−1]−1；S = n − |sick|</text>

  <path d="M 270 104 L 270 124" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="90" y="124" width="360" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">预处理 fact[0..S]</text>
  <text x="270" y="166" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">inv_fact[S] = fact[S]^(p−2)（费马小定理），倒推全表</text>

  <path d="M 270 176 L 270 196" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="175" y="196" width="190" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="219" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans ← fact[S]，k ← 0</text>

  <path d="M 270 232 L 270 252" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="20" y="252" width="500" height="162" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">对每一段 L 循环（L = 0 直接跳过）</text>

  <polygon points="270,284 350,324 270,364 190,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">边界段？</text>
  <text x="270" y="337" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">（首段 / 末段）</text>

  <path d="M 190 324 L 162 324" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="176" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="30" y="304" width="128" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="94" y="328" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ans ×= inv_fact[L]</text>

  <path d="M 350 324 L 400 324" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="374" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="404" y="298" width="112" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="317" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ans ×= inv_fact[L]</text>
  <text x="460" y="336" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">k += L − 1</text>

  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所有段遍历完 → 出循环</text>

  <path d="M 270 414 L 270 432" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="175" y="432" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">ans ×= 2^k（快速幂）</text>

  <path d="M 270 472 L 270 490" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="185" y="490" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="513" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（mod 10^9 + 7）</text>
</svg>
