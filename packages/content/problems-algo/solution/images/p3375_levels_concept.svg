<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">层级视角：只能削最高层，贴层逐级下压</text>

  <!-- 值轴 -->
  <path d="M 95 44 L 95 316" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="86" y="42" font-size="11" fill="#666" filter="url(#rough2)">值</text>

  <!-- 四个值层（示例3） -->
  <rect x="105" y="62" width="220" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="73" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d₁ = 9</text>

  <rect x="105" y="118" width="220" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d₂ = 7</text>

  <rect x="105" y="174" width="220" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="185" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d₃ = 5</text>

  <rect x="105" y="230" width="220" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="241" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">d₄ = 3</text>

  <!-- k 水位线 -->
  <path d="M 100 286 L 335 286" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="105" y="306" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 1（终点水位）</text>

  <!-- 下压箭头列 -->
  <path d="M 350 78 L 350 116" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="100" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">① h=7</text>

  <path d="M 350 134 L 350 172" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="156" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">② h=5</text>

  <path d="M 350 190 L 350 228" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="212" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ h=3</text>

  <path d="M 350 246 L 350 282" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="268" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ h=k</text>

  <!-- 合法性说明框 -->
  <rect x="372" y="48" width="140" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="72" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">合法 h：</text>
  <text x="442" y="92" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">d₂ ≤ h &lt; d₁</text>
  <text x="442" y="112" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">（一次只能削顶层）</text>

  <rect x="372" y="152" width="140" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">削进空档</text>
  <text x="442" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">h ∈ (d₂, d₁) 开区间：</text>
  <text x="442" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">凭空造出新层，</text>
  <text x="442" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">层数不减，白费一次</text>

  <!-- 底部结论 -->
  <text x="260" y="348" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">答案 = 严格大于 k 的不同值个数：本例 {9,7,5,3} → 4 次操作</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（若数组中有值小于 k：操作只降不升，直接返回 -1）</text>
</svg>
