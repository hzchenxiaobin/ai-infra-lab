<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">K 次串联：算法流程</text>

  <!-- Step 1: init -->
  <rect x="140" y="46" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 预处理</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">total = sum(arr)，kadane₂ = kadane(arr∥arr)</text>

  <!-- Arrow down -->
  <path d="M 280 96 L 280 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Diamond 1: k == 1 ? -->
  <path d="M 280 120 L 380 170 L 280 220 L 180 170 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">k == 1 ?</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">能否只看单份</text>

  <!-- Yes branch: right -->
  <path d="M 380 170 L 430 170" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="396" y="162" font-size="11" fill="#82b366" filter="url(#rough2)">是</text>
  <rect x="426" y="148" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="486" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">kadane(arr) % MOD</text>

  <!-- No branch: down -->
  <path d="M 280 220 L 280 244" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="292" y="238" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Diamond 2: total > 0 ? -->
  <path d="M 280 248 L 380 300 L 280 352 L 180 300 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">total &gt; 0 ?</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">整份是否有收益</text>

  <!-- Yes (total>0): left -->
  <path d="M 180 300 L 150 300" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="120" y="292" font-size="11" fill="#82b366" filter="url(#rough2)">是</text>
  <rect x="20" y="278" width="132" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">② ans =</text>
  <text x="86" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">kadane₂+(k−2)·total</text>

  <!-- No (total<=0): right -->
  <path d="M 380 300 L 410 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="386" y="292" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="408" y="278" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="474" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">③ ans =</text>
  <text x="474" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">kadane₂</text>

  <!-- Merge arrows down to return -->
  <path d="M 86 322 L 86 372 L 240 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 474 322 L 474 372 L 320 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="200" y="356" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">return ans % MOD</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（Kadane 初值 0 → 全负返回 0）</text>

  <!-- Footer -->
  <rect x="20" y="410" width="520" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="427" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">遍历至多两份，O(n) 时间 / O(1) 空间，与 k 无关</text>
</svg>
