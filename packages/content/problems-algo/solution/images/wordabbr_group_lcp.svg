<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分组 + 最长公共前缀（LCP）定前缀长度</text>

  <!-- Step 1: group by (first, last, length) -->
  <text x="30" y="62" font-size="12" fill="#446688" font-weight="bold">① 按 (首字母, 尾字母, 长度) 分组</text>

  <rect x="30" y="74" width="150" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">组 (i, l, 8)</text>
  <text x="42" y="116" font-size="11" fill="#555">internal</text>
  <text x="42" y="134" font-size="11" fill="#555">interval</text>
  <text x="42" y="150" font-size="10" fill="#888">→ 必会冲突</text>

  <rect x="200" y="74" width="150" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">组 (i, n, 9)</text>
  <text x="212" y="116" font-size="11" fill="#555">intension</text>
  <text x="212" y="134" font-size="11" fill="#555">intrusion</text>
  <text x="212" y="150" font-size="10" fill="#888">→ 必会冲突</text>

  <rect x="370" y="74" width="160" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">各自独组</text>
  <text x="382" y="116" font-size="11" fill="#555">like (l,e,4)</text>
  <text x="382" y="134" font-size="11" fill="#555">god/face/me…</text>
  <text x="382" y="150" font-size="10" fill="#888">→ k=1 即可</text>

  <text x="30" y="178" font-size="10" fill="#888">不同组的缩写首/尾字母或数字段不同，绝不撞车（词全为小写字母，无数字干扰边界）</text>

  <!-- Step 2: within group, LCP -->
  <text x="30" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">② 组内求最长公共前缀 LCP，前缀长度 k = LCP + 1</text>

  <!-- intension / intrusion LCP -->
  <rect x="30" y="220" width="245" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">intension  vs  intrusion</text>

  <text x="42" y="266" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">i</text>
  <text x="60" y="266" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">n</text>
  <text x="78" y="266" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">t</text>
  <text x="96" y="266" font-size="13" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">e</text>
  <text x="120" y="266" font-size="13" fill="#bbb" font-family="'Comic Sans MS', monospace">n s i o n</text>

  <text x="42" y="286" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">i</text>
  <text x="60" y="286" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">n</text>
  <text x="78" y="286" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">t</text>
  <text x="96" y="286" font-size="13" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">r</text>
  <text x="120" y="286" font-size="13" fill="#bbb" font-family="'Comic Sans MS', monospace">u s i o n</text>

  <path d="M 42 296 L 78 296" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="152" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a">↑ 公共前缀 = “int”，长 3</text>
  <text x="152" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 3 + 1 = 4</text>

  <!-- internal / interval LCP -->
  <rect x="295" y="220" width="245" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="417" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">internal  vs  interval</text>

  <text x="307" y="266" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">i n t e r</text>
  <text x="375" y="266" font-size="13" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">n</text>
  <text x="393" y="266" font-size="13" fill="#bbb" font-family="'Comic Sans MS', monospace">a l</text>

  <text x="307" y="286" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">i n t e r</text>
  <text x="375" y="286" font-size="13" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">v</text>
  <text x="393" y="286" font-size="13" fill="#bbb" font-family="'Comic Sans MS', monospace">a l</text>

  <path d="M 307 296 L 365 296" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="417" y="300" text-anchor="middle" font-size="11" fill="#446688">↑ 公共前缀 = “inter”，长 5</text>
  <text x="417" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 5 + 1 = 6</text>

  <!-- Step 3: length check -->
  <rect x="30" y="352" width="510" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 缩写 = w[:k] + (len-k-1) + w[-1]；若 len(缩写) ≥ len(w) 则保留原词</text>
</svg>
