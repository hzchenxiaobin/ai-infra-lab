<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描统计 diff，返回 min(diff, n−diff)</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="140" y="96" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">diff = 0</text>
  <text x="260" y="133" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">与 pattern A「0101…」的差异位数</text>

  <path d="M 260 142 L 260 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop -->
  <rect x="100" y="166" width="320" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历 i = 0 .. n−1</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">expected = '0' 当 i 偶, '1' 当 i 奇</text>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 s[i] ≠ expected：diff++</text>

  <path d="M 260 232 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute -->
  <rect x="120" y="256" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diffB = n − diff</text>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">answer = min(diff, diffB)</text>

  <path d="M 260 308 L 260 328" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="260" cy="350" rx="78" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 min(diff, n−diff)</text>
</svg>
