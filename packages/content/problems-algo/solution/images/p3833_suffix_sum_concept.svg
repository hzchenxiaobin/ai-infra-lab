<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：从右往左攒「右侧和 s」，任意下标 O(1) 判主导</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 每左移一格，右侧区间恰好多出一个元素：s += nums[i+1] 即得新和</text>

  <!-- nums row -->
  <text x="140" y="72" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="150" y="52" width="52" height="32" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="228" y="52" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="306" y="52" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="176" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="254" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="332" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>

  <!-- suffix row -->
  <text x="140" y="130" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">suf</text>
  <rect x="150" y="110" width="52" height="32" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="228" y="110" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="130" text-anchor="middle" font-size="12" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="306" y="110" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="130" text-anchor="middle" font-size="12" fill="#2a5a1e" filter="url(#rough2)">3</text>
  <text x="386" y="122" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">suf[i] = nums[i] + suf[i+1]</text>
  <text x="386" y="136" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">判定 i 只需 suf[i+1]</text>

  <!-- legend -->
  <rect x="150" y="148" width="14" height="10" rx="2" fill="#fff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="157" font-size="8.5" fill="#666" filter="url(#rough2)">当前判定下标 i</text>
  <rect x="262" y="148" width="14" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="157" font-size="8.5" fill="#666" filter="url(#rough2)">已并入 s 的右侧元素</text>

  <!-- walkthrough table -->
  <rect x="50" y="166" width="420" height="103" rx="6" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="50" y1="188" x2="470" y2="188" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="86" y1="166" x2="86" y2="269" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="178" y1="166" x2="178" y2="269" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="232" y1="166" x2="232" y2="269" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="278" y1="166" x2="278" y2="269" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="166" x2="420" y2="269" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="50" y1="215" x2="470" y2="215" stroke="#e5e5e5" stroke-width="1" filter="url(#rough2)"/>
  <line x1="50" y1="242" x2="470" y2="242" stroke="#e5e5e5" stroke-width="1" filter="url(#rough2)"/>

  <text x="68" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="132" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">右侧区间</text>
  <text x="205" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="255" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="349" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums[i] × cnt &gt; s ?</text>
  <text x="445" y="181" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">主导?</text>

  <text x="68" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="132" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4, 3]</text>
  <text x="205" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="255" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="349" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5×2 = 10 &gt; 7</text>
  <text x="445" y="205" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="68" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="205" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="255" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="349" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4×1 = 4 &gt; 3</text>
  <text x="445" y="232" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="68" y="259" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="132" y="259" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="205" y="259" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="255" y="259" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="349" y="259" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">右侧无元素，跳过</text>
  <text x="445" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- bottom notes -->
  <rect x="48" y="278" width="424" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">判定式 nums[i] &gt; s / cnt 交叉相乘为 nums[i] × cnt &gt; s——整数运算，零浮点误差</text>
  <text x="260" y="312" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">不建后缀和数组：从右往左扫，s += nums[i+1] 一步更新「右侧和」</text>
  <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">循环从 i = n−2 起步——最右元素右侧为空，天然不算主导</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1 [5,4,3]：ans = 2 ✓</text>
</svg>
