<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：两个方向各扫一遍，取 min</text>

  <!-- 起点 -->
  <rect x="190" y="44" width="140" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">输入 m×n 矩阵 grid</text>

  <!-- 分叉箭头 -->
  <path d="M260,78 C260,94 135,84 135,98" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,78 C260,94 385,84 385,98" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左车道：行方向 -->
  <rect x="55" y="102" width="160" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">行方向：逐行扫描</text>
  <text x="135" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">目标：所有行回文</text>
  <line x1="135" y1="144" x2="135" y2="157" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="160" width="160" height="56" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每行双指针 l ↔ r</text>
  <text x="135" y="201" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">l=0，r=n−1，l&lt;r 时向中间靠拢</text>
  <line x1="135" y1="216" x2="135" y2="229" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="232" width="160" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">grid[i][l] ≠ grid[i][r]</text>
  <text x="135" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ rowDiff++（翻 1 个）</text>
  <text x="135" y="285" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">相等则不计（0 次）</text>
  <line x1="135" y1="292" x2="135" y2="305" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="308" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">rowDiff</text>

  <!-- 右车道：列方向 -->
  <rect x="305" y="102" width="160" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">列方向：逐列扫描</text>
  <text x="385" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">目标：所有列回文</text>
  <line x1="385" y1="144" x2="385" y2="157" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="305" y="160" width="160" height="56" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每列双指针 上 ↔ 下</text>
  <text x="385" y="201" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">l=0，r=m−1，l&lt;r 时向中间靠拢</text>
  <line x1="385" y1="216" x2="385" y2="229" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="305" y="232" width="160" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">grid[l][j] ≠ grid[r][j]</text>
  <text x="385" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ colDiff++（翻 1 个）</text>
  <text x="385" y="285" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">相等则不计（0 次）</text>
  <line x1="385" y1="292" x2="385" y2="305" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="325" y="308" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">colDiff</text>

  <!-- 汇合箭头 -->
  <path d="M135,338 C135,356 210,350 234,364" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M385,338 C385,356 310,350 286,364" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="160" y="368" width="200" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">ans = min(rowDiff, colDiff)</text>
  <text x="260" y="405" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两个目标独立，取较小者</text>
</svg>
