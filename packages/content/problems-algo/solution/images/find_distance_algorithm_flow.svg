<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：找 LCA → 量两段距离 → 求和</text>

  <!-- Step 1: LCA -->
  <rect x="60" y="50" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="74" font-size="12" fill="#446688" font-weight="bold">步骤 1：找最近公共祖先 LCA(p, q)</text>
  <text x="80" y="94" font-size="11" fill="#555">后序 DFS：node.val==p 或 q 则返回 node</text>
  <text x="80" y="110" font-size="11" fill="#555">left、right 都非空 → 当前 node 即 LCA（承接 236）</text>

  <path d="M 280 120 L 280 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: distance to p -->
  <rect x="60" y="142" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 2：从 LCA 出发量到 p 的距离 dp</text>
  <text x="80" y="186" font-size="11" fill="#555">DFS：node.val==p 返回 0；子树命中则返回 子距离+1</text>
  <text x="80" y="202" font-size="11" fill="#555">dp = distance(LCA, p)</text>

  <path d="M 280 212 L 280 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: distance to q -->
  <rect x="60" y="234" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：从 LCA 出发量到 q 的距离 dq</text>
  <text x="80" y="278" font-size="11" fill="#555">同样 DFS：dq = distance(LCA, q)</text>
  <text x="80" y="294" font-size="11" fill="#555">两段距离互相独立，复用同一个 distance 函数</text>

  <path d="M 280 304 L 280 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,326 390,376 280,426 170,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333">返回 dp + dq</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888">两段相加 = 总边数</text>

  <!-- Side note -->
  <rect x="410" y="340" width="135" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="477" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">为何拆两段？</text>
  <text x="420" y="378" font-size="9" fill="#555">p→q 的路径在 LCA</text>
  <text x="420" y="392" font-size="9" fill="#555">处"折返"——先向上</text>
  <text x="420" y="406" font-size="9" fill="#555">到 LCA，再向下到 q。</text>
  <text x="420" y="418" font-size="9" fill="#555">拆分避免重复遍历。</text>
</svg>
