<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理左半范围 → 逐查询 O(1) 构造</text>

  <!-- Step 1: preprocess -->
  <rect x="60" y="50" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 预处理：L = (intLength+1)//2</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#555">start = 10^(L−1) ， total = 9 × 10^(L−1)</text>

  <!-- arrow down -->
  <path d="M 280 112 L 280 132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="60" y="136" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历每个 query q ∈ queries</text>

  <!-- arrow down to decision -->
  <path d="M 280 180 L 280 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: q > total? -->
  <polygon points="280,204 380,250 280,296 180,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">q &gt; total ?</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888">超出回文总数？</text>

  <!-- Yes branch (right) -> -1 -->
  <path d="M 380 250 L 430 250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="388" y="244" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="234" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="475" y="255" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">answer = −1</text>

  <!-- No branch (left) -> construct -->
  <path d="M 180 250 L 130 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- construct box (left side) -->
  <rect x="40" y="300" width="300" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 构造回文</text>
  <text x="190" y="346" text-anchor="middle" font-size="11" fill="#555">first = start + (q − 1)</text>
  <text x="190" y="366" text-anchor="middle" font-size="11" fill="#555">s = str(first)</text>
  <text x="190" y="386" text-anchor="middle" font-size="11" fill="#555">pal = s + s[:n−L][::-1]</text>
  <text x="190" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">answer = int(pal)</text>

  <!-- arrow from No to construct (down then) -->
  <path d="M 130 250 L 130 290 L 190 290 L 190 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- -1 box also feeds answer collection -->
  <path d="M 475 266 L 475 360 L 340 360" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- final answer array -->
  <rect x="60" y="430" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 answer 数组</text>
</svg>
