<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    递归下降解析器流程
  </text>

  <!-- Start -->
  <ellipse cx="100" cy="58" rx="52" ry="20" fill="#e6f4ea"
           stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    parseValue()
  </text>

  <path d="M100,80 L100,98" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- skipSpaces -->
  <rect x="48" y="102" width="104" height="34" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    skipSpaces()
  </text>

  <path d="M100,138 L100,152" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: peek char -->
  <polygon points="100,156 176,196 100,236 24,196" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    char = str[pos]
  </text>
  <text x="100" y="208" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    是哪种？
  </text>

  <!-- 6 paths out -->

  <!-- { path -->
  <path d="M24,196 L10,196 L10,262" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="10" y="266" width="80" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    pos++  (吃掉 {)
  </text>
  <text x="50" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    parseObject()
  </text>
  <text x="18" y="218" font-size="9" fill="#b85450" filter="url(#rough2)">{"</text>

  <!-- [ path -->
  <path d="M24,196 L10,196 L10,262" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" opacity="0"/>

  <path d="M40,214 L40,262" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="96" y="266" width="80" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    pos++  (吃掉 [)
  </text>
  <text x="136" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    parseArray()
  </text>

  <!-- " path -->
  <rect x="182" y="266" width="80" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    pos++  (吃掉 ")
  </text>
  <text x="222" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    parseString()
  </text>
  <path d="M100,220 Q170,230 188,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- digit path -->
  <rect x="268" y="266" width="84" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    记录起始 pos
  </text>
  <text x="310" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    parseNumber()
  </text>
  <path d="M120,220 Q250,230 274,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t/f path -->
  <rect x="356" y="266" width="76" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    匹配 true/false
  </text>
  <text x="394" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    pos += 4/5
  </text>
  <path d="M140,220 Q360,230 362,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n path -->
  <rect x="438" y="266" width="76" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="283" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    匹配 null
  </text>
  <text x="476" y="297" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    pos += 4
  </text>
  <path d="M160,220 Q440,230 444,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Arrow from {[ to parseObject/parseArray: actually draw separate arrows -->
  <path d="M24,196 Q6,196 6,262" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M50,214 Q50,240 50,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M70,216 Q100,240 116,264" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- parseObject detail -->
  <rect x="10" y="324" width="240" height="80" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    parseObject 内部循环
  </text>
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    while char ≠ '}':
  </text>
  <text x="130" y="372" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    ① parseString() → key
  </text>
  <text x="130" y="386" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    ② 吃 ':'  ③ parseValue() → val
  </text>
  <text x="130" y="400" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    obj[key]=val  ④ 吃 ',' 或结束
  </text>

  <!-- parseArray detail -->
  <rect x="260" y="324" width="240" height="80" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    parseArray 内部循环
  </text>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    while char ≠ ']':
  </text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    ① parseValue() → val
  </text>
  <text x="380" y="386" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    ② arr.push(val)
  </text>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    ③ 吃 ',' 或结束
  </text>

  <!-- Arrows from boxes to detail -->
  <path d="M50,312 L50,322" stroke="#b85450" stroke-width="1.5"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M136,312 L130,322" stroke="#b85450" stroke-width="1.5"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Recursion call arrow -->
  <path d="M130,372 Q80,430 50,430 Q10,430 10,80 Q10,58 48,58"
        stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="20" y="450" font-size="9" fill="#b85450" filter="url(#rough2)">
    递归调用 parseValue()
  </text>

  <path d="M380,372 Q440,430 470,430 Q510,430 510,80 Q510,58 152,58"
        stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="500" y="450" font-size="9" fill="#b85450" filter="url(#rough2)">
    递归调用 parseValue()
  </text>

  <!-- Return box -->
  <rect x="200" y="456" width="180" height="40" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="481" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    返回解析结果
  </text>

  <path d="M130,408 L200,466" stroke="#446688" stroke-width="1.5"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M380,408 L310,460" stroke="#446688" stroke-width="1.5"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Terminal returns -->
  <path d="M222,312 Q222,440 285,460" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M310,312 Q310,440 290,460" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M394,312 Q394,440 300,460" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M476,312 Q476,440 310,460" stroke="#446688" stroke-width="1"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
