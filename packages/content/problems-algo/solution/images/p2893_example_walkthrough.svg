<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：12 行分钟 → 2 个桶</text>

  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 1（minute 1~6）</text>

  <rect x="40" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="248" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="62" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=1</text>
  <text x="114" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=2</text>
  <text x="166" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=3</text>
  <text x="218" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=4</text>
  <text x="270" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=5</text>
  <text x="322" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=6</text>

  <text x="62" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="114" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="166" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="218" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="270" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="322" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 348 98 L 372 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="76" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="431" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">SUM = 17</text>
  <text x="431" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0+2+4+6+1+4</text>

  <text x="40" y="162" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">桶 2（minute 7~12）</text>

  <rect x="40" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="248" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="62" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=7</text>
  <text x="114" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=8</text>
  <text x="166" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=9</text>
  <text x="218" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=10</text>
  <text x="270" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=11</text>
  <text x="322" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=12</text>

  <text x="62" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="114" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="166" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="218" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="270" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="322" y="212" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <path d="M 348 198 L 372 198" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="176" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="431" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">SUM = 18</text>
  <text x="431" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1+2+4+1+4+6</text>

  <rect x="170" y="252" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="271" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">interval_no</text>
  <text x="305" y="271" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">total_orders</text>
  <line x1="260" y1="252" x2="260" y2="336" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="170" y="280" width="180" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="215" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="305" y="299" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">17</text>

  <rect x="170" y="308" width="180" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="215" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="305" y="327" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>

  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⌈7/6⌉=⌈1.17⌉=2、⌈6/6⌉=⌈1⌉=1——上取整天然处理边界</text>
</svg>
