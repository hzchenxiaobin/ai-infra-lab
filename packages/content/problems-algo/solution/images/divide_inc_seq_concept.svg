<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrDown" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：maxFreq 决定子序列数下界，总数 ≥ K × maxFreq 即可</text>

  <!-- 1. Sorted array boxes -->
  <text x="30" y="52" font-size="11" fill="#888">已排序数组 nums（非降序），K = 2：</text>

  <rect x="30" y="58" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="110" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="150" y="58" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="190" y="58" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="230" y="58" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="270" y="58" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="310" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="350" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- len annotation -->
  <path d="M 30 96 L 30 92 L 386 92 L 386 96" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="208" y="108" text-anchor="middle" font-size="10" fill="#888">len(nums) = 9</text>

  <!-- 2. Frequency bars -->
  <text x="30" y="130" font-size="11" fill="#888">各值频次：</text>

  <!-- Value 1: freq 1 -->
  <rect x="40" y="170" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="55" y="166" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="55" y="202" text-anchor="middle" font-size="9" fill="#888">值1</text>

  <!-- Value 2: freq 2 [maxFreq] -->
  <rect x="90" y="150" width="30" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="105" y="202" text-anchor="middle" font-size="9" fill="#888">值2</text>

  <!-- Value 3: freq 2 [maxFreq] -->
  <rect x="140" y="150" width="30" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="155" y="202" text-anchor="middle" font-size="9" fill="#888">值3</text>

  <!-- Value 4: freq 2 [maxFreq] -->
  <rect x="190" y="150" width="30" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="205" y="202" text-anchor="middle" font-size="9" fill="#888">值4</text>

  <!-- Value 5: freq 2 [maxFreq] -->
  <rect x="240" y="150" width="30" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="255" y="202" text-anchor="middle" font-size="9" fill="#888">值5</text>

  <!-- maxFreq label -->
  <path d="M 275 170 L 300 170" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="158" width="62" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="331" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">maxFreq=2</text>

  <!-- 3. Formula box (right) -->
  <rect x="380" y="118" width="180" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">充盈判据</text>
  <text x="396" y="158" font-size="11" fill="#555">maxFreq = 2（下界）</text>
  <text x="396" y="176" font-size="11" fill="#555">每条 ≥ K = 2 个元素</text>
  <text x="396" y="194" font-size="11" fill="#b85450" font-weight="bold">9 ≥ 2 × 2 = 4 ✓</text>

  <!-- 4. Partition into subsequences -->
  <text x="30" y="232" font-size="11" fill="#888">分成 maxFreq = 2 条严格递增子序列（每条 ≥ K = 2）：</text>

  <!-- Seq 1 -->
  <text x="30" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">序列 A：</text>
  <rect x="80" y="242" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="97" y="260" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="118" y="242" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="260" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="156" y="242" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="260" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="194" y="242" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="211" y="260" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="232" y="242" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="260" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="276" y="260" font-size="9" fill="#4a7a3a">len=5 ≥ 2 ✓</text>

  <!-- Seq 2 -->
  <text x="30" y="288" font-size="10" fill="#4a7a3a" font-weight="bold">序列 B：</text>
  <rect x="80" y="274" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="97" y="292" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="118" y="274" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="292" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="156" y="274" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="292" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="194" y="274" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="211" y="292" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="238" y="292" font-size="9" fill="#4a7a3a">len=4 ≥ 2 ✓</text>

  <!-- 5. Bottom explanation -->
  <rect x="30" y="320" width="530" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">充要条件：len(nums) ≥ K × maxFreq</text>
  <text x="46" y="362" font-size="11" fill="#555">① 必要性：值 v 出现 maxFreq 次 → 每条严格递增序列至多含 1 个 v → 至少需 maxFreq 条序列 → 总数 ≥ K × maxFreq</text>
  <text x="46" y="380" font-size="11" fill="#555">② 充分性：用 maxFreq 条序列做轮询分配，已排序保证各序列严格递增，总数足够则每条均可达 K</text>
</svg>
