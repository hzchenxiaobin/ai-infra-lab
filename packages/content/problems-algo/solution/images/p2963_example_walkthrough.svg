<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：reach 扫描全过程（nums = [2,1,2,3,4,4]）</text>

  <!-- table header -->
  <rect x="45" y="48" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="85" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="145" y="48" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="235" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="295" y="48" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="365" y="48" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i</text>
  <text x="115" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="190" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">last[nums[i]]</text>
  <text x="265" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">reach</text>
  <text x="330" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">闭合?</text>
  <text x="420" y="65" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">备注</text>

  <!-- rows -->
  <rect x="45" y="74" width="430" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="115" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="265" y="94" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="330" y="94" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="420" y="94" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">值 2 锁到下标 2</text>

  <rect x="45" y="104" width="430" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="124" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="330" y="124" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="420" y="124" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">被值 2 的范围罩住</text>

  <rect x="45" y="134" width="430" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="265" y="154" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="330" y="154" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="420" y="154" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">A=[0,2] 闭合，m=1</text>

  <rect x="45" y="164" width="430" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="265" y="184" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="420" y="184" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">B=[3,3] 闭合，m=2</text>

  <rect x="45" y="194" width="430" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="115" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="190" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="265" y="214" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="330" y="214" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="420" y="214" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">值 4 锁到下标 5</text>

  <rect x="45" y="224" width="430" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="115" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="190" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="265" y="244" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="330" y="244" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="420" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">C=[4,5] 闭合，m=3</text>

  <!-- result strip -->
  <rect x="46" y="268" width="428" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m = 3 → ans = 2^(3−1) = 4</text>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">([2,1,2],[3],[4,4])  ([2,1,2],[3,4,4])  ([2,1,2,3],[4,4])  ([2,1,2,3,4,4])</text>

  <!-- official examples -->
  <rect x="26" y="342" width="468" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="364" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">代入官方三个示例：</text>
  <text x="42" y="384" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,3,4]：值全不同，每个值自成一段 → m=4 → 2³ = 8 ✓</text>
  <text x="42" y="402" font-size="10.5" fill="#333" filter="url(#rough2)">[1,1,1,1]：值 1 罩住整个数组 → m=1 → 2⁰ = 1 ✓</text>
  <text x="42" y="420" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,1,3]：值 1 罩住 [0,2] → m=2 → 2¹ = 2 ✓</text>
</svg>
