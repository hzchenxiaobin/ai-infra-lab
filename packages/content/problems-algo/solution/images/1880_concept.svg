<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：字母即数字，单词即十进制数</text>

  <!-- Letter-to-digit mapping: 10 cells a..j, width 44, x=60..456, y=50 -->
  <text x="44" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="60"  y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="412" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="56" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="126" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="170" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="214" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="258" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="302" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="346" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="390" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="434" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="478" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>

  <text x="44" y="108" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">数值</text>
  <rect x="60"  y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="412" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="126" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="214" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="258" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="302" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="346" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="390" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="434" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="478" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- Divider -->
  <path d="M 40 142 L 520 142" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example: "acb" -> positional notation -->
  <text x="280" y="166" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例：s = "acb"  的数值计算</text>

  <!-- Word letters row: 3 cells, width 60, x=160..340, y=180 -->
  <text x="120" y="202" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="160" y="184" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="220" y="184" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="280" y="184" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="190" y="207" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="250" y="207" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="310" y="207" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- arrows down -->
  <path d="M 190 218 L 190 238" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 218 L 250 238" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 218 L 310 238" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Digit row -->
  <text x="120" y="260" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">数位</text>
  <rect x="160" y="242" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="220" y="242" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="280" y="242" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="190" y="265" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="250" y="265" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="310" y="265" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- weight labels below digits -->
  <text x="190" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10²</text>
  <text x="250" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10¹</text>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×10⁰</text>

  <!-- convergence arrow -->
  <path d="M 190 296 L 250 296 L 310 296" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 250 296 L 250 312" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result equation box -->
  <rect x="70" y="316" width="420" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 × 10²  +  2 × 10¹  +  1 × 10⁰  =  0 + 20 + 1</text>
  <text x="280" y="366" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 21    （"021" 去前导零 → 21）</text>
</svg>
