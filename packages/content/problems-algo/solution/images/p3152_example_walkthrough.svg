  <text x="220" y="82" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="220" y="100" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">奇</text>

  <rect x="264" y="58" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
