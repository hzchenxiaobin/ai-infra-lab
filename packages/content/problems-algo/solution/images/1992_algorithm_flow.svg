<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：扫描 → 遇 1 扩展定界 → 记录 → 清零
  </text>

  <!-- 1. start -->
  <rect x="150" y="48" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">
    开始：groups=[]，遍历 (i,j)
  </text>

  <path d="M 260 84 L 260 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. diamond: land[i][j]==1? -->
  <path d="M 260 100 L 330 132 L 260 164 L 190 132 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11.5" fill="#7a5a20" filter="url(#rough2)">land[i][j]</text>
  <text x="260" y="143" text-anchor="middle" font-size="11.5" fill="#7a5a20" filter="url(#rough2)">== 1 ?</text>

  <!-- No branch: to the right -->
  <path d="M 330 132 L 380 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="355" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="380" y="116" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="435" y="137" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">j++ / 换行</text>
  <!-- loop back from j++ to diamond -->
  <path d="M 435 116 L 435 92 L 260 92 L 260 100" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes branch: down -->
  <path d="M 260 164 L 260 180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="176" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 3. extend right -->
  <rect x="120" y="180" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">向右扩展找 c2</text>
  <text x="260" y="213" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c2 = j; while c2+1&lt;n &amp;&amp; land[i][c2+1]==1: c2++</text>

  <path d="M 260 220 L 260 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. extend down -->
  <rect x="120" y="236" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">向下扩展找 r2</text>
  <text x="260" y="269" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">r2 = i; while r2+1&lt;m &amp;&amp; land[r2+1][j]==1: r2++</text>

  <path d="M 260 276 L 260 292" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. record -->
  <rect x="140" y="292" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    groups.append([i, j, r2, c2])
  </text>

  <path d="M 260 328 L 260 344" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. clear rectangle -->
  <rect x="120" y="344" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">清空矩形 land[i..r2][j..c2] = 0</text>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">兼做 visited，避免后续误判为左上角</text>

  <!-- loop back to diamond -->
  <path d="M 120 364 L 70 364 L 70 132 L 190 132" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">继续</text>
  <text x="58" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历</text>

  <!-- end -->
  <path d="M 260 384 L 260 400" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="400" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="423" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">
    遍历结束，返回 groups
  </text>

  <text x="260" y="450" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">
    每格至多被清零一次 + 扩展扫描均落在矩形内 ⟹ 总耗时 O(m×n)
  </text>
</svg>
