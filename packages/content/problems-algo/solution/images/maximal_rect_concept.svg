<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心归约：把矩阵每一行当作柱状图的「底部」，向上数连续 1 的高度</text>

  <!-- Matrix label -->
  <text x="40" y="52" font-size="12" fill="#888">矩阵（1=蓝，0=灰）：</text>

  <!-- Matrix cells: row0 1 0 1 0 0 -->
  <rect x="40" y="60" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="60" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="80" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="100" y="60" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="130" y="60" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="160" y="60" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="80" text-anchor="middle" font-size="12" fill="#999">0</text>
  <!-- row1 1 0 1 1 1 -->
  <rect x="40" y="90" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="110" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="90" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="110" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="100" y="90" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="130" y="90" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="110" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="160" y="90" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="110" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- row2 1 1 1 1 1 -->
  <rect x="40" y="120" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="120" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="100" y="120" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="130" y="120" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="160" y="120" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- row3 1 0 0 1 0 -->
  <rect x="40" y="150" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="170" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="70" y="150" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="170" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="100" y="150" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="130" y="150" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="170" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="160" y="150" width="30" height="30" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="170" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- answer rectangle highlight: rows1-2, cols2-4 -->
  <rect x="100" y="90" width="90" height="60" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="145" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">答案=6</text>

  <!-- column 2 height annotation -->
  <path d="M 115 178 L 115 64" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="60" font-size="9" fill="#b85450">高=3</text>

  <!-- arrow matrix -> histogram -->
  <path d="M 198 120 L 238 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="112" text-anchor="middle" font-size="10" fill="#888">按行</text>

  <!-- Histogram label -->
  <text x="332" y="52" text-anchor="middle" font-size="12" fill="#888">第 2 行的柱状图：</text>

  <!-- baseline -->
  <line x1="240" y1="180" x2="425" y2="180" stroke="#7f8c8d" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- bars heights=[3,1,3,2,2] 20px/unit -->
  <rect x="244" y="120" width="28" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="114" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="280" y="160" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294" y="154" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="316" y="120" width="28" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="114" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="352" y="140" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="134" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="388" y="140" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="134" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- col index -->
  <text x="258" y="196" text-anchor="middle" font-size="9" fill="#888">j=0</text>
  <text x="294" y="196" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="330" y="196" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="366" y="196" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="402" y="196" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- max rect highlight h=2 cols2-4 -->
  <rect x="316" y="140" width="100" height="40" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="366" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">高=2，宽=3 → 面积=6</text>
  <text x="332" y="218" text-anchor="middle" font-size="11" fill="#444">heights = [3, 1, 3, 2, 2]</text>

  <!-- right explanation box -->
  <rect x="455" y="60" width="170" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="84" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">heights[j] 的含义</text>
  <text x="540" y="106" text-anchor="middle" font-size="11" fill="#333">该列从上往下</text>
  <text x="540" y="122" text-anchor="middle" font-size="11" fill="#333">「连续 1」的个数</text>
  <text x="540" y="140" text-anchor="middle" font-size="10" fill="#b85450">遇 '0' 立即清零</text>
  <line x1="475" y1="150" x2="605" y2="150" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="540" y="170" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每行复用第 84 题</text>
  <text x="540" y="186" text-anchor="middle" font-size="10" fill="#888">柱状图最大矩形</text>

  <!-- bottom summary -->
  <rect x="40" y="300" width="585" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="332" y="326" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">归约：矩阵最大全 1 矩形 = max( 每一行的柱状图最大矩形 )</text>
  <text x="332" y="350" text-anchor="middle" font-size="11" fill="#555">每行：遇 1 累加高度、遇 0 清零 → 对 heights 跑一遍单调栈（84）→ 取所有行最大值</text>
  <text x="332" y="372" text-anchor="middle" font-size="11" fill="#888">R 行各做一次 O(C) 的柱状图最大矩形 → 总复杂度 O(R × C)</text>
</svg>
