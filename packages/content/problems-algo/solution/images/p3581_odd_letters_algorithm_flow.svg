<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐位拆数 → 查词表 → 逐字母翻掩码位 → popcount</text>

  <!-- 开始 -->
  <rect x="150" y="34" width="100" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="50" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始（n ≥ 1）</text>
  <path d="M 200 58 L 200 68" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask = 0 -->
  <rect x="140" y="70" width="120" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">mask = 0</text>
  <path d="M 200 96 L 200 106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 n > 0 ? -->
  <polygon points="200,108 296,138 200,168 104,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">n &gt; 0 ?</text>

  <!-- 否 → 返回 -->
  <text x="302" y="130" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 296 138 L 364 138" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="368" y="120" width="134" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="137" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">return popcount(mask)</text>
  <text x="435" y="152" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">1 的个数 = 奇数字母数</text>

  <!-- 是 → d = n % 10 -->
  <text x="206" y="180" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 200 168 L 200 178" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="128" y="180" width="144" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">d = n % 10</text>
  <path d="M 200 206 L 200 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="128" y="218" width="144" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n = n ÷ 10</text>
  <path d="M 200 244 L 200 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="128" y="256" width="144" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">word = words[d]</text>
  <path d="M 200 282 L 200 292" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 word 还有字母吗 -->
  <polygon points="200,294 288,324 200,354 112,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">word 还有</text>
  <text x="200" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">字母吗？</text>

  <!-- 是 → 翻位 -->
  <text x="292" y="314" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 288 324 L 330 324" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="334" y="306" width="170" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">c = word 的下一字母</text>
  <text x="419" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">mask ^= 1 &lt;&lt; (c − 'a')</text>

  <!-- 翻完一个字母回判断 -->
  <path d="M 419 348 L 419 372 L 200 372 L 200 358" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">翻一位，回到判断取下一字母</text>

  <!-- 否：本词翻完，回外层 -->
  <text x="84" y="316" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 112 324 L 60 324 L 60 138 L 100 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="346" font-size="8.5" fill="#446688" filter="url(#rough2)">本词翻完 → 回外层</text>

  <!-- 单词表 -->
  <rect x="356" y="162" width="154" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">单词表 words</text>
  <g font-size="8.5" fill="#333" filter="url(#rough2)">
    <text x="392" y="193" text-anchor="middle">0 zero</text>
    <text x="462" y="193" text-anchor="middle">5 five</text>
    <text x="392" y="211" text-anchor="middle">1 one</text>
    <text x="462" y="211" text-anchor="middle">6 six</text>
    <text x="392" y="229" text-anchor="middle">2 two</text>
    <text x="462" y="229" text-anchor="middle">7 seven</text>
    <text x="392" y="247" text-anchor="middle">3 three</text>
    <text x="462" y="247" text-anchor="middle">8 eight</text>
    <text x="392" y="265" text-anchor="middle">4 four</text>
    <text x="462" y="265" text-anchor="middle">9 nine</text>
  </g>
  <path d="M 272 269 L 352 269" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="312" y="262" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">查表</text>

  <!-- 底部注记 -->
  <rect x="36" y="396" width="238" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="412" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">全程只有位翻转：数位 ≤ 10 个 × 每词 ≤ 5 字母</text>
  <text x="155" y="425" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">至多 50 次异或 + 一次 popcount，O(log n) / O(1)</text>
</svg>
