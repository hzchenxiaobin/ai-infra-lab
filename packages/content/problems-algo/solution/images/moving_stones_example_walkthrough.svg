<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：1, 2, 5 的最小与最大路径</text>

  <!-- ============ 上半：最小路径（1 步）============ -->
  <rect x="30" y="38" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="48" y="58" font-size="11.5" fill="#4a7a3a" font-weight="bold">最小路径（1 步）：gap₁=1 ≤ 2，远端一步凑连续</text>

  <!-- 行1：1,2,5 -->
  <text x="48" y="86" font-size="10.5" fill="#888">初始</text>
  <path d="M 90 86 L 370 86" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="90"  cy="86" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="160" cy="86" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="86" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90"  y="108" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="160" y="108" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="230" y="108" text-anchor="middle" font-size="10" fill="#ccc">3</text>
  <text x="300" y="108" text-anchor="middle" font-size="10" fill="#ccc">4</text>
  <text x="370" y="108" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="392" y="90" font-size="10.5" fill="#333">{1,2,5}，跨度 4</text>

  <!-- 移动箭头 -->
  <path d="M 370 100 L 230 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="305" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">z=5 → 3</text>

  <!-- 行2：1,2,3 连续 -->
  <circle cx="90"  cy="138" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="160" cy="138" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="138" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 82 138 L 238 138" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold">{1,2,3} ✓ 1 步</text>

  <!-- ============ 下半：最大路径（2 步）============ -->
  <rect x="30" y="170" width="480" height="216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="48" y="190" font-size="11.5" fill="#d6a040" font-weight="bold">最大路径（2 步）：每次跨度恰减 1，max = z−x−2 = 2</text>

  <!-- 行1：1,2,5 跨度4 -->
  <text x="48" y="218" font-size="10.5" fill="#888">第 0 步</text>
  <path d="M 90 218 L 370 218" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="90"  cy="218" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="160" cy="218" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="218" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="222" font-size="10.5" fill="#333">{1,2,5}，跨度 4</text>

  <!-- 箭头 5→4 -->
  <path d="M 370 232 L 300 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="345" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5 → 4（跨度 4→3）</text>

  <!-- 行2：1,2,4 跨度3 -->
  <text x="48" y="278" font-size="10.5" fill="#888">第 1 步</text>
  <path d="M 90 278 L 300 278" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="90"  cy="278" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="160" cy="278" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="278" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="282" font-size="10.5" fill="#333">{1,2,4}，跨度 3</text>

  <!-- 箭头 4→3 -->
  <path d="M 300 292 L 230 310" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="275" y="312" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4 → 3（跨度 3→2）</text>

  <!-- 行3：1,2,3 连续 -->
  <text x="48" y="338" font-size="10.5" fill="#888">第 2 步</text>
  <circle cx="90"  cy="338" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="160" cy="338" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="338" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 82 338 L 238 338" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="342" font-size="10.5" fill="#4a7a3a" font-weight="bold">{1,2,3} ✓ 2 步</text>

  <!-- 底部小结 -->
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⇒ answer = [1, 2]</text>
</svg>
