<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：差分标记已有覆盖 + 从左到右跳格贪心</text>

  <!-- 预处理框 -->
  <g filter="url(#rough2)">
    <rect x="110" y="40" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="58" text-anchor="middle" font-size="10" fill="#446688">① 差分：每个 lights[i] = v &gt; 0 标记 [max(0,i−v), min(n−1,i+v)]</text>
    <text x="260" y="76" text-anchor="middle" font-size="10" fill="#446688">② 前缀和 → cover[]；置 ans = 0, i = 0</text>
  </g>
  <path d="M 260 92 L 260 104" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="180,140 260,110 340,140 260,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 340 140 L 371 140" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="352" y="132" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="375" y="120" width="125" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="437" y="137" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>
    <text x="437" y="152" text-anchor="middle" font-size="8.5" fill="#4a7a3a">最少额外灯数</text>
  </g>

  <path d="M 260 170 L 260 186" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="269" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D2: cover[i] > 0 ? -->
  <polygon points="170,222 260,192 350,222 260,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">cover[i] &gt; 0 ?</text>

  <path d="M 350 222 L 386 222" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="360" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="390" y="202" width="110" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="445" y="219" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i++</text>
    <text x="445" y="234" text-anchor="middle" font-size="8.5" fill="#446688">亮格，跳过</text>
  </g>
  <!-- i++ 回路 -->
  <path d="M 445 202 L 445 177 L 270 177" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <circle cx="260" cy="177" r="2.5" fill="#d6a040" filter="url(#rough2)"/>

  <path d="M 260 252 L 260 264" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="269" y="262" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- N4: 放灯 -->
  <g filter="url(#rough2)">
    <rect x="110" y="268" width="300" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="287" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ 暗位！ans++；j = min(i+1, n−1)</text>
    <text x="260" y="306" text-anchor="middle" font-size="9.5" fill="#b85450">新灯盖 [j−1, min(j+1, n−1)]；i ← min(j+1, n−1) + 1</text>
  </g>
  <!-- 放灯回路 -->
  <path d="M 110 296 L 55 296 L 55 140 L 172 140" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 底注 -->
  <text x="260" y="348" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每盏新灯至多跨 3 格；扫描指针只进不退，全程 O(n)</text>
  <text x="260" y="364" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">示例 2 演算：旧灯盖 [1,4] → i=0 放灯于 1 盖 [0,2] → i=3,4 亮跳过 → 返回 1</text>
</svg>
