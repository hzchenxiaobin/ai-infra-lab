<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心三步：删无币叶 → 删外两层叶 → 剩余边 × 2</text>

  <!-- ===== Panel A: coinless leaf is a dead end ===== -->
  <rect x="20" y="50" width="170" height="300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① 无币叶是死路</text>

  <line x1="105" y1="158" x2="105" y2="202" stroke="#aaa" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <circle cx="105" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P</text>

  <circle cx="105" cy="220" r="18" fill="#eee" stroke="#aaa" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="105" y="225" text-anchor="middle" font-size="12" fill="#999">L</text>
  <text x="138" y="186" font-size="20" fill="#b85450" font-weight="bold">✗</text>

  <text x="105" y="270" text-anchor="middle" font-size="10.5" fill="#666">L 无币：走到 L 再原路返回</text>
  <text x="105" y="286" text-anchor="middle" font-size="10.5" fill="#666">白走 2 边；而 P 已能覆盖</text>
  <text x="105" y="302" text-anchor="middle" font-size="10.5" fill="#666">L 周边所有币 → 删 L</text>
  <text x="105" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">反复删（变新叶继续删）</text>

  <!-- ===== Panel B: distance 2 collection ===== -->
  <rect x="210" y="50" width="180" height="300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 距离 2 可收币</text>

  <line x1="268" y1="180" x2="287" y2="180" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="323" y1="180" x2="342" y2="180" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 250 162 Q 305 128 360 162" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="305" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">距离 2</text>

  <circle cx="250" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">G</text>
  <circle cx="305" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">P</text>
  <circle cx="360" cy="180" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <text x="360" y="164" text-anchor="middle" font-size="14" fill="#d6a040">★</text>

  <text x="300" y="242" text-anchor="middle" font-size="10.5" fill="#666">站在 G 就能收 L 处金币</text>
  <text x="300" y="258" text-anchor="middle" font-size="10.5" fill="#666">→ 外两层叶不必亲临</text>
  <text x="300" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">删掉 2 层叶</text>
  <text x="300" y="312" text-anchor="middle" font-size="10" fill="#888">（删到币距核心 ≤ 2）</text>

  <!-- ===== Panel C: remaining core × 2 ===== -->
  <rect x="410" y="50" width="170" height="300" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="495" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 剩余核心边 × 2</text>

  <line x1="440" y1="180" x2="495" y2="180" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="495" y1="180" x2="550" y2="180" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="467" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">×2</text>
  <text x="522" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">×2</text>

  <circle cx="440" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A</text>
  <circle cx="495" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">B</text>
  <circle cx="550" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="550" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>

  <text x="495" y="236" text-anchor="middle" font-size="10.5" fill="#666">树中走遍每条边</text>
  <text x="495" y="252" text-anchor="middle" font-size="10.5" fill="#666">去 + 回 = 每边 2 次</text>

  <rect x="430" y="272" width="130" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="495" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 2 × 边数</text>
</svg>
