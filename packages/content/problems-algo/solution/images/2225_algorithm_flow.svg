<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：哈希计数 + 筛选排序</text>

  <!-- ===== Step 1: init ===== -->
  <rect x="190" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="11" fill="#333">① loss = {} 空哈希表</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: loop diamond ===== -->
  <polygon points="270,94 360,138 270,182 180,138" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">遍历每场</text>
  <text x="270" y="150" text-anchor="middle" font-size="10.5" fill="#333">[w, l] in matches?</text>

  <!-- loop yes -> right side process; no -> down to step 3 -->
  <text x="372" y="135" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="270" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <path d="M 270 182 L 270 322" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step 2a/2b: process w and l (right) ===== -->
  <!-- winner box -->
  <rect x="380" y="92" width="146" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="453" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">② 胜者 w</text>
  <text x="453" y="126" text-anchor="middle" font-size="9.5" fill="#333">setdefault(w, 0)</text>

  <path d="M 360 138 L 378 114" stroke="#666" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loser box -->
  <rect x="380" y="150" width="146" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="453" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">③ 败者 l</text>
  <text x="453" y="184" text-anchor="middle" font-size="9.5" fill="#333">loss[l] = loss[l] + 1</text>

  <path d="M 360 138 L 378 172" stroke="#666" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow from process to diamond -->
  <path d="M 453 196 C 453 240 380 230 360 170" stroke="#666" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="412" y="232" font-size="9" fill="#888">下一场</text>

  <!-- ===== Step 3: filter ===== -->
  <rect x="170" y="324" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">④ 遍历 loss 筛选</text>
  <text x="270" y="358" text-anchor="middle" font-size="9.5" fill="#333">c==0 → zero · c==1 → one</text>

  <path d="M 270 370 L 270 386" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: sort + return ===== -->
  <rect x="150" y="388" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"
        rx="6" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">⑤ 排序 zero / one</text>
  <text x="270" y="422" text-anchor="middle" font-size="10.5" fill="#333">返回 [zero, one]</text>

  <!-- ===== side notes ===== -->
  <text x="270" y="448" text-anchor="middle" font-size="9.5" fill="#888">绿=胜者登记(已存在不动) · 红=败者累加 · 蓝=筛选 · 橙=排序返回</text>
</svg>
