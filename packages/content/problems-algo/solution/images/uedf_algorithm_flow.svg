<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：双重循环 + O(1) 增量判定 + 哈希去重</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">外层枚举左端点 i，内层向右扩展 j；每个好子串的哈希入集合</text>

  <!-- 开始 -->
  <rect x="220" y="60" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">seen = ∅ , ans 待计</text>
  <line x1="280" y1="92" x2="280" y2="108" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="150" y="110" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">for i = 0 .. n−1</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#5a7a4a">cnt/fof/distinct/h 全部重置为 0</text>
  <line x1="280" y1="154" x2="280" y2="170" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <rect x="150" y="172" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">for j = i .. n−1</text>
  <line x1="280" y1="212" x2="280" y2="226" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 增量更新 -->
  <rect x="110" y="228" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">d = s[j]−'0'；cnt[d]: c→c+1</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">维护 fof / distinct ;  h = h*11 + (d+1)</text>
  <line x1="280" y1="284" x2="280" y2="298" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,300 360,338 280,376 200,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">distinct==1?</text>
  <text x="280" y="350" text-anchor="middle" font-size="9" fill="#888">（好子串？）</text>

  <!-- 是 -->
  <line x1="360" y1="338" x2="410" y2="338" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="332" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="322" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="475" y="343" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">seen.insert(h)</text>

  <!-- 否 -->
  <line x1="200" y1="338" x2="150" y2="338" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="332" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="120" y="346" font-size="10" fill="#888">跳过</text>

  <!-- 内层回环箭头 -->
  <path d="M 475 356 C 475 392, 280 392, 280 212" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="406" font-size="10" fill="#888">j++ 继续扩展同一左端点</text>

  <!-- 返回 -->
  <rect x="200" y="412" width="160" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">return seen.size()</text>
</svg>
