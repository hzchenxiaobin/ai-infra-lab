<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="368" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：行囊逐层上溯，coin 就地算出</text>

  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.4">
    <line x1="135" y1="64" x2="80" y2="142"/>
    <line x1="135" y1="64" x2="195" y2="142"/>
    <line x1="80" y1="142" x2="45" y2="222"/>
    <line x1="80" y1="142" x2="80" y2="222"/>
    <line x1="80" y1="142" x2="115" y2="222"/>
    <line x1="195" y1="142" x2="160" y2="222"/>
    <line x1="195" y1="142" x2="190" y2="222"/>
    <line x1="195" y1="142" x2="230" y2="222"/>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)" font-size="12" fill="#2c4a6e">
    <circle cx="135" cy="64" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="135" y="69" text-anchor="middle">0</text>
    <circle cx="80" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="80" y="147" text-anchor="middle">1</text>
    <circle cx="195" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="195" y="147" text-anchor="middle">2</text>
    <circle cx="45" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="45" y="226" text-anchor="middle" font-size="11">3</text>
    <circle cx="80" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="80" y="226" text-anchor="middle" font-size="11">4</text>
    <circle cx="115" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="115" y="226" text-anchor="middle" font-size="11">5</text>
    <circle cx="160" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="160" y="226" text-anchor="middle" font-size="11">6</text>
    <circle cx="190" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="190" y="226" text-anchor="middle" font-size="11">7</text>
    <circle cx="230" cy="222" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="230" y="226" text-anchor="middle" font-size="11">8</text>
  </g>

  <!-- costs -->
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="135" y="97" text-anchor="middle">1</text>
    <text x="80" y="172" text-anchor="middle">4</text>
    <text x="195" y="172" text-anchor="middle">2</text>
    <text x="45" y="248" text-anchor="middle" font-size="10">3</text>
    <text x="80" y="248" text-anchor="middle" font-size="10">5</text>
    <text x="115" y="248" text-anchor="middle" font-size="10">7</text>
    <text x="160" y="248" text-anchor="middle" font-size="10">8</text>
    <text x="190" y="248" text-anchor="middle" font-size="10" fill="#b85450">−4</text>
    <text x="230" y="248" text-anchor="middle" font-size="10">2</text>
  </g>

  <!-- coin pills -->
  <g filter="url(#rough2)" font-size="10.5" fill="#2e5c22">
    <rect x="113" y="102" width="44" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="135" y="114" text-anchor="middle" font-weight="bold">280</text>
    <rect x="61" y="177" width="38" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="80" y="189" text-anchor="middle">140</text>
    <rect x="176" y="177" width="38" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="195" y="189" text-anchor="middle">32</text>
    <rect x="32" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="45" y="266" text-anchor="middle" font-size="10">1</text>
    <rect x="67" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="80" y="266" text-anchor="middle" font-size="10">1</text>
    <rect x="102" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="115" y="266" text-anchor="middle" font-size="10">1</text>
    <rect x="147" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="160" y="266" text-anchor="middle" font-size="10">1</text>
    <rect x="177" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="190" y="266" text-anchor="middle" font-size="10">1</text>
    <rect x="217" y="254" width="26" height="17" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="230" y="266" text-anchor="middle" font-size="10">1</text>
  </g>

  <!-- packet labels flowing up -->
  <g filter="url(#rough2)" font-size="9.5" fill="#8a6414">
    <text x="40" y="124" text-anchor="middle">↑ [3,4,5,7]</text>
    <text x="225" y="124" text-anchor="middle">↑ [−4,2,2,8]</text>
  </g>

  <!-- walkthrough boxes -->
  <rect x="285" y="54" width="262" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2c4a6e">
    <text x="416" y="74" text-anchor="middle" font-size="12" font-weight="bold">节点 1：pool = [3, 4, 5, 7]</text>
    <text x="416" y="94" text-anchor="middle" font-size="11">max(7·5·4, 3·4·7) = max(140, 84)</text>
    <text x="416" y="114" text-anchor="middle" font-size="11">→ coin[1] = 140</text>
  </g>

  <rect x="285" y="138" width="262" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2c4a6e">
    <text x="416" y="158" text-anchor="middle" font-size="12" font-weight="bold">节点 2：pool = [−4, 2, 2, 8]</text>
    <text x="416" y="178" text-anchor="middle" font-size="11">max(8·2·2, −4·2·8) = max(32, −64)</text>
    <text x="416" y="198" text-anchor="middle" font-size="11">→ coin[2] = 32</text>
  </g>

  <rect x="285" y="222" width="262" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#8a6414">
    <text x="416" y="242" text-anchor="middle" font-size="12" font-weight="bold">节点 0：pool = 9 个值</text>
    <text x="416" y="262" text-anchor="middle" font-size="10.5">cost 1 ∪ 行囊[3,4,5,7] ∪ 行囊[−4,2,2,8]</text>
    <text x="416" y="280" text-anchor="middle" font-size="10.5">排序 [−4,1,2,2,3,4,5,7,8] → 截 5 个</text>
    <text x="416" y="298" text-anchor="middle" font-size="11">kept = [−4, 1 ∣ 5, 7, 8]</text>
    <text x="416" y="316" text-anchor="middle" font-size="11">max(8·7·5, (−4)·1·8) = max(280, −32)</text>
    <text x="416" y="332" text-anchor="middle" font-size="11" font-weight="bold">→ coin[0] = 280</text>
  </g>

  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">叶子 size = 1 &lt; 3 → coin = 1；答案 [280,140,32,1,1,1,1,1,1] ✓</text>
</svg>
