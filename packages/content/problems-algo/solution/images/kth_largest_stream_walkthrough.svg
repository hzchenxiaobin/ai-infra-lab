<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：K=3, nums=[4,5,8,2]</text>

  <!-- Table header -->
  <rect x="30" y="44" width="60" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">步骤</text>
  <rect x="94" y="44" width="92" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">操作</text>
  <rect x="190" y="44" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">val vs 堆顶</text>
  <rect x="314" y="44" width="124" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">堆状态 (size=3)</text>
  <rect x="442" y="44" width="68" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">返回</text>

  <!-- Row 1: Init -->
  <rect x="30" y="76" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="96" text-anchor="middle" font-size="11" fill="#333">初始化</text>
  <rect x="94" y="76" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#333">入堆+弹至3</text>
  <rect x="190" y="76" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="#888">弹出 2</text>
  <rect x="314" y="76" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[4, 5, 8]</text>
  <rect x="442" y="76" width="68" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="96" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: add(3) -->
  <rect x="30" y="110" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">add(3)</text>
  <rect x="94" y="110" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#333">加入 3</text>
  <rect x="190" y="110" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#b85450">3 &lt; 4 → 丢弃</text>
  <rect x="314" y="110" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[4, 5, 8]</text>
  <rect x="442" y="110" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row 3: add(5) -->
  <rect x="30" y="144" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">add(5)</text>
  <rect x="94" y="144" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="11" fill="#333">加入 5</text>
  <rect x="190" y="144" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">5 &gt; 4 → 升级</text>
  <rect x="314" y="144" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[5, 5, 8]</text>
  <rect x="442" y="144" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 4: add(10) -->
  <rect x="30" y="178" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">add(10)</text>
  <rect x="94" y="178" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="198" text-anchor="middle" font-size="11" fill="#333">加入 10</text>
  <rect x="190" y="178" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a">10 &gt; 5 → 升级</text>
  <rect x="314" y="178" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[5, 8, 10]</text>
  <rect x="442" y="178" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 5: add(9) -->
  <rect x="30" y="212" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">add(9)</text>
  <rect x="94" y="212" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#333">加入 9</text>
  <rect x="190" y="212" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a">9 &gt; 5 → 升级</text>
  <rect x="314" y="212" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[8, 9, 10]</text>
  <rect x="442" y="212" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Row 6: add(4) -->
  <rect x="30" y="246" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">add(4)</text>
  <rect x="94" y="246" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#333">加入 4</text>
  <rect x="190" y="246" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#b85450">4 &lt; 8 → 丢弃</text>
  <rect x="314" y="246" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[8, 9, 10]</text>
  <rect x="442" y="246" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Legend -->
  <rect x="30" y="292" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="303" font-size="10" fill="#666">升级: val &gt; 堆顶，弹出旧的推入新的</text>
  <rect x="240" y="292" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="303" font-size="10" fill="#666">丢弃: val ≤ 堆顶，比第 K 大还小，不配入堆</text>

  <!-- Key insight -->
  <rect x="30" y="318" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#666">堆始终只存「最大的 K 个」，堆顶 = 其中最小 = 第 K 大</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">新元素只有比堆顶大才「挤掉」堆顶入堆，否则连堆都进不了</text>
</svg>
