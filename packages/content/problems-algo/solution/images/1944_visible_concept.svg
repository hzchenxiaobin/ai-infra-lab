<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：可见人 = 递增阶梯 + 第一个更高者</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">heights = [10, 6, 8, 5, 11, 9]，观察第 0 人（高 10）向右能看到谁</text>

  <!-- ===== People bars ===== -->
  <g font-size="11">
    <!-- bar 0: h=10, observer -->
    <rect x="48" y="210" width="44" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="70" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>
    <text x="70" y="320" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[0] 观察者</text>

    <!-- bar 1: h=6, visible (shorter, first to right) -->
    <rect x="118" y="246" width="44" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="140" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="140" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a">[1] ✓</text>

    <!-- bar 2: h=8, visible (new max &lt; 10) -->
    <rect x="188" y="228" width="44" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="210" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
    <text x="210" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a">[2] ✓</text>

    <!-- bar 3: h=5, blocked by bar 2 -->
    <rect x="258" y="255" width="44" height="45" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="280" y="247" text-anchor="middle" font-size="10" fill="#888">5</text>
    <text x="280" y="320" text-anchor="middle" font-size="10" fill="#b85450">[3] ✗ 挡</text>

    <!-- bar 4: h=11, visible (first taller) -->
    <rect x="328" y="201" width="44" height="99" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="350" y="193" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11</text>
    <text x="350" y="320" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[4] ✓ 止</text>

    <!-- bar 5: h=9, blocked by bar 4 -->
    <rect x="398" y="219" width="44" height="81" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="420" y="211" text-anchor="middle" font-size="10" fill="#888">9</text>
    <text x="420" y="320" text-anchor="middle" font-size="10" fill="#b85450">[5] ✗ 挡</text>
  </g>

  <!-- ground line -->
  <path d="M 40 302 L 460 302" stroke="#888" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Sight lines from observer (top of bar 0) ===== -->
  <!-- to bar 1 -->
  <path d="M 92 210 L 118 246" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- to bar 2 -->
  <path d="M 92 210 L 188 228" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- to bar 4 (first taller) -->
  <path d="M 92 210 L 328 201" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- blocked markers -->
  <text x="280" y="270" text-anchor="middle" font-size="9" fill="#b85450">8 &gt; 5 挡住 [3]</text>
  <text x="420" y="234" text-anchor="middle" font-size="9" fill="#b85450">11 &gt; 9 挡住 [5]</text>

  <!-- ===== Staircase annotation ===== -->
  <rect x="40" y="340" width="480" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="11" fill="#446688" font-weight="bold">第 0 人看到的「递增阶梯」：</text>
  <g font-size="11">
    <rect x="60" y="370" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="77" y="386" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <path d="M 94 382 L 110 382" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
    <rect x="114" y="370" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="131" y="386" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <text x="158" y="386" font-size="10" fill="#4a7a3a">↑ 都 &lt; 10，递增可见</text>
    <path d="M 266 382 L 282 382" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
    <rect x="286" y="370" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="303" y="386" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
    <text x="330" y="386" font-size="10" fill="#d6a040">首个&gt;10，看到后止</text>
  </g>
  <text x="56" y="404" font-size="10" fill="#555">answer[0] = 3（2 个更矮阶梯 + 1 个首个更高）</text>
</svg>
