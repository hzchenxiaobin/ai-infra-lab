<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 二分答案 + 贪心双指针</text>

  <!-- 1: sort -->
  <rect x="140" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hens、grains 各自升序排序</text>
  <text x="270" y="79" text-anchor="middle" font-size="10.5" fill="#666">存在最优解：每只鸡吃连续一段</text>
  <line x1="270" y1="86" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2: binary search init -->
  <rect x="120" y="104" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">二分时间 T：lo = 0，hi = 2×10⁹</text>
  <text x="270" y="137" text-anchor="middle" font-size="10.5" fill="#666">T 越大越容易吃完 → 单调 → 二分</text>
  <line x1="270" y1="144" x2="270" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3: check box -->
  <rect x="60" y="162" width="420" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">check(T)：能否在 T 秒内吃完？</text>

  <rect x="80" y="196" width="380" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="11.5" fill="#333">指针 j = 0（最左未分配谷）；遍历每只鸡 x</text>

  <rect x="80" y="236" width="380" height="60" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">L = grains[j]：本鸡负责最左谷</text>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#444">尽量右扩 R = grains[k]，只要</text>
  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#444">cost(x, L, R) ≤ T 即继续；j ← k</text>

  <!-- loop back arrow to check -->
  <path d="M 270 312 L 270 322" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4: decision -->
  <polygon points="270,322 380,360 270,398 160,360" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j == m ？</text>
  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#b85450">（所有谷吃完）</text>

  <!-- yes branch: hi = mid -->
  <line x1="160" y1="360" x2="96" y2="360" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="14" y="346" width="78" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="53" y="365" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hi = mid</text>

  <!-- no branch: lo = mid+1 -->
  <line x1="380" y1="360" x2="446" y2="360" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="448" y="346" width="82" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="489" y="365" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo = mid+1</text>

  <!-- loop back to binary search -->
  <path d="M 53 346 Q 53 300 120 124" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 489 346 Q 489 300 420 124" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="10" fill="#888">lo &lt; hi 时循环</text>

  <!-- 5: answer -->
  <rect x="150" y="428" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="449" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 lo（最小可行 T）</text>
</svg>
