<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [9,1,2,3,9]，k = 3，答案 dp[5][3] = 20</text>

  <!-- table header j -->
  <text x="120" y="58" text-anchor="middle" font-size="10" fill="#aaa">i \ j</text>
  <text x="200" y="58" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="290" y="58" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="380" y="58" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- row header i -->
  <text x="120" y="86" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="120" y="118" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="120" y="150" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="120" y="182" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="120" y="214" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- row i=1 -->
  <rect x="165" y="68" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- row i=2 -->
  <rect x="165" y="100" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="255" y="100" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="122" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- row i=3 -->
  <rect x="165" y="132" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="255" y="132" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="12" fill="#333">10.5</text>
  <rect x="345" y="132" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="12" fill="#333">12</text>

  <!-- row i=4 -->
  <rect x="165" y="164" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="12" fill="#333">3.75</text>
  <rect x="255" y="164" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="186" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="345" y="164" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="186" text-anchor="middle" font-size="12" fill="#333">13.5</text>

  <!-- row i=5 -->
  <rect x="165" y="196" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#333">4.8</text>
  <rect x="255" y="196" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="218" text-anchor="middle" font-size="12" fill="#333">12.75</text>
  <rect x="345" y="196" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">20</text>

  <!-- dependency arrow: dp[4][2] -> dp[5][3] (t=4) -->
  <path d="M 290 196 L 348 232" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="240" font-size="9" fill="#b85450">t=4 依赖↘</text>

  <!-- legend -->
  <rect x="440" y="68" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="78" font-size="9" fill="#666">j=1 基准</text>
  <rect x="440" y="86" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="96" font-size="9" fill="#666">j=2</text>
  <rect x="440" y="104" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="114" font-size="9" fill="#666">j=3</text>
  <rect x="440" y="122" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="132" font-size="9" fill="#b85450">答案格</text>

  <!-- computation box -->
  <rect x="40" y="252" width="460" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[5][3]：枚举切点 t，取 dp[t][2] + 均值(nums[t..4]) 的最大</text>
  <text x="60" y="296" font-size="11" fill="#444">t=2: 10.0 + (24−10)/3 = 10 + 4.67 = 14.67</text>
  <text x="60" y="314" font-size="11" fill="#444">t=3: 10.5 + (24−12)/2 = 10.5 + 6 = 16.5</text>
  <text x="60" y="332" font-size="11" fill="#b85450" font-weight="bold">t=4: 11.0 + (24−15)/1 = 11 + 9 = 20  ← 最优</text>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#888">最优分组 [9]·[1,2,3]·[9] → 9 + 2 + 9 = 20</text>
</svg>
