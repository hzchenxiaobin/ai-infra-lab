<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：滑窗切块 + 计数表维护 MEX</text>

  <rect x="105" y="28" width="310" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">预处理：cnt[v] ← 全数组计数（v &gt; n 忽略），i = 0</text>
  <text x="260" y="64" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">从 cnt[0] 起上扫得整段后缀的 MEX x</text>

  <path d="M 260 74 L 260 92" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="182,116 260,92 338,116 260,140" fill="#fafafa" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">x == 0 ？</text>

  <path d="M 182 116 L 112 116 L 112 156" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="108" text-anchor="middle" font-size="9" fill="#a0433f" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 338 116 L 416 116 L 416 148" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="108" text-anchor="middle" font-size="9" fill="#33507a" font-weight="bold" filter="url(#rough2)">否（x ≥ 1）</text>

  <rect x="26" y="158" width="186" height="72" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="176" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">result 尾部补 (n − i) 个 0</text>
  <text x="36" y="194" font-size="9" fill="#555" filter="url(#rough2)">后缀无 0 ⇒ 怎么切每块都是 0</text>
  <text x="36" y="210" font-size="9" fill="#555" filter="url(#rough2)">取 k = 1 拉到最长（更长 = 字典序更大）</text>
  <text x="36" y="226" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">→ 输出 result，结束</text>

  <rect x="326" y="150" width="178" height="70" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="168" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">滑窗找最短块 [i..j]</text>
  <text x="336" y="184" font-size="9" fill="#555" filter="url(#rough2)">j 从 i 起步，边走边 cnt[nums[j]]−−</text>
  <text x="336" y="198" font-size="9" fill="#555" filter="url(#rough2)">时间戳记录首次见到的 v &lt; x</text>
  <text x="336" y="212" font-size="9" fill="#555" filter="url(#rough2)">集齐 0..x−1（need 归零）即停</text>

  <path d="M 415 220 L 415 238" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="326" y="240" width="178" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="258" text-anchor="middle" font-size="10" fill="#3d6330" font-weight="bold" filter="url(#rough2)">result 末尾追加 x</text>
  <text x="415" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i = j + 1（块内元素全部出队）</text>

  <path d="M 415 286 L 415 304" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="326" y="306" width="178" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="324" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">重算 MEX：从 cnt[0] 上扫</text>
  <text x="415" y="342" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">新 x ≤ 旧 x ≤ 块长 ⇒ 摊还 O(n)</text>

  <path d="M 326 328 C 288 330, 262 296, 262 148" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="248" font-size="9" fill="#999" filter="url(#rough2)">下一块</text>

  <text x="36" y="252" font-size="9" fill="#999" filter="url(#rough2)">i = n 时 cnt 全零 → x = 0</text>
  <text x="36" y="268" font-size="9" fill="#999" filter="url(#rough2)">走「是」分支补 0 个 0，自然收尾</text>
  <text x="36" y="284" font-size="9" fill="#999" filter="url(#rough2)">⚠️ 重算勿从旧 x 下探：缺失值可能有</text>
  <text x="36" y="300" font-size="9" fill="#999" filter="url(#rough2)">「空洞」，如 cnt = [0,0,1] 真值是 0</text>
</svg>
