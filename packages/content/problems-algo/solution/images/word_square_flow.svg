<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有效的单词方块：算法流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="60" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">开始: n = len(words), i = 0</text>

  <path d="M 280 80 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="280,96 400,144 280,192 160,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#888">（还有行未处理）</text>

  <!-- No -> return true -->
  <path d="M 400 144 L 470 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="136" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="166" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="184" text-anchor="middle" font-size="11" fill="#333">所有位核对通过</text>
  <text x="485" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>
  <path d="M 485 144 L 485 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> j = 0 -->
  <path d="M 280 192 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="208" font-size="11" fill="#82b366">是</text>

  <rect x="220" y="216" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#333">j = 0</text>

  <path d="M 280 250 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: j < len(words[i]) ? -->
  <polygon points="280,266 410,316 280,366 150,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333">j &lt; len(words[i]) ?</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888">（行 i 还有字符）</text>

  <!-- No -> i++ loop back -->
  <path d="M 410 316 L 470 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="308" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="338" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="360" text-anchor="middle" font-size="12" fill="#333">i++，回 i &lt; n</text>
  <path d="M 485 316 L 485 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- loop back arrow to top diamond -->
  <path d="M 540 355 L 540 60 L 400 60" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> three-check box -->
  <path d="M 280 366 L 280 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="382" font-size="11" fill="#82b366">是</text>

  <!-- Big check box with three conditions -->
  <rect x="90" y="390" width="380" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">短路三连判（任一为真 → return false）</text>
  <text x="110" y="436" font-size="11" fill="#2b6e9e" font-weight="bold">① j &gt;= n</text>
  <text x="200" y="436" font-size="10" fill="#555">行 j 不存在</text>
  <text x="110" y="460" font-size="11" fill="#2e6e2e" font-weight="bold">② i &gt;= len(words[j])</text>
  <text x="280" y="460" font-size="10" fill="#555">行 j 不足以容纳列 i</text>
  <text x="110" y="484" font-size="11" fill="#a33a36" font-weight="bold">③ words[i][j] != words[j][i]</text>
  <text x="320" y="484" font-size="10" fill="#555">字符不等</text>

  <!-- branch: any true -> false -->
  <path d="M 90 445 L 50 445 L 50 510" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="438" font-size="10" fill="#b85450" font-weight="bold">任一真</text>
  <rect x="10" y="510" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="528" text-anchor="middle" font-size="11" fill="#333">不对称 / 不匹配</text>
  <text x="65" y="544" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- branch: all false -> j++ loop back -->
  <path d="M 470 445 L 510 445 L 510 285 L 410 300" stroke="#82b366" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="438" font-size="10" fill="#4a7a3a" font-weight="bold">皆假</text>
  <rect x="470" y="466" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="485" text-anchor="middle" font-size="11" fill="#333">j++</text>
  <path d="M 510 466 L 510 300" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="150" y="510" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="530" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每个字符最多被遍历两次（自身 + 作镜像）</text>
  <text x="340" y="548" text-anchor="middle" font-size="10" fill="#666">时间 O(Σ len(words[i])) = O(n·m)，空间 O(1)</text>
</svg>
