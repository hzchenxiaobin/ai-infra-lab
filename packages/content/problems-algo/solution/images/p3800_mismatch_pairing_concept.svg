<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：失配只分两类，修复只有三种「套餐」</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 1：s = 01000，t = 10111 → 4 个 A 型（蓝）+ 1 个 B 型（橙）</text>

  <!-- s / t 两行格子 -->
  <g filter="url(#rough2)">
    <text x="86" y="88" text-anchor="end" font-size="14" fill="#333" font-weight="bold">s</text>
    <text x="86" y="126" text-anchor="end" font-size="14" fill="#333" font-weight="bold">t</text>

    <!-- 列 0：A 型 -->
    <rect x="100" y="68" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="119" y="88" text-anchor="middle" font-size="13" fill="#33506b">0</text>
    <text x="119" y="126" text-anchor="middle" font-size="13" fill="#33506b">1</text>

    <!-- 列 1：B 型 -->
    <rect x="142" y="68" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="142" y="106" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="161" y="88" text-anchor="middle" font-size="13" fill="#8a6d1a">1</text>
    <text x="161" y="126" text-anchor="middle" font-size="13" fill="#8a6d1a">0</text>

    <!-- 列 2：A 型 -->
    <rect x="184" y="68" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="203" y="88" text-anchor="middle" font-size="13" fill="#33506b">0</text>
    <text x="203" y="126" text-anchor="middle" font-size="13" fill="#33506b">1</text>

    <!-- 列 3：A 型 -->
    <rect x="226" y="68" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="226" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="245" y="88" text-anchor="middle" font-size="13" fill="#33506b">0</text>
    <text x="245" y="126" text-anchor="middle" font-size="13" fill="#33506b">1</text>

    <!-- 列 4：A 型 -->
    <rect x="268" y="68" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="268" y="106" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="287" y="88" text-anchor="middle" font-size="13" fill="#33506b">0</text>
    <text x="287" y="126" text-anchor="middle" font-size="13" fill="#33506b">1</text>

    <!-- 每列失配类型 -->
    <text x="119" y="152" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">A</text>
    <text x="161" y="152" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">B</text>
    <text x="203" y="152" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">A</text>
    <text x="245" y="152" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">A</text>
    <text x="287" y="152" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">A</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="340" y="68" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="360" y="80" font-size="11.5" fill="#33506b">A 型：s=0, t=1（记作 a 个）</text>
    <rect x="340" y="96" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="360" y="108" font-size="11.5" fill="#8a6d1a">B 型：s=1, t=0（记作 b 个）</text>
    <rect x="340" y="124" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#a8a8a8" stroke-width="1.2"/>
    <text x="360" y="136" font-size="11.5" fill="#888">已匹配：碰它只会更贵</text>
  </g>

  <!-- 配对弧线 -->
  <g filter="url(#rough2)" fill="none" stroke-width="2">
    <path d="M 119 160 Q 140 182 161 160" stroke="#446688"/>
    <path d="M 203 160 Q 224 182 245 160" stroke="#d6a040"/>
    <path d="M 279 162 L 295 162" stroke="#b85450"/>
  </g>
  <g filter="url(#rough2)">
    <text x="140" y="196" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">异向对 ×1</text>
    <text x="224" y="196" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">同向对 ×1</text>
    <text x="287" y="196" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">落单 ×1</text>
  </g>

  <!-- 三种套餐 -->
  <g filter="url(#rough2)">
    <rect x="40" y="212" width="158" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="119" y="236" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">异向对（A + B）</text>
    <text x="119" y="256" text-anchor="middle" font-size="11" fill="#33506b">swap 一次，或 flip 两次</text>
    <text x="119" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">min(S, 2F)</text>

    <rect x="202" y="212" width="158" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="281" y="236" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">同向对（A+A / B+B）</text>
    <text x="281" y="256" text-anchor="middle" font-size="11" fill="#8a6d1a">cross 转性 + swap，或 flip×2</text>
    <text x="281" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">min(X+S, 2F)</text>

    <rect x="364" y="212" width="156" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="442" y="236" text-anchor="middle" font-size="12.5" fill="#a04340" font-weight="bold">落单（r 为奇数）</text>
    <text x="442" y="256" text-anchor="middle" font-size="11" fill="#a04340">swap / cross 都救不了</text>
    <text x="442" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">F</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="45" y="302" width="470" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="326" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">ans = min(a,b)·min(S, 2F) + ⌊r/2⌋·min(X+S, 2F) + (r mod 2)·F</text>
    <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#4a7a3a">r = |a−b|；示例 1：1×2 + 1×4 + 1×10 = 16 ✓</text>
  </g>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">F = flipCost，S = swapCost，X = crossCost</text>
</svg>
