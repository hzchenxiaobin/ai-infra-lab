<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：目标 (5,5) → 最少 4 步</text>
  <path d="M 260 40 Q 440 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="240" y="62" text-anchor="middle" font-size="11" fill="#888">格内数字 = 从 (0,0) 出发的骑士最短步数（BFS 层数）</text>

  <!-- column labels x=0..6 -->
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="112" y="76" text-anchor="middle">x=0</text>
    <text x="156" y="76" text-anchor="middle">1</text>
    <text x="200" y="76" text-anchor="middle">2</text>
    <text x="244" y="76" text-anchor="middle">3</text>
    <text x="288" y="76" text-anchor="middle">4</text>
    <text x="332" y="76" text-anchor="middle">5</text>
    <text x="376" y="76" text-anchor="middle">6</text>
  </g>
  <!-- row labels y=0..6 -->
  <g font-size="10" fill="#888" filter="url(#sk)">
    <text x="82" y="106" text-anchor="end">y=0</text>
    <text x="82" y="150" text-anchor="end">1</text>
    <text x="82" y="194" text-anchor="end">2</text>
    <text x="82" y="238" text-anchor="end">3</text>
    <text x="82" y="282" text-anchor="end">4</text>
    <text x="82" y="326" text-anchor="end">5</text>
    <text x="82" y="370" text-anchor="end">6</text>
  </g>

  <!-- 7x7 grid, cell=44, origin (90,80). cell (col x, row y) at (90+x*44, 80+y*44) -->
  <g font-size="13" filter="url(#sk)">
    <!-- Row 0: [0,3,2,3,2,3,4] -->
    <rect x="90" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/><text x="112" y="108" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <rect x="134" y="80" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="156" y="108" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="80" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="200" y="108" text-anchor="middle" fill="#446688">2</text>
    <rect x="222" y="80" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="244" y="108" text-anchor="middle" fill="#446688">3</text>
    <rect x="266" y="80" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="288" y="108" text-anchor="middle" fill="#446688">2</text>
    <rect x="310" y="80" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="332" y="108" text-anchor="middle" fill="#446688">3</text>
    <rect x="354" y="80" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="376" y="108" text-anchor="middle" fill="#d6a040">4</text>
    <!-- Row 1: [3,2,1,2,3,4,3] -->
    <rect x="90" y="124" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="112" y="152" text-anchor="middle" fill="#446688">3</text>
    <rect x="134" y="124" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="156" y="152" text-anchor="middle" fill="#446688">2</text>
    <rect x="178" y="124" width="44" height="44" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5"/><text x="200" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="222" y="124" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="244" y="152" text-anchor="middle" fill="#446688">2</text>
    <rect x="266" y="124" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="288" y="152" text-anchor="middle" fill="#446688">3</text>
    <rect x="310" y="124" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="332" y="152" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="354" y="124" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="376" y="152" text-anchor="middle" fill="#446688">3</text>
    <!-- Row 2: [2,1,4,3,2,3,4] -->
    <rect x="90" y="168" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="112" y="196" text-anchor="middle" fill="#446688">2</text>
    <rect x="134" y="168" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="156" y="196" text-anchor="middle" fill="#446688">1</text>
    <rect x="178" y="168" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="200" y="196" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="222" y="168" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="244" y="196" text-anchor="middle" fill="#446688">3</text>
    <rect x="266" y="168" width="44" height="44" fill="#d4e8fa" stroke="#b85450" stroke-width="2.5"/><text x="288" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="310" y="168" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="332" y="196" text-anchor="middle" fill="#446688">3</text>
    <rect x="354" y="168" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="376" y="196" text-anchor="middle" fill="#d6a040">4</text>
    <!-- Row 3: [3,2,3,2,3,4,3] -->
    <rect x="90" y="212" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="112" y="240" text-anchor="middle" fill="#446688">3</text>
    <rect x="134" y="212" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="156" y="240" text-anchor="middle" fill="#446688">2</text>
    <rect x="178" y="212" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="200" y="240" text-anchor="middle" fill="#446688">3</text>
    <rect x="222" y="212" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="244" y="240" text-anchor="middle" fill="#446688">2</text>
    <rect x="266" y="212" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="288" y="240" text-anchor="middle" fill="#446688">3</text>
    <rect x="310" y="212" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="332" y="240" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="354" y="212" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="376" y="240" text-anchor="middle" fill="#446688">3</text>
    <!-- Row 4: [2,3,2,3,4,3,4] -->
    <rect x="90" y="256" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="112" y="284" text-anchor="middle" fill="#446688">2</text>
    <rect x="134" y="256" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="156" y="284" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="256" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="200" y="284" text-anchor="middle" fill="#446688">2</text>
    <rect x="222" y="256" width="44" height="44" fill="#c0d8f0" stroke="#b85450" stroke-width="2.5"/><text x="244" y="284" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="266" y="256" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="288" y="284" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="310" y="256" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="332" y="284" text-anchor="middle" fill="#446688">3</text>
    <rect x="354" y="256" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="376" y="284" text-anchor="middle" fill="#d6a040">4</text>
    <!-- Row 5: [3,4,3,4,3,4,5] -->
    <rect x="90" y="300" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="112" y="328" text-anchor="middle" fill="#446688">3</text>
    <rect x="134" y="300" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="156" y="328" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="178" y="300" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="200" y="328" text-anchor="middle" fill="#446688">3</text>
    <rect x="222" y="300" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="244" y="328" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="266" y="300" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="288" y="328" text-anchor="middle" fill="#446688">3</text>
    <rect x="310" y="300" width="44" height="44" fill="#fff8e1" stroke="#b85450" stroke-width="2.5"/><text x="332" y="328" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="354" y="300" width="44" height="44" fill="#fce4ec" stroke="#b85450"/><text x="376" y="328" text-anchor="middle" fill="#b85450">5</text>
    <!-- Row 6: [4,3,4,3,4,5,4] -->
    <rect x="90" y="344" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="112" y="372" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="134" y="344" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="156" y="372" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="344" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="200" y="372" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="222" y="344" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="244" y="372" text-anchor="middle" fill="#446688">3</text>
    <rect x="266" y="344" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="288" y="372" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="310" y="344" width="44" height="44" fill="#fce4ec" stroke="#b85450"/><text x="332" y="372" text-anchor="middle" fill="#b85450">5</text>
    <rect x="354" y="344" width="44" height="44" fill="#fff8e1" stroke="#d6a040"/><text x="376" y="372" text-anchor="middle" fill="#d6a040">4</text>
  </g>

  <!-- path arrows (0,0)->(2,1)->(4,2)->(3,4)->(5,5), centers -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2.2" fill="none">
    <path d="M 134 124 L 188 146" marker-end="url(#ar3)"/>
    <path d="M 222 146 L 276 190" marker-end="url(#ar3)"/>
    <path d="M 288 212 L 250 256" marker-end="url(#ar3)"/>
    <path d="M 266 284 L 320 300" marker-end="url(#ar3)"/>
  </g>

  <!-- legend + path table on right -->
  <g filter="url(#sk)">
    <rect x="430" y="80" width="410" height="308" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="635" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">最短路径（红色高亮）</text>

  <g font-size="11" filter="url(#sk)">
    <!-- legend swatches -->
    <rect x="448" y="120" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="472" y="133" font-size="10" fill="#444">d=0 起点</text>
    <rect x="556" y="120" width="16" height="16" fill="#e8f0fe" stroke="#446688"/><text x="580" y="133" font-size="10" fill="#444">d=1</text>
    <rect x="640" y="120" width="16" height="16" fill="#d4e8fa" stroke="#446688"/><text x="664" y="133" font-size="10" fill="#444">d=2</text>
    <rect x="722" y="120" width="16" height="16" fill="#c0d8f0" stroke="#446688"/><text x="746" y="133" font-size="10" fill="#444">d=3</text>
    <rect x="448" y="146" width="16" height="16" fill="#fff8e1" stroke="#d6a040"/><text x="472" y="159" font-size="10" fill="#444">d=4</text>
    <rect x="556" y="146" width="16" height="16" fill="#fce4ec" stroke="#b85450"/><text x="580" y="159" font-size="10" fill="#444">d=5</text>
  </g>

  <!-- path steps table -->
  <text x="448" y="192" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">逐步路径：</text>
  <g font-size="11" fill="#444" filter="url(#sk)">
    <text x="448" y="216">① 步0：(0,0) 起点</text>
    <text x="640" y="216" fill="#888">—</text>
    <text x="448" y="240">② 步1：(2,1) 走 (2,+1)</text>
    <text x="640" y="240" fill="#4a8e4a">Δ=(2,1)</text>
    <text x="448" y="264">③ 步2：(4,2) 走 (2,+1)</text>
    <text x="640" y="264" fill="#4a8e4a">Δ=(2,1)</text>
    <text x="448" y="288">④ 步3：(3,4) 走 (−1,+2)</text>
    <text x="640" y="288" fill="#4a8e4a">Δ=(-1,2)</text>
    <text x="448" y="312">⑤ 步4：(5,5) 到达 ✓</text>
    <text x="640" y="312" fill="#4a8e4a">Δ=(2,1)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="448" y="332" width="374" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="635" y="354" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">下界验证：ceil(5/2)=3，ceil(10/3)=4</text>
  <text x="635" y="370" text-anchor="middle" font-size="10" fill="#444" filter="url(#sk)">奇偶：4 步与 (5+5)=10 同偶 → 4 步可达</text>
</svg>
