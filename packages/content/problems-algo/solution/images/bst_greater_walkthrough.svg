<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [3,2,4,1]（示例 4）</text>

  <!-- 左：原 BST -->
  <text x="40" y="56" font-size="12" fill="#888">原 BST：</text>

  <line x1="138" y1="92" x2="175" y2="132" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="122" y1="92" x2="98" y2="132" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="152" x2="66" y2="192" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="130" cy="80" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="95" cy="140" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>

  <circle cx="170" cy="140" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="144" text-anchor="middle" font-size="11" fill="#333">4</text>

  <circle cx="65" cy="200" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="204" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 反序中序访问顺序标注 -->
  <text x="40" y="232" font-size="11" fill="#888">访问顺序：4 → 3 → 2 → 1</text>

  <!-- 右：逐步演变 -->
  <text x="290" y="56" font-size="12" fill="#888">逐步演变：</text>

  <!-- ① 访问 4 -->
  <text x="290" y="84" font-size="11" fill="#d6a040" font-weight="bold">① 访问 4</text>
  <rect x="290" y="90" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="10" fill="#333">4</text>
  <path d="M 324 102 L 348 102" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="96" font-size="9" fill="#888">sum=4</text>
  <rect x="352" y="90" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="369" y="106" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="396" y="106" font-size="10" fill="#555">原 4 → 新 4</text>

  <!-- ② 访问 3 -->
  <text x="290" y="128" font-size="11" fill="#b85450" font-weight="bold">② 访问 3</text>
  <rect x="290" y="134" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="150" text-anchor="middle" font-size="10" fill="#333">3</text>
  <path d="M 324 140 L 348 140" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="134" font-size="9" fill="#888">sum=7</text>
  <rect x="352" y="134" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="369" y="150" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="396" y="150" font-size="10" fill="#555">原 3 → 新 7</text>

  <!-- ③ 访问 2 -->
  <text x="290" y="172" font-size="11" fill="#446688" font-weight="bold">③ 访问 2</text>
  <rect x="290" y="178" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="194" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 324 184 L 348 184" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="178" font-size="9" fill="#888">sum=9</text>
  <rect x="352" y="178" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="369" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="396" y="194" font-size="10" fill="#555">原 2 → 新 9</text>

  <!-- ④ 访问 1 -->
  <text x="290" y="216" font-size="11" fill="#446688" font-weight="bold">④ 访问 1</text>
  <rect x="290" y="222" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="238" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 324 228 L 348 228" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="222" font-size="9" fill="#888">sum=10</text>
  <rect x="352" y="222" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="369" y="238" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <text x="396" y="238" font-size="10" fill="#555">原 1 → 新 10</text>

  <!-- 结果累加树 -->
  <text x="40" y="268" font-size="12" fill="#888">累加树（Greater Tree）：</text>

  <line x1="138" y1="304" x2="175" y2="344" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="122" y1="304" x2="98" y2="344" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="364" x2="66" y2="388" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="130" cy="292" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <circle cx="95" cy="352" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>

  <circle cx="170" cy="352" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <circle cx="65" cy="392" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="396" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">10</text>

  <!-- 从步骤到结果树的指引 -->
  <path d="M 386 246 L 200 318" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 结果标注 -->
  <text x="300" y="300" font-size="11" fill="#b85450" font-weight="bold">输出 [7,9,4,10] ✓</text>

  <!-- 说明框 -->
  <rect x="240" y="318" width="320" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="256" y="340" font-size="11" fill="#333" font-weight="bold">反序中序逐节点：sum += val 后写回</text>
  <text x="256" y="358" font-size="11" fill="#555">访问 4 时 sum=4，访问 3 时 sum=7……</text>
  <text x="256" y="376" font-size="11" fill="#b85450" font-weight="bold">每个新值 = 自身 + 所有更大值之和</text>
</svg>
