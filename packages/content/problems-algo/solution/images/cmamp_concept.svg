<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后相邻差恒定 → 等差数列</text>

  <!-- ===== Original unsorted array ===== -->
  <text x="40" y="62" font-size="12" fill="#888">原始数组（无序）</text>

  <rect x="76" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="136" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="196" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- sort arrow -->
  <path d="M 280 87 L 330 87" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">排序</text>

  <!-- ===== Sorted array ===== -->
  <text x="40" y="132" font-size="12" fill="#888">排序后</text>

  <rect x="76" y="140" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="136" y="140" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="196" y="140" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- diff brackets below sorted -->
  <path d="M 106 178 L 106 184 L 166 184 L 166 178" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="136" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d = 2</text>
  <path d="M 166 178 L 166 184 L 226 184 L 226 178" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="196" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d = 2</text>

  <!-- ===== Check result ===== -->
  <rect x="76" y="214" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="196" y="239" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">差值恒为 2 → true ✓</text>

  <!-- ===== Counter example ===== -->
  <text x="320" y="62" font-size="12" fill="#888">反例</text>

  <rect x="340" y="70" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="390" y="70" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="440" y="70" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- diffs for counter example -->
  <path d="M 365 108 L 365 114 L 415 114 L 415 108" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d=1</text>
  <path d="M 415 108 L 415 114 L 465 114 L 465 108" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d=2</text>

  <rect x="340" y="140" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="165" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">差值不等 → false ✗</text>

  <!-- Core idea box -->
  <rect x="40" y="276" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键直觉：等差数列排序后必然均匀分布</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#666">只需排序后检查 arr[i] − arr[i−1] 是否恒等于 d = arr[1] − arr[0]</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#888">排序把"可重排"的自由度消掉，转化为"逐对验证"</text>
</svg>
