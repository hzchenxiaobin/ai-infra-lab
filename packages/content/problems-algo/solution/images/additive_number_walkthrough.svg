<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算："199100199" → i=1, j=2：1, 99, 100, 199</text>

  <!-- input string with index ruler -->
  <text x="40" y="56" font-size="11" fill="#888">num:</text>
  <text x="108" y="44" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="150" y="44" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="192" y="44" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="234" y="44" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="276" y="44" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="318" y="44" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="360" y="44" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="402" y="44" text-anchor="middle" font-size="9" fill="#bbb">7</text>
  <text x="444" y="44" text-anchor="middle" font-size="9" fill="#bbb">8</text>

  <!-- 9 digit cells -->
  <rect x="88" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <rect x="172" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="74" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <rect x="214" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>
  <rect x="256" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="74" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <rect x="298" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="74" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <rect x="340" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="74" text-anchor="middle" font-size="15" fill="#bbb">1</text>
  <rect x="382" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="402" y="74" text-anchor="middle" font-size="15" fill="#bbb">9</text>
  <rect x="424" y="50" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="74" text-anchor="middle" font-size="15" fill="#bbb">9</text>

  <!-- bracket: a=num[0:1], b=num[1:3] -->
  <path d="M 88 90 L 88 96 L 128 96 L 128 90" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="108" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a = "1"</text>
  <path d="M 130 90 L 130 100 L 212 100 L 212 90" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="171" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = "99"</text>

  <!-- ===== Step 1: z = 1 + 99 = 100 ===== -->
  <text x="40" y="148" font-size="12" fill="#b85450" font-weight="bold">第 1 步：z = 1 + 99 = 100</text>
  <text x="44" y="178" font-size="11" fill="#888">求和：</text>
  <rect x="100" y="162" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="160" y="184" font-size="13" fill="#666" font-weight="bold">+</text>
  <rect x="176" y="162" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">99</text>
  <text x="236" y="184" font-size="13" fill="#666" font-weight="bold">=</text>
  <rect x="252" y="162" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="288" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">100</text>

  <text x="340" y="184" font-size="11" fill="#666">检查 num[3:6]</text>
  <!-- check cells 3,4,5 -->
  <rect x="214" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="298" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="234" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="318" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="276" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="362" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">idx = 3 → 6 ✓</text>
  <text x="362" y="240" font-size="10" fill="#888">x=99, y=100</text>

  <!-- ===== Step 2: z = 99 + 100 = 199 ===== -->
  <text x="40" y="278" font-size="12" fill="#b85450" font-weight="bold">第 2 步：z = 99 + 100 = 199</text>
  <text x="44" y="308" font-size="11" fill="#888">求和：</text>
  <rect x="100" y="292" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">99</text>
  <text x="160" y="314" font-size="13" fill="#666" font-weight="bold">+</text>
  <rect x="176" y="292" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">100</text>
  <text x="236" y="314" font-size="13" fill="#666" font-weight="bold">=</text>
  <rect x="252" y="292" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="288" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">199</text>

  <text x="340" y="314" font-size="11" fill="#666">检查 num[6:9]</text>
  <!-- check cells 6,7,8 -->
  <rect x="340" y="332" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="382" y="332" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="424" y="332" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="354" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <text x="360" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="402" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="444" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">匹配 ✓</text>
  <text x="480" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">idx = 6 → 9 ✓</text>
  <text x="480" y="370" font-size="10" fill="#888">x=100, y=199</text>

  <!-- ===== Termination ===== -->
  <text x="40" y="408" font-size="12" fill="#b85450" font-weight="bold">终止：idx = 9 = n，整串恰好耗尽</text>

  <!-- full sequence highlight -->
  <text x="40" y="438" font-size="11" fill="#888">完整序列：</text>
  <rect x="110" y="422" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="152" y="422" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">99</text>
  <rect x="214" y="422" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>
  <rect x="276" y="422" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="444" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">199</text>
  <text x="346" y="444" font-size="11" fill="#b85450" font-weight="bold">return True ✓</text>

  <!-- ===== Failure example ===== -->
  <rect x="40" y="472" width="510" height="128" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="496" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">反例：同串尝试 i=1, j=1（a="1", b="9"）</text>
  <text x="295" y="518" text-anchor="middle" font-size="11" fill="#666">z = 1 + 9 = 10，检查 num[2:4] = "91" ≠ "10" → 匹配失败，break</text>
  <text x="295" y="538" text-anchor="middle" font-size="11" fill="#666">继续尝试其他 (i, j) 组合，直到 i=1, j=2 命中</text>
  <text x="295" y="562" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">前导零剪枝：若 j &gt; 1 且 num[i] == '0'，直接跳过该组</text>
  <text x="295" y="582" text-anchor="middle" font-size="10" fill="#888">例：num = "1023"，i=1, j=2 → b = "02" 前导零非法，跳过</text>
</svg>
