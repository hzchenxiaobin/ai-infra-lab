<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix = [[0,0,0],[0,0,1],[1,1,0]]</text>

  <!-- Table panel -->
  <rect x="16" y="40" width="528" height="180" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <text x="42" y="68" font-size="11" fill="#888" font-weight="bold">行</text>
  <text x="108" y="68" font-size="11" fill="#888" font-weight="bold">原行</text>
  <text x="244" y="68" font-size="11" fill="#888" font-weight="bold">row[0]</text>
  <text x="304" y="68" font-size="11" fill="#888" font-weight="bold">规范键 (⊕row[0])</text>
  <text x="452" y="68" font-size="11" fill="#888" font-weight="bold">计数</text>
  <line x1="24" y1="76" x2="536" y2="76" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: [0,0,0] -->
  <text x="44" y="108" font-size="11" fill="#555">r0</text>
  <rect x="100" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="128" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="156" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="262" y="108" font-size="12" fill="#555">0</text>
  <rect x="300" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="328" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="356" y="92" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="460" y="108" font-size="12" fill="#888">1</text>

  <!-- row 1: [0,0,1] -->
  <text x="44" y="144" font-size="11" fill="#555">r1</text>
  <rect x="100" y="128" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="128" y="128" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="156" y="128" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="262" y="144" font-size="12" fill="#555">0</text>
  <rect x="300" y="128" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="328" y="128" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="356" y="128" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="460" y="144" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 2: [1,1,0] -> key [0,0,1] -->
  <text x="44" y="180" font-size="11" fill="#555">r2</text>
  <rect x="100" y="164" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="128" y="164" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="156" y="164" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="262" y="180" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="288" y="180" font-size="9" fill="#b85450">取反→</text>
  <rect x="316" y="164" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="344" y="164" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="372" y="164" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="460" y="180" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="40" y="208" font-size="10" fill="#4a7a3a">r1=[0,0,1] 与 r2=[1,1,0] 互补 → 规范键同为 [0,0,1]，归一组，计数 2</text>

  <!-- bottom: flip result -->
  <rect x="16" y="226" width="528" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">翻转前两列后：r1、r2 同变全等</text>

  <text x="150" y="278" font-size="10" fill="#888">翻转前两列</text>
  <line x1="222" y1="274" x2="252" y2="274" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="278" font-size="10" fill="#888">结果矩阵</text>

  <text x="200" y="306" font-size="9" fill="#888">r0</text>
  <rect x="239" y="292" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="306" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="267" y="292" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="295" y="292" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="308" y="306" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="332" y="306" font-size="10" fill="#888">不全等</text>

  <text x="200" y="330" font-size="9" fill="#888">r1</text>
  <rect x="239" y="316" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="267" y="316" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="295" y="316" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="332" y="330" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 全等</text>

  <text x="200" y="354" font-size="9" fill="#888">r2</text>
  <rect x="239" y="340" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="267" y="340" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="295" y="340" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="332" y="354" font-size="11" fill="#d6a040" font-weight="bold">✓ 全等</text>

  <text x="440" y="318" font-size="13" fill="#b85450" font-weight="bold">答案 = 2</text>
  <text x="416" y="336" font-size="10" fill="#888">最大等价类大小</text>
</svg>
