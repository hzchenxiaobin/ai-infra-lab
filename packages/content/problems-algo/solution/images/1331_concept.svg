<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：排序去重 + 哈希映射 = 离散化</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">名次 = 该值在「排序去重序列」中的位置（从 1 起），相同值同名次</text>

  <!-- Row 1: original array -->
  <text x="80" y="86" font-size="11" fill="#446688" font-weight="bold">原数组 arr</text>
  <g font-size="13">
    <rect x="158" y="74" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="188" y="97" text-anchor="middle" fill="#446688" font-weight="bold">40</text>
    <rect x="226" y="74" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="256" y="97" text-anchor="middle" fill="#446688" font-weight="bold">10</text>
    <rect x="294" y="74" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="324" y="97" text-anchor="middle" fill="#446688" font-weight="bold">20</text>
    <rect x="362" y="74" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="392" y="97" text-anchor="middle" fill="#446688" font-weight="bold">30</text>
  </g>

  <!-- arrow down: sort + unique -->
  <path d="M 290 116 L 290 150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="138" font-size="10" fill="#888">排序 + 去重</text>

  <!-- Row 2: sorted unique + ranks -->
  <text x="60" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">排序去重序列</text>
  <g font-size="13">
    <rect x="158" y="164" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="188" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="226" y="164" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="256" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">20</text>
    <rect x="294" y="164" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="324" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">30</text>
    <rect x="362" y="164" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="392" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">40</text>
  </g>
  <!-- rank labels below -->
  <g font-size="11" fill="#d6a040" font-weight="bold">
    <text x="188" y="216" text-anchor="middle">名次 1</text>
    <text x="256" y="216" text-anchor="middle">名次 2</text>
    <text x="324" y="216" text-anchor="middle">名次 3</text>
    <text x="392" y="216" text-anchor="middle">名次 4</text>
  </g>

  <!-- arrow down: build hash map -->
  <path d="M 290 226 L 290 260" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="248" font-size="10" fill="#888">建哈希表 {值: 名次}</text>

  <!-- Row 3: hash map entries -->
  <g font-size="11" fill="#333" font-family="monospace">
    <rect x="120" y="268" width="340" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="290" y="287" text-anchor="middle">{10:1, 20:2, 30:3, 40:4}</text>
  </g>

  <!-- arrow down: lookup each element -->
  <path d="M 290 300 L 290 332" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="320" font-size="10" fill="#888">逐元素查表</text>

  <!-- Row 4: result -->
  <text x="80" y="358" font-size="11" fill="#b85450" font-weight="bold">结果 result</text>
  <g font-size="13">
    <rect x="158" y="346" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="188" y="369" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="226" y="346" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="256" y="369" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="294" y="346" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="324" y="369" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="362" y="346" width="60" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="392" y="369" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="396" width="500" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="417" text-anchor="middle" font-size="11" fill="#444">排序去重后下标即名次：相同值落同位 → 天然同名次</text>
</svg>
