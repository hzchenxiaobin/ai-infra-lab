<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每个盒子的水果 = 直接存放 + 箱子里的水果（LEFT JOIN）</text>

  <!-- ===== Left box: no chest ===== -->
  <text x="64" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">盒子 2（chest_id = NULL）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="170" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="52" y="90">直接存放：</text>
    <!-- apples -->
    <circle cx="58" cy="106" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="70" cy="106" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="84" y="110" fill="#b85450" font-weight="bold">苹果 6</text>
    <!-- oranges -->
    <circle cx="58" cy="124" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="70" cy="124" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="84" y="128" fill="#d6a040" font-weight="bold">橘子 15</text>
  </g>
  <!-- no chest slot -->
  <g filter="url(#rough2)">
    <rect x="52" y="140" width="146" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="125" y="161" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">无箱子 → IFNULL(NULL,0)=0</text>
  <!-- total -->
  <g filter="url(#rough2)">
    <rect x="52" y="186" width="146" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="12"/>
  </g>
  <text x="125" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 🍎6 · 🍊15</text>

  <!-- ===== Right box: with chest ===== -->
  <text x="352" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">盒子 18（chest_id = 14）</text>
  <g filter="url(#rough2)">
    <rect x="328" y="66" width="210" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="340" y="90">直接存放：</text>
    <circle cx="346" cy="106" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="360" y="110" fill="#b85450" font-weight="bold">苹果 4</text>
    <circle cx="346" cy="124" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="360" y="128" fill="#d6a040" font-weight="bold">橘子 15</text>
  </g>
  <!-- chest inside -->
  <g filter="url(#rough2)">
    <rect x="438" y="92" width="92" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
  </g>
  <text x="484" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">箱子 14</text>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <circle cx="448" cy="122" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="458" y="125" fill="#b85450">苹果 20</text>
    <circle cx="448" cy="138" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="458" y="141" fill="#d6a040">橘子 10</text>
  </g>
  <text x="484" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">JOIN 挂载上来</text>
  <!-- total -->
  <g filter="url(#rough2)">
    <rect x="340" y="186" width="186" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="12"/>
  </g>
  <text x="433" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 🍎4+20=24 · 🍊15+10=25</text>

  <!-- join arrow from chest to box -->
  <path d="M 438 135 L 408 135" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="424" y="128" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">JOIN</text>

  <!-- ===== LEFT JOIN explanation ===== -->
  <rect x="40" y="226" width="500" height="70" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="246" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">LEFT JOIN Chests c ON b.chest_id = c.chest_id</text>
  <text x="52" y="264" font-size="10" fill="#555" filter="url(#rough2)">• 左表 Boxes 全保留——无箱子的盒子仍在，c.* 列填 NULL</text>
  <text x="52" y="280" font-size="10" fill="#555" filter="url(#rough2)">• IFNULL(c.apple_count, 0) 把 NULL 折成 0 → 无箱子的盒子只算直接存放</text>

  <!-- ===== IFNULL contrast ===== -->
  <rect x="40" y="308" width="244" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="328" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 不能用 INNER JOIN</text>
  <text x="56" y="346" font-size="10" fill="#555" filter="url(#rough2)">INNER JOIN 会丢掉</text>
  <text x="56" y="360" font-size="10" fill="#555" filter="url(#rough2)">chest_id=NULL 的盒子 2</text>

  <rect x="296" y="308" width="244" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="328" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ LEFT JOIN + IFNULL</text>
  <text x="312" y="346" font-size="10" fill="#555" filter="url(#rough2)">保留所有盒子，NULL→0</text>
  <text x="312" y="360" font-size="10" fill="#555" filter="url(#rough2)">正确统计全部水果</text>

  <!-- ===== Bottom: SUM result ===== -->
  <rect x="40" y="382" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="404" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">最终：对每个盒子算 (b.apple + IFNULL(c.apple,0))，再 SUM 聚合全部盒子</text>
  <g filter="url(#rough2)">
    <rect x="80" y="416" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="12"/>
  </g>
  <text x="170" y="434" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">SUM(apple_count) = 151</text>
  <g filter="url(#rough2)">
    <rect x="300" y="416" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="12"/>
  </g>
  <text x="390" y="434" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">SUM(orange_count) = 123</text>
</svg>
