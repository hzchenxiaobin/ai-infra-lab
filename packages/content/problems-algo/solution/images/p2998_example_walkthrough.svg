<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：x = 54, y = 2 —— BFS 第 4 层命中目标</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最优路径 54 → 55 → 5 → 1 → 2，对比纯 −1 的 52 步</text>

  <!-- path boxes -->
  <rect x="45" y="58" width="58" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="74" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">54</text>
  <rect x="147" y="58" width="58" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">55</text>
  <rect x="249" y="58" width="58" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="351" y="58" width="58" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="453" y="58" width="58" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- arrows with op labels -->
  <path d="M 105 75 L 145 75" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="125" y="68" text-anchor="middle" font-size="10" fill="#8a6420" font-weight="bold" filter="url(#rough2)">① +1</text>
  <path d="M 207 75 L 247 75" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="227" y="68" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">② ÷11</text>
  <path d="M 309 75 L 349 75" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="329" y="68" text-anchor="middle" font-size="10" fill="#8a6420" font-weight="bold" filter="url(#rough2)">③ ÷5</text>
  <path d="M 411 75 L 451 75" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="431" y="68" text-anchor="middle" font-size="10" fill="#8a6420" font-weight="bold" filter="url(#rough2)">④ +1</text>

  <!-- role labels -->
  <text x="74" y="106" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">起点</text>
  <text x="176" y="106" text-anchor="middle" font-size="9.5" fill="#8a6420" filter="url(#rough2)">凑倍数</text>
  <text x="278" y="106" text-anchor="middle" font-size="9.5" fill="#8a6420" filter="url(#rough2)">跳板</text>
  <text x="380" y="106" text-anchor="middle" font-size="9.5" fill="#8a6420" filter="url(#rough2)">低于 y</text>
  <text x="482" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">终点 ✓</text>

  <!-- table -->
  <rect x="40" y="124" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">值 v</text>
  <text x="177" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dist[v]</text>
  <text x="352" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">来源与说明</text>
  <rect x="40" y="124" width="440" height="156" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 130 124 L 130 280 M 225 124 L 225 280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 150 L 480 150 M 40 176 L 480 176 M 40 202 L 480 202 M 40 228 L 480 228 M 40 254 L 480 254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="254" width="440" height="26" fill="#e6f4ea" filter="url(#rough2)"/>

  <text x="85" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">54</text>
  <text x="177" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="352" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">BFS 起点</text>

  <text x="85" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">55</text>
  <text x="177" y="194" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="352" y="194" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">54 + 1：凑成 11 的倍数（跳板入口）</text>

  <text x="85" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="177" y="220" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="352" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">55 ÷ 11：一步顶 50 步</text>

  <text x="85" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="177" y="246" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="352" y="246" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5 ÷ 5：下探到 y 之下（下界是 1 不是 y）</text>

  <text x="85" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="177" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="352" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 + 1：命中 y，返回 4 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="298" width="440" height="72" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对比：纯 −1 要 52 步；BFS 借跳板只走 4 层</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">彩蛋：x = 10000, y = 1 答案仅 8 步：10000→2000→400→80→16→15→3→2→1</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">形态提示：最优路径可先上后下、下探再折返——别把值域下界错设成 y</text>
</svg>
