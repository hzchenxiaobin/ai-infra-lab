<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：分组 → 各自排序 → 回填</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">O(n) 分组 + O(n log n) 排序 + O(n) 回填</text>

  <!-- Step 1: 输入 nums -->
  <rect x="170" y="60" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums[0..n-1]</text>

  <path d="M 260 100 L 260 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 分组 -->
  <rect x="130" y="122" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按下标奇偶性分组</text>
  <text x="260" y="156" text-anchor="middle" font-size="10" fill="#888">i % 2 == 0 → even；i % 2 == 1 → odd</text>

  <!-- split into two branches -->
  <path d="M 200 168 L 130 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 168 L 390 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3a: even sort -->
  <rect x="60" y="192" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">even 升序排序</text>
  <text x="140" y="228" text-anchor="middle" font-size="10" fill="#555">sort(even)  非递减 ↑</text>
  <text x="140" y="240" text-anchor="middle" font-size="9.5" fill="#888">O(n/2 · log n/2)</text>

  <!-- Step 3b: odd sort -->
  <rect x="300" y="192" width="160" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="212" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">odd 降序排序</text>
  <text x="380" y="228" text-anchor="middle" font-size="10" fill="#555">sort(odd, reverse)  非递增 ↓</text>
  <text x="380" y="240" text-anchor="middle" font-size="9.5" fill="#888">O(n/2 · log n/2)</text>

  <!-- merge arrows -->
  <path d="M 140 244 L 220 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 244 L 300 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 回填 -->
  <rect x="130" y="266" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回填原位置</text>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#888">偶数下标 ← even[ei++]；奇数下标 ← odd[oi++]</text>

  <path d="M 260 312 L 260 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 返回 -->
  <rect x="150" y="334" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回重排后的 nums</text>
</svg>
