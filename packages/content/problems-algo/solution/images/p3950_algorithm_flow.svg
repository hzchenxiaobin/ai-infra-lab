<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">流程：掩码 → 数 1 → 比 1，三条字级指令收工</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="160" y="38" width="200" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="58" text-anchor="middle" font-size="12" fill="#2f5d24">输入 n（0 ≤ n ≤ 10⁵）</text>
  </g>
  <path d="M260,70 L260,90" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 掩码 -->
  <g filter="url(#rough2)">
    <rect x="160" y="96" width="200" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="116" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">m ← n &amp; (n &gt;&gt; 1)</text>
    <text x="376" y="106" font-size="9.5" fill="#33506b">相邻对掩码：m 第 i 位 = 1</text>
    <text x="376" y="121" font-size="9.5" fill="#33506b">⟺ n 第 i、i+1 位同为 1</text>
  </g>
  <path d="M260,128 L260,148" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- popcount -->
  <g filter="url(#rough2)">
    <rect x="160" y="154" width="200" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="174" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">cnt ← popcount(m)</text>
    <text x="376" y="164" font-size="9.5" fill="#33506b">C++：__builtin_popcount</text>
    <text x="376" y="179" font-size="9.5" fill="#33506b">Python：m.bit_count()</text>
  </g>
  <path d="M260,186 L260,206" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <g filter="url(#rough2)">
    <polygon points="260,212 348,252 260,292 172,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="260" y="257" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold">cnt == 1 ?</text>
  </g>

  <!-- 是 → true -->
  <g filter="url(#rough2)">
    <path d="M348,252 L394,252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="370" y="245" text-anchor="middle" font-size="10.5" fill="#2f5d24">是</text>
    <rect x="400" y="236" width="96" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="448" y="256" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">返回 true</text>
  </g>

  <!-- 否 → false -->
  <g filter="url(#rough2)">
    <path d="M172,252 L126,252" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <text x="148" y="245" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
    <rect x="24" y="236" width="96" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="72" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="20" y="310" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="326" text-anchor="middle" font-size="10" fill="#555">n = 0、1、2 ⇒ m = 0 ⇒ cnt = 0 ⇒ 直接落「否」分支，全程零特判</text>
    <text x="260" y="343" text-anchor="middle" font-size="10" fill="#8a3030">n = 7（111）⇒ cnt = 2 ⇒ false：重叠的两对都计入</text>
  </g>
</svg>
