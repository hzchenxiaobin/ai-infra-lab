<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程：逐位比较右边</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0, i = 0</text>

  <!-- arrow down -->
  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="260,104 380,150 260,196 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#666">(还有字符)</text>

  <!-- No branch -> end -->
  <path d="M 380 150 L 430 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="460" cy="150" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="154" text-anchor="middle" font-size="11" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 260 196 L 260 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="210" font-size="11" fill="#82b366">是</text>

  <!-- v = val[s[i]] -->
  <rect x="190" y="218" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333">v = val[s[i]]</text>

  <path d="M 260 252 L 260 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i+1 < n and v < val[s[i+1]] ? -->
  <polygon points="260,274 410,330 260,386 110,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333">v &lt; 右边值 ?</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666">(i+1&lt;n 且 v&lt;val[s[i+1]])</text>

  <!-- Yes (subtract) branch -> left -->
  <path d="M 110 330 L 56 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="322" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="20" y="310" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="335" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans</text>
  <text x="40" y="348" text-anchor="middle" font-size="10" fill="#b85450">-= v</text>

  <!-- No (add) branch -> right -->
  <path d="M 410 330 L 464 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="322" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <rect x="460" y="310" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="335" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans</text>
  <text x="480" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a">+= v</text>

  <!-- both branches converge down -->
  <path d="M 40 350 L 40 406 L 260 406" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 480 350 L 480 406 L 260 406" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- i++ node -->
  <rect x="200" y="400" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- loop back arrow to decision top -->
  <path d="M 260 400 L 260 396 L 460 396 L 460 62 L 360 62" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 470 230)">回到循环</text>

  <!-- summary note -->
  <text x="260" y="466" text-anchor="middle" font-size="11" fill="#888">关键：只需比较当前位与右边一位，无需预读两位子串</text>
</svg>
