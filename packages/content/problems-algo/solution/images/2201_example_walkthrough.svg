<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：从 dig 构造集合，逐工件核对</text>

  <!-- ====== Example 1 (left) ====== -->
  <text x="140" y="48" text-anchor="middle" font-size="12" fill="#888">示例1：n=2, dig=[(0,0),(0,1)] → 输出 1</text>

  <!-- 2x2 grid, cell 52x52, origin (84, 62) -->
  <!-- A: (0,0) red -->
  <rect x="84" y="62" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- B: (0,1),(1,1) blue -->
  <rect x="136" y="62" width="52" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- (1,0) empty -->
  <rect x="84" y="114" width="52" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- D marks -->
  <text x="110" y="96" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">D</text>
  <text x="162" y="96" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">D</text>
  <text x="162" y="150" text-anchor="middle" font-size="12" fill="#ccc">·</text>

  <!-- verdict lines -->
  <text x="84" y="186" font-size="11" fill="#b85450" font-weight="bold">A=(0,0):</text>
  <text x="84" y="202" font-size="11" fill="#4a7a3a">  (0,0)∈dug ✓ → 提取</text>
  <text x="84" y="224" font-size="11" fill="#446688" font-weight="bold">B=[(0,1),(1,1)]:</text>
  <text x="84" y="240" font-size="11" fill="#4a7a3a">  (0,1)∈dug ✓</text>
  <text x="84" y="256" font-size="11" fill="#b85450">  (1,1)∉dug ✗ → 跳过</text>

  <!-- result box -->
  <rect x="84" y="270" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 1</text>

  <!-- divider -->
  <line x1="280" y1="48" x2="280" y2="360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ====== Example 2 (right) ====== -->
  <text x="420" y="48" text-anchor="middle" font-size="12" fill="#888">示例2：n=2, dig=[(0,0),(0,1),(1,1)] → 输出 2</text>

  <!-- 2x2 grid, origin (364, 62) -->
  <rect x="364" y="62" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="62" width="52" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="114" width="52" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- D marks -->
  <text x="390" y="96" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">D</text>
  <text x="442" y="96" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">D</text>
  <text x="442" y="150" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">D</text>

  <!-- verdict lines -->
  <text x="364" y="186" font-size="11" fill="#b85450" font-weight="bold">A=(0,0):</text>
  <text x="364" y="202" font-size="11" fill="#4a7a3a">  (0,0)∈dug ✓ → 提取</text>
  <text x="364" y="224" font-size="11" fill="#446688" font-weight="bold">B=[(0,1),(1,1)]:</text>
  <text x="364" y="240" font-size="11" fill="#4a7a3a">  (0,1)∈dug ✓</text>
  <text x="364" y="256" font-size="11" fill="#4a7a3a">  (1,1)∈dug ✓ → 提取</text>

  <!-- result box -->
  <rect x="364" y="270" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 2</text>

  <!-- bottom note -->
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888">关键：把 dig 编码进哈希集合后，工件「全挖」判定变为逐格 O(1) 查询</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">每工件最多 4 格 → 单工件核对常数时间</text>
</svg>
