<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n = 3 格雷码序列演算：相邻项恰好只差 1 位</text>

  <!-- 8 codes in a 2-row layout, 4 per row -->
  <!-- Row 1: 000 -> 001 -> 011 -> 010 -->

  <!-- node 000 -->
  <rect x="40" y="56" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">000</text>
  <text x="75" y="48" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <!-- arrow + diff label -->
  <path d="M 112 76 L 148 76" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">bit0</text>

  <!-- node 001 -->
  <rect x="150" y="56" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">001</text>
  <text x="185" y="48" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- arrow + diff label -->
  <path d="M 222 76 L 258 76" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">bit1</text>

  <!-- node 011 -->
  <rect x="260" y="56" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">011</text>
  <text x="295" y="48" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- arrow + diff label -->
  <path d="M 332 76 L 368 76" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">bit0</text>

  <!-- node 010 -->
  <rect x="370" y="56" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">010</text>
  <text x="405" y="48" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- turn-down arrow from 010 to 110 (bit2) -->
  <path d="M 405 98 Q 470 130 470 156" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="130" font-size="9" fill="#4a7a3a">bit2</text>

  <!-- Row 2 (reversed direction): 110 <- 111 <- 101 <- 100 -->

  <!-- node 110 -->
  <rect x="370" y="156" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">110</text>
  <text x="405" y="148" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- arrow + diff label (right to left) -->
  <path d="M 368 176 L 332 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">bit0</text>

  <!-- node 111 -->
  <rect x="260" y="156" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">111</text>
  <text x="295" y="148" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- arrow + diff label -->
  <path d="M 258 176 L 222 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">bit1</text>

  <!-- node 101 -->
  <rect x="150" y="156" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">101</text>
  <text x="185" y="148" text-anchor="middle" font-size="9" fill="#888">i=6</text>

  <!-- arrow + diff label -->
  <path d="M 148 176 L 112 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">bit0</text>

  <!-- node 100 -->
  <rect x="40" y="156" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">100</text>
  <text x="75" y="148" text-anchor="middle" font-size="9" fill="#888">i=7</text>

  <!-- return arrow: 100 -> 000 (cyclic, bit2) -->
  <path d="M 75 198 Q 10 130 10 76 Q 10 56 38 76" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="18" y="130" font-size="9" fill="#b85450">bit2 (循环)</text>

  <!-- Legend -->
  <rect x="40" y="220" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="232" font-size="10" fill="#666">起点</text>
  <rect x="120" y="220" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="148" y="232" font-size="10" fill="#666">前半段（前缀 0）</text>
  <rect x="260" y="220" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="288" y="232" font-size="10" fill="#666">后半段（前缀 1）</text>

  <!-- Insight box 1: bit flip pattern -->
  <rect x="40" y="250" width="230" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="272" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每次只翻转 1 个比特位</text>
  <text x="155" y="290" text-anchor="middle" font-size="10" fill="#666">箭头上标注的是被翻转的位</text>
  <text x="155" y="304" text-anchor="middle" font-size="10" fill="#666">翻转顺序：bit0→bit1→bit0→bit2→…</text>

  <!-- Insight box 2: cyclic -->
  <rect x="290" y="250" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">首尾也只差 1 位（循环性）</text>
  <text x="405" y="290" text-anchor="middle" font-size="10" fill="#666">100 → 000 仅 bit2 不同</text>
  <text x="405" y="304" text-anchor="middle" font-size="10" fill="#666">→ 可循环计数（编码器应用）</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">公式 G(i) = i ^ (i&gt;&gt;1) 生成的正是此序列</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#666">i=0..7 → [0,1,3,2,6,7,5,4]，与镜像法结果完全一致</text>
</svg>
