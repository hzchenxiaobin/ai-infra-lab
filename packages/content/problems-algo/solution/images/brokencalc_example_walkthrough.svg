<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">坏了的计算器：示例演算 X=3, Y=10</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="430" y="70" text-anchor="middle" font-size="12" fill="#555">反向贪心：从 Y=10 逐步缩到 X=3，记录每步操作</text>

  <!-- ===== Walkthrough steps ===== -->
  <!-- Step 0: Y=10 -->
  <g filter="url(#sk2)">
    <rect x="60" y="100" width="120" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="120" y="122" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">Y = 10</text>
  <text x="120" y="140" text-anchor="middle" font-size="10" fill="#888">ops = 0</text>
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="#2e6e2e">10&gt;3, 偶 → ÷2</text>

  <path d="M 180 125 L 218 125" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 1: Y=5 -->
  <g filter="url(#sk2)">
    <rect x="220" y="100" width="120" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="280" y="122" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">Y = 5</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">ops = 1</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#7a5415">5&gt;3, 奇 → +1</text>

  <path d="M 340 125 L 378 125" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: Y=6 -->
  <g filter="url(#sk2)">
    <rect x="380" y="100" width="120" height="50" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="440" y="122" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">Y = 6</text>
  <text x="440" y="140" text-anchor="middle" font-size="10" fill="#888">ops = 2</text>
  <text x="440" y="170" text-anchor="middle" font-size="10" fill="#2e6e2e">6&gt;3, 偶 → ÷2</text>

  <path d="M 500 125 L 538 125" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: Y=3 -->
  <g filter="url(#sk2)">
    <rect x="540" y="100" width="120" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="600" y="122" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">Y = 3</text>
  <text x="600" y="140" text-anchor="middle" font-size="10" fill="#888">ops = 3</text>
  <text x="600" y="170" text-anchor="middle" font-size="10" fill="#888">3 ≤ X=3, 停止</text>

  <!-- arrow to final -->
  <path d="M 660 125 L 698 125" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Final answer -->
  <g filter="url(#sk2)">
    <rect x="700" y="100" width="130" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="765" y="122" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">答案 = 3</text>
  <text x="765" y="140" text-anchor="middle" font-size="10" fill="#b03a3a">+ (X−Y) = 0</text>

  <!-- ===== Forward verification ===== -->
  <text x="430" y="210" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">正向验证：3 → 6 → 5 → 10（3 步）</text>

  <!-- forward chain -->
  <g filter="url(#sk2)">
    <rect x="80" y="235" width="80" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="120" y="261" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="120" y="293" text-anchor="middle" font-size="10" fill="#2e6e2e">×2</text>
  <path d="M 160 256 L 198 256" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)">
    <rect x="200" y="235" width="80" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="240" y="261" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="240" y="293" text-anchor="middle" font-size="10" fill="#7a5415">−1</text>
  <path d="M 280 256 L 318 256" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)">
    <rect x="320" y="235" width="80" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="360" y="261" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="360" y="293" text-anchor="middle" font-size="10" fill="#2e6e2e">×2</text>
  <path d="M 400 256 L 438 256" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)">
    <rect x="440" y="235" width="80" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="480" y="261" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">10</text>
  <text x="480" y="293" text-anchor="middle" font-size="10" fill="#888">= Y ✓</text>

  <!-- ===== Summary table ===== -->
  <text x="430" y="335" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">反向操作的两种情况汇总</text>

  <!-- table header -->
  <g filter="url(#sk2)">
    <rect x="80" y="355" width="700" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="160" y="376" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">条件</text>
  <text x="350" y="376" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">反向操作</text>
  <text x="540" y="376" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">对应正向操作</text>
  <text x="690" y="376" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">步数</text>

  <!-- row 1 -->
  <g filter="url(#sk2)">
    <rect x="80" y="389" width="700" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="160" y="409" text-anchor="middle" font-size="11" fill="#2e6e2e">Y &gt; X 且 Y 偶</text>
  <text x="350" y="409" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Y ÷ 2</text>
  <text x="540" y="409" text-anchor="middle" font-size="11" fill="#555">×2</text>
  <text x="690" y="409" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">+1</text>

  <!-- row 2 -->
  <g filter="url(#sk2)">
    <rect x="80" y="421" width="700" height="30" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="160" y="441" text-anchor="middle" font-size="11" fill="#7a5415">Y &gt; X 且 Y 奇</text>
  <text x="350" y="441" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">Y + 1</text>
  <text x="540" y="441" text-anchor="middle" font-size="11" fill="#555">−1</text>
  <text x="690" y="441" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">+1</text>

  <!-- row 3 -->
  <g filter="url(#sk2)">
    <rect x="80" y="453" width="700" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="160" y="473" text-anchor="middle" font-size="11" fill="#b03a3a">Y ≤ X</text>
  <text x="350" y="473" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">停止，补 (X−Y) 次 +1</text>
  <text x="540" y="473" text-anchor="middle" font-size="11" fill="#555">连续 −1</text>
  <text x="690" y="473" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">+（X−Y）</text>

  <!-- footer -->
  <text x="430" y="505" text-anchor="middle" font-size="10" fill="#888">本例：10÷2→5+1→6÷2→3，ops=3，X−Y=0，总答案 3</text>
</svg>
