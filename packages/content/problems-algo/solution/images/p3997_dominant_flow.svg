<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="240" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：后序 DFS 一趟统计</text>

  <!-- 开始 -->
  <ellipse cx="160" cy="56" rx="70" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">进入 dfs(node)</text>

  <path d="M 230 56 L 256 56" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形A：node 为空? -->
  <polygon points="330,32 400,56 330,80 260,56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="60" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">node 为空 ?</text>

  <text x="412" y="46" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 400 56 L 422 56" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="468" cy="56" rx="44" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return 0</text>
  <text x="468" y="86" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">值域 ≥1 ⇒ 0 当空哨兵</text>

  <text x="338" y="96" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 330 80 L 330 100" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归下潜框 -->
  <rect x="245" y="102" width="170" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="120" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">L = dfs(node.left)</text>
  <text x="330" y="138" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">R = dfs(node.right)</text>

  <path d="M 330 144 L 330 162" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合成框 -->
  <rect x="245" y="164" width="170" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="184" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">mx = max(node.val, L, R)</text>

  <path d="M 330 196 L 330 218" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形B：val == mx? -->
  <polygon points="330,220 398,246 330,272 262,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="250" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">node.val == mx ?</text>

  <!-- 是 → ans++ -->
  <text x="410" y="238" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 398 246 L 424 246" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="228" width="72" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="250" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- 否 → 直接到 return -->
  <text x="246" y="236" text-anchor="middle" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 262 246 L 200 246 L 200 348 L 212 348" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans++ 汇入 return -->
  <path d="M 466 264 L 466 348 L 384 348" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="298" cy="348" rx="78" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="352" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return mx</text>

  <!-- 递归回边 -->
  <path d="M 245 123 L 40 123 L 40 56 L 86 56" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">递归下潜（先孩子后自身）</text>

  <text x="260" y="388" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⚠️ 后序 = 先孩子后父亲：L、R 先就绪，父亲 O(1) 合成 mx；空节点返 0 作哨兵</text>
</svg>
