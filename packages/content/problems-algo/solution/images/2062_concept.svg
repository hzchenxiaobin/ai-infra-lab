<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：辅音是「墙」，墙内统计含全部 5 元音的子串</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">元音子串 = 全由元音组成 + 五种齐全 → 辅音天然切段</text>

  <!-- Example label -->
  <text x="28" y="84" font-size="10.5" fill="#666">word = "cuaieuouac"</text>

  <!-- Wall c at index 0 -->
  <rect x="56" y="62" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="88" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">c</text>
  <text x="73" y="56" text-anchor="middle" font-size="9.5" fill="#b85450">墙</text>

  <!-- Vowel segment: u a i e u o u a (indices 1..8) -->
  <rect x="92" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u</text>

  <rect x="128" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <rect x="164" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>

  <rect x="200" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>

  <rect x="236" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u</text>

  <rect x="272" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>

  <rect x="308" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u</text>

  <rect x="344" y="62" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <!-- Wall c at index 9 -->
  <rect x="380" y="62" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="88" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">c</text>
  <text x="397" y="56" text-anchor="middle" font-size="9.5" fill="#b85450">墙</text>

  <!-- Bracket: vowel segment -->
  <path d="M 92 108 L 92 116 L 378 116 L 378 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="235" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">纯元音段 "uaieuoua"（辅音之外的最大连续段）</text>

  <!-- 5 vowels badge -->
  <rect x="40" y="150" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">段内问题 = 统计含「全部 5 种元音」的子串数</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="190" r="11" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
    <circle cx="180" cy="190" r="11" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <circle cx="240" cy="190" r="11" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="240" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
    <circle cx="300" cy="190" r="11" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">o</text>
    <circle cx="360" cy="190" r="11" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="360" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">u</text>
  </g>
  <text x="412" y="194" font-size="11" fill="#446688" font-weight="bold">→ 五种齐全</text>

  <!-- Last-position insight -->
  <rect x="40" y="218" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">「最后位置」法（承接 1358）</text>
  <text x="260" y="256" text-anchor="middle" font-size="10.5" fill="#555">固定右端点 right，记每种元音最后出现的下标 last[c]</text>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#555">left ≤ min(last) 即可包进五种 → 贡献 = min(last) − 段起点 + 1</text>

  <!-- Footer -->
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#888">辅音处重置 last 与段起点 → 一趟扫描 O(n) / O(1)</text>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#aaa">对照暴力 O(n²)：n ≤ 100 也能 AC，但滑窗体现可迁移模板</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#aaa">2062 = 1358（3 元音）推广到 5 元音 + 辅音切段</text>
</svg>
