<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：target = 3，绿色为孤独 B</text>

  <!-- ===== 左：4x6 矩阵 ===== -->
  <!-- 列标 -->
  <text x="85" y="60" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="115" y="60" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="145" y="60" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="175" y="60" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="205" y="60" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="235" y="60" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <!-- 行标 -->
  <text x="58" y="95" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="58" y="125" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="58" y="155" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="58" y="185" text-anchor="middle" font-size="9.5" fill="#888">3</text>

  <!-- row 0: W B W B B W -->
  <rect x="70" y="80" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="100" y="80" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="130" y="80" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="100" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="160" y="80" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="190" y="80" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <rect x="220" y="80" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="100" text-anchor="middle" font-size="11" fill="#ccc">W</text>

  <!-- row 1: W B W B B W -->
  <rect x="70" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="130" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="100" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="130" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="130" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="160" y="110" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="190" y="110" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <rect x="220" y="110" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="130" text-anchor="middle" font-size="11" fill="#ccc">W</text>

  <!-- row 2: W B W B B W -->
  <rect x="70" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="160" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="100" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="130" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="160" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="160" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="190" y="140" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <rect x="220" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="160" text-anchor="middle" font-size="11" fill="#ccc">W</text>

  <!-- row 3: W W B W B W -->
  <rect x="70" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="190" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="100" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="130" y="170" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <rect x="160" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#ccc">W</text>
  <rect x="190" y="170" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <rect x="220" y="170" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="190" text-anchor="middle" font-size="11" fill="#ccc">W</text>

  <!-- rowCount 标注 -->
  <text x="270" y="68" text-anchor="middle" font-size="9" fill="#888">行B数</text>
  <rect x="258" y="82" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="258" y="112" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="258" y="142" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="157" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="258" y="172" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="187" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- colCount 标注 -->
  <text x="48" y="216" text-anchor="middle" font-size="9" fill="#888">列B数</text>
  <rect x="73" y="206" width="24" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="221" text-anchor="middle" font-size="10.5" fill="#aaa">0</text>
  <rect x="103" y="206" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="115" y="221" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="133" y="206" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="221" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="163" y="206" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="175" y="221" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="193" y="206" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="205" y="221" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4</text>
  <rect x="223" y="206" width="24" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="221" text-anchor="middle" font-size="10.5" fill="#aaa">0</text>

  <!-- sig / freq 说明 -->
  <rect x="40" y="244" width="248" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="164" y="262" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">行签名</text>
  <text x="164" y="280" text-anchor="middle" font-size="10" fill="#444">行0-2: "WBWBBW" → freq = 3</text>
  <text x="164" y="294" text-anchor="middle" font-size="10" fill="#444">行3: "WWBWBW" → freq = 1</text>

  <!-- ===== 右：判定明细表 ===== -->
  <rect x="306" y="48" width="232" height="206" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="66" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">代表格判定</text>

  <!-- 表头 -->
  <text x="334" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">B(i,j)</text>
  <text x="392" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">row</text>
  <text x="434" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">col</text>
  <text x="472" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">freq</text>
  <text x="516" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">孤独</text>
  <path d="M 316 92 L 528 92" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行1 (0,1) 孤独 -->
  <text x="334" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(0,1)</text>
  <text x="392" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="434" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="472" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="516" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 行2 (0,4) 不孤独 col=4 -->
  <text x="334" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0,4)</text>
  <text x="392" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="434" y="130" text-anchor="middle" font-size="10" fill="#b85450">4✗</text>
  <text x="472" y="130" text-anchor="middle" font-size="10" fill="#444">3</text>
  <text x="516" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- 行3 (2,3) 孤独 -->
  <text x="334" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(2,3)</text>
  <text x="392" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="434" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="472" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">3✓</text>
  <text x="516" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 行4 (3,2) 不孤独 row=2 -->
  <text x="334" y="170" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(3,2)</text>
  <text x="392" y="170" text-anchor="middle" font-size="10" fill="#b85450">2✗</text>
  <text x="434" y="170" text-anchor="middle" font-size="10" fill="#b85450">1✗</text>
  <text x="472" y="170" text-anchor="middle" font-size="10" fill="#444">1</text>
  <text x="516" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- 行5 (3,4) 不孤独 -->
  <text x="334" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(3,4)</text>
  <text x="392" y="190" text-anchor="middle" font-size="10" fill="#b85450">2✗</text>
  <text x="434" y="190" text-anchor="middle" font-size="10" fill="#b85450">4✗</text>
  <text x="472" y="190" text-anchor="middle" font-size="10" fill="#444">1</text>
  <text x="516" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <path d="M 316 198 L 528 198" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="422" y="216" text-anchor="middle" font-size="9.5" fill="#888">绿色=3 条件全满足；红色=至少一条不满足</text>

  <!-- 结果 -->
  <rect x="306" y="270" width="232" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="422" y="293" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans = 6（6 个绿色 B）</text>

  <!-- 图例 -->
  <rect x="40" y="308" width="248" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="10" fill="#d6a040" font-weight="bold">关键：</text>
  <text x="56" y="342" font-size="9.5" fill="#555">列4 有 4 个 B &gt; target → 该列所有 B 必非孤独</text>
  <text x="56" y="356" font-size="9.5" fill="#555">行3 rowCount=2 ≠ target → 该行所有 B 必非孤独</text>

</svg>
