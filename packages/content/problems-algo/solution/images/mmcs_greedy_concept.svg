<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：最左未覆盖的 X → 从它开始放窗口，覆盖最远</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每次操作覆盖 3 个连续字符，从最左 X 开始放 → 顺便覆盖右侧 2 格 → 跳到 i+3</text>

  <!-- String label -->
  <text x="28" y="72" font-size="10.5" fill="#666">原始串</text>

  <!-- String cells: X X O X (4 cells, w=40 gap=6 start=80) -->
  <rect x="80" y="54" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="79" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">X</text>
  <rect x="126" y="54" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="79" text-anchor="middle" font-size="15" fill="#b85450">X</text>
  <rect x="172" y="54" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="79" text-anchor="middle" font-size="15" fill="#4a7a3a">O</text>
  <rect x="218" y="54" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="79" text-anchor="middle" font-size="15" fill="#b85450">X</text>

  <!-- Position labels -->
  <text x="100" y="104" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="146" y="104" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="192" y="104" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="238" y="104" text-anchor="middle" font-size="9" fill="#999">3</text>

  <!-- Arrow from leftmost X down -->
  <path d="M 100 96 L 100 118" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="240" y="114" font-size="10.5" fill="#d6a040" font-weight="bold">最左 X 在 i=0 → 必须覆盖</text>

  <!-- Window placement: [0,1,2] highlighted -->
  <rect x="76" y="124" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="146" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">操作①：窗口 [0,1,2] → 全变 O</text>

  <!-- Arrow down -->
  <path d="M 146 156 L 146 174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="170" font-size="10" fill="#888">跳到 i+3 = 3</text>

  <!-- After first op: O O O X -->
  <text x="28" y="196" font-size="10.5" fill="#666">操作①后</text>
  <rect x="80" y="180" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="205" text-anchor="middle" font-size="15" fill="#4a7a3a">O</text>
  <rect x="126" y="180" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="205" text-anchor="middle" font-size="15" fill="#4a7a3a">O</text>
  <rect x="172" y="180" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="205" text-anchor="middle" font-size="15" fill="#4a7a3a">O</text>
  <rect x="218" y="180" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="205" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">X</text>
  <text x="238" y="230" text-anchor="middle" font-size="9" fill="#999">i=3</text>

  <!-- Arrow from X at i=3 down -->
  <path d="M 238 222 L 238 244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="240" font-size="10.5" fill="#d6a040" font-weight="bold">又见 X → 再放窗口</text>

  <!-- Window placement 2 -->
  <rect x="76" y="250" width="186" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="169" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">操作②：覆盖 i=3 → 全变 O</text>

  <!-- Insight box -->
  <rect x="40" y="294" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么从最左 X 开始放窗口最优？</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#555">左侧已全是 O（最左未覆盖）→ 往左放浪费覆盖；从 i 起覆盖 [i,i+1,i+2] 最远</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#555">→ 一次操作顺带消灭右侧最多 2 个 X → 操作总数最少（交换论证）</text>
</svg>
