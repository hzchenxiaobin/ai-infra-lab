<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：FROM → WHERE IS NULL → SELECT * → ORDER BY</text>

  <!-- ① FROM -->
  <rect x="70" y="42" width="290" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM books</text>
  <text x="215" y="78" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">逐行读入 5 列：id / title / author / year / rating</text>

  <path d="M 215 90 L 215 108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="104" font-size="8.5" fill="#888" filter="url(#rough2)">6 行进闸</text>

  <!-- ② WHERE -->
  <rect x="70" y="112" width="290" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="130" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② WHERE rating IS NULL　★ 唯一考点</text>
  <text x="215" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">行级谓词逐行判定：TRUE 留、FALSE / UNKNOWN 滤</text>
  <text x="215" y="162" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">6 行 → 3 行（幸存 2 / 4 / 6）</text>

  <path d="M 215 168 L 215 186" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="182" font-size="8.5" fill="#888" filter="url(#rough2)">3 行放行</text>

  <!-- ③ SELECT -->
  <rect x="70" y="190" width="290" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ SELECT *</text>
  <text x="215" y="226" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">输出完整行（含恒为 NULL 的 rating 列）</text>

  <path d="M 215 238 L 215 256" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ ORDER BY -->
  <rect x="70" y="260" width="290" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ ORDER BY book_id</text>
  <text x="215" y="296" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">按编号升序落座：2 → 4 → 6，即答案</text>

  <!-- 右侧：行数账本 -->
  <rect x="400" y="112" width="132" height="196" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="466" y="130" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">行数账本</text>
  <text x="412" y="150" font-size="9" fill="#446688" filter="url(#rough2)">① 读入　6 行</text>
  <text x="412" y="168" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 1　有 4.5　滤</text>
  <text x="412" y="184" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 2　NULL　留</text>
  <text x="412" y="200" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 3　有 4.8　滤</text>
  <text x="412" y="216" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 4　NULL　留</text>
  <text x="412" y="232" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 5　有 4.2　滤</text>
  <text x="412" y="248" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ 6　NULL　留</text>
  <text x="412" y="268" font-size="9" fill="#8a6d1f" filter="url(#rough2)">② 滤后　3 行</text>
  <text x="412" y="286" font-size="9" fill="#8a6d1f" filter="url(#rough2)">③④ 排序　3 行</text>
  <text x="412" y="302" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 3 行 × 5 列</text>

  <!-- 底部注释 -->
  <rect x="70" y="330" width="462" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="301" y="348" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">逻辑执行顺序 FROM → WHERE → SELECT → ORDER BY：过滤在投影之前，</text>
  <text x="301" y="364" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">谓词作用在原始行的 rating 列上；单表单条件，一层 SELECT 即最终形态</text>
</svg>
