<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序变一趟扫描，小根堆守住前 k 大</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1（k = 2）：下标按 nums1 升序排好后，处理到 nums1 = 4 的瞬间</text>

  <!-- sorted row: nums1 values -->
  <text x="134" y="57" font-size="9.5" fill="#888" filter="url(#rough2)">排序后（按 nums1 升序）：</text>
  <text x="156" y="72" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n₁=1</text>
  <text x="208" y="72" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n₁=2</text>
  <text x="260" y="72" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n₁=3</text>
  <text x="312" y="72" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n₁=4</text>
  <text x="364" y="72" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">n₁=5</text>

  <!-- nums2 boxes -->
  <rect x="134" y="76" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="95" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="186" y="76" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="95" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="238" y="76" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">50</text>
  <rect x="290" y="76" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="95" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="342" y="76" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="364" y="95" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">40</text>

  <!-- group brackets -->
  <path d="M 134 108 L 134 114 L 282 114 L 282 108" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="208" y="127" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">已入堆（nums1 严格更小）</text>
  <path d="M 312 108 L 312 114 L 312 114" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="312" y="127" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">当前 i</text>
  <text x="364" y="127" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">未处理</text>

  <!-- left: min-heap -->
  <g filter="url(#rough2)">
    <rect x="36" y="140" width="210" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="141" y="156" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">小根堆（容量 k = 2）</text>
    <line x1="112" y1="186" x2="82" y2="224" stroke="#9db4c9" stroke-width="1.5"/>
    <line x1="128" y1="186" x2="158" y2="224" stroke="#9db4c9" stroke-width="1.5"/>
    <circle cx="120" cy="184" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="120" y="188" text-anchor="middle" font-size="11" fill="#a03934" font-weight="bold">30</text>
    <circle cx="82" cy="226" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="82" y="230" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">50</text>
    <circle cx="158" cy="226" r="14" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="143" y="181" font-size="9" fill="#b85450" font-weight="bold">← 堆顶</text>
    <text x="143" y="194" font-size="9" fill="#a03934">第 k 大守门员</text>
    <text x="141" y="240" text-anchor="middle" font-size="9" fill="#55677d">虚位：还差 0 个，堆已满</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="252" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="141" y="268" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">sum = 80（Top-K 之和）</text>
  </g>

  <!-- right: push rules -->
  <g filter="url(#rough2)">
    <rect x="262" y="140" width="222" height="104" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="8"/>
    <text x="373" y="156" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">新值 v 的入堆规则</text>
    <text x="274" y="177" font-size="9.5" fill="#2f5d24">堆未满（&lt; k 个）→ 直接入，sum += v</text>
    <text x="274" y="197" font-size="9.5" fill="#8a6d1f">v &gt; 堆顶 → 换血：弹堆顶、压入 v</text>
    <text x="288" y="213" font-size="9.5" fill="#8a6d1f">sum += v − 旧堆顶（增量更新）</text>
    <text x="274" y="233" font-size="9.5" fill="#a03934">v ≤ 堆顶 → 拒之门外（10 ≤ 30）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="262" y="252" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="373" y="268" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">answer[i] = sum，O(1) 读取</text>
  </g>

  <!-- warning box -->
  <g filter="url(#rough2)">
    <rect x="36" y="288" width="448" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="260" y="305" text-anchor="middle" font-size="10" fill="#a03934" font-weight="bold">⚠ nums1 相等互不可见：整组「先统一赋值 → 再入堆」</text>
    <text x="260" y="322" text-anchor="middle" font-size="9.5" fill="#a03934">示例 2 全相等 ⇒ 答案全 0；先赋值也保证「自己不选自己」</text>
  </g>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">n 次全量扫描 ⇒ 一趟推进：排序 O(n log n) + 堆操作 O(n log k)</text>
</svg>
