<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：regular=[1,6,9,5], express=[5,2,3,10], expressCost=8</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">初始 f[0]=0（常规起点），g[0]=∞（不可能在特快线起步）</text>

  <!-- Table header -->
  <text x="48" y="76" font-size="10.5" fill="#666" font-weight="bold">i</text>
  <text x="100" y="76" font-size="10.5" fill="#666" font-weight="bold">aᵢ</text>
  <text x="148" y="76" font-size="10.5" fill="#666" font-weight="bold">bᵢ</text>
  <text x="240" y="76" font-size="10.5" fill="#446688" font-weight="bold">f[i]</text>
  <text x="380" y="76" font-size="10.5" fill="#4a7a3a" font-weight="bold">g[i]</text>
  <text x="500" y="76" font-size="10.5" fill="#b85450" font-weight="bold">cost[i]</text>

  <path d="M 30 82 L 540 82" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: init -->
  <rect x="32" y="88" width="32" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="100" y="106" font-size="10.5" fill="#888">—</text>
  <text x="148" y="106" font-size="10.5" fill="#888">—</text>
  <rect x="200" y="90" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="106" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <rect x="340" y="90" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="106" text-anchor="middle" font-size="10.5" fill="#888">∞</text>
  <text x="500" y="106" font-size="10.5" fill="#888">—</text>

  <!-- Row 1: i=1, a=1, b=5, f=min(0+1,∞+1)=1, g=min(0+8+5,∞+5)=13, cost=1 -->
  <rect x="32" y="120" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="100" y="138" font-size="10.5" fill="#333">1</text>
  <text x="148" y="138" font-size="10.5" fill="#333">5</text>
  <rect x="200" y="122" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="340" y="122" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="138" text-anchor="middle" font-size="10.5" fill="#333">13</text>
  <rect x="460" y="122" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 2: i=2, a=6, b=2, f=min(1+6,13+6)=7, g=min(1+8+2,13+2)=11, cost=7 -->
  <rect x="32" y="152" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="100" y="170" font-size="10.5" fill="#333">6</text>
  <text x="148" y="170" font-size="10.5" fill="#333">2</text>
  <rect x="200" y="154" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">7</text>
  <rect x="340" y="154" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="170" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <rect x="460" y="154" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">7</text>

  <!-- Row 3: i=3, a=9, b=3, f=min(7+9,11+9)=16, g=min(7+8+3,11+3)=14, cost=14 -->
  <rect x="32" y="184" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="100" y="202" font-size="10.5" fill="#333">9</text>
  <text x="148" y="202" font-size="10.5" fill="#333">3</text>
  <rect x="200" y="186" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="202" text-anchor="middle" font-size="10.5" fill="#333">16</text>
  <rect x="340" y="186" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="202" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">14</text>
  <rect x="460" y="186" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">14</text>

  <!-- Row 4: i=4, a=5, b=10, f=min(16+5,14+5)=19, g=min(16+8+10,14+10)=24, cost=19 -->
  <rect x="32" y="216" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="100" y="234" font-size="10.5" fill="#333">5</text>
  <text x="148" y="234" font-size="10.5" fill="#333">10</text>
  <rect x="200" y="218" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="234" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">19</text>
  <rect x="340" y="218" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="234" text-anchor="middle" font-size="10.5" fill="#333">24</text>
  <rect x="460" y="218" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">19</text>

  <!-- divider -->
  <path d="M 30 258 L 540 258" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="80" y="272" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终答案 cost = [1, 7, 14, 19] ✓</text>

  <!-- Path illustration for example 1 -->
  <text x="36" y="332" font-size="10.5" fill="#666">到站 4 的最优路线（cost=19）：</text>

  <!-- 站0 常规 -->
  <rect x="40" y="346" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="66" y="365" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">站0</text>
  <text x="66" y="388" text-anchor="middle" font-size="9" fill="#446688">常规</text>

  <!-- 段1: regular 0->1, cost +1 -->
  <path d="M 94 361 L 120 361" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="107" y="354" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">+1</text>

  <!-- 站1 常规 + 换乘特快 -->
  <rect x="122" y="346" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="365" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">站1</text>
  <text x="148" y="388" text-anchor="middle" font-size="9" fill="#446688">常规</text>
  <!-- 换乘标记 -->
  <rect x="178" y="352" width="44" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="366" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">换+8</text>

  <!-- 段2: express 1->2, cost +2 -->
  <path d="M 224 361 L 250 361" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="237" y="354" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">+2</text>

  <!-- 站2 特快 -->
  <rect x="252" y="346" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="365" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">站2</text>
  <text x="278" y="388" text-anchor="middle" font-size="9" fill="#4a7a3a">特快</text>

  <!-- 段3: express 2->3, cost +3 -->
  <path d="M 306 361 L 332 361" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="319" y="354" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">+3</text>

  <!-- 站3 特快 + 换乘常规 -->
  <rect x="334" y="346" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="365" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">站3</text>
  <text x="360" y="388" text-anchor="middle" font-size="9" fill="#4a7a3a">特快</text>
  <!-- 换乘标记 -->
  <rect x="390" y="352" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="366" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">换免费</text>

  <!-- 段4: regular 3->4, cost +5 -->
  <path d="M 436 361 L 462 361" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="354" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">+5</text>

  <!-- 站4 常规 = 19 -->
  <rect x="464" y="346" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="365" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">站4=19</text>
  <text x="492" y="388" text-anchor="middle" font-size="9" fill="#446688">常规</text>

  <text x="280" y="414" text-anchor="middle" font-size="10" fill="#888">总费用：1 +（8 换乘 + 2）+ 3 +（0 换乘 + 5）= 19</text>
</svg>
