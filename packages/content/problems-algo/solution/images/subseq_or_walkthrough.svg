<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 3] → 7</text>

  <!-- 表格外框 + 表头底色 -->
  <rect x="20" y="50" width="540" height="146" fill="none" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="20" y="50" width="540" height="38" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- 列分隔 -->
  <line x1="100" y1="50" x2="100" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="185" y1="50" x2="185" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="275" y1="50" x2="275" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="365" y1="50" x2="365" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="460" y1="50" x2="460" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行分隔 -->
  <line x1="20" y1="88" x2="560" y2="88" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="124" x2="560" y2="124" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="160" x2="560" y2="160" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="60" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步</text>
  <text x="142" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <text x="230" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prefix</text>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#7a2a26" filter="url(#rough2)">ans|=x</text>
  <text x="412" y="74" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">ans|=prefix</text>
  <text x="510" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans(₂)</text>

  <!-- 初始行 -->
  <text x="60" y="110" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">init</text>
  <text x="142" y="110" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="230" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="320" y="110" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="412" y="110" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>
  <text x="510" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">000</text>

  <!-- 第 1 步 -->
  <text x="60" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="146" text-anchor="middle" font-size="13" fill="#7a2a26" filter="url(#rough2)">1</text>
  <text x="412" y="146" text-anchor="middle" font-size="13" fill="#2f5a22" filter="url(#rough2)">1</text>
  <text x="510" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">001</text>

  <!-- 第 2 步 -->
  <text x="60" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="320" y="182" text-anchor="middle" font-size="13" fill="#7a2a26" filter="url(#rough2)">1|3=3</text>
  <text x="412" y="182" text-anchor="middle" font-size="13" fill="#2f5a22" filter="url(#rough2)">3|4=7</text>
  <text x="510" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">111</text>

  <!-- 分析说明框 -->
  <rect x="30" y="212" width="520" height="184" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="240" font-size="13" fill="#2f5a22" filter="url(#rough2)">bit0（值 1）：x=1 与 prefix=1 均含 → 命中（①与②都可）</text>
  <text x="50" y="268" font-size="13" fill="#b85450" filter="url(#rough2)">bit1（值 2）：prefix 1→4 跳过 [2,4)，前缀未命中</text>
  <text x="50" y="288" font-size="13" fill="#b85450" filter="url(#rough2)">          → 靠 x=3=11₂ 自带 bit1 兜底 ✓（情形②）</text>
  <text x="50" y="316" font-size="13" fill="#2f5a22" filter="url(#rough2)">bit2（值 4）：prefix=4 落入 [4,8) → 前缀命中 ✓（情形①）</text>
  <text x="50" y="346" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 111₂ = 7  ✓</text>
  <text x="50" y="376" font-size="12" fill="#7a5a10" filter="url(#rough2)">对照 [2,2]：prefix 2→4，ans = 2 | 2 | 4 = 6（bit2 由进位产生）</text>
</svg>
