<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：奇数次字符 ≤ 1 个 ⇒ 可重排成回文</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">回文 = 关于中心镜像，每个字符成对出现，至多一个落在正中</text>

  <!-- ====== input string ====== -->
  <text x="20" y="76" font-size="11" fill="#888">输入 s =</text>
  <g font-size="12">
    <rect x="76" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="90" y="79" text-anchor="middle" fill="#333">c</text>
    <rect x="106" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="120" y="79" text-anchor="middle" fill="#333">a</text>
    <rect x="136" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="150" y="79" text-anchor="middle" fill="#333">r</text>
    <rect x="166" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="180" y="79" text-anchor="middle" fill="#333">e</text>
    <rect x="196" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="210" y="79" text-anchor="middle" fill="#333">r</text>
    <rect x="226" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="240" y="79" text-anchor="middle" fill="#333">a</text>
    <rect x="256" y="60" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="79" text-anchor="middle" fill="#333">c</text>
  </g>

  <!-- rearrange arrow -->
  <path d="M 296 74 L 330 74" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="313" y="66" text-anchor="middle" font-size="9.5" fill="#888">重排</text>

  <!-- ====== palindrome result, mirrored coloring ====== -->
  <text x="350" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">回文 =</text>
  <g font-size="12">
    <!-- racecar : r a c e c a r  (left half blue, right half green mirror, center orange) -->
    <rect x="394" y="60" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="406" y="79" text-anchor="middle" fill="#333">r</text>
    <rect x="420" y="60" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="432" y="79" text-anchor="middle" fill="#333">a</text>
    <rect x="446" y="60" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="458" y="79" text-anchor="middle" fill="#333">c</text>
    <rect x="472" y="60" width="24" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="484" y="79" text-anchor="middle" fill="#d6a040" font-weight="bold">e</text>
    <rect x="498" y="60" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="510" y="79" text-anchor="middle" fill="#333">c</text>
    <rect x="524" y="60" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="536" y="79" text-anchor="middle" fill="#333">a</text>
  </g>
  <!-- rightmost r would overflow, draw smaller note instead -->
  <text x="484" y="104" text-anchor="middle" font-size="9" fill="#888">左半↔右半镜像，e 落正中</text>

  <!-- mirror bracket -->
  <path d="M 394 96 L 470 96" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 498 96 L 548 96" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="432" y="110" text-anchor="middle" font-size="8.5" fill="#446688">成对</text>
  <text x="523" y="110" text-anchor="middle" font-size="8.5" fill="#4a7a3a">成对</text>

  <!-- ====== arrow down to frequency ====== -->
  <path d="M 180 116 L 180 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="132" font-size="10" fill="#888">统计频次</text>

  <!-- ====== frequency table ====== -->
  <text x="20" y="156" font-size="11" fill="#446688" font-weight="bold">频次表（只列涉及字母）</text>

  <g font-size="12">
    <!-- header letters -->
    <rect x="56" y="166" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="78" y="183" text-anchor="middle" font-size="11" fill="#888">a</text>
    <rect x="104" y="166" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="126" y="183" text-anchor="middle" font-size="11" fill="#888">c</text>
    <rect x="152" y="166" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="174" y="183" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">e</text>
    <rect x="200" y="166" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="222" y="183" text-anchor="middle" font-size="11" fill="#888">r</text>

    <!-- counts -->
    <rect x="56" y="194" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="78" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="104" y="194" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="126" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="152" y="194" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="174" y="212" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="200" y="194" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="222" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <text x="258" y="196" font-size="10" fill="#888">偶数个 → 成对</text>
  <text x="258" y="212" font-size="10" fill="#b85450" font-weight="bold">奇数个 → 候选中心</text>

  <!-- ====== odd count summary ====== -->
  <rect x="56" y="232" width="248" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">奇数次字符数 = 1（只有 e）≤ 1 → true ✓</text>

  <!-- ====== three cases ====== -->
  <text x="20" y="292" font-size="11" fill="#555" font-weight="bold">三种情况：</text>

  <!-- case 1: even length 0 odd -->
  <rect x="40" y="300" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶数长度</text>
  <text x="115" y="338" text-anchor="middle" font-size="10.5" fill="#555">奇数次字符 = 0</text>
  <text x="115" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 可成回文</text>

  <!-- case 2: odd length 1 odd -->
  <rect x="205" y="300" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">奇数长度</text>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#555">奇数次字符 = 1（居中）</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 可成回文</text>

  <!-- case 3: >=2 odd -->
  <rect x="370" y="300" width="150" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">≥ 2 个奇</text>
  <text x="445" y="338" text-anchor="middle" font-size="10.5" fill="#555">中心只能放 1 个</text>
  <text x="445" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 不可成回文</text>

  <!-- bracket connecting cases 1&2 -->
  <path d="M 190 330 L 205 330" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
</svg>
