<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：BFS 算 node_i 到各点距离 → 在路径上取距离最小者</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">树中从 node_i 出发的路径与查询路径“汇合点”唯一，故最近节点天然唯一</text>

  <!-- ===== non-path edges (under) ===== -->
  <line x1="290" y1="80" x2="290" y2="150" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="290" y1="150" x2="290" y2="220" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="190" y1="300" x2="260" y2="380" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- ===== path edges 5-2-0-3 (orange, thick) ===== -->
  <line x1="120" y1="380" x2="190" y2="300" stroke="#d6a040" stroke-width="3.2" filter="url(#rough2)"/>
  <line x1="190" y1="300" x2="290" y2="220" stroke="#d6a040" stroke-width="3.2" filter="url(#rough2)"/>
  <line x1="290" y1="220" x2="400" y2="300" stroke="#d6a040" stroke-width="3.2" filter="url(#rough2)"/>

  <!-- ===== nodes ===== -->
  <!-- node 4 = query node (red) -->
  <circle cx="290" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="290" y="52" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">node_i = 4（查询点）</text>

  <!-- node 1 -->
  <circle cx="290" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="320" y="154" font-size="9.5" fill="#888">d=1</text>

  <!-- node 0 = answer (green ring) -->
  <circle cx="290" cy="220" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="290" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="232" y="225" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=2 ★最近</text>

  <!-- node 2 (path) -->
  <circle cx="190" cy="300" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="160" y="304" text-anchor="end" font-size="9.5" fill="#d6a040" font-weight="bold">d=3</text>

  <!-- node 3 (path) -->
  <circle cx="400" cy="300" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="426" y="304" font-size="9.5" fill="#d6a040" font-weight="bold">d=3</text>

  <!-- node 5 (path) -->
  <circle cx="120" cy="380" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="385" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="96" y="384" text-anchor="end" font-size="9.5" fill="#d6a040" font-weight="bold">d=4</text>

  <!-- node 6 -->
  <circle cx="260" cy="380" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="284" y="384" font-size="9.5" fill="#888">d=4</text>

  <!-- path label -->
  <text x="120" y="416" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">路径 5→3 = 5—2—0—3（橙色加粗）</text>

  <!-- ===== legend box ===== -->
  <rect x="40" y="432" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BFS 从 node=4 得 d[]：路径点 {5,2,0,3} 对应 d={4,3,2,3}，最小 d=2 在节点 0</text>
</svg>
