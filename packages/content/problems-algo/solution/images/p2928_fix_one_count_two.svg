<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定一人，剩下两人用区间一次数完</text>

  <!-- equation box -->
  <rect x="30" y="38" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333">x₁ + x₂ + x₃ = n，0 ≤ xᵢ ≤ limit</text>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#446688">固定 x₁ 后，剩下 m = n − x₁ 颗糖只归 x₂、x₃ 两人</text>

  <!-- children row -->
  <text x="40" y="104" font-size="10" fill="#999">以 n = 5, limit = 2 为例，取 x₁ = 2：</text>
  <rect x="40" y="110" width="130" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x₁ = 2</text>
  <text x="105" y="152" text-anchor="middle" font-size="10" fill="#446688">已固定 ✓</text>
  <path d="M 175 137 L 202 137" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="208" y="110" width="272" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x₂ + x₃ = m = 3</text>
  <text x="344" y="152" text-anchor="middle" font-size="10" fill="#d6a040">两人分——不枚举 x₃，区间一次数完</text>

  <!-- interval bands -->
  <text x="30" y="192" font-size="11" fill="#555" font-weight="bold">x₂ 能取哪些值？——两道约束取交集（m = 3, limit = 2）：</text>

  <text x="26" y="215" font-size="10" fill="#446688">① x₂ ≤ 2</text>
  <rect x="120" y="204" width="200" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="26" y="241" font-size="10" fill="#d6a040">② x₂ ≥ 1</text>
  <rect x="220" y="230" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="26" y="267" font-size="10" fill="#4a7a3a" font-weight="bold">① ∩ ②</text>
  <rect x="220" y="256" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="332" y="269" font-size="11" fill="#4a7a3a" font-weight="bold">交集 [1, 2] → 2 个取值</text>

  <!-- number line -->
  <path d="M 105 296 H 435" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 120 290 V 302 M 220 290 V 302 M 320 290 V 302 M 420 290 V 302" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="220" y="316" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="320" y="316" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="420" y="316" text-anchor="middle" font-size="11" fill="#555">3</text>

  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888">② 即 x₃ = m − x₂ ≤ limit：同伴不超限，反过来限制 x₂ 的下界</text>

  <!-- formula box -->
  <rect x="30" y="344" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#333">两人方案数 cnt(m) = min(limit, m) − max(0, m − limit) + 1（负数记 0）</text>
  <text x="260" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 ans = Σ cnt(n − x₁)，对一切合法 x₁ 求和</text>
</svg>
