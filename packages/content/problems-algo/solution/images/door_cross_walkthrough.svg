<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="300" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：arrival=[0,1,1,2,4]，逐秒门方向与出队</text>

  <!-- header row -->
  <rect x="20"  y="36" width="54"  height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47"  y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">t</text>
  <rect x="74"  y="36" width="156" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">enter 队列</text>
  <rect x="230" y="36" width="120" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">exit 队列</text>
  <rect x="350" y="36" width="78"  height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">上一秒</text>
  <rect x="428" y="36" width="64"  height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">选向</text>
  <rect x="492" y="36" width="110" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="547" y="59" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">出队 → ans</text>

  <!-- row 0 : t=0  prev 闲置 dir E* -->
  <rect x="20"  y="72" width="54"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47"  y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="74"  y="72" width="156" height="36" rx="3" fill="#eaf1fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="95" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">P0, P2, P3</text>
  <rect x="230" y="72" width="120" height="36" rx="3" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="95" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">P1, P4</text>
  <rect x="350" y="72" width="78"  height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="95" text-anchor="middle" font-size="12" fill="#7a2230" filter="url(#rough2)">闲置</text>
  <rect x="428" y="72" width="64"  height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="95" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">E*</text>
  <rect x="492" y="72" width="110" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P0 → [0]=0</text>

  <!-- row 1 : t=1 -->
  <rect x="20"  y="108" width="54"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47"  y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74"  y="108" width="156" height="36" rx="3" fill="#eaf1fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="131" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">P2, P3</text>
  <rect x="230" y="108" width="120" height="36" rx="3" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="131" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">P1, P4</text>
  <rect x="350" y="108" width="78"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E</text>
  <rect x="428" y="108" width="64"  height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="131" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">E</text>
  <rect x="492" y="108" width="110" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P2 → [2]=1</text>

  <!-- row 2 : t=2 -->
  <rect x="20"  y="144" width="54"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47"  y="167" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="74"  y="144" width="156" height="36" rx="3" fill="#eaf1fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="167" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">P3</text>
  <rect x="230" y="144" width="120" height="36" rx="3" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="167" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">P1, P4</text>
  <rect x="350" y="144" width="78"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E</text>
  <rect x="428" y="144" width="64"  height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="167" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">E</text>
  <rect x="492" y="144" width="110" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P3 → [3]=2</text>

  <!-- row 3 : t=3  switch to X -->
  <rect x="20"  y="180" width="54"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47"  y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="74"  y="180" width="156" height="36" rx="3" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="203" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="230" y="180" width="120" height="36" rx="3" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="203" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">P1, P4</text>
  <rect x="350" y="180" width="78"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E</text>
  <rect x="428" y="180" width="64"  height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="203" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">X(切)</text>
  <rect x="492" y="180" width="110" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P1 → [1]=3</text>

  <!-- row 4 : t=4 -->
  <rect x="20"  y="216" width="54"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47"  y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="74"  y="216" width="156" height="36" rx="3" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="239" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="230" y="216" width="120" height="36" rx="3" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="239" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">P4</text>
  <rect x="350" y="216" width="78"  height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">X</text>
  <rect x="428" y="216" width="64"  height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="239" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">X</text>
  <rect x="492" y="216" width="110" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P4 → [4]=4</text>

  <!-- footnote -->
  <text x="30" y="276" font-size="11" fill="#7a2230" filter="url(#rough2)">* E=进入 / X=退出；t=0 闲置→退出优先但无人退出，故进入；t=3 上一秒进入但无进入者，切换为退出。</text>
</svg>
