<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 13</text>

  <!-- ===== Case 1: k = 2 → 10 ===== -->
  <rect x="30" y="44" width="500" height="200" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="12" fill="#446688" font-weight="bold">k = 2  →  答案 10</text>

  <!-- table header -->
  <rect x="48" y="76" width="464" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">轮次</text>
  <text x="180" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur</text>
  <text x="252" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k</text>
  <text x="370" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">countNodes(cur,13)</text>
  <text x="490" y="92" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>

  <!-- row 0: init -->
  <text x="92" y="116" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <text x="180" y="116" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="252" y="116" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#666">k−=1</text>

  <!-- row 1 -->
  <rect x="48" y="124" width="464" height="20" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="92" y="138" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="180" y="138" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="252" y="138" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="370" y="138" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="490" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下探 ×10</text>

  <!-- row 2 -->
  <text x="92" y="160" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>
  <text x="252" y="160" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="370" y="160" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="490" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return 10 ✓</text>

  <text x="48" y="186" font-size="10" fill="#666">countNodes(1,13) = min(2,14)−1 + min(20,14)−10 = 1 + 4 = 5  &gt;  k(1) → 答案在 1 的子树内 → 下探</text>
  <text x="48" y="204" font-size="10" fill="#666">下探后 cur=10，k 从 1 减为 0，循环结束，返回 10</text>
  <text x="48" y="224" font-size="10" fill="#4a7a3a" font-weight="bold">字典序：①1  ②10  ← 命中第 2 个</text>

  <!-- ===== Case 2: k = 6 → 2 ===== -->
  <rect x="30" y="260" width="500" height="200" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="48" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">k = 6  →  答案 2</text>

  <rect x="48" y="292" width="464" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">轮次</text>
  <text x="180" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cur</text>
  <text x="252" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k</text>
  <text x="370" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">countNodes(cur,13)</text>
  <text x="490" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">动作</text>

  <text x="92" y="332" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <text x="180" y="332" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="252" y="332" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="370" y="332" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="490" y="332" text-anchor="middle" font-size="10" fill="#666">k−=1</text>

  <rect x="48" y="340" width="464" height="20" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="92" y="354" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="180" y="354" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="252" y="354" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="370" y="354" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="490" y="354" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">横移 +1</text>

  <text x="92" y="376" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="180" y="376" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="252" y="376" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="370" y="376" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="490" y="376" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return 2 ✓</text>

  <text x="48" y="402" font-size="10" fill="#666">countNodes(1,13)=5  ≤  k(5) → 整棵「1 子树」(①1②10③11④12⑤13) 都跳过 → 横移到兄弟 2</text>
  <text x="48" y="420" font-size="10" fill="#666">横移后 cur=2，k 从 5 减 5 = 0，循环结束，返回 2</text>
  <text x="48" y="440" font-size="10" fill="#4a7a3a" font-weight="bold">字典序：①1 ②1 0 ③1 1 ④1 2 ⑤1 3  ⑥2  ← 命中第 6 个</text>

  <!-- footer -->
  <rect x="30" y="478" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="280" y="498" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：step ≤ k 就横移跳整棵子树，step &gt; k 就下探进子树</text>
  <text x="280" y="514" text-anchor="middle" font-size="10" fill="#666">每轮 O(log n) 算 step，外层最多 O(log n) 轮 → 总 O(log²n)</text>
</svg>
