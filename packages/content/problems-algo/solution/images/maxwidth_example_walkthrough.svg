<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,3,2,5,3,null,9]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">每轮处理一整层，记录首编号 left / 末编号 right，宽度 = right − left + 1</text>

  <!-- ===== Round 1 ===== -->
  <rect x="20" y="56" width="540" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="12" fill="#b85450" font-weight="bold">轮次 1 — L0</text>

  <text x="40" y="100" font-size="11" fill="#333">队列（节点, id）：</text>
  <rect x="150" y="86" width="56" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="178" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1, id=0</text>

  <text x="230" y="100" font-size="11" fill="#333">left=0, right=0</text>
  <text x="370" y="100" font-size="11" fill="#333">宽度 = 0−0+1 = 1</text>
  <text x="500" y="100" font-size="11" fill="#b85450" font-weight="bold">ans=1</text>

  <text x="40" y="128" font-size="10" fill="#888">出队 (1,0)，rel=0 → 推入左 (3,1)、右 (2,2)</text>
  <text x="40" y="144" font-size="10" fill="#aaa">下一轮队列：[(3,1), (2,2)]</text>

  <line x1="290" y1="154" x2="290" y2="166" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 2 ===== -->
  <rect x="20" y="168" width="540" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="12" fill="#446688" font-weight="bold">轮次 2 — L1</text>

  <text x="40" y="212" font-size="11" fill="#333">队列：</text>
  <rect x="90" y="198" width="56" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="118" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3, id=1</text>
  <rect x="150" y="198" width="56" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="178" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2, id=2</text>

  <text x="230" y="212" font-size="11" fill="#333">left=1, right=2</text>
  <text x="370" y="212" font-size="11" fill="#333">宽度 = 2−1+1 = 2</text>
  <text x="500" y="212" font-size="11" fill="#b85450" font-weight="bold">ans=2</text>

  <text x="40" y="240" font-size="10" fill="#888">(3,1) rel=0 → 左(5,1)、右(3,2)；(2,2) rel=1 → 右(9,4)</text>
  <text x="40" y="256" font-size="10" fill="#aaa">下一轮队列：[(5,1), (3,2), (9,4)]</text>

  <line x1="290" y1="266" x2="290" y2="278" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 3 ===== -->
  <rect x="20" y="280" width="540" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="302" font-size="12" fill="#4a7a3a" font-weight="bold">轮次 3 — L2</text>

  <text x="40" y="324" font-size="11" fill="#333">队列：</text>
  <rect x="90" y="310" width="56" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="118" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5, id=1</text>
  <rect x="150" y="310" width="56" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="178" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3, id=2</text>
  <rect x="210" y="310" width="56" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="238" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">9, id=4</text>

  <text x="290" y="324" font-size="11" fill="#333">left=1, right=4</text>
  <text x="410" y="324" font-size="11" fill="#333">宽度 = 4−1+1 = 4</text>
  <text x="525" y="324" font-size="11" fill="#b85450" font-weight="bold">ans=4</text>

  <text x="40" y="352" font-size="10" fill="#888">均为叶子，无子节点入队 → 队列空，循环结束</text>
  <text x="40" y="368" font-size="10" fill="#aaa">最终最大宽度 ans = 4 ⭐</text>

  <!-- ===== Result ===== -->
  <rect x="120" y="392" width="340" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold">结果：4</text>
  <text x="290" y="432" text-anchor="middle" font-size="10" fill="#888">L0=1, L1=2, L2=4 → 取最大值 4</text>
</svg>
