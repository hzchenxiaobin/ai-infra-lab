<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">概念：同行或同列中「严格更大」的格子才能跳过去</text>

  <!-- Column labels -->
  <text x="165" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 0</text>
  <text x="255" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 1</text>
  <text x="345" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 2</text>

  <!-- Row labels -->
  <text x="108" y="99" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 0</text>
  <text x="108" y="149" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 1</text>

  <!-- Matrix cells: row0 -->
  <rect x="120" y="70" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="101" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="210" y="70" width="90" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="101" text-anchor="middle" font-size="18" fill="#aaa" filter="url(#rough2)">1</text>

  <rect x="300" y="70" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="101" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Matrix cells: row1 -->
  <rect x="120" y="120" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="151" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">−9</text>

  <rect x="210" y="120" width="90" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="151" text-anchor="middle" font-size="18" fill="#aaa" filter="url(#rough2)">5</text>

  <rect x="300" y="120" width="90" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="151" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- Step badges -->
  <circle cx="132" cy="82" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="132" y="86" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="132" cy="132" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="132" y="136" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="312" cy="82" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="312" y="86" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="312" cy="132" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="312" y="136" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Move arrows -->
  <!-- 1: -9 -> 3, same column 0, up -->
  <path d="M 165,128 L 165,102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="118" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">同列 ↑</text>

  <!-- 2: 3 -> 6, same row 0, arc above -->
  <path d="M 178,82 Q 255,54 332,82" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="50" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">同行 →（跳过 1）</text>

  <!-- 3: 6 -> 7, same column 2, down -->
  <path d="M 345,102 L 345,128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="118" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">同列 ↓</text>

  <!-- Path summary -->
  <rect x="60" y="200" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">路径</tspan>：−9 → 3 → 6 → 7，访问 <tspan font-weight="bold">4</tspan> 个格子 ⭐</text>

  <!-- Legend -->
  <rect x="60" y="256" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="72" y="276" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#446688">规则</tspan>：从当前格出发，可跳到<tspan font-weight="bold">同一行或同一列</tspan>中值「严格更大」的任一格</text>

  <rect x="60" y="294" width="440" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="72" y="314" font-size="11" fill="#888" filter="url(#rough2)">移动只受「值严格递增」约束，与行/列的物理相邻无关——可跨多格跳跃</text>

  <text x="72" y="338" font-size="10" fill="#aaa" filter="url(#rough2)">示例 3：mat = [[3,1,6],[−9,5,7]]，答案 4</text>
</svg>
