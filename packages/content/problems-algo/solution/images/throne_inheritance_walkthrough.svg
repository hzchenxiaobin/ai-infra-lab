<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：家族树构建与前序遍历</text>

  <!-- ===== Row 1: initial king ===== -->
  <text x="30" y="56" font-size="11" fill="#888" font-weight="bold">① 构造 king</text>
  <rect x="120" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">king</text>
  <text x="200" y="60" font-size="10" fill="#aaa">→ 继承顺序: [king]</text>

  <!-- ===== Row 2: 3 births under king ===== -->
  <text x="30" y="104" font-size="11" fill="#888" font-weight="bold">② birth×3</text>
  <line x1="148" y1="68" x2="70" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="68" x2="148" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="68" x2="226" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">king</text>
  <rect x="46" y="96" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="111" text-anchor="middle" font-size="9" fill="#333">andy</text>
  <rect x="124" y="96" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="111" text-anchor="middle" font-size="9" fill="#333">bob</text>
  <rect x="200" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="111" text-anchor="middle" font-size="9" fill="#333">catherine</text>
  <text x="280" y="108" font-size="10" fill="#aaa">顺序: king → andy → bob → catherine</text>

  <!-- ===== Row 3: births under andy & bob ===== -->
  <text x="30" y="170" font-size="11" fill="#888" font-weight="bold">③ 孙辈出生</text>
  <line x1="148" y1="68" x2="70" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="68" x2="148" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="68" x2="226" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="118" x2="70" y2="146" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="118" x2="120" y2="146" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="118" x2="176" y2="146" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">king</text>
  <rect x="46" y="96" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="111" text-anchor="middle" font-size="9" fill="#333">andy</text>
  <rect x="124" y="96" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="111" text-anchor="middle" font-size="9" fill="#333">bob</text>
  <rect x="200" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="111" text-anchor="middle" font-size="9" fill="#333">catherine</text>
  <rect x="44" y="146" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="9" fill="#333">matthew</text>
  <rect x="98" y="146" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="161" text-anchor="middle" font-size="9" fill="#333">alex</text>
  <rect x="156" y="146" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="161" text-anchor="middle" font-size="9" fill="#333">asha</text>

  <!-- preorder sequence for row 3 -->
  <rect x="290" y="148" width="250" height="22" fill="none" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="298" y="163" font-size="9.5" fill="#4a7a3a" font-weight="bold">前序: king,andy,matthew,bob,alex,asha,catherine</text>

  <!-- ===== Row 4: getInheritanceOrder (before death) ===== -->
  <text x="30" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">④ getOrder</text>
  <rect x="40" y="204" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="226" font-size="11" fill="#333" font-weight="bold">返回 [king, andy, matthew, bob, alex, asha, catherine]</text>

  <!-- ===== Row 5: death(bob) ===== -->
  <text x="30" y="266" font-size="11" fill="#b85450" font-weight="bold">⑤ death(bob)</text>

  <line x1="148" y1="248" x2="70" y2="276" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="248" x2="148" y2="276" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="248" x2="226" y2="276" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="298" x2="70" y2="326" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="298" x2="120" y2="326" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="298" x2="176" y2="326" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="120" y="228" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">king</text>

  <rect x="46" y="276" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="291" text-anchor="middle" font-size="9" fill="#333">andy</text>

  <!-- bob crossed out -->
  <rect x="124" y="276" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="291" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">bob</text>
  <line x1="128" y1="280" x2="168" y2="294" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="200" y="276" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="291" text-anchor="middle" font-size="9" fill="#333">catherine</text>

  <rect x="44" y="326" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="341" text-anchor="middle" font-size="9" fill="#333">matthew</text>
  <rect x="98" y="326" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="341" text-anchor="middle" font-size="9" fill="#333">alex</text>
  <rect x="156" y="326" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="341" text-anchor="middle" font-size="9" fill="#333">asha</text>

  <text x="280" y="280" font-size="10" fill="#b85450" font-weight="bold">bob 标记死亡</text>
  <text x="280" y="296" font-size="10" fill="#888">树结构不变，子女 alex/asha 仍可继承</text>

  <!-- ===== Row 6: getInheritanceOrder (after death) ===== -->
  <text x="30" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ getOrder</text>
  <rect x="40" y="380" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="402" font-size="11" fill="#333" font-weight="bold">返回 [king, andy, matthew, alex, asha, catherine]</text>
  <text x="56" y="416" font-size="10" fill="#888">bob 被跳过，但其子树 alex、asha 仍按前序出现</text>

  <!-- bottom note -->
  <rect x="40" y="448" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">要点</text>
  <text x="280" y="488" text-anchor="middle" font-size="10.5" fill="#555">前序遍历保证「长辈先于晚辈、兄姐先于弟妹」</text>
  <text x="280" y="504" text-anchor="middle" font-size="10.5" fill="#555">死亡者跳过但其后代照常遍历 → 这正是长子继承制的语义</text>
</svg>
