<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">为什么超过 ⌊n/3⌋ 的元素最多 2 个？</text>

  <!-- Top: array bar n=9, three segments -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">数组长度 n = 9，⌊n/3⌋ = 3</text>

  <!-- segment 1 (green) -->
  <rect x="60" y="66" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n/3 = 3 格</text>

  <!-- segment 2 (blue) -->
  <rect x="180" y="66" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n/3 = 3 格</text>

  <!-- segment 3 (orange) -->
  <rect x="300" y="66" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">n/3 = 3 格</text>

  <!-- bracket showing total n -->
  <path d="M 60 112 L 60 118 L 420 118 L 420 112" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="132" text-anchor="middle" font-size="11" fill="#888">总共只有 n = 9 格</text>

  <!-- Middle: 3 elements each need > 3 = at least 4 -->
  <text x="40" y="160" font-size="11.5" fill="#b85450" font-weight="bold">假设有 3 个元素各出现 &gt; 3 次（至少 4 次）：</text>

  <rect x="60" y="170" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">元素 A ≥ 4</text>

  <rect x="180" y="170" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">元素 B ≥ 4</text>

  <rect x="300" y="170" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">元素 C ≥ 4</text>

  <text x="415" y="184" font-size="13" fill="#555">→</text>
  <rect x="430" y="170" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">≥ 12</text>

  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">12 &gt; 9 = n ✗ 不可能！</text>

  <!-- separator -->
  <line x1="40" y1="232" x2="480" y2="232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: 2 elements each need > 3 = at least 4 -->
  <text x="40" y="256" font-size="11.5" fill="#4a7a3a" font-weight="bold">只有 2 个元素各出现 &gt; 3 次（至少 4 次）：</text>

  <rect x="80" y="266" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">元素 A ≥ 4</text>

  <rect x="220" y="266" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="285" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">元素 B ≥ 4</text>

  <text x="345" y="280" font-size="13" fill="#555">→</text>
  <rect x="360" y="266" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="395" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ 8</text>

  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8 ≤ 9 = n ✓ 有可能！</text>

  <!-- Conclusion box -->
  <rect x="70" y="328" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">结论：超过 ⌊n/3⌋ 的元素至多 ⌊n/3⌋+1 个 → 实际最多 2 个</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#888">所以只需维护 2 个 (candidate, count) 即可</text>
</svg>
