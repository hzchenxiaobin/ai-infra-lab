<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：改写前后对比</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">root=[5,4,9,1,10,null,7] → [0,0,0,7,7,null,11]</text>

  <!-- ===== Left: before tree ===== -->
  <text x="120" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">改写前</text>
  <g font-size="12">
    <!-- L0 -->
    <circle cx="120" cy="100" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="120" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <!-- L1 -->
    <circle cx="80" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="80" y="165" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <circle cx="160" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="165" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <line x1="107" y1="113" x2="90" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="133" y1="113" x2="150" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2 -->
    <circle cx="50" cy="220" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="50" y="225" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="110" cy="220" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="110" y="225" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <circle cx="160" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <line x1="68" y1="172" x2="57" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="92" y1="172" x2="103" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="160" y1="174" x2="160" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- levelSum annotation -->
  <text x="200" y="104" font-size="10" fill="#b85450" font-weight="bold">d=0 层和=5</text>
  <text x="200" y="164" font-size="10" fill="#446688" font-weight="bold">d=1 层和=13</text>
  <text x="200" y="224" font-size="10" fill="#d6a040" font-weight="bold">d=2 层和=18</text>

  <!-- siblingSum annotations for depth 2 -->
  <rect x="38" y="244" width="86" height="36" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="81" y="264" text-anchor="middle" font-size="9" fill="#d6a040">siblingSum=11</text>

  <rect x="148" y="244" width="34" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="165" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a">s=7</text>

  <!-- ===== Middle: arrow + formula ===== -->
  <path d="M 280 150 L 330 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="305" y="138" text-anchor="middle" font-size="9" fill="#666">18−11=7</text>
  <text x="305" y="170" text-anchor="middle" font-size="9" fill="#666">18−7=11</text>
  <text x="305" y="110" text-anchor="middle" font-size="9" fill="#666">5−5=0</text>
  <text x="305" y="140" text-anchor="middle" font-size="9" fill="#666">13−13=0</text>

  <!-- ===== Right: after tree ===== -->
  <text x="440" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">改写后</text>
  <g font-size="12">
    <!-- L0 -->
    <circle cx="440" cy="100" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="440" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <!-- L1 -->
    <circle cx="400" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="400" y="165" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <circle cx="480" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="480" y="165" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <line x1="427" y1="113" x2="410" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="453" y1="113" x2="470" y2="148" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2 -->
    <circle cx="370" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="370" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="430" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="430" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="480" cy="220" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="480" y="225" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
    <line x1="388" y1="172" x2="377" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="412" y1="172" x2="423" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="480" y1="174" x2="480" y2="208" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- new value annotations -->
  <text x="510" y="104" font-size="10" fill="#b85450" font-weight="bold">←0</text>
  <text x="510" y="164" font-size="10" fill="#446688" font-weight="bold">←0</text>
  <text x="510" y="224" font-size="10" fill="#4a7a3a" font-weight="bold">←7</text>

  <!-- ===== Bottom: computation table ===== -->
  <line x1="20" y1="296" x2="540" y2="296" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="318" font-size="11" fill="#444" font-weight="bold">逐节点计算表</text>

  <!-- table header -->
  <g font-size="10">
    <rect x="30" y="328" width="70" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="65" y="342" text-anchor="middle" fill="#555" font-weight="bold">节点(原值)</text>
    <rect x="100" y="328" width="60" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="130" y="342" text-anchor="middle" fill="#555" font-weight="bold">深度d</text>
    <rect x="160" y="328" width="90" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="205" y="342" text-anchor="middle" fill="#555" font-weight="bold">levelSum[d]</text>
    <rect x="250" y="328" width="90" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="295" y="342" text-anchor="middle" fill="#555" font-weight="bold">siblingSum</text>
    <rect x="340" y="328" width="80" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="380" y="342" text-anchor="middle" fill="#555" font-weight="bold">新值</text>
    <rect x="420" y="328" width="110" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="475" y="342" text-anchor="middle" fill="#555" font-weight="bold">说明</text>
  </g>

  <!-- table rows -->
  <g font-size="10">
    <!-- row 1: root -->
    <text x="65" y="362" text-anchor="middle" fill="#b85450">5</text>
    <text x="130" y="362" text-anchor="middle" fill="#555">0</text>
    <text x="205" y="362" text-anchor="middle" fill="#b85450">5</text>
    <text x="295" y="362" text-anchor="middle" fill="#555">5</text>
    <text x="380" y="362" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="475" y="362" text-anchor="middle" fill="#888">无堂兄弟</text>
    <!-- row 2: node 4 -->
    <text x="65" y="382" text-anchor="middle" fill="#446688">4</text>
    <text x="130" y="382" text-anchor="middle" fill="#555">1</text>
    <text x="205" y="382" text-anchor="middle" fill="#446688">13</text>
    <text x="295" y="382" text-anchor="middle" fill="#555">4+9=13</text>
    <text x="380" y="382" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <text x="475" y="382" text-anchor="middle" fill="#888">兄弟和=层和</text>
    <!-- row 3: node 1 -->
    <text x="65" y="402" text-anchor="middle" fill="#d6a040">1</text>
    <text x="130" y="402" text-anchor="middle" fill="#555">2</text>
    <text x="205" y="402" text-anchor="middle" fill="#d6a040">18</text>
    <text x="295" y="402" text-anchor="middle" fill="#555">1+10=11</text>
    <text x="380" y="402" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="475" y="402" text-anchor="middle" fill="#888">堂兄弟={7}</text>
  </g>

  <text x="475" y="414" text-anchor="middle" font-size="9" fill="#aaa">…node 9/10/7 同理</text>
</svg>
