<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>
  <rect width="900" height="500" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：push 5,7,5,7,4,5 → pop×4</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="95" height="36" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="135" y="64" width="120" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb"/>
    <rect x="255" y="64" width="125" height="36" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="380" y="64" width="125" height="36" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="505" y="64" width="125" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a"/>
    <rect x="630" y="64" width="65" height="36" rx="4" fill="#f4f8fe" stroke="#4a8edb"/>
    <rect x="695" y="64" width="165" height="36" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
  </g>
  <text x="87" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">操作</text>
  <text x="195" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">freq 变化</text>
  <text x="317" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">group[1] 底→顶</text>
  <text x="442" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">group[2]</text>
  <text x="567" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">group[3]</text>
  <text x="662" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">maxF</text>
  <text x="777" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">返回 / 说明</text>

  <!-- row 1: push(5) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="100" width="95" height="34"/><rect x="135" y="100" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="100" width="125" height="34" fill="#fce4ec"/><rect x="380" y="100" width="125" height="34" fill="#fbf3e0"/><rect x="505" y="100" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="100" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="100" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="122" text-anchor="middle" font-size="11" fill="#333">push(5)</text>
  <text x="195" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e">5→1</text>
  <text x="317" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5]</text>
  <text x="442" y="122" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="567" y="122" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="662" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="777" y="122" text-anchor="middle" font-size="10" fill="#444">f=1 入 1 号桶</text>

  <!-- row 2: push(7) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="134" width="95" height="34"/><rect x="135" y="134" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="134" width="125" height="34" fill="#fce4ec"/><rect x="380" y="134" width="125" height="34" fill="#fbf3e0"/><rect x="505" y="134" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="134" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="134" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="156" text-anchor="middle" font-size="11" fill="#333">push(7)</text>
  <text x="195" y="156" text-anchor="middle" font-size="11" fill="#2b6e9e">7→1</text>
  <text x="317" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5, 7]</text>
  <text x="442" y="156" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="567" y="156" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="662" y="156" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="777" y="156" text-anchor="middle" font-size="10" fill="#444">7 压 1 号桶顶</text>

  <!-- row 3: push(5) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="168" width="95" height="34"/><rect x="135" y="168" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="168" width="125" height="34" fill="#fce4ec"/><rect x="380" y="168" width="125" height="34" fill="#fff8e1"/><rect x="505" y="168" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="168" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="168" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="190" text-anchor="middle" font-size="11" fill="#333">push(5)</text>
  <text x="195" y="190" text-anchor="middle" font-size="11" fill="#2b6e9e">5→2</text>
  <text x="317" y="190" text-anchor="middle" font-size="11" fill="#b85450">[5, 7]</text>
  <text x="442" y="190" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">[5]</text>
  <text x="567" y="190" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="662" y="190" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="777" y="190" text-anchor="middle" font-size="10" fill="#444">f=2 入 2 号桶, maxF↑</text>

  <!-- row 4: push(7) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="202" width="95" height="34"/><rect x="135" y="202" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="202" width="125" height="34" fill="#fce4ec"/><rect x="380" y="202" width="125" height="34" fill="#fff8e1"/><rect x="505" y="202" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="202" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="202" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="224" text-anchor="middle" font-size="11" fill="#333">push(7)</text>
  <text x="195" y="224" text-anchor="middle" font-size="11" fill="#2b6e9e">7→2</text>
  <text x="317" y="224" text-anchor="middle" font-size="11" fill="#b85450">[5, 7]</text>
  <text x="442" y="224" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">[5, 7]</text>
  <text x="567" y="224" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="662" y="224" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="777" y="224" text-anchor="middle" font-size="10" fill="#444">7 压 2 号桶顶</text>

  <!-- row 5: push(4) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="236" width="95" height="34"/><rect x="135" y="236" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="236" width="125" height="34" fill="#fce4ec"/><rect x="380" y="236" width="125" height="34" fill="#fff8e1"/><rect x="505" y="236" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="236" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="236" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="258" text-anchor="middle" font-size="11" fill="#333">push(4)</text>
  <text x="195" y="258" text-anchor="middle" font-size="11" fill="#2b6e9e">4→1</text>
  <text x="317" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5, 7, 4]</text>
  <text x="442" y="258" text-anchor="middle" font-size="11" fill="#7a5415">[5, 7]</text>
  <text x="567" y="258" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="662" y="258" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="777" y="258" text-anchor="middle" font-size="10" fill="#444">4 压 1 号桶顶</text>

  <!-- row 6: push(5) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="270" width="95" height="34"/><rect x="135" y="270" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="270" width="125" height="34" fill="#fce4ec"/><rect x="380" y="270" width="125" height="34" fill="#fff8e1"/><rect x="505" y="270" width="125" height="34" fill="#eaf6ee"/><rect x="630" y="270" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="270" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="292" text-anchor="middle" font-size="11" fill="#333">push(5)</text>
  <text x="195" y="292" text-anchor="middle" font-size="11" fill="#2b6e9e">5→3</text>
  <text x="317" y="292" text-anchor="middle" font-size="11" fill="#b85450">[5, 7, 4]</text>
  <text x="442" y="292" text-anchor="middle" font-size="11" fill="#7a5415">[5, 7]</text>
  <text x="567" y="292" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">[5]</text>
  <text x="662" y="292" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="777" y="292" text-anchor="middle" font-size="10" fill="#444">f=3 入 3 号桶, maxF↑</text>

  <!-- row 7: pop() → 5 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="304" width="95" height="34"/><rect x="135" y="304" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="304" width="125" height="34" fill="#fce4ec"/><rect x="380" y="304" width="125" height="34" fill="#fff8e1"/><rect x="505" y="304" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="304" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="304" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="326" text-anchor="middle" font-size="11" fill="#2b6e9e">5→2</text>
  <text x="317" y="326" text-anchor="middle" font-size="11" fill="#b85450">[5, 7, 4]</text>
  <text x="442" y="326" text-anchor="middle" font-size="11" fill="#7a5415">[5, 7]</text>
  <text x="567" y="326" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="662" y="326" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="777" y="326" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 5, 3 号桶空↓</text>

  <!-- row 8: pop() → 7 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="338" width="95" height="34"/><rect x="135" y="338" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="338" width="125" height="34" fill="#fce4ec"/><rect x="380" y="338" width="125" height="34" fill="#fff8e1"/><rect x="505" y="338" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="338" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="338" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="360" text-anchor="middle" font-size="11" fill="#2b6e9e">7→1</text>
  <text x="317" y="360" text-anchor="middle" font-size="11" fill="#b85450">[5, 7, 4]</text>
  <text x="442" y="360" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">[5]</text>
  <text x="567" y="360" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="662" y="360" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="777" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 7, 2 号桶非空</text>

  <!-- row 9: pop() → 5 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="372" width="95" height="34"/><rect x="135" y="372" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="372" width="125" height="34" fill="#fce4ec"/><rect x="380" y="372" width="125" height="34" fill="#fff8e1"/><rect x="505" y="372" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="372" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="372" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="394" text-anchor="middle" font-size="11" fill="#2b6e9e">5→1</text>
  <text x="317" y="394" text-anchor="middle" font-size="11" fill="#b85450">[5, 7, 4]</text>
  <text x="442" y="394" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="567" y="394" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="662" y="394" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="777" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 5, 2 号桶空↓</text>

  <!-- row 10: pop() → 4 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="406" width="95" height="34"/><rect x="135" y="406" width="120" height="34" fill="#e8f0fa"/><rect x="255" y="406" width="125" height="34" fill="#fce4ec"/><rect x="380" y="406" width="125" height="34" fill="#fff8e1"/><rect x="505" y="406" width="125" height="34" fill="#f3f9f3"/><rect x="630" y="406" width="65" height="34" fill="#f4f8fe"/><rect x="695" y="406" width="165" height="34" fill="#fffdf3"/></g></g>
  <text x="87" y="428" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop()</text>
  <text x="195" y="428" text-anchor="middle" font-size="11" fill="#2b6e9e">4→0</text>
  <text x="317" y="428" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5, 7]</text>
  <text x="442" y="428" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="567" y="428" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="662" y="428" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="777" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 4, 三值同频取栈顶</text>

  <!-- 关键不变量说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="450" width="820" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="60" y="468" font-size="11" fill="#2b6e9e" font-weight="bold">关键观察：</text>
  <text x="150" y="468" font-size="10" fill="#444">① 同一值在多个频率桶各留一份(如 5 同时在 group[1]/[2]/[3])   ② pop 高频桶后低频副本仍在, 天然回退   ③ 桶内栈顶 = 最晚达到该频率 = 最接近栈顶</text>
  <text x="150" y="482" font-size="10" fill="#b85450">④ pop 返回序列 5,7,5,4 与官方示例完全一致</text>
</svg>
