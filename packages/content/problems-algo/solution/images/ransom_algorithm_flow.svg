<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建频次表 → 逐字扣减 → 赤字即返 false</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: cnt[26] = {0}</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: count magazine -->
  <rect x="150" y="104" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 magazine</text>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#555">cnt[ch − 'a'] ++</text>

  <path d="M 270 152 L 270 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 还有 ransom 字符? -->
  <polygon points="270,176 410,228 270,280 130,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333">ransom 还有</text>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#333">未处理字符?</text>

  <!-- No -> return true -->
  <path d="M 410 228 L 470 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="220" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="500" cy="228" rx="34" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="224" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="500" y="240" text-anchor="middle" font-size="11" fill="#333">true</text>

  <!-- Yes -> down -->
  <path d="M 270 280 L 270 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="296" font-size="11" fill="#82b366">是</text>

  <!-- Step: consume one char -->
  <rect x="150" y="304" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取下一字符 ch</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#555">cnt[ch − 'a'] −−</text>

  <path d="M 270 352 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cnt < 0 ? -->
  <polygon points="270,376 390,422 270,468 150,422" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="418" text-anchor="middle" font-size="12" fill="#333">cnt[ch] &lt; 0 ?</text>

  <!-- Yes (deficit) -> left: return false -->
  <path d="M 150 422 L 96 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="414" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <ellipse cx="64" cy="422" rx="34" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="418" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="64" y="434" text-anchor="middle" font-size="11" fill="#333">false</text>
  <text x="64" y="456" text-anchor="middle" font-size="10" fill="#888">赤字：不够用</text>

  <!-- No -> loop back up to decision -->
  <path d="M 390 422 L 470 422 L 470 228 L 410 228" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="330" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 484 330)">否，继续</text>
</svg>
