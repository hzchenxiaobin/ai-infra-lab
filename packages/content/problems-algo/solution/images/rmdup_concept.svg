<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删除相邻重复项：栈的「抵消 / 入栈」机制</text>

  <!-- Left panel: push -->
  <rect x="30" y="48" width="235" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="148" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">规则①：栈顶 ≠ c → 入栈</text>
  <!-- current char -->
  <text x="48" y="118" font-size="11" fill="#888">当前</text>
  <rect x="80" y="104" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <!-- stack before -->
  <text x="135" y="118" font-size="11" fill="#888">栈</text>
  <rect x="160" y="104" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="194" y="118" font-size="10" fill="#446688">←顶</text>
  <!-- arrow -->
  <line x1="116" y1="117" x2="150" y2="117" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- result -->
  <text x="48" y="162" font-size="11" fill="#888">结果</text>
  <rect x="80" y="148" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="114" y="148" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="160" y="166" font-size="11" fill="#4a7a3a">b 压入栈顶</text>

  <!-- Right panel: pop -->
  <rect x="295" y="48" width="235" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="412" y="70" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">规则②：栈顶 == c → 抵消</text>
  <!-- current char -->
  <text x="313" y="118" font-size="11" fill="#888">当前</text>
  <rect x="345" y="104" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <!-- stack before -->
  <text x="395" y="118" font-size="11" fill="#888">栈顶</text>
  <rect x="425" y="104" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="459" y="104" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <!-- strike mark -->
  <text x="372" y="120" font-size="15" fill="#b85450" font-weight="bold">✕</text>
  <text x="442" y="120" font-size="15" fill="#b85450" font-weight="bold">✕</text>
  <!-- result -->
  <text x="313" y="162" font-size="11" fill="#888">结果</text>
  <rect x="345" y="148" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="385" y="166" font-size="11" fill="#b85450">两个 b 同时消失</text>

  <!-- Insight box -->
  <rect x="30" y="200" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么只需看「栈顶」？</text>
  <text x="48" y="250" font-size="11" fill="#555">栈保存的是「尚未配对的字符」。新字符 c 只可能与它</text>
  <text x="380" y="250" font-size="11" fill="#b85450" font-weight="bold">左边紧邻</text>
  <text x="432" y="250" font-size="11" fill="#555">的字符抵消——</text>
  <text x="48" y="270" font-size="11" fill="#555">而左边紧邻的，恰好就是栈顶（最近入栈、尚未被抵消者）。更左边的字符已被「隔开」。</text>
  <text x="48" y="290" font-size="11" fill="#555">所以一次扫描即可：</text>
  <text x="160" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">栈顶 == c 弹出，否则压入</text>
  <text x="330" y="290" font-size="11" fill="#555">，扫描结束栈内即答案。</text>
  <text x="48" y="308" font-size="11" fill="#888">本质：相邻重复对的消除是 LIFO 语义——后入栈者先被配对消除，与括号匹配同构。</text>
</svg>
