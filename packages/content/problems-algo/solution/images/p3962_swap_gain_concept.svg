<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：窗口内最小 t 个 ⇄ 窗口外最大 t 个</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">有益交换 = 换出窗口内最小、换入窗口外最大；gain(t) = 外部最大 t 个之和 − 内部最小 t 个之和</text>

  <!-- 数组格子：idx 2..7 为窗口 -->
  <rect x="121" y="56" width="246" height="48" rx="8" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="126" y="52" font-size="10" fill="#446688" filter="url(#rough2)">l</text>
  <text x="360" y="52" font-size="10" fill="#446688" filter="url(#rough2)">r</text>

  <rect x="44" y="62" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="84" y="62" width="40" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="62" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="62" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="204" y="62" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="244" y="62" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="284" y="62" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="324" y="62" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="364" y="62" width="40" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="404" y="62" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="444" y="62" width="40" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="64" y="85" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="104" y="85" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="144" y="85" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="184" y="85" text-anchor="middle" font-size="13" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="224" y="85" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="264" y="85" text-anchor="middle" font-size="13" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="304" y="85" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="344" y="85" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="384" y="85" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="424" y="85" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="464" y="85" text-anchor="middle" font-size="13" fill="#777" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 交换弧线：内部最小换出 → 外部最大换入 -->
  <path d="M 184 102 C 150 130, 92 130, 66 104" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="118" y="128" font-size="9" fill="#b85450" filter="url(#rough2)">换出最小</text>
  <path d="M 264 104 C 300 134, 352 134, 380 104" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="132" font-size="9" fill="#4a7a3a" filter="url(#rough2)">换入最大</text>

  <rect x="130" y="140" width="260" height="24" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">t = 2：gain(2) = (9 + 8) − (−4 + −2) = 23</text>

  <!-- 左下：边际增益条形图 -->
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">边际增益 d&#8348;（非增）</text>
  <line x1="48" y1="300" x2="240" y2="300" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="61" y="250" width="18" height="50" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="91" y="270" width="18" height="30" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="121" y="290" width="18" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="151" y="300" width="18" height="20" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="181" y="300" width="18" height="40" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="244" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">+5</text>
  <text x="100" y="264" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">+3</text>
  <text x="130" y="284" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">+1</text>
  <text x="160" y="332" text-anchor="middle" font-size="9" fill="#8c3a34" filter="url(#rough2)">−2</text>
  <text x="190" y="352" text-anchor="middle" font-size="9" fill="#8c3a34" filter="url(#rough2)">−4</text>
  <text x="70" y="312" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d&#8321;</text>
  <text x="100" y="312" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d&#8322;</text>
  <text x="130" y="312" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d&#8323;</text>
  <text x="160" y="294" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d&#8324;</text>
  <text x="190" y="294" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">d&#8325;</text>

  <!-- 右下：gain 凹曲线 -->
  <text x="390" y="184" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">累计增益 gain(t) 是凹的</text>
  <line x1="300" y1="300" x2="476" y2="300" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300" y1="300" x2="300" y2="210" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <polyline points="300,300 334,255 368,228 402,219 436,237 470,273" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="300" cy="300" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="334" cy="255" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="368" cy="228" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="402" cy="219" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="436" cy="237" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="470" cy="273" r="3" fill="#446688" filter="url(#rough2)"/>
  <path d="M 402 212 L 402 200" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰值 t* = 3（最后一个正边际）</text>
  <text x="300" y="314" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">0</text>
  <text x="334" y="314" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="368" y="314" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="402" y="314" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="436" y="314" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4</text>
  <text x="470" y="314" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">5</text>
  <text x="478" y="304" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">t</text>

  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">一句话：外部第 t 大非增、内部第 t 小非减 ⇒ d&#8348; 非增 ⇒ gain 凹 —— 正边际全在前面，二分找最后一个即可</text>
</svg>
