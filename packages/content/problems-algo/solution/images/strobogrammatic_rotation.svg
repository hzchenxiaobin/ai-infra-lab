<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">旋转 180° 中心对称映射表</text>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只有 5 个数字旋转后仍是有效数字</text>

  <!-- 行标签 -->
  <text x="48" y="124" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">原数字</text>
  <text x="48" y="214" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">旋转后</text>

  <!-- 0 → 0（自对称，蓝） -->
  <rect x="75" y="100" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="128" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <line x1="100" y1="142" x2="100" y2="188" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="75" y="190" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>

  <!-- 1 → 1（自对称，蓝） -->
  <rect x="155" y="100" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <line x1="180" y1="142" x2="180" y2="188" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="155" y="190" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="218" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>

  <!-- 6 → 9（互换，橙） -->
  <rect x="235" y="100" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>
  <line x1="260" y1="142" x2="260" y2="188" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="235" y="190" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>

  <!-- 8 → 8（自对称，蓝） -->
  <rect x="315" y="100" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">8</text>
  <line x1="340" y1="142" x2="340" y2="188" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="315" y="190" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="218" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">8</text>

  <!-- 9 → 6（互换，橙） -->
  <rect x="395" y="100" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <line x1="420" y1="142" x2="420" y2="188" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="395" y="190" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="218" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>

  <!-- 180° 旋转标记 -->
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">180°</text>

  <!-- 图例 -->
  <rect x="75" y="252" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="97" y="262" font-size="11" fill="#446688" filter="url(#rough2)">自对称：0/1/8（可放中间）</text>
  <rect x="275" y="252" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="297" y="262" font-size="11" fill="#d6a040" filter="url(#rough2)">互换：6↔9（必须成对）</text>

  <!-- 无效数字 -->
  <text x="80" y="298" font-size="12" fill="#b85450" filter="url(#rough2)">无效（旋转后非数字）：</text>
  <rect x="240" y="284" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="256" y="304" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">2</text>
  <line x1="244" y1="288" x2="272" y2="308" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="280" y="284" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="296" y="304" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">3</text>
  <line x1="284" y1="288" x2="312" y2="308" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="320" y="284" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="336" y="304" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">4</text>
  <line x1="324" y1="288" x2="352" y2="308" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="284" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="376" y="304" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">5</text>
  <line x1="364" y1="288" x2="392" y2="308" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="400" y="284" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="416" y="304" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">7</text>
  <line x1="404" y1="288" x2="432" y2="308" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="80" y="332" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">中心对称 = 每对字符旋转后配对相等</text>
</svg>
