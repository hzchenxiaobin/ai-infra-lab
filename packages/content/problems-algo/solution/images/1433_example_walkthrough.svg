<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：排序后逐位比较，任一方向全程 ≥ 即 true</text>

  <!-- ===== Example 3 ===== -->
  <rect x="30" y="38" width="500" height="186" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="58" font-size="11.5" fill="#333" font-weight="bold">示例 3：s1 = "leetcodee"，s2 = "interview"（n = 9）→ true</text>
  <text x="48" y="74" font-size="10" fill="#888">排序后 s1' = "cdeeeelot"，s2' = "eeiinrtvw"</text>

  <!-- s1' row, 9 boxes: w=38 h=30 step=44 start x=70 -->
  <text x="50" y="100" font-size="11" fill="#446688" font-weight="bold">s1'</text>
  <rect x="70" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="107" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="114" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="107" text-anchor="middle" font-size="14" fill="#333">d</text>
  <rect x="158" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="107" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="202" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="107" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="246" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="107" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="290" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="107" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="334" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="107" text-anchor="middle" font-size="14" fill="#333">l</text>
  <rect x="378" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="107" text-anchor="middle" font-size="14" fill="#333">o</text>
  <rect x="422" y="86" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="107" text-anchor="middle" font-size="14" fill="#333">t</text>

  <!-- s2' row -->
  <text x="50" y="138" font-size="11" fill="#4a7a3a" font-weight="bold">s2'</text>
  <rect x="70" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="145" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="114" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="145" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="158" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="145" text-anchor="middle" font-size="14" fill="#333">i</text>
  <rect x="202" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="145" text-anchor="middle" font-size="14" fill="#333">i</text>
  <rect x="246" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="145" text-anchor="middle" font-size="14" fill="#333">n</text>
  <rect x="290" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="145" text-anchor="middle" font-size="14" fill="#333">r</text>
  <rect x="334" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="145" text-anchor="middle" font-size="14" fill="#333">t</text>
  <rect x="378" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="145" text-anchor="middle" font-size="14" fill="#333">v</text>
  <rect x="422" y="124" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="145" text-anchor="middle" font-size="14" fill="#333">w</text>

  <!-- direction 1: s1' >= s2' ? all fail -->
  <text x="50" y="176" font-size="10.5" fill="#b85450" font-weight="bold">① s1'≥s2'</text>
  <text x="89" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="133" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="177" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="221" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="265" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="309" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="353" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="397" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="441" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="490" y="176" font-size="10" fill="#b85450">失败</text>

  <!-- direction 2: s2' >= s1' ? all pass -->
  <text x="50" y="198" font-size="10.5" fill="#4a7a3a" font-weight="bold">② s2'≥s1'</text>
  <text x="89" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="133" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="177" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="221" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="265" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="309" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="353" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="397" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="441" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="198" font-size="10.5" fill="#4a7a3a" font-weight="bold">全程成立</text>
  <rect x="455" y="204" width="74" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ true</text>

  <!-- ===== Example 2 ===== -->
  <rect x="30" y="236" width="500" height="180" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="256" font-size="11.5" fill="#333" font-weight="bold">示例 2：s1 = "abe"，s2 = "acd"（n = 3）→ false</text>
  <text x="48" y="272" font-size="10" fill="#888">排序后 s1' = "abe"，s2' = "acd"</text>

  <!-- s1' row, 3 boxes: w=46 h=34 step=54 start x=130 -->
  <text x="90" y="300" font-size="11" fill="#446688" font-weight="bold">s1'</text>
  <rect x="130" y="284" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="153" y="307" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="184" y="284" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207" y="307" text-anchor="middle" font-size="15" fill="#333">b</text>
  <rect x="238" y="284" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="261" y="307" text-anchor="middle" font-size="15" fill="#333">e</text>

  <!-- s2' row -->
  <text x="90" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">s2'</text>
  <rect x="130" y="326" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="153" y="349" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="184" y="326" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207" y="349" text-anchor="middle" font-size="15" fill="#333">c</text>
  <rect x="238" y="326" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="261" y="349" text-anchor="middle" font-size="15" fill="#333">d</text>

  <!-- direction 1 -->
  <text x="90" y="380" font-size="10.5" fill="#b85450" font-weight="bold">① s1'≥s2'</text>
  <text x="153" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="153" y="392" text-anchor="middle" font-size="9" fill="#888">a≥a</text>
  <text x="207" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="207" y="392" text-anchor="middle" font-size="9" fill="#b85450">b&lt;c</text>
  <text x="261" y="380" text-anchor="middle" font-size="12" fill="#bbb">—</text>
  <text x="320" y="380" font-size="10" fill="#b85450">失败</text>

  <!-- direction 2 -->
  <text x="90" y="408" font-size="10.5" fill="#4a7a3a" font-weight="bold">② s2'≥s1'</text>
  <text x="153" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="153" y="420" text-anchor="middle" font-size="9" fill="#888">a≥a</text>
  <text x="207" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="207" y="420" text-anchor="middle" font-size="9" fill="#888">c≥b</text>
  <text x="261" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="261" y="420" text-anchor="middle" font-size="9" fill="#b85450">d&lt;e</text>
  <text x="320" y="408" font-size="10" fill="#b85450">失败</text>

  <!-- footer -->
  <rect x="360" y="392" width="160" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="406" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">两向皆败 → false</text>

  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#888">打破方需「逐位 ≥」全程成立；两方向只要任一全程成立即 true</text>
</svg>
