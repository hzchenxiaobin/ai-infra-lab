<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三例分别取 max(neg, pos)</text>

  <!-- ===== Example 1: [-2,-1,-1,1,2,3] ===== -->
  <text x="30" y="52" font-size="11.5" fill="#888" font-weight="bold">示例 1</text>
  <rect x="30" y="58" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="49" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-2</text>
  <rect x="68" y="58" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="87" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-1</text>
  <rect x="106" y="58" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-1</text>
  <rect x="144" y="58" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="58" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="58" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="320" y="77" font-size="12.5" fill="#333" font-weight="bold">neg=3, pos=3</text>
  <text x="448" y="77" font-size="12.5" fill="#b85450" font-weight="bold">→ 3</text>

  <!-- ===== Example 2: [-3,-2,-1,0,0,1,2] ===== -->
  <text x="30" y="112" font-size="11.5" fill="#888" font-weight="bold">示例 2</text>
  <rect x="30" y="118" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="49" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-3</text>
  <rect x="68" y="118" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="87" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-2</text>
  <rect x="106" y="118" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">-1</text>
  <rect x="144" y="118" width="38" height="28" fill="#eeeeee" stroke="#888888" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="137" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="182" y="118" width="38" height="28" fill="#eeeeee" stroke="#888888" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="137" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="220" y="118" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="258" y="118" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="277" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="320" y="137" font-size="12.5" fill="#333" font-weight="bold">neg=3, pos=2</text>
  <text x="448" y="137" font-size="12.5" fill="#b85450" font-weight="bold">→ 3</text>

  <!-- ===== Example 3: [5,20,66,1314] ===== -->
  <text x="30" y="172" font-size="11.5" fill="#888" font-weight="bold">示例 3</text>
  <rect x="30" y="178" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="49" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="68" y="178" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="87" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>
  <rect x="106" y="178" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">66</text>
  <rect x="144" y="178" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1314</text>
  <text x="320" y="197" font-size="12.5" fill="#333" font-weight="bold">neg=0, pos=4</text>
  <text x="448" y="197" font-size="12.5" fill="#b85450" font-weight="bold">→ 4</text>

  <!-- summary -->
  <rect x="30" y="240" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11.5" fill="#555">关键：0 不计入任一侧；含 0 时 neg+pos &lt; n（如示例 2: 3+2=5 &lt; 7）</text>
  <text x="270" y="277" text-anchor="middle" font-size="11.5" fill="#555">蓝=负、灰=零、绿=正；答案恒为两侧计数的较大者</text>
</svg>
