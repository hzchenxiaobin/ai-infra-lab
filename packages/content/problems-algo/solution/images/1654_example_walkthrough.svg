<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 3 演算：a=16, b=9, x=7</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">forbidden = [1,2,4,5,6,14,17]</text>

  <!-- ===== 数轴 ===== -->
  <line x1="30" y1="80" x2="530" y2="80" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <polygon points="530,80 522,76 522,84" fill="#446688" filter="url(#rough2)"/>

  <!-- 刻度: 0, 7, 16, 32 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="76" x2="60" y2="84" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="100" text-anchor="middle" font-size="12" fill="#333">0</text>

    <line x1="120" y1="76" x2="120" y2="84" stroke="#b85450" stroke-width="2"/>
    <text x="120" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7=x</text>

    <line x1="200" y1="76" x2="200" y2="84" stroke="#446688" stroke-width="1.5"/>
    <text x="200" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a">16</text>

    <line x1="360" y1="76" x2="360" y2="84" stroke="#446688" stroke-width="1.5"/>
    <text x="360" y="100" text-anchor="middle" font-size="12" fill="#446688">32</text>
  </g>

  <!-- forbidden 标记 (1,2,4,5,6 在 0~7 之间, 14 在 7~16 之间, 17 在 16 右侧) -->
  <g filter="url(#rough2)">
    <text x="75" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="85" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="95" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="105" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="115" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="180" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
    <text x="215" y="72" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
  </g>

  <!-- 跳蚤起点 -->
  <ellipse cx="60" cy="66" rx="9" ry="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">跳</text>

  <!-- 第1跳: 0 → 16 (向前) -->
  <path d="M 70 58 Q 130 30 190 58" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="25" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">①向前 +16</text>

  <!-- 第2跳: 16 → 7 (向后) -->
  <path d="M 195 110 Q 155 140 125 110" fill="none" stroke="#d6a040" stroke-width="2.5"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="155" y="155" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">②向后 −9</text>

  <!-- 到家标记 -->
  <ellipse cx="120" cy="66" rx="9" ry="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="69" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">家</text>

  <!-- ===== BFS 层级表 ===== -->
  <line x1="20" y1="175" x2="540" y2="175" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">BFS 逐层扩展</text>

  <!-- 表头 -->
  <rect x="40" y="210" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="227" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">层</text>

  <rect x="110" y="210" width="180" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="227" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">弹出状态</text>

  <rect x="300" y="210" width="110" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">向前扩展</text>

  <rect x="420" y="210" width="110" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="227" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">向后扩展</text>

  <!-- 第0层 -->
  <rect x="40" y="240" width="60" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="240" width="180" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, F)</text>
  <rect x="300" y="240" width="110" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">16 ✓</text>
  <rect x="420" y="240" width="110" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="475" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−9 ✗</text>

  <!-- 第1层 -->
  <rect x="40" y="270" width="60" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="270" width="180" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(16, F)</text>
  <rect x="300" y="270" width="110" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">32 ✓</text>
  <rect x="420" y="270" width="110" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="288" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">7 ✓</text>

  <!-- 第2层 -->
  <rect x="40" y="300" width="60" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="300" width="180" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(32,F), (7,B)</text>
  <rect x="300" y="300" width="230" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="415" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">pos=7==x → 返回 2 ✓</text>

  <!-- 核心要点 -->
  <rect x="40" y="345" width="480" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">💡 a=16 &gt; x=7，向前一步冲过家到 16，</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">再向后退 9 到 7——「超过家」规则的关键体现</text>
</svg>
