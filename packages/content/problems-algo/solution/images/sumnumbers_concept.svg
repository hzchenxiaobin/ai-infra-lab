<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：根到叶路径按位拼数，再求所有路径之和</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">每往下一层：cur = cur × 10 + node.val</text>

  <!-- tree: 4 -> 9,0 ; 9 -> 5,1 -->
  <!-- root 4 -->
  <circle cx="220" cy="78" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- node 9 -->
  <circle cx="150" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <!-- node 0 -->
  <circle cx="290" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="146" text-anchor="middle" font-size="14" fill="#333">0</text>

  <!-- edges level 1 -->
  <path d="M 205 94 L 165 122" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 235 94 L 275 122" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 5 (leaf) -->
  <circle cx="100" cy="208" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- node 1 (leaf) -->
  <circle cx="200" cy="208" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- edges level 2 -->
  <path d="M 137 156 L 115 188" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 163 156 L 187 188" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- path number chips under leaves -->
  <rect x="62" y="236" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 9 5</text>
  <rect x="162" y="236" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 9 1</text>
  <rect x="252" y="236" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4 0</text>

  <!-- arrow from 0 leaf down (it is a leaf itself) -->
  <path d="M 290 160 L 290 232" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- right side: explanation -->
  <path d="M 360 56 L 360 290" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <text x="438" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三条根到叶路径</text>

  <rect x="378" y="78" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="441" y="94" text-anchor="middle" font-size="10" fill="#333">4 → 9 → 5</text>
  <text x="441" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 495</text>

  <rect x="378" y="126" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="441" y="142" text-anchor="middle" font-size="10" fill="#333">4 → 9 → 1</text>
  <text x="441" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 491</text>

  <rect x="378" y="174" width="126" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="441" y="190" text-anchor="middle" font-size="10" fill="#333">4 → 0</text>
  <text x="441" y="206" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">= 40</text>

  <rect x="370" y="226" width="142" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="441" y="246" text-anchor="middle" font-size="11" fill="#333">总和</text>
  <text x="441" y="264" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">495 + 491 + 40 = 1026</text>

  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#888">每深入一层，已有数字左移一位（×10）再补上当前节点值</text>
</svg>
