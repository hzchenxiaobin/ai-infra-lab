<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "0110", n = 3 → true</text>

  <!-- ===== string s with positions ===== -->
  <text x="28" y="60" font-size="11.5" fill="#446688" font-weight="bold">s =</text>
  <text x="68" y="48" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="108" y="48" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="148" y="48" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="188" y="48" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <rect x="52" y="54" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="74" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <rect x="92" y="54" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="54" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="54" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="220" y="74" font-size="11" fill="#888">n = 3, 答案需覆盖 {1, 2, 3}</text>

  <!-- ===== Walkthrough table ===== -->
  <text x="28" y="108" font-size="11.5" fill="#555" font-weight="bold">枚举过程（跳过前导 0，增量建值，超 n 即 break）：</text>

  <!-- table header -->
  <rect x="28" y="118" width="504" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="134" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">起点 i</text>
  <text x="120" y="134" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">子串</text>
  <text x="210" y="134" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">val（增量）</text>
  <text x="320" y="134" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">val ≤ n ?</text>
  <text x="440" y="134" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">动作</text>

  <!-- row 1: i=0, skip -->
  <rect x="28" y="146" width="504" height="24" fill="#fce4ec" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="120" y="162" text-anchor="middle" font-size="10.5" fill="#888">s[0]='0'</text>
  <text x="210" y="162" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="320" y="162" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="440" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过（前导0）</text>

  <!-- row 2: i=1, "1" -->
  <rect x="28" y="174" width="504" height="24" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="120" y="190" text-anchor="middle" font-size="10.5" fill="#333">"1"</text>
  <text x="210" y="190" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="320" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 ≤ 3 ✓</text>
  <text x="440" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">seen.add(1)</text>

  <!-- row 3: i=1, "11" -->
  <rect x="28" y="202" width="504" height="24" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="218" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="120" y="218" text-anchor="middle" font-size="10.5" fill="#333">"11"</text>
  <text x="210" y="218" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1×2+1=3</text>
  <text x="320" y="218" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 ≤ 3 ✓</text>
  <text x="440" y="218" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">seen.add(3)</text>

  <!-- row 4: i=1, "110" -->
  <rect x="28" y="230" width="504" height="24" fill="#fff8e1" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="246" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="120" y="246" text-anchor="middle" font-size="10.5" fill="#333">"110"</text>
  <text x="210" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3×2+0=6</text>
  <text x="320" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">6 &gt; 3 ✗</text>
  <text x="440" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">break</text>

  <!-- row 5: i=2, "1" -->
  <rect x="28" y="258" width="504" height="24" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="120" y="274" text-anchor="middle" font-size="10.5" fill="#333">"1"</text>
  <text x="210" y="274" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="320" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 ≤ 3 ✓</text>
  <text x="440" y="274" text-anchor="middle" font-size="10.5" fill="#888">已存在（跳过）</text>

  <!-- row 6: i=2, "10" -->
  <rect x="28" y="286" width="504" height="24" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="120" y="302" text-anchor="middle" font-size="10.5" fill="#333">"10"</text>
  <text x="210" y="302" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1×2+0=2</text>
  <text x="320" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 ≤ 3 ✓</text>
  <text x="440" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">seen.add(2)</text>

  <!-- row 7: i=3, skip -->
  <rect x="28" y="314" width="504" height="24" fill="#fce4ec" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="330" text-anchor="middle" font-size="10.5" fill="#888">s[3]='0'</text>
  <text x="210" y="330" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="320" y="330" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="440" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过（前导0）</text>

  <!-- ===== Result ===== -->
  <rect x="28" y="352" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="148" y="374" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">seen = {1, 2, 3}</text>
  <text x="148" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a">len(seen) = 3 == n → true ✓</text>

  <!-- contrast: n=4 -->
  <rect x="292" y="352" width="240" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="412" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">若 n = 4：缺 "100"=4</text>
  <text x="412" y="392" text-anchor="middle" font-size="11" fill="#b85450">len(seen) = 3 ≠ 4 → false</text>
</svg>
