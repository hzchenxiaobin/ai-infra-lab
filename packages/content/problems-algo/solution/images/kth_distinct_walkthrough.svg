<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：arr = [d,b,c,b,c,a], k = 2</text>

  <!-- Pass 1 标题 -->
  <text x="40" y="58" font-size="13" fill="#446688" filter="url(#rough2)">Pass 1：构建 freq</text>

  <!-- Pass 1 表头 -->
  <rect x="40" y="66" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="92" y="66" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]</text>
  <rect x="154" y="66" width="350" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="329" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">freq（更新后）</text>

  <!-- Pass 1 行 -->
  <rect x="40" y="92" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="92" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <text x="160" y="108" font-size="11" fill="#333" filter="url(#rough2)">{d:1}</text>

  <rect x="40" y="116" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="116" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="160" y="132" font-size="11" fill="#333" filter="url(#rough2)">{d:1, b:1}</text>

  <rect x="40" y="140" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="140" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="160" y="156" font-size="11" fill="#333" filter="url(#rough2)">{d:1, b:1, c:1}</text>

  <rect x="40" y="164" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="92" y="164" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="160" y="180" font-size="11" fill="#b85450" filter="url(#rough2)">{d:1, b:2, c:1}  ← b 第二次</text>

  <rect x="40" y="188" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="92" y="188" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="160" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">{d:1, b:2, c:2}  ← c 第二次</text>

  <rect x="40" y="212" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="212" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="160" y="228" font-size="11" fill="#333" filter="url(#rough2)">{d:1, b:2, c:2, a:1}</text>

  <!-- 分隔 -->
  <line x1="40" y1="246" x2="520" y2="246" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Pass 2 标题 -->
  <text x="40" y="266" font-size="13" fill="#4a7a3a" filter="url(#rough2)">Pass 2：按原序取第 k=2 个 distinct</text>

  <!-- Pass 2 表头 -->
  <rect x="40" y="274" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="92" y="274" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]</text>
  <rect x="154" y="274" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">freq</text>
  <rect x="236" y="274" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt</text>
  <rect x="298" y="274" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="291" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">动作</text>

  <!-- Pass 2 行 -->
  <rect x="40" y="300" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="300" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="122" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <text x="194" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="266" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="304" y="316" font-size="11" fill="#333" filter="url(#rough2)">cnt=1 ≠ k=2，继续</text>

  <rect x="40" y="324" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="324" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="340" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">b</text>
  <text x="194" y="340" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="266" y="340" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="304" y="340" font-size="11" fill="#999" filter="url(#rough2)">freq≠1，跳过</text>

  <rect x="40" y="348" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="348" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="364" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <text x="194" y="364" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="266" y="364" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="304" y="364" font-size="11" fill="#999" filter="url(#rough2)">freq≠1，跳过</text>

  <rect x="40" y="372" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="92" y="372" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="388" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">b</text>
  <text x="194" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="266" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="304" y="388" font-size="11" fill="#999" filter="url(#rough2)">freq≠1，跳过</text>

  <rect x="40" y="396" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="92" y="396" width="60" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="412" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <text x="194" y="412" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="266" y="412" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="304" y="412" font-size="11" fill="#999" filter="url(#rough2)">freq≠1，跳过</text>

  <rect x="40" y="420" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="436" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="420" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="122" y="436" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="194" y="436" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="266" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="304" y="436" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt=2 == k ✓ 返回 "a"</text>
</svg>
