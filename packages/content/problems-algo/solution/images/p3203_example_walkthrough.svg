<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：示例 2 的树（两棵相同）</text>

  <line x1="105" y1="80" x2="55" y2="145" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="80" x2="160" y2="145" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="105" y1="80" x2="105" y2="145" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="105" y1="145" x2="62" y2="220" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="105" y1="145" x2="102" y2="220" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="145" x2="142" y2="220" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="160" y1="145" x2="205" y2="220" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>

  <circle cx="105" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="55" cy="145" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="105" cy="145" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="160" cy="145" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="62" cy="220" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="62" y="225" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="102" cy="220" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="102" y="225" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="142" cy="220" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="225" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="205" cy="220" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="225" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="120" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">橙色 = 直径路径 4→2→0→3→6，长 4</text>

  <rect x="285" y="58" width="215" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="74" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">BFS</text>
  <text x="340" y="74" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="395" y="74" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">最远点</text>
  <text x="472" y="74" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">距离</text>

  <rect x="285" y="86" width="215" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="102" font-size="10.5" fill="#333" filter="url(#rough2)">第1遍</text>
  <text x="348" y="102" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="385" y="102" font-size="10.5" fill="#333" filter="url(#rough2)">4（并列任取）</text>
  <text x="470" y="102" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="285" y="114" width="215" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="130" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第2遍</text>
  <text x="348" y="130" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="388" y="130" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="458" y="130" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4 = d</text>

  <text x="392" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两棵树相同：d₁ = d₂ = 4</text>
  <text x="392" y="188" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">半径 = ⌈4/2⌉ = 2（中心在 0—2 中间）</text>
  <text x="392" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">连接点各选树中心即可</text>

  <rect x="70" y="258" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">跨界项 = ⌈d₁/2⌉ + ⌈d₂/2⌉ + 1 = 2 + 2 + 1 = 5</text>

  <rect x="70" y="298" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">ans = max(4, 4, 2+2+1) = 5 ✓</text>

  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 同法：d₁=2（星形），d₂=1 → max(2, 1, 1+1+1) = 3 ✓</text>
</svg>
