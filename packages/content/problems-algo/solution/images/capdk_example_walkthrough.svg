<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[1,2,3,4,5], k=2</text>

  <!-- Step 1: divisors -->
  <text x="28" y="54" font-size="10.5" fill="#666">① 因子</text>
  <rect x="80" y="40" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="58" text-anchor="middle" font-size="11" fill="#333">k=2 → {1, 2}</text>

  <!-- Step 2: nums and gcd -->
  <text x="28" y="98" font-size="10.5" fill="#666">② 数组</text>
  <rect x="80" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="104" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="168" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="104" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="212" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="104" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="256" y="84" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="104" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Arrow down to gcd -->
  <path d="M 100 116 L 100 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 144 116 L 144 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 188 116 L 188 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 232 116 L 232 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 276 116 L 276 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="128" font-size="10" fill="#4a7a3a">gcd(x, 2)</text>

  <text x="28" y="146" font-size="10.5" fill="#666">③ GCD</text>
  <rect x="80" y="132" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="132" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="132" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="132" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="256" y="132" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- freq table -->
  <text x="28" y="190" font-size="10.5" fill="#666">④ 频次</text>
  <rect x="80" y="176" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="194" text-anchor="middle" font-size="11" fill="#333">freq[1]=3</text>
  <rect x="148" y="176" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="178" y="194" text-anchor="middle" font-size="11" fill="#333">freq[2]=2</text>

  <!-- Step 5: pair enumeration table -->
  <text x="28" y="234" font-size="10.5" fill="#666">⑤ 配对</text>

  <!-- Table header -->
  <rect x="80" y="220" width="80" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="120" y="235" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">因子对</text>
  <rect x="162" y="220" width="80" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="202" y="235" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">d₁·d₂</text>
  <rect x="244" y="220" width="80" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="284" y="235" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">%k==0?</text>
  <rect x="326" y="220" width="130" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="391" y="235" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">贡献</text>

  <!-- Row 1: (1,1) -->
  <rect x="80" y="244" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="260" text-anchor="middle" font-size="10.5" fill="#333">(1, 1)</text>
  <rect x="162" y="244" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="260" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="244" y="244" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1%2≠0 ✗</text>
  <rect x="326" y="244" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="391" y="260" text-anchor="middle" font-size="10.5" fill="#b85450">跳过</text>

  <!-- Row 2: (1,2) -->
  <rect x="80" y="270" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="286" text-anchor="middle" font-size="10.5" fill="#333">(1, 2)</text>
  <rect x="162" y="270" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="286" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="244" y="270" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2%2=0 ✓</text>
  <rect x="326" y="270" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="391" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3×2 = 6</text>

  <!-- Row 3: (2,2) -->
  <rect x="80" y="296" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="312" text-anchor="middle" font-size="10.5" fill="#333">(2, 2)</text>
  <rect x="162" y="296" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="312" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="244" y="296" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="312" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4%2=0 ✓</text>
  <rect x="326" y="296" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="391" y="312" text-anchor="middle" font-size="10.5" fill="#4a7a3a">C(2,2) = 1</text>

  <!-- Total -->
  <rect x="244" y="326" width="212" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="346" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">合计 = 0 + 6 + 1 = 7</text>

  <!-- Note -->
  <rect x="40" y="370" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">注意</text>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#555">(1,1) 虽有 3 个 gcd=1 的元素（C(3,2)=3 对），但 1×1=1 不被 2 整除 → 全部跳过</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#555">(2,2) 同因子用 C(c,2)=c(c−1)/2，(1,2) 不同因子直接 freq[1]×freq[2]</text>
  <text x="280" y="438" text-anchor="middle" font-size="10" fill="#888">验证：7 对 = (0,1)(0,3)(1,2)(1,3)(1,4)(2,3)(3,4) ✓</text>
</svg>
