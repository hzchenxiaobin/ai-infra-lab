<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：车队遵循「领队」轨迹 + 从右向左单调栈弹吸收者</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">fleet 速度 = 最右(最慢)车速度，其轨迹是恒速直线，可用初始 pos/speed 直接算相遇</text>

  <!-- ===== Cars at t=0 (example 2) ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">cars (示例2): 位置→ </text>
  <g font-size="10" fill="#333">
    <rect x="60" y="80" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="88" y="99" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0: p3 s4</text>

    <rect x="130" y="80" width="56" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="158" y="99" text-anchor="middle" font-size="10" fill="#888">1: p5 s4</text>

    <rect x="200" y="80" width="56" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="228" y="99" text-anchor="middle" font-size="10" fill="#888">2: p6 s3</text>

    <rect x="270" y="80" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="298" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3: p9 s1</text>
  </g>
  <text x="340" y="99" font-size="9" fill="#888">↑ 最右最慢 = 领队</text>

  <!-- ===== Stack when processing car 0 ===== -->
  <text x="30" y="138" font-size="11" fill="#d6a040" font-weight="bold">处理 car 0 时栈 = [3, 2, 1]（栈顶=1，最近的下一辆车）</text>

  <!-- stack column -->
  <g font-size="10">
    <rect x="300" y="150" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="360" y="167" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[3] 领队 s1 ← 栈底</text>

    <rect x="300" y="180" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="360" y="197" text-anchor="middle" fill="#b85450" font-weight="bold">[2] s3</text>

    <rect x="300" y="210" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="360" y="227" text-anchor="middle" fill="#b85450" font-weight="bold">[1] s4 ← 栈顶</text>
  </g>

  <!-- car 0 pointer -->
  <rect x="120" y="210" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="165" y="227" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">car 0: s4</text>
  <path d="M 210 223 L 296 223" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pop 1: same speed ===== -->
  <text x="30" y="256" font-size="10" fill="#b85450" font-weight="bold">① s0(4) ≤ s1(4)：同速永远追不上 → 弹 1</text>
  <path d="M 300 223 L 250 223" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="227" font-size="9" fill="#b85450">弹!</text>

  <!-- ===== Pop 2: absorbed first ===== -->
  <text x="30" y="284" font-size="10" fill="#b85450" font-weight="bold">② s0(4) &gt; s2(3)，t=(6−3)/(4−3)=3；但 res[2]=1.5 &lt; 3</text>
  <text x="30" y="300" font-size="10" fill="#b85450" font-weight="bold">    → 2 在 1.5s 时已被领队 3 吸收，0 还没追上 → 弹 2</text>
  <path d="M 300 193 L 250 193" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="197" font-size="9" fill="#b85450">弹!</text>

  <!-- ===== Catch 3 ===== -->
  <text x="30" y="328" font-size="10" fill="#4a7a3a" font-weight="bold">③ s0(4) &gt; s3(1)，t=(9−3)/(4−1)=2；res[3]=−1（永不合并）</text>
  <text x="30" y="344" font-size="10" fill="#4a7a3a" font-weight="bold">    → 0 追上领队 3 的车队 → res[0] = 2 ✓</text>
  <path d="M 210 223 Q 260 270 300 163" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Summary box ===== -->
  <rect x="30" y="362" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="382" font-size="11" fill="#d6a040" font-weight="bold">关键洞察：</text>
  <text x="50" y="400" font-size="10" fill="#555">车队轨迹 = 最右最慢车（领队）的恒速直线，后车并入不改轨迹 → 用领队初始 pos/speed 算相遇即可</text>
  <text x="50" y="416" font-size="10" fill="#555">弹栈条件：sᵢ ≤ sⱼ（追不上）或 t &gt; res[j]（j 先被吸收）→ 弹掉 j 看下一辆</text>
  <text x="50" y="430" font-size="10" fill="#d6a040" font-weight="bold">从右向左扫，栈存「尚未被吸收的领队候选」，O(n) 均摊</text>
</svg>
