<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：明细 → 秒差 → 分组 → 三路聚合 → 取整排序</text>

  <rect x="185" y="44" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">全表 ParkingTransactions</text>

  <path d="M 260 74 L 260 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="88" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 逐行算秒差</text>
  <text x="260" y="119" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">TIMESTAMPDIFF(SECOND, entry_time, exit_time)</text>

  <path d="M 260 126 L 260 138" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="140" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② GROUP BY car_id（跨场合并）</text>

  <path d="M 260 172 L 260 184" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 103 194 L 417 194" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 103 194 L 103 206" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 260 194 L 260 206" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 417 194 L 417 206" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="23" y="208" width="160" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="103" y="228" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">SUM(sec) ÷ 3600</text>
  <text x="103" y="244" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">ROUND(·, 2)</text>
  <text x="103" y="263" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total_hours</text>

  <rect x="180" y="208" width="160" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">SUM(fee_paid)</text>
  <text x="260" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">ROUND(·, 2)</text>
  <text x="260" y="263" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total_fees</text>

  <rect x="337" y="208" width="160" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="417" y="228" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">SUM(fee)×3600 ÷ SUM(sec)</text>
  <text x="417" y="244" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">ROUND(·, 2)</text>
  <text x="417" y="263" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">avg_fee_per_hour</text>

  <path d="M 103 274 L 103 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 260 274 L 260 288" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 417 274 L 417 288" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <rect x="80" y="290" width="360" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">④⑤ ORDER BY car_id 升序 · 输出 2 行</text>

  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">ROUND 套在聚合外面：先总量、后取整；解法 B 把 ① 收进 CTE 明细层</text>
</svg>
