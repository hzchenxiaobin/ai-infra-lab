<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：GROUP BY id → 12 列条件聚合 → 输出</text>

  <!-- ===== Step 1: GROUP BY id ===== -->
  <rect x="30" y="50" width="160" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤 ①</text>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY id</text>
  <text x="110" y="100" text-anchor="middle" font-size="8" fill="#555">按部门 id 分组</text>
  <text x="110" y="112" text-anchor="middle" font-size="8" fill="#555">同一部门的行折叠</text>

  <!-- arrow 1 → 2 -->
  <path d="M195 85 L230 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Conditional aggregation ===== -->
  <rect x="235" y="50" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="335" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">步骤 ②</text>
  <text x="335" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">12 列条件聚合</text>
  <text x="335" y="98" text-anchor="middle" font-size="8" fill="#555">每列 = SUM(IF(...))</text>
  <text x="335" y="110" text-anchor="middle" font-size="7" fill="#888">month='Jan' → Jan_Revenue</text>

  <!-- arrow 2 → 3 -->
  <path d="M440 85 L475 85" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Output ===== -->
  <rect x="480" y="50" width="60" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="68" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <text x="510" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">输出</text>
  <text x="510" y="98" text-anchor="middle" font-size="7" fill="#555">13 列</text>
  <text x="510" y="110" text-anchor="middle" font-size="7" fill="#555">id + 12月</text>

  <!-- ===== Detail: How each column works ===== -->
  <rect x="30" y="140" width="510" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">每列的生成逻辑（以 Jan_Revenue 为例）</text>

  <!-- Input row -->
  <text x="50" y="182" font-size="9" fill="#446688" font-weight="bold">组内行：</text>
  <rect x="110" y="170" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="130" y="184" text-anchor="middle" font-size="8" fill="#333">month</text>
  <text x="175" y="184" text-anchor="middle" font-size="8" fill="#333">revenue</text>
  <line x1="150" y1="170" x2="150" y2="190" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- IF evaluation -->
  <text x="225" y="182" font-size="9" fill="#4a7a3a" font-weight="bold">→ IF(month='Jan', rev, NULL)</text>

  <!-- Output -->
  <text x="420" y="182" font-size="9" fill="#b85450" font-weight="bold">→ SUM 聚合</text>

  <!-- table of IF evaluations -->
  <rect x="50" y="195" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="70" y="208" text-anchor="middle" font-size="7.5" fill="#333">Jan</text>
  <text x="115" y="208" text-anchor="middle" font-size="7.5" fill="#333">8000</text>
  <line x1="90" y1="195" x2="90" y2="213" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="160" y="208" font-size="8" fill="#d6a040" font-weight="bold">→ 8000 ✓</text>
  <text x="430" y="208" font-size="8" fill="#4a7a3a">SUM=8000</text>

  <rect x="50" y="213" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="7.5" fill="#333">Feb</text>
  <text x="115" y="226" text-anchor="middle" font-size="7.5" fill="#333">7000</text>
  <line x1="90" y1="213" x2="90" y2="231" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="160" y="226" font-size="8" fill="#888">→ NULL ✗</text>
  <text x="430" y="226" font-size="8" fill="#888">(非Jan跳过)</text>

  <rect x="50" y="231" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="70" y="244" text-anchor="middle" font-size="7.5" fill="#333">Mar</text>
  <text x="115" y="244" text-anchor="middle" font-size="7.5" fill="#333">6000</text>
  <line x1="90" y1="231" x2="90" y2="249" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <text x="160" y="244" font-size="8" fill="#888">→ NULL ✗</text>
  <text x="430" y="244" font-size="8" fill="#888">(非Jan跳过)</text>

  <!-- result -->
  <rect x="430" y="255" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="269" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Jan_Revenue=8000</text>

  <!-- ===== Bottom: SQL skeleton ===== -->
  <rect x="30" y="285" width="510" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="305" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">SQL 骨架（12 列模式相同，仅 month 值不同）</text>

  <text x="50" y="325" font-size="9.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">SELECT id,</text>
  <text x="70" y="342" font-size="9" fill="#d6a040" font-family="'Comic Sans MS', monospace">SUM(IF(month = 'Jan', revenue, NULL)) AS Jan_Revenue,</text>
  <text x="70" y="358" font-size="9" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">SUM(IF(month = 'Feb', revenue, NULL)) AS Feb_Revenue,</text>
  <text x="110" y="374" font-size="9" fill="#888" font-family="'Comic Sans MS', monospace">... (Mar ~ Nov 同理) ...</text>
  <text x="70" y="390" font-size="9" fill="#b85450" font-family="'Comic Sans MS', monospace">SUM(IF(month = 'Dec', revenue, NULL)) AS Dec_Revenue</text>
  <text x="50" y="400" font-size="9.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">FROM Department GROUP BY id;</text>
</svg>
