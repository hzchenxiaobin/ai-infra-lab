<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：偶数看个位 + 位数定大小 ⇒ 最后一个 '2' 的整个前缀</text>

  <!-- 面板一：奇偶看个位 -->
  <rect x="20" y="38" width="520" height="152" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 偶数 ⟺ 末位是 '2'：整数的奇偶只由个位决定</text>

  <!-- s = "221" 格子 -->
  <rect x="60" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="72" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="140" y="72" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="117" y="94" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="157" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 划掉 '1' -->
  <path d="M 148 80 L 166 98 M 166 80 L 148 98" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>

  <!-- 下标 -->
  <text x="77" y="120" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="117" y="120" text-anchor="middle" font-size="9" fill="#2d5a24" filter="url(#rough2)">1 ← 最后的 '2'</text>
  <text x="157" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 下移箭头 -->
  <path d="M 117 126 C 117 132, 100 130, 100 138" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 117 126 C 117 132, 134 130, 134 138" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结果格子 -->
  <rect x="60" y="142" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="100" y="142" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="164" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="117" y="164" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>

  <!-- 右侧说明 -->
  <text x="300" y="84" font-size="11" fill="#b85450" filter="url(#rough2)">末位 '1' ⇒ 奇数 ✗</text>
  <text x="300" y="106" font-size="11" fill="#2d5a24" filter="url(#rough2)">末位 '2' ⇒ 偶数 ✓（唯一的偶数数字）</text>
  <text x="300" y="150" font-size="11" fill="#33506b" filter="url(#rough2)">示例 2：s = "221" → 删末尾 '1'</text>
  <text x="300" y="170" font-size="11" fill="#33506b" filter="url(#rough2)">保留前缀 s[0..1] = "22" = 最大偶数</text>

  <text x="36" y="182" font-size="10" fill="#33506b" filter="url(#rough2)">字符集只有 '1'（奇）与 '2'（偶）⇒ 合法答案必以 '2' 结尾</text>

  <!-- 面板二：位数优先 -->
  <rect x="20" y="206" width="520" height="170" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="228" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 位数优先：无 '0' ⇒ 无前导零 ⇒ 位数多者必大</text>

  <!-- s = "12112" 格子 -->
  <rect x="48" y="240" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="80" y="240" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="112" y="240" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="144" y="240" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="176" y="240" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="259" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="94" y="259" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="126" y="259" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="158" y="259" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="190" y="259" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">2</text>

  <text x="62" y="282" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="94" y="282" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="126" y="282" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="158" y="282" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="190" y="282" text-anchor="middle" font-size="9" fill="#2d5a24" filter="url(#rough2)">4 = i</text>

  <!-- 候选列表 -->
  <text x="280" y="248" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">候选（以 '2' 结尾的子序列）：</text>
  <text x="280" y="266" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">"12"（2位）、"112"（3位）、</text>
  <text x="280" y="284" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">"2112"（4位）、"12112"（5位）</text>
  <text x="280" y="304" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">位数上界 i+1 = 5，前缀独占！</text>

  <!-- 结论 -->
  <text x="36" y="316" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">任何以 '2' 结尾的子序列：末字符下标 ≤ i ⇒ 长度 ≤ i+1</text>
  <text x="36" y="340" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">前缀 s[0..i] 长度恰为 i+1 且末位 '2' ⇒ 它就是最大偶数</text>
  <text x="36" y="362" font-size="10.5" fill="#b85450" filter="url(#rough2)">无 '2' ⇒ 返回 ""（全 '1' 串不存在偶数子序列）</text>
</svg>
