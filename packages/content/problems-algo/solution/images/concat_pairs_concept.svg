<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：target = 前缀 + 后缀，哈希表 O(1) 查互补串频次</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个 nums[i] 必是 target 的前缀 → 后缀唯一确定 → 查表计数</text>

  <!-- Left: target decomposition -->
  <text x="40" y="74" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">target = "7777" 的三种合法拆分：</text>

  <!-- Split 1: 777 | 7 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="86" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="59" y="106" fill="#446688" font-weight="bold">7</text>
    <rect x="80" y="86" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="99" y="106" fill="#446688" font-weight="bold">7</text>
    <rect x="120" y="86" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="139" y="106" fill="#446688" font-weight="bold">7</text>
    <rect x="160" y="86" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="179" y="106" fill="#4a7a3a" font-weight="bold">7</text>
  </g>
  <text x="210" y="106" font-size="11" fill="#333" filter="url(#rough2)">"777"+"7" → 1×1 = 1</text>

  <!-- Split 2: 7 | 777 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="126" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="59" y="146" fill="#446688" font-weight="bold">7</text>
    <rect x="80" y="126" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="99" y="146" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="120" y="126" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="139" y="146" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="160" y="126" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="179" y="146" fill="#4a7a3a" font-weight="bold">7</text>
  </g>
  <text x="210" y="146" font-size="11" fill="#333" filter="url(#rough2)">"7"+"777" → 1×1 = 1</text>

  <!-- Split 3: 77 | 77 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="166" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="59" y="186" fill="#446688" font-weight="bold">7</text>
    <rect x="80" y="166" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="99" y="186" fill="#446688" font-weight="bold">7</text>
    <rect x="120" y="166" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="139" y="186" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="160" y="166" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="179" y="186" fill="#4a7a3a" font-weight="bold">7</text>
  </g>
  <text x="210" y="186" font-size="11" fill="#333" filter="url(#rough2)">"77"+"77" → 2×1 = 2</text>

  <!-- Legend -->
  <rect x="40" y="210" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="222" font-size="10" fill="#446688" filter="url(#rough2)">前缀(nums[i])</text>
  <rect x="150" y="210" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="222" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后缀(nums[j])</text>

  <!-- Right: hash map table -->
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">哈希表 cnt</text>
  <rect x="340" y="84" width="180" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="400" y="108" fill="#888" font-size="10">字符串</text>
    <text x="480" y="108" fill="#888" font-size="10">频次</text>
    <line x1="356" y1="116" x2="504" y2="116" stroke="#ddd" stroke-width="1"/>
    <text x="400" y="136" fill="#446688" font-weight="bold">"777"</text>
    <text x="480" y="136" fill="#333" font-weight="bold">1</text>
    <text x="400" y="160" fill="#446688" font-weight="bold">"7"</text>
    <text x="480" y="160" fill="#333" font-weight="bold">1</text>
    <text x="400" y="184" fill="#446688" font-weight="bold">"77"</text>
    <text x="480" y="184" fill="#333" font-weight="bold">2</text>
  </g>
  <text x="430" y="206" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">O(n) 一次遍历建表</text>

  <!-- Arrow from splits to hash map -->
  <path d="M 200 150 L 330 150" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="142" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">查后缀频次</text>

  <!-- Formula box -->
  <rect x="40" y="248" width="480" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">计数公式（遍历每个唯一前缀 s）</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s ≠ suffix：ans += cnt[s] × cnt[suffix]</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s = suffix ：ans += cnt[s] × (cnt[s] − 1)   ← i ≠ j 排自身</text>

  <!-- Note -->
  <rect x="40" y="340" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个前缀只查一次互补后缀；(i,j) 与 (j,i) 由两个方向分别覆盖</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">合计 1 + 1 + 2 = 4，与示例一致</text>
</svg>
