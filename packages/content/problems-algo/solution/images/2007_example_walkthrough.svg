<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：changed = [1,3,4,2,6,8]</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">频率表随每步消耗变化；绿=取作原值，橙=被消耗的双倍，灰=已耗尽</text>

  <!-- Column headers -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle">
    <text x="80" y="74">步骤</text>
    <text x="160" y="74">处理 v</text>
    <text x="300" y="74">频率表（升序键）</text>
    <text x="500" y="74">动作 / 结果</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="82" x2="560" y2="82" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step 0: initial freq -->
  <text x="80" y="108" font-size="10.5" fill="#555" font-weight="bold" text-anchor="middle" filter="url(#rough2)">初始</text>
  <text x="160" y="108" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">—</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="218" y="110" fill="#446688" font-weight="bold">1:1</text>
    <rect x="240" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="258" y="110" fill="#446688" font-weight="bold">2:1</text>
    <rect x="280" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="298" y="110" fill="#446688" font-weight="bold">3:1</text>
    <rect x="320" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="338" y="110" fill="#446688" font-weight="bold">4:1</text>
    <rect x="360" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="378" y="110" fill="#446688" font-weight="bold">6:1</text>
    <rect x="400" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="418" y="110" fill="#446688" font-weight="bold">8:1</text>
  </g>
  <text x="500" y="108" font-size="10.5" fill="#888" filter="url(#rough2)">n=6 偶，排序键</text>

  <!-- Step 1: v=1 -->
  <text x="80" y="152" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="142" y="136" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="154" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="136" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="218" y="154" fill="#4a7a3a" font-weight="bold">1:1</text>
    <rect x="240" y="136" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="258" y="154" fill="#d6a040" font-weight="bold">2:1</text>
    <rect x="280" y="136" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="298" y="154" fill="#446688" font-weight="bold">3:1</text>
    <rect x="320" y="136" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="338" y="154" fill="#446688" font-weight="bold">4:1</text>
    <rect x="360" y="136" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="378" y="154" fill="#446688" font-weight="bold">6:1</text>
    <rect x="400" y="136" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="418" y="154" fill="#446688" font-weight="bold">8:1</text>
  </g>
  <text x="500" y="148" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 1，消耗 2×1</text>
  <text x="500" y="162" font-size="10" fill="#888" filter="url(#rough2)">res=[1]</text>

  <!-- Step 2: v=2 (skip) -->
  <text x="80" y="196" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="142" y="180" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="198" font-size="11" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="180" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="218" y="198" fill="#aaa" font-weight="bold">1:0</text>
    <rect x="240" y="180" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="258" y="198" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="280" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="298" y="198" fill="#446688" font-weight="bold">3:1</text>
    <rect x="320" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="338" y="198" fill="#446688" font-weight="bold">4:1</text>
    <rect x="360" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="378" y="198" fill="#446688" font-weight="bold">6:1</text>
    <rect x="400" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="418" y="198" fill="#446688" font-weight="bold">8:1</text>
  </g>
  <text x="500" y="196" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">freq[2]=0，跳过</text>

  <!-- Step 3: v=3 -->
  <text x="80" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="142" y="224" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="242" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="224" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="218" y="242" fill="#aaa" font-weight="bold">1:0</text>
    <rect x="240" y="224" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="258" y="242" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="280" y="224" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="298" y="242" fill="#4a7a3a" font-weight="bold">3:1</text>
    <rect x="320" y="224" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="338" y="242" fill="#446688" font-weight="bold">4:1</text>
    <rect x="360" y="224" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="378" y="242" fill="#d6a040" font-weight="bold">6:1</text>
    <rect x="400" y="224" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="418" y="242" fill="#446688" font-weight="bold">8:1</text>
  </g>
  <text x="500" y="236" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 3，消耗 6×1</text>
  <text x="500" y="250" font-size="10" fill="#888" filter="url(#rough2)">res=[1,3]</text>

  <!-- Step 4: v=4 -->
  <text x="80" y="284" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="142" y="268" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="286" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="268" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="218" y="286" fill="#aaa" font-weight="bold">1:0</text>
    <rect x="240" y="268" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="258" y="286" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="280" y="268" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="298" y="286" fill="#aaa" font-weight="bold">3:0</text>
    <rect x="320" y="268" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="338" y="286" fill="#4a7a3a" font-weight="bold">4:1</text>
    <rect x="360" y="268" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="286" fill="#aaa" font-weight="bold">6:0</text>
    <rect x="400" y="268" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="418" y="286" fill="#d6a040" font-weight="bold">8:1</text>
  </g>
  <text x="500" y="280" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 4，消耗 8×1</text>
  <text x="500" y="294" font-size="10" fill="#888" filter="url(#rough2)">res=[1,3,4]</text>

  <!-- Step 5,6: skip 6,8 -->
  <text x="80" y="328" font-size="10.5" fill="#888" font-weight="bold" text-anchor="middle" filter="url(#rough2)">5,6</text>
  <text x="160" y="328" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">6,8</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="200" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="218" y="330" fill="#aaa" font-weight="bold">1:0</text>
    <rect x="240" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="258" y="330" fill="#aaa" font-weight="bold">2:0</text>
    <rect x="280" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="298" y="330" fill="#aaa" font-weight="bold">3:0</text>
    <rect x="320" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="338" y="330" fill="#aaa" font-weight="bold">4:0</text>
    <rect x="360" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="330" fill="#aaa" font-weight="bold">6:0</text>
    <rect x="400" y="312" width="36" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="418" y="330" fill="#aaa" font-weight="bold">8:0</text>
  </g>
  <text x="500" y="328" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">freq=0，均跳过</text>

  <!-- Divider -->
  <line x1="40" y1="350" x2="560" y2="350" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Counter-example: 0 odd -->
  <text x="40" y="378" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">反例：changed = [6,3,0,1] → 排序 [0,1,3,6]</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="388" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="142" y="407" fill="#d6a040" font-weight="bold">0:1</text>
    <rect x="168" y="388" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="190" y="407" fill="#446688" font-weight="bold">1:1</text>
    <rect x="216" y="388" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="238" y="407" fill="#446688" font-weight="bold">3:1</text>
    <rect x="264" y="388" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="286" y="407" fill="#446688" font-weight="bold">6:1</text>
  </g>
  <text x="330" y="407" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">v=0：freq[0]=1 为奇 → return []</text>

  <!-- Note -->
  <rect x="40" y="430" width="520" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="450" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">观察要点：</text>
  <text x="56" y="468" font-size="10" fill="#333" filter="url(#rough2)">① 每步「最小未配对」只能当原值——它的双倍 2v 必须在场，否则非法；</text>
  <text x="56" y="484" font-size="10" fill="#333" filter="url(#rough2)">② 0 是自环特例（0×2=0），必须成对出现，奇数个 0 直接非法；</text>
  <text x="56" y="500" font-size="10" fill="#333" filter="url(#rough2)">③ 频率表随消耗递减，被消耗的键后续遇到 freq=0 即跳过。</text>
</svg>
