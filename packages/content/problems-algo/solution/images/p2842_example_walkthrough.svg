<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "bcca"，k = 2</text>

  <!-- row 1: freq -->
  <text x="30" y="71" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">① 频次</text>
  <rect x="130" y="50" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b : 1</text>
  <rect x="215" y="50" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c : 2</text>
  <rect x="300" y="50" width="70" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a : 1</text>
  <text x="400" y="71" font-size="10.5" fill="#999" filter="url(#rough2)">f(b)=1，f(c)=2，f(a)=1</text>

  <!-- row 2: sorted -->
  <text x="30" y="113" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">② 降序</text>
  <rect x="130" y="92" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="113" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="186" y="92" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="113" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="242" y="92" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="113" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="152" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c</text>
  <text x="208" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b</text>
  <text x="264" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <path d="M 326 100 L 282 104" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="440" y="105" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x = f[k−1] = 1</text>
  <text x="440" y="122" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">（第 k = 2 大频次）</text>

  <!-- row 3: zones -->
  <text x="30" y="175" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">③ 三区</text>
  <rect x="130" y="154" width="440" height="40" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">&gt;x：{c}（g=1）　　=x：{a, b}（cnt_x=2）　　&lt;x：无</text>

  <!-- row 4: formula -->
  <text x="30" y="227" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">④ 公式</text>
  <rect x="130" y="206" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="231" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = 2 × C(2, 1) × 1¹ = 4</text>

  <!-- row 5: subsequences -->
  <text x="30" y="279" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">⑤ 子序列</text>
  <rect x="130" y="258" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b₀c₁</text>
  <rect x="230" y="258" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b₀c₂</text>
  <rect x="330" y="258" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c₁a₃</text>
  <rect x="430" y="258" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c₂a₃</text>

  <!-- bottom box -->
  <rect x="70" y="306" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">前 2 个来自集合 {b, c}（∏f = 1×2），后 2 个来自集合 {c, a}（∏f = 2×1）</text>
  <text x="310" y="348" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 个子序列美丽值均为 3，恰为最大值 ✓</text>

  <text x="310" y="384" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">交叉验证：直接枚举 s 的全部 5 个 k 子序列，美丽值 3, 3, 2, 3, 3 —— 最大值 3 出现 4 次 ✓</text>
</svg>
