<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：pattern = "abb"</text>
  <text x="290" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">把每个串转成「首次出现下标」序列，与 pattern 编码 [0,1,1] 比对</text>

  <!-- 表头 -->
  <rect x="30" y="64" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">word</text>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">首现编码</text>
  <text x="400" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pattern 编码</text>
  <text x="510" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结果</text>

  <!-- 行 1: abc -> [0,1,2] != [0,1,1] -->
  <rect x="30" y="98" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="98" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="124" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="136" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="222" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="234" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="104" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="286" y="124" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="400" y="124" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="124" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不等</text>

  <!-- 行 2: deq -> [0,1,2] -->
  <rect x="30" y="142" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="168" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="98" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="124" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="136" y="168" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="222" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="234" y="168" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="148" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="286" y="168" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="400" y="168" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="168" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不等</text>

  <!-- 行 3: mee -> [0,1,1] ==  ✓ 高亮 -->
  <rect x="30" y="186" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="84" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m</text>
  <rect x="98" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="110" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="124" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="136" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="222" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="234" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="192" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="286" y="212" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="400" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ 匹配</text>

  <!-- 行 4: aqq -> [0,1,1] == ✓ 高亮 -->
  <rect x="30" y="230" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="84" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="98" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="110" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="124" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="136" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">q</text>
  <rect x="222" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="234" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="236" width="24" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="286" y="256" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="400" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ 匹配</text>

  <!-- 行 5: dkd -> [0,1,0] -->
  <rect x="30" y="274" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="98" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">k</text>
  <rect x="124" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="136" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="222" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="234" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="280" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="286" y="300" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="300" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不等</text>

  <!-- 行 6: ccc -> [0,0,0] -->
  <rect x="30" y="318" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="344" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="98" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="344" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="124" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="136" y="344" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="222" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="234" y="344" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="248" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="274" y="324" width="24" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="286" y="344" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="400" y="344" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[0,1,1]</text>
  <text x="510" y="344" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不等</text>

  <!-- 底部结论 -->
  <rect x="150" y="376" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">编码相等者 → 输出 ["mee","aqq"]</text>

  <text x="290" y="424" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">注：首现编码法与双向哈希等价，见第 5 节</text>
</svg>
