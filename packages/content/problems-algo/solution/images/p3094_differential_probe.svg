<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：num = 2^i 连问两次，差值 ±1 暴露第 i 位</text>

  <!-- num = 2^i bit strip -->
  <text x="46" y="56" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">询问数：num = 2^i（仅第 i 位为 1）</text>
  <rect x="200" y="42" width="30" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="234" y="42" width="30" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="268" y="42" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="59" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="302" y="42" width="30" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="336" y="42" width="30" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="283" y="80" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">第 i 位</text>
  <text x="392" y="59" font-size="10" fill="#999" filter="url(#rough2)">XOR 只会翻转这一位</text>

  <!-- Case A: bit = 1 -->
  <rect x="40" y="98" width="265" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="172" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 A：初始第 i 位 = 1</text>

  <text x="60" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">第 1 次调用：</text>
  <rect x="140" y="130" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="176" y="146" font-size="10.5" fill="#333" filter="url(#rough2)">vs 1 → 相同 ✓（计 +1）</text>

  <text x="60" y="174" font-size="10.5" fill="#333" filter="url(#rough2)">副作用翻转后：</text>
  <rect x="140" y="160" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="176" y="176" font-size="10.5" fill="#333" filter="url(#rough2)">vs 1 → 不同 ✗</text>

  <text x="60" y="204" font-size="10.5" fill="#999" filter="url(#rough2)">其余 29 位：两次贡献完全相同</text>
  <rect x="60" y="216" width="225" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="172" y="236" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c1 = c2 + 1 → 该位为 1</text>

  <!-- Case B: bit = 0 -->
  <rect x="315" y="98" width="265" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 B：初始第 i 位 = 0</text>

  <text x="335" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">第 1 次调用：</text>
  <rect x="415" y="130" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="451" y="146" font-size="10.5" fill="#333" filter="url(#rough2)">vs 1 → 不同 ✗</text>

  <text x="335" y="174" font-size="10.5" fill="#333" filter="url(#rough2)">副作用翻转后：</text>
  <rect x="415" y="160" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="451" y="176" font-size="10.5" fill="#333" filter="url(#rough2)">vs 1 → 相同 ✓（计 +1）</text>

  <text x="335" y="204" font-size="10.5" fill="#999" filter="url(#rough2)">其余 29 位：两次贡献完全相同</text>
  <rect x="335" y="216" width="225" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="447" y="236" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c1 = c2 − 1 → 该位为 0</text>

  <!-- key point -->
  <rect x="40" y="274" width="540" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两次调用唯一的差别就是第 i 位：第 1 次看「原始位 vs 1」，第 2 次看「翻转位 vs 1」</text>
  <text x="310" y="308" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 次调用还顺手把 n 恢复了原值（同参 XOR 自消），下一轮探测不受干扰</text>

  <!-- formula box -->
  <rect x="40" y="330" width="540" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">代数视角（设初始隐藏数为 n₀）</text>
  <text x="310" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c1 = 30 − popcount(n₀ ⊕ 2^i)　　c2 = 30 − popcount(n₀)</text>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c1 − c2 = popcount(n₀) − popcount(n₀ ⊕ 2^i) = +1（位=1）/ −1（位=0）</text>
  <text x="310" y="424" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">c2 与 i 无关，恰等于 commonBits(0) 的返回值 —— 官方 hints 里先存下的 base</text>
</svg>
