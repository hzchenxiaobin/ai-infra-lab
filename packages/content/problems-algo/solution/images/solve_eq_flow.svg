<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按 '=' 切分 → 两侧解析 → 合并 a,b → 三分支判定</text>

  <!-- ===== Step 1: split ===== -->
  <rect x="180" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按 '=' 切分为 left / right</text>

  <path d="M 280 84 L 280 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: parse both sides ===== -->
  <rect x="120" y="112" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">逐项解析两侧</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a">x 项累加系数，数字项累加常数</text>

  <path d="M 280 168 L 280 192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 3: merge ===== -->
  <rect x="140" y="196" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a = c_L − c_R，b = b_L − b_R</text>

  <path d="M 280 244 L 280 268" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 4: diamond a == 0 ? ===== -->
  <polygon points="280,268 400,320 280,372 160,320" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a == 0 ?</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">（x 项全消去）</text>

  <!-- No branch (left) → return x = -b/a -->
  <path d="M 160 320 L 80 320" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="300" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="60" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">x=−b/a</text>

  <!-- Yes branch (down) → diamond b == 0 ? -->
  <path d="M 280 372 L 280 392" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="288" y="386" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <polygon points="280,392 380,432 280,472 180,432" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b == 0 ?</text>

  <!-- b==0 → Infinite (left) -->
  <path d="M 180 432 L 110 432" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="125" y="424" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="40" y="412" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="430" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Infinite</text>
  <text x="90" y="444" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">solutions</text>

  <!-- b!=0 → No solution (right) -->
  <path d="M 380 432 L 450 432" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="435" y="424" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="412" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="430" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <text x="475" y="444" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">solution</text>
</svg>
