<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">核心观察：子数组扩展时 gcd 单调不增，k∤g 即可终止</text>
  <text x="270" y="40" text-anchor="middle" font-size="11" fill="#888">nums = [9, 3, 1, 2, 6, 3]，k = 3</text>

  <!-- ====== TOP: the array cells ====== -->
  <text x="58" y="70" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold">nums</text>
  <!-- cells: 9 3 1 2 6 3 at x=80,136,192,248,304,360 (w=48) -->
  <rect x="80" y="52" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="136" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="304" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="360" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- index labels -->
  <text x="104" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=0</text>
  <text x="160" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="216" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="272" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="328" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="384" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>

  <text x="58" y="74" text-anchor="end" font-size="9.5" fill="#b85450">起点</text>

  <!-- ====== LEFT: gcd ladder for start i=0 ====== -->
  <text x="150" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">从 i=0 向右扩展，前缀 gcd 阶梯下降</text>

  <!-- j=0: sub [9], g=9  (blue: g>k but k|g -> continue) -->
  <rect x="60" y="142" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="166" font-size="11.5" fill="#333" font-weight="bold">j=0  [9]</text>
  <text x="252" y="166" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold">g = 9</text>
  <text x="120" y="158" text-anchor="middle" font-size="9" fill="#888">3 | 9 ✓ 继续</text>

  <!-- down arrow with label -->
  <line x1="160" y1="184" x2="160" y2="206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="200" font-size="10.5" fill="#666" font-weight="bold">gcd(9, 3) = 3</text>

  <!-- j=1: sub [9,3], g=3  (green: ==k -> count) -->
  <rect x="60" y="210" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="78" y="234" font-size="11.5" fill="#333" font-weight="bold">j=1  [9,3]</text>
  <text x="252" y="234" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">g = 3</text>
  <text x="120" y="226" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">== k ✓ 计数</text>

  <!-- down arrow with label -->
  <line x1="160" y1="252" x2="160" y2="274" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="268" font-size="10.5" fill="#666" font-weight="bold">gcd(3, 1) = 1</text>

  <!-- j=2: sub [9,3,1], g=1  (red: k∤g -> break) -->
  <rect x="60" y="278" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="78" y="302" font-size="11.5" fill="#333" font-weight="bold">j=2  [9,3,1]</text>
  <text x="252" y="302" text-anchor="end" font-size="12.5" fill="#b85450" font-weight="bold">g = 1</text>
  <text x="120" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3 ∤ 1 → break</text>

  <!-- break arrow to the right -->
  <path d="M 262 298 L 330 298" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">终止内层</text>

  <!-- ====== RIGHT: insight box ====== -->
  <rect x="330" y="142" width="180" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="420" y="162" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">为何 k∤g 可早退？</text>
  <text x="340" y="182" font-size="9.5" fill="#555">扩展后 g' = gcd(g, x)</text>
  <text x="340" y="197" font-size="9.5" fill="#555">必有 g' | g（整除旧 g）</text>
  <text x="340" y="212" font-size="9.5" fill="#555">故 g' 的全部取值都是</text>
  <text x="340" y="227" font-size="9.5" fill="#555">g 的因子；k∤g ⇒ k 不</text>
  <text x="340" y="242" font-size="9.5" fill="#555">可能是 g' ⇒ 永不到 k</text>

  <!-- ====== BOTTOM: monotonic note ====== -->
  <rect x="40" y="338" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="11.5" fill="#446688" font-weight="bold">两条关键性质</text>
  <text x="60" y="380" font-size="10.5" fill="#444">① 单调不增：g_{j+1} = gcd(g_j, nums[j+1])，而 g_{j+1} | g_j ⇒ g_{j+1} ≤ g_j</text>
  <text x="60" y="398" font-size="10.5" fill="#444">② 整除传递：后续所有 gcd 都整除当前 g；故「k 能否成为某步 gcd」由「k | g」一票否决</text>
  <text x="60" y="416" font-size="10.5" fill="#b85450" font-weight="bold">⇒ 一旦 g % k != 0，立即 break；命中 g == k 则计数但不停（续加 k 的倍数仍 = k）</text>
</svg>
