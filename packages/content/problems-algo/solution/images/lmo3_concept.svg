<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：数位和 % 3 + 删最少数字修正余数</text>

  <!-- sorted digits row -->
  <text x="40" y="62" font-size="12" fill="#888">降序:</text>
  <rect x="90" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="136" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="182" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="228" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="274" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- sum and remainder -->
  <rect x="350" y="48" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="67" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">sum=22</text>
  <rect x="440" y="48" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="478" y="67" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">22%3=1</text>

  <!-- arrows down to buckets -->
  <path d="M 112 80 L 112 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 158 80 L 158 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 204 80 L 204 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 250 80 L 250 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 296 80 L 296 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">按 d%3 分桶</text>

  <!-- 余0 bucket -->
  <rect x="60" y="128" width="140" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">余 0</text>
  <rect x="78" y="162" width="34" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="180" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="120" y="162" width="34" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="180" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 余1 bucket -->
  <rect x="210" y="128" width="140" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">余 1</text>
  <rect x="228" y="162" width="34" height="26" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="180" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="270" y="162" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <path d="M 270 188 L 304 162" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="312" y="178" font-size="10.5" fill="#b85450" font-weight="bold">删</text>

  <!-- 余2 bucket -->
  <rect x="360" y="128" width="140" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="150" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">余 2</text>
  <rect x="378" y="162" width="34" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="180" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="430" y="194" text-anchor="middle" font-size="10" fill="#aaa">(仅 1 个)</text>

  <!-- divider -->
  <path d="M 40 214 L 520 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- strategy -->
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">修正策略（sum%3 == 1）</text>
  <rect x="70" y="250" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">优先：删 1 个最小余 1</text>
  <text x="170" y="284" text-anchor="middle" font-size="10" fill="#888">✓ 余 1 非空 → 删 1（保更多位）</text>

  <rect x="290" y="250" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="269" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">备选：删 2 个最小余 2</text>
  <text x="390" y="284" text-anchor="middle" font-size="10" fill="#888">余 1 为空时才用（2+2≡1）</text>

  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#888">删 1 个 &gt; 删 2 个：保留更多数位 ⇒ 数更大</text>

  <!-- result -->
  <rect x="120" y="322" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">删掉 1 后剩余降序拼接</text>
  <text x="280" y="360" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">"8760"</text>

  <!-- theorem box -->
  <rect x="70" y="384" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">判定定理：数能被 3 整除 ⇔ 数位和能被 3 整除</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#888">故「最大三的倍数」=「最大数位和被3整除的降序拼接」</text>
</svg>
