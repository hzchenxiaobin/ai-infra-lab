<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">表面积分解：孤立塔贡献 (4v+2) − 相邻重叠 2×min</text>

  <!-- ===== 左面板：孤立塔 h=3 ===== -->
  <rect x="24" y="48" width="300" height="340" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="174" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">孤立一座塔 (高度 v=3)</text>

  <!-- 三层立方体（从下往上） -->
  <rect x="130" y="300" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="256" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="212" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- 顶面标注 -->
  <path d="M 186 226 L 232 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="196" font-size="11" fill="#4a7a3a">顶面 = 1</text>

  <!-- 底面标注 -->
  <path d="M 186 322 L 232 348" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="356" font-size="11" fill="#4a7a3a">底面 = 1</text>

  <!-- 左侧四个面标注（大括号示意高度 v） -->
  <path d="M 124 300 Q 116 300 116 290 L 116 248 Q 116 238 124 238" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="64" y="273" font-size="11" fill="#d6a040" font-weight="bold">4 侧面</text>
  <text x="64" y="288" font-size="11" fill="#d6a040">×高度 v</text>

  <!-- 小立方体层标 -->
  <text x="158" y="326" text-anchor="middle" font-size="9" fill="#888">层1</text>
  <text x="158" y="282" text-anchor="middle" font-size="9" fill="#888">层2</text>
  <text x="158" y="238" text-anchor="middle" font-size="9" fill="#888">层3</text>

  <!-- 孤立表面积公式 -->
  <rect x="60" y="362" width="230" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="175" y="388" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4v + 2 = 4×3 + 2 = 14</text>
  <text x="175" y="412" text-anchor="middle" font-size="10" fill="#888">（顶1 + 底1 + 四侧 4v）</text>

  <!-- ===== 右面板：相邻两塔重叠 ===== -->
  <rect x="350" y="48" width="306" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="503" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">相邻两塔（h=3 与 h=2）</text>

  <!-- 塔 A h=3 -->
  <rect x="430" y="300" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="256" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="212" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="455" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v=3</text>

  <!-- 塔 B h=2 -->
  <rect x="540" y="300" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="540" y="256" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="565" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v=2</text>

  <!-- 重叠区域高亮（接触面，高度 min=2） -->
  <rect x="480" y="256" width="60" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3" rx="2" filter="url(#rough2)" opacity="0.55"/>
  <text x="510" y="304" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">重叠区</text>

  <!-- 双向箭头表示接触 -->
  <path d="M 480 224 L 540 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 540 224 L 480 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 重叠标注 -->
  <text x="510" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">重叠高度 = min(3,2) = 2</text>
  <text x="510" y="168" text-anchor="middle" font-size="11" fill="#555">每对接触面隐藏 2 面</text>
  <text x="510" y="186" text-anchor="middle" font-size="11" fill="#555">→ 共隐藏 2 × 2 = 4 面</text>

  <!-- 重叠公式 -->
  <rect x="386" y="362" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="506" y="388" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">减去 2 × min(h₁, h₂)</text>
  <text x="506" y="412" text-anchor="middle" font-size="10" fill="#888">（只看右/下两个方向，每对算一次）</text>

  <!-- ===== 底部总公式 ===== -->
  <rect x="80" y="402" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="430" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">总面积 = Σ (4·grid[i][j] + 2)  −  2 · Σ min(相邻塔高)</text>
  <text x="340" y="450" text-anchor="middle" font-size="11" fill="#888">孤立累加 → 逐对减重叠（右/下各一次，不重不漏）</text>
</svg>
