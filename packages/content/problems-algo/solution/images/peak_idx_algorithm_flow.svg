<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">斜率二分流程（在下标区间上二分）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=0, hi=n−1</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo < hi? -->
  <polygon points="270,104 372,150 270,196 168,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt; hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(区间未缩为一点)</text>

  <!-- No branch -> end -->
  <path d="M 372 150 L 452 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 lo</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="130" y="218" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">mid = lo + (hi − lo) / 2</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: arr[mid] < arr[mid+1]? -->
  <polygon points="270,274 400,322 270,370 140,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#333">arr[mid] &lt; arr[mid+1] ?</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#666">(上升坡吗)</text>

  <!-- Yes (ascending) -> peak on right -->
  <path d="M 400 322 L 440 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="314" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="442" y="302" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="328" text-anchor="middle" font-size="11" fill="#333">lo = mid + 1</text>

  <!-- No (descending) -> peak on left (inclusive mid) -->
  <path d="M 140 322 L 100 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="14" y="302" width="86" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="57" y="320" text-anchor="middle" font-size="11" fill="#333">hi = mid</text>
  <text x="57" y="336" text-anchor="middle" font-size="10" fill="#888">(保留 mid)</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 57 302 L 57 150 L 168 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="49" y="226" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 49 226)">继续二分</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 485 302 L 485 150 L 372 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <rect x="80" y="392" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a">每轮折半区间，O(1) 比较 → 共 O(log n) 轮；lo == hi 即峰顶</text>
</svg>
