<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：base=7, toppings=[3,4], target=10</text>

  <!-- ===== Level 0: root ===== -->
  <rect x="240" y="36" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx=0</text>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cost=7</text>

  <!-- Edges level 0 → 1 -->
  <path d="M 260 72 L 130 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 72 L 280 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 72 L 430 110" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="9" fill="#888">0×3</text>
  <text x="296" y="88" font-size="9" fill="#888">1×3</text>
  <text x="390" y="88" text-anchor="middle" font-size="9" fill="#888">2×3</text>

  <!-- ===== Level 1 ===== -->
  <!-- (1, 7) -->
  <rect x="90" y="112" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx=1</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cost=7</text>

  <!-- (1, 10) BEST - pruned -->
  <rect x="240" y="112" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx=1</text>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cost=10 ✓</text>
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">= target, 剪枝 ✂</text>

  <!-- (1, 13) pruned -->
  <rect x="390" y="112" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx=1</text>
  <text x="430" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cost=13</text>
  <text x="430" y="160" text-anchor="middle" font-size="9" fill="#b85450">≥ 10, 剪枝 ✂</text>

  <!-- Edges level 1 → 2 (only from cost=7) -->
  <path d="M 110 148 L 50 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 148 L 130 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 148 L 210 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="178" font-size="9" fill="#888">0×4</text>
  <text x="146" y="178" font-size="9" fill="#888">1×4</text>
  <text x="196" y="178" text-anchor="middle" font-size="9" fill="#888">2×4</text>

  <!-- ===== Level 2 (leaves) ===== -->
  <!-- (2, 7) leaf -->
  <rect x="10" y="202" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">idx=2</text>
  <text x="48" y="231" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost=7</text>
  <text x="48" y="250" text-anchor="middle" font-size="9" fill="#888">叶节点</text>

  <!-- (2, 11) pruned -->
  <rect x="92" y="202" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">idx=2</text>
  <text x="130" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cost=11</text>
  <text x="130" y="250" text-anchor="middle" font-size="9" fill="#b85450">✂</text>

  <!-- (2, 15) pruned -->
  <rect x="174" y="202" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="212" y="217" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">idx=2</text>
  <text x="212" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cost=15</text>
  <text x="212" y="250" text-anchor="middle" font-size="9" fill="#b85450">✂</text>

  <!-- ===== Ans tracking table ===== -->
  <text x="310" y="200" font-size="11" fill="#555" font-weight="bold">ans 更新轨迹：</text>

  <rect x="310" y="210" width="220" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <text x="324" y="232" font-size="10" fill="#888">访问 cost=7  → ans=7 (d=3)</text>
  <text x="324" y="250" font-size="10" fill="#888">访问 cost=7  → ans=7 (d=3)</text>
  <text x="324" y="268" font-size="10" fill="#888">访问 cost=11 → ans=7 (d=3→1?)</text>
  <text x="324" y="280" font-size="9" fill="#b85450">  11−10=1 &gt; 3? 否, 不换</text>
  <text x="324" y="298" font-size="10" fill="#888">访问 cost=15 → 不换</text>
  <text x="324" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">访问 cost=10 → d=0 ✓</text>
  <text x="334" y="330" font-size="10" fill="#4a7a3a" font-weight="bold">ans = 10</text>
  <text x="324" y="348" font-size="10" fill="#888">访问 cost=13 → 不换</text>

  <line x1="320" y1="360" x2="520" y2="360" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="420" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最终 ans = 10</text>
  <text x="420" y="396" text-anchor="middle" font-size="10" fill="#888">base 7 + 1×topping3 = 10</text>

  <!-- Legend -->
  <rect x="40" y="290" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="302" font-size="9" fill="#666">cost &lt; target</text>
  <rect x="40" y="310" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="9" fill="#666">命中 target</text>
  <rect x="40" y="330" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="9" fill="#666">cost ≥ target (剪枝)</text>

  <!-- Note about base=1 -->
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">另：base=1 时最接近 cost=9（dist 1），不如 base=7 的 10（dist 0）</text>
</svg>
