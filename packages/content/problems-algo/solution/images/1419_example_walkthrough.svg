<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="580" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算："crcoakroak" → 2 只青蛙</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">每步检查前驱状态计数；步骤 ③ 新建第二只青蛙，步骤 ⑥ 第一只叫完释放</text>

  <!-- Column headers -->
  <text x="40" y="74" font-size="10" fill="#888" font-weight="bold">步</text>
  <text x="80" y="74" font-size="10" fill="#888" font-weight="bold">字符</text>
  <text x="130" y="74" font-size="10" fill="#888" font-weight="bold">动作</text>
  <text x="290" y="74" font-size="10" fill="#888" font-weight="bold">cnt (c/r/o/a/k)</text>
  <text x="470" y="74" font-size="10" fill="#888" font-weight="bold">frogs</text>
  <text x="540" y="74" font-size="10" fill="#888" font-weight="bold">ans</text>

  <line x1="20" y1="80" x2="620" y2="80" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: c, new frog A -->
  <text x="40" y="100" font-size="11" fill="#666" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="74" y="88" width="22" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="85" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text></g>
  <text x="130" y="100" font-size="10" fill="#666">无空闲 → 新建 A</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="88" width="18" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="279" y="100" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="294" y="88" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="100" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="88" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="100" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="88" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="100" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="88" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="375" y="100" text-anchor="middle" fill="#ccc">0</text>
  </g>
  <text x="470" y="100" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="540" y="100" font-size="11" fill="#666" font-weight="bold">1</text>

  <!-- Step 2: r, A: c->r -->
  <text x="40" y="128" font-size="11" fill="#666" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="74" y="116" width="22" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="85" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r</text></g>
  <text x="130" y="128" font-size="10" fill="#666">A: c→r</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="116" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="279" y="128" text-anchor="middle" fill="#ccc">0</text>
    <rect x="294" y="116" width="18" height="16" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><text x="303" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="318" y="116" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="128" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="116" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="128" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="116" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="375" y="128" text-anchor="middle" fill="#ccc">0</text>
  </g>
  <text x="470" y="128" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="540" y="128" font-size="11" fill="#666" font-weight="bold">1</text>

  <!-- Step 3: c, new frog B - KEY STEP -->
  <rect x="20" y="138" width="600" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 2" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="156" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <g filter="url(#rough2)"><rect x="74" y="144" width="22" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="85" y="157" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text></g>
  <text x="130" y="156" font-size="10" fill="#b85450" font-weight="bold">无空闲 → 新建 B</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="144" width="18" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="279" y="156" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="294" y="144" width="18" height="16" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><text x="303" y="156" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="318" y="144" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="156" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="144" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="156" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="144" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="375" y="156" text-anchor="middle" fill="#ccc">0</text>
  </g>
  <text x="470" y="156" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="540" y="156" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Step 4: o, A: r->o -->
  <text x="40" y="184" font-size="11" fill="#666" font-weight="bold">4</text>
  <g filter="url(#rough2)"><rect x="74" y="172" width="22" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/><text x="85" y="185" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">o</text></g>
  <text x="130" y="184" font-size="10" fill="#666">A: r→o</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="172" width="18" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="279" y="184" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="294" y="172" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="184" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="172" width="18" height="16" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/><text x="327" y="184" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="342" y="172" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="184" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="172" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="375" y="184" text-anchor="middle" fill="#ccc">0</text>
  </g>
  <text x="470" y="184" font-size="11" fill="#666" font-weight="bold">2</text>
  <text x="540" y="184" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 5: a, A: o->a -->
  <text x="40" y="212" font-size="11" fill="#666" font-weight="bold">5</text>
  <g filter="url(#rough2)"><rect x="74" y="200" width="22" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="85" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text></g>
  <text x="130" y="212" font-size="10" fill="#666">A: o→a</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="200" width="18" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="279" y="212" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="294" y="200" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="212" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="200" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="212" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="200" width="18" height="16" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><text x="351" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="366" y="200" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="375" y="212" text-anchor="middle" fill="#ccc">0</text>
  </g>
  <text x="470" y="212" font-size="11" fill="#666" font-weight="bold">2</text>
  <text x="540" y="212" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 6: k, A finishes - KEY STEP -->
  <rect x="20" y="222" width="600" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 2" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <g filter="url(#rough2)"><rect x="74" y="228" width="22" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="85" y="241" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k</text></g>
  <text x="130" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">A: a→k，释放</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="228" width="18" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="279" y="240" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="294" y="228" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="240" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="228" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="240" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="228" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="240" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="228" width="18" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="375" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="470" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="540" y="240" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 7: r, B: c->r -->
  <text x="40" y="268" font-size="11" fill="#666" font-weight="bold">7</text>
  <g filter="url(#rough2)"><rect x="74" y="256" width="22" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="85" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r</text></g>
  <text x="130" y="268" font-size="10" fill="#666">B: c→r</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="256" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="279" y="268" text-anchor="middle" fill="#ccc">0</text>
    <rect x="294" y="256" width="18" height="16" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><text x="303" y="268" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="318" y="256" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="268" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="256" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="268" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="256" width="18" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="375" y="268" text-anchor="middle" fill="#b85450">1</text>
  </g>
  <text x="470" y="268" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="540" y="268" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 8: o, B: r->o -->
  <text x="40" y="296" font-size="11" fill="#666" font-weight="bold">8</text>
  <g filter="url(#rough2)"><rect x="74" y="284" width="22" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/><text x="85" y="297" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">o</text></g>
  <text x="130" y="296" font-size="10" fill="#666">B: r→o</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="284" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="279" y="296" text-anchor="middle" fill="#ccc">0</text>
    <rect x="294" y="284" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="296" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="284" width="18" height="16" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/><text x="327" y="296" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="342" y="284" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="296" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="284" width="18" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="375" y="296" text-anchor="middle" fill="#b85450">1</text>
  </g>
  <text x="470" y="296" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="540" y="296" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 9: a, B: o->a -->
  <text x="40" y="324" font-size="11" fill="#666" font-weight="bold">9</text>
  <g filter="url(#rough2)"><rect x="74" y="312" width="22" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="85" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text></g>
  <text x="130" y="324" font-size="10" fill="#666">B: o→a</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="312" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="279" y="324" text-anchor="middle" fill="#ccc">0</text>
    <rect x="294" y="312" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="324" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="312" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="324" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="312" width="18" height="16" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><text x="351" y="324" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="366" y="312" width="18" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="375" y="324" text-anchor="middle" fill="#b85450">1</text>
  </g>
  <text x="470" y="324" font-size="11" fill="#666" font-weight="bold">1</text>
  <text x="540" y="324" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Step 10: k, B finishes -->
  <rect x="20" y="330" width="600" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 2" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="348" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <g filter="url(#rough2)"><rect x="74" y="336" width="22" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="85" y="349" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k</text></g>
  <text x="130" y="348" font-size="10" fill="#4a7a3a" font-weight="bold">B: a→k，释放</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="270" y="336" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="279" y="348" text-anchor="middle" fill="#ccc">0</text>
    <rect x="294" y="336" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="303" y="348" text-anchor="middle" fill="#ccc">0</text>
    <rect x="318" y="336" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="327" y="348" text-anchor="middle" fill="#ccc">0</text>
    <rect x="342" y="336" width="18" height="16" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="0.8"/><text x="351" y="348" text-anchor="middle" fill="#ccc">0</text>
    <rect x="366" y="336" width="18" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/><text x="375" y="348" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>
  <text x="470" y="348" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="540" y="348" font-size="11" fill="#666" font-weight="bold">2</text>

  <!-- Separator -->
  <line x1="20" y1="374" x2="620" y2="374" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="40" y="398" font-size="12" fill="#444" font-weight="bold">最终:</text>
  <text x="100" y="398" font-size="12" fill="#4a7a3a" font-weight="bold">frogs == 0 ✓</text>
  <text x="220" y="398" font-size="12" fill="#d6a040" font-weight="bold">ans = 2</text>

  <!-- Two frogs summary -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="412" width="280" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="50" y="430" fill="#446688" font-weight="bold">青蛙A:</text>
    <text x="110" y="430" fill="#666">c(1) r(2) o(4) a(5) k(6)</text>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <rect x="340" y="412" width="280" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="350" y="430" fill="#b85450" font-weight="bold">青蛙B:</text>
    <text x="410" y="430" fill="#666">c(3) r(7) o(8) a(9) k(10)</text>
  </g>

  <!-- Legend / key points -->
  <rect x="40" y="452" width="560" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="474" font-size="12" fill="#d6a040" font-weight="bold">💡 关键决策点</text>
  <text x="60" y="494" font-size="11" fill="#666">步骤 ③：第一只青蛙 A 正停在 r 状态（未叫完 k），无空闲青蛙可复用</text>
  <text x="60" y="510" font-size="11" fill="#b85450" font-weight="bold">          → 必须新建第二只 B，并发数 frogs 达到峰值 2 = ans</text>
  <text x="60" y="530" font-size="11" fill="#666">步骤 ⑥：A 叫完 k 释放（frogs: 2→1），此后 A 可被复用</text>
  <text x="60" y="546" font-size="11" fill="#4a7a3a" font-weight="bold">          → 若后续有新 'c' 到来，优先复用 A 而非新建——这正是「最少青蛙」的贪心精髓</text>
</svg>
