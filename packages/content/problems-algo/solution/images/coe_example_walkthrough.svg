<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s1="l123e", s2="44" → true（原串 "leetcode"）</text>

  <!-- ===== String displays ===== -->
  <text x="30" y="52" font-size="11" fill="#888">s1 = "l 1 2 3 e"　　s2 = "4 4"</text>

  <!-- s1 chars -->
  <g>
    <rect x="40" y="58" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="54" y="75" text-anchor="middle" font-size="11" fill="#333">l</text>
    <rect x="68" y="58" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="75" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="96" y="58" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="110" y="75" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="124" y="58" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="138" y="75" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="152" y="58" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="166" y="75" text-anchor="middle" font-size="11" fill="#333">e</text>
  </g>

  <!-- s2 chars -->
  <g>
    <rect x="40" y="96" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="54" y="113" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="68" y="96" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="113" text-anchor="middle" font-size="11" fill="#333">4</text>
  </g>

  <!-- original string -->
  <text x="220" y="70" font-size="10" fill="#888">原串 T:</text>
  <rect x="260" y="56" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="350" y="72" text-anchor="middle" font-size="10" fill="#333">l e e t c o d e</text>
  <text x="220" y="112" font-size="9" fill="#888">长度 8（隐式，逐步推断）</text>

  <!-- ===== Step boxes ===== -->
  <!-- Step 1: (0,0,0) -->
  <rect x="20" y="140" width="180" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="158" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 1: (0,0,0)</text>
  <text x="110" y="173" text-anchor="middle" font-size="9" fill="#555">k=0: s1[0]='l'字母</text>
  <text x="110" y="186" text-anchor="middle" font-size="9" fill="#555">s2[0]='4'→解析=4, 首字符='l'</text>
  <text x="110" y="196" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">→ (1, 1, 1-4) = (1,1,-3)</text>

  <line x1="110" y1="200" x2="110" y2="212" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: (1,1,-3) -->
  <rect x="20" y="214" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="232" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 2: (1,1,-3)</text>
  <text x="110" y="247" text-anchor="middle" font-size="9" fill="#555">k=-3: s2 领先3, s1 追赶</text>
  <text x="110" y="260" text-anchor="middle" font-size="9" fill="#555">s1[1]='1'→解析=1</text>
  <text x="110" y="270" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">→ (2, 1, -3+1) = (2,1,-2)</text>

  <line x1="110" y1="274" x2="110" y2="286" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: (2,1,-2) -->
  <rect x="20" y="288" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="306" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 3: (2,1,-2)</text>
  <text x="110" y="321" text-anchor="middle" font-size="9" fill="#555">k=-2: s1 追赶</text>
  <text x="110" y="334" text-anchor="middle" font-size="9" fill="#555">s1[2]='2'→解析=2</text>
  <text x="110" y="344" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">→ (3, 1, -2+2) = (3,1,0) ✓对齐</text>

  <line x1="110" y1="348" x2="110" y2="360" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: (3,1,0) -->
  <rect x="220" y="140" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 4: (3,1,0)</text>
  <text x="320" y="173" text-anchor="middle" font-size="9" fill="#555">k=0: 双方数字</text>
  <text x="320" y="186" text-anchor="middle" font-size="9" fill="#555">s1[3]='3'→3, s2[1]='4'→4</text>
  <text x="320" y="196" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">→ (4, 2, 3-4) = (4,2,-1)</text>

  <line x1="320" y1="200" x2="320" y2="212" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: (4,2,-1) -->
  <rect x="220" y="214" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 5: (4,2,-1)</text>
  <text x="320" y="247" text-anchor="middle" font-size="9" fill="#555">k=-1: s2 领先1, s1 追赶</text>
  <text x="320" y="260" text-anchor="middle" font-size="9" fill="#555">s1[4]='e' 字母（无约束）</text>
  <text x="320" y="270" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">→ (5, 2, -1+1) = (5,2,0) ✓</text>

  <line x1="320" y1="274" x2="320" y2="286" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 note -->
  <rect x="220" y="288" width="200" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">关键：字母无约束</text>
  <text x="320" y="321" text-anchor="middle" font-size="9" fill="#555">待匹配的1个字符由 s2 的</text>
  <text x="320" y="334" text-anchor="middle" font-size="9" fill="#555">数字"4"消费（内容未知）</text>
  <text x="320" y="344" text-anchor="middle" font-size="9" fill="#555">s1 声明='e'，不矛盾</text>

  <!-- ===== Step 6: termination ===== -->
  <rect x="440" y="140" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="530" y="158" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤 6: (5,2,0)</text>
  <text x="530" y="173" text-anchor="middle" font-size="9" fill="#555">i=5=n1 (s1 耗尽)</text>
  <text x="530" y="186" text-anchor="middle" font-size="9" fill="#555">j=2=n2 (s2 耗尽)</text>
  <text x="530" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=0 → return TRUE</text>

  <!-- connection from step5 to step6 -->
  <path d="M 420 218 Q 480 180 440 170" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Bottom: decoded view ===== -->
  <rect x="20" y="380" width="600" height="160" fill="#fafafa" stroke="#888" stroke-width="1" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">解码视角：两串如何消费同一个 "leetcode"</text>

  <!-- s1 decode -->
  <text x="30" y="420" font-size="9" fill="#446688" font-weight="bold">s1="l123e" → ["l","1","2","3","e"]</text>
  <rect x="30" y="426" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="439" text-anchor="middle" font-size="9" fill="#333">l</text>
  <rect x="52" y="426" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="439" text-anchor="middle" font-size="8" fill="#555">e</text>
  <rect x="74" y="426" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="84" y="439" text-anchor="middle" font-size="8" fill="#555">e,t</text>
  <rect x="96" y="426" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="439" text-anchor="middle" font-size="8" fill="#555">c,o,d</text>
  <rect x="118" y="426" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="128" y="439" text-anchor="middle" font-size="9" fill="#333">e</text>
  <text x="150" y="439" font-size="9" fill="#888">= l + 1 + 2 + 3 + 1 = 8 字母</text>

  <!-- s2 decode -->
  <text x="30" y="462" font-size="9" fill="#4a7a3a" font-weight="bold">s2="44" → ["4","4"]</text>
  <rect x="30" y="468" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="481" text-anchor="middle" font-size="8" fill="#333">l,e,e,t</text>
  <rect x="92" y="468" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="122" y="481" text-anchor="middle" font-size="8" fill="#333">c,o,d,e</text>
  <text x="165" y="481" font-size="9" fill="#888">= 4 + 4 = 8 字母</text>

  <!-- summary -->
  <rect x="30" y="506" width="580" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="523" text-anchor="middle" font-size="10" fill="#444">两串解码长度均为 8，字符一致 → 存在共同原串 "leetcode" → true</text>
</svg>
