<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历「先查后记」——两数之和的哈希套路计数版</text>

  <rect x="30" y="44" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">遍历 hours 中的每个 h</text>

  <path d="M 150 76 L 150 94" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="96" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">r ← h mod 24（只留余数）</text>

  <path d="M 150 128 L 150 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="148" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += cnt[(24 − r) mod 24]</text>
  <text x="150" y="186" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">先查：互补余数之前出现过几个</text>

  <path d="M 150 196 L 150 214" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="216" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[r] += 1</text>
  <text x="150" y="254" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">后记：把自己登记进余数桶</text>

  <path d="M 150 264 L 150 282" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="150,284 225,312 150,340 75,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="316" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">还有下一个 h ?</text>

  <path d="M 75 312 L 16 312 L 16 60 L 26 60" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="48" y="304" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <path d="M 225 312 L 283 312" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="250" y="304" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="286" y="294" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="351" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="300" y="44" width="204" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="402" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">💡 先查后记</text>
  <text x="402" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">处理 j 时桶里只登记过 i &lt; j 的</text>
  <text x="402" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">元素，每个数对恰在 j 处统计一次</text>

  <rect x="300" y="118" width="204" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="402" y="136" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 外层 mod 不能省</text>
  <text x="402" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">r = 0 时 24 − r = 24，直接下标</text>
  <text x="402" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">访问 cnt[24] 会越界；取模后</text>
  <text x="402" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">正确落回桶 0（974 同款技巧）</text>

  <rect x="300" y="200" width="204" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="402" y="218" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">24 个桶，与 n 无关</text>
  <text x="402" y="234" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">每步取模 + 查表 + 登记均 O(1)</text>
  <text x="402" y="248" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">→ 时间 O(n)，空间 O(1)</text>
</svg>
