<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：自连接 → GROUP BY + COUNT → RANK → 过滤最大</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="520" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="12" fill="#446688" font-weight="bold">① 自连接：Relations r1 JOIN Relations r2 ON r1.follower_id = r2.follower_id</text>
  <text x="56" y="90" font-size="10.5" fill="#555">AND r1.user_id &lt; r2.user_id —— 同一关注者把两个不同用户配成一对</text>
  <text x="56" y="106" font-size="9.5" fill="#888">→ 每条结果 = (user1, user2, 共同关注者)，user1 &lt; user2 去自配 / 去重复对 / 保输出顺序</text>

  <path d="M 300 124 L 300 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="146" width="520" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="168" font-size="12" fill="#4a7a3a" font-weight="bold">② GROUP BY r1.user_id, r2.user_id + COUNT(*)</text>
  <text x="56" y="186" font-size="10.5" fill="#555">按用户对分组，COUNT(*) = 该对的共同关注者数 = |followers(u1) ∩ followers(u2)|</text>
  <text x="56" y="200" font-size="9.5" fill="#888">示例：(1,2)→2，(1,7)→3，(2,7)→2</text>

  <path d="M 300 210 L 300 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="232" width="520" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="254" font-size="12" fill="#d6a040" font-weight="bold">③ RANK() OVER (ORDER BY COUNT(*) DESC) AS rk</text>
  <text x="56" y="272" font-size="10.5" fill="#555">按共同关注者数降序排名；并列最大者均得 rk = 1</text>
  <text x="56" y="288" font-size="9.5" fill="#888">用 RANK 而非 ROW_NUMBER：可能有多个并列最大对，需全部返回</text>

  <path d="M 300 300 L 300 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="322" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="344" font-size="12" fill="#b85450" font-weight="bold">④ SELECT user1_id, user2_id WHERE rk = 1</text>
  <text x="56" y="362" font-size="10.5" fill="#555">筛选排名第 1 的所有用户对 = 共同关注者数最大的全部两两结对组</text>

  <path d="M 300 382 L 300 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="180" y="404" width="240" height="48" fill="#fafafa" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="422" text-anchor="middle" font-size="10.5" fill="#888">输出结果（共同关注者最多的所有对）</text>
  <line x1="190" y1="428" x2="410" y2="428" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="205" y="446" font-size="10.5" fill="#888">user1_id</text>
  <text x="325" y="446" font-size="10.5" fill="#888">user2_id</text>
</svg>
