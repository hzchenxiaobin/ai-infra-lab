<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例时间线：fn 耗时 vs 超时阈值 t</text>

  <!-- ===== Example 1: fn=100ms, t=50 → TLE ===== -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：fn 耗时 100ms，t = 50ms → 超时拒绝</text>

  <line x1="40" y1="100" x2="560" y2="100" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="566" y="104" font-size="10" fill="#888" filter="url(#rough2)">ms</text>

  <!-- ticks -->
  <line x1="40" y1="96" x2="40" y2="104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <line x1="120" y1="96" x2="120" y2="104" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">50</text>
  <line x1="200" y1="96" x2="200" y2="104" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">100</text>

  <!-- fn bar (dashed, never finishes) -->
  <rect x="40" y="76" width="160" height="14" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="10" fill="#446688" filter="url(#rough2)">fn 运行中…</text>

  <!-- timeout fires at 50 -->
  <line x1="120" y1="74" x2="120" y2="106" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="135" y="130" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ reject("TLE")</text>

  <!-- ===== Example 2: fn=100ms, t=150 → resolved ===== -->
  <text x="40" y="190" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：fn 耗时 100ms，t = 150ms → 正常返回</text>

  <line x1="40" y1="232" x2="560" y2="232" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="566" y="236" font-size="10" fill="#888" filter="url(#rough2)">ms</text>

  <line x1="40" y1="228" x2="40" y2="236" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <line x1="200" y1="228" x2="200" y2="236" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">100</text>
  <line x1="280" y1="228" x2="280" y2="236" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">150</text>

  <!-- fn bar finishes at 100 -->
  <rect x="40" y="208" width="160" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="204" font-size="10" fill="#446688" filter="url(#rough2)">fn 运行 100ms</text>

  <line x1="200" y1="206" x2="200" y2="238" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="215" y="262" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ resolve(25)</text>

  <!-- legend -->
  <rect x="400" y="262" width="200" height="70" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="500" y="280" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="412" y="290" width="20" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="299" font-size="10" fill="#555" filter="url(#rough2)">fn 运行区间</text>
  <rect x="412" y="306" width="20" height="10" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="438" y="315" font-size="10" fill="#555" filter="url(#rough2)">未完成的 fn</text>
  <text x="415" y="328" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">┃</text>
  <text x="438" y="328" font-size="10" fill="#555" filter="url(#rough2)">先敲定时刻</text>

  <!-- bottom note -->
  <rect x="40" y="350" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">谁先到谁赢：fn 完成 &lt; t 则 resolve；定时器 t 先到则 reject "Time Limit Exceeded"</text>
  <text x="320" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">fn 自身 reject（如示例 4）也会立即让 race 落定，超时定时器此后失效</text>
</svg>
