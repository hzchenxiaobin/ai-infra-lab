<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：pts=[16,2,3], pre=[16,18,21], total=21, 取 r=17</text>

  <!-- 顶部数轴 80..400, 320px/21 ≈ 15.2px/点 -->
  <rect x="80" y="52" width="243" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="201" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rect0 (16点)</text>

  <rect x="323" y="52" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="338" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">r1</text>

  <rect x="353" y="52" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="376" y="70" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">rect2</text>

  <!-- 刻度 -->
  <text x="80" y="96" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="323" y="96" text-anchor="middle" font-size="10" fill="#666">16</text>
  <text x="353" y="96" text-anchor="middle" font-size="10" fill="#666">18</text>
  <text x="399" y="96" text-anchor="middle" font-size="10" fill="#666">21</text>

  <!-- r=17 标记: x = 80 + 17*15.2 ≈ 338 -->
  <path d="M 338 100 L 338 52" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="312" y="104" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="338" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">r = 17</text>

  <text x="420" y="70" font-size="11" fill="#888">r ∈ [16,18) → rect1</text>

  <!-- 二分过程表 -->
  <text x="70" y="156" font-size="12" fill="#444" font-weight="bold">二分查找过程（找首个 pre[i] &gt; 17）：</text>

  <!-- 表头 -->
  <rect x="70" y="166" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">步骤</text>
  <rect x="120" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">lo</text>
  <rect x="160" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">hi</text>
  <rect x="200" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="220" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">mid</text>
  <rect x="240" y="166" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="272" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">pre[mid]</text>
  <rect x="304" y="166" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="352" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">比较</text>
  <rect x="400" y="166" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">动作</text>

  <!-- 第 1 行: lo=0,hi=2,mid=1,pre[1]=18>17 → hi=1 -->
  <rect x="70" y="194" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="194" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="213" text-anchor="middle" font-size="11" fill="#446688">0</text>
  <rect x="160" y="194" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="213" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="200" y="194" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="194" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="272" y="213" text-anchor="middle" font-size="11" fill="#446688">18</text>
  <rect x="304" y="194" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="213" text-anchor="middle" font-size="11" fill="#b85450">18 &gt; 17</text>
  <rect x="400" y="194" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hi = mid = 1</text>

  <!-- 第 2 行: lo=0,hi=1,mid=0,pre[0]=16<=17 → lo=1 -->
  <rect x="70" y="224" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="120" y="224" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="11" fill="#446688">0</text>
  <rect x="160" y="224" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="200" y="224" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="240" y="224" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="272" y="243" text-anchor="middle" font-size="11" fill="#446688">16</text>
  <rect x="304" y="224" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a">16 ≤ 17</text>
  <rect x="400" y="224" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo = mid+1 = 1</text>

  <!-- 结束行 -->
  <rect x="70" y="254" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结束</text>
  <rect x="120" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="273" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="160" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="273" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="200" y="254" width="40" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="273" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="240" y="254" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="273" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="304" y="254" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="273" text-anchor="middle" font-size="11" fill="#d6a040">lo == hi</text>
  <rect x="400" y="254" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="455" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i = 1 ✓</text>

  <!-- 矩形内取点 -->
  <rect x="36" y="298" width="488" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12" fill="#4a7a3a" font-weight="bold">选定 rect1 = [0, 0, 1, 0]（2×1 = 2 个整数点）后，矩形内均匀取点：</text>
  <text x="56" y="344" font-size="11" fill="#555">• x 范围 [xi, ai] = [0, 1]，宽度 = ai − xi + 1 = 2 → x = 0 + rand() % 2 ∈ {0, 1}</text>
  <text x="56" y="364" font-size="11" fill="#555">• y 范围 [yi, bi] = [0, 0]，宽度 = bi − yi + 1 = 1 → y = 0 + rand() % 1 = 0</text>
  <text x="56" y="388" font-size="11" fill="#b85450" font-weight="bold">→ 返回 [x, y]（如 [1, 0]），rect1 内每个点被选概率 = (2/21) × (1/2) = 1/21 ✓</text>
</svg>
