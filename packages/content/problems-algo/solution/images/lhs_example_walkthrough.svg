<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,2,2,5,2,3,7] → ans = 5</text>

  <!-- nums row -->
  <text x="30" y="58" font-size="12" fill="#888">nums:</text>
  <rect x="70" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="61" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="112" y="42" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="61" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="154" y="42" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="61" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="196" y="42" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="61" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="238" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="61" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="280" y="42" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="322" y="42" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="61" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="364" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="61" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- Step 1 label: frequency table -->
  <text x="30" y="108" font-size="12" fill="#555" font-weight="bold">① 频次表 cnt：</text>

  <!-- freq table: value | 1 | 2 | 3 | 5 | 7 -->
  <rect x="120" y="92" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="109" text-anchor="middle" font-size="10.5" fill="#888">值</text>
  <rect x="160" y="92" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="208" y="92" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="109" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="256" y="92" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="304" y="92" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="328" y="109" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="352" y="92" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="376" y="109" text-anchor="middle" font-size="11" fill="#333">7</text>

  <rect x="120" y="116" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="10.5" fill="#888">cnt</text>
  <rect x="160" y="116" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="133" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="208" y="116" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="116" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="304" y="116" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="328" y="133" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="352" y="116" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="376" y="133" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Step 2 label: pair check -->
  <text x="30" y="178" font-size="12" fill="#555" font-weight="bold">② 枚举相邻对 (x, x+1)：</text>

  <!-- Pair rows table -->
  <!-- header -->
  <rect x="120" y="162" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="178" text-anchor="middle" font-size="10.5" fill="#888">x</text>
  <rect x="180" y="162" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="178" text-anchor="middle" font-size="10.5" fill="#888">x+1?</text>
  <rect x="240" y="162" width="110" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="178" text-anchor="middle" font-size="10.5" fill="#888">cnt[x]+cnt[x+1]</text>
  <rect x="350" y="162" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="10.5" fill="#888">ans</text>

  <!-- row x=1: yes, 1+3=4, ans=4 -->
  <rect x="120" y="184" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="180" y="184" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2 ✓</text>
  <rect x="240" y="184" width="110" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="200" text-anchor="middle" font-size="11" fill="#333">1 + 3 = 4</text>
  <rect x="350" y="184" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- row x=2: yes, 3+2=5 ★ ans=5 -->
  <rect x="120" y="206" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="206" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <rect x="240" y="206" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="295" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 + 2 = 5 ★</text>
  <rect x="350" y="206" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <!-- row x=3: no (4 missing) -->
  <rect x="120" y="228" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="180" y="228" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="244" text-anchor="middle" font-size="10.5" fill="#888">4 ✗</text>
  <rect x="240" y="228" width="110" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="244" text-anchor="middle" font-size="10.5" fill="#aaa">— 跳过</text>
  <rect x="350" y="228" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="244" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row x=5: no (6 missing) -->
  <rect x="120" y="250" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="180" y="250" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="266" text-anchor="middle" font-size="10.5" fill="#888">6 ✗</text>
  <rect x="240" y="250" width="110" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="266" text-anchor="middle" font-size="10.5" fill="#aaa">— 跳过</text>
  <rect x="350" y="250" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="266" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row x=7: no (8 missing) -->
  <rect x="120" y="272" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="180" y="272" width="60" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="288" text-anchor="middle" font-size="10.5" fill="#888">8 ✗</text>
  <rect x="240" y="272" width="110" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="288" text-anchor="middle" font-size="10.5" fill="#aaa">— 跳过</text>
  <rect x="350" y="272" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- note: only check x+1 to avoid double counting -->
  <rect x="430" y="162" width="270" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="565" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为什么只查 x+1？</text>
  <text x="450" y="210" font-size="11" fill="#555">• 每对相邻值 (x, x+1) 唯一</text>
  <text x="450" y="230" font-size="11" fill="#555">• 由较小的 x 触发，不重不漏</text>
  <text x="450" y="250" font-size="11" fill="#555">• 若也查 x−1 会重复计算同一对</text>
  <text x="450" y="274" font-size="10.5" fill="#888" font-style="italic">例：(2,3) 由 x=2 计一次即可</text>

  <!-- bottom summary -->
  <rect x="30" y="310" width="660" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">x=2 时 cnt[2]+cnt[3] = 3+2 = 5 为最大 → 答案 5</text>
  <text x="360" y="344" text-anchor="middle" font-size="10.5" fill="#888">对应子序列：所有 2 和所有 3（3 个 2 + 2 个 3 = 5 个元素）</text>
</svg>
