<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [113,215,227,314,328,336,421,462]</text>

  <!-- ===== Tree on left ===== -->
  <g font-size="13">
    <!-- edges (drawn first, behind nodes) -->
    <!-- 3->5 shared (blue) -->
    <line x1="188" y1="94" x2="150" y2="138" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 5->4 green -->
    <line x1="132" y1="164" x2="105" y2="208" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 4->1 green -->
    <line x1="88" y1="234" x2="68" y2="278" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 5->8 orange -->
    <line x1="156" y1="164" x2="168" y2="208" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 3->7 red -->
    <line x1="214" y1="94" x2="258" y2="138" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 7->6 red -->
    <line x1="270" y1="164" x2="270" y2="208" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <!-- 6->2 red -->
    <line x1="282" y1="234" x2="300" y2="278" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

    <!-- D=1 root val=3 -->
    <circle cx="200" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="200" y="85" text-anchor="middle" fill="#333" font-weight="bold">3</text>

    <!-- D=2 val=5 -->
    <circle cx="140" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="140" y="155" text-anchor="middle" fill="#333" font-weight="bold">5</text>

    <!-- D=2 val=7 -->
    <circle cx="270" cy="150" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="270" y="155" text-anchor="middle" fill="#333" font-weight="bold">7</text>

    <!-- D=3 val=4 -->
    <circle cx="95" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="95" y="225" text-anchor="middle" fill="#333" font-weight="bold">4</text>

    <!-- D=3 val=8 (leaf) -->
    <circle cx="175" cy="220" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="175" y="225" text-anchor="middle" fill="#333" font-weight="bold">8</text>

    <!-- D=3 val=6 -->
    <circle cx="270" cy="220" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="270" y="225" text-anchor="middle" fill="#333" font-weight="bold">6</text>

    <!-- D=4 val=1 (leaf) -->
    <circle cx="60" cy="290" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="60" y="295" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <!-- D=4 val=2 (leaf) -->
    <circle cx="310" cy="290" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="310" y="295" text-anchor="middle" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- leaf markers -->
  <text x="60" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a">叶子</text>
  <text x="175" y="248" text-anchor="middle" font-size="9" fill="#d6a040">叶子</text>
  <text x="310" y="320" text-anchor="middle" font-size="9" fill="#b85450">叶子</text>

  <!-- ===== Right: hash map ===== -->
  <rect x="380" y="50" width="180" height="172" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">哈希表 tree</text>
  <line x1="398" y1="78" x2="542" y2="78" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <g font-size="11" fill="#444">
    <text x="400" y="96">11 → 3</text>
    <text x="490" y="96" font-size="9" fill="#888">(1,1)</text>
    <text x="400" y="114">21 → 5</text>
    <text x="490" y="114" font-size="9" fill="#888">(2,1)</text>
    <text x="400" y="132">22 → 7</text>
    <text x="490" y="132" font-size="9" fill="#888">(2,2)</text>
    <text x="400" y="150">31 → 4</text>
    <text x="490" y="150" font-size="9" fill="#888">(3,1)</text>
    <text x="400" y="168">32 → 8</text>
    <text x="490" y="168" font-size="9" fill="#888">(3,2)</text>
    <text x="400" y="186">33 → 6</text>
    <text x="490" y="186" font-size="9" fill="#888">(3,3)</text>
    <text x="400" y="204">41 → 1</text>
    <text x="490" y="204" font-size="9" fill="#888">(4,1)</text>
    <text x="400" y="216">46 → 2</text>
    <text x="490" y="216" font-size="9" fill="#888">(4,6)</text>
  </g>

  <!-- ===== Right: path sums ===== -->
  <rect x="380" y="240" width="180" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="260" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">三条根到叶路径</text>
  <line x1="398" y1="268" x2="542" y2="268" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <g font-size="11">
    <text x="396" y="288" fill="#4a7a3a" font-weight="bold">① 3+5+4+1</text>
    <text x="540" y="288" text-anchor="end" fill="#4a7a3a" font-weight="bold">= 13</text>

    <text x="396" y="312" fill="#8a6a20" font-weight="bold">② 3+5+8</text>
    <text x="540" y="312" text-anchor="end" fill="#8a6a20" font-weight="bold">= 16</text>

    <text x="396" y="336" fill="#b85450" font-weight="bold">③ 3+7+6+2</text>
    <text x="540" y="336" text-anchor="end" fill="#b85450" font-weight="bold">= 18</text>

    <line x1="398" y1="348" x2="542" y2="348" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="396" y="372" fill="#333" font-weight="bold">总和</text>
    <text x="540" y="372" text-anchor="end" font-size="14" fill="#b85450" font-weight="bold">= 47</text>
    <text x="396" y="390" font-size="9" fill="#888">13 + 16 + 18</text>
  </g>

  <!-- bottom note -->
  <text x="290" y="425" text-anchor="middle" font-size="10" fill="#888">叶子判定：左右孩子的 key 都不在 tree 中 → 该节点为叶子，累加 cur+val</text>
</svg>
