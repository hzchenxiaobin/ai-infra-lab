<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：bottom 指针从右向左扫描单行</text>

  <!-- Step 1: init result -->
  <rect x="70" y="48" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="68" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="90" y="84" font-size="10" fill="#333" filter="url(#rough2)">result = n×m 矩阵，全部填 '.'</text>

  <path d="M320 94 L320 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop -->
  <rect x="70" y="114" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="90" y="134" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② for r = 0 … m−1：</text>
  <text x="90" y="150" font-size="10" fill="#333" filter="url(#rough2)">col = m−1−r；bottom = n−1（最右可落点 = 结果列最底）</text>

  <path d="M320 160 L320 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: inner loop -->
  <rect x="70" y="180" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="90" y="202" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ for j = n−1 … 0：（从右向左扫描 box[r][j]）</text>

  <path d="M320 216 L320 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision 1: box[r][j]=='*' ? -->
  <polygon points="320,236 480,272 320,308 160,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">box[r][j] == '*' ?</text>
  <text x="320" y="284" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">障碍物</text>

  <!-- yes branch (left): obstacle -->
  <path d="M160 272 L110 272 L110 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="266" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="54" y="322" width="112" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="110" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">写入障碍物</text>
  <text x="110" y="358" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">result[j][col] = '*'</text>
  <text x="110" y="372" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">bottom = j − 1</text>

  <!-- no branch (right) -> next decision -->
  <path d="M480 272 L530 272 L530 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="506" y="266" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">否</text>

  <!-- Decision 2: box[r][j]=='#' ? -->
  <polygon points="530,322 610,356 530,390 450,356" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">== '#' ?</text>
  <text x="530" y="368" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">石头</text>

  <!-- yes: place stone -->
  <path d="M530 390 L530 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="546" y="404" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="450" y="414" width="160" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="530" y="434" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">石头落到 bottom</text>
  <text x="530" y="450" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">result[bottom][col] = '#'</text>
  <text x="530" y="464" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">bottom − −</text>

  <!-- no: skip (empty) -->
  <path d="M450 356 L380 356 L380 410" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="424" y="350" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">否（'.'）</text>
  <rect x="320" y="414" width="120" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="380" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">跳过</text>
  <text x="380" y="446" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">result 已是 '.'</text>

  <!-- merge from obstacle + stone + skip back to inner loop -->
  <path d="M110 380 L110 510 L300 510 L300 197 L74 197" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M530 472 L530 510 L340 510 L340 197" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" opacity="0.7"/>
  <path d="M380 454 L380 510 L320 510" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.6"/>
  <text x="200" y="504" font-size="9" fill="#446688" filter="url(#rough2)">j − −，回到 ③</text>

  <!-- final -->
  <rect x="70" y="494" width="0" height="0" fill="none"/>
  <text x="600" y="530" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 全部行处理完 → 返回 result</text>
</svg>
