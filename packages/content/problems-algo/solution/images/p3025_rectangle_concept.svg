<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：闭矩形（含边界）内不能有其它点</text>

  <!-- left panel header -->
  <text x="148" y="50" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">有第三点 → 挡住 ✗</text>

  <!-- left panel: blocked case -->
  <rect x="78" y="88" width="128" height="148" fill="#fce4ec" fill-opacity="0.35" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <circle cx="86" cy="96" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="72" y="90" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="198" cy="228" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="208" y="241" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="142" cy="158" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="150" y="151" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="142" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 挡住！</text>
  <text x="142" y="284" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">x_A ≤ x_C ≤ x_B 且 y_B ≤ y_C ≤ y_A</text>
  <text x="142" y="302" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">→ C 落在闭矩形内（含边界）</text>

  <!-- right panel header -->
  <text x="382" y="50" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">都在区间外 → 不挡 ✓</text>

  <!-- right panel: harmless points -->
  <rect x="306" y="88" width="128" height="148" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <circle cx="314" cy="96" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="300" y="90" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="426" cy="228" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="436" y="241" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="370" cy="66" r="5" fill="#999" filter="url(#rough2)"/>
  <text x="382" y="70" font-size="10.5" fill="#888" filter="url(#rough2)">y &gt; y_A</text>
  <circle cx="370" cy="258" r="5" fill="#999" filter="url(#rough2)"/>
  <text x="382" y="262" font-size="10.5" fill="#888" filter="url(#rough2)">y &lt; y_B</text>
  <text x="370" y="284" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">y 不在闭区间 [y_B, y_A] 内</text>
  <text x="370" y="302" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">→ 高了矮了都永远挡不住 ✓</text>

  <!-- bottom note -->
  <rect x="48" y="336" width="424" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 同列 / 同行时矩形退化为线段，判定规则不变：</text>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">中间点 y 落在闭区间 [y_B, y_A]（连端点都算）即挡住</text>
</svg>
