<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">MK 平均值：三桶分区——lo（最小 k 个）/ mid（中间 m−2k 个）/ hi（最大 k 个）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例：m = 7, k = 2，窗口最后 7 个元素排序后为 [1, 3, 5, 7, 9, 11, 13]</text>

  <!-- Top: sorted window row -->
  <text x="36" y="84" font-size="11" fill="#888">窗口排序:</text>
  <rect x="90"  y="66" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="66" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="198" y="66" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="223" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="252" y="66" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="277" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="306" y="66" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="331" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="360" y="66" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="414" y="66" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>

  <!-- Arrows down to buckets -->
  <path d="M 115 104 L 115 130" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 169 104 L 169 130" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 223 104 L 223 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 277 104 L 277 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 331 104 L 331 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 104 L 385 130" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 439 104 L 439 130" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Three buckets -->
  <!-- lo bucket -->
  <rect x="90" y="136" width="104" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="142" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">lo（小 k 个）</text>
  <text x="142" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">{1, 3}</text>
  <text x="142" y="196" text-anchor="middle" font-size="10" fill="#b85450">✗ 删除，不计入</text>

  <!-- mid bucket -->
  <rect x="210" y="136" width="140" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">mid（中间 m−2k 个）</text>
  <text x="280" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">{5, 7, 9}</text>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 求平均</text>

  <!-- hi bucket -->
  <rect x="366" y="136" width="104" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="418" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">hi（大 k 个）</text>
  <text x="418" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">{11, 13}</text>
  <text x="418" y="196" text-anchor="middle" font-size="10" fill="#b85450">✗ 删除，不计入</text>

  <!-- Invariant line -->
  <rect x="50" y="226" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">不变量：max(lo) ≤ min(mid) ≤ max(mid) ≤ min(hi)</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#666">三桶各自有序，且桶间值域不重叠 → mid 恰好是去掉两端 k 个后的中间段</text>

  <!-- Formula -->
  <rect x="90" y="300" width="380" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">MK 平均值 = ⌊ sum(mid) / (m − 2k) ⌋</text>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a">= ⌊ (5 + 7 + 9) / 3 ⌋ = ⌊ 21 / 3 ⌋ = 7</text>
</svg>
