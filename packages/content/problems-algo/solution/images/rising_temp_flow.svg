<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">自连接 + DATEDIFF 算法流程</text>

  <rect x="70" y="42" width="380" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 自连接 FROM Weather w1, Weather w2</text>
  <text x="260" y="82" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">今天 w1 与候选 w2 做行对，逐对筛</text>

  <path d="M 260 94 L 260 116" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="120" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 锚定昨天: DATEDIFF(w1.recordDate, w2.recordDate)=1</text>
  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只留日期正好差 1 天的行对（INNER JOIN / WHERE）</text>

  <path d="M 260 172 L 260 194" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="198" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 温度更高: w1.temperature &gt; w2.temperature</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">今天温度严格大于昨天温度</text>

  <path d="M 260 250 L 260 272" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="276" width="380" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ SELECT w1.id</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">输出满足条件的日期 id（顺序任意）</text>

  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两步筛选缺一不可：DATEDIFF 锚定昨天，温度比较定方向</text>
</svg>
