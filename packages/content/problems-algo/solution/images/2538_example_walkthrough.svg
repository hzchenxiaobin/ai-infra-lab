<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="410" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：以 0 为根跑两遍 DFS（price=[9,8,7,6,10,5]）</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">down 自底向上、up 自顶向下；longest=max(down,up)；开销=longest−price</text>

  <!-- ====== Table grid: 6 data columns + 1 label column ====== -->
  <!-- layout: label col x=40..150 (w=110); each data col w=78 starting x=150 -->
  <!-- columns 0..5 at x = 150,228,306,384,462,540 -->
  <!-- row y centers: price=110, down=150, up=190, longest=230, diff=270 -->
  <!-- highlight answer cols 0 and 2 (nodes 0 and 2, diff=24) -->

  <!-- highlight bands for answer columns (node 0 and node 2) -->
  <rect x="150" y="86" width="78" height="208" fill="#fff8e1" stroke="none" filter="url(#rough2)" opacity="0.9"/>
  <rect x="306" y="86" width="78" height="208" fill="#fff8e1" stroke="none" filter="url(#rough2)" opacity="0.9"/>

  <!-- outer table frame -->
  <rect x="40" y="86" width="578" height="208" rx="6" fill="none" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- column dividers -->
  <path d="M 150 86 L 150 294" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 228 86 L 228 294" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 306 86 L 306 294" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 384 86 L 384 294" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 462 86 L 462 294" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 540 86 L 540 294" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- row dividers -->
  <path d="M 40 124 L 618 124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 164 L 618 164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 204 L 618 204" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 244 L 618 244" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- header row: node indices -->
  <text x="95" y="108" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">节点 u</text>
  <text x="189" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">0</text>
  <text x="267" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">1</text>
  <text x="345" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">2</text>
  <text x="423" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">3</text>
  <text x="501" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">4</text>
  <text x="579" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">5</text>

  <!-- price row -->
  <text x="95" y="148" text-anchor="middle" font-size="12" fill="#5a8a5a" font-weight="bold">price[u]</text>
  <text x="189" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">9</text>
  <text x="267" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">8</text>
  <text x="345" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <text x="423" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">6</text>
  <text x="501" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">10</text>
  <text x="579" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a">5</text>

  <!-- down row (green) -->
  <text x="95" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">down[u]</text>
  <text x="189" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">33</text>
  <text x="267" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a">24</text>
  <text x="345" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <text x="423" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a">16</text>
  <text x="501" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a">10</text>
  <text x="579" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a">5</text>

  <!-- up row (red) -->
  <text x="95" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">up[u]</text>
  <text x="189" y="228" text-anchor="middle" font-size="13" fill="#b85450">9</text>
  <text x="267" y="228" text-anchor="middle" font-size="13" fill="#b85450">17</text>
  <text x="345" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">31</text>
  <text x="423" y="228" text-anchor="middle" font-size="13" fill="#b85450">23</text>
  <text x="501" y="228" text-anchor="middle" font-size="13" fill="#b85450">33</text>
  <text x="579" y="228" text-anchor="middle" font-size="13" fill="#b85450">28</text>

  <!-- diff row (bold, highlighted) -->
  <text x="95" y="278" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">开销</text>
  <text x="189" y="278" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">24</text>
  <text x="267" y="278" text-anchor="middle" font-size="13" fill="#666">16</text>
  <text x="345" y="278" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">24</text>
  <text x="423" y="278" text-anchor="middle" font-size="13" fill="#666">17</text>
  <text x="501" y="278" text-anchor="middle" font-size="13" fill="#666">23</text>
  <text x="579" y="278" text-anchor="middle" font-size="13" fill="#666">23</text>

  <!-- longest path memo next to diff cells -->
  <text x="189" y="294" text-anchor="middle" font-size="8.5" fill="#999">0→1→3→4</text>
  <text x="345" y="294" text-anchor="middle" font-size="8.5" fill="#999">2→1→3→4</text>

  <!-- legend / answer -->
  <text x="330" y="324" text-anchor="middle" font-size="12" fill="#444">down=向下最长（含自身） ｜ up=朝父方向最长（含自身） ｜ 开销 = max(down,up) − price</text>
  <rect x="180" y="340" width="300" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="362" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">节点 0：33−9=24 ｜ 节点 2：31−7=24</text>
  <text x="330" y="380" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = 24</text>
</svg>
