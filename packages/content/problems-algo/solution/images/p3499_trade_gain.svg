<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一次「交易」的净收益 = 左右两个 0 段长度之和</text>

  <!-- ===== 行 1：t 分段 ===== -->
  <text x="24" y="52" font-size="11" fill="#555" filter="url(#rough2)">t = '1' + s + '1'（s = 1000100）分段：</text>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="24" y="58" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="70" y="58" width="66" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="138" y="58" width="22" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="162" y="58" width="44" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="208" y="58" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="46" y="77" filter="url(#rough2)">11</text>
    <text x="103" y="77" filter="url(#rough2)">000</text>
    <text x="149" y="77" filter="url(#rough2)">1</text>
    <text x="184" y="77" filter="url(#rough2)">00</text>
    <text x="219" y="77" filter="url(#rough2)">1</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="103" y="103" fill="#555" filter="url(#rough2)">a = 3</text>
    <text x="149" y="103" fill="#b85450" font-weight="bold" filter="url(#rough2)">b = 1</text>
    <text x="184" y="103" fill="#555" filter="url(#rough2)">c = 2</text>
  </g>

  <path d="M 123 110 L 123 130" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="124" font-size="9.5" fill="#555" filter="url(#rough2)">① 牺牲：b 个 1 变 0</text>

  <!-- ===== 行 2：合并 ===== -->
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="24" y="134" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="70" y="134" width="132" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <rect x="204" y="134" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="46" y="153" filter="url(#rough2)">11</text>
    <text x="136" y="153" filter="url(#rough2)">000000</text>
    <text x="215" y="153" filter="url(#rough2)">1</text>
  </g>
  <text x="136" y="178" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">合并出 0^(a+b+c) = 0^6，左右都是 1</text>

  <path d="M 123 184 L 123 204" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="198" font-size="9.5" fill="#555" filter="url(#rough2)">② 点亮整片（0 → 1）</text>

  <!-- ===== 行 3：全 1 ===== -->
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="24" y="208" width="198" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="123" y="227" filter="url(#rough2)">111111111</text>
  </g>
  <text x="123" y="252" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">净赚 Δ = a + c = 3 + 2 = 5</text>

  <!-- ===== 右侧说明框 A ===== -->
  <rect x="300" y="44" width="205" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="62" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">Δ 与牺牲段长度 b 无关</text>
  <text x="402" y="79" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">付出 b 个 1，赚回 a+b+c 个</text>
  <text x="402" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">Δ = (a+b+c) − b = a + c</text>
  <text x="402" y="107" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">—— 左右 0 有多长才是关键</text>

  <!-- ===== 右侧说明框 B ===== -->
  <rect x="300" y="118" width="205" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="136" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">点亮远处 0 段不优</text>
  <text x="402" y="153" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">远处 0^L：Δ = L − b</text>
  <text x="402" y="169" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">牺牲其旁：Δ = L + e（e ≥ 1）</text>
  <text x="402" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">⇒ 牺牲谁就点亮谁旁边</text>

  <!-- ===== 底部结论横幅 ===== -->
  <rect x="18" y="262" width="488" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="284" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 = ones(s) + max(0, 相邻两个 0 段长度之和)</text>
  <text x="262" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本例：ones = 2，max = 3 + 2 = 5 → 2 + 5 = 7 ✓</text>
  <text x="262" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">0 段不足两个（如 111 / 01 / 全 0）→ 无法操作，max 取 0</text>
</svg>
