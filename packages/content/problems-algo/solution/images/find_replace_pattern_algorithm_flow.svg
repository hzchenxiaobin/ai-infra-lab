<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：逐词双向哈希核对</text>

  <!-- 开始 -->
  <rect x="210" y="50" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">res=[], 遍历 words</text>
  <line x1="280" y1="84" x2="280" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取一个 word -->
  <rect x="200" y="106" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取 word, i=0, s2t={} t2s={}</text>
  <line x1="280" y1="140" x2="280" y2="158" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判1: s2t 含 p[i] ? -->
  <polygon points="280,160 380,200 280,240 180,200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s2t 含 p[i]</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">且 ≠ w[i] ?</text>
  <line x1="380" y1="200" x2="450" y2="200" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="194" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="450" y="180" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不符</text>
  <text x="500" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过该词</text>

  <line x1="280" y1="240" x2="280" y2="258" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 判2: t2s 含 w[i] ? -->
  <polygon points="280,260 380,300 280,340 180,300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t2s 含 w[i]</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">且 ≠ p[i] ?</text>
  <line x1="380" y1="300" x2="450" y2="300" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="294" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="450" y="280" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不符</text>
  <text x="500" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过该词</text>

  <line x1="280" y1="340" x2="280" y2="358" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="352" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 登记 -->
  <rect x="180" y="360" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">登记 s2t[p]=w, t2s[w]=p; i++</text>
  <line x1="280" y1="394" x2="280" y2="410" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i<L ? -->
  <polygon points="280,412 350,440 280,458 210,440" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i&lt;L ?</text>
  <!-- 回到取字符 -->
  <path d="M 210 440 Q 60 440 60 250 Q 60 123 200 123" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="10" fill="#666" filter="url(#rough2)">是：回取字符</text>
  <!-- 否：该词通过 -->
  <line x1="350" y1="440" x2="430" y2="440" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="434" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="430" y="424" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="446" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res.append(w)</text>

  <!-- 遍历完 -->
  <text x="280" y="466" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">所有词处理完 → 返回 res</text>
</svg>
