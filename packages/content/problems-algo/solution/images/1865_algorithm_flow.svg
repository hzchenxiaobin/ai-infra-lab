<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：初始化 / add / count</text>

  <!-- ====== Column 1: init ====== -->
  <rect x="24" y="48" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="99" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">init(nums1, nums2)</text>

  <!-- init steps -->
  <rect x="32" y="92" width="134" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="109" text-anchor="middle" font-size="10.5" fill="#333">存 nums1 / nums2 引用</text>

  <path d="M 99 118 L 99 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="136" width="134" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="153" text-anchor="middle" font-size="10.5" fill="#333">遍历 nums2 建 freq</text>

  <path d="M 99 162 L 99 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="180" width="134" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="99" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">完成 · O(n₂)</text>

  <text x="99" y="226" text-anchor="middle" font-size="10" fill="#888">freq = 值频率哈希表</text>
  <text x="99" y="240" text-anchor="middle" font-size="10" fill="#888">始终等于 nums2 分布</text>

  <!-- ====== Column 2: add ====== -->
  <rect x="200" y="48" width="150" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">add(index, val)</text>

  <!-- add step 1: record old -->
  <rect x="208" y="92" width="134" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="109" text-anchor="middle" font-size="10.5" fill="#333">old = nums2[index]</text>

  <path d="M 275 118 L 275 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add step 2: decrement freq[old] -->
  <rect x="208" y="136" width="134" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="153" text-anchor="middle" font-size="10.5" fill="#b85450">freq[old] − −</text>

  <path d="M 275 162 L 275 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add step 3: update array -->
  <rect x="208" y="180" width="134" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="197" text-anchor="middle" font-size="10.5" fill="#333">nums2[index] += val</text>

  <path d="M 275 206 L 275 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add step 4: freq[new]++ -->
  <rect x="208" y="224" width="134" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a">freq[新值] + +</text>

  <path d="M 275 250 L 275 264" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="208" y="268" width="134" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="275" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">完成 · O(1)</text>

  <!-- ====== Column 3: count ====== -->
  <rect x="376" y="48" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="451" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count(tot)</text>

  <!-- count step 1: ans=0 -->
  <rect x="384" y="92" width="134" height="26" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="109" text-anchor="middle" font-size="10.5" fill="#333">ans = 0</text>

  <path d="M 451 118 L 451 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count step 2: for x in nums1 -->
  <rect x="384" y="136" width="134" height="26" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="153" text-anchor="middle" font-size="10.5" fill="#333">for x in nums1:</text>

  <path d="M 451 162 L 451 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count step 3: lookup -->
  <rect x="384" y="180" width="134" height="26" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="197" text-anchor="middle" font-size="10.5" fill="#b85450">ans += freq[tot−x]</text>

  <path d="M 451 206 L 451 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count loop back -->
  <path d="M 451 226 C 510 226, 520 160, 510 150 L 520 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="528" y="190" font-size="9.5" fill="#888">下一个 x</text>

  <rect x="384" y="232" width="134" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="451" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return ans · O(n₁)</text>

  <!-- ====== Warning box ====== -->
  <rect x="24" y="320" width="510" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⚠️ add 三步顺序不能错：记旧 → 减旧 freq → 改数组 → 加新 freq</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#555">先改数组会丢失旧值，无法从 freq 减去 → freq 与数组脱节 → count 出错</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#555">count 用 find/get 查表，避免下标访问插入空键污染哈希表</text>
</svg>
