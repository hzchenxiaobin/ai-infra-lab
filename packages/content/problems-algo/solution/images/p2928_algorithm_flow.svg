<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单层枚举 x₁ + 区间计数</text>

  <!-- start -->
  <ellipse cx="190" cy="46" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="51" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 190 63 V 76" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="55" y="80" width="270" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="99" text-anchor="middle" font-size="11.5" fill="#333">ans = 0，确定 x₁ 枚举范围</text>
  <text x="190" y="116" text-anchor="middle" font-size="10.5" fill="#446688">[max(0, n−2·limit), min(n, limit)]</text>
  <path d="M 190 124 V 136" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <path d="M 190 136 L 278 172 L 190 208 L 102 172 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="177" text-anchor="middle" font-size="12" fill="#333">还有 x₁？</text>
  <text x="296" y="165" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 278 172 H 348" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="352" y="152" width="145" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="424" y="177" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 ans</text>
  <text x="200" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 190 208 V 226" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- m = n - x1 -->
  <rect x="105" y="230" width="170" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="251" text-anchor="middle" font-size="11.5" fill="#333">m = n − x₁（留给两人）</text>
  <path d="M 190 262 V 274" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- lo hi -->
  <rect x="80" y="278" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="297" text-anchor="middle" font-size="11.5" fill="#333">lo = max(0, m − limit)</text>
  <text x="190" y="314" text-anchor="middle" font-size="11.5" fill="#333">hi = min(limit, m)</text>
  <path d="M 190 322 V 330" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ans accumulate -->
  <rect x="90" y="334" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="350" text-anchor="middle" font-size="11.5" fill="#333">ans += max(0, hi − lo + 1)</text>

  <!-- loop back -->
  <path d="M 90 346 H 44 V 172 H 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="50" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">下一个 x₁</text>

  <!-- side note -->
  <rect x="312" y="240" width="188" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="262" text-anchor="middle" font-size="10.5" fill="#333">每个 x₁ 只做常数次算术</text>
  <text x="406" y="280" text-anchor="middle" font-size="10.5" fill="#333">总时间 O(min(n, limit))</text>
  <text x="406" y="298" text-anchor="middle" font-size="10.5" fill="#446688">n ≤ 50 秒出；放大到 10⁶</text>
  <text x="406" y="316" text-anchor="middle" font-size="10.5" fill="#446688">同款代码也稳（2929）</text>
</svg>
