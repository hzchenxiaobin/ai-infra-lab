<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 → 排序</text>

  <!-- Phase 1 label -->
  <rect x="20" y="42" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">阶段一：建表</text>

  <!-- Step 1: for each response -->
  <rect x="60" y="80" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="103" text-anchor="middle" font-size="11" fill="#333">遍历 responses[i]</text>
  <path d="M 160 118 L 160 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 2: split -->
  <rect x="60" y="136" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="159" text-anchor="middle" font-size="11" fill="#333">split(" ") 得到单词列表</text>
  <path d="M 160 174 L 160 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: dedup with set -->
  <rect x="60" y="192" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">⚠ 去重</text>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#333">放入 set (vis)</text>
  <path d="M 160 230 L 160 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 4: cnt++ -->
  <rect x="60" y="248" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="271" text-anchor="middle" font-size="11" fill="#333">cnt[w] += 1 (每个 w)</text>

  <!-- loop back arrow -->
  <path d="M 60 266 Q 40 266 40 200 Q 40 98 60 98" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="28" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a">下一条</text>

  <!-- arrow to phase 2 -->
  <path d="M 260 266 L 310 266" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <rect x="310" y="42" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">阶段二：排序</text>

  <!-- Step 5: sort features -->
  <rect x="310" y="200" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按 cnt[w] 降序排列 features</text>
  <text x="425" y="240" text-anchor="middle" font-size="10" fill="#666">同频 → 保持原序 (稳定排序)</text>

  <!-- Step 6: return -->
  <rect x="310" y="276" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="299" text-anchor="middle" font-size="11" fill="#333">返回 sortedFeatures</text>
  <path d="M 425 258 L 425 274" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output box -->
  <rect x="60" y="340" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输出：按受欢迎程度降序的功能列表</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#666">appearances 高的在前，相同则维持 features 原序</text>
  <path d="M 425 314 L 425 338" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
