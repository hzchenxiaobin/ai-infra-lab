<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">分数背包核心：物品可分割 → 按单价 price/weight 降序贪心</text>

  <!-- 左侧「单价降序」垂直箭头 -->
  <path d="M52,222 L52,86" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="44" y="154" font-size="11" fill="#888" filter="url(#rough2)" transform="rotate(-90 44 154)">单价降序</text>

  <!-- 物品 A（单价最高，橙） -->
  <rect x="70" y="58" width="130" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">物品 A</text>
  <text x="135" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=50, w=1</text>
  <text x="135" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">单价 50</text>

  <!-- 物品 B（单价中，蓝） -->
  <rect x="70" y="124" width="130" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">物品 B</text>
  <text x="135" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=30, w=6</text>
  <text x="135" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">单价 5</text>

  <!-- 物品 C（单价最低，灰） -->
  <rect x="70" y="190" width="130" height="56" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="208" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">物品 C</text>
  <text x="135" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=10, w=8</text>
  <text x="135" y="240" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">单价 1.25</text>

  <!-- 动作箭头 -->
  <path d="M205,86 L265,86" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="235" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">整块取</text>

  <path d="M205,152 L265,152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="235" y="144" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">切一部分</text>

  <path d="M205,218 L245,218" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="235" y="210" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">跳过</text>
  <text x="252" y="222" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 背包（竖向容器，capacity=5） -->
  <text x="375" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">背包 capacity = 5</text>
  <rect x="300" y="56" width="150" height="188" rx="10" fill="#fff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 物品 B 切取 4/6（顶部，占 4 单位 = 150px） -->
  <rect x="300" y="56" width="150" height="150" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">物品 B 切取 4/6</text>
  <text x="375" y="144" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w=4 → 价 4/6×30=20</text>

  <!-- 物品 A 整取（底部，占 1 单位 = 38px） -->
  <rect x="300" y="206" width="150" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">物品 A 整取 w=1 → 价 50</text>

  <!-- 物品 C 不取标签 -->
  <rect x="455" y="200" width="64" height="26" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="487" y="217" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">C 不取</text>
  <path d="M430,231 L455,213" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- 底部交换论证 -->
  <rect x="40" y="268" width="480" height="98" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">贪心正确性（交换论证）</text>
  <text x="56" y="314" font-size="11" fill="#333" filter="url(#rough2)">• 若某方案放入低价物 C(单价1.25) 却未取尽高价物 A(单价50)，把等重量的 C 换成 A，</text>
  <text x="56" y="332" font-size="11" fill="#333" filter="url(#rough2)">  总价值只增不减 → 最优解必先取尽高价物，故「降序贪心」即最优。</text>
  <text x="56" y="354" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">• 关键前提：物品可分割——边界物总能切出恰好填满剩余容量的部分，无「装不下」浪费。</text>
</svg>
