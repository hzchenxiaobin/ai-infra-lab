<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三例分别命中 Flush / Three of a Kind / Pair</text>

  <!-- Example 1: Flush -->
  <rect x="30" y="42" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="64" font-size="12.5" fill="#4a7a3a" font-weight="bold">例1：ranks=[13,2,3,1,9]  suits=[a,a,a,a,a]</text>
  <!-- 5 cards -->
  <rect x="60" y="76" width="40" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="12" fill="#333">13</text>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="108" y="76" width="40" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="96" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="128" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="156" y="76" width="40" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="96" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="176" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="204" y="76" width="40" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="96" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="224" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="252" y="76" width="40" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="96" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="272" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="318" y="92" font-size="11" fill="#555">m_s=5（五张同 a）</text>
  <text x="318" y="108" font-size="11" fill="#555">m_r=1（点数全异）</text>
  <rect x="318" y="118" width="190" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="135" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">m_s=5 命中 → "Flush"</text>

  <!-- Divider -->
  <path d="M 40 168 L 520 168" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 2: Three of a Kind -->
  <rect x="30" y="178" width="500" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="200" font-size="12.5" fill="#b85450" font-weight="bold">例2：ranks=[4,4,2,4,4]  suits=[d,a,a,b,c]</text>
  <rect x="60" y="212" width="40" height="46" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="80" y="250" text-anchor="middle" font-size="11" fill="#888">d</text>
  <rect x="108" y="212" width="40" height="46" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="128" y="250" text-anchor="middle" font-size="11" fill="#888">a</text>
  <rect x="156" y="212" width="40" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="232" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="176" y="250" text-anchor="middle" font-size="11" fill="#888">a</text>
  <rect x="204" y="212" width="40" height="46" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="224" y="250" text-anchor="middle" font-size="11" fill="#888">b</text>
  <rect x="252" y="212" width="40" height="46" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="272" y="250" text-anchor="middle" font-size="11" fill="#888">c</text>
  <text x="318" y="228" font-size="11" fill="#555">m_s=1（花色各异）</text>
  <text x="318" y="244" font-size="11" fill="#555">m_r=4（四个 4）</text>
  <rect x="318" y="254" width="190" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="271" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">m_r≥3 命中 → "Three of a Kind"</text>

  <!-- Divider -->
  <path d="M 40 304 L 520 304" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 3: Pair -->
  <rect x="30" y="314" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="336" font-size="12.5" fill="#d6a040" font-weight="bold">例3：ranks=[10,10,2,12,9]  suits=[a,b,c,a,d]</text>
  <rect x="60" y="348" width="40" height="46" fill="#e8f0fe" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="368" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="80" y="386" text-anchor="middle" font-size="11" fill="#888">a</text>
  <rect x="108" y="348" width="40" height="46" fill="#e8f0fe" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="368" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="128" y="386" text-anchor="middle" font-size="11" fill="#888">b</text>
  <rect x="156" y="348" width="40" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="368" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="176" y="386" text-anchor="middle" font-size="11" fill="#888">c</text>
  <rect x="204" y="348" width="40" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="368" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="224" y="386" text-anchor="middle" font-size="11" fill="#888">a</text>
  <rect x="252" y="348" width="40" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="368" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="272" y="386" text-anchor="middle" font-size="11" fill="#888">d</text>
  <text x="318" y="364" font-size="11" fill="#555">m_s=1（花色各异）</text>
  <text x="318" y="380" font-size="11" fill="#555">m_r=2（两个 10）</text>
  <rect x="318" y="390" width="190" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="413" y="407" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">m_r≥2 命中 → "Pair"</text>

  <!-- Footer note -->
  <text x="40" y="452" font-size="10.5" fill="#888">注：例1 同时满足 Flush 与高牌(m_r=1)，级联先命中 Flush 故只报同花</text>
</svg>
