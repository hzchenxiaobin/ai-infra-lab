<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：s1 = 「abc」，s2 = 「abb」，s3 = 「ab」</text>

  <!-- step 1: i = 0 -->
  <rect x="44" y="56" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <path d="M 112 71 L 138 71" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="142" y="52" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="69" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">s1[0]=a = s2[0]=a = s3[0]=a</text>
  <text x="240" y="87" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">三字符全等 ✓</text>
  <path d="M 342 71 L 360 71" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="364" y="52" width="128" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="69" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i → 1</text>
  <text x="428" y="87" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">继续前进</text>

  <!-- step 2: i = 1 -->
  <rect x="44" y="118" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="138" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <path d="M 112 133 L 138 133" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="142" y="114" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="131" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">s1[1]=b = s2[1]=b = s3[1]=b</text>
  <text x="240" y="149" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">三字符全等 ✓</text>
  <path d="M 342 133 L 360 133" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="364" y="114" width="128" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="131" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i → 2</text>
  <text x="428" y="149" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">继续前进</text>

  <!-- step 3: i = 2 -->
  <rect x="44" y="180" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="200" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <path d="M 112 195 L 138 195" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="142" y="176" width="196" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="193" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">s1[2]=c ≠ s2[2]=b</text>
  <text x="240" y="211" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">比较失败 ✗（s3 也已到头）</text>
  <path d="M 342 195 L 360 195" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="364" y="176" width="128" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="193" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">跳出循环</text>
  <text x="428" y="211" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">L = 2</text>

  <!-- divider -->
  <path d="M 40 236 L 480 236" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="70" y="248" width="380" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">ans = (3−2) + (3−2) + (2−2) = 2 ✓</text>
  <text x="260" y="287" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">s1 删 「c」、s2 删 「b」，三串同为 「ab」</text>

  <!-- bottom note -->
  <rect x="70" y="310" width="380" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">示例 2：dac / bac / cac 首字符 d、b、c 互不相同</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i = 0 时比较即失败，L = 0 → 返回 −1</text>
</svg>
