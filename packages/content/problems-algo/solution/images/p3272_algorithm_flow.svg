<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">流程：枚举半回文 → 判整除 → 签名去重 → 排列计数</text>

  <!-- 主流程 -->
  <rect x="80" y="36" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="52" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 枚举前一半 first（h = ⌈n/2⌉）</text>
  <text x="180" y="66" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">范围 10^(h−1) … 10^h − 1，首位 ≥ 1</text>

  <path d="M180,72 L180,82" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="84" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 镜像拼接成 n 位回文 full</text>
  <text x="180" y="114" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">full = s + reverse(s 前 n−h 位)</text>

  <path d="M180,120 L180,130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="180,130 280,154 180,178 80,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">full 整除 k ？</text>
  <text x="180" y="165" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">逐位取模判定</text>

  <path d="M280,154 L308,154" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="147" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="312" y="142" width="48" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="336" y="158" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃</text>

  <path d="M180,178 L180,192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="80" y="194" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 签名入哈希集合：sig = 排序(full)</text>
  <text x="180" y="224" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">已存在 → 跳过（多重集去重）</text>

  <path d="M180,230 L180,240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="242" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 计数：total = n! / ∏ cnt_d!</text>
  <text x="180" y="272" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">cnt0 &gt; 0 时减 (n−1)! / ((cnt0−1)!·∏)</text>
  <text x="180" y="284" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（扣掉首位为 0 的排列）</text>

  <path d="M180,288 L180,298" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="300" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 累加 ans += total，返回 ans</text>

  <!-- 右侧三个观察框 -->
  <rect x="386" y="36" width="126" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="449" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">枚举量极小</text>
  <text x="449" y="74" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">回文由前一半决定</text>
  <text x="449" y="88" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">候选仅 9×10^(h−1) 个</text>
  <text x="449" y="102" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n = 10 时 9 万个</text>
  <text x="449" y="116" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个 O(n) 判整除</text>

  <rect x="386" y="132" width="126" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="449" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">哈希去重</text>
  <text x="449" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">不同回文可共享</text>
  <text x="449" y="184" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">同一多重集</text>
  <text x="449" y="198" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（如 2442 / 4224）</text>
  <text x="449" y="212" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">不重不漏</text>

  <rect x="386" y="228" width="126" height="102" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="449" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">首零容斥</text>
  <text x="449" y="266" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">减去首位为 0 的排列：</text>
  <text x="449" y="280" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">固定一个 0 在首位，</text>
  <text x="449" y="294" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">剩 n−1 位做</text>
  <text x="449" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">多重集排列</text>
  <text x="449" y="322" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">减法原理，两类不交</text>

  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总复杂度 O(10^⌈n/2⌉ · n)：n = 10 约 10^6 量级，瞬间跑完</text>
</svg>
