<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：可重复走边 ⇒ 最小代价 = 分量全体边权的 AND</text>

  <!-- Panel 1: example 2 graph -->
  <text x="150" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 分量 {0,1,2} 的全部边</text>

  <path d="M 108 96 L 196 96" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">15</text>

  <path d="M 103 110 L 218 172" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>

  <path d="M 201 110 C 232 132 252 152 232 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="252" y="140" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <path d="M 206 100 C 252 92 268 118 240 152" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="284" y="105" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="92" cy="96" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="101" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="212" cy="96" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="101" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="240" cy="182" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="187" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Panel 2: bitwise AND -->
  <text x="415" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 全体边权按位 AND</text>

  <rect x="330" y="62" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="79" text-anchor="middle" font-size="11" fill="#8a6a1f" filter="url(#rough2)">边权</text>
  <rect x="376" y="62" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="79" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">b2</text>
  <rect x="408" y="62" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="79" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">b1</text>
  <rect x="440" y="62" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="79" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">b0</text>

  <rect x="330" y="86" width="46" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="102" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <rect x="376" y="86" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="408" y="86" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="440" y="86" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="102" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="330" y="108" width="46" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">15</text>
  <rect x="376" y="108" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="408" y="108" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="440" y="108" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="330" y="130" width="46" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <rect x="376" y="130" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="146" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="408" y="130" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="146" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="440" y="130" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="330" y="152" width="46" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="376" y="152" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="408" y="152" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="440" y="152" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="330" y="174" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">AND</text>
  <rect x="376" y="174" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="392" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="408" y="174" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="424" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="440" y="174" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="456" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="415" y="218" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= 0：任何 s→t 答案都是 0</text>

  <!-- Panel 3: lower bound -->
  <rect x="40" y="248" width="440" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="270" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下界：任何旅途的边集 S ⊆ 分量边集 E</text>
  <text x="60" y="290" font-size="11" fill="#555" filter="url(#rough2)">AND 参与的数越多，为 1 的位只减不增</text>
  <text x="60" y="302" font-size="11" fill="#555" filter="url(#rough2)">⇒ cost = AND(S) ≥ AND(E)</text>

  <!-- Panel 4: achievable -->
  <rect x="40" y="322" width="440" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">可达：生成树环游（树边走两次）+ 非树边 u→v→u 折返</text>
  <text x="60" y="364" font-size="11" fill="#555" filter="url(#rough2)">⇒ 存在经过每条边至少一次的 s→t 旅途</text>
  <text x="60" y="376" font-size="11" fill="#555" filter="url(#rough2)">⇒ AND(E) 恰好取得到（重复边对 AND 幂等）</text>

  <path d="M 260 236 L 260 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="70" y="398" width="380" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两向夹逼：最小代价 = 分量全体边权的 AND，与具体怎么走无关</text>
</svg>
