<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：power = [7, 1, 6, 6]</text>

  <!-- vals / sums row -->
  <text x="38" y="60" font-size="12" fill="#888">vals:</text>
  <rect x="84" y="40" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="128" y="40" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="60" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="172" y="40" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="60" text-anchor="middle" font-size="12" fill="#333">7</text>

  <text x="252" y="60" font-size="12" fill="#888">sums:</text>
  <rect x="300" y="40" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="344" y="40" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="60" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="388" y="40" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="60" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="448" y="60" font-size="10.5" fill="#888">sums = 值 × 次数</text>

  <!-- table header -->
  <rect x="40" y="88" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <rect x="74" y="88" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">v</text>
  <rect x="114" y="88" width="156" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p（首个 ≥ v−2）</text>
  <rect x="270" y="88" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dp[p]</text>
  <rect x="332" y="88" width="122" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">取：dp[p]+sums</text>
  <rect x="454" y="88" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dp[i]（决策）</text>

  <!-- row 1 -->
  <rect x="40" y="118" width="34" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="57" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="74" y="118" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="94" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="114" y="118" width="156" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="140" text-anchor="middle" font-size="9.5" fill="#555">0（vals[0]=1 ≥ −1）</text>
  <rect x="270" y="118" width="62" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="301" y="140" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="332" y="118" width="122" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="393" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 + 1 = 1</text>
  <rect x="454" y="118" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1（取）</text>

  <!-- row 2 -->
  <rect x="40" y="152" width="34" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="57" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="74" y="152" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="94" y="174" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="114" y="152" width="156" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="174" text-anchor="middle" font-size="9.5" fill="#555">1（值1 &lt; 4，前移）</text>
  <rect x="270" y="152" width="62" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="301" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="332" y="152" width="122" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="393" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 + 12 = 13</text>
  <rect x="454" y="152" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13（取）</text>

  <!-- row 3 -->
  <rect x="40" y="186" width="34" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="57" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="74" y="186" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="94" y="208" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="114" y="186" width="156" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="208" text-anchor="middle" font-size="9.5" fill="#555">1（值6 ≥ 5，不动）</text>
  <rect x="270" y="186" width="62" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="301" y="208" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="332" y="186" width="122" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="393" y="208" text-anchor="middle" font-size="11" fill="#888">1 + 7 = 8</text>
  <rect x="454" y="186" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13（不取）</text>

  <!-- answer box -->
  <rect x="110" y="240" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 13 = 1×1 + 6×2</text>
  <text x="280" y="277" text-anchor="middle" font-size="10.5" fill="#555">选值 1 和两个 6（相差 5 &gt; 2，可共存）</text>

  <!-- note box -->
  <rect x="60" y="300" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#444">p 只前进不回退：v 递增 ⇒ v−2 递增</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#444">「首个 ≥ v−2 的位置」单调右移，均摊 O(1)</text>
</svg>
