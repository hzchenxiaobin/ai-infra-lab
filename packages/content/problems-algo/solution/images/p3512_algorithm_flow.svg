<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">求和、取模：枚举循环坍缩成一个模运算</text>

  <!-- 主流程 -->
  <rect x="300" y="38" width="84" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="55" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 342 64 L 342 76" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="78" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">S ← sum(nums)</text>
  <path d="M 342 108 L 342 120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="122" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">r ← S mod k</text>
  <path d="M 342 152 L 342 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="282" y="166" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="342" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 r</text>

  <!-- 枚举版对照卡 -->
  <rect x="28" y="96" width="176" height="76" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="116" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">枚举版（也能过）</text>
  <text x="116" y="136" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d = 0,1,2,… 逐个试</text>
  <text x="116" y="156" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">检查 (S−d) mod k = 0 ?</text>

  <path d="M 204 134 L 250 137" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="227" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">坍缩</text>
  <text x="225" y="156" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">= S mod k</text>

  <!-- 结论 -->
  <rect x="95" y="226" width="330" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">answer = sum(nums) % k</text>
  <text x="260" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下标是烟雾弹：每次操作总和恰好 −1</text>

  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">验证：S=19,k=5 → 4；S=8,k=4 → 0；S=5,k=6 → 5</text>

  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">求和 O(n) + 取模 O(1)：两个动作就是全部</text>
</svg>
