<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：二进制枚举 + 位运算判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">n ≤ 12 → 2^n ≤ 4096，每种组合 O(m) 判一遍</text>

  <!-- Step 1: 预处理行掩码 -->
  <rect x="60" y="64" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 预处理：每行压成掩码</text>
  <text x="160" y="98" text-anchor="middle" font-size="9.5" fill="#888">row[i] = Σ (matrix[i][j]==1) &lt;&lt; j</text>

  <path d="M160 106 L160 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 枚举 sel -->
  <rect x="60" y="128" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 枚举 sel ∈ [0, 2^n)</text>
  <text x="160" y="162" text-anchor="middle" font-size="9.5" fill="#888">仅保留 popcount(sel)==numSelect 者</text>

  <path d="M160 170 L160 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 判定条件 -->
  <polygon points="160,190 270,232 160,274 50,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">popcount(sel)</text>
  <text x="160" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== numSelect ?</text>

  <!-- No branch: back to step 2 (next sel) -->
  <path d="M50 232 L20 232 L20 148 L58 148" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 20 188)">否，下一个</text>

  <!-- Yes branch -->
  <path d="M160 276 L160 296" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: 数覆盖行数 -->
  <rect x="50" y="300" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 数覆盖行数 cnt</text>
  <text x="160" y="334" text-anchor="middle" font-size="9.5" fill="#888">cnt = Σ_i [(row[i] &amp; sel)==row[i]]</text>

  <path d="M160 342 L160 360" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 更新最大值 -->
  <rect x="50" y="364" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="382" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ ans = max(ans, cnt)</text>
  <text x="160" y="398" text-anchor="middle" font-size="9.5" fill="#888">保留覆盖行数最大的组合</text>

  <!-- loop back to step 2 -->
  <path d="M270 384 L300 384 L300 148 L260 148" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 300 262)">枚举完所有 sel</text>

  <path d="M160 406 L160 426" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="418" text-anchor="middle" font-size="10" fill="#888">2^n 用尽</text>

  <!-- return -->
  <ellipse cx="160" cy="446" rx="62" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="450" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return ans</text>

  <!-- ============ Side note: 复杂度 ============ -->
  <rect x="340" y="120" width="200" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="440" y="144" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">规模核算</text>
  <text x="440" y="166" text-anchor="middle" font-size="10.5" fill="#333">n ≤ 12 → 2^n = 4096</text>
  <text x="440" y="184" text-anchor="middle" font-size="10.5" fill="#333">有效组合 C(n, numSelect)</text>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#888">≤ C(12,6) = 924</text>
  <line x1="360" y1="210" x2="520" y2="210" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="440" y="228" text-anchor="middle" font-size="10.5" fill="#333">每组判 m 行，m ≤ 12</text>
  <text x="440" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">总计 ≈ 924×12</text>
  <text x="440" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≈ 1.1×10⁴ 次操作</text>
  <text x="440" y="282" text-anchor="middle" font-size="10" fill="#888">远低于时限，秒杀</text>
  <text x="440" y="302" text-anchor="middle" font-size="9.5" fill="#888">Gosper hack 可只迭代定长组合</text>

  <!-- footer -->
  <text x="440" y="350" text-anchor="middle" font-size="10" fill="#888">行掩码预处理后，每组判定只剩按位与</text>
  <text x="440" y="366" text-anchor="middle" font-size="10" fill="#888">(&amp;) + 比较，常数极小</text>
</svg>
