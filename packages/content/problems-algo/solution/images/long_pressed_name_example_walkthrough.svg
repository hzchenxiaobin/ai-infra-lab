<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：长按字符的颜色编码</text>

  <!-- 图例 -->
  <rect x="160" y="38" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="190" y="51" font-size="10" fill="#4a7a3a">匹配 name 字符</text>
  <rect x="290" y="38" width="22" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="51" font-size="10" fill="#d6a040">长按重复（跳过）</text>
  <rect x="430" y="38" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="51" font-size="10" fill="#b85450">失败</text>

  <!-- ===== 示例1: alex / aaleex -> true ===== -->
  <text x="60" y="86" font-size="12" fill="#446688" font-weight="bold">示例 1：name = "alex", typed = "aaleex"</text>
  <rect x="40" y="94" width="540" height="96" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <!-- name 行 -->
  <text x="56" y="118" font-size="10" fill="#888" font-weight="bold">name</text>
  <g font-size="13">
    <rect x="100" y="106" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="119" y="124" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="180" y="106" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="199" y="124" text-anchor="middle" fill="#446688" font-weight="bold">l</text>
    <rect x="260" y="106" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="279" y="124" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="340" y="106" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="359" y="124" text-anchor="middle" fill="#446688" font-weight="bold">x</text>
  </g>

  <!-- typed 行（着色） -->
  <text x="56" y="158" font-size="10" fill="#888" font-weight="bold">typed</text>
  <g font-size="13">
    <rect x="100" y="146" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="140" y="146" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="159" y="164" text-anchor="middle" fill="#d6a040" font-weight="bold">a</text>
    <rect x="180" y="146" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="260" y="146" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="279" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="300" y="146" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="319" y="164" text-anchor="middle" fill="#d6a040" font-weight="bold">e</text>
    <rect x="340" y="146" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="359" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">x</text>
  </g>

  <!-- 连接线：name 字符 -> typed 匹配格 -->
  <path d="M 119 132 L 119 144" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 199 132 L 199 144" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 279 132 L 279 144" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 359 132 L 359 144" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="470" y="112" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="515" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true ✓</text>
  <text x="470" y="170" font-size="9.5" fill="#888">i 走完 name，typed 无多余异字符</text>

  <!-- ===== 示例2: saeed / ssaaedd -> false ===== -->
  <text x="60" y="216" font-size="12" fill="#b85450" font-weight="bold">示例 2：name = "saeed", typed = "ssaaedd"</text>
  <rect x="40" y="224" width="540" height="110" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <!-- name 行 -->
  <text x="56" y="248" font-size="10" fill="#888" font-weight="bold">name</text>
  <g font-size="13">
    <rect x="100" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="117" y="254" text-anchor="middle" fill="#446688" font-weight="bold">s</text>
    <rect x="170" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="187" y="254" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="240" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="257" y="254" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="310" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="327" y="254" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="380" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="397" y="254" text-anchor="middle" fill="#446688" font-weight="bold">d</text>
  </g>

  <!-- typed 行 -->
  <text x="56" y="296" font-size="10" fill="#888" font-weight="bold">typed</text>
  <g font-size="13">
    <rect x="100" y="284" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">s</text>
    <rect x="134" y="284" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="151" y="302" text-anchor="middle" fill="#d6a040" font-weight="bold">s</text>
    <rect x="170" y="284" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="187" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="204" y="284" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="221" y="302" text-anchor="middle" fill="#d6a040" font-weight="bold">a</text>
    <rect x="240" y="284" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="257" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="310" y="284" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="327" y="302" text-anchor="middle" fill="#b85450" font-weight="bold">d</text>
    <rect x="344" y="284" width="34" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="361" y="302" text-anchor="middle" fill="#aaa" font-weight="bold">d</text>
  </g>

  <!-- 连接线 -->
  <path d="M 117 262 L 117 282" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 187 262 L 187 282" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 257 262 L 257 282" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 失败标注 -->
  <path d="M 327 270 L 327 282" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="244" width="156" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="434" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">typed[j]=d ≠ name[i]=e</text>
  <text x="434" y="277" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">且 d ≠ typed[j-1]=e → false</text>

  <!-- 结果 -->
  <rect x="470" y="300" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="515" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- 底部小结 -->
  <rect x="60" y="352" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定要点</text>
  <text x="300" y="390" text-anchor="middle" font-size="10.5" fill="#446688">· typed 的每个字符：要么匹配 name 当前字符（i、j 同进），要么是前一个字符的长按（仅 j 进）</text>
  <text x="300" y="406" text-anchor="middle" font-size="10.5" fill="#446688">· 结尾要求 i 恰好走完 name；typed 末尾的多余异字符会在循环内被第三分支拦截</text>
</svg>
