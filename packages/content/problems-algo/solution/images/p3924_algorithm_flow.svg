<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：在候选阈值上二分，判定交给 0-1 BFS</text>

  <!-- step 1 -->
  <rect x="160" y="40" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① cand = {0} ∪ 全部边权，排序去重</text>

  <path d="M 280 76 L 280 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 diamond -->
  <polygon points="280,100 436,144 280,188 124,144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② feasible(cand[最后]) ?</text>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#8899aa">全部边都变轻 = 连通性判定</text>

  <!-- no branch -->
  <path d="M 436 144 L 462 144" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="449" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="464" y="122" width="82" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="141" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return −1</text>
  <text x="505" y="158" text-anchor="middle" font-size="10" fill="#b85450">不连通</text>

  <!-- yes branch -->
  <path d="M 280 188 L 280 214" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- step 3 binary search -->
  <rect x="115" y="216" width="330" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 二分下标 [lo, hi]：mid = (lo + hi) / 2</text>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#555">可行 → hi = mid；不可行 → lo = mid + 1</text>

  <!-- self loop -->
  <path d="M 445 230 C 486 226, 486 258, 449 254" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="490" y="245" text-anchor="middle" font-size="10" fill="#8899aa">迭代</text>

  <path d="M 280 266 L 280 292" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="188" y="294" width="184" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ return cand[lo]</text>

  <!-- feasible panel -->
  <path d="M 124 152 C 70 190, 58 270, 76 336" fill="none" stroke="#8899aa" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 115 246 C 90 280, 100 316, 130 336" fill="none" stroke="#8899aa" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="338" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">feasible(t)：0-1 BFS（双端队列）—— 轻边 w ≤ t 代价 0 → push_front；</text>
  <text x="280" y="377" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">重边 w &gt; t 代价 1 → push_back；可行 ⟺ dist[target] ≤ k，单次判定 O(n + E)</text>
</svg>
