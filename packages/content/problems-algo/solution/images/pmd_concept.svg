<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：排序后贪心分组</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每组以剩余最小值为起点 s，收纳所有 ≤ s+k 的元素</text>

  <!-- ===== Original array row ===== -->
  <text x="18" y="80" font-size="10.5" fill="#666">原数组</text>
  <rect x="64" y="60" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="104" y="60" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="144" y="60" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="60" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="224" y="60" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="284" y="80" font-size="11.5" fill="#b85450" font-weight="bold">k = 2</text>

  <!-- sort arrow -->
  <path d="M 163 92 L 163 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="105" font-size="9.5" fill="#888">排序升序</text>

  <!-- ===== Sorted array with group backgrounds ===== -->
  <!-- group1 background -->
  <rect x="60" y="114" width="126" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <!-- group2 background -->
  <rect x="184" y="114" width="84" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="18" y="138" font-size="10.5" fill="#666">排序后</text>
  <!-- value boxes on top -->
  <rect x="64" y="118" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="118" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="144" y="118" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="188" y="118" width="38" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="228" y="118" width="38" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- group labels below -->
  <text x="123" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">组1: 1~3 差 2 ≤ k ✓</text>
  <text x="226" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">组2: 5~6 差 1 ≤ k ✓</text>

  <!-- ===== Result ===== -->
  <rect x="40" y="186" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">最少分组数 = 2 组</text>

  <!-- ===== Greedy rule box ===== -->
  <rect x="40" y="238" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">贪心规则</text>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#555">以剩余最小值为起点 s，把它及所有 ≤ s+k 的元素收入本组</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#555">第一个超出 s+k 的元素成为下一组的新起点 s′</text>

  <!-- ===== Proof note ===== -->
  <rect x="40" y="304" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为什么最优</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#555">s 是剩余最小值，必为某组的最小值 → 该组上界 ≤ s+k</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555">尽量多收元素不增加组数 → 贪心每组取到极限即达下界</text>
</svg>
