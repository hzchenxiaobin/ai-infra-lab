<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单行配色：只有两种形状类型</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">第 1、3 格不相邻 → 要么首尾同色（ABA），要么三色各异（ABC）</text>

  <!-- ===== Top: 3-cell row with adjacency ===== -->
  <g>
    <rect x="150" y="62" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="88" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
    <rect x="230" y="62" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="88" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="310" y="62" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="88" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">3</text>

    <!-- ≠ between adjacent pairs -->
    <text x="220" y="89" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">≠</text>
    <text x="300" y="89" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">≠</text>

    <!-- dashed bracket: 1 与 3 不相邻 -->
    <path d="M 150 116 L 150 110 L 370 110 L 370 116" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
    <text x="260" y="128" text-anchor="middle" font-size="10" fill="#888">1 与 3 不相邻：可同色，也可异色</text>
  </g>

  <!-- ===== ABA type box ===== -->
  <g>
    <rect x="36" y="138" width="218" height="162" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
    <text x="145" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ABA 型 · 首尾同色</text>

    <!-- example cells R Y R -->
    <rect x="68" y="170" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="91" y="199" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>
    <rect x="122" y="170" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="145" y="199" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">Y</text>
    <rect x="176" y="170" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="199" y="199" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>

    <!-- pattern letters -->
    <text x="91" y="232" text-anchor="middle" font-size="11" fill="#888">A</text>
    <text x="145" y="232" text-anchor="middle" font-size="11" fill="#888">B</text>
    <text x="199" y="232" text-anchor="middle" font-size="11" fill="#888">A</text>

    <text x="145" y="252" text-anchor="middle" font-size="10" fill="#555">首尾同色 A，中间 B ≠ A</text>
    <text x="145" y="270" text-anchor="middle" font-size="10" fill="#555">A: 3 色选 1；B: 剩 2 色选 1</text>
    <text x="145" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 3 × 2 = 6 种</text>
  </g>

  <!-- ===== ABC type box ===== -->
  <g>
    <rect x="266" y="138" width="218" height="162" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
    <text x="375" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ABC 型 · 三色各异</text>

    <!-- example cells R Y G -->
    <rect x="298" y="170" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="321" y="199" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>
    <rect x="352" y="170" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="375" y="199" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">Y</text>
    <rect x="406" y="170" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="429" y="199" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">G</text>

    <text x="321" y="232" text-anchor="middle" font-size="11" fill="#888">A</text>
    <text x="375" y="232" text-anchor="middle" font-size="11" fill="#888">B</text>
    <text x="429" y="232" text-anchor="middle" font-size="11" fill="#888">C</text>

    <text x="375" y="252" text-anchor="middle" font-size="10" fill="#555">三格两两不同色</text>
    <text x="375" y="270" text-anchor="middle" font-size="10" fill="#555">3 色全排列</text>
    <text x="375" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 3! = 6 种</text>
  </g>

  <!-- ===== Legend + summary ===== -->
  <g>
    <rect x="40" y="312" width="440" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="56" y="319" width="11" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="72" y="328" font-size="9" fill="#555">R=红</text>
    <rect x="108" y="319" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="124" y="328" font-size="9" fill="#555">Y=黄</text>
    <rect x="160" y="319" width="11" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="176" y="328" font-size="9" fill="#555">G=绿</text>
    <text x="312" y="328" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">单行：6 + 6 = 12 种，按形状归为 2 类</text>
  </g>

  <rect x="40" y="344" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：下一行的合法接法只依赖上一行的「形状」，与具体颜色无关</text>
</svg>
