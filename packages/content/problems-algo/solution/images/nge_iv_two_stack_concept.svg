<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：双单调栈接力——s1 管第 1 个更大，s2 管第 2 个更大</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每个下标入 s1 一次、入 s2 一次、各出一次 → 合计 O(n)</text>

  <!-- nums[i] box -->
  <rect x="245" y="56" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i]</text>

  <!-- arrow nums[i] -> s2 (trigger) down -->
  <path d="M 280 84 L 280 116" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="104" font-size="9.5" fill="#b85450">触发</text>

  <!-- arrow nums[i] -> s1 (step 3) diagonal down-left -->
  <path d="M 250 84 Q 180 100 115 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="148" y="102" font-size="9.5" fill="#446688">③ 压入 s1</text>

  <!-- s1 box -->
  <rect x="40" y="120" width="150" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">s1</text>
  <text x="115" y="156" text-anchor="middle" font-size="10" fill="#555">待找第 1 个更大</text>
  <rect x="78" y="166" width="74" height="14" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="182" width="58" height="14" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="206" text-anchor="middle" font-size="9" fill="#888">栈顶在上 · 严格递减</text>

  <!-- s2 box -->
  <rect x="205" y="120" width="150" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s2</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#555">待找第 2 个更大</text>
  <rect x="243" y="166" width="74" height="14" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="251" y="182" width="58" height="14" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="9" fill="#888">栈顶在上 · 严格递减</text>

  <!-- answer box -->
  <rect x="370" y="120" width="150" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">answer[ ]</text>
  <text x="445" y="158" text-anchor="middle" font-size="10" fill="#555">已确定第 2 大</text>
  <text x="445" y="188" text-anchor="middle" font-size="11" fill="#888">初始全 -1</text>

  <!-- arrow s1 -> s2 (step 2) -->
  <path d="M 190 163 L 203 163" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">②</text>

  <!-- arrow s2 -> answer (step 1) -->
  <path d="M 355 163 L 368 163" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">①</text>

  <!-- bottom step legend -->
  <g font-size="10" fill="#333">
    <rect x="30" y="226" width="500" height="108" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="44" y="246" font-size="11" fill="#444" font-weight="bold">每个 i 的三步（按序执行）；比较用严格 &lt;（相等不弹，相等不是"更大"）</text>
    <text x="44" y="266" fill="#b85450" font-weight="bold">①</text>
    <text x="62" y="266">while s2 非空 且 nums[s2.top] &lt; nums[i]：answer[s2.top] = nums[i]，弹 s2</text>
    <text x="44" y="286" fill="#4a7a3a" font-weight="bold">②</text>
    <text x="62" y="286">while s1 非空 且 nums[s1.top] &lt; nums[i]：弹 s1 收集到 tmp，逆序压入 s2</text>
    <text x="44" y="306" fill="#446688" font-weight="bold">③</text>
    <text x="62" y="306">s1.push(i)</text>
    <text x="44" y="326" fill="#888">② 逆序是为保 s2 严格递减：s1 弹出序列递增，逆序后递减入栈</text>
  </g>
</svg>
