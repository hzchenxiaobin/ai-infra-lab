<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 层序 + 并查集跳表批量删</text>

  <!-- 1. Init -->
  <rect x="90" y="34" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="11" fill="#333">初始化：建 rowNxt / colNxt 两套跳表</text>
  <text x="200" y="71" text-anchor="middle" font-size="11" fill="#333">dist[0][0]=0；(0,0) 入队</text>

  <!-- 2. Dequeue -->
  <rect x="90" y="100" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="125" text-anchor="middle" font-size="11" fill="#333">出队 (i,j)，距离 d = dist[i][j]</text>

  <!-- 3. Ranges -->
  <rect x="90" y="158" width="220" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="11" fill="#333">g = grid[i][j]</text>
  <text x="200" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">向右区间 [j+1, min(j+g, n−1)]</text>
  <text x="200" y="208" text-anchor="middle" font-size="10" fill="#d6a040">向下区间 [i+1, min(i+g, m−1)]</text>

  <!-- 4. Find next -->
  <rect x="90" y="236" width="220" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="255" text-anchor="middle" font-size="11" fill="#333">find 下个未访问：</text>
  <text x="200" y="271" text-anchor="middle" font-size="10" fill="#4a7a3a">k = rowNxt[i].find(j+1)</text>
  <text x="200" y="285" text-anchor="middle" font-size="10" fill="#d6a040">r = colNxt[j].find(i+1)</text>

  <!-- 5. Diamond: in range? -->
  <polygon points="200,300 262,332 200,364 138,332" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="329" text-anchor="middle" font-size="10" fill="#333">k≤cmax</text>
  <text x="200" y="342" text-anchor="middle" font-size="10" fill="#333">或 r≤rmax ?</text>

  <!-- Visit box (right) -->
  <rect x="336" y="300" width="176" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">visit：首次到达</text>
  <text x="424" y="333" text-anchor="middle" font-size="10" fill="#333">dist = d+1</text>
  <text x="424" y="348" text-anchor="middle" font-size="10" fill="#333">删 rowNxt[i][k] &amp; colNxt[k][i]</text>
  <text x="424" y="362" text-anchor="middle" font-size="10" fill="#333">入队 → k=find(k)</text>

  <!-- 6. Diamond: queue empty? -->
  <polygon points="200,390 262,422 200,454 138,422" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="426" text-anchor="middle" font-size="11" fill="#333">队列空 ?</text>

  <!-- 7. Return -->
  <rect x="90" y="476" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="497" text-anchor="middle" font-size="11" fill="#333">return dist[m−1][n−1] + 1</text>
  <text x="200" y="513" text-anchor="middle" font-size="10" fill="#888">不可达则 −1</text>

  <!-- arrows: spine -->
  <path d="M 200 80 L 200 98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 200 140 L 200 156" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 200 218 L 200 234" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 200 290 L 200 298" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 200 364 L 200 388" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 200 454 L 200 474" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- diamond1 -> visit (yes, right) -->
  <path d="M 262 332 L 334 332" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="298" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- visit -> find (loop back up) -->
  <path d="M 424 300 L 424 263 L 312 263" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="430" y="284" font-size="9" fill="#4a7a3a">取下个未访问</text>

  <!-- diamond1 down label (no) -->
  <text x="212" y="382" font-size="10" fill="#b85450" font-weight="bold">否（区间扫完）</text>

  <!-- diamond2 -> dequeue (no, loop back left) -->
  <path d="M 138 422 L 56 422 L 56 120 L 88 120" stroke="#666" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="64" y="412" font-size="10" fill="#666" font-weight="bold">否</text>
  <text x="64" y="270" font-size="9" fill="#888">取下一格</text>

  <!-- diamond2 down label (yes) -->
  <text x="212" y="470" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
</svg>
