<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：两个边界情形</text>

  <!-- ===== Column A: 2014-06-20 (simple) ===== -->
  <rect x="20" y="44" width="250" height="276" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)" opacity="0.95"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：2014-06-20</text>

  <text x="36" y="90" font-size="11" fill="#555">解析：</text>
  <g font-size="12" fill="#333" font-weight="bold">
    <rect x="100" y="76" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="124" y="92" text-anchor="middle">2014</text>
    <rect x="150" y="76" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="170" y="92" text-anchor="middle">06</text>
    <rect x="192" y="76" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="212" y="92" text-anchor="middle">20</text>
  </g>

  <text x="36" y="120" font-size="11" fill="#555">6 月天数：</text>
  <text x="120" y="120" font-size="12" fill="#333" font-weight="bold">days[6] = 30</text>

  <text x="36" y="142" font-size="11" fill="#555">判定：</text>
  <text x="90" y="142" font-size="12" fill="#333">day(20) &lt; 月末(30)</text>
  <text x="222" y="142" font-size="11.5" fill="#4a7a3a" font-weight="bold">否</text>

  <text x="36" y="164" font-size="11" fill="#555">动作：</text>
  <rect x="90" y="150" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">day = 20 + 1 = 21</text>

  <path d="M150 178 L150 194" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="36" y="212" font-size="11" fill="#555">格式化：</text>
  <rect x="90" y="198" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2014-06-21</text>

  <text x="36" y="246" font-size="10.5" fill="#888">年/月不变，仅 day+1</text>

  <rect x="36" y="262" width="218" height="26" fill="#4a7a3a" opacity="0.16" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="279" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ "2014-06-21" ✓</text>

  <!-- ===== Column B: 2017-10-31 (month rollover) ===== -->
  <rect x="290" y="44" width="250" height="276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)" opacity="0.95"/>
  <text x="415" y="66" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">示例 2：2017-10-31</text>

  <text x="306" y="90" font-size="11" fill="#555">解析：</text>
  <g font-size="12" fill="#333" font-weight="bold">
    <rect x="370" y="76" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="394" y="92" text-anchor="middle">2017</text>
    <rect x="420" y="76" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="440" y="92" text-anchor="middle">10</text>
    <rect x="462" y="76" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="482" y="92" text-anchor="middle">31</text>
  </g>

  <text x="306" y="120" font-size="11" fill="#555">10 月天数：</text>
  <text x="390" y="120" font-size="12" fill="#333" font-weight="bold">days[10] = 31</text>

  <text x="306" y="142" font-size="11" fill="#555">判定：</text>
  <text x="360" y="142" font-size="12" fill="#333">day(31) == 月末(31)</text>
  <text x="492" y="142" font-size="11.5" fill="#d6a040" font-weight="bold">是</text>

  <text x="306" y="164" font-size="11" fill="#555">动作 1：</text>
  <rect x="360" y="150" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="168" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">day = 1</text>

  <path d="M420 178 L420 194" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="306" y="212" font-size="11" fill="#555">判定 2：</text>
  <text x="360" y="212" font-size="12" fill="#333">month(10) ≠ 12</text>
  <text x="476" y="212" font-size="11.5" fill="#d6a040" font-weight="bold">否</text>

  <text x="306" y="234" font-size="11" fill="#555">动作 2：</text>
  <rect x="360" y="220" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="238" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">month = 11</text>

  <path d="M420 248 L420 260" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="306" y="282" font-size="11" fill="#555">格式化：</text>
  <rect x="360" y="268" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2017-11-01</text>

  <rect x="306" y="300" width="218" height="16" fill="#d6a040" opacity="0.16" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="313" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">→ "2017-11-01" ✓</text>

  <!-- bottom note -->
  <rect x="20" y="332" width="520" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">边界自查：12/31→次年1/1（年溢出）；2/28→2/29(闰)/3/01(平)；2/29(闰)→3/01</text>
  <text x="280" y="363" text-anchor="middle" font-size="10.5" fill="#888">闰年：(y%4==0 且 y%100≠0) 或 y%400==0</text>
</svg>
