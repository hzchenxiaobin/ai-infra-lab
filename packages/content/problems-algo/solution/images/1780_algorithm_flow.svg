<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐位取余，遇 2 即否，否则继续除 3</text>

  <!-- ===== Step 1: input n ===== -->
  <g filter="url(#rough2)">
    <rect x="220" y="44" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18"/>
    <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n</text>
  </g>

  <path d="M 280 84 L 280 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: while loop check ===== -->
  <g filter="url(#rough2)">
    <polygon points="280,110 380,150 280,190 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">n &gt; 0 ?</text>
    <text x="280" y="162" text-anchor="middle" font-size="9" fill="#888">还有位待处理</text>
  </g>

  <!-- No branch → return true -->
  <path d="M 380 150 L 440 150 L 440 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="392" y="216" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="18"/>
    <text x="442" y="239" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
  </g>
  <text x="442" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">所有位均为 0/1</text>

  <!-- Yes branch → compute remainder -->
  <path d="M 280 190 L 280 210" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="204" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ===== Step 3: compute n % 3 ===== -->
  <g filter="url(#rough2)">
    <rect x="200" y="216" width="160" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="237" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取余数 r = n mod 3</text>
    <text x="280" y="254" text-anchor="middle" font-size="9" fill="#888">取出三进制最低位</text>
  </g>

  <path d="M 280 270 L 280 288" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: check remainder == 2 ===== -->
  <g filter="url(#rough2)">
    <polygon points="280,294 380,334 280,374 180,334" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r == 2 ?</text>
    <text x="280" y="346" text-anchor="middle" font-size="9" fill="#888">该幂需用两次？</text>
  </g>

  <!-- Yes branch → return false -->
  <path d="M 380 334 L 440 334 L 440 394" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="326" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="392" y="400" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="18"/>
    <text x="442" y="423" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  </g>
  <text x="442" y="450" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">违反 distinct</text>

  <!-- No branch → n = n / 3, loop back -->
  <path d="M 180 334 L 80 334 L 80 150 L 180 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="130" y="326" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="40" y="226" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="80" y="244" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">n = n / 3</text>
    <text x="80" y="258" text-anchor="middle" font-size="9" fill="#888">去掉最低位</text>
  </g>
  <path d="M 80 246 L 80 150" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- side note -->
  <rect x="40" y="400" width="100" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="90" y="416" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r ∈ {0, 1} 时</text>
  <text x="90" y="430" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">安全，继续循环</text>
</svg>
