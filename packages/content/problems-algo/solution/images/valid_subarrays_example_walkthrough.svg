<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1, 4, 2, 5, 3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">单调递增栈逐步执行，栈中存下标（括号内为对应值）</text>

  <!-- ===== Step 0 ===== -->
  <text x="30" y="68" font-size="10" fill="#446688" font-weight="bold">i=0, nums[0]=1</text>
  <rect x="30" y="74" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="92" font-size="10" fill="#555">栈空 → 不弹。入栈 [0]</text>
  <text x="340" y="92" font-size="10" fill="#446688">栈: [0(1)]</text>

  <!-- ===== Step 1 ===== -->
  <text x="30" y="116" font-size="10" fill="#446688" font-weight="bold">i=1, nums[1]=4</text>
  <rect x="30" y="122" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="10" fill="#555">4 ≥ nums[0]=1 → 不弹。入栈 [1]</text>
  <text x="340" y="140" font-size="10" fill="#446688">栈: [0(1), 1(4)]</text>

  <!-- ===== Step 2 ===== -->
  <text x="30" y="164" font-size="10" fill="#b85450" font-weight="bold">i=2, nums[2]=2</text>
  <rect x="30" y="170" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="188" font-size="10" fill="#555">2 &lt; nums[1]=4 → 弹 [1]，ans += 2−1 = 1</text>
  <text x="40" y="204" font-size="10" fill="#555">2 ≥ nums[0]=1 → 停。入栈 [2]</text>
  <text x="340" y="188" font-size="10" fill="#b85450">弹出 [1] → ans=1</text>
  <text x="340" y="204" font-size="10" fill="#446688">栈: [0(1), 2(2)]</text>

  <!-- ===== Step 3 ===== -->
  <text x="30" y="228" font-size="10" fill="#446688" font-weight="bold">i=3, nums[3]=5</text>
  <rect x="30" y="234" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="252" font-size="10" fill="#555">5 ≥ nums[2]=2 → 不弹。入栈 [3]</text>
  <text x="340" y="252" font-size="10" fill="#446688">栈: [0(1), 2(2), 3(5)]</text>

  <!-- ===== Step 4 ===== -->
  <text x="30" y="276" font-size="10" fill="#b85450" font-weight="bold">i=4, nums[4]=3</text>
  <rect x="30" y="282" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="300" font-size="10" fill="#555">3 &lt; nums[3]=5 → 弹 [3]，ans += 4−3 = 1</text>
  <text x="40" y="316" font-size="10" fill="#555">3 ≥ nums[2]=2 → 停。入栈 [4]</text>
  <text x="340" y="300" font-size="10" fill="#b85450">弹出 [3] → ans=2</text>
  <text x="340" y="316" font-size="10" fill="#446688">栈: [0(1), 2(2), 4(3)]</text>

  <!-- ===== End: settle remaining ===== -->
  <text x="30" y="346" font-size="10" fill="#d6a040" font-weight="bold">遍历结束，结算栈中剩余</text>
  <rect x="30" y="352" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="370" font-size="10" fill="#555">弹 [4]，ans += 5−4 = 1  （右侧无更小）</text>
  <text x="40" y="384" font-size="10" fill="#555">弹 [2]，ans += 5−2 = 3  （右侧无更小）</text>
  <text x="40" y="398" font-size="10" fill="#555">弹 [0]，ans += 5−0 = 5  （右侧无更小）</text>
  <text x="340" y="370" font-size="10" fill="#d6a040">ans = 3</text>
  <text x="340" y="384" font-size="10" fill="#d6a040">ans = 6</text>
  <text x="340" y="398" font-size="10" fill="#d6a040">ans = 11</text>

  <!-- ===== Final ===== -->
  <rect x="30" y="420" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="440" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案 ans = 1 + 1 + 1 + 3 + 5 = 11 ✓</text>
</svg>
