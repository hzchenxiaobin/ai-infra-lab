<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：删除一人后，子问题索引整体偏移 m</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例：n=5, m=3，第一轮删除编号 2，从 3 开始重新数</text>

  <!-- ===== Circle of 5 nodes, center (150,150) r=78 ===== -->
  <!-- node 0: top (150,72) -->
  <circle cx="150" cy="150" r="78" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <circle cx="150" cy="72" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="77" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <!-- node 1: (224,174) 140+78*sin72, 150-78*cos72 -->
  <circle cx="224" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="131" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <!-- node 2: removed (red) (196,213) -->
  <circle cx="196" cy="213" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="196" y="218" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="196" y="245" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">删除</text>

  <!-- node 3: (104,213) start of next round (green ring) -->
  <circle cx="104" cy="213" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- node 4: (76,126) -->
  <circle cx="76" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="131" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <!-- counting arrows: 0->1->2 (the m=3 count) -->
  <path d="M 166 80 Q 210 90 220 110" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 144 Q 215 175 202 196" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="172" font-size="9" fill="#d6a040" font-weight="bold">数 3 个</text>

  <!-- arrow from node 2 removal to node 3 (restart) -->
  <path d="M 176 213 Q 150 213 124 213" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="9" fill="#b85450">下一轮起点</text>

  <!-- ===== Right side: relabeling table ===== -->
  <text x="380" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">删除 2 后重新编号</text>

  <!-- header row -->
  <text x="330" y="104" font-size="10" fill="#888">原始</text>
  <rect x="356" y="92" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="392" y="92" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="428" y="92" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="464" y="92" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- new index row -->
  <text x="330" y="138" font-size="10" fill="#888">新编号</text>
  <rect x="356" y="126" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="392" y="126" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="428" y="126" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="464" y="126" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- shift note -->
  <path d="M 373 152 L 373 168" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="320" y="172" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">原始 = (新编号 + 3) % 5</text>

  <!-- ===== Recurrence formula box ===== -->
  <path d="M 280 268 L 280 288" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="292" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f(n, m) = ( f(n−1, m) + m ) % n</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#888">子问题的答案 x 映射回原问题：(x + m) % n</text>

  <!-- ===== base case ===== -->
  <rect x="180" y="350" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">边界：f(1, m) = 0（只剩 1 人）</text>

  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">从 1 人递推到 n 人，每步 O(1)，无需模拟删除过程</text>
</svg>
