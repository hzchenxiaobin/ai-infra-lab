<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定长窗口 + match 计数 + 提前返回</text>

  <!-- Start -->
  <rect x="220" y="44" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 270 74 L 270 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: m > n ? -->
  <path d="M 270 88 L 350 124 L 270 160 L 190 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11.5" fill="#333">m &gt; n ?</text>
  <text x="270" y="138" text-anchor="middle" font-size="11.5" fill="#333">（s1 比 s2 长）</text>
  <!-- yes -> false -->
  <path d="M 350 124 L 410 124" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="372" y="118" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="110" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="453" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <!-- no -> init -->
  <path d="M 270 160 L 270 172" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="278" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Init -->
  <rect x="170" y="174" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11.5" fill="#333">统计 need[c]、算 target</text>
  <text x="270" y="208" text-anchor="middle" font-size="11.5" fill="#333">win 清零、match = 0</text>
  <path d="M 270 218 L 270 230" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop -->
  <rect x="170" y="232" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="251" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历 i = 0 … n−1</text>
  <path d="M 270 260 L 270 272" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- update in -->
  <rect x="60" y="274" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="291" text-anchor="middle" font-size="11" fill="#333">进入 in=s2[i]</text>
  <text x="160" y="306" text-anchor="middle" font-size="11" fill="#333">win[in]++、更新 match</text>
  <!-- update out -->
  <rect x="280" y="274" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="291" text-anchor="middle" font-size="11" fill="#333">若 i≥m：离开 out=s2[i−m]</text>
  <text x="380" y="306" text-anchor="middle" font-size="11" fill="#333">win[out]−−、更新 match</text>
  <path d="M 270 314 L 270 326" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: hit ? -->
  <path d="M 270 328 L 376 356 L 270 384 L 164 356 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#333">i≥m−1 且</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#333">match == target ?</text>
  <!-- yes -> true (loop back not drawn; early return) -->
  <path d="M 376 356 L 440 356" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="350" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="342" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="14" filter="url(#rough2)"/>
  <text x="483" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
  <!-- no -> loop back -->
  <path d="M 164 356 L 130 356" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="142" y="350" font-size="10.5" fill="#888">否</text>
  <path d="M 130 356 L 130 246 L 170 246" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- end loop -> false -->
  <path d="M 270 384 L 270 384" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
</svg>
