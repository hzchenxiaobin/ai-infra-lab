<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单源 Dijkstra + 在标记点中取最小距离</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">从源点 s 跑 Dijkstra 求所有 dist，再在 marked 中取 min</text>

  <!-- ===== Graph (example 2) ===== -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">示例 2：n=5, s=1（源），marked=[0,4]</text>

  <!-- edges (undirected, double arrow style) -->
  <!-- 1 -- 0 (w=2) -->
  <path d="M 118 196 Q 170 150 248 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 246 168 Q 180 200 122 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- 1 -- 3 (w=1) -->
  <path d="M 116 232 Q 170 300 250 318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 300 Q 180 250 122 234" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 0 -- 2 (w=4) -->
  <path d="M 300 132 Q 380 110 456 196" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 214 Q 390 200 306 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">4</text>

  <!-- 2 -- 3 (w=3) -->
  <path d="M 466 222 Q 420 280 330 322" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 328 338 Q 410 320 470 240" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="300" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">3</text>

  <!-- 3 -- 4 (w=2) -->
  <path d="M 330 340 L 446 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 446 322 L 332 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- nodes -->
  <!-- node 1 (source) -->
  <ellipse cx="92" cy="214" rx="30" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="92" y="212" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="92" y="226" text-anchor="middle" font-size="8" fill="#d6a040">源 s</text>

  <!-- node 0 (marked) -->
  <ellipse cx="272" cy="150" rx="28" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="272" y="155" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="272" y="124" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">marked</text>

  <!-- node 2 -->
  <ellipse cx="476" cy="212" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="476" y="217" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <!-- node 3 -->
  <ellipse cx="306" cy="338" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="306" y="343" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>

  <!-- node 4 (marked) -->
  <ellipse cx="472" cy="338" rx="28" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="472" y="343" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="472" y="372" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">marked</text>

  <!-- dist labels near marked nodes -->
  <text x="272" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dist=2 ← min!</text>
  <text x="472" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dist=3</text>
  <text x="92" y="256" text-anchor="middle" font-size="10" fill="#d6a040">dist=0</text>

  <!-- ===== answer box ===== -->
  <rect x="150" y="380" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = min(dist[m]) = min(2, 3) = 2</text>
</svg>
