<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：queries=["bbb","cc"], words=["a","aa","aaa","aaaa"]</text>

  <!-- ===== Section 1: compute f for words ===== -->
  <text x="36" y="52" font-size="11" fill="#446688" font-weight="bold">第一步：计算 words 中每个词的 f 值</text>

  <!-- column headers -->
  <text x="76" y="74" text-anchor="middle" font-size="10" fill="#888">词 W</text>
  <text x="180" y="74" text-anchor="middle" font-size="10" fill="#888">最小字母</text>
  <text x="300" y="74" text-anchor="middle" font-size="10" fill="#888">频次</text>
  <text x="420" y="74" text-anchor="middle" font-size="10" fill="#888">f(W)</text>

  <!-- Row: a -->
  <g filter="url(#rough2)">
    <rect x="56" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="150" y="84" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="180" y="98" text-anchor="middle" font-size="11" fill="#333">'a'</text>
    <rect x="270" y="84" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="390" y="84" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="420" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- Row: aa -->
  <g filter="url(#rough2)">
    <rect x="56" y="112" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aa</text>
    <rect x="150" y="114" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="180" y="128" text-anchor="middle" font-size="11" fill="#333">'a'</text>
    <rect x="270" y="114" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="128" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="390" y="114" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="420" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- Row: aaa -->
  <g filter="url(#rough2)">
    <rect x="56" y="142" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aaa</text>
    <rect x="150" y="144" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="180" y="158" text-anchor="middle" font-size="11" fill="#333">'a'</text>
    <rect x="270" y="144" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="390" y="144" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="420" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  </g>

  <!-- Row: aaaa -->
  <g filter="url(#rough2)">
    <rect x="56" y="172" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="76" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aaaa</text>
    <rect x="150" y="174" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="180" y="188" text-anchor="middle" font-size="11" fill="#333">'a'</text>
    <rect x="270" y="174" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="188" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="390" y="174" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="420" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- divider -->
  <line x1="36" y1="208" x2="540" y2="208" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: histogram + suffix sum ===== -->
  <text x="36" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">第二步：建直方图 cnt[v]，再累加后缀和 suffix[v]</text>

  <!-- cnt row -->
  <text x="36" y="252" font-size="10" fill="#888">cnt[v]：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="110" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="110" y="276" text-anchor="middle" font-size="9" fill="#888">v=1</text>
    <rect x="140" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="160" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="160" y="276" text-anchor="middle" font-size="9" fill="#888">v=2</text>
    <rect x="190" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="210" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="210" y="276" text-anchor="middle" font-size="9" fill="#888">v=3</text>
    <rect x="240" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="260" y="276" text-anchor="middle" font-size="9" fill="#888">v=4</text>
    <text x="310" y="256" font-size="11" fill="#aaa">… 0 …</text>
    <text x="310" y="276" text-anchor="middle" font-size="9" fill="#aaa">v=5..10</text>
  </g>

  <!-- suffix row -->
  <text x="36" y="304" font-size="10" fill="#888">suffix[v]：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="110" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <text x="110" y="328" text-anchor="middle" font-size="9" fill="#888">v=1</text>
    <rect x="140" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="160" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <text x="160" y="328" text-anchor="middle" font-size="9" fill="#888">v=2</text>
    <rect x="190" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="210" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="210" y="328" text-anchor="middle" font-size="9" fill="#888">v=3</text>
    <rect x="240" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
    <text x="260" y="328" text-anchor="middle" font-size="9" fill="#888">v=4</text>
  </g>

  <!-- divider -->
  <line x1="36" y1="344" x2="540" y2="344" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 3: query results ===== -->
  <text x="36" y="364" font-size="11" fill="#b85450" font-weight="bold">第三步：逐查询查表 answer[i] = suffix[f(query)]</text>

  <!-- Query 1: bbb -->
  <g filter="url(#rough2)">
    <rect x="56" y="374" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="81" y="391" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bbb</text>
    <text x="124" y="391" font-size="11" fill="#666">f=3</text>
    <path d="M 148 386 L 172 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="184" y="391" font-size="11" fill="#666">suffix[3]</text>
    <path d="M 236 386 L 260 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="264" y="376" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="289" y="391" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="332" y="391" font-size="10" fill="#888">f(W)&gt;3 的只有 aaaa</text>
  </g>

  <!-- Query 2: cc -->
  <g filter="url(#rough2)">
    <rect x="56" y="404" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="81" y="421" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cc</text>
    <text x="124" y="421" font-size="11" fill="#666">f=2</text>
    <path d="M 148 416 L 172 416" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="184" y="421" font-size="11" fill="#666">suffix[2]</text>
    <path d="M 236 416 L 260 416" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="264" y="406" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="289" y="421" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="332" y="421" font-size="10" fill="#888">f(W)&gt;2 的有 aaa, aaaa</text>
  </g>

  <!-- final answer -->
  <rect x="180" y="434" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="450" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = [1, 2]</text>
</svg>
