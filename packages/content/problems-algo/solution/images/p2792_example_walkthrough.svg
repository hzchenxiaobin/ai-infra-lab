<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">示例 1：root=[7,6,5,4,3,2,1], k=2 后序归并演算</text>

  <!-- 表格列宽：后序40 节点45 后代110 最小k 90 判定85 返回110 -->
  <!-- 列起点 x：12, 56, 104, 218, 312, 400 -->

  <!-- 表头底色 -->
  <rect x="10" y="40" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="14" y="58" font-size="11" fill="#446688" filter="url(#rough2)">后序</text>
  <text x="58" y="58" font-size="11" fill="#446688" filter="url(#rough2)">节点</text>
  <text x="106" y="58" font-size="11" fill="#446688" filter="url(#rough2)">后代</text>
  <text x="220" y="58" font-size="11" fill="#446688" filter="url(#rough2)">后代最小2个</text>
  <text x="314" y="58" font-size="11" fill="#446688" filter="url(#rough2)">判定(&gt;末位?)</text>
  <text x="402" y="58" font-size="11" fill="#446688" filter="url(#rough2)">返回(含自身)</text>

  <!-- 行底色交替 -->
  <rect x="10" y="66"  width="500" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="10" y="90"  width="500" height="24" fill="#f4f8fc" filter="url(#rough2)"/>
  <rect x="10" y="114" width="500" height="24" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="10" y="138" width="500" height="24" fill="#f4f8fc" filter="url(#rough2)"/>
  <rect x="10" y="162" width="500" height="24" fill="#eaf5ec" filter="url(#rough2)"/>
  <rect x="10" y="186" width="500" height="24" fill="#eaf5ec" filter="url(#rough2)"/>
  <rect x="10" y="210" width="500" height="24" fill="#eaf5ec" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <g font-size="11" fill="#333" >
    <text x="14" y="82"  filter="url(#rough2)">①</text><text x="58" y="82"  filter="url(#rough2)">叶 4</text><text x="106" y="82"  filter="url(#rough2)">{}</text><text x="220" y="82"  filter="url(#rough2)">{}</text><text x="314" y="82"  filter="url(#rough2)">—</text><text x="402" y="82"  filter="url(#rough2)">{4}</text>
    <text x="14" y="106" filter="url(#rough2)">②</text><text x="58" y="106" filter="url(#rough2)">叶 3</text><text x="106" y="106" filter="url(#rough2)">{}</text><text x="220" y="106" filter="url(#rough2)">{}</text><text x="314" y="106" filter="url(#rough2)">—</text><text x="402" y="106" filter="url(#rough2)">{3}</text>
    <text x="14" y="130" filter="url(#rough2)">③</text><text x="58" y="130" filter="url(#rough2)">叶 2</text><text x="106" y="130" filter="url(#rough2)">{}</text><text x="220" y="130" filter="url(#rough2)">{}</text><text x="314" y="130" filter="url(#rough2)">—</text><text x="402" y="130" filter="url(#rough2)">{2}</text>
    <text x="14" y="154" filter="url(#rough2)">④</text><text x="58" y="154" filter="url(#rough2)">叶 1</text><text x="106" y="154" filter="url(#rough2)">{}</text><text x="220" y="154" filter="url(#rough2)">{}</text><text x="314" y="154" filter="url(#rough2)">—</text><text x="402" y="154" filter="url(#rough2)">{1}</text>
    <text x="14" y="178" filter="url(#rough2)">⑤</text><text x="58" y="178" filter="url(#rough2)">6</text><text x="106" y="178" filter="url(#rough2)">{4,3}</text><text x="220" y="178" filter="url(#rough2)">{3,4}</text><text x="314" y="178" fill="#4a7a3a" filter="url(#rough2)">6&gt;4 ✓</text><text x="402" y="178" filter="url(#rough2)">{3,4}</text>
    <text x="14" y="202" filter="url(#rough2)">⑥</text><text x="58" y="202" filter="url(#rough2)">5</text><text x="106" y="202" filter="url(#rough2)">{2,1}</text><text x="220" y="202" filter="url(#rough2)">{1,2}</text><text x="314" y="202" fill="#4a7a3a" filter="url(#rough2)">5&gt;2 ✓</text><text x="402" y="202" filter="url(#rough2)">{1,2}</text>
    <text x="14" y="226" filter="url(#rough2)">⑦</text><text x="58" y="226" filter="url(#rough2)">7</text><text x="106" y="226" filter="url(#rough2)">{6,5,4,3,2,1}</text><text x="220" y="226" filter="url(#rough2)">{1,2}</text><text x="314" y="226" fill="#4a7a3a" filter="url(#rough2)">7&gt;2 ✓</text><text x="402" y="226" filter="url(#rough2)">{1,2}</text>
  </g>

  <!-- 表格外框 -->
  <rect x="10" y="40" width="500" height="194" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 列分隔 -->
  <line x1="54"  y1="40" x2="54"  y2="234" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="102" y1="40" x2="102" y2="234" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="216" y1="40" x2="216" y2="234" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="40" x2="310" y2="234" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="398" y1="40" x2="398" y2="234" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 合计 -->
  <rect x="60" y="252" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">叶子无后代（k≥1）→ 均不够大</text>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">合计足够大 = 3（节点 7, 6, 5）✓</text>
</svg>
