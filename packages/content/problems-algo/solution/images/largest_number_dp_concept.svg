<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两阶段策略：DP 求最长位数 + 贪心拼最大数字</text>

  <!-- Left: Phase 1 DP -->
  <rect x="20" y="44" width="250" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">阶段一：完全背包 DP</text>
  <text x="145" y="84" text-anchor="middle" font-size="10" fill="#666">dp[t] = 凑成本恰好 t 的最大位数</text>

  <rect x="40" y="96" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="119" text-anchor="middle" font-size="11" fill="#333">dp[t] = max(dp[t−c] + 1), c = cost[i]</text>

  <text x="55" y="154" font-size="10" fill="#888">t</text>
  <text x="95" y="154" font-size="10" fill="#888">0</text>
  <text x="125" y="154" font-size="10" fill="#888">2</text>
  <text x="155" y="154" font-size="10" fill="#888">4</text>
  <text x="185" y="154" font-size="10" fill="#888">6</text>
  <text x="225" y="154" font-size="10" fill="#888">9</text>
  <text x="55" y="174" font-size="10" fill="#888">dp</text>
  <text x="95" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="125" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="155" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="185" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="225" y="174" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <text x="145" y="204" text-anchor="middle" font-size="11" fill="#444">L = dp[target] = 最长位数</text>
  <text x="145" y="222" text-anchor="middle" font-size="10" fill="#888">dp[target] &lt; 0 → 无解返回 "0"</text>
  <text x="145" y="240" text-anchor="middle" font-size="10" fill="#888">（完全背包正序：数位可重复用）</text>

  <!-- arrow between phases -->
  <path d="M 272 149 L 288 149" stroke="#446688" stroke-width="2.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- Right: Phase 2 Greedy -->
  <rect x="290" y="44" width="250" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">阶段二：贪心构造</text>
  <text x="415" y="84" text-anchor="middle" font-size="10" fill="#666">从左到右每位，试数位 9 → 1</text>

  <rect x="310" y="96" width="210" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="10" fill="#333">数位 d，成本 c = cost[d−1]</text>
  <text x="415" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[remain−c] == dp[remain]−1 ?</text>

  <text x="310" y="166" font-size="10" fill="#666">remain=9 → d=</text>
  <text x="395" y="166" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <text x="410" y="166" font-size="9" fill="#888">(c=2, remain→7)</text>
  <text x="310" y="186" font-size="10" fill="#666">remain=7 → d=</text>
  <text x="395" y="186" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <text x="410" y="186" font-size="9" fill="#888">(c=2, remain→5)</text>
  <text x="310" y="206" font-size="10" fill="#666">remain=5 → d=</text>
  <text x="395" y="206" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <text x="410" y="206" font-size="9" fill="#888">(c=2, remain→3)</text>
  <text x="310" y="226" font-size="10" fill="#666">remain=3 → d=</text>
  <text x="395" y="226" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="410" y="226" font-size="9" fill="#888">(c=3, remain→0)</text>
  <text x="350" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ "7772"</text>

  <!-- Bottom insight -->
  <rect x="30" y="270" width="500" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键洞察：无 0 数位 → 位数越多数越大；同位数 → 字典序 = 数值序</text>
  <text x="280" y="302" text-anchor="middle" font-size="10" fill="#888">先 DP 最大化位数，再贪心 9→1 最大化字典序，两阶段各自独立最优</text>
</svg>
