<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">凸多边形判定流程（一趟扫描，累计正负号）</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="96" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">输入 points（n 个顶点）</text>

  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="98" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11.5" fill="#333">hasPos = hasNeg = false</text>

  <path d="M 280 134 L 280 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="170" y="154" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#333">for i = 0 … n−1（j,k 取模）</text>

  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute cross -->
  <rect x="120" y="208" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11.5" fill="#333">cross = x₁·y₂ − y₁·x₂</text>
  <text x="280" y="242" text-anchor="middle" font-size="10.5" fill="#888">v₁=p[j]−p[i]，v₂=p[k]−p[j]</text>

  <path d="M 280 248 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: sign of cross -->
  <polygon points="280,266 410,312 280,358 150,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11.5" fill="#333">cross 的符号？</text>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#888">&gt;0 / &lt;0 / ==0</text>

  <!-- >0 branch -->
  <path d="M 150 312 L 96 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="304" text-anchor="middle" font-size="10.5" fill="#82b366">&gt;0</text>
  <rect x="20" y="298" width="74" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="57" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a">hasPos=T</text>

  <!-- <0 branch -->
  <path d="M 410 312 L 464 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="304" text-anchor="middle" font-size="10.5" fill="#b85450">&lt;0</text>
  <rect x="466" y="298" width="74" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="503" y="318" text-anchor="middle" font-size="11" fill="#b85450">hasNeg=T</text>

  <!-- ==0 branch down -->
  <path d="M 280 358 L 280 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="372" font-size="10.5" fill="#999">==0 跳过</text>

  <!-- check conflict -->
  <rect x="170" y="378" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#333">hasPos 且 hasNeg ?</text>

  <!-- yes -> false -->
  <path d="M 390 395 L 440 395" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="415" y="388" text-anchor="middle" font-size="10.5" fill="#b85450">是</text>
  <ellipse cx="492" cy="395" rx="50" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="399" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- no -> loop back -->
  <path d="M 170 395 L 130 395 L 130 171 L 168 171" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="300" text-anchor="middle" font-size="10.5" fill="#82b366">否，下一轮 i</text>

  <!-- after loop -> true -->
  <path d="M 280 412 L 280 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="428" font-size="10.5" fill="#888">循环结束</text>
  <ellipse cx="280" cy="452" rx="56" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>
</svg>
