<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：剥离逃逸车 → 数中间段移动车</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">两次线性扫描 + 一次计数，整体 O(n)</text>

  <!-- Start -->
  <ellipse cx="180" cy="74" rx="58" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 directions</text>

  <path d="M 180 92 L 180 108" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: find l -->
  <rect x="70" y="110" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 找左边界 l</text>
  <text x="180" y="146" text-anchor="middle" font-size="10" fill="#555">从左扫描，跳过所有 'L'</text>

  <path d="M 180 158 L 180 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: find r -->
  <rect x="70" y="176" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 找右边界 r</text>
  <text x="180" y="212" text-anchor="middle" font-size="10" fill="#555">从右扫描，跳过所有 'R'</text>

  <path d="M 180 224 L 180 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="180,242 250,282 180,322 110,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">l &gt; r ?</text>
  <text x="180" y="296" text-anchor="middle" font-size="9.5" fill="#888">(整串皆逃逸)</text>

  <!-- Yes branch -->
  <path d="M 250 282 L 326 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="288" y="276" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="330" y="264" width="120" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="390" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 0</text>

  <!-- No branch -->
  <path d="M 180 322 L 180 340" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="196" y="336" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 3: count -->
  <rect x="60" y="342" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="362" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 数中间段非 'S' 字符</text>
  <text x="180" y="378" text-anchor="middle" font-size="10" fill="#555">directions[l..r] 中 'L' 与 'R' 的个数</text>

  <path d="M 300 366 L 330 366" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return ans -->
  <rect x="330" y="348" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="372" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>

  <!-- footer note -->
  <text x="60" y="408" font-size="10" fill="#888">注：l 为首个非 'L' 下标，r 为末个非 'R' 下标；l &gt; r 表示无中间段</text>
</svg>
