<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbb"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 3：从炸弹 0 出发连锁引爆全部 5 个</text>

  <!-- ====== Top: 5 nodes with coords/radii ====== -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">炸弹分布（坐标与半径）</text>

  <!-- node 0 -->
  <circle cx="70" cy="90" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">0</text>
  <text x="70" y="124" text-anchor="middle" font-size="9" fill="#888">(1,2) r=3</text>

  <!-- node 1 -->
  <circle cx="175" cy="70" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="74" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <text x="175" y="104" text-anchor="middle" font-size="9" fill="#888">(2,3) r=1</text>

  <!-- node 2 -->
  <circle cx="280" cy="90" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="280" y="124" text-anchor="middle" font-size="9" fill="#888">(3,4) r=2</text>

  <!-- node 3 -->
  <circle cx="385" cy="90" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="94" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">3</text>
  <text x="385" y="124" text-anchor="middle" font-size="9" fill="#888">(4,5) r=3</text>

  <!-- node 4 -->
  <circle cx="490" cy="90" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="94" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="490" y="124" text-anchor="middle" font-size="9" fill="#888">(5,6) r=4</text>

  <!-- directed edges (valid, red) -->
  <path d="M 88 84 Q 130 60 157 70" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="120" y="56" text-anchor="middle" font-size="9" fill="#b85450">2≤9 ✓</text>

  <path d="M 88 96 Q 175 110 262 96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="175" y="118" text-anchor="middle" font-size="9" fill="#b85450">8≤9 ✓</text>

  <path d="M 298 96 Q 340 110 367 96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="335" y="118" text-anchor="middle" font-size="9" fill="#b85450">2≤4 ✓</text>

  <path d="M 403 96 Q 445 110 472 96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="440" y="118" text-anchor="middle" font-size="9" fill="#b85450">2≤9 ✓</text>

  <!-- back edge 3->2 (gray dashed) -->
  <path d="M 378 74 Q 330 50 286 74" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="46" text-anchor="middle" font-size="9" fill="#999">2≤9 ✓ (反向也通)</text>

  <!-- failed edge 1->2 (gray with X) -->
  <path d="M 193 78 L 262 84" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="227" y="76" text-anchor="middle" font-size="9" fill="#999">2&gt;1 ✗</text>

  <!-- divider -->
  <path d="M 40 145 L 520 145" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Middle: BFS layers ====== -->
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">从炸弹 0 出发的 BFS 扩散过程</text>

  <!-- Layer 0 -->
  <rect x="40" y="188" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="75" y="206" text-anchor="middle" font-size="10" fill="#888">层 0</text>
  <text x="75" y="222" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">{0}</text>

  <!-- arrow -->
  <path d="M 115 208 L 145 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Layer 1 -->
  <rect x="150" y="188" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="206" text-anchor="middle" font-size="10" fill="#888">层 1 (0 引爆)</text>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">{1, 2}</text>

  <!-- arrow -->
  <path d="M 275 208 L 305 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Layer 2 -->
  <rect x="310" y="188" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="206" text-anchor="middle" font-size="10" fill="#888">层 2 (2 引爆)</text>
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">{3}</text>

  <!-- arrow -->
  <path d="M 415 208 L 445 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Layer 3 -->
  <rect x="450" y="188" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="495" y="206" text-anchor="middle" font-size="10" fill="#888">层 3 (3 引爆)</text>
  <text x="495" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">{4}</text>

  <!-- ====== Bottom: counting ====== -->
  <path d="M 40 250 L 520 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">可达节点累计</text>

  <!-- count bars -->
  <!-- layer 0: count 1 -->
  <rect x="55" y="294" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="313" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <text x="70" y="340" text-anchor="middle" font-size="9" fill="#888">cnt=1</text>

  <path d="M 90 309 L 110 309" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- layer 1: count 3 -->
  <rect x="115" y="294" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="313" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">+2=3</text>
  <text x="145" y="340" text-anchor="middle" font-size="9" fill="#888">cnt=3</text>

  <path d="M 180 309 L 200 309" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- layer 2: count 4 -->
  <rect x="205" y="294" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="313" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">+1=4</text>
  <text x="235" y="340" text-anchor="middle" font-size="9" fill="#888">cnt=4</text>

  <path d="M 270 309 L 290 309" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- layer 3: count 5 -->
  <rect x="295" y="294" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="313" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+1=5</text>
  <text x="325" y="340" text-anchor="middle" font-size="9" fill="#888">cnt=5</text>

  <!-- final answer box -->
  <rect x="380" y="288" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="310" text-anchor="middle" font-size="11" fill="#888">最终答案</text>
  <text x="455" y="330" text-anchor="middle" font-size="16" fill="#a87020" font-weight="bold">ans = 5 ✅</text>

  <!-- ====== Key takeaway ====== -->
  <rect x="40" y="370" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">关键观察</text>
  <text x="60" y="414" font-size="11" fill="#555">• 炸弹 1 半径仅 1，到 2 距离 √2 &gt; 1，无法引爆 2 → 但 1 仍被 0 引爆后「搭车」传播</text>
  <text x="60" y="432" font-size="11" fill="#555">• 炸弹 2 是关键中继：0→2→3→4 串联起后半段；选起点 0 命中最大连通链</text>
</svg>
