<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">单块损失曲线：中间是“山峰”，最小值在两端</text>

  <!-- axes -->
  <path d="M 70 320 L 540 320" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 320 L 70 70" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="334" font-size="11" fill="#999" filter="url(#rough2)">排序下标</text>
  <text x="56" y="68" font-size="11" fill="#999" filter="url(#rough2)">loss</text>

  <!-- baseline (loss=0) -->
  <path d="M 70 230 L 540 230" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="48" y="234" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <!-- peak ~ k -->
  <path d="M 70 130 L 540 130" stroke="#fce4ec" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="40" y="134" font-size="10" fill="#b85450" filter="url(#rough2)">≈k</text>

  <!-- mountain curve: ascending (left part) then descending (right part), peak at boundary ~x=300 -->
  <path d="M 90 250 Q 150 200 210 150 Q 270 120 300 118 Q 330 120 390 160 Q 450 220 520 300" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- boundary marker -->
  <path d="M 300 320 L 300 110" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">分界 k</text>

  <!-- left valley (small loss) -->
  <circle cx="90" cy="250" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="98" y="246" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">小 p → 小 loss</text>
  <!-- right valley (negative loss) -->
  <circle cx="520" cy="300" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="448" y="318" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">大 p → 2k−p 很小（甚至负）</text>

  <!-- pick from both ends: brackets -->
  <path d="M 90 268 L 90 280 L 175 280 L 175 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="132" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取这端</text>
  <path d="M 520 318 L 520 330 L 435 330 L 435 318" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="478" y="344" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">取这端</text>

  <!-- explanation box -->
  <rect x="90" y="356" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">m 块最小损失 = 左端前缀 + 右端后缀</text>
</svg>
