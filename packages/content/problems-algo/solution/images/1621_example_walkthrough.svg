<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, k=2 的双射对照（e 链 → y 链）</text>

  <!-- Substitution formula banner -->
  <rect x="30" y="40" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">代换 y_i = e_i − ⌊i/2⌋，即 y = (e₁, e₂−1, e₃−1, e₄−2)，化为 y₁≤y₂≤y₃≤y₄，取值 {0,1}</text>

  <!-- Header row -->
  <g filter="url(#rough2)">
    <line x1="30" y1="86" x2="530" y2="86" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="50" y="82" filter="url(#rough2)">方案</text>
    <text x="110" y="82" filter="url(#rough2)">线段</text>
    <text x="230" y="82" filter="url(#rough2)">端点链 (e₁,e₂,e₃,e₄)</text>
    <text x="390" y="82" filter="url(#rough2)">代换 (y₁,y₂,y₃,y₄)</text>
  </g>

  <!-- Row 1 -->
  <text x="50" y="112" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="110" y="112" font-size="10" fill="#333" filter="url(#rough2)">[0,1]+[1,2]</text>
  <text x="230" y="112" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 1, 1, 2)</text>
  <path d="M 330 108 L 358 108" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="112" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 0, 0, 0)</text>

  <!-- Row 2 -->
  <text x="50" y="142" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="110" y="142" font-size="10" fill="#333" filter="url(#rough2)">[0,1]+[1,3]</text>
  <text x="230" y="142" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 1, 1, 3)</text>
  <path d="M 330 138 L 358 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="142" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 0, 0, 1)</text>

  <!-- Row 3 -->
  <text x="50" y="172" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="110" y="172" font-size="10" fill="#333" filter="url(#rough2)">[0,1]+[2,3]</text>
  <text x="230" y="172" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 1, 2, 3)</text>
  <path d="M 330 168 L 358 168" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="172" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 0, 1, 1)</text>

  <!-- Row 4 -->
  <text x="50" y="202" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="110" y="202" font-size="10" fill="#333" filter="url(#rough2)">[0,2]+[2,3]</text>
  <text x="230" y="202" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 2, 2, 3)</text>
  <path d="M 330 198 L 358 198" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="202" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 1, 1, 1)</text>

  <!-- Row 5 -->
  <text x="50" y="232" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">⑤</text>
  <text x="110" y="232" font-size="10" fill="#333" filter="url(#rough2)">[1,2]+[2,3]</text>
  <text x="230" y="232" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1, 2, 2, 3)</text>
  <path d="M 330 228 L 358 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="232" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1, 1, 1, 1)</text>

  <g filter="url(#rough2)">
    <line x1="30" y1="248" x2="530" y2="248" stroke="#bbb" stroke-width="1"/>
  </g>

  <!-- Observation: y-chain = all weak-increasing sequences -->
  <rect x="30" y="262" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="280" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">观察</text>
  <text x="48" y="296" font-size="11" fill="#555" filter="url(#rough2)">右侧 y 链恰为 {0,1} 中长度 4 的全部非严格递增序列：0000, 0001, 0011, 0111, 1111</text>

  <!-- Final count -->
  <rect x="30" y="318" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="338" font-size="11" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">隔板法计数</text>
  <text x="48" y="356" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">从 n−k = 2 个值中可重复选 2k = 4 个 = C((n−k)+2k−1, 2k) = C(5, 4) = 5 ✓</text>

  <!-- Bijection arrow -->
  <path d="M 280 384 L 280 404" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="408" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">代换是双射：5 个 e 链 ↔ 5 个 y 链</text>
  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#a55" filter="url(#rough2)">不重不漏，故方案数 = C(n+k−1, 2k)</text>
</svg>
