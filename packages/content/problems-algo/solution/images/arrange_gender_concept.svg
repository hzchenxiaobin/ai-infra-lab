<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：把性别映射成数字排序键 → 自定义顺序排列</text>

  <!-- Top: desired order female -> other -> male -->
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">期望输出顺序</text>
  <rect x="60" y="56" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">female (1)</text>
  <rect x="210" y="56" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">other (2)</text>
  <rect x="340" y="56" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">male (3)</text>
  <path d="M 182 73 L 206 73" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 73 L 336 73" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Middle: comparison table -->
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">三种排序方式的对照</text>
  <rect x="40" y="124" width="440" height="116" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">gender</text>
  <text x="250" y="142" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">字典序(a-z)</text>
  <text x="360" y="142" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">ENUM 索引</text>
  <text x="455" y="142" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">期望</text>
  <line x1="40" y1="148" x2="480" y2="148" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="120" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">female</text>
  <text x="250" y="164" text-anchor="middle" font-size="11" fill="#333">1 (f)</text>
  <text x="360" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="455" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">other</text>
  <text x="250" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 (o)</text>
  <text x="360" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="455" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">male</text>
  <text x="250" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 (m)</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="455" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <text x="250" y="226" text-anchor="middle" font-size="9" fill="#b85450">✗ female,male,other</text>
  <text x="360" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 巧合命中</text>
  <text x="455" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a">female,other,male</text>

  <!-- Bottom: three methods to build sort key -->
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">构造排序键的三种方法</text>
  <rect x="30" y="264" width="150" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="282" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① FIELD() 最显式</text>
  <text x="105" y="300" text-anchor="middle" font-size="8" fill="#444">FIELD(gender,</text>
  <text x="105" y="312" text-anchor="middle" font-size="8" fill="#444">'female','other','male')</text>
  <text x="105" y="332" text-anchor="middle" font-size="8" fill="#888">返回值在列表中的位置</text>

  <rect x="195" y="264" width="150" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② CASE WHEN 通用</text>
  <text x="270" y="300" text-anchor="middle" font-size="8" fill="#444">CASE gender</text>
  <text x="270" y="312" text-anchor="middle" font-size="8" fill="#444">WHEN 'female' THEN 1 ...</text>
  <text x="270" y="332" text-anchor="middle" font-size="8" fill="#888">SQL 标准，跨库可用</text>

  <rect x="360" y="264" width="130" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ ENUM 索引捷径</text>
  <text x="425" y="300" text-anchor="middle" font-size="8" fill="#444">ORDER BY gender</text>
  <text x="425" y="312" text-anchor="middle" font-size="8" fill="#444">靠定义序巧合</text>
  <text x="425" y="332" text-anchor="middle" font-size="8" fill="#b85450">⚠ 脆弱，勿依赖</text>
</svg>
