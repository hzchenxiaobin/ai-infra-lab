<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：余数即数码，求和免字符串</text>

  <!-- ===== 暴力路径（淡化） ===== -->
  <text x="40" y="60" font-size="11.5" fill="#aaa" font-weight="bold">暴力：先转字符串再求和（多走一步）</text>

  <rect x="40" y="66" width="60" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="85" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">34</text>

  <path d="M 100 80 L 150 80" stroke="#bbb" stroke-width="1.3" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="125" y="74" text-anchor="middle" font-size="9" fill="#aaa">除6取余</text>

  <rect x="150" y="66" width="90" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="85" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">"54"</text>

  <path d="M 240 80 L 290 80" stroke="#bbb" stroke-width="1.3" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="265" y="74" text-anchor="middle" font-size="9" fill="#aaa">逐字符</text>

  <rect x="290" y="66" width="60" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">9</text>

  <text x="372" y="84" font-size="10" fill="#aaa">需建串+反转+求和</text>

  <!-- 虚线划掉暴力路径，表示可省 -->
  <path d="M 36 62 L 360 96" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6,4" filter="url(#rough2)" opacity="0.7"/>
  <text x="440" y="74" font-size="10.5" fill="#b85450" font-weight="bold">多此一举！</text>

  <!-- ===== 核心路径（高亮） ===== -->
  <text x="40" y="120" font-size="11.5" fill="#4a7a3a" font-weight="bold">核心：取余即求和，跳过字符串</text>

  <rect x="40" y="126" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">34</text>

  <path d="M 100 140 L 170 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="134" text-anchor="middle" font-size="9.5" fill="#4a7a3a">除6取余累加</text>

  <rect x="170" y="126" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="145" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">sum += n % 6</text>

  <path d="M 290 140 L 350 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="9.5" fill="#4a7a3a">直出</text>

  <rect x="350" y="126" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">9</text>

  <text x="430" y="144" font-size="10.5" fill="#4a7a3a">无需任何字符串</text>

  <!-- ===== 详细分解：n=34, k=6 ===== -->
  <text x="40" y="184" font-size="12" fill="#446688" font-weight="bold">分解过程：n = 34, k = 6</text>

  <!-- n boxes row -->
  <rect x="60" y="194" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="213" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">34</text>
  <rect x="220" y="194" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="213" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">5</text>
  <rect x="380" y="194" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="213" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">0</text>

  <!-- /6 arrows between n boxes -->
  <path d="M 120 208 L 220 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="202" text-anchor="middle" font-size="9.5" fill="#888">n /= 6</text>
  <path d="M 280 208 L 380 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="202" text-anchor="middle" font-size="9.5" fill="#888">n /= 6</text>

  <!-- %6 remainder boxes (orange) -->
  <rect x="60" y="232" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="251" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <rect x="220" y="232" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="251" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <text x="90" y="230" text-anchor="middle" font-size="9" fill="#d6a040">n%6</text>
  <text x="250" y="230" text-anchor="middle" font-size="9" fill="#d6a040">n%6</text>

  <!-- sum accumulator arrows -->
  <path d="M 90 260 L 90 274" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 260 L 250 274" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sum boxes -->
  <rect x="60" y="278" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">sum=4</text>
  <path d="M 120 290 L 220 290" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a">+5</text>
  <rect x="220" y="278" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="294" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">sum=9</text>

  <!-- result box -->
  <path d="M 250 302 L 250 314" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="316" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="250" y="334" text-anchor="middle" font-size="11" fill="#555">sum = 4 + 5 = 9 ✓ （34₆ = "54"）</text>

  <!-- ===== 底部 insight boxes ===== -->
  <rect x="40" y="358" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">余数 = 数码</text>
  <text x="165" y="394" text-anchor="middle" font-size="10" fill="#555">n % k ∈ [0, k) 恰是 base-k 的一位</text>
  <text x="165" y="406" text-anchor="middle" font-size="10" fill="#555">与 504 七进制同源</text>

  <rect x="310" y="358" width="250" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">求和免字符串</text>
  <text x="435" y="394" text-anchor="middle" font-size="10" fill="#555">sum += n % k 每轮累加</text>
  <text x="435" y="406" text-anchor="middle" font-size="10" fill="#555">跳过建串 / 反转 / 逐字符求和</text>
</svg>
