<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">乘客记录：15 字符定长串的 4 段布局</text>

  <!-- Field brackets (above cells) -->
  <!-- phone bracket [0,10) -->
  <rect x="70" y="68" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">手机号 [0, 10)</text>

  <!-- gender bracket [10] -->
  <rect x="350" y="68" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="85" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">性别</text>

  <!-- age bracket [11,13) — HIGHLIGHT, taller & bolder -->
  <rect x="378" y="60" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="406" y="85" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">年龄 [11,13)</text>

  <!-- seat bracket [13,15) -->
  <rect x="434" y="68" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="85" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">座位 [13,15)</text>

  <!-- 15 char cells: "7868190130M7522" -->
  <!-- phone cells (blue) i=0..9 -->
  <rect x="70" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="98" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="126" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="154" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="182" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="238" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="266" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="294" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="322" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- gender cell (green) i=10 -->
  <rect x="350" y="112" width="28" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">M</text>

  <!-- age cells (orange highlight) i=11,12 -->
  <rect x="378" y="112" width="28" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="138" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <rect x="406" y="112" width="28" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="138" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">5</text>

  <!-- seat cells (blue) i=13,14 -->
  <rect x="434" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="462" y="112" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Index axis labels (below cells) -->
  <text x="84" y="170" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="336" y="170" text-anchor="middle" font-size="9" fill="#999">9</text>
  <text x="364" y="170" text-anchor="middle" font-size="9" fill="#999">10</text>
  <text x="392" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">11</text>
  <text x="420" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">12</text>
  <text x="448" y="170" text-anchor="middle" font-size="9" fill="#999">13</text>
  <text x="476" y="170" text-anchor="middle" font-size="9" fill="#999">14</text>

  <!-- Highlight callout pointing at age cells -->
  <path d="M 406 200 Q 406 180 406 156" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="200" width="212" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="406" y="219" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">只看这两位 = 年龄</text>
  <text x="406" y="237" text-anchor="middle" font-size="10" fill="#a07a30">定位置 + 数字字符 → 字符序 = 数值序</text>

  <!-- Field width summary -->
  <rect x="40" y="268" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">定长 15 → 字段位置固定 → 解析 O(1)，无需扫描分隔符</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#666">手机号[0,10) · 性别[10,11) · 年龄[11,13) · 座位[13,15)</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#888">把"字符串解析"退化成"数组按下标取值"，是最省形态</text>
</svg>
