<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <!-- ① 初始化 -->
  <rect x="95" y="22" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 初始化：建链表 prv / nxt</text>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相邻对 (sum, 左端点) 入堆，统计 bad</text>

  <line x1="260" y1="66" x2="260" y2="79" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② bad==0? -->
  <polygon points="260,80 330,110 260,140 190,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② bad == 0 ?</text>

  <line x1="330" y1="110" x2="371" y2="110" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="374" y="90" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">输出 ops</text>
  <text x="439" y="123" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（合并次数）</text>

  <line x1="260" y1="140" x2="260" y2="158" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="154" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ③ 弹出堆顶 -->
  <rect x="170" y="160" width="180" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 弹出堆顶 (s, i)</text>

  <line x1="260" y1="190" x2="260" y2="203" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 校验菱形 -->
  <polygon points="260,204 415,247 260,290 105,247" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">校验：alive[i] ∧ nxt[i]≠−1</text>
  <text x="260" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∧ val[i]+val[nxt[i]] == s ?</text>

  <path d="M 415 247 L 474 247 L 474 175 L 356 175" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="472" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="472" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">丢弃过期</text>

  <line x1="260" y1="290" x2="260" y2="305" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="302" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ④⑤⑥ 合并 -->
  <rect x="95" y="307" width="330" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 合并 (i,j)：ops++，val[i] += val[j]，摘除 j</text>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 按四个相邻对 O(1) 增删 bad</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 新邻对 (p,i)、(i,k) 按现和入堆</text>

  <!-- 回到 ② -->
  <path d="M 95 341 L 42 341 L 42 110 L 183 110" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="34" y="228" transform="rotate(-90 34 228)" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">回到 ② 停机判定</text>
</svg>
