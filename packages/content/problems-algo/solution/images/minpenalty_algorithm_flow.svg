<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：cost 从 totalY 起步，每小时 ±1 增量，维护最小与最早</text>

  <!-- 1. init -->
  <rect x="125" y="44" width="290" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#333">cost = totalY（j=0 全关门）；minCost = cost；ans = 0</text>
  <path d="M 270 96 L 270 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop header -->
  <rect x="170" y="112" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 遍历 j = 0 … n−1</text>
  <path d="M 270 146 L 270 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. update -->
  <rect x="110" y="162" width="320" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 按 customers[j] 增量更新</text>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333">'N' → cost += 1（变开门，N 计代价）；'Y' → cost -= 1（变开门，Y 免单）</text>
  <path d="M 270 214 L 270 230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision diamond -->
  <polygon points="270,230 345,256 270,282 195,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ cost &lt; minCost?</text>
  <text x="270" y="266" text-anchor="middle" font-size="9" fill="#888">（严格小于才换）</text>

  <!-- yes branch -->
  <path d="M 195 256 L 168 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="236" width="148" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="94" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 → 更新</text>
  <text x="94" y="268" text-anchor="middle" font-size="9.5" fill="#333">minCost = cost；ans = j+1</text>

  <!-- no branch -->
  <path d="M 345 256 L 372 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="236" width="148" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="254" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否 → 不变</text>
  <text x="446" y="268" text-anchor="middle" font-size="9.5" fill="#333">并列时保留更早的 j</text>

  <path d="M 270 282 L 270 298" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. j++ -->
  <rect x="190" y="298" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑤ j++</text>

  <!-- loop back -->
  <path d="M 350 315 L 500 315 L 500 129 L 372 129" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="120" text-anchor="middle" font-size="9" fill="#888">回到 ②</text>

  <path d="M 270 332 L 270 350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. return -->
  <rect x="150" y="350" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">⑥ 返回 ans</text>
  <text x="270" y="388" text-anchor="middle" font-size="10.5" fill="#333">（最早的最小代价关门时刻）</text>
</svg>
