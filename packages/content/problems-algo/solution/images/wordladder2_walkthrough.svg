<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrP1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrP2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：hit → cog 的 DAG 与两条最短路径</text>

  <!-- Level labels -->
  <text x="60" y="54" text-anchor="middle" font-size="11" fill="#888">层 0</text>
  <text x="170" y="54" text-anchor="middle" font-size="11" fill="#888">层 1</text>
  <text x="290" y="54" text-anchor="middle" font-size="11" fill="#888">层 2</text>
  <text x="420" y="54" text-anchor="middle" font-size="11" fill="#888">层 3</text>
  <text x="550" y="54" text-anchor="middle" font-size="11" fill="#888">层 4</text>

  <line x1="115" y1="62" x2="115" y2="240" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="230" y1="62" x2="230" y2="240" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="355" y1="62" x2="355" y2="240" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="485" y1="62" x2="485" y2="240" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== DAG ===== -->
  <!-- Edges: path1 (green) hit-hot-dot-dog-cog ; path2 (orange) hit-hot-lot-log-cog -->
  <!-- hit->hot (shared, draw once blue) -->
  <path d="M 83 150 L 147 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- hot->dot -->
  <path d="M 193 144 L 267 122" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrP1)" filter="url(#rough2)"/>
  <!-- hot->lot -->
  <path d="M 193 156 L 267 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP2)" filter="url(#rough2)"/>
  <!-- dot->dog -->
  <path d="M 313 122 L 397 122" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrP1)" filter="url(#rough2)"/>
  <!-- lot->log -->
  <path d="M 313 178 L 397 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP2)" filter="url(#rough2)"/>
  <!-- dog->cog -->
  <path d="M 443 128 Q 490 140 527 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrP1)" filter="url(#rough2)"/>
  <!-- log->cog -->
  <path d="M 443 172 Q 490 160 527 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrP2)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <rect x="37" y="137" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hit</text>

  <rect x="147" y="137" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hot</text>

  <rect x="267" y="109" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="126" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dot</text>

  <rect x="267" y="165" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lot</text>

  <rect x="397" y="109" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="126" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dog</text>

  <rect x="397" y="165" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">log</text>

  <rect x="527" y="137" width="46" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cog</text>

  <!-- Pattern labels -->
  <text x="115" y="134" text-anchor="middle" font-size="9" fill="#b85450">h*t</text>
  <text x="230" y="108" text-anchor="middle" font-size="9" fill="#b85450">*ot</text>
  <text x="230" y="200" text-anchor="middle" font-size="9" fill="#b85450">*ot</text>
  <text x="355" y="108" text-anchor="middle" font-size="9" fill="#b85450">do*</text>
  <text x="355" y="200" text-anchor="middle" font-size="9" fill="#b85450">lo*</text>
  <text x="488" y="138" text-anchor="middle" font-size="9" fill="#b85450">*og</text>
  <text x="488" y="172" text-anchor="middle" font-size="9" fill="#b85450">*og</text>

  <!-- Divider -->
  <line x1="30" y1="220" x2="590" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Key moment: layer 3 both dog & log reach cog ===== -->
  <text x="310" y="244" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">关键瞬间：第 3 层 dog 与 log 都经 *og 发现 cog</text>

  <rect x="60" y="262" width="500" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#444">cog 只进 level_visited（未并入全局 visited）</text>
  <text x="310" y="299" text-anchor="middle" font-size="11" fill="#444">→ dog 扩展：cog not in visited ✓ 记 dog→cog</text>
  <text x="310" y="315" text-anchor="middle" font-size="11" fill="#444">→ log 扩展：cog 仍 not in visited ✓ 记 log→cog（两条边都保住）</text>

  <!-- ===== DFS backtracking results ===== -->
  <text x="310" y="346" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">DFS 回溯结果：沿 children 收集到两条最短路径</text>

  <!-- Path 1 -->
  <rect x="40" y="366" width="540" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="390" font-size="11" fill="#4a7a3a" font-weight="bold">路径①</text>
  <text x="310" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hit → hot → dot → dog → cog</text>

  <!-- Path 2 -->
  <rect x="40" y="416" width="540" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="440" font-size="11" fill="#d6a040" font-weight="bold">路径②</text>
  <text x="310" y="440" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hit → hot → lot → log → cog</text>

  <!-- Bottom note -->
  <rect x="60" y="472" width="500" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="492" text-anchor="middle" font-size="11" fill="#444">对比 127：同样输入，127 只返回长度 5</text>
  <text x="310" y="508" text-anchor="middle" font-size="11" fill="#444">126 额外记录 children + 层末标记 → 返回全部最短序列</text>
</svg>
