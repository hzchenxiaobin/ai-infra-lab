<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 决策流程：dfs(node, limit) 返回剪枝后的子树根</text>

  <!-- Entry -->
  <rect x="235" y="40" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node, limit)</text>
  <path d="M 300 68 L 300 76" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: node == null? -->
  <path d="M 300 76 L 370 106 L 300 136 L 230 106 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <!-- Yes -> right -->
  <path d="M 370 106 L 440 106" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="98" font-size="10" fill="#4a7a3a">是</text>
  <rect x="440" y="92" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#333">return null</text>
  <!-- No -> down -->
  <path d="M 300 136 L 300 150" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="148" font-size="10" fill="#b85450">否</text>

  <!-- Diamond 2: 是叶子? -->
  <path d="M 300 150 L 375 180 L 300 210 L 225 180 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="10" fill="#333">是叶子?</text>
  <text x="300" y="192" text-anchor="middle" font-size="9" fill="#888">(L==null &amp;&amp; R==null)</text>
  <!-- Yes -> right -->
  <path d="M 375 180 L 400 180" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="172" font-size="10" fill="#4a7a3a">是</text>
  <!-- No -> down -->
  <path d="M 300 210 L 300 228" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="224" font-size="10" fill="#b85450">否</text>

  <!-- Diamond 3: node.val < limit? (leaf branch) -->
  <path d="M 460 150 L 535 180 L 460 210 L 385 180 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="178" text-anchor="middle" font-size="10" fill="#333">node.val</text>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#333">&lt; limit?</text>
  <!-- Yes -> down-left -->
  <path d="M 460 210 L 460 222 L 415 222 L 415 234" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="222" font-size="10" fill="#b85450">是</text>
  <rect x="365" y="234" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="252" text-anchor="middle" font-size="10" fill="#333">return null（删）</text>
  <!-- No -> down-right -->
  <path d="M 535 180 L 535 222 L 490 222 L 490 234" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="210" font-size="10" fill="#4a7a3a">否</text>
  <rect x="490" y="234" width="95" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="537" y="252" text-anchor="middle" font-size="10" fill="#333">return node</text>

  <!-- Prune box (internal node branch) -->
  <rect x="190" y="228" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="246" text-anchor="middle" font-size="10" fill="#333">left = dfs(left, limit − node.val)</text>
  <text x="300" y="260" text-anchor="middle" font-size="10" fill="#333">right = dfs(right, limit − node.val)</text>
  <path d="M 300 268 L 300 280" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 4: L==null && R==null? -->
  <path d="M 300 280 L 380 312 L 300 344 L 220 312 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="10" fill="#333">L==null</text>
  <text x="300" y="324" text-anchor="middle" font-size="10" fill="#333">&amp;&amp; R==null?</text>
  <!-- Yes -> right -->
  <path d="M 380 312 L 440 312" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="304" font-size="10" fill="#b85450">是</text>
  <rect x="440" y="298" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="316" text-anchor="middle" font-size="10" fill="#333">return null（级联删）</text>
  <!-- No -> down -->
  <path d="M 300 344 L 300 362" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="358" font-size="10" fill="#4a7a3a">否</text>

  <!-- return node (keep) -->
  <rect x="240" y="362" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="11" fill="#333">return node（留）</text>

  <!-- bottom summary -->
  <rect x="40" y="402" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="421" text-anchor="middle" font-size="10" fill="#555">叶子判 val &lt; limit · 内部节点先剪孩子再判是否都空 · 都空则级联删</text>
</svg>
