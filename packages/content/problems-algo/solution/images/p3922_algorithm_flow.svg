<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 开始：一趟扫描 -->
  <rect x="170" y="22" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="14" fill="#2f5d25" filter="url(#rough2)">一趟扫描 s</text>

  <path d="M 260 62 L 260 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 统计三个量 -->
  <rect x="100" y="82" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">c = s 中 1 的个数</text>
  <text x="260" y="121" text-anchor="middle" font-size="11.5" fill="#55688a" filter="url(#rough2)">e0 = [s[0]=1]，e1 = [s[n−1]=1]</text>

  <!-- 分叉箭头 -->
  <path d="M 225 130 L 105 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 130 L 260 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 295 130 L 415 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 候选 A -->
  <rect x="25" y="160" width="150" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">候选 A：至多一个 1</text>
  <text x="100" y="207" text-anchor="middle" font-size="12.5" fill="#22405f" filter="url(#rough2)">A = max(c−1, 0)</text>
  <text x="100" y="228" text-anchor="middle" font-size="10.5" fill="#66788a" filter="url(#rough2)">留一个 1，其余全翻 0</text>

  <!-- 候选 B -->
  <rect x="185" y="160" width="150" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">候选 B：1 0…0 1</text>
  <text x="260" y="207" text-anchor="middle" font-size="12.5" fill="#22405f" filter="url(#rough2)">B = 2+c−2e0−2e1</text>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#66788a" filter="url(#rough2)">首尾钉 1，中间清 0（n≥2）</text>

  <!-- 候选 C -->
  <rect x="345" y="160" width="150" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">候选 C：全 1</text>
  <text x="420" y="207" text-anchor="middle" font-size="12.5" fill="#22405f" filter="url(#rough2)">C = n − c</text>
  <text x="420" y="228" text-anchor="middle" font-size="10.5" fill="#66788a" filter="url(#rough2)">0 全部翻成 1</text>

  <!-- 汇聚箭头 -->
  <path d="M 105 240 L 215 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 240 L 260 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 240 L 305 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取 min -->
  <rect x="160" y="268" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">ans = min(A, B, C)</text>

  <path d="M 260 306 L 260 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#557" filter="url(#rough2)">O(n) 时间 · O(1) 空间</text>
</svg>
