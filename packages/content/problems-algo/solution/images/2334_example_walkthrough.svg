<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,4,3,1], threshold = 6</text>

  <!-- Column header row -->
  <rect x="20" y="38" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="110" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="175" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left[i]</text>
  <text x="240" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right[i]</text>
  <text x="315" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最宽区间</text>
  <text x="385" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">len</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">min×len</text>
  <text x="525" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&gt;6?</text>

  <!-- Row i=0: nums=1, left=-1, right=5(n), [0,4], len=5, 5, ✗ -->
  <rect x="20" y="70" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="110" y="89" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="175" y="89" text-anchor="middle" font-size="11" fill="#888">−1(无)</text>
  <text x="240" y="89" text-anchor="middle" font-size="11" fill="#888">5(n)</text>
  <text x="315" y="89" text-anchor="middle" font-size="11" fill="#333">[0,4]</text>
  <text x="385" y="89" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="450" y="89" text-anchor="middle" font-size="11" fill="#333">1×5 = 5</text>
  <text x="525" y="89" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row i=1: nums=3, left=0, right=4, [1,3], len=3, 9, ✓ (highlight) -->
  <rect x="20" y="102" width="560" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="110" y="121" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="175" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0 (值1)</text>
  <text x="240" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4 (值1)</text>
  <text x="315" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3]</text>
  <text x="385" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="450" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3×3 = 9</text>
  <text x="525" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row i=2: nums=4, left=1, right=3, [2,2], len=1, 4, ✗ -->
  <rect x="20" y="134" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="110" y="153" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="175" y="153" text-anchor="middle" font-size="11" fill="#446688">1 (值3)</text>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#446688">3 (值3)</text>
  <text x="315" y="153" text-anchor="middle" font-size="11" fill="#333">[2,2]</text>
  <text x="385" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="450" y="153" text-anchor="middle" font-size="11" fill="#333">4×1 = 4</text>
  <text x="525" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row i=3: nums=3, left=0, right=4, [1,3], len=3, 9, ✓ (highlight) -->
  <rect x="20" y="166" width="560" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="185" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="175" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0 (值1)</text>
  <text x="240" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4 (值1)</text>
  <text x="315" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3]</text>
  <text x="385" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="450" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3×3 = 9</text>
  <text x="525" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row i=4: nums=1, left=-1, right=5(n), [0,4], len=5, 5, ✗ -->
  <rect x="20" y="198" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="110" y="217" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="175" y="217" text-anchor="middle" font-size="11" fill="#888">−1(无)</text>
  <text x="240" y="217" text-anchor="middle" font-size="11" fill="#888">5(n)</text>
  <text x="315" y="217" text-anchor="middle" font-size="11" fill="#333">[0,4]</text>
  <text x="385" y="217" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="450" y="217" text-anchor="middle" font-size="11" fill="#333">1×5 = 5</text>
  <text x="525" y="217" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- nums strip annotation -->
  <text x="40" y="252" font-size="11" fill="#888">nums =</text>
  <rect x="100" y="240" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="255" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="142" y="240" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="162" y="255" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="184" y="240" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="204" y="255" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="226" y="240" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="246" y="255" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="268" y="240" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="288" y="255" text-anchor="middle" font-size="11" fill="#999">1</text>
  <path d="M 142 274 Q 142 282 148 282 L 256 282 Q 262 282 262 274" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="202" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子数组 [3,4,3]，min=3, 3×3=9 &gt; 6 ✓</text>

  <!-- bottom note -->
  <rect x="20" y="312" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">ans = max{3, 3} = 3 → 返回 3（唯一合法大小）</text>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#666">其余长度均不合法：len=1 需 &gt;6；len=2 需 &gt;3(含3)；len=4 需 &gt;1.5(含1)；len=5 需 &gt;1.2(含1)</text>
</svg>
