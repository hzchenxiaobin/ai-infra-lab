<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 辗转相除 + 原地插入</text>

  <!-- Start -->
  <ellipse cx="200" cy="50" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 200 68 L 200 92" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- curr = head -->
  <rect x="124" y="94" width="152" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">curr = head</text>

  <path d="M 200 128 L 200 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="200,156 290,205 200,254 110,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">curr 与 curr.next</text>
  <text x="200" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">都不为空？</text>

  <!-- No branch (right) -->
  <path d="M 290 205 L 318 205" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="320" y="187" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return head</text>

  <!-- Yes branch (down) -->
  <path d="M 200 254 L 200 278" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="270" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- g = gcd -->
  <rect x="96" y="280" width="208" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">g = gcd(curr.val, curr.next.val)</text>

  <path d="M 200 314 L 200 338" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- insert -->
  <rect x="60" y="340" width="280" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="358" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">node = ListNode(g)</text>
  <text x="200" y="376" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">node.next = curr.next;   curr.next = node</text>

  <path d="M 200 386 L 200 410" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- advance -->
  <rect x="100" y="412" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="434" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">curr = curr.next.next</text>

  <!-- loop back arrow: left side -->
  <path d="M 100 429 L 44 429 L 44 205 L 110 205" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="52" y="320" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环</text>
</svg>
