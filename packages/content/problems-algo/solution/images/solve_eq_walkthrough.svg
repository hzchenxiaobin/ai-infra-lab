<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x+5-3+x = 6+x-2 逐项解析</text>

  <!-- ===== Left side table ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">左式 x+5-3+x</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="64" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="64" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="95" y="82">项</text>
    <text x="195" y="82">x 系数累加</text>
    <text x="285" y="82">常数累加</text>
  </g>

  <!-- rows: x, +5, -3, +x -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <!-- row x -->
    <rect x="40" y="92" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="150" y="92" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="92" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="95" y="110">x → +1</text>
    <text x="195" y="110">1</text>
    <text x="285" y="110">0</text>

    <!-- row +5 -->
    <rect x="40" y="118" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="150" y="118" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="118" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="95" y="136">+5</text>
    <text x="195" y="136">1</text>
    <text x="285" y="136">5</text>

    <!-- row -3 -->
    <rect x="40" y="144" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="150" y="144" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="144" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="95" y="162">-3</text>
    <text x="195" y="162">1</text>
    <text x="285" y="162">2</text>

    <!-- row +x -->
    <rect x="40" y="170" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="150" y="170" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="240" y="170" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="188">+x → +1</text>
    <text x="195" y="188" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="285" y="188" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- left summary -->
  <rect x="40" y="204" width="290" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">左式 = 2x + 2</text>

  <!-- ===== Right side table ===== -->
  <text x="40" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">右式 6+x-2</text>

  <g filter="url(#rough2)">
    <rect x="40" y="266" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="150" y="266" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="240" y="266" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="95" y="284">项</text>
    <text x="195" y="284">x 系数累加</text>
    <text x="285" y="284">常数累加</text>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <!-- 6 -->
    <rect x="40" y="294" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="150" y="294" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="294" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="95" y="312">6</text>
    <text x="195" y="312">0</text>
    <text x="285" y="312">6</text>

    <!-- +x -->
    <rect x="40" y="320" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="150" y="320" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="320" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="95" y="338">+x → +1</text>
    <text x="195" y="338">1</text>
    <text x="285" y="338">6</text>

    <!-- -2 -->
    <rect x="40" y="346" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="150" y="346" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="240" y="346" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="364">-2</text>
    <text x="195" y="364" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="285" y="364" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- right summary -->
  <rect x="40" y="380" width="290" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右式 = 1x + 4</text>

  <!-- ===== Final solve box ===== -->
  <path d="M 185 410 L 185 422 L 380 422" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="370" y="404" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="455" y="424" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a=1, b=−2</text>
  <text x="455" y="440" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">x = −b/a = 2</text>
</svg>
