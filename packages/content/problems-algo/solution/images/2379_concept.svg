<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：长度 k 的定长滑动窗口，统计每窗 W 数，取最小</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">W 需涂成 B，故「最少涂色次数」= 所有长度 k 窗口里 W 的最小计数（blocks="WBBWWBBWBW", k=7）</text>

  <!-- ===== blocks string row ===== -->
  <text x="22" y="86" font-size="10.5" fill="#666">blocks</text>
  <!-- index labels -->
  <text x="68"  y="76" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="108" y="76" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="148" y="76" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="188" y="76" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="228" y="76" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="268" y="76" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="308" y="76" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="348" y="76" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="388" y="76" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="428" y="76" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- boxes: B=dark filled, W=white+red border -->
  <!-- 0 W -->
  <rect x="50"  y="80" width="36" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68"  y="103" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 1 B -->
  <rect x="90"  y="80" width="36" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 2 B -->
  <rect x="130" y="80" width="36" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 3 W -->
  <rect x="170" y="80" width="36" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="103" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 4 W -->
  <rect x="210" y="80" width="36" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="103" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 5 B -->
  <rect x="250" y="80" width="36" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 6 B -->
  <rect x="290" y="80" width="36" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 7 W -->
  <rect x="330" y="80" width="36" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="103" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>
  <!-- 8 B -->
  <rect x="370" y="80" width="36" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  <!-- 9 W -->
  <rect x="410" y="80" width="36" height="34" fill="#fff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="103" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">W</text>

  <!-- current window bracket at i=0 (boxes 0..6) -->
  <path d="M 50 122 Q 50 132 68 134 L 308 134 Q 326 132 326 122" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">当前窗口 i=0：WBBWWBB，含 W × 3</text>

  <!-- sliding arrow -->
  <line x1="470" y1="98" x2="500" y2="98" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="485" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右移</text>

  <!-- ===== 4 candidate windows row ===== -->
  <text x="22" y="192" font-size="10.5" fill="#666">候选</text>

  <!-- window 0: WBBWWBB, W×3 (min) -->
  <rect x="30" y="172" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="85" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">WBBWWBB</text>
  <text x="85" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">W × 3（最小）</text>

  <!-- window 1: BBWWBBW, W×3 (min) -->
  <rect x="150" y="172" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="205" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">BBWWBBW</text>
  <text x="205" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">W × 3（最小）</text>

  <!-- window 2: BWWBBWB, W×3 (min) -->
  <rect x="270" y="172" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="325" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">BWWBBWB</text>
  <text x="325" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">W × 3（最小）</text>

  <!-- window 3: WWBBWBW, W×4 (not min) -->
  <rect x="390" y="172" width="110" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">WWBBWBW</text>
  <text x="445" y="210" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">W × 4</text>

  <!-- converge arrows down to min -->
  <line x1="85"  y1="222" x2="85"  y2="244" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="205" y1="222" x2="205" y2="244" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="325" y1="222" x2="325" y2="244" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="120" y="250" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="277" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">最少涂色次数 = min{3,3,3,4} = 3</text>

  <!-- insight callout -->
  <rect x="30" y="306" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">💡 观察：「最少涂色」即「最少 W 数」，因为只需把窗口内的 W 全涂成 B</text>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#888">相邻窗口只差去头/加尾一个字符，W 计数可 O(1) 滚动更新</text>

  <!-- footer -->
  <rect x="30" y="358" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一趟遍历 O(n)：首窗统计 W 数，之后每窗 O(1) 滚动 + 维护最小值</text>
</svg>
