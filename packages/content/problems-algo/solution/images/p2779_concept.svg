<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2779" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">每个元素可变为 [v−k, v+k] 内的值 → 区间交集非空即可同组</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#888">排序后 A = [1, 2, 4, 6]，k = 2</text>

  <!-- Intersection highlight region [2,3] -->
  <rect x="220" y="60" width="40" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.7" filter="url(#rough2)"/>
  <text x="240" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">交集 [2,3]</text>

  <!-- Bar for value 1: range [-1,3] -->
  <text x="50" y="78" font-size="11" fill="#555" font-weight="bold">A[0]=1</text>
  <rect x="100" y="66" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="end" font-size="9" fill="#888">−1</text>
  <text x="264" y="80" font-size="9" fill="#888">3</text>

  <!-- Bar for value 2: range [0,4] -->
  <text x="50" y="108" font-size="11" fill="#555" font-weight="bold">A[1]=2</text>
  <rect x="140" y="96" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="136" y="110" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="304" y="110" font-size="9" fill="#888">4</text>

  <!-- Bar for value 4: range [2,6] -->
  <text x="50" y="138" font-size="11" fill="#555" font-weight="bold">A[2]=4</text>
  <rect x="220" y="126" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="140" text-anchor="end" font-size="9" fill="#888">2</text>
  <text x="384" y="140" font-size="9" fill="#888">6</text>

  <!-- Bar for value 6: range [4,8] -->
  <text x="50" y="168" font-size="11" fill="#555" font-weight="bold">A[3]=6</text>
  <rect x="300" y="156" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="296" y="170" text-anchor="end" font-size="9" fill="#888">4</text>
  <text x="464" y="170" font-size="9" fill="#888">8</text>

  <!-- Number line -->
  <line x1="60" y1="200" x2="540" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arr2779)" filter="url(#rough2)"/>
  <text x="546" y="204" font-size="10" fill="#888">x</text>
  <!-- ticks -->
  <line x1="100" y1="196" x2="100" y2="204" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="9" fill="#888">−1</text>
  <line x1="140" y1="196" x2="140" y2="204" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="9" fill="#888">0</text>
  <line x1="220" y1="196" x2="220" y2="204" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="260" y1="196" x2="260" y2="204" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="300" y1="196" x2="300" y2="204" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <line x1="380" y1="196" x2="380" y2="204" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="9" fill="#888">6</text>
  <line x1="460" y1="196" x2="460" y2="204" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="218" text-anchor="middle" font-size="9" fill="#888">8</text>

  <!-- Gap marker between 3 and 4 -->
  <text x="280" y="194" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">gap</text>
  <path d="M 264 190 L 296 190" stroke="#b85450" stroke-width="1.2" marker-end="url(#arr2779)" filter="url(#rough2)"/>

  <!-- Explanation box -->
  <rect x="30" y="240" width="500" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心转化：区间交集 ⟺ 首尾差 ≤ 2k</text>
  <text x="50" y="288" font-size="11" fill="#666">① 每个元素 nums[i] 操作后取值范围 = [nums[i]−k, nums[i]+k]</text>
  <text x="50" y="308" font-size="11" fill="#666">② 排序后连续段 A[i..j] 的区间交集 = [A[j]−k, A[i]+k]</text>
  <text x="50" y="328" font-size="11" fill="#666">③ 交集非空 ⟺ A[j]−k ≤ A[i]+k ⟺ A[j]−A[i] ≤ 2k</text>
  <text x="50" y="348" font-size="11" fill="#666">④ 排序保证合法元素连续 → 求最长窗口即可</text>
  <text x="50" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">→ 图中 [1,2,4] 三区间交集 [2,3] 非空 ✓，6 与 1 无交集 ✗</text>

  <!-- Legend -->
  <rect x="380" y="40" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="400" y="49" font-size="10" fill="#555">同组可达</text>
  <rect x="460" y="40" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="49" font-size="10" fill="#555">超出交集</text>
</svg>
