<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">异或分数：相邻异或，层层收拢到塔尖</text>
  <text x="506" y="42" text-anchor="end" font-size="10" fill="#8a3833" filter="url(#rough2)">每轮：a[i] ← a[i] ⊕ a[i+1]，再删掉末位</text>

  <!-- row labels -->
  <text x="20" y="68" font-size="10.5" fill="#666" filter="url(#rough2)">原数组</text>
  <text x="20" y="140" font-size="10.5" fill="#666" filter="url(#rough2)">第1轮</text>
  <text x="20" y="212" font-size="10.5" fill="#666" filter="url(#rough2)">第2轮</text>
  <text x="20" y="284" font-size="10.5" fill="#666" filter="url(#rough2)">第3轮</text>

  <!-- row 0: [8, 4, 32, 16] -->
  <rect x="83" y="48" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="179" y="48" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="275" y="48" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">32</text>
  <rect x="371" y="48" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="404" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">16</text>
  <text x="164" y="69" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>
  <text x="260" y="69" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>
  <text x="356" y="69" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>

  <!-- row 1: [12, 36, 48] -->
  <rect x="131" y="120" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="227" y="120" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">36</text>
  <rect x="323" y="120" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="356" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">48</text>
  <text x="212" y="141" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>
  <text x="308" y="141" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>

  <!-- row 2: [40, 20] -->
  <rect x="179" y="192" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">40</text>
  <rect x="275" y="192" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="212" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="260" y="213" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">⊕</text>

  <!-- row 3: [60] -->
  <rect x="227" y="264" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">60</text>

  <!-- arrows row0 -> row1 -->
  <path d="M 116 82 L 150 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 82 L 176 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 82 L 248 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 82 L 272 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 82 L 344 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 82 L 368 116" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrows row1 -> row2 -->
  <path d="M 164 154 L 200 188" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 154 L 224 188" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 154 L 296 188" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 356 154 L 320 188" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrows row2 -> row3 -->
  <path d="M 212 226 L 248 260" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 226 L 272 260" fill="none" stroke="#a07830" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="72" y="310" width="376" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">塔尖 60 = 子数组 [8, 4, 32, 16] 的异或分数</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">—— 正是示例 1 中查询 [1, 4] 的答案</text>
</svg>
