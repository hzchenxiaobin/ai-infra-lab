<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：boxes=[3,5,5,2], warehouse=[2,1,3,4,5]</text>
  <text x="280" y="38" text-anchor="middle" font-size="11" fill="#888">箱子降序 [5,5,3,2]，left=0, right=4</text>

  <!-- Column headers -->
  <text x="40" y="56" font-size="10" fill="#999">步骤</text>
  <text x="100" y="56" font-size="10" fill="#999">当前箱</text>
  <text x="180" y="56" font-size="10" fill="#999">两端高度</text>
  <text x="320" y="56" font-size="10" fill="#999">决策</text>
  <text x="460" y="56" font-size="10" fill="#999">count</text>

  <!-- Warehouse mini-bar at top right -->
  <text x="430" y="38" font-size="9" fill="#888">wh=[2,1,3,4,5]</text>

  <!-- Separator line -->
  <line x1="20" y1="62" x2="540" y2="62" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 1: box=5 ===== -->
  <rect x="20" y="68" width="520" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="84" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="180" y="92" font-size="10" fill="#446688">wh[0]=2</text>
  <text x="180" y="108" font-size="10" fill="#b85450">wh[4]=5</text>
  <text x="240" y="100" font-size="10" fill="#888">2 &lt; 5 → 选右端</text>
  <text x="320" y="92" font-size="10" fill="#4a7a3a">5 ≤ 5 ✓ 放入</text>
  <text x="320" y="108" font-size="10" fill="#555">room 4, right→3</text>
  <text x="460" y="100" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Mini warehouse viz step 1 -->
  <rect x="372" y="78" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="384" y="90" text-anchor="middle" font-size="7" fill="#446688">2</text>
  <rect x="396" y="82" width="24" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="408" y="90" text-anchor="middle" font-size="7" fill="#446688">1</text>
  <rect x="420" y="74" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="432" y="90" text-anchor="middle" font-size="7" fill="#446688">3</text>
  <rect x="444" y="70" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="456" y="90" text-anchor="middle" font-size="7" fill="#446688">4</text>
  <rect x="468" y="66" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">5✓</text>

  <!-- ===== Step 2: box=5 ===== -->
  <rect x="20" y="128" width="520" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="144" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="180" y="152" font-size="10" fill="#446688">wh[0]=2</text>
  <text x="180" y="168" font-size="10" fill="#b85450">wh[3]=4</text>
  <text x="240" y="160" font-size="10" fill="#888">2 &lt; 4 → 选右端</text>
  <text x="320" y="152" font-size="10" fill="#b85450">5 &gt; 4 ✗ 跳过</text>
  <text x="320" y="168" font-size="10" fill="#555">（左端 2 也不够）</text>
  <text x="460" y="160" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">1</text>

  <!-- Mini warehouse viz step 2 -->
  <rect x="372" y="138" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="384" y="150" text-anchor="middle" font-size="7" fill="#446688">2</text>
  <rect x="396" y="142" width="24" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="408" y="150" text-anchor="middle" font-size="7" fill="#446688">1</text>
  <rect x="420" y="134" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="432" y="150" text-anchor="middle" font-size="7" fill="#446688">3</text>
  <rect x="444" y="130" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="456" y="148" text-anchor="middle" font-size="7" fill="#d6a040">4</text>
  <rect x="468" y="126" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- ===== Step 3: box=3 ===== -->
  <rect x="20" y="188" width="520" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="204" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="180" y="212" font-size="10" fill="#446688">wh[0]=2</text>
  <text x="180" y="228" font-size="10" fill="#b85450">wh[3]=4</text>
  <text x="240" y="220" font-size="10" fill="#888">2 &lt; 4 → 选右端</text>
  <text x="320" y="212" font-size="10" fill="#4a7a3a">3 ≤ 4 ✓ 放入</text>
  <text x="320" y="228" font-size="10" fill="#555">room 3, right→2</text>
  <text x="460" y="220" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Mini warehouse viz step 3 -->
  <rect x="372" y="198" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="384" y="210" text-anchor="middle" font-size="7" fill="#446688">2</text>
  <rect x="396" y="202" width="24" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="408" y="210" text-anchor="middle" font-size="7" fill="#446688">1</text>
  <rect x="420" y="194" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="432" y="210" text-anchor="middle" font-size="7" fill="#446688">3</text>
  <rect x="444" y="190" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="456" y="206" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">3✓</text>
  <rect x="468" y="186" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="204" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- ===== Step 4: box=2 ===== -->
  <rect x="20" y="248" width="520" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="280" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="264" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="180" y="272" font-size="10" fill="#446688">wh[0]=2</text>
  <text x="180" y="288" font-size="10" fill="#b85450">wh[2]=3</text>
  <text x="240" y="280" font-size="10" fill="#888">2 &lt; 3 → 选右端</text>
  <text x="320" y="272" font-size="10" fill="#4a7a3a">2 ≤ 3 ✓ 放入</text>
  <text x="320" y="288" font-size="10" fill="#555">room 2, right→1</text>
  <text x="460" y="280" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Mini warehouse viz step 4 -->
  <rect x="372" y="258" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="384" y="270" text-anchor="middle" font-size="7" fill="#446688">2</text>
  <rect x="396" y="262" width="24" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="408" y="270" text-anchor="middle" font-size="7" fill="#446688">1</text>
  <rect x="420" y="254" width="24" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="432" y="270" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">2✓</text>
  <rect x="444" y="250" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="456" y="266" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="468" y="246" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="480" y="264" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- End separator -->
  <line x1="20" y1="312" x2="540" y2="312" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <rect x="80" y="324" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">结果：放入 3 个箱子（room 2, 3, 4）</text>

  <!-- ===== Placement visualization ===== -->
  <text x="40" y="386" font-size="11" fill="#888">最终仓库状态（room 0, 1 空置；room 2, 3, 4 放入箱子）：</text>

  <!-- room labels -->
  <text x="100" y="404" text-anchor="middle" font-size="9" fill="#999">room 0</text>
  <text x="180" y="404" text-anchor="middle" font-size="9" fill="#999">room 1</text>
  <text x="260" y="404" text-anchor="middle" font-size="9" fill="#999">room 2</text>
  <text x="340" y="404" text-anchor="middle" font-size="9" fill="#999">room 3</text>
  <text x="420" y="404" text-anchor="middle" font-size="9" fill="#999">room 4</text>

  <!-- Empty rooms -->
  <rect x="80" y="410" width="40" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="424" text-anchor="middle" font-size="9" fill="#ccc">空</text>
  <rect x="160" y="410" width="40" height="14" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="424" text-anchor="middle" font-size="9" fill="#ccc">空</text>

  <!-- Filled rooms: room 2 has box 2, room 3 has box 3, room 4 has box 5 -->
  <rect x="240" y="406" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="248" y="410" width="24" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>

  <rect x="320" y="402" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="406" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="340" y="424" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>

  <rect x="400" y="398" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="408" y="402" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="420" y="424" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>

  <!-- Ground line -->
  <line x1="70" y1="432" x2="450" y2="432" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Push direction arrows -->
  <path d="M 56 420 L 70 420" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="414" text-anchor="end" font-size="8" fill="#446688">←左</text>
  <path d="M 464 420 L 450 420" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="414" font-size="8" fill="#b85450">右→</text>

  <!-- Note -->
  <text x="280" y="466" text-anchor="middle" font-size="10" fill="#d6a040">⚠ 第二个高度 5 的箱子无处可放：左端 wh[0]=2 太矮，右端 wh[3]=4 也不够</text>
  <text x="280" y="484" text-anchor="middle" font-size="10" fill="#888">贪心已最优——room 4 是唯一能放高度 5 箱子的位置</text>

  <!-- Result count box -->
  <rect x="200" y="496" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最多放 3 个箱子</text>
</svg>
