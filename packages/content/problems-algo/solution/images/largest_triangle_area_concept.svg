<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：5 个点中的最大三角形</text>

  <!-- Grid lines -->
  <g stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)">
    <line x1="200" y1="55" x2="200" y2="290"/>
    <line x1="280" y1="55" x2="280" y2="290"/>
    <line x1="360" y1="55" x2="360" y2="290"/>
    <line x1="120" y1="210" x2="380" y2="210"/>
    <line x1="120" y1="130" x2="380" y2="130"/>
    <line x1="120" y1="55" x2="380" y2="55"/>
  </g>

  <!-- Axes -->
  <line x1="120" y1="50" x2="120" y2="300" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="110" y1="290" x2="390" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>

  <text x="394" y="294" font-size="13" fill="#446688" filter="url(#rough2)">x</text>
  <text x="114" y="44" font-size="13" fill="#446688" filter="url(#rough2)">y</text>
  <text x="106" y="306" font-size="11" fill="#999" filter="url(#rough2)">O</text>

  <!-- Tick labels -->
  <text x="196" y="306" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="276" y="306" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="356" y="306" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="106" y="214" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="106" y="134" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="106" y="58" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- Largest triangle: A(0,0)->(120,290), D(0,2)->(120,130), E(2,0)->(280,290) -->
  <polygon points="120,290 120,130 280,290" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)" opacity="0.85"/>

  <!-- Points -->
  <circle cx="120" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="92" y="308" font-size="12" fill="#b85450" filter="url(#rough2)">A(0,0)</text>

  <circle cx="120" cy="210" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="82" y="206" font-size="12" fill="#446688" filter="url(#rough2)">B(0,1)</text>

  <circle cx="200" cy="290" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="188" y="308" font-size="12" fill="#446688" filter="url(#rough2)">C(1,0)</text>

  <circle cx="120" cy="130" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="82" y="126" font-size="12" fill="#b85450" filter="url(#rough2)">D(0,2)</text>

  <circle cx="280" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="268" y="308" font-size="12" fill="#b85450" filter="url(#rough2)">E(2,0)</text>

  <!-- Area annotation -->
  <rect x="350" y="120" width="155" height="55" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最大三角形 △ADE</text>
  <text x="427" y="162" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">面积 = 2.0</text>
</svg>
