<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：只追踪路径上的 min / max</text>

  <!-- 树边 -->
  <g stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M285,82 L200,142"/>
    <path d="M315,82 L400,142"/>
    <path d="M185,162 L125,222"/>
    <path d="M215,162 L245,222"/>
    <path d="M415,162 L445,222"/>
    <path d="M235,242 L195,302"/>
    <path d="M255,242 L275,302"/>
    <path d="M430,242 L395,302"/>
  </g>

  <!-- 高亮路径 8 -> 3 -> 1 -->
  <g stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)">
    <path d="M285,82 L200,142"/>
    <path d="M185,162 L125,222"/>
  </g>

  <!-- 普通节点 -->
  <g filter="url(#rough2)">
    <circle cx="400" cy="152" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="400" y="157" text-anchor="middle" font-size="13" fill="#333">10</text>

    <circle cx="250" cy="232" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="237" text-anchor="middle" font-size="13" fill="#333">6</text>

    <circle cx="450" cy="232" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="450" y="237" text-anchor="middle" font-size="13" fill="#333">14</text>

    <circle cx="200" cy="312" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="200" y="317" text-anchor="middle" font-size="13" fill="#333">4</text>

    <circle cx="280" cy="312" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="317" text-anchor="middle" font-size="13" fill="#333">7</text>

    <circle cx="390" cy="312" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="390" y="317" text-anchor="middle" font-size="13" fill="#333">13</text>
  </g>

  <!-- 路径节点（高亮） -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="72" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="300" y="77" text-anchor="middle" font-size="13" fill="#333">8</text>

    <circle cx="190" cy="152" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="190" y="157" text-anchor="middle" font-size="13" fill="#333">3</text>

    <circle cx="120" cy="232" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="120" y="237" text-anchor="middle" font-size="13" fill="#333">1</text>
  </g>

  <!-- 右侧说明面板 -->
  <g filter="url(#rough2)">
    <rect x="430" y="80" width="155" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="508" y="102" text-anchor="middle" font-size="12" fill="#2a4a2a">对节点 B = 1</text>
    <text x="445" y="122" font-size="11" fill="#333">路径祖先 = {8, 3}</text>
    <text x="445" y="142" font-size="11" fill="#333">min = 3</text>
    <text x="445" y="162" font-size="11" fill="#333">max = 8</text>
    <line x1="445" y1="172" x2="575" y2="172" stroke="#4a7a3a" stroke-width="1"/>
    <text x="445" y="192" font-size="11" fill="#b85450">|1 - 3| = 2</text>
    <text x="445" y="212" font-size="11" fill="#b85450">|1 - 8| = 7</text>
    <text x="445" y="226" font-size="12" fill="#2a4a2a">差 = max(2,7) = 7</text>
  </g>

  <text x="300" y="368" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">
    极值决定最大差：对任意节点 B，最值差来自路径 min 或 max
  </text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    无需两两比较祖先，DFS 一遍即可
  </text>
</svg>
