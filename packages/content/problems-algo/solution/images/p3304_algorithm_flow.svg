<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：构造整串 vs 数学定位</text>

  <!-- 起点框 -->
  <rect x="180" y="38" width="160" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">输入 k（1 ≤ k ≤ 500）</text>

  <!-- 分叉箭头 -->
  <path d="M 235 70 C 200 80 160 84 135 93" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 285 70 C 320 80 360 84 385 93" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 路线 A -->
  <text x="130" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">路线 A：暴力模拟（构造整串）</text>
  <rect x="40" y="122" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">w = 'a'</text>
  <path d="M 130 148 L 130 156" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="40" y="158" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">while len(w) &lt; k:</text>
  <text x="130" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">　　w += inc(w)　← 整体+1后追加</text>
  <path d="M 130 192 L 130 200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="40" y="202" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="219" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 w[k − 1]</text>
  <text x="130" y="244" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">O(k) 时间 · O(k) 空间</text>

  <!-- 中间等价标注 -->
  <path d="M 222 172 L 298 172" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⇔ 等价</text>

  <!-- 路线 B -->
  <text x="390" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路线 B：数学定位（只算第 k 位）</text>
  <rect x="300" y="122" width="180" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j = k − 1；cnt = 0　（转 0-indexed）</text>
  <path d="M 390 148 L 390 156" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="300" y="158" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">while j:</text>
  <text x="390" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">　　cnt += j &amp; 1；j &gt;&gt;= 1</text>
  <path d="M 390 192 L 390 200" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="300" y="202" width="180" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="219" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 'a' + cnt</text>
  <text x="390" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">O(log k) 时间 · O(1) 空间</text>

  <!-- 底部说明框 -->
  <rect x="40" y="258" width="440" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">路线 B 的 while 就是 popcount 的手工展开：逐位剥出 k−1 的二进制</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个为 1 的位 ⇔ 在对应层落入后半段 ⇔ 位移 +1，与路线 A 的构造过程一一对应</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k ≤ 500 时 A 也够快；k ~ 10¹⁴（3307 II 版）时构造法爆内存，只能走 B</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">有内置 popcount 时路线 B 压缩成一行：'a' + popcount(k−1)</text>
</svg>
