<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：BFS 定序 + 逆序结算，一次扫描出答案</text>

  <!-- 步骤① -->
  <rect x="36" y="42" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="63" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建无向邻接表；统计 total[g]</text>
  <text x="186" y="81" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">g = 1..20，全树每组总数</text>

  <line x1="186" y1="92" x2="186" y2="106" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤② -->
  <rect x="36" y="108" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="129" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 以节点 0 为根做 BFS</text>
  <text x="186" y="147" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">得层序 order 与 parent[]</text>

  <line x1="186" y1="158" x2="186" y2="172" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤③（核心） -->
  <rect x="36" y="174" width="300" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="186" y="196" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 逆序处理 order[i]，i = n−1 … 1</text>
  <text x="186" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">v = order[i]，p = parent[v]</text>
  <text x="186" y="238" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ans += Σ_g cnt[v][g] × (total[g] − cnt[v][g])</text>
  <text x="186" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">cnt[p][g] += cnt[v][g]（子树计数上移）</text>

  <line x1="186" y1="278" x2="186" y2="292" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤④ -->
  <rect x="36" y="294" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="321" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">④ 返回 ans（64 位整数！）</text>

  <!-- 侧注 1 -->
  <rect x="356" y="108" width="188" height="62" rx="6" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="366" y="130" font-size="9.5" fill="#555" filter="url(#rough2)">order 中父必先于子出现</text>
  <text x="366" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">→ 逆序扫描时孩子先结算</text>
  <line x1="356" y1="139" x2="338" y2="133" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 侧注 2 -->
  <rect x="356" y="178" width="188" height="96" rx="6" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="366" y="198" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">逆 BFS 序 = 后序</text>
  <text x="366" y="216" font-size="9.5" fill="#555" filter="url(#rough2)">处理 v 时，其子树计数</text>
  <text x="366" y="232" font-size="9.5" fill="#555" filter="url(#rough2)">已全部并入 cnt[v]</text>
  <text x="366" y="252" font-size="9.5" fill="#555" filter="url(#rough2)">每节点 O(20)，总 O(21n)</text>
  <line x1="356" y1="226" x2="338" y2="226" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 侧注 3 -->
  <rect x="356" y="294" width="188" height="62" rx="6" fill="#ffffff" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="366" y="314" font-size="9.5" fill="#555" filter="url(#rough2)">链深可达 1e5：递归 DFS 有</text>
  <text x="366" y="332" font-size="9.5" fill="#555" filter="url(#rough2)">爆栈风险，BFS 迭代最稳</text>
  <line x1="356" y1="325" x2="338" y2="316" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="28" y="360" font-size="10" fill="#666" filter="url(#rough2)">复杂度：时间 O(21n)、空间 O(21n)；一条边在一条路径中至多计一次 → 不重不漏</text>
</svg>
