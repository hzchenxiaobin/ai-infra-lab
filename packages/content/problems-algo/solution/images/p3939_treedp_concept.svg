<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：两状态独立集 × 余数维度</text>

  <!-- 左侧：树与相邻约束 -->
  <text x="134" y="46" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">选中 u ⇒ 直接孩子全部禁选</text>

  <!-- 树边 -->
  <path d="M134,106 L58,159" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M134,106 L134,159" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M134,106 L210,159" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 红叉：父子边被「不相邻」封禁 -->
  <path d="M90,126 L102,138 M90,138 L102,126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M128,126 L140,138 M128,138 L140,126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M166,126 L178,138 M166,138 L178,126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- 根节点（选中） -->
  <circle cx="134" cy="86" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="134" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="82" text-anchor="start" font-size="10" fill="#d6a040" filter="url(#rough2)">选</text>
  <text x="165" y="98" text-anchor="start" font-size="9" fill="#667" filter="url(#rough2)">值2</text>

  <!-- 孩子节点（禁选） -->
  <circle cx="58" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="134" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="210" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <circle cx="58" cy="175" r="21" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="134" cy="175" r="21" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="210" cy="175" r="21" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="58" y="209" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">值1</text>
  <text x="134" y="209" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">值2</text>
  <text x="210" y="209" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">值1</text>
  <text x="134" y="228" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">橙＝选中 u，红叉＝孩子禁选（示例 2）</text>

  <!-- 左侧条件解读框 -->
  <rect x="22" y="240" width="222" height="96" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="133" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" filter="url(#rough2)">条件①「不相邻」＝ 父子不同选</text>
  <text x="133" y="276" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 局部约束，选 / 不选两状态即可</text>
  <text x="133" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" filter="url(#rough2)">条件②「和 ≡ 0 (mod k)」＝ 全局</text>
  <text x="133" y="310" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 模对加法封闭，余数 r 编进状态</text>
  <text x="133" y="328" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">两条件正交 ⇒ 状态 ＝（节点, 选否, 余数）</text>

  <!-- 右侧：状态定义 -->
  <rect x="268" y="44" width="232" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="61" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp0[u][r]：u 不选，子树选集和 ≡ r (mod k)</text>
  <text x="384" y="77" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">（含空集，初值 dp0[u][0] ＝ 1）</text>

  <rect x="268" y="96" width="232" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp1[u][r]：u 选，子树选集和 ≡ r (mod k)</text>
  <text x="384" y="129" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">（初值 dp1[u][nums[u]%k] ＝ 1）</text>

  <!-- 合并规则 -->
  <rect x="268" y="150" width="232" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="168" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">合并孩子 v —— 余数卷积 ⊗</text>
  <text x="384" y="186" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新 dp0 ← dp0[u] ⊗ (dp0[v] ＋ dp1[v])</text>
  <text x="384" y="202" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新 dp1 ← dp1[u] ⊗ dp0[v]</text>
  <text x="384" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">⊗：乘积按 (r₁＋r₂) mod k 归位累加</text>
  <text x="384" y="230" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">u 选 ⇒ 孩子只能配 dp0（不相邻！）</text>

  <!-- 答案 -->
  <rect x="268" y="248" width="232" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">答案 ＝ dp0[root][0] ＋ dp1[root][0] − 1</text>
  <text x="384" y="286" text-anchor="middle" font-size="9" fill="#556" filter="url(#rough2)">−1 扣掉空子集；全程对 10⁹＋7 取模</text>

  <!-- 复杂度 -->
  <rect x="268" y="312" width="232" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="384" y="327" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">n−1 条父子边 × O(k²) 卷积</text>
  <text x="384" y="341" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">总时间 O(n·k²)：n＝1000, k＝100 → 10⁷</text>
</svg>
