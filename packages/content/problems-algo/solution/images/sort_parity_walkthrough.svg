<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 1, 2, 4]</text>

  <!-- ===== Step 1 ===== -->
  <text x="40" y="48" font-size="12" fill="#888" font-weight="bold">第 1 步</text>
  <text x="100" y="48" font-size="11" fill="#555">left=0 → 3（奇，错位） × right=3 → 4（偶，错位） → 交换</text>

  <!-- pointer labels -->
  <text x="202" y="66" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">left↓</text>
  <text x="358" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">right↓</text>

  <!-- cells: [3, 1, 2, 4] -->
  <rect x="176" y="72" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="228" y="72" width="52" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="94" text-anchor="middle" font-size="15" fill="#999">1</text>
  <rect x="280" y="72" width="52" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="94" text-anchor="middle" font-size="15" fill="#999">2</text>
  <rect x="332" y="72" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>

  <!-- swap arrow -->
  <path d="M 202 108 Q 280 124 358 108" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 108 Q 280 124 202 108" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">swap</text>

  <!-- ===== Step 2 ===== -->
  <text x="40" y="146" font-size="12" fill="#888" font-weight="bold">第 2 步</text>
  <text x="100" y="146" font-size="11" fill="#555">left=1 → 1（奇，错位） × right=2 → 2（偶，错位） → 交换</text>

  <!-- pointer labels -->
  <text x="254" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">left↓</text>
  <text x="306" y="164" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">right↓</text>

  <!-- cells: [4, 1, 2, 3] -->
  <rect x="176" y="170" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="192" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="170" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="192" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="170" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="192" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="332" y="170" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="192" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- swap arrow -->
  <path d="M 254 206 Q 280 222 306 206" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 206 Q 280 222 254 206" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">swap</text>

  <!-- ===== Step 3: done ===== -->
  <text x="40" y="244" font-size="12" fill="#888" font-weight="bold">第 3 步</text>
  <text x="100" y="244" font-size="11" fill="#555">left=2 ≥ right=1 → 指针交叉，分区完成</text>

  <!-- cells: [4, 2, 1, 3] all confirmed -->
  <rect x="176" y="262" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="262" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="262" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="262" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="332" y="262" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="284" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- zone labels below -->
  <text x="228" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶数区</text>
  <path d="M 282 300 L 282 262" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="318" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">奇数区</text>

  <!-- result note -->
  <rect x="120" y="322" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果 [4, 2, 1, 3]：偶数在前，奇数在后 ✓</text>
</svg>
