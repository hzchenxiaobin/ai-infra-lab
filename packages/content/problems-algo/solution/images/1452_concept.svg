<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：字符串清单 → 位掩码 → O(⌈V/64⌉) 子集判定</text>

  <!-- Step 1: Company -> ID (left, blue) -->
  <text x="130" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Step 1: 公司名 → ID</text>
  <rect x="40" y="64" width="180" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="88" font-size="11" fill="#333" filter="url(#rough2)">leetcode  → 0</text>
  <text x="55" y="110" font-size="11" fill="#333" filter="url(#rough2)">google    → 1</text>
  <text x="55" y="132" font-size="11" fill="#333" filter="url(#rough2)">facebook  → 2</text>
  <text x="55" y="154" font-size="11" fill="#333" filter="url(#rough2)">microsoft → 3</text>
  <text x="55" y="176" font-size="11" fill="#333" filter="url(#rough2)">amazon    → 4</text>
  <text x="55" y="196" font-size="10" fill="#888" filter="url(#rough2)">哈希表 O(n·m)</text>

  <!-- Arrow from step 1 to step 2 -->
  <path d="M 225 134 L 258 134" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="241" y="126" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">编码</text>

  <!-- Step 2: List -> bitmask (right, green) -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Step 2: 清单 → 位掩码</text>
  <rect x="268" y="64" width="270" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="282" y="88" font-size="11" fill="#333" filter="url(#rough2)">用户0: {leetcode,google,facebook}</text>
  <text x="522" y="88" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00111</text>
  <text x="282" y="110" font-size="11" fill="#333" filter="url(#rough2)">用户1: {google,microsoft}</text>
  <text x="522" y="110" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">01010</text>
  <text x="282" y="132" font-size="11" fill="#333" filter="url(#rough2)">用户2: {google,facebook}</text>
  <text x="522" y="132" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00110</text>
  <text x="282" y="154" font-size="11" fill="#333" filter="url(#rough2)">用户3: {google}</text>
  <text x="522" y="154" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00010</text>
  <text x="282" y="176" font-size="11" fill="#333" filter="url(#rough2)">用户4: {amazon}</text>
  <text x="522" y="176" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10000</text>
  <text x="282" y="196" font-size="10" fill="#888" filter="url(#rough2)">第 k 位 = 1 ↔ 公司 k 在清单中</text>

  <!-- Step 3: Subset formula (bottom, orange) -->
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Step 3: 子集判定</text>
  <rect x="30" y="232" width="500" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="280" y="260" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">A ⊆ B  ⟺  (A &amp; B) == A</text>

  <text x="50" y="290" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="66" y="290" font-size="11" fill="#333" filter="url(#rough2)">用户2 ⊆ 用户0:</text>
  <text x="180" y="290" font-size="11" fill="#555" filter="url(#rough2)">00110 &amp; 00111 = 00110 == 用户2 → 是子集</text>

  <text x="50" y="316" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="66" y="316" font-size="11" fill="#333" filter="url(#rough2)">用户4 ⊆ 用户0:</text>
  <text x="180" y="316" font-size="11" fill="#555" filter="url(#rough2)">10000 &amp; 00111 = 00000 ≠ 用户4 → 非子集</text>

  <text x="50" y="346" font-size="11" fill="#666" filter="url(#rough2)">位掩码用 1 个 uint64_t 可表示 64 家公司，子集判定从 O(m) 降到 O(⌈V/64⌉)</text>
  <text x="50" y="368" font-size="11" fill="#666" filter="url(#rough2)">长度剪枝：|list[i]| &gt; |list[j]| 时 list[i] 不可能 ⊆ list[j]，直接跳过</text>
</svg>
