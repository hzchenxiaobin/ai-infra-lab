<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位确定，O(n²) 一次扫描</text>

  <!-- Step 1: preprocess factorials -->
  <rect x="60" y="50" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="12" fill="#446688" font-weight="bold">① 预处理阶乘表</text>
  <text x="80" y="90" font-size="11" fill="#555">fact[i] = i!  （i = 0..n−1），candidates = [1, 2, …, n]</text>
  <text x="430" y="82" font-size="10" fill="#888">O(n)</text>

  <!-- arrow down -->
  <path d="M 300 104 L 300 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="60" y="128" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="150" font-size="12" fill="#d6a040" font-weight="bold">② for i = 0 .. n−1  （逐位填结果）</text>
  <text x="80" y="168" font-size="11" fill="#555">每轮确定排列第 i 位填哪个数，剩余候选 = n−i 个</text>

  <!-- arrow down -->
  <path d="M 300 182 L 300 202" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: compute index (decision diamond) -->
  <polygon points="300,206 420,256 300,306 180,256" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ index = (k−1) // fact[n−1−i]</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#555">在剩余候选中第几个</text>
  <text x="300" y="284" text-anchor="middle" font-size="10" fill="#888">（0-indexed）</text>

  <!-- arrow down -->
  <path d="M 300 310 L 300 330" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: pick + update -->
  <rect x="60" y="334" width="480" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="356" font-size="12" fill="#b85450" font-weight="bold">④ 取出候选并更新 k</text>
  <text x="80" y="374" font-size="11" fill="#555">result += candidates[index]</text>
  <text x="80" y="390" font-size="11" fill="#555">candidates.erase(index)  ；k −= index · fact[n−1−i]</text>

  <!-- arrow loop back to step 2 -->
  <path d="M 540 153 Q 568 153 568 250 Q 568 360 540 360" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="572" y="250" font-size="10" fill="#d6a040">下一轮</text>

  <!-- arrow down to end -->
  <path d="M 300 402 L 300 422" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="180" y="424" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 返回 result（共 n 位）</text>

  <!-- side note -->
  <text x="430" y="374" font-size="10" fill="#888">erase O(n)</text>
  <text x="430" y="390" font-size="10" fill="#888">⇒ 总 O(n²)</text>
</svg>
