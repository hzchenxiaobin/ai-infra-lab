<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">S_n 的自相似结构：左半 = S_{n−1}，中间 = 1，右半 = reverse(invert(S_{n−1}))</text>

  <!-- ====== S_1 row ====== -->
  <text x="118" y="84" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">S₁</text>
  <rect x="128" y="66" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="180" y="86" font-size="10" fill="#888" filter="url(#rough2)">长度 1 = 2¹−1</text>

  <!-- ====== S_2 row ====== -->
  <text x="118" y="158" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">S₂</text>
  <!-- group labels above -->
  <text x="148" y="138" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">S₁</text>
  <text x="192" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="236" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rev(inv S₁)</text>
  <!-- cells -->
  <rect x="128" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="166" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="172" y="144" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="166" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="216" y="144" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="166" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="270" y="164" font-size="10" fill="#888" filter="url(#rough2)">长度 3 = 2²−1</text>

  <!-- arrow: S_2 left = S_1 -->
  <path d="M 148 100 Q 120 122 148 142" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== S_3 row ====== -->
  <text x="118" y="258" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">S₃</text>
  <!-- group labels above -->
  <text x="192" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">←  S₂  →</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="368" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">← rev(inv S₂) →</text>
  <!-- cells: 0 1 1 | 1 | 0 0 1 -->
  <rect x="128" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="172" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="244" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="304" y="244" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="348" y="244" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="392" y="244" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="266" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="446" y="264" font-size="10" fill="#888" filter="url(#rough2)">长度 7 = 2³−1</text>

  <!-- arrow: S_3 left = S_2 -->
  <path d="M 192 180 Q 150 212 192 242" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mirror annotation between left & right of S_3 -->
  <path d="M 256 300 L 260 312 L 304 312 L 308 300" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 2" fill="none" filter="url(#rough2)"/>
  <text x="282" y="326" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">右半 = 左半的「翻转 + 取反」</text>

  <!-- ====== legend ====== -->
  <g font-size="10" fill="#555">
    <rect x="40" y="348" width="20" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="66" y="359" filter="url(#rough2)">左半 = S_{n−1}</text>
    <rect x="180" y="348" width="20" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="206" y="359" filter="url(#rough2)">中间 = '1'（位置 m）</text>
    <rect x="340" y="348" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="366" y="359" filter="url(#rough2)">右半 = rev(inv S_{n−1})</text>
  </g>

  <!-- ====== formula box ====== -->
  <rect x="40" y="384" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">递推式：S_n = S_{n−1} + "1" + reverse(invert(S_{n−1}))</text>
  <text x="280" y="426" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">|S_n| = 2ⁿ − 1，中间位置 m = 2^{n−1}（恒为 '1'）</text>
</svg>
