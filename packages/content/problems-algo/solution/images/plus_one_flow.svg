<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从末位起逐位加进位，遇 10 置 0 进位，否则写入即停</text>

  <!-- Start: init -->
  <rect x="200" y="42" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：i = n−1，carry = 1</text>
  <path d="M 280 76 L 280 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i >= 0 and carry == 1 ? -->
  <polygon points="280,88 400,124 280,160 160,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i ≥ 0 且</text>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">carry == 1 ?</text>

  <!-- No branch: go right -->
  <path d="M 400 124 L 470 124" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- Decision: carry == 1 ? (after loop) -->
  <polygon points="490,100 540,124 490,148 440,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="120" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">carry</text>
  <text x="490" y="132" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">== 1 ?</text>

  <!-- Yes: prepend 1 -->
  <path d="M 540 124 L 540 178" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="552" y="150" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="476" y="180" width="128" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="540" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">首位插入 1</text>

  <!-- No: just return -->
  <path d="M 490 148 L 490 180" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="470" y="168" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Return box (merge) -->
  <rect x="430" y="226" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="540" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 digits</text>
  <path d="M 540 210 L 540 224" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 490 210 L 490 224" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Yes branch: go down -->
  <path d="M 280 160 L 280 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="172" font-size="11" fill="#888" font-weight="bold">是</text>

  <!-- sum = digits[i] + carry -->
  <rect x="180" y="178" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sum = digits[i] + carry</text>
  <path d="M 280 210 L 280 224" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: sum == 10 ? -->
  <polygon points="280,226 380,256 280,286 180,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum == 10 ?</text>

  <!-- Yes: digits[i]=0, i-- -->
  <path d="M 180 256 L 110 256" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="240" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="66" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">digits[i]=0</text>
  <text x="66" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i−−，回循环</text>
  <!-- loop back arrow up to decision -->
  <path d="M 66 240 L 66 124 L 156 124" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- No: digits[i]=sum, carry=0, return -->
  <path d="M 380 256 L 430 256" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="405" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="290" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">digits[i] = sum</text>
  <text x="490" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">carry = 0</text>
  <path d="M 490 256 L 490 288" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 490 334 L 490 374 L 540 374 L 540 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- bottom legend -->
  <text x="40" y="388" font-size="10" fill="#888">虚线 = 回到循环 / 汇合返回；红 = 进位路径；绿 = 终止返回路径</text>
</svg>
