<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：元素和 ≥ 数字和 恒成立，差为 9 的倍数</text>

  <!-- ====== TOP: the array ====== -->
  <rect x="120" y="40" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="11" fill="#888">输入数组 nums</text>
  <text x="270" y="75" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">[ 1 , 15 , 6 , 3 ]</text>

  <!-- split into two paths -->
  <path d="M 200 84 L 110 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 84 L 430 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">元素相加</text>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐位相加</text>

  <!-- ====== LEFT: element sum ====== -->
  <rect x="40" y="114" width="150" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">元素和</text>
  <text x="115" y="152" text-anchor="middle" font-size="11" fill="#555">1 + 15 + 6 + 3</text>
  <text x="115" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">= 25</text>
  <text x="115" y="186" text-anchor="middle" font-size="9.5" fill="#888">sum(nums[i])</text>

  <!-- ====== RIGHT: digit sum ====== -->
  <rect x="350" y="114" width="150" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="134" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">数字和</text>
  <text x="425" y="152" text-anchor="middle" font-size="11" fill="#555">1 + (1+5) + 6 + 3</text>
  <text x="425" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">= 16</text>
  <text x="425" y="186" text-anchor="middle" font-size="9.5" fill="#888">sum of digits</text>

  <!-- arrows converge to subtract -->
  <path d="M 115 190 L 115 210 L 270 210" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 425 190 L 425 210 L 270 210" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 210 L 270 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="298" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">作差</text>

  <!-- ====== ANSWER ====== -->
  <rect x="150" y="230" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">| 25 − 16 | = 9</text>

  <!-- ====== WHY: value - digitSum per element ====== -->
  <path d="M 270 270 L 270 290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="294" width="460" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">逐元素：value − digitSum = Σ dᵢ·(10ⁱ − 1)</text>
  <text x="270" y="332" text-anchor="middle" font-size="10.5" fill="#888">个位贡献 d₀·(10⁰−1)=0；高位 dᵢ·(10ⁱ−1) 全是 9 的倍数且 ≥ 0</text>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⇒ 元素和 ≥ 数字和（恒成立），差值必为 9 的倍数 → 可省 abs()</text>
  <text x="270" y="364" text-anchor="middle" font-size="9.5" fill="#888">单位数元素贡献 0；仅多位数产生非零差</text>
</svg>
