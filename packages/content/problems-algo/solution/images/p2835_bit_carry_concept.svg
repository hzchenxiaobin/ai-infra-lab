<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">按位凑数 + 免费进位：两个 2^i 白嫖一个 2^(i+1)</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">子序列只看总和、不要求对齐 target 的位 → 合并不需要任何操作</text>

  <!-- free merge demo: 2 + 2 -> 4 -->
  <rect x="80" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="102" text-anchor="middle" font-size="16" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>
  <rect x="184" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 250 96 L 330 96" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="256" y="60" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="291" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">免费！0 次</text>

  <rect x="336" y="76" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="101" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="470" y="90" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">它们本来就是子序列的</text>
  <text x="470" y="106" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两个成员：1 + 1 + 2 = 4</text>

  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（示例 2 中真实发生：位 2 需要的「4」= 子序列里的 1 + 1 + 2，一分钱不花）</text>

  <!-- bit scan demo: target = 12 = 1100 -->
  <text x="310" y="182" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">从低位到高位逐位扫描：target = 12 = 1100₂</text>

  <!-- bit cells, low on the left -->
  <rect x="120" y="196" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">位 0</text>
  <text x="160" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="208" y="196" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="214" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">位 1</text>
  <text x="248" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="296" y="196" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">位 2</text>
  <text x="336" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="384" y="196" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">位 3</text>
  <text x="424" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- scan arrow -->
  <path d="M 108 262 L 500 262" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="160" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">低位先处理</text>

  <!-- per-bit verdicts -->
  <text x="336" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[2] = 1（进位凑出）→ 白嫖 ✓</text>
  <text x="462" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[3] = 0 → 拆 32！</text>

  <!-- rules -->
  <rect x="60" y="310" width="250" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[i] ≥ 1 → 零操作服务位 i</text>
  <text x="185" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">进位后桶非空 ⟺ 小元素能凑出 2^i</text>

  <rect x="330" y="310" width="250" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[i] = 0 → 就近拆更大的元素</text>
  <text x="455" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">代价 j − i，副产品沿途每层一个回桶</text>
</svg>
