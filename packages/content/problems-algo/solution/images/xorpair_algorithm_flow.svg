<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：两次异或 + 两次奇偶判定（O(n+m)）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">全程只做线性扫描与异或自增，不枚举任何数对</text>

  <!-- Start pill -->
  <rect x="230" y="56" width="60" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="11.5" fill="#333">ans = 0</text>
  <path d="M 260 82 L 260 94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: compute two XORs -->
  <rect x="140" y="96" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 求异或和</text>
  <text x="260" y="125" text-anchor="middle" font-size="10.5" fill="#444">xor1 = ⊕nums1 ， xor2 = ⊕nums2</text>
  <path d="M 260 132 L 260 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: m parity -->
  <rect x="130" y="146" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 若 m = len(nums2) 为奇数</text>
  <text x="260" y="175" text-anchor="middle" font-size="10.5" fill="#444">ans ⊕= xor1</text>
  <text x="404" y="167" font-size="10.5" fill="#888">m 偶 ⇒ xor1 抵消，跳过</text>
  <path d="M 260 182 L 260 194" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: n parity -->
  <rect x="130" y="196" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 若 n = len(nums1) 为奇数</text>
  <text x="260" y="225" text-anchor="middle" font-size="10.5" fill="#444">ans ⊕= xor2</text>
  <text x="404" y="217" font-size="10.5" fill="#888">n 偶 ⇒ xor2 抵消，跳过</text>
  <path d="M 260 232 L 260 244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="210" y="246" width="100" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ return ans</text>

  <!-- Worked example tie-in -->
  <rect x="40" y="290" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">套用示例 1：nums1=[2,1,3], nums2=[10,2,5,0]</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#555">xor1=2⊕1⊕3=0；xor2=10⊕2⊕5⊕0=13；m=4偶跳②；n=3奇→ans=13</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#aaa">两步异或各 O(n)/O(m)，两次奇偶判定 O(1)，整体 O(n+m)、O(1) 空间</text>
</svg>
