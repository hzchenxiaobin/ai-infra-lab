<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例 3 演算：piles = [1, 2, 3]，Alice 必败
  </text>

  <rect x="30" y="42" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="55" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">轮次</text>

  <rect x="80" y="42" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">玩家</text>

  <rect x="135" y="42" width="95" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="182" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">操作</text>

  <rect x="230" y="42" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">piles</text>

  <rect x="350" y="42" width="65" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="382" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Nim和</text>

  <rect x="415" y="42" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="470" y="59" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">状态</text>

  <rect x="30" y="70" width="495" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="107" y="87" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="182" y="87" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">初始</text>
  <text x="290" y="87" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1, 2, 3]</text>
  <text x="382" y="87" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="470" y="87" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">P 必败</text>

  <rect x="30" y="98" width="495" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="107" y="115" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Alice</text>
  <text x="182" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">堆3 拿 3</text>
  <text x="290" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1, 2, 0]</text>
  <text x="382" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="470" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">N 必胜</text>

  <rect x="30" y="126" width="495" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="107" y="143" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Bob</text>
  <text x="182" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">堆2 拿 1</text>
  <text x="290" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1, 1, 0]</text>
  <text x="382" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="470" y="143" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">P 必败</text>

  <rect x="30" y="154" width="495" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="107" y="171" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Alice</text>
  <text x="182" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">堆1 拿 1</text>
  <text x="290" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0, 1, 0]</text>
  <text x="382" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="470" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">N 必胜</text>

  <rect x="30" y="182" width="495" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="107" y="199" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Bob</text>
  <text x="182" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">堆2 拿 1</text>
  <text x="290" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0, 0, 0]</text>
  <text x="382" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="470" y="199" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Alice 输</text>

  <rect x="30" y="224" width="495" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    Bob 的策略：Alice 每次把 Nim 和搅成非零，Bob 总能拉回零
  </text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">
    第 2 轮：s=3（011），堆2 的 x=2（010）最高位匹配 → 留 x⊕s=1，拿 1 块 → s 归零
  </text>
</svg>
