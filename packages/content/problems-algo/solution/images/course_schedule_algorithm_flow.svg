<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Kahn 拓扑排序流程（BFS + 入度表）</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 建邻接表 + 入度数组</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init queue -->
  <rect x="170" y="104" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333">入度=0 的节点入队, count=0</text>

  <path d="M 280 138 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <polygon points="280,162 360,202 280,242 200,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333">队列为空?</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">(无入度0节点)</text>

  <!-- Yes branch right -->
  <path d="M 360 202 L 432 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="194" text-anchor="middle" font-size="11" fill="#b85450">是</text>

  <!-- Decision: count == n? -->
  <polygon points="475,168 540,202 475,236 410,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="206" text-anchor="middle" font-size="11" fill="#333">count==n?</text>

  <!-- yes -> true -->
  <path d="M 475 168 L 475 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="152" font-size="11" fill="#82b366">是</text>
  <ellipse cx="475" cy="110" rx="52" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="12" fill="#333">返回 true</text>

  <!-- no -> false -->
  <path d="M 475 236 L 475 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="258" font-size="11" fill="#b85450">否</text>
  <ellipse cx="475" cy="292" rx="62" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="296" text-anchor="middle" font-size="11" fill="#333">返回 false(有环)</text>

  <!-- No branch down -->
  <path d="M 280 242 L 280 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="258" font-size="11" fill="#82b366">否</text>

  <rect x="190" y="266" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12" fill="#333">出队 u, count++</text>

  <path d="M 280 298 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="318" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333">遍历 u 的邻点 v: indegree[v] −−</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#333">若 indegree[v]==0 则 v 入队</text>

  <!-- loop back -->
  <path d="M 130 338 L 60 338 L 60 202 L 200 202" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="270" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 270)">继续循环</text>

  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#888">关键：每条边只在删边时访问一次 → O(V+E)；count&lt;n 即存在环</text>
</svg>
