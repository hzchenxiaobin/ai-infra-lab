<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">f(x) = v₅(x!) 单调不减阶梯函数，前像大小恒为 0 或 5</text>

  <!-- Axes -->
  <path d="M 70 385 L 70 95" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 60 370 L 535 370" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- y-axis labels -->
  <text x="60" y="374" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="60" y="336" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="60" y="298" text-anchor="end" font-size="10" fill="#888">2</text>
  <text x="60" y="260" text-anchor="end" font-size="10" fill="#888">3</text>
  <text x="60" y="222" text-anchor="end" font-size="10" fill="#888">4</text>
  <text x="60" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="60" y="146" text-anchor="end" font-size="10" fill="#888">6</text>
  <text x="46" y="82" font-size="10" fill="#888" font-style="italic">f(x)</text>

  <!-- x-axis labels -->
  <text x="70" y="388" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="145" y="388" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="220" y="388" text-anchor="middle" font-size="10" fill="#888">10</text>
  <text x="295" y="388" text-anchor="middle" font-size="10" fill="#888">15</text>
  <text x="370" y="388" text-anchor="middle" font-size="10" fill="#888">20</text>
  <text x="445" y="388" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">25</text>
  <text x="520" y="388" text-anchor="middle" font-size="10" fill="#888">30</text>
  <text x="535" y="360" font-size="10" fill="#888" font-style="italic">x</text>

  <!-- Platform highlights (thin green bars under each platform) -->
  <rect x="72" y="366" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>
  <rect x="147" y="328" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>
  <rect x="222" y="290" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>
  <rect x="297" y="252" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>
  <rect x="372" y="214" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>
  <rect x="447" y="138" width="71" height="8" fill="#e6f4ea" rx="2" filter="url(#rough2)"/>

  <!-- Staircase path (blue, normal segments) -->
  <path d="M 70,370 L 145,370 L 145,332 L 220,332 L 220,294 L 295,294 L 295,256 L 370,256 L 370,218 L 445,218"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- Special jump at x=25 (red dashed, jump by 2) -->
  <path d="M 445,218 L 445,142"
        stroke="#b85450" stroke-width="2.8" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <!-- Continue blue path after jump -->
  <path d="M 445,142 L 520,142"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- Platform labels (f value on each platform) -->
  <text x="107" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=0</text>
  <text x="182" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=1</text>
  <text x="257" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=2</text>
  <text x="332" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=3</text>
  <text x="407" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=4</text>
  <text x="482" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=6</text>

  <!-- "5 个 x" labels under platforms -->
  <text x="107" y="402" text-anchor="middle" font-size="9" fill="#888">x: 0~4</text>
  <text x="182" y="402" text-anchor="middle" font-size="9" fill="#888">5~9</text>
  <text x="257" y="402" text-anchor="middle" font-size="9" fill="#888">10~14</text>
  <text x="332" y="402" text-anchor="middle" font-size="9" fill="#888">15~19</text>
  <text x="407" y="402" text-anchor="middle" font-size="9" fill="#888">20~24</text>
  <text x="482" y="402" text-anchor="middle" font-size="9" fill="#888">25~29</text>

  <!-- Red circle with X at f=5 (skipped value) -->
  <circle cx="445" cy="180" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="186" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✗</text>
  <text x="465" y="178" font-size="10" fill="#b85450" font-weight="bold">K=5 被跳过</text>
  <text x="465" y="192" font-size="9" fill="#b85450">前像 = 0</text>

  <!-- Normal jump annotation (at x=5) -->
  <text x="153" y="358" font-size="9" fill="#446688">跳幅 1</text>

  <!-- Jump annotation box at x=25 -->
  <rect x="325" y="88" width="205" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="427" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=25: v₅(25) = 2</text>
  <text x="427" y="122" text-anchor="middle" font-size="10" fill="#b85450">跳幅 2 → f 从 4 直跳到 6</text>
  <path d="M 427,130 Q 437,150 442,172" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Bottom conclusion boxes -->
  <rect x="30" y="424" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f(x) 单调不减</text>
  <text x="110" y="458" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 可二分查找边界</text>

  <rect x="210" y="424" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">跳幅 = v₅(x)</text>
  <text x="290" y="458" text-anchor="middle" font-size="10" fill="#d6a040">5 的幂处跳 &gt; 1</text>

  <rect x="390" y="424" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前像 = 0 或 5</text>
  <text x="470" y="458" text-anchor="middle" font-size="10" fill="#4a7a3a">被跳过 / 正常平台</text>
</svg>
