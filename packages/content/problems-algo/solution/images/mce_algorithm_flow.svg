<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    加权中位数 + 前缀和  O(n log n)
  </text>

  <!-- 步骤 1 -->
  <rect x="120" y="50" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 配对 (nums[i], cost[i])</text>
  <text x="270" y="87" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">按 nums 升序排序</text>
  <line x1="270" y1="96" x2="270" y2="118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="120" y="120" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 构造前缀数组</text>
  <text x="270" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">pw[i]=Σcost,  pv[i]=Σcost·nums</text>
  <line x1="270" y1="166" x2="270" y2="188" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="90" y="190" width="360" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 定位加权中位数</text>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#7a5a1a" filter="url(#rough2)">最小 k 使 pw[k+1] ≥ ⌈total/2⌉</text>
  <text x="270" y="244" text-anchor="middle" font-size="11" fill="#7a5a1a" filter="url(#rough2)">→ 目标值 t = nums[k]</text>
  <line x1="270" y1="248" x2="270" y2="270" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="60" y="272" width="420" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 前缀和 O(1) 求开销</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">left = t·pw[k] − pv[k]</text>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">right = (pv[n]−pv[k+1]) − t·(pw[n]−pw[k+1])</text>
  <line x1="270" y1="330" x2="270" y2="352" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 5 -->
  <rect x="150" y="354" width="240" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#rough2)">⑤ 返回 left + right</text>
  <text x="270" y="390" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">= 使数组相等的最小总开销</text>
</svg>
