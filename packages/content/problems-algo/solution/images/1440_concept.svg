<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：Expressions 存变量名 → 双 JOIN 解析为值 → CASE WHEN 求值</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">left_operand / right_operand 是变量名，需 JOIN Variables 两次拿到实际数值</text>

  <!-- ===== Variables table (left) ===== -->
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Variables</text>
  <!-- header -->
  <rect x="24" y="68" width="92" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="83" text-anchor="middle" font-size="11" fill="#333">name</text>
  <text x="93" y="83" text-anchor="middle" font-size="11" fill="#333">value</text>
  <!-- row x -->
  <rect x="24" y="90" width="92" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <text x="93" y="105" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <!-- row y -->
  <rect x="24" y="112" width="92" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">y</text>
  <text x="93" y="127" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>

  <!-- ===== Expressions table (right) ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Expressions</text>
  <!-- header -->
  <rect x="300" y="68" width="260" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="83" text-anchor="middle" font-size="10.5" fill="#333">left_operand</text>
  <text x="430" y="83" text-anchor="middle" font-size="10.5" fill="#333">operator</text>
  <text x="515" y="83" text-anchor="middle" font-size="10.5" fill="#333">right_operand</text>
  <!-- row 1: x > y -->
  <rect x="300" y="90" width="260" height="20" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="430" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="515" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <!-- row 2: x < y -->
  <rect x="300" y="110" width="260" height="20" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="430" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&lt;</text>
  <text x="515" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <!-- row 3: x = y -->
  <rect x="300" y="130" width="260" height="20" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="430" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">=</text>
  <text x="515" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <!-- dots -->
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#aaa">⋮</text>

  <!-- ===== JOIN arrows ===== -->
  <!-- v1: left_operand -> Variables.name -->
  <path d="M 300 100 Q 200 100 116 100" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="210" y="94" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">JOIN v1 (left_operand = name)</text>

  <!-- v2: right_operand -> Variables.name -->
  <path d="M 560 100 Q 300 160 116 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">JOIN v2 (right_operand = name)</text>

  <!-- ===== After JOIN: resolved values ===== -->
  <text x="300" y="196" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">JOIN 后：变量名 → 实际值</text>
  <rect x="120" y="204" width="360" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="220" text-anchor="middle" font-size="11" fill="#333">v1.value</text>
  <text x="300" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">op</text>
  <text x="420" y="220" text-anchor="middle" font-size="11" fill="#333">v2.value</text>

  <rect x="120" y="228" width="360" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">66</text>
  <text x="300" y="243" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="420" y="243" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">77</text>

  <!-- arrow down to CASE -->
  <path d="M 300 250 L 300 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== CASE WHEN evaluation ===== -->
  <rect x="80" y="264" width="440" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">CASE WHEN 逐行求值</text>

  <text x="110" y="306" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">operator='&gt;' AND 66 &gt; 77 → false</text>
  <text x="110" y="322" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">operator='&lt;' AND 66 &lt; 77 → true</text>
  <text x="110" y="338" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">operator='=' AND 66 = 77 → false</text>
  <text x="110" y="354" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">operator='&gt;' AND 77 &gt; 66 → true</text>
  <text x="110" y="370" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">operator='=' AND 66 = 66 → true</text>

  <!-- footer note -->
  <text x="300" y="402" text-anchor="middle" font-size="10.5" fill="#888">变量名通过两次 JOIN 解析为值，再用 CASE WHEN 按 operator 分发比较</text>
</svg>
