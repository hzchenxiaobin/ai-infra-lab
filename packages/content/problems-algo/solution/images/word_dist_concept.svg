<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：单遍扫描，只保留每个单词最近一次位置</text>

  <!-- array cells -->
  <text x="24" y="92" font-size="12" fill="#888">words：</text>
  <rect x="60" y="74" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="106" y="97" text-anchor="middle" font-size="11.5" fill="#333">practice</text>
  <rect x="156" y="74" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <rect x="252" y="74" width="92" height="36" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="97" text-anchor="middle" font-size="11.5" fill="#aaa">perfect</text>
  <rect x="348" y="74" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">coding</text>
  <rect x="444" y="74" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>

  <!-- index labels -->
  <text x="106" y="128" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="202" y="128" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="298" y="128" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="394" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="490" y="128" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>

  <!-- legend -->
  <rect x="40" y="142" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="154" font-size="11" fill="#555">word1 = makes</text>
  <rect x="180" y="142" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="154" font-size="11" fill="#555">word2 = coding</text>

  <!-- distance arrow 1: |1 - 3| = 2 -->
  <path d="M 202 174 L 202 184 L 394 184 L 394 174" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="298" y="200" text-anchor="middle" font-size="11" fill="#888">|1 − 3| = 2</text>

  <!-- distance arrow 2: |4 - 3| = 1 (min) -->
  <path d="M 394 224 L 394 234 L 490 234 L 490 224" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="442" y="252" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">|4 − 3| = 1 ✓ 最小</text>

  <!-- key idea box -->
  <rect x="40" y="272" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">扫到 word1 时，最近的 word2 一定是上一次见到的 p2</text>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#555">更早的 word2 只会更远 → 只需维护 p1、p2 两个变量</text>

  <!-- footer -->
  <rect x="40" y="340" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">单遍 O(n) 扫描 + O(1) 空间</text>
</svg>
