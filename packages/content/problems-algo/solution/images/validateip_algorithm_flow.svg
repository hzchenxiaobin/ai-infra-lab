<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">验证 IP 地址算法流程（先判版本，再逐段校验）</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="92" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">输入 queryIP</text>

  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: split('.') == 4 ? -->
  <polygon points="280,100 410,148 280,196 150,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333">split('.') 得 4 段</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#666">且每段满足 IPv4 规则?</text>

  <!-- Yes -> IPv4 -->
  <path d="M 410 148 L 452 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="431" y="140" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="500" cy="148" rx="50" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">IPv4</text>

  <!-- No -> down to IPv6 check -->
  <path d="M 280 196 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="11" fill="#b85450">否</text>

  <!-- Decision: split(':') == 8 ? -->
  <polygon points="280,220 410,268 280,316 150,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333">split(':') 得 8 段</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#666">且每段满足 IPv6 规则?</text>

  <!-- Yes -> IPv6 -->
  <path d="M 410 268 L 452 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="431" y="260" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="500" cy="268" rx="50" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">IPv6</text>

  <!-- No -> Neither -->
  <path d="M 280 316 L 280 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="334" font-size="11" fill="#b85450">否</text>
  <ellipse cx="280" cy="362" rx="58" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Neither</text>

  <!-- rule reminder boxes -->
  <rect x="30" y="400" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="418" font-size="11" fill="#446688" font-weight="bold">IPv4 段规则：</text>
  <text x="40" y="434" font-size="10.5" fill="#555">长度 1-3 · 纯数字 · 无前导零 · ≤255</text>
  <text x="40" y="448" font-size="10" fill="#999">“0” 合法，“01”/“00” 非法</text>

  <rect x="290" y="400" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="418" font-size="11" fill="#4a7a3a" font-weight="bold">IPv6 段规则：</text>
  <text x="300" y="434" font-size="10.5" fill="#555">长度 1-4 · 十六进制(0-9a-fA-F)</text>
  <text x="300" y="448" font-size="10" fill="#999">允许前导零，不校验数值范围</text>
</svg>
