<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：枚举因子 d + 并查集合并倍数</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="12" fill="#446688" font-weight="bold">① 初始化并查集</text>
  <text x="60" y="86" font-size="10.5" fill="#555">parent[i]=i（1≤i≤n），rank[i]=0；n 个城市各自成集合</text>
  <text x="430" y="68" font-size="10.5" fill="#888">O(n)</text>

  <!-- Arrow -->
  <path d="M 270 100 L 270 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop over d -->
  <rect x="40" y="120" width="460" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="140" font-size="12" fill="#d6a040" font-weight="bold">② 枚举因子 d = threshold+1 … n</text>
  <text x="430" y="140" font-size="10.5" fill="#888">O(n log n)</text>
  <text x="60" y="158" font-size="10.5" fill="#555">对每个 d &gt; threshold，遍历其倍数 2d, 3d, … ⌊n/d⌋·d：</text>

  <!-- inner union box -->
  <rect x="80" y="168" width="400" height="48" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="100" y="186" font-size="10.5" fill="#b85450" font-weight="bold">union(d, 2d)</text>
  <text x="200" y="186" font-size="10.5" fill="#555">→ 把 d 的所有倍数连到 d</text>
  <text x="100" y="204" font-size="10" fill="#888">倍数两两 gcd ≥ d &gt; threshold，本就是团；统一挂根 d 即可</text>

  <!-- Arrow -->
  <path d="M 270 230 L 270 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: answer queries -->
  <rect x="40" y="250" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">③ 逐个回答查询</text>
  <text x="430" y="270" font-size="10.5" fill="#888">O(q·α)</text>
  <text x="60" y="288" font-size="10.5" fill="#555">对每个 query [a, b]：find(a) == find(b) ? true : false</text>
  <text x="60" y="302" font-size="10" fill="#888">路径压缩 + 按秩合并 → 单次查询均摊 O(α(n)) ≈ O(1)</text>

  <!-- Bottom: complexity summary -->
  <rect x="40" y="324" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">总复杂度</text>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#555">建图 O(Σ n/d) = O(n·ln(n/threshold))  +  查询 O(q·α)</text>
  <text x="270" y="376" text-anchor="middle" font-size="10" fill="#888">n≤10⁴ 时倍数法远胜朴素 O(n²) 枚举所有点对</text>
</svg>
