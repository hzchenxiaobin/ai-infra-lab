<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">好叶子对：后序 DFS 收集距离列表，LCA 处配对计数</text>

  <!-- 普通边（浅灰） -->
  <line x1="267" y1="92" x2="192" y2="141" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="293" y1="92" x2="368" y2="141" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="171" y1="162" x2="133" y2="215" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="189" y1="162" x2="227" y2="215" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="371" y1="162" x2="333" y2="215" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="389" y1="162" x2="427" y2="215" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 好对路径（绿色加粗）：(4,5) 经节点 2 -->
  <line x1="171" y1="162" x2="133" y2="215" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <line x1="189" y1="162" x2="227" y2="215" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <!-- 好对路径（绿色加粗）：(6,7) 经节点 3 -->
  <line x1="371" y1="162" x2="333" y2="215" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <line x1="389" y1="162" x2="427" y2="215" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>

  <!-- 根 1（坏对 LCA，红色） -->
  <circle cx="280" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <ellipse cx="280" cy="80" rx="24" ry="24" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 节点 2（好对 LCA，绿色） -->
  <circle cx="180" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <ellipse cx="180" cy="150" rx="24" ry="24" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 节点 3（好对 LCA，绿色） -->
  <circle cx="380" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#333">3</text>
  <ellipse cx="380" cy="150" rx="24" ry="24" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 叶子节点 -->
  <circle cx="125" cy="225" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="229" text-anchor="middle" font-size="11" fill="#333">4</text>

  <circle cx="235" cy="225" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="229" text-anchor="middle" font-size="11" fill="#333">5</text>

  <circle cx="325" cy="225" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="325" y="229" text-anchor="middle" font-size="11" fill="#333">6</text>

  <circle cx="435" cy="225" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="229" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- 距离列表标签（蓝色小框） -->
  <rect x="295" y="62" width="62" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="74" text-anchor="middle" font-size="9" fill="#446688">[2,2,2,2]</text>

  <rect x="200" y="134" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="145" text-anchor="middle" font-size="9" fill="#446688">[1,1]</text>

  <rect x="400" y="134" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="145" text-anchor="middle" font-size="9" fill="#446688">[1,1]</text>

  <rect x="144" y="220" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="156" y="230" text-anchor="middle" font-size="8" fill="#446688">[0]</text>

  <rect x="254" y="220" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="230" text-anchor="middle" font-size="8" fill="#446688">[0]</text>

  <rect x="344" y="220" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="356" y="230" text-anchor="middle" font-size="8" fill="#446688">[0]</text>

  <rect x="454" y="220" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="466" y="230" text-anchor="middle" font-size="8" fill="#446688">[0]</text>

  <!-- 好对标注 -->
  <text x="180" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(4,5) len=2 ✓</text>
  <text x="380" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(6,7) len=2 ✓</text>
  <text x="280" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">(4,6) len=4 ✗</text>

  <!-- 公式与结论框 -->
  <rect x="40" y="265" width="480" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">路径长度 = (d₁ + 1) + (d₂ + 1) = d₁ + d₂ + 2</text>
  <text x="60" y="312" font-size="11" fill="#555">d₁ = dfs(node.left) 中某叶距离，d₂ = dfs(node.right) 中某叶距离</text>
  <text x="60" y="334" font-size="11" fill="#4a7a3a">✓ (4,5)：LCA=2，d₁=0, d₂=0 → 0+0+2=2 ≤ 3，好对</text>
  <text x="60" y="354" font-size="11" fill="#4a7a3a">✓ (6,7)：LCA=3，d₁=0, d₂=0 → 0+0+2=2 ≤ 3，好对</text>
  <text x="60" y="374" font-size="11" fill="#b85450">✗ (4,6)：LCA=1，d₁=1, d₂=1 → 1+1+2=4 &gt; 3，非好对</text>
  <text x="60" y="394" font-size="10" fill="#888">后序 DFS 在每个节点合并左右距离列表；返回时各距离 +1 并剪枝 ≥ distance 的项</text>
</svg>
