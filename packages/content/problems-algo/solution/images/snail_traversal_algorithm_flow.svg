<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次合法性校验 + 双层循环按下标映射填表</text>

  <!-- Start -->
  <rect x="210" y="46" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#333">输入 nums, rowsCount, colsCount</text>
  <path d="M 300 80 L 300 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="300,98 420,150 300,202 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">rowsCount × colsCount</text>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== nums.length ?</text>

  <!-- No branch -> return [] -->
  <path d="M 180 150 L 90 150 L 90 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="30" y="200" width="120" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return []</text>
  <text x="90" y="255" text-anchor="middle" font-size="10" fill="#888">无效输入直接返回空</text>

  <!-- Yes branch -->
  <path d="M 300 202 L 300 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- create matrix -->
  <rect x="180" y="220" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#333">建 result[rowsCount][colsCount] 空矩阵</text>
  <path d="M 300 254 L 300 270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop -->
  <rect x="170" y="270" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#333">for c in 0 .. colsCount-1</text>
  <path d="M 300 304 L 300 320" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop -->
  <rect x="170" y="320" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="12" fill="#333">for r in 0 .. rowsCount-1</text>
  <path d="M 300 354 L 300 370" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- index mapping -->
  <rect x="120" y="370" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#333">idx = c * rowsCount + (c % 2 == 0 ? r : rowsCount - 1 - r)</text>
  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">result[r][c] = nums[idx]</text>
  <path d="M 300 410 L 300 426" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="210" y="426" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="300" y="448" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return result</text>

  <!-- side note -->
  <text x="560" y="392" text-anchor="end" font-size="10" fill="#888">↑ 列内顺序由奇偶定</text>
</svg>
