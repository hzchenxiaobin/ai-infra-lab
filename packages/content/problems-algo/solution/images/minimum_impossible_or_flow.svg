<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希集合 + 扫描 2 的幂</text>

  <!-- Step 1: build set -->
  <rect x="120" y="48" width="320" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 把 nums 全部放入哈希集合 S</text>
  <text x="280" y="92" text-anchor="middle" font-size="10.5" fill="#444">unordered_set 或 Python set，O(1) 查询</text>

  <path d="M 280 106 L 280 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop k -->
  <rect x="120" y="130" width="320" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② for k = 0, 1, 2, ... , 30：</text>
  <text x="280" y="174" text-anchor="middle" font-size="11" fill="#444">若 (1 &lt;&lt; k) ∉ S：</text>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return (1 &lt;&lt; k)   // 即为答案</text>

  <path d="M 280 210 L 280 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,234 360,282 280,330 200,282" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2^k 在</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">集合 S?</text>

  <!-- yes branch -->
  <path d="M 360 282 L 410 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="276" font-size="10" fill="#4a7a3a" font-weight="bold">在</text>
  <rect x="410" y="262" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a">k += 1</text>
  <text x="470" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a">继续查下一幂</text>
  <path d="M 470 262 L 470 230 L 280 230 L 280 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 280 330 L 280 352" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="346" font-size="10" fill="#b85450" font-weight="bold">不在</text>

  <!-- answer -->
  <rect x="140" y="354" width="280" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = 2^k（首个缺失的幂）</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#444">nums[i] ≤ 10^9 &lt; 2^30 ⟹ k ≤ 30 必终止</text>

  <!-- right note -->
  <rect x="420" y="354" width="125" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="428" y="372" font-size="10" fill="#446688" font-weight="bold">为何只查幂？</text>
  <text x="428" y="386" font-size="9.5" fill="#444">非幂数由幂 OR 出，</text>
  <text x="428" y="398" font-size="9.5" fill="#444">缺失幂才是断点。</text>
</svg>
