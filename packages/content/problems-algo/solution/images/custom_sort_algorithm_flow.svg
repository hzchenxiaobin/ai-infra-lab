<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数法 + 按序拼装</text>

  <!-- Step 1: count freq -->
  <rect x="170" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 遍历 s，统计每个字符频率</text>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#666">freq[c]++（数组 [26] 或哈希表）</text>

  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init result -->
  <rect x="170" y="108" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 初始化结果 result = ""</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#666">用可变字符串/列表，避免反复拷贝</text>

  <path d="M 280 152 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: iterate order (loop) -->
  <rect x="150" y="172" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for c in order:</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#444">result += 重复 c 共 freq[c] 次</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#b85450">freq[c] = 0 （标记已消费）</text>

  <path d="M 280 232 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: remaining chars? -->
  <polygon points="280,252 400,300 280,348 160,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">freq 中还有</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">非零项？</text>

  <!-- Yes branch: append remaining -->
  <path d="M 400 300 L 460 300 L 460 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="380" y="248" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 追加剩余字符</text>
  <text x="460" y="280" text-anchor="middle" font-size="11" fill="#666">不在 order 中的字符</text>
  <path d="M 460 248 L 460 230 L 410 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch -->
  <path d="M 160 300 L 100 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="292" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- Step 5: return -->
  <path d="M 100 300 L 100 372 L 168 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="356" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 result</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#666">每个字符恰好出现一次，无遗漏</text>

  <!-- Complexity box -->
  <rect x="40" y="412" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">复杂度：时间 O(|s| + |order|)，空间 O(26) = O(1)</text>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#666">两遍线性扫描，无需排序</text>
</svg>
