<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：直接串联 vs 索引映射</text>

  <!-- Input -->
  <rect x="160" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入 nums（长度 n）</text>

  <path d="M 260 90 L 260 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Two branches -->
  <rect x="40" y="114" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">方法A：直接串联</text>

  <rect x="300" y="114" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">方法B：索引映射</text>

  <path d="M 200 114 L 160 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 320 114 L 360 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Method A step 1 -->
  <rect x="40" y="166" width="180" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#333">新建 ans 长度 2n</text>
  <text x="130" y="200" text-anchor="middle" font-size="10.5" fill="#888">两趟拷贝：前 n + 后 n</text>

  <!-- Method B step 1 -->
  <rect x="300" y="166" width="180" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="184" text-anchor="middle" font-size="11" fill="#333">新建 ans 长度 2n</text>
  <text x="390" y="200" text-anchor="middle" font-size="10.5" fill="#888">单趟：ans[j] = nums[j % n]</text>

  <path d="M 130 212 L 130 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 212 L 390 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Method A detail -->
  <rect x="40" y="238" width="180" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="10.5" fill="#333">ans[0..n-1] ← nums</text>
  <text x="130" y="272" text-anchor="middle" font-size="10.5" fill="#333">ans[n..2n-1] ← nums</text>

  <!-- Method B detail -->
  <rect x="300" y="238" width="180" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="262" text-anchor="middle" font-size="11" fill="#333">for j in 0..2n-1:</text>
  <text x="390" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040">  ans[j] = nums[j % n]</text>

  <path d="M 130 284 L 130 304" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 284 L 390 304" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Merge -->
  <path d="M 130 304 L 200 322" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 304 L 320 322" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="140" y="328" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 ans（长度 2n）</text>
</svg>
