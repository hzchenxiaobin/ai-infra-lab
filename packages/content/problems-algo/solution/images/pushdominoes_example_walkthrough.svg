<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：.L.R...LR..L..  →  LL.RR.LLRRLL..</text>

  <!-- ===== Input row ===== -->
  <text x="30" y="50" font-size="11" fill="#888" font-weight="bold">输入</text>
  <!-- cells: 14 chars, w=34, start x=62. cx=79+i*34 -->
  <!-- . -->
  <rect x="62" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <!-- L -->
  <rect x="96" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="113" y="78" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">L</text>
  <!-- . -->
  <rect x="130" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="147" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <!-- R -->
  <rect x="164" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="181" y="78" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">R</text>
  <!-- . . . -->
  <rect x="198" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="232" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="266" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="283" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <!-- L -->
  <rect x="300" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="317" y="78" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">L</text>
  <!-- R -->
  <rect x="334" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="351" y="78" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">R</text>
  <!-- . . -->
  <rect x="368" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="402" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="419" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <!-- L -->
  <rect x="436" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="453" y="78" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">L</text>
  <!-- . . -->
  <rect x="470" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="504" y="56" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="521" y="78" text-anchor="middle" font-size="15" fill="#bbb">.</text>

  <!-- index labels -->
  <text x="79" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">0</text>
  <text x="113" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">1</text>
  <text x="147" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">2</text>
  <text x="181" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">3</text>
  <text x="215" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">4</text>
  <text x="249" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">5</text>
  <text x="283" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">6</text>
  <text x="317" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">7</text>
  <text x="351" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">8</text>
  <text x="385" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">9</text>
  <text x="419" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">10</text>
  <text x="453" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">11</text>
  <text x="487" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">12</text>
  <text x="521" y="100" text-anchor="middle" font-size="7.5" fill="#ccc">13</text>

  <!-- ===== Segment bars (between input and output) ===== -->
  <!-- A: idx0 L..L -->
  <rect x="62" y="110" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="122" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">L…L</text>
  <!-- B: idx2 L..R -->
  <rect x="130" y="110" width="34" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="147" y="122" text-anchor="middle" font-size="8" fill="#888" font-weight="bold">L…R</text>
  <!-- C: idx3..7 R..L -->
  <rect x="164" y="110" width="170" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="249" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R…L  相向·等距抵消</text>
  <!-- D: idx8..11 R..L -->
  <rect x="334" y="110" width="136" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="402" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R…L  相向·无中点</text>
  <!-- E: idx12..13 L..R -->
  <rect x="470" y="110" width="68" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="504" y="122" text-anchor="middle" font-size="8" fill="#888" font-weight="bold">L…R</text>

  <!-- ===== Output row ===== -->
  <text x="30" y="148" font-size="11" fill="#888" font-weight="bold">输出</text>
  <!-- L L . R R . L L R R L L . . -->
  <rect x="62" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="79" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="96" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="130" y="138" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="147" y="160" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="164" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="181" y="160" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">R</text>
  <rect x="198" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">R</text>
  <rect x="232" y="138" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="160" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="266" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="283" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="300" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="317" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="334" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="351" y="160" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">R</text>
  <rect x="368" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="160" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">R</text>
  <rect x="402" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="419" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="436" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="453" y="160" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="470" y="138" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="160" text-anchor="middle" font-size="15" fill="#bbb">.</text>
  <rect x="504" y="138" width="34" height="34" fill="#fff" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="521" y="160" text-anchor="middle" font-size="15" fill="#bbb">.</text>

  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#888">五种端点对分段（首尾补哨兵 L@−1 / R@N）决定所有 '.' 的去向</text>

  <!-- ===== 4-rule legend ===== -->
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">四种端点对分类规则</text>

  <!-- rule 1 R..L -->
  <rect x="30" y="226" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="244" font-size="10.5" fill="#d6a040" font-weight="bold">R…L（相向）</text>
  <text x="44" y="260" font-size="9.5" fill="#555">前半 R、后半 L；gap 奇数则正中 '.'</text>
  <text x="44" y="266" font-size="9" fill="#888">  例：R . . L → R R . L</text>

  <!-- rule 2 R..R -->
  <rect x="310" y="226" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="324" y="244" font-size="10.5" fill="#446688" font-weight="bold">R…R（同向）</text>
  <text x="324" y="260" font-size="9.5" fill="#555">全填 R（尾随 '.' 落入此分支）</text>
  <text x="324" y="266" font-size="9" fill="#888">  例：R . . R → R R R R</text>

  <!-- rule 3 L..L -->
  <rect x="30" y="278" width="270" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="296" font-size="10.5" fill="#4a7a3a" font-weight="bold">L…L（同向）</text>
  <text x="44" y="312" font-size="9.5" fill="#555">全填 L（前导 '.' 落入此分支）</text>
  <text x="44" y="318" font-size="9" fill="#888">  例：L . . L → L L L L</text>

  <!-- rule 4 L..R -->
  <rect x="310" y="278" width="260" height="44" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="324" y="296" font-size="10.5" fill="#888" font-weight="bold">L…R（相背）</text>
  <text x="324" y="312" font-size="9.5" fill="#555">力相背，互不波及，全 '.'</text>
  <text x="324" y="318" font-size="9" fill="#888">  例：L . . R → L . . R</text>

  <text x="300" y="344" text-anchor="middle" font-size="9.5" fill="#888">力法合力符号 = 距最近力源的方向，与上表分类完全一致</text>
</svg>
