<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">归纳证明：偶数必胜，奇数必败（S≠0 时）</text>

  <!-- ===== Left column: n even → win ===== -->
  <rect x="30" y="48" width="250" height="312" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n 偶数, S≠0 → 当前玩家胜</text>

  <text x="50" y="98" font-size="11" fill="#333">① 必能找到安全手：</text>
  <rect x="48" y="108" width="216" height="58" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="58" y="126" font-size="10" fill="#444">假设每个 aᵢ 擦除后余下 XOR=0</text>
  <text x="58" y="140" font-size="10" fill="#444">⇒ S⊕aᵢ=0 ⇒ aᵢ=S (∀i)</text>
  <text x="58" y="154" font-size="10" fill="#b85450">⇒ n 偶个 S 异或 = 0 = S，矛盾！</text>
  <text x="58" y="160" font-size="9" fill="#888">  </text>

  <text x="50" y="190" font-size="11" fill="#333">② 擦该手，余下 n−1(奇) 个</text>
  <text x="60" y="206" font-size="10" fill="#444">余下 XOR ≠ 0，轮到对手</text>

  <path d="M 155 214 L 155 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="50" y="252" font-size="11" fill="#333">③ 由归纳假设：</text>
  <rect x="48" y="260" width="216" height="42" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="58" y="278" font-size="10" fill="#444">奇数个 + XOR≠0 → 该玩家败</text>
  <text x="58" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">⇒ 对手败 ⇒ 当前玩家胜 ✓</text>

  <text x="155" y="336" text-anchor="middle" font-size="10" fill="#888">基础: n=0 时 XOR=0，不在此支</text>
  <text x="155" y="350" text-anchor="middle" font-size="10" fill="#888">n=2: 两数不等，擦一留一≠0，对手败</text>

  <!-- ===== Right column: n odd → lose ===== -->
  <rect x="320" y="48" width="250" height="312" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n 奇数, S≠0 → 当前玩家败</text>

  <text x="340" y="98" font-size="11" fill="#333">任意擦除 aᵢ，余下 XOR = S⊕aᵢ：</text>

  <rect x="338" y="108" width="216" height="40" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="348" y="126" font-size="10" fill="#b85450" font-weight="bold">分支 A: S⊕aᵢ = 0</text>
  <text x="348" y="140" font-size="10" fill="#444">⇒ 擦完即败（直接输）</text>

  <rect x="338" y="160" width="216" height="40" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="348" y="178" font-size="10" fill="#b85450" font-weight="bold">分支 B: S⊕aᵢ ≠ 0</text>
  <text x="348" y="192" font-size="10" fill="#444">余下 n−1(偶) 个，对手先手</text>

  <path d="M 445 206 L 445 228" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="340" y="244" font-size="11" fill="#333">③ 由归纳假设：</text>
  <rect x="338" y="252" width="216" height="42" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="348" y="270" font-size="10" fill="#444">偶数个 + XOR≠0 → 该玩家胜</text>
  <text x="348" y="286" font-size="10" fill="#b85450" font-weight="bold">⇒ 对手胜 ⇒ 当前玩家败 ✗</text>

  <text x="445" y="328" text-anchor="middle" font-size="10" fill="#888">A、B 两支均败 ⇒ 奇数必败</text>
  <text x="445" y="342" text-anchor="middle" font-size="10" fill="#888">基础: n=1，擦完余空 XOR=0，败</text>
  <text x="445" y="356" text-anchor="middle" font-size="10" fill="#888">  </text>

  <!-- footer note -->
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#999">对 n 归纳：偶→留奇给对手(对手败)；奇→留偶给对手或直接败。S=0 则开局即胜，无需走子。</text>
</svg>
