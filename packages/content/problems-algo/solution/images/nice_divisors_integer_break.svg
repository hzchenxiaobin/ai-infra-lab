<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归约为整数拆分 + 快速幂</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">max a₁×a₂×⋯×aₖ  s.t.  a₁+a₂+⋯+aₖ = primeFactors</text>

  <!-- ===== Reduction ===== -->
  <rect x="40" y="60" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">好因子数最大化</text>
  <text x="140" y="96" text-anchor="middle" font-size="10" fill="#666">max a₁×a₂×⋯×aₖ</text>
  <text x="140" y="110" text-anchor="middle" font-size="9" fill="#888">Σaᵢ = primeFactors</text>

  <text x="250" y="92" font-size="16" fill="#b85450" font-weight="bold">→</text>

  <rect x="270" y="60" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">整数拆分（同 343 题）</text>
  <text x="375" y="96" text-anchor="middle" font-size="10" fill="#666">把 primeFactors 拆成若干正整数</text>
  <text x="375" y="110" text-anchor="middle" font-size="10" fill="#666">使乘积最大 → 尽量多切 3</text>

  <!-- divider -->
  <line x1="40" y1="130" x2="480" y2="130" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Why 3 ===== -->
  <text x="60" y="152" font-size="11" fill="#444" font-weight="bold">为什么切成 3？</text>
  <rect x="40" y="160" width="440" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#666">最大化 b^(1/b) → b = e ≈ 2.718 → 最近整数 3，承接 343 题数学结论</text>

  <!-- ===== Three remainder cases ===== -->
  <text x="60" y="210" font-size="11" fill="#444" font-weight="bold">设 primeFactors = 3q + r，分三种情况：</text>

  <!-- r=0 -->
  <rect x="40" y="220" width="145" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="112" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">r = 0</text>
  <text x="112" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^q</text>
  <text x="112" y="272" text-anchor="middle" font-size="9" fill="#888">全切成 3</text>

  <!-- r=1 -->
  <rect x="195" y="220" width="145" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="267" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r = 1</text>
  <text x="267" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^(q−1) × 4</text>
  <text x="267" y="272" text-anchor="middle" font-size="9" fill="#888">3×1 &lt; 2×2，凑成 4</text>

  <!-- r=2 -->
  <rect x="350" y="220" width="145" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="422" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">r = 2</text>
  <text x="422" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^q × 2</text>
  <text x="422" y="272" text-anchor="middle" font-size="9" fill="#888">直接补一个 2</text>

  <!-- ===== Small case ===== -->
  <rect x="40" y="290" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">特判：primeFactors ≤ 3</text>
  <text x="150" y="322" text-anchor="middle" font-size="10" fill="#666">1→1, 2→2, 3→3（公式不适用）</text>

  <!-- ===== Fast pow ===== -->
  <rect x="270" y="290" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="375" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">primeFactors ≤ 10⁹</text>
  <text x="375" y="322" text-anchor="middle" font-size="10" fill="#666">q 可达 3×10⁸ → 必须快速幂 O(log q)</text>

  <!-- ===== Key difference from 343 ===== -->
  <rect x="40" y="336" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#666">⚠ 与 343 的关键区别：343 的 n ≤ 58 可 DP；本题 primeFactors ≤ 10⁹</text>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#666">DP 数组不可行，且结果要 mod 10⁹+7 → 只能贪心 + 快速幂</text>
</svg>
