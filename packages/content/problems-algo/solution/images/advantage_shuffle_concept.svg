<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">田忌赛马：能赢就派最大，赢不了就送最弱</text>

  <!-- Vertical divider between two scenarios -->
  <path d="M 290 50 L 290 178" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Left scenario: 能赢 ===== -->
  <text x="150" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 能赢：我方最大 &gt; 对方最大</text>

  <text x="70" y="104" font-size="11" fill="#446688" font-weight="bold">我方</text>
  <!-- our cards: 7, 9, 12 -->
  <rect x="80" y="88" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="128" y="88" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="106" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="176" y="88" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">12</text>

  <text x="70" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">对方</text>
  <!-- their cards: 3, 6, 10 -->
  <rect x="80" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="128" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="158" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="176" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- pairing arrow: our max -> their max -->
  <path d="M 196 116 L 196 138" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="232" y="130" font-size="10" fill="#4a7a3a">12 &gt; 10 ✓ 派最大</text>

  <!-- ===== Right scenario: 不能赢 ===== -->
  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 不能赢：我方最大 ≤ 对方最大</text>

  <text x="350" y="104" font-size="11" fill="#446688" font-weight="bold">我方</text>
  <!-- our cards: 3(min), 8, 9 -->
  <rect x="360" y="88" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="408" y="88" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="106" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="456" y="88" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="106" text-anchor="middle" font-size="11" fill="#333">9</text>

  <text x="350" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">对方</text>
  <!-- their cards: 4, 7, 9(max) -->
  <rect x="360" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="408" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="158" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="456" y="140" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- pairing arrow: our min -> their max (sacrifice) -->
  <path d="M 380 116 Q 428 128 476 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="130" font-size="10" fill="#b85450">9 ≤ 9 ✗ 送最弱</text>

  <!-- ===== Bottom explanation bar ===== -->
  <rect x="40" y="196" width="500" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">决策规则：每步只看对方最强的马</text>
  <text x="290" y="244" text-anchor="middle" font-size="11" fill="#444">① 我方最大能赢它 → 派最大上场（hi−−），赢一场</text>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#444">② 赢不了 → 派最小去送（lo++），把主力留给对方弱马</text>

  <!-- footer -->
  <text x="290" y="312" text-anchor="middle" font-size="10" fill="#999">每步消掉对方一个最强的马，n 步完成全部配对</text>
</svg>
