<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,3,5,6]，target=2（不存在）</text>

  <!-- ===== Round 1 ===== -->
  <text x="20" y="56" font-size="12" fill="#446688" font-weight="bold">第 1 轮：left=0, right=3 → mid=1</text>
  <rect x="60" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="125" y="64" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="190" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="255" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="90" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <text x="155" y="108" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="285" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <rect x="350" y="72" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="89" text-anchor="middle" font-size="11" fill="#b85450">3 &gt; 2 → right = mid−1 = 0</text>

  <!-- ===== Round 2 ===== -->
  <text x="20" y="138" font-size="12" fill="#446688" font-weight="bold">第 2 轮：left=0, right=0 → mid=0</text>
  <rect x="60" y="146" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="125" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="166" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <rect x="190" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <rect x="255" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="166" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="90" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left=mid=right</text>
  <rect x="350" y="154" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="171" text-anchor="middle" font-size="11" fill="#446688">1 &lt; 2 → left = mid+1 = 1</text>

  <!-- ===== result ===== -->
  <rect x="40" y="212" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">left=1 &gt; right=0，区间为空 → return left = 1</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#555">插入 [1, 3] 之间，下标 1 即「首个 ≥ 2 的位置」</text>

  <!-- ===== mini case: target=5 (found) ===== -->
  <text x="20" y="296" font-size="12" fill="#446688" font-weight="bold">对照①：target=5（已存在）</text>
  <text x="20" y="318" font-size="11" fill="#555">mid=1(3&lt;5→left=2) → mid=2(nums[2]==5) → 直接 return 2 ✅</text>

  <!-- ===== mini case: target=7 (insert at end) ===== -->
  <text x="20" y="346" font-size="12" fill="#446688" font-weight="bold">对照②：target=7（比所有都大）</text>
  <text x="20" y="368" font-size="11" fill="#555">mid=1(3&lt;7→left=2) → mid=2(5&lt;7→left=3) → mid=3(6&lt;7→left=4)</text>
  <text x="20" y="386" font-size="11" fill="#555">left=4 &gt; right=3 → return left = 4 = n（插到末尾）</text>

  <rect x="40" y="398" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">三种情况统一收敛到「return left」，无需分支特判</text>
</svg>
