<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 状态转移：dp[i][j] = 前 i 字符、删 j 次的最小 RLE</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">处理 s[i−1] 时二选一：删掉它 / 保留它并向左合并同字符</text>

  <!-- state box -->
  <rect x="170" y="56" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#333">计算 dp[i][j]</text>
  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,112 400,158 280,204 160,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#333">s[i−1] 怎么处理？</text>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#333">两择取较小</text>

  <!-- branch labels -->
  <text x="148" y="150" font-size="11" fill="#b85450" font-weight="bold">A 删除</text>
  <path d="M 160 158 L 110 158 L 110 200" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="412" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">B 保留并合并</text>
  <path d="M 400 158 L 450 158 L 450 200" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Case A box -->
  <rect x="20" y="202" width="200" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A：删掉 s[i−1]</text>
  <g font-size="11">
    <rect x="44" y="232" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="59" y="247" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="84" y="247" fill="#666">= 不进入结果</text>
  </g>
  <text x="120" y="276" text-anchor="middle" font-size="11" fill="#333">消耗 1 次删除</text>
  <text x="120" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i][j] ← dp[i−1][j−1]</text>

  <!-- Case B box -->
  <rect x="260" y="202" width="280" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B：保留 s[i−1]，向左合并同字符</text>

  <!-- string visualization with scan-back -->
  <text x="276" y="244" font-size="10" fill="#666">区间 s[p−1 .. i−1]：</text>
  <g font-size="10">
    <!-- prefix -->
    <rect x="276" y="250" width="24" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="288" y="264" text-anchor="middle" fill="#888">…</text>
    <text x="288" y="280" text-anchor="middle" font-size="8" fill="#888">前缀</text>

    <!-- p-1 boundary -->
    <path d="M 304 246 L 304 282" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="308" y="244" font-size="8" fill="#4a7a3a">p−1</text>

    <!-- diff char (delete) -->
    <rect x="308" y="250" width="22" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="319" y="264" text-anchor="middle" fill="#b85450">x</text>
    <text x="319" y="280" text-anchor="middle" font-size="8" fill="#b85450">del++</text>

    <!-- same char (keep) -->
    <rect x="332" y="250" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="343" y="264" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
    <text x="343" y="280" text-anchor="middle" font-size="8" fill="#446688">kept++</text>

    <!-- diff char (delete) -->
    <rect x="356" y="250" width="22" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="367" y="264" text-anchor="middle" fill="#b85450">x</text>
    <text x="367" y="280" text-anchor="middle" font-size="8" fill="#b85450">del++</text>

    <!-- same char (keep) -->
    <rect x="380" y="250" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="391" y="264" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
    <text x="391" y="280" text-anchor="middle" font-size="8" fill="#446688">kept++</text>

    <!-- same char (keep) = s[i-1] -->
    <rect x="404" y="250" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="415" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
    <text x="415" y="280" text-anchor="middle" font-size="8" fill="#4a7a3a">s[i−1]</text>

    <!-- i boundary -->
    <path d="M 428 246 L 428 282" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="432" y="244" font-size="8" fill="#4a7a3a">i</text>
  </g>

  <!-- scan arrow -->
  <path d="M 416 296 L 320 296" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="368" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a">p 从 i 向左扫到 1</text>

  <!-- counters -->
  <text x="276" y="332" font-size="10" fill="#666">累计：</text>
  <rect x="316" y="320" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="335" text-anchor="middle" font-size="10" fill="#446688">kept = 同字符数</text>
  <rect x="412" y="320" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="335" text-anchor="middle" font-size="10" fill="#b85450">del = 异字符数</text>

  <!-- condition + update -->
  <rect x="276" y="352" width="254" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="403" y="370" text-anchor="middle" font-size="10" fill="#333">若 del ≤ j（删得起）：</text>
  <text x="403" y="385" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp[i][j] ← min(dp[i][j], dp[p−1][j−del] + encLen(kept))</text>

  <!-- break note -->
  <text x="280" y="408" font-size="9" fill="#888">注：del 随 p 向左只增不减 → del &gt; j 即 break 剪枝</text>

  <!-- merge arrows -->
  <path d="M 120 300 L 120 432 L 280 432" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 400 444 L 400 432 L 280 432" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 432 L 280 450" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- take min -->
  <rect x="160" y="452" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="11" fill="#333">③ dp[i][j] = min(决策 A, 决策 B)</text>

  <!-- loop back -->
  <path d="M 400 469 L 480 469 L 480 73 L 390 73" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="488" y="272" font-size="9" fill="#888">下一组 (i,j)</text>

  <path d="M 280 488 L 280 506" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="150" y="508" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="530" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ return dp[n][k]</text>

  <text x="280" y="562" text-anchor="middle" font-size="10" fill="#888">状态 O(nk) × 转移 O(n) = O(n²k)；n≤100 约 10⁶</text>
</svg>
