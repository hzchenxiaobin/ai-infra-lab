<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段流程：BFS 建 DAG → DFS 回溯枚举</text>

  <!-- ===== Phase 1 banner ===== -->
  <rect x="30" y="46" width="560" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段一：BFS 建立最短路径 DAG（记录 children）</text>

  <!-- Step 1: preprocess -->
  <rect x="50" y="92" width="200" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">预处理通配符模式表</text>
  <text x="150" y="127" text-anchor="middle" font-size="10" fill="#666">pattern_map: *ot → [hot,dot,lot]</text>

  <path d="M 150 136 L 150 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="50" y="158" width="200" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="177" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">初始化</text>
  <text x="150" y="193" text-anchor="middle" font-size="10" fill="#666">q=[beginWord], visited={beginWord}</text>

  <path d="M 150 202 L 150 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: level loop -->
  <rect x="50" y="224" width="200" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="243" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">处理一层</text>
  <text x="150" y="259" text-anchor="middle" font-size="10" fill="#666">level_visited = {}</text>
  <text x="150" y="273" text-anchor="middle" font-size="10" fill="#666">遍历层内每个 word</text>

  <!-- loop back arrow -->
  <path d="M 50 252 Q 30 252 30 240 L 30 180" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="20" y="218" text-anchor="middle" font-size="9" fill="#888">层内</text>

  <path d="M 150 280 L 150 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: expand neighbors -->
  <rect x="280" y="224" width="290" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="243" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对 word 生成 L 个模式，查 pattern_map</text>
  <text x="425" y="259" text-anchor="middle" font-size="10" fill="#666">if nb not in visited:</text>
  <text x="425" y="273" text-anchor="middle" font-size="10" fill="#666">children[word].append(nb); level_visited.add(nb)</text>

  <path d="M 280 252 L 250 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: end of level -->
  <rect x="280" y="300" width="290" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="319" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">层末：visited |= level_visited</text>
  <text x="425" y="335" text-anchor="middle" font-size="10" fill="#666">level_visited 中单词入队；found 则停</text>

  <path d="M 425 344 L 425 372 Q 425 384 413 384 L 162 384 Q 150 384 150 372 L 150 280" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="398" text-anchor="middle" font-size="9" fill="#888">下一层（found 为假时）</text>

  <!-- ===== Phase 2 banner ===== -->
  <rect x="30" y="416" width="560" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="435" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段二：DFS 回溯，沿 children 枚举所有最短路径</text>

  <!-- Phase 2 step -->
  <rect x="80" y="460" width="460" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="479" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">从 beginWord 出发 DFS</text>
  <text x="310" y="495" text-anchor="middle" font-size="10" fill="#666">word==endWord 收集 path；否则遍历 children[word] 继续走</text>
</svg>
