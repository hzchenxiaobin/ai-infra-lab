<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1：nums=[3,2,4,4,1]  costs=[3,7,6,4,2]</text>

  <!-- ===== Header row (y=50..80) ===== -->
  <rect x="30" y="50" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- header grid lines -->
  <line x1="80" y1="50" x2="80" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="50" x2="150" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="50" x2="220" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="50" x2="320" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="50" x2="420" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="115" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="185" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">costs[i]</text>
  <text x="270" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">类型一 →</text>
  <text x="370" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">类型二 →</text>
  <text x="465" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">f[i]</text>

  <!-- ===== Data rows (y=80..230, 5 rows × 30) ===== -->
  <!-- base cells: white-ish -->
  <rect x="30" y="80" width="480" height="150" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <!-- row separators -->
  <line x1="30" y1="110" x2="510" y2="110" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="140" x2="510" y2="140" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="170" x2="510" y2="170" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="200" x2="510" y2="200" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <!-- column separators -->
  <line x1="80" y1="80" x2="80" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="80" x2="150" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="80" x2="220" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="80" x2="320" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="80" x2="420" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlight: path edge 0 -> 2 uses 类型一 (row0, col3) -->
  <rect x="220" y="80" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <!-- highlight: path edge 2 -> 4 uses 类型二 (row2, col4) -->
  <rect x="320" y="140" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <!-- highlight: f values on path: f[0], f[2], f[4] -->
  <rect x="420" y="80" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="420" y="140" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="420" y="200" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>

  <!-- ===== Data text (centers y = 95,125,155,185,215) ===== -->
  <!-- row 0 -->
  <text x="55" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="115" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="370" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="465" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0</text>
  <!-- row 1 -->
  <text x="55" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="270" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <!-- row 2 -->
  <text x="55" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="270" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="370" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="465" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">6</text>
  <!-- row 3 -->
  <text x="55" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="190" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="370" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <!-- row 4 -->
  <text x="55" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="115" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="220" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="370" y="220" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="465" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">8</text>

  <!-- Note below -->
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">最优路径：0 —类型一→ 2 —类型二→ 4</text>
  <text x="270" y="276" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">代价 = costs[2] + costs[4] = 6 + 2 = 8</text>
</svg>
