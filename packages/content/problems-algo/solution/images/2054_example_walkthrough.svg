<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：events = [[1,3,2],[4,5,2],[2,4,3]]</text>

  <!-- Step 0: Sort -->
  <rect x="40" y="40" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后：</text>
  <text x="130" y="58" font-size="11" fill="#333" filter="url(#rough2)">A=[1,3,2]</text>
  <text x="230" y="58" font-size="11" fill="#333" filter="url(#rough2)">B=[2,4,3]</text>
  <text x="330" y="58" font-size="11" fill="#333" filter="url(#rough2)">C=[4,5,2]</text>
  <text x="430" y="58" font-size="10" fill="#888" filter="url(#rough2)">（按 endTime 升序）</text>
  <text x="130" y="74" font-size="9.5" fill="#888" filter="url(#rough2)">end=3</text>
  <text x="230" y="74" font-size="9.5" fill="#888" filter="url(#rough2)">end=4</text>
  <text x="330" y="74" font-size="9.5" fill="#888" filter="url(#rough2)">end=5</text>

  <!-- Step 1: prefMax -->
  <text x="40" y="102" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">prefMax 构建：</text>

  <rect x="130" y="92" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=2</text>

  <rect x="210" y="92" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=3</text>

  <rect x="290" y="92" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prefMax=3</text>

  <text x="380" y="110" font-size="10" fill="#888" filter="url(#rough2)">max(2)=2 → max(2,3)=3 → max(3,2)=3</text>

  <!-- Divider -->
  <path d="M 40 132 L 540 132" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="152" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">逐事件二分配对：</text>

  <!-- Row A -->
  <rect x="40" y="162" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.5"/>
  <text x="55" y="182" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A: start=1</text>
  <text x="55" y="200" font-size="10" fill="#555" filter="url(#rough2)">二分 endTime&lt;1 → 无</text>
  <text x="250" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">candidate = val[A] = 2</text>
  <text x="250" y="200" font-size="10" fill="#888" filter="url(#rough2)">（无兼容前置，只取自身）</text>
  <text x="490" y="190" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 2</text>

  <!-- Row B -->
  <rect x="40" y="218" width="500" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.5"/>
  <text x="55" y="238" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B: start=2</text>
  <text x="55" y="256" font-size="10" fill="#555" filter="url(#rough2)">二分 endTime&lt;2 → 无</text>
  <text x="250" y="238" font-size="10.5" fill="#555" filter="url(#rough2)">candidate = val[B] = 3</text>
  <text x="250" y="256" font-size="10" fill="#888" filter="url(#rough2)">（A.end=3 ≥ 2，不兼容）</text>
  <text x="490" y="246" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 3</text>

  <!-- Row C (highlighted) -->
  <rect x="40" y="274" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="294" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C: start=4</text>
  <text x="55" y="312" font-size="10" fill="#555" filter="url(#rough2)">二分 endTime&lt;4 → A</text>
  <text x="250" y="294" font-size="10.5" fill="#555" filter="url(#rough2)">candidate = val[C] + prefMax[A]</text>
  <text x="250" y="312" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 2 + 2 = 4 ✓</text>
  <text x="490" y="302" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 4</text>

  <!-- Divider -->
  <path d="M 40 338 L 540 338" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="120" y="354" width="340" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = max(2, 3, 4) = 4</text>
  <text x="290" y="396" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">选活动 A + C，价值和 2 + 2 = 4</text>

  <!-- Timeline mini visualization -->
  <text x="40" y="430" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">时间线验证：</text>

  <line x1="80" y1="460" x2="500" y2="460" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="160" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="240" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="320" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="480" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <!-- A bar [1,3] -->
  <rect x="80" y="444" width="160" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="455" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A [1-3] v=2</text>

  <!-- C bar [4,5] -->
  <rect x="320" y="444" width="80" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="455" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C [4-5] v=2</text>

  <!-- gap annotation -->
  <path d="M 240 451 L 320 451" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">不重叠 ✓</text>

  <!-- Note -->
  <text x="290" y="504" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">A.end=3 &lt; C.start=4 → 时间不重叠，可同时选</text>
</svg>
