<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">漂亮数组：奇偶分治构造</text>

  <!-- ===== Section 1: split into odd/even halves ===== -->
  <text x="30" y="54" font-size="12" fill="#446688" font-weight="bold">把 [1..N] 拆成「奇数 + 偶数」两段</text>

  <!-- Odd part box -->
  <rect x="40" y="64" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">奇数段：2·f(⌈N/2⌉) − 1</text>
  <g font-size="11">
    <rect x="56" y="94" width="34" height="24" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="73" y="110" text-anchor="middle" fill="#333">1</text>
    <rect x="96" y="94" width="34" height="24" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="113" y="110" text-anchor="middle" fill="#333">5</text>
    <rect x="136" y="94" width="34" height="24" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="153" y="110" text-anchor="middle" fill="#333">3</text>
    <text x="196" y="110" fill="#888">…（全奇）</text>
  </g>

  <!-- Even part box -->
  <rect x="290" y="64" width="230" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶数段：2·f(⌊N/2⌋)</text>
  <g font-size="11">
    <rect x="306" y="94" width="34" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="323" y="110" text-anchor="middle" fill="#333">2</text>
    <rect x="346" y="94" width="34" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="363" y="110" text-anchor="middle" fill="#333">6</text>
    <rect x="386" y="94" width="34" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="403" y="110" text-anchor="middle" fill="#333">4</text>
    <text x="446" y="110" fill="#888">…（全偶）</text>
  </g>

  <!-- concat arrow -->
  <path d="M 282 94 L 288 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 2: parity guarantee ===== -->
  <text x="30" y="150" font-size="12" fill="#b85450" font-weight="bold">奇偶性保证：跨段的 i、k、j 不可能成等差</text>

  <!-- Three cases -->
  <!-- Case A: i,j same parity segment -->
  <rect x="40" y="162" width="160" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i、j 同段</text>
  <text x="120" y="198" text-anchor="middle" font-size="10" fill="#666">k 夹在中间 → 也在同段</text>
  <text x="120" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">↳ 由递归保证该段漂亮</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#888">（子问题已解决）</text>

  <!-- Case B: i in odd, j in even -->
  <rect x="210" y="162" width="170" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="295" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i 奇段、j 偶段</text>
  <text x="295" y="198" text-anchor="middle" font-size="10" fill="#666">A[i] + A[j] = 奇 + 偶</text>
  <text x="295" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 奇数</text>
  <text x="295" y="228" text-anchor="middle" font-size="10" fill="#888">而 2·A[k] 必为偶 → 不等</text>

  <!-- mini illustration of case B -->
  <g font-size="10">
    <rect x="400" y="172" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="415" y="187" text-anchor="middle" fill="#333">奇</text>
    <rect x="436" y="172" width="30" height="22" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="451" y="187" text-anchor="middle" fill="#888">k</text>
    <rect x="472" y="172" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="487" y="187" text-anchor="middle" fill="#333">偶</text>
  </g>
  <text x="451" y="212" text-anchor="middle" font-size="10" fill="#b85450">奇+偶=奇 ≠ 2·A[k]</text>
  <text x="451" y="226" text-anchor="middle" font-size="9" fill="#888">奇偶不匹配，永不成等差</text>

  <!-- ===== Section 3: recursion formula ===== -->
  <rect x="40" y="252" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f(N) = [ 2·f(⌈N/2⌉) − 1 ]  ⊕  [ 2·f(⌊N/2⌋) ]</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#888">⊕ 表示拼接；左段全奇、右段全偶，各自是更小漂亮数组的线性变换</text>

  <!-- ===== Section 4: invariant note ===== -->
  <rect x="40" y="322" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">💡 线性变换不变性：若 A 漂亮，则 a·A+b（a≠0）也漂亮</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#666">因 2·(a·A[k]+b) = (a·A[i]+b)+(a·A[j]+b)  ⟺  2·A[k] = A[i]+A[j]</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">故 2x−1、2x 两种映射保漂亮性，递归构造合法</text>
</svg>
