<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟 BFS + 两趟线性扫描</text>

  <rect x="105" y="46" width="310" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建邻接表 g（无向边双向加入）</text>

  <path d="M 260 86 L 260 100" stroke="#999" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="104" width="310" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 从 0 BFS：parent[] 与层序 order</text>

  <path d="M 260 144 L 260 158" stroke="#999" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="162" width="310" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 倒序扫 order（≈ 后序）</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对每个 u：down[u] 与孩子值 top-1 / top-2</text>

  <path d="M 260 218 L 260 232" stroke="#999" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="236" width="310" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 正序扫 order（≈ 前序）</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">up[c] = w(u) + max( up[u] , 其余孩子最大值 )</text>

  <path d="M 260 292 L 260 304" stroke="#999" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="105" y="308" width="310" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⑤ times[u] = max( down[u] , up[u] )</text>

  <text x="422" y="120" font-size="10.5" fill="#888" filter="url(#rough2)">迭代防爆栈</text>
  <text x="422" y="135" font-size="10.5" fill="#888" filter="url(#rough2)">链 10⁵ 层也安全</text>

  <text x="422" y="182" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 遍</text>
  <text x="422" y="197" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">DFS</text>

  <text x="422" y="256" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">第 2 遍</text>
  <text x="422" y="271" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">DFS</text>
</svg>
