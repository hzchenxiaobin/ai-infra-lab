<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：FROM → LEFT JOIN(ON 过滤) → GROUP BY → COUNT → SELECT</text>

  <!-- ===== Top: vertical flow of 4 steps ===== -->
  <!-- Step 1: FROM Users -->
  <rect x="200" y="46" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="65" text-anchor="middle" font-size="10" fill="#333"><tspan fill="#446688" font-weight="bold">① FROM</tspan> Users u 　←　左表（保留全部用户）</text>

  <path d="M310 78 L310 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: LEFT JOIN with ON filter (the key step) -->
  <rect x="150" y="94" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="10" fill="#333"><tspan fill="#d6a040" font-weight="bold">② LEFT JOIN</tspan> Orders o  ON  u.user_id = o.buyer_id</text>
  <text x="310" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">AND YEAR(o.order_date) = 2019</text>
  <text x="478" y="118" font-size="8" fill="#d6a040" font-weight="bold">← 年份过滤</text>
  <text x="478" y="130" font-size="8" fill="#d6a040" font-weight="bold">　必须放这里</text>

  <path d="M310 140 L310 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY -->
  <rect x="200" y="156" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="175" text-anchor="middle" font-size="10" fill="#333"><tspan fill="#4a7a3a" font-weight="bold">③ GROUP BY</tspan> u.user_id, u.join_date</text>

  <path d="M310 188 L310 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT + COUNT -->
  <rect x="150" y="204" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="221" text-anchor="middle" font-size="10" fill="#333"><tspan fill="#b85450" font-weight="bold">④ SELECT</tspan> u.user_id AS buyer_id, u.join_date,</text>
  <text x="310" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">COUNT(o.order_id) AS orders_in_2019</text>

  <!-- ===== Bottom: ON vs WHERE comparison ===== -->
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ON vs WHERE：放错位置 → LEFT JOIN 退化成 INNER JOIN</text>

  <!-- Left: correct (ON) -->
  <rect x="20" y="282" width="280" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 正确：YEAR=2019 放 ON</text>

  <text x="35" y="322" font-size="8.5" fill="#333">LEFT JOIN Orders o</text>
  <text x="35" y="336" font-size="8.5" fill="#333">  ON user_id=buyer_id</text>
  <text x="35" y="350" font-size="8.5" fill="#b85450" font-weight="bold">  AND YEAR(order_date)=2019</text>

  <text x="35" y="372" font-size="9" fill="#333">连接<tspan fill="#4a7a3a" font-weight="bold">前</tspan>过滤右表 → 用户 3、4</text>
  <text x="35" y="386" font-size="9" fill="#333">无 2019 单 → 保留为 NULL 行</text>

  <rect x="35" y="396" width="250" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="160" y="410" text-anchor="middle" font-size="8.5" fill="#333">结果含 <tspan fill="#4a7a3a" font-weight="bold">4 行</tspan>：buyer 1,2,3,4</text>

  <rect x="35" y="420" width="250" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="434" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">3→0, 4→0 ✓ 保留零单用户</text>

  <!-- Right: wrong (WHERE) -->
  <rect x="320" y="282" width="280" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗ 错误：YEAR=2019 放 WHERE</text>

  <text x="335" y="322" font-size="8.5" fill="#333">LEFT JOIN Orders o</text>
  <text x="335" y="336" font-size="8.5" fill="#333">  ON user_id=buyer_id</text>
  <text x="335" y="350" font-size="8.5" fill="#b85450" font-weight="bold">WHERE YEAR(order_date)=2019</text>

  <text x="335" y="372" font-size="9" fill="#333">连接<tspan fill="#b85450" font-weight="bold">后</tspan>逐行过滤 → 用户 3、4</text>
  <text x="335" y="386" font-size="9" fill="#333">的 NULL 行被丢弃（YEAR(NULL)≠2019）</text>

  <rect x="335" y="396" width="250" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="460" y="410" text-anchor="middle" font-size="8.5" fill="#333">结果仅 <tspan fill="#b85450" font-weight="bold">2 行</tspan>：buyer 1,2</text>

  <rect x="335" y="420" width="250" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="434" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">3、4 消失 ✗ 漏了零单用户</text>
</svg>
