<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：每条「左上→右下」对角线元素全相同</text>

  <!-- ===== Panel A: matrix colored by diagonal ===== -->
  <text x="152" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 矩阵按对角线染色</text>

  <!-- 3x4 grid, cell 54x54, origin (44,74) -->
  <!-- d=-2: (2,0)=9  blue -->
  <rect x="44" y="182" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="71" y="216" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">9</text>

  <!-- d=-1: (1,0)=5 (2,1)=5  green -->
  <rect x="44" y="128" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="71" y="162" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="98" y="182" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="216" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- d=0: (0,0)=1 (1,1)=1 (2,2)=1  orange -->
  <rect x="44" y="74" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="71" y="108" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">1</text>
  <rect x="98" y="128" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="162" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">1</text>
  <rect x="152" y="182" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="179" y="216" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">1</text>

  <!-- d=1: (0,1)=2 (1,2)=2 (2,3)=2  red -->
  <rect x="98" y="74" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="108" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">2</text>
  <rect x="152" y="128" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="179" y="162" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">2</text>
  <rect x="206" y="182" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="216" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">2</text>

  <!-- d=2: (0,2)=3 (1,3)=3  blue -->
  <rect x="152" y="74" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="179" y="108" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">3</text>
  <rect x="206" y="128" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="162" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">3</text>

  <!-- d=3: (0,3)=4  green -->
  <rect x="206" y="74" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="108" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- diagonal direction hint arrow -->
  <path d="M 60 92 L 240 200" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 4" opacity="0.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="258" text-anchor="middle" font-size="10.5" fill="#555">同色格 = 同一条 ↘ 对角线，值须全部相等</text>

  <!-- ===== Panel B: the reduction ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 只需比「左上邻居」</text>

  <!-- 2x2 mini grid, cell 62x62, origin (370,92) -->
  <!-- (i-1,j-1) orange highlight -->
  <rect x="370" y="92" width="62" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="401" y="120" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <text x="401" y="140" text-anchor="middle" font-size="9" fill="#d6a040">(i-1,j-1)</text>

  <!-- (i-1,j) plain -->
  <rect x="432" y="92" width="62" height="62" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="463" y="128" text-anchor="middle" font-size="13" fill="#999">·</text>

  <!-- (i,j-1) plain -->
  <rect x="370" y="154" width="62" height="62" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="401" y="190" text-anchor="middle" font-size="13" fill="#999">·</text>

  <!-- (i,j) red highlight -->
  <rect x="432" y="154" width="62" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="463" y="182" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <text x="463" y="202" text-anchor="middle" font-size="9" fill="#b85450">(i,j)</text>

  <!-- arrow from (i,j) to (i-1,j-1) -->
  <path d="M 452 174 L 412 134" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="430" y="240" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">要求 b == a</text>
  <text x="430" y="258" text-anchor="middle" font-size="10.5" fill="#555">matrix[i][j] == matrix[i-1][j-1]</text>

  <!-- summary box -->
  <rect x="300" y="276" width="248" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="424" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">无需枚举每条对角线</text>
  <text x="424" y="316" text-anchor="middle" font-size="10.5" fill="#555">每个格只跟左上角比一次</text>
  <text x="424" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a">全部相等 ⇔ Toeplitz 矩阵</text>

  <!-- legend for panel A colors -->
  <rect x="40" y="280" width="248" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="10.5" fill="#d6a040" font-weight="bold">对角线取值（示例 1）</text>
  <text x="60" y="318" font-size="10.5" fill="#555">[9] · [5,5] · [1,1,1] · [2,2,2] · [3,3] · [4]</text>
  <text x="60" y="336" font-size="10.5" fill="#4a7a3a">每条括号内都相等 → true</text>
</svg>
