<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    同一张 Teams 表连接两次（别名 h / g）
  </text>

  <!-- Matchs table -->
  <rect x="20" y="90" width="140" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">Matchs</text>
  <line x1="20" y1="120" x2="160" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="138" font-size="11" fill="#333" filter="url(#rough2)">match_id</text>
  <rect x="20" y="144" width="140" height="20" fill="#fff8e1" opacity="0.85" filter="url(#rough2)"/>
  <text x="34" y="158" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">host_team</text>
  <rect x="20" y="164" width="140" height="20" fill="#fce4ec" opacity="0.85" filter="url(#rough2)"/>
  <text x="34" y="178" font-size="11" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">guest_team</text>
  <text x="34" y="198" font-size="11" fill="#333" filter="url(#rough2)">host_goals</text>
  <text x="34" y="216" font-size="11" fill="#333" filter="url(#rough2)">guest_goals</text>

  <!-- Teams table -->
  <rect x="200" y="90" width="130" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Teams（引用×2）</text>
  <line x1="200" y1="120" x2="330" y2="120" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="214" y="138" font-size="11" fill="#333" filter="url(#rough2)">team_id</text>
  <text x="214" y="158" font-size="11" fill="#333" filter="url(#rough2)">team_name</text>
  <text x="214" y="184" font-size="10" fill="#4a7a3a" font-style="italic" filter="url(#rough2)">别名 h → 取主队名</text>
  <text x="214" y="200" font-size="10" fill="#4a7a3a" font-style="italic" filter="url(#rough2)">别名 g → 取客队名</text>

  <!-- 结果 table -->
  <rect x="370" y="90" width="150" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">结果</text>
  <line x1="370" y1="120" x2="520" y2="120" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="384" y="138" font-size="11" fill="#333" filter="url(#rough2)">match_id</text>
  <rect x="370" y="144" width="150" height="20" fill="#fff8e1" opacity="0.85" filter="url(#rough2)"/>
  <text x="384" y="158" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">host_team（名）</text>
  <rect x="370" y="164" width="150" height="20" fill="#fce4ec" opacity="0.85" filter="url(#rough2)"/>
  <text x="384" y="178" font-size="11" fill="#7a3a3a" font-weight="bold" filter="url(#rough2)">guest_team（名）</text>
  <text x="384" y="198" font-size="11" fill="#333" filter="url(#rough2)">host_goals</text>
  <text x="384" y="216" font-size="11" fill="#333" filter="url(#rough2)">guest_goals</text>

  <!-- arrows Matchs -> Teams -->
  <path d="M160,154 L198,154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="179" y="148" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">host_team=team_id</text>

  <path d="M160,174 L198,174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="179" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">guest_team=team_id</text>

  <!-- arrow Teams -> 结果 -->
  <path d="M330,150 L368,150" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="349" y="144" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">team_name 装入</text>

  <!-- note -->
  <rect x="55" y="265" width="430" height="68" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">关键：Teams 只有一张物理表，却被 JOIN 两次。</text>
  <text x="270" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">靠别名 h（取主队名）与 g（取客队名）区分两份副本，</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再把 team_name 重命名为 host_team / guest_team 输出。</text>
</svg>
