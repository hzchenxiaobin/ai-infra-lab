<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：LEFT JOIN 带日期 → GROUP BY → 加权平均 → 兜底</text>

  <!-- ① LEFT JOIN -->
  <rect x="50" y="44" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="62" font-size="11.5" fill="#446688" font-weight="bold">① LEFT JOIN 带日期区间条件</text>
  <text x="64" y="80" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">FROM Prices p LEFT JOIN UnitsSold u</text>
  <text x="64" y="94" font-size="9.5" fill="#333" font-family="'Comic Sans MS', monospace">ON p.product_id = u.product_id AND u.purchase_date BETWEEN p.start_date AND p.end_date</text>
  <text x="64" y="104" font-size="9.5" fill="#888">→ 每笔销售匹配其价格段（区间不重叠→一一对应）；无销售产品保留 NULL 行</text>

  <path d="M 290 110 L 290 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② GROUP BY -->
  <rect x="50" y="132" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="150" font-size="11.5" fill="#4a7a3a" font-weight="bold">② GROUP BY p.product_id</text>
  <text x="64" y="168" font-size="10" fill="#888">→ 按产品分组，每组含该产品所有匹配的 (price, units) 行</text>

  <path d="M 290 182 L 290 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 加权平均 + ROUND -->
  <rect x="50" y="204" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="222" font-size="11.5" fill="#d6a040" font-weight="bold">③ 加权平均 + ROUND</text>
  <text x="64" y="240" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">ROUND(SUM(p.price * u.units) / SUM(u.units), 2) AS average_price</text>
  <text x="64" y="254" font-size="9.5" fill="#888">→ 总收入 ÷ 总销量 = 加权均价；ROUND 保留两位</text>

  <path d="M 290 262 L 290 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ IFNULL 兜底 -->
  <rect x="50" y="284" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="302" font-size="11.5" fill="#b85450" font-weight="bold">④ IFNULL 兜底无售出产品</text>
  <text x="64" y="320" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">IFNULL(ROUND(..., 2), 0) → 无销售时 SUM(NULL)=NULL → 0</text>

  <path d="M 290 334 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出预览 -->
  <text x="40" y="366" font-size="11" fill="#888">输出结果</text>
  <rect x="190" y="354" width="200" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="190" y1="378" x2="390" y2="378" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="354" x2="290" y2="422" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="371" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">product_id</text>
  <text x="340" y="371" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">average_price</text>
  <text x="240" y="394" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="340" y="394" text-anchor="middle" font-size="10.5" fill="#333">6.96</text>
  <text x="240" y="410" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="340" y="410" text-anchor="middle" font-size="10.5" fill="#333">16.96</text>

  <text x="400" y="366" font-size="10" fill="#888">💡 IFNULL</text>
  <text x="400" y="380" font-size="10" fill="#888">　无售出产品</text>
  <text x="400" y="394" font-size="10" fill="#888">　→ price=0</text>
</svg>
