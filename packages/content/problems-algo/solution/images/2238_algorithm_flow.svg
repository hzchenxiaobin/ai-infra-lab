<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：去重司机 → 左连接乘客列 → 分组计数</text>

  <!-- ===== Step 1: Rides source ===== -->
  <rect x="40" y="48" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">FROM Rides</text>
  <text x="125" y="80" text-anchor="middle" font-size="8" fill="#666">ride_id, driver_id, passenger_id</text>

  <path d="M 125 90 L 125 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: DISTINCT driver_id ===== -->
  <rect x="40" y="114" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT DISTINCT driver_id</text>
  <text x="125" y="146" text-anchor="middle" font-size="8" fill="#666">取司机集合 Drivers</text>
  <text x="125" y="160" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">{7, 11}</text>

  <path d="M 125 172 L 125 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: LEFT JOIN ===== -->
  <rect x="30" y="196" width="190" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LEFT JOIN Rides r</text>
  <text x="125" y="228" text-anchor="middle" font-size="8" fill="#b85450">ON d.driver_id = r.passenger_id</text>
  <line x1="44" y1="234" x2="206" y2="234" stroke="#f0d0d0" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="248" text-anchor="middle" font-size="8" fill="#4a7a3a">7 → ride4, ride5</text>
  <text x="125" y="262" text-anchor="middle" font-size="8" fill="#d6a040">11 → NULL 补行</text>

  <path d="M 125 274 L 125 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: GROUP BY + COUNT ===== -->
  <rect x="30" y="298" width="190" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">GROUP BY d.driver_id</text>
  <text x="125" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">COUNT(r.ride_id) AS cnt</text>
  <line x1="44" y1="338" x2="206" y2="338" stroke="#f0e0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="352" text-anchor="middle" font-size="8" fill="#666">数非空 ride_id（NULL 行计 0）</text>
  <text x="125" y="366" text-anchor="middle" font-size="7" fill="#b85450">⚠ COUNT(*) 会让 11 误得 1</text>

  <path d="M 125 376 L 125 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: result ===== -->
  <rect x="40" y="400" width="170" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="416" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">结果（任意顺序）</text>
  <text x="80" y="434" font-size="9" fill="#4a7a3a" font-weight="bold">(7, 2)</text>
  <text x="150" y="434" font-size="9" fill="#d6a040" font-weight="bold">(11, 0)</text>

  <!-- ===== Right: COUNT trap callout ===== -->
  <rect x="270" y="48" width="280" height="180" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="410" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ LEFT JOIN + COUNT 陷阱</text>
  <line x1="284" y1="76" x2="536" y2="76" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="286" y="94" font-size="9" fill="#666" font-weight="bold">driver 11 无匹配时，LEFT JOIN 补一行：</text>
  <rect x="290" y="102" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="117" font-size="9" fill="#b85450">d.driver_id=11</text>
  <text x="450" y="117" font-size="9" fill="#999">r.* = NULL</text>

  <text x="286" y="142" font-size="9" fill="#b85450" font-weight="bold">COUNT(*) → 1（错！数了 NULL 行）</text>
  <text x="286" y="158" font-size="8" fill="#888">把补出的全 NULL 行也算作一行</text>

  <text x="286" y="180" font-size="9" fill="#4a7a3a" font-weight="bold">COUNT(r.ride_id) → 0（对！数非空）</text>
  <text x="286" y="196" font-size="8" fill="#888">r.ride_id 为 NULL 不计入 → 11 得 0</text>
  <text x="286" y="212" font-size="8" fill="#4a7a3a">✓ 口诀：LEFT JOIN 计数用 COUNT(列)</text>

  <!-- ===== Right bottom: SQL skeleton ===== -->
  <rect x="270" y="244" width="280" height="202" fill="#f4f8fc" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SQL 骨架</text>
  <line x1="284" y1="270" x2="536" y2="270" stroke="#dde6f0" stroke-width="1" filter="url(#rough2)"/>

  <text x="288" y="288" font-size="9" fill="#446688" font-family="monospace">SELECT d.driver_id,</text>
  <text x="288" y="304" font-size="9" fill="#b85450" font-weight="bold" font-family="monospace">       COUNT(r.ride_id) AS cnt</text>
  <text x="288" y="320" font-size="9" fill="#666" font-family="monospace">FROM (SELECT DISTINCT driver_id</text>
  <text x="288" y="336" font-size="9" fill="#666" font-family="monospace">      FROM Rides) d</text>
  <text x="288" y="352" font-size="9" fill="#b85450" font-weight="bold" font-family="monospace">LEFT JOIN Rides r</text>
  <text x="288" y="368" font-size="9" fill="#b85450" font-weight="bold" font-family="monospace">  ON d.driver_id = r.passenger_id</text>
  <text x="288" y="384" font-size="9" fill="#d6a040" font-weight="bold" font-family="monospace">GROUP BY d.driver_id;</text>

  <text x="288" y="406" font-size="8" fill="#888">→ 去重司机 / 左连接保 0 / 数非空列</text>
  <text x="288" y="424" font-size="8" fill="#4a7a3a">三步合一，cnt=0 自然落地</text>
</svg>
