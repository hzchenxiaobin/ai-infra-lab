<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">「好数字」判定：只看 i−k 与 i+k 两处，越界方向视为 −∞</text>

  <text x="102" y="58" text-anchor="end" font-size="11" fill="#888">nums =</text>
  <rect x="110" y="40" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="160" y="40" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="210" y="40" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="58" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="260" y="40" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="310" y="40" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="40" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="130" y="80" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="180" y="80" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="230" y="80" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="280" y="80" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="330" y="80" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="380" y="80" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="440" y="58" font-size="11" fill="#888">k = 2</text>

  <text x="40" y="106" font-size="11" fill="#555" font-weight="bold">判定规则：nums[i] 需同时严格大于 nums[i−k] 与 nums[i+k]（存在才比较）</text>

  <rect x="55" y="122" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="143" text-anchor="middle" font-size="12" fill="#333">nums[i−k]</text>
  <rect x="215" y="122" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i]</text>
  <rect x="355" y="122" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="143" text-anchor="middle" font-size="12" fill="#333">nums[i+k]</text>

  <path d="M 213 139 L 168 139" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&gt;</text>
  <path d="M 307 139 L 352 139" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&gt;</text>

  <rect x="55" y="182" width="180" height="36" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="145" y="197" text-anchor="middle" font-size="10" fill="#555">i−k &lt; 0：左邻居不存在</text>
  <text x="145" y="211" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 当作 −∞，比较恒真</text>
  <rect x="285" y="182" width="180" height="36" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="375" y="197" text-anchor="middle" font-size="10" fill="#555">i+k ≥ n：右邻居不存在</text>
  <text x="375" y="211" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 当作 −∞，比较恒真</text>

  <text x="40" y="242" font-size="11" fill="#555" font-weight="bold">示例逐下标判定（k = 2，绿 ✓ = 好数字）</text>

  <rect x="55" y="250" width="64" height="44" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="87" y="266" text-anchor="middle" font-size="10" fill="#555">i=0</text>
  <text x="87" y="284" text-anchor="middle" font-size="10" fill="#b85450">✗ 1≤2</text>
  <rect x="131" y="250" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="266" text-anchor="middle" font-size="10" fill="#555">i=1</text>
  <text x="163" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">✓ 3&gt;1 无左邻</text>
  <rect x="207" y="250" width="64" height="44" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="239" y="266" text-anchor="middle" font-size="10" fill="#555">i=2</text>
  <text x="239" y="284" text-anchor="middle" font-size="10" fill="#b85450">✗ 2≤5</text>
  <rect x="283" y="250" width="64" height="44" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="266" text-anchor="middle" font-size="10" fill="#555">i=3</text>
  <text x="315" y="284" text-anchor="middle" font-size="10" fill="#b85450">✗ 1≤3</text>
  <rect x="359" y="250" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="266" text-anchor="middle" font-size="10" fill="#555">i=4</text>
  <text x="391" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">✓ 5&gt;2 无右邻</text>
  <rect x="435" y="250" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467" y="266" text-anchor="middle" font-size="10" fill="#555">i=5</text>
  <text x="467" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">✓ 4&gt;1 无右邻</text>

  <rect x="55" y="310" width="444" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="277" y="328" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">好数字之和 = 3 + 5 + 4 = 12</text>
  <text x="277" y="343" text-anchor="middle" font-size="10" fill="#555">好数字：nums[1]=3、nums[4]=5、nums[5]=4</text>
</svg>
