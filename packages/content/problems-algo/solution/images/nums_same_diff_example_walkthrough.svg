<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3, k = 7 → [181, 292, 707, 818, 929]</text>

  <!-- Column headers -->
  <text x="80" y="50" text-anchor="middle" font-size="10" fill="#aaa">第1位</text>
  <text x="190" y="50" text-anchor="middle" font-size="10" fill="#aaa">第2位</text>
  <text x="300" y="50" text-anchor="middle" font-size="10" fill="#aaa">第3位</text>
  <text x="410" y="50" text-anchor="middle" font-size="10" fill="#aaa">结果</text>

  <!-- ===== Valid path rows ===== -->
  <!-- Row 1: 1 -> 8 -> 1 = 181 -->
  <rect x="62" y="58" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 98 73 L 172 73" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="68" text-anchor="middle" font-size="9" fill="#888">+7</text>
  <rect x="172" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <path d="M 208 73 L 282 73" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="68" text-anchor="middle" font-size="9" fill="#888">−7</text>
  <rect x="282" y="58" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 318 73 L 372 73" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="58" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="78" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">181</text>

  <!-- Row 2: 2 -> 9 -> 2 = 292 -->
  <rect x="62" y="96" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 98 111 L 172 111" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="106" text-anchor="middle" font-size="9" fill="#888">+7</text>
  <rect x="172" y="96" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <path d="M 208 111 L 282 111" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="106" text-anchor="middle" font-size="9" fill="#888">−7</text>
  <rect x="282" y="96" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 318 111 L 372 111" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="96" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="116" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">292</text>

  <!-- Row 3: 7 -> 0 -> 7 = 707 -->
  <rect x="62" y="134" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <path d="M 98 149 L 172 149" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="144" text-anchor="middle" font-size="9" fill="#888">−7</text>
  <rect x="172" y="134" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <path d="M 208 149 L 282 149" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="144" text-anchor="middle" font-size="9" fill="#888">+7</text>
  <rect x="282" y="134" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <path d="M 318 149 L 372 149" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="134" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="154" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">707</text>

  <!-- Row 4: 8 -> 1 -> 8 = 818 -->
  <rect x="62" y="172" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <path d="M 98 187 L 172 187" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="182" text-anchor="middle" font-size="9" fill="#888">−7</text>
  <rect x="172" y="172" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 208 187 L 282 187" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="182" text-anchor="middle" font-size="9" fill="#888">+7</text>
  <rect x="282" y="172" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <path d="M 318 187 L 372 187" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="172" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="192" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">818</text>

  <!-- Row 5: 9 -> 2 -> 9 = 929 -->
  <rect x="62" y="210" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <path d="M 98 225 L 172 225" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="220" text-anchor="middle" font-size="9" fill="#888">−7</text>
  <rect x="172" y="210" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 208 225 L 282 225" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="220" text-anchor="middle" font-size="9" fill="#888">+7</text>
  <rect x="282" y="210" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <path d="M 318 225 L 372 225" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="210" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="230" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">929</text>

  <!-- Dead ends note -->
  <rect x="40" y="260" width="520" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="280" font-size="12" fill="#b85450" font-weight="bold">首位 3 / 4 / 5 / 6：d + k ≥ 10 且 d − k &lt; 0 → 两个分支均越界，直接剪枝（无合法数字）</text>
  <text x="56" y="298" font-size="11" fill="#888">例：d=3 → 3+7=10（✗）, 3−7=−4（✗）；d=6 → 6+7=13（✗）, 6−7=−1（✗）</text>

  <!-- Final result -->
  <rect x="40" y="324" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="349" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最终答案 = [181, 292, 707, 818, 929]（5 个，与示例一致 ✓）</text>

  <!-- count note -->
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#888">每条路径唯一确定一个数字；答案总数 ≤ 9 × 2^(n−1)，本题 n=3 最多 36 个，实际 5 个</text>
</svg>
