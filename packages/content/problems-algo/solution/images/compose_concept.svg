<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：复合函数把一串函数「串成管道」，从右向左依次执行</text>

  <!-- direction hint -->
  <text x="310" y="56" text-anchor="middle" font-size="11" fill="#888">fn(x) = f1(f2(f3(x)))  ——  数据从右端进入，逐层向左流</text>

  <!-- pipeline boxes: output | f1 | f2 | f3 | input x -->
  <!-- input x=4 -->
  <rect x="500" y="90" width="80" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="540" y="110" text-anchor="middle" font-size="11" fill="#888">输入</text>
  <text x="540" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x = 4</text>

  <!-- f3 -->
  <rect x="380" y="90" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f3</text>
  <text x="425" y="128" text-anchor="middle" font-size="12" fill="#333">x → 2·x</text>

  <!-- f2 -->
  <rect x="250" y="90" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="295" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f2</text>
  <text x="295" y="128" text-anchor="middle" font-size="12" fill="#333">x → x²</text>

  <!-- f1 -->
  <rect x="120" y="90" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f1</text>
  <text x="165" y="128" text-anchor="middle" font-size="12" fill="#333">x → x+1</text>

  <!-- output -->
  <rect x="20" y="90" width="80" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出</text>
  <text x="60" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">65</text>

  <!-- arrows leftward between boxes -->
  <path d="M 500 115 L 472 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <path d="M 380 115 L 342 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <path d="M 250 115 L 212 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="231" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">64</text>

  <path d="M 120 115 L 102 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="111" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">65</text>

  <!-- big direction arrow under pipeline -->
  <path d="M 540 200 L 60 200" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="310" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">执行方向：右 → 左（先 f3，再 f2，最后 f1）</text>

  <!-- empty case -->
  <rect x="40" y="240" width="540" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="13" fill="#4a7a3a" font-weight="bold">边界：functions = []（空列表）</text>
  <text x="60" y="286" font-size="12" fill="#333">复合函数退化为「恒等函数」 id(x) = x —— 空折叠的初值原样返回</text>
  <text x="60" y="302" font-size="11" fill="#888">数学上恒等函数是复合运算的单位元：f ∘ id = id ∘ f = f</text>

  <!-- key insight -->
  <rect x="40" y="324" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一句话：复合 = 右折叠 reduceRight，以 x 为初值，acc = f(acc)</text>
  <text x="310" y="361" text-anchor="middle" font-size="11" fill="#888">数组序 [f1,f2,…,fn] 对应数学记号 f1 ∘ f2 ∘ … ∘ fn，作用顺序与书写顺序相反</text>

  <text x="310" y="388" text-anchor="middle" font-size="11" fill="#888">⚠️ 勿与 pipe 混淆：pipe 是左→右执行，复合是右→左执行</text>
</svg>
