<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：DATE_FORMAT 用格式符把日期格式化为 "星期, 月份 日, 年"</text>

  <!-- ===== Input: Days table ===== -->
  <text x="160" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Days 表（输入）</text>
  <rect x="80" y="58" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">day (date 类型)</text>
  <rect x="80" y="78" width="160" height="24" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2022-04-12</text>

  <!-- arrow down to DATE_FORMAT -->
  <path d="M160 102 L160 120" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="182" y="114" font-size="8.5" fill="#446688" font-weight="bold">DATE_FORMAT</text>

  <!-- ===== Format string ===== -->
  <rect x="40" y="124" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-family="monospace" font-weight="bold">'%W, %M %e, %Y'</text>

  <!-- arrow down to specifier decomposition -->
  <path d="M160 156 L160 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="232" y="166" font-size="8" fill="#888">拆解格式串</text>

  <!-- ===== 4 specifier columns with arrows to values ===== -->
  <!-- %W -->
  <rect x="34" y="172" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="189" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" font-family="monospace">%W</text>
  <path d="M62 198 L62 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="34" y="216" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="231" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Tuesday</text>
  <text x="62" y="250" text-anchor="middle" font-size="7.5" fill="#888">星期全称</text>

  <!-- literal ", " -->
  <text x="102" y="189" font-size="10" fill="#888" font-family="monospace">,</text>

  <!-- %M -->
  <rect x="110" y="172" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="monospace">%M</text>
  <path d="M138 198 L138 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="110" y="216" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="138" y="231" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">April</text>
  <text x="138" y="250" text-anchor="middle" font-size="7.5" fill="#888">月份全称</text>

  <!-- literal " " -->
  <text x="178" y="189" font-size="10" fill="#888" font-family="monospace">␣</text>

  <!-- %e -->
  <rect x="186" y="172" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" font-family="monospace">%e</text>
  <path d="M214 198 L214 214" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="186" y="216" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="214" y="231" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">12</text>
  <text x="214" y="250" text-anchor="middle" font-size="7.5" fill="#888">日，无前导零</text>

  <!-- literal ", " -->
  <text x="254" y="189" font-size="10" fill="#888" font-family="monospace">,</text>

  <!-- %Y -->
  <rect x="262" y="172" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">%Y</text>
  <path d="M290 198 L290 214" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="262" y="216" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="231" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2022</text>
  <text x="290" y="250" text-anchor="middle" font-size="7.5" fill="#888">4 位年份</text>

  <!-- combine arrow -->
  <path d="M160 260 L160 280" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="274" font-size="8.5" fill="#888">拼接</text>

  <!-- ===== Output ===== -->
  <rect x="40" y="284" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="302" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">输出（字符串）</text>
  <text x="160" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Tuesday, April 12, 2022</text>

  <!-- ===== Right: format specifier reference ===== -->
  <rect x="320" y="50" width="300" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">DATE_FORMAT 常用格式符</text>
  <line x1="335" y1="76" x2="605" y2="76" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- table header -->
  <text x="338" y="92" font-size="8.5" fill="#888" font-weight="bold">符</text>
  <text x="376" y="92" font-size="8.5" fill="#888" font-weight="bold">含义</text>
  <text x="476" y="92" font-size="8.5" fill="#888" font-weight="bold">示例值</text>
  <text x="556" y="92" font-size="8.5" fill="#888" font-weight="bold">备注</text>

  <text x="338" y="110" font-size="9" fill="#446688" font-family="monospace" font-weight="bold">%W</text>
  <text x="376" y="110" font-size="8.5" fill="#333">星期全称</text>
  <text x="476" y="110" font-size="8.5" fill="#446688" font-weight="bold">Tuesday</text>
  <text x="556" y="110" font-size="8" fill="#888">Sunday..Saturday</text>

  <text x="338" y="128" font-size="9" fill="#4a7a3a" font-family="monospace" font-weight="bold">%M</text>
  <text x="376" y="128" font-size="8.5" fill="#333">月份全称</text>
  <text x="476" y="128" font-size="8.5" fill="#4a7a3a" font-weight="bold">April</text>
  <text x="556" y="128" font-size="8" fill="#888">January..December</text>

  <text x="338" y="146" font-size="9" fill="#d6a040" font-family="monospace" font-weight="bold">%e</text>
  <text x="376" y="146" font-size="8.5" fill="#333">日（无前导零）</text>
  <text x="476" y="146" font-size="8.5" fill="#d6a040" font-weight="bold">12</text>
  <text x="556" y="146" font-size="8" fill="#888">0..31，9 不写成 09</text>

  <text x="338" y="164" font-size="9" fill="#b85450" font-family="monospace" font-weight="bold">%Y</text>
  <text x="376" y="164" font-size="8.5" fill="#333">年（4 位）</text>
  <text x="476" y="164" font-size="8.5" fill="#b85450" font-weight="bold">2022</text>
  <text x="556" y="164" font-size="8" fill="#888">如 2022</text>

  <line x1="338" y1="172" x2="605" y2="172" stroke="#446688" stroke-width="0.4" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="338" y="188" font-size="9" fill="#888" font-family="monospace" font-weight="bold">%d</text>
  <text x="376" y="188" font-size="8.5" fill="#333">日（有前导零）</text>
  <text x="476" y="188" font-size="8.5" fill="#888">09</text>
  <text x="556" y="188" font-size="8" fill="#b85450">⚠ 本题不能用</text>

  <text x="338" y="206" font-size="9" fill="#888" font-family="monospace" font-weight="bold">%y</text>
  <text x="376" y="206" font-size="8.5" fill="#333">年（2 位）</text>
  <text x="476" y="206" font-size="8.5" fill="#888">22</text>
  <text x="556" y="206" font-size="8" fill="#b85450">⚠ 本题不能用</text>

  <text x="338" y="224" font-size="9" fill="#888" font-family="monospace" font-weight="bold">%w</text>
  <text x="376" y="224" font-size="8.5" fill="#333">星期（数字）</text>
  <text x="476" y="224" font-size="8.5" fill="#888">2</text>
  <text x="556" y="224" font-size="8" fill="#888">0=Sunday..6=Saturday</text>

  <!-- ===== Right bottom: key insights ===== -->
  <rect x="320" y="262" width="300" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察</text>
  <line x1="335" y1="288" x2="605" y2="288" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="338" y="306" font-size="9" fill="#333">• <tspan fill="#446688" font-weight="bold">%W / %M</tspan> 输出英文全称，首字母大写</text>
  <text x="338" y="324" font-size="9" fill="#333">• <tspan fill="#d6a040" font-weight="bold">%e</tspan> 日无前导零：9 输出 "9" 非 "09"</text>
  <text x="338" y="342" font-size="9" fill="#333">  → 本题期望 "August 9" 而非 "August 09"</text>
  <text x="338" y="360" font-size="9" fill="#333">• 格式串中 <tspan fill="#888">逗号、空格</tspan> 是字面量原样输出</text>
  <text x="338" y="378" font-size="9" fill="#333">• 输出对大小写敏感（April 非 april）</text>
  <text x="338" y="396" font-size="9" fill="#b85450">⚠ %d 会补零、%y 只 2 位，均不符题意</text>
  <text x="338" y="414" font-size="9" fill="#333">• 列名保留 <tspan font-weight="bold">day</tspan>，类型由 date 变 string</text>

  <!-- bottom SQL snippet -->
  <rect x="20" y="432" width="600" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="452" font-size="10" fill="#446688" font-family="monospace">SELECT DATE_FORMAT(day, '%W, %M %e, %Y') AS day FROM Days;</text>
</svg>
