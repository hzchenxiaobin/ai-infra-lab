<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：按奇偶 + n=1 特例直接返回</text>

  <!-- ① Input -->
  <rect x="195" y="42" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 输入 n</text>
  <line x1="270" y1="78" x2="270" y2="98" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 1: n == 1 ? -->
  <polygon points="270,102 376,150 270,198 164,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n == 1 ?</text>
  <text x="270" y="164" text-anchor="middle" font-size="9.5" fill="#888">（整圆已是一等分）</text>

  <!-- Yes branch (left) → return 0 -->
  <line x1="164" y1="150" x2="112" y2="150" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="138" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="22" y="132" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="67" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② return</text>
  <text x="67" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- No branch (down) -->
  <line x1="270" y1="198" x2="270" y2="220" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ◇ Diamond 2: n even ? -->
  <polygon points="270,224 376,272 270,320 164,272" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n 为偶数 ?</text>
  <text x="270" y="286" text-anchor="middle" font-size="9.5" fill="#888">（n % 2 == 0）</text>

  <!-- Yes branch (right) → return n/2 -->
  <line x1="376" y1="272" x2="428" y2="272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="428" y="254" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="476" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ return</text>
  <text x="476" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n / 2</text>
  <text x="476" y="302" text-anchor="middle" font-size="8.5" fill="#888">n/2 条直径</text>

  <!-- No branch (down) → return n -->
  <line x1="270" y1="320" x2="270" y2="338" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="332" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="195" y="340" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="357" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ return n（n 条半径）</text>
</svg>
