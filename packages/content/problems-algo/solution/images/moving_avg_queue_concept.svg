<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：固定窗口 = 队列 + 增量和</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">窗口满后「一进一出」，sum 做增量更新而非重新求和</text>

  <!-- ===== 顶部：数据流 ===== -->
  <text x="60" y="82" font-size="12" fill="#444" font-weight="bold">数据流（新值从右侧进入）：</text>
  <g font-size="13">
    <text x="200" y="84" font-size="11" fill="#888">…</text>
    <rect x="220" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="87" text-anchor="middle" fill="#333">old</text>
    <rect x="264" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="284" y="87" text-anchor="middle" fill="#333">…</text>
    <rect x="308" y="68" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="87" text-anchor="middle" fill="#4a7a3a" font-weight="bold">val</text>
  </g>
  <!-- 进入箭头 -->
  <line x1="356" y1="82" x2="386" y2="82" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="362" y="74" font-size="10" fill="#4a7a3a" font-weight="bold">next(val)</text>

  <!-- ===== 中部：固定窗口（队列） ===== -->
  <text x="60" y="146" font-size="12" fill="#444" font-weight="bold">固定窗口（size = 3，队首←队尾）：</text>

  <!-- 队列容器 -->
  <rect x="110" y="156" width="180" height="50" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="118" y="150" font-size="10" fill="#888">队首（最老，先出）</text>
  <text x="262" y="150" font-size="10" fill="#888" text-anchor="end">队尾（最新，后入）</text>

  <!-- 三个格子 -->
  <rect x="120" y="166" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="187" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">old</text>

  <rect x="175" y="166" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="187" text-anchor="middle" font-size="13" fill="#333">b</text>

  <rect x="230" y="166" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="187" text-anchor="middle" font-size="13" fill="#333">c</text>

  <!-- 出队箭头 -->
  <line x1="120" y1="182" x2="78" y2="182" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="64" y="174" font-size="10" fill="#b85450" font-weight="bold">pop</text>
  <text x="60" y="200" font-size="10" fill="#b85450">满则出队</text>

  <!-- 入队箭头（指向队尾右侧的下一个空位） -->
  <line x1="300" y1="182" x2="328" y2="182" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="312" y="174" font-size="10" fill="#4a7a3a" font-weight="bold">push</text>

  <!-- ===== 右侧：sum 状态 ===== -->
  <rect x="380" y="156" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sum（窗口之和）</text>
  <text x="455" y="196" text-anchor="middle" font-size="12" fill="#333">sum += val − old</text>

  <!-- 窗口 → sum 的关联虚线 -->
  <line x1="290" y1="182" x2="378" y2="182" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== 底部：增量更新规则 ===== -->
  <text x="60" y="244" font-size="12" fill="#444" font-weight="bold">增量更新规则：</text>

  <rect x="60" y="252" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="74" y="272" font-size="11" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">窗口未满：</tspan> sum += val（无元素出队，只增不减）</text>

  <rect x="60" y="286" width="470" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="74" y="306" font-size="11" fill="#333"><tspan font-weight="bold" fill="#b85450">窗口已满：</tspan> sum = sum − old + val（最老出队、最新入队，一进一出）</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="50" y="330" width="490" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="64" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="64" y="368" font-size="10" fill="#555">① 固定窗口的「先进先出」= 队列本职，push/pop 一一对应窗口轮换</text>
  <text x="64" y="382" font-size="10" fill="#555">② 相邻两次 next 窗口只差「一进一出」，sum 可 O(1) 增量更新，无需重算</text>
</svg>
