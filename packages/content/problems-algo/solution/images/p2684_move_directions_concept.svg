<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：只能向右移一格，dp[r][c] 只依赖右一列</text>

  <!-- grid cells: current col c and next col c+1 -->
  <!-- current cell (r,c) -->
  <rect x="120" y="160" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(r, c)</text>
  <text x="155" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur</text>

  <!-- col label -->
  <text x="155" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">列 c</text>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">列 c+1</text>

  <!-- next col cells: (r-1,c+1), (r,c+1), (r+1,c+1) -->
  <rect x="285" y="100" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(r-1, c+1)</text>
  <text x="320" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">右上</text>

  <rect x="285" y="160" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(r, c+1)</text>
  <text x="320" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">右</text>

  <rect x="285" y="220" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(r+1, c+1)</text>
  <text x="320" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">右下</text>

  <!-- three arrows from (r,c) to next col -->
  <path d="M 190 175 Q 240 140 285 125" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 185 L 285 185" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 195 Q 240 230 285 245" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- constraint note -->
  <rect x="400" y="100" width="145" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="472" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">移动条件</text>
  <text x="472" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">grid[next]</text>
  <text x="472" y="153" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">&gt; grid[cur]</text>
  <text x="472" y="166" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(严格大于)</text>

  <!-- DP dependency note -->
  <rect x="30" y="270" width="515" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="287" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">无环 + 只向右 → 按列从右往左 DP</text>
  <text x="287" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[r][c] = max( 1 + dp[nr][c+1] ) ，nr ∈ {r-1, r, r+1} 且值更大</text>
  <text x="287" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">只读右一列 → 滚动 1D 数组 O(m) 空间</text>
</svg>
