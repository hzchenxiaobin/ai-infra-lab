<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：XOR 自逆 + 枚举 XOR 差距 x</text>

  <!-- Row 1: two points and gaps -->
  <rect x="56" y="42" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="106" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">点 A</text>
  <text x="106" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">(x₁, y₁)</text>

  <rect x="444" y="42" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="494" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">点 B</text>
  <text x="494" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(x₂, y₂)</text>

  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x 差：x₁ ⊕ x₂ = x，y 差：y₁ ⊕ y₂ = k − x</text>
  <path d="M 160 64 L 440 64" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">距离 = x + y = k ≤ 100（普通加法）</text>

  <!-- Row 2: XOR involution -->
  <rect x="56" y="112" width="488" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">XOR 自逆：a ⊕ b = c ⟺ b = a ⊕ c</text>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x₂ = x₁ ⊕ x，y₂ = y₁ ⊕ (k − x)</text>
  <text x="300" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">锁定 A 与 x ⟹ 配对点 B 唯一确定</text>

  <!-- Row 3: enumeration strip -->
  <text x="300" y="228" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x、y 非负且 x + y = k ⟹ x ∈ {0, 1, 2, …, k}，至多 101 种</text>

  <rect x="70" y="240" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <rect x="166" y="240" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <rect x="262" y="240" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="302" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <rect x="358" y="240" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="398" y="261" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">…</text>
  <rect x="454" y="240" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="494" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = k</text>

  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每个 x 都把「找搭档」变成「查一个具体坐标」</text>

  <!-- Row 4: summary -->
  <rect x="56" y="310" width="488" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个点 A 只需查 k+1 个候选配对坐标（哈希表）</text>
  <text x="300" y="364" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">全平面枚举搭档 O(n²) → 查 k+1 个键 O(n·k)</text>
</svg>
