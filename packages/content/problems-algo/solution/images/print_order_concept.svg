<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三个线程并发调用，输出必须有序</text>

  <text x="100" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">线程调用（乱序）</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">期望输出（顺序）</text>

  <rect x="30" y="70" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#333">Thread A → first()</text>

  <rect x="30" y="115" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="137" text-anchor="middle" font-size="12" fill="#333">Thread B → third()</text>

  <rect x="30" y="160" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="182" text-anchor="middle" font-size="12" fill="#333">Thread C → second()</text>

  <text x="100" y="215" text-anchor="middle" font-size="11" fill="#888" font-style="italic">调用顺序不确定！</text>

  <path d="M 190 87 L 330 87" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 190 132 L 330 132" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 190 177 L 330 177" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <rect x="335" y="70" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="92" text-anchor="middle" font-size="12" fill="#333">printFirst → "first"</text>

  <path d="M 410 104 L 410 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="335" y="120" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="12" fill="#333">printSecond → "second"</text>

  <path d="M 410 154 L 410 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="335" y="170" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#333">printThird → "third"</text>

  <rect x="335" y="215" width="150" height="28" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">"firstsecondthird"</text>

  <rect x="40" y="265" width="440" height="95" fill="#fce4ec" fill-opacity="0.3" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">核心挑战</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#555">调用顺序不确定，但执行必须有序</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#555">second() 必须等 first() 完成后才能执行</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#555">third() 必须等 second() 完成后才能执行</text>
</svg>
