<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：好友图上 BFS 逐层扩展，每层 = 一个 level</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">无向图无权 → BFS 首次访问即最短距离，每弹一层 dist+1</text>

  <!-- Level dashed guide lines (vertical) -->
  <path d="M 150 60 L 150 320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 300 60 L 300 320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 450 60 L 450 320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- Level labels at top -->
  <text x="80" y="78" text-anchor="middle" font-size="11" fill="#888">起点</text>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Level 0</text>
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Level 1</text>
  <text x="450" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Level 2</text>

  <!-- Edges (drawn first, behind nodes) -->
  <!-- 0 - 1 -->
  <path d="M 150 190 L 300 140" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 0 - 2 -->
  <path d="M 150 210 L 300 260" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 1 - 3 -->
  <path d="M 320 140 L 450 190" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 2 - 3 -->
  <path d="M 320 260 L 450 210" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Node 0 (you) green -->
  <circle cx="150" cy="200" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a">你 (id)</text>

  <!-- Node 1 yellow -->
  <circle cx="310" cy="130" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="310" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040">好友</text>

  <!-- Node 2 yellow -->
  <circle cx="310" cy="270" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="275" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="310" y="305" text-anchor="middle" font-size="9.5" fill="#d6a040">好友</text>

  <!-- Node 3 orange/red -->
  <circle cx="450" cy="200" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="450" y="240" text-anchor="middle" font-size="9.5" fill="#b85450">好友的好友</text>

  <!-- BFS expansion arrow -->
  <path d="M 180 200 L 280 200" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.5"/>
  <path d="M 340 200 L 424 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.5"/>

  <!-- Bottom note -->
  <rect x="40" y="326" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#333">每层 frontier 同时出队 → dist++ → 命中 level 则收集该层好友的视频</text>
</svg>
