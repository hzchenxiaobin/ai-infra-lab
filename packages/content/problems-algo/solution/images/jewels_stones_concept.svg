<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">哈希集合：jewels 装入集合，stones 逐字查询，命中即计数</text>

  <!-- ===== jewels row ===== -->
  <text x="40" y="74" font-size="12" fill="#888">jewels:</text>
  <rect x="110" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="154" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>

  <!-- arrow: 装入集合 -->
  <path d="M 162 92 L 162 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="172" y="108" font-size="10" fill="#888">装入集合</text>

  <!-- ===== hash set ===== -->
  <text x="40" y="150" font-size="12" fill="#888">jewelSet:</text>
  <rect x="110" y="128" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="195" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">{ a, A }</text>
  <text x="292" y="150" font-size="11" fill="#4a7a3a">O(1) 查询</text>

  <!-- ===== stones row ===== -->
  <text x="40" y="210" font-size="12" fill="#888">stones:</text>
  <rect x="110" y="192" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="146" y="192" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <rect x="182" y="192" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <rect x="218" y="192" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="235" y="214" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">b</text>
  <rect x="254" y="192" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="271" y="214" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">b</text>
  <rect x="290" y="192" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="307" y="214" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">b</text>
  <rect x="326" y="192" width="34" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="343" y="214" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">b</text>

  <!-- hit/miss marks -->
  <text x="127" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="163" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="199" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="235" y="240" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <text x="271" y="240" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <text x="307" y="240" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <text x="343" y="240" text-anchor="middle" font-size="12" fill="#bbb">✗</text>

  <!-- arrow to result -->
  <path d="M 228 248 L 228 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="238" y="262" font-size="10" fill="#888">累计命中</text>

  <!-- ===== result ===== -->
  <text x="40" y="296" font-size="12" fill="#888">结果:</text>
  <rect x="110" y="278" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="300" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">count = 3</text>

  <!-- contrast note -->
  <rect x="40" y="326" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="351" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：只判「在不在」，无需 stones 频次；集合查询 O(1) 把 O(|j|·|s|) 降到 O(|j|+|s|)</text>
</svg>
