<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">糖果粉碎：三步循环直到稳定</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">标记 → 粉碎 → 下落 → 还有可粉碎？是则再来一轮</text>

  <!-- Step 1: 标记 -->
  <rect x="40" y="90" width="120" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① 标记</text>
  <text x="100" y="133" text-anchor="middle" font-size="10.5" fill="#555">行/列连续</text>
  <text x="100" y="148" text-anchor="middle" font-size="10.5" fill="#555">≥3 同值</text>
  <text x="100" y="161" text-anchor="middle" font-size="9.5" fill="#888">取负值标记</text>

  <!-- Step 2: 粉碎 -->
  <rect x="190" y="90" width="120" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="114" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">② 粉碎</text>
  <text x="250" y="133" text-anchor="middle" font-size="10.5" fill="#555">标记位</text>
  <text x="250" y="148" text-anchor="middle" font-size="10.5" fill="#555">全部视为空</text>
  <text x="250" y="161" text-anchor="middle" font-size="9.5" fill="#888">负值即空格</text>

  <!-- Step 3: 下落 -->
  <rect x="340" y="90" width="120" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">③ 下落</text>
  <text x="400" y="133" text-anchor="middle" font-size="10.5" fill="#555">每列重力</text>
  <text x="400" y="148" text-anchor="middle" font-size="10.5" fill="#555">压实到底部</text>
  <text x="400" y="161" text-anchor="middle" font-size="9.5" fill="#888">写指针 O(m)</text>

  <!-- arrows between steps -->
  <path d="M 162 127 L 188 127" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 127 L 338 127" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow down from step3 to decision -->
  <path d="M 400 166 L 400 202" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="400,208 472,244 400,280 328,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="240" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">本轮有粉碎?</text>
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#888">changed?</text>

  <!-- 是: loop back to step1 -->
  <text x="322" y="236" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <path d="M 328 244 L 100 244 L 100 166" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 否: down to return -->
  <text x="414" y="296" font-size="12" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 400 280 L 400 306" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="320" y="310" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="333" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回稳定后的 board</text>

  <!-- bottom note -->
  <rect x="40" y="310" width="250" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="165" y="327" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不变量：每轮至少粉碎一组</text>
  <text x="165" y="341" text-anchor="middle" font-size="10" fill="#888">否则循环终止（至多 O(mn) 轮）</text>
</svg>
