<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：倒水有损耗，盈余 ×(100−loss)/100 ≥ 亏缺</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">示例 1：buckets=[1,2,7]，loss=80，目标水位 v=2</text>

  <!-- Target line v=2 -->
  <line x1="40" y1="218" x2="480" y2="218" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="452" y="212" font-size="10.5" fill="#d6a040" font-weight="bold">目标 v=2</text>

  <!-- Bucket 0: water=1 (deficit) -->
  <rect x="70" y="120" width="70" height="130" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="74" y="234" width="62" height="16" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#333">桶0: 1</text>
  <text x="105" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">缺 1</text>
  <text x="105" y="286" text-anchor="middle" font-size="10" fill="#b85450">需倒出 5</text>

  <!-- Bucket 1: water=2 (balanced) -->
  <rect x="225" y="120" width="70" height="130" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="229" y="218" width="62" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333">桶1: 2</text>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">刚好</text>

  <!-- Bucket 2: water=7 (surplus) -->
  <rect x="380" y="120" width="70" height="130" fill="none" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="138" width="62" height="112" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="415" y="112" text-anchor="middle" font-size="11" fill="#333">桶2: 7</text>
  <text x="415" y="270" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">余 5</text>

  <!-- Pour arc from bucket 2 to bucket 0 -->
  <path d="M 415 138 Q 260 58 108 120" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">倒 5 升</text>

  <!-- Loss drops (spilled) -->
  <circle cx="190" cy="118" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="220" cy="112" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="300" cy="112" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="330" cy="118" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="380" y="92" font-size="10.5" fill="#b85450" font-weight="bold">洒 80% = 4</text>

  <!-- Delivered arrow into bucket 0 -->
  <path d="M 108 120 L 108 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="232" font-size="10" fill="#4a7a3a">到 20% = 1</text>

  <!-- Equation box -->
  <rect x="40" y="300" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定式：a = Σ(x−v)  ≥  b = Σ(v−x)·100/(100−loss)</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#555">a = 5  ≥  b = 1×100/20 = 5  ✓  → v=2 可行</text>
</svg>
