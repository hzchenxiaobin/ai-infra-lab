<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">网格 DP：f[i][j] = nums1 前 i 个 + nums2 前 j 个的最小最大值</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">f[i][j] = min( nxt(f[i−1][j], nums1[i−1]), nxt(f[i][j−1], nums2[j−1]) )</text>

  <!-- 左侧：2×2 网格转移图 -->
  <text x="180" y="58" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">j 增大 →</text>
  <text x="44" y="200" font-size="9.5" fill="#999" filter="url(#rough2)">i</text>
  <text x="44" y="214" font-size="9.5" fill="#999" filter="url(#rough2)">增</text>
  <text x="44" y="228" font-size="9.5" fill="#999" filter="url(#rough2)">大</text>
  <text x="44" y="242" font-size="9.5" fill="#999" filter="url(#rough2)">↓</text>

  <rect x="60" y="64" width="84" height="66" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="102" text-anchor="middle" font-size="11" fill="#9aa7b5" filter="url(#rough2)">…</text>

  <rect x="178" y="64" width="84" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="102" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">f[i−1][j]</text>

  <rect x="60" y="164" width="84" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="202" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">f[i][j−1]</text>

  <rect x="178" y="164" width="84" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="202" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">f[i][j]</text>

  <path d="M 220 132 L 220 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 146 197 L 174 197" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="36" y="252" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">↑ 从上来 = 最后一个数落在 nums1[i−1] 末位</text>
  <text x="36" y="268" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 从左来 = 最后一个数落在 nums2[j−1] 末位</text>
  <text x="36" y="286" font-size="10" fill="#777" filter="url(#rough2)">两个候选各做一次 nxt，取 min</text>

  <!-- 右侧：nxt 函数框 -->
  <rect x="286" y="64" width="216" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="82" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">nxt(x, y)：大于 x 的最小正整数</text>
  <text x="394" y="97" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">奇偶性 = y（y=0 偶，y=1 奇）</text>
  <text x="394" y="113" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">奇偶相异 → x + 1（翻奇偶）</text>
  <text x="394" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">奇偶相同 → x + 2（保奇偶）</text>
  <text x="394" y="147" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(x &amp; 1) ^ y == 1 ? x+1 : x+2</text>
  <text x="394" y="160" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每步至多 +2 ⇒ 答案 ≤ 2(m+n)+1</text>

  <!-- 右侧：哨兵框 -->
  <rect x="286" y="176" width="216" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="193" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">哨兵 f[0][0] = 0</text>
  <text x="394" y="208" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">nxt(0,1)=1 最小正奇数</text>
  <text x="394" y="221" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">nxt(0,0)=2 最小正偶数</text>

  <!-- 右侧：正确性框 -->
  <rect x="286" y="238" width="216" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="255" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">为什么只看左 / 上？</text>
  <text x="394" y="270" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">全局最大数必在归属数组末位（数组内递增）</text>
  <text x="394" y="284" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">删掉它 → 剩 (i−1,j) 或 (i,j−1) 子问题</text>
  <text x="394" y="298" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">追加 nxt(子问题最优, ·) &gt; 一切旧数，必然合法</text>

  <!-- 底部说明框 -->
  <rect x="30" y="318" width="472" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">边界 f[i][0] / f[0][j] = 另一数组为空、归属模式唯一时的单数组贪心链</text>
  <text x="266" y="346" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">流程：初始化哨兵 → 两条边界链 → 双循环填表（左/上取 min）→ 返回 f[m][n]</text>
</svg>
