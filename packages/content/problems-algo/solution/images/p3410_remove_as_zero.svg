<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">核心观察：删除 X ≈ 把 X 的位置置 0（免费桥接）</text>

  <!-- Row 1: original array -->
  <text x="20" y="48" font-size="11.5" fill="#666" filter="url(#rough2)">原数组（要删除的 X = −2，共 2 处）：</text>

  <rect x="84" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="135" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="56" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="209" y="75" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">−2</text>
  <rect x="237" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="288" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="339" y="56" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="362" y="75" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">−2</text>
  <rect x="390" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- arrows: removed positions -> zeros -->
  <line x1="209" y1="88" x2="209" y2="122" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <line x1="362" y1="88" x2="362" y2="122" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="219" y="110" font-size="10.5" fill="#b85450" filter="url(#rough2)">置 0</text>

  <!-- Row 2: zeros view -->
  <text x="20" y="116" font-size="11.5" fill="#666" filter="url(#rough2)">置 0 后（线段树里真正做的事）：</text>

  <rect x="84" y="126" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="135" y="126" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="145" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">2</text>
  <rect x="186" y="126" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="209" y="145" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="237" y="126" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">−1</text>
  <rect x="288" y="126" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="311" y="145" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">3</text>
  <rect x="339" y="126" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="362" y="145" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">0</text>
  <rect x="390" y="126" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="413" y="145" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">3</text>

  <path d="M 137,162 L 137,172 L 434,172 L 434,162" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 + 0 + (−1) + 3 + 0 + 3 = 7　← 子数组跨过 0，免费桥接！</text>

  <!-- arrow rows 2 -> 3 -->
  <line x1="300" y1="198" x2="300" y2="234" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="220" font-size="10.5" fill="#666" filter="url(#rough2)">拿掉 0</text>

  <!-- Row 3: really removed -->
  <text x="20" y="232" font-size="11.5" fill="#666" filter="url(#rough2)">真正删除后的数组（0 消失，段落收缩）：</text>

  <rect x="130" y="240" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="181" y="240" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="204" y="259" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">2</text>
  <rect x="232" y="240" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="259" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">−1</text>
  <rect x="283" y="240" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="306" y="259" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">3</text>
  <rect x="334" y="240" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="357" y="259" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">3</text>

  <path d="M 183,276 L 183,286 L 358,286 L 358,276" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 + (−1) + 3 + 3 = 7 —— 与置 0 视角的和完全相同！</text>

  <!-- bottom note -->
  <rect x="30" y="318" width="460" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="342" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">⚠️ 两个细节：</text>
  <text x="48" y="364" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">① 置 0 后的最大子段和 = max(真删除的答案, 0)——全由被删位置组成的子段会给出一个「虚假的 0」</text>
  <text x="48" y="386" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">② 若「不操作」的答案 &lt; 0（全体元素为负），删除不可能更优：提前返回，恰好挡掉虚假的 0</text>
</svg>
