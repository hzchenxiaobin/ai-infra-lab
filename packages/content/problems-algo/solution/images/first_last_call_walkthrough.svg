<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：各「用户 × 日期」组的首尾对方判定
  </text>

  <rect x="30" y="44" width="640" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">用户</text>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">日期</text>
  <text x="290" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">当天通话(时间→对方)</text>
  <text x="470" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">首通对方</text>
  <text x="560" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">末通对方</text>
  <text x="650" y="62" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">判定</text>

  <rect x="30" y="74" width="640" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-24</text>
  <text x="290" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">17:46→4</text>
  <text x="290" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">19:57→4</text>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="560" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="650" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>

  <rect x="30" y="120" width="640" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-24</text>
  <text x="290" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">17:46→8</text>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">19:57→8</text>
  <text x="470" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="560" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="650" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>

  <rect x="30" y="166" width="640" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-11</text>
  <text x="290" y="192" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">05:28→1（仅一通）</text>
  <text x="470" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="560" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="650" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>

  <rect x="30" y="212" width="640" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="150" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-11</text>
  <text x="290" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">05:28→5（仅一通）</text>
  <text x="470" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="560" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="650" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>

  <rect x="30" y="258" width="640" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-17</text>
  <text x="290" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">04:04→3</text>
  <text x="290" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">22:22→11</text>
  <text x="470" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="560" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="650" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 异</text>

  <rect x="30" y="304" width="640" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="150" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-17</text>
  <text x="290" y="322" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">04:04→8</text>
  <text x="290" y="336" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13:07→11</text>
  <text x="470" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="560" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="650" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 异</text>

  <rect x="30" y="350" width="640" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">11</text>
  <text x="150" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-17</text>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13:07→3</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">22:22→8</text>
  <text x="470" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="560" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="650" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 异</text>

  <text x="350" y="420" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    命中 {1, 4, 5, 8} → 升序输出 1, 4, 5, 8
  </text>
</svg>
