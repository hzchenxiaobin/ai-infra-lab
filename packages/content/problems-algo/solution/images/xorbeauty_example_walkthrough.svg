<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1, 4]（n³ = 8 个三元组）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">定义法 vs 化简法，两路径汇合</text>

  <!-- Section A label -->
  <text x="40" y="62" font-size="11" fill="#446688" font-weight="bold">① 定义法：枚举 8 个有效值</text>

  <!-- 8 cells: values 1,0,1,4,1,4,0,4 -->
  <!-- ones(1) orange: idx 0,2,4,5,7 ; zeros(0) blue: idx 1,6 -->
  <rect x="70"  y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="112" y="70" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="196" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="238" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="280" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="322" y="70" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="364" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="91"  y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="133" y="90" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="175" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="217" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="259" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="301" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="343" y="90" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="385" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- triplet labels (tiny) -->
  <text x="91"  y="112" text-anchor="middle" font-size="8" fill="#888">(0,0,0)</text>
  <text x="133" y="112" text-anchor="middle" font-size="8" fill="#888">(0,0,1)</text>
  <text x="175" y="112" text-anchor="middle" font-size="8" fill="#888">(0,1,0)</text>
  <text x="217" y="112" text-anchor="middle" font-size="8" fill="#888">(0,1,1)</text>
  <text x="259" y="112" text-anchor="middle" font-size="8" fill="#888">(1,0,0)</text>
  <text x="301" y="112" text-anchor="middle" font-size="8" fill="#888">(1,0,1)</text>
  <text x="343" y="112" text-anchor="middle" font-size="8" fill="#888">(1,1,0)</text>
  <text x="385" y="112" text-anchor="middle" font-size="8" fill="#888">(1,1,1)</text>

  <!-- XOR line -->
  <rect x="40" y="124" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#333">异或 = 1 ⊕ 0 ⊕ 1 ⊕ 4 ⊕ 1 ⊕ 4 ⊕ 0 ⊕ 4 = <tspan font-weight="bold" fill="#b85450">5</tspan></text>

  <!-- divider -->
  <path d="M 60 166 L 460 166" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Section B label -->
  <text x="40" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">② 化简法：⊕nums</text>

  <!-- simplify box -->
  <rect x="40" y="192" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#333">⊕nums = 1 ⊕ 4 = <tspan font-weight="bold" fill="#b85450">5</tspan></text>

  <!-- convergence arrows from A and B to bottom -->
  <path d="M 120 156 C 120 240, 180 240, 210 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 400 226 C 400 244, 320 244, 310 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- convergence box -->
  <rect x="40" y="252" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">两路径殊途同归 ⇒ 异或美丽值 = ⊕nums = 5</text>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#666">逐位 c³ ≡ c (mod 2) 让 n³ 项塌缩为全体异或</text>

  <!-- footer: example 2 -->
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#888">示例 2：⊕[15,45,20,2,34,35,5,44,32,30] = 34（同法成立，省略展开）</text>
</svg>
