<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "cabbac"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">ans 初值 −1；first 表记录每个字符的首次下标，之后只读不覆盖</text>

  <!-- String strip -->
  <g filter="url(#rough2)">
    <rect x="62" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="106" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="84" y="78">c</text>
    <text x="128" y="78">a</text>
    <text x="172" y="78">b</text>
    <text x="216" y="78">b</text>
    <text x="260" y="78">a</text>
    <text x="304" y="78">c</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="84" y="104">0</text>
    <text x="128" y="104">1</text>
    <text x="172" y="104">2</text>
    <text x="216" y="104">3</text>
    <text x="260" y="104">4</text>
    <text x="304" y="104">5</text>
  </g>

  <!-- Table frame -->
  <rect x="40" y="118" width="480" height="266" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="118" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="74" y="136">序号</text>
    <text x="130" y="136">i</text>
    <text x="178" y="136">s[i]</text>
    <text x="300" y="136">动作</text>
    <text x="440" y="136">ans（更新后）</text>
  </g>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="118" x2="100" y2="384"/>
    <line x1="156" y1="118" x2="156" y2="384"/>
    <line x1="208" y1="118" x2="208" y2="384"/>
    <line x1="388" y1="118" x2="388" y2="384"/>
  </g>

  <!-- Rows -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- row 1 -->
    <text x="74" y="166">1</text>
    <text x="130" y="166">0</text>
    <text x="178" y="166" font-weight="bold" fill="#446688">c</text>
    <text x="300" y="166">first[c] = 0（首次）</text>
    <text x="440" y="166" fill="#999">−1</text>

    <!-- row 2 -->
    <text x="74" y="190">2</text>
    <text x="130" y="190">1</text>
    <text x="178" y="190" font-weight="bold" fill="#446688">a</text>
    <text x="300" y="190">first[a] = 1（首次）</text>
    <text x="440" y="190" fill="#999">−1</text>

    <!-- row 3 -->
    <text x="74" y="214">3</text>
    <text x="130" y="214">2</text>
    <text x="178" y="214" font-weight="bold" fill="#446688">b</text>
    <text x="300" y="214">first[b] = 2（首次）</text>
    <text x="440" y="214" fill="#999">−1</text>

    <!-- row 4 -->
    <text x="74" y="238">4</text>
    <text x="130" y="238">3</text>
    <text x="178" y="238" font-weight="bold" fill="#d6a040">b</text>
    <text x="300" y="238">d = 3 − 2 − 1 = 0；ans = 0</text>
    <text x="440" y="238" fill="#4a7a3a" font-weight="bold">0</text>

    <!-- row 5 -->
    <text x="74" y="262">5</text>
    <text x="130" y="262">4</text>
    <text x="178" y="262" font-weight="bold" fill="#d6a040">a</text>
    <text x="300" y="262">d = 4 − 1 − 1 = 2；ans = 2</text>
    <text x="440" y="262" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row 6 PEAK -->
  <rect x="42" y="276" width="476" height="26" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="74" y="294">6</text>
    <text x="130" y="294">5</text>
    <text x="178" y="294" font-weight="bold" fill="#b85450">c</text>
    <text x="300" y="294">d = 5 − 0 − 1 = 4；ans = 4</text>
    <text x="440" y="294" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="174" x2="520" y2="174"/>
    <line x1="40" y1="198" x2="520" y2="198"/>
    <line x1="40" y1="222" x2="520" y2="222"/>
    <line x1="40" y1="246" x2="520" y2="246"/>
    <line x1="40" y1="270" x2="520" y2="270"/>
    <line x1="40" y1="302" x2="520" y2="302"/>
  </g>

  <!-- End result row -->
  <rect x="40" y="304" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">扫描结束 → 返回 ans = 4 ✓（中间子串 "abba"）</text>

  <!-- Peak annotation -->
  <text x="510" y="294" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">← 峰值</text>

  <!-- Bottom note -->
  <rect x="40" y="346" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="56" y="382" font-size="11" fill="#555">• first[c/a/b] 在步骤 1-3 各写入一次，后续 4-6 步只读取，不覆盖</text>
  <text x="56" y="396" font-size="11" fill="#555">• 同一字符越靠后的重复，候选 d 越大；步骤 6 的 'c' 取到全局最大 4</text>
</svg>
