<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：「班车」一趟捎带 —— 答案 = 最大需求</text>

  <!-- 班车主弧：从 b 顺时针绕一整圈到 a -->
  <path d="M 273 103 A 95 95 0 0 1 313 266" stroke="#b85450" stroke-width="2.4"
        fill="none" filter="url(#rough2)"/>
  <path d="M 313 266 A 95 95 0 1 1 261 102" stroke="#b85450" stroke-width="2.4"
        fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 环上站点（示例 s 中出现 b、y、z，最大需求 k = 25） -->
  <circle cx="250" cy="100" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="105" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <circle cx="273" cy="103" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="273" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>

  <circle cx="328" cy="141" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e</text>

  <circle cx="313" cy="266" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="271" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k</text>

  <circle cx="187" cy="266" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="271" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">q</text>

  <circle cx="161" cy="163" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161" y="168" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v</text>

  <circle cx="206" cy="111" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="116" text-anchor="middle" font-size="12" fill="#b3541e" font-weight="bold" filter="url(#rough2)">y</text>

  <circle cx="227" cy="103" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="227" y="108" text-anchor="middle" font-size="12" fill="#b3541e" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- 环中心结论 -->
  <text x="250" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">ans = k = 25</text>
  <text x="250" y="210" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= max need(c)</text>

  <!-- 标注：终点 a -->
  <text x="250" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点 a（从不操作 'a'）</text>
  <path d="M 250 72 L 250 84" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 标注：班车起点 b -->
  <text x="330" y="80" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">班车起点 c* = b</text>
  <text x="330" y="96" font-size="11" fill="#b85450" filter="url(#rough2)">need = 25（最大）</text>

  <!-- 标注：上车点 y / z -->
  <text x="92" y="76" font-size="12" fill="#b3541e" filter="url(#rough2)">y 上车·坐 2 站</text>
  <path d="M 122 80 L 196 106" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="92" y="100" font-size="12" fill="#b3541e" filter="url(#rough2)">z 上车·坐 1 站</text>
  <path d="M 122 104 L 215 104" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 右侧：下界框 -->
  <rect x="388" y="118" width="158" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="467" y="141" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下界 ≥ k</text>
  <text x="467" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每次操作，c* 的组至多 +1 站</text>
  <text x="467" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从 c* 走到 a 必须 k 站</text>
  <text x="467" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ 操作数 ≥ max need</text>

  <!-- 右侧：上界框 -->
  <rect x="388" y="230" width="158" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="467" y="253" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">上界 ≤ k</text>
  <text x="467" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k 次操作：c* → … → a</text>
  <text x="467" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d 在 'a'−need(d) 站上车</text>
  <text x="467" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">恰好坐 need(d) 站到 a</text>
  <text x="467" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ k 次操作人人到站</text>

  <!-- 底注 -->
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k = max over c∈set(s) of (26 − (c − 'a')) % 26</text>
</svg>
