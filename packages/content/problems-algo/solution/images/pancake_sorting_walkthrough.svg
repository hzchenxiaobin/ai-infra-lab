<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：arr = [3,2,4,1]，从 x=4 递减归位</text>

  <!-- column headers -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">x</text>
  <text x="90" y="62" font-size="11" fill="#888" font-weight="bold">当前数组</text>
  <text x="300" y="62" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="470" y="62" font-size="11" fill="#888" font-weight="bold">归位后</text>
  <path d="M 30 70 L 570 70" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== x=4 row (y base 90) ===== -->
  <circle cx="46" cy="108" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="46" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <!-- current array [3,2,4,1] -->
  <rect x="80" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="112" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="144" y="92" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="176" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="160" y="86" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">idx=2</text>
  <!-- ops -->
  <text x="300" y="108" font-size="11" fill="#333">flip(k=3)→[4,2,3,1]</text>
  <text x="300" y="124" font-size="11" fill="#333">flip(k=4)→...</text>
  <!-- result [1,3,2,4] with 4 placed -->
  <rect x="460" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="492" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="524" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="556" y="92" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="572" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="572" y="86" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓归位</text>

  <path d="M 30 140 L 570 140" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== x=3 row (y base 160) ===== -->
  <circle cx="46" cy="178" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="46" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="162" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="112" y="162" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="128" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="144" y="162" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="176" y="162" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="184" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="128" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">idx=1</text>
  <text x="300" y="178" font-size="11" fill="#333">flip(k=2)→[3,1,2,4]</text>
  <text x="300" y="194" font-size="11" fill="#333">flip(k=3)→...</text>
  <rect x="460" y="162" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="492" y="162" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="524" y="162" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="540" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="556" y="162" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="572" y="184" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="540" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓归位</text>

  <path d="M 30 210 L 570 210" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== x=2 row (y base 230) ===== -->
  <circle cx="46" cy="248" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="46" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="232" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="112" y="232" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="232" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">3</text>
  <rect x="176" y="232" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="254" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="96" y="226" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">idx=0</text>
  <text x="300" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">已在首位，跳过第①步</text>
  <text x="300" y="264" font-size="11" fill="#333">flip(k=2)→...</text>
  <rect x="460" y="232" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="492" y="232" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="524" y="232" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="254" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">3</text>
  <rect x="556" y="232" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="572" y="254" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="508" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓归位</text>

  <path d="M 30 280 L 570 280" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== x=1 row (y base 300) ===== -->
  <circle cx="46" cy="318" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="46" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="302" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="112" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="128" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">2</text>
  <rect x="144" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">3</text>
  <rect x="176" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="192" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="96" y="296" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">idx=0</text>
  <text x="300" y="322" font-size="12" fill="#4a7a3a" font-weight="bold">idx == x−1 == 0，已在目标位置，跳过</text>
  <rect x="460" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="476" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="492" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">2</text>
  <rect x="524" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">3</text>
  <rect x="556" y="302" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="572" y="324" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">4</text>
  <text x="476" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓已完成</text>

  <!-- ===== answer block ===== -->
  <rect x="40" y="360" width="520" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终答案：ans = [3, 4, 2, 3, 2]</text>
  <text x="300" y="408" text-anchor="middle" font-size="11" fill="#666">依次执行 flip(k=3)→flip(k=4)→flip(k=2)→flip(k=3)→flip(k=2)</text>
  <text x="300" y="428" text-anchor="middle" font-size="10" fill="#888">长度 5 ≤ 10×4 = 40，满足题目约束；执行后 arr = [1,2,3,4] 升序</text>

  <!-- legend -->
  <rect x="40" y="468" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="480" font-size="10" fill="#666">待归位的 x</text>
  <rect x="150" y="468" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="170" y="480" font-size="10" fill="#666">已归位（不再动）</text>
  <rect x="290" y="468" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="310" y="480" font-size="10" fill="#666">未归位</text>
  <text x="430" y="480" font-size="10" fill="#888">绿色区域从右向左逐格锁定</text>
</svg>
