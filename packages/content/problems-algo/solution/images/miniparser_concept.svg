<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    字符串 → 嵌套树：栈记录各级在建列表
  </text>

  <!-- Input string -->
  <rect x="150" y="46" width="260" height="34" fill="#fff" stroke="#446688"
        stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    "[123,[456,[789]]]"
  </text>

  <!-- Arrow down -->
  <line x1="280" y1="84" x2="280" y2="112" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="102" font-size="11" fill="#4a7a3a" filter="url(#rough2)">栈式解析</text>

  <!-- L0 outermost list -->
  <rect x="40" y="120" width="480" height="220" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="138" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L0 列表（栈底）</text>

  <!-- NI(123) leaf -->
  <rect x="70" y="172" width="66" height="36" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="195" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">123</text>
  <text x="103" y="164" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">叶节点</text>

  <!-- L1 middle list -->
  <rect x="160" y="155" width="340" height="170" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="172" y="173" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">L1 列表</text>

  <!-- NI(456) leaf -->
  <rect x="190" y="202" width="66" height="36" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="225" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">456</text>
  <text x="223" y="194" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">叶节点</text>

  <!-- L2 innermost list -->
  <rect x="290" y="190" width="190" height="120" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="302" y="208" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L2 列表（栈顶）</text>

  <!-- NI(789) leaf -->
  <rect x="342" y="238" width="66" height="36" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="261" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">789</text>
  <text x="375" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">叶节点</text>

  <!-- stack push/pop annotations on the right -->
  <path d="M 510 175 L 510 200" stroke="#b85450" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="538" y="180" font-size="9" fill="#b85450" filter="url(#rough2)">[ 压栈</text>
  <text x="538" y="192" font-size="9" fill="#b85450" filter="url(#rough2)">下钻</text>
  <path d="M 510 280 L 510 255" stroke="#4a7a3a" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="538" y="270" font-size="9" fill="#4a7a3a" filter="url(#rough2)">] 弹栈</text>
  <text x="538" y="282" font-size="9" fill="#4a7a3a" filter="url(#rough2)">挂回</text>

  <!-- Legend -->
  <rect x="50" y="352" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="363" font-size="10" fill="#555" filter="url(#rough2)">列表节点（内部）</text>
  <rect x="190" y="352" width="16" height="12" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="363" font-size="10" fill="#555" filter="url(#rough2)">整数节点（叶子）</text>
  <text x="330" y="363" font-size="10" fill="#555" filter="url(#rough2)">[ → 压栈新列表  |  ] → 弹栈挂回父级</text>
</svg>
