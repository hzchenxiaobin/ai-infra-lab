<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：order_date = pref_delivery_date 即即时订单 → 算占比</text>

  <!-- ===== Left: Delivery table ===== -->
  <text x="135" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Delivery 表（6 行）</text>
  <!-- header -->
  <rect x="20" y="60" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="8" fill="#446688" font-weight="bold">id</text>
  <text x="80" y="76" font-size="8" fill="#446688" font-weight="bold">cust</text>
  <text x="130" y="76" font-size="8" fill="#446688" font-weight="bold">order_date</text>
  <text x="205" y="76" font-size="7.5" fill="#446688" font-weight="bold">pref_deliv_date</text>
  <line x1="55" y1="60" x2="55" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="100" y1="60" x2="100" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: not immediate -->
  <rect x="20" y="84" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="97" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="80" y="97" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="130" y="97" text-anchor="middle" font-size="7.5" fill="#888">08-01</text>
  <text x="205" y="97" text-anchor="middle" font-size="7.5" fill="#888">08-02</text>
  <text x="260" y="97" font-size="8" fill="#888">✗</text>
  <line x1="55" y1="84" x2="55" y2="102" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="100" y1="84" x2="100" y2="102" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="84" x2="170" y2="102" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 2: IMMEDIATE -->
  <rect x="20" y="102" width="230" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="115" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="80" y="115" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="130" y="115" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">08-02</text>
  <text x="205" y="115" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">08-02</text>
  <text x="260" y="115" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 相等</text>
  <line x1="55" y1="102" x2="55" y2="120" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="100" y1="102" x2="100" y2="120" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="102" x2="170" y2="120" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 3: not immediate -->
  <rect x="20" y="120" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="133" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="80" y="133" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="130" y="133" text-anchor="middle" font-size="7.5" fill="#888">08-11</text>
  <text x="205" y="133" text-anchor="middle" font-size="7.5" fill="#888">08-12</text>
  <text x="260" y="133" font-size="8" fill="#888">✗</text>
  <line x1="55" y1="120" x2="55" y2="138" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="100" y1="120" x2="100" y2="138" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="120" x2="170" y2="138" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 4: IMMEDIATE -->
  <rect x="20" y="138" width="230" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="151" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="80" y="151" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="130" y="151" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">08-24</text>
  <text x="205" y="151" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">08-24</text>
  <text x="260" y="151" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 相等</text>
  <line x1="55" y1="138" x2="55" y2="156" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="100" y1="138" x2="100" y2="156" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="138" x2="170" y2="156" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 5: not immediate -->
  <rect x="20" y="156" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="169" text-anchor="middle" font-size="8" fill="#888">5</text>
  <text x="80" y="169" text-anchor="middle" font-size="8" fill="#888">4</text>
  <text x="130" y="169" text-anchor="middle" font-size="7.5" fill="#888">08-21</text>
  <text x="205" y="169" text-anchor="middle" font-size="7.5" fill="#888">08-22</text>
  <text x="260" y="169" font-size="8" fill="#888">✗</text>
  <line x1="55" y1="156" x2="55" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="100" y1="156" x2="100" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="156" x2="170" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 6: not immediate -->
  <rect x="20" y="174" width="230" height="18" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="187" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="80" y="187" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="130" y="187" text-anchor="middle" font-size="7.5" fill="#888">08-11</text>
  <text x="205" y="187" text-anchor="middle" font-size="7.5" fill="#888">08-13</text>
  <text x="260" y="187" font-size="8" fill="#888">✗</text>
  <line x1="55" y1="174" x2="55" y2="192" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="100" y1="174" x2="100" y2="192" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="170" y1="174" x2="170" y2="192" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- arrow to formula -->
  <path d="M135 198 L135 218" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="155" y="212" font-size="8" fill="#d6a040" font-weight="bold">统计</text>

  <!-- ===== Middle: two counts ===== -->
  <rect x="20" y="220" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">即时订单数</text>
  <text x="75" y="258" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="140" y="220" width="110" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="238" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">总订单数</text>
  <text x="195" y="258" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">6</text>

  <!-- arrow to formula result -->
  <path d="M135 278 L135 298" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="155" y="292" font-size="8" fill="#b85450" font-weight="bold">求占比</text>

  <!-- ===== Bottom-left: formula ===== -->
  <rect x="20" y="300" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">即时占比 = 2 / 6 × 100</text>
  <text x="135" y="342" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 33.33%</text>

  <!-- ===== Right: SQL snippet ===== -->
  <rect x="290" y="60" width="290" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SQL 核心逻辑</text>
  <line x1="305" y1="86" x2="565" y2="86" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="102" font-size="9" fill="#4a7a3a" font-family="monospace">AVG(</text>
  <text x="305" y="116" font-size="9" fill="#d6a040" font-family="monospace">  order_date = pref_deliv_date</text>
  <text x="305" y="130" font-size="9" fill="#4a7a3a" font-family="monospace">) * 100</text>
  <text x="305" y="144" font-size="8" fill="#888">↑ MySQL 中布尔=1/0，AVG 即占比</text>
  <text x="305" y="162" font-size="9" fill="#888" font-family="monospace">或：</text>
  <text x="305" y="176" font-size="9" fill="#b85450" font-family="monospace">COUNT(CASE WHEN ... THEN 1 END)</text>
  <text x="305" y="190" font-size="9" fill="#888" font-family="monospace">  / COUNT(*) * 100</text>
  <text x="305" y="204" font-size="8" fill="#888">通用写法（跨数据库）</text>

  <!-- ===== Right: key insights ===== -->
  <rect x="290" y="220" width="290" height="136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察</text>

  <text x="305" y="260" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">即时订单</tspan>：order_date 等于 pref_deliv_date</text>
  <text x="305" y="278" font-size="9.5" fill="#333">  （用户下单当天就要求配送）</text>
  <text x="305" y="296" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">AVG 技巧</tspan>：MySQL 布尔表达式返回 0/1</text>
  <text x="305" y="312" font-size="9.5" fill="#333">  AVG(布尔) 直接得到比例，× 100 转百分比</text>
  <text x="305" y="330" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">ROUND(x, 2)</tspan>：保留 2 位小数</text>
  <text x="305" y="348" font-size="9.5" fill="#333">• <tspan fill="#888">灰色行</tspan>=非即时 <tspan fill="#4a7a3a">绿色行</tspan>=即时</text>

  <!-- SQL snippet at bottom -->
  <rect x="20" y="372" width="560" height="56" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="390" font-size="9.5" fill="#446688" font-family="monospace">SELECT ROUND(AVG(order_date = customer_pref_delivery_date) * 100, 2)</text>
  <text x="35" y="406" font-size="9.5" fill="#446688" font-family="monospace">    AS immediate_percentage</text>
  <text x="35" y="422" font-size="9.5" fill="#446688" font-family="monospace">FROM Delivery;</text>
</svg>
