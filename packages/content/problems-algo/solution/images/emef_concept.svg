<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 增量并查集：连通分量降到 1 的时刻即答案</text>

  <!-- ===== Top: logs not sorted ===== -->
  <rect x="30" y="44" width="480" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">原始 logs：时间戳未必有序</text>

  <rect x="46" y="74" width="130" height="28" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="111" y="92" text-anchor="middle" font-size="10.5" fill="#333">[0224,2,4]</text>
  <rect x="186" y="74" width="130" height="28" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="251" y="92" text-anchor="middle" font-size="10.5" fill="#333">[0101,0,1]</text>
  <rect x="326" y="74" width="130" height="28" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="391" y="92" text-anchor="middle" font-size="10.5" fill="#333">[0301,0,3]</text>
  <text x="270" y="112" text-anchor="middle" font-size="10" fill="#b85450">按输入顺序处理会错过「最早」时刻 → 必须先排序</text>

  <!-- arrow down: sort -->
  <line x1="270" y1="124" x2="270" y2="152" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="142" font-size="11" fill="#446688" font-weight="bold">按时间排序</text>

  <!-- ===== Middle: sorted timeline ===== -->
  <rect x="30" y="156" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">按时间排序后：逐条 union，分量数逐步下降</text>

  <rect x="44" y="184" width="78" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="200" text-anchor="middle" font-size="9.5" fill="#333">0101</text>
  <rect x="130" y="184" width="78" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="200" text-anchor="middle" font-size="9.5" fill="#333">0104</text>
  <rect x="216" y="184" width="78" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="200" text-anchor="middle" font-size="9.5" fill="#333">0107</text>
  <rect x="302" y="184" width="78" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="200" text-anchor="middle" font-size="9.5" fill="#333">0211</text>
  <rect x="388" y="184" width="78" height="24" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="200" text-anchor="middle" font-size="9.5" fill="#333">0301</text>

  <!-- arrow down -->
  <line x1="270" y1="220" x2="270" y2="238" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: component count decreasing ===== -->
  <rect x="30" y="240" width="480" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">增量合并：每 union 一次，连通分量数 −1</text>

  <!-- count circles: 6 5 4 3 2 1 -->
  <circle cx="86" cy="296" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="301" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="86" y="332" text-anchor="middle" font-size="9.5" fill="#888">init</text>

  <line x1="106" y1="296" x2="136" y2="296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="156" cy="296" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="301" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="156" y="332" text-anchor="middle" font-size="9.5" fill="#888">0101</text>

  <line x1="176" y1="296" x2="206" y2="296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="226" cy="296" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="226" y="301" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="226" y="332" text-anchor="middle" font-size="9.5" fill="#888">0104</text>

  <line x1="246" y1="296" x2="276" y2="296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="296" cy="296" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="296" y="301" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="296" y="332" text-anchor="middle" font-size="9.5" fill="#888">0107</text>

  <line x1="316" y1="296" x2="346" y2="296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="366" cy="296" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="301" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="366" y="332" text-anchor="middle" font-size="9.5" fill="#888">0211</text>

  <line x1="386" y1="296" x2="416" y2="296" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="446" cy="296" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="446" y="301" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="446" y="334" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0301 ⭐</text>

  <rect x="50" y="348" width="440" height="14" fill="none" stroke="none"/>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#444">连通分量首次降到 1 的时间戳 → 全员熟识的最早时间</text>
</svg>
