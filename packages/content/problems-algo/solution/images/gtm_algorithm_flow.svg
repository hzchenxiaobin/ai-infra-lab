<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：n+1 次 query 求多数</text>

  <rect x="210" y="40" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="270" y1="68" x2="270" y2="80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="82" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = query(0, 1, 2, 3)  ← 基准</text>
  <line x1="270" y1="114" x2="270" y2="126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="128" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">循环 i = 4 … n−1</text>
  <line x1="270" y1="158" x2="270" y2="170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="172" width="210" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y_i = query(0, 1, 2, i)</text>
  <line x1="270" y1="202" x2="270" y2="214" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,216 350,246 270,276 190,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y_i == x ?</text>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"></text>

  <line x1="190" y1="246" x2="120" y2="246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="45" y="232" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="82" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a++</text>

  <line x1="350" y1="246" x2="420" y2="246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="240" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="420" y="232" width="95" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="467" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b++, k=i</text>

  <path d="M 82 260 Q 82 285 165 285 L 265 285 Q 270 285 270 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 467 260 Q 467 285 375 285 L 275 285 Q 270 285 270 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="270" y1="276" x2="270" y2="292" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="294" width="320" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y = query(0,1,2,4)  →  判定 0, 1, 2</text>
  <line x1="270" y1="326" x2="270" y2="338" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="340" width="380" height="44" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">query(1,2,3,4) vs y → 判 nums[0]</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">query(0,2,3,4) vs y → 判 nums[1]　query(0,1,3,4) vs y → 判 nums[2]</text>
  <line x1="270" y1="384" x2="270" y2="396" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,398 360,430 270,462 180,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="427" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a == b ?</text>
  <text x="270" y="441" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"></text>

  <line x1="180" y1="430" x2="100" y2="430" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="424" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="416" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <line x1="360" y1="430" x2="420" y2="430" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="460,430 500,410 500,450" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="427" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a&gt;b?</text>

  <line x1="500" y1="410" x2="500" y2="392" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="400" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="465" y="372" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <line x1="500" y1="450" x2="500" y2="468" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="463" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="465" y="470" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k</text>

  <rect x="180" y="495" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="513" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总调用次数：1 + (n−4) + 4 = n+1</text>
</svg>
