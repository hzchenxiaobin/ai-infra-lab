<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：排序 → 逐类贪心取 → 累加 → 车位满即停
  </text>

  <!-- Step 1: Sort -->
  <rect x="180" y="46" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 按 units 降序排序</text>
  <text x="260" y="76" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">O(n log n)</text>

  <!-- arrow down -->
  <path d="M260,86 L260,104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="180" y="108" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② remaining = truckSize</text>
  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">total = 0</text>

  <!-- arrow down -->
  <path d="M260,148 L260,166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Loop box -->
  <rect x="140" y="170" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 遍历每类 (count, units)</text>
  <text x="260" y="202" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">取 take = min(count, remaining)</text>

  <!-- arrow down to diamond -->
  <path d="M260,214 L260,232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate box -->
  <rect x="150" y="236" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ total += take × units</text>
  <text x="260" y="266" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">remaining -= take</text>

  <!-- arrow down to diamond -->
  <path d="M260,276 L260,292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: remaining == 0? -->
  <path d="M260,296 L320,318 L260,340 L200,318 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">remaining</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">== 0?</text>

  <!-- Yes: return (right) -->
  <path d="M320,318 L380,318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="384" y="302" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="434" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 返回</text>
  <text x="434" y="328" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">total</text>

  <!-- No: loop back (left, curving up to step 3) -->
  <path d="M200,318 L100,318 L100,190 L138,190" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="80" y="254" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">下一类</text>

  <!-- complexity note -->
  <rect x="50" y="352" width="420" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    时间 O(n log n) | 空间 O(log n) | 提前终止让遍历平均少于 n 步
  </text>
</svg>
