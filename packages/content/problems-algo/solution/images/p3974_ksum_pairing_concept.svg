<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最大的 k 个元素 × 递减系数，「大配大」</text>

  <!-- ① 元素行 -->
  <text x="170" y="50" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① 选最大的 k 个（降序）</text>
  <rect x="68" y="58" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="148" y="58" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="228" y="58" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="100" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a₁</text>
  <text x="180" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a₂</text>
  <text x="260" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a₃</text>

  <!-- 乘号 -->
  <text x="100" y="126" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="180" y="126" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="260" y="126" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- ② 系数行 -->
  <rect x="68" y="132" width="64" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">×2</text>
  <rect x="148" y="132" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="157" text-anchor="middle" font-size="14" fill="#2f5527" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="228" y="132" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="14" fill="#2f5527" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="100" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c₁=mul</text>
  <text x="180" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c₂=1</text>
  <text x="260" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c₃=1</text>
  <text x="170" y="204" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 前 t = min(k, mul−1) 个走乘法，其余走加法</text>
  <text x="170" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">③ 每处理一个元素（无论乘/加）mul 都 −1 → 乘法抢最前</text>

  <!-- 演算框 -->
  <rect x="40" y="238" width="264" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="257" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold" filter="url(#rough2)">示例 1：k=3, mul=2 → t=1</text>
  <text x="172" y="275" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">9×2 + 6 + 2 = 26 ✓</text>

  <!-- 交换论证 -->
  <rect x="40" y="296" width="264" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="172" y="315" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">交换论证：若 aᵢ &lt; aⱼ 而 cᵢ &gt; cⱼ</text>
  <text x="172" y="333" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">交换配对变化 (aⱼ−aᵢ)(cᵢ−cⱼ) &gt; 0 → 大配大最优</text>

  <!-- 小抄 -->
  <rect x="324" y="44" width="176" height="176" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="412" y="64" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">小抄</text>
  <text x="412" y="84" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· nums[i] ≥ 1 全正是根基</text>
  <text x="412" y="102" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 系数 &gt; 1：乘法赚</text>
  <text x="412" y="120" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 系数 = 1：乘加等价</text>
  <text x="412" y="138" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 系数 ≤ 0：乘法亏</text>
  <text x="412" y="156" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· mul = 1 → t = 0 全加法</text>
  <text x="412" y="174" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 答案可达 ~10¹⁵</text>
  <text x="412" y="192" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  C++ 记得 long long</text>
  <text x="412" y="210" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 时间 O(n log n)</text>
</svg>
