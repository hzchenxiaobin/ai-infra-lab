<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：5×5 矩阵，k = 3</text>
  <text x="330" y="42" text-anchor="middle" font-size="11" fill="#888">每行二分得战斗力，再按 (战斗力, 行号) 升序取前 k</text>

  <!-- col index labels -->
  <g font-size="10" fill="#888">
    <text x="110" y="74" text-anchor="middle">列 0</text>
    <text x="150" y="74" text-anchor="middle">列 1</text>
    <text x="190" y="74" text-anchor="middle">列 2</text>
    <text x="230" y="74" text-anchor="middle">列 3</text>
    <text x="270" y="74" text-anchor="middle">列 4</text>
  </g>

  <!-- row labels -->
  <g font-size="11" fill="#446688" font-weight="bold">
    <text x="78" y="102" text-anchor="end">行 0</text>
    <text x="78" y="134" text-anchor="end">行 1</text>
    <text x="78" y="166" text-anchor="end">行 2</text>
    <text x="78" y="198" text-anchor="end">行 3</text>
    <text x="78" y="230" text-anchor="end">行 4</text>
  </g>

  <!-- matrix cells -->
  <g font-size="13">
    <!-- row 0: 1,1,0,0,0 -->
    <rect x="90" y="86" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="107" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="130" y="86" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="107" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="86" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="107" text-anchor="middle" fill="#888">0</text>
    <rect x="210" y="86" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="107" text-anchor="middle" fill="#888">0</text>
    <rect x="250" y="86" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="107" text-anchor="middle" fill="#888">0</text>
    <!-- row 1: 1,1,1,1,0 -->
    <rect x="90" y="118" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="139" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="130" y="118" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="139" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="118" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="139" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="210" y="118" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="230" y="139" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="250" y="118" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="139" text-anchor="middle" fill="#888">0</text>
    <!-- row 2: 1,0,0,0,0 -->
    <rect x="90" y="150" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="171" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="130" y="150" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="150" y="171" text-anchor="middle" fill="#888">0</text>
    <rect x="170" y="150" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="171" text-anchor="middle" fill="#888">0</text>
    <rect x="210" y="150" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="171" text-anchor="middle" fill="#888">0</text>
    <rect x="250" y="150" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="171" text-anchor="middle" fill="#888">0</text>
    <!-- row 3: 1,1,0,0,0 -->
    <rect x="90" y="182" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="203" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="130" y="182" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="203" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="182" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="203" text-anchor="middle" fill="#888">0</text>
    <rect x="210" y="182" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="203" text-anchor="middle" fill="#888">0</text>
    <rect x="250" y="182" width="40" height="32" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="203" text-anchor="middle" fill="#888">0</text>
    <!-- row 4: 1,1,1,1,1 -->
    <rect x="90" y="214" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="235" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="130" y="214" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="235" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="214" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="235" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="210" y="214" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="230" y="235" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="250" y="214" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="235" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- 战斗力 column -->
  <text x="340" y="74" font-size="11" fill="#b85450" font-weight="bold">战斗力</text>
  <g font-size="13">
    <rect x="320" y="86" width="50" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="345" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="320" y="118" width="50" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="345" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="320" y="150" width="50" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="345" y="171" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="320" y="182" width="50" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="345" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="320" y="214" width="50" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="345" y="235" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- arrow down: sort -->
  <path d="M 330 256 L 330 280" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="340" y="272" font-size="10" fill="#888">排序 (战斗力, 行号)</text>

  <!-- sorted pairs -->
  <text x="40" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">排序后（前 k=3 高亮）</text>
  <g font-size="12">
    <!-- box 1: 行2 战力1 (weakest) -->
    <rect x="55" y="306" width="90" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="100" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">行 2</text>
    <text x="100" y="342" text-anchor="middle" fill="#888" font-size="10">战力 1</text>
    <!-- box 2: 行0 战力2 -->
    <rect x="155" y="306" width="90" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="200" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">行 0</text>
    <text x="200" y="342" text-anchor="middle" fill="#888" font-size="10">战力 2</text>
    <!-- box 3: 行3 战力2 -->
    <rect x="255" y="306" width="90" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="300" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">行 3</text>
    <text x="300" y="342" text-anchor="middle" fill="#888" font-size="10">战力 2</text>
    <!-- box 4: 行1 战力4 -->
    <rect x="355" y="306" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="324" text-anchor="middle" fill="#888" font-weight="bold">行 1</text>
    <text x="400" y="342" text-anchor="middle" fill="#aaa" font-size="10">战力 4</text>
    <!-- box 5: 行4 战力5 -->
    <rect x="455" y="306" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="500" y="324" text-anchor="middle" fill="#888" font-weight="bold">行 4</text>
    <text x="500" y="342" text-anchor="middle" fill="#aaa" font-size="10">战力 5</text>
  </g>

  <!-- result box -->
  <rect x="170" y="370" width="320" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="396" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">前 k=3 弱 → [2, 0, 3]</text>
</svg>
