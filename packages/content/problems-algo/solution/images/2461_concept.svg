<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：定长 k 的窗口右移，用频率表 O(1) 判重</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">窗口内无重复 ⟺ freq 表键数 = k　　nums = [1,5,4,2,9,9,9], k = 3</text>

  <!-- Original array label -->
  <text x="30" y="72" font-size="10.5" fill="#666">nums</text>

  <!-- 7 cards: x = 132 + i*43, w=38 h=34 -->
  <rect x="132" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="175" y="58" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="80" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="218" y="58" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="80" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="261" y="58" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="304" y="58" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="80" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="347" y="58" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="80" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="390" y="58" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="409" y="80" text-anchor="middle" font-size="13" fill="#333">9</text>

  <!-- index labels -->
  <text x="151" y="104" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="194" y="104" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="237" y="104" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="280" y="104" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="323" y="104" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="366" y="104" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="409" y="104" text-anchor="middle" font-size="9.5" fill="#999">6</text>

  <!-- divider -->
  <path d="M 28 116 L 532 116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Left section: valid window -->
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">有效窗口 ✓ 无重复</text>
  <!-- 3 green cards [4,2,9], start x=81, w=42 gap=6 -->
  <rect x="81" y="146" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="169" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="129" y="146" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="177" y="146" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="169" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- freq table -->
  <rect x="60" y="194" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#333">freq = {4:1, 2:1, 9:1}</text>
  <text x="150" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">键数 = 3 = k ✓　sum = 15</text>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#555">→ 更新 ans = 15</text>

  <!-- Right section: invalid window -->
  <text x="410" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无效窗口 ✗ 含重复</text>
  <!-- 3 red cards [9,9,9], start x=341 -->
  <rect x="341" y="146" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="169" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="389" y="146" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="169" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="437" y="146" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458" y="169" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- freq table -->
  <rect x="320" y="194" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="212" text-anchor="middle" font-size="11" fill="#333">freq = {9:3}</text>
  <text x="410" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">键数 = 1 ≠ k ✗　有重复</text>
  <text x="410" y="240" text-anchor="middle" font-size="10" fill="#555">sum=27 也不算，跳过</text>

  <!-- Bottom note -->
  <rect x="40" y="262" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每步 O(1) 维护：滑窗右移 → 左端 freq−−（归 0 则删键）、右端 freq++</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555">判重不必每次扫窗口：freq.size() == k ⟺ 窗口内元素各不相同</text>
</svg>
