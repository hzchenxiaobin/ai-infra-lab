<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：前缀取 earliest、后缀取 latest，在分割点两侧对拉（skill = "cbc"，station = "cbcdbc"）</text>

    <!-- Panel 1: earliest -->
    <rect x="20" y="32" width="580" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="30" y="51" font-size="11" fill="#33507a" font-weight="bold">① 正向贪心：每人取最早的可行工位 → earliest = [0, 1, 2]</text>

    <rect x="40" y="60" width="28" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="78" y="60" width="28" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="60" width="28" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="54" y="76" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="92" y="76" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="130" y="76" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="54" y="94" text-anchor="middle" font-size="8" fill="#888">工人0</text>
    <text x="92" y="94" text-anchor="middle" font-size="8" fill="#888">工人1</text>
    <text x="130" y="94" text-anchor="middle" font-size="8" fill="#888">工人2</text>

    <path d="M 54 84 L 166 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 92 84 L 210 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 130 84 L 254 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="150" y="102" width="36" height="26" rx="4" fill="#dbe7f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="194" y="102" width="36" height="26" rx="4" fill="#dbe7f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="102" width="36" height="26" rx="4" fill="#dbe7f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="282" y="102" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="326" y="102" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="370" y="102" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="168" y="120" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="212" y="120" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="256" y="120" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="300" y="120" text-anchor="middle" font-size="11" fill="#333">d</text>
    <text x="344" y="120" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="388" y="120" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="168" y="138" text-anchor="middle" font-size="8" fill="#888">0</text>
    <text x="212" y="138" text-anchor="middle" font-size="8" fill="#888">1</text>
    <text x="256" y="138" text-anchor="middle" font-size="8" fill="#888">2</text>
    <text x="300" y="138" text-anchor="middle" font-size="8" fill="#888">3</text>
    <text x="344" y="138" text-anchor="middle" font-size="8" fill="#888">4</text>
    <text x="388" y="138" text-anchor="middle" font-size="8" fill="#888">5</text>
    <text x="445" y="120" font-size="9" fill="#6b7f99">任何合法分配中</text>
    <text x="445" y="134" font-size="9" fill="#6b7f99">jᵢ ≥ earliest[i]</text>

    <!-- Panel 2: latest -->
    <rect x="20" y="152" width="580" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="30" y="171" font-size="11" fill="#2f5527" font-weight="bold">② 反向贪心：每人取最晚的可行工位 → latest = [2, 4, 5]</text>

    <rect x="40" y="180" width="28" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="78" y="180" width="28" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="116" y="180" width="28" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="54" y="196" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="92" y="196" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="130" y="196" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="54" y="214" text-anchor="middle" font-size="8" fill="#888">工人0</text>
    <text x="92" y="214" text-anchor="middle" font-size="8" fill="#888">工人1</text>
    <text x="130" y="214" text-anchor="middle" font-size="8" fill="#888">工人2</text>

    <path d="M 54 204 L 252 219" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <path d="M 92 204 L 340 219" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <path d="M 130 204 L 384 219" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>

    <rect x="150" y="222" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="194" y="222" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="238" y="222" width="36" height="26" rx="4" fill="#dcefe0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="282" y="222" width="36" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="326" y="222" width="36" height="26" rx="4" fill="#dcefe0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="222" width="36" height="26" rx="4" fill="#dcefe0" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="168" y="240" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="212" y="240" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="256" y="240" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="300" y="240" text-anchor="middle" font-size="11" fill="#333">d</text>
    <text x="344" y="240" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="388" y="240" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="168" y="258" text-anchor="middle" font-size="8" fill="#888">0</text>
    <text x="212" y="258" text-anchor="middle" font-size="8" fill="#888">1</text>
    <text x="256" y="258" text-anchor="middle" font-size="8" fill="#888">2</text>
    <text x="300" y="258" text-anchor="middle" font-size="8" fill="#888">3</text>
    <text x="344" y="258" text-anchor="middle" font-size="8" fill="#888">4</text>
    <text x="388" y="258" text-anchor="middle" font-size="8" fill="#888">5</text>
    <text x="445" y="240" font-size="9" fill="#6b7f99">任何合法分配中</text>
    <text x="445" y="254" font-size="9" fill="#6b7f99">jᵢ ≤ latest[i]</text>

    <!-- Panel 3: split -->
    <rect x="20" y="272" width="580" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="30" y="291" font-size="11" fill="#8a6d1f" font-weight="bold">③ 枚举分割点 i：前缀（蓝）取 earliest、后缀（绿）取 latest，把 (i−1, i) 两侧拉开</text>

    <rect x="40" y="300" width="28" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="78" y="300" width="28" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="300" width="28" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="54" y="316" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="92" y="316" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="130" y="316" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="54" y="334" text-anchor="middle" font-size="8" fill="#888">工人0</text>
    <text x="92" y="334" text-anchor="middle" font-size="8" fill="#888">工人1</text>
    <text x="130" y="334" text-anchor="middle" font-size="8" fill="#888">工人2</text>

    <path d="M 54 324 L 166 361" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 92 324 L 210 361" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 130 324 L 384 361" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>

    <rect x="150" y="364" width="36" height="26" rx="4" fill="#dbe7f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="194" y="364" width="36" height="26" rx="4" fill="#dbe7f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="364" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="282" y="364" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="326" y="364" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="370" y="364" width="36" height="26" rx="4" fill="#dcefe0" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="168" y="382" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="212" y="382" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="256" y="382" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="300" y="382" text-anchor="middle" font-size="11" fill="#333">d</text>
    <text x="344" y="382" text-anchor="middle" font-size="11" fill="#333">b</text>
    <text x="388" y="382" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="168" y="400" text-anchor="middle" font-size="8" fill="#888">0</text>
    <text x="212" y="400" text-anchor="middle" font-size="8" fill="#888">1</text>
    <text x="256" y="400" text-anchor="middle" font-size="8" fill="#888">2</text>
    <text x="300" y="400" text-anchor="middle" font-size="8" fill="#888">3</text>
    <text x="344" y="400" text-anchor="middle" font-size="8" fill="#888">4</text>
    <text x="388" y="400" text-anchor="middle" font-size="8" fill="#888">5</text>

    <text x="462" y="312" font-size="10" fill="#b85450" font-weight="bold">分割点 i = 2：</text>
    <text x="462" y="327" font-size="10" fill="#b85450" font-weight="bold">gap = latest[2] − earliest[1]</text>
    <text x="462" y="342" font-size="10" fill="#b85450" font-weight="bold">    = 5 − 1 = 4</text>
    <path d="M 458 336 C 420 344, 385 352, 340 360" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none"/>

    <!-- bottom notes -->
    <text x="310" y="418" text-anchor="middle" font-size="9.5" fill="#333">任何合法分配满足 earliest[i] ≤ jᵢ ≤ latest[i]；题设保证有解 ⇒ earliest[i−1] &lt; latest[i]，两段拼接天然合法</text>
    <text x="310" y="434" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">答案 = max₁≤ᵢ&lt;ₙ ( latest[i] − earliest[i−1] )</text>
  </g>
</svg>
