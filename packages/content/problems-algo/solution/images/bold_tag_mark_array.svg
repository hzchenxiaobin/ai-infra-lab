<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：布尔数组标记每个位置是否加粗</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">匹配子串的位置标 true，连续 true 段 = 一对 &lt;b&gt;...&lt;/b&gt;</text>

  <!-- s cells: a a a b b c c -->
  <text x="60" y="86" font-size="12" fill="#888">s：</text>
  <rect x="100" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="144" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="188" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="232" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="276" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="320" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="364" y="64" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- index labels -->
  <text x="122" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="254" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="298" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="342" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="386" y="112" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>

  <!-- word match brackets -->
  <path d="M 100 128 L 100 136 L 232 136 L 232 128" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="166" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"aaa" → [0,2]</text>

  <path d="M 144 162 L 144 170 L 276 170 L 276 162" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="210" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"aab" → [1,3]</text>

  <path d="M 276 196 L 276 204 L 364 204 L 364 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"bc" → [4,5]</text>

  <!-- bold array -->
  <text x="60" y="252" font-size="12" fill="#888">bold[]：</text>
  <rect x="100" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="144" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="166" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="188" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="232" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="276" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="298" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="320" y="238" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="364" y="238" width="44" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="258" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">F</text>

  <!-- merged bracket covering 0-5 -->
  <path d="M 100 278 L 100 286 L 364 286 L 364 278" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="232" y="302" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">连续 true 段 [0,5] → 一对 &lt;b&gt;&lt;/b&gt;</text>

  <!-- result -->
  <rect x="60" y="316" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">输出：&lt;b&gt;aaabbc&lt;/b&gt;c</text>

  <!-- note -->
  <rect x="40" y="360" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">重叠（aaa ∩ aab 于 [1,2]）+ 相邻（[0,3] 接 [4,5]）</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#444">→ 布尔数组自然合并为一段连续 true，无需额外区间合并逻辑</text>
</svg>
