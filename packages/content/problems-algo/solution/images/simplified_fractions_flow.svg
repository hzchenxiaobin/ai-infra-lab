<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双重循环 + gcd 判定</text>

  <!-- 1. Start -->
  <rect x="210" y="40" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始，res = []</text>
  <path d="M 270 74 L 270 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. b = 2 -->
  <rect x="210" y="92" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333">b ← 2</text>
  <path d="M 270 126 L 270 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Diamond: b <= n ? -->
  <polygon points="270,144 360,184 270,224 180,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333">b ≤ n ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="10" fill="#888">(外层循环)</text>

  <!-- No → return res -->
  <path d="M 360 184 L 440 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="178" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="428" y="168" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="476" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return res</text>

  <!-- Yes ↓ -->
  <path d="M 270 224 L 270 242" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="238" font-size="10.5" fill="#4a7a3a">是</text>

  <!-- 4. a = 1 -->
  <rect x="210" y="242" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="12" fill="#333">a ← 1</text>
  <path d="M 270 276 L 270 294" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Diamond: a < b ? -->
  <polygon points="270,294 360,330 270,366 180,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="327" text-anchor="middle" font-size="11.5" fill="#333">a &lt; b ?</text>
  <text x="270" y="342" text-anchor="middle" font-size="10" fill="#888">(内层循环)</text>

  <!-- No → b++ → back to b<=n -->
  <path d="M 180 330 L 100 330 L 100 184 L 178 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="74" y="258" font-size="10.5" fill="#555" font-weight="bold">否</text>
  <text x="74" y="272" font-size="10" fill="#555">b ← b+1</text>
  <text x="74" y="286" font-size="10" fill="#888">回到 b≤n?</text>

  <!-- Yes ↓ -->
  <path d="M 270 366 L 270 384" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="380" font-size="10.5" fill="#4a7a3a">是</text>

  <!-- 6. gcd check + decision -->
  <rect x="150" y="384" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="406" text-anchor="middle" font-size="12" fill="#333">g ← gcd(a, b)</text>

  <!-- Right: gcd==1 ? -->
  <polygon points="430,384 510,401 430,418 350,401" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="398" text-anchor="middle" font-size="10.5" fill="#333">g = 1 ?</text>
  <text x="430" y="412" text-anchor="middle" font-size="9.5" fill="#888">最简?</text>

  <path d="M 310 401 L 350 401" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes: add "a/b" -->
  <path d="M 430 418 L 430 430" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="424" width="116" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="435" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">是 → res.add("a/b")</text>

  <!-- No: skip -->
  <path d="M 510 401 L 525 401" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="515" y="392" font-size="9.5" fill="#b85450">否,跳过</text>

  <!-- a++ loop back: from bottom of add or skip, back to a<b? -->
  <path d="M 430 438 L 430 460 L 270 460 L 270 294" stroke="#666" stroke-width="0" fill="none"/>
  <path d="M 270 366 L 270 294" stroke="#666" stroke-width="0" fill="none"/>

  <!-- Loop back arrow for a++ (right side, dashed) -->
  <path d="M 430 438 L 530 438 L 530 330 L 360 330" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="534" y="386" font-size="10" fill="#4a7a3a" font-weight="bold">a ← a+1</text>
  <text x="534" y="400" font-size="9.5" fill="#888">回到 a&lt;b?</text>
</svg>
