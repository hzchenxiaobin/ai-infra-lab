<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：分组排序后逐位贪心回填</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="56" font-size="12" fill="#b85450" font-weight="bold">示例 1：num = 1234 → 3412</text>

  <!-- original -->
  <text x="40" y="82" font-size="10" fill="#666">原数</text>
  <g font-size="12">
    <rect x="150" y="68" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="171" y="88" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="198" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="219" y="88" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="246" y="68" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="267" y="88" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="294" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="315" y="88" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>
  <text x="171" y="110" text-anchor="middle" font-size="8" fill="#d6a040">奇</text>
  <text x="219" y="110" text-anchor="middle" font-size="8" fill="#446688">偶</text>
  <text x="267" y="110" text-anchor="middle" font-size="8" fill="#d6a040">奇</text>
  <text x="315" y="110" text-anchor="middle" font-size="8" fill="#446688">偶</text>

  <!-- sorted groups -->
  <text x="40" y="138" font-size="10" fill="#d6a040" font-weight="bold">奇↓</text>
  <g font-size="12">
    <rect x="80" y="124" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="101" y="144" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="128" y="124" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="149" y="144" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <text x="240" y="138" font-size="10" fill="#446688" font-weight="bold">偶↓</text>
  <g font-size="12">
    <rect x="280" y="124" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="301" y="144" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="328" y="124" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="349" y="144" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- fill order annotations -->
  <text x="400" y="138" font-size="9" fill="#888">位0奇→取3</text>
  <text x="400" y="152" font-size="9" fill="#888">位1偶→取4</text>

  <!-- result -->
  <path d="M 280 162 L 280 178" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="200" font-size="10" fill="#b85450" font-weight="bold">结果</text>
  <g font-size="13">
    <rect x="150" y="186" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="171" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="198" y="186" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="219" y="206" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="246" y="186" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="267" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="294" y="186" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="315" y="206" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>
  <text x="360" y="206" font-size="10" fill="#b85450" font-weight="bold">= 3412</text>

  <!-- divider -->
  <line x1="40" y1="236" x2="520" y2="236" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="262" font-size="12" fill="#b85450" font-weight="bold">示例 2：num = 65875 → 87655</text>

  <!-- original -->
  <text x="40" y="288" font-size="10" fill="#666">原数</text>
  <g font-size="12">
    <rect x="120" y="274" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="141" y="294" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="168" y="274" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="189" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="216" y="274" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="237" y="294" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="264" y="274" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="285" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <rect x="312" y="274" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="333" y="294" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="141" y="316" text-anchor="middle" font-size="8" fill="#446688">偶</text>
  <text x="189" y="316" text-anchor="middle" font-size="8" fill="#d6a040">奇</text>
  <text x="237" y="316" text-anchor="middle" font-size="8" fill="#446688">偶</text>
  <text x="285" y="316" text-anchor="middle" font-size="8" fill="#d6a040">奇</text>
  <text x="333" y="316" text-anchor="middle" font-size="8" fill="#d6a040">奇</text>

  <!-- sorted groups -->
  <text x="40" y="346" font-size="10" fill="#d6a040" font-weight="bold">奇↓</text>
  <g font-size="12">
    <rect x="80" y="332" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="101" y="352" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <rect x="128" y="332" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="149" y="352" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="176" y="332" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="197" y="352" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <text x="240" y="346" font-size="10" fill="#446688" font-weight="bold">偶↓</text>
  <g font-size="12">
    <rect x="280" y="332" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="301" y="352" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="328" y="332" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="349" y="352" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
  </g>

  <!-- fill order -->
  <text x="400" y="340" font-size="9" fill="#888">位0偶→取8</text>
  <text x="400" y="354" font-size="9" fill="#888">位1奇→取7</text>
  <text x="400" y="368" font-size="9" fill="#888">位2偶→取6</text>

  <!-- result -->
  <path d="M 280 372 L 280 388" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="412" font-size="10" fill="#b85450" font-weight="bold">结果</text>
  <g font-size="13">
    <rect x="120" y="398" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="141" y="418" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="168" y="398" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="189" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <rect x="216" y="398" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="237" y="418" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="264" y="398" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="285" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="312" y="398" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="333" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="370" y="418" font-size="10" fill="#b85450" font-weight="bold">= 87655</text>

  <!-- legend -->
  <rect x="40" y="448" width="480" height="42" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="466" font-size="10" fill="#d6a040">奇数位（橙）：从奇数集合取当前最大</text>
  <text x="55" y="482" font-size="10" fill="#446688">偶数位（蓝）：从偶数集合取当前最大</text>
  <text x="300" y="466" font-size="10" fill="#888">位的奇偶性不变，只换同奇偶数字</text>
  <text x="300" y="482" font-size="10" fill="#b85450">贪心：大数优先高位 → 全局最大</text>
</svg>
