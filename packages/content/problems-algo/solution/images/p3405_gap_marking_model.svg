<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：数组 =「首元素」+ n−1 个相邻间隔的 = / ≠ 标记</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">好数组 ⟺ 恰好 k 个「=」间隔 —— 先选标记方案，再顺着标记填数</text>

  <!-- 示例数组 n=5, k=2 -->
  <text x="90" y="56" font-size="10.5" fill="#666" filter="url(#rough2)">示例 n=5, k=2：</text>

  <g filter="url(#rough2)">
    <rect x="90" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="162" y="58" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="234" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="306" y="58" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="378" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="116" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="188" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f">2</text>
    <text x="260" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">5</text>
    <text x="332" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f">5</text>
    <text x="404" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">3</text>

    <rect x="142" y="67" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="214" y="67" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="286" y="67" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="358" y="67" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="152" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">=</text>
    <text x="224" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">≠</text>
    <text x="296" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">=</text>
    <text x="368" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">≠</text>
  </g>
  <text x="452" y="76" font-size="10" fill="#b85450" filter="url(#rough2)">← k=2 个「=」</text>

  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">蓝 = 游程开头（新值）｜橙 = 沿袭前值｜相等模式唯一 ⇒ 按标记方案分类，不重不漏</text>

  <!-- 三个因子卡片 -->
  <g filter="url(#rough2)">
    <rect x="18" y="138" width="152" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="94" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">① 选标记方案</text>
    <text x="94" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">C(n−1, k)</text>
    <text x="94" y="195" text-anchor="middle" font-size="9.5" fill="#55677d">从 n−1 个间隔选 k 个「=」</text>

    <rect x="184" y="138" width="152" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">② 首元素任取</text>
    <text x="260" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">m 种</text>
    <text x="260" y="195" text-anchor="middle" font-size="9.5" fill="#4a6a3f">arr[0] 取遍 [1, m]</text>

    <rect x="350" y="138" width="152" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="426" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">③ 顺着间隔填后续</text>
    <text x="426" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">「=」→1 种｜「≠」→m−1 种</text>
    <text x="426" y="195" text-anchor="middle" font-size="9.5" fill="#8a6d1f">「≠」共 n−1−k 个</text>
  </g>

  <text x="260" y="224" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">三步相互独立 ⇒ 乘法原理连乘：</text>

  <g filter="url(#rough2)">
    <text x="150" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">ans = C(n−1, k)</text>
    <text x="240" y="251" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">×</text>
    <text x="264" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">m</text>
    <text x="290" y="251" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">×</text>
    <text x="322" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">(m−1)</text>
    <text x="356" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">n−1−k</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="272" width="400" height="66" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#33506b">· 固定标记后填法 = m·(m−1)^(n−1−k)：首值任取，「=」锁值、「≠」避值</text>
    <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#33506b">· 不同标记方案产出的数组互不相同，「恰好 k」无需容斥去重</text>
    <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#b85450">· 边界自动成立：k=n−1 → 0⁰=1 → ans=m；m=1 且 k&lt;n−1 → ans=0</text>
  </g>
</svg>
