<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：示例 2，positive={smart,brilliant,studious}，negative={not}，k=2 → [2,1]</text>

  <!-- 学生 1 -->
  <text x="30" y="48" font-size="11" fill="#446688" font-weight="bold">学生 ID = 1：report = "this student is not studious"</text>

  <rect x="30" y="56" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="11" fill="#333">this</text>
  <rect x="118" y="56" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="72" text-anchor="middle" font-size="11" fill="#333">student</text>
  <rect x="206" y="56" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="72" text-anchor="middle" font-size="11" fill="#333">is</text>
  <rect x="294" y="56" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">not</text>
  <rect x="382" y="56" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">studious</text>

  <text x="70" y="94" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="158" y="94" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="246" y="94" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="334" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="422" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+3</text>

  <text x="30" y="112" font-size="11" fill="#333">score = 0 + 0 + 0 + (−1) + (+3) = </text>
  <rect x="250" y="100" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 学生 2 -->
  <text x="30" y="146" font-size="11" fill="#446688" font-weight="bold">学生 ID = 2：report = "the student is smart"</text>

  <rect x="30" y="154" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#333">the</text>
  <rect x="118" y="154" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="170" text-anchor="middle" font-size="11" fill="#333">student</text>
  <rect x="206" y="154" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="170" text-anchor="middle" font-size="11" fill="#333">is</text>
  <rect x="294" y="154" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">smart</text>

  <text x="70" y="192" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="158" y="192" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="246" y="192" text-anchor="middle" font-size="10" fill="#888">+0</text>
  <text x="334" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+3</text>

  <text x="30" y="210" font-size="11" fill="#333">score = 0 + 0 + 0 + (+3) = </text>
  <rect x="206" y="198" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="226" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- 排序与取 k -->
  <rect x="30" y="230" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="252" font-size="12" fill="#d6a040" font-weight="bold">排序与取前 k</text>
  <text x="48" y="272" font-size="11" fill="#333">学生列表（score, id）：[(2,1), (3,2)]</text>
  <text x="48" y="290" font-size="11" fill="#333">排序键 (−score, id)：[(−3,2), (−2,1)]</text>
  <text x="48" y="308" font-size="11" fill="#333">　→　得分高者居前；同分按 id 升序</text>

  <path d="M 430 296 L 430 316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="372" y="318" width="118" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="431" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">取 k=2 → [2, 1]</text>
</svg>
