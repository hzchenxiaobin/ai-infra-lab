<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楤体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L0,9 L9,4.5 Z" fill="#888"/>
    </marker>
  </defs>
<rect width="520" height="460" fill="#fafafa"/>
<text x="260.0" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：整体翻 + 逐词翻（原地 O(1)）</text>
<rect x="205.0" y="42" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
<path d="M 260 74 L 260 86" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<rect x="100.0" y="88" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="109" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 整体翻转　reverse(s, 0, n-1)</text>
<path d="M 260 124 L 260 136" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<rect x="100.0" y="138" width="320" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="159" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 逐词翻转　start = 0，遍历 i = 0 → n</text>
<path d="M 260 174 L 260 186" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<rect x="60" y="188" width="400" height="178" rx="10" fill="none" stroke="#aaa" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
<text x="74" y="206" font-size="11" fill="#888" font-style="italic" filter="url(#rough2)">for i = 0 → n （原地扫描单词边界）</text>
<polygon points="260.0,218 332.0,240 260.0,262 188.0,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="244" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i==n 或 s[i]==' '?</text>
<path d="M 260 262 L 260 280" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<text x="270.0" y="274" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
<rect x="110.0" y="282" width="300" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">reverse(s, start, i-1)</text>
<text x="260.0" y="315" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">start = i + 1</text>
<path d="M 332.0 240 L 370.0 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="342.0" y="234" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
<rect x="372.0" y="226" width="76" height="28" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
<text x="410.0" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i++</text>
<path d="M 410.0 226 L 410.0 200 L 260.0 200 L 260.0 218" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" stroke-dasharray="4 3" filter="url(#rough2)"/>
<path d="M 110.0 302 L 70.0 302 L 70.0 240 L 188.0 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="4 3" filter="url(#rough2)"/>
<text x="75.0" y="270" font-size="10.5" fill="#888" font-style="italic" filter="url(#rough2)">i++ 继续</text>
<path d="M 260 366 L 260 378" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<text x="268.0" y="374" font-size="10.5" fill="#888" font-style="italic" filter="url(#rough2)">i 超过 n → 退出</text>
<rect x="140.0" y="380" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="401" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 s（已原地完成）</text>
<path d="M 260 416 L 260 428" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
<rect x="205.0" y="430" width="110" height="26" rx="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
<text x="260.0" y="448" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">结束</text>
</svg>