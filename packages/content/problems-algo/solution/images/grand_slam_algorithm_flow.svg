<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：UNION ALL 拍平 → JOIN → GROUP BY → COUNT</text>

  <!-- ===== Step 1: UNION ALL 4 SELECTs ===== -->
  <text x="40" y="58" font-size="10" fill="#888">步骤 ① 把 4 个冠军列各自 SELECT，UNION ALL 纵向堆叠</text>

  <!-- 4 small select boxes -->
  <rect x="40" y="66" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="81" text-anchor="middle" font-size="9" fill="#446688">SELECT Wimbledon</text>
  <rect x="40" y="92" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="107" text-anchor="middle" font-size="9" fill="#446688">SELECT Fr_open</text>
  <rect x="40" y="118" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="133" text-anchor="middle" font-size="9" fill="#446688">SELECT US_open</text>
  <rect x="40" y="144" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="9" fill="#446688">SELECT Au_open</text>

  <!-- UNION ALL labels between -->
  <text x="174" y="91" font-size="8" fill="#d6a040" font-weight="bold">UNION ALL</text>
  <text x="174" y="117" font-size="8" fill="#d6a040" font-weight="bold">UNION ALL</text>
  <text x="174" y="143" font-size="8" fill="#d6a040" font-weight="bold">UNION ALL</text>

  <!-- result box: long table T -->
  <rect x="230" y="86" width="110" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">长表 T</text>
  <line x1="240" y1="108" x2="330" y2="108" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="122" text-anchor="middle" font-size="9" fill="#555">player_id</text>
  <text x="285" y="136" text-anchor="middle" font-size="8" fill="#888">共 12 行（3 年 × 4）</text>
  <text x="285" y="148" text-anchor="middle" font-size="8" fill="#888">含重复（同 ID 多次夺冠）</text>

  <!-- arrow from 4 selects converging to T -->
  <path d="M 162 77 L 228 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 162 103 L 228 118" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 162 129 L 228 126" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 162 155 L 228 134" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: JOIN Players ===== -->
  <text x="40" y="186" font-size="10" fill="#888">步骤 ② JOIN Players ON player_id，把 ID 翻译成姓名</text>

  <!-- Players table small -->
  <rect x="40" y="194" width="130" height="68" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="194" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="105" y="208" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Players</text>
  <text x="64" y="226" text-anchor="middle" font-size="8" fill="#555">id</text>
  <text x="120" y="226" text-anchor="middle" font-size="8" fill="#555">name</text>
  <text x="64" y="240" text-anchor="middle" font-size="8" fill="#b85450">1</text>
  <text x="120" y="240" text-anchor="middle" font-size="8" fill="#b85450">Nadal</text>
  <text x="64" y="254" text-anchor="middle" font-size="8" fill="#4a7a3a">2</text>
  <text x="120" y="254" text-anchor="middle" font-size="8" fill="#4a7a3a">Federer</text>

  <!-- JOIN diamond -->
  <polygon points="230,228 268,210 306,228 268,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="232" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">JOIN</text>
  <text x="268" y="244" text-anchor="middle" font-size="7" fill="#d6a040">ON id</text>
  <!-- arrow from T down to JOIN -->
  <path d="M 285 156 L 285 210" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow from Players to JOIN -->
  <path d="M 170 228 L 210 228" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- joined result -->
  <rect x="340" y="196" width="140" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">JOIN 后（12 行带名字）</text>
  <line x1="350" y1="218" x2="470" y2="218" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="232" font-size="8" fill="#b85450">1 Nadal</text>
  <text x="360" y="244" font-size="8" fill="#b85450">1 Nadal</text>
  <text x="360" y="256" font-size="8" fill="#4a7a3a">2 Federer</text>
  <text x="430" y="260" font-size="7" fill="#888">… 共 12 行</text>
  <!-- arrow JOIN to result -->
  <path d="M 306 228 L 338 228" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: GROUP BY ===== -->
  <text x="40" y="290" font-size="10" fill="#888">步骤 ③ GROUP BY player_id, player_name 把同球员行折叠</text>

  <!-- GROUP BY box -->
  <rect x="180" y="298" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">GROUP BY player_id, player_name</text>
  <text x="300" y="330" text-anchor="middle" font-size="8" fill="#d6a040">同 ID 的多行合并成一组</text>
  <!-- arrow from joined result down to GROUP BY -->
  <path d="M 410 264 L 380 298" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: COUNT ===== -->
  <text x="40" y="362" font-size="10" fill="#888">步骤 ④ COUNT(*) 数每组行数 = 大满贯次数</text>

  <!-- COUNT box -->
  <rect x="180" y="370" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">COUNT(*) AS grand_slams_count</text>
  <text x="300" y="402" text-anchor="middle" font-size="8" fill="#b85450">每组行数 = 该球员夺冠总次数</text>
  <!-- arrow GROUP BY to COUNT -->
  <path d="M 300 338 L 300 370" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final output ===== -->
  <text x="40" y="434" font-size="10" fill="#888">最终输出</text>
  <rect x="180" y="440" width="260" height="64" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="180" y="440" width="260" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="210" y="454" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">id</text>
  <text x="270" y="454" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">name</text>
  <text x="370" y="454" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">grand_slams</text>
  <line x1="180" y1="460" x2="440" y2="460" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="476" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="270" y="476" text-anchor="middle" font-size="9" fill="#b85450">Nadal</text>
  <text x="370" y="476" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7</text>
  <text x="210" y="494" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="270" y="494" text-anchor="middle" font-size="9" fill="#4a7a3a">Federer</text>
  <text x="370" y="494" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- arrow COUNT to output -->
  <path d="M 300 410 L 300 440" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note about Novak excluded -->
  <text x="460" y="476" font-size="8" fill="#888">Novak(3) 未夺冠</text>
  <text x="460" y="488" font-size="8" fill="#888">→ 无匹配行</text>
  <text x="460" y="500" font-size="8" fill="#888">→ 自动排除</text>
</svg>
