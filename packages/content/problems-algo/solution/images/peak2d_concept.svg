<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">行二分 + 列最大值：把 2D 降维成 1D</text>

  <!-- ===== Left: 3x3 matrix ===== -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#777">mat（中间行 mid=1 高亮）</text>

  <!-- row 0 -->
  <rect x="70" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="14" fill="#333">10</text>
  <rect x="130" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="14" fill="#333">20</text>
  <rect x="190" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="94" text-anchor="middle" font-size="14" fill="#333">15</text>

  <!-- row 1 (mid) highlighted -->
  <rect x="70" y="108" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="14" fill="#333">21</text>
  <rect x="130" y="108" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">30</text>
  <rect x="190" y="108" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="14" fill="#333">14</text>

  <!-- row 2 -->
  <rect x="70" y="148" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="130" y="148" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="14" fill="#333">16</text>
  <rect x="190" y="148" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="174" text-anchor="middle" font-size="14" fill="#333">32</text>

  <!-- row index labels -->
  <text x="56" y="92" text-anchor="end" font-size="10" fill="#aaa">0</text>
  <text x="56" y="132" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="56" y="172" text-anchor="end" font-size="10" fill="#aaa">2</text>
  <text x="40" y="132" text-anchor="end" font-size="10" fill="#d6a040" font-style="italic">mid</text>

  <!-- maxCol marker below -->
  <path d="M160 192 L160 204" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">maxCol</text>
  <text x="160" y="230" text-anchor="middle" font-size="9.5" fill="#b85450">行最大值列</text>

  <!-- left/right already smaller annotation -->
  <text x="100" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a">21 &lt; 30 ✓</text>
  <text x="220" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a">14 &lt; 30 ✓</text>
  <text x="130" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a">水平峰值性已锁定</text>

  <!-- up neighbor arrow -->
  <path d="M160 106 L160 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="248" y="92" font-size="10" fill="#4a7a3a">上邻 20 &lt; 30 ✓</text>

  <!-- down neighbor arrow -->
  <path d="M160 150 L160 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="248" y="172" font-size="10" fill="#4a7a3a">下邻 16 &lt; 30 ✓</text>

  <!-- peak callout -->
  <path d="M190 128 L250 128 L270 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="276" y="106" font-size="11" fill="#b85450" font-weight="bold">峰值！</text>
  <text x="276" y="120" font-size="9.5" fill="#b85450">返回 [1,1]</text>

  <!-- ===== Right: two-case decision panels ===== -->
  <text x="415" y="58" text-anchor="middle" font-size="12" fill="#777">决策：比上下邻居</text>

  <!-- Case up larger -->
  <rect x="320" y="80" width="220" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="102" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">上邻 &gt; cur</text>
  <path d="M400 132 L400 110" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="412" y="124" font-size="10" fill="#b85450">向上爬</text>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bottom = mid − 1</text>
  <text x="430" y="164" text-anchor="middle" font-size="9.5" fill="#888">上半区必含峰值</text>

  <!-- Case down larger -->
  <rect x="320" y="184" width="220" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">下邻 &gt; cur</text>
  <path d="M400 220 L400 242" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="412" y="236" font-size="10" fill="#4a7a3a">向下爬</text>
  <text x="430" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">top = mid + 1</text>
  <text x="430" y="272" text-anchor="middle" font-size="9.5" fill="#888">下半区必含峰值</text>

  <!-- summary footer -->
  <rect x="40" y="300" width="500" height="100" fill="#f6f8fa" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两步降维</text>
  <text x="60" y="346" font-size="11" fill="#555">① 行最大值 → 锁定水平峰值性（cur 严格大于左右邻居）</text>
  <text x="60" y="364" font-size="11" fill="#555">② 比上下邻居 → 退化为 1D 斜率二分（沿更高方向走必达峰）</text>
  <text x="60" y="384" font-size="10.5" fill="#888" font-style="italic">每轮 O(n) 探测 + O(log m) 轮 → 总 O(n log m)</text>
</svg>
