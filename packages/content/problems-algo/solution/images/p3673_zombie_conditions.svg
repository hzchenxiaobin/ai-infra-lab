<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">「僵尸会话」四个判据，全是组级聚合值</text>

  <!-- left: session S001 events -->
  <text x="128" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">会话 S001（用户 201）的 8 行事件</text>

  <rect x="48" y="70" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="88" font-size="12" fill="#333" filter="url(#rough2)">10:00</text>
  <text x="196" y="88" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">app_open</text>
  <text x="34" y="87" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">首事件</text>

  <rect x="48" y="100" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="118" font-size="12" fill="#333" filter="url(#rough2)">10:05</text>
  <text x="196" y="118" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">scroll</text>

  <rect x="48" y="130" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="148" font-size="12" fill="#333" filter="url(#rough2)">10:10</text>
  <text x="196" y="148" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">scroll</text>

  <text x="128" y="168" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⋮ 10:15 ~ 10:25 还有 4 条 scroll</text>

  <rect x="48" y="176" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="194" font-size="12" fill="#333" filter="url(#rough2)">10:30</text>
  <text x="196" y="194" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">scroll</text>

  <rect x="48" y="206" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="224" font-size="12" fill="#333" filter="url(#rough2)">10:35</text>
  <text x="196" y="224" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">app_close</text>
  <text x="34" y="223" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">末事件</text>

  <!-- green duration box -->
  <rect x="40" y="240" width="182" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="131" y="262" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">MAX − MIN = 会话时长</text>
  <text x="131" y="282" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">TIMESTAMPDIFF = 35 分 ✓</text>
  <text x="131" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（event_value 列用不上）</text>

  <!-- arrow: one GROUP BY -->
  <path d="M 226 160 L 246 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">GROUP BY</text>
  <text x="236" y="180" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">session_id</text>

  <!-- right: four condition boxes -->
  <rect x="252" y="48" width="234" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="70" text-anchor="middle" font-size="13" fill="#2a3a55" filter="url(#rough2)">① 时长 &gt; 30 分钟</text>
  <text x="369" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">TIMESTAMPDIFF(MINUTE, MIN, MAX) = 35 ✓</text>

  <rect x="252" y="116" width="234" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="138" text-anchor="middle" font-size="13" fill="#2a4a20" filter="url(#rough2)">② 滚动 ≥ 5 次</text>
  <text x="369" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">SUM(type='scroll') = 6 ✓</text>

  <rect x="252" y="184" width="234" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="206" text-anchor="middle" font-size="13" fill="#6a5010" filter="url(#rough2)">③ 点击滚动比 &lt; 0.20（严格）</text>
  <text x="369" y="228" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">clicks×5 &lt; scrolls：0×5 &lt; 6 ✓</text>

  <rect x="252" y="252" width="234" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="274" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">④ 会话内零购买</text>
  <text x="369" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">SUM(type='purchase') = 0 ✓</text>

  <!-- bottom warning -->
  <rect x="40" y="314" width="446" height="40" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="263" y="331" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">⚠️ 边界：S003 是 1 click ÷ 5 scroll = 0.20，恰好压线</text>
  <text x="263" y="348" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">「低于 0.20」为严格小于 → S003 出局</text>
</svg>
