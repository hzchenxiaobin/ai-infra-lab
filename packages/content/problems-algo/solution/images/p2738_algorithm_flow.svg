<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两次 LIKE 过滤 + COUNT + UNION ALL</text>

  <!-- Files table -->
  <rect x="16" y="50" width="110" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="71" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Files 表</text>
  <line x1="26" y1="78" x2="116" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="71" y="92" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">file_name</text>
  <text x="71" y="106" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">content</text>
  <text x="71" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">N 个文件</text>

  <!-- arrow to bull branch -->
  <path d="M130 80 L170 80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M130 110 L170 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- bull branch -->
  <rect x="176" y="56" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="256" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">WHERE content</text>
  <text x="256" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">LIKE '% bull %'</text>
  <text x="256" y="102" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">筛出含␣bull␣的行</text>

  <!-- bear branch -->
  <rect x="176" y="114" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="256" y="132" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">WHERE content</text>
  <text x="256" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">LIKE '% bear %'</text>
  <text x="256" y="160" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">筛出含␣bear␣的行</text>

  <!-- arrows to COUNT -->
  <path d="M340 81 L380 81" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M340 139 L380 139" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- COUNT(*) bull -->
  <rect x="386" y="62" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="421" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">COUNT(*)</text>
  <text x="421" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">= 3</text>

  <!-- COUNT(*) bear -->
  <rect x="386" y="120" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="421" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">COUNT(*)</text>
  <text x="421" y="152" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">= 2</text>

  <!-- labels -->
  <text x="421" y="58" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">'bull'</text>
  <text x="421" y="116" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">'bear'</text>

  <!-- UNION ALL box -->
  <path d="M460 81 L478 81" stroke="#d6a040" stroke-width="2" marker-end="url(#arrs)" fill="none" filter="url(#rough2)"/>
  <path d="M460 139 L478 139" stroke="#d6a040" stroke-width="2" marker-end="url(#arrs)" fill="none" filter="url(#rough2)"/>
  <rect x="482" y="80" width="62" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="513" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">UNION</text>
  <text x="513" y="114" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">ALL</text>
  <text x="513" y="130" text-anchor="middle" font-size="8" fill="#a07820" filter="url(#rough2)">合并两行</text>

  <!-- result table -->
  <rect x="176" y="200" width="200" height="80" fill="#fafafa" stroke="#333" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="276" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出结果</text>
  <line x1="186" y1="226" x2="366" y2="226" stroke="#333" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="206" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">word</text>
  <text x="306" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count</text>
  <text x="206" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">bull</text>
  <text x="306" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="206" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">bear</text>
  <text x="306" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- arrow from UNION ALL to result -->
  <path d="M513 142 L513 180 L276 180 L276 198" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrs)" fill="none" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="36" y="300" width="488" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">💡 COUNT(*) 数的是「含目标词的文件数」，非出现次数</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">UNION ALL 合并两行 → 无需去重（bull 与 bear 必不同）</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">LIKE 不区分大小写（MySQL 默认排序规则 ci 后缀）</text>
</svg>
