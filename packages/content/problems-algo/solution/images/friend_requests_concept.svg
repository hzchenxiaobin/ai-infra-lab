<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按「申请对」去重 + 两表计数取比</text>

  <!-- FriendRequest table (top-left) -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">FriendRequest（已发送申请）</text>
  <rect x="35" y="62" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="78" font-size="9" fill="#333">sender_id</text>
  <text x="135" y="78" font-size="9" fill="#333">send_to_id</text>
  <text x="210" y="78" font-size="9" fill="#333">request_date</text>
  <line x1="95" y1="62" x2="95" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="62" x2="175" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="35" y="86" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="100" font-size="9" fill="#333">1</text>
  <text x="135" y="100" font-size="9" fill="#333">2</text>
  <text x="210" y="100" font-size="9" fill="#333">2016-06-01</text>
  <line x1="95" y1="86" x2="95" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="86" x2="175" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="35" y="106" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="120" font-size="9" fill="#333">1</text>
  <text x="135" y="120" font-size="9" fill="#333">3</text>
  <text x="210" y="120" font-size="9" fill="#333">2016-06-01</text>
  <line x1="95" y1="106" x2="95" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="106" x2="175" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="35" y="126" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="140" font-size="9" fill="#333">1</text>
  <text x="135" y="140" font-size="9" fill="#333">4</text>
  <text x="210" y="140" font-size="9" fill="#333">2016-06-01</text>
  <line x1="95" y1="126" x2="95" y2="146" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="126" x2="175" y2="146" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="35" y="146" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="160" font-size="9" fill="#333">2</text>
  <text x="135" y="160" font-size="9" fill="#333">3</text>
  <text x="210" y="160" font-size="9" fill="#333">2016-06-02</text>
  <line x1="95" y1="146" x2="95" y2="166" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="146" x2="175" y2="166" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="35" y="166" width="230" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="180" font-size="9" fill="#333">3</text>
  <text x="135" y="180" font-size="9" fill="#333">4</text>
  <text x="210" y="180" font-size="9" fill="#333">2016-06-09</text>
  <line x1="95" y1="166" x2="95" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="166" x2="175" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="150" y="204" text-anchor="middle" font-size="9" fill="#d6a040">↑ 5 个不同 (sender, send_to) 对 → 去重后仍 5</text>

  <!-- RequestAccepted table (top-right) -->
  <text x="465" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">RequestAccepted（已通过申请）</text>
  <rect x="345" y="62" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="78" font-size="9" fill="#333">requester_id</text>
  <text x="460" y="78" font-size="9" fill="#333">accepter_id</text>
  <text x="545" y="78" font-size="9" fill="#333">accept_date</text>
  <line x1="415" y1="62" x2="415" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="62" x2="505" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="345" y="86" width="240" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="100" font-size="9" fill="#333">1</text>
  <text x="460" y="100" font-size="9" fill="#333">2</text>
  <text x="545" y="100" font-size="9" fill="#333">2016-06-03</text>
  <line x1="415" y1="86" x2="415" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="86" x2="505" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="345" y="106" width="240" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="120" font-size="9" fill="#333">1</text>
  <text x="460" y="120" font-size="9" fill="#333">3</text>
  <text x="545" y="120" font-size="9" fill="#333">2016-06-08</text>
  <line x1="415" y1="106" x2="415" y2="126" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="106" x2="505" y2="126" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="345" y="126" width="240" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="140" font-size="9" fill="#333">2</text>
  <text x="460" y="140" font-size="9" fill="#333">3</text>
  <text x="545" y="140" font-size="9" fill="#333">2016-06-08</text>
  <line x1="415" y1="126" x2="415" y2="146" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="126" x2="505" y2="146" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="345" y="146" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="370" y="160" font-size="9" fill="#333">3</text>
  <text x="460" y="160" font-size="9" fill="#333">4</text>
  <text x="545" y="160" font-size="9" fill="#333">2016-06-09</text>
  <line x1="415" y1="146" x2="415" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="146" x2="505" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="345" y="166" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="180" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="460" y="180" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="545" y="180" font-size="9" fill="#333">2016-06-10</text>
  <line x1="415" y1="166" x2="415" y2="186" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="166" x2="505" y2="186" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="465" y="204" text-anchor="middle" font-size="9" fill="#b85450">↑ (3,4) 重复一次 → 去重后只算 1 个 → 共 4 个</text>

  <!-- Down arrows: DISTINCT -->
  <path d="M150 214 L150 244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="234" font-size="9.5" fill="#446688" font-weight="bold">DISTINCT</text>
  <text x="168" y="246" font-size="9" fill="#446688">sender_id, send_to_id</text>

  <path d="M465 214 L465 244" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="483" y="234" font-size="9.5" fill="#4a7a3a" font-weight="bold">DISTINCT</text>
  <text x="483" y="246" font-size="9" fill="#4a7a3a">requester_id, accepter_id</text>

  <!-- Counts -->
  <rect x="60" y="252" width="180" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="272" text-anchor="middle" font-size="10" fill="#333">已发送申请数</text>
  <text x="150" y="290" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>

  <rect x="375" y="252" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="272" text-anchor="middle" font-size="10" fill="#333">已通过申请数</text>
  <text x="465" y="290" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Divide arrows converging -->
  <path d="M150 300 L260 332" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M465 300 L355 332" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Ratio box -->
  <rect x="200" y="336" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#333">accept_rate = 通过 / 发送</text>
  <text x="310" y="382" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4 / 5 = 0.80</text>

  <!-- Down arrow to final -->
  <path d="M310 396 L310 422" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final output -->
  <rect x="220" y="428" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="444" text-anchor="middle" font-size="10" fill="#333">accept_rate（ROUND(...,2)）</text>
  <rect x="220" y="452" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="468" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0.80</text>

  <!-- Footer note -->
  <rect x="50" y="494" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="512" text-anchor="middle" font-size="10" fill="#333">主键含 date → 同一申请对可重复（如 (3,4) 被 accept 两次）</text>
  <text x="310" y="528" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">必须按 (sender,send_to) / (requester,accepter) 去重再计数</text>
  <text x="310" y="544" text-anchor="middle" font-size="9.5" fill="#446688">两表列名不同（sender vs requester），不 JOIN 匹配，各自独立计数取比</text>
</svg>
