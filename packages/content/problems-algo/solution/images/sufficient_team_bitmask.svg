<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：技能 → 位掩码，对技能集合做状压 DP</text>

  <!-- Section 1: req_skills -> bit positions -->
  <text x="20" y="56" font-size="11" fill="#888">① 技能 → 位编号</text>

  <rect x="20" y="64" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="82" text-anchor="middle" font-size="10.5" fill="#333">java</text>

  <rect x="160" y="64" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="82" text-anchor="middle" font-size="10.5" fill="#333">nodejs</text>

  <rect x="300" y="64" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="82" text-anchor="middle" font-size="10.5" fill="#333">reactjs</text>

  <!-- bit labels -->
  <text x="85" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bit 0</text>
  <text x="225" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bit 1</text>
  <text x="365" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bit 2</text>

  <!-- arrows down -->
  <path d="M 85 96 L 85 106" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 96 L 225 106" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 96 L 365 106" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section 2: people -> bitmask -->
  <text x="20" y="138" font-size="11" fill="#888">② 人员 → 位掩码</text>

  <!-- person 0 -->
  <rect x="20" y="146" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="30" y="164" font-size="10" fill="#333">人员0: [java]</text>

  <rect x="200" y="146" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">001</text>

  <path d="M 192 160 L 196 160" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- person 1 -->
  <rect x="20" y="182" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="30" y="200" font-size="10" fill="#333">人员1: [nodejs]</text>

  <rect x="200" y="182" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">010</text>

  <path d="M 192 196 L 196 196" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- person 2 -->
  <rect x="20" y="218" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="30" y="236" font-size="10" fill="#333">人员2: [nodejs,reactjs]</text>

  <rect x="200" y="218" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">110</text>

  <path d="M 192 232 L 196 232" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bit grid illustration on the right -->
  <text x="360" y="164" font-size="10" fill="#888">位：</text>
  <rect x="390" y="150" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="402" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="416" y="150" width="24" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="167" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="442" y="150" width="24" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="454" y="167" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="476" y="167" font-size="9" fill="#888">= java</text>

  <text x="360" y="200" font-size="10" fill="#888">位：</text>
  <rect x="390" y="186" width="24" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="402" y="203" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="416" y="186" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="428" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="442" y="186" width="24" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="454" y="203" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="476" y="203" font-size="9" fill="#888">= nodejs</text>

  <text x="360" y="236" font-size="10" fill="#888">位：</text>
  <rect x="390" y="222" width="24" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="402" y="239" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="416" y="222" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="428" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="442" y="222" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="454" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="476" y="239" font-size="9" fill="#888">= nodejs+react</text>

  <!-- Section 3: DP state -->
  <text x="20" y="278" font-size="11" fill="#888">③ DP 状态定义</text>

  <rect x="20" y="286" width="520" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[mask] = 覆盖技能集合 mask 所需的最少人数</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555">转移：dp[s | p_i] = min(dp[s | p_i], dp[s] + 1)</text>

  <!-- key insight box -->
  <rect x="20" y="350" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为什么对技能做状压？2^16 ≪ 2^60</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#555">选值域最小的维度做 mask —— 这是状压 DP 的核心原则</text>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#888">n ≤ 16 → 2^n = 65536 个状态可枚举；m ≤ 60 → 2^60 不可行</text>
</svg>
