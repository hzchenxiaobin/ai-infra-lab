<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：Department LEFT JOIN Student → GROUP BY → COUNT</text>

  <!-- Step 1: FROM -->
  <rect x="170" y="46" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM Department d</text>
  <text x="280" y="80" text-anchor="middle" font-size="9.5" fill="#555">左表为驱动表，保证全部门入结果</text>

  <path d="M280 92 L280 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: LEFT JOIN -->
  <rect x="120" y="112" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② LEFT JOIN Student s</text>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">ON d.dept_id = s.dept_id</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#555">无学生的部门右表列填 NULL（保留行）</text>

  <path d="M280 170 L280 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY -->
  <rect x="140" y="190" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ GROUP BY d.dept_id, d.dept_name</text>
  <text x="280" y="226" text-anchor="middle" font-size="9.5" fill="#555">按部门分桶，每个部门压缩成一行</text>
  <text x="280" y="240" text-anchor="middle" font-size="9" fill="#888">dept_id 主键确定 dept_name，可只 GROUP BY dept_id</text>

  <path d="M280 248 L280 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT + COUNT -->
  <rect x="110" y="268" width="340" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ SELECT d.dept_name,</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">COUNT(s.student_id) AS student_number</text>
  <text x="280" y="320" text-anchor="middle" font-size="9.5" fill="#555">COUNT(student_id) 忽略 NULL → 空部门得 0</text>
  <text x="280" y="332" text-anchor="middle" font-size="9" fill="#888">⚠ COUNT(*) 会对空部门的 NULL 行计 1（错）</text>

  <path d="M280 340 L280 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: ORDER BY (optional) -->
  <rect x="150" y="360" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ ORDER BY student_number DESC</text>
  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#555">（可选）按人数降序，便于阅读</text>

  <path d="M280 410 L280 432" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="100" y="432" width="360" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输出：dept_name | student_number</text>
  <text x="280" y="470" text-anchor="middle" font-size="10" fill="#333">Engineering 2 ｜ Science 1 ｜ Law 0</text>
  <text x="280" y="488" text-anchor="middle" font-size="9" fill="#4a7a3a">所有部门均在结果中，空部门 Law = 0</text>
</svg>
