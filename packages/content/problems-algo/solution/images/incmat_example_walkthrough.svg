<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：n=3, queries = [[1,1,2,2],[0,0,1,1]]</text>

  <!-- Left: diff grid 4x4, origin (44,92), cell 42 -->
  <g filter="url(#rough2)">
    <text x="128" y="80" text-anchor="middle" font-size="13" fill="#446688">差分数组 d（打完 4 组标记）</text>
    <g stroke="#bbbbbb" stroke-width="1">
      <rect x="44" y="92" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="86" y="92" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="128" y="92" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="170" y="92" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="44" y="134" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="86" y="134" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="128" y="134" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="170" y="134" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="44" y="176" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="86" y="176" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="128" y="176" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="170" y="176" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="44" y="218" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="86" y="218" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="128" y="218" width="42" height="42" rx="2" fill="#f4f4f4"/>
      <rect x="170" y="218" width="42" height="42" rx="2" fill="#f4f4f4"/>
    </g>
    <!-- values -->
    <g font-size="15" fill="#2b2b2b" text-anchor="middle">
      <text x="65" y="119">1</text>
      <text x="107" y="119">0</text>
      <text x="149" y="119" fill="#b85450">−1</text>
      <text x="191" y="119">0</text>
      <text x="65" y="161">0</text>
      <text x="107" y="161">1</text>
      <text x="149" y="161">0</text>
      <text x="191" y="161" fill="#b85450">−1</text>
      <text x="65" y="203" fill="#b85450">−1</text>
      <text x="107" y="203">0</text>
      <text x="149" y="203">1</text>
      <text x="191" y="203">0</text>
      <text x="65" y="245">0</text>
      <text x="107" y="245" fill="#b85450">−1</text>
      <text x="149" y="245">0</text>
      <text x="191" y="245" fill="#4a7a3a">1</text>
    </g>
  </g>

  <!-- middle arrow -->
  <g filter="url(#rough2)">
    <path d="M232,168 L340,168" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)"/>
    <text x="286" y="158" text-anchor="middle" font-size="12" fill="#d6a040">二维前缀和</text>
    <text x="286" y="184" text-anchor="middle" font-size="11" fill="#888">逐格累加还原</text>
  </g>

  <!-- Right: result 3x3, origin (360,96), cell 48 -->
  <g filter="url(#rough2)">
    <text x="432" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a">答案矩阵 mat</text>
    <g stroke="#4a7a3a" stroke-width="1.4">
      <rect x="360" y="96" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="408" y="96" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="456" y="96" width="48" height="48" rx="2" fill="#f4f4f4"/>
      <rect x="360" y="144" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="408" y="144" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="456" y="144" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="360" y="192" width="48" height="48" rx="2" fill="#f4f4f4"/>
      <rect x="408" y="192" width="48" height="48" rx="2" fill="#e6f4ea"/>
      <rect x="456" y="192" width="48" height="48" rx="2" fill="#e6f4ea"/>
    </g>
    <g font-size="17" fill="#2b2b2b" text-anchor="middle" font-weight="bold">
      <text x="384" y="126">1</text>
      <text x="432" y="126">1</text>
      <text x="480" y="126">0</text>
      <text x="384" y="174">1</text>
      <text x="432" y="174">2</text>
      <text x="480" y="174">1</text>
      <text x="384" y="222">0</text>
      <text x="432" y="222">1</text>
      <text x="480" y="222">1</text>
    </g>
  </g>

  <!-- annotation -->
  <g filter="url(#rough2)">
    <text x="128" y="288" text-anchor="middle" font-size="12" fill="#888">绿色 +1 / 红色 −1 为差分标记位置</text>
    <text x="432" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a">两块子矩阵 +1 叠加</text>
    <text x="432" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a">→ 中间格 (1,1)=2</text>
  </g>
</svg>
