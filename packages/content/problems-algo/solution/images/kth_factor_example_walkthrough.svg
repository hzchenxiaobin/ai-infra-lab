<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 12，两遍扫描产出升序因子 [1,2,3,4,6,12]</text>

  <!-- n=12, isqrt=3 -->
  <rect x="232" y="42" width="116" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n=12, ⌊√12⌋ = 3</text>

  <!-- ===== Forward pass label ===== -->
  <text x="30" y="96" font-size="12" fill="#446688" font-weight="bold">前向 i=1→3</text>
  <text x="30" y="111" font-size="10" fill="#888">（小因子升序）</text>

  <!-- forward step boxes: i=1,2,3 produce factors 1,2,3 with cnt 1,2,3 -->
  <!-- step 1 -->
  <rect x="110" y="92" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#888">i=1</text>
  <text x="130" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ cnt=1</text>
  <rect x="155" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- step 2 -->
  <rect x="210" y="92" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="11" fill="#888">i=2</text>
  <text x="230" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ cnt=2</text>
  <rect x="255" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- step 3 -->
  <rect x="310" y="92" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="110" text-anchor="middle" font-size="11" fill="#888">i=3</text>
  <text x="330" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ cnt=3</text>
  <rect x="355" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- stop note -->
  <text x="410" y="110" font-size="10" fill="#b85450" font-weight="bold">i=4:</text>
  <text x="410" y="124" font-size="10" fill="#b85450">4²>12 停</text>

  <!-- divider between small and large -->
  <line x1="20" y1="150" x2="560" y2="150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <rect x="250" y="142" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">越过 √12</text>

  <!-- ===== Backward pass label ===== -->
  <text x="30" y="186" font-size="12" fill="#d6a040" font-weight="bold">反向 i=3→1</text>
  <text x="30" y="201" font-size="10" fill="#888">（大因子升序）</text>

  <!-- backward steps: i=3 -> n/i=4 cnt=4; i=2 -> 6 cnt=5; i=1 -> 12 cnt=6 -->
  <!-- step 4: i=3, n/i=4 -->
  <rect x="110" y="182" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#888">i=3</text>
  <text x="130" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">3≠4 ✓ cnt=4</text>
  <rect x="155" y="182" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="208" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- step 5: i=2, n/i=6 -->
  <rect x="210" y="182" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="11" fill="#888">i=2</text>
  <text x="230" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">2≠6 ✓ cnt=5</text>
  <rect x="255" y="182" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="208" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- step 6: i=1, n/i=12 -->
  <rect x="310" y="182" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#888">i=1</text>
  <text x="330" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">1≠12 ✓ cnt=6</text>
  <rect x="355" y="182" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="208" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- arrow down to final list -->
  <path d="M 290 234 Q 290 246 290 258" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final ordered factor list ===== -->
  <text x="30" y="276" font-size="12" fill="#333" font-weight="bold">完整升序因子：</text>

  <g filter="url(#rough2)">
    <rect x="110" y="262" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="130" y="284" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="155" y="262" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="175" y="284" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="200" y="262" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="220" y="284" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <rect x="245" y="262" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="265" y="284" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
    <rect x="290" y="262" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="310" y="284" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>
    <rect x="335" y="262" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="355" y="284" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">12</text>
  </g>

  <!-- k positions -->
  <text x="130" y="312" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <text x="175" y="312" text-anchor="middle" font-size="10" fill="#888">k=2</text>
  <text x="220" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=3</text>
  <text x="265" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k=4</text>
  <text x="310" y="312" text-anchor="middle" font-size="10" fill="#888">k=5</text>
  <text x="355" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=6</text>

  <!-- arrow from k=3 to return box -->
  <path d="M 220 316 Q 220 330 220 342" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- arrow from k=4 to return box -->
  <path d="M 265 316 Q 265 330 265 342" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- arrow from k=6 -->
  <path d="M 355 316 Q 355 330 355 342" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Return examples ===== -->
  <rect x="60" y="346" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k=3 → 前向命中</text>
  <text x="135" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 3 ✓</text>

  <rect x="220" y="346" width="150" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=4 → 反向首命中</text>
  <text x="295" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 4 ✓（跨 √n）</text>

  <rect x="380" y="346" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k=6 → 反向末命中</text>
  <text x="455" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return 12 ✓</text>

  <!-- ===== bottom note: perfect square ===== -->
  <line x1="40" y1="408" x2="540" y2="408" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="60" y="418" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="434" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">完全平方数 n=4：i=2 时 2 = 4/2，反向加条件 i ≠ n/i 跳过</text>
  <text x="290" y="448" text-anchor="middle" font-size="10.5" fill="#555">→ 因子 [1, 2, 4]，平方根因子 2 只计一次</text>
</svg>
