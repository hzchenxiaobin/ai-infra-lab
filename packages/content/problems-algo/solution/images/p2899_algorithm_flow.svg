<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：单趟遍历，栈 + 回看深度计数器</text>

  <!-- start -->
  <ellipse cx="330" cy="60" rx="108" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="#2e5c22" filter="url(#rough2)">开始：seen=[], ans=[], k=0</text>

  <path d="M 330 81 L 330 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- read element -->
  <rect x="240" y="100" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">读取下一个元素 x</text>

  <!-- end -->
  <path d="M 420 117 L 454 117" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <ellipse cx="524" cy="117" rx="66" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="524" y="121" text-anchor="middle" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">取完 → 返回 ans</text>

  <path d="M 330 134 L 330 148" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="330,152 408,192 330,232 252,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="197" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">x &gt; 0 ?</text>

  <!-- yes: push -->
  <path d="M 252 192 L 216 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="234" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="64" y="168" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="139" y="188" text-anchor="middle" font-size="11" fill="#2e5c22" filter="url(#rough2)">seen 压入 x（push）</text>
  <text x="139" y="206" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">k = 0</text>

  <!-- no: k++ -->
  <path d="M 330 232 L 330 245" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="340" y="243" text-anchor="start" font-size="11" fill="#b07818" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="265" y="249" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">k = k + 1</text>

  <path d="M 330 279 L 330 292" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="330,296 428,330 330,364 232,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="334" text-anchor="middle" font-size="11.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">k ≤ seen.size() ?</text>

  <!-- yes: take k-th -->
  <path d="M 232 330 L 220 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="227" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="48" y="308" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="133" y="326" text-anchor="middle" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">ans 追加</text>
  <text x="133" y="343" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">seen[len−k]</text>

  <!-- no: append -1 -->
  <path d="M 428 330 L 443 330" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="435" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="449" y="308" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ans 追加</text>
  <text x="508" y="343" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- loop-back bus -->
  <path d="M 508 352 L 508 384 L 28 384 L 28 117 L 234 117" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 64 192 L 34 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 48 330 L 34 330" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="130" y="108" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">处理完回到循环，取下一元素</text>
</svg>
