<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：rowSum=[3,8], colSum=[4,7]</text>

  <!-- ===== Step 1: cell(0,0) ===== -->
  <text x="40" y="62" font-size="11" fill="#d6a040" font-weight="bold">① cell(0,0): min(3,4)=3</text>
  <!-- matrix -->
  <rect x="40" y="70" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">3</text>
  <rect x="90" y="70" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="104" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="90" y="104" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row sums -->
  <text x="152" y="92" font-size="11" fill="#4a7a3a" font-family="monospace">0</text>
  <text x="152" y="126" font-size="11" fill="#4a7a3a" font-family="monospace">8</text>
  <!-- col sums -->
  <text x="65" y="152" font-size="11" fill="#b85450" font-family="monospace">1</text>
  <text x="115" y="152" font-size="11" fill="#b85450" font-family="monospace">7</text>
  <text x="40" y="168" font-size="9.5" fill="#888">行剩余 [0,8]  列剩余 [1,7]</text>

  <!-- arrow -->
  <path d="M 180 110 L 210 110" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <polygon points="210,106 218,110 210,114" fill="#446688" filter="url(#rough2)"/>

  <!-- ===== Step 2: cell(0,1) ===== -->
  <text x="230" y="62" font-size="11" fill="#d6a040" font-weight="bold">② cell(0,1): min(0,7)=0</text>
  <rect x="230" y="70" width="50" height="34" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">3</text>
  <rect x="280" y="70" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">0</text>
  <rect x="230" y="104" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="280" y="104" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="342" y="92" font-size="11" fill="#4a7a3a" font-family="monospace">0</text>
  <text x="342" y="126" font-size="11" fill="#4a7a3a" font-family="monospace">8</text>
  <text x="255" y="152" font-size="11" fill="#b85450" font-family="monospace">1</text>
  <text x="305" y="152" font-size="11" fill="#b85450" font-family="monospace">7</text>
  <text x="230" y="168" font-size="9.5" fill="#888">行剩余 [0,8]  列剩余 [1,7]</text>

  <!-- arrow -->
  <path d="M 370 110 L 400 110" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <polygon points="400,106 408,110 400,114" fill="#446688" filter="url(#rough2)"/>

  <!-- ===== Step 3: cell(1,0) ===== -->
  <text x="420" y="62" font-size="11" fill="#d6a040" font-weight="bold">③ cell(1,0): min(8,1)=1</text>
  <rect x="420" y="70" width="50" height="34" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">3</text>
  <rect x="470" y="70" width="50" height="34" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <rect x="420" y="104" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="126" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="470" y="104" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="532" y="92" font-size="11" fill="#4a7a3a" font-family="monospace">0</text>
  <text x="532" y="126" font-size="11" fill="#4a7a3a" font-family="monospace">7</text>
  <text x="445" y="152" font-size="11" fill="#b85450" font-family="monospace">0</text>
  <text x="495" y="152" font-size="11" fill="#b85450" font-family="monospace">7</text>
  <text x="420" y="168" font-size="9.5" fill="#888">行剩余 [0,7]  列剩余 [0,7]</text>

  <!-- ===== Step 4: cell(1,1) - final, on next row ===== -->
  <text x="120" y="220" font-size="11" fill="#d6a040" font-weight="bold">④ cell(1,1): min(7,7)=7  ← 最后一格，行剩余=列剩余，自然归零</text>
  <rect x="120" y="230" width="60" height="40" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">3</text>
  <rect x="180" y="230" width="60" height="40" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="256" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">0</text>
  <rect x="120" y="270" width="60" height="40" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">1</text>
  <rect x="180" y="270" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="296" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">7</text>

  <!-- final row sums -->
  <text x="252" y="254" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">0</text>
  <text x="252" y="296" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">0</text>
  <!-- final col sums -->
  <text x="150" y="328" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="210" y="328" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">0</text>

  <!-- verification box -->
  <rect x="300" y="230" width="270" height="110" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">验证结果 matrix = [[3,0],[1,7]]</text>
  <text x="320" y="274" font-size="10.5" fill="#4a7a3a">行和：3+0=3 ✓   1+7=8 ✓</text>
  <text x="320" y="292" font-size="10.5" fill="#b85450">列和：3+1=4 ✓   0+7=7 ✓</text>
  <text x="320" y="312" font-size="10" fill="#888">所有元素 ≥ 0，满足约束</text>
  <text x="320" y="328" font-size="10" fill="#888">Σ行=3+8=11 = Σ列=4+7=11 ✓</text>

  <!-- bottom note -->
  <rect x="60" y="360" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为什么一定能填出来？</text>
  <text x="300" y="402" text-anchor="middle" font-size="10.5" fill="#555">每格扣减同一个 x，Σ行剩余与Σ列剩余始终相等</text>
  <text x="300" y="420" text-anchor="middle" font-size="10.5" fill="#555">→ 走到最后一格时两者必相等，直接填入即可全部归零</text>
</svg>
