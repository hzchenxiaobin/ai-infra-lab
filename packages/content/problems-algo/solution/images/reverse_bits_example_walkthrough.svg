<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：8 位简化 n = 11001010，翻转得 01010011</text>

  <!-- 列标题 -->
  <text x="40" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步</text>
  <text x="170" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">n（每轮右移）</text>
  <text x="284" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">bit</text>
  <text x="412" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">res（左移拼入）</text>

  <!-- 分隔线 -->
  <line x1="20" y1="66" x2="520" y2="66" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 数据行：步 / n(8格) / bit / res(8格) -->
  <!-- 每行 y 起点 72，高 24，行间隔 28 -->

  <!-- 行0 初始 -->
  <text x="40" y="90" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="84" y="90" font-size="10" fill="#446688" font-weight="bold">11001010</text>
  <text x="284" y="90" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="360" y="90" font-size="10" fill="#bbb">00000000</text>

  <!-- 行1: bit=0, res=00000000 -->
  <text x="40" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="84" y="118" font-size="10" fill="#446688" font-weight="bold">11001010</text>
  <text x="284" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="360" y="118" font-size="10" fill="#bbb">00000000</text>

  <!-- 行2: bit=1, res=00000001 (高亮末位) -->
  <text x="40" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="84" y="146" font-size="10" fill="#888">01100101</text>
  <text x="284" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="354" y="134" width="14" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="361" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="376" y="146" font-size="10" fill="#bbb">0000000</text>

  <!-- 行3: bit=0, res=00000010 -->
  <text x="40" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="84" y="174" font-size="10" fill="#888">00110010</text>
  <text x="284" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="360" y="174" font-size="10" fill="#333">0000001</text>
  <rect x="368" y="162" width="14" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="375" y="176" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>

  <!-- 行4: bit=1, res=00000101 -->
  <text x="40" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="84" y="202" font-size="10" fill="#888">00011001</text>
  <text x="284" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="360" y="202" font-size="10" fill="#333">0000010</text>
  <rect x="354" y="190" width="14" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="361" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- 行5: bit=0, res=00001010 -->
  <text x="40" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="84" y="230" font-size="10" fill="#888">00001100</text>
  <text x="284" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="360" y="230" font-size="10" fill="#333">0000101</text>
  <rect x="368" y="218" width="14" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="375" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>

  <!-- 行6: bit=0, res=00010100 -->
  <text x="40" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="84" y="258" font-size="10" fill="#888">00000110</text>
  <text x="284" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="360" y="258" font-size="10" fill="#333">0001010</text>
  <rect x="368" y="246" width="14" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="375" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>

  <!-- 行7: bit=1, res=00101001 -->
  <text x="40" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="84" y="286" font-size="10" fill="#888">00000011</text>
  <text x="284" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="360" y="286" font-size="10" fill="#333">0010100</text>
  <rect x="354" y="274" width="14" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="361" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- 行8: bit=1, res=01010011 (完成) -->
  <text x="40" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="84" y="314" font-size="10" fill="#888">00000001</text>
  <text x="284" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="354" y="302" width="14" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="361" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="376" y="314" font-size="10" fill="#333">0101001</text>

  <!-- 分隔线 -->
  <line x1="20" y1="330" x2="520" y2="330" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="40" y="346" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果 res = 01010011（原 n=11001010 位序完全颠倒）✓</text>

  <!-- 底部说明 -->
  <rect x="40" y="392" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="412" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">观察：最早取的 bit（步1 的位0）每轮被左移一次，</text>
  <text x="270" y="428" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8 轮后被推到最高位 → 最终位序自然颠倒</text>
  <text x="270" y="444" text-anchor="middle" font-size="10.5" fill="#888">（8 位演示，32 位时循环 32 次同理）</text>
</svg>
