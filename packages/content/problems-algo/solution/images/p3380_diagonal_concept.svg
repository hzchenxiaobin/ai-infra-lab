<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：对角点对唯一确定一个轴对齐矩形</text>
  <text x="260" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">枚举点对当对角 → 另两角查哈希 → 闭矩形查「空洞」</text>

  <!-- rectangle body -->
  <rect x="150" y="95" width="220" height="140" fill="#e8f0fe" fill-opacity="0.45"
        stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- diagonal -->
  <path d="M150,235 L370,95" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="252" y="153" font-size="11" fill="#d6a040" filter="url(#rough2)">对角线</text>

  <!-- corner points -->
  <circle cx="150" cy="235" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(x₁,y₁) 对角点</text>

  <circle cx="370" cy="95" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(x₂,y₂) 对角点</text>

  <circle cx="150" cy="95" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(x₁,y₂) ✓ 在集合中</text>

  <circle cx="370" cy="235" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="370" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(x₂,y₁) ✓ 在集合中</text>

  <!-- interior forbidden point -->
  <circle cx="240" cy="195" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="252" y="199" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 落在内部 → 作废</text>

  <!-- border forbidden point -->
  <circle cx="262" cy="235" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="262" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 落在边界 → 也作废</text>

  <!-- bottom note -->
  <rect x="60" y="288" width="400" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">合法 ⇔ 另两角都在点集中，且闭矩形 [x₁,x₂]×[y₁,y₂]</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">内除四个角外没有任何其他点；面积 = (x₂−x₁)×(y₂−y₁)</text>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 判定必须用闭矩形——边界上的第五点同样作废</text>
</svg>
