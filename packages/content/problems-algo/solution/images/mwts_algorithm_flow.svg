<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双指针求 lo[i] + 前缀最大值 best[]</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">单趟遍历 i，O(n) 时间 / O(n) 空间</text>

  <!-- loop header -->
  <rect x="170" y="56" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i = 0 … n−1（右端点对齐奖品 i）</text>

  <path d="M 260 90 L 260 106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- box1: two pointers -->
  <rect x="90" y="108" width="340" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">双指针 l：while pos[l] &lt; pos[i] − k : l ← l + 1</text>
  <text x="260" y="144" text-anchor="middle" font-size="10" fill="#888">得 lo[i] = 最小下标满足 pos[lo[i]] ≥ pos[i] − k</text>

  <path d="M 260 154 L 260 170" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- box2: cnt -->
  <rect x="120" y="172" width="280" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt = i − l + 1  （右段覆盖数）</text>

  <path d="M 260 210 L 260 226" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- box3: ans update (key) -->
  <rect x="70" y="228" width="380" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = max(ans, cnt + best[l])   ← 左段取 best[lo[i]]</text>
  <text x="260" y="265" text-anchor="middle" font-size="10" fill="#5a7a4a">best[l] = 右端点下标 &lt; l 的最大单段覆盖数</text>

  <path d="M 260 276 L 260 292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- box4: update best -->
  <rect x="110" y="294" width="300" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">best[i + 1] = max(best[i], cnt)</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#888">前缀最大值滚动更新（best[0] = 0）</text>

  <!-- loop back arrow: right side from box4 up to loop header -->
  <path d="M 410 316 C 460 316 470 71 350 71" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="466" y="196" font-size="10" fill="#888">i++</text>

  <!-- after loop -->
  <path d="M 260 340 L 260 358" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="180" y="360" width="160" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return ans</text>

  <!-- side note -->
  <rect x="20" y="294" width="80" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="312" text-anchor="middle" font-size="9" fill="#8a6a20">为何 O(n)?</text>
  <text x="60" y="325" text-anchor="middle" font-size="9" fill="#8a6a20">l 只增不减</text>
  <text x="60" y="336" text-anchor="middle" font-size="9" fill="#8a6a20">均摊 O(1)</text>
</svg>
