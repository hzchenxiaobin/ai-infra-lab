<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟扫描统计不同字符，O(n) 时间</text>

  <!-- start -->
  <rect x="240" y="46" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mask = 0, cnt = 0</text>
  <path d="M 310 78 L 310 100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- next char -->
  <rect x="225" y="104" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="125" text-anchor="middle" font-size="12" fill="#333">取出 s 的下一个字符 c</text>
  <path d="M 310 138 L 310 156" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: first occurrence? -->
  <polygon points="310,158 425,200 310,242 195,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="12" fill="#333">c 首次出现？</text>

  <!-- yes: set bit & count -->
  <path d="M 195 200 L 122 200 L 122 234" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="238" width="185" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="258" text-anchor="middle" font-size="11" fill="#333">mask |= 1 &lt;&lt; (c−'a')</text>
  <text x="122" y="278" text-anchor="middle" font-size="11" fill="#333">cnt++（此处切一刀）</text>

  <!-- no: skip -->
  <path d="M 425 200 L 502 200 L 502 234" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="192" font-size="11" fill="#888">否</text>
  <rect x="425" y="238" width="155" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="502" y="258" text-anchor="middle" font-size="11" fill="#888">跳过</text>
  <text x="502" y="278" text-anchor="middle" font-size="11" fill="#888">（重复字符）</text>

  <!-- merge to next-char box -->
  <path d="M 122 290 L 122 354 L 221 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 502 290 L 502 354 L 399 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- next char box -->
  <rect x="225" y="334" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="12" fill="#333">处理下一个字符</text>

  <!-- loop back -->
  <path d="M 395 366 L 610 366 L 610 121 L 400 121" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="112" font-size="10" fill="#888">取下一个字符</text>

  <!-- exit -->
  <path d="M 310 374 L 310 392" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="388" font-size="10" fill="#888">字符用完</text>

  <!-- return -->
  <rect x="215" y="396" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 cnt = 不同字符数</text>

  <text x="310" y="452" text-anchor="middle" font-size="10" fill="#888">cnt = mask 中 1 的个数 = popcount(mask)，d ≤ 26</text>
</svg>
