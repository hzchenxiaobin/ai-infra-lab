<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="5" orient="auto">
      <path d="M0,0 L6,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：nums=[1,0,2,1,3] 从右向左滚动更新 dp 表</text>
  <text x="290" y="36" text-anchor="middle" font-size="10" fill="#888">每格 = (或值, 端点)　│　入表前 cur → 合并后 cur，▶ 表尾为答案端点</text>

  <!-- column headers -->
  <text x="60" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i / nums[i]</text>
  <text x="176" y="54" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">入表前 cur</text>
  <text x="378" y="54" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">合并后 cur</text>
  <text x="548" y="54" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">answer</text>

  <!-- ===== Row i=4 (r=0, top=62) ===== -->
  <rect x="12" y="62" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=4</text>
  <text x="60" y="95" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[3]</text>
  <text x="176" y="86" text-anchor="middle" font-size="11" fill="#888">∅（空）</text>
  <path d="M300 82 L318 82" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- after: (3,4) tail -->
  <rect x="320" y="68" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="346" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3, 4</text>
  <text x="548" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row i=3 (r=1, top=138) ===== -->
  <rect x="12" y="138" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=3</text>
  <text x="60" y="171" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[1]</text>
  <!-- before (3,4) -->
  <rect x="116" y="144" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="162" text-anchor="middle" font-size="10.5" fill="#333">3, 4</text>
  <path d="M300 158 L318 158" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- after: (1,3) , (3,4)tail -->
  <rect x="320" y="144" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="162" text-anchor="middle" font-size="10.5" fill="#333">1, 3</text>
  <rect x="380" y="144" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="406" y="162" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3, 4</text>
  <text x="548" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row i=2 (r=2, top=214) ===== -->
  <rect x="12" y="214" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2</text>
  <text x="60" y="247" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[2]</text>
  <!-- before (1,3),(3,4) -->
  <rect x="116" y="220" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="middle" font-size="10.5" fill="#333">1, 3</text>
  <rect x="176" y="220" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="202" y="238" text-anchor="middle" font-size="10.5" fill="#333">3, 4</text>
  <path d="M300 234 L318 234" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- after: (2,2),(3,3)tail ; (3,4) absorbed -->
  <rect x="320" y="220" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="238" text-anchor="middle" font-size="10.5" fill="#333">2, 2</text>
  <rect x="380" y="220" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="406" y="238" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3, 3</text>
  <text x="440" y="238" font-size="9.5" fill="#b85450">3,4 被吸收</text>
  <text x="548" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Row i=1 (r=3, top=290) ===== -->
  <rect x="12" y="290" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=1</text>
  <text x="60" y="323" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[0]</text>
  <!-- before (2,2),(3,3) -->
  <rect x="116" y="296" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="314" text-anchor="middle" font-size="10.5" fill="#333">2, 2</text>
  <rect x="176" y="296" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="202" y="314" text-anchor="middle" font-size="10.5" fill="#333">3, 3</text>
  <path d="M300 310 L318 310" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- after: (0,1),(2,2),(3,3)tail ; 0 不贡献比特 -->
  <rect x="320" y="296" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="314" text-anchor="middle" font-size="10.5" fill="#333">0, 1</text>
  <rect x="380" y="296" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="406" y="314" text-anchor="middle" font-size="10.5" fill="#333">2, 2</text>
  <rect x="440" y="296" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="466" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3, 3</text>
  <text x="548" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- ===== Row i=0 (r=4, top=366) ===== -->
  <rect x="12" y="366" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0</text>
  <text x="60" y="399" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[1]</text>
  <!-- before (0,1),(2,2),(3,3) -->
  <rect x="116" y="372" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="390" text-anchor="middle" font-size="10.5" fill="#333">0, 1</text>
  <rect x="176" y="372" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="202" y="390" text-anchor="middle" font-size="10.5" fill="#333">2, 2</text>
  <rect x="236" y="372" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="262" y="390" text-anchor="middle" font-size="10.5" fill="#333">3, 3</text>
  <path d="M300 386 L318 386" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- after: (1,0),(3,2)tail ; 0|1=1 合并入 (1,0); 3|1=3 合并入 (3,2) -->
  <rect x="320" y="372" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="390" text-anchor="middle" font-size="10.5" fill="#333">1, 0</text>
  <rect x="380" y="372" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="406" y="390" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3, 2</text>
  <text x="440" y="390" font-size="9.5" fill="#b85450">0|1→1 合并</text>
  <text x="548" y="390" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- bottom note -->
  <rect x="40" y="416" width="500" height="0" fill="none"/>
</svg>
