<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M 9 0 L 0 4.5 L 9 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[3,9,20,null,null,15,7] 锯齿遍历</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">3 轮 while，方向 正→逆→正，最终 [[3],[20,9],[15,7]]</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#b85450" font-weight="bold">轮次 1：队列=[3], size=1, leftToRight=true（正序）</text>
  <g font-size="10">
    <rect x="30" y="84" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="82" y="98" font-size="9" fill="#888">→ 出队 3，入队子节点 9, 20</text>
    <path d="M 250 98 L 290 98" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <rect x="300" y="86" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="325" y="100" text-anchor="middle" font-size="9" fill="#b85450">[3]</text>
    <text x="360" y="100" font-size="9" fill="#888">← 正序，无需翻转</text>
    <text x="300" y="120" font-size="8" fill="#888">result: [[3]]   翻转 flag → false</text>
  </g>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="148" font-size="11" fill="#446688" font-weight="bold">轮次 2：队列=[9,20], size=2, leftToRight=false（逆序）</text>
  <g font-size="10">
    <rect x="30" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="174" text-anchor="middle" fill="#446688" font-size="9">9</text>
    <rect x="68" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="174" text-anchor="middle" fill="#446688" font-size="9">20</text>
    <text x="115" y="172" font-size="9" fill="#888">→ 出队 9、20（入队 15, 7），收集得 [9,20]</text>
    <rect x="300" y="158" width="60" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
    <text x="330" y="172" text-anchor="middle" font-size="9" fill="#888">[9,20]</text>
    <text x="368" y="172" font-size="9" fill="#888">原顺序</text>
    <path d="M 300 196 L 270 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
    <rect x="300" y="196" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="330" y="210" text-anchor="middle" font-size="9" fill="#446688">[20,9]</text>
    <text x="368" y="210" font-size="9" fill="#446688">reverse 后</text>
    <text x="300" y="232" font-size="8" fill="#888">result: [[3],[20,9]]   翻转 flag → true</text>
  </g>

  <!-- ===== Round 3 ===== -->
  <text x="30" y="260" font-size="11" fill="#d6a040" font-weight="bold">轮次 3：队列=[15,7], size=2, leftToRight=true（正序）</text>
  <g font-size="10">
    <rect x="30" y="270" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="286" text-anchor="middle" fill="#d6a040" font-size="9">15</text>
    <rect x="68" y="270" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="286" text-anchor="middle" fill="#d6a040" font-size="9">7</text>
    <text x="115" y="284" font-size="9" fill="#888">→ 出队 15、7（均无子），收集得 [15,7]</text>
    <path d="M 250 284 L 290 284" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <rect x="300" y="272" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="330" y="286" text-anchor="middle" font-size="9" fill="#d6a040">[15,7]</text>
    <text x="368" y="286" font-size="9" fill="#888">← 正序，无需翻转</text>
    <text x="300" y="308" font-size="8" fill="#888">result: [[3],[20,9],[15,7]]   翻转 flag → false</text>
  </g>

  <!-- ===== Round 4: end ===== -->
  <text x="30" y="334" font-size="11" fill="#888" font-weight="bold">轮次 4：队列=[]，while 结束</text>
  <rect x="30" y="342" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="356" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="80" y="356" font-size="9" fill="#888">→ 队列为空，退出 while，返回 result</text>

  <!-- ===== Final result ===== -->
  <line x1="20" y1="380" x2="520" y2="380" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="396" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="418" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：[[3], [20, 9], [15, 7]]</text>
  <text x="270" y="436" text-anchor="middle" font-size="10" fill="#555">BFS 始终左→右收集，逆序层额外 reverse 一次 → O(n)</text>
</svg>
