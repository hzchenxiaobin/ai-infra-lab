<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">代理陷阱决策流程：get 分基本/对象两支，set 与 deleteProperty 恒抛错</text>

  <!-- ====== get 列 ====== -->
  <rect x="50" y="52" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">get 陷阱</text>
  <path d="M 110 84 L 110 118" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 取值 -->
  <rect x="40" y="120" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="110" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">val = Reflect.get(...)</text>

  <path d="M 110 150 L 110 178" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 决策菱形 -->
  <polygon points="110,180 186,214 110,248 34,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">val 是</text>
  <text x="110" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">对象/数组?</text>

  <!-- N 分支（左） -->
  <path d="M 34 214 L 18 214 L 18 280" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="26" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="6" y="282" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="52" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">原样返回</text>
  <text x="52" y="314" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">基本值</text>

  <!-- Y 分支（右） -->
  <path d="M 186 214 L 204 214 L 204 280" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="196" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="158" y="282" width="116" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="216" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">递归</text>
  <text x="216" y="314" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">makeImmutable(val)</text>

  <!-- ====== set 列 ====== -->
  <rect x="310" y="52" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">set 陷阱</text>
  <path d="M 370 84 L 370 150" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="300" y="152" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不调 Reflect.set</text>
  <text x="370" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 抛 TypeError</text>
  <text x="370" y="212" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（obj.x=5 / arr[1]=v</text>
  <text x="370" y="224" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">/ push 内部写）</text>

  <!-- ====== deleteProperty 列 ====== -->
  <rect x="470" y="52" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="530" y="73" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">deleteProperty</text>
  <path d="M 530 84 L 530 150" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="460" y="152" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="530" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不调 Reflect.delete</text>
  <text x="530" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 抛 TypeError</text>
  <text x="530" y="212" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（delete obj.x）</text>
</svg>
