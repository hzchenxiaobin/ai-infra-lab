<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">算法流程：枚举 1-indexed 下标</text>

  <!-- start -->
  <ellipse cx="260" cy="58" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">ans = 0</text>
  <path d="M260,76 L260,92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- init i=1 -->
  <rect x="214" y="92" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i = 1</text>
  <path d="M260,124 L260,140" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision i <= n ? -->
  <polygon points="260,140 338,178 260,216 182,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">i ≤ n ?</text>
  <!-- No branch: return -->
  <path d="M338,178 L420,178" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="372" y="196" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="217" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- Yes branch down -->
  <path d="M260,216 L260,232" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="276" y="230" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- decision n % i == 0 ? -->
  <polygon points="260,232 332,266 260,300 188,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">n % i == 0 ?</text>
  <!-- Yes: add square -->
  <path d="M188,266 L120,266" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="250" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans += nums[i-1]²</text>
  <!-- No: skip -->
  <path d="M332,266 L380,266" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="356" y="260" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <text x="412" y="270" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>

  <!-- i++ and loop back -->
  <path d="M80,282 L80,318 L260,318" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M380,278 L380,318 L260,318" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <rect x="216" y="306" width="88" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i = i + 1</text>
  <!-- loop back up to i<=n decision -->
  <path d="M260,306 L260,300" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M180,178 L120,178 L120,318" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
</svg>
