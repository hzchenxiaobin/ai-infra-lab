<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">逆序遍历 + 后缀最大值：一趟从右向左填出答案</text>

  <!-- Row 1: original array -->
  <text x="40" y="70" font-size="12" fill="#888">原数组 arr:</text>
  <rect x="110" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">17</text>
  <rect x="170" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">18</text>
  <rect x="230" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="258" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="290" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="350" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="378" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="410" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="138" y="100" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="198" y="100" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="258" y="100" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="318" y="100" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="378" y="100" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="438" y="100" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- Reverse direction arrow -->
  <path d="M 460 130 L 120 130" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">← 逆序遍历 i = 5, 4, 3, …, 0</text>

  <!-- Row 2: maxRight running variable -->
  <text x="40" y="168" font-size="12" fill="#888">后缀最大值 maxRight:</text>
  <rect x="180" y="152" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="13" fill="#333">始终维护「已扫描部分的最大值」</text>

  <!-- Row 3: answer array -->
  <text x="40" y="222" font-size="12" fill="#888">答案 ans:</text>
  <rect x="110" y="206" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">18</text>
  <rect x="170" y="206" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="230" y="206" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="258" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="290" y="206" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="350" y="206" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="378" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="410" y="206" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="438" y="228" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-1</text>

  <!-- connector arrows arr -> ans -->
  <path d="M 138 90 L 138 204" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 438 90 L 438 204" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="40" y1="262" x2="520" y2="262" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Invariant note box -->
  <rect x="50" y="276" width="460" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="298" font-size="12" fill="#333" font-weight="bold">💡 核心不变式</text>
  <text x="64" y="318" font-size="11" fill="#555">处理位置 i 时，maxRight 已是 arr[i+1 .. n-1] 的最大值，</text>
  <text x="64" y="336" font-size="11" fill="#555">因此 ans[i] = maxRight；随后用 arr[i] 把 maxRight 扩展为 arr[i .. n-1] 的最大值，</text>
  <text x="64" y="354" font-size="11" fill="#555">供下一个（左侧）位置使用——一趟逆序扫描即可。</text>
  <text x="64" y="372" font-size="11" fill="#b85450" font-weight="bold">末位特殊处理：ans[n-1] = -1（右侧无元素）。</text>
</svg>
