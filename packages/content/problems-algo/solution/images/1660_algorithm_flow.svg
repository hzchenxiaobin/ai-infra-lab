<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层 + seen 集合检测错误 right 指针</text>

  <!-- 开始 -->
  <rect x="250" y="44" width="120" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">开始</text>
  <line x1="310" y1="78" x2="310" y2="94" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="190" y="96" width="240" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="11" fill="#2a4a6a" font-weight="bold">初始化</text>
  <text x="310" y="134" text-anchor="middle" font-size="10" fill="#2a4a6a">seen = {root}，queue = [(root, null, null)]</text>
  <line x1="310" y1="146" x2="310" y2="162" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 队列判空 -->
  <polygon points="310,164 400,194 310,224 220,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">queue</text>
  <text x="310" y="206" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">为空?</text>

  <!-- 是 → 返回 root -->
  <line x1="220" y1="194" x2="140" y2="194" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="186" text-anchor="middle" font-size="10" fill="#666">是</text>
  <rect x="40" y="178" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 root</text>

  <!-- 否 → 出队 -->
  <line x1="310" y1="224" x2="310" y2="240" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="234" font-size="10" fill="#666">否</text>

  <rect x="200" y="242" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="11" fill="#2a4a6a">出队 (node, parent, is_left)</text>
  <line x1="310" y1="282" x2="310" y2="298" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 right ∈ seen -->
  <polygon points="310,300 440,340 310,380 180,340" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">node.right</text>
  <text x="310" y="348" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">∈ seen?</text>

  <!-- 是 → 移除子树 -->
  <line x1="440" y1="340" x2="510" y2="340" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="475" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="440" y="362" width="160" height="72" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="382" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">发现错误节点！</text>
  <text x="520" y="398" text-anchor="middle" font-size="10" fill="#8a3a36">if is_left:</text>
  <text x="520" y="412" text-anchor="middle" font-size="10" fill="#8a3a36">  parent.left = null</text>
  <text x="520" y="426" text-anchor="middle" font-size="10" fill="#8a3a36">else: parent.right = null</text>

  <line x1="520" y1="434" x2="520" y2="452" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="460" y="452" width="120" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="468" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 root</text>

  <!-- 否 → 入队子节点 -->
  <line x1="310" y1="380" x2="310" y2="398" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="392" text-anchor="middle" font-size="10" fill="#666">否</text>

  <rect x="180" y="400" width="260" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="10" fill="#2a4a6a">left/right 非空 → 加入 seen</text>
  <text x="310" y="436" text-anchor="middle" font-size="10" fill="#2a4a6a">入队 (child, node, True/False)</text>

  <!-- 回到队列判空 -->
  <path d="M 180 425 Q 80 425 80 194 Q 80 194 220 194" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="60" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a">继续下一轮</text>
</svg>
