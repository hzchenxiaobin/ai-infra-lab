<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：位掩码记录已访问城市，f[mask][j] = 最大旅行费用</text>

  <!-- ===== Left: Graph (Example 1) ===== -->
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#888">城市图 (n=5)</text>

  <!-- Edges (normal) -->
  <line x1="155" y1="150" x2="155" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="184" font-size="10" fill="#446688">3</text>
  <line x1="165" y1="220" x2="225" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="214" text-anchor="middle" font-size="10" fill="#446688">3</text>

  <!-- Edges (highlighted path 0->1->4->3) -->
  <line x1="88" y1="98" x2="148" y2="142" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="108" y="112" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <line x1="172" y1="142" x2="232" y2="98" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="210" y="112" font-size="11" fill="#b85450" font-weight="bold">11</text>
  <line x1="245" y1="102" x2="245" y2="202" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="256" y="156" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Cities -->
  <circle cx="80" cy="90" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="13" fill="#333">0</text>
  <circle cx="160" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="13" fill="#333">1</text>
  <circle cx="240" cy="90" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="95" text-anchor="middle" font-size="13" fill="#333">4</text>
  <circle cx="160" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="225" text-anchor="middle" font-size="13" fill="#333">2</text>
  <circle cx="240" cy="220" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="225" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- Path annotation -->
  <rect x="30" y="258" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="280" text-anchor="middle" font-size="11" fill="#444">路径 0→1→4→3，费用 4+11+2 = 17</text>

  <!-- ===== Right: Bitmask state ===== -->
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#888">状态编码 (5 位掩码)</text>

  <!-- city labels -->
  <text x="310" y="84" font-size="11" fill="#888">城市:</text>
  <rect x="345" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="88" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="389" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="433" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="88" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="477" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="88" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- bit indices -->
  <text x="310" y="112" font-size="10" fill="#888">bit 位:</text>
  <text x="366" y="112" text-anchor="middle" font-size="10" fill="#888">bit4</text>
  <text x="410" y="112" text-anchor="middle" font-size="10" fill="#888">bit3</text>
  <text x="454" y="112" text-anchor="middle" font-size="10" fill="#888">bit2</text>
  <text x="498" y="112" text-anchor="middle" font-size="10" fill="#888">bit1</text>

  <!-- mask bits for path {0,1,3,4}: mask = 11011 -->
  <text x="310" y="142" font-size="11" fill="#888">mask 值:</text>
  <rect x="345" y="126" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="389" y="126" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="433" y="126" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="146" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="477" y="126" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="498" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- note: bit0 (city 0) is cut off, show separately -->
  <text x="310" y="172" font-size="10" fill="#888">(bit0=1, 城市0已访问)</text>

  <!-- state definition box -->
  <rect x="300" y="188" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="206" text-anchor="middle" font-size="11" fill="#444">mask = 11011₂ = 27</text>
  <text x="405" y="222" text-anchor="middle" font-size="11" fill="#444">已访问 {0, 1, 3, 4}，末站 j = 3</text>

  <!-- f value -->
  <rect x="300" y="242" width="210" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">f[27][3] = 17</text>
  <text x="405" y="280" text-anchor="middle" font-size="10" fill="#888">popcount(27) = 4 = k+1 ✓</text>

  <!-- arrow from graph to state -->
  <path d="M 265 200 Q 285 200 295 210" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
