<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：滑动中位数求 cost[] → 划分 DP → dp[k][n]</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="200" y="30" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="260" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">读入 nums, x, k</text>
  </g>
  <path d="M 260 54 L 260 64" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stage 1 container -->
  <g filter="url(#rough2)">
    <rect x="36" y="66" width="448" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 4" rx="10"/>
    <text x="260" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">阶段①　i = 0 → n−1：双有序集合 lo / hi 维护滑动中位数（同 480 题）</text>

    <rect x="48" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="88" y="113" text-anchor="middle" font-size="9" fill="#33506b">① 插入 nums[i]</text>
    <text x="88" y="126" text-anchor="middle" font-size="9" fill="#55677d">先进 lo</text>

    <rect x="136" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="176" y="113" text-anchor="middle" font-size="9" fill="#33506b">② lo 最大值</text>
    <text x="176" y="126" text-anchor="middle" font-size="9" fill="#55677d">上供给 hi</text>

    <rect x="224" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="264" y="113" text-anchor="middle" font-size="9" fill="#33506b">③ 平衡</text>
    <text x="264" y="126" text-anchor="middle" font-size="9" fill="#55677d">|hi|−|lo| ≤ 1</text>

    <rect x="312" y="100" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="352" y="113" text-anchor="middle" font-size="9" fill="#2f5d24">④ 窗口成型</text>
    <text x="352" y="126" text-anchor="middle" font-size="9" fill="#55677d">结算 cost[i−x+1]</text>

    <rect x="400" y="100" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="436" y="113" text-anchor="middle" font-size="9" fill="#8f3a36">⑤ 移出</text>
    <text x="436" y="126" text-anchor="middle" font-size="9" fill="#8f3a36">nums[i−x+1]</text>

    <path d="M 128 117 L 134 117" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 216 117 L 222 117" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 304 117 L 310 117" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 392 117 L 398 117" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <text x="260" y="152" text-anchor="middle" font-size="9.5" fill="#55677d">结算 O(1)：cost = (shi − m·|hi|) + (m·|lo| − slo)，m = *hi.begin()；单步集合操作 O(log x)</text>
  </g>

  <path d="M 260 170 L 260 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stage 2 container -->
  <g filter="url(#rough2)">
    <rect x="36" y="182" width="448" height="96" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 4" rx="10"/>
    <text x="260" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">阶段②　划分 DP：外层 j = 1 → k，内层 i = j·x → n（滚动数组 dp / ndp）</text>

    <rect x="88" y="214" width="344" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="260" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">ndp[i] = min( ndp[i−1] , dp[i−x] + cost[i−x] )</text>

    <text x="260" y="258" text-anchor="middle" font-size="9.5" fill="#55677d">跳过第 i 个元素 / 以 i 结尾收第 j 个窗口；i = j·x 时无 ndp[i−1] 可继承，直接取 cur</text>
    <text x="260" y="272" text-anchor="middle" font-size="9.5" fill="#55677d">一层做完 swap(dp, ndp) 滚动进入下一层</text>
  </g>

  <path d="M 260 278 L 260 288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <g filter="url(#rough2)">
    <rect x="185" y="290" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <text x="260" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">返回 dp[k][n]</text>
  </g>

  <!-- bottom complexity -->
  <g filter="url(#rough2)">
    <rect x="40" y="326" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="260" y="343" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">时间 O(n log n + nk)（k ≤ 15）｜空间 O(n)｜中间量需 64 位</text>
  </g>
</svg>
