<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例 3：colors = "ABBBBBBBAAA"</text>

  <!-- String cells: A B B B B B B B A A A  (11 cells, width 34, start x=70) -->
  <!-- A -->
  <rect x="70" y="50" width="34" height="30" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="87" y="70" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <!-- 7 B's -->
  <rect x="106" y="50" width="34" height="30" fill="#e6f4ea" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="70" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">B</text>
  <rect x="142" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="159" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B</text>
  <rect x="178" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B</text>
  <rect x="214" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B</text>
  <rect x="250" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="267" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B</text>
  <rect x="286" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B</text>
  <rect x="322" y="50" width="34" height="30" fill="#e6f4ea" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="339" y="70" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">B</text>
  <!-- 3 A's -->
  <rect x="358" y="50" width="34" height="30" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="70" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <rect x="394" y="50" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="430" y="50" width="34" height="30" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="447" y="70" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>

  <!-- Run brackets -->
  <path d="M 70 88 L 70 96 L 104 96 L 104 88" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="87" y="110" text-anchor="middle" font-size="10" fill="#446688">A, L=1</text>
  <path d="M 106 88 L 106 96 L 356 96 L 356 88" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="231" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a">B 连续段, L=7</text>
  <path d="M 358 88 L 358 96 L 464 96 L 464 88" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="411" y="110" text-anchor="middle" font-size="10" fill="#446688">A, L=3</text>

  <!-- Count computation -->
  <rect x="40" y="138" width="270" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="160" font-size="11.5" fill="#446688" font-weight="bold">Alice 可删 A：</text>
  <text x="60" y="180" font-size="11" fill="#333">A 段 L=1 → max(0,1−2) = 0</text>
  <text x="60" y="198" font-size="11" fill="#333">A 段 L=3 → max(0,3−2) = 1</text>
  <text x="240" y="208" font-size="13" fill="#b85450" font-weight="bold">合计 = 1</text>

  <rect x="320" y="138" width="270" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="340" y="160" font-size="11.5" fill="#4a7a3a" font-weight="bold">Bob 可删 B：</text>
  <text x="340" y="180" font-size="11" fill="#333">B 段 L=7 → max(0,7−2) = 5</text>
  <text x="340" y="198" font-size="11" fill="#888">（无其它 B 段）</text>
  <text x="520" y="208" font-size="13" fill="#b85450" font-weight="bold">合计 = 5</text>

  <!-- Comparison -->
  <rect x="120" y="240" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="265" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">可删 A (1) &gt; 可删 B (5) ？ 否</text>

  <!-- Conclusion -->
  <rect x="120" y="296" width="360" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">返回 false —— Bob 获胜</text>
</svg>
