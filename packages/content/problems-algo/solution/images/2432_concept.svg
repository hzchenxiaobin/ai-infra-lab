<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：任务用时 = 相邻 leaveTime 的差分（leaveTime[-1] = 0）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例 1：logs = [[0,3],[2,5],[0,9],[1,15]]，时刻 0 开始，逐任务接力</text>

  <!-- time axis -->
  <line x1="40" y1="118" x2="520" y2="118" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="20" y="122" font-size="10" fill="#888">时刻</text>

  <!-- checkpoint ticks + time labels: 0,3,5,9,15 -->
  <circle cx="50" cy="118" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <circle cx="140" cy="118" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <circle cx="200" cy="118" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <circle cx="320" cy="118" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">9</text>
  <circle cx="500" cy="118" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="500" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">15</text>

  <!-- duration bars (gaps between consecutive checkpoints) -->
  <!-- task0: emp0 [0,3] dur3 -->
  <rect x="50" y="128" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="148" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">任务0 · 员工0</text>
  <text x="95" y="163" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">用时 3</text>

  <!-- task1: emp2 [3,5] dur2 -->
  <rect x="140" y="128" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">任务1·员工2</text>
  <text x="170" y="163" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">用时2</text>

  <!-- task2: emp0 [5,9] dur4 -->
  <rect x="200" y="128" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">任务2 · 员工0</text>
  <text x="260" y="163" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">用时 4</text>

  <!-- task3: emp1 [9,15] dur6  <-- LONGEST highlight -->
  <rect x="320" y="128" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">任务3 · 员工1</text>
  <text x="410" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">用时 6（最长）</text>

  <!-- longest callout -->
  <path d="M 500 150 L 540 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="548" y="146" font-size="9.5" fill="#b85450" font-weight="bold">返回</text>
  <text x="548" y="158" font-size="9.5" fill="#b85450" font-weight="bold">id=1</text>

  <!-- diff bracket annotation under first gap -->
  <path d="M 50 184 L 50 190 L 140 190 L 140 184" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 95 190 L 95 196" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dur = leave[i] - prev</text>

  <!-- note box -->
  <rect x="40" y="232" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">leaveTime 是“累计结束时刻”，任务用时是其一阶差分；第 0 任务 prev=0</text>

  <!-- tie-break note -->
  <rect x="40" y="276" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">平局（多任务并列最长用时）→ 返回其中最小员工 id</text>

  <!-- bottom one-liner -->
  <rect x="40" y="320" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">只看“单任务峰值”，不按员工聚合总用时</text>
</svg>
