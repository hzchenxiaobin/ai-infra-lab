<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [18, 43, 36, 13, 7] → 54</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="44" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="50"  y="63">步</text>
    <text x="110" y="63">v</text>
    <text x="165" y="63">数位和 d</text>
    <text x="245" y="63">mx[d] 旧</text>
    <text x="335" y="63">候选</text>
    <text x="415" y="63">ans</text>
    <text x="495" y="63">mx[d] 新</text>
  </g>

  <!-- vertical separators -->
  <g stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)">
    <line x1="80"  y1="44" x2="80"  y2="314"/>
    <line x1="140" y1="44" x2="140" y2="314"/>
    <line x1="205" y1="44" x2="205" y2="314"/>
    <line x1="290" y1="44" x2="290" y2="314"/>
    <line x1="375" y1="44" x2="375" y2="314"/>
    <line x1="455" y1="44" x2="455" y2="314"/>
  </g>

  <!-- row 1 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="88">1</text>
    <text x="110" y="88">18</text>
    <text x="165" y="88">9</text>
    <text x="245" y="88" fill="#888">—</text>
    <text x="335" y="88" fill="#888">—</text>
    <text x="415" y="88" fill="#b85450" font-weight="bold">-1</text>
    <text x="495" y="88" fill="#4a7a3a" font-weight="bold">18</text>
  </g>

  <!-- row 2 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="128">2</text>
    <text x="110" y="128">43</text>
    <text x="165" y="128">7</text>
    <text x="245" y="128" fill="#888">—</text>
    <text x="335" y="128" fill="#888">—</text>
    <text x="415" y="128" fill="#b85450" font-weight="bold">-1</text>
    <text x="495" y="128" fill="#4a7a3a" font-weight="bold">43</text>
  </g>

  <!-- row 3 (highlight) -->
  <g filter="url(#rough2)">
    <rect x="20" y="140" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="164">3</text>
    <text x="110" y="164">36</text>
    <text x="165" y="164">9</text>
    <text x="245" y="164" fill="#446688" font-weight="bold">18</text>
    <text x="335" y="164" fill="#d6a040" font-weight="bold">18+36=54</text>
    <text x="415" y="164" fill="#d6a040" font-weight="bold">54</text>
    <text x="495" y="164" fill="#4a7a3a" font-weight="bold">36</text>
  </g>

  <!-- row 4 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="208">4</text>
    <text x="110" y="208">13</text>
    <text x="165" y="208">4</text>
    <text x="245" y="208" fill="#888">—</text>
    <text x="335" y="208" fill="#888">—</text>
    <text x="415" y="208" fill="#333" font-weight="bold">54</text>
    <text x="495" y="208" fill="#4a7a3a" font-weight="bold">13</text>
  </g>

  <!-- row 5 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="248">5</text>
    <text x="110" y="248">7</text>
    <text x="165" y="248">7</text>
    <text x="245" y="248" fill="#446688" font-weight="bold">43</text>
    <text x="335" y="248" fill="#888">43+7=50</text>
    <text x="415" y="248" fill="#333" font-weight="bold">54</text>
    <text x="495" y="248" fill="#4a7a3a" font-weight="bold">43</text>
  </g>

  <!-- table bottom border -->
  <path d="M 20 268 L 540 268" stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="150" y="300" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans = 54</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a">命中数对 (18, 36)：数位和均为 9</text>

  <!-- notes -->
  <text x="20" y="388" font-size="11" fill="#555">• 步3：d=9 已有 mx[9]=18，36 与之配对得 54，刷新 ans；随后 mx[9] 升至 36。</text>
  <text x="20" y="408" font-size="11" fill="#555">• 步5：d=7 已有 mx[7]=43，候选 50 &lt; 54 不刷新 ans；mx[7] 仍为 43（max(43,7)）。</text>
  <text x="20" y="428" font-size="11" fill="#555">• 步1/2/4：数位和首次出现，无法配对，仅登记 mx[d]=v。</text>
  <text x="20" y="448" font-size="10.5" fill="#888">每个 v 先查 mx[d]（旧值）配对，再用 v 更新 mx[d]（新值）——查询在写入之前，杜绝自配。</text>
</svg>
