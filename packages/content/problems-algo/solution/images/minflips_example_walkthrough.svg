<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 自底向上演算（result = true）</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">绿=叶；蓝=二元运算；橙=NOT/叶0；结果列红框为根节点 [f0, f1]</text>

  <!-- table frame -->
  <rect x="20" y="56" width="580" height="252" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- header -->
  <line x1="20" y1="84" x2="600" y2="84" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="90" y="76" text-anchor="middle">节点 (val)</text>
    <text x="210" y="76" text-anchor="middle">运算</text>
    <text x="350" y="76" text-anchor="middle">左子 [l0, l1]</text>
    <text x="490" y="76" text-anchor="middle">右子 [r0, r1]</text>
  </g>
  <text x="582" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果 [f0, f1]</text>
  <!-- column separators -->
  <g stroke="#e3e3e3" stroke-width="1" filter="url(#rough2)">
    <line x1="150" y1="56" x2="150" y2="308"/>
    <line x1="270" y1="56" x2="270" y2="308"/>
    <line x1="420" y1="56" x2="420" y2="308"/>
    <line x1="540" y1="56" x2="540" y2="308"/>
  </g>

  <!-- rows: y centers 102, 140, 178, 216, 254, 292 ; row height 38 -->
  <!-- row1 leaf val=1 -->
  <circle cx="78" cy="102" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="106" text-anchor="middle" font-size="11" fill="#888">叶（true）</text>
  <text x="350" y="106" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="490" y="106" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="582" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1, 0</text>
  <line x1="22" y1="121" x2="598" y2="121" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row2 leaf val=0 -->
  <circle cx="78" cy="140" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="210" y="144" text-anchor="middle" font-size="11" fill="#888">叶（false）</text>
  <text x="350" y="144" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="490" y="144" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="582" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0, 1</text>
  <line x1="22" y1="159" x2="598" y2="159" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row3 idx3 OR -->
  <circle cx="78" cy="178" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="210" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">OR</text>
  <text x="350" y="182" text-anchor="middle" font-size="11" fill="#333">[1, 0]</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#333">[0, 1]</text>
  <text x="582" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1, 0</text>
  <text x="350" y="196" text-anchor="middle" font-size="8" fill="#888">f0=1+0  f1=min(2,0,1)=0</text>
  <line x1="22" y1="197" x2="598" y2="197" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row4 idx2 XOR -->
  <circle cx="78" cy="225" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="229" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="210" y="229" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">XOR</text>
  <text x="350" y="229" text-anchor="middle" font-size="11" fill="#333">[1, 0]</text>
  <text x="490" y="229" text-anchor="middle" font-size="11" fill="#333">[1, 0]</text>
  <text x="582" y="229" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0, 1</text>
  <text x="350" y="243" text-anchor="middle" font-size="8" fill="#888">f0=min(2,0)=0  f1=min(1,1)=1</text>
  <line x1="22" y1="244" x2="598" y2="244" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row5 idx1 NOT -->
  <circle cx="78" cy="272" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="210" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">NOT</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" fill="#333">[1, 0]</text>
  <text x="490" y="276" text-anchor="middle" font-size="11" fill="#aaa">[∞, ∞]</text>
  <text x="582" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0, 1</text>
  <text x="350" y="290" text-anchor="middle" font-size="8" fill="#888">f0=min(0,∞)=0  f1=min(1,∞)=1</text>
  <line x1="22" y1="291" x2="598" y2="291" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row6 idx0 AND root -->
  <circle cx="78" cy="320" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="78" y="325" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="210" y="325" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">AND（根）</text>
  <text x="350" y="325" text-anchor="middle" font-size="11" fill="#333">[0, 1]</text>
  <text x="490" y="325" text-anchor="middle" font-size="11" fill="#333">[0, 1]</text>
  <rect x="548" y="308" width="68" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="582" y="325" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0, 2</text>
  <text x="310" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">result=true → 取 f1 = 2  ✔</text>
</svg>
