<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：s = "leetcode"  t = "practice"  （n = 8）</text>

  <!-- 频率差表 -->
  <text x="40" y="56" font-size="12" fill="#666" font-weight="bold">频率差 diff = cntT − cntS</text>
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="40" y="64" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="65" y="81" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
    <rect x="90" y="64" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="110" y="81" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cntS</text>
    <rect x="130" y="64" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="150" y="81" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cntT</text>
    <rect x="170" y="64" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="195" y="81" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">diff</text>
  </g>

  <!-- 正差行（t 多余，红色） -->
  <g filter="url(#rough2)">
