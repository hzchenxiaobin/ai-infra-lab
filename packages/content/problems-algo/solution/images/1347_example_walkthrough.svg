    <rect x="130" y="246" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="150" y="262" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="170" y="246" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="195" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
    <!-- e -->
    <rect x="40" y="268" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="65" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="90" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="110" y="284" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="130" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="150" y="284" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="170" y="268" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="195" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−2</text>
    <!-- o -->
    <rect x="40" y="290" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="65" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
    <rect x="90" y="290" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="110" y="306" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="130" y="290" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="150" y="306" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="170" y="290" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="195" y="306" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
    <!-- d -->
    <rect x="40" y="312" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="65" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
    <rect x="90" y="312" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="110" y="328" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="130" y="312" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="150" y="328" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="170" y="312" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="195" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  </g>

  <!-- 负差之和（校验） -->
  <g filter="url(#rough2)">
    <rect x="40" y="340" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="130" y="358" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">|负差|之和 = 5 ✓ 相等</text>
  </g>

  <!-- 右侧：替换方案配对 -->
  <text x="430" y="56" font-size="12" fill="#666" font-weight="bold">替换方案（多余 → 缺少）</text>
  <g filter="url(#rough2)">
    <!-- 配对箭头 5 组 -->
    <rect x="370" y="92" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="387" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
    <text x="420" y="109" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="438" y="92" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="455" y="109" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">l</text>

    <rect x="370" y="122" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="387" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">p</text>
    <text x="420" y="139" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="438" y="122" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="455" y="139" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">e</text>

    <rect x="370" y="152" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="387" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">r</text>
    <text x="420" y="169" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="438" y="152" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="455" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">e</text>

    <rect x="370" y="182" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="387" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
    <text x="420" y="199" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="438" y="182" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="455" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">o</text>

    <rect x="370" y="212" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="387" y="229" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i</text>
    <text x="420" y="229" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="438" y="212" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="455" y="229" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">d</text>
  </g>

  <!-- 步数计数 -->
  <g filter="url(#rough2)">
    <rect x="360" y="252" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="440" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">共 5 步替换</text>
  </g>

  <!-- 结果字符串 -->
  <text x="360" y="306" font-size="11" fill="#666" font-weight="bold">t 变换（位置无关，一种可能）：</text>
  <g filter="url(#rough2)">
    <rect x="360" y="314" width="186" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="453" y="333" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">practice → leeoedd</text>
  </g>
  <text x="360" y="356" font-size="10" fill="#888">频率表与 s 一致 ⇒ 即为字母异位词</text>

  <!-- 等价公式提示 -->
  <g filter="url(#rough2)">
    <rect x="360" y="372" width="230" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="475" y="392" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">等价公式：answer = ½ · Σ|diff|</text>
    <text x="475" y="410" text-anchor="middle" font-size="10" fill="#888">正负差相等 ⇒ 直接取正差之和即可</text>
  </g>
</svg>
