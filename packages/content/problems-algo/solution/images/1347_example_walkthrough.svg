    <rect x="40" y="92" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="65" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
    <rect x="90" y="92" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="110" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="130" y="92" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="150" y="108" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="170" y="92" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
    <!-- p -->
    <rect x="40" y="114" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="65" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
    <rect x="90" y="114" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="110" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="130" y="114" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="150" y="130" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="170" y="114" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
    <!-- r -->
    <rect x="40" y="136" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="65" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
    <rect x="90" y="136" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="110" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="130" y="136" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="150" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="170" y="136" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
    <!-- a -->
    <rect x="40" y="158" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="65" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
    <rect x="90" y="158" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="110" y="174" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="130" y="158" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="150" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="170" y="158" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
    <!-- i -->
    <rect x="40" y="180" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="65" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
    <rect x="90" y="180" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="130" y="180" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="150" y="196" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="170" y="180" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  </g>

  <!-- 正差之和 -->
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="130" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">正差之和 = 5 ← 答案</text>
  </g>

  <!-- 负差行（t 缺少，橙黄） -->
  <g filter="url(#rough2)">
    <!-- l -->
    <rect x="40" y="246" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
