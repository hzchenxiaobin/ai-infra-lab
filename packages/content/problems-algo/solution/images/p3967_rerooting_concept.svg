<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：换根到 r —— r 的答案只依赖相邻分量的 min / max</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">断开 r 的每条邻边 (r, w)：邻居 w 上报「w 侧分量（以 w 为根）的完成时间 G(r→w)」</text>

  <!-- 根候选 r -->
  <text x="260" y="128" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">根候选 r（baseTime[r] = 3）</text>
  <g filter="url(#rough2)">
    <circle cx="260" cy="160" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="260" y="160" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold">r</text>
    <text x="260" y="174" text-anchor="middle" font-size="8" fill="#8a6d1f">bt=3</text>
  </g>

  <!-- 左侧分量：latest -->
  <g filter="url(#rough2)">
    <rect x="36" y="110" width="110" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="91" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w1 侧分量</text>
    <line x1="91" y1="158" x2="76" y2="178" stroke="#446688" stroke-width="1.2"/>
    <line x1="91" y1="158" x2="106" y2="178" stroke="#446688" stroke-width="1.2"/>
    <circle cx="91" cy="155" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="76" cy="180" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <circle cx="106" cy="180" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="91" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">G(r→w1) = 9 ← latest</text>
  </g>

  <!-- 右上分量 -->
  <g filter="url(#rough2)">
    <rect x="374" y="64" width="110" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w2 侧分量</text>
    <line x1="429" y1="102" x2="429" y2="118" stroke="#446688" stroke-width="1.2"/>
    <circle cx="429" cy="100" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="429" cy="124" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="429" y="146" text-anchor="middle" font-size="9.5" fill="#446688">G(r→w2) = 4</text>
  </g>

  <!-- 右下分量：earliest -->
  <g filter="url(#rough2)">
    <rect x="374" y="196" width="110" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w3 侧分量</text>
    <circle cx="429" cy="244" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="429" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">G(r→w3) = 2 ← earliest</text>
  </g>

  <!-- 剪断的三条邻边 -->
  <path d="M 238 160 L 148 158" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 148 L 370 112" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 172 L 370 232" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>
  <text x="322" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>
  <text x="322" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>

  <!-- 底部公式框 -->
  <rect x="30" y="300" width="460" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans(r) = 2·latest − earliest + baseTime[r] = 2×9 − 2 + 3 = 19</text>
  <text x="260" y="340" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">down[v]：孩子侧分量的 G（逆序一趟）｜ up[v]：父侧分量的 G（正序一趟）｜ 凑齐所有 G ⇒ 任选根 O(1) 结算，取全局最小</text>
</svg>
