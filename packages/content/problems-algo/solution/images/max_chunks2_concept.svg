<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    核心观察：prefixMax[i] ≤ suffixMin[i+1] → 位置 i 后可切刀
  </text>

  <!-- arr row label -->
  <text x="95" y="82" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">arr</text>
  <!-- arr boxes: chunk1=[2,1] blue, chunk2=[3] green, chunk3=[4] orange, chunk4=[4] pink -->
  <rect x="120" y="62" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="62" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="62" width="55" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="62" width="55" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="62" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="212" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="277" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="342" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="407" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- index labels -->
  <text x="147" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="212" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="277" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="342" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="407" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>

  <!-- prefixMax row label -->
  <text x="95" y="155" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">prefixMax</text>
  <rect x="120" y="135" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="135" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="135" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="135" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="135" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="212" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="277" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="342" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="407" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- suffixMin row label -->
  <text x="95" y="208" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">suffixMin</text>
  <rect x="120" y="188" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="188" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="188" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="188" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="188" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="212" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="277" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="342" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="407" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- Cut indicators: vertical dashed lines at gaps between boxes -->
  <!-- Gap 0-1 (x=180): prefixMax[0]=2 ≤ suffixMin[1]=1? No ✗ -->
  <line x1="180" y1="55" x2="180" y2="228" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="180" cy="48" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="52" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- Gap 1-2 (x=245): prefixMax[1]=2 ≤ suffixMin[2]=3? Yes ✓ -->
  <line x1="245" y1="55" x2="245" y2="228" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="245" cy="48" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- Gap 2-3 (x=310): prefixMax[2]=3 ≤ suffixMin[3]=4? Yes ✓ -->
  <line x1="310" y1="55" x2="310" y2="228" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="310" cy="48" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- Gap 3-4 (x=375): prefixMax[3]=4 ≤ suffixMin[4]=4? Yes ✓ -->
  <line x1="375" y1="55" x2="375" y2="228" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="375" cy="48" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- Comparison annotations at bottom -->
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2≤1? 否</text>
  <text x="245" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2≤3? 是</text>
  <text x="310" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3≤4? 是</text>
  <text x="375" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4≤4? 是</text>

  <!-- Chunk result boxes at bottom -->
  <text x="270" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    切刀后得到 4 个块：[2,1] [3] [4] [4]
  </text>
  <rect x="120" y="298" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块① [2,1]</text>
  <rect x="250" y="298" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="277" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块②</text>
  <rect x="315" y="298" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="342" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块③</text>
  <rect x="380" y="298" width="55" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="407" y="317" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块④</text>

  <!-- Key insight box -->
  <rect x="100" y="340" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    左半最大值 ≤ 右半最小值 ⟹ 左半任意元素 ≤ 右半任意元素
  </text>
</svg>
