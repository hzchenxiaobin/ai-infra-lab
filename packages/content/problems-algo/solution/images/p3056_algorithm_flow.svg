<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：JOIN 贴标签 → 分桶 → 条件求和 → 百分比舍入</text>

  <!-- 左侧流水线 -->
  <rect x="36" y="44" width="252" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 等值连接贴标签</text>
  <text x="162" y="80" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">JOIN Age USING(user_id)：每行带上 age_bucket</text>

  <path d="M 162 92 L 162 102" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="106" width="252" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="122" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 按年龄组分桶</text>
  <text x="162" y="137" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">GROUP BY age_bucket</text>

  <path d="M 162 146 L 162 156" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="160" width="252" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="178" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 分子：条件求和（行方向 → 列方向）</text>
  <text x="162" y="196" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">SUM(IF(type='send', t, 0))</text>
  <text x="162" y="212" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">SUM(IF(type='open', t, 0))</text>

  <path d="M 162 226 L 162 236" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="240" width="252" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="256" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 分母：桶内全部时间</text>
  <text x="162" y="271" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">SUM(time_spent)</text>

  <path d="M 162 280 L 162 290" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="294" width="252" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="312" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">⑤ 舍入输出两列百分比</text>
  <text x="162" y="330" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ROUND(100 × 分子 / 分母, 2)</text>

  <!-- 右侧注记：ELSE 0 陷阱 -->
  <rect x="312" y="44" width="192" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="408" y="64" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠ ELSE 0 不能省</text>
  <text x="408" y="84" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">CASE 不写 ELSE 默认 NULL，</text>
  <text x="408" y="100" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">组内无 send 行 → SUM=NULL</text>
  <text x="408" y="116" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">→ 百分比输出 NULL 而非 0.00</text>
  <text x="408" y="130" text-anchor="middle" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">ELSE 0 把「没有」显式化为 0</text>

  <!-- 右侧注记：分母化简 -->
  <rect x="312" y="148" width="192" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="168" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">💡 分母化简</text>
  <text x="408" y="188" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">非 send 即 open（ENUM 完备），</text>
  <text x="408" y="204" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">桶内总时间就是 SUM(time_spent)，</text>
  <text x="408" y="220" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">两个百分比共享同一分母，</text>
  <text x="408" y="234" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">天然互补 ≈ 100.00</text>

  <!-- 右侧注记：舍入边界 -->
  <rect x="312" y="246" width="192" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="266" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">⚠ 舍入边界</text>
  <text x="408" y="286" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">两列各自 ROUND，和可能是</text>
  <text x="408" y="302" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">100.01 或 99.99（如 16.67+83.34）</text>
  <text x="408" y="318" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">要求严格互补时，</text>
  <text x="408" y="332" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">open_perc 可写 100 − send_perc</text>
</svg>
