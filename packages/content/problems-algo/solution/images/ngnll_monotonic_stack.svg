<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单调递减栈：遇到更大值时连续弹栈，answer 存「值」</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">vals = [2,7,4,3,5]　栈存下标（值递减），新值 &gt; 栈顶则弹栈写 answer[top]=当前值</text>

  <!-- ===== vals array ===== -->
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">vals[]（链表取值后）</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="84" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="52" y="104" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="52" y="78" text-anchor="middle" font-size="8" fill="#888">[0]</text>

    <rect x="78" y="84" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="100" y="104" text-anchor="middle" font-size="10" fill="#888">7</text>
    <text x="100" y="78" text-anchor="middle" font-size="8" fill="#888">[1]</text>

    <rect x="126" y="84" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="148" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <text x="148" y="78" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[2]</text>

    <rect x="174" y="84" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="196" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
    <text x="196" y="78" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[3]</text>

    <rect x="222" y="84" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="244" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="244" y="78" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">[4] 新来的</text>
  </g>

  <!-- arrow from i=4 to stack -->
  <path d="M 244 120 L 244 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Stack (before processing 5) ===== -->
  <text x="30" y="154" font-size="11" fill="#d6a040" font-weight="bold">栈（存下标，值递减）</text>
  <g font-size="10">
    <rect x="200" y="168" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="250" y="186" text-anchor="middle" fill="#446688" font-weight="bold">[1] = 7</text>

    <rect x="200" y="200" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="250" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">[2] = 4 ← 栈顶</text>

    <rect x="200" y="232" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="250" y="250" text-anchor="middle" fill="#b85450" font-weight="bold">[3] = 3</text>

    <text x="312" y="218" font-size="9" fill="#888">5 &gt; 4 → 弹！</text>
  </g>

  <!-- pop arrow -->
  <path d="M 200 214 L 150 214" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="218" font-size="9" fill="#b85450" font-weight="bold">弹出 [2]</text>
  <text x="100" y="232" font-size="8" fill="#b85450">ans[2] = 5</text>

  <!-- ===== After popping [2], check [3] already popped below; show ans[3] ===== -->
  <text x="30" y="276" font-size="11" fill="#d6a040" font-weight="bold">先弹 [3]（5 &gt; 3），再弹 [2]（5 &gt; 4）</text>
  <g font-size="10">
    <rect x="200" y="286" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="250" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">[3] = 3 ← 已弹</text>
    <text x="312" y="304" font-size="9" fill="#888">5 &gt; 3 → 弹！</text>
  </g>
  <path d="M 200 300 L 150 300" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="304" font-size="9" fill="#b85450" font-weight="bold">弹出 [3]</text>
  <text x="100" y="318" font-size="8" fill="#b85450">ans[3] = 5</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="338" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">与 739 的唯一差异：结算写「值」 answer[top]=vals[i]，而非「距离」i-top</text>
  <text x="50" y="376" font-size="10" fill="#555">i=4 (值5) 一次弹 [3] 和 [2]，ans[3]=ans[2]=5；每个元素入/出栈各 1 次 → O(n)</text>
  <text x="50" y="388" font-size="10" fill="#4a7a3a" font-weight="bold">找更大用递减栈；链表先取值再套模板</text>
</svg>
