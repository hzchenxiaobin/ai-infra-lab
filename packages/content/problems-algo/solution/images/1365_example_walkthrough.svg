<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：nums = [8,1,2,2,3] → answer = [4,0,1,1,3]</text>

  <!-- ====== Phase 1: build count[] ====== -->
  <text x="60" y="60" font-size="12" fill="#d6a040" font-weight="bold">阶段 ①：统计频次 count[v]++</text>

  <!-- original array -->
  <text x="50" y="84" font-size="10" fill="#888">nums:</text>
  <g font-size="14">
    <rect x="86" y="68" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="106" y="89" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="128" y="68" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="148" y="89" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="170" y="68" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="190" y="89" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="212" y="68" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="232" y="89" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="254" y="68" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="274" y="89" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>

  <!-- arrow to count -->
  <path d="M 166 104 L 166 118" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- count array (only show 0-8) -->
  <text x="50" y="132" font-size="10" fill="#888">count:</text>
  <g font-size="9" fill="#aaa">
    <text x="106" y="126" text-anchor="middle">0</text>
    <text x="148" y="126" text-anchor="middle">1</text>
    <text x="190" y="126" text-anchor="middle">2</text>
    <text x="232" y="126" text-anchor="middle">3</text>
    <text x="274" y="126" text-anchor="middle">4</text>
    <text x="316" y="126" text-anchor="middle">5</text>
    <text x="358" y="126" text-anchor="middle">6</text>
    <text x="400" y="126" text-anchor="middle">7</text>
    <text x="442" y="126" text-anchor="middle">8</text>
  </g>
  <g font-size="14">
    <rect x="86" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="106" y="151" text-anchor="middle" fill="#aaa">0</text>
    <rect x="128" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="148" y="151" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="170" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="190" y="151" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="212" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="232" y="151" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="254" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="274" y="151" text-anchor="middle" fill="#aaa">0</text>
    <rect x="296" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="316" y="151" text-anchor="middle" fill="#aaa">0</text>
    <rect x="338" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="358" y="151" text-anchor="middle" fill="#aaa">0</text>
    <rect x="380" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="151" text-anchor="middle" fill="#aaa">0</text>
    <rect x="422" y="130" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="442" y="151" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- ====== Phase 2: prefix sum ====== -->
  <text x="60" y="188" font-size="12" fill="#b85450" font-weight="bold">阶段 ②：前缀和 smaller[v] = smaller[v−1] + count[v−1]</text>

  <!-- arrow down -->
  <path d="M 166 166 L 166 180" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="50" y="198" font-size="10" fill="#888">smaller:</text>
  <g font-size="9" fill="#aaa">
    <text x="106" y="192" text-anchor="middle">0</text>
    <text x="148" y="192" text-anchor="middle">1</text>
    <text x="190" y="192" text-anchor="middle">2</text>
    <text x="232" y="192" text-anchor="middle">3</text>
    <text x="274" y="192" text-anchor="middle">4</text>
    <text x="316" y="192" text-anchor="middle">5</text>
    <text x="358" y="192" text-anchor="middle">6</text>
    <text x="400" y="192" text-anchor="middle">7</text>
    <text x="442" y="192" text-anchor="middle">8</text>
  </g>
  <g font-size="14">
    <rect x="86" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="106" y="217" text-anchor="middle" fill="#aaa">0</text>
    <rect x="128" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="148" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="170" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="190" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="212" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="232" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="254" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="274" y="217" text-anchor="middle" fill="#aaa">4</text>
    <rect x="296" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="316" y="217" text-anchor="middle" fill="#aaa">4</text>
    <rect x="338" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="358" y="217" text-anchor="middle" fill="#aaa">4</text>
    <rect x="380" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="217" text-anchor="middle" fill="#aaa">4</text>
    <rect x="422" y="196" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="442" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- ====== Phase 3: query table ====== -->
  <text x="60" y="254" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 ③：查表 answer[i] = smaller[nums[i]]</text>

  <!-- right side: step table -->
  <text x="500" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查表过程</text>
  <rect x="470" y="68" width="150" height="22" rx="3" fill="#446688" filter="url(#rough2)"/>
  <g font-size="10" fill="#fff" font-weight="bold">
    <text x="486" y="83">i</text>
    <text x="520" y="83">nums[i]</text>
    <text x="575" y="83" text-anchor="middle">answer</text>
  </g>
  <g font-size="10" fill="#444">
    <rect x="470" y="92" width="150" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="486" y="106">0</text>
    <text x="520" y="106" fill="#446688" font-weight="bold">8</text>
    <text x="575" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="470" y="112" width="150" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="486" y="126">1</text>
    <text x="520" y="126" fill="#446688" font-weight="bold">1</text>
    <text x="575" y="126" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="470" y="132" width="150" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="486" y="146">2</text>
    <text x="520" y="146" fill="#446688" font-weight="bold">2</text>
    <text x="575" y="146" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="470" y="152" width="150" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="486" y="166">3</text>
    <text x="520" y="166" fill="#446688" font-weight="bold">2</text>
    <text x="575" y="166" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="470" y="172" width="150" height="20" fill="#e8f0fe" filter="url(#rough2)" opacity="0.4"/>
    <text x="486" y="186">4</text>
    <text x="520" y="186" fill="#446688" font-weight="bold">3</text>
    <text x="575" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- mapping arrows from nums to smaller -->
  <path d="M 106 100 C 106 160 442 180 442 196" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 148 100 C 148 160 148 180 148 196" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 190 100 C 190 160 190 180 190 196" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 232 100 C 232 160 232 180 232 196" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 274 100 C 274 160 232 180 232 196" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- answer row -->
  <text x="50" y="278" font-size="10" fill="#888">answer:</text>
  <g font-size="16">
    <rect x="86" y="262" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="106" y="286" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="128" y="262" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="148" y="286" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="170" y="262" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="190" y="286" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="212" y="262" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="232" y="286" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="254" y="262" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="274" y="286" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- arrows from table answer to answer row -->
  <path d="M 575 192 L 300 262" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.5"/>

  <!-- bottom insight -->
  <rect x="40" y="316" width="560" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：count[2]=2 ⇒ smaller[3]=0+1+2=3（比 3 小的有 0,1,2,2 共 3 个）</text>
  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#666">相同值 2 出现两次，但 smaller[2] 只数严格小于的 → 两个 2 的 answer 都是 1</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="60" y="388" width="16" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="82" y="398" fill="#555">count[v] = 值 v 的出现次数</text>
    <rect x="240" y="388" width="16" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="262" y="398" fill="#555">smaller[v] = 比 v 小的个数</text>
    <rect x="420" y="388" width="16" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="442" y="398" fill="#555">answer = 查表结果</text>
  </g>

  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#888">answer = [4, 0, 1, 1, 3] ✓</text>
</svg>
