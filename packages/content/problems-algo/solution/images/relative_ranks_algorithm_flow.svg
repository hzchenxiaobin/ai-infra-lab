<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
      <path d="M0 0 L4.5 7 L9 0 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：排序 + 按位置赋名次</text>

  <!-- Step 1 -->
  <rect x="180" y="50" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 构造 arr[i] = (score[i], i)</text>
  <path d="M300 88 L300 102" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="180" y="106" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 按分数降序排序 arr</text>
  <path d="M300 144 L300 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: loop header -->
  <rect x="160" y="162" width="280" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="186" text-anchor="middle" font-size="13" fill="#5a3a00" filter="url(#rough2)">③ 遍历 pos = 0..n-1，取 (sc, idx)</text>
  <path d="M300 200 L300 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="300,218 380,262 300,306 220,262" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">pos 取值？</text>
  <text x="300" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0/1/2/≥3)</text>

  <!-- 4 branch curves -->
  <g fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)">
    <path d="M220 262 C180 300, 100 320, 100 340" marker-end="url(#arrD)"/>
    <path d="M260 286 C250 310, 240 320, 240 340" marker-end="url(#arrD)"/>
    <path d="M340 286 C350 310, 380 320, 380 340" marker-end="url(#arrD)"/>
    <path d="M380 262 C420 300, 520 320, 520 340" marker-end="url(#arrD)"/>
  </g>
  <g font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="296">pos=0</text>
    <text x="232" y="312">pos=1</text>
    <text x="368" y="312">pos=2</text>
    <text x="452" y="296">pos≥3</text>
  </g>

  <!-- 4 branch boxes -->
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="40" y="340" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="180" y="340" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="320" y="340" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="460" y="340" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="100" y="365" fill="#5a3a00">"Gold Medal"</text>
    <text x="240" y="365" fill="#5a3a00">"Silver Medal"</text>
    <text x="380" y="365" fill="#5a3a00">"Bronze Medal"</text>
    <text x="520" y="365" fill="#2a4a2a">str(pos + 1)</text>
  </g>

  <!-- merge arrows down -->
  <g fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <path d="M100 380 L100 408" marker-end="url(#arrD)"/>
    <path d="M240 380 L240 408" marker-end="url(#arrD)"/>
    <path d="M380 380 L380 408" marker-end="url(#arrD)"/>
    <path d="M520 380 L520 408" marker-end="url(#arrD)"/>
  </g>

  <!-- Step 4: write back -->
  <rect x="80" y="408" width="440" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ answer[idx] = rank，回到 ③ 直到遍历完</text>

  <text x="300" y="462" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 answer ✓</text>
</svg>
