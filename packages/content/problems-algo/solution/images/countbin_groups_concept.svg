<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分组计数：相邻两组取 min(a, b) 即得跨组子串数</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">合法子串恰跨一个 0/1 边界，由相邻两段各取 k 个拼成（1 ≤ k ≤ min(a,b)）</text>

  <!-- ===== String cells ===== -->
  <text x="44" y="92" font-size="12" fill="#446688" font-weight="bold">s =</text>
  <g font-size="16" font-weight="bold">
    <!-- indices: 0 0 1 1 0 0 1 1 ; cells width 44 starting x=80 -->
    <rect x="80"  y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="102" y="96" text-anchor="middle" fill="#446688">0</text>
    <rect x="124" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="146" y="96" text-anchor="middle" fill="#446688">0</text>
    <rect x="168" y="68" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="96" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="212" y="68" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="234" y="96" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="256" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="278" y="96" text-anchor="middle" fill="#446688">0</text>
    <rect x="300" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="322" y="96" text-anchor="middle" fill="#446688">0</text>
    <rect x="344" y="68" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="366" y="96" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="388" y="68" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="410" y="96" text-anchor="middle" fill="#d6a040">1</text>
  </g>
  <!-- index labels -->
  <g font-size="9" fill="#888">
    <text x="102" y="124" text-anchor="middle">0</text>
    <text x="146" y="124" text-anchor="middle">1</text>
    <text x="190" y="124" text-anchor="middle">2</text>
    <text x="234" y="124" text-anchor="middle">3</text>
    <text x="278" y="124" text-anchor="middle">4</text>
    <text x="322" y="124" text-anchor="middle">5</text>
    <text x="366" y="124" text-anchor="middle">6</text>
    <text x="410" y="124" text-anchor="middle">7</text>
  </g>

  <!-- ===== Group brackets below cells ===== -->
  <g stroke="#666" stroke-width="1.2" fill="none">
    <!-- 4 brackets, each spans 2 cells (width 88) at y=132 -->
    <path d="M 82 134 L 82 140 L 168 140 L 168 134" filter="url(#rough2)"/>
    <path d="M 170 134 L 170 140 L 256 140 L 256 134" filter="url(#rough2)"/>
    <path d="M 258 134 L 258 140 L 344 140 L 344 134" filter="url(#rough2)"/>
    <path d="M 346 134 L 346 140 L 432 140 L 432 134" filter="url(#rough2)"/>
  </g>
  <!-- group length labels -->
  <g font-size="11" fill="#3a5a2a" font-weight="bold">
    <text x="125" y="156" text-anchor="middle">g₁=2</text>
    <text x="213" y="156" text-anchor="middle">g₂=2</text>
    <text x="301" y="156" text-anchor="middle">g₃=2</text>
    <text x="389" y="156" text-anchor="middle">g₄=2</text>
  </g>
  <text x="500" y="148" font-size="11" fill="#4a7a3a">分组长度</text>
  <text x="500" y="162" font-size="11" fill="#4a7a3a" font-weight="bold">g = [2,2,2,2]</text>

  <line x1="30" y1="176" x2="570" y2="176" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Three adjacent-pair rows ===== -->
  <text x="40" y="194" font-size="11" fill="#b85450" font-weight="bold">相邻组配对：每对贡献 min(a, b) 个跨边界子串</text>

  <!-- column headers -->
  <g font-size="10" fill="#3a4a66" font-weight="bold">
    <text x="60"  y="214" text-anchor="middle">配对</text>
    <text x="175" y="214" text-anchor="middle">相邻两段</text>
    <text x="305" y="214" text-anchor="middle">min(a,b)</text>
    <text x="450" y="214" text-anchor="middle">贡献的子串</text>
  </g>

  <!-- row 1: g1,g2  00 | 11 -->
  <rect x="40" y="222" width="520" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60"  y="243" text-anchor="middle" font-size="11" fill="#333">① g₁,g₂</text>
  <text x="175" y="243" text-anchor="middle" font-size="12" font-weight="bold">
    <tspan fill="#446688">00</tspan><tspan fill="#888"> | </tspan><tspan fill="#d6a040">11</tspan>
  </text>
  <text x="305" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min(2,2)=2</text>
  <text x="450" y="243" text-anchor="middle" font-size="11" fill="#333">"01"、"0011"</text>

  <!-- row 2: g2,g3  11 | 00 -->
  <rect x="40" y="258" width="520" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60"  y="279" text-anchor="middle" font-size="11" fill="#333">② g₂,g₃</text>
  <text x="175" y="279" text-anchor="middle" font-size="12" font-weight="bold">
    <tspan fill="#d6a040">11</tspan><tspan fill="#888"> | </tspan><tspan fill="#446688">00</tspan>
  </text>
  <text x="305" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min(2,2)=2</text>
  <text x="450" y="279" text-anchor="middle" font-size="11" fill="#333">"10"、"1100"</text>

  <!-- row 3: g3,g4  00 | 11 -->
  <rect x="40" y="294" width="520" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60"  y="315" text-anchor="middle" font-size="11" fill="#333">③ g₃,g₄</text>
  <text x="175" y="315" text-anchor="middle" font-size="12" font-weight="bold">
    <tspan fill="#446688">00</tspan><tspan fill="#888"> | </tspan><tspan fill="#d6a040">11</tspan>
  </text>
  <text x="305" y="315" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min(2,2)=2</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#333">"01"、"0011"</text>

  <!-- column separators -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="110" y1="206" x2="110" y2="328" filter="url(#rough2)"/>
    <line x1="240" y1="206" x2="240" y2="328" filter="url(#rough2)"/>
    <line x1="370" y1="206" x2="370" y2="328" filter="url(#rough2)"/>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="40" y="344" width="520" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="366" font-size="11.5" fill="#3a5a2a" font-weight="bold">答案 = Σ min(gᵢ, gᵢ₊₁) = min(2,2) + min(2,2) + min(2,2) = 2 + 2 + 2 = 6 ✓</text>
  <text x="60" y="384" font-size="10.5" fill="#555">• 每对相邻段各取 k 个（k=1..min）拼成 0..01..1 或 1..10..0，共 min(a,b) 个</text>
  <text x="60" y="398" font-size="10.5" fill="#4a7a3a" font-weight="bold">• 关键：配对数受较短段限制（木桶效应），与较长段无关 → 故取 min</text>
</svg>
