<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：回文集合静态稀疏，二分找最近邻</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pals = [1, 3, 5, 7, 9, 15, 17, 21, 27, 31, 33, …]（13 位以内共 190 个）</text>

  <!-- 图例 -->
  <circle cx="56" cy="72" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="76" font-size="9.5" fill="#666" filter="url(#rough2)">二进制回文数</text>
  <circle cx="160" cy="72" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="76" font-size="9.5" fill="#666" filter="url(#rough2)">查询 x</text>

  <!-- 数值轴 -->
  <path d="M 36 150 L 528 150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="543" y="154" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">数值</text>

  <!-- 整数刻度（0..35，每格 13px） -->
  <path d="M 46 146 V 154 M 59 146 V 154 M 72 146 V 154 M 85 146 V 154 M 98 146 V 154 M 111 146 V 154 M 124 146 V 154 M 137 146 V 154 M 150 146 V 154 M 163 146 V 154 M 176 146 V 154 M 189 146 V 154 M 202 146 V 154 M 215 146 V 154 M 228 146 V 154 M 241 146 V 154 M 254 146 V 154 M 267 146 V 154 M 280 146 V 154 M 293 146 V 154 M 306 146 V 154 M 319 146 V 154 M 332 146 V 154 M 345 146 V 154 M 358 146 V 154 M 371 146 V 154 M 384 146 V 154 M 397 146 V 154 M 410 146 V 154 M 423 146 V 154 M 436 146 V 154 M 449 146 V 154 M 462 146 V 154 M 475 146 V 154 M 488 146 V 154 M 501 146 V 154"
        fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="111" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="176" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>
  <text x="241" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">15</text>
  <text x="306" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">20</text>
  <text x="371" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">25</text>
  <text x="436" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">30</text>
  <text x="501" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">35</text>

  <!-- 回文数圆点 -->
  <circle cx="59" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="85" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="111" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="137" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">7</text>
  <circle cx="163" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>
  <circle cx="241" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">15</text>
  <circle cx="267" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="267" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">17</text>
  <circle cx="319" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">21</text>
  <circle cx="397" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">27</text>
  <circle cx="449" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">31</text>
  <circle cx="475" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="154" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">33</text>
  <text x="510" y="155" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">…</text>

  <!-- 查询 x=12：左右打平 -->
  <circle cx="202" cy="150" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="202" y="154" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">12</text>
  <path d="M 197 141 Q 179 110 168 141" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 207 141 Q 225 110 236 141" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="176" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3 步</text>
  <text x="228" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3 步</text>
  <text x="202" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">12 → ans = 3（左右打平）</text>

  <!-- 查询 x=25：取更近的 27 -->
  <circle cx="371" cy="150" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="371" y="154" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">25</text>
  <path d="M 366 141 Q 348 110 327 141" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 376 141 Q 391 110 402 141" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="344" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4 步</text>
  <text x="392" y="114" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2 步 ✓</text>
  <text x="371" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">25 → ans = 2（取更近的 27）</text>

  <!-- 观察一 -->
  <rect x="40" y="216" width="250" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">观察一 · 最优目标有界</text>
  <text x="165" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">全 1 数 2^k - 1 必是回文 ⇒ 8191 兜底</text>
  <text x="165" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">任何 14 位回文 ≥ 8193，必比 8191 更远</text>
  <text x="165" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⇒ 预处理上界 2^13 = 8192 封顶</text>

  <!-- 观察二 -->
  <rect x="310" y="216" width="220" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">观察二 · 回文极度稀疏</text>
  <text x="420" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">L 位回文由前 ⌈L/2⌉ 位决定（后一半</text>
  <text x="420" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">只是镜像）⇒ 13 位以内仅 190 个</text>
  <text x="420" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">打表 O(2^13 × 13) ≈ 10^5 次位运算</text>

  <!-- 观察三 -->
  <rect x="40" y="318" width="490" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="340" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">观察三 · 查询 = 有序表上找最近邻</text>
  <text x="285" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans[x] = min( 右候选 pals[j] - x , x - 左候选 pals[j-1] )</text>
  <text x="285" y="374" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">一次 lower_bound 二分即可；x 自身是回文时距离恰为 0</text>
</svg>
