<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个输入的逐位填空过程</text>

  <!-- ===== Row 1: 1?:?4 → 11:54 ===== -->
  <rect x="50" y="48" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="82" y="48" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="73" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="114" y="48" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="73" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="146" y="48" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="73" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="178" y="48" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="193" y="73" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 216 67 L 240 67" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="248" y="48" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="263" y="73" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="48" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="73" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="48" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="73" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="344" y="48" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="359" y="73" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="376" y="48" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="391" y="73" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="430" y="60" font-size="10.5" fill="#446688" filter="url(#rough2)">1 档</text>
  <text x="430" y="76" font-size="10.5" fill="#446688" filter="url(#rough2)">凑 11</text>

  <text x="260" y="102" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">十位 '1' 已定 → 个位 '?' 填 '1' 凑 11；分十位 '?' → '5'；'4' 已定</text>

  <!-- ===== Row 2: 0?:5? → 09:59 ===== -->
  <rect x="50" y="122" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="147" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="82" y="122" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="147" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="114" y="122" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="147" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="146" y="122" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="147" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="178" y="122" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="147" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>

  <path d="M 216 141 L 240 141" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="248" y="122" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="263" y="147" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="280" y="122" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="147" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="312" y="122" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="147" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="344" y="122" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="147" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="376" y="122" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="147" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="430" y="134" font-size="10.5" fill="#446688" filter="url(#rough2)">0 档</text>
  <text x="430" y="150" font-size="10.5" fill="#446688" filter="url(#rough2)">凑 09</text>

  <text x="260" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">十位 '0' 已定 → 个位 '?' 填 '9' 凑 09；'5' 已定；分个位 '?' → '9'</text>

  <!-- ===== Row 3: ??:?? → 11:59 ===== -->
  <rect x="50" y="196" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="221" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="82" y="196" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="221" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="114" y="196" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="221" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="146" y="196" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="221" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="178" y="196" width="30" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="221" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>

  <path d="M 216 215 L 240 215" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="248" y="196" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="221" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280" y="196" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="221" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="196" width="30" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="221" text-anchor="middle" font-size="17" fill="#999" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="344" y="196" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="359" y="221" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="376" y="196" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="221" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="430" y="208" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">冲 1 档</text>
  <text x="430" y="224" font-size="10.5" fill="#446688" filter="url(#rough2)">全 '?'</text>

  <text x="260" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">个位 '?' 不阻碍 → 十位 '?' 填 '1' 冲 1 档；个位看已定十位 '1' → 填 '1'；分钟凑 59</text>

  <!-- warning box -->
  <rect x="40" y="268" width="472" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="276" y="289" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 陷阱：输入 "?4:??" 时个位 4 &gt; 1，十位 '?' 只能填 '0' → "04:59"</text>
  <text x="276" y="309" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">若手滑填 '1' 得 "14:59"——12 小时制没有 14 点，非法</text>

  <!-- bottom note -->
  <rect x="40" y="340" width="472" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="276" y="361" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">红框 = 待填 '?'，橙框 = 贪心填上的数字，白框 = 已固定的约束</text>
  <text x="276" y="381" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">填空口诀：时十位看个位定档（优先冲 1 档），时个位看十位定上限，分钟永凑 59</text>
</svg>
