<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">n = 10⁶ 的复杂度阶梯：谁能活着走到 AC？</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">题目明示：内存限制比常规小 + 必须实现线性复杂度</text>

  <!-- 行 1：暴力 -->
  <rect x="34" y="58" width="452" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">① 暴力枚举全部子串 + 逐个判定</text>
  <text x="50" y="98" font-size="10.5" fill="#8a3833" filter="url(#rough2)">O(n²) ≈ 5×10¹¹ 步——超时约五个数量级</text>
  <text x="50" y="113" font-size="10" fill="#b85450" filter="url(#rough2)">I 版（n=10⁵）就已经跑不动，II 版彻底没戏</text>
  <rect x="394" y="74" width="80" height="32" fill="#b85450" rx="16" filter="url(#rough2)"/>
  <text x="434" y="95" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">❌ TLE</text>

  <!-- 行 2：前缀频数 + 二分 -->
  <rect x="34" y="130" width="452" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="152" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">② 前缀频数表 pre[26][n] + 二分右端点</text>
  <text x="50" y="170" font-size="10.5" fill="#8a3833" filter="url(#rough2)">时间 O(26·n·log n) ≈ 5×10⁸ 步悬；空间 ≈ 104 MB</text>
  <text x="50" y="185" font-size="10" fill="#b85450" filter="url(#rough2)">计数最大到 10⁶，short 存不下 → 压缩空间这条路也堵死</text>
  <rect x="394" y="146" width="80" height="32" fill="#b85450" rx="16" filter="url(#rough2)"/>
  <text x="434" y="167" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">❌ MLE</text>

  <!-- 行 3：滑窗但每步扫 26 -->
  <rect x="34" y="202" width="452" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="224" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 欠账滑窗，但每次判定扫 26 个字母</text>
  <text x="50" y="242" font-size="10.5" fill="#a07830" filter="url(#rough2)">O(26n) ≈ 2.6×10⁷ 步——理论上仍是线性</text>
  <text x="50" y="257" font-size="10" fill="#a07830" filter="url(#rough2)">但常数 ×26：C++ 险过，Python 有超时风险</text>
  <rect x="394" y="218" width="80" height="32" fill="#d6a040" rx="16" filter="url(#rough2)"/>
  <text x="434" y="239" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">⚠ 勉强</text>

  <!-- 行 4：欠账滑窗 -->
  <rect x="34" y="274" width="452" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="296" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 欠账滑窗：less 欠账数 + 恰好跨界更新</text>
  <text x="50" y="314" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">O(n+m) ≈ 2×10⁶ 步；空间两张 26 格表 ≈ 208 B</text>
  <text x="50" y="329" font-size="10" fill="#2f5d24" filter="url(#rough2)">与 I 版（3297）代码逐字相同——原样提交即过</text>
  <rect x="394" y="290" width="80" height="32" fill="#4a7a3a" rx="16" filter="url(#rough2)"/>
  <text x="434" y="311" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold" filter="url(#rough2)">✓ AC</text>

  <!-- 底部结论 -->
  <rect x="34" y="348" width="452" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">出题人的两道关卡：时间卡 O(n²) 与 O(n log n)，内存卡 O(n) 级辅助数组</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">滑窗只带两张 26 格计数表（≈ 208 B），在缩水的内存限制面前毫无压力</text>
</svg>
