<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">位移加速：翻倍跳跃 vs 逐个相减（100 ÷ 3 = 33）</text>

  <!-- ============ TOP: 逐个连减 ============ -->
  <text x="40" y="62" font-size="13" fill="#b85450" font-weight="bold">① 逐个连减：每次只减 1 个 b</text>

  <!-- boxes: 100 -> 97 -> 94 -> ... -> 4 -> 1 -->
  <rect x="30" y="78" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="58" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">100</text>

  <path d="M 86 95 L 116 95" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="101" y="88" text-anchor="middle" font-size="10" fill="#b85450">−3</text>

  <rect x="118" y="78" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="142" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">97</text>

  <path d="M 168 95 L 198 95" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="183" y="88" text-anchor="middle" font-size="10" fill="#b85450">−3</text>

  <rect x="200" y="78" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="224" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">94</text>

  <path d="M 250 95 L 286 95" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="88" text-anchor="middle" font-size="10" fill="#888">−3 …</text>

  <rect x="288" y="78" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="308" y="100" text-anchor="middle" font-size="12" fill="#888">…</text>

  <path d="M 330 95 L 360 95" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="88" text-anchor="middle" font-size="10" fill="#b85450">−3</text>

  <rect x="362" y="78" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="384" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <path d="M 408 95 L 438 95" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="423" y="88" text-anchor="middle" font-size="10" fill="#b85450">−3</text>

  <rect x="440" y="78" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="462" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- slow note -->
  <rect x="30" y="128" width="510" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="150" text-anchor="middle" font-size="12.5" fill="#444">共 <tspan font-weight="bold" fill="#b85450">33 步</tspan> 减完，商 = 33 —— 复杂度 O(quotient)，商大时必超时</text>

  <!-- Divider -->
  <path d="M 30 188 L 540 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ BOTTOM: 位移加速 ============ -->
  <text x="40" y="214" font-size="13" fill="#4a7a3a" font-weight="bold">② 位移加速：一次减掉最大的 2^k × b</text>

  <!-- big boxes: 100 ==96==> 4 ==3==> 1 -->
  <rect x="30" y="234" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="262" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">100</text>

  <!-- big arrow 1 -->
  <path d="M 104 256 L 244 256" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="118" y="232" width="112" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="174" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−96 = 3 ≪ 5</text>
  <rect x="124" y="262" width="100" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="174" y="275" text-anchor="middle" font-size="10.5" fill="#444">商 += 2^5 = 32</text>

  <rect x="248" y="234" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="276" y="262" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">4</text>

  <!-- big arrow 2 -->
  <path d="M 308 256 L 448 256" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="322" y="232" width="112" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="378" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−3 = 3 ≪ 0</text>
  <rect x="328" y="262" width="100" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="378" y="275" text-anchor="middle" font-size="10.5" fill="#444">商 += 2^0 = 1</text>

  <rect x="452" y="234" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="262" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>

  <!-- doubling chain hint -->
  <text x="40" y="304" font-size="11" fill="#888">b 翻倍链：</text>
  <rect x="110" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="156" y="307" font-size="11" fill="#888">→</text>
  <rect x="168" y="292" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
  <text x="214" y="307" font-size="11" fill="#888">→</text>
  <rect x="226" y="292" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="248" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a">12</text>
  <text x="276" y="307" font-size="11" fill="#888">→ … →</text>
  <rect x="330" y="292" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a">48</text>
  <text x="380" y="307" font-size="11" fill="#888">→</text>
  <rect x="392" y="292" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="307" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">96</text>
  <text x="442" y="307" font-size="11" fill="#888">→</text>
  <rect x="454" y="292" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="476" y="307" text-anchor="middle" font-size="11" fill="#b85450">192 ✗</text>

  <!-- fast note -->
  <rect x="30" y="332" width="510" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="354" text-anchor="middle" font-size="12.5" fill="#444">仅 <tspan font-weight="bold" fill="#4a7a3a">2 轮</tspan>，商 = 32 + 1 = 33 —— 复杂度 O(log q)，对数级</text>

  <!-- bottom takeaway -->
  <rect x="30" y="380" width="510" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="400" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">本质：商 = Σ c_i · 2^i，每轮剥离商的一个二进制位</text>
  <text x="285" y="416" text-anchor="middle" font-size="11" fill="#555">左移翻倍压缩减法次数，正如快速幂用平方压缩乘法次数</text>
</svg>
