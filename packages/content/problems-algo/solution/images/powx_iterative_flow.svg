<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">迭代快速幂流程：扫描 N 的每一位</text>

  <!-- Start -->
  <rect x="190" y="40" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：N = n (long long)</text>
  <path d="M 260 70 L 260 82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N<0 decision -->
  <path d="M 260 86 L 320 120 L 260 154 L 200 120 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333">N &lt; 0 ?</text>
  <!-- yes branch: flip -->
  <path d="M 320 120 L 380 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="382" y="104" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="119" text-anchor="middle" font-size="11" fill="#333">x = 1/x</text>
  <text x="442" y="133" text-anchor="middle" font-size="11" fill="#333">N = -N</text>
  <path d="M 442 138 L 442 168 L 260 168 L 260 154" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- no branch -->
  <text x="268" y="166" font-size="10" fill="#4a7a3a">否</text>

  <!-- init ans -->
  <path d="M 260 168 L 260 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="180" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333">ans = 1.0</text>
  <path d="M 260 210 L 260 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <path d="M 260 226 L 330 260 L 260 294 L 190 260 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333">N != 0 ?</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#888">(循环)</text>
  <!-- no: return -->
  <path d="M 190 260 L 130 260" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="244" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="83" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- yes: into loop body -->
  <path d="M 260 294 L 260 306" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="304" font-size="10" fill="#4a7a3a">是</text>

  <!-- N&1 decision -->
  <path d="M 260 310 L 330 344 L 260 378 L 190 344 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#333">N &amp; 1 ?</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#888">(最低位为1)</text>
  <!-- yes: ans *= x -->
  <path d="M 330 344 L 392 344" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="338" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="394" y="328" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans *= x</text>
  <path d="M 444 362 L 444 396 L 260 396" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- no: skip -->
  <path d="M 260 378 L 260 396" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="392" font-size="10" fill="#4a7a3a">否</text>

  <!-- square + shift -->
  <rect x="150" y="396" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x *= x ;  N &gt;&gt;= 1</text>
  <!-- loop back to condition -->
  <path d="M 150 413 L 60 413 L 60 260 L 190 260" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="340" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 340)">回到循环判断</text>
</svg>
