<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 135 → 110</text>

  <!-- table header -->
  <rect x="20" y="40" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">分组</text>
  <text x="330" y="60" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">选取 / 推导</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">计数</text>

  <!-- row 1: 1-digit -->
  <rect x="20" y="74" width="540" height="34" fill="#f3f9f1" stroke="#9ab89a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="95" text-anchor="middle" font-size="11.5" fill="#444">位数 &lt; 3 · 1 位</text>
  <text x="330" y="95" text-anchor="middle" font-size="11.5" fill="#555">1 ~ 9</text>
  <text x="500" y="95" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">9</text>

  <!-- row 2: 2-digit -->
  <rect x="20" y="110" width="540" height="34" fill="#f3f9f1" stroke="#9ab89a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="131" text-anchor="middle" font-size="11.5" fill="#444">位数 &lt; 3 · 2 位</text>
  <text x="330" y="131" text-anchor="middle" font-size="11.5" fill="#555">首位 1-9 × 次位 0-9 去重 = 9 × 9</text>
  <text x="500" y="131" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">81</text>

  <!-- separator -->
  <text x="290" y="161" text-anchor="middle" font-size="11" fill="#888">— 位数 = 3 且 ≤ 135：逐位贴上界 —</text>

  <!-- row 3: 3-digit first<1 (none) -->
  <rect x="20" y="168" width="540" height="32" fill="#fcf0f0" stroke="#d8a8a8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#444">首位 &lt; 1</text>
  <text x="330" y="188" text-anchor="middle" font-size="11" fill="#999">无（首位不能为 0）</text>
  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- row 4: first=1 second<3 -->
  <rect x="20" y="202" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="219" text-anchor="middle" font-size="11" fill="#444">首位=1, 次位&lt;3</text>
  <text x="330" y="216" text-anchor="middle" font-size="11" fill="#555">次位 ∈ {0, 2}（1 已用）</text>
  <text x="330" y="232" text-anchor="middle" font-size="10.5" fill="#888">各剩 8 个可用数字填末位 → P(8,1)=8</text>
  <text x="500" y="225" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8 + 8 = 16</text>

  <!-- row 5: first=1 second=3 last<5 -->
  <rect x="20" y="244" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="261" text-anchor="middle" font-size="11" fill="#444">首位=1,次位=3,末位&lt;5</text>
  <text x="330" y="261" text-anchor="middle" font-size="11" fill="#555">末位 ∈ {0, 2, 4}（1、3 已用）</text>
  <text x="330" y="277" text-anchor="middle" font-size="10.5" fill="#888">末位无后缀 → P(7,0)=1 ×3</text>
  <text x="500" y="267" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3</text>

  <!-- row 6: n itself -->
  <rect x="20" y="286" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="307" text-anchor="middle" font-size="11.5" fill="#2f5a26">135 本身</text>
  <text x="330" y="307" text-anchor="middle" font-size="11.5" fill="#555">1、3、5 互异 → 特殊</text>
  <text x="500" y="307" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- total -->
  <rect x="20" y="326" width="540" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="352" text-anchor="middle" font-size="13" fill="#7a3a36" font-weight="bold">合计</text>
  <text x="330" y="352" text-anchor="middle" font-size="12.5" fill="#7a3a36">9 + 81 + 16 + 3 + 1</text>
  <text x="500" y="352" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">110 ✓</text>

  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888">全程只遍历 3 位，每位枚举 ≤ 10 个数字：O(L) 时间 / O(1) 空间</text>
</svg>
