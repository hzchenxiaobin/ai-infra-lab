<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：预处理小步长 → 按步长分流查询
  </text>

  <!-- Step 1: choose B -->
  <rect x="170" y="46" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 取阈值 B = √n</text>
  <text x="280" y="78" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">平衡预处理与查询</text>

  <path d="M280,90 L280,108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: preprocess -->
  <rect x="120" y="112" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 预处理：y = 1..B</text>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">x 从 n−1 到 0：pre[y][x] = nums[x] + pre[y][x+y]</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（越界则 pre[y][x] = nums[x]）开销 O(n·B)</text>

  <path d="M280,172 L280,190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: iterate queries -->
  <rect x="170" y="194" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 遍历每个查询 [x, y]</text>

  <path d="M280,234 L280,252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: y <= B? -->
  <path d="M280,256 L360,286 L280,316 L200,286 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y ≤ B ?</text>
  <text x="280" y="296" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">步长判别</text>

  <!-- Yes branch: left -->
  <path d="M200,286 L120,286 L120,330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="334" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = pre[y][x]</text>
  <text x="130" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">查表 O(1)</text>
  <text x="130" y="384" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（已 mod 1e9+7）</text>

  <!-- No branch: right -->
  <path d="M360,286 L440,286 L440,330" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">否</text>
  <rect x="340" y="334" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="354" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans = Σ nums[x+ky]</text>
  <text x="430" y="370" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">遍历 O(√n)</text>
  <text x="430" y="384" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">k = 0,1,… &lt; n</text>

  <!-- merge arrows to return -->
  <path d="M130,392 L130,412 L270,412" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M430,392 L430,412 L290,412" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="220" y="404" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 收集答案返回</text>
</svg>
