<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三类非法矩形：一次「区间 max + 列内检查」全部拦截</text>

  <!-- Panel A: interior/edge point in middle column -->
  <rect x="14" y="52" width="158" height="220" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 中间列夹了点</text>
  <rect x="38" y="104" width="110" height="80" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <circle cx="38" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="38" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="148" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="148" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="93" cy="144" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="101" y="138" font-size="10" fill="#b85450" filter="url(#rough2)">y₁&lt;y'&lt;y₂</text>
  <text x="93" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y' 的 last = 中间列</text>
  <text x="93" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">max 查到中间列，</text>
  <text x="93" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">检查失败 → ✗</text>
  <text x="93" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(内部/边界点同理)</text>

  <!-- Panel B: extra point on left edge -->
  <rect x="182" y="52" width="158" height="220" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="261" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 左列夹了点</text>
  <rect x="206" y="104" width="110" height="80" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <circle cx="206" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="206" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="206" cy="144" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="316" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="316" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="261" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">max = x₀ 本身，但</text>
  <text x="261" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">列 x₀ 的 [y₁,y₂] 内</text>
  <text x="261" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">有 3 个点 → ✗</text>
  <text x="261" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(y₁,y₂ 不相邻)</text>

  <!-- Panel C: missing corner on left column -->
  <rect x="350" y="52" width="158" height="220" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="429" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 左列缺一角</text>
  <rect x="374" y="104" width="110" height="80" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <circle cx="374" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="374" cy="104" r="5" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="366" y="98" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">y₂ 缺席</text>
  <circle cx="484" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="484" cy="184" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="429" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y₁ 的 last = x₀，</text>
  <text x="429" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">max 也 = x₀，但检查</text>
  <text x="429" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">发现缺 y₂ → ✗</text>

  <!-- bottom note -->
  <rect x="40" y="290" width="440" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#6b5410" filter="url(#rough2)">只要 max 查到的列 x₀ 上 [y₁,y₂] 内恰好是相邻的 y₁、y₂，</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#6b5410" filter="url(#rough2)">闭矩形内就恰好只有 4 个顶点——一次检查覆盖全部非法情形</text>
</svg>
