<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">次日留存率：首登日期 +1 天是否再次登录</text>

  <!-- Activity source table (left) -->
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Activity（源表）</text>
  <rect x="22" y="64" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="83" font-size="9.5" fill="#333">player_id</text>
  <text x="100" y="83" font-size="9.5" fill="#333">event_date</text>
  <line x1="72" y1="64" x2="72" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="22" y="94" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47" y="110" font-size="10" fill="#333">1</text>
  <text x="100" y="110" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="72" y1="94" x2="72" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="22" y="118" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="134" font-size="10" fill="#333">1</text>
  <text x="100" y="134" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-02</text>
  <line x1="72" y1="118" x2="72" y2="142" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="22" y="142" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="158" font-size="10" fill="#333">2</text>
  <text x="100" y="158" font-size="9.5" fill="#333">2017-06-25</text>
  <line x1="72" y1="142" x2="72" y2="166" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="22" y="166" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47" y="182" font-size="10" fill="#333">3</text>
  <text x="100" y="182" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <line x1="72" y1="166" x2="72" y2="190" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="22" y="190" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="206" font-size="10" fill="#333">3</text>
  <text x="100" y="206" font-size="9.5" fill="#333">2018-07-03</text>
  <line x1="72" y1="190" x2="72" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- GROUP BY MIN bracket -->
  <path d="M175 106 L188 106 L188 182 L175 182" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="138" font-size="9.5" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="200" y="151" font-size="9.5" fill="#446688" font-weight="bold">player_id</text>
  <text x="200" y="164" font-size="9.5" fill="#446688" font-weight="bold">MIN(date)</text>

  <!-- arrow to first_login table -->
  <path d="M255 144 L300 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- first_login subquery result (middle) -->
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">首登子查询 a</text>
  <rect x="300" y="64" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="83" font-size="9.5" fill="#333">player_id</text>
  <text x="392" y="83" font-size="9.5" fill="#333">first_login</text>
  <line x1="358" y1="64" x2="358" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="94" width="160" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="327" y="110" font-size="10" fill="#333">1</text>
  <text x="392" y="110" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="358" y1="94" x2="358" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="118" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="327" y="134" font-size="10" fill="#333">2</text>
  <text x="392" y="134" font-size="9.5" fill="#333">2017-06-25</text>
  <line x1="358" y1="118" x2="358" y2="142" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="142" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="327" y="158" font-size="10" fill="#333">3</text>
  <text x="392" y="158" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <line x1="358" y1="142" x2="358" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- DATE_ADD +1 day annotation -->
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">DATE_ADD(+1 天)</text>
  <path d="M380 190 L380 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- next-day target dates + check (right) -->
  <text x="545" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">次日是否登录</text>
  <rect x="470" y="64" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="83" font-size="9.5" fill="#333">目标日期</text>
  <text x="565" y="83" font-size="9.5" fill="#333">判定</text>
  <line x1="545" y1="64" x2="545" y2="94" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="470" y="94" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495" y="110" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-02</text>
  <text x="568" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="545" y1="94" x2="545" y2="118" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="470" y="118" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="134" font-size="9.5" fill="#333">2017-06-26</text>
  <text x="568" y="134" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <line x1="545" y1="118" x2="545" y2="142" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="470" y="142" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="158" font-size="9.5" fill="#333">2016-03-03</text>
  <text x="568" y="158" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <line x1="545" y1="142" x2="545" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrows first_login -> next-day target -->
  <path d="M460 106 L470 106" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M460 130 L470 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M460 154 L470 154" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ratio computation -->
  <rect x="470" y="190" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="545" y="207" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">留存 1 / 总 3</text>
  <text x="545" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 0.33</text>

  <!-- key takeaway box -->
  <rect x="40" y="270" width="560" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="294" font-size="11.5" fill="#333" font-weight="bold">核心：首登定位 + 次日存在性 = LEFT JOIN + DATE_ADD</text>
  <text x="60" y="316" font-size="10.5" fill="#555">• 子查询 GROUP BY + MIN → 每人首登日期（复用 511 范式，5 行压 3 行）</text>
  <text x="60" y="336" font-size="10.5" fill="#555">• DATE_ADD(first_login, INTERVAL 1 DAY) → 算出次日目标日期</text>
  <text x="60" y="356" font-size="10.5" fill="#555">• LEFT JOIN 在 (player_id, 目标日期) 上匹配 → 对齐=留存 / NULL=未留存</text>
  <text x="60" y="376" font-size="10.5" fill="#555">• COUNT(b.player_id) 非NULL = 留存数，COUNT(a.player_id) = 总数，相除即比率</text>
  <text x="60" y="394" font-size="10.5" fill="#b85450">⚠️ 必用 LEFT JOIN：INNER JOIN 会丢未留存玩家，分母塌缩、比率恒为 1</text>
</svg>
