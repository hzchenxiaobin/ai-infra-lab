<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单栈遍历 + ')' 归约</text>

  <!-- Start -->
  <rect x="210" y="40" width="140" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始：stack=[]</text>
  <path d="M 280 68 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Read char -->
  <rect x="215" y="86" width="130" height="26" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#333">取字符 c = s[i++]</text>
  <path d="M 280 112 L 280 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,128 350,166 280,204 210,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c 的类型？</text>
  <text x="280" y="180" text-anchor="middle" font-size="9" fill="#888">t/f | 算子或( | , | )</text>

  <!-- fan-out arrows to 4 boxes -->
  <path d="M 240 186 C 190 206, 110 210, 75 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 262 198 C 250 208, 220 212, 207 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 198 C 310 208, 332 212, 345 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 186 C 370 206, 450 210, 485 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 1: t / f -->
  <rect x="15" y="218" width="120" height="76" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">'t' / 'f'</text>
  <line x1="25" y1="246" x2="125" y2="246" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="266" text-anchor="middle" font-size="10" fill="#333">push(c)</text>
  <text x="75" y="284" text-anchor="middle" font-size="9" fill="#888">原子值入栈</text>

  <!-- Box 2: ! & | ( -->
  <rect x="145" y="218" width="125" height="76" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">! &amp; | (</text>
  <line x1="155" y1="246" x2="260" y2="246" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="207" y="266" text-anchor="middle" font-size="10" fill="#333">push(c)</text>
  <text x="207" y="284" text-anchor="middle" font-size="9" fill="#888">算子/括号入栈</text>

  <!-- Box 3: , -->
  <rect x="280" y="218" width="100" height="76" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="238" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">','</text>
  <line x1="290" y1="246" x2="370" y2="246" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="#333">跳过</text>
  <text x="330" y="284" text-anchor="middle" font-size="9" fill="#888">分隔符无操作</text>

  <!-- Box 4: ) reduce -->
  <rect x="390" y="218" width="155" height="76" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">')' 归约</text>
  <line x1="400" y1="246" x2="535" y2="246" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="467" y="262" text-anchor="middle" font-size="9" fill="#333">弹出值至'(' → 取算子</text>
  <text x="467" y="276" text-anchor="middle" font-size="9" fill="#333">!取反 / &amp;全真 / |任真</text>
  <text x="467" y="290" text-anchor="middle" font-size="9" fill="#b85450">→ push 结果</text>

  <!-- converge arrows down -->
  <path d="M 75 294 L 75 318 L 280 318" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 207 294 L 207 318" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 330 294 L 330 318" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 467 294 L 467 318 L 280 318" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 318 L 280 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="280,334 340,360 280,386 220,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>

  <!-- yes: loop back -->
  <path d="M 340 360 L 540 360 L 540 99 L 347 99" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(90 552 230)">是 → 取下一字符</text>

  <!-- no: return -->
  <path d="M 280 386 L 280 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="402" width="160" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否 → 返回 top()=='t'</text>
</svg>
