<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序后，空闲日只藏在会议段之间的「空隙」里</text>

  <text x="32" y="54" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">原始顺序（乱序，空隙淹没在交错里）</text>

  <text x="62" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="106" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="150" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="194" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="238" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="282" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="326" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="370" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="414" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">9</text>
  <text x="458" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">10</text>

  <rect x="216" y="76" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="92" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[5,7]</text>

  <rect x="40" y="106" width="132" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="122" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[1,3]</text>

  <rect x="392" y="136" width="88" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="436" y="152" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[9,10]</text>

  <path d="M 260 168 L 260 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="186" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">按左端点排序</text>

  <text x="32" y="222" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">排序后：空隙全部浮出（同一段内 cur_end 一路取 max）</text>

  <text x="62" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="106" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="150" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="194" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="238" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="282" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="326" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="370" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="414" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">9</text>
  <text x="458" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">10</text>

  <rect x="40" y="246" width="132" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="267" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[1,3]</text>

  <rect x="172" y="246" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="194" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">闲</text>

  <rect x="216" y="246" width="132" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="267" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[5,7]</text>

  <rect x="348" y="246" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="370" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">闲</text>

  <rect x="392" y="246" width="88" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="436" y="267" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[9,10]</text>

  <path d="M 194 282 L 194 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="194" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">空隙 = 5−3−1 = 1</text>

  <path d="M 370 282 L 370 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="370" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">空隙 = 9−7−1 = 1</text>

  <rect x="32" y="330" width="140" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="102" y="352" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">头部空隙</text>
  <text x="102" y="372" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s₁ − 1</text>

  <rect x="188" y="330" width="180" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="278" y="352" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">中间空隙（s &gt; cur_end 时）</text>
  <text x="278" y="372" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">s − cur_end − 1</text>

  <rect x="384" y="330" width="104" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="436" y="352" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">尾部空隙</text>
  <text x="436" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">days − cur_end</text>

  <rect x="32" y="398" width="456" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 头部 + Σ中间 + 尾部（本例头部、尾部恰好为 0）</text>
  <text x="260" y="436" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">重叠/包含不产生空隙，由 cur_end = max(cur_end, e) 吸收</text>
</svg>
