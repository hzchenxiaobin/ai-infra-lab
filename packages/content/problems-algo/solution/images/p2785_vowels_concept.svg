<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">元音排序：取出元音 → 按 ASCII 排序 → 放回原位置</text>

  <!-- ===== input row: l E e t c O d e ===== -->
  <text x="44" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 s =</text>
  <!-- 8 boxes, w=40, step=44, start x=104 -->
  <!-- l consonant -->
  <rect x="104" y="78" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="105" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">l</text>
  <!-- E vowel -->
  <rect x="148" y="78" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="105" text-anchor="middle" font-size="16" fill="#b8741a" font-weight="bold" filter="url(#rough2)">E</text>
  <!-- e vowel -->
  <rect x="192" y="78" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="105" text-anchor="middle" font-size="16" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>
  <!-- t consonant -->
  <rect x="236" y="78" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="105" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">t</text>
  <!-- c consonant -->
  <rect x="280" y="78" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="105" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">c</text>
  <!-- O vowel -->
  <rect x="324" y="78" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="105" text-anchor="middle" font-size="16" fill="#b8741a" font-weight="bold" filter="url(#rough2)">O</text>
  <!-- d consonant -->
  <rect x="368" y="78" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="105" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <!-- e vowel -->
  <rect x="412" y="78" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="105" text-anchor="middle" font-size="16" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- index labels -->
  <text x="124" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="168" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="212" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="256" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="300" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="344" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="388" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="432" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <!-- legend -->
  <rect x="466" y="80" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="486" y="92" font-size="10" fill="#b8741a" filter="url(#rough2)">元音</text>
  <rect x="466" y="100" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="486" y="112" font-size="10" fill="#446688" filter="url(#rough2)">辅音</text>

  <!-- arrows from vowel positions down to extracted row -->
  <path d="M 168 124 L 168 150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 212 124 L 200 150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 344 124 L 232 150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 432 124 L 264 150" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- ===== extracted vowels (original order): E e O e ===== -->
  <text x="44" y="164" font-size="11" fill="#b8741a" font-weight="bold" filter="url(#rough2)">取出元音</text>
  <rect x="168" y="156" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="180" text-anchor="middle" font-size="14" fill="#b8741a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="200" y="156" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="180" text-anchor="middle" font-size="14" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="232" y="156" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="180" text-anchor="middle" font-size="14" fill="#b8741a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="264" y="156" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="14" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- ASCII values under extracted -->
  <text x="184" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">69</text>
  <text x="216" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">101</text>
  <text x="248" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">79</text>
  <text x="280" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">101</text>

  <!-- sort arrow -->
  <path d="M 308 174 L 372 174" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">按 ASCII 排序</text>

  <!-- ===== sorted vowels: E O e e ===== -->
  <rect x="388" y="156" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="420" y="156" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="452" y="156" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="484" y="156" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="404" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">69</text>
  <text x="436" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">79</text>
  <text x="468" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">101</text>
  <text x="500" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">101</text>

  <!-- place back arrows -->
  <path d="M 404 196 L 168 240" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 436 196 L 212 240" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 468 196 L 344 240" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 500 196 L 432 240" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">放回元音位置，辅音不动</text>

  <!-- ===== output row: l E O t c e d e ===== -->
  <text x="44" y="262" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 t =</text>
  <rect x="104" y="246" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="273" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">l</text>
  <rect x="148" y="246" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="273" text-anchor="middle" font-size="16" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="192" y="246" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="273" text-anchor="middle" font-size="16" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="236" y="246" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="273" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">t</text>
  <rect x="280" y="246" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="273" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">c</text>
  <rect x="324" y="246" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="273" text-anchor="middle" font-size="16" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="368" y="246" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="273" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">d</text>
  <rect x="412" y="246" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="273" text-anchor="middle" font-size="16" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- brackets showing consonants unchanged -->
  <path d="M 102 300 L 102 312 L 148 312" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="125" y="326" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">辅音原位</text>
  <path d="M 236 312 L 320 312 L 320 300" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="278" y="326" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">辅音原位</text>
  <path d="M 368 312 L 414 312 L 414 300" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="391" y="326" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">辅音原位</text>

  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">E(69) &lt; O(79) &lt; e(101) = e(101)，非递减 ✓</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">元音按 ASCII 非递减 = 大写在前（65~90），小写在后（97~122）</text>
</svg>
