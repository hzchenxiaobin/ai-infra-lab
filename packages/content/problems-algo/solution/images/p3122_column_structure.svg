<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：纵向相等可传递 → 每列全等；横向互异 → 相邻列值不同</text>

  <!-- left grid: original -->
  <text x="56" y="54" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">原始 grid：两方向都违规</text>

  <rect x="56" y="64" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="64" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="64" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="174" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="56" y="106" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="104" y="106" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="152" y="106" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="174" y="131" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <!-- violation marks -->
  <rect x="52" y="60" width="52" height="88" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="56" y="168" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 纵向：第 0 列 1 ≠ 0，须相等</text>
  <text x="56" y="186" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 横向：第 0 行 1 = 1，须不等</text>

  <!-- middle arrow -->
  <path d="M 212 106 L 286 106" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="249" y="92" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">每列统一成一个值</text>

  <!-- right grid: final -->
  <text x="300" y="54" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">改造后：全合规 ✓</text>

  <rect x="300" y="64" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="89" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="348" y="64" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="89" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="396" y="64" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="418" y="89" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="300" y="106" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="131" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="348" y="106" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="131" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="396" y="106" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="418" y="131" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- column value labels -->
  <text x="322" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c₀=1</text>
  <text x="346" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="370" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c₁=0</text>
  <text x="394" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="418" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c₂=1</text>

  <text x="300" y="186" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 同列上下全等</text>
  <text x="300" y="204" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 相邻列互异（1 ≠ 0 ≠ 1）</text>

  <!-- summary box -->
  <rect x="48" y="232" width="424" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">最终形态 ⇔ 列值序列 c₀, c₁, …（只需相邻互异）</text>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">m×n 矩阵问题 → n 个列值的一维序列问题</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 j 列代价 = 该列不等于 c_j 的格子数 = m − cnt_j(c_j)</text>
</svg>
