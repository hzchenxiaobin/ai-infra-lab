<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：警卫沿四方向射线传播，遇墙 W 或警卫 G 即停</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">已保卫格子（浅绿）不挡视线，射线可穿过继续延伸</text>

  <!-- ===== 5x5 grid, cell=46, origin (96,86) ===== -->
  <!-- column index labels -->
  <text x="119" y="78" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="165" y="78" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="211" y="78" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="257" y="78" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="303" y="78" text-anchor="middle" font-size="9" fill="#888">4</text>
  <!-- row index labels -->
  <text x="84" y="119" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="84" y="165" text-anchor="end" font-size="9" fill="#888">1</text>
  <text x="84" y="211" text-anchor="end" font-size="9" fill="#888">2</text>
  <text x="84" y="257" text-anchor="end" font-size="9" fill="#888">3</text>
  <text x="84" y="303" text-anchor="end" font-size="9" fill="#888">4</text>

  <!-- empty cells (light) -->
  <rect x="96"  y="86"  width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="86"  width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="86"  width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96"  y="132" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="132" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="132" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="132" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96"  y="178" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="178" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96"  y="224" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="224" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="224" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="224" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96"  y="270" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="270" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="270" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="284" y="270" width="46" height="46" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- guarded cells (light green) crossed by rays -->
  <rect x="188" y="86"  width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="132" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96"  y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="224" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="270" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- blockers: wall at (2,4) and guard at (0,2) -->
  <rect x="284" y="178" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="207" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">W</text>
  <rect x="188" y="86"  width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="115" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">G</text>

  <!-- center guard at (2,2) -->
  <rect x="188" y="178" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="207" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">G</text>

  <!-- sight rays (red dashed) from center guard -->
  <!-- up: stop at guard (0,2) bottom edge y=132 -->
  <line x1="211" y1="178" x2="211" y2="138" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- down: to (4,2) bottom edge y=316 -->
  <line x1="211" y1="224" x2="211" y2="312" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- left: to (2,0) left edge x=96 -->
  <line x1="188" y1="201" x2="100" y2="201" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- right: stop at wall (2,4) left edge x=284 -->
  <line x1="234" y1="201" x2="282" y2="201" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- annotations on the right -->
  <rect x="360" y="86" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="103" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">向上射线</text>
  <text x="445" y="118" text-anchor="middle" font-size="9.5" fill="#666">遇另一警卫 G → 停止</text>

  <rect x="360" y="134" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">向右射线</text>
  <text x="445" y="166" text-anchor="middle" font-size="9.5" fill="#666">遇墙 W → 停止</text>

  <rect x="360" y="182" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">向左 / 向下射线</text>
  <text x="445" y="214" text-anchor="middle" font-size="9.5" fill="#666">直抵边界，沿途标记保卫</text>

  <rect x="360" y="230" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="247" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">已保卫格子不挡视线</text>
  <text x="445" y="262" text-anchor="middle" font-size="9.5" fill="#666">射线穿过浅绿格继续延伸</text>

  <!-- footer -->
  <rect x="40" y="338" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="359" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">只有「墙」和「警卫」会阻挡视线，「已保卫」的空格不阻挡——这是状态编码的关键</text>
</svg>
