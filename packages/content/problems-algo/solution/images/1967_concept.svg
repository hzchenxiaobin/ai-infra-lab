<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个 pattern 独立做子串查找，命中即计数</text>

  <!-- ===== word display ===== -->
  <text x="40" y="66" font-size="11" fill="#888">word =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="46" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="108" y="66">a</text>
    <rect x="126" y="46" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="144" y="66">b</text>
    <rect x="162" y="46" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="66">c</text>
  </g>
  <text x="108" y="90" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="144" y="90" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="180" y="90" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- Divider -->
  <path d="M 40 104 L 520 104" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="124" font-size="11.5" fill="#555" font-weight="bold">逐 pattern 判定（示例 1）：</text>

  <!-- ===== Row 1: pattern "a" ===== -->
  <rect x="40" y="138" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="157" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">"a"</text>
  <rect x="130" y="138" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="158" y="138" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="157" text-anchor="middle" font-size="12" fill="#999">b</text>
  <rect x="186" y="138" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="12" fill="#999">c</text>
  <text x="244" y="157" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中 word[0:1]</text>

  <!-- ===== Row 2: pattern "abc" ===== -->
  <rect x="40" y="180" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">"abc"</text>
  <rect x="130" y="180" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="158" y="180" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="186" y="180" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="244" y="199" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中 word[0:3]</text>

  <!-- ===== Row 3: pattern "bc" ===== -->
  <rect x="40" y="222" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="241" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">"bc"</text>
  <rect x="130" y="222" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="241" text-anchor="middle" font-size="12" fill="#999">a</text>
  <rect x="158" y="222" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="186" y="222" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="244" y="241" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中 word[1:3]</text>

  <!-- ===== Row 4: pattern "d" ===== -->
  <rect x="40" y="264" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="283" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">"d"</text>
  <rect x="130" y="264" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="283" text-anchor="middle" font-size="12" fill="#999">a</text>
  <rect x="158" y="264" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="283" text-anchor="middle" font-size="12" fill="#999">b</text>
  <rect x="186" y="264" width="28" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="283" text-anchor="middle" font-size="12" fill="#999">c</text>
  <text x="244" y="283" font-size="11.5" fill="#b85450" font-weight="bold">✗ 未命中</text>

  <!-- ===== Result box ===== -->
  <rect x="40" y="312" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="333" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">命中 3 个 → return 3</text>

  <!-- ===== Notes ===== -->
  <text x="40" y="370" font-size="11" fill="#888">要点：每个 pattern 独立判定，互不影响；相同 pattern 各自计数（示例 3）</text>
  <text x="40" y="390" font-size="11" fill="#888">子串 = 连续字符序列；用内置 find/in 即可，无需手写 KMP</text>
</svg>
