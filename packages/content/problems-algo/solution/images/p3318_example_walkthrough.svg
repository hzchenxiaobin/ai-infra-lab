<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,1,2,2,3,4,2,3]，k = 6，x = 2</text>

  <!-- 数组条 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="68" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="96" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="124" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="152" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="180" y="26" width="28" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="208" y="26" width="28" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="236" y="26" width="28" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="54" y="42" filter="url(#rough2)">1</text>
    <text x="82" y="42" filter="url(#rough2)">1</text>
    <text x="110" y="42" filter="url(#rough2)">2</text>
    <text x="138" y="42" filter="url(#rough2)">2</text>
    <text x="166" y="42" filter="url(#rough2)">3</text>
    <text x="194" y="42" filter="url(#rough2)">4</text>
    <text x="222" y="42" fill="#888" filter="url(#rough2)">2</text>
    <text x="250" y="42" fill="#888" filter="url(#rough2)">3</text>
  </g>
  <!-- 三个窗口覆盖条 -->
  <rect x="40" y="54" width="168" height="6" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="218" y="61" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">win 0</text>
  <rect x="68" y="62" width="168" height="6" fill="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="246" y="69" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">win 1</text>
  <rect x="96" y="70" width="168" height="6" fill="#d6a040" rx="3" filter="url(#rough2)"/>
  <text x="274" y="77" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">win 2</text>

  <!-- 表头 -->
  <g font-size="9.5" fill="#33506b" font-weight="bold" text-anchor="middle">
    <rect x="26" y="84" width="94" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="73" y="98" filter="url(#rough2)">窗口</text>
    <rect x="124" y="84" width="108" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="178" y="98" filter="url(#rough2)">频次表</text>
    <rect x="236" y="84" width="142" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="307" y="98" filter="url(#rough2)">候选（字典序降序）</text>
    <rect x="382" y="84" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="405" y="98" filter="url(#rough2)">top-2</text>
    <rect x="432" y="84" width="62" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="463" y="98" filter="url(#rough2)">x-sum</text>
  </g>

  <!-- 行 1 -->
  <rect x="26" y="106" width="468" height="52" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="128" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[1,1,2,2,3,4]</text>
  <text x="73" y="144" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">win 0</text>
  <g font-size="9.5" text-anchor="middle" fill="#7a5a20">
    <text x="151" y="128" filter="url(#rough2)">1:2&#160;&#160;2:2</text>
    <text x="178" y="146" filter="url(#rough2)">3:1&#160;&#160;4:1</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="286" y="128" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(2,2)&#160;&#160;(2,1)</text>
    <text x="286" y="146" fill="#aaa" filter="url(#rough2)">(1,4)&#160;&#160;(1,3)</text>
  </g>
  <text x="405" y="137" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2, 1</text>
  <rect x="432" y="120" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="463" y="137" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 行 2 -->
  <rect x="26" y="160" width="468" height="52" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[1,2,2,3,4,2]</text>
  <text x="73" y="198" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">win 1</text>
  <g font-size="9.5" text-anchor="middle" fill="#7a5a20">
    <text x="151" y="182" filter="url(#rough2)">1:1&#160;&#160;2:3</text>
    <text x="178" y="200" filter="url(#rough2)">3:1&#160;&#160;4:1</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="286" y="182" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3,2)&#160;&#160;(1,4)</text>
    <text x="286" y="200" fill="#aaa" filter="url(#rough2)">(1,3)&#160;&#160;(1,1)</text>
  </g>
  <ellipse cx="334" cy="178" rx="26" ry="13" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 170 L 384 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="428" y="152" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">平局 4 ＞ 3, 1</text>
  <text x="405" y="191" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2, 4</text>
  <rect x="432" y="174" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="463" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- 行 3 -->
  <rect x="26" y="214" width="468" height="52" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="236" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[2,2,3,4,2,3]</text>
  <text x="73" y="252" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">win 2</text>
  <g font-size="9.5" text-anchor="middle" fill="#7a5a20">
    <text x="151" y="236" filter="url(#rough2)">2:3&#160;&#160;3:2</text>
    <text x="178" y="254" filter="url(#rough2)">4:1</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="286" y="236" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3,2)&#160;&#160;(2,3)</text>
    <text x="286" y="254" fill="#aaa" filter="url(#rough2)">(1,4)</text>
  </g>
  <ellipse cx="334" cy="232" rx="26" ry="13" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 224 L 384 210" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="424" y="206" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">3 升 2 次挤掉 4</text>
  <text x="405" y="245" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2, 3</text>
  <rect x="432" y="228" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="463" y="245" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>

  <!-- 底部读数说明 -->
  <rect x="26" y="272" width="468" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">读数要点</text>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">① 平局看数值：win 1 中 4、3、1 同为 1 次，数值最大的 4 搭上 top-2 末班车</text>
  <text x="260" y="327" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">② 排名会流动：win 2 移入两个 3，频次 1→2 反超 4，top-2 换血</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer = [6, 10, 12] ✓（win 0 频次同为 2 时 2 ＞ 1，前两名恰是 2 和 1）</text>
</svg>
