<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">最小堆维护前 K 高频元素（k = 2）</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：频率统计 -->
  <text x="60" y="100" font-size="14" font-weight="bold" fill="#2b2b2b">① 频率统计</text>
  <g filter="url(#sk)">
    <rect x="60" y="112" width="100" height="34" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="160" y="112" width="80" height="34" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="60" y="146" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="160" y="146" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="60" y="180" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="160" y="180" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="60" y="214" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="160" y="214" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="110" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">元素</text>
  <text x="200" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">频率</text>
  <text x="110" y="167" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="200" y="167" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="110" y="201" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="200" y="201" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="110" y="235" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="200" y="235" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- 中间箭头 -->
  <path d="M 270 180 L 360 180" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="315" y="170" text-anchor="middle" font-size="11" fill="#666">依次入堆</text>

  <!-- 右：最小堆树形 -->
  <text x="640" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">② 大小为 k 的最小堆</text>

  <!-- 堆顶节点（强调） -->
  <g filter="url(#sk)">
    <ellipse cx="640" cy="160" rx="58" ry="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="640" y="156" text-anchor="middle" font-size="12" fill="#b85450">堆顶</text>
  <text x="640" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">(2, 元素2)</text>

  <!-- 子节点 -->
  <path d="M 612 186 Q 560 220 520 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 668 186 Q 720 220 760 250" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="500" cy="270" rx="52" ry="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="500" y="275" text-anchor="middle" font-size="13" fill="#333">(3, 元素1)</text>
  <g filter="url(#sk)">
    <ellipse cx="760" cy="270" rx="46" ry="26" fill="#fff" stroke="#ccc" stroke-dasharray="4 3"/>
  </g>
  <text x="760" y="275" text-anchor="middle" font-size="11" fill="#999">空位</text>

  <!-- 门槛标注 -->
  <path d="M 560 150 L 400 130" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="270" y="108" width="130" height="40" rx="8" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="335" y="126" text-anchor="middle" font-size="11" fill="#b85450">堆顶 = 当前最小频率</text>
  <text x="335" y="141" text-anchor="middle" font-size="11" fill="#b85450">＝ "门槛"</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="840" height="86" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="60" y="356" font-size="13" font-weight="bold" fill="#7a5415">为什么用最小堆？</text>
  <text x="60" y="378" font-size="12" fill="#444">· 要随时淘汰堆中"频率最小的那个"——最小堆堆顶恰是最小值，O(log k) 弹出即可。</text>
  <text x="60" y="398" font-size="12" fill="#444">· 若用最大堆，须把全部元素入堆才能定 Top-K，退化成 O(n log n) 排序。</text>

  <!-- 元素3 被淘汰标注 -->
  <path d="M 200 231 Q 350 300 455 285" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#999">元素3 频率=1 &lt; 门槛 2，入堆即被弹出</text>
</svg>
