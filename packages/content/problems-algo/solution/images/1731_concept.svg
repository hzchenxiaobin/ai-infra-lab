<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：自连接 Employees ⋈ Employees（经理 ↔ 下属）</text>
  <path d="M 180 36 Q 380 44 580 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: Employees as manager (e) ===== -->
  <text x="40" y="64" font-size="11" fill="#888">① 经理视角 e（employee_id 作主键）</text>
  <g filter="url(#rough2)"><rect x="30" y="70" width="220" height="200" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="140" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Employees e（经理表）</text>
  <line x1="30" y1="94" x2="250" y2="94" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="48" y="108" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="118" y="108" font-size="9" fill="#888" font-weight="bold">name</text>
  <text x="190" y="108" font-size="9" fill="#888" font-weight="bold">reports_to</text>
  <line x1="100" y1="96" x2="100" y2="270" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="96" x2="170" y2="270" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="52" y="126" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="110" y="126" font-size="10" fill="#4a8edb">Michael</text>
  <text x="196" y="126" font-size="10" fill="#aaa">null</text>

  <text x="52" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="110" y="146" font-size="10" fill="#4a7a3a">Alice</text>
  <text x="196" y="146" font-size="10" fill="#4a8edb">1</text>

  <text x="52" y="166" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="110" y="166" font-size="10" fill="#b85450">Bob</text>
  <text x="196" y="166" font-size="10" fill="#4a8edb">1</text>

  <text x="52" y="186" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="110" y="186" font-size="10" fill="#888">Charlie</text>
  <text x="196" y="186" font-size="10" fill="#4a7a3a">2</text>

  <text x="52" y="206" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="110" y="206" font-size="10" fill="#888">David</text>
  <text x="196" y="206" font-size="10" fill="#4a7a3a">2</text>

  <text x="52" y="226" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="110" y="226" font-size="10" fill="#888">Eve</text>
  <text x="196" y="226" font-size="10" fill="#b85450">3</text>

  <text x="52" y="246" font-size="10" fill="#aaa" font-weight="bold">7</text>
  <text x="110" y="246" font-size="10" fill="#aaa">Frank</text>
  <text x="196" y="246" font-size="10" fill="#aaa">null</text>

  <text x="52" y="264" font-size="10" fill="#aaa" font-weight="bold">8</text>
  <text x="110" y="264" font-size="10" fill="#aaa">Grace</text>
  <text x="196" y="264" font-size="10" fill="#aaa">null</text>

  <!-- ===== Middle: self-join condition ===== -->
  <text x="300" y="64" text-size="11" font-size="11" fill="#888">② JOIN ON e.employee_id = s.reports_to</text>
  <g filter="url(#rough2)"><rect x="284" y="86" width="190" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="379" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">自连接配对</text>
  <text x="379" y="124" text-anchor="middle" font-size="9" fill="#888">下属的 reports_to</text>
  <text x="379" y="138" text-anchor="middle" font-size="9" fill="#888">＝ 经理的 employee_id</text>

  <!-- pairing lines (color-coded) -->
  <text x="300" y="162" font-size="10" fill="#4a8edb" font-weight="bold">e1 ← s2, s3</text>
  <text x="300" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">e2 ← s4, s5</text>
  <text x="300" y="198" font-size="10" fill="#b85450" font-weight="bold">e3 ← s6</text>
  <text x="300" y="220" font-size="9" fill="#888">null reports_to 不配对</text>
  <text x="300" y="234" font-size="9" fill="#888">→ e1/e2/e3 才是经理</text>

  <!-- Arrow from left table to join box -->
  <path d="M 252 150 L 282 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Arrow from join box to right result -->
  <path d="M 476 166 L 510 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: grouped result ===== -->
  <text x="520" y="64" font-size="11" fill="#888">③ GROUP BY e.emp_id + COUNT/AVG</text>
  <g filter="url(#rough2)"><rect x="514" y="80" width="226" height="190" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="627" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果表（经理维度）</text>
  <line x1="514" y1="104" x2="740" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="528" y="118" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="576" y="118" font-size="9" fill="#888" font-weight="bold">name</text>
  <text x="640" y="118" font-size="9" fill="#888" font-weight="bold">count</text>
  <text x="696" y="118" font-size="9" fill="#888" font-weight="bold">avg_age</text>

  <text x="532" y="138" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="576" y="138" font-size="10" fill="#4a8edb">Michael</text>
  <text x="644" y="138" font-size="10" fill="#4a8edb">2</text>
  <text x="700" y="138" font-size="10" fill="#4a8edb">40</text>

  <text x="532" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="576" y="158" font-size="10" fill="#4a7a3a">Alice</text>
  <text x="644" y="158" font-size="10" fill="#4a7a3a">2</text>
  <text x="700" y="158" font-size="10" fill="#4a7a3a">37</text>

  <text x="532" y="178" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="576" y="178" font-size="10" fill="#b85450">Bob</text>
  <text x="644" y="178" font-size="10" fill="#b85450">1</text>
  <text x="700" y="178" font-size="10" fill="#b85450">37</text>

  <text x="627" y="210" text-anchor="middle" font-size="9" fill="#888">ORDER BY emp_id 升序</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="300" width="680" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="324" font-size="12" fill="#a06a10" font-weight="bold">⭐ 同一张表扮演两个角色：e 当经理（按 employee_id 分组）、s 当下属（按 reports_to 配对）</text>
  <text x="60" y="346" font-size="11" fill="#a06a10">JOIN 条件 e.employee_id = s.reports_to 把「下属行」挂到「经理行」上；</text>
  <text x="60" y="366" font-size="11" fill="#a06a10">reports_to 为 null 的行（Frank/Grace）配对失败被过滤 → 天然不出现在结果里。</text>
  <text x="60" y="386" font-size="11" fill="#a06a10">内连接 = 自动排除「无下属者」，等价于「至少有一人汇报」的经理判定。</text>
</svg>
