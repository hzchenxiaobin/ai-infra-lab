<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">状态携带最近两列高度：决定 c = h[i+1] 时才结算第 i 列</text>

  <!-- 三列示意 y=44..110 -->
  <!-- 列 i-1 -->
  <rect x="60" y="44" width="80" height="66" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="44" width="80" height="42" fill="#446688" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="100" y="70" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">黑 b 格</text>
  <text x="100" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h[i−1] = b</text>

  <!-- 列 i（结算列，橙色高亮） -->
  <rect x="185" y="38" width="90" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="44" width="90" height="26" fill="#446688" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="#dce6f2" filter="url(#rough2)">黑 a 格</text>
  <text x="230" y="90" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">★ 本列被结算</text>
  <text x="230" y="132" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">h[i] = a</text>

  <!-- 列 i+1（虚线待定） -->
  <rect x="320" y="44" width="80" height="66" fill="#ffffff" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="44" width="80" height="34" fill="#8a97a8" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="360" y="66" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">黑 c?</text>
  <text x="360" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h[i+1] = c（待定）</text>

  <!-- 邻居依赖箭头 -->
  <path d="M 143 77 L 181 77" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="68" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">左邻居</text>
  <path d="M 317 77 L 279 77" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="298" y="68" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">右邻居</text>

  <!-- 转移条 -->
  <rect x="40" y="148" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i][a][b]</text>

  <path d="M 172 164 L 340 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">枚举 c = h[i+1]</text>

  <rect x="346" y="148" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="416" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i+1][c][a]</text>

  <text x="256" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">加项 = max(0, P[i][max(b,c)] − P[i][a])　（第 i 列的贡献）</text>

  <!-- 拆分两框 -->
  <rect x="24" y="212" width="232" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b ≤ c ⇒ max(b,c) = c（加项与 b 无关）</text>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pref(c) = max_{b≤c} dp[a][b]（前缀 max）</text>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">候选₁ = pref(c) + max(0, P[i][c] − P[i][a])</text>
  <text x="140" y="294" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">枚举 b 被前缀 max 一次性摊销</text>

  <rect x="264" y="212" width="232" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">b &gt; c ⇒ max(b,c) = b（加项与 c 无关）</text>
  <text x="380" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">val(b) = dp[a][b] + max(0, P[i][b] − P[i][a])</text>
  <text x="380" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">候选₂ = suf(c) = max_{b&gt;c} val(b)（后缀 max）</text>
  <text x="380" y="294" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">扫一遍 b 服务所有 c 的查询</text>

  <!-- 收尾 -->
  <rect x="90" y="326" width="340" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[i+1][c][a] = max(候选₁, 候选₂)：O(n⁴) → O(n³)</text>
</svg>
