<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 + 枚举四种删除策略</text>

  <!-- Step 1: sort -->
  <rect x="170" y="48" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#333">对 nums 升序排序</text>
  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: decision n <= 4? -->
  <polygon points="260,112 360,152 260,192 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#333">n ≤ 4 ?</text>
  <text x="260" y="164" text-anchor="middle" font-size="10" fill="#888">元素不超过 4 个</text>

  <!-- Yes branch: return 0 -->
  <text x="372" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 152 L 400 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="134" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 0</text>

  <!-- No branch -->
  <text x="248" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 260 192 L 260 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: compute 4 diffs -->
  <rect x="70" y="214" width="380" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">枚举 i = 0, 1, 2, 3，计算四种差值</text>

  <!-- 4 diff formulas -->
  <g font-size="11" fill="#333">
    <rect x="90" y="248" width="160" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="170" y="264" text-anchor="middle">i=0: nums[n−4]−nums[0]</text>
    <rect x="270" y="248" width="160" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="350" y="264" text-anchor="middle">i=1: nums[n−3]−nums[1]</text>
    <rect x="90" y="280" width="160" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="170" y="296" text-anchor="middle">i=2: nums[n−2]−nums[2]</text>
    <rect x="270" y="280" width="160" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="350" y="296" text-anchor="middle">i=3: nums[n−1]−nums[3]</text>
  </g>

  <path d="M 260 318 L 260 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return min -->
  <rect x="140" y="340" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return 四个差值的最小值</text>

  <!-- side annotation -->
  <rect x="392" y="340" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="360" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">关键洞察</text>
  <text x="450" y="376" text-anchor="middle" font-size="9" fill="#666">改值=删除</text>
  <text x="450" y="388" text-anchor="middle" font-size="9" fill="#666">只动两端 3 个</text>
</svg>
