<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：score 数组逐步演化</text>

  <!-- ========= Example 2 ========= -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：n=3, trust=[[1,3],[2,3]] → 返回 3</text>

  <!-- index labels -->
  <text x="200" y="76" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="240" y="76" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="290" y="76" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="340" y="76" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- Step 0: initial -->
  <text x="150" y="98" text-anchor="end" font-size="10.5" fill="#333">初始</text>
  <rect x="220" y="84" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="270" y="84" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="84" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="103" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- arrow down -->
  <line x1="280" y1="114" x2="280" y2="124" stroke="#888" stroke-width="1.4" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="370" y="122" font-size="10" fill="#b85450">[1,3]: 1−−, 3++</text>

  <!-- Step 1: after [1,3] -->
  <text x="150" y="138" text-anchor="end" font-size="10.5" fill="#333">① [1,3]</text>
  <rect x="220" y="124" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="270" y="124" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="143" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="124" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="280" y1="154" x2="280" y2="164" stroke="#888" stroke-width="1.4" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="370" y="162" font-size="10" fill="#b85450">[2,3]: 2−−, 3++</text>

  <!-- Step 2: after [2,3] -->
  <text x="150" y="178" text-anchor="end" font-size="10.5" fill="#333">② [2,3]</text>
  <rect x="220" y="164" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="270" y="164" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="320" y="164" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- result for example 2 -->
  <rect x="400" y="164" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="184" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">score[3]=2=n−1 ✓</text>
  <text x="470" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 3</text>

  <!-- divider -->
  <line x1="40" y1="222" x2="520" y2="222" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ========= Example 3 ========= -->
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 3：n=3, trust=[[1,3],[2,3],[3,1]] → 返回 −1</text>

  <text x="200" y="268" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="240" y="268" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- Step 0 -->
  <text x="150" y="290" text-anchor="end" font-size="10.5" fill="#333">初始</text>
  <rect x="220" y="276" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="294" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="270" y="276" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="276" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="294" text-anchor="middle" font-size="11" fill="#333">0</text>

  <line x1="280" y1="304" x2="280" y2="314" stroke="#888" stroke-width="1.4" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="380" y="312" font-size="10" fill="#b85450">[1,3]</text>

  <!-- Step 1 -->
  <text x="150" y="330" text-anchor="end" font-size="10.5" fill="#333">① [1,3]</text>
  <rect x="220" y="316" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="270" y="316" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="316" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="280" y1="344" x2="280" y2="354" stroke="#888" stroke-width="1.4" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="380" y="352" font-size="10" fill="#b85450">[2,3]</text>

  <!-- Step 2 -->
  <text x="150" y="370" text-anchor="end" font-size="10.5" fill="#333">② [2,3]</text>
  <rect x="220" y="356" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="270" y="356" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="320" y="356" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="374" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <line x1="280" y1="384" x2="280" y2="394" stroke="#888" stroke-width="1.4" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="380" y="392" font-size="10" fill="#b85450">[3,1]: 3−−, 1++ ⚠</text>

  <!-- Step 3 -->
  <text x="150" y="410" text-anchor="end" font-size="10.5" fill="#333">③ [3,1]</text>
  <rect x="220" y="396" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="270" y="396" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="320" y="396" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- result for example 3 -->
  <rect x="400" y="396" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无人 = n−1 ✗ 返回 −1</text>
</svg>
