<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针算法流程（贪心匹配）</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: i = 0, j = 0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i < |s| 且 j < |t| ? -->
  <polygon points="270,104 400,150 270,196 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#333">i &lt; |s| 且</text>
  <text x="270" y="160" text-anchor="middle" font-size="12" fill="#333">j &lt; |t| ?</text>

  <!-- No branch -> return i == |s| -->
  <path d="M 400 150 L 460 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="492" cy="150" rx="44" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="146" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="492" y="160" text-anchor="middle" font-size="11" fill="#333">i == |s|</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: s[i] == t[j] ? -->
  <polygon points="270,218 390,270 270,322 150,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#333">s[i] == t[j] ?</text>

  <!-- Yes (match) -> left: i++, j++ -->
  <path d="M 150 270 L 100 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="262" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="20" y="250" width="78" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="59" y="268" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">匹配成功</text>
  <text x="59" y="284" text-anchor="middle" font-size="10" fill="#555">i++, j++</text>

  <!-- No (no match) -> right: j++ -->
  <path d="M 390 270 L 440 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="262" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="442" y="250" width="78" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="481" y="268" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">跳过 t[j]</text>
  <text x="481" y="284" text-anchor="middle" font-size="10" fill="#555">j++</text>

  <!-- loop back arrows -->
  <path d="M 59 292 L 59 372 L 270 372 L 270 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 481 292 L 481 372 L 270 372" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#888">继续循环</text>

  <!-- summary -->
  <text x="270" y="420" text-anchor="middle" font-size="11" fill="#888">i、j 各最多走 |t| 步，合计 O(|s| + |t|)</text>
</svg>
