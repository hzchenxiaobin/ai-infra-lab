<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：枚举分割点 + 增量维护</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="46" rx="40" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- arrow to box1 -->
  <path d="M 260 60 L 260 72" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: init -->
  <rect x="80" y="74" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="11.5" fill="#333">① totalA ← 统计 s 中 'a' 的个数；aLeft = bLeft = 0；ans = totalA</text>

  <!-- arrow to diamond1 -->
  <path d="M 260 104 L 260 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: 还有字符? -->
  <polygon points="260,120 340,150 260,180 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11.5" fill="#333">还有字符?</text>

  <!-- 否 → 返回 ans -->
  <path d="M 340 150 L 380 150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="382" y="136" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="437" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- 是 → 取字符 -->
  <path d="M 260 180 L 260 194" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="190" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="150" y="196" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11.5" fill="#333">② c ← 取下一个字符</text>

  <!-- arrow to diamond2 -->
  <path d="M 260 222 L 260 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: c == 'a'? -->
  <polygon points="260,238 330,264 260,290 190,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#333">c == 'a'?</text>

  <!-- 是 → aLeft++ (left) -->
  <path d="M 190 264 L 130 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="252" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="270" text-anchor="middle" font-size="11.5" fill="#333">aLeft += 1</text>

  <!-- 否 → bLeft++ (right) -->
  <path d="M 330 264 L 390 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="258" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="390" y="252" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="270" text-anchor="middle" font-size="11.5" fill="#333">bLeft += 1</text>

  <!-- merge arrows down to box3 -->
  <path d="M 80 278 L 80 300 L 200 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 278 L 440 300 L 320 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: update ans -->
  <rect x="70" y="306" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ aRight = totalA − aLeft</text>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = min(ans, bLeft + aRight)</text>

  <!-- loop back arrow: box3 left → up → diamond1 left -->
  <path d="M 70 323 L 30 323 L 30 150 L 180 150" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="238" font-size="10" fill="#b85450" font-weight="bold">循环</text>
</svg>
