<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 484" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="484" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：同一张图，两套消失时刻</text>

  <path d="M 114 117 L 246 72" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="82" font-size="11" fill="#446688" filter="url(#rough2)">4</text>

  <path d="M 406 117 L 274 72" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="82" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <path d="M 116 128 L 404 128" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>

  <circle cx="100" cy="128" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="133" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="420" cy="128" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="133" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="260" cy="60" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="100" y="160" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">@1</text>
  <text x="420" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">@1 / @3</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">@5</text>

  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">@t = 消失时刻；两个示例仅节点 1 的消失时刻不同</text>

  <!-- Left table: example 1 -->
  <text x="135" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例① disappear = [1,1,5]</text>

  <rect x="12" y="210" width="246" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">堆操作</text>
  <text x="162" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">闸门②</text>
  <text x="227" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">dist</text>

  <rect x="12" y="234" width="246" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pop (0,0)</text>
  <text x="162" y="251" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">起点</text>
  <text x="227" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,∞,∞]</text>

  <rect x="12" y="260" width="246" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">松弛 0→1: nd=2</text>
  <text x="162" y="277" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2&lt;1 ✗</text>
  <text x="227" y="277" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">拦下</text>

  <rect x="12" y="286" width="246" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">松弛 0→2: nd=4</text>
  <text x="162" y="303" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4&lt;5 ✓</text>
  <text x="227" y="303" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dist[2]=4</text>

  <rect x="12" y="312" width="246" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="329" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pop(4,2) 2→1:5</text>
  <text x="162" y="329" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5&lt;1 ✗</text>
  <text x="227" y="329" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">拦下</text>

  <rect x="12" y="338" width="246" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="355" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">堆空 ⇒ 输出</text>
  <text x="162" y="355" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">—</text>
  <text x="227" y="355" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">[0,−1,4]</text>

  <!-- Right table: example 2 -->
  <text x="385" y="204" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例② disappear = [1,3,5]</text>

  <rect x="262" y="210" width="246" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">堆操作</text>
  <text x="412" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">闸门②</text>
  <text x="477" y="226" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">dist</text>

  <rect x="262" y="234" width="246" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pop (0,0)</text>
  <text x="412" y="251" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">起点</text>
  <text x="477" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,∞,∞]</text>

  <rect x="262" y="260" width="246" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0→1: nd=2</text>
  <text x="412" y="277" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2&lt;3 ✓</text>
  <text x="477" y="277" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dist[1]=2</text>

  <rect x="262" y="286" width="246" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0→2: nd=4</text>
  <text x="412" y="303" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4&lt;5 ✓</text>
  <text x="477" y="303" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dist[2]=4</text>

  <rect x="262" y="312" width="246" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="329" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pop(2,1) 1→2:3</text>
  <text x="412" y="329" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3&lt;4 ✓</text>
  <text x="477" y="329" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dist[2]=3</text>

  <rect x="262" y="338" width="246" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="355" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pop(3,2) 2→1:4</text>
  <text x="412" y="355" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4&lt;3 ✗</text>
  <text x="477" y="355" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">拦下</text>

  <rect x="262" y="364" width="246" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="381" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">pop(4,2) 旧记录</text>
  <text x="412" y="381" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">懒删</text>
  <text x="477" y="381" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—</text>

  <rect x="262" y="390" width="246" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="407" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">堆空 ⇒ 输出</text>
  <text x="412" y="407" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">—</text>
  <text x="477" y="407" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">[0,2,3]</text>

  <!-- Bottom notes -->
  <rect x="12" y="428" width="496" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">示例③ 边界：到达时刻 = 消失时刻 ⇒ 不可达（nd = 1 = @1 被闸门拦下）</text>
  <text x="260" y="466" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">示例② 亮点：节点 2 绕路 0→1→2 = 3 比直连 4 更快；旧记录 (4,2) 弹出时被懒删除</text>
</svg>
