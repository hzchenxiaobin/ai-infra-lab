<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">循环队列：算法流程（count 计数版）</text>
  <path d="M 290 42 Q 450 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左列：enQueue ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="70" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="170" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">enQueue(value)</text>
  <text x="170" y="106" text-anchor="middle" font-size="10" fill="#666">入队</text>

  <!-- 判满菱形 -->
  <g filter="url(#sk)">
    <path d="M 170 130 L 270 175 L 170 220 L 70 175 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count ==</text>
  <text x="170" y="188" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">capacity？</text>
  <path d="M 170 114 L 170 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 是 -> false -->
  <text x="40" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="20" y="248" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="80" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 90 220 L 80 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否 -> 写入并推进 -->
  <text x="288" y="172" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="220" y="248" width="220" height="76" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="330" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">data[rear] = value</text>
  <text x="330" y="288" text-anchor="middle" font-size="11" fill="#333">rear = (rear + 1) % cap</text>
  <text x="330" y="306" text-anchor="middle" font-size="11" fill="#333">count += 1</text>
  <text x="330" y="318" text-anchor="middle" font-size="9" fill="#2e6e2e">写入后位置后移并取模</text>
  <path d="M 170 220 L 330 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="220" y="344" width="220" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="330" y="369" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 330 324 L 330 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 中列：deQueue ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="70" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="600" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">deQueue()</text>
  <text x="600" y="106" text-anchor="middle" font-size="10" fill="#666">出队</text>

  <g filter="url(#sk)">
    <path d="M 600 130 L 690 175 L 600 220 L 510 175 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="600" y="172" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count == 0？</text>
  <text x="600" y="188" text-anchor="middle" font-size="10" fill="#7a2828">(空队列)</text>
  <path d="M 600 114 L 600 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="480" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="470" y="248" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="530" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 555 220 L 530 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="708" y="172" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="640" y="248" width="200" height="76" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="740" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">front = (front + 1) % cap</text>
  <text x="740" y="288" text-anchor="middle" font-size="11" fill="#333">count -= 1</text>
  <text x="740" y="306" text-anchor="middle" font-size="9" fill="#7a5415">丢弃队首，游标前进</text>
  <path d="M 600 220 L 740 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="640" y="344" width="200" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="740" y="369" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 740 324 L 740 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 右列：Front / Rear / isEmpty / isFull ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="410" width="790" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="434" font-size="13" font-weight="bold" fill="#2b2b2b">查询类操作（O(1)）</text>

  <g filter="url(#sk)">
    <rect x="70" y="448" width="180" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="160" y="470" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">Front()</text>
  <text x="160" y="488" text-anchor="middle" font-size="10" fill="#444">空 → return -1</text>
  <text x="160" y="500" text-anchor="middle" font-size="10" fill="#444">否则 return data[front]</text>

  <g filter="url(#sk)">
    <rect x="270" y="448" width="200" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="370" y="470" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">Rear()</text>
  <text x="370" y="488" text-anchor="middle" font-size="10" fill="#444">空 → return -1</text>
  <text x="370" y="500" text-anchor="middle" font-size="10" fill="#444">否则 return data[(rear-1+cap)%cap]</text>

  <g filter="url(#sk)">
    <rect x="490" y="448" width="160" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="570" y="470" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">isEmpty()</text>
  <text x="570" y="488" text-anchor="middle" font-size="10" fill="#444">return count == 0</text>

  <g filter="url(#sk)">
    <rect x="670" y="448" width="160" height="56" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="750" y="470" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">isFull()</text>
  <text x="750" y="488" text-anchor="middle" font-size="10" fill="#444">return count == capacity</text>

  <text x="460" y="530" text-anchor="middle" font-size="11" fill="#7a5415">⚠ Rear 取“rear 前一位”=(rear-1+cap)%cap，加 cap 防 Python 负下标</text>
  <text x="460" y="548" text-anchor="middle" font-size="11" fill="#2e6e2e">不变量：rear 始终指向下一个待插入位置；front 始终指向当前队首；count = 队内元素数</text>
  <text x="460" y="566" text-anchor="middle" font-size="11" fill="#444">所有下标推进都做 (i + 1) % cap —— 这一步取模正是“环”的本质</text>
</svg>
