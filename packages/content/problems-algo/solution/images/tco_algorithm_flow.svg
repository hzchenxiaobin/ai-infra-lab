<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历，计数器增减判定</text>

  <!-- Start -->
  <ellipse cx="280" cy="50" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#333">cnt = 0，i = 0</text>

  <path d="M 280 68 L 280 80" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i < n? diamond: center (280, 104) -->
  <polygon points="280,80 384,104 280,128 176,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#888">(还有元素)</text>

  <!-- No -> return false -->
  <path d="M 384 104 L 440 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="96" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="440" y="86" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 false</text>

  <!-- Yes -> down -->
  <path d="M 280 128 L 280 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="138" font-size="10" fill="#82b366">是</text>

  <!-- arr[i] & 1? diamond: center (280, 168) -->
  <polygon points="280,142 384,168 280,194 176,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#333">arr[i] &amp; 1 ?</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#888">(奇数?)</text>

  <!-- 偶 -> right to cnt=0 -->
  <path d="M 384 168 L 400 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="160" text-anchor="middle" font-size="10" fill="#446688">偶</text>
  <rect x="400" y="152" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="173" text-anchor="middle" font-size="11" fill="#333">cnt = 0</text>

  <!-- 奇 -> down to cnt++ -->
  <path d="M 280 194 L 280 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="204" font-size="10" fill="#b85450">奇</text>

  <rect x="180" y="210" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333">① cnt++</text>

  <path d="M 280 240 L 280 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cnt == 3? diamond: center (280, 280) -->
  <polygon points="280,252 372,280 280,308 188,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333">cnt == 3 ?</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#888">(三连?)</text>

  <!-- Yes -> return true -->
  <path d="M 372 280 L 440 280" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="262" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 true</text>
  <text x="485" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⭐</text>

  <!-- No -> down to i++ -->
  <path d="M 280 308 L 280 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="330" font-size="10" fill="#888">否</text>

  <!-- cnt=0 branch: down then left to i++ -->
  <path d="M 450 184 L 450 220 L 530 220 L 530 368" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 530 368 L 360 368" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box: center (280, 368) -->
  <rect x="200" y="352" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="11" fill="#333">i++，回到循环</text>

  <!-- loop back arrow from i++ to i<n? -->
  <path d="M 200 368 L 56 368 L 56 104 L 176 104" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="236" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 236)">继续下一个</text>

  <!-- Note -->
  <rect x="110" y="398" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">⚠️ 偶数清零，奇数累加，达 3 立即短路返回</text>
</svg>
