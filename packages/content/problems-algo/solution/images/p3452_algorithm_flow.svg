<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：一趟扫描 + 哨兵统一边界</text>

  <rect x="185" y="32" width="160" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="49" text-anchor="middle" font-size="11" fill="#333">开始：ans = 0, i = 0</text>

  <path d="M 265 58 L 265 74" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,78 322,104 265,130 208,104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>

  <path d="M 324 104 L 368 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="98" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="372" y="90" width="110" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="427" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <path d="M 265 130 L 265 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="139" font-size="10" fill="#4a7a3a">是</text>

  <rect x="165" y="142" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="160" text-anchor="middle" font-size="10.5" fill="#333">left = i−k ≥ 0 ? nums[i−k] : −∞</text>
  <text x="265" y="178" text-anchor="middle" font-size="10.5" fill="#333">right = i+k &lt; n ? nums[i+k] : −∞</text>

  <rect x="380" y="140" width="130" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="445" y="158" text-anchor="middle" font-size="9.5" fill="#555">哨兵 −∞：缺失方向</text>
  <text x="445" y="172" text-anchor="middle" font-size="9.5" fill="#555">的比较恒真，免去</text>
  <text x="445" y="186" text-anchor="middle" font-size="9.5" fill="#555">存在性分支判断</text>

  <path d="M 265 188 L 265 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,198 345,226 265,254 185,226" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="10.5" fill="#333">nums[i] &gt; left</text>
  <text x="265" y="238" text-anchor="middle" font-size="10.5" fill="#333">且 &gt; right ?</text>

  <path d="M 183 226 L 170 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="30" y="211" width="135" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="97" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += nums[i]</text>

  <path d="M 347 226 L 391 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="218" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="395" y="211" width="75" height="30" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="432" y="230" text-anchor="middle" font-size="11" fill="#777">跳过</text>

  <path d="M 97 243 L 97 302 L 206 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 243 L 432 302 L 324 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="288" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="306" text-anchor="middle" font-size="11" fill="#333">i = i + 1</text>

  <path d="M 265 318 L 265 332 L 16 332 L 16 104 L 202 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="327" text-anchor="middle" font-size="9.5" fill="#999">继续下一个 i</text>
</svg>
