<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：删尾部元音 ⟺ 保留前缀——从右往左找第一个非元音</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">元音集合 V = {a, e, i, o, u}；⚠️ 'y' 不是元音</text>

  <!-- ======== Row 1: idea ======== -->
  <text x="30" y="58" font-size="10" fill="#888" filter="url(#rough2)">示例 1：s = "idea"</text>
  <text x="156" y="63" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">停！</text>

  <rect x="96" y="68" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <rect x="136" y="68" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="156" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="176" y="68" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="216" y="68" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <line x1="179" y1="86" x2="213" y2="86" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="219" y1="86" x2="253" y2="86" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <line x1="256" y1="116" x2="106" y2="116" stroke="#999" stroke-width="1.5" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="181" y="130" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">扫描方向：从右往左，每步判一次元音</text>

  <text x="306" y="84" font-size="9" fill="#333" filter="url(#rough2)">尾部元音段 "ea" → 删除</text>
  <text x="306" y="100" font-size="9" fill="#333" filter="url(#rough2)">切割点 'd'（最右非元音）→ 停</text>
  <text x="306" y="116" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回前缀 "id" ✓</text>
  <text x="30" y="144" font-size="9" fill="#666" filter="url(#rough2)">头部 'i' 虽是元音但不在尾部 → 保留；返回 "id"</text>

  <!-- ======== Row 2: day ======== -->
  <text x="30" y="164" font-size="10" fill="#888" filter="url(#rough2)">示例 2：s = "day"</text>
  <text x="196" y="163" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">'y' 不是元音！</text>

  <rect x="96" y="174" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="197" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="136" y="174" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="197" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="176" y="174" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="196" y="197" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">y</text>

  <text x="306" y="190" font-size="9" fill="#333" filter="url(#rough2)">末位 'y' ∉ V → 第一轮判定即停</text>
  <text x="306" y="206" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "day"（原样）✓</text>
  <text x="30" y="228" font-size="9" fill="#666" filter="url(#rough2)">中间的 'a' 是元音但不在尾部 → 同样不删</text>

  <!-- ======== Row 3: aeiou ======== -->
  <text x="30" y="248" font-size="10" fill="#888" filter="url(#rough2)">示例 3：s = "aeiou"</text>

  <rect x="96" y="258" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="136" y="258" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="176" y="258" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <rect x="216" y="258" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">o</text>
  <rect x="256" y="258" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">u</text>

  <line x1="99" y1="276" x2="133" y2="276" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="139" y1="276" x2="173" y2="276" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="179" y1="276" x2="213" y2="276" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="219" y1="276" x2="253" y2="276" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="259" y1="276" x2="293" y2="276" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="330" y="274" font-size="9" fill="#333" filter="url(#rough2)">全员元音：i 一路减到 −1</text>
  <text x="330" y="290" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀为空 → 返回 "" ✓</text>

  <!-- legend -->
  <rect x="96" y="302" width="14" height="10" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="114" y="311" font-size="8.5" fill="#666" filter="url(#rough2)">保留</text>
  <rect x="146" y="302" width="14" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="164" y="311" font-size="8.5" fill="#666" filter="url(#rough2)">切割点（停）</text>
  <rect x="240" y="302" width="14" height="10" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="311" font-size="8.5" fill="#666" filter="url(#rough2)">删除的尾部元音</text>
  <rect x="356" y="302" width="14" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="374" y="311" font-size="8.5" fill="#666" filter="url(#rough2)">非元音警示（y）</text>

  <!-- insight box -->
  <rect x="30" y="320" width="460" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">「某字符该不该删」只取决于它右侧是否全是元音——后缀性质 ⇒ 信息流从右向左，倒序一趟 + 早停</text>
  <text x="260" y="352" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">切割点 i = 最右非元音下标；答案 = s[0..i]；i = −1（全元音）⇒ 前缀为空，下标语义零特判</text>
  <text x="260" y="366" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">更左边的字符与答案无关——一旦停在非元音即可收工，最坏 O(n)</text>
</svg>
