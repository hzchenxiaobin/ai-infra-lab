<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,5,7,8,9,2,3,4,3,1]，k = 3</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">f[i] = 以 i 结尾的最长严格递增段长度（递增 +1，断裂归 1）</text>

  <!-- 行标签 -->
  <text x="42" y="74" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="42" y="114" text-anchor="end" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">f</text>

  <!-- nums 格子 -->
  <rect x="50" y="52" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="52" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="134" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="176" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="218" y="52" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="260" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="74" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="302" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="74" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="344" y="52" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="74" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="386" y="52" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="428" y="52" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="449" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- f 格子 -->
  <rect x="50" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">1</text>
  <rect x="92" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">2</text>
  <rect x="134" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">3</text>
  <rect x="176" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">4</text>
  <rect x="218" y="92" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="114" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="260" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">1</text>
  <rect x="302" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">2</text>
  <rect x="344" y="92" width="42" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="114" text-anchor="middle" font-size="13" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="386" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">1</text>
  <rect x="428" y="92" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="449" y="114" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="71" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="113" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="155" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="197" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="239" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="281" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="323" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <text x="365" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="407" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>
  <text x="449" y="140" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>

  <!-- 检查表 -->
  <text x="260" y="160" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">枚举 a（a + 2k ≤ n，即 a ∈ [0, 4]）：</text>

  <rect x="60" y="170" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="170" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="170" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="170" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="185" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">f[a+k−1] ≥ k ?</text>
  <text x="310" y="185" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">f[a+2k−1] ≥ k ?</text>
  <text x="420" y="185" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- 行 a=0 -->
  <rect x="60" y="192" width="40" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="192" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="192" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="192" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="170" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">f[2] = 3 ✓</text>
  <text x="310" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[5] = 1 ✗</text>
  <text x="420" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 a=1 -->
  <rect x="60" y="216" width="40" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="216" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="216" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="216" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">f[3] = 4 ✓</text>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[6] = 2 ✗</text>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 a=2 命中 -->
  <rect x="60" y="240" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="100" y="240" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="240" y="240" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="380" y="240" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="256" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="170" y="256" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">f[4] = 5 ✓</text>
  <text x="310" y="256" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">f[7] = 3 ✓</text>
  <text x="420" y="256" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 命中！</text>

  <!-- 行 a=3 -->
  <rect x="60" y="264" width="40" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="264" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="264" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="264" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[5] = 1 ✗</text>
  <text x="310" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[8] = 1 ✗</text>
  <text x="420" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 a=4 -->
  <rect x="60" y="288" width="40" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="288" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="288" width="140" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="288" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="304" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="304" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[6] = 2 ✗</text>
  <text x="310" y="304" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[9] = 1 ✗</text>
  <text x="420" y="304" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 结论框 -->
  <rect x="20" y="326" width="480" height="70" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="34" y="348" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a = 2 命中：段1 = nums[2..4] = [7,8,9]，段2 = nums[5..7] = [2,3,4]，</text>
  <text x="34" y="366" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">b = a + k = 5，两段相邻且各自严格递增（接缝 9 → 2 下降也不影响）</text>
  <text x="34" y="384" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ return true ✓</text>
</svg>
