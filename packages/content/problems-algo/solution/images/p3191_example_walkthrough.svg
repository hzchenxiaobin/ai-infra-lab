<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0,1,1,1,0,0]，三次翻转全变 1</text>

  <text x="88" y="87" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <path d="M 96 44 v 9 h 156 v -9" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="258" y="52" font-size="9" fill="#d6a040" filter="url(#rough2)">翻 [0..2]</text>

  <rect x="96" y="62" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="88" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="150" y="62" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="88" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="62" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="88" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="62" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="88" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="62" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="366" y="62" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <polygon points="114,114 126,114 120,104" fill="#b85450" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="174" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="228" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="282" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="336" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="390" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>

  <text x="424" y="80" font-size="9.5" fill="#555" filter="url(#rough2)">nums[0]=0</text>
  <text x="424" y="96" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 翻！ans=1</text>

  <text x="88" y="179" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第①步后</text>
  <path d="M 150 132 v 9 h 156 v -9" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="312" y="140" font-size="9" fill="#d6a040" filter="url(#rough2)">翻 [1..3]</text>

  <rect x="96" y="154" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="180" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="154" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="180" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="204" y="154" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="180" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="258" y="154" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="180" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="154" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="180" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="366" y="154" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="180" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <polygon points="168,206 180,206 174,196" fill="#b85450" filter="url(#rough2)"/>

  <text x="424" y="172" font-size="9.5" fill="#555" filter="url(#rough2)">nums[1]=0</text>
  <text x="424" y="188" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 翻！ans=2</text>

  <text x="88" y="271" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第②步后</text>
  <path d="M 258 224 v 9 h 156 v -9" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="420" y="232" font-size="9" fill="#d6a040" filter="url(#rough2)">翻 [3..5]</text>

  <rect x="96" y="246" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="246" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="272" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="246" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="272" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="246" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="272" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="312" y="246" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="272" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="366" y="246" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="272" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <polygon points="276,298 288,298 282,288" fill="#b85450" filter="url(#rough2)"/>

  <text x="424" y="264" font-size="9.5" fill="#555" filter="url(#rough2)">i=2 是 1 跳过</text>
  <text x="424" y="280" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">nums[3]=0 → ans=3</text>

  <text x="88" y="363" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第③步后</text>

  <rect x="92" y="334" width="328" height="52" rx="10" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <rect x="96" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="366" y="338" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="364" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>

  <text x="424" y="356" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">全部为 1 ✓</text>
  <text x="424" y="372" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans=3</text>
</svg>
