<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">双指针验证（示例 1，候选 x = −2）：配 3 对、删 2 个</text>

  <!-- row 1: sorted nums1 -->
  <text x="106" y="72" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 nums1</text>
  <rect x="120" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="166" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="212" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="258" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="304" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- k indices -->
  <text x="140" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k=0</text>
  <text x="186" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k=1</text>
  <text x="232" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k=2</text>
  <text x="278" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k=3</text>
  <text x="324" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k=4</text>

  <path d="M 260 106 L 260 116" stroke="#888888" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="114" font-size="10.5" fill="#888" filter="url(#rough2)">每个元素 +x</text>

  <!-- row 2: after +x -->
  <text x="80" y="136" font-size="12.5" fill="#777" font-weight="bold" filter="url(#rough2)">+x 后</text>
  <rect x="120" y="118" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="166" y="118" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="142" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="212" y="118" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="142" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="258" y="118" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="142" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="304" y="118" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="142" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- delete marks -->
  <text x="140" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 删</text>
  <text x="186" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 删</text>

  <!-- match arrows -->
  <path d="M 232 158 C 232 178 196 176 192 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 278 158 C 278 184 238 180 238 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 324 158 C 324 190 284 184 284 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 3: sorted nums2 -->
  <text x="106" y="220" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">排序 nums2</text>
  <rect x="166" y="198" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="222" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="212" y="198" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="222" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="258" y="198" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="222" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">18</text>

  <text x="186" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="232" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="278" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=2</text>

  <!-- conclusion -->
  <rect x="60" y="262" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 个元素 = 3 对配齐 + 2 个删除 = 长度差 2 → x = −2 合法 ✓</text>

  <!-- notes -->
  <rect x="60" y="306" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">判定条件只有一条：j 是否走到 nums2 末尾（跳过数恰为长度差 2，无需另数）</text>

  <rect x="60" y="344" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心正确性：两数组有序，相等即配最优；偏小只能删，偏大则 nums2[j] 永配不上</text>
</svg>
