<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS + seenNull 标记</text>

  <!-- 1. 初始化 -->
  <rect x="200" y="46" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">队列 q = [root]，seenNull = false</text>

  <line x1="280" y1="80" x2="280" y2="96" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. while 队列非空 -->
  <rect x="210" y="100" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">while 队列非空</text>

  <line x1="280" y1="134" x2="280" y2="150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. pop 节点 -->
  <rect x="210" y="154" width="140" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">node = q.pop()</text>

  <line x1="280" y1="186" x2="280" y2="198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 判空菱形 -->
  <polygon points="280,200 360,236 280,272 200,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">node 是</text>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">null ?</text>

  <!-- 是 null 分支：向左 -->
  <line x1="200" y1="236" x2="120" y2="236" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="40" y="220" width="80" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">seenNull = true</text>

  <!-- 非 null 分支：向下 -->
  <line x1="280" y1="272" x2="280" y2="286" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="282" font-size="10" fill="#446688">否</text>

  <!-- 5. 已见 null 判定菱形 -->
  <polygon points="280,288 380,324 280,360 180,324" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">seenNull</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">已为 true ?</text>

  <!-- 是 → return false -->
  <line x1="380" y1="324" x2="450" y2="324" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="415" y="316" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="450" y="308" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="329" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- 否 → push 左右 -->
  <line x1="280" y1="360" x2="280" y2="374" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="370" font-size="10" fill="#446688">否</text>
  <rect x="190" y="378" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="11" fill="#446688">q.push(left); q.push(right)（含 null）</text>

  <!-- 回到 while 循环 -->
  <path d="M 190 395 L 130 395 L 130 117 L 210 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="256" font-size="10" fill="#888">回到循环</text>

  <!-- seenNull=true 分支也回到循环 -->
  <path d="M 80 252 L 80 395 L 130 395" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 队列空 → return true -->
  <line x1="280" y1="134" x2="430" y2="134" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="350" y="126" font-size="10" fill="#888">队列空</text>
  <rect x="430" y="118" width="92" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="139" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
