<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历同步维护 max 与前缀和</text>

  <!-- Start -->
  <rect x="190" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始：mx=0, sum=0</text>

  <!-- Arrow down -->
  <path d="M 260 78 L 260 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="260,100 360,140 260,180 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历每个 i</text>

  <!-- No branch: right -->
  <path d="M 360 140 L 430 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- Return -->
  <rect x="372" y="124" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch: down -->
  <path d="M 260 180 L 260 196" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="192" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- Step 1: update max -->
  <rect x="160" y="200" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① mx = max(mx, nums[i])</text>

  <path d="M 260 234 L 260 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute conver -->
  <rect x="160" y="254" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② conver = nums[i] + mx</text>

  <path d="M 260 288 L 260 304" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: accumulate -->
  <rect x="160" y="308" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ sum += conver; ans[i] = sum</text>

  <!-- Loop back arrow -->
  <path d="M 160 325 L 100 325 L 100 140 L 160 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="238" font-size="10" fill="#888" filter="url(#rough2)">i++</text>
  <text x="108" y="252" font-size="10" fill="#888" filter="url(#rough2)">回到</text>
  <text x="108" y="266" font-size="10" fill="#888" filter="url(#rough2)">判断</text>

  <!-- Annotation -->
  <rect x="160" y="370" width="280" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="172" y="390" font-size="11" fill="#555" filter="url(#rough2)">关键：conver 和 ans 都能在遍历中即时算出，</text>
  <text x="172" y="408" font-size="11" fill="#555" filter="url(#rough2)">无需存储中间数组，O(1) 额外空间。</text>
</svg>
