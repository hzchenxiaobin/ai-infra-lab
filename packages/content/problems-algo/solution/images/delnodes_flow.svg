<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 流程：dfs(node, is_root) —— 后序断边 + 前序收根</text>

  <!-- 入口 -->
  <rect x="200" y="40" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node, is_root)</text>
  <path d="M 280 68 L 280 76" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 菱形 -->
  <path d="M 280 76 L 345 106 L 280 136 L 215 106 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <!-- 是 → return null -->
  <path d="M 345 106 L 420 106" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="98" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="92" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="110" text-anchor="middle" font-size="11" fill="#333">return null</text>
  <!-- 否 → 下 -->
  <path d="M 280 136 L 280 152" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="148" font-size="10" fill="#b85450">否</text>

  <!-- deleted 标记 -->
  <rect x="180" y="152" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#333">deleted = node.val ∈ to_delete</text>
  <path d="M 280 180 L 280 190" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- is_root && !deleted? 菱形 -->
  <path d="M 280 190 L 365 222 L 280 254 L 195 222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333">is_root &amp;&amp;</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333">!deleted ?</text>
  <!-- 是 → forest.append -->
  <path d="M 365 222 L 410 222" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="214" font-size="10" fill="#4a7a3a">是</text>
  <rect x="410" y="208" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="226" text-anchor="middle" font-size="11" fill="#333">forest.append(node)</text>
  <!-- 否 → 跳过（直接下） -->
  <path d="M 280 254 L 280 268" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="264" font-size="10" fill="#888">否（跳过）</text>

  <!-- 递归左 -->
  <rect x="165" y="268" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#333">node.left = dfs(node.left, deleted)</text>
  <path d="M 280 296 L 280 304" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归右 -->
  <rect x="165" y="304" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333">node.right = dfs(node.right, deleted)</text>
  <path d="M 280 332 L 280 342" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- deleted? 菱形 -->
  <path d="M 280 342 L 345 372 L 280 402 L 215 372 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#333">deleted ?</text>
  <!-- 是 → return null -->
  <path d="M 215 372 L 140 372" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="364" font-size="10" fill="#b85450">是</text>
  <rect x="40" y="358" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="376" text-anchor="middle" font-size="11" fill="#333">return null</text>
  <!-- 否 → return node -->
  <path d="M 345 372 L 410 372" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="364" font-size="10" fill="#4a7a3a">否</text>
  <rect x="410" y="358" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="376" text-anchor="middle" font-size="11" fill="#333">return node</text>

  <!-- 底部说明 -->
  <rect x="40" y="418" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#555">is_root = 父被删或原根 · 被删节点的孩子 is_root=True · 返回 null 即断边</text>
</svg>
