<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">状态 =（长度奇偶 par，乘积 p，交错和 s）</text>

  <!-- 数组格子演示 -->
  <text x="70" y="55" font-size="12" fill="#666" filter="url(#rough2)">数组：</text>
  <rect x="110" y="42" width="50" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="42" width="50" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="210" y="42" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="63" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">3</text>
  <rect x="260" y="42" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="63" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">3</text>
  <text x="118" y="36" font-size="11" fill="#999" filter="url(#rough2)">+</text>
  <text x="168" y="36" font-size="11" fill="#999" filter="url(#rough2)">−</text>
  <text x="218" y="36" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="268" y="36" font-size="11" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <path d="M 315 58 C 345 50 360 52 378 56" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">选 [3,3]：</text>
  <text x="445" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s = 3−3 = 0，p = 9</text>

  <!-- 状态转移链 -->
  <rect x="34" y="112" width="128" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="98" y="134" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">起点（空序列）</text>
  <text x="98" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">par=偶, p=1, s=0</text>

  <path d="M 162 141 L 196 141" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">追加 3</text>
  <text x="180" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">s ← s+3</text>

  <rect x="198" y="112" width="128" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[3] 长度 1（奇）</text>
  <text x="262" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">par=奇, p=3, s=+3</text>

  <path d="M 326 141 L 360 141" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="128" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">追加 3</text>
  <text x="344" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">s ← s−3</text>

  <rect x="362" y="112" width="128" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="134" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">[3,3] 长度 2（偶）</text>
  <text x="426" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">par=偶, p=9, s=0</text>

  <!-- 转移规则框 -->
  <rect x="34" y="192" width="452" height="52" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">追加元素 x：par 翻转，p ← p·x，</text>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s ← s+x（新元素落偶下标）/ s ← s−x（落奇下标）</text>

  <!-- 0 陷阱警示 -->
  <rect x="34" y="262" width="452" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">⚠ 0 的两个陷阱</text>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 追加 0：s 不变，但 par 翻转（改变后续元素符号）</text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 中途 p·x &gt; limit 别丢弃：存入 over，遇到 0 后 p=0 复活！</text>
</svg>
