<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="380" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按奇偶生成对称数组</text>

  <rect x="185" y="36" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="250" y="56" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 n</text>
  <path d="M 250 66 L 250 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="86" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 1 → ⌊n / 2⌋</text>
  <path d="M 250 116 L 250 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="136" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res.push(−i);  res.push(+i)</text>
  <path d="M 250 170 L 250 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 250 188 L 336 212 L 250 236 L 164 212 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n 奇数?</text>

  <text x="346" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 336 212 L 370 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="198" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">res.push(0)</text>
  <path d="M 422 226 L 422 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 262 L 252 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="262" y="252" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 250 236 L 250 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="266" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="250" y="286" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <rect x="40" y="312" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⌊n/2⌋ 为整数除法：偶数 n=2m 得 m，奇数 n=2m+1 也得 m</text>
  <text x="250" y="352" text-anchor="middle" font-size="11" fill="#555">故循环范围统一，仅末尾按奇偶决定是否补 0</text>
</svg>
