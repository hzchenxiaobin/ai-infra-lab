<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两阶段（路径计数 ⟶ 树形 DP）</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="66" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11" fill="#333">建邻接表，n 个节点</text>
  <path d="M 270 74 L 270 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1 -->
  <rect x="70" y="92" width="400" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 ①：统计频次 freq</text>
  <text x="86" y="132" font-size="10" fill="#333">for each trip (s, e):</text>
  <text x="100" y="150" font-size="10" fill="#333">dfs(s, -1, e)  // 树中路径唯一</text>
  <text x="100" y="166" font-size="10" fill="#333">  命中 target → freq[u]++ 并回传 true，沿途累加</text>
  <text x="86" y="180" font-size="9" fill="#888">O(每条旅行) ≈ O(n)，trips ≤ 100</text>

  <path d="M 270 184 L 270 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 -->
  <rect x="70" y="202" width="400" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段 ②：树形 DP（以 0 为根）</text>
  <text x="86" y="242" font-size="10" fill="#333">save[u] = price[u]·freq[u] / 2</text>
  <text x="86" y="260" font-size="10" fill="#333">dfs(u, fa) 返回 (dp0, dp1):</text>
  <text x="100" y="278" font-size="10" fill="#333">dp0 = Σ max(dp[v][0], dp[v][1])  // u 不减半</text>
  <text x="100" y="296" font-size="10" fill="#333">dp1 = save[u] + Σ dp[v][0]        // u 减半</text>
  <text x="86" y="312" font-size="9" fill="#888">后序遍历：先递归子节点，再在当前节点汇总</text>

  <path d="M 270 318 L 270 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="90" y="336" width="360" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">total = Σ price[i]·freq[i]</text>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = total − max(dp[root][0], dp[root][1])</text>

  <text x="270" y="425" text-anchor="middle" font-size="10" fill="#888">关键：减半 = 节省一半花费；选不相邻点最大化节省 ⟺ 最小化总价</text>
  <text x="270" y="442" text-anchor="middle" font-size="10" fill="#888">即「树上最大权独立集」，与打家劫舍同构</text>
</svg>
