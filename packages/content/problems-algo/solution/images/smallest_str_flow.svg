<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 维护 path + 到叶翻转比较 + 回溯</text>

  <!-- start -->
  <rect x="140" y="44" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, path)  // path: root→当前</text>
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: node == null? -->
  <path d="M 260 96 L 350 134 L 260 172 L 170 134 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <path d="M 350 134 L 406 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="360" y="128" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="406" y="118" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return</text>
  <path d="M 260 172 L 260 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- append char -->
  <rect x="100" y="192" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#333">path.append( 'a' + node.val )</text>
  <path d="M 260 226 L 260 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: leaf? -->
  <path d="M 260 248 L 380 290 L 260 332 L 140 290 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#333">叶子节点 ?</text>
  <text x="260" y="302" text-anchor="middle" font-size="10" fill="#888">(left==null &amp;&amp; right==null)</text>
  <path d="M 380 290 L 416 290" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="386" y="284" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- leaf branch: build cand + compare -->
  <rect x="416" y="262" width="96" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="464" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cand = 翻转 path</text>
  <text x="464" y="296" text-anchor="middle" font-size="10" fill="#333">cand &lt; best ?</text>
  <text x="464" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">best = cand</text>

  <path d="M 260 332 L 260 350" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- recurse both children -->
  <rect x="90" y="352" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#333">dfs(node.left, path) ;  dfs(node.right, path)</text>
  <path d="M 260 386 L 260 402" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- backtrack -->
  <rect x="140" y="404" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="425" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">path.pop()  // 回溯</text>

  <!-- side note arrow from recurse to backtrack region -->
  <text x="260" y="452" text-anchor="middle" font-size="10" fill="#888">path 为可变容器，进入压入、退出弹出（对照 129 整数免回溯）</text>
</svg>
