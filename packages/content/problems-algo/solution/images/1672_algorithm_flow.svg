<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：逐行求和 + 滚动最大值
  </text>

  <!-- Start -->
  <ellipse cx="260" cy="58" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,76 L260,92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="216" y="96" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0</text>
  <path d="M260,126 L260,142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 还有 row? -->
  <polygon points="260,146 322,172 260,198 198,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有 row?</text>

  <!-- no branch -> return ans -->
  <path d="M322,172 L388,172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="392" y="156" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M260,198 L260,214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="212" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- wealth = sum(row) -->
  <rect x="196" y="218" width="128" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">wealth = Σ row</text>
  <path d="M260,248 L260,262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: wealth > ans? -->
  <polygon points="260,266 322,290 260,314 198,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">wealth &gt; ans?</text>

  <!-- yes -> ans = wealth (left), then loop back -->
  <path d="M198,290 L150,290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="274" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = wealth</text>
  <!-- loop back up to top of 还有row? diamond (260,146) -->
  <path d="M94,274 L94,128 L256,128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> loop back (right) -->
  <path d="M322,290 L372,290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M372,290 L372,128 L264,128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    读完全部元素即结束；O(m·n) 为读取下界
  </text>
</svg>
