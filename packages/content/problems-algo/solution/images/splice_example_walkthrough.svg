<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：一趟 Kadane 同时维护 maxS 与 minS</text>

  <!-- ============================================ -->
  <!-- ===== Example 1: diff=[-50,30,-50] ========= -->
  <!-- ============================================ -->
  <text x="28" y="50" font-size="11" fill="#444" font-weight="bold">示例 1：nums1=[60,60,60], nums2=[10,90,10] → diff=[-50,30,-50]</text>
  <text x="28" y="64" font-size="10" fill="#888">sum1=180, sum2=110（不对称：换给 nums1 更划算）</text>

  <!-- header row -->
  <text x="40" y="84" font-size="9.5" fill="#888">步骤</text>
  <text x="100" y="84" font-size="9.5" fill="#888">d</text>
  <text x="175" y="84" font-size="9.5" fill="#446688">curMax</text>
  <text x="250" y="84" font-size="9.5" fill="#446688">maxS</text>
  <text x="335" y="84" font-size="9.5" fill="#4a7a3a">curMin</text>
  <text x="410" y="84" font-size="9.5" fill="#4a7a3a">minS</text>
  <line x1="30" y1="90" x2="510" y2="90" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- initial -->
  <text x="40" y="108" font-size="10" fill="#555">初始</text>
  <text x="100" y="108" font-size="10" fill="#888">—</text>
  <rect x="160" y="96" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="111" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="235" y="96" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="111" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="320" y="96" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="111" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="395" y="96" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="111" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- row i=0 d=-50 -->
  <text x="40" y="132" font-size="10" fill="#555">① i=0</text>
  <text x="100" y="132" font-size="10.5" fill="#b85450" font-weight="bold">-50</text>
  <rect x="160" y="120" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="135" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-50</text>
  <rect x="235" y="120" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="135" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="320" y="120" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="135" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-50</text>
  <rect x="395" y="120" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="135" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-50</text>

  <!-- row i=1 d=30 -->
  <text x="40" y="156" font-size="10" fill="#555">② i=1</text>
  <text x="100" y="156" font-size="10.5" fill="#4a7a3a" font-weight="bold">30</text>
  <rect x="160" y="144" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="159" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="235" y="144" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="159" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="320" y="144" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="159" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-20</text>
  <rect x="395" y="144" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="159" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-50</text>

  <!-- row i=2 d=-50 -->
  <text x="40" y="180" font-size="10" fill="#555">③ i=2</text>
  <text x="100" y="180" font-size="10.5" fill="#b85450" font-weight="bold">-50</text>
  <rect x="160" y="168" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-20</text>
  <rect x="235" y="168" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="320" y="168" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-70</text>
  <rect x="395" y="168" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="183" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-70</text>

  <!-- result example 1 -->
  <rect x="40" y="196" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="214" font-size="10.5" fill="#333" font-weight="bold">结果：maxS=30 → sum1+maxS=210 ✓ ；minS=-70 → sum2−minS=180。ans=max(210,180)=210</text>

  <!-- ============================================ -->
  <!-- ===== Example 2: diff=[30,-20,30,-30,-10] == -->
  <!-- ============================================ -->
  <text x="28" y="250" font-size="11" fill="#444" font-weight="bold">示例 2：nums1=[20,40,20,70,30], nums2=[50,20,50,40,20]</text>
  <text x="28" y="264" font-size="10" fill="#888">diff=[30,-20,30,-30,-10]，sum1=180, sum2=180（对称：两个候选都到 220）</text>

  <!-- header -->
  <text x="40" y="284" font-size="9.5" fill="#888">步骤</text>
  <text x="100" y="284" font-size="9.5" fill="#888">d</text>
  <text x="175" y="284" font-size="9.5" fill="#446688">curMax</text>
  <text x="250" y="284" font-size="9.5" fill="#446688">maxS</text>
  <text x="335" y="284" font-size="9.5" fill="#4a7a3a">curMin</text>
  <text x="410" y="284" font-size="9.5" fill="#4a7a3a">minS</text>
  <line x1="30" y1="290" x2="510" y2="290" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows for example 2: i=0..4 -->
  <!-- i=0 d=30 -->
  <text x="40" y="308" font-size="10" fill="#555">① i=0</text>
  <text x="100" y="308" font-size="10.5" fill="#4a7a3a" font-weight="bold">30</text>
  <rect x="160" y="296" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="235" y="296" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="320" y="296" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="395" y="296" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- i=1 d=-20 -->
  <text x="40" y="332" font-size="10" fill="#555">② i=1</text>
  <text x="100" y="332" font-size="10.5" fill="#b85450" font-weight="bold">-20</text>
  <rect x="160" y="320" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <rect x="235" y="320" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>
  <rect x="320" y="320" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-20</text>
  <rect x="395" y="320" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-20</text>

  <!-- i=2 d=30 -->
  <text x="40" y="356" font-size="10" fill="#555">③ i=2</text>
  <text x="100" y="356" font-size="10.5" fill="#4a7a3a" font-weight="bold">30</text>
  <rect x="160" y="344" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="359" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">40</text>
  <rect x="235" y="344" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="359" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">40</text>
  <rect x="320" y="344" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="359" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <rect x="395" y="344" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="359" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-20</text>

  <!-- i=3 d=-30 -->
  <text x="40" y="380" font-size="10" fill="#555">④ i=3</text>
  <text x="100" y="380" font-size="10.5" fill="#b85450" font-weight="bold">-30</text>
  <rect x="160" y="368" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <rect x="235" y="368" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">40</text>
  <rect x="320" y="368" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-30</text>
  <rect x="395" y="368" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-30</text>

  <!-- i=4 d=-10 -->
  <text x="40" y="404" font-size="10" fill="#555">⑤ i=4</text>
  <text x="100" y="404" font-size="10.5" fill="#b85450" font-weight="bold">-10</text>
  <rect x="160" y="392" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="407" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="235" y="392" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="407" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">40</text>
  <rect x="320" y="392" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="407" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-40</text>
  <rect x="395" y="392" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="407" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-40</text>

  <!-- result example 2 -->
  <rect x="40" y="420" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="438" font-size="10.5" fill="#333" font-weight="bold">结果：maxS=40 → 220；minS=-40 → 220。ans=max(220,220)=220 ✓</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="458" width="470" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="476" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ maxS/minS 初值取 0（允许空子数组=不交换），务必用 long long 防溢出</text>
  <text x="275" y="489" text-anchor="middle" font-size="9.5" fill="#b85450">总和可达 10^5×10^4=10^9，maxS/minS 也在该量级，Python 无虞</text>
</svg>
