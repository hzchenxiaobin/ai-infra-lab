<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s = "abcd"，indices=[0,2]，sources=["ab","ec"]，targets=["eee","ffff"]</text>

  <!-- Original string label -->
  <text x="24" y="62" font-size="12" fill="#888">原串 s</text>

  <!-- index row -->
  <text x="24" y="64" font-size="10" fill="#888"></text>
  <rect x="80" y="48" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="64" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="140" y="48" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="64" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="200" y="48" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="260" y="48" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- char row: abcd, op0 src "ab" matches (red), op1 src "ec" vs actual "cd" mismatch (amber) -->
  <rect x="80" y="78" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="140" y="78" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="200" y="78" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">c</text>
  <rect x="260" y="78" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">d</text>

  <!-- src range annotations under char row -->
  <text x="110" y="124" text-anchor="middle" font-size="9" fill="#b85450">src "ab" ✓</text>
  <text x="230" y="124" text-anchor="middle" font-size="9" fill="#d6a040">实际 "cd"≠"ec" ✗</text>

  <!-- operation annotations right side -->
  <text x="345" y="88" font-size="11" fill="#b85450" font-weight="bold">操作0：src "ab" → tgt "eee"</text>
  <text x="345" y="104" font-size="10" fill="#888">s[0:2]="ab"==src  ✅ 匹配</text>
  <text x="345" y="128" font-size="11" fill="#d6a040" font-weight="bold">操作1：src "ec" → tgt "ffff"</text>
  <text x="345" y="144" font-size="10" fill="#888">s[2:4]="cd"≠"ec"  ❌ 不匹配</text>

  <!-- arrow down -->
  <path d="M 170 132 L 170 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="178" y="146" font-size="10" fill="#446688">逐位扫描</text>

  <!-- Step 1: match -->
  <rect x="30" y="156" width="560" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">步骤1</text>
  <text x="80" y="174" font-size="11" fill="#333">j=0：命中 op0，s[0:2]="ab"=="ab"  ✅ 匹配 → 追加 "eee"，j += 2 → j=2</text>
  <text x="80" y="190" font-size="10" fill="#888">res = "eee"</text>

  <!-- Step 2: mismatch -->
  <rect x="30" y="204" width="560" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="11" fill="#b85450" font-weight="bold">步骤2</text>
  <text x="80" y="222" font-size="11" fill="#333">j=2：命中 op1，s[2:4]="cd"≠"ec"  ❌ 不匹配 → 追加 'c'，j += 1 → j=3</text>
  <text x="80" y="238" font-size="10" fill="#888">res = "eee" + "c" = "eeec"</text>

  <!-- Step 3: no op -->
  <rect x="30" y="252" width="560" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="270" font-size="11" fill="#446688" font-weight="bold">步骤3</text>
  <text x="80" y="270" font-size="11" fill="#333">j=3：无操作 → 追加 'd'，j += 1 → j=4（扫描结束）</text>
  <text x="80" y="286" font-size="10" fill="#888">res = "eeec" + "d" = "eeecd"</text>

  <!-- Result -->
  <rect x="190" y="306" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果 = "eeecd"  ⭐</text>

  <!-- Observations -->
  <text x="30" y="362" font-size="12" fill="#444" font-weight="bold">关键观察：</text>
  <text x="30" y="384" font-size="11" fill="#333">• 匹配成功：j 跳 len(src)=2，追加 target（长度可与 src 不同）</text>
  <text x="30" y="404" font-size="11" fill="#333">• 匹配失败：当作无事发生，追加 s[j]，j 仅前进 1</text>
  <text x="30" y="424" font-size="11" fill="#333">• 所有判定针对原串 s → 两次操作互不干扰 = "同时替换"</text>
  <text x="30" y="444" font-size="11" fill="#4a7a3a" font-weight="bold">→ 跳的是原串 source 长度，追加的是 target 长度，两者分开管理</text>
</svg>
