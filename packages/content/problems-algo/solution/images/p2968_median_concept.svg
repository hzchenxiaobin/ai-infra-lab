<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后取连续段，全部改成「中位数」</text>

  <text x="24" y="44" font-size="11" fill="#888">观察① 改动集合在排序后必连续：把远处元素换成「夹在中间的更近元素」，代价不增</text>

  <!-- A：示例窗口 -->
  <text x="24" y="68" font-size="12" fill="#446688" font-weight="bold">排序后（示例 1，k = 3）：</text>

  <path d="M 44 72 Q 64 54 84 72" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="64" y="58" text-anchor="middle" font-size="10" fill="#d6a040">+1</text>
  <path d="M 132 72 Q 112 50 92 72" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="112" y="48" text-anchor="middle" font-size="10" fill="#d6a040">−1×2</text>

  <rect x="24" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="97" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="68" y="76" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="97" text-anchor="middle" font-size="13" fill="#b8860b" font-weight="bold">2</text>
  <rect x="112" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="97" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="156" y="76" width="40" height="32" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="97" text-anchor="middle" font-size="13" fill="#999">6</text>

  <rect x="20" y="72" width="136" height="40" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="88" font-size="11" fill="#4a7a3a">改动段 = 排序后</text>
  <text x="210" y="104" font-size="11" fill="#4a7a3a">连续区间 [l, r]</text>
  <text x="300" y="88" font-size="11" fill="#b8860b" font-weight="bold">目标 = 中位数 m</text>
  <text x="300" y="104" font-size="11" fill="#b8860b">（此处 m = 2）</text>

  <text x="24" y="134" font-size="12" fill="#333">cost = |1−2| + |2−2| + |4−2| = 3 ≤ k ✓</text>
  <text x="24" y="150" font-size="10" fill="#999">每次 +1 或 −1 记一次操作；频率分数 = 区间长度</text>

  <!-- B：中位数最优 -->
  <text x="24" y="174" font-size="12" fill="#d6a040" font-weight="bold">观察② 固定区间，目标取中位数最优（凸性 / 462 题）</text>

  <path d="M 194 178 L 242 162" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <text x="248" y="160" font-size="10" fill="#b85450">t 向右挪 δ</text>

  <rect x="96" y="182" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="202" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="136" y="182" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="202" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="176" y="182" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="202" text-anchor="middle" font-size="12" fill="#b8860b" font-weight="bold">5</text>
  <rect x="216" y="182" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="202" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="256" y="182" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="202" text-anchor="middle" font-size="12" fill="#333">9</text>

  <text x="134" y="226" text-anchor="middle" font-size="10" fill="#446688">左侧 L 个（含 m）</text>
  <text x="254" y="226" text-anchor="middle" font-size="10" fill="#b85450">右侧 R 个</text>

  <text x="310" y="188" font-size="11" fill="#333">左半 L 个各多付 δ，右半 R 个各省 δ</text>
  <text x="310" y="204" font-size="11" fill="#333">中位数保证 L ≥ R → Δcost ≥ 0</text>
  <text x="310" y="220" font-size="11" fill="#333">f(t)=Σ|x−t| 是凸函数，中位数即最低点</text>

  <!-- C：前缀和公式 -->
  <text x="24" y="252" font-size="12" fill="#446688" font-weight="bold">观察③ 前缀和 O(1) 计算区间代价</text>

  <rect x="24" y="262" width="512" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333">mid = ⌊(l+r)/2⌋，m = nums[mid]，pre[i] = nums[0..i−1] 之和</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#333">cost(l,r) = m·(mid−l) − (pre[mid]−pre[l]) + (pre[r+1]−pre[mid+1]) − m·(r−mid)</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#446688">＝ 左半段抬到 m ＋ 右半段降到 m</text>

  <!-- D：单调性 -->
  <rect x="24" y="342" width="512" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333">观察④ 窗口缩小代价不增 → 固定 right，可行 left 是后缀且单调不减</text>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#333">→ 同向双指针：left、right 各至多走 n 步，均摊 O(n)</text>
</svg>
