<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心直觉：按列相加，每列 1 的个数 = 该位数字</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">每个十-二进制数每位只能是 0 或 1 → 某位数字 d 至少要 d 个数堆出</text>

  <!-- Target n = 32 -->
  <text x="40" y="78" font-size="11" fill="#666">目标 n</text>
  <rect x="150" y="60" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="82" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">3</text>
  <rect x="204" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- Plus sign and 3 stacked deci-binary numbers -->
  <text x="100" y="118" font-size="16" fill="#888">+</text>

  <!-- Row 1: 11 -->
  <rect x="150" y="104" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="204" y="104" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="280" y="124" font-size="10.5" fill="#888">第 1 个数</text>

  <!-- Row 2: 11 -->
  <rect x="150" y="138" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="204" y="138" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="280" y="158" font-size="10.5" fill="#888">第 2 个数</text>

  <!-- Row 3: 10 -->
  <rect x="150" y="172" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="192" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="204" y="172" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="192" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="280" y="192" font-size="10.5" fill="#888">第 3 个数</text>

  <!-- Sum line -->
  <path d="M 140 208 L 264 208" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Result = 32 -->
  <rect x="150" y="214" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="236" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">3</text>
  <rect x="204" y="214" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="236" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- Column count annotation -->
  <path d="M 175 60 L 175 50 L 320 50" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="54" font-size="11" fill="#b85450" font-weight="bold">这一列有 3 个 1</text>

  <path d="M 229 104 L 229 96 L 320 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="100" font-size="11" fill="#446688">这一列有 2 个 1</text>

  <!-- Conclusion -->
  <rect x="60" y="266" width="400" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">每位数字 d → 需要恰好 d 个「1」填到该列</text>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#555">数字最大的那位决定了要叠多少层 → 答案 = max(各位数字)</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888">例：32 → max(3,2) = 3；82734 → max(8,2,7,3,4) = 8</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#aaa">十-二进制数 = 各位只含 0/1 的十进制数（如 101、1100）</text>
</svg>
