<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="318" text-anchor="middle" font-size="9" fill="#aaa"> </text>

  <rect x="175" y="14" width="90" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 220 40 L 220 54" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="56" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="75" text-anchor="middle" font-size="12" fill="#333">i ← n − 1</text>

  <path d="M 220 84 L 220 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="220,104 268,128 220,152 172,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i ≥ 0 ?</text>

  <text x="300" y="124" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 268 128 L 338 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="100" width="210" height="72" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="120" text-anchor="middle" font-size="11" fill="#333">k ← k + num[i]</text>
  <text x="445" y="136" text-anchor="middle" font-size="11" fill="#333">num[i] ← k % 10</text>
  <text x="445" y="152" text-anchor="middle" font-size="11" fill="#333">k ← k / 10</text>
  <text x="445" y="168" text-anchor="middle" font-size="11" fill="#333">i ← i − 1</text>

  <path d="M 445 172 L 445 184 L 130 184 L 130 128 L 170 128" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="10" fill="#888">循环</text>

  <text x="232" y="172" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 220 152 L 220 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="220,224 268,248 220,272 172,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k &gt; 0 ?</text>

  <text x="300" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 268 248 L 338 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="222" width="210" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="242" text-anchor="middle" font-size="11" fill="#333">在 num 首位插入 k % 10</text>
  <text x="445" y="260" text-anchor="middle" font-size="11" fill="#333">k ← k / 10</text>

  <path d="M 445 274 L 445 286 L 130 286 L 130 248 L 170 248" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="10" fill="#888">循环</text>

  <text x="232" y="292" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 220 272 L 220 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="318" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="337" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 num</text>
</svg>
