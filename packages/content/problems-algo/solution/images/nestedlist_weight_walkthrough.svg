<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例：[1,[4,[6]]] → 1×1 + 4×2 + 6×3 = 27
  </text>

  <!-- Nested structure visualization -->
  <!-- depth 1 bracket -->
  <path d="M 60 55 Q 50 55 50 75 L 50 200 Q 50 220 60 220"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 510 55 Q 520 55 520 75 L 520 200 Q 520 220 510 220"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="38" y="140" font-size="13" fill="#446688" filter="url(#rough2)">d=1</text>

  <!-- integer 1 at depth 1 -->
  <rect x="90" y="100" width="50" height="34" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="92" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">d=1</text>

  <!-- depth 2 bracket for [4,[6]] -->
  <path d="M 170 65 Q 162 65 162 80 L 162 195 Q 162 210 170 210"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 510 65 Q 518 65 518 80 L 518 195 Q 518 210 510 210"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="145" font-size="12" fill="#b85450" filter="url(#rough2)">d=2</text>

  <!-- integer 4 at depth 2 -->
  <rect x="200" y="100" width="50" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="225" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="225" y="92" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">d=2</text>

  <!-- depth 3 bracket for [6] -->
  <path d="M 290 75 Q 284 75 284 88 L 284 185 Q 284 198 290 198"
        fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 510 75 Q 516 75 516 88 L 516 185 Q 516 198 510 198"
        fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d=3</text>

  <!-- integer 6 at depth 3 -->
  <rect x="320" y="105" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="345" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d=3</text>

  <!-- Divider -->
  <line x1="40" y1="240" x2="520" y2="240" stroke="#888" stroke-width="1"
        stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Calculation table -->
  <text x="280" y="268" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    逐元素加权和：
  </text>

  <!-- Row 1 -->
  <rect x="80" y="285" width="60" height="28" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 ×1</text>
  <text x="160" y="304" font-size="14" fill="#888" filter="url(#rough2)">= 1</text>

  <!-- Row 2 -->
  <rect x="240" y="285" width="60" height="28" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4 ×2</text>
  <text x="320" y="304" font-size="14" fill="#888" filter="url(#rough2)">= 8</text>

  <!-- Row 3 -->
  <rect x="380" y="285" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6 ×3</text>
  <text x="460" y="304" font-size="14" fill="#888" filter="url(#rough2)">= 18</text>

  <!-- Sum -->
  <line x1="120" y1="330" x2="440" y2="330" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">
    1 + 8 + 18 = 27
  </text>

  <!-- DFS call stack hint -->
  <text x="280" y="395" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    DFS 入栈顺序：d=1 → 遇 [4,[6]] 进入 d=2 → 遇 [6] 进入 d=3
  </text>
</svg>
