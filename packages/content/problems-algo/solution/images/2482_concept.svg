<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：零数 = 行/列长 − 一数 → diff 仅依赖行/列一计数</text>

  <!-- ====== Left: 3x3 grid with margins ====== -->
  <text x="40" y="58" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">grid</text>

  <!-- Row 0: 0,1,1 -->
  <rect x="50" y="66" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="94" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <rect x="94" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="66" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">r0</text>
  <text x="210" y="100" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 1: 1,0,1 -->
  <rect x="50" y="110" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="94" y="110" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="138" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <rect x="138" y="110" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="110" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="128" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">r1</text>
  <text x="210" y="144" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 2: 0,0,1 -->
  <rect x="50" y="154" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="182" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <rect x="94" y="154" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="182" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <rect x="138" y="154" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="154" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">r2</text>
  <text x="210" y="188" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- col ones margin (bottom row) -->
  <rect x="50" y="198" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c0</text>
  <text x="72" y="230" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="94" y="198" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c1</text>
  <text x="116" y="230" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="198" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c2</text>
  <text x="160" y="230" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- margin labels -->
  <text x="210" y="58" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">行一数</text>
  <text x="40" y="224" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">列一数</text>

  <!-- divider -->
  <path d="M 262 50 L 262 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- ====== Right: formula derivation ====== -->
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">公式化简</text>

  <text x="278" y="86" font-size="11.5" fill="#555" filter="url(#rough2)">原式：</text>
  <text x="316" y="86" font-size="11.5" fill="#333" filter="url(#rough2)">diff = onesR + onesC − zerosR − zerosC</text>

  <text x="278" y="112" font-size="11" fill="#888" filter="url(#rough2)">因零数 = 全长 − 一数：</text>
  <text x="316" y="130" font-size="11" fill="#888" filter="url(#rough2)">zerosR[i] = n − onesR[i]</text>
  <text x="316" y="146" font-size="11" fill="#888" filter="url(#rough2)">zerosC[j] = m − onesC[j]</text>

  <text x="278" y="174" font-size="11.5" fill="#555" filter="url(#rough2)">代入：</text>
  <text x="316" y="192" font-size="11" fill="#446688" filter="url(#rough2)">= onesR + onesC − (n−onesR) − (m−onesC)</text>
  <text x="316" y="210" font-size="11" fill="#446688" filter="url(#rough2)">= 2·onesR − n + 2·onesC − m</text>

  <!-- boxed result -->
  <rect x="296" y="224" width="248" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="249" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diff[i][j] = 2·r[i] − n + 2·c[j] − m</text>

  <!-- footer note -->
  <rect x="30" y="284" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">只需预处理行/列一计数，每格 O(1) 套公式，无需逐格数零。</text>
  <text x="280" y="319" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">r[i]=第 i 行 1 的个数；c[j]=第 j 列 1 的个数；n=列数，m=行数。</text>

  <!-- legend -->
  <rect x="30" y="344" width="18" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="355" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="78" y="344" width="18" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="102" y="355" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="130" y="344" width="18" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="154" y="355" font-size="10.5" fill="#446688" filter="url(#rough2)">行一数 r[i]</text>
  <rect x="232" y="344" width="18" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="256" y="355" font-size="10.5" fill="#d6a040" filter="url(#rough2)">列一数 c[j]</text>
</svg>
