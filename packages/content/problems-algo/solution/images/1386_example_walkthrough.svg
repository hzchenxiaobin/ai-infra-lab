<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="500" fill="#fafafa"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：n=3</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="390" y="64" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">reservedSeats=[[1,2],[1,3],[1,8],[2,6],[3,1],[3,10]]；红 X=已预约，色块=选中的 4 连座</text>

  <!-- ============ 第 1 排：预约 2,3,8 → 选 M(4-7) → 1 组 ============ -->
  <text x="40" y="126" font-size="13" font-weight="bold" fill="#2b5588" filter="url(#sk)">第 1 排</text>
  <!-- 选中块 M 高亮框 -->
  <g filter="url(#sk)">
    <rect x="196" y="98" width="182" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <!-- 10 个座位 -->
  <g filter="url(#sk)">
    <rect x="60"  y="100" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="106" y="100" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="152" y="100" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="198" y="100" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="244" y="100" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="290" y="100" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="336" y="100" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="382" y="100" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="428" y="100" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="474" y="100" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
  </g>
  <!-- 座号 -->
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="80"  y="122">1</text><text x="126" y="122">2</text><text x="172" y="122">3</text>
    <text x="218" y="122">4</text><text x="264" y="122">5</text><text x="310" y="122">6</text>
    <text x="356" y="122">7</text><text x="402" y="122">8</text><text x="448" y="122">9</text>
    <text x="494" y="122">10</text>
  </g>
  <!-- 预约 X -->
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 112 104 L 140 132"/><path d="M 140 104 L 112 132"/>
    <path d="M 158 104 L 186 132"/><path d="M 186 104 L 158 132"/>
    <path d="M 388 104 L 416 132"/><path d="M 416 104 L 388 132"/>
  </g>
  <text x="287" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#sk)">选中 M(4-7)</text>
  <!-- 右侧结论 -->
  <g filter="url(#sk)">
    <rect x="546" y="104" width="218" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="4 3"/>
  </g>
  <text x="556" y="122" font-size="11" fill="#444" filter="url(#sk)">预约 {2,3,8}：L✗(2,3占) R✗(8占)</text>
  <text x="556" y="138" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#sk)">M✓ → 放 1 组</text>

  <!-- ============ 第 2 排：预约 6 → 选 L(2-5) → 1 组 ============ -->
  <text x="40" y="236" font-size="13" font-weight="bold" fill="#2b5588" filter="url(#sk)">第 2 排</text>
  <g filter="url(#sk)">
    <rect x="104" y="208" width="182" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="60"  y="210" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="106" y="210" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="152" y="210" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="198" y="210" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="244" y="210" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="210" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="336" y="210" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="382" y="210" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="428" y="210" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
    <rect x="474" y="210" width="40" height="36" rx="3" fill="#f5f5f5" stroke="#aaa"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="80"  y="232">1</text><text x="126" y="232">2</text><text x="172" y="232">3</text>
    <text x="218" y="232">4</text><text x="264" y="232">5</text><text x="310" y="232">6</text>
    <text x="356" y="232">7</text><text x="402" y="232">8</text><text x="448" y="232">9</text>
    <text x="494" y="232">10</text>
  </g>
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 296 214 L 324 242"/><path d="M 324 214 L 296 242"/>
  </g>
  <text x="195" y="202" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#sk)">选中 L(2-5)</text>
  <g filter="url(#sk)">
    <rect x="546" y="214" width="218" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="4 3"/>
  </g>
  <text x="556" y="232" font-size="11" fill="#444" filter="url(#sk)">预约 {6}：M✗(6占) R✗(6占)</text>
  <text x="556" y="248" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">L✓ → 放 1 组</text>

  <!-- ============ 第 3 排：预约 1,10 → L&amp;R 都空 → 2 组 ============ -->
  <text x="40" y="346" font-size="13" font-weight="bold" fill="#2b5588" filter="url(#sk)">第 3 排</text>
  <g filter="url(#sk)">
    <rect x="104" y="318" width="182" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="288" y="318" width="182" height="40" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="60"  y="320" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="106" y="320" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="152" y="320" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="198" y="320" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="244" y="320" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="320" width="40" height="36" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="336" y="320" width="40" height="36" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="382" y="320" width="40" height="36" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="428" y="320" width="40" height="36" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="474" y="320" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="80"  y="342">1</text><text x="126" y="342">2</text><text x="172" y="342">3</text>
    <text x="218" y="342">4</text><text x="264" y="342">5</text><text x="310" y="342">6</text>
    <text x="356" y="342">7</text><text x="402" y="342">8</text><text x="448" y="342">9</text>
    <text x="494" y="342">10</text>
  </g>
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 66 324 L 94 352"/><path d="M 94 324 L 66 352"/>
    <path d="M 480 324 L 508 352"/><path d="M 508 324 L 480 352"/>
  </g>
  <text x="195" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#sk)">L(2-5)</text>
  <text x="379" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">R(6-9)</text>
  <g filter="url(#sk)">
    <rect x="546" y="324" width="218" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="4 3"/>
  </g>
  <text x="556" y="342" font-size="11" fill="#444" filter="url(#sk)">预约 {1,10}：座位 1、10 不入任何块</text>
  <text x="556" y="358" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">L✓ &amp; R✓ → 放 2 组 (L+R)</text>

  <!-- 合计 -->
  <g filter="url(#sk)">
    <rect x="180" y="408" width="420" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="390" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">合计 = 1 + 1 + 2 = 4</text>
  <text x="390" y="452" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">三排均在 map 中（无全空排）；逐排贪心相加即答案</text>
</svg>
