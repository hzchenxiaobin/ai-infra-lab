<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每项格式 = sign + ABS(factor) + 变量部分</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">sign 由 factor 正负决定（+/-），变量部分由 power 值分三种情况</text>

  <!-- Terms table label -->
  <text x="24" y="74" font-size="10.5" fill="#666">Terms 表</text>

  <!-- Mini table header -->
  <rect x="60" y="56" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">power</text>
  <text x="112" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">factor</text>

  <!-- Row 1: power=2, factor=1 -->
  <rect x="60" y="82" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="112" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Arrow row1 -> format -->
  <path d="M 135 93 L 185 93" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Case 1: power > 1 -->
  <rect x="190" y="78" width="330" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="98" font-size="11" fill="#333">power &gt; 1：</text>
  <text x="290" y="98" font-size="12.5" fill="#b85450" font-weight="bold">+1X^2</text>
  <text x="355" y="98" font-size="10" fill="#888">= sign + ABS(1) + "X^" + 2</text>

  <!-- Row 2: power=1, factor=-4 -->
  <rect x="60" y="122" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="112" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">-4</text>

  <path d="M 135 133 L 185 133" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Case 2: power = 1 -->
  <rect x="190" y="118" width="330" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="138" font-size="11" fill="#333">power = 1：</text>
  <text x="290" y="138" font-size="12.5" fill="#b85450" font-weight="bold">-4X</text>
  <text x="340" y="138" font-size="10" fill="#888">= sign + ABS(4) + "X"（省略 ^1）</text>

  <!-- Row 3: power=0, factor=2 -->
  <rect x="60" y="162" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="112" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <path d="M 135 173 L 185 173" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Case 3: power = 0 -->
  <rect x="190" y="158" width="330" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="178" font-size="11" fill="#333">power = 0：</text>
  <text x="290" y="178" font-size="12.5" fill="#b85450" font-weight="bold">+2</text>
  <text x="330" y="178" font-size="10" fill="#888">= sign + ABS(2)（省略 X 和 ^0）</text>

  <!-- Divider -->
  <path d="M 40 210 L 520 210" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Sign determination box -->
  <rect x="50" y="224" width="220" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sign 如何确定？</text>
  <text x="160" y="262" text-anchor="middle" font-size="10.5" fill="#555">factor &gt; 0 → "+"（加号）</text>
  <text x="160" y="278" text-anchor="middle" font-size="10.5" fill="#555">factor &lt; 0 → "-"（减号）</text>

  <!-- Fact determination box -->
  <rect x="290" y="224" width="220" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">fact 如何取值？</text>
  <text x="400" y="262" text-anchor="middle" font-size="10.5" fill="#555">fact = ABS(factor)</text>
  <text x="400" y="278" text-anchor="middle" font-size="10.5" fill="#555">恒为非负整数，不含符号</text>

  <!-- Bottom: full format template -->
  <rect x="40" y="306" width="480" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">通用项模板：&lt;sign&gt;&lt;fact&gt;X^&lt;pow&gt;</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#555">power=1 省略 ^&lt;pow&gt;；power=0 省略 X^&lt;pow&gt;；按 power 降序拼接 + "=0"</text>

  <!-- Footer -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#aaa">⚠️ factor 恒非零（约束保证），故无需处理零系数项</text>
</svg>
