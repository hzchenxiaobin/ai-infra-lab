<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案 = 零区（末 k 位）里的非零「钉子户」个数</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：nums = [0,1,0,3,12]，k = 2 ⇒ 零区 = 末 2 位；红框 = 错位，绿框 = 已就位</text>

  <text x="227" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">非零区 · 前 n−k = 3 位</text>
  <text x="377" y="56" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">零区 · 末 k = 2 位</text>

  <text x="58" y="84" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">交换前</text>

  <rect x="110" y="64" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="170" y="64" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="230" y="64" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="290" y="64" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="350" y="64" width="54" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="137" y="86" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="199" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="257" y="86" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="317" y="86" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="377" y="86" text-anchor="middle" font-size="13" fill="#a0433f" font-weight="bold" filter="url(#rough2)">12</text>

  <text x="137" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="199" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="257" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="317" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="377" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 137 116 C 137 185, 377 185, 377 116" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 257 122 C 257 152, 407 152, 407 122" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="257" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">① 0 ↔ 3</text>
  <text x="332" y="136" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">② 2 ↔ 4</text>

  <text x="260" y="214" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每对虚线箭头 = 一次交换，两个错位同时归位</text>

  <text x="58" y="246" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">交换后</text>

  <rect x="110" y="228" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="170" y="228" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="230" y="228" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="290" y="228" width="54" height="34" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="350" y="228" width="54" height="34" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="137" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="199" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="257" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="317" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="377" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="415" y="250" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 全部就位</text>

  <rect x="30" y="274" width="460" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans = 零区中非零元素的个数 = 2</text>
  <text x="260" y="314" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">非零区的错位 0 与零区的错位非零数量相等（记作 a）</text>
  <text x="260" y="332" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">一次交换至多修复 2 个错位 ⇒ 至少 a 次；两两配对恰好 a 次 ⇒ 答案 = a</text>
</svg>
