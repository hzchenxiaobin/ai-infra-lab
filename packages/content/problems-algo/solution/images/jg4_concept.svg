<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arblue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arorange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arteal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a8a8a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">下标 = 节点，i±1 与同值点 = 出边</text>
  <path d="M 140 38 Q 280 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">arr = [7, 6, 9, 6, 9, 6, 9, 7]，每步可跳邻接或同值</text>

  <!-- row labels -->
  <text x="30" y="111" font-size="11" fill="#888">下标</text>
  <text x="30" y="139" font-size="11" fill="#888">值</text>

  <!-- 8 cells: x = 70,128,186,244,302,360,418,476 ; cx = 96,154,212,270,328,386,444,502 -->
  <!-- cell 0: val 7 (start) -->
  <g filter="url(#sk)">
    <rect x="70" y="92" width="52" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="70" y="120" width="52" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="96" y="111" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">0</text>
  <text x="96" y="139" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">7</text>
  <text x="96" y="86" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">起点</text>

  <!-- cell 1: val 6 -->
  <g filter="url(#sk)">
    <rect x="128" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="128" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="154" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">1</text>
  <text x="154" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- cell 2: val 9 -->
  <g filter="url(#sk)">
    <rect x="186" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="212" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">2</text>
  <text x="212" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- cell 3: val 6 -->
  <g filter="url(#sk)">
    <rect x="244" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="244" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="270" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">3</text>
  <text x="270" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- cell 4: val 9 -->
  <g filter="url(#sk)">
    <rect x="302" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="302" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="328" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">4</text>
  <text x="328" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- cell 5: val 6 -->
  <g filter="url(#sk)">
    <rect x="360" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="360" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="386" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">5</text>
  <text x="386" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- cell 6: val 9 -->
  <g filter="url(#sk)">
    <rect x="418" y="92" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="418" y="120" width="52" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="444" y="111" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">6</text>
  <text x="444" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- cell 7: val 7 (target) -->
  <g filter="url(#sk)">
    <rect x="476" y="92" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="476" y="120" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="502" y="111" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="502" y="139" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="502" y="86" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">目标</text>

  <!-- forward edges i->i+1 (blue, arcs above cells) -->
  <path d="M 110 92 Q 124 70 140 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 168 92 Q 182 70 198 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 226 92 Q 240 70 256 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 284 92 Q 298 70 314 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 342 92 Q 356 70 372 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 400 92 Q 414 70 430 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <path d="M 458 92 Q 472 70 488 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>

  <!-- same-value edges (arcs below cells) -->
  <!-- value 9: 2->4, 4->6 (teal, shallow) -->
  <path d="M 212 148 Q 270 174 328 148" stroke="#3a8a8a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arteal)" filter="url(#sk)"/>
  <path d="M 328 148 Q 386 174 444 148" stroke="#3a8a8a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arteal)" filter="url(#sk)"/>
  <!-- value 6: 1->3, 3->5 (orange, medium) -->
  <path d="M 154 148 Q 212 196 270 148" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arorange)" filter="url(#sk)"/>
  <path d="M 270 148 Q 328 196 386 148" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arorange)" filter="url(#sk)"/>
  <!-- value 7: 0->7 (red, deep, = answer) -->
  <path d="M 96 148 Q 299 250 502 148" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <text x="299" y="244" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">同值 7：0 → 7 一步到达！</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <line x1="60" y1="276" x2="90" y2="276" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="96" y="280" font-size="11" fill="#2b4b6e">i → i+1（邻接）</text>
  <g filter="url(#sk)">
    <line x1="200" y1="276" x2="230" y2="276" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="236" y="280" font-size="11" fill="#b03a3a">同值跳转 j（arr[i]==arr[j]）</text>
  <text x="412" y="280" font-size="10" fill="#888">虚线 = 同值点两两可达</text>

  <!-- info box -->
  <g filter="url(#sk)">
    <rect x="60" y="298" width="440" height="124" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">无权图最短路 → BFS 分层扩展</text>
  <path d="M 100 332 Q 280 338 460 332" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="12" fill="#444">
    <text x="76" y="354">· 节点 = 下标，边 = i±1 与同值跳转，边权均为 1</text>
    <text x="76" y="374">· BFS 首次到达 n−1 即为最少步数</text>
    <text x="76" y="394" fill="#7a5415">· 预建 值→下标表，同值边整批入队后</text>
    <text x="76" y="412" fill="#b03a3a" font-weight="bold">  立即清空该值的表，避免重复遍历 → O(n)</text>
  </g>
</svg>
