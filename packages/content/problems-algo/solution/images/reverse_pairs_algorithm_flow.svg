<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归并排序统计逆序对：算法流程</text>

  <!-- ===== Step 1: Entry ===== -->
  <rect x="170" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">mergeSort(lo, hi)</text>

  <path d="M 270 88 L 270 108" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Base case (diamond) ===== -->
  <polygon points="270,110 360,140 270,170 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">lo ≥ hi ?</text>
  <text x="270" y="154" text-anchor="middle" font-size="9" fill="#888">(区间长度 ≤ 1)</text>

  <!-- Yes branch -->
  <path d="M 360 140 L 420 140" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="126" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">return 0</text>

  <!-- No branch -->
  <path d="M 270 170 L 270 190" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="184" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Step 3: Compute mid ===== -->
  <rect x="150" y="192" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="215" text-anchor="middle" font-size="11" fill="#446688">mid = lo + (hi − lo) / 2</text>

  <path d="M 270 228 L 270 248" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Recursive calls ===== -->
  <rect x="60" y="250" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count += mergeSort(lo, mid)</text>
  <text x="160" y="286" text-anchor="middle" font-size="9" fill="#888">统计左半段内逆序对</text>

  <rect x="280" y="250" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count += mergeSort(mid+1, hi)</text>
  <text x="380" y="286" text-anchor="middle" font-size="9" fill="#888">统计右半段内逆序对</text>

  <path d="M 160 294 L 160 310 L 380 310 L 380 294" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 310 L 270 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Merge + count cross inversions ===== -->
  <rect x="100" y="328" width="340" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">count += merge(nums, lo, mid, hi)</text>
  <text x="270" y="368" text-anchor="middle" font-size="9" fill="#888">合并两段 + 统计跨段逆序对（核心步骤）</text>

  <path d="M 270 376 L 270 396" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 6: Return ===== -->
  <rect x="170" y="398" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="421" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return count</text>

  <!-- ===== Merge detail box ===== -->
  <text x="30" y="460" font-size="11" fill="#b85450" font-weight="bold">merge 内部：</text>
  <rect x="30" y="468" width="480" height="44" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="486" font-size="10" fill="#444">i=lo, j=mid+1, 双指针取较小者写入 tmp</text>
  <text x="48" y="502" font-size="10" fill="#b85450" font-weight="bold">if nums[j] &lt; nums[i]: count += mid − i + 1  ← 批量统计跨段逆序对</text>
</svg>
