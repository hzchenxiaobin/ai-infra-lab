<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 同余搜索 — 余数 0 不锁定，弹出判大小</text>

  <!-- Step 1: init digits -->
  <rect x="180" y="42" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整理 D = sorted(unique{d1, d2})</text>
  <path d="M 280 80 L 280 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: check nonzero -->
  <polygon points="280,94 410,130 280,166 150,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">D 中存在</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">非零数字？</text>

  <!-- No: return -1 -->
  <path d="M 150 130 L 90 130" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="114" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>

  <!-- Yes: enqueue first digits -->
  <path d="M 280 166 L 280 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="176" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="160" y="182" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入队首位 d&gt;0：enqueue(d, d%k)</text>
  <path d="M 280 220 L 280 232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: queue empty? -->
  <polygon points="280,234 380,268 280,302 180,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">队列为空？</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold"></text>

  <!-- Yes: return -1 -->
  <path d="M 380 268 L 470 268" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="425" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="470" y="252" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="505" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>

  <!-- No: pop (n, r) -->
  <path d="M 280 302 L 280 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="312" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <rect x="170" y="318" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出 (n, r) = queue.popleft()</text>
  <path d="M 280 350 L 280 362" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: r==0 and n>k? -->
  <polygon points="280,364 400,396 280,428 160,396" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r==0 且 n&gt;k？</text>

  <!-- Yes: return n -->
  <path d="M 400 396 L 470 396" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="435" y="390" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="470" y="380" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="401" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return n</text>

  <!-- No: extend -->
  <path d="M 280 428 L 280 442" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="440" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <rect x="100" y="444" width="360" height="0" fill="none"/>

  <!-- Extend box (bottom) -->
  <rect x="100" y="440" width="360" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">扩展：∀d∈D, nn=n×10+d, nr=(r×10+d)%k → 入队（nr=0 不标记 / nr≠0 且未 visited 则标记入队）</text>

  <!-- loop back arrow from extend to queue-empty check -->
  <path d="M 100 447 L 60 447 L 60 268 L 178 268" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <text x="40" y="440" font-size="9.5" fill="#888">虚线 = 回循环</text>
</svg>
