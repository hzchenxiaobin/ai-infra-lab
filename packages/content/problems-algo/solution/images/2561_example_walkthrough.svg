<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：basket1=[4,2,2,2]，basket2=[1,4,1,2]</text>

  <!-- baskets -->
  <text x="36" y="66" font-size="12" fill="#446688" font-weight="bold">basket1</text>
  <g font-size="13">
    <rect x="120" y="50" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="69" text-anchor="middle" fill="#333">4</text>
    <rect x="170" y="50" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="69" text-anchor="middle" fill="#333">2</text>
    <rect x="220" y="50" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="69" text-anchor="middle" fill="#333">2</text>
    <rect x="270" y="50" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="290" y="69" text-anchor="middle" fill="#333">2</text>
  </g>

  <text x="36" y="106" font-size="12" fill="#4a7a3a" font-weight="bold">basket2</text>
  <g font-size="13">
    <rect x="120" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="109" text-anchor="middle" fill="#333">1</text>
    <rect x="170" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="109" text-anchor="middle" fill="#333">4</text>
    <rect x="220" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="109" text-anchor="middle" fill="#333">1</text>
    <rect x="270" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="290" y="109" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- table -->
  <text x="36" y="142" font-size="11" fill="#888" font-weight="bold">频率统计（总数全为偶 → 可均分）</text>
  <rect x="60" y="150" width="520" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值</text>
  <text x="180" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b1</text>
  <text x="260" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b2</text>
  <text x="340" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">总</text>
  <text x="420" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">目标</text>
  <text x="540" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b1 盈余</text>

  <rect x="60" y="174" width="520" height="24" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="191" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="191" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="260" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="340" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="420" y="191" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1（→diff2）</text>

  <rect x="60" y="198" width="520" height="24" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="215" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="180" y="215" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="215" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="420" y="215" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="540" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1（→diff1）</text>

  <rect x="60" y="222" width="520" height="24" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="239" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="180" y="239" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="260" y="239" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="239" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="420" y="239" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="239" text-anchor="middle" font-size="11" fill="#888">0（平衡）</text>

  <!-- diff + pair -->
  <text x="36" y="278" font-size="11" fill="#888" font-weight="bold">盈余配对</text>
  <text x="60" y="300" font-size="12" fill="#446688" font-weight="bold">diff1 = [2]</text>
  <text x="200" y="300" font-size="12" fill="#4a7a3a" font-weight="bold">diff2 = [1]</text>
  <text x="360" y="300" font-size="12" fill="#d6a040" font-weight="bold">mn = min(全部) = 1</text>

  <rect x="60" y="316" width="520" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#333">配对 (2, 1)：直接 min(2,1)=1；中介 2×mn=2；取 min(1, 2)=1</text>
  <text x="320" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 1</text>

  <!-- example 2 note -->
  <rect x="36" y="374" width="568" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="398" font-size="12" fill="#444" font-weight="bold">反例（示例 2）：basket1=[2,3,4,1]，basket2=[3,2,5,1]</text>
  <text x="56" y="418" font-size="11" fill="#555">频率：4 出现 1 次、5 出现 1 次 → 均为奇数，无法均分到两篮</text>
  <text x="56" y="436" font-size="11" fill="#555">→ 返回 -1。判定准则：任一值总频为奇即无解。</text>
  <text x="56" y="454" font-size="11" fill="#888">关键：交换不改总频，故奇偶性是可行性的充要条件。</text>
</svg>
