<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：传递链 great∼good∼fine 使 great∼fine 成立</text>

  <!-- ===== Phase 1: build UF ===== -->
  <text x="40" y="50" font-size="11.5" fill="#888" font-weight="bold">阶段一：遍历 pairs 建并查集</text>

  <!-- column headers -->
  <text x="64" y="74" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">pair (a,b)</text>
  <text x="230" y="74" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">find(a)</text>
  <text x="340" y="74" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">find(b)</text>
  <text x="470" y="74" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">操作</text>
  <path d="M 30 80 L 560 80" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row: (great, good) -->
  <text x="64" y="100" text-anchor="middle" font-size="11" fill="#333">great,good</text>
  <text x="230" y="100" text-anchor="middle" font-size="11" fill="#333">great</text>
  <text x="340" y="100" text-anchor="middle" font-size="11" fill="#333">good</text>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a">parent[great]=good</text>

  <!-- row: (good, fine) -->
  <text x="64" y="122" text-anchor="middle" font-size="11" fill="#333">good,fine</text>
  <text x="230" y="122" text-anchor="middle" font-size="11" fill="#333">good</text>
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#333">fine</text>
  <text x="470" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">parent[good]=fine</text>

  <!-- row: (acting, drama) -->
  <text x="64" y="144" text-anchor="middle" font-size="11" fill="#333">acting,drama</text>
  <text x="230" y="144" text-anchor="middle" font-size="11" fill="#333">acting</text>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="#333">drama</text>
  <text x="470" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">parent[acting]=drama</text>

  <!-- row: (skills, talent) -->
  <text x="64" y="166" text-anchor="middle" font-size="11" fill="#333">skills,talent</text>
  <text x="230" y="166" text-anchor="middle" font-size="11" fill="#333">skills</text>
  <text x="340" y="166" text-anchor="middle" font-size="11" fill="#333">talent</text>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a">parent[skills]=talent</text>

  <!-- resulting forest summary -->
  <rect x="30" y="180" width="530" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#333">森林：fine←good←great　|　drama←acting　|　talent←skills</text>

  <!-- ===== Phase 2: per-position check ===== -->
  <text x="40" y="228" font-size="11.5" fill="#888" font-weight="bold">阶段二：逐位查同根</text>

  <!-- column headers -->
  <text x="60" y="250" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">轮次</text>
  <text x="160" y="250" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">s1[i]</text>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">s2[i]</text>
  <text x="430" y="250" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">find 比较</text>
  <path d="M 30 256 L 560 256" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=0: great vs fine (transitive!) -->
  <text x="60" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=0</text>
  <rect x="120" y="264" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">great</text>
  <rect x="220" y="264" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">fine</text>
  <text x="430" y="282" text-anchor="middle" font-size="10.5" fill="#444">find(great)=<tspan fill="#b85450" font-weight="bold">fine</tspan>=find(fine)</text>

  <!-- Row i=1: acting vs drama -->
  <text x="60" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=1</text>
  <rect x="120" y="296" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="314" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">acting</text>
  <rect x="220" y="296" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">drama</text>
  <text x="430" y="314" text-anchor="middle" font-size="10.5" fill="#444">find(acting)=<tspan fill="#b85450" font-weight="bold">drama</tspan>=find(drama)</text>

  <!-- Row i=2: skills vs talent -->
  <text x="60" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=2</text>
  <rect x="120" y="328" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">skills</text>
  <rect x="220" y="328" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">talent</text>
  <text x="430" y="346" text-anchor="middle" font-size="10.5" fill="#444">find(skills)=<tspan fill="#b85450" font-weight="bold">talent</tspan>=find(talent)</text>

  <!-- highlight band -->
  <rect x="30" y="260" width="530" height="86" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="30" y="360" width="530" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">三位同根 → 返回 true</text>

  <!-- key note -->
  <rect x="30" y="404" width="530" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="426" font-size="11" fill="#444" font-weight="bold">关键：i=0 时无直接配对 (great, fine)，但：</text>
  <text x="48" y="444" font-size="11" fill="#666">• 734 哈希集合查 "great#fine" → 不命中 → 返回 false（错误）</text>
  <text x="48" y="460" font-size="11" fill="#4a7a3a" font-weight="bold">• 737 并查集 find(great) 沿 good 找到根 fine = find(fine) → 同根 → 相似 ✓</text>
</svg>
