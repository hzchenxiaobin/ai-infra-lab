<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐位询问拼出 n（n = 31 与 n = 33）</text>

  <!-- panel 1: n = 31 -->
  <rect x="24" y="36" width="472" height="156" fill="#f5f7fa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：隐藏数 n = 31 = 11111₂（第 0~4 位为 1）</text>

  <text x="152" y="82" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">位号 i →</text>
  <text x="212" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="246" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="314" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="348" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="382" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="416" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="450" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="482" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">…</text>

  <text x="108" y="106" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">commonSetBits(2ⁱ)</text>
  <rect x="198" y="90" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="232" y="90" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="266" y="90" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="90" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="334" y="90" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="368" y="90" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="107" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="402" y="90" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="107" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="436" y="90" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="107" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="482" y="107" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <text x="108" y="140" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">拼入 n 的位值</text>
  <rect x="198" y="124" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="141" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2⁰</text>
  <rect x="232" y="124" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="141" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2¹</text>
  <rect x="266" y="124" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2²</text>
  <rect x="300" y="124" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="141" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2³</text>
  <rect x="334" y="124" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="348" y="141" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2⁴</text>
  <text x="382" y="141" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="416" y="141" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="450" y="141" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>

  <text x="260" y="178" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 2⁰ + 2¹ + 2² + 2³ + 2⁴ = 1 + 2 + 4 + 8 + 16 = 31 ✓</text>

  <!-- panel 2: n = 33 -->
  <rect x="24" y="204" width="472" height="156" fill="#f5f7fa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="226" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：隐藏数 n = 33 = 100001₂（第 0、5 位为 1）</text>

  <text x="152" y="250" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">位号 i →</text>
  <text x="212" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="246" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="280" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="314" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="348" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="382" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="416" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="450" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="482" y="250" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">…</text>

  <text x="108" y="274" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">commonSetBits(2ⁱ)</text>
  <rect x="198" y="258" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="232" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="266" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="300" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="334" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="368" y="258" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="402" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="436" y="258" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="275" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="482" y="275" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <text x="108" y="308" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">拼入 n 的位值</text>
  <rect x="198" y="292" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="309" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2⁰</text>
  <text x="246" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="280" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="314" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="348" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="368" y="292" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="382" y="309" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2⁵</text>
  <text x="416" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="450" y="309" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">·</text>

  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 2⁰ + 2⁵ = 1 + 32 = 33 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="370" width="440" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">30 次询问 = 30 盏指示灯：返回 1 点亮第 i 位，返回 0 熄灭；问完 30 盏，n 无遗漏</text>
</svg>
