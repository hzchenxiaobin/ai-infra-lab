<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：数「重复的值有几种」，不数「重复了几次」</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例：nums = [1,2,3,1,2,3,4]，k = 2 —— 答案 6</text>

  <!-- array cells -->
  <rect x="60" y="58" width="44" height="30" fill="#efefef" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="78" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">1</text>
  <rect x="106" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="152" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="198" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="290" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="336" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- indices -->
  <text x="82" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="128" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="174" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="220" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="266" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="312" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="358" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- window bracket -->
  <rect x="102" y="50" width="284" height="46" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="9" filter="url(#rough2)"/>
  <text x="82" y="50" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">被移出</text>
  <text x="404" y="70" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 [l..r] = [1..6]</text>
  <text x="404" y="88" font-size="10" fill="#4a7a3a" filter="url(#rough2)">长度 6 → 答案</text>

  <!-- freq panel -->
  <rect x="30" y="124" width="252" height="122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="144" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">窗口内频次表</text>
  <text x="42" y="168" font-size="11" fill="#333" filter="url(#rough2)">2 → 2 次</text>
  <text x="42" y="190" font-size="11" fill="#333" filter="url(#rough2)">3 → 2 次</text>
  <text x="42" y="212" font-size="11" fill="#333" filter="url(#rough2)">1 → 1 次</text>
  <text x="42" y="234" font-size="11" fill="#333" filter="url(#rough2)">4 → 1 次</text>
  <rect x="120" y="156" width="46" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="168.5" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重复!</text>
  <rect x="120" y="178" width="46" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="190.5" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重复!</text>

  <!-- rep box -->
  <rect x="300" y="124" width="230" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="144" font-size="11" fill="#333" filter="url(#rough2)">rep = 重复值的「种类数」= 2</text>
  <text x="312" y="166" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ≤ k = 2 ✓ 合法，长度 6</text>

  <!-- contrast box -->
  <rect x="300" y="188" width="230" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="208" font-size="11" fill="#333" filter="url(#rough2)">对照：全数组 [0..6] 一起框进来</text>
  <text x="312" y="230" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1、2、3 都重复 → rep = 3 &gt; 2 ✗</text>

  <!-- bottom note -->
  <rect x="30" y="262" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="42" y="282" font-size="11" fill="#333" filter="url(#rough2)">增量维护：加入 x 时频次恰从 1→2 才 rep++（2→3 不再加）；</text>
  <text x="42" y="300" font-size="11" fill="#333" filter="url(#rough2)">移出 x 时频次恰从 2→1 才 rep−−（3→2 不变）</text>
</svg>
