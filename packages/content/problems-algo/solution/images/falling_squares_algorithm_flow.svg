<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="490" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：双重循环 + 严格重叠判定</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">外层逐块落下，内层扫描已落方块查最高重叠顶</text>

  <!-- ===== init ===== -->
  <rect x="205" y="52" width="130" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">tops[], globalMax=0</text>
  <path d="M 270 90 L 270 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== for i ===== -->
  <rect x="170" y="106" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">for i = 0 … n−1</text>
  <path d="M 270 140 L 270 154" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== compute L,R,side ===== -->
  <rect x="145" y="156" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L = left_i,  R = L + side_i</text>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#446688">side = sideLength_i</text>
  <path d="M 270 200 L 270 214" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== for j container ===== -->
  <rect x="80" y="216" width="380" height="116" fill="none" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,2" rx="8" filter="url(#rough2)"/>
  <text x="96" y="234" font-size="10.5" fill="#888" font-weight="bold">for j = 0 … i−1</text>

  <!-- decision diamond -->
  <polygon points="250,246 350,288 250,330 150,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">max(L,Lj) &lt;</text>
  <text x="250" y="297" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">min(R,Rj) ?</text>

  <!-- yes -> base update -->
  <path d="M 350 288 L 384 288" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="282" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="384" y="270" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="418" y="285" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">base =</text>
  <text x="418" y="298" text-anchor="middle" font-size="8.5" fill="#4a7a3a">max(base,</text>
  <text x="418" y="308" text-anchor="middle" font-size="8.5" fill="#4a7a3a">tops[j])</text>

  <!-- no annotation -->
  <text x="158" y="324" font-size="10" fill="#888" font-weight="bold">否 → 跳过此 j</text>

  <!-- exit j loop down -->
  <path d="M 250 330 L 250 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="346" font-size="9.5" fill="#888">j 遍历完</text>

  <!-- ===== tops[i] ===== -->
  <rect x="155" y="354" width="230" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">tops[i] = base + side</text>
  <path d="M 270 392 L 270 406" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== update globalMax & ans ===== -->
  <rect x="130" y="408" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="10.5" fill="#4a7a3a">globalMax = max(globalMax, tops[i])</text>
  <text x="270" y="442" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans[i] = globalMax</text>

  <!-- loop back to for-i (right side) -->
  <path d="M 410 429 L 460 429 L 460 123 L 370 123" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="265" font-size="10" fill="#446688" font-weight="bold">下</text>
  <text x="468" y="278" font-size="10" fill="#446688" font-weight="bold">一</text>
  <text x="468" y="291" font-size="10" fill="#446688" font-weight="bold">块</text>
  <text x="468" y="304" font-size="10" fill="#446688" font-weight="bold">i</text>

  <!-- exit to return (i done) -->
  <path d="M 270 450 L 270 464" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="462" font-size="9.5" fill="#4a7a3a">i 遍历完</text>

  <!-- ===== return ===== -->
  <rect x="205" y="466" width="130" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="482" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return ans</text>
</svg>
