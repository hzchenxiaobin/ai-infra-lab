<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">方法二：补集转化——总数减去「每字符 ≤ k−1」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">「至少一字符 ≥ k」取逆否：「所有字符频次 ≤ k−1」——至多型，标准模板直接可用</text>

  <!-- 左半：容斥图 -->
  <ellipse cx="145" cy="185" rx="112" ry="92" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="158" cy="208" rx="60" ry="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">全部子串</text>
  <text x="140" y="130" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">n(n+1)/2 = 15</text>
  <text x="145" y="155" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">每字符 ≤ k−1：atMost(k−1) = 11</text>
  <text x="158" y="202" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">至少一字符 ≥ k</text>
  <text x="158" y="218" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">答案 = 4</text>

  <path d="M 208 244 C 196 264, 186 276, 174 288" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="292" width="210" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="309" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = 总数 − atMost(k−1)</text>
  <text x="145" y="326" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">= 15 − 11 = 4 ✓</text>

  <!-- 右上：模板要点 -->
  <rect x="278" y="76" width="228" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="96" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">「每字符 ≤ k−1」是至多型</text>
  <text x="392" y="114" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">好窗口对收缩封闭（子集仍好）</text>
  <text x="392" y="132" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">→ 直接套 shrink while bad：</text>
  <text x="392" y="150" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">坏 = 存在字符频次 &gt; k−1（over &gt; 0）</text>
  <text x="392" y="168" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">每轮收缩后</text>
  <text x="392" y="186" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ans += right − left + 1（数左边）</text>

  <!-- 右下：atMost 积木家族 -->
  <rect x="278" y="212" width="228" height="122" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="292" y="232" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">💡 同一副 atMost 积木</text>
  <text x="292" y="250" font-size="10" fill="#555" filter="url(#rough2)">· 713：乘积 &lt; k 的子数组</text>
  <text x="292" y="267" font-size="10" fill="#555" filter="url(#rough2)">· 992：不同整数 ≤ K（恰好 = 差分）</text>
  <text x="292" y="284" font-size="10" fill="#555" filter="url(#rough2)">· 1248：atMost(K) − atMost(K−1)</text>
  <text x="292" y="301" font-size="10" fill="#555" filter="url(#rough2)">· 2958：同谓词「每字符 ≤ k」，求最长</text>
  <text x="292" y="318" font-size="10" fill="#555" filter="url(#rough2)">· 3258：数右边的好子串（k 约束）</text>
</svg>
