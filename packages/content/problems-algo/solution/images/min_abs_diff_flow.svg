<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 求最小差 → 收集结果</text>

  <!-- Step 1: 排序 -->
  <rect x="170" y="48" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 对 arr 升序排序</text>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#666">sort(arr.begin(), arr.end())</text>

  <path d="M 260 94 L 260 112" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 求最小差 -->
  <rect x="150" y="114" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 线性扫描求最小差 minDiff</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#555">for i in 1..n-1:</text>
  <text x="260" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">minDiff = min(minDiff, arr[i]-arr[i-1])</text>

  <path d="M 260 172 L 260 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 收集 -->
  <rect x="140" y="192" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 再次扫描收集结果</text>
  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#555">for i in 1..n-1:</text>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">if arr[i]-arr[i-1]==minDiff: 收集 [arr[i-1],arr[i]]</text>

  <path d="M 260 250 L 260 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 返回 -->
  <rect x="170" y="270" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回结果列表</text>

  <!-- 说明框 -->
  <rect x="30" y="330" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="354" font-size="11" fill="#333" font-weight="bold">要点</text>
  <text x="50" y="372" font-size="10" fill="#555">• 排序保证升序，相邻差 arr[i]−arr[i−1] ≥ 0，无需 abs</text>
  <text x="50" y="388" font-size="10" fill="#555">• 排序保证结果对天然升序、a &lt; b，无需额外排序结果</text>
  <text x="50" y="402" font-size="10" fill="#4a7a3a" font-weight="bold">• 也可一遍扫描边更新 min 边清空结果，但两遍更清晰</text>
</svg>
