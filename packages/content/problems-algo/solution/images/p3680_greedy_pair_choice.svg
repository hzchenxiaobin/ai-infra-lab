<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：可行 ⟺ n ≥ 5 ；每天挑「剩余场次之和最大」的对阵</text>

  <rect x="18" y="40" width="484" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">每队打 2(n−1) 场，相邻两场至少隔 1 天 → 个人赛程至少跨 4n−5 天；总天数 = n(n−1)</text>
  <text x="260" y="84" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">n = 2, 3：计数直接否决 ｜ n = 4：11 ≤ 12 但结构矛盾仍无解 ｜ n ≥ 5：贪心恒可行</text>

  <text x="260" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">贪心每日选场 —— 状态快照（n = 5）</text>

  <!-- 昨日上场：队伍 0、1 -->
  <text x="56" y="142" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">队 0</text>
  <text x="112" y="142" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">队 1</text>
  <rect x="28" y="148" width="112" height="50" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="56" cy="174" rx="22" ry="22" fill="#eeeeee" stroke="#aaa" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">3</text>
  <ellipse cx="112" cy="174" rx="22" ry="22" fill="#eeeeee" stroke="#aaa" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">2</text>
  <text x="69" y="162" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="125" y="162" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="84" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">昨天上场 ✗</text>

  <!-- 今日可选：队伍 2、3、4 -->
  <text x="170" y="142" text-anchor="middle" font-size="11.5" fill="#2e4d24" filter="url(#rough2)">队 2</text>
  <text x="226" y="142" text-anchor="middle" font-size="11.5" fill="#2e4d24" filter="url(#rough2)">队 3</text>
  <text x="282" y="142" text-anchor="middle" font-size="11.5" fill="#2e4d24" filter="url(#rough2)">队 4</text>
  <rect x="142" y="148" width="112" height="50" rx="10" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="170" cy="174" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">5</text>
  <ellipse cx="226" cy="174" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="226" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">4</text>
  <ellipse cx="282" cy="174" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="282" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <text x="398" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">圈内数字</text>
  <text x="398" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 剩余场次</text>

  <!-- 候选对阵 -->
  <path d="M 196 200 C 180 226, 148 232, 130 248" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">今日候选（两队均休战）：主客场方向任选其一</text>
  <rect x="70" y="250" width="110" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="125" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">(2,3): 5+4=9 ★</text>
  <rect x="200" y="250" width="110" height="38" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(2,4): 5+1=6</text>
  <rect x="330" y="250" width="110" height="38" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(3,4): 4+1=5</text>

  <text x="260" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⟹ 今天安排 [2, 3]：剩余场次之和最大的一对</text>

  <rect x="18" y="328" width="484" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">「最急优先」：剩余场次多的队最容易卡死在赛程尾部，先让它们互相对阵</text>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">死路 = 剩余所有比赛都聚集在昨天那两队身上 —— 贪心让各队剩余保持均衡，避开死路</text>
</svg>
