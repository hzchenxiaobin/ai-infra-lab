<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：逐格扫描 + 花费分层转移 + 行滚动</text>

  <!-- 主干 -->
  <ellipse cx="140" cy="46" rx="34" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="51" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 140 61 L 140 76" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="80" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：prev[0][0] = 0，其余 −1</text>

  <path d="M 140 110 L 140 125" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="129" width="200" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">行优先取下一格 (i, j)</text>

  <path d="M 140 159 L 140 174" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="178" width="200" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">w = (v≠0)，s = v</text>
  <text x="140" y="206" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">逐层 c = 0 … k</text>

  <path d="M 140 212 L 140 226" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="140,230 208,258 140,286 72,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c ≥ w 且 上/左 的</text>
  <text x="140" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c−w 层 ≥ 0 ？</text>

  <!-- 是 → 右侧 -->
  <path d="M 208 258 L 262 258" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="234" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="266" y="228" width="236" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur[j][c] = max(prev[j][c−w],</text>
  <text x="384" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur[j−1][c−w]) + s</text>

  <!-- 否 → 下方 -->
  <path d="M 140 286 L 140 300" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="298" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="46" y="304" width="188" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cur[j][c] = −1（不可达）</text>

  <!-- 汇合到滚动 -->
  <path d="M 384 266 L 384 318 L 240 318" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 332 L 140 342 L 20 342 L 20 144 L 34 144" fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="336" font-size="9" fill="#666" filter="url(#rough2)">行末 swap(prev, cur) 滚动 → 下一格</text>

  <!-- 右上：终点结算面板 -->
  <rect x="290" y="42" width="212" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="62" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">终点结算（走完全部格子后）</text>
  <rect x="306" y="74" width="180" height="30" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="396" y="93" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = max(prev[n−1][0..k])</text>
  <polygon points="396,112 446,132 396,152 346,132" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="136" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans &lt; 0 ?</text>
  <text x="330" y="168" font-size="10" fill="#b85450" filter="url(#rough2)">是 → 返回 −1</text>
  <text x="424" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否 → 返回 ans</text>
  <path d="M 360 152 L 344 160" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 152 L 448 160" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部备注 -->
  <rect x="266" y="282" width="236" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="300" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">工程要点</text>
  <text x="278" y="316" font-size="9.5" fill="#333" filter="url(#rough2)">· 三维全开 = 200×200×1001×4B ≈ 160 MB 爆内存</text>
  <text x="278" y="331" font-size="9.5" fill="#333" filter="url(#rough2)">· 转移只依赖上一行 + 本行左列 ⇒ O(n·k) 滚动</text>
  <text x="278" y="344" font-size="9.5" fill="#666" filter="url(#rough2)">· −1 哨兵参与加法会「洗白」，必须先判 ≥0 再 +s</text>
</svg>
