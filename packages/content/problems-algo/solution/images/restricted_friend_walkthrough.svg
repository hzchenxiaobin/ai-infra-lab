<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5, 限制=[[0,1],[1,2],[2,3]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">逐请求处理，圆圈同色 = 同一连通块</text>

  <!-- ===== Row 1: request [0,4] -> true ===== -->
  <rect x="20" y="58" width="520" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="80" font-size="12" fill="#333" font-weight="bold">请求 0：[0, 4]</text>
  <!-- components: {0}{1}{2}{3}{4} -->
  <circle cx="70" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="110" cy="120" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="150" cy="120" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="190" cy="120" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="230" cy="120" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="40" y="150" font-size="10.5" fill="#666">合并前 5 个独立块</text>
  <!-- arrow -->
  <line x1="270" y1="120" x2="300" y2="120" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- check text -->
  <text x="312" y="92" font-size="11" fill="#444" font-weight="bold">查限制：</text>
  <text x="312" y="108" font-size="10.5" fill="#666">[0,1]: 0∈A,1∈B? 否</text>
  <text x="312" y="122" font-size="10.5" fill="#666">[1,2],[2,3]: 均无交叉</text>
  <text x="312" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">→ union(0,4) ✓</text>
  <!-- result badge -->
  <rect x="470" y="96" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="498" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 2: request [1,2] -> false ===== -->
  <rect x="20" y="170" width="520" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="12" fill="#333" font-weight="bold">请求 1：[1, 2]</text>
  <!-- components: {0,4}{1}{2}{3} -->
  <circle cx="70" cy="232" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="104" cy="232" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="84" y1="232" x2="90" y2="232" stroke="#7a4a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="232" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="190" cy="232" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="230" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="40" y="262" font-size="10.5" fill="#666">{0,4} 已合并</text>
  <line x1="270" y1="232" x2="300" y2="232" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="204" font-size="11" fill="#444" font-weight="bold">查限制：</text>
  <text x="312" y="220" font-size="10.5" fill="#b85450" font-weight="bold">[1,2]: find(1)==1 且 find(2)==2</text>
  <text x="312" y="234" font-size="10.5" fill="#b85450" font-weight="bold">→ fu==fx &amp;&amp; fv==fy 命中！</text>
  <text x="312" y="252" font-size="11" fill="#b85450" font-weight="bold">→ 拒绝，不合并 ✗</text>
  <rect x="470" y="208" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="498" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- ===== Row 3: request [3,1] -> true ===== -->
  <rect x="20" y="282" width="520" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="304" font-size="12" fill="#333" font-weight="bold">请求 2：[3, 1]</text>
  <!-- components: {0,4}{1}{2}{3} -->
  <circle cx="70" cy="344" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="104" cy="344" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="84" y1="344" x2="90" y2="344" stroke="#7a4a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="344" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="190" cy="344" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="230" cy="344" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="40" y="374" font-size="10.5" fill="#666">合并 {1} 与 {3}</text>
  <line x1="270" y1="344" x2="300" y2="344" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="316" font-size="11" fill="#444" font-weight="bold">查限制：</text>
  <text x="312" y="332" font-size="10.5" fill="#666">[0,1]: 0∉{1,3}, 无交叉</text>
  <text x="312" y="346" font-size="10.5" fill="#666">[1,2]: 2∉{3}, 无交叉</text>
  <text x="312" y="360" font-size="10.5" fill="#666">[2,3]: 2∉{1}, 无交叉</text>
  <text x="312" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">→ union(3,1) ✓</text>
  <rect x="470" y="320" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="498" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Row 4: request [3,4] -> false ===== -->
  <rect x="20" y="394" width="520" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="416" font-size="12" fill="#333" font-weight="bold">请求 3：[3, 4]</text>
  <!-- components: {0,4}{1,3}{2} -->
  <circle cx="70" cy="456" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="104" cy="456" r="14" fill="#f3e9fa" stroke="#7a4a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="84" y1="456" x2="90" y2="456" stroke="#7a4a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="456" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="184" cy="456" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="164" y1="456" x2="170" y2="456" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="230" cy="456" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="40" y="486" font-size="10.5" fill="#666">{0,4} 与 {1,3} 合?</text>
  <line x1="270" y1="456" x2="300" y2="456" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="428" font-size="11" fill="#444" font-weight="bold">查限制：</text>
  <text x="312" y="444" font-size="10.5" fill="#b85450" font-weight="bold">[0,1]: 0∈{0,4} 且 1∈{1,3}</text>
  <text x="312" y="458" font-size="10.5" fill="#b85450" font-weight="bold">→ fu==fx &amp;&amp; fv==fy 命中！</text>
  <text x="312" y="476" font-size="11" fill="#b85450" font-weight="bold">→ 拒绝，不合并 ✗</text>
  <rect x="470" y="432" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="498" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- final output -->
  <rect x="120" y="506" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="523" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">输出：[true, false, true, false] ✓</text>
</svg>
