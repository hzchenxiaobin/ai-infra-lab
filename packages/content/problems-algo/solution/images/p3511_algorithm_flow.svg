<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，发现坏段就在右端点「落针」</text>

  <!-- 开始 -->
  <rect x="130" y="36" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">预处理前缀和 pre；l = −1（尚无替换）；ans = 0</text>
  <path d="M 260 70 L 260 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="130" y="88" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">for r = 0 … n−1（r 为当前子数组右端点）</text>
  <path d="M 260 122 L 260 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,148 412,206 260,264 108,206" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">存在坏子数组 [a..r] 吗？</text>
  <text x="260" y="219" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">a &gt; l · 长度 3~5 · pre[r+1] − pre[a] ≤ 0</text>

  <!-- 是 → 替换 -->
  <text x="430" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 412 206 L 452 206 L 452 234" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="372" y="238" width="160" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">替换 nums[r] ← 10¹⁸</text>
  <text x="452" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">l = r；ans ← ans + 1</text>
  <path d="M 452 296 L 452 325 L 378 325" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 否 → 前进 -->
  <text x="273" y="288" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 264 L 260 304" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 前进框 -->
  <rect x="150" y="308" width="226" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="263" y="329" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">r ← r + 1；r &lt; n 则回到上方继续检查</text>

  <!-- 回环 -->
  <path d="M 150 325 L 58 325 L 58 206 L 102 206" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="98" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一轮</text>

  <!-- 结束 -->
  <path d="M 260 342 L 260 360" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="356" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">r = n 扫完</text>
  <rect x="150" y="364" width="226" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="263" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">返回 ans（最少替换次数）</text>
</svg>
