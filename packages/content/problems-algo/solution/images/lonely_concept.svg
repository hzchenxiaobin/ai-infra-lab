<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">孤独 = 频次为 1 且 x−1、x+1 均缺席</text>

  <!-- Number line concept: x-1, x, x+1 -->
  <text x="30" y="72" font-size="12" fill="#888">数轴视角：</text>

  <!-- x-1 slot (absent) -->
  <rect x="80" y="58" width="90" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="79" text-anchor="middle" font-size="13" fill="#aaa">x−1</text>
  <text x="125" y="104" text-anchor="middle" font-size="10" fill="#aaa">不存在 ✗</text>

  <!-- x slot (present, freq 1) -->
  <rect x="190" y="58" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x</text>
  <text x="235" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cnt[x] = 1 ✓</text>

  <!-- x+1 slot (absent) -->
  <rect x="300" y="58" width="90" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="79" text-anchor="middle" font-size="13" fill="#aaa">x+1</text>
  <text x="345" y="104" text-anchor="middle" font-size="10" fill="#aaa">不存在 ✗</text>

  <!-- lonely badge -->
  <rect x="430" y="60" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">⭐ 孤独</text>

  <!-- Frequency table -->
  <text x="30" y="150" font-size="12" fill="#888">频次表 cnt（值 → 出现次数）：</text>
  <rect x="80" y="158" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值</text>
  <text x="245" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">频次</text>
  <line x1="180" y1="158" x2="180" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="80" y="186" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <text x="245" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="80" y="212" width="220" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#aaa">x−1</text>
  <text x="245" y="228" text-anchor="middle" font-size="11" fill="#aaa">0（缺键）</text>

  <rect x="80" y="238" width="220" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#aaa">x+1</text>
  <text x="245" y="254" text-anchor="middle" font-size="11" fill="#aaa">0（缺键）</text>

  <!-- Three conditions summary -->
  <text x="30" y="298" font-size="12" fill="#555" font-weight="bold">三个条件 → 三次 O(1) 查表：</text>

  <rect x="40" y="308" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="328" text-anchor="middle" font-size="11" fill="#333">cnt[x] == 1 ✓</text>

  <rect x="215" y="308" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="11" fill="#333">cnt[x+1] == 0 ✓</text>

  <rect x="390" y="308" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="328" text-anchor="middle" font-size="11" fill="#333">cnt[x−1] == 0 ✓</text>

  <!-- arrows from conditions to badge -->
  <path d="M 490 340 Q 490 360 490 372" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="300" y="395" text-anchor="middle" font-size="11" fill="#888">关键：频次表把“某值出现几次”从 O(n) 扫描压成 O(1) 查询</text>
</svg>
