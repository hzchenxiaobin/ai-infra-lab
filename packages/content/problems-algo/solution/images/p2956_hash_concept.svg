<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：交集 C 定「谁命中」，计数回原数组</text>

  <!-- nums1 row -->
  <text x="76" y="70" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1</text>
  <rect x="84" y="48" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="104" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">4</text>
  <rect x="124" y="48" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="71" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="164" y="48" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="71" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="204" y="48" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="71" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="244" y="48" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="104" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="144" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="184" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="224" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="264" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- answer1 box -->
  <rect x="356" y="48" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="66" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer1 = 3</text>
  <text x="430" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">命中下标 1, 2, 3</text>
  <path d="M 290 70 L 352 70" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- nums2 row -->
  <text x="76" y="138" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2</text>
  <rect x="84" y="116" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="139" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="124" y="116" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="139" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="164" y="116" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="139" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>
  <rect x="204" y="116" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="139" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="244" y="116" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="139" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="284" y="116" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="139" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">6</text>
  <text x="104" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="144" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="184" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="224" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="264" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="304" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>

  <!-- answer2 box -->
  <rect x="356" y="116" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer2 = 4</text>
  <text x="430" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">命中下标 0, 1, 3, 4</text>
  <path d="M 330 138 L 352 138" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- intersection box -->
  <rect x="110" y="196" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">C = set(nums1) ∩ set(nums2) = {2, 3}</text>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">命中判定：元素的值 ∈ C ?（两个方向同理）</text>

  <!-- dashed arrows from both rows into C -->
  <path d="M 150 104 C 150 152, 172 176, 192 192" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 172 C 248 182, 254 186, 258 192" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom warning note -->
  <rect x="48" y="278" width="424" height="106" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 答案 ≠ |C| = 2：命中判定看 C，计数却回到原数组</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 2 在 nums2 中出现 3 次 → 贡献 3 次（answer2 = 4 的主体）</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 4、1 不在 C 中 → 在 nums1 里一次也不计</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· 只有当两数组元素互不相同时，answer1 = answer2 = |C| 才成立</text>
</svg>
