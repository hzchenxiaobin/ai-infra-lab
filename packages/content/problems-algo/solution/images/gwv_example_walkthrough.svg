<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：friends = [[1,2],[0,3],[0,3],[1,2]], id=0</text>

  <!-- Mini graph on left -->
  <text x="100" y="50" text-anchor="middle" font-size="10.5" fill="#888">好友图</text>
  <!-- edges -->
  <path d="M 70 90 L 130 70" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 70 110 L 130 130" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 70 L 200 90" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 130 L 200 110" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- nodes -->
  <circle cx="60" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="140" cy="64" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="68" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="140" cy="136" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <circle cx="210" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <!-- videos list small -->
  <text x="240" y="62" font-size="9.5" fill="#666">0→[A,B]</text>
  <text x="240" y="76" font-size="9.5" fill="#666">1→[C]</text>
  <text x="240" y="90" font-size="9.5" fill="#666">2→[B,C]</text>
  <text x="240" y="104" font-size="9.5" fill="#666">3→[D]</text>

  <!-- BFS layer table on right of graph -->
  <text x="380" y="50" text-anchor="middle" font-size="10.5" fill="#888">BFS 分层</text>
  <rect x="330" y="58" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="72" text-anchor="middle" font-size="10" fill="#333">层0: {0}</text>
  <rect x="330" y="82" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="96" text-anchor="middle" font-size="10" fill="#333">层1: {1, 2}</text>
  <rect x="330" y="106" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="120" text-anchor="middle" font-size="10" fill="#333">层2: {3}</text>

  <!-- Divider -->
  <path d="M 40 140 L 520 140" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- ====== Level 1 column ====== -->
  <rect x="40" y="152" width="230" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">level = 1</text>

  <text x="50" y="202" font-size="10.5" fill="#666">target 好友 = {1, 2}</text>
  <text x="50" y="220" font-size="10.5" fill="#666">视频汇总：</text>
  <rect x="50" y="228" width="210" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="243" font-size="10" fill="#333">1→[C]</text>
  <text x="130" y="243" font-size="10" fill="#333">2→[B, C]</text>

  <text x="50" y="270" font-size="10.5" fill="#666">频率统计：</text>
  <rect x="50" y="278" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="293" text-anchor="middle" font-size="10" fill="#333">B → 1</text>
  <rect x="160" y="278" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="293" text-anchor="middle" font-size="10" fill="#333">C → 2</text>

  <text x="50" y="320" font-size="10.5" fill="#666">排序 (频率↑, 字母↑)：</text>
  <rect x="50" y="328" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">B</text>
  <text x="75" y="364" text-anchor="middle" font-size="9" fill="#888">freq=1</text>
  <rect x="110" y="328" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>
  <text x="135" y="364" text-anchor="middle" font-size="9" fill="#888">freq=2</text>
  <rect x="50" y="376" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="396" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输出 ["B","C"] ✓</text>

  <!-- ====== Level 2 column ====== -->
  <rect x="290" y="152" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">level = 2</text>

  <text x="300" y="202" font-size="10.5" fill="#666">target 好友 = {3}</text>
  <text x="300" y="220" font-size="10.5" fill="#666">视频汇总：</text>
  <rect x="300" y="228" width="210" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="243" text-anchor="middle" font-size="10" fill="#333">3→[D]</text>

  <text x="300" y="270" font-size="10.5" fill="#666">频率统计：</text>
  <rect x="300" y="278" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="293" text-anchor="middle" font-size="10" fill="#333">D → 1</text>

  <text x="300" y="320" font-size="10.5" fill="#666">排序 (频率↑, 字母↑)：</text>
  <rect x="320" y="328" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">D</text>
  <text x="345" y="364" text-anchor="middle" font-size="9" fill="#888">freq=1</text>
  <rect x="290" y="376" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="396" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输出 ["D"] ✓</text>
</svg>
