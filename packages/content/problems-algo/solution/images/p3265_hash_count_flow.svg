<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：补零定长 → 枚举变体 → 先查后插</text>

  <!-- 左列主流程 -->
  <rect x="40" y="40" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="145" y="58" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>

  <rect x="40" y="84" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="103" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">取下一个数 x</text>

  <rect x="40" y="132" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="148" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">补前导 0 到 7 位</text>
  <text x="145" y="164" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">t = "0000030"</text>

  <rect x="40" y="186" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="202" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">枚举 C(7,2)=21 种两位交换</text>
  <text x="145" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">S = { t } ∪ 全部变体（set 去重）</text>

  <!-- 右列查询/插入/判定 -->
  <rect x="280" y="110" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="128" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">查询：ans += Σ seen[v]</text>
  <text x="390" y="144" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">v ∈ S（含 t 自身 → 覆盖零次操作）</text>

  <rect x="280" y="170" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="192" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">插入：seen[t] += 1</text>

  <polygon points="390,222 462,245 390,268 318,245" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">还有数？</text>

  <rect x="330" y="292" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="390" y="310" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 连线 -->
  <path d="M 145 66 L 145 82" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 145 114 L 145 130" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 145 170 L 145 184" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 205 L 265 205 L 265 131 L 278 131" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 152 L 390 168" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 206 L 390 220" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 245 L 20 245 L 20 99 L 38 99" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="238" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是（下一个数）</text>
  <path d="M 390 268 L 390 290" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="284" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 底部警示 -->
  <rect x="40" y="326" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">⚠ 先查后插：顺序颠倒，x 会命中自己刚插入的变体，凭空多算</text>
</svg>
