<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三表 LEFT JOIN → 归组 → SUM + COALESCE</text>

  <!-- detail table header -->
  <rect x="30" y="50" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sp_id</text>
  <text x="160" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">name</text>
  <text x="260" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">customer_id</text>
  <text x="370" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sale_id</text>
  <text x="470" y="69" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">price</text>

  <!-- detail rows -->
  <g font-size="11" fill="#333">
    <text x="60"  y="96" text-anchor="middle">1</text>
    <text x="160" y="96" text-anchor="middle">Alice</text>
    <text x="260" y="96" text-anchor="middle">1</text>
    <text x="370" y="96" text-anchor="middle">2</text>
    <text x="470" y="96" text-anchor="middle">354</text>

    <text x="60"  y="116" text-anchor="middle">1</text>
    <text x="160" y="116" text-anchor="middle">Alice</text>
    <text x="260" y="116" text-anchor="middle">2</text>
    <text x="370" y="116" text-anchor="middle">1</text>
    <text x="470" y="116" text-anchor="middle">892</text>

    <text x="60"  y="136" text-anchor="middle">2</text>
    <text x="160" y="136" text-anchor="middle">Bob</text>
    <text x="260" y="136" text-anchor="middle">3</text>
    <text x="370" y="136" text-anchor="middle">3</text>
    <text x="470" y="136" text-anchor="middle">988</text>

    <text x="60"  y="156" text-anchor="middle">2</text>
    <text x="160" y="156" text-anchor="middle">Bob</text>
    <text x="260" y="156" text-anchor="middle">3</text>
    <text x="370" y="156" text-anchor="middle">4</text>
    <text x="470" y="156" text-anchor="middle">856</text>
  </g>

  <!-- Jerry NULL row (highlighted) -->
  <rect x="30" y="164" width="540" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#b85450" font-weight="bold">
    <text x="60"  y="180" text-anchor="middle">3</text>
    <text x="160" y="180" text-anchor="middle">Jerry</text>
    <text x="260" y="180" text-anchor="middle">NULL</text>
    <text x="370" y="180" text-anchor="middle">NULL</text>
    <text x="470" y="180" text-anchor="middle">NULL</text>
  </g>

  <!-- row separators -->
  <line x1="30" y1="78"  x2="570" y2="78"  stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="104" x2="570" y2="104" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="124" x2="570" y2="124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="144" x2="570" y2="144" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="164" x2="570" y2="164" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="186" x2="570" y2="186" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <!-- arrow down to grouped result -->
  <path d="M 300 194 L 300 216" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="380" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">GROUP BY sp_id + SUM + COALESCE</text>

  <!-- output table -->
  <rect x="150" y="222" width="300" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出</text>
  <line x1="160" y1="250" x2="440" y2="250" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">salesperson_id</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">name</text>
  <text x="390" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">influence</text>
  <line x1="255" y1="254" x2="255" y2="374" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <line x1="345" y1="254" x2="345" y2="374" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="274" x2="440" y2="274" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" fill="#333">
    <text x="210" y="294" text-anchor="middle">1</text>
    <text x="300" y="294" text-anchor="middle">Alice</text>
    <text x="390" y="294" text-anchor="middle">1246</text>

    <text x="210" y="318" text-anchor="middle">2</text>
    <text x="300" y="318" text-anchor="middle">Bob</text>
    <text x="390" y="318" text-anchor="middle">1844</text>
  </g>

  <!-- Jerry output row highlighted -->
  <rect x="160" y="328" width="280" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#d6a040" font-weight="bold">
    <text x="210" y="344" text-anchor="middle">3</text>
    <text x="300" y="344" text-anchor="middle">Jerry</text>
    <text x="390" y="344" text-anchor="middle">0</text>
  </g>

  <text x="300" y="404" text-anchor="middle" font-size="10" fill="#888">Alice：354+892=1246；Bob：988+856=1844；Jerry：NULL→0</text>
</svg>
