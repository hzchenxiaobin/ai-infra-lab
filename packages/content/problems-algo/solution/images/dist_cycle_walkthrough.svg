<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：剥叶子 seq=[0,6,5]，再反向填距离</text>

  <!-- ===== Table 1: peeling phase ===== -->
  <text x="20" y="48" font-size="11" fill="#888" font-weight="bold">阶段一：剥叶子（外→内）</text>

  <!-- header -->
  <rect x="20" y="54" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="70" y="54" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">出队 i</text>
  <rect x="140" y="54" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[i]</text>
  <rect x="210" y="54" width="390" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- row 1: i=0 -->
  <rect x="20" y="80" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="70" y="80" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="140" y="80" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="210" y="80" width="390" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="100" text-anchor="middle" font-size="11" fill="#444">g[1] 删 0 → deg[1]=2，不入队</text>

  <!-- row 2: i=6 -->
  <rect x="20" y="110" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="70" y="110" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="140" y="110" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="130" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="210" y="110" width="390" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="130" text-anchor="middle" font-size="11" fill="#444">g[5] 删 6 → deg[5]=1，5 入队</text>

  <!-- row 3: i=5 -->
  <rect x="20" y="140" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="70" y="140" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="140" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="160" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="210" y="140" width="390" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="160" text-anchor="middle" font-size="11" fill="#444">g[2] 删 5 → deg[2]=2，不入队</text>

  <!-- summary row -->
  <rect x="20" y="170" width="580" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">队列空 → 剩 {1,2,3,4} 为环，ans 全 0；seq = [0,6,5]</text>

  <!-- ===== Table 2: fill phase ===== -->
  <text x="20" y="222" font-size="11" fill="#888" font-weight="bold">阶段二：反向填距离（内→外）</text>

  <!-- header -->
  <rect x="20" y="228" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反向 i</text>
  <rect x="110" y="228" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[i]</text>
  <rect x="200" y="228" width="400" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans[i] = ans[f[i]] + 1</text>

  <!-- row 1: i=5 -->
  <rect x="20" y="254" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="110" y="254" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="274" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="200" y="254" width="400" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="274" text-anchor="middle" font-size="11" fill="#444">ans[5] = ans[2] + 1 = 0 + 1 = 1</text>

  <!-- row 2: i=6 -->
  <rect x="20" y="284" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="110" y="284" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="304" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="200" y="284" width="400" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="304" text-anchor="middle" font-size="11" fill="#444">ans[6] = ans[5] + 1 = 1 + 1 = 2</text>

  <!-- row 3: i=0 -->
  <rect x="20" y="314" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="314" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="334" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="200" y="314" width="400" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#444">ans[0] = ans[1] + 1 = 0 + 1 = 1</text>

  <!-- key insight -->
  <rect x="20" y="356" width="580" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">为何反向？seq 外→内记录，反向即内→外</text>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#666">处理 i 时 f[i] 更靠近环、已在 seq 更靠后 ⇒ 反向时先算好</text>

  <!-- final answer -->
  <rect x="20" y="412" width="580" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终答案：ans = [1, 0, 0, 0, 0, 1, 2]</text>
  <text x="310" y="450" text-anchor="middle" font-size="10" fill="#888">环上节点 1,2,3,4 距离为 0；树枝按到环的跳数递增</text>
</svg>
