<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2810w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "string" → "rtsng"</text>

  <!-- header row -->
  <text x="70" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">输入字符</text>
  <text x="200" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">dir（方向）</text>
  <text x="380" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">双端队列状态（front → back）</text>

  <!-- step 1: s -->
  <rect x="20" y="66" width="540" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">s</text>
  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正 →</text>
  <rect x="330" y="74" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s</text>
  <text x="430" y="90" font-size="9" fill="#4a7a3a">后插</text>

  <!-- step 2: t -->
  <text x="70" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">t</text>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正 →</text>
  <rect x="330" y="108" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s</text>
  <rect x="362" y="108" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">t</text>
  <text x="430" y="124" font-size="9" fill="#4a7a3a">后插</text>

  <!-- step 3: r -->
  <text x="70" y="158" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">r</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正 →</text>
  <rect x="330" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s</text>
  <rect x="362" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="394" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">r</text>
  <text x="450" y="158" font-size="9" fill="#4a7a3a">后插</text>

  <!-- step 4: i (toggle) -->
  <rect x="20" y="174" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="70" y="198" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i</text>
  <text x="200" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">正 → 反 ←</text>
  <rect x="330" y="182" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">s</text>
  <rect x="362" y="182" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">t</text>
  <rect x="394" y="182" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">r</text>
  <text x="440" y="198" font-size="9" fill="#b85450" font-weight="bold">翻转标记，不搬数据</text>

  <!-- step 5: n (push front) -->
  <text x="70" y="232" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">n</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">反 ←</text>
  <rect x="313" y="216" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="235" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n</text>
  <rect x="345" y="216" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">s</text>
  <rect x="377" y="216" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="235" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">t</text>
  <rect x="409" y="216" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="235" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">r</text>
  <text x="455" y="232" font-size="9" fill="#b85450">前插</text>

  <!-- step 6: g (push front) -->
  <text x="70" y="266" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">g</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">反 ←</text>
  <rect x="296" y="250" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="269" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">g</text>
  <rect x="328" y="250" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="343" y="269" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n</text>
  <rect x="360" y="250" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="269" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">s</text>
  <rect x="392" y="250" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="407" y="269" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">t</text>
  <rect x="424" y="250" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="439" y="269" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">r</text>
  <text x="465" y="266" font-size="9" fill="#b85450">前插</text>

  <!-- separator -->
  <line x1="40" y1="300" x2="520" y2="300" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- final read -->
  <rect x="20" y="312" width="540" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">遍历结束，dir=反：</text>

  <text x="50" y="362" font-size="10" fill="#4a7a3a">队列 front→back：</text>
  <rect x="170" y="346" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="364" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">g</text>
  <rect x="200" y="346" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="364" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n</text>
  <rect x="230" y="346" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="364" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">s</text>
  <rect x="260" y="346" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="364" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">t</text>
  <rect x="290" y="346" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="364" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">r</text>

  <path d="M330,358 L370,358" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2810w)" filter="url(#rough2)"/>
  <text x="350" y="350" text-anchor="middle" font-size="9" fill="#4a7a3a">逆序读出</text>

  <rect x="380" y="346" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">r</text>
  <rect x="410" y="346" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="424" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="440" y="346" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="454" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">s</text>
  <rect x="470" y="346" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="484" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n</text>
  <rect x="500" y="346" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="514" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">g</text>

  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果 = "rtsng" ✓</text>

  <!-- note -->
  <rect x="20" y="404" width="540" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="426" font-size="11" fill="#d6a040" font-weight="bold">关键：</text>
  <text x="90" y="426" font-size="10" fill="#555">'i' 只翻转方向标记，队列内容不动；其他字符按当前方向从对应端 O(1) 插入</text>
  <text x="40" y="448" font-size="10" fill="#555">结束时若 dir=反，整体逆序读一次即可——全程无真翻转，O(n) 一步到位</text>
</svg>
