<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "84532", t = "34852"</text>

  <!-- ===== Left: position queues ===== -->
  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s 中各数字的位置队列</text>

  <!-- queue rows: digit → [positions] -->
  <!-- 2 → [4] -->
  <rect x="36" y="60" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="78" y="77" font-size="11" fill="#888">→</text>
  <rect x="92" y="60" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="77" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">4</text>

  <!-- 3 → [3] -->
  <rect x="36" y="90" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="78" y="107" font-size="11" fill="#888">→</text>
  <rect x="92" y="90" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="107" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">3</text>

  <!-- 4 → [1] -->
  <rect x="36" y="120" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="78" y="137" font-size="11" fill="#888">→</text>
  <rect x="92" y="120" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="137" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1</text>

  <!-- 5 → [2] -->
  <rect x="36" y="150" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="78" y="167" font-size="11" fill="#888">→</text>
  <rect x="92" y="150" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="167" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">2</text>

  <!-- 8 → [0] -->
  <rect x="36" y="180" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="53" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="78" y="197" font-size="11" fill="#888">→</text>
  <rect x="92" y="180" width="34" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="197" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">0</text>

  <!-- s string visualization -->
  <text x="110" y="226" text-anchor="middle" font-size="10" fill="#888">s = 8 4 5 3 2</text>
  <text x="110" y="240" text-anchor="middle" font-size="9" fill="#aaa">下标: 0 1 2 3 4</text>

  <!-- ===== Right: step table ===== -->
  <text x="395" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">逐字符处理 t = "34852"</text>

  <!-- table header -->
  <rect x="180" y="58" width="370" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="200" y="73" font-size="9" fill="#888" font-weight="bold">步</text>
  <text x="240" y="73" font-size="9" fill="#888" font-weight="bold">t[i]</text>
  <text x="285" y="73" font-size="9" fill="#888" font-weight="bold">d</text>
  <text x="330" y="73" font-size="9" fill="#888" font-weight="bold">s中位置</text>
  <text x="400" y="73" font-size="9" fill="#888" font-weight="bold">检查 0..d−1</text>
  <text x="515" y="73" font-size="9" fill="#888" font-weight="bold">结果</text>

  <!-- Step 1: t[0]='3', d=3, pos=3, check 0,1,2 empty -->
  <rect x="180" y="82" width="370" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="240" y="98" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">'3'</text>
  <text x="285" y="98" text-anchor="middle" font-size="10" fill="#444">3</text>
  <text x="335" y="98" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">3</text>
  <text x="400" y="98" text-anchor="middle" font-size="9" fill="#888">0,1,2 全空</text>
  <text x="515" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 2: t[1]='4', d=4, pos=1, check 0-3: 3 used -->
  <rect x="180" y="108" width="370" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="240" y="124" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">'4'</text>
  <text x="285" y="124" text-anchor="middle" font-size="10" fill="#444">4</text>
  <text x="335" y="124" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">1</text>
  <text x="400" y="124" text-anchor="middle" font-size="9" fill="#888">3 已取, 余空</text>
  <text x="515" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 3: t[2]='8', d=8, pos=0, check 0-7 all used -->
  <rect x="180" y="134" width="370" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="240" y="150" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">'8'</text>
  <text x="285" y="150" text-anchor="middle" font-size="10" fill="#444">8</text>
  <text x="335" y="150" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">0</text>
  <text x="400" y="150" text-anchor="middle" font-size="9" fill="#888">0–7 全已取/空</text>
  <text x="515" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 4: t[3]='5', d=5, pos=2, check 0-4 all used -->
  <rect x="180" y="160" width="370" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="240" y="176" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">'5'</text>
  <text x="285" y="176" text-anchor="middle" font-size="10" fill="#444">5</text>
  <text x="335" y="176" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">2</text>
  <text x="400" y="176" text-anchor="middle" font-size="9" fill="#888">0–4 全已取/空</text>
  <text x="515" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 5: t[4]='2', d=2, pos=4, check 0,1 empty -->
  <rect x="180" y="186" width="370" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="240" y="202" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">'2'</text>
  <text x="285" y="202" text-anchor="middle" font-size="10" fill="#444">2</text>
  <text x="335" y="202" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">4</text>
  <text x="400" y="202" text-anchor="middle" font-size="9" fill="#888">0,1 空</text>
  <text x="515" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Conclusion -->
  <path d="M 280 218 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="240" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全部匹配 → 返回 true</text>

  <!-- ===== Bottom: Example 3 contrast ===== -->
  <rect x="30" y="290" width="500" height="190" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">对比示例 3：s = "12345", t = "12435" → false</text>

  <!-- mini queue for example 3 -->
  <text x="100" y="334" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">位置队列</text>
  <text x="55" y="352" font-size="10" fill="#444">1 → [0]</text>
  <text x="55" y="368" font-size="10" fill="#444">2 → [1]</text>
  <text x="55" y="384" font-size="10" fill="#b85450" font-weight="bold">3 → [2]</text>
  <text x="55" y="400" font-size="10" fill="#d6a040" font-weight="bold">4 → [3]</text>
  <text x="55" y="416" font-size="10" fill="#444">5 → [4]</text>

  <!-- step table for example 3 -->
  <text x="360" y="334" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">处理 t = "12435"</text>

  <rect x="200" y="340" width="320" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="215" y="354" font-size="9" fill="#888">步</text>
  <text x="250" y="354" font-size="9" fill="#888">t[i]</text>
  <text x="300" y="354" font-size="9" fill="#888">s位置</text>
  <text x="380" y="354" font-size="9" fill="#888">检查</text>
  <text x="500" y="354" font-size="9" fill="#888">结果</text>

  <rect x="200" y="362" width="320" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="215" y="376" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="250" y="376" font-size="9" fill="#444">'1'</text>
  <text x="305" y="376" font-size="9" fill="#444" font-family="monospace">0</text>
  <text x="380" y="376" font-size="9" fill="#888">0空</text>
  <text x="500" y="376" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="200" y="384" width="320" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="215" y="398" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="250" y="398" font-size="9" fill="#444">'2'</text>
  <text x="305" y="398" font-size="9" fill="#444" font-family="monospace">1</text>
  <text x="380" y="398" font-size="9" fill="#888">1已取,0空</text>
  <text x="500" y="398" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="200" y="406" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="215" y="420" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="420" font-size="9" fill="#444">'4'</text>
  <text x="305" y="420" font-size="9" fill="#444" font-family="monospace">3</text>
  <text x="380" y="420" font-size="9" fill="#b85450" font-weight="bold">3在位置2&lt;3</text>
  <text x="500" y="420" font-size="9" fill="#b85450" font-weight="bold">✗</text>

  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 的前方有 3 &lt; 4（位置 2 &lt; 3）→ 被挡住，返回 false</text>
  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#888">排序时 3 永远排在 4 前面，4 无法越过 3</text>
</svg>
