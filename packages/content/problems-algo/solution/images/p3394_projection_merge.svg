<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：投影成一维区间，排序合并，块数 ≥ 3 就能切</text>

  <!-- 2D grid sketch -->
  <g filter="url(#rough2)">
    <rect x="35" y="48" width="150" height="130" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="2"/>
    <line x1="65" y1="48" x2="65" y2="178" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="95" y1="48" x2="95" y2="178" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="125" y1="48" x2="125" y2="178" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="155" y1="48" x2="155" y2="178" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="35" y1="74" x2="185" y2="74" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="35" y1="100" x2="185" y2="100" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="35" y1="126" x2="185" y2="126" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="35" y1="152" x2="185" y2="152" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="50" y="64" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3"/>
    <text x="77" y="90" text-anchor="middle" font-size="11" fill="#446688">R1</text>
    <rect x="118" y="118" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="144" y="144" text-anchor="middle" font-size="11" fill="#a0761e">R2</text>
    <line x1="110" y1="42" x2="110" y2="186" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="110" y="38" text-anchor="middle" font-size="11" fill="#b85450">x = c</text>
    <text x="110" y="200" text-anchor="middle" font-size="11" fill="#666">竖直切一刀：矩形不能被线穿过</text>
  </g>

  <!-- projection arrow -->
  <g filter="url(#rough2)">
    <path d="M190,113 Q206,100 222,113" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="206" y="96" text-anchor="middle" font-size="11" fill="#446688">投影</text>
  </g>

  <!-- observation boxes -->
  <g filter="url(#rough2)">
    <rect x="228" y="55" width="262" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="359" y="76" text-anchor="middle" font-size="12" fill="#2d3f57">观察①：竖直线合不合法，只看矩形的</text>
    <text x="359" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3f57">x 投影 [sx, ex]，与 y 无关</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="228" y="117" width="262" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="359" y="138" text-anchor="middle" font-size="12" fill="#7a5c1e">观察②：切两刀 ⟺ 投影被分成 3 组，</text>
    <text x="359" y="157" text-anchor="middle" font-size="12" fill="#7a5c1e">排序扫描数「块」，块数 ≥ 3 即可切</text>
  </g>

  <!-- sorted interval bars: value v -> px = 60 + v*45 -->
  <text x="260" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">把 x 投影按左端点排序，从左往右合并：</text>

  <g filter="url(#rough2)">
    <!-- block frames -->
    <rect x="54" y="218" width="147" height="46" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <rect x="234" y="218" width="102" height="46" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <rect x="369" y="218" width="57" height="46" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <text x="127" y="214" text-anchor="middle" font-size="10.5" fill="#446688">块 1</text>
    <text x="285" y="214" text-anchor="middle" font-size="10.5" fill="#a0761e">块 2</text>
    <text x="397" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a">块 3</text>

    <!-- intervals -->
    <rect x="60" y="226" width="90" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="105" y="245" width="90" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="240" y="226" width="45" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="240" y="245" width="90" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="375" y="235" width="45" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>

    <!-- cut lines -->
    <line x1="217" y1="222" x2="217" y2="304" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="217" y="220" text-anchor="middle" font-size="12" fill="#b85450">✂</text>
    <line x1="352" y1="222" x2="352" y2="304" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="352" y="220" text-anchor="middle" font-size="12" fill="#b85450">✂</text>

    <!-- axis -->
    <line x1="60" y1="300" x2="420" y2="300" stroke="#666" stroke-width="1.5"/>
    <line x1="60" y1="296" x2="60" y2="304" stroke="#666" stroke-width="1.2"/>
    <line x1="105" y1="297" x2="105" y2="303" stroke="#666" stroke-width="1"/>
    <line x1="150" y1="296" x2="150" y2="304" stroke="#666" stroke-width="1.2"/>
    <line x1="195" y1="297" x2="195" y2="303" stroke="#666" stroke-width="1"/>
    <line x1="240" y1="296" x2="240" y2="304" stroke="#666" stroke-width="1.2"/>
    <line x1="285" y1="297" x2="285" y2="303" stroke="#666" stroke-width="1"/>
    <line x1="330" y1="296" x2="330" y2="304" stroke="#666" stroke-width="1.2"/>
    <line x1="375" y1="297" x2="375" y2="303" stroke="#666" stroke-width="1"/>
    <line x1="420" y1="296" x2="420" y2="304" stroke="#666" stroke-width="1.2"/>
    <text x="60" y="318" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="150" y="318" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="240" y="318" text-anchor="middle" font-size="11" fill="#666">4</text>
    <text x="330" y="318" text-anchor="middle" font-size="11" fill="#666">6</text>
    <text x="420" y="318" text-anchor="middle" font-size="11" fill="#666">8</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="45" y="330" width="430" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="353" text-anchor="middle" font-size="12.5" fill="#2d4d22">扫描规则：新区间 s ≥ maxEnd → 开新块（此处可切一刀）</text>
    <text x="260" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d4d22">块数 ≥ 3 ⟺ 两刀切出三个非空部分 → 返回 true</text>
  </g>
</svg>
