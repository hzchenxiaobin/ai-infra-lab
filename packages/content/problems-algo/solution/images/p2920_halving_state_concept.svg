<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">方法②作用整个子树 → 只需记住祖先链上的「减半次数 t」</text>

  <!-- subtree halo -->
  <rect x="64" y="106" width="128" height="216" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="128" y="336" text-anchor="middle" font-size="10" fill="#d6a040">方法②影响的是整个子树</text>

  <!-- chain 0 -> 1 -> 2 -> 3 -->
  <rect x="98" y="48" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="126" y="64" text-anchor="middle" font-size="11" fill="#888">节点 0</text>
  <text x="126" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">coins=10</text>

  <path d="M 126 90 L 126 112" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="98" y="116" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="126" y="132" text-anchor="middle" font-size="11" fill="#888">节点 1</text>
  <text x="126" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">coins=10</text>

  <path d="M 126 158 L 126 180" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="152" y="158" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="169" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">方法②</text>

  <rect x="98" y="184" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="126" y="200" text-anchor="middle" font-size="11" fill="#888">节点 2</text>
  <text x="126" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">coins=3</text>

  <path d="M 126 226 L 126 248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="98" y="252" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="126" y="268" text-anchor="middle" font-size="11" fill="#888">节点 3</text>
  <text x="126" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">coins=3</text>

  <path d="M 156 272 Q 196 268 214 258" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="250" font-size="11" fill="#b85450">实际金币 = 3 &gt;&gt; 1 = 1</text>

  <!-- right column -->
  <rect x="250" y="56" width="252" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="376" y="80" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">嵌套减半可以合并</text>
  <text x="376" y="102" text-anchor="middle" font-size="11" fill="#333">⌊⌊x/2⌋/2⌋ = ⌊x/2^t⌋ = x &gt;&gt; t</text>
  <text x="376" y="122" text-anchor="middle" font-size="11" fill="#555">t = 严格祖先中选方法②的个数</text>

  <rect x="250" y="150" width="252" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="376" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">t 只有 15 档！</text>
  <text x="376" y="196" text-anchor="middle" font-size="11" fill="#333">coins[i] ≤ 10⁴ &lt; 2¹⁴</text>
  <text x="376" y="216" text-anchor="middle" font-size="11" fill="#555">t ≥ 14 时金币恒为 0，再减半无意义</text>

  <rect x="250" y="244" width="252" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="376" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">状态定义</text>
  <text x="376" y="290" text-anchor="middle" font-size="11" fill="#333">dp[u][t] = 祖先已减半 t 次时，</text>
  <text x="376" y="308" text-anchor="middle" font-size="11" fill="#333">子树 u 能贡献的最大积分</text>
  <text x="376" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = dp[0][0]</text>
</svg>
