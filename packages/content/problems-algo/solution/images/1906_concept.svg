<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心：值域 [1,100] → 前缀计数表 → 查询扫 100 次
  </text>
  <text x="300" y="48" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    nums[i] ∈ [1,100]，值域极小是破题关键
  </text>

  <rect x="170" y="58" width="260" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    ⚠ nums[i] ∈ [1, 100]，最多 100 种值
  </text>

  <text x="60" y="108" font-size="12" fill="#446688" filter="url(#rough2)">nums =</text>
  <rect x="120" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <text x="80" y="138" font-size="12" fill="#446688" filter="url(#rough2)">
    前缀计数表 pre[i][v]：前 i 个元素中值 v 出现次数
  </text>

  <rect x="80" y="145" width="395" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i</text>
  <text x="135" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <text x="175" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <text x="215" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3</text>
  <text x="255" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">4</text>
  <text x="295" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <text x="335" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">6</text>
  <text x="375" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">7</text>
  <text x="415" y="161" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">8</text>
  <text x="455" y="161" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">…</text>

  <rect x="80" y="169" width="395" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="135" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="175" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="215" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="255" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="335" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="375" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="415" y="185" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="80" y="193" width="395" height="24" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="209" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="115" y="195" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="209" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="215" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="255" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="335" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="375" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="415" y="209" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="80" y="217" width="395" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="233" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="115" y="219" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="233" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="195" y="219" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="233" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="255" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="335" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="375" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="415" y="233" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="80" y="241" width="395" height="24" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="257" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="115" y="243" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="257" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="257" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="195" y="243" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="257" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="235" y="243" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="257" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="257" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="335" y="257" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="375" y="257" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="415" y="257" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="80" y="265" width="395" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98"  y="281" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="115" y="267" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="281" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="281" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="195" y="267" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="281" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="235" y="267" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="281" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="281" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="335" y="281" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="375" y="281" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="395" y="267" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="281" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="300" y="312" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    查询 [0, 3]：pre[4] − pre[0]，count &gt; 0 的值即出现
  </text>

  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    出现的值（按 v 升序扫描，天然有序）→ 相邻差取最小
  </text>

  <circle cx="130" cy="370" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="375" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="250" cy="370" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="375" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="370" cy="370" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="375" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="490" cy="370" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="375" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <line x1="148" y1="370" x2="232" y2="370" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="362" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">差=2</text>
  <line x1="268" y1="370" x2="352" y2="370" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">差=1</text>
  <line x1="388" y1="370" x2="472" y2="370" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">差=4</text>

  <rect x="170" y="400" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">
    min(2, 1, 4) = 1 ✓
  </text>
</svg>
