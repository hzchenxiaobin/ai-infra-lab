<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：workers=[[0,0],[2,1]], bikes=[[1,2],[3,3]]</text>

  <!-- Step 1: All pairs -->
  <text x="40" y="52" font-size="11.5" fill="#888">Step 1 — 计算全部 4 个对的曼哈顿距离</text>

  <!-- Pair table -->
  <rect x="40" y="60" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">工人</text>
  <text x="80" y="92" text-anchor="middle" font-size="10" fill="#555">W0 [0,0]</text>
  <text x="80" y="106" text-anchor="middle" font-size="10" fill="#555">W0 [0,0]</text>
  <text x="80" y="120" text-anchor="middle" font-size="10" fill="#555">W1 [2,1]</text>

  <text x="200" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">自行车</text>
  <text x="200" y="92" text-anchor="middle" font-size="10" fill="#555">B0 [1,2]</text>
  <text x="200" y="106" text-anchor="middle" font-size="10" fill="#555">B1 [3,3]</text>
  <text x="200" y="120" text-anchor="middle" font-size="10" fill="#555">B0 [1,2]</text>

  <text x="320" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">距离</text>
  <text x="320" y="92" text-anchor="middle" font-size="10" fill="#555">|0-1|+|0-2|=3</text>
  <text x="320" y="106" text-anchor="middle" font-size="10" fill="#555">|0-3|+|0-3|=6</text>
  <text x="320" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">|2-1|+|1-2|=2</text>

  <text x="450" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">—</text>
  <text x="450" y="106" text-anchor="middle" font-size="10" fill="#555">W1-B1 = 3</text>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#555">(未列出)</text>

  <path d="M 280 130 L 280 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Sorted -->
  <text x="40" y="166" font-size="11.5" fill="#888">Step 2 — 按 (距离, 工人, 自行车) 排序</text>

  <rect x="40" y="174" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① (2, W1, B0)</text>
  <text x="100" y="210" text-anchor="middle" font-size="9.5" fill="#888">距离最小</text>
  <text x="240" y="192" text-anchor="middle" font-size="10" fill="#555">② (3, W0, B0)</text>
  <text x="240" y="210" text-anchor="middle" font-size="9.5" fill="#888">距离3·工人0</text>
  <text x="380" y="192" text-anchor="middle" font-size="10" fill="#555">③ (3, W1, B1)</text>
  <text x="380" y="210" text-anchor="middle" font-size="9.5" fill="#888">距离3·工人1</text>
  <text x="490" y="192" text-anchor="middle" font-size="10" fill="#555">④ (6, W0, B1)</text>
  <text x="490" y="210" text-anchor="middle" font-size="9.5" fill="#888">距离最大</text>

  <path d="M 280 232 L 280 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Greedy assignment -->
  <text x="40" y="268" font-size="11.5" fill="#888">Step 3 — 顺序贪心分配</text>

  <!-- Row 1 -->
  <rect x="40" y="276" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">① (2, W1, B0)</text>
  <text x="180" y="294" font-size="10" fill="#555">W1空闲 ✓  B0空闲 ✓</text>
  <text x="340" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">→ 分配 B0 给 W1</text>
  <text x="480" y="294" font-size="10" fill="#888">ans=[-1,0]</text>

  <!-- Row 2 -->
  <rect x="40" y="308" width="480" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="326" font-size="10" fill="#888">② (3, W0, B0)</text>
  <text x="180" y="326" font-size="10" fill="#b85450">W0空闲 ✓  B0已占 ✗</text>
  <text x="340" y="326" font-size="10" fill="#888">→ 跳过</text>
  <text x="480" y="326" font-size="10" fill="#888">ans=[-1,0]</text>

  <!-- Row 3 -->
  <rect x="40" y="340" width="480" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="10" fill="#888">③ (3, W1, B1)</text>
  <text x="180" y="358" font-size="10" fill="#b85450">W1已占 ✗  B1空闲 ✓</text>
  <text x="340" y="358" font-size="10" fill="#888">→ 跳过</text>
  <text x="480" y="358" font-size="10" fill="#888">ans=[-1,0]</text>

  <!-- Row 4 -->
  <rect x="40" y="372" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">④ (6, W0, B1)</text>
  <text x="180" y="390" font-size="10" fill="#555">W0空闲 ✓  B1空闲 ✓</text>
  <text x="340" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">→ 分配 B1 给 W0</text>
  <text x="480" y="390" font-size="10" fill="#888">ans=[1,0]</text>

  <path d="M 280 402 L 280 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="40" y="422" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结果：[1, 0]  —  W0→B1, W1→B0</text>
</svg>
