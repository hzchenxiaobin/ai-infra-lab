<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [6,5,7,8]，答案 7</text>

  <!-- 步骤 1：定位 x、y -->
  <circle cx="56" cy="62" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="66" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="56" y="90" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">定位结构</text>

  <rect x="110" y="48" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="127" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="144" y="48" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="161" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="178" y="48" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="212" y="48" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="229" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <path d="M 127 80 L 127 88" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="127" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">x=0</text>
  <path d="M 161 80 L 161 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="161" y="101" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">y=1</text>

  <text x="290" y="62" font-size="11" fill="#555" filter="url(#rough2)">6 &gt; 5 断崖 ⇒ 前缀止于 x = 0</text>
  <text x="290" y="82" font-size="11" fill="#555" filter="url(#rough2)">后缀 [5,7,8] 递增 ⇒ y = 1</text>

  <!-- 步骤 2：l = 0 -->
  <circle cx="56" cy="136" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="56" y="164" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">l = 0</text>

  <rect x="100" y="116" width="396" height="62" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="298" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">前缀为空，r ∈ [y-1, n-1] = [0, 3]，贡献 n - y + 1 = 4</text>
  <rect x="112" y="144" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="157" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">[6]→[5,7,8]</text>
  <rect x="208" y="144" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="253" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">[6,5]→[7,8]</text>
  <rect x="304" y="144" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="349" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">[6,5,7]→[8]</text>
  <rect x="400" y="144" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">[6,5,7,8]→[]</text>

  <!-- 步骤 3：l = 1 -->
  <circle cx="56" cy="226" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="230" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="56" y="254" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">l = 1</text>

  <rect x="100" y="190" width="396" height="88" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="298" y="209" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">保留前缀 [6]，k 从 y=1 推进：5 ≤ 6 跳过 → 7 &gt; 6 停，k = 2</text>
  <text x="298" y="229" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">r ∈ [max(l, k-1), n-1] = [max(1,1), 3]，贡献 n - max(1,1) = 3</text>
  <rect x="130" y="240" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="255" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">[5]→[6,7,8]</text>
  <rect x="240" y="240" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="255" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">[5,7]→[6,8]</text>
  <rect x="350" y="240" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="255" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">[5,7,8]→[6]</text>

  <!-- 步骤 4：汇总 -->
  <circle cx="56" cy="316" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="320" text-anchor="middle" font-size="12" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="56" y="344" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">汇总</text>

  <rect x="100" y="296" width="396" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="298" y="321" text-anchor="middle" font-size="15" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">ans = 4 + 3 = 7 ✓</text>

  <!-- 底注：整体递增特判 -->
  <rect x="46" y="352" width="428" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">整体递增（如示例 1 的 [1,2,3,4]）：l-1 &lt; r+1 时拼接条件自动成立，</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">直接返回 n(n+1)/2 = 10 —— 恰为全部非空子数组的个数（删空不算）</text>
</svg>
