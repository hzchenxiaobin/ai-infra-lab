<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例 1 演算：逐段累乘，prev 游标右移</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#666">brackets=[[3,50],[7,10],[12,25]]，income=10 → 答案 2.65</text>

  <!-- ===== table frame ===== -->
  <!-- column x boundaries: 20,65,160,255,340,440,540 -->
  <!-- header row y=58..88 -->
  <rect x="20" y="58" width="520" height="30" fill="#446688" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="42" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i</text>
  <text x="112" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">[upper,percent]</text>
  <text x="207" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">prev → upper</text>
  <text x="297" y="77" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">应税 taxable</text>
  <text x="390" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">段税 =×rate</text>
  <text x="490" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">累计 tax</text>

  <!-- vertical separators -->
  <line x1="65" y1="88" x2="65" y2="220" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="88" x2="160" y2="220" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="255" y1="88" x2="255" y2="220" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="88" x2="340" y2="220" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="440" y1="88" x2="440" y2="220" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== row 1: i=1 [3,50] blue ===== -->
  <rect x="20" y="88" width="520" height="34" fill="#f5f9ff" filter="url(#rough2)"/>
  <text x="42" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="112" y="109" text-anchor="middle" font-size="11" fill="#333">[3, 50]</text>
  <text x="207" y="109" text-anchor="middle" font-size="11" fill="#555">0 → 3</text>
  <rect x="255" y="92" width="85" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="297" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">min(10,3)−0 = 3</text>
  <text x="390" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3×50% = 1.50</text>
  <text x="490" y="109" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1.50</text>

  <!-- ===== row 2: i=2 [7,10] green ===== -->
  <rect x="20" y="122" width="520" height="34" fill="#f5fbf6" filter="url(#rough2)"/>
  <text x="42" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="112" y="143" text-anchor="middle" font-size="11" fill="#333">[7, 10]</text>
  <text x="207" y="143" text-anchor="middle" font-size="11" fill="#555">3 → 7</text>
  <rect x="255" y="126" width="85" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="297" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min(10,7)−3 = 4</text>
  <text x="390" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4×10% = 0.40</text>
  <text x="490" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1.90</text>

  <!-- ===== row 3: i=3 [12,25] orange ===== -->
  <rect x="20" y="156" width="520" height="34" fill="#fffcf3" filter="url(#rough2)"/>
  <text x="42" y="177" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="112" y="177" text-anchor="middle" font-size="11" fill="#333">[12, 25]</text>
  <text x="207" y="177" text-anchor="middle" font-size="11" fill="#555">7 → 12</text>
  <rect x="255" y="160" width="85" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="297" y="177" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">min(10,12)−7 = 3</text>
  <text x="390" y="177" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3×25% = 0.75</text>
  <text x="490" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2.65</text>

  <!-- horizontal rules between rows -->
  <line x1="20" y1="122" x2="540" y2="122" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="20" y1="156" x2="540" y2="156" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- ===== sum row ===== -->
  <rect x="20" y="190" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="207" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">合计（收入 10）</text>
  <text x="297" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10 元</text>
  <text x="390" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2.65</text>
  <text x="490" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2.65</text>

  <!-- ===== bottom note ===== -->
  <rect x="20" y="236" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：第 3 段 income 落入此处，应税 = min(10,12) − 7 = 3，而非整段 5</text>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#555">cap 在 income：跨过 income 的段只算到 income；prev 游标随后右移到 upper</text>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#555">若 income ≤ prev（已无剩余收入）→ 后续段 taxable=0，可提前 return</text>
</svg>
