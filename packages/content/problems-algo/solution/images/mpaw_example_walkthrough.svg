<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：difficulty=[2,4,6,8,10], worker=[4,5,6,7]</text>

  <!-- ===== Jobs row ===== -->
  <text x="36" y="56" font-size="12" fill="#888">工作（按难度排序）:</text>
  <line x1="80" y1="96" x2="430" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 5 jobs -->
  <rect x="92" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="86" text-anchor="middle" font-size="11" fill="#333">(2, 10)</text>

  <rect x="162" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="86" text-anchor="middle" font-size="11" fill="#333">(4, 20)</text>

  <rect x="232" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="86" text-anchor="middle" font-size="11" fill="#333">(6, 30)</text>

  <rect x="302" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="86" text-anchor="middle" font-size="11" fill="#333">(8, 40)</text>

  <rect x="372" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="86" text-anchor="middle" font-size="11" fill="#333">(10, 50)</text>

  <!-- j pointer label -->
  <text x="122" y="110" text-anchor="middle" font-size="10" fill="#999">j→</text>

  <!-- ===== Workers row ===== -->
  <text x="36" y="134" font-size="12" fill="#888">工人（排序后）:</text>

  <rect x="110" y="124" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">w=4</text>

  <rect x="190" y="124" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">w=5</text>

  <rect x="270" y="124" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">w=6</text>

  <rect x="350" y="124" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">w=7</text>

  <!-- ===== Step table header ===== -->
  <rect x="40" y="172" width="480" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">工人 w</text>
  <text x="220" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">新解锁工作</text>
  <text x="340" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">best</text>
  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans 累计</text>

  <!-- Step 1: w=4 -->
  <rect x="40" y="202" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="220" y="220" text-anchor="middle" font-size="11" fill="#333">(2,10), (4,20)</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="460" y="220" text-anchor="middle" font-size="11" fill="#333">20</text>

  <!-- Step 2: w=5 -->
  <rect x="40" y="232" width="480" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="220" y="250" text-anchor="middle" font-size="11" fill="#888">— (无新解锁)</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="460" y="250" text-anchor="middle" font-size="11" fill="#333">40</text>

  <!-- Step 3: w=6 -->
  <rect x="40" y="262" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="280" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="220" y="280" text-anchor="middle" font-size="11" fill="#333">(6, 30)</text>
  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="460" y="280" text-anchor="middle" font-size="11" fill="#333">70</text>

  <!-- Step 4: w=7 -->
  <rect x="40" y="292" width="480" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="220" y="310" text-anchor="middle" font-size="11" fill="#888">— (无新解锁)</text>
  <text x="340" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="460" y="310" text-anchor="middle" font-size="11" fill="#333">100</text>

  <!-- ===== Result box ===== -->
  <rect x="120" y="340" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#444">ans = 20 + 20 + 30 + 30</text>
  <text x="280" y="380" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">= 100 ✓</text>

  <!-- Note -->
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#888">j 只前进（0→2→3），best 只增不减（20→30）→ 双指针 O(n+m)</text>
</svg>
