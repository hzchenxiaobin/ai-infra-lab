<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三阶递推：泰波那契 vs 斐波那契</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">递推骨架相同，仅窗口宽度从 2 扩到 3，初值多一个、滚动变量多一个</text>

  <!-- ===== Row 1: Fibonacci (2-term) ===== -->
  <g filter="url(#rough2)">
    <text x="50" y="95" font-size="12" fill="#446688" font-weight="bold">斐波那契</text>
    <text x="50" y="112" font-size="10" fill="#888">二阶</text>
  </g>
  <!-- f(i-2) -->
  <rect x="180" y="78" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="103" text-anchor="middle" font-size="12" fill="#2a3f55" font-weight="bold">f(i-2)</text>
  <!-- f(i-1) -->
  <rect x="246" y="78" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="103" text-anchor="middle" font-size="12" fill="#2a3f55" font-weight="bold">f(i-1)</text>
  <!-- f(i) result -->
  <rect x="372" y="78" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="103" text-anchor="middle" font-size="12" fill="#2d4d22" font-weight="bold">f(i)</text>
  <!-- window bracket over f(i-2), f(i-1) -->
  <path d="M 180 70 L 180 64 L 302 64 L 302 70" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="241" y="58" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">窗口 2 项</text>
  <!-- plus and arrow -->
  <text x="318" y="105" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">→</text>
  <text x="345" y="98" text-anchor="middle" font-size="10" fill="#888">相加</text>

  <!-- ===== Row 2: Tribonacci (3-term) ===== -->
  <g filter="url(#rough2)">
    <text x="50" y="175" font-size="12" fill="#b85450" font-weight="bold">泰波那契</text>
    <text x="50" y="192" font-size="10" fill="#888">三阶</text>
  </g>
  <!-- T(i-3) -->
  <rect x="148" y="158" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="183" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold">T(i-3)</text>
  <!-- T(i-2) -->
  <rect x="214" y="158" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="183" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold">T(i-2)</text>
  <!-- T(i-1) -->
  <rect x="280" y="158" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="183" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold">T(i-1)</text>
  <!-- T(i) result -->
  <rect x="412" y="158" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="183" text-anchor="middle" font-size="12" fill="#2d4d22" font-weight="bold">T(i)</text>
  <!-- window bracket over T(i-3), T(i-2), T(i-1) -->
  <path d="M 148 150 L 148 144 L 336 144 L 336 150" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="242" y="138" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">窗口 3 项</text>
  <!-- arrow -->
  <text x="352" y="185" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">→</text>
  <text x="385" y="178" text-anchor="middle" font-size="10" fill="#888">相加</text>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="230" width="500" height="112" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">推广：k 阶线性递推 F(i) = Σ F(i-j)，j=1..k</text>
  <g font-size="11" fill="#555">
    <text x="60" y="280">• 初值：k 个（斐波那契 2 个 / 泰波那契 3 个）</text>
    <text x="60" y="300">• 滚动数组：k 个变量，时间 O(n)、空间 O(1)</text>
    <text x="60" y="320">• 大 n 取模：k×k 矩阵快速幂，时间 O(k³ log n)</text>
  </g>
  <text x="430" y="320" font-size="10" fill="#888">窗口宽度不影响渐进复杂度</text>
</svg>
