<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：无缝传递 ⇒ 药水是一根「刚性木条」，时间线由 t₀ 唯一确定</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · 药水 2（x = 4，pre = [0,1,6,8,12]）：灰 = 忙至 f[i]，蓝 = 药水 2 的无缝占位</text>

  <!-- t0 vertical marker -->
  <line x1="128" y1="50" x2="128" y2="258" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="128" y="50" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">t₀ = 54</text>

  <!-- row 0: wizard 0, f=53, seg [54,58] -->
  <text x="36" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">巫师 0</text>
  <text x="36" y="83" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">skill=1</text>
  <rect x="100" y="60" width="21" height="26" fill="#eef1f4" stroke="#9db4c9" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="77" text-anchor="middle" font-size="8" fill="#66788c" filter="url(#rough2)">忙至53</text>
  <rect x="128" y="60" width="29" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="56" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">54→58</text>
  <text x="100" y="100" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">开工 54 ≥ 空闲 53：巫师 0 白等 1 格（链是刚性的！）</text>

  <!-- row 1: wizard 1, f=58, seg [58,78] bottleneck -->
  <text x="36" y="122" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">巫师 1</text>
  <text x="36" y="135" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">skill=5</text>
  <rect x="100" y="112" width="57" height="26" fill="#eef1f4" stroke="#9db4c9" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="128" y="129" text-anchor="middle" font-size="8" fill="#66788c" filter="url(#rough2)">忙至58</text>
  <rect x="157" y="112" width="142" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="129" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">58→78</text>
  <text x="100" y="152" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">开工 58 = 空闲 58 ⛔ 瓶颈：巫师 1 卡死整条链</text>

  <!-- row 2: wizard 2, f=60, seg [78,86] -->
  <text x="36" y="174" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">巫师 2</text>
  <text x="36" y="187" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">skill=2</text>
  <rect x="100" y="164" width="71" height="26" fill="#eef1f4" stroke="#9db4c9" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="135" y="181" text-anchor="middle" font-size="8" fill="#66788c" filter="url(#rough2)">忙至60</text>
  <rect x="299" y="164" width="57" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="181" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">78→86</text>
  <text x="100" y="204" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">开工 78 ≥ 空闲 60：松 18 格</text>

  <!-- row 3: wizard 3, f=64, seg [86,102] -->
  <text x="36" y="226" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">巫师 3</text>
  <text x="36" y="239" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">skill=4</text>
  <rect x="100" y="216" width="100" height="26" fill="#eef1f4" stroke="#9db4c9" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="233" text-anchor="middle" font-size="8" fill="#66788c" filter="url(#rough2)">忙至64</text>
  <rect x="356" y="216" width="114" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="413" y="233" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">86→102</text>
  <text x="100" y="256" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">开工 86 ≥ 空闲 64：松 22 格</text>

  <!-- handoff arrows: immediate pass at t=58, 78, 86 -->
  <line x1="157" y1="86" x2="157" y2="110" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="299" y1="138" x2="299" y2="162" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="356" y1="190" x2="356" y2="214" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="207" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">立即交接</text>

  <!-- formula boxes -->
  <g filter="url(#rough2)">
    <rect x="36" y="272" width="448" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="291" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">t₀ = max_i(f[i] − pre[i]·x) = max(53−0, 58−4, 60−24, 64−32) = 54 —— 瓶颈：巫师 1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="310" width="448" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="260" y="329" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">新 f = t₀ + pre[i+1]·x = [58, 78, 86, 102]，相邻差 = skill[i+1]·x（楼梯状）</text>
  </g>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">「不许停」⇒ 整条药水放不进比 t₀ 更早的位置——一趟 max 定位瓶颈</text>
</svg>
