<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[4,8,5,0,1,null,6] 后序遍历逐节点聚合判定</text>

  <!-- 小树示意 -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="90" cy="74" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="90" y="64" font-size="8" fill="#b85450">⑥</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#333">8</text>
  <text x="58" y="124" font-size="8" fill="#b85450">③</text>
  <circle cx="122" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="122" y="124" font-size="8" fill="#4a7a3a">⑤</text>
  <line x1="52" y1="118" x2="40" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="118" x2="76" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="128" y1="118" x2="140" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="37" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="37" y="145" text-anchor="middle" font-size="8" fill="#333">0</text>
  <text x="48" y="148" font-size="8" fill="#4a7a3a">①</text>
  <circle cx="79" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="145" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="90" y="148" font-size="8" fill="#4a7a3a">②</text>
  <circle cx="143" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="145" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="154" y="148" font-size="8" fill="#4a7a3a">④</text>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="195" y="48" width="435" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="225" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="290" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">dfs(left)</text>
  <text x="355" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">dfs(right)</text>
  <text x="425" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">sum/cnt</text>
  <text x="480" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">avg</text>
  <text x="525" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">val</text>
  <text x="595" y="65" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">命中/ans</text>

  <!-- 行 ① 叶0 -->
  <rect x="195" y="74" width="435" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="92" text-anchor="middle" font-size="10" fill="#333">① 叶 0</text>
  <text x="290" y="92" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="355" y="92" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="425" y="92" text-anchor="middle" font-size="9" fill="#333">0/1</text>
  <text x="480" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="525" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="595" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 1</text>

  <!-- 行 ② 叶1 -->
  <rect x="195" y="102" width="435" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="10" fill="#333">② 叶 1</text>
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="355" y="120" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="425" y="120" text-anchor="middle" font-size="9" fill="#333">1/1</text>
  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="525" y="120" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="595" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 2</text>

  <!-- 行 ③ 节点8 -->
  <rect x="195" y="130" width="435" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="225" y="148" text-anchor="middle" font-size="10" fill="#333">③ 节点 8</text>
  <text x="290" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">(0,1)</text>
  <text x="355" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">(1,1)</text>
  <text x="425" y="148" text-anchor="middle" font-size="9" fill="#333">9/3</text>
  <text x="480" y="148" text-anchor="middle" font-size="10" fill="#b85450">3</text>
  <text x="525" y="148" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="595" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 2</text>

  <!-- 行 ④ 叶6 -->
  <rect x="195" y="158" width="435" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="176" text-anchor="middle" font-size="10" fill="#333">④ 叶 6</text>
  <text x="290" y="176" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="355" y="176" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="425" y="176" text-anchor="middle" font-size="9" fill="#333">6/1</text>
  <text x="480" y="176" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="525" y="176" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="595" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 3</text>

  <!-- 行 ⑤ 节点5 -->
  <rect x="195" y="186" width="435" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 节点 5</text>
  <text x="290" y="204" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="355" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a">(6,1)</text>
  <text x="425" y="204" text-anchor="middle" font-size="9" fill="#333">11/2</text>
  <text x="480" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
  <text x="525" y="204" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="595" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 4</text>

  <!-- 行 ⑥ 根4 -->
  <rect x="195" y="214" width="435" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="232" text-anchor="middle" font-size="10" fill="#333">⑥ 根 4</text>
  <text x="290" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(9,3)</text>
  <text x="355" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(11,2)</text>
  <text x="425" y="232" text-anchor="middle" font-size="9" fill="#333">24/6</text>
  <text x="480" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <text x="525" y="232" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="595" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 5</text>

  <!-- 表格边框 -->
  <rect x="195" y="48" width="435" height="194" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="260" y1="74" x2="260" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="325" y1="74" x2="325" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="74" x2="390" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="74" x2="460" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="500" y1="74" x2="500" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="550" y1="74" x2="550" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="50" y="265" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = 5 ✓</text>
  <text x="320" y="307" text-anchor="middle" font-size="10" fill="#555">命中：①②④⑤⑥（叶 0,1,6 + 节点 5 + 根 4）；未命中：③ 节点 8</text>

  <!-- 关键观察 -->
  <rect x="50" y="335" width="540" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="357" text-anchor="middle" font-size="11" fill="#555">③ 节点 8：子树和 9、节点数 3，avg = 9/3 = 3 ≠ 8 → 未命中</text>
  <text x="320" y="377" text-anchor="middle" font-size="11" fill="#555">⑤ 节点 5：子树和 11、节点数 2，avg = 11/2 = 5（向下取整）= 5 → 命中</text>
  <text x="320" y="397" text-anchor="middle" font-size="11" fill="#b85450">⚠️ 整数除法向下取整是关键：11/2 = 5 而非 6（四舍五入会误判）</text>
  <text x="320" y="417" text-anchor="middle" font-size="11" fill="#4a7a3a">空节点返回 (0,0)，父节点合并 sum/count，cnt ≥ 1 不除零</text>
</svg>
