<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：一次遍历维护 (total, min, max) → 去两端求均值
  </text>

  <!-- Step 1: 初始化 -->
  <rect x="150" y="48" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 初始化</text>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">total=0, minVal=+∞, maxVal=−∞</text>
  <path d="M270,94 L270,110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: 循环判断菱形 -->
  <polygon points="270,112 380,152 270,192 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 遍历每个 salary[i]</text>
  <text x="270" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">还有元素吗？</text>
  <path d="M270,192 L270,208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: 循环体三连更新 -->
  <rect x="120" y="210" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ total += salary[i]</text>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">minVal = min(minVal, salary[i])</text>
  <text x="270" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">maxVal = max(maxVal, salary[i])</text>

  <!-- 回到循环判断（右侧回流） -->
  <path d="M420,238 L460,238 L460,152 L380,152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="466" y="200" font-size="10" fill="#888" filter="url(#rough2)">回到 ②</text>

  <!-- 循环结束 → 计算 -->
  <path d="M160,152 L100,152 L100,300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="106" y="172" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <path d="M100,300 L150,300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: 计算均值 -->
  <rect x="150" y="278" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">④ 计算并返回</text>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(total − minVal − maxVal)</text>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)"> / (n − 2)</text>
  <path d="M270,336 L270,352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: 返回 -->
  <rect x="170" y="354" width="200" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">⑤ return 均值（double）</text>

  <!-- 备注框 -->
  <rect x="40" y="412" width="460" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="432" font-size="11" fill="#555" filter="url(#rough2)">· 不排序：一次遍历同时拿 sum/min/max，O(n) 时间、O(1) 空间</text>
  <text x="50" y="448" font-size="11" fill="#555" filter="url(#rough2)">· 元素两两互异 ⟹ min ≠ max；n ≥ 3 ⟹ 分母 n−2 ≥ 1，不会除零</text>
</svg>
