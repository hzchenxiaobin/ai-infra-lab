<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：26 个字母各一个桶（栈），'*' 弹最小字母桶的栈顶</text>

  <text x="52" y="38" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">s = "aaba*"</text>

  <!-- character cells: x = 52 + 52i, w=40, h=42 -->
  <rect x="52" y="44" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="70" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="72" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>

  <rect x="104" y="44" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="70" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="124" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="156" y="44" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="70" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="176" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="208" y="44" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="70" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="228" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="260" y="44" width="40" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="280" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="306" y="60" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=4：遇到 '*'</text>

  <!-- star -> bucket arrow -->
  <path d="M 276 88 C 240 114, 168 110, 118 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">找最小的非空桶 → 'a'</text>

  <text x="70" y="126" font-size="11" fill="#555" filter="url(#rough2)">此时 26 个桶的状态（每桶存该字母的下标，栈顶 = 最靠右的出现）</text>

  <!-- bucket a -->
  <rect x="60" y="138" width="104" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="112" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 'a'</text>

  <rect x="90" y="226" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="243" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="90" y="194" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="211" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="90" y="162" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="179" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="138" y="175" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">栈顶 = 最右 'a'</text>
  <text x="138" y="188" font-size="10" fill="#b85450" filter="url(#rough2)">弹出它 ✓</text>

  <!-- bucket b -->
  <rect x="204" y="138" width="104" height="126" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="256" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">桶 'b'</text>

  <rect x="234" y="226" width="44" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="243" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- bucket c..z -->
  <rect x="348" y="138" width="124" height="126" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">桶 c … z</text>
  <text x="410" y="198" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">全空</text>
  <text x="410" y="216" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">（只有 'a'、'b' 非空）</text>

  <!-- comparison -->
  <rect x="40" y="280" width="215" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="147" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删最靠右的 'a'（s[3]）</text>
  <text x="147" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a a b [a] * → 保留下标 0,1,2</text>
  <text x="147" y="335" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 "aab" ✓ 字典序最小</text>

  <rect x="265" y="280" width="215" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="372" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删靠左的 'a'（s[0] 或 s[1]）</text>
  <text x="372" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">剩余字符连接 → "aba"</text>
  <text x="372" y="335" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果 "aba" ✗ 字典序更大</text>

  <!-- conclusion -->
  <rect x="40" y="356" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心：最小字母取最靠右的一个删</text>
  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">栈顶天然就是「最靠右的出现」——26 个桶一趟扫描解决</text>
</svg>
