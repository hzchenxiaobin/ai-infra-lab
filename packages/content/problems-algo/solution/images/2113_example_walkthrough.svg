<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 逐步演算：nums = [0,1,2]，周期 2n = 6</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">queries = [[0,2],[2,0],[3,2],[5,0]] → ans = [2, 2, −1, 0]</text>

  <!-- ===== Header row ===== -->
  <rect x="30" y="60" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60"  y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">query</text>
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
  <text x="165" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">index_j</text>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">m=t%6</text>
  <text x="285" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">阶段</text>
  <text x="380" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">当前数组</text>
  <text x="490" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">答案</text>

  <!-- ===== Row 1: [0,2] -> 2 ===== -->
  <rect x="30" y="92" width="500" height="36" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="115" text-anchor="middle" font-size="11" fill="#333">[0,2]</text>
  <text x="120" y="115" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="165" y="115" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="220" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="285" y="115" text-anchor="middle" font-size="10.5" fill="#446688">删除</text>
  <!-- current array [0,1,2] -->
  <rect x="346" y="98" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="357" y="114" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="370" y="98" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="381" y="114" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="394" y="98" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="405" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="115" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Row 2: [2,0] -> 2 ===== -->
  <rect x="30" y="130" width="500" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="153" text-anchor="middle" font-size="11" fill="#333">[2,0]</text>
  <text x="120" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="165" y="153" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="153" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="285" y="153" text-anchor="middle" font-size="10.5" fill="#446688">删除</text>
  <!-- current array [2], index 0 highlighted -->
  <rect x="370" y="136" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="381" y="152" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Row 3: [3,2] -> -1 ===== -->
  <rect x="30" y="168" width="500" height="36" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="191" text-anchor="middle" font-size="11" fill="#333">[3,2]</text>
  <text x="120" y="191" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="165" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="220" y="191" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="285" y="191" text-anchor="middle" font-size="10.5" fill="#999">删除(空)</text>
  <!-- empty array -->
  <rect x="362" y="174" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="190" text-anchor="middle" font-size="10" fill="#999">∅ 空</text>
  <text x="490" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <!-- ===== Row 4: [5,0] -> 0 ===== -->
  <rect x="30" y="206" width="500" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="229" text-anchor="middle" font-size="11" fill="#333">[5,0]</text>
  <text x="120" y="229" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="165" y="229" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="285" y="229" text-anchor="middle" font-size="10.5" fill="#4a7a3a">添加</text>
  <!-- current array [0,1], index 0 highlighted -->
  <rect x="370" y="212" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="381" y="228" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="394" y="212" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="405" y="228" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="490" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== Output ===== -->
  <rect x="30" y="252" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60"  y="275" font-size="11" fill="#d6a040" font-weight="bold">输出</text>
  <text x="120" y="275" font-size="11" fill="#333">ans =</text>
  <rect x="180" y="258" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="275" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="218" y="258" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="275" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="256" y="258" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="275" text-anchor="middle" font-size="11" fill="#b85450">−1</text>
  <rect x="294" y="258" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="275" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="345" y="275" font-size="10.5" fill="#888">m=t mod 2n 一行算出，全程 O(1)</text>

  <!-- ===== Insight ===== -->
  <rect x="40" y="300" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：先 m = t mod 2n 落到周期内，再按阶段直接索引</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555">[3,2]：m=3 落在删除阶段末端，长度 n−m=0，index_j=2 越界 → −1</text>

  <text x="280" y="352" text-anchor="middle" font-size="9.5" fill="#aaa">无需模拟数组演变，每个查询常数时间</text>
</svg>
