<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：有效点落在十字线上，距离退化为单轴绝对差</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">当前位置 (x,y)=(3,4)，同 x 竖线 ∪ 同 y 横线 = 有效区</text>

  <!-- Faint grid -->
  <g filter="url(#rough2)" stroke="#eee" stroke-width="1" fill="none">
    <path d="M 120 100 L 120 340"/>
    <path d="M 200 100 L 200 340"/>
    <path d="M 280 100 L 280 340"/>
    <path d="M 360 100 L 360 340"/>
    <path d="M 440 100 L 440 340"/>
    <path d="M 120 100 L 440 100"/>
    <path d="M 120 160 L 440 160"/>
    <path d="M 120 220 L 440 220"/>
    <path d="M 120 280 L 440 280"/>
    <path d="M 120 340 L 440 340"/>
  </g>

  <!-- Axis labels -->
  <g filter="url(#rough2)" font-size="9.5" fill="#bbb" text-anchor="middle">
    <text x="120" y="356">a=1</text>
    <text x="200" y="356">2</text>
    <text x="280" y="356">3</text>
    <text x="360" y="356">4</text>
    <text x="440" y="356">5</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#bbb" text-anchor="end">
    <text x="112" y="344">b=1</text>
    <text x="112" y="284">2</text>
    <text x="112" y="224">3</text>
    <text x="112" y="164">4</text>
    <text x="112" y="104">5</text>
  </g>

  <!-- The cross: horizontal (same y) + vertical (same x), dashed -->
  <path d="M 120 160 L 440 160" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 100 L 280 340" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="448" y="164" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">同 y</text>
  <text x="286" y="96" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">同 x</text>

  <!-- Invalid points: (1,2) and (2,3) — gray, off cross -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="280" r="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>
    <text x="120" y="272" text-anchor="middle" font-size="9" fill="#aaa">(1,2)</text>
    <circle cx="200" cy="220" r="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>
    <text x="200" y="212" text-anchor="middle" font-size="9" fill="#aaa">(2,3)</text>
  </g>
  <text x="58" y="276" font-size="9.5" fill="#aaa" filter="url(#rough2)">无效</text>
  <text x="138" y="216" font-size="9.5" fill="#aaa" filter="url(#rough2)">无效</text>

  <!-- Valid point (3,1): same x, dist = |1-4| = 3 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="340" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="332" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(3,1)</text>
  </g>
  <path d="M 286 338 L 296 326" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="300" y="324" font-size="9.5" fill="#d6a040" filter="url(#rough2)">dist=|1−4|=3</text>

  <!-- Valid point (4,4): same y, dist = |4-3| = 1 (tie) -->
  <g filter="url(#rough2)">
    <circle cx="360" cy="160" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="360" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(4,4)</text>
  </g>
  <text x="360" y="148" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">dist=1（并列）</text>

  <!-- Nearest valid point (2,4): same y, dist = |2-3| = 1, HIGHLIGHTED -->
  <g filter="url(#rough2)">
    <circle cx="200" cy="160" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="200" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">(2,4) ✓</text>
  </g>
  <!-- distance bracket from (3,4) to (2,4) along the horizontal line -->
  <path d="M 200 172 L 200 184 L 280 184 L 280 172" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dist=|2−3|=1</text>

  <!-- Current position (3,4): center of cross, prominent -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="160" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="280" cy="160" r="3" fill="#b85450"/>
    <text x="280" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(x,y)=(3,4)</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="268" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">有效 ⟺ a=x 或 b=y ⟺ 曼哈顿距离中一项为 0 ⟺ 距离退化为单轴绝对差</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">过滤（同 x/y）被吸收进距离定义 → 无效点 dist=∞ 不参与 min → 单趟合并</text>
  <text x="280" y="320" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">十字线上找最近，本质是单轴最近邻</text>
</svg>
