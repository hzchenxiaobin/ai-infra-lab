<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：rooms=[[1,4],[2,3],[3,5],[4,1],[5,2]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">预处理：房间按 size 降序 → 号3(面5),1(面4),2(面3),5(面2),4(面1)；查询按 minSize 降序</text>

  <!-- table header -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <rect x="24" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="44" y="75" fill="#446688">步</text>
    <rect x="64" y="58" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="75" fill="#446688">查询(pref,min,j)</text>
    <rect x="160" y="58" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="206" y="75" fill="#446688">新增入集房间</text>
    <rect x="252" y="58" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="302" y="75" fill="#446688">候选集 S</text>
    <rect x="352" y="58" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="402" y="75" fill="#446688">lo / hi 候选</text>
    <rect x="452" y="58" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="504" y="75" fill="#446688">answer[j]</text>
  </g>

  <!-- row step 1 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="24" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="44" y="111" fill="#d6a040" font-weight="bold">①</text>
    <rect x="64" y="88" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="112" y="111" fill="#4a7a3a" font-weight="bold">(2, 5, #2)</text>
    <rect x="160" y="88" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="206" y="111" fill="#446688" font-weight="bold">号 3 (面5)</text>
    <rect x="252" y="88" width="100" height="36" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="302" y="111" fill="#555" font-weight="bold">{ 3 }</text>
    <rect x="352" y="88" width="100" height="36" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="402" y="111" fill="#555">lo=∅, hi=3</text>
    <rect x="452" y="88" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="504" y="111" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- row step 2 (highlighted: tie) -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="24" y="128" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="44" y="151" fill="#d6a040" font-weight="bold">②</text>
    <rect x="64" y="128" width="96" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="112" y="151" fill="#d6a040" font-weight="bold">(2, 4, #1)</text>
    <rect x="160" y="128" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="206" y="151" fill="#446688" font-weight="bold">号 1 (面4)</text>
    <rect x="252" y="128" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="302" y="151" fill="#b85450" font-weight="bold">{ 1, 3 }</text>
    <rect x="352" y="128" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="402" y="151" fill="#b85450" font-weight="bold">lo=1, hi=3</text>
    <rect x="452" y="128" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="504" y="151" fill="#b85450" font-weight="bold">1 ★</text>
  </g>

  <!-- row step 3 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="24" y="168" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="44" y="191" fill="#d6a040" font-weight="bold">③</text>
    <rect x="64" y="168" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="112" y="191" fill="#4a7a3a" font-weight="bold">(2, 3, #0)</text>
    <rect x="160" y="168" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="206" y="191" fill="#446688" font-weight="bold">号 2 (面3)</text>
    <rect x="252" y="168" width="100" height="36" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="302" y="191" fill="#555" font-weight="bold">{ 1, 2, 3 }</text>
    <rect x="352" y="168" width="100" height="36" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="402" y="191" fill="#555">lo=∅, hi=2</text>
    <rect x="452" y="168" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="504" y="191" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- distance detail for step 2 -->
  <rect x="24" y="212" width="532" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="232" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 步② 平局处理：</text>
  <text x="160" y="232" font-size="10" fill="#555" filter="url(#rough2)">preferred=2 夹在 1 与 3 正中间，|1−2|=1 = |3−2|=1 → 选更小 id → 1</text>

  <!-- divider -->
  <line x1="24" y1="260" x2="556" y2="260" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Final: restore original order ===== -->
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">恢复原序（按下标 j 填回）</text>

  <!-- answer array slots by original index -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="44" y="312" font-size="10" fill="#888">j</text>
    <rect x="64" y="298" width="60" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="94" y="316" fill="#555" font-weight="bold">0</text>
    <rect x="124" y="298" width="60" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="154" y="316" fill="#555" font-weight="bold">1</text>
    <rect x="184" y="298" width="60" height="28" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="214" y="316" fill="#555" font-weight="bold">2</text>

    <text x="44" y="352" font-size="10" fill="#888">ans</text>
    <rect x="64" y="338" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="94" y="356" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="124" y="338" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="154" y="356" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="184" y="338" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="214" y="356" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- arrows from processing order to answer slots -->
  <path d="M 504 188 L 470 188 L 470 250 L 214 250 L 214 336" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 504 148 L 460 148 L 460 250 L 154 250 L 154 336" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 504 108 L 450 108 L 450 250 L 94 250 L 94 336" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result note -->
  <rect x="280" y="392" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = [2, 1, 3] ✓</text>

  <!-- footer insight -->
  <rect x="24" y="392" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="412" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">候选集只增不减：步②的 {1,3} 保留到步③</text>

  <text x="290" y="442" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键：离线排序让 ptr 单调推进；平局显式取更小 id；按下标 j 填回答案</text>
</svg>
