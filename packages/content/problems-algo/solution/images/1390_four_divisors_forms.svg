<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">恰有 4 个因数的整数：只有两种结构</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">因数个数 d(n) = Π(aᵢ+1) = 4 ⟹ 4 = 4 或 4 = 2×2</text>

  <!-- ===== Left panel: n = p^3 ===== -->
  <rect x="30" y="64" width="240" height="232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">结构一：n = p³</text>
  <text x="150" y="106" text-anchor="middle" font-size="10.5" fill="#666">p 为质数，指数 3 → d = 3+1 = 4</text>

  <!-- example 8 = 2^3 -->
  <text x="150" y="132" text-anchor="middle" font-size="11.5" fill="#333">例：8 = 2³</text>

  <!-- four divisor boxes -->
  <rect x="56" y="146" width="44" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="108" y="146" width="44" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="167" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="160" y="146" width="44" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="182" y="167" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="212" y="146" width="44" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="167" text-anchor="middle" font-size="12" fill="#333">8</text>

  <text x="150" y="198" text-anchor="middle" font-size="10.5" fill="#888">1, p, p², p³</text>

  <!-- sum formula -->
  <rect x="56" y="214" width="188" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">和 = 1+p+p²+p³ = 15</text>

  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#888">≤10⁵ 内：p ≤ 43（43³=79507）</text>
  <text x="150" y="286" text-anchor="middle" font-size="10" fill="#aaa">质数立方：8, 27, 125, 343, …</text>

  <!-- ===== Right panel: n = p·q ===== -->
  <rect x="290" y="64" width="240" height="232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结构二：n = p·q</text>
  <text x="410" y="106" text-anchor="middle" font-size="10.5" fill="#666">p, q 为不同质数 → d = (1+1)(1+1) = 4</text>

  <!-- example 21 = 3·7 -->
  <text x="410" y="132" text-anchor="middle" font-size="11.5" fill="#333">例：21 = 3·7</text>

  <!-- four divisor boxes -->
  <rect x="316" y="146" width="44" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="338" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="368" y="146" width="44" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="390" y="167" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="420" y="146" width="44" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="167" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="472" y="146" width="44" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="494" y="167" text-anchor="middle" font-size="12" fill="#333">21</text>

  <text x="410" y="198" text-anchor="middle" font-size="10.5" fill="#888">1, p, q, p·q</text>

  <!-- sum formula -->
  <rect x="316" y="214" width="188" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">和 = (1+p)(1+q) = 4×8 = 32</text>

  <text x="410" y="270" text-anchor="middle" font-size="10" fill="#888">两质数之积，最为常见</text>
  <text x="410" y="286" text-anchor="middle" font-size="10" fill="#aaa">6, 10, 14, 15, 21, 22, 26, …</text>

  <!-- ===== Bottom note: other structures excluded ===== -->
  <rect x="30" y="312" width="500" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为何只有这两种？d(n)=4 的因式分解只有 4 与 2×2</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">p²·q → d=(2+1)(1+1)=6 ✗　　p⁴ → d=4+1=5 ✗　　p·q·r → d=2·2·2=8 ✗</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#555">故枚举因数时，一旦超过 4 个即可提前终止——不可能是 4</text>
</svg>
