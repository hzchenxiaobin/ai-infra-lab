<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="390" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：nums = [1,5,10],  n = 20</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">维护 miss 从 1 起逐步推进，直到 miss &gt; 20</text>

  <!-- Table header -->
  <rect x="20" y="56" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="72" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="100" y="72" font-size="10.5" fill="#446688" font-weight="bold">miss</text>
  <text x="180" y="72" font-size="10.5" fill="#446688" font-weight="bold">i, nums[i]</text>
  <text x="290" y="72" font-size="10.5" fill="#446688" font-weight="bold">判定</text>
  <text x="430" y="72" font-size="10.5" fill="#446688" font-weight="bold">动作 / patches</text>

  <!-- Row 0: init -->
  <rect x="20" y="82" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="100" font-size="10.5" fill="#555">0</text>
  <text x="100" y="100" font-size="10.5" fill="#555" font-weight="bold">1</text>
  <text x="180" y="100" font-size="10.5" fill="#555">0, —</text>
  <text x="290" y="100" font-size="10.5" fill="#555">初始</text>
  <text x="430" y="100" font-size="10.5" fill="#555">patches = 0</text>

  <!-- Row 1: consume nums[0]=1 -->
  <rect x="20" y="112" width="500" height="28" fill="#e6f4ea" fill-opacity="0.45" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="130" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="100" y="130" font-size="10.5" fill="#555">1 → 2</text>
  <text x="180" y="130" font-size="10.5" fill="#555">0, nums[0]=1</text>
  <text x="290" y="130" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 ≤ 1 ✓</text>
  <text x="430" y="130" font-size="10.5" fill="#4a7a3a">吸收, miss=2 · p=0</text>

  <!-- Row 2: patch miss=2 -->
  <rect x="20" y="142" width="500" height="28" fill="#fce4ec" fill-opacity="0.45" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="160" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <text x="100" y="160" font-size="10.5" fill="#555">2 → 4</text>
  <text x="180" y="160" font-size="10.5" fill="#555">1, nums[1]=5</text>
  <text x="290" y="160" font-size="10.5" fill="#b85450" font-weight="bold">5 &gt; 2 ✗</text>
  <text x="430" y="160" font-size="10.5" fill="#b85450">补 2, miss=4 · p=1</text>

  <!-- Row 3: patch miss=4 -->
  <rect x="20" y="172" width="500" height="28" fill="#fce4ec" fill-opacity="0.45" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <text x="100" y="190" font-size="10.5" fill="#555">4 → 8</text>
  <text x="180" y="190" font-size="10.5" fill="#555">1, nums[1]=5</text>
  <text x="290" y="190" font-size="10.5" fill="#b85450" font-weight="bold">5 &gt; 4 ✗</text>
  <text x="430" y="190" font-size="10.5" fill="#b85450">补 4, miss=8 · p=2</text>

  <!-- Row 4: consume nums[1]=5 -->
  <rect x="20" y="202" width="500" height="28" fill="#e6f4ea" fill-opacity="0.45" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="220" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="100" y="220" font-size="10.5" fill="#555">8 → 13</text>
  <text x="180" y="220" font-size="10.5" fill="#555">1, nums[1]=5</text>
  <text x="290" y="220" font-size="10.5" fill="#4a7a3a" font-weight="bold">5 ≤ 8 ✓</text>
  <text x="430" y="220" font-size="10.5" fill="#4a7a3a">吸收, miss=13 · p=2</text>

  <!-- Row 5: consume nums[2]=10 -->
  <rect x="20" y="232" width="500" height="28" fill="#e6f4ea" fill-opacity="0.45" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="100" y="250" font-size="10.5" fill="#555">13 → 23</text>
  <text x="180" y="250" font-size="10.5" fill="#555">2, nums[2]=10</text>
  <text x="290" y="250" font-size="10.5" fill="#4a7a3a" font-weight="bold">10 ≤ 13 ✓</text>
  <text x="430" y="250" font-size="10.5" fill="#4a7a3a">吸收, miss=23 · p=2</text>

  <!-- Row 6: done -->
  <rect x="20" y="262" width="500" height="28" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="10.5" fill="#446688" font-weight="bold">6</text>
  <text x="100" y="280" font-size="10.5" fill="#555">23</text>
  <text x="180" y="280" font-size="10.5" fill="#555">3, —</text>
  <text x="290" y="280" font-size="10.5" fill="#446688" font-weight="bold">23 &gt; 20 ✓</text>
  <text x="430" y="280" font-size="10.5" fill="#446688" font-weight="bold">结束, return 2</text>

  <!-- coverage bar -->
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终覆盖 [1, 22] ⊇ [1, 20] ✓</text>
  <rect x="40" y="324" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="339" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="270" y="339" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">子集和可覆盖 [1, 22]</text>
  <text x="490" y="339" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">22</text>

  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">补了 {2, 4} 两个数；[1,5,10] + {2,4} → 子集和覆盖 [1, 22]</text>
</svg>
