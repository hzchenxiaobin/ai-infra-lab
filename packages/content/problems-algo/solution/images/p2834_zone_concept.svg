<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：冲突配对三分区（以 target = 7 为例）</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">冲突对 (x, target−x)：每对至多选一个 → 永远选小的那个</text>
  <text x="310" y="82" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每条虚线弧连接一对冲突数：两端之和 = 7 = target</text>

  <!-- conflict arcs above the number line -->
  <path d="M 77 162 Q 182 84 287 162" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 119 162 Q 182 104 245 162" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 161 162 Q 182 124 203 162" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- number line cells: 1..11 -->
  <rect x="56" y="166" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="98" y="166" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="166" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="182" y="166" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="224" y="166" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="266" y="166" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="308" y="166" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="350" y="166" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="392" y="166" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="434" y="166" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="476" y="166" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="540" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">…</text>

  <!-- zone labels -->
  <rect x="40" y="216" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">安全区 A</text>
  <text x="115" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ~ ⌊target/2⌋，可全选</text>

  <rect x="196" y="216" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="261" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">禁区 B</text>
  <text x="261" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">选 b 不如选 target−b</text>

  <rect x="340" y="216" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">自由区 C：≥ target</text>
  <text x="440" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">与谁相加都 &gt; target</text>

  <!-- conclusion -->
  <rect x="70" y="284" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最优解 = A ∪ C 中最小的 n 个数</text>
  <text x="310" y="324" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">{1, 2, …, m} ∪ {target, target+1, …}，m = min(n, ⌊target/2⌋)</text>

  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">与 2829 同构；本题 n ≤ 10⁹ → 必须 O(1) 公式，答案再取模 10⁹+7</text>
</svg>
