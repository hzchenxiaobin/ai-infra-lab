<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，对每个 target 位置算 min(顺,逆) 取最小</text>

  <!-- Start terminal -->
  <rect x="240" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 280 78 L 280 96" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="200" y="96" width="160" height="34" fill="#fff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333">ans = +∞（用 n 当哨兵）</text>
  <path d="M 280 130 L 280 148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Loop init -->
  <rect x="200" y="148" width="160" height="34" fill="#fff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#333">i = 0 .. n−1</text>
  <path d="M 280 182 L 280 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision: words[i] == target ? -->
  <polygon points="280,200 380,244 280,288 180,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#555">words[i]</text>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#555">== target ?</text>

  <!-- Yes branch (right) -->
  <path d="M 380 244 L 410 244" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="392" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="218" width="130" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="236" text-anchor="middle" font-size="10.5" fill="#333">r=(i−s+n)%n</text>
  <text x="475" y="250" text-anchor="middle" font-size="10.5" fill="#333">l=(s−i+n)%n</text>
  <text x="475" y="264" text-anchor="middle" font-size="10.5" fill="#333">ans=min(ans,r,l)</text>

  <!-- loop back from yes to i= loop -->
  <path d="M 475 218 L 475 134 L 360 134" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- No branch (left) -> back to loop -->
  <path d="M 180 244 L 150 244" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="166" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 150 244 L 150 165 L 200 165" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="120" y="210" text-anchor="middle" font-size="10" fill="#888">下一个 i</text>

  <!-- Loop done arrow down -->
  <path d="M 280 288 L 280 306" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision: ans == n ? -->
  <polygon points="280,306 370,342 280,378 190,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#555">ans == n ?</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">(从未命中)</text>

  <!-- yes -> return -1 -->
  <path d="M 190 342 L 150 342" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="170" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="328" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="100" y="347" text-anchor="middle" font-size="12" fill="#333">return −1</text>

  <!-- no -> return ans -->
  <path d="M 370 342 L 410 342" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="390" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="328" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="470" y="347" text-anchor="middle" font-size="12" fill="#333">return ans</text>

  <!-- Side note -->
  <text x="48" y="60" font-size="10.5" fill="#888">遍历 O(n)，无方向分支</text>
</svg>
