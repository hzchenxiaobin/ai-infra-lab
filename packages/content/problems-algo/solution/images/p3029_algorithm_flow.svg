<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先一遍 Z 函数，再逐秒 O(1) 查表</text>

  <!-- step 1: z array -->
  <rect x="150" y="42" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">计算 Z 数组</text>
  <text x="280" y="77" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">z[i] = word 与 word[i:] 的最长公共前缀长度</text>

  <path d="M 280 84 L 280 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- t = 1 -->
  <rect x="235" y="104" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">t = 1</text>

  <path d="M 280 132 L 280 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="185,190 280,152 375,190 280,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">t·k ≥ n ?</text>

  <path d="M 375 190 L 428 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="398" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="430" y="168" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="186" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ⌈n/k⌉</text>
  <text x="489" y="203" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">原字符已删光</text>

  <path d="M 280 228 L 280 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="243" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="185,292 280,254 375,292 280,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">z[t·k] ≥ n − t·k ?</text>

  <path d="M 375 292 L 428 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="398" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="430" y="270" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 t</text>
  <text x="489" y="305" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">存活后缀 = 前缀</text>

  <path d="M 280 330 L 280 352" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="347" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- t increment -->
  <rect x="225" y="354" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t ← t + 1</text>

  <!-- loop back -->
  <path d="M 225 369 L 110 369 L 110 190 L 178 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="284" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">继续下一秒</text>

  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Z 数组 O(n) 预处理一次，每个 t 只需 O(1) 查表 → 总时间 O(n)</text>
</svg>
