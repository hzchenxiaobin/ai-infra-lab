<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每层 (a+b)%10 归约，n−1 轮后等价于帕斯卡系数加权和</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">以 nums=[1,2,3,4,5] 为例，系数 = 帕斯卡三角第 4 行 [1,4,6,4,1]</text>

  <!-- ===== Row labels ===== -->
  <text x="22" y="92" font-size="10" fill="#888">第0行</text>
  <text x="22" y="138" font-size="10" fill="#888">第1行</text>
  <text x="22" y="184" font-size="10" fill="#888">第2行</text>
  <text x="22" y="230" font-size="10" fill="#888">第3行</text>
  <text x="22" y="276" font-size="10" fill="#888">第4行</text>

  <!-- ===== Connecting lines (light gray) ===== -->
  <!-- Row0->Row1 -->
  <path d="M 100 110 L 125 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 150 110 L 125 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 150 110 L 175 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 110 L 175 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 110 L 225 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 250 110 L 225 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 250 110 L 275 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 300 110 L 275 126" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <!-- Row1->Row2 -->
  <path d="M 125 156 L 150 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 175 156 L 150 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 175 156 L 200 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 225 156 L 200 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 225 156 L 250 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 275 156 L 250 172" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <!-- Row2->Row3 -->
  <path d="M 150 202 L 175 218" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 202 L 175 218" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 202 L 225 218" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 250 202 L 225 218" stroke="#cfcfcf" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <!-- Row3->Row4 -->
  <path d="M 175 248 L 200 264" stroke="#cfcfcf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 225 248 L 200 264" stroke="#cfcfcf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Pyramid boxes ===== -->
  <!-- Row 0: [1,2,3,4,5] blue -->
  <rect x="82" y="80" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="80" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="182" y="80" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="232" y="80" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="282" y="80" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- Row 1: [3,5,7,9] light blue -->
  <rect x="107" y="126" width="36" height="30" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="157" y="126" width="36" height="30" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="207" y="126" width="36" height="30" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="257" y="126" width="36" height="30" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- Row 2: [8,2,6] green -->
  <rect x="132" y="172" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="182" y="172" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="232" y="172" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- Row 3: [0,8] orange -->
  <rect x="157" y="218" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="207" y="218" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Row 4: [8] answer red highlight -->
  <rect x="178" y="264" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">8</text>
  <text x="200" y="310" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">答案</text>

  <!-- "%10" annotation on a sample edge -->
  <text x="113" y="122" font-size="8.5" fill="#888">(a+b)</text>
  <text x="113" y="120" font-size="8.5" fill="#888"></text>
  <text x="200" y="122" text-anchor="middle" font-size="8.5" fill="#888">%10</text>

  <!-- ===== Right panel: Pascal coefficients ===== -->
  <rect x="330" y="64" width="222" height="206" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="441" y="84" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">帕斯卡三角 第 (n−1)=4 行</text>
  <text x="441" y="100" text-anchor="middle" font-size="9.5" fill="#888">归约 = 该行作系数的线性组合 (mod 10)</text>

  <!-- coefficient boxes [1,4,6,4,1] green -->
  <rect x="346" y="112" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="382" y="112" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="418" y="112" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="454" y="112" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="469" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="490" y="112" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- nums row [1,2,3,4,5] blue -->
  <text x="346" y="158" font-size="9.5" fill="#888">× nums</text>
  <rect x="382" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="161" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="418" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="161" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="454" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="161" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="490" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="161" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="526" y="146" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="537" y="161" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- formula -->
  <text x="346" y="190" font-size="10" fill="#444">= 1·1 + 4·2 + 6·3 + 4·4 + 1·5</text>
  <text x="346" y="208" font-size="10" fill="#444">= 1 + 8 + 18 + 16 + 5 = 48</text>

  <!-- arrow down -->
  <path d="M 441 214 L 441 232" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="376" y="238" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="441" y="257" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">48 mod 10 = 8 ✓</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="296" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">归约是模 10 的线性操作 → n−1 轮后 = 帕斯卡系数加权和 (mod 10)</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#555">原地模拟隐式计算这个和；显式求 C(n−1,i) mod 10 可把复杂度压到 O(n)</text>
  <text x="280" y="348" text-anchor="middle" font-size="9.5" fill="#888">(模 10 = 2×5 非质数 → Lucas 分别求 mod 2 / mod 5，再 CRT 合并)</text>

  <!-- ===== In-place hint ===== -->
  <rect x="30" y="368" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">原地覆写：nums[j] = (nums[j]+nums[j+1]) % 10，从左到右安全</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#4a7a3a">写 j 时 nums[j+1] 尚未被本轮覆写 → 旧值先读后写，无需额外数组</text>
  <text x="280" y="418" text-anchor="middle" font-size="9.5" fill="#888">第 i 轮有效长度 n−i，产生 n−1−i 个新值，恰好放进前段</text>
</svg>
