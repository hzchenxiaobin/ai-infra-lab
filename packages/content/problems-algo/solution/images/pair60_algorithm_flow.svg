<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描 + 60 桶计数（先查再写）</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M270 78 L270 96" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="98" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333">count[0..59] = 0，ans = 0</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">遍历每个 t ∈ time</text>
  <path d="M270 142 L270 160" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute r -->
  <rect x="180" y="162" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="185" text-anchor="middle" font-size="12" fill="#333">r = t % 60</text>
  <path d="M270 198 L270 216" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute comp -->
  <rect x="150" y="218" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="241" text-anchor="middle" font-size="12" fill="#333">comp = (60 − r) % 60</text>
  <path d="M270 254 L270 272" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- query -->
  <rect x="150" y="274" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans += count[comp]</text>
  <text x="270" y="307" text-anchor="middle" font-size="10.5" fill="#888">先查：统计能与当前配对的前驱数</text>
  <path d="M270 314 L270 332" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- increment -->
  <rect x="180" y="334" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="357" text-anchor="middle" font-size="12" fill="#333">count[r] += 1</text>

  <!-- loop back -->
  <path d="M270 370 L270 388" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="270,390 312,412 270,434 228,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#333">还有歌曲?</text>
  <text x="316" y="416" font-size="11" fill="#888">是 ↑</text>
  <path d="M228 412 L150 412 L150 120 L150 120" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="266" font-size="11" fill="#888">回到循环</text>

  <!-- to end -->
  <path d="M270 434 L270 448" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="448" width="120" height="0" fill="none"/>

  <!-- End node placed to the right of decision -->
  <rect x="430" y="398" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>
  <path d="M312 412 L430 412" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="406" font-size="11" fill="#888">否 →</text>
</svg>
