<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">差值变换：nums1 − nums2 → diff 数组</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">把双数组比较压成单数组「两数之和 &gt; 0」</text>

  <!-- nums1 row -->
  <text x="40" y="86" font-size="12" fill="#888">nums1：</text>
  <rect x="100" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="212" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="268" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="294" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- minus sign -->
  <text x="330" y="91" font-size="14" fill="#b85450" font-weight="bold">−</text>

  <!-- nums2 row -->
  <text x="350" y="86" font-size="12" fill="#888">nums2：</text>
  <rect x="410" y="70" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="436" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="466" y="70" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="492" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="522" y="70" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="538" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="126" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="182" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">i=1</text>
  <text x="238" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">i=2</text>
  <text x="294" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">i=3</text>

  <!-- arrows down to diff -->
  <path d="M 126 128 L 126 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 128 L 182 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 238 128 L 238 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 128 L 294 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diff row -->
  <text x="40" y="176" font-size="12" fill="#888">diff：</text>
  <rect x="100" y="160" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="156" y="160" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="212" y="160" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="268" y="160" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- equivalence box -->
  <rect x="40" y="214" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">等价条件：nums1[i]+nums1[j] &gt; nums2[i]+nums2[j] ⇔ diff[i]+diff[j] &gt; 0</text>

  <!-- key insight box -->
  <rect x="40" y="258" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#444">每对位置的「两个数之差」压缩成 diff 上的一个数</text>
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#444">判定条件从「四数比较」退化为「两数之和 &gt; 0」</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#888">立刻可用经典「排序 + 双指针计数」模型</text>
</svg>
