<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：arr = [3,3,3,3,5,5,5,2,2,7]，n/2 = 5</text>

  <!-- 频率统计小表 -->
  <text x="30" y="56" font-size="12" fill="#666" font-weight="bold">频率统计（已降序）</text>
  <g filter="url(#rough2)">
    <rect x="30" y="64" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="55" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">值</text>
    <rect x="80" y="64" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="105" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">频率</text>

    <rect x="30" y="88" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="55" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="80" y="88" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="105" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

    <rect x="30" y="112" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="55" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
    <rect x="80" y="112" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="105" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

    <rect x="30" y="136" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="55" y="152" text-anchor="middle" font-size="11" fill="#999">2</text>
    <rect x="80" y="136" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="105" y="152" text-anchor="middle" font-size="11" fill="#999">2</text>

    <rect x="30" y="160" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="55" y="176" text-anchor="middle" font-size="11" fill="#999">7</text>
    <rect x="80" y="160" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#999">1</text>
  </g>

  <!-- arrow 到演算表 -->
  <path d="M140 116 L170 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 贪心累加演算表 -->
  <text x="180" y="56" font-size="12" fill="#666" font-weight="bold">贪心累加过程</text>
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="180" y="64" width="70" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="215" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
    <rect x="250" y="64" width="70" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="285" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">选中值</text>
    <rect x="320" y="64" width="70" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="355" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">频率</text>
    <rect x="390" y="64" width="90" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="435" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">累计 sum</text>
    <rect x="480" y="64" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="510" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">≥5?</text>

    <!-- 步骤1 -->
    <rect x="180" y="88" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="215" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="250" y="88" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="285" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="320" y="88" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="355" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="390" y="88" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="435" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="480" y="88" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="510" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>

    <!-- 步骤2 -->
    <rect x="180" y="118" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="215" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="250" y="118" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="285" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
    <rect x="320" y="118" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="355" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="390" y="118" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="435" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4+3=7</text>
    <rect x="480" y="118" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="510" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  </g>

  <!-- 答案标注 -->
  <path d="M540 133 L540 133" stroke="none"/>
  <rect x="180" y="166" width="360" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">sum = 7 ≥ 5，停止 → 返回集合大小 = 2</text>

  <!-- 底部对比说明 -->
  <text x="30" y="222" font-size="12" fill="#666" font-weight="bold">为什么贪心最优？</text>

  <rect x="30" y="232" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="45" y="254" font-size="11" fill="#555">· 要用最少的「种数」凑够 n/2，应优先选频率大的值——一次删得多。</text>
  <text x="45" y="274" font-size="11" fill="#555">· 交换论证：若最优解含频率 f₁ &lt; f₂ 但不含 f₂，把 f₁ 换成 f₂ 后删除数不减、种数不变，仍最优。</text>

  <!-- 反例说明 -->
  <rect x="30" y="300" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="45" y="320" font-size="11" fill="#b85450" font-weight="bold">反例验证：选 {2,7} → 删 2+1=3 &lt; 5，不够！</text>
  <text x="45" y="336" font-size="11" fill="#888">小频率优先会浪费「名额」，必须从大到小选。</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#aaa">示例 2：arr = [7,7,7,7,7,7]，频率 {7:6}，选 1 种 sum=6≥3 → 返回 1</text>
</svg>
