<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行、列约束相互独立，各做一次拓扑排序</text>

  <!-- ===== Left: row constraints DAG ===== -->
  <rect x="24" y="48" width="186" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="117" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 行约束图 (above → below)</text>

  <!-- nodes 1, 3 on top row, 2 below -->
  <circle cx="74" cy="104" r="17" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="160" cy="104" r="17" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="117" cy="166" r="17" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <path d="M 86 116 L 106 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 116 L 128 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result: rowPos -->
  <rect x="36" y="208" width="164" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="118" y="227" text-anchor="middle" font-size="11" fill="#333">行序 [1,3,2] ⇒ rowPos</text>

  <!-- ===== Right: column constraints DAG ===== -->
  <rect x="350" y="48" width="186" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="443" y="68" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 列约束图 (left → right)</text>

  <!-- nodes 3 -> 2 -> 1 horizontal -->
  <circle cx="388" cy="120" r="17" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="443" cy="120" r="17" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="498" cy="120" r="17" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <path d="M 405 120 L 426 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 120 L 481 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="208" width="164" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="444" y="227" text-anchor="middle" font-size="11" fill="#333">列序 [3,2,1] ⇒ colPos</text>

  <!-- ===== Center: matrix ===== -->
  <!-- row index labels -->
  <text x="214" y="284" text-anchor="middle" font-size="10" fill="#446688">行0</text>
  <text x="214" y="316" text-anchor="middle" font-size="10" fill="#446688">行1</text>
  <text x="214" y="348" text-anchor="middle" font-size="10" fill="#446688">行2</text>
  <!-- col index labels -->
  <text x="252" y="258" text-anchor="middle" font-size="10" fill="#d6a040">列0</text>
  <text x="292" y="258" text-anchor="middle" font-size="10" fill="#d6a040">列1</text>
  <text x="332" y="258" text-anchor="middle" font-size="10" fill="#d6a040">列2</text>

  <!-- 3x3 grid -->
  <g filter="url(#rough2)">
    <rect x="232" y="266" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="272" y="266" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="312" y="266" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="332" y="287" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

    <rect x="232" y="298" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="252" y="319" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <rect x="272" y="298" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="312" y="298" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>

    <rect x="232" y="330" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="272" y="330" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="292" y="351" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
    <rect x="312" y="330" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  </g>

  <!-- arrows from results into matrix -->
  <path d="M 118 236 C 118 260, 180 270, 230 280" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 236 C 444 252, 360 250, 335 264" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="352" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#444">每个数的 (行号, 列号) = (rowPos[num], colPos[num])，两个一维排序互不干涉</text>
</svg>
