<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">核心：只有相差 k 的值才冲突 → 同余类内成链 → 打家劫舍计数</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">冲突图 = 一组不相交的链（不同余类永不相邻）</text>

  <!-- ===== number line (illustrate with values 2,3,4,5,6, k=2) ===== -->
  <!-- axis -->
  <path d="M60 110 L440 110" stroke="#cfd8e8" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- residue-0 nodes: 2,4,6 (blue) -->
  <circle cx="90" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="250" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <circle cx="410" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- residue-1 nodes: 3,5 (green) -->
  <circle cx="170" cy="110" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="330" cy="110" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- conflict edges (red dashed) : 2-4, 4-6, 3-5 -->
  <path d="M104 103 Q170 70 236 103" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M264 103 Q330 70 396 103" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M184 103 Q250 56 316 103" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- edge labels -->
  <text x="170" y="66" text-anchor="middle" font-size="9.5" fill="#b85450">差 k</text>
  <text x="330" y="66" text-anchor="middle" font-size="9.5" fill="#b85450">差 k</text>
  <text x="250" y="52" text-anchor="middle" font-size="9.5" fill="#b85450">差 k</text>

  <!-- residue annotations -->
  <text x="90" y="142" text-anchor="middle" font-size="9.5" fill="#446688">余0</text>
  <text x="250" y="142" text-anchor="middle" font-size="9.5" fill="#446688">余0</text>
  <text x="410" y="142" text-anchor="middle" font-size="9.5" fill="#446688">余0</text>
  <text x="170" y="142" text-anchor="middle" font-size="9.5" fill="#4a7a3a">余1</text>
  <text x="330" y="142" text-anchor="middle" font-size="9.5" fill="#4a7a3a">余1</text>

  <!-- chain group brackets -->
  <path d="M70 154 L120 154" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M230 154 L430 154" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">余0 链：2—4—6</text>
  <path d="M150 154 L350 154" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="250" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a">余1 链：3—5</text>

  <!-- divider note -->
  <rect x="40" y="186" width="440" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="10.5" fill="#333">同余类 mod k 内、相邻 k 的值串成链；缺中间值则断链。各链相互独立。</text>

  <!-- ===== house robber counting block ===== -->
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">链上 = 打家劫舍（计数版）</text>

  <!-- chain of 4 nodes -->
  <line x1="126" y1="258" x2="184" y2="258" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="216" y1="258" x2="274" y2="258" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="306" y1="258" x2="364" y2="258" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <circle cx="110" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v0</text>
  <circle cx="200" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v1</text>
  <circle cx="290" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v2</text>
  <circle cx="380" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v3</text>

  <!-- weights below nodes -->
  <text x="110" y="290" text-anchor="middle" font-size="9.5" fill="#666">w0</text>
  <text x="200" y="290" text-anchor="middle" font-size="9.5" fill="#666">w1</text>
  <text x="290" y="290" text-anchor="middle" font-size="9.5" fill="#666">w2</text>
  <text x="380" y="290" text-anchor="middle" font-size="9.5" fill="#666">w3</text>

  <!-- red X between adjacent (cannot both take) -->
  <text x="155" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="245" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="335" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- recurrence box -->
  <rect x="55" y="302" width="410" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">f[i] = f[i+1] + w_i · f[i+2]</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#555">跳过 i / 取 i（强制 i+1 留空）　|　w_v = 2^{cnt[v]} − 1</text>
</svg>
