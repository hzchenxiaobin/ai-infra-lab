<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 的 DP 表演算</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">floor = "10110101", carpetLen = 2, numCarpets = 2, n = 8</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="52" width="40" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i</text>
  <rect x="80" y="52" width="60" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">floor[i]</text>
  <rect x="140" y="52" width="90" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="70" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">dp[i][0]</text>
  <rect x="230" y="52" width="90" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="70" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">dp[i][1]</text>
  <rect x="320" y="52" width="90" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="70" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">dp[i][2]</text>

  <!-- ===== Row i=8 (boundary, dashed) ===== -->
  <rect x="40" y="82" width="40" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">8</text>
  <rect x="80" y="82" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="10.5" fill="#bbb">—</text>
  <rect x="140" y="82" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="100" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="230" y="82" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="100" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="320" y="82" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="100" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <!-- ===== Row i=7 : floor 1 ===== -->
  <rect x="40" y="110" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="128" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">7</text>
  <rect x="80" y="110" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="140" y="110" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
