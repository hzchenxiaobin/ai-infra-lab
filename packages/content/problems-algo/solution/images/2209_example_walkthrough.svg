  <rect x="230" y="222" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="240" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="320" y="222" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="240" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- ===== Row i=2 : floor 1 ===== -->
  <rect x="40" y="250" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="268" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2</text>
  <rect x="80" y="250" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="140" y="250" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
