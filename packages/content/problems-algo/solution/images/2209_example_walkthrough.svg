  <rect x="320" y="166" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">0</text>

  <!-- ===== Row i=4 : floor 0 ===== -->
  <rect x="40" y="194" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>
  <rect x="80" y="194" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
