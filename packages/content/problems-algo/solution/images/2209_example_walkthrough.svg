  <rect x="230" y="250" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="268" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="320" y="250" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="268" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- ===== Row i=1 : floor 0 ===== -->
  <rect x="40" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="296" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>
  <rect x="80" y="278" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="296" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">0</text>
  <rect x="140" y="278" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="296" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="230" y="278" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="296" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="320" y="278" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="296" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- ===== Row i=0 : floor 1 (answer row) ===== -->
  <rect x="40" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="324" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">0</text>
  <rect x="80" y="306" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="140" y="306" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="324" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="230" y="306" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="324" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="320" y="306" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2 ←</text>

  <!-- Notes -->
  <text x="430" y="100" font-size="9.5" fill="#888">i 从 8 往 0 填</text>
  <text x="430" y="114" font-size="9.5" fill="#888">j 从 0 往 2 填</text>
  <rect x="426" y="124" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="442" y="134" font-size="9.5" fill="#666">铺地毯生效</text>
  <rect x="426" y="140" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="442" y="150" font-size="9.5" fill="#666">答案</text>

  <!-- annotations -->
  <text x="430" y="172" font-size="9.5" fill="#d6a040">i=7,j=1: 铺[7,8)</text>
  <text x="430" y="188" font-size="9.5" fill="#d6a040">i=5,j=2: 铺[5,6)</text>
  <text x="430" y="258" font-size="9.5" fill="#d6a040">i=2,j=1: 铺[2,3]</text>
  <text x="430" y="324" font-size="9.5" fill="#4a7a3a" font-weight="bold">dp[0][2]=2 ✓</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">橙格=在该位置铺地毯使结果降为 0；最优方案 [2,3] ∪ [5,6]，剩余白色 {0,7} = 2</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#aaa">读表方向：右下角（边界 0）向左上角逐步逼近答案</text>
</svg>
