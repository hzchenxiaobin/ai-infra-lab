  <rect x="230" y="110" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="128" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">0</text>
  <rect x="320" y="110" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="128" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <!-- ===== Row i=6 : floor 0 ===== -->
  <rect x="40" y="138" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">6</text>
  <rect x="80" y="138" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">0</text>
  <rect x="140" y="138" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="156" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="230" y="138" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="156" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="320" y="138" width="90" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="156" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <!-- ===== Row i=5 : floor 1 ===== -->
  <rect x="40" y="166" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">5</text>
