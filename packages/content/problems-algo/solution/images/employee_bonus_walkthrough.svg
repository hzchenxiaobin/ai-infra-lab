<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 行员工逐行匹配 + WHERE 过滤留 3 行</text>

  <!-- Header: step table -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">LEFT JOIN 阶段：逐员工查 Bonus 表</text>
  <rect x="40" y="58" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="75" font-size="9.5" fill="#333">empId</text>
  <text x="120" y="75" font-size="9.5" fill="#333">name</text>
  <text x="200" y="75" font-size="9.5" fill="#333">Bonus 匹配</text>
  <text x="320" y="75" font-size="9.5" fill="#333">bonus 值</text>
  <text x="430" y="75" font-size="9.5" fill="#333">JOIN 产出</text>
  <line x1="95" y1="58" x2="95" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="58" x2="160" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="58" x2="290" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="58" x2="380" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row: Brad (3) - no match -->
  <rect x="40" y="84" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="100" font-size="9.5" fill="#333">3</text>
  <text x="120" y="100" font-size="9.5" fill="#333">Brad</text>
  <text x="200" y="100" font-size="9.5" fill="#888">无匹配（Bonus 无 empId=3）</text>
  <text x="320" y="100" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="430" y="100" font-size="9.5" fill="#d6a040" font-weight="bold">保留 1 行</text>
  <line x1="95" y1="84" x2="95" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="84" x2="160" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="84" x2="290" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="84" x2="380" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row: John (1) - no match -->
  <rect x="40" y="108" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="124" font-size="9.5" fill="#333">1</text>
  <text x="120" y="124" font-size="9.5" fill="#333">John</text>
  <text x="200" y="124" font-size="9.5" fill="#888">无匹配（Bonus 无 empId=1）</text>
  <text x="320" y="124" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="430" y="124" font-size="9.5" fill="#d6a040" font-weight="bold">保留 1 行</text>
  <line x1="95" y1="108" x2="95" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="108" x2="160" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="108" x2="290" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="108" x2="380" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row: Dan (2) - match 500 -->
  <rect x="40" y="132" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="148" font-size="9.5" fill="#333">2</text>
  <text x="120" y="148" font-size="9.5" fill="#333">Dan</text>
  <text x="200" y="148" font-size="9.5" fill="#4a7a3a">匹配 Bonus.empId=2</text>
  <text x="320" y="148" font-size="9.5" fill="#4a7a3a" font-weight="bold">500</text>
  <text x="430" y="148" font-size="9.5" fill="#4a7a3a" font-weight="bold">拼接 1 行</text>
  <line x1="95" y1="132" x2="95" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="132" x2="160" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="132" x2="290" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="132" x2="380" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row: Thomas (4) - match 2000 -->
  <rect x="40" y="156" width="480" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="172" font-size="9.5" fill="#333">4</text>
  <text x="120" y="172" font-size="9.5" fill="#333">Thomas</text>
  <text x="200" y="172" font-size="9.5" fill="#4a7a3a">匹配 Bonus.empId=4</text>
  <text x="320" y="172" font-size="9.5" fill="#333">2000</text>
  <text x="430" y="172" font-size="9.5" fill="#4a7a3a" font-weight="bold">拼接 1 行</text>
  <line x1="95" y1="156" x2="95" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="156" x2="160" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="156" x2="290" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="156" x2="380" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="280" y="200" text-anchor="middle" font-size="9.5" fill="#888">LEFT JOIN 共产出 4 行（无匹配的也保留，bonus 填 NULL）</text>

  <!-- Down arrow to WHERE -->
  <path d="M280 206 L280 230" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="222" font-size="9.5" fill="#d6a040">WHERE bonus &lt; 1000 OR bonus IS NULL</text>

  <!-- WHERE filter stage -->
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">WHERE 阶段：逐行判定保留 / 丢弃</text>
  <rect x="40" y="254" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="271" font-size="9.5" fill="#333">name</text>
  <text x="180" y="271" font-size="9.5" fill="#333">bonus</text>
  <text x="280" y="271" font-size="9.5" fill="#333">bonus &lt; 1000</text>
  <text x="390" y="271" font-size="9.5" fill="#333">bonus IS NULL</text>
  <text x="490" y="271" font-size="9.5" fill="#333">判定</text>
  <line x1="130" y1="254" x2="130" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="254" x2="230" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="254" x2="350" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="254" x2="460" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Brad row -->
  <rect x="40" y="280" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="296" font-size="9.5" fill="#333">Brad</text>
  <text x="180" y="296" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="280" y="296" font-size="9.5" fill="#888">UNKNOWN</text>
  <text x="390" y="296" font-size="9.5" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="490" y="296" font-size="9.5" fill="#4a7a3a" font-weight="bold">保留 ✓</text>
  <line x1="130" y1="280" x2="130" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="280" x2="230" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="280" x2="350" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="280" x2="460" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- John row -->
  <rect x="40" y="304" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="320" font-size="9.5" fill="#333">John</text>
  <text x="180" y="320" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="280" y="320" font-size="9.5" fill="#888">UNKNOWN</text>
  <text x="390" y="320" font-size="9.5" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="490" y="320" font-size="9.5" fill="#4a7a3a" font-weight="bold">保留 ✓</text>
  <line x1="130" y1="304" x2="130" y2="328" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="304" x2="230" y2="328" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="304" x2="350" y2="328" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="304" x2="460" y2="328" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Dan row -->
  <rect x="40" y="328" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="344" font-size="9.5" fill="#333">Dan</text>
  <text x="180" y="344" font-size="9.5" fill="#4a7a3a" font-weight="bold">500</text>
  <text x="280" y="344" font-size="9.5" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="390" y="344" font-size="9.5" fill="#888">FALSE</text>
  <text x="490" y="344" font-size="9.5" fill="#4a7a3a" font-weight="bold">保留 ✓</text>
  <line x1="130" y1="328" x2="130" y2="352" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="328" x2="230" y2="352" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="328" x2="350" y2="352" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="328" x2="460" y2="352" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Thomas row -->
  <rect x="40" y="352" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="368" font-size="9.5" fill="#333">Thomas</text>
  <text x="180" y="368" font-size="9.5" fill="#333">2000</text>
  <text x="280" y="368" font-size="9.5" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="390" y="368" font-size="9.5" fill="#888">FALSE</text>
  <text x="490" y="368" font-size="9.5" fill="#b85450" font-weight="bold">丢弃 ✗</text>
  <line x1="130" y1="352" x2="130" y2="376" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="352" x2="230" y2="376" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="352" x2="350" y2="376" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="352" x2="460" y2="376" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Down arrow -->
  <path d="M280 378 L280 402" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="130" y="406" width="300" height="62" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">最终输出（3 行，按任意顺序）</text>
  <rect x="170" y="430" width="220" height="32" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="450" font-size="10" fill="#333">Brad | null</text>
  <text x="290" y="450" font-size="10" fill="#333">Dan | 500</text>
  <text x="365" y="450" font-size="9.5" fill="#888">John | null</text>
</svg>
