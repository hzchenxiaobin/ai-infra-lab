<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：切分 → 逐词变换 → 拼接</text>

  <!-- Step 1: split -->
  <rect x="150" y="48" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">按空格切分 sentence → words[]</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#666">split(' ') 得到单词列表</text>
  <path d="M 280 90 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="150" y="114" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">结果列表 res = []，索引 i = 1</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#666">逐词处理，i 从 1 开始</text>
  <path d="M 280 156 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop box -->
  <rect x="60" y="182" width="440" height="160" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">对每个 word = words[i-1]：</text>

  <!-- decision diamond: first char vowel? -->
  <polygon points="280,214 380,252 280,290 180,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">首字母(小写)</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是元音?</text>

  <!-- yes branch: vowel -->
  <path d="M 180 252 L 110 252" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="246" font-size="10" fill="#4a7a3a">是</text>
  <rect x="62" y="234" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="86" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">word</text>
  <text x="86" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+ "ma"</text>

  <!-- no branch: consonant -->
  <path d="M 380 252 L 448 252" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="246" font-size="10" fill="#b85450">否</text>
  <rect x="450" y="234" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="474" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">移首</text>
  <text x="474" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+ "ma"</text>

  <!-- merge: append a*i -->
  <path d="M 86 272 L 86 300 L 200 300" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 272 L 474 300 L 360 300" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="288" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">追加 "a" × i（i 个字母 a）</text>

  <!-- push to res -->
  <path d="M 280 320 L 280 334" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="332" font-size="10" fill="#4a7a3a">res.append(word); i += 1</text>

  <!-- loop back arrow -->
  <path d="M 60 252 C 40 252, 40 200, 60 196" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="220" font-size="10" fill="#4a7a3a">下一个</text>

  <!-- Step 4: join -->
  <path d="M 280 342 L 280 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="368" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">用空格拼接 res → 返回结果</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#666">" ".join(res)</text>

  <!-- output -->
  <path d="M 280 412 L 280 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="436" width="200" height="30" fill="#446688" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">返回 Goat Latin 句子</text>
</svg>
