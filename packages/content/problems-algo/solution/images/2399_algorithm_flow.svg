<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历，首次记位置 / 第二次判间隔</text>

  <!-- ===== Start ===== -->
  <g filter="url(#rough2)">
    <rect x="200" y="44" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="17"/>
    <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：first[26] 全置 −1</text>
  </g>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop header ===== -->
  <g filter="url(#rough2)">
    <rect x="190" y="98" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 i = 0 … n−1</text>
  </g>
  <line x1="280" y1="134" x2="280" y2="152" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== compute idx ===== -->
  <g filter="url(#rough2)">
    <rect x="170" y="154" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="178" text-anchor="middle" font-size="12" fill="#333">c = s[i]；idx = c − 'a'</text>
  </g>
  <line x1="280" y1="192" x2="280" y2="208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: first[idx] == -1 ? ===== -->
  <g filter="url(#rough2)">
    <polygon points="280,210 376,252 280,294 184,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">first[idx]</text>
    <text x="280" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== −1 ?</text>
  </g>

  <!-- Yes branch: left -->
  <text x="160" y="246" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 184 252 L 130 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="234" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="85" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">first[idx]=i</text>
  </g>
  <!-- loop back up to loop header -->
  <path d="M 85 234 Q 85 116 190 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="100" y="170" font-size="10" fill="#4a7a3a">回循环</text>

  <!-- No branch: down -->
  <text x="296" y="312" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="280" y1="294" x2="280" y2="316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== compute gap ===== -->
  <g filter="url(#rough2)">
    <rect x="160" y="318" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333">gap = i − first[idx] − 1</text>
  </g>
  <line x1="280" y1="356" x2="280" y2="372" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 2: gap == distance[idx] ? ===== -->
  <g filter="url(#rough2)">
    <polygon points="280,374 380,416 280,458 180,416" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gap ==</text>
    <text x="280" y="427" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">distance[idx] ?</text>
  </g>

  <!-- No branch: left to return false -->
  <text x="158" y="410" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 416 L 120 416" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="20" y="398" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="70" y="421" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false ✗</text>
  </g>

  <!-- Yes branch: right to return true (loop ends) -->
  <text x="402" y="410" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 416 L 440 416" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="440" y="398" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="490" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">下一 i</text>
    <text x="490" y="429" text-anchor="middle" font-size="10" fill="#888">循环继续</text>
  </g>

  <!-- loop end -> return true -->
  <path d="M 490 398 Q 490 478 280 478" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="200" y="460" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17"/>
    <text x="280" y="482" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">循环结束 → return true ✓</text>
  </g>
</svg>
