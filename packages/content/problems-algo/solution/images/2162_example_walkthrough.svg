<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：600 秒 → 6 与 76 秒 → 6</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">两种表示分别算代价，取最小</text>

  <!-- vertical divider -->
  <line x1="285" y1="56" x2="285" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 1 (left) ===== -->
  <text x="140" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例1：startAt=1, t=600</text>
  <text x="140" y="82" text-anchor="middle" font-size="9.5" fill="#888">moveCost=2, pushCost=1</text>

  <!-- Rep A: (10,0) → 1000 -->
  <text x="28" y="108" font-size="9.5" fill="#4a7a3a" font-weight="bold">标准(10,0)</text>
  <rect x="56" y="92" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="92" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="128" y="92" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="92" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- annotations -->
  <text x="72" y="130" text-anchor="middle" font-size="8.5" fill="#4a7a3a">按1</text>
  <text x="108" y="130" text-anchor="middle" font-size="8.5" fill="#d6a040">移+按</text>
  <text x="144" y="130" text-anchor="middle" font-size="8.5" fill="#4a7a3a">按</text>
  <text x="180" y="130" text-anchor="middle" font-size="8.5" fill="#4a7a3a">按</text>
  <text x="140" y="146" text-anchor="middle" font-size="10" fill="#444">= 1 + (2+1) + 1 + 1 = </text>
  <text x="240" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Rep B: (9,60) → 0960 → 960 -->
  <text x="28" y="172" font-size="9.5" fill="#b85450" font-weight="bold">借位(9,60)</text>
  <!-- leading 0 struck through -->
  <rect x="56" y="156" width="32" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="72" y="174" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">0</text>
  <line x1="56" y1="158" x2="88" y2="180" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 9 6 0 -->
  <rect x="92" y="156" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="128" y="156" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="164" y="156" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- annotations -->
  <text x="72" y="194" text-anchor="middle" font-size="8.5" fill="#bbb">去除</text>
  <text x="108" y="194" text-anchor="middle" font-size="8.5" fill="#b85450">移+按</text>
  <text x="144" y="194" text-anchor="middle" font-size="8.5" fill="#b85450">移+按</text>
  <text x="180" y="194" text-anchor="middle" font-size="8.5" fill="#b85450">移+按</text>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#444">= (2+1) × 3 = </text>
  <text x="216" y="210" font-size="11" fill="#b85450" font-weight="bold">9</text>

  <!-- min box -->
  <rect x="60" y="222" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min(6, 9) = 6 ✓</text>

  <!-- arrow: why standard wins -->
  <text x="140" y="270" text-anchor="middle" font-size="9.5" fill="#888">startAt=1 匹配首位 1 → 省一次移动</text>

  <!-- ===== Example 2 (right) ===== -->
  <text x="420" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例2：startAt=0, t=76</text>
  <text x="420" y="82" text-anchor="middle" font-size="9.5" fill="#888">moveCost=1, pushCost=2</text>

  <!-- Rep A: (1,16) → 0116 → 116 -->
  <text x="308" y="108" font-size="9.5" fill="#4a7a3a" font-weight="bold">标准(1,16)</text>
  <rect x="336" y="92" width="32" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="352" y="110" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">0</text>
  <line x1="336" y1="94" x2="368" y="116" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="372" y="92" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="408" y="92" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="444" y="92" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <!-- annotations -->
  <text x="352" y="130" text-anchor="middle" font-size="8.5" fill="#bbb">去除</text>
  <text x="388" y="130" text-anchor="middle" font-size="8.5" fill="#d6a040">移+按</text>
  <text x="424" y="130" text-anchor="middle" font-size="8.5" fill="#4a7a3a">按</text>
  <text x="460" y="130" text-anchor="middle" font-size="8.5" fill="#d6a040">移+按</text>
  <text x="420" y="146" text-anchor="middle" font-size="10" fill="#444">= (1+2) + 2 + (1+2) = </text>
  <text x="520" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Rep B: (0,76) → 0076 → 76 -->
  <text x="308" y="172" font-size="9.5" fill="#b85450" font-weight="bold">借位(0,76)</text>
  <!-- leading 00 struck through -->
  <rect x="336" y="156" width="32" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="352" y="174" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">0</text>
  <line x1="336" y1="158" x2="368" y2="180" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="372" y="156" width="32" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="388" y="174" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">0</text>
  <line x1="372" y1="158" x2="404" y2="180" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 7 6 -->
  <rect x="408" y="156" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="444" y="156" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <!-- annotations -->
  <text x="352" y="194" text-anchor="middle" font-size="8.5" fill="#bbb">去除</text>
  <text x="388" y="194" text-anchor="middle" font-size="8.5" fill="#bbb">去除</text>
  <text x="424" y="194" text-anchor="middle" font-size="8.5" fill="#b85450">移+按</text>
  <text x="460" y="194" text-anchor="middle" font-size="8.5" fill="#b85450">移+按</text>
  <text x="420" y="210" text-anchor="middle" font-size="10" fill="#444">= (1+2) × 2 = </text>
  <text x="492" y="210" font-size="11" fill="#b85450" font-weight="bold">6</text>

  <!-- min box -->
  <rect x="340" y="222" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="243" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min(8, 6) = 6 ✓</text>

  <!-- arrow: why borrow wins -->
  <text x="420" y="270" text-anchor="middle" font-size="9.5" fill="#888">去两个前导零 → 只按 2 键 → 省 pushCost</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="290" width="480" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对比两个示例的最优来源</text>
  <text x="60" y="332" font-size="10" fill="#555">示例1：标准表示 (10,0) 更优 → startAt=1 恰好匹配首位，省一次 moveCost</text>
  <text x="60" y="350" font-size="10" fill="#555">示例2：借位表示 (0,76) 更优 → 多两个前导零被去除，少按两个键省 pushCost</text>
  <text x="60" y="368" font-size="10" fill="#555">结论：两种表示各有优势，必须都算再取最小</text>
  <text x="60" y="380" font-size="9.5" fill="#888">绿框=只按(push)，橙框=移+按(move+push)，灰框划线=前导零去除(免费)</text>
</svg>
