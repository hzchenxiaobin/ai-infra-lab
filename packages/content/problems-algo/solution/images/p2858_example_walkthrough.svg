<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="386" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：n = 4, edges = [[2,0],[2,1],[1,3]]，有向链 0 ← 2 → 1 → 3</text>

  <!-- 有向树 -->
  <line x1="183" y1="80" x2="101" y2="80" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="217" y1="80" x2="299" y2="80" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="337" y1="80" x2="419" y2="80" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="141" y="66" text-anchor="middle" font-size="10" fill="#888">2→0</text>
  <text x="259" y="66" text-anchor="middle" font-size="10" fill="#888">2→1</text>
  <text x="379" y="66" text-anchor="middle" font-size="10" fill="#888">1→3</text>

  <circle cx="80" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="12" fill="#333">0</text>
  <circle cx="200" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <circle cx="320" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <circle cx="440" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#555">以 0 为根 BFS：order = [0, 2, 1, 3]，parent = [−1, 2, 0, 1]</text>

  <!-- 表格标题 -->
  <text x="150" y="140" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">第一趟：逆序求 dp（孩子先算）</text>
  <text x="410" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">第二趟：正序换根（父亲先算）</text>

  <!-- 表 1 高亮行（u=0） -->
  <rect x="25" y="266" width="250" height="30" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 表 1 边框与网格 -->
  <rect x="25" y="146" width="250" height="150" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="146" x2="70" y2="296" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="135" y1="146" x2="135" y2="296" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="195" y1="146" x2="195" y2="296" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="176" x2="275" y2="176" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="206" x2="275" y2="206" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="236" x2="275" y2="236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="266" x2="275" y2="266" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表 1 表头 -->
  <text x="47" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">u</text>
  <text x="102" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">孩子 v</text>
  <text x="165" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">w(u→v)</text>
  <text x="235" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[u]</text>

  <!-- 表 1 数据 -->
  <text x="47" y="195" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="102" y="195" text-anchor="middle" font-size="10.5" fill="#333">—</text>
  <text x="165" y="195" text-anchor="middle" font-size="10.5" fill="#333">—</text>
  <text x="235" y="195" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <text x="47" y="225" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="102" y="225" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="165" y="225" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0 (顺)</text>
  <text x="235" y="225" text-anchor="middle" font-size="10.5" fill="#333">0 + 0 = 0</text>

  <text x="47" y="255" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="102" y="255" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="165" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0 (顺)</text>
  <text x="235" y="255" text-anchor="middle" font-size="10.5" fill="#333">0 + 0 = 0</text>

  <text x="47" y="285" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="102" y="285" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="165" y="285" text-anchor="middle" font-size="10.5" fill="#b85450">1 (逆)</text>
  <text x="235" y="285" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0 + 1 = 1</text>

  <!-- 表 2 边框与网格 -->
  <rect x="285" y="146" width="250" height="150" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="321" y1="146" x2="321" y2="296" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="365" y1="146" x2="365" y2="296" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="435" y1="146" x2="435" y2="296" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="285" y1="176" x2="535" y2="176" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="285" y1="206" x2="535" y2="206" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="285" y1="236" x2="535" y2="236" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="285" y1="266" x2="535" y2="266" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表 2 表头 -->
  <text x="303" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v</text>
  <text x="343" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">父 u</text>
  <text x="400" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">原边方向</text>
  <text x="485" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">answer[v]</text>

  <!-- 表 2 数据 -->
  <text x="303" y="195" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="343" y="195" text-anchor="middle" font-size="10.5" fill="#333">—</text>
  <text x="400" y="195" text-anchor="middle" font-size="10.5" fill="#333">—</text>
  <text x="485" y="195" text-anchor="middle" font-size="10.5" fill="#333">1 = dp[0]</text>

  <text x="303" y="225" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="343" y="225" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="400" y="225" text-anchor="middle" font-size="10.5" fill="#333">2→0</text>
  <text x="485" y="225" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 − 1 = 0</text>

  <text x="303" y="255" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="343" y="255" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="400" y="255" text-anchor="middle" font-size="10.5" fill="#333">2→1</text>
  <text x="485" y="255" text-anchor="middle" font-size="10.5" fill="#b85450">0 + 1 = 1</text>

  <text x="303" y="285" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="343" y="285" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="400" y="285" text-anchor="middle" font-size="10.5" fill="#333">1→3</text>
  <text x="485" y="285" text-anchor="middle" font-size="10.5" fill="#b85450">1 + 1 = 2</text>

  <!-- 结果框 -->
  <rect x="110" y="310" width="340" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = [1, 1, 0, 2] ✓</text>
  <text x="280" y="349" text-anchor="middle" font-size="10.5" fill="#4a7a3a">节点 2 所有边顺流出 → 0 次反转（全局最小）</text>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">换根 ±1 判定：原边指向旧根 → −1；指向新根 → +1</text>
</svg>
