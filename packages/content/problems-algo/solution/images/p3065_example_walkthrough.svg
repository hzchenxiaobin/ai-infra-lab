<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 11, 10, 1, 3]，k = 10</text>

  <!-- row 0: [2,11,10,1,3] -->
  <rect x="60" y="56" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="106" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="152" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="198" y="56" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244" y="56" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="195" y="52" width="46" height="42" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="218" y="102" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">min</text>
  <text x="330" y="78" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作① 删最小 1</text>
  <path d="M 380 92 L 380 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- row 1: [2,11,10,3] -->
  <rect x="60" y="124" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="106" y="124" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="152" y="124" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="198" y="124" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="57" y="120" width="46" height="42" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">min</text>
  <text x="330" y="146" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作② 删最小 2</text>
  <path d="M 380 160 L 380 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- row 2: [11,10,3] -->
  <rect x="60" y="192" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="106" y="192" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="152" y="192" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="214" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="149" y="188" width="46" height="42" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="172" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">min</text>
  <text x="330" y="214" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作③ 删最小 3</text>
  <path d="M 380 228 L 380 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- row 3: [11,10] all green -->
  <rect x="60" y="260" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="106" y="260" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="330" y="282" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部 ≥ 10 ✓ 停止</text>

  <!-- bottom box -->
  <rect x="48" y="316" width="424" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">三次操作删掉的恰好就是初始 &lt; 10 的那三个元素 2、1、3</text>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">→ 最少操作数 = #{ x &lt; k } = 3</text>
</svg>
