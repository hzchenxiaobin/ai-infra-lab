<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心扫描算法流程</text>

  <ellipse cx="260" cy="62" rx="50" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 84 L 260 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="170" y="106" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0</text>
  <text x="260" y="139" text-anchor="middle" font-size="10" fill="#888">n = bits.length</text>

  <path d="M 260 146 L 260 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="260,170 380,212 260,254 140,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n - 1 ?</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#666">还没扫到末位 0</text>

  <path d="M 380 212 L 420 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="396" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="420" y="194" width="92" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="466" y="210" text-anchor="middle" font-size="11" fill="#666">退出循环</text>
  <text x="466" y="226" text-anchor="middle" font-size="10" fill="#999">判定落点</text>

  <path d="M 260 254 L 260 276" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="232" y="270" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <polygon points="260,278 360,318 260,358 160,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">bits[i] == 1 ?</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#666">判定当前位</text>

  <path d="M 360 318 L 400 318" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="376" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>

  <rect x="400" y="300" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i += 2</text>

  <path d="M 160 318 L 110 318" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="138" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="10" y="300" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i += 1</text>

  <path d="M 60 300 L 60 200 L 200 200" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 455 300 L 455 200 L 320 200" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="258" y="194" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">回到判定</text>

  <ellipse cx="466" cy="372" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return i == n-1</text>

  <path d="M 466 234 L 466 352" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="486" y="296" font-size="10" fill="#888">i ≥ n-1</text>
</svg>
