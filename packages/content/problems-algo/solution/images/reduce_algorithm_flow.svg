<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一个循环 + 一个累加器</text>

  <!-- start -->
  <ellipse cx="180" cy="58" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M180,76 L180,100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="115" y="100" width="130" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">acc = init;  i = 0</text>

  <path d="M180,140 L180,168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond i < n -->
  <polygon points="180,168 250,210 180,252 110,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是 down -->
  <path d="M180,252 L180,278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="268" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- body -->
  <rect x="95" y="278" width="170" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">acc = fn(acc, nums[i])</text>
  <text x="180" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = i + 1</text>

  <!-- loop back: from body left up to diamond left -->
  <path d="M95,300 L40,300 L40,210 L110,210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="48" y="205" font-size="10" fill="#888" filter="url(#rough2)">循环</text>

  <!-- 否 right to return acc -->
  <path d="M250,210 L322,210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="322" y="190" width="120" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return acc</text>

  <!-- note: empty array -->
  <rect x="300" y="280" width="200" height="56" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n = 0 时（空数组）</text>
  <text x="400" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">直接走「否」分支</text>
  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 返回 init</text>

  <path d="M322,210 L300,278" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
</svg>
