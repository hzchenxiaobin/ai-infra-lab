<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描 + 字符变化时结算</text>

  <!-- Start -->
  <ellipse cx="290" cy="54" rx="40" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 290 72 L 290 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="120" y="92" width="340" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化 max₁=0, max₀=0</text>
  <text x="290" y="129" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">cur=∅, run=0</text>

  <path d="M 290 138 L 290 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry: take next char -->
  <rect x="160" y="162" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">取下一字符 c（遍历 s）</text>

  <path d="M 290 198 L 290 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c == cur? -->
  <polygon points="290,218 420,260 290,302 160,260" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">c == cur ?</text>
  <text x="290" y="272" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">同字符延续？</text>

  <!-- Yes branch: right -->
  <text x="428" y="258" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 420 260 L 452 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="452" y="242" width="108" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="506" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">run += 1</text>

  <!-- Yes branch loops back up: from right box up to "取下一字符" -->
  <path d="M 506 242 L 506 180 L 420 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch: down -->
  <path d="M 290 302 L 290 320" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="316" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- Settle previous run + reset -->
  <rect x="100" y="324" width="380" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">结算前段：cur=='1' ? max₁=max(max₁,run)</text>
  <text x="290" y="361" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">: max₀=max(max₀,run)</text>
  <text x="290" y="375" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">然后 cur=c, run=1</text>

  <!-- No branch loops back up: from settle box left side up to "取下一字符" -->
  <path d="M 100 353 L 60 353 L 60 180 L 160 180" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="48" y="270" font-size="9" fill="#888" filter="url(#rough2)" text-anchor="middle">循环</text>

  <!-- After loop: settle last run -->
  <path d="M 290 382 L 290 408" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="400" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">遍历结束</text>

  <rect x="100" y="412" width="380" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="438" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">结算末段 run → 更新 max₁ 或 max₀</text>

  <path d="M 290 454 L 290 472" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="290" cy="494" rx="110" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="499" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 max₁ &gt; max₀</text>
</svg>
