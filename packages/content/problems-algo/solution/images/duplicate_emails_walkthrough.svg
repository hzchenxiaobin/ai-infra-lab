<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：GROUP BY 分组后逐组判定计数</text>

  <!-- Step 1: Original rows -->
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 1：原始行</text>
  <rect x="50" y="62" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="77" font-size="10" fill="#333">id</text>
  <text x="115" y="77" font-size="10" fill="#333">email</text>
  <line x1="90" y1="62" x2="90" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="84" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="98" font-size="10" fill="#333">1</text>
  <text x="115" y="98" font-size="10" fill="#333">a@b.com</text>
  <line x1="90" y1="84" x2="90" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="104" width="100" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="118" font-size="10" fill="#333">2</text>
  <text x="115" y="118" font-size="10" fill="#333">c@d.com</text>
  <line x1="90" y1="104" x2="90" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="124" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="138" font-size="10" fill="#333">3</text>
  <text x="115" y="138" font-size="10" fill="#333">a@b.com</text>
  <line x1="90" y1="124" x2="90" y2="144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow to step 2 -->
  <path d="M160 114 L210 114" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="185" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">GROUP BY</text>

  <!-- Step 2: Grouped -->
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 2：分组 + 计数</text>
  <rect x="230" y="62" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="77" font-size="10" fill="#333">email</text>
  <text x="370" y="77" font-size="10" fill="#333">COUNT(*)</text>
  <line x1="310" y1="62" x2="310" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="230" y="84" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="99" font-size="10" fill="#333">a@b.com</text>
  <text x="370" y="99" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="310" y1="84" x2="310" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="230" y="106" width="180" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="121" font-size="10" fill="#333">c@d.com</text>
  <text x="370" y="121" font-size="11" fill="#333">1</text>
  <line x1="310" y1="106" x2="310" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- group member annotations -->
  <text x="270" y="144" text-anchor="middle" font-size="8" fill="#888">↑ id=1, id=3</text>
  <text x="370" y="144" text-anchor="middle" font-size="8" fill="#888">↑ id=2</text>

  <!-- Arrow to step 3 -->
  <path d="M420 114 L470 114" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">HAVING</text>

  <!-- Step 3: Filtered result -->
  <text x="510" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Step 3：筛组</text>
  <rect x="460" y="62" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="77" text-anchor="middle" font-size="10" fill="#333">Email</text>
  <rect x="460" y="84" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="505" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a@b.com</text>

  <!-- Step 4: HAVING logic table -->
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">HAVING 逐组判定</text>
  <rect x="80" y="180" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">email 分组</text>
  <text x="260" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">COUNT(*)</text>
  <text x="350" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">COUNT &gt; 1?</text>
  <text x="440" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">输出</text>
  <line x1="200" y1="180" x2="200" y2="204" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="320" y1="180" x2="320" y2="204" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="180" x2="400" y2="204" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="204" width="400" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="219" text-anchor="middle" font-size="10" fill="#333">a@b.com</text>
  <text x="260" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="350" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="440" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a@b.com</text>
  <line x1="200" y1="204" x2="200" y2="226" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="320" y1="204" x2="320" y2="226" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="204" x2="400" y2="226" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="226" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="241" text-anchor="middle" font-size="10" fill="#333">c@d.com</text>
  <text x="260" y="241" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="350" y="241" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="440" y="241" text-anchor="middle" font-size="10" fill="#888">—（丢弃）</text>
  <line x1="200" y1="226" x2="200" y2="248" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="320" y1="226" x2="320" y2="248" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="226" x2="400" y2="248" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Bottom insight -->
  <rect x="40" y="282" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分组压缩：3 行 → 2 组 → HAVING 留 1 组 → 结果 1 行</text>
  <text x="60" y="320" font-size="10" fill="#333">① GROUP BY email 把同 email 的行合并成一组，COUNT 给出每组行数</text>
  <text x="60" y="336" font-size="10" fill="#333">② HAVING 只留 COUNT&gt;1 的组——"重复"即"组内行数 &gt; 1"</text>
</svg>
