<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：阈值 mid 越大 → 可凑的不相交数对数 count(mid) 越多（单调递增）</text>

  <!-- ===== Sorted array chips ===== -->
  <text x="30" y="52" font-size="12" fill="#888">排序后 nums = [1, 1, 2, 3, 7, 10]，相邻差值：</text>

  <!-- value chips -->
  <rect x="40" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="340" y="62" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <!-- adjacent diff chips below -->
  <rect x="70" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="130" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="96" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="310" y="96" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <text x="410" y="112" font-size="11" fill="#888">只看相邻差值即可</text>

  <!-- arrow down -->
  <path d="M 290 128 L 290 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="140" font-size="11" fill="#888">count(mid) 单调递增</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="70" y1="162" x2="70" y2="332" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="332" x2="430" y2="332" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="168" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="434" y="336" font-size="10" fill="#888">mid →</text>
  <text x="64" y="336" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y axis ticks -->
  <text x="64" y="284" text-anchor="end" font-size="9" fill="#aaa">2</text>
  <text x="64" y="236" text-anchor="end" font-size="9" fill="#aaa">3</text>

  <!-- count(mid): 0→1, 1→2, 2→2, 3→3, 4→3 -->
  <!-- x: mid 0..4 mapped to 100..420 (80px each), y: cnt 0..3 mapped to 332..188 (48px each) -->
  <path d="M 100 332 L 100 284 L 180 284 L 180 236 L 260 236 L 340 236 L 420 236" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="222" font-size="11" fill="#446688" font-weight="bold">mid ↑ ⇒ count ↑</text>

  <!-- mid axis labels -->
  <text x="100" y="348" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="180" y="348" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="260" y="348" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="340" y="348" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="420" y="348" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- p threshold line -->
  <line x1="70" y1="284" x2="430" y2="284" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="434" y="288" font-size="11" fill="#b85450" font-weight="bold">p = 2</text>

  <!-- answer point at mid=1 (count jumps to 2) -->
  <circle cx="180" cy="284" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="180" y1="284" x2="180" y2="332" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="180" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid* = 1</text>

  <!-- feasible / infeasible labels -->
  <text x="108" y="278" font-size="10" fill="#b85450">count &lt; p ✗</text>
  <text x="300" y="278" font-size="10" fill="#4a7a3a">count ≥ p ✓</text>

  <!-- right summary note -->
  <rect x="448" y="162" width="120" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="508" y="186" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="508" y="208" text-anchor="middle" font-size="11" fill="#666">mid ∈ [0, max−min]</text>
  <text x="508" y="228" text-anchor="middle" font-size="11" fill="#666">求最小的 mid</text>
  <text x="508" y="248" text-anchor="middle" font-size="11" fill="#666">使 count(mid) ≥ p</text>
  <text x="508" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>

  <!-- note about greedy/adjacent -->
  <rect x="70" y="372" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">count(mid) = 贪心扫相邻对、能凑则凑（i+=2）的最大不相交对数；mid=1 时 count 从 1 跳到 2</text>
</svg>
