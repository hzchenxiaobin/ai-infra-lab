<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DFS(node, parent) 流程：子树含苹果则累加 childTime + 2</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="92" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">调用 DFS(node, parent)</text>

  <!-- arrow -->
  <line x1="280" y1="80" x2="280" y2="98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="195" y="100" width="170" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333">total = 0</text>
  <text x="280" y="137" text-anchor="middle" font-size="12" fill="#333">has = hasApple[node]</text>

  <!-- arrow -->
  <line x1="280" y1="146" x2="280" y2="164" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="170" y="166" width="220" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333">for child in adj[node], child ≠ parent</text>

  <!-- arrow -->
  <line x1="280" y1="208" x2="280" y2="226" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Recurse box -->
  <rect x="175" y="228" width="210" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333">递归 (childTime, childHas)</text>
  <text x="280" y="265" text-anchor="middle" font-size="12" fill="#333">= dfs(child, node)</text>

  <!-- arrow -->
  <line x1="280" y1="274" x2="280" y2="292" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,294 360,330 280,366 200,330" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">childHas?</text>

  <!-- Yes branch (right) -->
  <line x1="360" y1="330" x2="392" y2="330" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="394" y="306" width="140" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="326" text-anchor="middle" font-size="11.5" fill="#333">total += childTime + 2</text>
  <text x="464" y="343" text-anchor="middle" font-size="11.5" fill="#333">has = True</text>

  <!-- No branch (left) -->
  <line x1="200" y1="330" x2="168" y2="330" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="26" y="306" width="140" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="326" text-anchor="middle" font-size="11.5" fill="#333">跳过</text>
  <text x="96" y="343" text-anchor="middle" font-size="11.5" fill="#333">（空子树不进入）</text>

  <!-- loop-back arrows: from both branch boxes back up to loop box -->
  <path d="M 464 306 Q 464 186 390 186" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 306 Q 96 186 170 186" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="250" font-size="10" fill="#888">下一 child</text>
  <text x="110" y="250" font-size="10" fill="#888">下一 child</text>

  <!-- after loop: arrow to return -->
  <line x1="280" y1="366" x2="280" y2="410" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="392" font-size="10" fill="#888">遍历结束</text>

  <!-- Return oval -->
  <ellipse cx="280" cy="432" rx="110" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return (total, has)</text>
</svg>
