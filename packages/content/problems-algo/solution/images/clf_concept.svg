<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：深度计数器模拟文件夹层级</text>

  <!-- Left: folder tree -->
  <text x="30" y="56" font-size="11" fill="#888" font-weight="bold">文件夹层级树</text>

  <!-- depth labels -->
  <text x="40" y="88" font-size="10" fill="#888">depth 0</text>
  <text x="40" y="128" font-size="10" fill="#888">depth 1</text>
  <text x="40" y="168" font-size="10" fill="#888">depth 2</text>
  <text x="40" y="208" font-size="10" fill="#888">depth 3</text>

  <!-- main folder (depth 0) -->
  <rect x="100" y="72" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">main</text>

  <!-- d1 (depth 1) -->
  <path d="M 138 100 L 138 112 L 120 112 L 120 118" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="118" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1/</text>

  <!-- d2 (depth 2) -->
  <path d="M 120 142 L 120 152 L 102 152 L 102 158" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="72" y="158" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d2/</text>

  <!-- d3 (depth 3) -->
  <path d="M 102 182 L 102 192 L 84 192 L 84 198" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="54" y="198" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d3/</text>

  <!-- tree bracket on far left showing depth axis -->
  <path d="M 200 86 L 210 86 L 210 208 L 200 208" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="216" y="152" font-size="10" fill="#aaa">深度</text>

  <!-- Right: three operation cards -->
  <text x="300" y="56" font-size="11" fill="#888" font-weight="bold">三类操作对 depth 的影响</text>

  <!-- op1: ../ -->
  <rect x="290" y="70" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="90" font-size="13" fill="#b85450" font-weight="bold">"../"</text>
  <text x="360" y="90" font-size="11" fill="#666">→ 回退到父文件夹</text>
  <text x="306" y="108" font-size="11" fill="#333" font-weight="bold">depth = max(0, depth − 1)</text>
  <text x="470" y="108" font-size="10" fill="#b85450">不越界</text>

  <!-- op2: ./ -->
  <rect x="290" y="126" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="146" font-size="13" fill="#d6a040" font-weight="bold">"./"</text>
  <text x="360" y="146" font-size="11" fill="#666">→ 原地停留</text>
  <text x="306" y="164" font-size="11" fill="#333" font-weight="bold">depth 不变</text>
  <text x="440" y="164" font-size="10" fill="#888">(跳过即可)</text>

  <!-- op3: x/ -->
  <rect x="290" y="182" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="202" font-size="13" fill="#446688" font-weight="bold">"x/"</text>
  <text x="360" y="202" font-size="11" fill="#666">→ 进入子文件夹 x</text>
  <text x="306" y="220" font-size="11" fill="#333" font-weight="bold">depth += 1</text>
  <text x="410" y="220" font-size="10" fill="#446688">(保证 x 存在)</text>

  <!-- arrows from tree to op cards -->
  <path d="M 178 86 L 286 86" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 138 110 L 286 146" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 134 L 286 202" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="30" y1="244" x2="530" y2="244" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="30" y="258" width="500" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="12" fill="#444" font-weight="bold">关键直觉：不关心「在哪个文件夹」，只关心「离主文件夹有几层」</text>
  <text x="50" y="304" font-size="11" fill="#666">• 暴力法用真实栈：push 文件夹名（x/）、pop（../），最后栈大小即答案</text>
  <text x="50" y="324" font-size="11" fill="#666">• 但我们从不读取文件夹名，所有「x/」操作对深度的影响完全相同</text>
  <text x="50" y="346" font-size="12" fill="#b85450" font-weight="bold">→ 一个整数 depth 即可替代整个栈，O(1) 空间</text>
  <text x="50" y="362" font-size="11" fill="#888">最终 depth 值 = 返回主文件夹所需的最小 ../ 次数</text>
</svg>
