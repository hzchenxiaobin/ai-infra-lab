<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描 + seen 集合判重，新字符按类别定价</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="62" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="67" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M200,82 L200,94" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="130" y="96" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">ans = 0，seen = ∅</text>
  <path d="M200,132 L200,150" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="130" y="152" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">取下一个字符 c</text>
  <path d="M200,188 L200,204" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：c in seen? -->
  <path d="M200,206 L282,250 L200,294 L118,250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="246" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">c ∈ seen ?</text>
  <text x="200" y="263" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">（已计过？）</text>

  <!-- 是：跳过，绕回取字符 -->
  <path d="M282,250 L400,250 L400,170 L274,170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="345" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是：跳过</text>
  <text x="400" y="208" text-anchor="middle" font-size="9.5" fill="#8a3030" filter="url(#rough2)">重复字符不重复计分</text>

  <!-- 否：计分 -->
  <path d="M200,294 L200,316" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="310" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="112" y="318" width="176" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="338" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">seen ← seen ∪ {c}</text>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += price(c)</text>

  <!-- price 注释框 -->
  <rect x="322" y="318" width="222" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="338" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">price(c)：a–z → 1，A–Z → 2</text>
  <text x="433" y="356" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">0–9 → 3，!@#$ → 5</text>
  <path d="M288,342 L318,342" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M200,366 L200,384" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：还有字符? -->
  <path d="M200,386 L278,430 L200,474 L122,430 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="426" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">还有字符 ?</text>
  <text x="200" y="443" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（i &lt; n ?）</text>

  <!-- 是：绕回取字符 -->
  <path d="M122,430 L52,430 L52,170 L126,170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="422" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M200,474 L200,492" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="488" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <ellipse cx="200" cy="514" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="519" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 复杂度标注 -->
  <rect x="322" y="430" width="222" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="452" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">单趟 O(n)：每字符 O(1) 判重 + 定价</text>
  <text x="433" y="472" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">seen 大小封顶 66 个字符</text>
  <text x="433" y="492" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">⇒ 时间 O(n)，空间 O(1)</text>
</svg>
