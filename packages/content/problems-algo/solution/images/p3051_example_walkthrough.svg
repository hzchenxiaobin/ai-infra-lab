<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：12 行 → IN 过滤剩 7 行 → 分组计数 → 输出 2 人</text>

  <!-- ===== Left panel: WHERE IN filter ===== -->
  <rect x="26" y="40" width="316" height="342" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="184" y="58" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">①② WHERE skill IN (…) 逐行过滤</text>

  <!-- header -->
  <text x="56" y="78" font-size="9.5" fill="#888" font-weight="bold">candidate_id</text>
  <text x="140" y="78" font-size="9.5" fill="#888" font-weight="bold">skill</text>
  <text x="322" y="78" text-anchor="end" font-size="9.5" fill="#888" font-weight="bold">保留?</text>

  <!-- 12 rows, kept rows tinted green -->
  <rect x="34" y="84" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="97" font-size="9.5" fill="#333">123</text><text x="140" y="97" font-size="9.5" fill="#333">Python</text><text x="322" y="97" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="56" y="116" font-size="9.5" fill="#999">234</text><text x="140" y="116" font-size="9.5" fill="#999">R</text><text x="322" y="116" text-anchor="end" font-size="9.5" fill="#b85450">✗</text>

  <rect x="34" y="122" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="135" font-size="9.5" fill="#333">123</text><text x="140" y="135" font-size="9.5" fill="#333">Tableau</text><text x="322" y="135" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="34" y="141" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="9.5" fill="#333">123</text><text x="140" y="154" font-size="9.5" fill="#333">PostgreSQL</text><text x="322" y="154" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="56" y="173" font-size="9.5" fill="#999">234</text><text x="140" y="173" font-size="9.5" fill="#999">PowerBI</text><text x="322" y="173" text-anchor="end" font-size="9.5" fill="#b85450">✗</text>

  <text x="56" y="192" font-size="9.5" fill="#999">234</text><text x="140" y="192" font-size="9.5" fill="#999">SQL Server</text><text x="322" y="192" text-anchor="end" font-size="9.5" fill="#b85450">✗</text>

  <rect x="34" y="198" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="211" font-size="9.5" fill="#333">147</text><text x="140" y="211" font-size="9.5" fill="#333">Python</text><text x="322" y="211" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="34" y="217" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="9.5" fill="#333">147</text><text x="140" y="230" font-size="9.5" fill="#333">Tableau</text><text x="322" y="230" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="56" y="249" font-size="9.5" fill="#999">147</text><text x="140" y="249" font-size="9.5" fill="#999">Java</text><text x="322" y="249" text-anchor="end" font-size="9.5" fill="#b85450">✗</text>

  <rect x="34" y="255" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="9.5" fill="#333">147</text><text x="140" y="268" font-size="9.5" fill="#333">PostgreSQL</text><text x="322" y="268" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="34" y="274" width="300" height="19" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="56" y="287" font-size="9.5" fill="#333">256</text><text x="140" y="287" font-size="9.5" fill="#333">Tableau</text><text x="322" y="287" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="56" y="306" font-size="9.5" fill="#999">102</text><text x="140" y="306" font-size="9.5" fill="#999">DataAnalysis</text><text x="322" y="306" text-anchor="end" font-size="9.5" fill="#b85450">✗</text>

  <text x="184" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留 7 行：123 命中 3 行、147 命中 3 行、256 命中 1 行</text>
  <text x="184" y="348" text-anchor="middle" font-size="9.5" fill="#888">R / PowerBI / SQL Server / Java / DataAnalysis</text>
  <text x="184" y="366" text-anchor="middle" font-size="9.5" fill="#888">这 5 行与必备技能无关，全部被 IN 滤掉</text>

  <!-- ===== Arrow between panels ===== -->
  <path d="M344 200 L366 200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Right panel: GROUP BY + HAVING ===== -->
  <rect x="370" y="40" width="264" height="342" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="502" y="58" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">③④ GROUP BY + HAVING 计数</text>

  <!-- group 123 -->
  <rect x="384" y="70" width="236" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="398" y="89" font-size="10.5" fill="#333" font-weight="bold">候选人 123</text>
  <text x="398" y="106" font-size="9" fill="#555">Python · Tableau · PostgreSQL</text>
  <text x="398" y="124" font-size="10" fill="#2f5d24" font-weight="bold">COUNT(DISTINCT)=3 = 3 ✓ 保留</text>

  <!-- group 147 -->
  <rect x="384" y="152" width="236" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="398" y="171" font-size="10.5" fill="#333" font-weight="bold">候选人 147</text>
  <text x="398" y="188" font-size="9" fill="#555">Python · Tableau · PostgreSQL（Java 已被滤掉）</text>
  <text x="398" y="206" font-size="10" fill="#2f5d24" font-weight="bold">COUNT(DISTINCT)=3 = 3 ✓ 保留</text>

  <!-- group 256 -->
  <rect x="384" y="234" width="236" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="398" y="253" font-size="10.5" fill="#333" font-weight="bold">候选人 256</text>
  <text x="398" y="270" font-size="9" fill="#555">只有 Tableau，缺 Python 和 PostgreSQL</text>
  <text x="398" y="288" font-size="10" fill="#b85450" font-weight="bold">COUNT(DISTINCT)=1 &lt; 3 ✗ 剔除</text>

  <!-- output -->
  <path d="M502 306 L502 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="392" y="328" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="502" y="352" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">输出：candidate_id = {123, 147}</text>

  <!-- ===== Key points ===== -->
  <rect x="30" y="392" width="600" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="411" font-size="10.5" fill="#333">关键：147 的 Java 行在第②步就被滤掉，不参与计数 —— 多余技能天然不影响「命中数 = 3」的判定</text>
</svg>
