<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：同键连按产生歧义 → 按连续相同数字分段</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">每段独立解码（爬楼梯），不同数字键之间无歧义，跨段相乘</text>

  <!-- ===== Left: keypad mapping ===== -->
  <text x="40" y="74" font-size="11" fill="#666" font-weight="bold">按键 → 字母（按 i 次得第 i 个字母）</text>

  <!-- 3-letter keys (blue) -->
  <g font-size="11">
    <rect x="40" y="84" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="69" y="104" text-anchor="middle" fill="#333" font-weight="bold">2→abc</text>
    <rect x="102" y="84" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="104" text-anchor="middle" fill="#333" font-weight="bold">3→def</text>
    <rect x="40" y="118" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="69" y="138" text-anchor="middle" fill="#333" font-weight="bold">4→ghi</text>
    <rect x="102" y="118" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="138" text-anchor="middle" fill="#333" font-weight="bold">5→jkl</text>
    <rect x="40" y="152" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="69" y="172" text-anchor="middle" fill="#333" font-weight="bold">6→mno</text>
    <rect x="102" y="152" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="172" text-anchor="middle" fill="#333" font-weight="bold">8→tuv</text>
  </g>
  <text x="100" y="200" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3 字母键：按 1/2/3 次</text>

  <!-- 4-letter keys (orange, highlighted) -->
  <g font-size="11">
    <rect x="40" y="214" width="58" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
    <text x="69" y="234" text-anchor="middle" fill="#333" font-weight="bold">7→pqrs</text>
    <rect x="102" y="214" width="58" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="234" text-anchor="middle" fill="#333" font-weight="bold">9→wxyz</text>
  </g>
  <text x="100" y="260" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4 字母键：按 1/2/3/4 次</text>

  <!-- 0/1 unused -->
  <rect x="40" y="276" width="120" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="100" y="292" text-anchor="middle" font-size="10" fill="#888">0、1 不映射，不出现</text>

  <!-- ===== Right: run decomposition ===== -->
  <text x="330" y="74" font-size="11" fill="#666" font-weight="bold">分段：连续相同数字成一段</text>

  <!-- pressedKeys = "22233" -->
  <text x="206" y="108" font-size="10.5" fill="#888">pressedKeys</text>
  <g font-size="13" font-weight="bold">
    <!-- run1 222 (blue) -->
    <rect x="300" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="317" y="112" text-anchor="middle" fill="#333">2</text>
    <rect x="336" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="353" y="112" text-anchor="middle" fill="#333">2</text>
    <rect x="372" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="389" y="112" text-anchor="middle" fill="#333">2</text>
    <!-- run2 33 (green) -->
    <rect x="412" y="92" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="429" y="112" text-anchor="middle" fill="#333">3</text>
    <rect x="448" y="92" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="465" y="112" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- split divider between run1 and run2 -->
  <line x1="408" y1="84" x2="408" y2="130" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="408" y="78" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">换键</text>

  <!-- run braces -->
  <path d="M 300 124 Q 300 134 320 136 L 388 136 Q 408 134 408 124" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="152" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">段1 "222"（键2）</text>
  <path d="M 412 124 Q 412 134 432 136 L 466 136 Q 486 134 486 124" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="449" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">段2 "33"（键3）</text>

  <!-- per-run decoding (climb stairs) -->
  <text x="208" y="184" font-size="10.5" fill="#888">每段方案数</text>
  <rect x="300" y="168" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="355" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f(3) = 4</text>
  <rect x="424" y="168" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="462" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f(2) = 2</text>

  <!-- multiply -->
  <text x="412" y="222" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">×</text>
  <path d="M 355 200 L 355 220 L 412 224" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 462 200 L 462 220 L 412 224" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="300" y="232" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="254" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">总方案 = 4 × 2 = 8</text>

  <!-- footer note -->
  <rect x="30" y="320" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">跨段无歧义（换键即换字母），故段间相乘；段内连按 1~k 次有歧义，按爬楼梯递推</text>

  <!-- legend -->
  <rect x="40" y="372" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="62" y="383" font-size="9.5" fill="#666">3字母键(步长1/2/3)</text>
  <rect x="180" y="372" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="202" y="383" font-size="9.5" fill="#666">4字母键(步长1/2/3/4)</text>
  <rect x="320" y="372" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="342" y="383" font-size="9.5" fill="#666">结果/相乘</text>
</svg>
