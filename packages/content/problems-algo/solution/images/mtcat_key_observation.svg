<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">贪心核心：按结束排序 + 从右向左补点</text>

  <!-- ============ Panel 1: 从右向左补 ✓ ============ -->
  <text x="40" y="78" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 从右向左补（共 3 个点）</text>

  <!-- cells 1..6, y=95 -->
  <rect x="150" y="95" width="48" height="44" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="123" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">1</text>
  <rect x="202" y="95" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="95" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="306" y="95" width="48" height="44" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="123" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">4</text>
  <rect x="358" y="95" width="48" height="44" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="123" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">5</text>
  <rect x="410" y="95" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="434" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- Task A bracket [1,3] -->
  <text x="40" y="166" font-size="12" fill="#b85450" filter="url(#rough2)">A[1,3]需2</text>
  <path d="M150,150 L150,158 L302,158 L302,150" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Task B bracket [3,6] -->
  <text x="40" y="186" font-size="12" fill="#d6a040" filter="url(#rough2)">B[3,6]需2</text>
  <path d="M254,170 L254,178 L458,178 L458,170" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="304" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">A 开机 3、2 → B 复用 3，只补 6</text>

  <!-- ============ Panel 2: 从左向右补 ✗ ============ -->
  <text x="40" y="258" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 从左向右补（共 4 个点）</text>

  <rect x="150" y="275" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="174" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="275" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="275" width="48" height="44" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="303" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">3</text>
  <rect x="306" y="275" width="48" height="44" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="303" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">4</text>
  <rect x="358" y="275" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="410" y="275" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="434" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <text x="40" y="346" font-size="12" fill="#b85450" filter="url(#rough2)">A[1,3]需2</text>
  <path d="M150,330 L150,338 L302,338 L302,330" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="366" font-size="12" fill="#d6a040" filter="url(#rough2)">B[3,6]需2</text>
  <path d="M254,350 L254,358 L458,358 L458,350" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="304" y="392" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">A 开机 1、2 → B 无法复用，另补 6、5</text>

  <!-- conclusion -->
  <rect x="55" y="406" width="450" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">越靠右的点越可能 ≥ 后续任务 start_j → 更易被复用</text>
</svg>
