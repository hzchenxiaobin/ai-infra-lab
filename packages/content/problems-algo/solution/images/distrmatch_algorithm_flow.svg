<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心双指针算法流程</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: low=0, high=n, i=0</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="270,104 380,150 270,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(还有字符待处理)</text>

  <!-- No branch -> fill last, end -->
  <path d="M 380 150 L 470 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="442" y="132" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="488" y="155" text-anchor="middle" font-size="10" fill="#333">result[n]=low</text>
  <path d="M 488 168 L 488 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="488" cy="206" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="210" text-anchor="middle" font-size="12" fill="#333">返回 result</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Decision: s[i] == 'I'? -->
  <polygon points="270,218 400,270 270,322 140,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="12" fill="#333">s[i] == 'I' ?</text>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#666">(需要递增)</text>

  <!-- Yes (I) -> left branch -->
  <path d="M 140 270 L 100 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="262" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="20" y="250" width="78" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="59" y="268" text-anchor="middle" font-size="10" fill="#333">result[i]=</text>
  <text x="59" y="282" text-anchor="middle" font-size="10" fill="#555">low; low++</text>

  <!-- sub-arrow: i++ -->
  <path d="M 59 292 L 59 312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="314" width="78" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="59" y="335" text-anchor="middle" font-size="10" fill="#555">i++</text>

  <!-- No (D) -> right branch -->
  <path d="M 400 270 L 440 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="262" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="442" y="250" width="78" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="481" y="268" text-anchor="middle" font-size="10" fill="#333">result[i]=</text>
  <text x="481" y="282" text-anchor="middle" font-size="10" fill="#555">high; high--</text>

  <!-- sub-arrow: i++ -->
  <path d="M 481 292 L 481 312" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="442" y="314" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="481" y="335" text-anchor="middle" font-size="10" fill="#555">i++</text>

  <!-- merge: both branches loop back -->
  <path d="M 59 346 L 59 388 L 270 388 L 270 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 481 346 L 481 388 L 270 388" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#888">继续循环</text>

  <!-- summary note -->
  <text x="270" y="438" text-anchor="middle" font-size="11" fill="#888">每轮填一格、移一格指针，共 n+1 轮，O(n) 时间 O(1) 额外空间</text>
</svg>
