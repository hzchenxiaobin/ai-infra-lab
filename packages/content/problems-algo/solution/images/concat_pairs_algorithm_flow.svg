<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建哈希表 → 遍历唯一串 → 前缀判定 → 查后缀计数</text>

  <!-- Step 1: build hash map -->
  <rect x="100" y="48" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建哈希表 cnt</text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 nums，统计每个字符串出现次数</text>

  <path d="M 280 96 L 280 112" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="100" y="116" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② for 每个 unique 字符串 s（频次 c = cnt[s]）</text>

  <path d="M 280 158 L 280 174" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision - prefix check -->
  <polygon points="280,178 420,222 280,266 140,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">len(s) &lt; len(target)</text>
  <text x="280" y="226" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">且 target 以 s 开头？</text>
  <text x="280" y="244" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(前缀判定)</text>

  <!-- No branch: skip -->
  <path d="M 420 222 L 470 222 L 470 142" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="214" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="478" y="184" font-size="9.5" fill="#b85450" filter="url(#rough2)">skip</text>

  <!-- Yes branch -->
  <path d="M 280 266 L 280 284" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Step 4: compute suffix -->
  <rect x="100" y="288" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ suffix = target.substr(len(s))</text>

  <path d="M 280 330 L 280 346" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: decision - s == suffix? -->
  <polygon points="280,350 400,386 280,422 160,386" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s == suffix？</text>

  <!-- Yes: ans += c*(c-1) -->
  <path d="M 160 386 L 80 386 L 80 430" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="378" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="434" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="460" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans += c × (c − 1)</text>

  <!-- No: ans += c*cnt[suffix] -->
  <path d="M 400 386 L 480 386 L 480 430" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="378" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="360" y="434" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += c × cnt[suffix]</text>

  <!-- loop back -->
  <path d="M 510 454 L 540 454 L 540 136 L 460 136" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="296" font-size="9.5" fill="#888" filter="url(#rough2)" transform="rotate(90 548 296)">下一个 s</text>

  <!-- return -->
  <path d="M 280 474 L 280 490" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="494" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="508" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
