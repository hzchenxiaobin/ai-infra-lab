  <rect x="176" y="50" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="191" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 214 63 L 232 63" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="236" y="50" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="50" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">four</text>
  <text x="323" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">one</text>

  <path d="M 352 63 L 370 63" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- s = fourone 字母行 -->
  <text x="128" y="106" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s =</text>
  <rect x="140" y="88" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
