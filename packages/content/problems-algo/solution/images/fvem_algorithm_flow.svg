<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">正则分解与匹配流程</text>

  <!-- ===== Regex segment 1: ^ ===== -->
  <rect x="50" y="44" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="64" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">^</text>
  <text x="150" y="64" font-size="11" fill="#444">锚定字符串开头</text>

  <path d="M 90 74 L 90 86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Regex segment 2: [a-zA-Z] ===== -->
  <rect x="50" y="86" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[a-zA-Z]</text>
  <text x="150" y="106" font-size="11" fill="#444">首字符必须为字母（大小写均可）</text>

  <path d="M 90 116 L 90 128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Regex segment 3: [a-zA-Z0-9_.-]* ===== -->
  <rect x="40" y="128" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[a-zA-Z0-9_.-]*</text>
  <text x="180" y="148" font-size="11" fill="#444">前缀后续：字母/数字/_/./-，零或多个</text>

  <path d="M 100 158 L 100 170" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Regex segment 4: @leetcode[.]com ===== -->
  <rect x="30" y="170" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">@leetcode[.]com</text>
  <text x="220" y="190" font-size="11" fill="#444">域名精确匹配（[.] = 字面 .）</text>

  <path d="M 115 200 L 115 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Regex segment 5: $ ===== -->
  <rect x="50" y="212" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="232" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">$</text>
  <text x="150" y="232" font-size="11" fill="#444">锚定字符串结尾</text>

  <!-- ===== Divider ===== -->
  <path d="M 30 260 L 530 260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Flow diagram ===== -->
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">匹配流程</text>

  <!-- Input -->
  <rect x="50" y="296" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="318" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 mail</text>

  <path d="M 170 314 L 210 314" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="290,288 370,314 290,340 210,314" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">REGEXP</text>
  <text x="290" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">匹配?</text>

  <!-- YES branch -->
  <path d="M 370 314 L 410 314" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">YES</text>
  <rect x="410" y="296" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出该行</text>

  <!-- NO branch -->
  <path d="M 290 340 L 290 366" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="358" font-size="10" fill="#b85450" font-weight="bold">NO</text>
  <rect x="230" y="366" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过该行</text>

  <!-- Note -->
  <rect x="40" y="410" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#444">WHERE mail REGEXP '...' 逐行匹配，仅保留匹配的行</text>
</svg>
