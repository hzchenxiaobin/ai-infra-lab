<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcabc"，逐 i 推进</text>

  <!-- 6 panels: width 86, gap 5, start x=10 -> x: 10,101,192,283,374,465 -->
  <!-- Panel i=0, char a (blue) -->
  <rect x="10" y="40" width="86" height="240" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="53" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0</text>
  <rect x="34" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="53" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <text x="53" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="53" y="142" text-anchor="middle" font-size="10" fill="#446688">a: <tspan font-weight="bold">0</tspan></text>
  <text x="53" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: −1</text>
  <text x="53" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: −1</text>
  <text x="53" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="53" y="212" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">−1</text>
  <rect x="20" y="226" width="66" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="53" y="241" text-anchor="middle" font-size="11" fill="#888">+0</text>
  <text x="53" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=0</text>

  <!-- Panel i=1, char b (green) -->
  <rect x="101" y="40" width="86" height="240" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="101" y="40" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="144" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=1</text>
  <rect x="125" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="144" y="97" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="144" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="144" y="142" text-anchor="middle" font-size="10" fill="#446688">a: 0</text>
  <text x="144" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: <tspan font-weight="bold">1</tspan></text>
  <text x="144" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: −1</text>
  <text x="144" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="144" y="212" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">−1</text>
  <rect x="111" y="226" width="66" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="144" y="241" text-anchor="middle" font-size="11" fill="#888">+0</text>
  <text x="144" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=0</text>

  <!-- Panel i=2, char c (orange), first time all three gathered -->
  <rect x="192" y="40" width="86" height="240" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="192" y="40" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2 ★</text>
  <rect x="216" y="76" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="235" y="97" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">c</text>
  <text x="235" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="235" y="142" text-anchor="middle" font-size="10" fill="#446688">a: 0</text>
  <text x="235" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: 1</text>
  <text x="235" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: <tspan font-weight="bold">2</tspan></text>
  <text x="235" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="235" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="202" y="226" width="66" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="235" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="235" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=1</text>

  <!-- Panel i=3, char a (blue) -->
  <rect x="283" y="40" width="86" height="240" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="283" y="40" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="326" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=3</text>
  <rect x="307" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="326" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <text x="326" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="326" y="142" text-anchor="middle" font-size="10" fill="#446688">a: <tspan font-weight="bold">3</tspan></text>
  <text x="326" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: 1</text>
  <text x="326" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: 2</text>
  <text x="326" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="326" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="293" y="226" width="66" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="326" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="326" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=3</text>

  <!-- Panel i=4, char b (green) -->
  <rect x="374" y="40" width="86" height="240" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="374" y="40" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="417" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=4</text>
  <rect x="398" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="417" y="97" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="417" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="417" y="142" text-anchor="middle" font-size="10" fill="#446688">a: 3</text>
  <text x="417" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: <tspan font-weight="bold">4</tspan></text>
  <text x="417" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: 2</text>
  <text x="417" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="417" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="384" y="226" width="66" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="417" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+3</text>
  <text x="417" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=6</text>

  <!-- Panel i=5, char c (orange) -->
  <rect x="465" y="40" width="86" height="240" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="465" y="40" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="508" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=5</text>
  <rect x="489" y="76" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="508" y="97" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">c</text>
  <text x="508" y="126" text-anchor="middle" font-size="9.5" fill="#888">最后位置</text>
  <text x="508" y="142" text-anchor="middle" font-size="10" fill="#446688">a: 3</text>
  <text x="508" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">b: 4</text>
  <text x="508" y="170" text-anchor="middle" font-size="10" fill="#d6a040">c: <tspan font-weight="bold">5</tspan></text>
  <text x="508" y="196" text-anchor="middle" font-size="10" fill="#888">min:</text>
  <text x="508" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="475" y="226" width="66" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="508" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+4</text>
  <text x="508" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans=10</text>

  <!-- Bottom summary -->
  <rect x="10" y="300" width="541" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=2 首次集齐三种字符，开始有贡献；此后 min 单调不减，贡献 1→2→3→4</text>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 0+0+1+2+3+4 = 10 ✓</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#888">每步贡献 = min(last_a, last_b, last_c) + 1，未集齐时 min=−1 贡献 0</text>
</svg>
