<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1：三轮删除 + 每元素被删轮次，max = 3</text>

  <!-- ===== Round 1 : 11 cells ===== -->
  <!-- cell step 40, w=34 ; start x=40 ; i: 5,3,4,4,7,3,6,11,8,5,11 -->
  <!-- strike: idx1(3),5(3),8(8),9(5) -->
  <text x="32" y="66" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">步骤1</text>

  <!-- values 5 3 4 4 7 3 6 11 8 5 11 ; strike idx 1,5,8,9 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="52" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="80"  y="52" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="120" y="52" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="160" y="52" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="200" y="52" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="240" y="52" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="280" y="52" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="320" y="52" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="360" y="52" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="400" y="52" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="440" y="52" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="72">5</text><text x="97"  y="72">3</text><text x="137" y="72">4</text><text x="177" y="72">4</text>
    <text x="217" y="72">7</text><text x="257" y="72">3</text><text x="297" y="72">6</text><text x="337" y="72">11</text>
    <text x="377" y="72">8</text><text x="417" y="72">5</text><text x="457" y="72">11</text>
  </g>
  <!-- strikethrough on removed idx 1,5,8,9 -->
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="80"  y1="58" x2="114" y2="76"/>
    <line x1="240" y1="58" x2="274" y2="76"/>
    <line x1="360" y1="58" x2="394" y2="76"/>
    <line x1="400" y1="58" x2="434" y2="76"/>
  </g>
  <path d="M 270 86 L 270 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 2 : 7 cells [5,4,4,7,6,11,11] ; strike pos1(4), pos4(6) ===== -->
  <text x="32" y="126" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">步骤2</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="80"  y="112" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="120" y="112" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="160" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="200" y="112" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="240" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="132">5</text><text x="97"  y="132">4</text><text x="137" y="132">4</text><text x="177" y="132">7</text>
    <text x="217" y="132">6</text><text x="257" y="132">11</text><text x="297" y="132">11</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="80"  y1="118" x2="114" y2="136"/>
    <line x1="200" y1="118" x2="234" y2="136"/>
  </g>
  <path d="M 200 146 L 200 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 3 : 5 cells [5,4,7,11,11] ; strike pos1(4) ===== -->
  <text x="32" y="186" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">步骤3</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="172" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="80"  y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="120" y="172" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="160" y="172" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="200" y="172" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="192">5</text><text x="97"  y="192">4</text><text x="137" y="192">7</text>
    <text x="177" y="192">11</text><text x="217" y="192">11</text>
  </g>
  <line x1="80" y1="178" x2="114" y2="196" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 130 206 L 130 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <text x="32" y="244" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">结果</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="80"  y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="120" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="160" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="250">5</text><text x="97"  y="250">7</text><text x="137" y="250">11</text><text x="177" y="250">11</text>
  </g>
  <text x="240" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">非递减 ✓</text>

  <!-- ===== dp table : 11 cells, value + r ===== -->
  <!-- idx 0..10 : x = 40 + i*40 -->
  <!-- values 5 3 4 4 7 3 6 11 8 5 11 ; r 0 1 2 3 0 1 2 0 1 1 0 -->
  <text x="32" y="300" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">下标</text>
  <text x="32" y="318" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">值</text>
  <text x="32" y="356" text-anchor="end" font-size="10.5" fill="#888" font-weight="bold">r[i]</text>

  <!-- index row -->
  <g font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="57"  y="286">0</text><text x="97"  y="286">1</text><text x="137" y="286">2</text><text x="177" y="286">3</text>
    <text x="217" y="286">4</text><text x="257" y="286">5</text><text x="297" y="286">6</text><text x="337" y="286">7</text>
    <text x="377" y="286">8</text><text x="417" y="286">9</text><text x="457" y="286">10</text>
  </g>

  <!-- value cells (top half) -->
  <g filter="url(#rough2)">
    <rect x="40"  y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="80"  y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="120" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="200" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="240" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="280" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="320" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="360" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="400" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="440" y="292" width="34" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="308">5</text><text x="97"  y="308">3</text><text x="137" y="308">4</text><text x="177" y="308">4</text>
    <text x="217" y="308">7</text><text x="257" y="308">3</text><text x="297" y="308">6</text><text x="337" y="308">11</text>
    <text x="377" y="308">8</text><text x="417" y="308">5</text><text x="457" y="308">11</text>
  </g>

  <!-- r cells (bottom half) : color by r -->
  <!-- r: 0(green) 1(blue) 2(orange) 3(red) -->
  <g filter="url(#rough2)">
    <rect x="40"  y="316" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="80"  y="316" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="120" y="316" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="160" y="316" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="200" y="316" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="240" y="316" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="280" y="316" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="320" y="316" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="360" y="316" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="400" y="316" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="440" y="316" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="57"  y="334" fill="#4a7a3a">0</text><text x="97"  y="334" fill="#446688">1</text>
    <text x="137" y="334" fill="#d6a040">2</text><text x="177" y="334" fill="#b85450">3</text>
    <text x="217" y="334" fill="#4a7a3a">0</text><text x="257" y="334" fill="#446688">1</text>
    <text x="297" y="334" fill="#d6a040">2</text><text x="337" y="334" fill="#4a7a3a">0</text>
    <text x="377" y="334" fill="#446688">1</text><text x="417" y="334" fill="#446688">1</text>
    <text x="457" y="334" fill="#4a7a3a">0</text>
  </g>

  <!-- highlight max r=3 -->
  <rect x="158" y="314" width="38" height="28" fill="none" stroke="#b85450" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="177" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">↑max</text>

  <!-- answer -->
  <rect x="150" y="376" width="240" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="397" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">max r[i] = 3 → 返回 3 ✓</text>

  <!-- legend -->
  <g font-size="9" fill="#666" filter="url(#rough2)">
    <rect x="400" y="376" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <text x="418" y="385">0=永存</text>
    <rect x="400" y="392" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2"/>
    <text x="418" y="401">3=最晚删</text>
  </g>
</svg>
