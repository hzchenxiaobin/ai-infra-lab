<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">罗马数字符号表与减法规则</text>

  <!-- Section 1: 7 basic symbols -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">七个基本符号</text>

  <!-- symbol cells: I V X L C D M -->
  <rect x="40" y="68" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">I</text>
  <rect x="100" y="68" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="90" text-anchor="middle" font-size="12" fill="#777">1</text>

  <rect x="40" y="106" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">V</text>
  <rect x="100" y="106" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="12" fill="#777">5</text>

  <rect x="40" y="144" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">X</text>
  <rect x="100" y="144" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="166" text-anchor="middle" font-size="12" fill="#777">10</text>

  <rect x="40" y="182" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">L</text>
  <rect x="100" y="182" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="204" text-anchor="middle" font-size="12" fill="#777">50</text>

  <rect x="40" y="220" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">C</text>
  <rect x="100" y="220" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="242" text-anchor="middle" font-size="12" fill="#777">100</text>

  <rect x="40" y="258" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="280" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">D</text>
  <rect x="100" y="258" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="280" text-anchor="middle" font-size="12" fill="#777">500</text>

  <rect x="40" y="296" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="318" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">M</text>
  <rect x="100" y="296" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="318" text-anchor="middle" font-size="12" fill="#777">1000</text>

  <!-- Section 2: 6 subtractive combinations -->
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">六个减法组合（左小右大 → 减）</text>

  <rect x="290" y="68" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">IV</text>
  <rect x="360" y="68" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="90" text-anchor="middle" font-size="12" fill="#777">= 4</text>

  <rect x="420" y="68" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">IX</text>
  <rect x="490" y="68" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="90" text-anchor="middle" font-size="12" fill="#777">= 9</text>

  <rect x="290" y="110" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">XL</text>
  <rect x="360" y="110" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="132" text-anchor="middle" font-size="12" fill="#777">= 40</text>

  <rect x="420" y="110" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">XC</text>
  <rect x="490" y="110" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="132" text-anchor="middle" font-size="12" fill="#777">= 90</text>

  <rect x="290" y="152" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">CD</text>
  <rect x="360" y="152" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="174" text-anchor="middle" font-size="12" fill="#777">= 400</text>

  <rect x="420" y="152" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">CM</text>
  <rect x="490" y="152" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="174" text-anchor="middle" font-size="12" fill="#777">= 900</text>

  <!-- mini example: IV = -1 + 5 = 4 -->
  <rect x="290" y="200" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="224" text-anchor="middle" font-size="12" fill="#333">例：IV → I(1) &lt; V(5) → −1 + 5 = 4</text>

  <!-- arrow from subtractive box down to core rule -->
  <path d="M 280 248 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Core rule box -->
  <rect x="50" y="272" width="460" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心规则：逐位看右边</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#b85450">当前值 &lt; 右边值 → 减去当前值</text>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a">当前值 ≥ 右边值 → 加上当前值</text>

  <!-- legend at bottom -->
  <rect x="50" y="370" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="382" font-size="10" fill="#555">基本符号</text>
  <rect x="150" y="370" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="170" y="382" font-size="10" fill="#555">减法组合</text>
  <rect x="250" y="370" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="382" font-size="10" fill="#555">对应数值</text>
  <rect x="350" y="370" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="370" y="382" font-size="10" fill="#555">举例说明</text>
</svg>
