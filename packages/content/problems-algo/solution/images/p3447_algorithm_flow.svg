<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">算法流程：建 first 表 → 筛倍数盖戳 → 查表输出</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="56" rx="40" ry="16" fill="#f5f5f5" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,72 L260,84" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="85" y="88" width="350" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 扫描 elements 建 first[v] = 值 v 首次出现的下标</text>
  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">重复值只记首次出现（最小 j），O(m)</text>

  <path d="M260,130 L260,142" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="130" y="146" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 遍历值 v = 1, 2, …, 10⁵</text>

  <path d="M260,176 L260,190" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="260,194 372,232 260,270 148,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">first[v] ≠ −1 ？</text>
  <text x="260" y="245" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（值 v 在 elements 中出现过吗）</text>

  <!-- 是 分支 -->
  <path d="M260,270 L260,286" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="282" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 步骤3 -->
  <rect x="85" y="290" width="350" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 筛倍数盖戳：m = v, 2v, 3v, … ≤ 10⁵</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best[m] = min(best[m], first[v])</text>

  <!-- 循环回边 -->
  <path d="M435,316 L478,316 L478,161 L394,161" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="242" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(90 484,242)">下一个 v</text>

  <!-- 否 分支绕行 -->
  <path d="M148,232 L62,232 L62,364 L80,364" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="224" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="26" y="300" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 26,300)">跳过（值未出现）</text>

  <path d="M260,342 L260,356" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4 -->
  <rect x="85" y="360" width="350" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ 查表输出：assigned[i] = best[groups[i]]</text>
  <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">best 默认 −1，无戳即无元素可分，O(n)</text>

  <path d="M260,406 L260,420" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="260" cy="442" rx="40" ry="16" fill="#f5f5f5" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>
</svg>
