<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">N 叉树后序遍历：孩子（左→右）→ 根</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">遍历所有孩子后再访问根，孩子数量任意</text>

  <!-- N叉树 -->
  <circle cx="220" cy="78" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- 三个孩子 -->
  <circle cx="120" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <circle cx="220" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <circle cx="320" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="206" y1="92" x2="132" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="95" x2="220" y2="135" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="92" x2="308" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 2 的两个孩子 -->
  <circle cx="185" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="255" cy="220" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="255" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <line x1="210" y1="162" x2="192" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="230" y1="162" x2="248" y2="208" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 访问顺序标注 -->
  <text x="100" y="178" font-size="10" fill="#446688" font-weight="bold">①</text>
  <text x="170" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="240" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="200" y="178" font-size="10" fill="#d6a040" font-weight="bold">④</text>
  <text x="305" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">⑤</text>
  <text x="232" y="74" font-size="10" fill="#b85450" font-weight="bold">⑥</text>

  <!-- 顺序箭头 -->
  <path d="M 138 168 Q 160 250 178 244" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 199 234 Q 222 246 241 234" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归骨架说明 -->
  <rect x="30" y="270" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="12" fill="#333" font-weight="bold">递归骨架（孩子数量任意）：</text>
  <text x="50" y="318" font-size="12" fill="#555" font-family="monospace">postorder(node):</text>
  <text x="70" y="336" font-size="12" fill="#555" font-family="monospace">for child in node.children: postorder(child)   // 先所有孩子</text>
  <text x="70" y="354" font-size="12" fill="#555" font-family="monospace">result.append(node.val)                       // 再根</text>
</svg>
