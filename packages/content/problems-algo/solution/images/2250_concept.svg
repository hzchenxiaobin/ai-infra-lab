<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：约束不对称 — y ≤ 100（可分桶），x ≤ 10⁹（排序+二分）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">矩形共享左下角 (0,0)，包含点 (xⱼ, yⱼ) ⟺ lᵢ ≥ xⱼ 且 hᵢ ≥ yⱼ</text>

  <!-- Coordinate system -->
  <!-- Y axis (short, labeled ≤100) -->
  <path d="M 80 280 L 80 70" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="175" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" transform="rotate(-90,68,175)">高度 h ≤ 100</text>

  <!-- X axis (long, labeled ≤10^9) -->
  <path d="M 80 280 L 470 280" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="300" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">长度 l ≤ 10⁹</text>

  <!-- Origin -->
  <circle cx="80" cy="280" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="72" y="296" text-anchor="end" font-size="9" fill="#888">(0,0)</text>

  <!-- Rectangle 1: l=1, h=2 (small, bottom-left) -->
  <rect x="80" y="260" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="95" y="274" text-anchor="middle" font-size="8" fill="#446688">R₁</text>

  <!-- Rectangle 2: l=2, h=3 -->
  <rect x="80" y="250" width="55" height="30" fill="none" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="140" y="268" font-size="8" fill="#d6a040">R₂</text>

  <!-- Rectangle 3: l=2, h=5 (tallest, highlighted green) -->
  <rect x="80" y="230" width="55" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)" fill-opacity="0.5"/>
  <text x="140" y="258" font-size="8" fill="#4a7a3a" font-weight="bold">R₃</text>

  <!-- Point P1 (2,1) - inside R2 and R3 -->
  <circle cx="135" cy="275" r="4" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="278" font-size="9" fill="#b85450" font-weight="bold">P₁(2,1)</text>

  <!-- Point P2 (1,4) - inside R3 only -->
  <circle cx="105" cy="240" r="4" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="243" font-size="9" fill="#b85450" font-weight="bold">P₂(1,4)</text>

  <!-- Bucketing illustration (right side) -->
  <text x="330" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按高度分桶（h = 1..100）</text>

  <!-- Bucket h=5 -->
  <rect x="280" y="72" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="90" font-size="10" fill="#4a7a3a" font-weight="bold">h=5:</text>
  <rect x="325" y="78" width="28" height="16" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="339" y="90" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="365" y="90" font-size="9" fill="#888">← 排序后的 l 列表</text>

  <!-- Bucket h=3 -->
  <rect x="280" y="106" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="124" font-size="10" fill="#d6a040" font-weight="bold">h=3:</text>
  <rect x="325" y="112" width="28" height="16" fill="#fff" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="339" y="124" text-anchor="middle" font-size="9" fill="#333">2</text>

  <!-- Bucket h=2 -->
  <rect x="280" y="140" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="158" font-size="10" fill="#446688" font-weight="bold">h=2:</text>
  <rect x="325" y="146" width="28" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="339" y="158" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- Empty buckets -->
  <rect x="280" y="174" width="180" height="22" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="189" font-size="9.5" fill="#999">h=1,4,6..100: 空</text>

  <!-- Query annotation -->
  <rect x="280" y="206" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">查询 P₁(2,1)：</text>
  <text x="380" y="240" text-anchor="middle" font-size="9.5" fill="#555">遍历 h=1→100，每桶二分找 l≥2</text>

  <!-- Key insight box -->
  <rect x="40" y="320" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：y 维度 ≤ 100 → 按 h 分桶，查询时遍历 ≤ 100 个桶</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#555">x 维度 ≤ 10⁹ → 桶内 l 排序 + 二分，O(log n) 计数 l ≥ xⱼ</text>
</svg>
