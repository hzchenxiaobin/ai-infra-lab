<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：m=3, n=5，链表 13 节点 + 2 个 −1 补位</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">head=[3,0,2,6,8,1,7,9,4,2,5,5,0] → 外圈 12 格 + 内圈 3 格（含 2 个 −1）</text>

  <!-- ===== 3x5 grid, cell=46, origin (155,120) ===== -->
  <!-- row 0 (outer blue) -->
  <rect x="155" y="120" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="131" font-size="8" fill="#999">1</text>
  <text x="178" y="150" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="201" y="120" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="131" font-size="8" fill="#999">2</text>
  <text x="224" y="150" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="247" y="120" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="131" font-size="8" fill="#999">3</text>
  <text x="270" y="150" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="293" y="120" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="131" font-size="8" fill="#999">4</text>
  <text x="316" y="150" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="339" y="120" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="131" font-size="8" fill="#999">5</text>
  <text x="362" y="150" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <!-- row 1 -->
  <rect x="155" y="166" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="177" font-size="8" fill="#999">12</text>
  <text x="178" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="201" y="166" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="177" font-size="8" fill="#999">13</text>
  <text x="224" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="247" y="166" width="46" height="46" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="177" font-size="8" fill="#b85450">14</text>
  <text x="270" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1</text>
  <rect x="293" y="166" width="46" height="46" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="177" font-size="8" fill="#b85450">15</text>
  <text x="316" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1</text>
  <rect x="339" y="166" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="177" font-size="8" fill="#999">6</text>
  <text x="362" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- row 2 (outer blue) -->
  <rect x="155" y="212" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="223" font-size="8" fill="#999">11</text>
  <text x="178" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="201" y="212" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="223" font-size="8" fill="#999">10</text>
  <text x="224" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="247" y="212" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="223" font-size="8" fill="#999">9</text>
  <text x="270" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="293" y="212" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="223" font-size="8" fill="#999">8</text>
  <text x="316" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="339" y="212" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="223" font-size="8" fill="#999">7</text>
  <text x="362" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <!-- ===== leg arrows ①-④ ===== -->
  <path d="M 163 114 L 377 114" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">① 上行 5 格</text>

  <path d="M 391 128 L 391 252" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="397" y="194" font-size="10" fill="#b85450" font-weight="bold">② 右列 2 格</text>

  <path d="M 377 266 L 163 266" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③ 下行 4 格</text>

  <path d="M 149 252 L 149 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="194" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">④ 左列 1 格</text>

  <!-- ⑤ caption -->
  <rect x="120" y="296" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="10.5" fill="#5a4a1a">⑤ 内层中行：①→14→15 即 (1,1)=0 → (1,2)=−1 → (1,3)=−1</text>

  <!-- legend -->
  <rect x="90" y="338" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="348" font-size="9.5" fill="#555">外圈（leg ①②③④，12 格）</text>
  <rect x="270" y="338" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="348" font-size="9.5" fill="#555">内圈</text>
  <rect x="330" y="338" width="14" height="11" fill="#fff8e1" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="348" font-size="9.5" fill="#555">−1 补位（链表耗尽）</text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#888">格内左上小数字 = 螺旋填入顺序（1..15 = m×n）</text>
</svg>
