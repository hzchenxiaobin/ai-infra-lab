<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,5,6,8,5] → 排序 [2,5,5,6,8]，m = 2</text>

  <!-- Panel 1: k = 4 -->
  <text x="46" y="58" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① k = 4：中位数变小，左半的 5 超标要压下来</text>

  <text x="52" y="95" font-size="9.5" fill="#999" filter="url(#rough2)">原值</text>
  <rect x="90" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="95" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="74" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="95" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="190" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="95" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="240" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="95" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="290" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="95" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="112" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="212" y="122" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="262" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="312" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <text x="52" y="160" font-size="9.5" fill="#999" filter="url(#rough2)">终值</text>
  <rect x="90" y="139" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="139" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="162" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="190" y="139" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="160" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="240" y="139" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="290" y="139" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="90" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终态 [2,4,4,6,8]，中位 = 4 ✓   总代价 = 0+1+1+0+0 = 2</text>

  <!-- Panel 2: k = 7 -->
  <text x="46" y="222" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② k = 7：中位数变大，右半的 6 不足要抬上去</text>

  <text x="52" y="259" font-size="9.5" fill="#999" filter="url(#rough2)">原值</text>
  <rect x="90" y="238" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="238" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="190" y="238" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="259" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="240" y="238" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="290" y="238" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="112" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="212" y="286" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="262" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="312" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <text x="52" y="324" font-size="9.5" fill="#999" filter="url(#rough2)">终值</text>
  <rect x="90" y="303" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="303" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="190" y="303" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="324" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="240" y="303" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="262" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="290" y="303" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="324" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="90" y="356" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终态 [2,5,7,7,8]，中位 = 7 ✓   总代价 = 0+0+2+1+0 = 3</text>

  <!-- bottom note -->
  <rect x="40" y="376" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">同一数组、两个方向的 k：超标在左半 → 压顶；不足在右半 → 托底</text>
  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两侧不越界的元素全部白嫖（代价 0），这就是比 462「全体搬迁」便宜的原因</text>
</svg>
