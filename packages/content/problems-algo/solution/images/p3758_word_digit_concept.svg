<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：十个数字词两两无前缀关系 ⇒ 每个位置至多一个词能匹配</text>

  <!-- word table -->
  <text x="24" y="68" font-size="11" fill="#888">词表：</text>
  <rect x="76" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="101" y="68" text-anchor="middle" font-size="10" fill="#333">zero→0</text>
  <rect x="129" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="154" y="68" text-anchor="middle" font-size="10" fill="#333">one→1</text>
  <rect x="182" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="207" y="68" text-anchor="middle" font-size="10" fill="#333">two→2</text>
  <rect x="235" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="10" fill="#333">three→3</text>
  <rect x="288" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="313" y="68" text-anchor="middle" font-size="10" fill="#333">four→4</text>
  <rect x="341" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="366" y="68" text-anchor="middle" font-size="10" fill="#333">five→5</text>
  <rect x="394" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="419" y="68" text-anchor="middle" font-size="10" fill="#333">six→6</text>
  <rect x="447" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="68" text-anchor="middle" font-size="10" fill="#333">seven→7</text>
  <rect x="500" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="525" y="68" text-anchor="middle" font-size="10" fill="#333">eight→8</text>
  <rect x="553" y="48" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="578" y="68" text-anchor="middle" font-size="10" fill="#333">nine→9</text>

  <!-- divergence intro -->
  <text x="24" y="106" font-size="11" fill="#888">首字母只有 z·o·t·t·f·f·s·s·e·n —— 同首字母的三对词，在第二个字母就分道扬镳：</text>

  <!-- fork group t -->
  <ellipse cx="48" cy="172" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <path d="M 60 164 Q 78 152 88 150" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="98" cy="148" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="153" text-anchor="middle" font-size="12" fill="#333">w</text>
  <path d="M 60 180 Q 78 192 88 195" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="98" cy="198" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="203" text-anchor="middle" font-size="12" fill="#333">h</text>
  <path d="M 108 146 L 131 147" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="135" y="134" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="172" y="151" text-anchor="middle" font-size="11" fill="#333">two→2</text>
  <path d="M 108 200 L 131 199" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="135" y="188" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="172" y="205" text-anchor="middle" font-size="11" fill="#333">three→3</text>

  <!-- fork group f -->
  <ellipse cx="238" cy="172" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <path d="M 250 164 Q 268 152 278 150" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="288" cy="148" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="288" y="153" text-anchor="middle" font-size="12" fill="#333">o</text>
  <path d="M 250 180 Q 268 192 278 195" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="288" cy="198" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="288" y="203" text-anchor="middle" font-size="12" fill="#333">i</text>
  <path d="M 298 146 L 321 147" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="325" y="134" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="362" y="151" text-anchor="middle" font-size="11" fill="#333">four→4</text>
  <path d="M 298 200 L 321 199" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="325" y="188" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="362" y="205" text-anchor="middle" font-size="11" fill="#333">five→5</text>

  <!-- fork group s -->
  <ellipse cx="428" cy="172" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>
  <path d="M 440 164 Q 458 152 468 150" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="478" cy="148" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="478" y="153" text-anchor="middle" font-size="12" fill="#333">i</text>
  <path d="M 440 180 Q 458 192 468 195" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="478" cy="198" rx="12" ry="12" fill="#fff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="478" y="203" text-anchor="middle" font-size="12" fill="#333">e</text>
  <path d="M 488 146 L 511 147" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="515" y="134" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="552" y="151" text-anchor="middle" font-size="11" fill="#333">six→6</text>
  <path d="M 488 200 L 511 199" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="515" y="188" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="552" y="205" text-anchor="middle" font-size="11" fill="#333">seven→7</text>

  <text x="310" y="236" text-anchor="middle" font-size="11" fill="#888">同首字母 ≠ 前缀关系：第二字母即分岔，谁也吃不掉谁</text>

  <!-- conclusions -->
  <rect x="30" y="250" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="271" text-anchor="middle" font-size="12" fill="#333">推论：任一位置至多一个词能匹配 —— 若 A、B 同时命中，短者必为长者的前缀，矛盾！</text>

  <rect x="30" y="292" width="560" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="313" text-anchor="middle" font-size="12" fill="#333">⇒ 从左到右贪心无歧义：命中 → 换数字、吞掉整词；失配 → 保留字符、前进一格</text>

  <!-- walkthrough: ninexsix -->
  <text x="24" y="356" font-size="11" fill="#888">走例：</text>
  <text x="58" y="356" font-size="12" fill="#333" font-weight="bold">ninexsix</text>

  <rect x="110" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="127" y="364" text-anchor="middle" font-size="13" fill="#333">n</text>
  <rect x="150" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="167" y="364" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="190" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="207" y="364" text-anchor="middle" font-size="13" fill="#333">n</text>
  <rect x="230" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="247" y="364" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="270" y="344" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="364" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="310" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="327" y="364" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="350" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="367" y="364" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="390" y="344" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="407" y="364" text-anchor="middle" font-size="13" fill="#333">x</text>

  <path d="M 110 384 Q 187 400 264 384" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="187" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nine → 9</text>
  <text x="287" y="404" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">保留 x</text>
  <path d="M 310 384 Q 367 400 424 384" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="367" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">six → 6</text>

  <rect x="460" y="344" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="525" y="364" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">输出：9x6</text>

  <text x="24" y="434" font-size="10.5" fill="#888">⚠️ 失配只吐一个字符、从下一位置重试；命中则吞掉整词、绝不回溯。</text>
</svg>
