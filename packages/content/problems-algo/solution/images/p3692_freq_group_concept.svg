<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：两次聚合 —— 先数「字符→频率」，再数「频率→组大小」</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例：s = "aaabbbccdddde" → 众数频率组是 k=3 的 {a, b} → 输出 "ab"（顺序不限）</text>

  <!-- string cells: a a a b b b c c d d d d e -->
  <rect x="59" y="52" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="93" y="52" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="127" y="52" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="161" y="52" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="195" y="52" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="229" y="52" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="263" y="52" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="297" y="52" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="331" y="52" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="365" y="52" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="399" y="52" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="433" y="52" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="467" y="52" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="484" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>

  <!-- arrow 1 -->
  <path d="M 135,84 L 135,118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="104" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 数字符（一遍 O(n)）</text>

  <!-- panel 1: freq table -->
  <rect x="30" y="124" width="210" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="144" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">频次表 cnt（聚合①：字符→频率）</text>
  <text x="42" y="166" font-size="10.5" fill="#333" filter="url(#rough2)">a → 3 次</text>
  <text x="42" y="185" font-size="10.5" fill="#333" filter="url(#rough2)">b → 3 次</text>
  <text x="42" y="204" font-size="10.5" fill="#333" filter="url(#rough2)">c → 2 次</text>
  <text x="42" y="223" font-size="10.5" fill="#333" filter="url(#rough2)">d → 4 次</text>
  <text x="42" y="242" font-size="10.5" fill="#333" filter="url(#rough2)">e → 1 次</text>

  <!-- arrow 2 -->
  <path d="M 244,188 L 286,188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="183" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">②</text>

  <!-- panel 2: frequency groups -->
  <rect x="290" y="124" width="240" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="144" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">频率组 group（聚合②：频率→组大小）</text>
  <text x="302" y="167" font-size="10.5" fill="#333" filter="url(#rough2)">k=4 → {d}（组大小 1）</text>
  <rect x="298" y="173" width="226" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="187" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k=3 → {a, b}（组大小 2）★ 众数</text>
  <text x="302" y="207" font-size="10.5" fill="#333" filter="url(#rough2)">k=2 → {c}（组大小 1）</text>
  <text x="302" y="227" font-size="10.5" fill="#333" filter="url(#rough2)">k=1 → {e}（组大小 1）</text>
  <text x="302" y="245" font-size="9.5" fill="#888" filter="url(#rough2)">并列规则：组大小相同 → 取 k 更大（示例 3）</text>

  <!-- arrow 3 -->
  <path d="M 410,252 L 410,262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result row -->
  <text x="118" y="287" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 取众数组（k=3）成员 → res =</text>
  <rect x="310" y="268" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="342" y="268" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="287" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- bottom note -->
  <rect x="30" y="308" width="500" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="42" y="328" font-size="10.5" fill="#333" filter="url(#rough2)">聚合②不产生新信息：26 个字母各落一个桶 → 非空桶 ≤ 26，分桶与选桶都是 O(26)</text>
  <text x="42" y="348" font-size="10.5" fill="#333" filter="url(#rough2)">选桶规则 = 双关键字 (组大小, k) 取最大：先比组大小，并列时取频率 k 更大者</text>
</svg>
