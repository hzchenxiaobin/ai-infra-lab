<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 234</text>

  <!-- step table header -->
  <text x="30" y="60" font-size="12" fill="#444" font-weight="bold">轮次</text>
  <text x="90" y="60" font-size="12" fill="#444" font-weight="bold">剩余 n</text>
  <text x="220" y="60" font-size="12" fill="#444" font-weight="bold">digit = n%10</text>
  <text x="350" y="60" font-size="12" fill="#444" font-weight="bold">product</text>
  <text x="470" y="60" font-size="12" fill="#444" font-weight="bold">sum</text>
  <line x1="20" y1="68" x2="560" y2="68" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- init -->
  <text x="30" y="92" font-size="11" fill="#333">初始</text>
  <rect x="80" y="76" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">234</text>
  <text x="220" y="95" font-size="11" fill="#888">—</text>
  <rect x="330" y="76" width="70" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="95" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="450" y="76" width="70" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- step 1: digit 4 -->
  <text x="30" y="128" font-size="11" fill="#333">1</text>
  <rect x="80" y="112" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">23</text>
  <text x="220" y="131" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="330" y="112" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="450" y="112" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- step 2: digit 3 -->
  <text x="30" y="164" font-size="11" fill="#333">2</text>
  <rect x="80" y="148" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="220" y="167" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="330" y="148" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <rect x="450" y="148" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- step 3: digit 2 -->
  <text x="30" y="200" font-size="11" fill="#333">3</text>
  <rect x="80" y="184" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="220" y="203" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="330" y="184" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">24</text>
  <rect x="450" y="184" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="220" y="222" font-size="10" fill="#b85450" font-weight="bold">n=0，循环结束</text>

  <!-- final result -->
  <rect x="40" y="234" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">循环结束：product = 24，sum = 9</text>
  <text x="290" y="276" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">return product − sum = 24 − 9 = 15</text>
  <text x="290" y="292" text-anchor="middle" font-size="10" fill="#888">3 轮循环 = 数字位数，一遍同时维护积与和</text>

  <!-- second example: n = 4421 -->
  <text x="290" y="322" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">对照：n = 4421</text>
  <rect x="40" y="332" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="11" fill="#444">product = 4×4×2×1 = 32，sum = 4+4+2+1 = 11</text>
  <text x="60" y="370" font-size="11" fill="#444">return 32 − 11 = 21</text>
  <text x="60" y="384" font-size="10" fill="#888">4 轮循环，4 位数字</text>
</svg>
