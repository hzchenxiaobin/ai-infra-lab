<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">递归分解：清除最高位 bit k 的三阶段</text>

  <!-- 行1: n = 2^k + m -->
  <text x="40" y="76" font-size="12" fill="#888">n</text>
  <rect x="170" y="58" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="200" y="50" text-anchor="middle" font-size="10" fill="#b85450">bit k</text>
  <rect x="232" y="58" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="82" text-anchor="middle" font-size="12" fill="#a87020">m₂</text>
  <rect x="278" y="58" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#a87020">m₁</text>
  <rect x="324" y="58" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="82" text-anchor="middle" font-size="12" fill="#a87020">m₀</text>
  <text x="378" y="82" font-size="11" fill="#888">= 2^k + m</text>

  <!-- 阶段A 箭头 -->
  <path d="M 270 98 L 270 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="100" width="150" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="357" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">A: m → 2^(k-1)，花 f(m⊕2^(k-1))</text>

  <!-- 行2: 1 | 1 0 0 -->
  <rect x="170" y="124" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="232" y="124" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="148" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="278" y="124" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="148" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="324" y="124" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="148" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <text x="378" y="148" font-size="11" fill="#888">低位已成 100…0 模式</text>

  <!-- 阶段B 箭头 -->
  <path d="M 200 164 L 200 184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="166" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">B: 翻转 bit k（操作 2，1 次）</text>

  <!-- 行3: 0 | 1 0 0 -->
  <rect x="170" y="190" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="214" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="232" y="190" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="214" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="278" y="190" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="214" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="324" y="190" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="214" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <text x="378" y="214" font-size="11" fill="#888">bit k 已清，剩 2^(k-1)</text>

  <!-- 阶段C 箭头 -->
  <path d="M 270 230 L 270 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="232" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="362" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">C: 清除 2^(k-1)，花 2^k − 1 次</text>

  <!-- 行4: 全 0 -->
  <rect x="170" y="256" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="232" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="280" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="278" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <rect x="324" y="256" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="280" text-anchor="middle" font-size="13" fill="#446688">0</text>
  <text x="378" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">完成 → 0</text>

  <!-- 公式框 -->
  <rect x="80" y="316" width="380" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">f(n) = f(m ⊕ 2^(k−1)) + 1 + (2^k − 1)</text>
  <text x="270" y="356" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">= f(m ⊕ 2^(k−1)) + 2^k</text>
</svg>
