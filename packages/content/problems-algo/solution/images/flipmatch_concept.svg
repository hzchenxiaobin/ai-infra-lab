<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：左子不匹配下一位 voyage → 翻转试探右子</text>

  <!-- Original tree -->
  <text x="130" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">原始树</text>
  <circle cx="130" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>

  <circle cx="95" cy="140" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="118" y1="92" x2="100" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="165" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="142" y1="92" x2="160" y2="129" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="95" y="170" text-anchor="middle" font-size="9" fill="#b85450">≠ voyage[1]=3</text>
  <text x="165" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">= voyage[1]=3 ✓</text>

  <!-- voyage array -->
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#888">voyage = [1, 3, 2]</text>
  <rect x="78" y="206" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="60" y="222" text-anchor="middle" font-size="9" fill="#888">[0]</text>
  <rect x="112" y="206" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="129" y="222" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="129" y="244" text-anchor="middle" font-size="9" fill="#d6a040">↑ 下一位</text>
  <rect x="146" y="206" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="163" y="222" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- Decision arrow -->
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">翻转！</text>
  <text x="280" y="116" text-anchor="middle" font-size="9" fill="#888">交换左右子</text>
  <path d="M 215 100 Q 245 90 280 100" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Flipped tree -->
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">翻转后</text>
  <circle cx="450" cy="80" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>

  <circle cx="415" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="438" y1="92" x2="420" y2="129" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="485" cy="140" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="462" y1="92" x2="480" y2="129" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- Flipped preorder -->
  <text x="450" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">先序 = [1, 3, 2]</text>
  <text x="450" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">= voyage ✓</text>

  <!-- Bottom: rule box -->
  <rect x="40" y="262" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" opacity="0.4" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">判定规则（每个节点只需看「下一位」）</text>
  <text x="290" y="302" text-anchor="middle" font-size="10" fill="#555">左子存在 &amp;&amp; 左子.val ≠ voyage[i+1]：</text>
  <text x="290" y="316" text-anchor="middle" font-size="10" fill="#555">→ 若右子.val == voyage[i+1] 则翻转并记录；否则无解</text>

  <!-- Legend -->
  <circle cx="70" cy="350" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="354" font-size="10" fill="#555">不匹配</text>
  <circle cx="170" cy="350" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="354" font-size="10" fill="#555">匹配</text>
  <circle cx="260" cy="350" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="354" font-size="10" fill="#555">翻转节点</text>
  <circle cx="370" cy="350" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="385" y="354" font-size="10" fill="#555">已消费 / 待定</text>

  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#888">值唯一保证：左、右子至多一个等于下一位，翻转决策唯一</text>
</svg>
