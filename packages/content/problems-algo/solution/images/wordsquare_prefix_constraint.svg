<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">填第 step 行：前缀 = 已填行第 step 列从上到下读出</text>

  <!-- column header labels -->
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="46" fill="#888">第0列</text>
    <text x="125" y="46" fill="#446688" font-weight="bold">第1列</text>
    <text x="175" y="46" fill="#4a7a3a" font-weight="bold">第2列</text>
    <text x="225" y="46" fill="#d6a040" font-weight="bold">第3列</text>
  </g>

  <!-- grid cells 4x4, origin (50,55), cell 50 -->
  <g filter="url(#rough2)">
    <rect x="50" y="55" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="100" y="55" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="150" y="55" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="200" y="55" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="50" y="105" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="100" y="105" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="150" y="105" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="200" y="105" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="50" y="155" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="100" y="155" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="150" y="155" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="200" y="155" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="50" y="205" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="100" y="205" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="150" y="205" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="200" y="205" width="50" height="50" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
  </g>

  <!-- colored column overlays: col1 row0 (blue), col2 rows0-1 (green), col3 rows0-2 (orange) -->
  <rect x="100" y="55" width="50" height="50" fill="#446688" opacity="0.22" filter="url(#rough2)"/>
  <rect x="150" y="55" width="50" height="100" fill="#4a7a3a" opacity="0.22" filter="url(#rough2)"/>
  <rect x="200" y="55" width="50" height="150" fill="#d6a040" opacity="0.30" filter="url(#rough2)"/>

  <!-- letters: ball / area / lead / lady -->
  <g font-size="18" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="89">b</text>
    <text x="125" y="89" fill="#446688" font-weight="bold">a</text>
    <text x="175" y="89" fill="#4a7a3a" font-weight="bold">l</text>
    <text x="225" y="89" fill="#d6a040" font-weight="bold">l</text>
    <text x="75" y="139">a</text>
    <text x="125" y="139">r</text>
    <text x="175" y="139" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="225" y="139" fill="#d6a040" font-weight="bold">a</text>
    <text x="75" y="189">l</text>
    <text x="125" y="189">e</text>
    <text x="175" y="189">a</text>
    <text x="225" y="189" fill="#d6a040" font-weight="bold">d</text>
    <text x="75" y="239">l</text>
    <text x="125" y="239">a</text>
    <text x="175" y="239">d</text>
    <text x="225" y="239">y</text>
  </g>

  <!-- right side: three prefix->word boxes, color-matched -->
  <g filter="url(#rough2)">
    <rect x="290" y="62" width="225" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="290" y="112" width="225" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="290" y="162" width="225" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <g font-size="12" filter="url(#rough2)">
    <text x="304" y="85" fill="#446688" font-weight="bold">step=1</text>
    <text x="360" y="85" fill="#333">前缀 "a"   → area</text>
    <text x="304" y="135" fill="#4a7a3a" font-weight="bold">step=2</text>
    <text x="360" y="135" fill="#333">前缀 "le"  → lead</text>
    <text x="304" y="185" fill="#d6a040" font-weight="bold">step=3</text>
    <text x="360" y="185" fill="#333">前缀 "lad" → lady</text>
  </g>

  <!-- arrows from each column to its box -->
  <path d="M 150 80 L 288 80" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 105 L 288 130" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 130 L 288 180" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- down-arrow hint on each colored column (read top to bottom) -->
  <path d="M 125 108 L 125 118" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 158 L 175 168" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 208 L 225 218" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#444">同色列 = 同色步骤：第 step 列上段读出即第 step 行前缀</text>
  <text x="270" y="296" text-anchor="middle" font-size="10" fill="#888">step=0 前缀为空 → 任选一词作第 0 行（回溯起点）</text>
</svg>
