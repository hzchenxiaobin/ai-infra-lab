<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：连续段计数 + 二分答案</text>

  <!-- start -->
  <ellipse cx="250" cy="48" rx="34" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="53" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 250 63 L 250 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- prep + init -->
  <rect x="140" y="80" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="99" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">按字符分段，记录每段 (c, L)</text>
  <text x="250" y="116" text-anchor="middle" font-size="11" fill="#2f4d6b" filter="url(#rough2)">lo = 1, hi = n, ans = −1</text>

  <path d="M 250 124 L 250 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="250" cy="133" r="3" fill="#446688" filter="url(#rough2)"/>

  <!-- diamond A: lo <= hi ? -->
  <polygon points="250,142 338,172 250,202 162,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="177" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">lo ≤ hi ?</text>

  <!-- no: return -->
  <path d="M 338 172 L 364 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="366" y="152" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="416" y="177" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="416" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（无解则 −1）</text>

  <!-- yes: check -->
  <path d="M 250 202 L 250 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="214" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="110" y="222" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="11" fill="#2f4d6b" filter="url(#rough2)">mid = (lo+hi)/2；对每个字符 c 算</text>
  <text x="250" y="260" text-anchor="middle" font-size="11.5" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">cnt = Σ max(0, L − mid + 1)</text>

  <path d="M 250 270 L 250 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond B: cnt >= 3 ? -->
  <polygon points="250,288 352,320 250,352 148,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="325" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">某字符 cnt ≥ 3 ?</text>

  <!-- yes: ans = mid -->
  <path d="M 352 320 L 378 320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="365" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="380" y="296" width="112" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="315" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = mid</text>
  <text x="436" y="333" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">lo = mid + 1</text>

  <!-- no: hi = mid - 1 -->
  <path d="M 148 320 L 122 320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="26" y="296" width="94" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="73" y="324" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">hi = mid − 1</text>

  <!-- loop back: green box right edge -> up -> junction -->
  <path d="M 492 320 L 506 320 L 506 132 L 260 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="498" y="230" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续二分</text>

  <!-- loop back: orange box top -> up -> junction -->
  <path d="M 73 296 L 73 132 L 240 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="80" y="210" font-size="10" fill="#8a6d3b" filter="url(#rough2)">继续二分</text>

  <!-- notes -->
  <rect x="48" y="368" width="424" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">单调性：k 可行 ⇒ k−1 可行；二分找最大可行长度，每轮 check 只花 O(段数)</text>
</svg>
