<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：换根跨越一条边，只翻转该边的方向</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">根从 u 移到相邻点 v：其余边方向不变，仅 u—v 这一条边 u→v 变成 v→u</text>

  <!-- ===== Left panel: root = u ===== -->
  <rect x="20" y="62" width="240" height="186" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 以 u 为根</text>
  <!-- nodes -->
  <ellipse cx="80" cy="150" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">u</text>
  <ellipse cx="220" cy="150" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">v</text>
  <!-- edge u -> v -->
  <line x1="106" y1="150" x2="194" y2="150" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">u 是 v 的父</text>
  <!-- guesses -->
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">猜测 (u,v) ：✓ 命中</text>
  <text x="140" y="216" text-anchor="middle" font-size="11" fill="#b85450">猜测 (v,u) ：✗ 未中</text>
  <text x="140" y="236" text-anchor="middle" font-size="10.5" fill="#5a8a5a">cnt[u] 已含 (u,v) 这一分</text>

  <!-- ===== middle arrow ===== -->
  <line x1="262" y1="150" x2="298" y2="150" stroke="#666" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#666">换根</text>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#888">u → v</text>

  <!-- ===== Right panel: root = v ===== -->
  <rect x="300" y="62" width="240" height="186" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">② 以 v 为根</text>
  <!-- nodes (same positions, edge direction flipped) -->
  <ellipse cx="360" cy="150" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">u</text>
  <ellipse cx="500" cy="150" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">v</text>
  <!-- edge v -> u (leftward) -->
  <line x1="474" y1="150" x2="386" y2="150" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="10" fill="#b85450">v 是 u 的父</text>
  <!-- guesses -->
  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#b85450">猜测 (u,v) ：✗ 未中</text>
  <text x="420" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">猜测 (v,u) ：✓ 命中</text>
  <text x="420" y="236" text-anchor="middle" font-size="10.5" fill="#7a5a20">(u,v) 那一分转给 (v,u)</text>

  <!-- ===== bottom formula ===== -->
  <rect x="50" y="266" width="460" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">跨越边 u—v 的增量（其余边方向不变 → O(1) 转移）</text>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt[v] = cnt[u] + [猜 (v,u)] − [猜 (u,v)]</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#888">[·] 表示该猜测是否存在于 guesses 集合（0/1）</text>
</svg>
