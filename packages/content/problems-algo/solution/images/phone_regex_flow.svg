<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">grep 逐行读取 + ^$ 锚定整行：夹心行被拒</text>
  <path d="M 250 44 Q 440 52 630 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ file.txt box ============ -->
  <text x="60" y="84" font-size="12" fill="#888">file.txt</text>
  <g filter="url(#sk)">
    <rect x="40" y="92" width="220" height="172" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <text x="54" y="118" font-size="12" fill="#333" font-family="'Courier New',monospace">987-123-4567</text>
  <text x="54" y="142" font-size="12" fill="#333" font-family="'Courier New',monospace">(123) 456-7890</text>
  <text x="54" y="166" font-size="12" fill="#999" font-family="'Courier New',monospace">123 456 7890</text>
  <text x="54" y="190" font-size="12" fill="#b85450" font-family="'Courier New',monospace">x987-123-4567y</text>
  <text x="54" y="214" font-size="12" fill="#999" font-family="'Courier New',monospace">(123)456-7890</text>
  <text x="54" y="246" font-size="10" fill="#aaa">逐行读取</text>

  <!-- ============ grep -E filter box ============ -->
  <text x="400" y="84" font-size="12" fill="#888">grep -E（正则过滤）</text>
  <g filter="url(#sk)">
    <rect x="320" y="92" width="240" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">逐行套用正则</text>
  <!-- regex with highlighted anchors -->
  <text x="440" y="148" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="'Courier New',monospace">^</text>
  <text x="340" y="172" font-size="11" fill="#446688" font-family="'Courier New',monospace">([0-9]{3}-|</text>
  <text x="430" y="172" font-size="11" fill="#446688" font-family="'Courier New',monospace">\([0-9]{3}\) )</text>
  <text x="340" y="190" font-size="11" fill="#4a7a3a" font-family="'Courier New',monospace">[0-9]{3}-[0-9]{4}</text>
  <text x="540" y="172" font-size="14" fill="#b85450" font-weight="bold" font-family="'Courier New',monospace">$</text>
  <text x="440" y="218" text-anchor="middle" font-size="10" fill="#888">^ 锁行首 / $ 锁行尾</text>

  <!-- ============ output box ============ -->
  <text x="640" y="84" font-size="12" fill="#888">输出（仅合法行）</text>
  <g filter="url(#sk)">
    <rect x="620" y="92" width="220" height="172" rx="8" fill="#eaf6ee" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="634" y="118" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">987-123-4567</text>
  <text x="634" y="142" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">(123) 456-7890</text>
  <text x="634" y="178" font-size="11" fill="#aaa">其余 3 行被丢弃</text>
  <text x="634" y="246" font-size="10" fill="#aaa">整行严格匹配</text>

  <!-- arrows between stages -->
  <path d="M 262 178 L 316 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="289" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>
  <path d="M 562 178 L 616 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="589" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>

  <!-- ============ Rejection callout for 夹心 line ============ -->
  <g filter="url(#sk)">
    <rect x="40" y="284" width="800" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="308" font-size="12" fill="#b85450" font-family="'Courier New',monospace">x987-123-4567y</text>
  <text x="60" y="328" font-size="11" fill="#b85450">行首 x 破坏 ^ 锚、行尾 y 破坏 $ 锚 → 整行不匹配 → 丢弃</text>
  <path d="M 180 222 Q 170 250 150 282" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)" stroke-dasharray="3 3"/>
  <text x="195" y="258" font-size="10" fill="#b85450">夹心行</text>

  <!-- ============ Rejection callout for no-space line ============ -->
  <path d="M 470 222 Q 470 250 470 282" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)" stroke-dasharray="3 3"/>
  <text x="486" y="258" font-size="10" fill="#b85450">缺空格</text>
  <text x="490" y="308" font-size="12" fill="#b85450" font-family="'Courier New',monospace">(123)456-7890</text>
  <text x="490" y="328" font-size="11" fill="#b85450">) 后无空格 → 前缀 B 的 \) 空格 不匹配 → 丢弃</text>
</svg>
