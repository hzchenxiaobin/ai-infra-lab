<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：右扫锚定首词、左扫锚定末词，两候选取最大</text>

  <!-- 捷径提示框（右上，虚线连接到起点） -->
  <rect x="330" y="38" width="182" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="421" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">捷径：先比首末两词</text>
  <text x="421" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">words[0] ≠ words[n−1]</text>
  <text x="421" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⇒ (0, n−1) 合法，距离 = n</text>
  <text x="421" y="103" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">一趟不扫，直接返回 n</text>

  <!-- 主流程 -->
  <rect x="130" y="36" width="170" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="53" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j = n−1，i = 0（双指针就位）</text>

  <path d="M 302 49 C 314 49 320 55 328 60" fill="none" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 215 62 L 215 76" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="115" y="78" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右扫 j：words[j] = words[0] ?</text>
  <text x="215" y="109" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">相等则 j−−——锚定首词，找最右异词</text>
  <path d="M 115 88 Q 100 88 100 97 Q 100 106 115 106" fill="none" stroke="#888" stroke-width="1.3"
        marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 215 116 L 215 130" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="115" y="132" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">左扫 i：words[i] = words[n−1] ?</text>
  <text x="215" y="163" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">相等则 i++——锚定末词，找最左异词</text>
  <path d="M 115 142 Q 100 142 100 151 Q 100 160 115 160" fill="none" stroke="#888" stroke-width="1.3"
        marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 215 170 L 215 184" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="215,186 320,220 215,254 110,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j ≥ 0 ？（存在异词）</text>

  <path d="M 320 220 L 350 220" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="335" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <rect x="352" y="204" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="427" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 0（全部单词相同）</text>

  <path d="M 215 254 L 215 268" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="115" y="270" width="200" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(j + 1, n − i)</text>
  <text x="215" y="301" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">候选对 (0, j) 与 (i, n − 1) 取较大</text>

  <path d="M 215 306 L 215 320" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="322" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
