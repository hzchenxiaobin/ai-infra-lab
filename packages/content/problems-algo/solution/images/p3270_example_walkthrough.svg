<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：num1=987，num2=879，num3=798</text>

  <!-- 表头 -->
  <rect x="19" y="46" width="482" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="39" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">轮</text>
  <text x="87" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">权重 p</text>
  <text x="149" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">num1</text>
  <text x="217" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">num2</text>
  <text x="285" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">num3</text>
  <text x="378" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">min(三个个位)</text>
  <text x="469" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">key 累计</text>

  <!-- 轮 0 -->
  <rect x="19" y="80" width="482" height="34" rx="0" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="39" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="87" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="149" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">987</text>
  <text x="217" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">879</text>
  <text x="285" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">798</text>
  <text x="378" y="102" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#rough2)">min(7, 9, 8) = 7</text>
  <text x="469" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <!-- 轮 1 -->
  <rect x="19" y="114" width="482" height="34" rx="0" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="39" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="87" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="149" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">98</text>
  <text x="217" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">87</text>
  <text x="285" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">79</text>
  <text x="378" y="136" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#rough2)">min(8, 7, 9) = 7</text>
  <text x="469" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">77</text>

  <!-- 轮 2 -->
  <rect x="19" y="148" width="482" height="34" rx="0" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="39" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="87" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">100</text>
  <text x="149" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="217" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="285" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="378" y="170" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#rough2)">min(9, 8, 7) = 7</text>
  <text x="469" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">777</text>

  <!-- 轮 3：高位自动补 0（橙底高亮） -->
  <rect x="19" y="182" width="482" height="34" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="39" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="87" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1000</text>
  <text x="149" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">0</text>
  <text x="217" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">0</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">0</text>
  <text x="378" y="204" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#rough2)">min(0, 0, 0) = 0</text>
  <text x="469" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">777</text>

  <!-- 结果箭头 -->
  <text x="260" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">key = 777 ✓</text>

  <!-- 框 1：第 3 轮的含义 -->
  <rect x="19" y="254" width="235" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="136" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">第 3 轮：数已除尽</text>
  <text x="136" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">三个数都被 ÷10 除成 0，</text>
  <text x="136" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">个位取 min 得 0 —— 千位</text>
  <text x="136" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">自动是补的前导 0</text>

  <!-- 框 2：整型累计 -->
  <rect x="266" y="254" width="235" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">整型累计，无前导 0</text>
  <text x="383" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"0777" 存成 777，</text>
  <text x="383" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"0000" 存成 0 ——</text>
  <text x="383" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">全程无需任何特判</text>
</svg>
