<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="820" height="580" fill="#fdfcf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">逆向并查集算法流程</text>
  <path d="M 290 40 Q 410 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="350" y="54" width="120" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="410" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">开始</text>
  <path d="M 410 88 L 410 104" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="220" y="106" width="380" height="64" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="410" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">初始化</text>
  <text x="410" y="146" text-anchor="middle" font-size="11.5" fill="#444">parent[0..n+1] = i；grid 全置水(1)</text>
  <text x="410" y="162" text-anchor="middle" font-size="11.5" fill="#444">top = n（虚拟顶），bottom = n+1（虚拟底）</text>
  <path d="M 410 170 L 410 186" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop header -->
  <g filter="url(#sk)">
    <rect x="270" y="188" width="280" height="40" rx="8" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.8"/>
  </g>
  <text x="410" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">for i = mn−1 downto 0（倒序补陆）</text>
  <path d="M 410 228 L 410 244" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Process box -->
  <g filter="url(#sk)">
    <rect x="160" y="246" width="500" height="120" rx="8" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="410" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34506e">处理 cells[i] = [ri, ci]（1-indexed）</text>
  <text x="180" y="290" font-size="11.5" fill="#444">① r=ri−1, c=ci−1, id = r·col+c；grid[r][c] = 0（补成陆地）</text>
  <text x="180" y="310" font-size="11.5" fill="#444">② 若 r == 0：union(id, top)　　　　若 r == row−1：union(id, bottom)</text>
  <text x="180" y="330" font-size="11.5" fill="#444">③ 遍历四邻 (nr,nc)：若为陆地(grid==0)，union(id, nr·col+nc)</text>
  <text x="180" y="352" font-size="11" fill="#888">（路径压缩 find：parent[x]!=x 时递归压平）</text>
  <path d="M 410 366 L 410 384" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="410,386 530,440 410,494 290,440" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="410" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">find(top)</text>
  <text x="410" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">==</text>
  <text x="410" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">find(bottom)?</text>

  <!-- Yes -> return -->
  <path d="M 530 440 L 640 440" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="558" y="432" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="640" y="420" width="150" height="40" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="715" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return i</text>

  <!-- No -> loop back -->
  <path d="M 290 440 L 120 440" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="250" y="432" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <path d="M 120 440 L 120 208" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="74" y="328" font-size="11" fill="#b85450" font-weight="bold">继续</text>
  <text x="74" y="344" font-size="11" fill="#b85450" font-weight="bold">下一格</text>

  <!-- loop boundary hint -->
  <g filter="url(#sk)">
    <rect x="96" y="188" width="48" height="258" rx="6" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <text x="120" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">循环体</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="520" width="740" height="46" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="540" text-anchor="middle" font-size="11.5" fill="#7a5415">连通性逆向单调：补陆只会 union（连）、不会 split（断）→ 首次 find(top)==find(bottom) 即最大可过天</text>
  <text x="410" y="558" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">i 即「第 i 天」(cells[0..i−1] 已淹) → 返回 i</text>
</svg>
