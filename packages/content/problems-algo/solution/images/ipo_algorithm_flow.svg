<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 入堆 → 贪心选最大</text>

  <!-- Step 1: Sort -->
  <rect x="170" y="48" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 按所需资本升序排序项目</text>

  <path d="M 260 88 L 260 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="170" y="108" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 初始化：大顶堆空, idx=0</text>

  <path d="M 260 148 L 260 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: Loop k times -->
  <rect x="140" y="168" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 重复 k 次（或堆空提前结束）</text>

  <path d="M 260 208 L 260 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: capital[i] <= w? -->
  <polygon points="260,228 340,268 260,308 180,268" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">capital[idx]</text>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">≤ w ?</text>

  <!-- Yes branch: push to heap -->
  <path d="M 340 268 L 400 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="352" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="250" width="104" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">利润入堆</text>

  <!-- loop back from push to diamond -->
  <path d="M 452 250 L 452 230 L 260 230 L 260 236" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="356" y="224" font-size="10" fill="#4a7a3a">idx++, 继续检查</text>

  <!-- No branch -->
  <path d="M 180 268 L 120 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="132" y="262" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="250" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">停止入堆</text>

  <path d="M 70 286 L 70 330 L 170 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Check heap empty -->
  <polygon points="260,314 330,344 260,374 190,344" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">堆空?</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#999">→ break</text>

  <path d="M 330 344 L 400 344" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="342" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="400" y="326" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="349" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">w += 堆顶</text>

  <!-- loop back to step 3 -->
  <path d="M 452 326 L 452 188 L 380 188" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="406" y="182" font-size="10" fill="#d6a040">下一轮</text>

  <!-- Return -->
  <path d="M 260 374 L 260 400" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="170" y="404" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">④ 返回 w</text>
</svg>
