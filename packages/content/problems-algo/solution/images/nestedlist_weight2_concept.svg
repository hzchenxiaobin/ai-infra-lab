<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    反向加权：越深权重越小（叶=1，根=D）
  </text>

  <!-- Outermost list bracket depth=1, reverse weight = D-d+1 = 2 -->
  <path d="M 40 68 Q 30 68 30 88 L 30 270 Q 30 290 40 290"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 530 68 Q 540 68 540 88 L 540 270 Q 540 290 530 290"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="18" y="185" font-size="13" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="18" y="202" font-size="12" fill="#b85450" filter="url(#rough2)">w=2</text>

  <!-- Inner list 1: [1,1] at depth 2, reverse weight = 1 -->
  <path d="M 70 108 Q 62 108 62 123 L 62 173 Q 62 188 70 188"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 170 108 Q 178 108 178 123 L 178 173 Q 178 188 170 188"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="80" y="123" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="123" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="58" y="98" font-size="13" fill="#b85450" filter="url(#rough2)">d=2</text>
  <text x="58" y="84" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w=1</text>

  <!-- Middle integer 2 at depth 1, reverse weight = 2 -->
  <rect x="245" y="123" width="50" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="116" font-size="13" fill="#d6a040" filter="url(#rough2)">d=1</text>
  <text x="252" y="102" font-size="12" fill="#b85450" filter="url(#rough2)">w=2</text>

  <!-- Inner list 2: [1,1] at depth 2, reverse weight = 1 -->
  <path d="M 335 108 Q 327 108 327 123 L 327 173 Q 327 188 335 188"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 435 108 Q 443 108 443 123 L 443 173 Q 443 188 435 188"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="345" y="123" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="389" y="123" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="323" y="98" font-size="13" fill="#b85450" filter="url(#rough2)">d=2</text>
  <text x="323" y="84" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w=1</text>

  <!-- Divider -->
  <line x1="30" y1="220" x2="540" y2="220" stroke="#888" stroke-width="1"
        stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Reverse weight formula -->
  <text x="280" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">
    反向权重 = D − d + 1 （D = 最大深度 = 2）
  </text>
  <text x="280" y="276" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">
    加权和 = 1×1 + 1×1 + 2×2 + 1×1 + 1×1
  </text>
  <text x="280" y="304" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">
    = 4 + 4 = 8
  </text>

  <!-- Forward vs reverse contrast -->
  <rect x="55" y="338" width="200" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="155" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    339 正向：d=1→w=1, d=2→w=2
  </text>
  <text x="155" y="374" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    和 = 10（深=大权重）
  </text>

  <rect x="305" y="338" width="200" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    364 反向：d=1→w=2, d=2→w=1
  </text>
  <text x="405" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    和 = 8（深=小权重）
  </text>
</svg>
