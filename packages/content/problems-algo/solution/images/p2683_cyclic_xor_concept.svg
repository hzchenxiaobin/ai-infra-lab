<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：环形异或链，每个 original 恰出现两次</text>

  <!-- Cyclic triangle: original nodes (using example original=[0,1,0]) -->
  <!-- o0 at (160,110), o1 at (400,110), o2 at (280,250) -->
  <!-- edges with arrows showing derived values -->

  <!-- Edge o0->o1  (d0 = 0⊕1 = 1) top -->
  <line x1="200" y1="110" x2="360" y2="110" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="250" y="92" width="60" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d0 = 1</text>

  <!-- Edge o1->o2 (d1 = 1⊕0 = 1) right -->
  <line x1="380" y1="140" x2="300" y2="218" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="345" y="170" width="60" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d1 = 1</text>

  <!-- Edge o2->o0 (d2 = 0⊕0 = 0) left  (cyclic / 首尾相接) -->
  <line x1="260" y1="218" x2="180" y2="140" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="155" y="170" width="60" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d2 = 0</text>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首尾相接</text>

  <!-- Nodes -->
  <ellipse cx="160" cy="110" rx="40" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">o0</text>
  <text x="160" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= 0</text>

  <ellipse cx="400" cy="110" rx="40" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">o1</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= 1</text>

  <ellipse cx="280" cy="250" rx="40" ry="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a20" filter="url(#rough2)">o2</text>
  <text x="280" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= 0</text>

  <!-- note: each node touches 2 edges -->
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">每个节点连 2 条边 → 在异或和中出现 2 次 → 自消</text>

  <!-- Equation box -->
  <rect x="40" y="326" width="480" height="62" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⊕ derived = (o0⊕o1) ⊕ (o1⊕o2) ⊕ (o2⊕o0)</text>
  <text x="280" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= o0⊕o1⊕o1⊕o2⊕o2⊕o0 = 0</text>
</svg>
