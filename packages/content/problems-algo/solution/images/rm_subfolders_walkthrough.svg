<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：folder = ["/a","/a/b","/c/d","/c/d/e","/c/f"]</text>

  <!-- ===== Panel 0: i=0  init ===== -->
  <rect x="12" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="12" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=0  初始</text>
  <text x="64" y="86" text-anchor="middle" font-size="10" fill="#888">folder[i]</text>
  <text x="64" y="102" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">/a</text>
  <text x="64" y="126" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="64" y="142" text-anchor="middle" font-size="11" fill="#aaa">—（空）</text>
  <text x="64" y="166" text-anchor="middle" font-size="10" fill="#888">prev+"/"</text>
  <text x="64" y="182" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="64" y="206" text-anchor="middle" font-size="10" fill="#888">匹配?</text>
  <text x="64" y="222" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="22" y="238" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留（入队）</text>
  <text x="64" y="284" text-anchor="middle" font-size="9.5" fill="#888">ans</text>
  <text x="64" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[/a]</text>
  <text x="64" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a" font-style="italic">prev ← /a</text>

  <!-- ===== Panel 1: i=1  skip ===== -->
  <rect x="123" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="123" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=1</text>
  <text x="175" y="86" text-anchor="middle" font-size="10" fill="#888">folder[i]</text>
  <text x="175" y="102" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">/a/b</text>
  <text x="175" y="126" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="175" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">/a</text>
  <text x="175" y="166" text-anchor="middle" font-size="10" fill="#888">prev+"/"</text>
  <text x="175" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">/a/</text>
  <text x="175" y="206" text-anchor="middle" font-size="10" fill="#888">匹配?</text>
  <text x="175" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✓</text>
  <rect x="133" y="238" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过（子文件夹）</text>
  <text x="175" y="284" text-anchor="middle" font-size="9.5" fill="#888">ans</text>
  <text x="175" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[/a]</text>
  <text x="175" y="322" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">prev 不变</text>

  <!-- ===== Panel 2: i=2  keep ===== -->
  <rect x="234" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="234" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="286" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2</text>
  <text x="286" y="86" text-anchor="middle" font-size="10" fill="#888">folder[i]</text>
  <text x="286" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">/c/d</text>
  <text x="286" y="126" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="286" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">/a</text>
  <text x="286" y="166" text-anchor="middle" font-size="10" fill="#888">prev+"/"</text>
  <text x="286" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">/a/</text>
  <text x="286" y="206" text-anchor="middle" font-size="10" fill="#888">匹配?</text>
  <text x="286" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✗</text>
  <rect x="244" y="238" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留（入队）</text>
  <text x="286" y="284" text-anchor="middle" font-size="9.5" fill="#888">ans</text>
  <text x="286" y="300" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">[/a, /c/d]</text>
  <text x="286" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a" font-style="italic">prev ← /c/d</text>

  <!-- ===== Panel 3: i=3  skip ===== -->
  <rect x="345" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="345" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=3</text>
  <text x="397" y="86" text-anchor="middle" font-size="10" fill="#888">folder[i]</text>
  <text x="397" y="102" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">/c/d/e</text>
  <text x="397" y="126" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="397" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">/c/d</text>
  <text x="397" y="166" text-anchor="middle" font-size="10" fill="#888">prev+"/"</text>
  <text x="397" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">/c/d/</text>
  <text x="397" y="206" text-anchor="middle" font-size="10" fill="#888">匹配?</text>
  <text x="397" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✓</text>
  <rect x="355" y="238" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="397" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过（子文件夹）</text>
  <text x="397" y="284" text-anchor="middle" font-size="9.5" fill="#888">ans</text>
  <text x="397" y="300" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">[/a, /c/d]</text>
  <text x="397" y="322" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">prev 不变</text>

  <!-- ===== Panel 4: i=4  keep ===== -->
  <rect x="456" y="40" width="104" height="300" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="456" y="40" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="508" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=4 ★末</text>
  <text x="508" y="86" text-anchor="middle" font-size="10" fill="#888">folder[i]</text>
  <text x="508" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">/c/f</text>
  <text x="508" y="126" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="508" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">/c/d</text>
  <text x="508" y="166" text-anchor="middle" font-size="10" fill="#888">prev+"/"</text>
  <text x="508" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">/c/d/</text>
  <text x="508" y="206" text-anchor="middle" font-size="10" fill="#888">匹配?</text>
  <text x="508" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✗</text>
  <rect x="466" y="238" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="508" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留（入队）</text>
  <text x="508" y="284" text-anchor="middle" font-size="9.5" fill="#888">ans</text>
  <text x="508" y="300" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">[/a,/c/d,/c/f]</text>
  <text x="508" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a" font-style="italic">prev ← /c/f</text>

  <!-- arrows between panels -->
  <path d="M 116 190 L 123 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 227 190 L 234 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 338 190 L 345 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 449 190 L 456 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom summary -->
  <rect x="12" y="352" width="548" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="286" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终 ans = ["/a","/c/d","/c/f"]  ✓</text>
  <text x="286" y="388" text-anchor="middle" font-size="10.5" fill="#888">每次只比对待入队项与队尾 prev；命中 prev+"/" 即丢弃</text>
</svg>
