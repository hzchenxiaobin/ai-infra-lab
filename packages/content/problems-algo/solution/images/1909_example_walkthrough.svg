<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[1,2,10,5,7] → true</text>

  <!-- ===== Example 1: [1,2,10,5,7] ===== -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = [1, 2, 10, 5, 7]</text>

  <g font-size="14">
    <g font-size="9" fill="#888">
      <text x="84" y="78" text-anchor="middle">0</text>
      <text x="116" y="78" text-anchor="middle">1</text>
      <text x="148" y="78" text-anchor="middle">2</text>
      <text x="180" y="78" text-anchor="middle">3</text>
      <text x="212" y="78" text-anchor="middle">4</text>
    </g>
    <rect x="68" y="84" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="105" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="84" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="105" text-anchor="middle" fill="#333">2</text>
    <rect x="132" y="84" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="105" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <rect x="164" y="84" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="180" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="196" y="84" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="105" text-anchor="middle" fill="#333">7</text>
  </g>

  <text x="40" y="134" font-size="10" fill="#555">扫描：i=1 (2&gt;1 ✓) → i=2 (10&gt;2 ✓) → <tspan fill="#b85450" font-weight="bold">i=3 (5≤10 ✗ 违例!)</tspan></text>

  <text x="40" y="154" font-size="10" fill="#555">首个违例在 i=3，试删 nums[3]=5 或 nums[2]=10</text>

  <!-- Branch A: remove i=3 -->
  <text x="40" y="180" font-size="11" fill="#b85450" font-weight="bold">分支 A：删 nums[3] = 5</text>
  <g font-size="13">
    <rect x="68" y="190" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="209" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="190" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="209" text-anchor="middle" fill="#333">2</text>
    <rect x="132" y="190" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="209" text-anchor="middle" fill="#333">10</text>
    <rect x="164" y="190" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="209" text-anchor="middle" fill="#b85450" font-size="9">删</text>
    <rect x="196" y="190" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="209" text-anchor="middle" fill="#333">7</text>
  </g>
  <text x="40" y="234" font-size="10" fill="#b85450">检查 [1,2,10,7]：10 ≥ 7 → <tspan font-weight="bold">非递增 ✗</tspan></text>

  <!-- divider -->
  <path d="M 30 250 L 530 250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Branch B: remove i-1=2 -->
  <text x="40" y="274" font-size="11" fill="#d6a040" font-weight="bold">分支 B：删 nums[2] = 10</text>
  <g font-size="13">
    <rect x="68" y="284" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="303" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="284" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="303" text-anchor="middle" fill="#333">2</text>
    <rect x="132" y="284" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="303" text-anchor="middle" fill="#d6a040" font-size="9">删</text>
    <rect x="164" y="284" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="303" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="196" y="284" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="303" text-anchor="middle" fill="#333">7</text>
  </g>
  <text x="40" y="328" font-size="10" fill="#4a7a3a">检查 [1,2,5,7]：1&lt;2&lt;5&lt;7 → <tspan font-weight="bold">严格递增 ✓</tspan></text>

  <rect x="200" y="320" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="339" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return True ✓</text>

  <!-- divider -->
  <path d="M 30 364 L 530 364" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 2: [2,3,1,2] ===== -->
  <text x="40" y="388" font-size="12" fill="#b85450" font-weight="bold">示例 2：nums = [2, 3, 1, 2] → false</text>
  <g font-size="13">
    <rect x="68" y="398" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="417" text-anchor="middle" fill="#333">2</text>
    <rect x="100" y="398" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="417" text-anchor="middle" fill="#333">3</text>
    <rect x="132" y="398" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="417" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="164" y="398" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="417" text-anchor="middle" fill="#333">2</text>
  </g>
  <text x="40" y="442" font-size="10" fill="#555">违例在 i=2 (1≤3)。试删 i=2 → [2,3,2]：3≥2 ✗；试删 i=1 → [2,1,2]：2≥1 ✗</text>
  <text x="40" y="458" font-size="10" fill="#b85450" font-weight="bold">两分支均失败 → return False</text>

  <!-- ===== Example 4: [1,2,3] ===== -->
  <text x="340" y="388" font-size="12" fill="#4a7a3a" font-weight="bold">示例 4：[1, 2, 3] → true</text>
  <g font-size="13">
    <rect x="360" y="398" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="376" y="417" text-anchor="middle" fill="#333">1</text>
    <rect x="392" y="398" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="408" y="417" text-anchor="middle" fill="#333">2</text>
    <rect x="424" y="398" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="440" y="417" text-anchor="middle" fill="#333">3</text>
  </g>
  <text x="340" y="442" font-size="10" fill="#4a7a3a">无违例，已严格递增 → return True ✓</text>

  <!-- bottom note -->
  <rect x="340" y="460" width="190" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="480" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">核心：只需在首违例处</text>
  <text x="435" y="494" text-anchor="middle" font-size="10" fill="#444">试删 i 或 i−1，整体验证</text>
  <text x="435" y="506" text-anchor="middle" font-size="9" fill="#888">无需枚举所有删除位置</text>
</svg>
