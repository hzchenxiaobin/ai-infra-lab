<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">gcd 分组 + 中位数：每类独立取中位数最小化 L1 距离</text>

  <!-- gcd box -->
  <rect x="40" y="40" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">g = gcd(n, k) = gcd(6, 4) = 2，下标按 mod g 分两类</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#555">下标 i 与 j 同类 ⟺ i ≡ j (mod g)</text>

  <!-- linear array: arr = [4,1,3,2,5,8], n=6, k=4 -->
  <text x="60" y="112" font-size="11" fill="#888" font-weight="bold">arr</text>
  <!-- boxes: w=54, x=94,154,214,274,334,394 ; y=120 h=48 -->
  <!-- idx 0 val 4 (blue) -->
  <rect x="94" y="120" width="54" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="121" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">4</text>
  <!-- idx 1 val 1 (green) -->
  <rect x="154" y="120" width="54" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="181" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">1</text>
  <!-- idx 2 val 3 (blue) -->
  <rect x="214" y="120" width="54" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="241" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">3</text>
  <!-- idx 3 val 2 (green) -->
  <rect x="274" y="120" width="54" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2</text>
  <!-- idx 4 val 5 (blue) -->
  <rect x="334" y="120" width="54" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="361" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">5</text>
  <!-- idx 5 val 8 (green) -->
  <rect x="394" y="120" width="54" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="421" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">8</text>

  <!-- index labels -->
  <text x="121" y="182" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="181" y="182" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="241" y="182" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="301" y="182" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="361" y="182" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="421" y="182" text-anchor="middle" font-size="10" fill="#888">5</text>

  <path d="M 40 196 L 520 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Group A sorted [3, 4, 5] median 4 -->
  <text x="60" y="220" font-size="11.5" fill="#446688" font-weight="bold">组A (idx≡0)：[4,3,5] 排序→</text>
  <rect x="250" y="208" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="273" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <rect x="300" y="208" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
  <rect x="350" y="208" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="373" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
  <text x="410" y="234" font-size="10.5" fill="#b85450" font-weight="bold">↑中位数</text>
  <text x="60" y="266" font-size="11" fill="#333">代价 = |3−4|+|4−4|+|5−4| = 1+0+1 = <tspan font-weight="bold" fill="#b85450">2</tspan></text>

  <path d="M 40 280 L 520 280" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Group B sorted [1, 2, 8] median 2 -->
  <text x="60" y="304" font-size="11.5" fill="#4a7a3a" font-weight="bold">组B (idx≡1)：[1,2,8] 排序→</text>
  <rect x="250" y="292" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="273" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <rect x="300" y="292" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">2</text>
  <rect x="350" y="292" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="373" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8</text>
  <text x="410" y="318" font-size="10.5" fill="#b85450" font-weight="bold">↑中位数</text>
  <text x="60" y="350" font-size="11" fill="#333">代价 = |1−2|+|2−2|+|8−2| = 1+0+6 = <tspan font-weight="bold" fill="#b85450">7</tspan></text>

  <!-- conclusion box -->
  <rect x="40" y="368" width="480" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">中位数最小化 Σ|x − t|（L1 距离最优解）</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#555">前缀和 O(1) 求区间和：median·m₁ − prefix + (total−prefix) − median·m₂</text>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">合计 = 2 + 7 = 9</text>
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#888">各类独立处理，互不影响</text>
</svg>
