<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：original=[1,2,3,4], m=2, n=2</text>

  <!-- length check -->
  <rect x="40" y="46" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="11" fill="#4a7a3a" font-weight="bold">长度校验：original.length=4 == m×n=2×2=4 ✓ → 可填充</text>

  <!-- Header row -->
  <rect x="30" y="100" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(i, j)</text>
  <rect x="92" y="100" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="142" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx = i×n+j</text>
  <rect x="194" y="100" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">original[idx]</text>
  <rect x="296" y="100" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="356" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">result[i][j]</text>

  <!-- Row (0,0) -->
  <rect x="30" y="130" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#333">(0, 0)</text>
  <rect x="92" y="130" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0×2+0 = 0</text>
  <rect x="194" y="130" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="296" y="130" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row (0,1) -->
  <rect x="30" y="162" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="182" text-anchor="middle" font-size="11" fill="#333">(0, 1)</text>
  <rect x="92" y="162" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0×2+1 = 1</text>
  <rect x="194" y="162" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="296" y="162" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row (1,0) -->
  <rect x="30" y="194" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="214" text-anchor="middle" font-size="11" fill="#333">(1, 0)</text>
  <rect x="92" y="194" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1×2+0 = 2</text>
  <rect x="194" y="194" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="296" y="194" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row (1,1) -->
  <rect x="30" y="226" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="11" fill="#333">(1, 1)</text>
  <rect x="92" y="226" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1×2+1 = 3</text>
  <rect x="194" y="226" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="296" y="226" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- final result grid -->
  <text x="450" y="118" font-size="11" fill="#888" font-weight="bold">result 网格：</text>
  <rect x="450" y="130" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="492" y="130" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="512" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="534" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="554" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="576" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="596" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="450" y="180" font-size="10" fill="#888">→ 即 [[1,2],[3,4]] ⭐</text>

  <!-- failure case -->
  <rect x="30" y="280" width="580" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="304" font-size="12" fill="#b85450" font-weight="bold">反例：original=[1,2], m=1, n=1</text>
  <text x="50" y="324" font-size="11" fill="#555">长度校验：original.length=2 ≠ m×n=1×1=1 ✗</text>
  <text x="50" y="344" font-size="11" fill="#b85450" font-weight="bold">→ 无法填满 1×1 网格，返回空数组 []</text>

  <!-- footer -->
  <rect x="30" y="376" width="580" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="400" font-size="11" fill="#555">关键：idx = i×n+j 把"行号×列宽+列号"映射回一维下标，</text>
  <text x="50" y="418" font-size="11" fill="#555">本质是行主序（row-major）存储的代数展开。</text>
  <text x="50" y="436" font-size="11" fill="#4a7a3a" font-weight="bold">先校验总数，再用公式一趟填充——O(m×n) 时间、O(m×n) 输出空间。</text>
</svg>
