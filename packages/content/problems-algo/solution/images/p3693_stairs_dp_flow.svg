<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 + 滚动三元组，O(n) 时间 / O(1) 空间</text>
  <text x="498" y="44" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">跳距固定 3 档 ⇒ 每步转移 O(1)</text>

  <!-- 输入 -->
  <rect x="85" y="42" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="63" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">输入 n、costs（第 j 级落点费 = costs[j−1]）</text>

  <path d="M 215 76 L 215 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="60" y="96" width="310" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化滚动三元组：a = dp[0] = 0；b = c = +∞</text>
  <text x="215" y="134" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">b、c 充当 dp[j−2]、dp[j−3]，不存在的状态记 +∞</text>

  <!-- 侧注：前驱不足 -->
  <rect x="378" y="96" width="132" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="444" y="118" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">j = 1, 2 时前驱不足</text>
  <text x="444" y="134" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">b 或 c 为 +∞</text>
  <text x="444" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">min 自动屏蔽 ✓</text>

  <path d="M 215 148 L 215 164" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 -->
  <rect x="115" y="168" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for j = 1 … n（逐级上楼）</text>

  <path d="M 215 202 L 215 218" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="50" y="222" width="330" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur = costs[j−1] + min(a+1, b+4, c+9)</text>
  <text x="215" y="264" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">落点费 + 三档罚金（1 / 4 / 9），取最小</text>

  <path d="M 215 276 L 215 292" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 滚动 -->
  <rect x="70" y="296" width="290" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="317" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c ← b；b ← a；a ← cur</text>
  <text x="215" y="335" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">三元组右移一格，只留最近 3 个 dp 值</text>

  <path d="M 215 344 L 215 360" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="215,360 295,400 215,440 135,400" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j &lt; n ?</text>
  <text x="215" y="412" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">还有台阶没算吗</text>

  <!-- 是：回环 -->
  <path d="M 135 400 L 48 400 L 48 185 L 111 185" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="90" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是：j+1，继续下一级</text>

  <!-- 否：输出 -->
  <path d="M 215 440 L 215 458" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="454" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">否（j = n）</text>

  <rect x="110" y="462" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="483" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">返回 a（即 dp[n] 最小总成本）</text>
</svg>
