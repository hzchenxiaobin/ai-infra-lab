<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字符串相乘：双重循环逐位相乘流程</text>

  <!-- Start -->
  <ellipse cx="290" cy="54" rx="112" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="58" text-anchor="middle" font-size="12" fill="#333">开始: res[m+n] = 0</text>

  <path d="M 290 74 L 290 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond A: i >= 0 -->
  <polygon points="290,88 384,134 290,180 196,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#333">i ≥ 0 ?</text>
  <text x="290" y="146" text-anchor="middle" font-size="10" fill="#888">(外层, 从低位)</text>

  <!-- A: No -> return -->
  <path d="M 384 134 L 450 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="496" cy="134" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="138" text-anchor="middle" font-size="11" fill="#333">返回字符串</text>

  <!-- A: Yes -> down -->
  <path d="M 290 180 L 290 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="198" font-size="11" fill="#82b366">是</text>

  <!-- Diamond B: j >= 0 -->
  <polygon points="290,210 384,256 290,302 196,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#333">j ≥ 0 ?</text>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#888">(内层, 从低位)</text>

  <!-- B: No, decrement i -->
  <path d="M 196 256 L 142 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="169" y="248" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="92" y="242" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="117" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i--</text>

  <!-- decrement i, loop back to diamond A (left, dashed) -->
  <path d="M 117 242 L 117 134 L 196 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="190" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 70 190)">外层下一轮</text>

  <!-- B: Yes -> down -->
  <path d="M 290 302 L 290 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="316" font-size="11" fill="#82b366">是</text>

  <!-- Process box -->
  <rect x="158" y="324" width="264" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="11" fill="#333">mul = num1[i] × num2[j]</text>
  <text x="290" y="364" text-anchor="middle" font-size="11" fill="#333">p1 = i+j,  p2 = i+j+1</text>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#333">sum = mul + res[p2]</text>
  <text x="290" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">res[p2]=sum%10, res[p1]+=sum/10</text>
  <text x="290" y="416" text-anchor="middle" font-size="9" fill="#888">(个位固化，进位累加到高位)</text>

  <path d="M 290 422 L 290 436" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decrement j box -->
  <rect x="242" y="438" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="458" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j--</text>

  <!-- decrement j, loop back to diamond B (right, dashed) -->
  <path d="M 338 454 L 470 454 L 470 256 L 384 256" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="356" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 510 356)">内层下一轮</text>
</svg>
