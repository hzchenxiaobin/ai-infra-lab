<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例 1 演算：land = [[1,0,0],[0,1,1],[0,1,1]]
  </text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    两次「遇 1 → 扩展 → 清零」，得到 [[0,0,0,0],[1,1,2,2]]
  </text>

  <!-- Panel 1: initial, origin (40,90), cell 32 -->
  <text x="88" y="80" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 初始状态</text>
  <!-- row0: 1 0 0 -->
  <rect x="40"  y="90" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="72"  y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="104" y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 0 1 1 -->
  <rect x="40"  y="122" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="72"  y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="104" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 1 1 -->
  <rect x="40"  y="154" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="72"  y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="104" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- top-left corner marker (0,0) -->
  <circle cx="56" cy="106" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="88" y="208" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">扫描到 (0,0)=1</text>
  <text x="88" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ 左上角</text>
  <rect x="40" y="238" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="254" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">groups: []</text>

  <!-- arrow panel1 -> panel2 -->
  <path d="M 146 138 L 210 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="132" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">扩展+清零</text>

  <!-- Panel 2: after group A, origin (220,90) -->
  <text x="268" y="80" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 清零组 A 后</text>
  <!-- row0: 0(cleared) 0 0 -->
  <rect x="220" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="284" y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 0 1 1 -->
  <rect x="220" y="122" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="284" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 1 1 -->
  <rect x="220" y="154" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="284" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- top-left corner marker (1,1) -->
  <circle cx="268" cy="138" r="5" fill="#b85450" filter="url(#rough2)"/>
  <!-- extension arrows for group B -->
  <path d="M 252 116 L 316 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="112" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→ c2=2</text>
  <path d="M 240 122 L 240 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="158" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">↓ r2=2</text>
  <text x="268" y="208" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">扫描到 (1,1)=1</text>
  <text x="268" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ 左上角</text>
  <rect x="200" y="238" width="136" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="254" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">groups: [[0,0,0,0]]</text>

  <!-- arrow panel2 -> panel3 -->
  <path d="M 346 138 L 410 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="132" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">扩展+清零</text>

  <!-- Panel 3: after group B, origin (400,90) -->
  <text x="448" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">③ 清零组 B 后</text>
  <!-- row0: 0(cleared) 0 0 -->
  <rect x="400" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="464" y="90" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- row1: 0 0(cleared) 0(cleared) -->
  <rect x="400" y="122" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="122" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="464" y="122" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <!-- row2: 0 0(cleared) 0(cleared) -->
  <rect x="400" y="154" width="32" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="154" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="464" y="154" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="448" y="208" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">全表无 1</text>
  <text x="448" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ 扫描结束</text>
  <rect x="380" y="238" width="136" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="254" text-anchor="middle" font-size="9.5" fill="#3a5a2a" filter="url(#rough2)">groups: [[0,0,0,0],[1,1,2,2]]</text>

  <!-- legend -->
  <rect x="60" y="290" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="82" y="302" font-size="10" fill="#555" filter="url(#rough2)">组 A 农场</text>
  <rect x="150" y="290" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="172" y="302" font-size="10" fill="#555" filter="url(#rough2)">组 B 农场</text>
  <rect x="240" y="290" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="262" y="302" font-size="10" fill="#555" filter="url(#rough2)">已清零</text>
  <circle cx="320" cy="297" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="332" y="302" font-size="10" fill="#555" filter="url(#rough2)">当前左上角</text>

  <text x="290" y="326" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">
    组 A：扩展得 c2=0, r2=0 ⟹ [0,0,0,0]；组 B：扩展得 c2=2, r2=2 ⟹ [1,1,2,2]
  </text>
</svg>
