<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">不同的子序列：算法流程</text>
  <path d="M 250 44 Q 390 52 530 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 1. 初始化 -->
  <g filter="url(#sk)">
    <rect x="250" y="64" width="280" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="390" y="86" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">① 初始化</text>
  <text x="390" y="104" text-anchor="middle" font-size="11" fill="#444">dp[(m+1)×(n+1)], 第 0 列 = 1, 第 0 行 = 0</text>

  <path d="M 390 114 L 390 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. 双重循环 -->
  <g filter="url(#sk)">
    <rect x="250" y="128" width="280" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="390" y="150" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">② 双重循环 i = 1..m, j = 1..n</text>
  <text x="390" y="168" text-anchor="middle" font-size="11" fill="#444">逐行填表，从左到右</text>

  <path d="M 390 178 L 390 192" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. 判断菱形 -->
  <g filter="url(#sk)">
    <path d="M 390 194 L 470 230 L 390 266 L 310 230 Z" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="390" y="226" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">s[i-1] ==</text>
  <text x="390" y="242" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">t[j-1] ?</text>

  <!-- 是 → 左侧 -->
  <path d="M 310 230 L 200 230" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="222" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">是 ✓</text>

  <g filter="url(#sk)">
    <rect x="60" y="206" width="140" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="130" y="226" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">字符匹配</text>
  <text x="130" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#2b2b2b">dp[i-1][j-1]+dp[i-1][j]</text>

  <!-- 否 → 右侧 -->
  <path d="M 470 230 L 580 230" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="530" y="222" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">否 ✗</text>

  <g filter="url(#sk)">
    <rect x="580" y="206" width="140" height="48" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.6"/>
  </g>
  <text x="650" y="226" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">字符不匹配</text>
  <text x="650" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#2b2b2b">dp[i][j] = dp[i-1][j]</text>

  <!-- 两路汇合 -->
  <path d="M 130 254 L 130 286 L 390 286" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 650 254 L 650 286 L 390 286" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 390 266 L 390 286" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <path d="M 390 286 L 390 298" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 4. 填入 dp[i][j] -->
  <g filter="url(#sk)">
    <rect x="290" y="300" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="390" y="326" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">④ 填入 dp[i][j]</text>

  <path d="M 390 340 L 390 352" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 5. 循环判断 -->
  <g filter="url(#sk)">
    <path d="M 390 354 L 460 384 L 390 414 L 320 384 Z" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="390" y="382" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">遍历完?</text>
  <text x="390" y="398" text-anchor="middle" font-size="10" fill="#888">(i,j 到末尾)</text>

  <!-- 否 → 回到循环 -->
  <path d="M 320 384 L 230 384 L 230 153 L 250 153" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4,2"/>
  <text x="180" y="376" text-anchor="middle" font-size="10" fill="#888">否，继续下一格</text>

  <!-- 是 → 返回 -->
  <path d="M 460 384 L 560 384" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="490" y="376" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">是 ✓</text>

  <g filter="url(#sk)">
    <rect x="560" y="362" width="170" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="645" y="382" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">⑤ 返回 dp[m][n]</text>
  <text x="645" y="398" text-anchor="middle" font-size="10" fill="#666">方案总数</text>

  <!-- 底部说明 -->
  <text x="390" y="440" text-anchor="middle" font-size="11" fill="#888">时间 O(m×n)，空间 O(m×n) 或 O(n)（滚动数组）</text>
</svg>
