<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：筛 free=1 → 找相邻 seat_id 段(≥2) → 输出段内全部 seat_id</text>

  <!-- Cinema table (left) -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Cinema 表（按 seat_id 排序）</text>
  <rect x="40" y="62" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="77" font-size="10" fill="#333">seat_id</text>
  <text x="138" y="77" font-size="10" fill="#333">free</text>
  <line x1="100" y1="62" x2="100" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: seat_id=1, free=1, isolated (streak<2) -->
  <rect x="40" y="124" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="138" font-size="10" fill="#333">1</text>
  <text x="138" y="138" font-size="10" fill="#333">1</text>
  <line x1="100" y1="124" x2="100" y2="144" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 2: seat_id=2, free=0 (breaks streak) -->
  <rect x="40" y="144" width="140" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="158" font-size="10" fill="#999">2</text>
  <text x="138" y="158" font-size="10" fill="#999">0</text>
  <line x1="100" y1="144" x2="100" y2="164" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows 3-5: streak of 3 (highlighted) -->
  <rect x="40" y="164" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="178" font-size="10" fill="#333">3</text>
  <text x="138" y="178" font-size="10" fill="#333">1</text>
  <line x1="100" y1="164" x2="100" y2="184" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="184" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="198" font-size="10" fill="#333">4</text>
  <text x="138" y="198" font-size="10" fill="#333">1</text>
  <line x1="100" y1="184" x2="100" y2="204" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="204" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="218" font-size="10" fill="#333">5</text>
  <text x="138" y="218" font-size="10" fill="#333">1</text>
  <line x1="100" y1="204" x2="100" y2="224" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- legend for free values -->
  <rect x="40" y="104" width="140" height="20" fill="#fff" stroke="#bbb" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="50" y="117" font-size="8" fill="#4a7a3a">■free=1</text>
  <text x="100" y="117" font-size="8" fill="#999">■free=0</text>
  <text x="150" y="117" font-size="8" fill="#d6a040">■段内</text>

  <!-- Streak bracket for seat 1 (isolated) -->
  <path d="M34 124 Q28 124 28 134 Q28 144 34 144" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="135" font-size="9" fill="#b85450" font-weight="bold">段长1</text>
  <text x="20" y="145" font-size="9" fill="#b85450">✗&lt;2</text>

  <!-- Streak bracket for seats 3-5 (consecutive) -->
  <path d="M34 164 Q26 164 26 194 Q26 224 34 224" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="16" y="195" font-size="10" fill="#b85450" font-weight="bold">段长3</text>
  <text x="16" y="207" font-size="10" fill="#b85450" font-weight="bold">✓≥2</text>

  <!-- Arrow to output -->
  <path d="M190 194 L300 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="245" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a">输出整段</text>

  <!-- Output table (right) -->
  <text x="420" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出（按 seat_id 升序）</text>
  <rect x="340" y="160" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="175" text-anchor="middle" font-size="10" fill="#333">seat_id</text>

  <rect x="340" y="182" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="10" fill="#333">3</text>

  <rect x="340" y="202" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="216" text-anchor="middle" font-size="10" fill="#333">4</text>

  <rect x="340" y="222" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="236" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- seat 1 excluded note -->
  <text x="420" y="262" text-anchor="middle" font-size="9" fill="#b85450">seat_id=1 被排除（无相邻空余伙伴）</text>

  <!-- Bottom insight box -->
  <rect x="30" y="290" width="520" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">核心观察：seat 属于"2+连续段" ⟺ 它的前驱或后继也 free=1</text>
  <text x="48" y="334" font-size="10" fill="#333">① seat_id=1 虽空余，但相邻 seat_id=2 被占 → 段长1 &lt; 2 → 排除</text>
  <text x="48" y="352" font-size="10" fill="#333">② seat_id=2 被占 → 非空余本身就不参与段，且断开 1 与 3,4,5</text>
  <text x="48" y="370" font-size="10" fill="#b85450">⚠️ 比 180/601 更简单：段长 ≥ 2，只需"前驱或后继也空余"一个 OR 判定</text>
  <text x="48" y="388" font-size="10" fill="#333">③ seat_id=3,4,5 互为相邻空余 → 3 连段 ≥ 2 → 全部输出</text>
  <text x="48" y="404" font-size="10" fill="#4a7a3a">valid(s) ⟺ s.free=1 ∧ (free[seat_id−1]=1 ∨ free[seat_id+1]=1)</text>
</svg>
