<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：cnt 变动时双表联动搬桶</text>

  <!-- ===== add column (left) ===== -->
  <text x="130" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">add(number)</text>
  <g filter="url(#rough2)">
    <rect x="40" y="72" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="130" y="97" text-anchor="middle" font-size="13" fill="#333">old = cnt[number]</text>
  </g>
  <path d="M130 112 L130 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="130" y="155" text-anchor="middle" font-size="13" fill="#333">cnt[number] = old + 1</text>
  </g>
  <path d="M130 170 L130 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="188" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="130" y="213" text-anchor="middle" font-size="13" fill="#7a2a2a">freq[old] −= 1（离旧桶）</text>
  </g>
  <path d="M130 228 L130 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="246" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="130" y="271" text-anchor="middle" font-size="13" fill="#2a5a1a">freq[old+1] += 1（入新桶）</text>
  </g>
  <text x="130" y="306" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">old=0 时 freq[0] 被减，但永不被查询</text>

  <!-- ===== delete column (right) ===== -->
  <text x="430" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">deleteOne(number)</text>
  <g filter="url(#rough2)">
    <rect x="340" y="72" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="430" y="97" text-anchor="middle" font-size="13" fill="#333">old = cnt[number]</text>
  </g>
  <path d="M430 112 L430 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- diamond old==0? -->
  <g filter="url(#rough2)">
    <polygon points="430,126 500,158 430,190 360,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="430" y="162" text-anchor="middle" font-size="12" fill="#7a5a10">old == 0?</text>
  </g>
  <!-- yes branch to right -->
  <path d="M500 158 L540 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="520" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="544" y="142" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5"/>
    <text x="560" y="162" text-anchor="middle" font-size="10" fill="#7a2a2a">return</text>
  </g>
  <!-- no branch down -->
  <path d="M430 190 L430 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="202" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="340" y="208" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="430" y="233" text-anchor="middle" font-size="13" fill="#333">cnt[number] = old − 1</text>
  </g>
  <path d="M430 248 L430 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="340" y="266" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="430" y="291" text-anchor="middle" font-size="13" fill="#7a2a2a">freq[old] −= 1（离旧桶）</text>
  </g>
  <path d="M430 306 L430 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="340" y="324" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="430" y="349" text-anchor="middle" font-size="13" fill="#2a5a1a">freq[old−1] += 1（入新桶）</text>
  </g>
  <text x="430" y="384" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">old−1=0 时数字归零，freq[0] 不被查询</text>

  <!-- bottom invariant -->
  <g filter="url(#rough2)">
    <rect x="60" y="412" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="290" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">不变量：freq[f] = 恰好出现 f 次的数字个数（f ≥ 1）</text>
    <text x="290" y="450" text-anchor="middle" font-size="11" fill="#7a5a10">每次增删都「离旧频率桶 + 入新频率桶」，hasFrequency 直接查 freq</text>
  </g>
</svg>
