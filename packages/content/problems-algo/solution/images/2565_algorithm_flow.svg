<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两遍贪心建表 + 一次取最值</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">pre 左→右、suf 右→左，均在 s 上各扫一遍，O(n) 完成</text>

  <!-- ===== Step 1: pre ===== -->
  <rect x="50" y="70" width="540" height="110" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="96" font-size="13" fill="#446688" font-weight="bold">① 求 pre[k]：t 的前缀在 s[0..k−1] 中能匹配的最大长度</text>
  <text x="70" y="116" font-size="11" fill="#555">指针 p = 0；遍历 k = 1..n：若 p &lt; m 且 s[k−1] == t[p]，则 p++；pre[k] = p</text>

  <!-- mini illustration: s left to right -->
  <text x="70" y="150" font-size="11" fill="#888">s:</text>
  <rect x="92" y="136" width="26" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="122" y="136" width="26" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="152" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="152" y="136" width="26" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="182" y="136" width="26" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="152" text-anchor="middle" font-size="11" fill="#333">c</text>
  <path d="M 80 168 L 240 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="252" y="172" font-size="11" fill="#446688">扫完得 pre = [0,0,1,1,1,1,1,1]</text>

  <text x="470" y="150" font-size="11" fill="#888">t:</text>
  <rect x="492" y="136" width="26" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="152" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="522" y="136" width="26" height="22" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="152" text-anchor="middle" font-size="11" fill="#999">z</text>

  <!-- arrow between step1 and step2 -->
  <path d="M 320 184 L 320 200" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: suf ===== -->
  <rect x="50" y="204" width="540" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="230" font-size="13" fill="#4a7a3a" font-weight="bold">② 求 suf[k]：t 的后缀在 s[k..n−1] 中能匹配的最大长度</text>
  <text x="70" y="250" font-size="11" fill="#555">指针 q = m−1；逆序遍历 k = n−1..0：若 q ≥ 0 且 s[k] == t[q]，则 q−−；suf[k] = (m−1)−q；suf[n] = 0</text>

  <text x="70" y="284" font-size="11" fill="#888">s:</text>
  <rect x="92" y="270" width="26" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="286" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="122" y="270" width="26" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="286" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="152" y="270" width="26" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="286" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="182" y="270" width="26" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="286" text-anchor="middle" font-size="11" fill="#333">c</text>
  <path d="M 240 286 L 80 286" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="290" font-size="11" fill="#4a7a3a">右→左得 suf = [2,2,2,2,2,1,1,0]</text>

  <text x="470" y="284" font-size="11" fill="#888">t:</text>
  <rect x="492" y="270" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="286" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="522" y="270" width="26" height="22" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="286" text-anchor="middle" font-size="11" fill="#999">a</text>

  <path d="M 320 318 L 320 334" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: max ===== -->
  <rect x="50" y="338" width="540" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="364" font-size="13" fill="#444" font-weight="bold">③ best = max ( pre[k] + suf[k] )，k = 0..n</text>
  <text x="70" y="384" font-size="11" fill="#555">扫一遍所有切分点 k：前缀用 s[0..k−1]、后缀用 s[k..]，二者不重叠</text>

  <path d="M 320 402 L 320 418" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="120" y="422" width="400" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="448" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">④ 返回 max(0, m − best)</text>
  <text x="320" y="468" text-anchor="middle" font-size="11" fill="#888">best ≥ m 时 → 整个 t 已是 s 子序列 → 得分 0</text>

  <text x="320" y="502" text-anchor="middle" font-size="11" fill="#888">时间 O(n + m)，空间 O(n)</text>
</svg>
