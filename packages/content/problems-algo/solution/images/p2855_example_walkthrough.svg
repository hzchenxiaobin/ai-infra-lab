<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：扫描断点 → 环接检查 → 套公式 n − i</text>

  <!-- ======== 示例 1 ======== -->
  <text x="30" y="48" font-size="12" fill="#333" filter="url(#rough2)">示例 1：[3,4,5,1,2]</text>

  <rect x="30" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="74" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="118" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="162" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M162,52 L157,62 L167,76 L155,90 L162,100" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="286" y="64" font-size="12" fill="#333" filter="url(#rough2)">断点：仅 1 处（i = 3，5→1）</text>
  <text x="286" y="84" font-size="12" fill="#4a7a3a" filter="url(#rough2)">环接：B 尾 2 &lt; A 头 3 ✓</text>
  <text x="286" y="104" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = n − i = 5 − 3 = 2</text>

  <line x1="30" y1="126" x2="530" y2="126" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ======== 示例 2 ======== -->
  <text x="30" y="152" font-size="12" fill="#333" filter="url(#rough2)">示例 2：[1,3,5]</text>

  <rect x="30" y="160" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="160" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="118" y="160" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <text x="286" y="168" font-size="12" fill="#333" filter="url(#rough2)">断点：0 处（已经递增）</text>
  <text x="286" y="188" font-size="12" fill="#888" filter="url(#rough2)">跳过环接检查</text>
  <text x="286" y="208" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 0</text>

  <line x1="30" y1="230" x2="530" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ======== 示例 3 ======== -->
  <text x="30" y="256" font-size="12" fill="#333" filter="url(#rough2)">示例 3：[2,1,4]</text>

  <rect x="30" y="264" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="74" y="264" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="264" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M74,260 L69,270 L79,284 L67,296 L74,308" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="286" y="272" font-size="12" fill="#333" filter="url(#rough2)">断点：仅 1 处（i = 1，2→1）</text>
  <text x="286" y="292" font-size="12" fill="#b85450" filter="url(#rough2)">环接：B 尾 4 &gt; A 头 2 ✗</text>
  <text x="286" y="312" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = −1</text>

  <!-- 底部总结 -->
  <rect x="70" y="340" width="420" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">有解 ⇔ 断点唯一且环接相容；答案 = n − 断点下标（已递增为 0）</text>
</svg>
