<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrD2" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
      <path d="M 0 0 L 9 0 L 4.5 9 z" fill="#666"/>
    </marker>
    <marker id="arrR2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：枚举两种谷位方案取最小</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">方案A 谷在奇数下标 / 方案B 谷在偶数下标，各自累加压低代价</text>

  <!-- start -->
  <rect x="210" y="60" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">costA = costB = 0</text>

  <path d="M 270 92 L 270 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="150" y="112" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 i = 0 … n−1</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#888">对每个位置判定它落在哪种方案里</text>

  <!-- branch lines -->
  <path d="M 270 156 L 270 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <!-- diamond -->
  <polygon points="270,168 360,200 270,232 180,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i 是哪个</text>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">方案的谷位？</text>

  <!-- left branch: i 奇数 → 方案A 谷 -->
  <path d="M 180 200 L 90 200 L 90 248" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="92" y="192" font-size="10" fill="#446688" font-weight="bold">i 奇数</text>
  <rect x="20" y="252" width="140" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方案A 谷位</text>
  <text x="90" y="290" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">m = min(邻)</text>
  <text x="90" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">costA += max(0,</text>
  <text x="90" y="316" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">nums[i]-m+1)</text>

  <!-- right branch: i 偶数 → 方案B 谷 -->
  <path d="M 360 200 L 450 200 L 450 248" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="392" y="192" font-size="10" fill="#d6a040" font-weight="bold">i 偶数</text>
  <rect x="380" y="252" width="140" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">方案B 谷位</text>
  <text x="450" y="290" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">m = min(邻)</text>
  <text x="450" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">costB += max(0,</text>
  <text x="450" y="316" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">nums[i]-m+1)</text>

  <!-- loop back -->
  <path d="M 90 316 L 90 360 L 268 360" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 450 316 L 450 360 L 272 360" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 270 360 L 270 134" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="282" y="356" font-size="9" fill="#888">下一个 i</text>

  <!-- end -->
  <path d="M 270 372 L 270 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <rect x="170" y="392" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return min(costA, costB)</text>
</svg>
