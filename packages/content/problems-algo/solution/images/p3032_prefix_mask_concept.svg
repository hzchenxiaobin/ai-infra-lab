<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：位掩码查重 + 前缀和拆区间</text>

  <!-- ============ LEFT: prefix sum ============ -->
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 前缀和：区间 ← 两个前缀相减</text>

  <!-- number axis -->
  <path d="M 36 84 L 246 84" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="48" y1="78" x2="48" y2="90" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="130" y1="78" x2="130" y2="90" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="142" y1="78" x2="142" y2="90" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="212" y1="78" x2="212" y2="90" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="102" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="124" y="102" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">a−1</text>
  <text x="148" y="102" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="212" y="102" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">b</text>

  <!-- bar f(b) -->
  <rect x="48" y="110" width="164" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="110" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f(b)</text>
  <text x="177" y="127" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">[a, b]</text>

  <!-- bar f(a-1) -->
  <rect x="48" y="144" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="89" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">f(a−1)</text>

  <!-- formula box -->
  <rect x="36" y="184" width="216" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="144" y="205" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">答案 = f(b) − f(a−1)（红色段）</text>

  <!-- note box -->
  <rect x="36" y="228" width="216" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144" y="250" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">枚举 [a,b]：耗时 ∝ 区间长度</text>
  <text x="144" y="268" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">前缀相减：f 只与 n 的位数有关</text>
  <text x="144" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">整段按位计数：d 位数 = 9×9×8×…</text>
  <text x="144" y="304" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">b 到 10⁹ 也只需 O(d·2¹⁰·10)</text>

  <!-- ============ RIGHT: bitmask ============ -->
  <text x="394" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 位掩码：一个 int 当哈希集合</text>

  <!-- success case: 120 -->
  <text x="300" y="84" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">x = 120 →</text>
  <rect x="368" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="385" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="406" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="423" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="444" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="461" y="86" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="394" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↓ 逐位登记进 mask</text>

  <!-- bit rows: digit labels -->
  <text x="294" y="140" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">数字 d</text>
  <rect x="299" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="308.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">0</text>
  <rect x="320" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="329.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <rect x="341" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">2</text>
  <rect x="362" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="371.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <rect x="383" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">4</text>
  <rect x="404" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">5</text>
  <rect x="425" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="434.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">6</text>
  <rect x="446" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">7</text>
  <rect x="467" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">8</text>
  <rect x="488" y="128" width="19" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="497.5" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">9</text>

  <!-- bit rows: bit values -->
  <text x="294" y="162" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">bit</text>
  <rect x="299" y="150" width="19" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="308.5" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="320" y="150" width="19" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="329.5" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="341" y="150" width="19" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350.5" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="362" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="371.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="383" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="404" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="425" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="434.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="446" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="467" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="488" y="150" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="497.5" y="163" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <text x="394" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mask = 0b111 → {0,1,2}，三位互不相同 ✓</text>

  <!-- fail case: 100 -->
  <text x="300" y="226" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">x = 100 →</text>
  <rect x="368" y="208" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="383" y="228" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="402" y="208" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="228" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="436" y="208" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <path d="M 451 240 C 420 270, 340 246, 311 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="299" y="264" width="19" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="308.5" y="277" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="320" y="264" width="19" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="329.5" y="277" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="341" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="362" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="371.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="383" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="404" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="425" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="434.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="446" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="467" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="488" y="264" width="19" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="497.5" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <text x="394" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 2 个 0 想再点亮 bit0，发现已是 1</text>
  <text x="394" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复！该数非法 ✗</text>

  <!-- bottom note -->
  <rect x="36" y="336" width="448" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">mask：10 个数字 → 整数低 10 位，查 / 改均 O(1)；前缀和：区间计数与区间长度解耦。</text>

  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（x = 100 的第 1 个 0 合法登记，第 2 个 0 才触发重复 —— 同一数字出现两次即出局）</text>
</svg>
