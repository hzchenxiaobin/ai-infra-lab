<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分桶 → 沿房屋编号扫一遍 → 返回 dp[n]</text>

  <!-- start -->
  <rect x="250" y="40" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="310" y="59" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 310 70 L 310 88" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bucket -->
  <rect x="180" y="90" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 offers，按 end 入桶：</text>
  <text x="310" y="123" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">groups[end] 收集 (start, gold)</text>
  <path d="M 310 130 L 310 148" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="180" y="150" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[0] = 0，i = 0</text>
  <path d="M 310 186 L 310 204" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="310,206 400,246 310,286 220,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="310" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">还有房屋没扫</text>
  <path d="M 310 286 L 310 304" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="300" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no branch to return -->
  <path d="M 400 246 L 500 246" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="504" y="228" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="554" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 dp[n]</text>

  <!-- not sell -->
  <rect x="180" y="306" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="329" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i+1] = dp[i]（房屋 i 不卖）</text>
  <path d="M 310 342 L 310 360" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="310,362 390,396 310,430 230,396" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">groups[i] 还有</text>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">未处理的报价？</text>

  <!-- yes branch right: relax -->
  <path d="M 390 396 L 470 396" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="390" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="474" y="372" width="134" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="541" y="391" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">dp[i+1] = max(dp[i+1],</text>
  <text x="541" y="407" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">dp[s] + gold)</text>
  <path d="M 541 372 Q 541 352 450 352 Q 400 352 396 384" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch down-left: i++ -->
  <path d="M 230 396 L 110 396" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="60" y="378" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>
  <path d="M 95 378 Q 95 246 216 246" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">回到 i&lt;n?</text>
</svg>
