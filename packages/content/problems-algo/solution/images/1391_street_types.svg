<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">六种街道类型及其连通方向</text>
  <path d="M 140 38 Q 280 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">每个格子代表一条街道，数字决定它连通哪两条边</text>

  <!-- Row 1: types 1, 2, 3 -->
  <!-- type 1: left-right -->
  <g filter="url(#sk)">
    <rect x="40" y="80" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 1</text>
  <path d="M 40 145 L 160 145" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="100" y="228" text-anchor="middle" font-size="10" fill="#555">左 ↔ 右</text>

  <!-- type 2: up-down -->
  <g filter="url(#sk)">
    <rect x="220" y="80" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 2</text>
  <path d="M 280 80 L 280 210" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#555">上 ↔ 下</text>

  <!-- type 3: left-down (┐) -->
  <g filter="url(#sk)">
    <rect x="400" y="80" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="460" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 3</text>
  <path d="M 400 145 Q 460 145 460 210" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="460" y="228" text-anchor="middle" font-size="10" fill="#555">左 ↔ 下</text>

  <!-- Row 2: types 4, 5, 6 -->
  <!-- type 4: right-down (┌) -->
  <g filter="url(#sk)">
    <rect x="40" y="250" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 4</text>
  <path d="M 160 315 Q 100 315 100 380" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="100" y="398" text-anchor="middle" font-size="10" fill="#555">右 ↔ 下</text>

  <!-- type 5: left-up (┘) -->
  <g filter="url(#sk)">
    <rect x="220" y="250" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 5</text>
  <path d="M 220 315 Q 280 315 280 250" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#555">左 ↔ 上</text>

  <!-- type 6: right-up (└) -->
  <g filter="url(#sk)">
    <rect x="400" y="250" width="120" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="460" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6e">类型 6</text>
  <path d="M 520 315 Q 460 315 460 250" stroke="#d6a040" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="460" y="398" text-anchor="middle" font-size="10" fill="#555">右 ↔ 上</text>
</svg>
