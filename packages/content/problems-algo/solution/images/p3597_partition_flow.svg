<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：哈希集合模拟（双指针 i / j）</text>

  <!-- ============ seen 说明框（右上虚线） ============ -->
  <g filter="url(#rough2)">
    <rect x="352" y="34" width="154" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8"/>
    <text x="429" y="50" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold">seen = 已提交段的集合</text>
    <text x="429" y="66" text-anchor="middle" font-size="8" fill="#333">互不相同 · 互不重叠 → 总长 ≤ n</text>
  </g>

  <!-- ============ 开始 ============ -->
  <g filter="url(#rough2)">
    <rect x="175" y="36" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14"/>
    <text x="250" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i = 0，seen = ∅，ans = []</text>
  </g>
  <path d="M 250 64 L 250 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 菱形 A0：i < n？ ============ -->
  <g filter="url(#rough2)">
    <polygon points="250,74 330,100 250,126 170,100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="104" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">i &lt; n ？</text>
  </g>

  <!-- 否 → 返回 ans（左侧） -->
  <path d="M 170 100 L 118 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="92" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="14" y="84" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="64" y="104" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">返回 ans ✓</text>
  </g>

  <!-- 是 ↓ -->
  <path d="M 250 126 L 250 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="134" font-size="9.5" fill="#999" filter="url(#rough2)">是</text>

  <!-- ============ j = i ============ -->
  <g filter="url(#rough2)">
    <rect x="175" y="140" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j = i，段从 s[i] 开始</text>
  </g>
  <path d="M 250 164 L 250 172" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 菱形 D1：j<n 且 s[i..j]∈seen？ ============ -->
  <g filter="url(#rough2)">
    <polygon points="250,176 365,210 250,244 135,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="206" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">j &lt; n 且</text>
    <text x="250" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">s[i..j] ∈ seen ？</text>
  </g>

  <!-- 是 → j++（右侧） -->
  <path d="M 365 210 L 391 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="202" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="397" y="197" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="437" y="214" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j = j + 1</text>
    <text x="437" y="236" text-anchor="middle" font-size="8" fill="#666">已见过 → 吞一字符</text>
  </g>

  <!-- j++ 回环（弧线回到 D1 上右边） -->
  <path d="M 437 197 C 437 170, 382 168, 320 193" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="393" y="167" font-size="8.5" fill="#999" filter="url(#rough2)">扩展后再判</text>

  <!-- 否 ↓ -->
  <path d="M 250 244 L 250 252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="252" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- ============ 菱形 D2：j == n？ ============ -->
  <g filter="url(#rough2)">
    <polygon points="250,256 340,282 250,308 160,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="280" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">j == n ？</text>
    <text x="250" y="296" text-anchor="middle" font-size="8.5" fill="#8a6d1f">字符串耗尽？</text>
  </g>

  <!-- 是 → 丢弃尾段（左侧红框） -->
  <path d="M 160 282 L 148 282" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="153" y="274" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="20" y="264" width="124" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="82" y="279" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">丢弃尾段</text>
    <text x="82" y="293" text-anchor="middle" font-size="8.5" fill="#b85450">返回 ans（不补提交）</text>
  </g>

  <!-- 否 ↓ -->
  <path d="M 250 308 L 250 318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="316" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- ============ 提交段 ============ -->
  <g filter="url(#rough2)">
    <rect x="155" y="322" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="250" y="338" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">提交新段 s[i..j]</text>
    <text x="250" y="353" text-anchor="middle" font-size="9" fill="#333">ans 与 seen 各加入，i = j + 1</text>
  </g>

  <!-- 外层回环（右侧回到菱形 A0） -->
  <path d="M 345 341 L 495 341 L 495 100 L 336 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="478" y="230" font-size="8.5" fill="#999" filter="url(#rough2)">下一段</text>

  <!-- ============ 底部注解 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="372" width="400" height="22" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="8"/>
    <text x="260" y="386" text-anchor="middle" font-size="8.5" fill="#666">集合查询次数 = Σ 段长 ≤ n；哈希版每次 O(√n) 字符 → O(n√n)；Trie 版沿树下行每步 O(1) → O(n)</text>
  </g>
</svg>
