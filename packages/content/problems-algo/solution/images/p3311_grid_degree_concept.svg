<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：网格的「度数地图」—— 位置决定度数</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">角 = 2（橙）· 边 = 3（绿）· 内部 = 4（蓝）</text>

  <!-- 4 行 × 5 列示例网格，格子 52×52，起点 (36,62) -->
  <!-- 第 0 行 -->
  <rect x="36" y="62" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="93" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="88" y="62" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="93" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="140" y="62" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="93" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="62" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="93" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="244" y="62" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="93" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 第 1 行 -->
  <rect x="36" y="114" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="145" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="88" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="145" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="140" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="145" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="192" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="145" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="244" y="114" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 第 2 行 -->
  <rect x="36" y="166" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="197" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="88" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="197" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="140" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="197" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="192" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="197" text-anchor="middle" font-size="16" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="244" y="166" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 第 3 行 -->
  <rect x="36" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="249" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="88" y="218" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="249" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="140" y="218" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="249" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="218" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="249" text-anchor="middle" font-size="16" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="244" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="16" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 角 c 徽章 -->
  <circle cx="46" cy="72" r="7.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="46" y="76" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="166" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">示例网格 4 行 × 5 列：4 个角 + 10 个边 + 6 个内部</text>

  <!-- 右侧图例 -->
  <text x="404" y="78" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">度数 = 上 / 下 / 左 / 右有邻居的方位数</text>

  <rect x="312" y="86" width="184" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="404" y="105" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">角（4 个）：度 = 2</text>

  <rect x="312" y="122" width="184" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="404" y="141" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">边（非角）：度 = 3</text>

  <rect x="312" y="158" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="404" y="177" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">内部：度 = 4</text>

  <rect x="312" y="198" width="184" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="404" y="216" text-anchor="middle" font-size="9.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">存在度 1 ⟺ 网格是 1×n</text>
  <text x="404" y="231" text-anchor="middle" font-size="9" fill="#8a3a34" filter="url(#rough2)">（某条边长为 1）图是一条链，</text>
  <text x="404" y="245" text-anchor="middle" font-size="9" fill="#8a3a34" filter="url(#rough2)">从端点直接走链（示例 2）</text>

  <rect x="312" y="270" width="184" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="404" y="288" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">翻转行 / 列不改变邻接 ⇒</text>
  <text x="404" y="302" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">任取一个度 2 节点当左上角 c</text>
  <text x="404" y="316" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（2×2 时四个节点都是角）</text>
</svg>
