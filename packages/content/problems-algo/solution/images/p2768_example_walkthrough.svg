<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2768w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：3 个黑格影响 4 个块</text>

  <!-- left: 3x3 grid -->
  <text x="92" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">m=3, n=3</text>
  <g filter="url(#rough2)">
    <!-- grid lines: x0=40, y0=84, cell=42, 3x3 -> 126 -->
    <rect x="40" y="84" width="126" height="126" fill="#fff" stroke="#446688" stroke-width="1.6" rx="3"/>
    <line x1="82" y1="84" x2="82" y2="210" stroke="#446688" stroke-width="1"/>
    <line x1="124" y1="84" x2="124" y2="210" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="126" x2="166" y2="126" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="168" x2="166" y2="168" stroke="#446688" stroke-width="1"/>
    <!-- black cells: (0,0)->(40,84); (1,1)->(82,126); (0,2)->(40,168) -->
    <rect x="40" y="84" width="42" height="42" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
    <rect x="82" y="126" width="42" height="42" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
    <rect x="40" y="168" width="42" height="42" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
  </g>
  <text x="61" y="110" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">黑</text>
  <text x="103" y="152" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">黑</text>
  <text x="61" y="194" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">黑</text>
  <text x="103" y="230" text-anchor="middle" font-size="9" fill="#888">黑格: (0,0) (1,1) (0,2)</text>

  <!-- right: affected blocks table -->
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">受影响块 → 黑格数</text>

  <rect x="250" y="86" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">块(0,0)</text>
  <rect x="410" y="86" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="435" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="250" y="124" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">块(0,1)</text>
  <rect x="410" y="124" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="435" y="144" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="250" y="162" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">块(1,0)</text>
  <rect x="410" y="162" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="435" y="182" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <rect x="250" y="200" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">块(1,1)</text>
  <rect x="410" y="200" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="435" y="220" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <text x="400" y="250" text-anchor="middle" font-size="10" fill="#888">受影响块 s = 4 ；块总数 total = (3−1)(3−1) = 4</text>

  <!-- arrow down to arr -->
  <path d="M280,260 L280,284" stroke="#446688" stroke-width="2" marker-end="url(#arr2768w)" filter="url(#rough2)"/>

  <!-- bottom: arr result -->
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">arr：恰好含 i 个黑格的块数</text>
  <!-- 5 cells, width 56, start x=140 -->
  <rect x="140" y="310" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="168" y="335" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <text x="168" y="362" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <rect x="198" y="310" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="226" y="335" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="226" y="362" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <rect x="256" y="310" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="284" y="335" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="284" y="362" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <rect x="314" y="310" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="342" y="335" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <text x="342" y="362" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <rect x="372" y="310" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="335" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
  <text x="400" y="362" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">arr[0] = total − s = 4 − 4 = 0 → 结果 [0, 2, 2, 0, 0]</text>
</svg>
