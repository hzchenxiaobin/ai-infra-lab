<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：树状数组维护值域频次，O(log V) 查询两侧计数</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">插入 x=2 时，nums=[1,5,6]：less=1（绿），greater=2（红），cost=min(1,2)=1</text>

  <!-- ===== Top: sorted array nums with new element x ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">已有数组 nums（保持有序）</text>

  <!-- index labels -->
  <text x="118" y="94" text-anchor="middle" font-size="9" fill="#888">值 1</text>
  <text x="178" y="94" text-anchor="middle" font-size="9" fill="#888">值 5</text>
  <text x="238" y="94" text-anchor="middle" font-size="9" fill="#888">值 6</text>

  <!-- array cells: 1 (green <2), 5 (red >2), 6 (red >2) -->
  <rect x="96" y="100" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="120" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <rect x="156" y="100" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="216" y="100" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>

  <!-- new element x=2 (orange) -->
  <rect x="320" y="100" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">x=2</text>
  <text x="348" y="94" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">待插入</text>

  <!-- green bracket: less = elements < 2 -->
  <path d="M 96 138 L 96 148 L 140 148 L 140 138" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="118" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">less = 1</text>

  <!-- red bracket: greater = elements > 2 -->
  <path d="M 156 138 L 156 170 L 260 170 L 260 138" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="208" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">greater = 2</text>

  <!-- cost box -->
  <rect x="410" y="106" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cost = min(less, greater)</text>
  <text x="485" y="148" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= min(1, 2) = 1</text>

  <!-- ===== Divider ===== -->
  <line x1="30" y1="206" x2="550" y2="206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Bottom: BIT frequency table ===== -->
  <text x="40" y="230" font-size="11" fill="#446688" font-weight="bold">树状数组：值域频次表 freq[1..6]（1-indexed）</text>

  <!-- freq cells -->
  <rect x="76" y="244" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="244" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="244" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="263" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="208" y="244" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="263" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="252" y="244" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="296" y="244" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- value labels below -->
  <text x="98" y="286" text-anchor="middle" font-size="9" fill="#888">v=1</text>
  <text x="142" y="286" text-anchor="middle" font-size="9" fill="#888">v=2</text>
  <text x="186" y="286" text-anchor="middle" font-size="9" fill="#888">v=3</text>
  <text x="230" y="286" text-anchor="middle" font-size="9" fill="#888">v=4</text>
  <text x="274" y="286" text-anchor="middle" font-size="9" fill="#888">v=5</text>
  <text x="318" y="286" text-anchor="middle" font-size="9" fill="#888">v=6</text>

  <!-- less = query(x-1) = query(1): bracket over freq[1] -->
  <path d="M 76 296 L 76 306 L 120 306 L 120 296" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="98" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">query(1)=1</text>
  <text x="200" y="320" font-size="10.5" fill="#4a7a3a">less = query(x−1) = query(1) = 1</text>

  <!-- greater = total - query(x) = 3 - query(2): bracket over freq[1..2] -->
  <path d="M 76 332 L 76 342 L 164 342 L 164 332" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="120" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">query(2)=1</text>
  <text x="200" y="356" font-size="10.5" fill="#b85450">greater = total − query(x) = 3 − 1 = 2</text>

  <!-- ===== Bottom notes ===== -->
  <rect x="30" y="374" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="11" fill="#444">freq[v] 记录值 v 已插入的次数；query(k) = freq[1..k] 前缀和</text>
  <text x="290" y="410" text-anchor="middle" font-size="11" fill="#555">less = query(x−1)（严格更小）　greater = total − query(x)（严格更大）</text>
  <text x="290" y="424" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">两次 query + 一次 update，均为 O(log V)</text>
</svg>
