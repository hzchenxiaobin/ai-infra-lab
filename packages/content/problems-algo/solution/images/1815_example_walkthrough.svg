<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例 2 演算：batchSize=4, groups=[1,3,2,5,2,2,1,6]
  </text>

  <!-- ===== Step 1: remainder table ===== -->
  <text x="30" y="50" font-size="11" fill="#446688" filter="url(#rough2)">① 余数化</text>

  <!-- table header: original -->
  <rect x="30" y="56" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">原始</text>
  <rect x="72" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="106" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="189" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <rect x="208" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="291" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="56" width="30" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>

  <!-- row: remainder mod 4 -->
  <rect x="30" y="80" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">mod4</text>
  <rect x="72" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="106" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="189" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="223" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="291" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="80" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>

  <text x="355" y="94" font-size="10" fill="#888" filter="url(#rough2)">→ cnt=[0,3,4,1]</text>

  <!-- ===== Step 2: cnt[0] ===== -->
  <text x="30" y="118" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② cnt[0]=0 → ans=0</text>

  <!-- ===== Step 3: pairing ===== -->
  <text x="30" y="140" font-size="11" fill="#d6a040" filter="url(#rough2)">③ 互补配对</text>

  <!-- pair (1,3) -->
  <rect x="30" y="148" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="166" font-size="10" fill="#333" filter="url(#rough2)">配对 (1,3)：min(3,1)=1 对</text>
  <text x="200" y="166" font-size="10" fill="#d6a040" filter="url(#rough2)">+1</text>

  <!-- pair (2,2) -->
  <rect x="30" y="180" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="198" font-size="10" fill="#333" filter="url(#rough2)">配对 (2,2)：4/2=2 对</text>
  <text x="200" y="198" font-size="10" fill="#d6a040" filter="url(#rough2)">+2</text>

  <!-- ans after pairing -->
  <rect x="270" y="162" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="182" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">ans = 0+1+2 = 3</text>

  <!-- leftover -->
  <rect x="430" y="148" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="166" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">剩余：cnt[1]=2</text>
  <text x="490" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">其余全为 0</text>

  <!-- ===== Step 4: DFS ===== -->
  <text x="30" y="224" font-size="11" fill="#446688" filter="url(#rough2)">④ 记忆化 DFS（剩余 2 组，余数均为 1）</text>

  <!-- DFS step table -->
  <!-- header -->
  <rect x="30" y="232" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">步骤</text>
  <rect x="94" y="232" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">选 r</text>
  <rect x="158" y="232" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rem</text>
  <rect x="222" y="232" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">开心?</text>
  <rect x="296" y="232" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新 rem</text>
  <rect x="370" y="232" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="247" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">累计</text>

  <!-- row 1: step 1, r=1, rem=0, happy, new_rem=3, total=1 -->
  <rect x="30" y="258" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="258" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="258" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="273" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">0</text>
  <rect x="222" y="258" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="257" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 开心</text>
  <rect x="296" y="258" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0−1)%4=3</text>
  <rect x="370" y="258" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="273" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">1</text>

  <!-- row 2: step 2, r=1, rem=3, not happy, new_rem=2, total=1 -->
  <rect x="30" y="284" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="299" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="284" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="299" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="284" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="299" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">3</text>
  <rect x="222" y="284" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="257" y="299" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 不开心</text>
  <rect x="296" y="284" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="299" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(3−1)%4=2</text>
  <rect x="370" y="284" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="299" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <!-- DFS result -->
  <rect x="30" y="316" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">DFS 返回 1</text>

  <!-- ===== Final answer ===== -->
  <rect x="150" y="354" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="14" fill="#2a4a1a" filter="url(#rough2)">
    最终答案 = 3 + 1 = 4 ✓
  </text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="404" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    8 组中 6 组被配对消化（3 对=3 开心），仅 2 组交 DFS → 配对是状态压缩关键
  </text>
</svg>
