<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="408" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：总代价可以「重新记账」—— 每段只算自己的账</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · nums = [3, 1, 4]，cost = [4, 6, 6]，k = 1 · 划分：[3,1] ∣ [4]</text>

  <!-- ================= Panel A: original ================= -->
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 原始记账：第 i 段 = (nums[0..r] 前缀 + k·i) × (本段 cost 和)</text>
  <text x="252" y="76" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 2 段的因子 = nums[0..2] + k·2 —— 越过分界线去取 3、1！</text>
  <path d="M 160 82 L 160 76 L 344 76 L 344 82" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="52" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="160" y="86" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="86" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="86" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="252" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="316" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="52" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cost</text>
  <rect x="160" y="120" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="120" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="120" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="252" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="316" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <line x1="284" y1="80" x2="284" y2="158" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="292" y="96" font-size="9" fill="#8a6d1f" filter="url(#rough2)">切分</text>

  <text x="64" y="162" font-size="10" fill="#333" filter="url(#rough2)">第 1 段 = (3 + 1 + k·1) × (4+6) = 50</text>
  <text x="64" y="178" font-size="10" fill="#333" filter="url(#rough2)">第 2 段 = (3 + 1 + 4 + k·2) × 6 = 60 <tspan fill="#b85450" font-weight="bold">← 因子越过分界线取 3、1，还背着序号</tspan></text>

  <!-- ================= Panel B: redistributed ================= -->
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 重新记账：第 t 段 = (本段 nums 和 + k) × (从本段开头到末尾的 cost 和)</text>
  <text x="220" y="214" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3 + 1 + k = 5</text>
  <text x="316" y="214" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4 + k = 5</text>
  <path d="M 160 220 L 160 214 L 280 214 L 280 220" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 288 220 L 288 214 L 344 214 L 344 220" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="52" y="241" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="160" y="224" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="224" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="224" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="252" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="316" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="52" y="275" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cost</text>
  <rect x="160" y="258" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="258" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="258" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="252" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="316" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <line x1="284" y1="218" x2="284" y2="292" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="292" y="234" font-size="9" fill="#8a6d1f" filter="url(#rough2)">切分</text>

  <path d="M 160 284 L 160 290 L 344 290 L 344 284" fill="none" stroke="#33506b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="304" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4+6+6 = 16（从本段开头到数组末尾）</text>
  <path d="M 288 294 L 288 300 L 344 300 L 344 294" fill="none" stroke="#33506b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="314" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">第 1 段 = 5 × 16 = 80　　　　第 2 段 = 5 × 6 = 30</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">80 + 30 = 110 = 50 + 60 ✓ 总账不变，每段只看自己的区间！</text>

  <g filter="url(#rough2)">
    <rect x="36" y="358" width="448" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="260" y="373" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">总代价 = Σ<tspan dy="3" font-size="7.5">t</tspan><tspan dy="-3"> (S</tspan><tspan dy="3" font-size="7.5">t</tspan><tspan dy="-3"> + k) · (SC[n] − SC[l</tspan><tspan dy="3" font-size="7.5">t</tspan><tspan dy="-3">])</tspan></text>
    <text x="260" y="386" text-anchor="middle" font-size="9" fill="#2f5d24">每段贡献只依赖自己的区间 [l, r] —— 左边怎么切、自己是第几段，统统无关</text>
  </g>
</svg>
