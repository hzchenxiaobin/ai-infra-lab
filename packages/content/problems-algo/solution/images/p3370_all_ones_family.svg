<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">全 1 数家族：k 个 1 连排 = 2^k − 1</text>

  <!-- k=1 行 -->
  <text x="58" y="75" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k=1</text>
  <rect x="68" y="58" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="76" font-size="15" fill="#333" filter="url(#rough2)">= 1</text>

  <!-- k=2 行 -->
  <text x="58" y="113" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k=2</text>
  <rect x="68" y="96" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="96" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="114" font-size="15" fill="#333" filter="url(#rough2)">= 3</text>

  <!-- k=3 行（n=10 淘汰档） -->
  <text x="58" y="151" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k=3</text>
  <rect x="68" y="134" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="134" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="134" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="152" font-size="15" fill="#333" filter="url(#rough2)">= 7</text>
  <text x="218" y="152" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 7 &lt; 10 不够</text>

  <!-- k=4 行（命中档，绿色高亮） -->
  <text x="58" y="189" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k=4</text>
  <rect x="68" y="172" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="98" y="172" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="128" y="172" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="158" y="172" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="82" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="202" y="190" font-size="15" fill="#333" filter="url(#rough2)">= 15</text>
  <text x="252" y="190" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 15 ≥ 10 命中</text>

  <!-- k=5 行 -->
  <text x="58" y="227" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k=5</text>
  <rect x="68" y="210" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="210" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="210" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="210" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="210" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="202" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="232" y="228" font-size="15" fill="#333" filter="url(#rough2)">= 31</text>

  <!-- n=10 气泡（橙色） -->
  <rect x="318" y="62" width="182" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="409" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n = 10 = 1010（二进制）</text>
  <text x="409" y="108" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">位数 b = 4 → 答案 = 15</text>
  <path d="M 316 120 Q 262 140 226 172" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论框（绿色） -->
  <rect x="40" y="256" width="440" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n 是 b 位数 ⇒ 2^(b−1) ≤ n ≤ 2^b − 1</text>
  <text x="260" y="316" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矮一档 2^(b−1) − 1 &lt; n 出局 ⇒ 答案 = 2^b − 1</text>
</svg>
