<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">移动规则与四大等价类（S = source）</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">一步 = 跳到同行或同列的任意格子（不能原地）</text>

  <!-- column labels -->
  <text x="90" y="74" text-anchor="middle" font-size="10" fill="#888">y=1</text>
  <text x="130" y="74" text-anchor="middle" font-size="10" fill="#888">y=2</text>
  <text x="170" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">y=3</text>
  <text x="210" y="74" text-anchor="middle" font-size="10" fill="#888">y=4</text>
  <!-- row labels -->
  <text x="54" y="104" text-anchor="end" font-size="10" fill="#888">x=1</text>
  <text x="54" y="144" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">x=2</text>
  <text x="54" y="184" text-anchor="end" font-size="10" fill="#888">x=3</text>
  <text x="54" y="224" text-anchor="end" font-size="10" fill="#888">x=4</text>

  <!-- orange cells: not reachable in one step -->
  <rect x="70" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="200" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="200" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="200" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- green cells: same row x=2 -->
  <rect x="70" y="120" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="120" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="120" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- blue cells: same column y=3 -->
  <rect x="150" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="200" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- source -->
  <rect x="150" y="120" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="145" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">S</text>

  <!-- arrows from S -->
  <path d="M 148 138 Q 120 130 98 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 168 118 Q 164 100 168 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="70" y="250" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="261" font-size="10" fill="#555">同行任跳</text>
  <rect x="150" y="250" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="261" font-size="10" fill="#555">同列任跳</text>
  <rect x="228" y="250" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="246" y="261" font-size="10" fill="#555">一步不可达</text>

  <!-- four class boxes -->
  <rect x="300" y="70" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">类 0：source 本身</text>
  <text x="400" y="106" text-anchor="middle" font-size="10" fill="#b85450">(xs, ys)，共 1 个格子</text>

  <rect x="300" y="124" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">类 1：同列不同行</text>
  <text x="400" y="160" text-anchor="middle" font-size="10" fill="#446688">(x≠xs, y=ys)，共 n−1 个格子</text>

  <rect x="300" y="178" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">类 2：同行不同列</text>
  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">(x=xs, y≠ys)，共 m−1 个格子</text>

  <rect x="300" y="232" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">类 3：不同行不同列</text>
  <text x="400" y="268" text-anchor="middle" font-size="10" fill="#d6a040">(x≠xs, y≠ys)，共 (n−1)(m−1) 个格子</text>

  <!-- symmetry note -->
  <rect x="40" y="292" width="460" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对称性：交换 source 行、列以外的任意两行 / 两列，移动关系不变</text>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#446688">→ 同一类别内所有格子地位对称，走 t 步到达的方案数完全相同</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#446688">→ n × m 个格子压缩成 4 个数 f[0..3]，状态数与网格大小无关！</text>
</svg>
