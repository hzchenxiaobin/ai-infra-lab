<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">双向展开 + 自连接：一次枚举「有共同朋友对」</text>

  <!-- Friends 表 -->
  <text x="74" y="42" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Friends（单向，8 行）</text>
  <rect x="22" y="48" width="104" height="172" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="64" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">user_id1</text>
  <text x="96" y="64" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">user_id2</text>
  <line x1="22" y1="70" x2="126" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="74" y1="48" x2="74" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="50" y="104" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="104" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="50" y="122" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="122" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="50" y="140" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="140" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="50" y="158" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="96" y="158" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="50" y="176" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="96" y="176" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="50" y="194" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="194" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="50" y="212" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="96" y="212" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>

  <!-- 箭头 1：UNION ALL -->
  <path d="M 130 130 L 168 130" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="149" y="112" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">UNION ALL</text>
  <text x="149" y="150" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">反转镜像</text>

  <!-- T 表 -->
  <text x="224" y="42" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T（双向，16 行）</text>
  <rect x="172" y="48" width="104" height="172" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="224" y="64" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(user_id1, user_id2)</text>
  <line x1="172" y1="70" x2="276" y2="70" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="224" y="86" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="224" y="104" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 1) ←新增</text>
  <text x="224" y="122" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <text x="224" y="140" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3, 2) ←新增</text>
  <text x="224" y="158" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2, 4)</text>
  <text x="224" y="176" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(4, 2) ←新增</text>
  <text x="224" y="194" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">⋮</text>
  <text x="224" y="212" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">…共 16 行</text>

  <!-- 箭头 2：自连接 -->
  <path d="M 280 130 L 320 130" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">T ⋈ T</text>
  <text x="300" y="150" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">user_id2 相等</text>

  <!-- 清单 -->
  <text x="412" y="42" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">「有共同朋友对」清单</text>
  <rect x="326" y="48" width="172" height="172" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="412" y="68" text-anchor="middle" font-size="9" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">配对 (a, b) ← 共同朋友 z</text>
  <text x="338" y="88" font-size="9.5" fill="#333" filter="url(#rough2)">(2,5) ← z=1</text>
  <text x="338" y="106" font-size="9.5" fill="#333" filter="url(#rough2)">(1,3)(1,4)(1,5) ← z=2</text>
  <text x="338" y="124" font-size="9.5" fill="#333" filter="url(#rough2)">(3,4)(3,5)(4,5) ← z=2</text>
  <text x="338" y="142" font-size="9.5" fill="#333" filter="url(#rough2)">(2,4) ← z=3</text>
  <text x="338" y="160" font-size="9.5" fill="#333" filter="url(#rough2)">(2,3) ← z=4</text>
  <text x="338" y="178" font-size="9.5" fill="#333" filter="url(#rough2)">(1,2) ← z=5</text>
  <text x="338" y="196" font-size="9" fill="#888" filter="url(#rough2)">（每对含正反两个方向）</text>
  <text x="338" y="212" font-size="9" fill="#888" filter="url(#rough2)">z=6,7,8,9 度为 1，无产出</text>

  <!-- 底部卡片 1：自连接示例 -->
  <rect x="22" y="252" width="240" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="142" y="272" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">自连接在做什么？以 z=2 为例</text>
  <text x="142" y="292" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">t1=(1, 2) 与 t2=(5, 2)：user_id2 同为 2</text>
  <text x="142" y="310" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">→ 产出配对 (1, 5)：共同朋友正是 2</text>
  <text x="142" y="332" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">逐个 z 配对，清单一次生成</text>

  <!-- 底部卡片 2：反连接 -->
  <rect x="274" y="252" width="224" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="386" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">反连接收尾</text>
  <text x="386" y="292" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">Friends 中 (a,b) 不在清单 → 保留</text>
  <text x="386" y="312" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✅ (6, 7)　✅ (8, 9)</text>
  <text x="386" y="332" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">最后 ORDER BY user_id1, user_id2</text>
</svg>
