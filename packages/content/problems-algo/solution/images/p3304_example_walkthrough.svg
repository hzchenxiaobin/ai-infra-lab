<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：k = 10 → 'c'（逆向下落 × popcount 双验证）</text>

  <!-- 左：逐层下落表 -->
  <rect x="28" y="40" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="55" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">串长</text>
  <rect x="76" y="40" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="55" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">位置</text>
  <rect x="116" y="40" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="55" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="200" y="40" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="55" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="28" y="62" width="272" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="96" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="158" y="78" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">10 &gt; 8 后半</text>
  <text x="250" y="78" text-anchor="middle" font-size="10.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">+1 → 位置 2</text>

  <rect x="28" y="86" width="272" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="96" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="158" y="102" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 ≤ 4 前半</text>
  <text x="250" y="102" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">原样下落</text>

  <rect x="28" y="110" width="272" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="126" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="96" y="126" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="158" y="126" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 ≤ 2 前半(压线)</text>
  <text x="250" y="126" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">原样下落</text>

  <rect x="28" y="134" width="272" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="158" y="150" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">2 &gt; 1 后半</text>
  <text x="250" y="150" text-anchor="middle" font-size="10.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">+1 → 位置 1</text>

  <rect x="28" y="158" width="272" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="158" y="174" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">基准</text>
  <text x="250" y="174" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">'a'</text>

  <rect x="28" y="190" width="272" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="164" y="207" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">累计位移 +2 ⇒ 'a' + 2 = 'c' ✓</text>

  <!-- 右：popcount 二进制对照 -->
  <text x="408" y="46" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k − 1 = 9 = 1001₂</text>
  <rect x="326" y="54" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="74" text-anchor="middle" font-size="13" fill="#2f5424" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="366" y="54" width="38" height="30" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="74" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="406" y="54" width="38" height="30" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="425" y="74" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="446" y="54" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="74" text-anchor="middle" font-size="13" fill="#2f5424" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="345" y="98" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2³</text>
  <text x="385" y="98" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2²</text>
  <text x="425" y="98" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2¹</text>
  <text x="465" y="98" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2⁰</text>

  <path d="M 345 102 L 345 114" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="345" y="130" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">第 4 层落后半 ⇒ +1</text>
  <path d="M 465 102 L 465 114" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="465" y="130" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">第 1 层落后半 ⇒ +1</text>
  <text x="408" y="152" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">中间两个 0 ⇒ 原样下落，不加一</text>
  <text x="408" y="176" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">popcount(9) = 2</text>
  <rect x="330" y="190" width="156" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="408" y="207" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">'a' + 2 = 'c' ✓</text>

  <!-- 底部：最终串条带 -->
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">执行 4 次操作后的整串（长 16）：第 10 位即答案</text>
  <rect x="60" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="85" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="110" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="135" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="160" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="185" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="197.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="210" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="235" y="254" width="25" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="247.5" y="270" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="260" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="285" y="254" width="25" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="297.5" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="310" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="335" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="347.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="360" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="372.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="385" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="397.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="410" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="422.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="435" y="254" width="25" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="447.5" y="270" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">e</text>
  <line x1="260" y1="250" x2="260" y2="282" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <path d="M 297 282 L 297 292" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="297" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ k = 10 → 'c'</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">下落两次 +1 = popcount(9) = 2，两条路线殊途同归 ✓</text>
</svg>
