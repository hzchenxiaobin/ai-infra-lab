<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：轮调 k 与计分规则（以 nums = [2,3,1,4,0], k = 3 为例）</text>

  <!-- Original array -->
  <text x="40" y="68" font-size="11" fill="#888">原数组</text>
  <rect x="130" y="50" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="50" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="50" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="292" y="50" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="346" y="50" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>

  <text x="155" y="105" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="209" y="105" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="263" y="105" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="317" y="105" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <text x="371" y="105" text-anchor="middle" font-size="10" fill="#888">i=4</text>

  <!-- Split indicator at k=3 -->
  <path d="M 316 44 L 316 36 L 360 36 L 360 44" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="338" y="32" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=3</text>

  <!-- Down arrow -->
  <path d="M 280 112 L 280 138" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="296" y="130" font-size="10" fill="#446688">右段移前</text>

  <!-- Rotated array -->
  <text x="40" y="168" font-size="11" fill="#888">轮调后</text>
  <!-- idx 0: value 4, 4 > 0 → no score (red) -->
  <rect x="130" y="150" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <!-- idx 1: value 0, 0 ≤ 1 → score (green) -->
  <rect x="184" y="150" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <!-- idx 2: value 2, 2 ≤ 2 → score -->
  <rect x="238" y="150" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- idx 3: value 3, 3 ≤ 3 → score -->
  <rect x="292" y="150" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <!-- idx 4: value 1, 1 ≤ 4 → score -->
  <rect x="346" y="150" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <text x="155" y="205" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="209" y="205" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="263" y="205" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="317" y="205" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  <text x="371" y="205" text-anchor="middle" font-size="10" fill="#888">j=4</text>

  <!-- Score badges -->
  <text x="155" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4&gt;0 ✗</text>
  <text x="209" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0≤1 ✓</text>
  <text x="263" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2≤2 ✓</text>
  <text x="317" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3≤3 ✓</text>
  <text x="371" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1≤4 ✓</text>

  <!-- Formula box -->
  <rect x="30" y="240" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="262" font-size="12" fill="#446688" font-weight="bold">轮调规则</text>
  <text x="50" y="280" font-size="11" fill="#444">轮调 k：将 nums[k..n-1] 移到前面，nums[0..k-1] 移到后面</text>
  <text x="50" y="296" font-size="11" fill="#444">元素 nums[i] 的新位置 j = (i − k + n) mod n；当 nums[i] ≤ j 时记 1 分</text>

  <!-- Score result -->
  <rect x="30" y="320" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">k = 3 时得分 = 4（最高）</text>
  <text x="50" y="356" font-size="10" fill="#666">绿格 = 计分（nums[i] ≤ j）；红格 = 不计分（nums[i] &gt; j）</text>
</svg>
