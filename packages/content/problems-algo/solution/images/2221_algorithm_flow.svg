<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：原地模拟（外层 n−1 轮，内层从左到右覆写）</text>

  <!-- ===== Start ===== -->
  <rect x="210" y="36" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="270" y="55" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始：输入 nums</text>
  <path d="M 270 64 L 270 78" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init i=0 ===== -->
  <rect x="215" y="78" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i = 0</text>
  <path d="M 270 104 L 270 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: i < n-1 ? ===== -->
  <polygon points="270,118 348,144 270,170 192,144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n−1 ?</text>
  <text x="270" y="156" text-anchor="middle" font-size="9" fill="#666">还需归约？</text>

  <!-- No -> return nums[0] -->
  <path d="M 348 144 L 410 144" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="376" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="128" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="470" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 nums[0]</text>

  <!-- Yes -> j=0 -->
  <path d="M 270 170 L 270 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="180" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== j = 0 ===== -->
  <rect x="215" y="184" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j = 0</text>
  <path d="M 270 210 L 270 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 2: j < n-1-i ? ===== -->
  <polygon points="270,224 360,252 270,280 180,252" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j &lt; n−1−i ?</text>
  <text x="270" y="264" text-anchor="middle" font-size="9" fill="#666">本轮还有位？</text>

  <!-- No -> i++ (left) then loop back to Diamond1 -->
  <path d="M 180 252 L 120 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="50" y="238" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i++</text>
  <!-- loop back up to Diamond1 left point (192,144) -->
  <path d="M 85 238 L 85 144 L 192 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="190" font-size="9" fill="#888">回外层</text>

  <!-- Yes -> process -->
  <path d="M 270 280 L 270 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="290" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Process: nums[j] = (nums[j]+nums[j+1])%10 ===== -->
  <rect x="120" y="294" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="313" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[j] = (nums[j] + nums[j+1]) % 10</text>
  <path d="M 270 324 L 270 338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== j++ ===== -->
  <rect x="215" y="338" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j++</text>
  <!-- loop back to Diamond2 right point (360,252) -->
  <path d="M 325 351 L 420 351 L 420 252 L 360 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="300" font-size="9" fill="#888">回内层</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="372" width="480" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="9.5" fill="#555">外层 i 控制轮数（n−1 轮）；内层 j 上界 n−1−i 随轮数递减；从左到右覆写安全</text>
</svg>
