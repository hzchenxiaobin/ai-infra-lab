<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：n 轮「查询 − 比较 − 插入」</text>

  <!-- step 1 -->
  <rect x="165" y="34" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">离散化：排序去重 → rank 映射</text>

  <path d="M 260 66 L 260 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="82" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前两个元素分入 arr1 / arr2</text>
  <text x="260" y="117" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">两棵 BIT 同步插入</text>

  <path d="M 260 126 L 260 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: loop head -->
  <rect x="160" y="142" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取下一个 x，r = rank(x)</text>

  <path d="M 260 174 L 260 188" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4: dual query -->
  <rect x="135" y="192" width="250" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c1 = |arr1| − query(tree1, r)</text>
  <text x="260" y="229" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c2 = |arr2| − query(tree2, r)</text>

  <path d="M 260 240 L 260 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <path d="M 260 254 L 348 290 L 260 326 L 172 290 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c1 &gt; c2 ?</text>

  <path d="M 348 290 L 382 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="365" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="386" y="272" width="116" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x 入 arr1</text>
  <text x="444" y="304" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">update(tree1, r)</text>

  <path d="M 260 326 L 260 340" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision 2 -->
  <path d="M 260 340 L 348 376 L 260 412 L 172 376 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c1 &lt; c2 ?</text>

  <path d="M 348 376 L 382 376" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="365" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="386" y="358" width="116" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="374" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x 入 arr2</text>
  <text x="444" y="390" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">update(tree2, r)</text>

  <path d="M 260 412 L 260 424" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="422" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- tie-break insert -->
  <rect x="150" y="428" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">入较短数组（仍等 → arr1）</text>
  <text x="260" y="461" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">并 update 对应 BIT</text>

  <!-- loop back: stubs -->
  <path d="M 502 291 L 512 291" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 502 377 L 512 377" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <!-- loop back: main collector -->
  <path d="M 370 448 L 512 448 L 512 158 L 366 158" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="443" y="150" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">还有元素 → 继续</text>

  <!-- return note -->
  <rect x="380" y="34" width="128" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="444" y="51" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部处理完后</text>
  <text x="444" y="69" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return arr1 + arr2</text>

  <!-- side note -->
  <rect x="24" y="198" width="106" height="120" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="77" y="220" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">查询化归：</text>
  <text x="77" y="238" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">greaterCount</text>
  <text x="77" y="254" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">= |arr| − query(r)</text>
  <text x="77" y="270" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（≤ x 的个数）</text>
  <text x="77" y="290" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">平局：短者优先</text>
  <text x="77" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">仍等 → arr1</text>
</svg>
