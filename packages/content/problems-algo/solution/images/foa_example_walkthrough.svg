<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ages = [20,30,100,110,120]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">cnt: {20:1, 30:1, 100:1, 110:1, 120:1}，最终 ans = 3</text>

  <!-- Table frame -->
  <!-- header row -->
  <rect x="40" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="84" y="58" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="111" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt[x]</text>
  <rect x="138" y="58" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lower=x/2+8</text>
  <rect x="214" y="58" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="289" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法 y 区间（命中）</text>
  <rect x="364" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="394" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="424" y="58" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="467" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">贡献</text>

  <!-- row 1: x=20 -->
  <g font-size="11" fill="#333">
    <rect x="40" y="92" width="44" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="62" y="114" text-anchor="middle">20</text>
    <rect x="84" y="92" width="54" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="111" y="114" text-anchor="middle">1</text>
    <rect x="138" y="92" width="76" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="176" y="114" text-anchor="middle">18</text>
    <rect x="214" y="92" width="150" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="289" y="108" text-anchor="middle" font-size="10">[18, 20]</text>
    <text x="289" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">{20}（仅自己）</text>
    <rect x="364" y="92" width="60" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="394" y="114" text-anchor="middle">1</text>
    <rect x="424" y="92" width="86" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="467" y="114" text-anchor="middle" fill="#888">1×0 = 0</text>
  </g>

  <!-- row 2: x=30 -->
  <g font-size="11" fill="#333">
    <rect x="40" y="130" width="44" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="62" y="152" text-anchor="middle">30</text>
    <rect x="84" y="130" width="54" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="111" y="152" text-anchor="middle">1</text>
    <rect x="138" y="130" width="76" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="176" y="152" text-anchor="middle">23</text>
    <rect x="214" y="130" width="150" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="289" y="146" text-anchor="middle" font-size="10">[23, 30]</text>
    <text x="289" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">{30}（仅自己）</text>
    <rect x="364" y="130" width="60" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="394" y="152" text-anchor="middle">1</text>
    <rect x="424" y="130" width="86" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="467" y="152" text-anchor="middle" fill="#888">1×0 = 0</text>
  </g>

  <!-- row 3: x=100 -->
  <g font-size="11" fill="#333">
    <rect x="40" y="168" width="44" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="62" y="190" text-anchor="middle">100</text>
    <rect x="84" y="168" width="54" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="111" y="190" text-anchor="middle">1</text>
    <rect x="138" y="168" width="76" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="176" y="190" text-anchor="middle">58</text>
    <rect x="214" y="168" width="150" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="289" y="184" text-anchor="middle" font-size="10">[58, 100]</text>
    <text x="289" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">{100}（仅自己）</text>
    <rect x="364" y="168" width="60" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="394" y="190" text-anchor="middle">1</text>
    <rect x="424" y="168" width="86" height="34" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="467" y="190" text-anchor="middle" fill="#888">1×0 = 0</text>
  </g>

  <!-- row 4: x=110 -->
  <g font-size="11" fill="#333">
    <rect x="40" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="62" y="228" text-anchor="middle">110</text>
    <rect x="84" y="206" width="54" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="111" y="228" text-anchor="middle">1</text>
    <rect x="138" y="206" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="176" y="228" text-anchor="middle">63</text>
    <rect x="214" y="206" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="289" y="222" text-anchor="middle" font-size="10">[63, 110]</text>
    <text x="289" y="236" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">{100, 110}</text>
    <rect x="364" y="206" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="394" y="228" text-anchor="middle" font-weight="bold">2</text>
    <rect x="424" y="206" width="86" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="467" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">1×1 = 1</text>
  </g>

  <!-- row 5: x=120 -->
  <g font-size="11" fill="#333">
    <rect x="40" y="244" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="62" y="266" text-anchor="middle">120</text>
    <rect x="84" y="244" width="54" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="111" y="266" text-anchor="middle">1</text>
    <rect x="138" y="244" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="176" y="266" text-anchor="middle">68</text>
    <rect x="214" y="244" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="289" y="260" text-anchor="middle" font-size="10">[68, 120]</text>
    <text x="289" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">{100,110,120}</text>
    <rect x="364" y="244" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="394" y="266" text-anchor="middle" font-weight="bold">3</text>
    <rect x="424" y="244" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="467" y="266" text-anchor="middle" fill="#b85450" font-weight="bold">1×2 = 2</text>
  </g>

  <!-- 合计 row -->
  <rect x="40" y="290" width="324" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="311" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">合计（ans）</text>
  <rect x="364" y="290" width="146" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="437" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- footnote -->
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#888">关键：count 含 x 自己，故每名同龄人能发 (count−1) 个请求</text>
</svg>
