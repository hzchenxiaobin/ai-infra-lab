<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">在相邻节点间插入 GCD 节点：A → B 变成 A → g(=gcd) → B</text>

  <!-- Before row label -->
  <text x="34" y="88" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">插入前</text>

  <!-- curr node -->
  <rect x="76" y="66" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="88" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">curr</text>

  <path d="M 136 83 L 194 83" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A node -->
  <rect x="198" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">val=a</text>

  <path d="M 258 83 L 316 83" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B node -->
  <rect x="320" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">val=b</text>

  <!-- down arrow -->
  <path d="M 350 104 L 350 138" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="362" y="126" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">新建 g = gcd(a,b)</text>
  <text x="362" y="140" font-size="11" fill="#b85450" filter="url(#rough2)">插入到 A、B 之间</text>

  <!-- After row label -->
  <text x="34" y="188" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">插入后</text>

  <!-- curr node after -->
  <rect x="76" y="166" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="188" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">curr</text>

  <path d="M 136 183 L 194 183" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A node after -->
  <rect x="198" y="166" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">val=a</text>

  <!-- arrow A -> g (red) -->
  <path d="M 258 183 L 316 183" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- g node (highlighted) -->
  <rect x="320" y="166" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">g=gcd</text>

  <!-- arrow g -> B -->
  <path d="M 380 183 L 438 183" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- B node after -->
  <rect x="442" y="166" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="472" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">val=b</text>

  <!-- pointer ops box -->
  <rect x="34" y="232" width="512" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="254" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两步指针操作（g 是新节点无旧后继，顺序无关）：</text>
  <text x="50" y="276" font-size="12" fill="#555" filter="url(#rough2)">① node = ListNode(g);   node.next = curr.next;   // g 先接管 B</text>
  <text x="50" y="296" font-size="12" fill="#555" filter="url(#rough2)">② curr.next = node;                               // A 转向 g，完成插入</text>
  <text x="50" y="314" font-size="11" fill="#999" filter="url(#rough2)">随后 curr = curr.next.next，跳过新插入的 g 落到 B，继续下一对 (B, B.next)</text>
</svg>
