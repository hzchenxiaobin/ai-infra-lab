<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">1666 算法流程：自底向上翻转路径</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#333">cur = leaf;  p = cur.parent</text>

  <path d="M 280 74 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="280,92 410,134 280,176 150,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333">cur ≠ root ?</text>
  <text x="280" y="146" text-anchor="middle" font-size="9" fill="#888">(还没翻到原根)</text>

  <!-- No: exit loop -->
  <path d="M 410 134 L 470 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="126" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- Yes: enter body -->
  <path d="M 280 176 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="186" font-size="10" fill="#82b366">是</text>

  <!-- gp = p.parent -->
  <rect x="160" y="194" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#333">gp = p.parent   （先记下一站）</text>

  <path d="M 280 226 L 280 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step1 decision -->
  <polygon points="280,244 400,278 280,312 160,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#333">cur.left 存在?</text>

  <!-- yes: move left to right -->
  <path d="M 400 278 L 470 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="270" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="470" y="262" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="511" y="284" text-anchor="middle" font-size="10" fill="#333">cur.right</text>
  <text x="511" y="296" text-anchor="middle" font-size="9" fill="#333">= cur.left</text>

  <!-- no / merge -->
  <path d="M 280 312 L 280 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="322" font-size="10" fill="#b85450">否</text>
  <path d="M 511 296 L 511 336 L 350 336" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step2: cur.left = p -->
  <rect x="100" y="330" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur.left = p ;  p.parent = cur</text>

  <path d="M 280 364 L 280 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- detach -->
  <rect x="80" y="382" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#333">断开 p 指向 cur 的旧边：</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#333">p.left==cur ? p.left=null : p.right=null</text>

  <path d="M 280 426 L 280 440" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- move up -->
  <rect x="140" y="444" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur = p ;  p = gp   （上移一层）</text>

  <!-- loop back -->
  <path d="M 140 460 L 60 460 L 60 134 L 150 134" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="300" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 40 300)">回到循环判断</text>

  <!-- after loop: leaf.parent = null -->
  <rect x="470" y="120" width="84" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="512" y="136" text-anchor="middle" font-size="9" fill="#333">leaf.parent</text>
  <text x="512" y="148" text-anchor="middle" font-size="9" fill="#333">= null</text>
  <path d="M 470 134 L 470 134" stroke="#666" stroke-width="1.3" fill="none"/>

  <!-- final return -->
  <path d="M 512 160 L 512 500 L 380 500" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="486" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="506" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return leaf   （新根）</text>
  <path d="M 280 476 L 280 486" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="150" y="524" width="260" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="540" text-anchor="middle" font-size="9" fill="#888">每轮把 cur 上提一格，直到 cur == 原 root</text>
</svg>
