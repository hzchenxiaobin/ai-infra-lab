<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单游标一次扫描，O(n) 时间 / O(1) 空间</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="214" y="38" width="132" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="59" text-anchor="middle" font-size="13" fill="#8a6d1a">输入 n</text>
  </g>
  <path d="M 280 70 L 280 92" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="186" y="96" width="188" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="117" text-anchor="middle" font-size="13" fill="#33506b">cur = 1, k = 1, ans = 0</text>
  </g>
  <path d="M 280 128 L 280 150" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终止判断 -->
  <g filter="url(#rough2)">
    <polygon points="280,150 375,185 280,220 185,185" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="190" text-anchor="middle" font-size="13" fill="#33506b">cur &gt; n ?</text>
  </g>
  <path d="M 375 185 L 424 185" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="428" y="169" width="112" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="484" y="190" text-anchor="middle" font-size="13" fill="#2f5d24">返回 ans ✓</text>
  </g>
  <path d="M 280 220 L 280 242" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="236" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 定块长 -->
  <g filter="url(#rough2)">
    <rect x="186" y="246" width="188" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="267" text-anchor="middle" font-size="12.5" fill="#33506b">size = min(k, n − cur + 1)</text>
  </g>
  <path d="M 280 278 L 280 300" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 连乘 -->
  <g filter="url(#rough2)">
    <rect x="172" y="304" width="216" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="324" text-anchor="middle" font-size="12" fill="#8a6d1a">prod ← cur × … × (cur+size−1)</text>
    <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#7a6a3a">每步 mod 10^9+7，防溢出</text>
  </g>
  <path d="M 280 350 L 280 372" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 累加 -->
  <g filter="url(#rough2)">
    <rect x="200" y="376" width="160" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="397" text-anchor="middle" font-size="13" fill="#33506b">ans ← ans + prod</text>
  </g>
  <path d="M 280 408 L 280 420" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 推进游标 -->
  <g filter="url(#rough2)">
    <rect x="186" y="424" width="188" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="445" text-anchor="middle" font-size="13" fill="#33506b">cur += size；k += 1</text>
  </g>

  <!-- 回到终止判断 -->
  <path d="M 186 440 L 110 440 L 110 185 L 181 185" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="310" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">下一块</text>

  <text x="280" y="484" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">尾块自动处理：最后一轮 size &lt; k，此后 cur &gt; n 退出循环</text>
</svg>
