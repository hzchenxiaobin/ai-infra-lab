<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">容斥：ans = 26ⁿ − |A ∪ B ∪ C|</text>

  <!-- left: bad events -->
  <rect x="25" y="44" width="190" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">三个「坏事件」</text>
  <text x="120" y="86" text-anchor="middle" font-size="11" fill="#333">A：没有 l</text>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#333">B：没有 t</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#333">C：e 不足 2 个（0 或 1 个）</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans = 26ⁿ − |A∪B∪C|</text>

  <!-- left: E(b) definition -->
  <rect x="25" y="160" width="190" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">E(b) = bⁿ + n·bⁿ⁻¹</text>
  <text x="120" y="202" text-anchor="middle" font-size="9" fill="#888">（b 个可选字母、e 至多 1 个）</text>
  <text x="120" y="224" text-anchor="middle" font-size="10" fill="#333">0 个 e：每位 b 选 1 → bⁿ</text>
  <text x="120" y="242" text-anchor="middle" font-size="10" fill="#333">恰 1 个 e：选位 n × bⁿ⁻¹</text>
  <text x="120" y="262" text-anchor="middle" font-size="9" fill="#555">例：|C| = E(25)，|A∩C| = E(24)</text>

  <!-- left: intersections -->
  <rect x="25" y="284" width="190" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="middle" font-size="10" fill="#555">交集：|A∩B| = 24ⁿ，|A∩B∩C| = E(23)</text>

  <!-- venn diagram -->
  <circle cx="315" cy="148" r="60" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="398" cy="148" r="60" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="356" cy="222" r="60" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="272" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A（无 l）</text>
  <text x="444" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B（无 t）</text>
  <text x="356" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C（e &lt; 2）</text>

  <text x="285" y="126" text-anchor="middle" font-size="9" fill="#555">25ⁿ</text>
  <text x="428" y="126" text-anchor="middle" font-size="9" fill="#555">25ⁿ</text>
  <text x="356" y="258" text-anchor="middle" font-size="9" fill="#555">E(25)</text>
  <text x="356" y="132" text-anchor="middle" font-size="9" fill="#555">24ⁿ</text>
  <text x="313" y="196" text-anchor="middle" font-size="9" fill="#555">E(24)</text>
  <text x="400" y="196" text-anchor="middle" font-size="9" fill="#555">E(24)</text>
  <text x="356" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">E(23)</text>

  <!-- bottom formula -->
  <rect x="25" y="322" width="470" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#333">|A∪B∪C| = 2·25ⁿ + E(25) − 24ⁿ − 2·E(24) + E(23)</text>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 26ⁿ − 2·25ⁿ − E(25) + 24ⁿ + 2·E(24) − E(23)</text>
</svg>
