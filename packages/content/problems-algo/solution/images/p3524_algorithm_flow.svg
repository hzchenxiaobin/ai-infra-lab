<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="368" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一趟扫描 + k 个余数桶：数完所有子数组只要 O(n·k)</text>

  <!-- 主流程 -->
  <rect x="300" y="38" width="84" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="55" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 342 64 L 342 76" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="78" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="97" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">cnt[0..k−1] ← 0，result[0..k−1] ← 0</text>
  <path d="M 342 108 L 342 120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="122" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="141" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">遍历 x ∈ nums（右端点 i 从左到右）</text>
  <path d="M 342 152 L 342 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="166" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">v ← x mod k</text>
  <path d="M 342 196 L 342 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="210" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="229" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">new[r·v mod k] += cnt[r]，r = 0..k−1</text>
  <path d="M 342 240 L 342 252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="254" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="273" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">new[v] += 1；cnt ← new；result += cnt</text>

  <path d="M 456 269 C 484 269, 484 137, 456 137" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="208" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(90 490 208)" filter="url(#rough2)">下一元素</text>

  <path d="M 342 284 L 342 296" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="282" y="298" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="342" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 result</text>

  <!-- 暴力版对照卡 -->
  <rect x="28" y="126" width="176" height="104" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="116" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">暴力版 O(n²)</text>
  <text x="116" y="168" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">枚举 (l, r) 双重循环</text>
  <text x="116" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">边乘边 mod k 防溢出</text>
  <text x="116" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 10⁵ ⇒ 5×10⁹ 超时</text>
  <text x="116" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">左端点坍缩进 k 个桶</text>

  <path d="M 204 178 L 228 181" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="216" y="170" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">坍缩</text>

  <!-- 注意事项 -->
  <text x="260" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">计数上界 n(n+1)/2 ≈ 5×10⁹ 超过 int32 ⇒ C++ 用 long long</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">验证：[1,2,3,4,5], k=3 → [9,2,4]；[1,2,4,8,16,32], k=4 → [18,1,2,0]</text>
</svg>
