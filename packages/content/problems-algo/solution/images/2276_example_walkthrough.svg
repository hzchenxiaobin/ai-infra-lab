<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：add 合并重叠/相邻段，cnt 增量维护</text>

  <!-- axis: cells 1..11, start x=130, cell w=24 -->
  <line x1="130" y1="48" x2="394" y2="48" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="130" y1="44" x2="130" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="154" y1="45" x2="154" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="178" y1="45" x2="178" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="202" y1="45" x2="202" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="226" y1="45" x2="226" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="45" x2="250" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="274" y1="45" x2="274" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="298" y1="45" x2="298" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="322" y1="45" x2="322" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="346" y1="45" x2="346" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="45" x2="370" y2="51" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="394" y1="44" x2="394" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="142" y="64" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="166" y="64" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="190" y="64" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="214" y="64" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="238" y="64" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="262" y="64" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="286" y="64" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="310" y="64" text-anchor="middle" font-size="9.5" fill="#888">8</text>
  <text x="334" y="64" text-anchor="middle" font-size="9.5" fill="#888">9</text>
  <text x="358" y="64" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="382" y="64" text-anchor="middle" font-size="9.5" fill="#888">11</text>

  <!-- ① add(2,3) -->
  <text x="18" y="96" font-size="10.5" fill="#333" font-weight="bold">① add(2,3)</text>
  <rect x="154" y="84" width="48" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="410" y="96" font-size="10.5" fill="#446688" font-weight="bold">cnt = 2</text>

  <!-- ② add(7,10) -->
  <text x="18" y="144" font-size="10.5" fill="#333" font-weight="bold">② add(7,10)</text>
  <rect x="154" y="132" width="48" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="274" y="132" width="96" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="410" y="144" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt = 6</text>
  <text x="410" y="158" font-size="9.5" fill="#b85450" font-weight="bold">count()→6</text>

  <!-- ③ add(5,8): dashed new bar overlaps [7,10] -->
  <text x="18" y="200" font-size="10.5" fill="#333" font-weight="bold">③ add(5,8)</text>
  <rect x="154" y="188" width="48" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <rect x="274" y="188" width="96" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <rect x="226" y="176" width="96" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">新 [5,8]</text>
  <!-- overlap marker between [5,8] right (322) and [7,10] left (274) -->
  <path d="M 298 162 L 298 174" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="170" font-size="9" fill="#b85450">重叠</text>

  <!-- ④ merged result -->
  <text x="18" y="252" font-size="10.5" fill="#333" font-weight="bold">④ 合并后</text>
  <rect x="154" y="240" width="48" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="226" y="240" width="144" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="251" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">[5,10] 吸收 [7,10]</text>
  <text x="410" y="252" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt = 8</text>
  <text x="410" y="266" font-size="9.5" fill="#b85450" font-weight="bold">count()→8</text>

  <!-- summary box -->
  <rect x="36" y="290" width="488" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="312" font-size="12" fill="#d6a040" font-weight="bold">cnt 增量维护</text>
  <text x="56" y="332" font-size="10.5" fill="#555">• ③时 [5,8] 与旧 [7,10] 重叠 → 先 cnt −= 4（删旧段 [7,10]），再 cnt += 6（插新段 [5,10]）</text>
  <text x="56" y="350" font-size="10.5" fill="#555">• ④结果 {[2,3], [5,10]}：cnt = 2 + 6 = 8，与 count() 期望一致</text>
  <text x="56" y="368" font-size="10.5" fill="#b85450" font-weight="bold">• 若 [5,8] 与旧段「相邻」（如旧为 [9,11]），right+1==l 同样触发合并，闭区间无缝</text>
</svg>
