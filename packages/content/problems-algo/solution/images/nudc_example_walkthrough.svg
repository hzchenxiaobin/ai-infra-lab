<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：6 个用户 → 筛 login → 求首次登录日 → 过滤日期 → 按日计数</text>

  <!-- ===== Step 0: Traffic table (input) ===== -->
  <text x="300" y="46" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Traffic 表（输入，节选）</text>
  <rect x="180" y="52" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="66" font-size="8.5" fill="#446688" font-weight="bold">user_id</text>
  <text x="280" y="66" font-size="8.5" fill="#446688" font-weight="bold">activity</text>
  <text x="370" y="66" font-size="8.5" fill="#446688" font-weight="bold">activity_date</text>
  <line x1="245" y1="52" x2="245" y2="72" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="52" x2="330" y2="72" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- data rows -->
  <rect x="180" y="72" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="83" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="280" y="83" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="83" text-anchor="middle" font-size="8" fill="#333">2019-05-01</text>
  <line x1="245" y1="72" x2="245" y2="86" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="72" x2="330" y2="86" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="86" width="240" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="210" y="97" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="280" y="97" text-anchor="middle" font-size="8" fill="#aaa">logout</text>
  <text x="370" y="97" text-anchor="middle" font-size="8" fill="#aaa">2019-05-02</text>

  <rect x="180" y="100" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="111" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="280" y="111" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="111" text-anchor="middle" font-size="8" fill="#333">2019-06-30</text>
  <line x1="245" y1="100" x2="245" y2="114" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="100" x2="330" y2="114" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="114" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="125" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="280" y="125" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="125" text-anchor="middle" font-size="8" fill="#333">2019-07-02</text>
  <line x1="245" y1="114" x2="245" y2="128" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="114" x2="330" y2="128" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="128" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="139" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="280" y="139" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="139" text-anchor="middle" font-size="8" fill="#333">2019-07-02</text>
  <line x1="245" y1="128" x2="245" y2="142" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="128" x2="330" y2="142" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="142" width="240" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="210" y="153" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <text x="280" y="153" text-anchor="middle" font-size="8" fill="#aaa">logout</text>
  <text x="370" y="153" text-anchor="middle" font-size="8" fill="#aaa">2019-07-02</text>

  <rect x="180" y="156" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="167" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="280" y="167" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="167" text-anchor="middle" font-size="8" fill="#333">2019-07-04</text>
  <line x1="245" y1="156" x2="245" y2="170" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="156" x2="330" y2="170" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="170" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="181" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="280" y="181" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="181" text-anchor="middle" font-size="8" fill="#333">2019-07-05</text>
  <line x1="245" y1="170" x2="245" y2="184" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="170" x2="330" y2="184" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="180" y="184" width="240" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="210" y="195" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="280" y="195" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="370" y="195" text-anchor="middle" font-size="8" fill="#333">2019-07-28</text>
  <line x1="245" y1="184" x2="245" y2="198" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="184" x2="330" y2="198" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="300" y="212" text-anchor="middle" font-size="8" fill="#888">绿色行 = login 记录（保留） · 灰色行 = 非 login（丢弃）</text>

  <!-- Arrow down -->
  <path d="M300 216 L300 230" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="226" font-size="8" fill="#4a7a3a">① WHERE activity='login'</text>

  <!-- ===== Step 1: Filtered login rows ===== -->
  <text x="300" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">① 筛出 login 记录（5 行）</text>
  <rect x="180" y="252" width="240" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="264" font-size="8" fill="#4a7a3a" font-weight="bold">user_id</text>
  <text x="280" y="264" font-size="8" fill="#4a7a3a" font-weight="bold">activity</text>
  <text x="370" y="264" font-size="8" fill="#4a7a3a" font-weight="bold">date</text>

  <!-- login rows -->
  <rect x="180" y="270" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="280" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="370" y="280" text-anchor="middle" font-size="8" fill="#333">05-01</text>

  <rect x="180" y="283" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="293" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="370" y="293" text-anchor="middle" font-size="8" fill="#333">06-30</text>

  <rect x="180" y="296" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="306" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="370" y="306" text-anchor="middle" font-size="8" fill="#333">07-02</text>

  <rect x="180" y="309" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="319" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="370" y="319" text-anchor="middle" font-size="8" fill="#333">07-02</text>

  <rect x="180" y="322" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="370" y="332" text-anchor="middle" font-size="8" fill="#333">07-04</text>

  <rect x="180" y="335" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="345" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="370" y="345" text-anchor="middle" font-size="8" fill="#333">07-05</text>

  <rect x="180" y="348" width="240" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="210" y="358" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="370" y="358" text-anchor="middle" font-size="8" fill="#333">07-28</text>

  <!-- Arrow down -->
  <path d="M300 362 L300 376" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="340" y="372" font-size="8" fill="#d6a040">② GROUP BY user_id, MIN(date)</text>

  <!-- ===== Step 2: install_date per user ===== -->
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② 每人首次登录日（user_id → install_date）</text>

  <!-- Two columns: before filter | after filter -->
  <!-- Before filter (all users) -->
  <rect x="80" y="398" width="220" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="410" font-size="8" fill="#d6a040" font-weight="bold">user_id</text>
  <text x="200" y="410" font-size="8" fill="#d6a040" font-weight="bold">install_date</text>
  <line x1="155" y1="398" x2="155" y2="416" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="80" y="416" width="220" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="110" y="426" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="200" y="426" text-anchor="middle" font-size="8" fill="#888" text-decoration="line-through">05-01</text>
  <text x="288" y="426" font-size="7" fill="#b85450">✗</text>

  <rect x="80" y="429" width="220" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="439" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="200" y="439" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">06-30</text>
  <text x="288" y="439" font-size="7" fill="#4a7a3a">✓</text>

  <rect x="80" y="442" width="220" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="452" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="200" y="452" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">07-02</text>
  <text x="288" y="452" font-size="7" fill="#4a7a3a">✓</text>

  <rect x="80" y="455" width="220" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="465" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="200" y="465" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">07-02</text>
  <text x="288" y="465" font-size="7" fill="#4a7a3a">✓</text>

  <rect x="80" y="468" width="220" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="478" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="200" y="478" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">07-04</text>
  <text x="288" y="478" font-size="7" fill="#4a7a3a">✓</text>

  <rect x="80" y="481" width="220" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="110" y="491" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="200" y="491" text-anchor="middle" font-size="8" fill="#888" text-decoration="line-through">07-28</text>
  <text x="288" y="491" font-size="7" fill="#b85450">✗</text>

  <text x="190" y="506" text-anchor="middle" font-size="7.5" fill="#b85450">✗ = 在 [06-30, 07-27] 之外</text>

  <!-- arrow to right side -->
  <path d="M300 440 L350 440" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="325" y="434" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">③④</text>

  <!-- ===== Step 3+4: final result ===== -->
  <text x="470" y="392" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③④ 过滤 + 按日计数</text>
  <rect x="380" y="398" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="410" font-size="8.5" fill="#b85450" font-weight="bold">install_date</text>
  <text x="510" y="410" font-size="8.5" fill="#b85450" font-weight="bold">installs</text>

  <rect x="380" y="416" width="180" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="430" y="427" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">06-30</text>
  <text x="510" y="427" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <rect x="380" y="432" width="180" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="430" y="443" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">07-02</text>
  <text x="510" y="443" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <rect x="380" y="448" width="180" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="430" y="459" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">07-04</text>
  <text x="510" y="459" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <!-- annotations on the right -->
  <text x="430" y="478" text-anchor="middle" font-size="8" fill="#888">user 2 → 06-30 (1 人)</text>
  <text x="430" y="491" text-anchor="middle" font-size="8" fill="#888">user 3+4 → 07-02 (2 人)</text>
  <text x="430" y="504" text-anchor="middle" font-size="8" fill="#888">user 5 → 07-04 (1 人)</text>
  <text x="430" y="518" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">user 5 有两条 login，MIN 取 07-04</text>

  <!-- bottom note -->
  <rect x="20" y="520" width="560" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="532" text-anchor="middle" font-size="8.5" fill="#446688">user 1 (05-01) 和 user 6 (07-28) 落在区间外被过滤；user 5 多条 login 取最早一条 07-04</text>
</svg>
