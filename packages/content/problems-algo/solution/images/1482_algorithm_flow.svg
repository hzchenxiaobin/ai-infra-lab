<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分天数 + 贪心验证</text>

  <!-- Step 0: impossible check -->
  <rect x="150" y="40" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⓪ 特判：m × k &gt; n → 返回 −1</text>
  <text x="280" y="73" text-anchor="middle" font-size="10.5" fill="#888">花总数不够，永远不可能扎够 m 束</text>

  <!-- arrow -->
  <path d="M 280 80 L 280 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: init binary search -->
  <rect x="150" y="98" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">① 初始化二分区间</text>
  <text x="280" y="131" text-anchor="middle" font-size="10.5" fill="#555">lo = min(bloomDay), hi = max(bloomDay)</text>

  <!-- arrow -->
  <path d="M 280 138 L 280 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: check(mid) -->
  <rect x="120" y="156" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">② check(mid)：贪心统计可扎花束数</text>
  <text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#555">扫描 bloomDay，bloomDay[i] ≤ mid 则连续计数++</text>
  <text x="280" y="206" text-anchor="middle" font-size="10.5" fill="#555">计数达 k → 花束+1，计数清零；否则遇到未开 → 计数清零</text>

  <!-- arrow to diamond -->
  <path d="M 280 212 L 280 228" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,232 400,284 280,336 160,284" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">花束数 ≥ m？</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#888">(check 可行?)</text>

  <!-- Yes branch (right) -->
  <path d="M 400 284 L 460 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="428" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="450" y="262" width="104" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="502" y="280" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">ans = mid</text>
  <text x="502" y="296" text-anchor="middle" font-size="10.5" fill="#555">hi = mid − 1</text>
  <text x="502" y="308" text-anchor="middle" font-size="9.5" fill="#888">找更小天数</text>

  <!-- No branch (left) -->
  <path d="M 160 284 L 100 284" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="6" y="262" width="94" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="53" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">花不够</text>
  <text x="53" y="296" text-anchor="middle" font-size="10.5" fill="#555">lo = mid + 1</text>
  <text x="53" y="308" text-anchor="middle" font-size="9.5" fill="#888">等更多花开</text>

  <!-- loop back arrow -->
  <path d="M 502 262 L 502 184 L 440 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 53 262 L 53 184 L 120 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="250" text-anchor="middle" font-size="9.5" fill="#aaa">lo ≤ hi 时循环 ↑</text>

  <!-- arrow down to return -->
  <path d="M 280 336 L 280 376" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="360" font-size="10" fill="#aaa">lo &gt; hi 结束</text>

  <!-- Step 3: return ans -->
  <rect x="150" y="380" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">③ 返回 ans（最少天数）</text>

  <!-- footer notes -->
  <rect x="60" y="432" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#666">check(mid) 贪心：相邻 k 朵开 → 扎一束，清零重数</text>
  <text x="280" y="464" text-anchor="middle" font-size="10" fill="#888">「能扎就扎」最优：早扎不亏，留花给后续不更优（交换论证）</text>
</svg>
