<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：perm = [3,1,2]（n = 3），fact = [1, 1, 2]（0!, 1!, 2!）</text>

  <!-- table header -->
  <rect x="36" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="72" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="126" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="206" y="44" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="268" y="44" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="44" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="396" y="44" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="442" y="44" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="99" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">perm[i]</text>
  <text x="166" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">已用集合</text>
  <text x="237" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">query(x)</text>
  <text x="299" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">smaller</text>
  <text x="363" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(n−1−i)!</text>
  <text x="419" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献</text>
  <text x="463" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <rect x="36" y="72" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="72" y="72" width="54" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="126" y="72" width="80" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="72" width="62" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="268" y="72" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="330" y="72" width="66" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="72" width="46" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="442" y="72" width="42" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="99" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="166" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∅</text>
  <text x="237" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="299" y="93" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="363" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2! = 2</text>
  <text x="419" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="463" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- row 1 -->
  <rect x="36" y="106" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="72" y="106" width="54" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="126" y="106" width="80" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="106" width="62" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="268" y="106" width="62" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="330" y="106" width="66" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="106" width="46" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="442" y="106" width="42" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="99" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="166" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="237" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="299" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="363" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1! = 1</text>
  <text x="419" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="463" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- row 2 -->
  <rect x="36" y="140" width="36" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="72" y="140" width="54" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="126" y="140" width="80" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="140" width="62" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="268" y="140" width="62" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="330" y="140" width="66" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="140" width="46" height="34" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="442" y="140" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="54" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="99" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="166" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,3}</text>
  <text x="237" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="299" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="363" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0! = 1</text>
  <text x="419" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="463" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- notes -->
  <rect x="36" y="190" width="448" height="100" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="212" font-size="10.5" fill="#555" filter="url(#rough2)">• i=0：左侧已用 ∅，query(3) = 0 → 更小候选 = 3−1−0 = 2 个（1 和 2）</text>
  <text x="52" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">• i=1：已用 {3}，query(1) = 0（3 &gt; 1 不算）→ 更小 = 1−1−0 = 0 个</text>
  <text x="52" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">• i=2：已用 {1,3}，query(2) = 1（1 已用）→ 更小 = 2−1−1 = 0 个</text>
  <text x="52" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">• 每步结算后 update(x)，把 x 记入树状数组供后续位置查询</text>

  <!-- result -->
  <rect x="36" y="302" width="448" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 4 → [3,1,2] 排在字典序第 5 个，下标为 4 ✓</text>
  <text x="260" y="341" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">示例 1 [1,2]：0×1! + 0×0! = 0 ✓（本身就是最小排列）</text>
</svg>
