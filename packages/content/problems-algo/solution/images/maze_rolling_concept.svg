<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <pattern id="wallHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5a5a5a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3a3a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：球沿方向滚动，遇墙才停</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888">BFS 的「状态」不是相邻格，而是每个方向上撞墙前的停止格</text>

  <!-- 5x5 grid: walls at (0,2),(2,0),(2,4),(4,2); ball at (2,2) -->
  <!-- grid origin (140,72), cell 52x52 -->
  <g filter="url(#rough2)" font-size="13">
    <!-- row 0 -->
    <rect x="142" y="74" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="194" y="74" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="246" y="74" width="52" height="52" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="298" y="74" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="350" y="74" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 1 -->
    <rect x="142" y="126" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="194" y="126" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="246" y="126" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="272" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">停</text>
    <rect x="298" y="126" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="350" y="126" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 2 -->
    <rect x="142" y="178" width="52" height="52" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="194" y="178" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="220" y="210" text-anchor="middle" fill="#4a7a3a" font-weight="bold">停</text>
    <rect x="246" y="178" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="298" y="178" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="324" y="210" text-anchor="middle" fill="#4a7a3a" font-weight="bold">停</text>
    <rect x="350" y="178" width="52" height="52" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <!-- row 3 -->
    <rect x="142" y="230" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="194" y="230" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="246" y="230" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="272" y="262" text-anchor="middle" fill="#4a7a3a" font-weight="bold">停</text>
    <rect x="298" y="230" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="350" y="230" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 4 -->
    <rect x="142" y="282" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="194" y="282" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="246" y="282" width="52" height="52" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="298" y="282" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="350" y="282" width="52" height="52" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
  </g>

  <!-- ball at (2,2) center = (272, 204) -->
  <g filter="url(#rough2)">
    <circle cx="272" cy="204" r="11" fill="#b85450" stroke="#7a3030" stroke-width="1.6"/>
    <text x="272" y="208" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">球</text>
  </g>

  <!-- rolling trajectories: 4 arrows from ball to stop positions -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <!-- up: (2,2) -> (1,2) stop ; arrow from ball up to (1,2) bottom edge (272, 178) -->
    <path d="M 272 192 L 272 180" marker-end="url(#arrG)"/>
    <!-- down: (2,2) -> (3,2) stop ; arrow from ball down to (3,2) top edge (272, 230) -->
    <path d="M 272 216 L 272 228" marker-end="url(#arrG)"/>
    <!-- left: (2,2) -> (2,1) stop ; arrow from ball left to (2,1) right edge (246, 204) -->
    <path d="M 260 204 L 248 204" marker-end="url(#arrG)"/>
    <!-- right: (2,2) -> (2,3) stop ; arrow from ball right to (2,3) left edge (298, 204) -->
    <path d="M 284 204 L 296 204" marker-end="url(#arrG)"/>
  </g>

  <!-- direction labels -->
  <g filter="url(#rough2)" font-size="10" fill="#4a7a3a">
    <text x="284" y="186" font-weight="bold">上</text>
    <text x="284" y="226" font-weight="bold">下</text>
    <text x="252" y="196" font-weight="bold">左</text>
    <text x="284" y="196" font-weight="bold">右</text>
  </g>

  <!-- explanation boxes on the right -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="410" y="92" width="118" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="469" y="112" text-anchor="middle" fill="#b85450" font-weight="bold">当前状态</text>
    <text x="469" y="128" text-anchor="middle" fill="#555" font-size="10">球的停止位置</text>
    <text x="469" y="142" text-anchor="middle" fill="#555" font-size="10">（红色球）</text>

    <rect x="410" y="170" width="118" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="469" y="190" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下一状态</text>
    <text x="469" y="206" text-anchor="middle" fill="#555" font-size="10">4 个方向撞墙</text>
    <text x="469" y="220" text-anchor="middle" fill="#555" font-size="10">前的停止格</text>

    <rect x="410" y="248" width="118" height="64" fill="#f0f0f0" stroke="#777" stroke-width="1.4" rx="8"/>
    <text x="469" y="268" text-anchor="middle" fill="#555" font-weight="bold">中间格≠状态</text>
    <text x="469" y="284" text-anchor="middle" fill="#777" font-size="10">球只是「路过」</text>
    <text x="469" y="298" text-anchor="middle" fill="#777" font-size="10">不能在此转向</text>
  </g>

  <!-- wall legend -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="150" y="346" width="16" height="14" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.2" rx="2"/>
    <text x="172" y="357" fill="#555">墙（无法穿过，球在此前停下）</text>
    <circle cx="332" cy="353" r="6" fill="#b85450" stroke="#7a3030" stroke-width="1.2"/>
    <text x="344" y="357" fill="#555">球（当前状态）</text>
  </g>
</svg>
