<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：无论参数是什么，输出恒为 "Hello World"</text>

  <!-- table header -->
  <rect x="40" y="56" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤</text>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">传入参数 args</text>
  <text x="490" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回值</text>

  <!-- separator lines -->
  <line x1="180" y1="56" x2="180" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="400" y1="56" x2="400" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Example 1 row -->
  <rect x="40" y="100" width="520" height="56" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">示例 1</text>
  <text x="110" y="142" text-anchor="middle" font-size="11" fill="#888">无参</text>
  <text x="300" y="132" text-anchor="middle" font-size="12" fill="#333">[]  （空）</text>
  <text x="490" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"Hello World"</text>
  <line x1="180" y1="100" x2="180" y2="156" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="100" x2="400" y2="156" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 2 row -->
  <rect x="40" y="162" width="520" height="64" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">示例 2</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#888">三参混合</text>
  <text x="300" y="198" text-anchor="middle" font-size="12" fill="#333">[ {}, null, 42 ]</text>
  <text x="300" y="214" text-anchor="middle" font-size="10" fill="#888">对象 / null / 数字</text>
  <text x="490" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"Hello World"</text>
  <line x1="180" y1="162" x2="180" y2="226" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="162" x2="400" y2="226" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- arrow between args and output -->
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a">↑ 两行参数天差地别，输出却完全一致——因为参数根本没被读取</text>

  <!-- call sequence -->
  <rect x="40" y="262" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">调用链：const f = createHelloWorld();   f(...args);</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#333">第一步拿到函数 f，第二步用任意参数调用 f —— 两步缺一不可</text>

  <!-- constraint -->
  <rect x="40" y="330" width="520" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">约束：0 ≤ args.length ≤ 10</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#888">用 ...args 收集即可，无需为不同参数个数写不同分支</text>

  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#888">💡 即便声明 function() 无参，JS 也允许传任意个参数（被静默忽略）—— ...args 只是更显式</text>
</svg>
