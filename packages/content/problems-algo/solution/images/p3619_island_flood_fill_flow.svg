<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐格扫描 → 迭代式 flood fill 累加 → 整除判定</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">「栈」换成队列就是 BFS，效果等价；原地置 0 兼作访问标记</text>

  <!-- ============ 开始 ============ -->
  <rect x="55" y="48" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="69" text-anchor="middle" font-size="11" fill="#33455e" filter="url(#rough2)">ans = 0，逐格扫描 (i, j)</text>

  <path d="M 165 82 L 165 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 判定 1：陆地？ ============ -->
  <polygon points="165,96 229,124 165,152 101,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="128" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">格子值 &gt; 0 ?</text>

  <path d="M 229 124 L 300 124" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="302" y="110" width="84" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="128" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">跳过</text>

  <path d="M 386 124 L 424 124 L 424 65 L 277 65" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="58" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">继续下一格</text>

  <path d="M 165 152 L 165 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="164" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ============ 初始化 ============ -->
  <rect x="35" y="168" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="190" text-anchor="middle" font-size="11" fill="#33455e" filter="url(#rough2)">total = 格子值；置 0；(i, j) 入栈</text>

  <path d="M 165 204 L 165 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 判定 2：栈非空？ ============ -->
  <polygon points="165,218 223,246 165,274 107,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="250" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">栈非空 ?</text>

  <path d="M 223 246 L 256 246" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="237" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="258" y="220" width="246" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="240" text-anchor="middle" font-size="10.5" fill="#33455e" filter="url(#rough2)">弹出 (x, y)：四邻居界内且 &gt; 0</text>
  <text x="381" y="258" text-anchor="middle" font-size="10.5" fill="#33455e" filter="url(#rough2)">→ total += 邻居值，置 0，入栈</text>

  <path d="M 381 220 L 381 204 L 175 204" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="198" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">整座岛屿泛洪完继续</text>

  <path d="M 165 274 L 165 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="286" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ============ 判定 3：整除？ ============ -->
  <polygon points="165,290 245,320 165,350 85,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="324" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">total % k == 0 ?</text>

  <path d="M 245 320 L 280 320" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="282" y="306" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="324" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <path d="M 328 334 L 328 360 L 171 360" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 350 L 165 372" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 结束 ============ -->
  <rect x="55" y="374" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="395" text-anchor="middle" font-size="11" fill="#33455e" filter="url(#rough2)">扫完全部格子 → 返回 ans</text>

  <rect x="300" y="374" width="204" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="402" y="395" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">每格只入栈一次：O(m·n)</text>
</svg>
