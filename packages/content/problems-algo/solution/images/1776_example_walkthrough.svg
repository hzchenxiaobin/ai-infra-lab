<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：cars = [[3,4],[5,4],[6,3],[9,1]] 从右向左</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">4 步逆序遍历，关注 i=0 连续弹栈两次后追上领队 3</text>

  <!-- table header -->
  <g font-size="9" fill="#444" font-weight="bold">
    <rect x="20" y="56" width="30" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="35" y="70" text-anchor="middle">步</text>
    <rect x="50" y="56" width="28" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="64" y="70" text-anchor="middle">i</text>
    <rect x="78" y="56" width="80" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="118" y="70" text-anchor="middle">car (p, s)</text>
    <rect x="158" y="56" width="90" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="203" y="70" text-anchor="middle">栈（处理前）</text>
    <rect x="248" y="56" width="210" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="353" y="70" text-anchor="middle">动作</text>
    <rect x="458" y="56" width="122" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="519" y="70" text-anchor="middle">res 变化</text>
  </g>

  <g font-size="9" fill="#333">
    <!-- step 1: i=3 -->
    <rect x="20" y="78" width="30" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="35" y="95" text-anchor="middle">1</text>
    <rect x="50" y="78" width="28" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="64" y="95" text-anchor="middle">3</text>
    <rect x="78" y="78" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="118" y="95" text-anchor="middle">(9, 1)</text>
    <rect x="158" y="78" width="90" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="203" y="95" text-anchor="middle">[]</text>
    <rect x="248" y="78" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="353" y="95" text-anchor="middle" fill="#4a7a3a">栈空，res[3] = -1；入栈 3</text>
    <rect x="458" y="78" width="122" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="519" y="95" text-anchor="middle" fill="#888">[-,-,-,-1]</text>

    <!-- step 2: i=2 -->
    <rect x="20" y="108" width="30" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="35" y="125" text-anchor="middle">2</text>
    <rect x="50" y="108" width="28" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="64" y="125" text-anchor="middle">2</text>
    <rect x="78" y="108" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="118" y="125" text-anchor="middle">(6, 3)</text>
    <rect x="158" y="108" width="90" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="203" y="125" text-anchor="middle">[3]</text>
    <rect x="248" y="108" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="353" y="125" text-anchor="middle" fill="#4a7a3a">s3&gt;s1, t=(9−6)/(3−1)=1.5; res[3]=−1 → res[2]=1.5</text>
    <rect x="458" y="108" width="122" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="519" y="125" text-anchor="middle" fill="#d6a040">[-,-,1.5,-1]</text>

    <!-- step 3: i=1 -->
    <rect x="20" y="138" width="30" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="35" y="155" text-anchor="middle">3</text>
    <rect x="50" y="138" width="28" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="64" y="155" text-anchor="middle">1</text>
    <rect x="78" y="138" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="118" y="155" text-anchor="middle">(5, 4)</text>
    <rect x="158" y="138" width="90" height="26" fill="#fff" stroke="#eee" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="203" y="155" text-anchor="middle">[3, 2]</text>
    <rect x="248" y="138" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="353" y="155" text-anchor="middle" fill="#4a7a3a">s4&gt;s3, t=(6−5)/(4−3)=1; 1≤1.5 → res[1]=1</text>
    <rect x="458" y="138" width="122" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="519" y="155" text-anchor="middle" fill="#d6a040">[-,1,1.5,-1]</text>

    <!-- step 4: i=0 (key) -->
    <rect x="20" y="168" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="35" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="50" y="168" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="64" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="78" y="168" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="1" filter="url(#rough2)"/>
    <text x="118" y="185" text-anchor="middle">(3, 4)</text>
    <rect x="158" y="168" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="203" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">[3, 2, 1]</text>
    <rect x="248" y="168" width="210" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="353" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">s4≤s4 弹1; t=3&gt;1.5 弹2; t=2 → res[0]=2</text>
    <rect x="458" y="168" width="122" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="519" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">[2,1,1.5,-1]</text>
  </g>

  <!-- ===== Detail box for step 4 ===== -->
  <rect x="30" y="208" width="540" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="228" font-size="11" fill="#d6a040" font-weight="bold">步骤 4 详解（car 0: pos=3, speed=4）—— 连续弹两个栈顶：</text>

  <text x="50" y="248" font-size="10" fill="#b85450" font-weight="bold">① 栈顶 j=1 (s=4)：s₀(4) ≤ s₁(4) 同速 → 追不上，弹 1</text>
  <text x="60" y="262" font-size="9" fill="#888">物理：car 0 和 car 1 同速 4，距离恒为 2，永不相遇</text>

  <text x="50" y="282" font-size="10" fill="#b85450" font-weight="bold">② 栈顶 j=2 (s=3)：s₀(4) &gt; s₂(3)，t=(6−3)/(4−3)=3</text>
  <text x="60" y="296" font-size="9" fill="#888">但 res[2]=1.5 &lt; 3：car 2 在 1.5s 时并入领队 3 的车队（减速到 1），0 还没追上 → 弹 2</text>

  <text x="50" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">③ 栈顶 j=3 (s=1)：s₀(4) &gt; s₃(1)，t=(9−3)/(4−1)=2</text>
  <text x="60" y="328" font-size="9" fill="#888">res[3]=−1（领队永不合并），2 ≤ ∞ → res[0]=2 ✓ 0 追上 {1,2,3} 车队</text>

  <!-- ===== Final result ===== -->
  <line x1="20" y1="346" x2="580" y2="346" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="360" width="540" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：[2.0, 1.0, 1.5, -1.0]</text>
  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#555">时间线：t=1 car1↔car2 合并(速3) → t=1.5 车队↔car3 合并(速1) → t=2 car0 追上车队</text>
  <text x="300" y="420" text-anchor="middle" font-size="10" fill="#555">关键：car 0 虽追不上 car 1（同速），但 car 1 并入慢车队后整体减速，0 得以追上</text>
  <text x="300" y="438" text-anchor="middle" font-size="9" fill="#888">4 步遍历，4 次入栈 + 3 次出栈 = 7 次操作 = O(n)</text>
</svg>
