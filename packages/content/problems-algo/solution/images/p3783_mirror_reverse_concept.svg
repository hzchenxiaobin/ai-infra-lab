<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">镜像 = 数位盒子左右翻转：n = 25 ⇄ 52</text>

  <!-- 左：n 的数位 -->
  <text x="82" y="66" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">n = 25</text>
  <g filter="url(#rough2)">
    <rect x="42" y="78" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="84" y="78" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="61" y="104" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">2</text>
    <text x="103" y="104" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">5</text>
    <text x="61" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">×10¹</text>
    <text x="103" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">×1</text>
  </g>
  <text x="82" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2×10 + 5</text>

  <!-- 中间翻转箭头 -->
  <path d="M 148 98 C 178 58, 212 58, 242 96" fill="none" stroke="#b85450" stroke-width="2"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="56" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">reverse 翻转</text>

  <!-- 右：reverse(n) 的数位 -->
  <text x="330" y="66" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">reverse(n) = 52</text>
  <g filter="url(#rough2)">
    <rect x="290" y="78" width="38" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="332" y="78" width="38" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="309" y="104" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold">5</text>
    <text x="351" y="104" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold">2</text>
    <text x="309" y="134" text-anchor="middle" font-size="10" fill="#d6a040">×10¹</text>
    <text x="351" y="134" text-anchor="middle" font-size="10" fill="#d6a040">×1</text>
  </g>
  <text x="330" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">5×10 + 2</text>

  <!-- 数轴 -->
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">镜像距离 = |25 − 52| = 27</text>
  <g filter="url(#rough2)">
    <line x1="60" y1="236" x2="462" y2="236" stroke="#446688" stroke-width="2"/>
    <path d="M 110 224 L 110 248" stroke="#4a7a3a" stroke-width="2.2"/>
    <path d="M 410 224 L 410 248" stroke="#d6a040" stroke-width="2.2"/>
    <path d="M 118 208 L 402 208" stroke="#b85450" stroke-width="1.8"
          marker-start="url(#arrR)" marker-end="url(#arrR)"/>
    <text x="110" y="266" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">25</text>
    <text x="410" y="266" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">52</text>
  </g>

  <!-- 底部两个坑位框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="278" width="228" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="298" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">尾部零会被吃掉</text>
    <text x="140" y="315" text-anchor="middle" font-size="10" fill="#33506b">n = 10 → 反转得 01</text>
    <text x="140" y="330" text-anchor="middle" font-size="10" fill="#33506b">前导零丢弃 → 1，距离 = 9</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="266" y="278" width="228" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="380" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">回文数距离为 0</text>
    <text x="380" y="315" text-anchor="middle" font-size="10" fill="#b85450">n = 7、121、1221…</text>
    <text x="380" y="330" text-anchor="middle" font-size="10" fill="#b85450">reverse(n) = n，距离 = 0</text>
  </g>
</svg>
