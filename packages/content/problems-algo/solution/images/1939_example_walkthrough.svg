<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四用户配对 → 时间差 → 24h 判定</text>

  <!-- ===== User 3: 6m59s ✓ ===== -->
  <rect x="20" y="36" width="540" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="30" y="52" font-size="10" fill="#4a7a3a" font-weight="bold">user 3</text>
  <text x="30" y="68" font-size="9" fill="#333">c1: 2021-01-06 03:30:46 (timeout)</text>
  <text x="30" y="82" font-size="9" fill="#333">c2: 2021-01-06 03:37:45 (timeout)</text>
  <text x="240" y="68" font-size="9" fill="#666">→ diff =</text>
  <text x="300" y="68" font-size="10" fill="#4a7a3a" font-weight="bold">6 分 59 秒</text>
  <text x="300" y="82" font-size="9" fill="#888">= 419 秒</text>
  <rect x="420" y="56" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ 86400 ✓</text>

  <!-- ===== User 7: 24h1s ✗ ===== -->
  <rect x="20" y="116" width="540" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="30" y="132" font-size="10" fill="#b85450" font-weight="bold">user 7</text>
  <text x="30" y="148" font-size="9" fill="#333">c1: 2021-06-12 11:57:29 (confirmed)</text>
  <text x="30" y="162" font-size="9" fill="#333">c2: 2021-06-13 11:57:30 (confirmed)</text>
  <text x="240" y="148" font-size="9" fill="#666">→ diff =</text>
  <text x="300" y="148" font-size="10" fill="#b85450" font-weight="bold">24 时 0 分 1 秒</text>
  <text x="300" y="162" font-size="9" fill="#888">= 86401 秒</text>
  <rect x="420" y="136" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt; 86400 ✗</text>

  <!-- ===== User 2: exactly 24h ✓ ===== -->
  <rect x="20" y="196" width="540" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="30" y="212" font-size="10" fill="#4a7a3a" font-weight="bold">user 2</text>
  <text x="30" y="228" font-size="9" fill="#333">c1: 2021-01-22 00:00:00 (confirmed)</text>
  <text x="30" y="242" font-size="9" fill="#333">c2: 2021-01-23 00:00:00 (timeout)</text>
  <text x="240" y="228" font-size="9" fill="#666">→ diff =</text>
  <text x="300" y="228" font-size="10" fill="#4a7a3a" font-weight="bold">恰好 24 时 0 分 0 秒</text>
  <text x="300" y="242" font-size="9" fill="#888">= 86400 秒（边界！）</text>
  <rect x="420" y="216" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ 86400 ✓</text>

  <!-- ===== User 6: 23h59m59s ✓ ===== -->
  <rect x="20" y="276" width="540" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="30" y="292" font-size="10" fill="#4a7a3a" font-weight="bold">user 6</text>
  <text x="30" y="308" font-size="9" fill="#333">c1: 2021-10-23 14:14:14 (confirmed)</text>
  <text x="30" y="322" font-size="9" fill="#333">c2: 2021-10-24 14:14:13 (timeout)</text>
  <text x="240" y="308" font-size="9" fill="#666">→ diff =</text>
  <text x="300" y="308" font-size="10" fill="#4a7a3a" font-weight="bold">23 时 59 分 59 秒</text>
  <text x="300" y="322" font-size="9" fill="#888">= 86399 秒</text>
  <rect x="420" y="296" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤ 86400 ✓</text>

  <!-- Arrow to result -->
  <path d="M 290 352 L 290 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="360" font-size="8" fill="#888">SELECT DISTINCT</text>

  <!-- ===== Result table ===== -->
  <rect x="210" y="370" width="160" height="72" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">user_id</text>
  <line x1="210" y1="392" x2="370" y2="392" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="290" y="420" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <text x="290" y="434" text-anchor="middle" font-size="11" fill="#446688">6</text>

  <!-- ===== Bottom note: boundary ===== -->
  <rect x="20" y="370" width="170" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="388" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">边界对比</text>
  <text x="30" y="404" font-size="8" fill="#4a7a3a">user2: 86400s ≤ 86400 ✓</text>
  <text x="30" y="418" font-size="8" fill="#b85450">user7: 86401s &gt; 86400 ✗</text>
  <text x="30" y="432" font-size="8" fill="#888">差 1 秒决定去留！</text>

  <!-- ===== Right side note ===== -->
  <rect x="390" y="370" width="170" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="388" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">为何 user7 被排除</text>
  <text x="400" y="404" font-size="8" fill="#666">06-12 11:57:29</text>
  <text x="400" y="416" font-size="8" fill="#666">→ 06-13 11:57:30</text>
  <text x="400" y="430" font-size="8" fill="#b85450">多跨了 1 秒 &gt; 24h</text>
</svg>
