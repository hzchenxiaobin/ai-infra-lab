<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：JOIN → WHERE → GROUP BY → SUM → HAVING</text>

  <!-- execution order rail -->
  <text x="40" y="56" font-size="9" fill="#888">SQL 执行顺序 ↓</text>

  <!-- Step 1: FROM JOIN -->
  <rect x="120" y="56" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Candidates</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#446688">JOIN Rounds USING (interview_id)</text>
  <text x="410" y="74" font-size="8" fill="#888">INNER JOIN</text>

  <path d="M 260 104 L 260 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: WHERE -->
  <rect x="120" y="122" width="280" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② WHERE years_of_exp &gt;= 2</text>
  <text x="260" y="156" text-anchor="middle" font-size="9" fill="#b85450">行级过滤：丢 Atticus(1) / Alfredo(0)</text>
  <text x="260" y="168" text-anchor="middle" font-size="8" fill="#888">聚合前裁剪，不参与后续求和</text>

  <path d="M 260 176 L 260 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY -->
  <rect x="120" y="194" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ GROUP BY candidate_id</text>
  <text x="260" y="228" text-anchor="middle" font-size="9" fill="#888">按候选人折叠多轮分数 → 2 组</text>

  <path d="M 260 240 L 260 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SUM -->
  <rect x="120" y="258" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ SUM(score) AS 总分</text>
  <text x="260" y="292" text-anchor="middle" font-size="9" fill="#888">Ruben 6+7+2+7=22 · Aliza 4+1+4+1=10</text>

  <path d="M 260 304 L 260 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: HAVING decision -->
  <polygon points="260,322 390,372 260,422 130,372" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⑤ HAVING</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">SUM &gt; 10?</text>
  <text x="260" y="396" text-anchor="middle" font-size="8" fill="#888">严格大于，=10 不算</text>

  <!-- No branch (left) -->
  <path d="M 130 372 L 74 372" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="102" y="366" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="16" y="356" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="372" text-anchor="middle" font-size="9" fill="#b85450">Aliza</text>
  <text x="45" y="384" text-anchor="middle" font-size="9" fill="#b85450">10 ✗</text>

  <!-- Yes branch (right) -->
  <path d="M 390 372 L 446 372" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="366" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="448" y="356" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="479" y="372" text-anchor="middle" font-size="9" fill="#4a7a3a">Ruben</text>
  <text x="479" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a">22 ✓</text>

  <!-- Arrow down from yes branch to SELECT -->
  <path d="M 479 390 C 479 440, 260 440, 260 448" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 6: SELECT -->
  <rect x="120" y="452" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ SELECT candidate_id</text>
  <text x="260" y="486" text-anchor="middle" font-size="9" fill="#4a7a3a">输出：9</text>

  <!-- side notes -->
  <rect x="16" y="452" width="92" height="42" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="24" y="466" font-size="8" fill="#888">WHERE = 行级</text>
  <text x="24" y="478" font-size="8" fill="#888">HAVING = 组级</text>
  <text x="24" y="489" font-size="8" fill="#888">分工不可换</text>

  <rect x="412" y="452" width="100" height="42" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="420" y="466" font-size="8" fill="#888">FROM→WHERE→</text>
  <text x="420" y="478" font-size="8" fill="#888">GROUP→HAVING→</text>
  <text x="420" y="489" font-size="8" fill="#888">SELECT</text>

  <!-- bottom note -->
  <rect x="16" y="510" width="488" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="526" text-anchor="middle" font-size="10" fill="#d6a040">要点：WHERE 在 GROUP BY 前裁行，HAVING 在 GROUP BY 后筛组；SUM 不能进 WHERE</text>
  <text x="260" y="540" text-anchor="middle" font-size="9" fill="#d6a040">边界陷阱：10 不严格 &gt; 10 → Aliza 被拒</text>
</svg>
