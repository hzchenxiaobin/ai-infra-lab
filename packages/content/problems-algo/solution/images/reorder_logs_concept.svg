<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">重新排列日志：分类 + 自定义排序 + 稳定拼接</text>

  <!-- Input logs -->
  <text x="36" y="62" font-size="12" fill="#888">输入 logs:</text>
  <rect x="110" y="44" width="410" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="65" text-anchor="middle" font-size="12" fill="#333">let1 art can / dig2 3 6 / let3 art zero ...</text>

  <!-- split arrow -->
  <path d="M 200 82 L 200 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 82 L 440 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#888">按首空格后字符类型分类</text>

  <!-- Letter logs group -->
  <rect x="60" y="106" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">字母日志 letterLogs</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#888">内容为小写字母</text>

  <!-- Digit logs group -->
  <rect x="320" y="106" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">数字日志 digitLogs</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#888">内容为数字</text>

  <!-- sort arrow for letter -->
  <path d="M 160 158 L 160 178" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="172" y="174" font-size="11" fill="#888">自定义排序</text>

  <!-- keep order for digit -->
  <path d="M 420 158 L 420 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="432" y="174" font-size="11" fill="#888">保持原序</text>

  <!-- sorted letter box -->
  <rect x="50" y="182" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#333">排序键 = (内容, 标识符)</text>
  <text x="160" y="220" text-anchor="middle" font-size="11" fill="#666">先比内容字符串</text>
  <text x="160" y="234" text-anchor="middle" font-size="11" fill="#666">内容相同再比标识符</text>

  <!-- digit keep box -->
  <rect x="310" y="182" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="206" text-anchor="middle" font-size="12" fill="#333">无需排序</text>
  <text x="420" y="224" text-anchor="middle" font-size="11" fill="#666">按收集顺序保留</text>

  <!-- merge arrows -->
  <path d="M 160 242 L 160 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 242 L 420 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#888">字母在前，数字在后</text>

  <!-- merge box -->
  <rect x="110" y="266" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">letterLogs + digitLogs 拼接</text>

  <path d="M 280 300 L 280 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <text x="36" y="346" font-size="12" fill="#888">最终顺序:</text>
  <rect x="110" y="328" width="410" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="315" y="349" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">字母日志(已排序) + 数字日志(原序)</text>

  <!-- Insight -->
  <rect x="40" y="370" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：先分类、字母按(内容,标识符)排序、数字稳定保序</text>
</svg>
