  <!-- key insight box -->
  <g filter="url(#sk)">
    <rect x="60" y="268" width="520" height="48" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="290" font-size="12" font-weight="bold" fill="#b85450">关键洞察：</text>
  <text x="148" y="290" font-size="11" fill="#444">碰到网格边界的岛 → 必非封闭。先 DFS 淹掉所有边界连通的 0，</text>
  <text x="80" y="308" font-size="11" fill="#444">剩下的 0 连通块全部被水包围 → 即封闭岛屿，用 200 题沉岛法计数即可。</text>
