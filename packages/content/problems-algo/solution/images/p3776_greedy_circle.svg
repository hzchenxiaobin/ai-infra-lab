<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arry" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：单缺口 ⇒ 按环距标价、贪心选购</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">balance = [1, 2, −5, 2]，负点 p = 2，缺口 x = 5</text>

  <!-- 环 -->
  <circle cx="140" cy="200" r="86" fill="none" stroke="#446688" stroke-width="1.2" opacity="0.35" filter="url(#rough2)"/>

  <!-- 节点 -->
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">负点 p=2，缺口 x=5</text>
  <circle cx="140" cy="114" r="25" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="119" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">−5</text>

  <circle cx="54" cy="200" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="54" y="236" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i=1</text>

  <circle cx="226" cy="200" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="226" y="236" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i=3</text>

  <circle cx="140" cy="286" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="291" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="322" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i=0</text>

  <!-- 运输箭头 -->
  <path d="M 57 178 A 86 86 0 0 1 128 115" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="147" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d=1</text>
  <path d="M 222 173 A 86 86 0 0 0 155 115" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="147" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d=1</text>
  <path d="M 132 268 Q 142 200 132 136" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arry)" filter="url(#rough2)"/>
  <text x="150" y="208" font-size="11" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <!-- 右侧贪心表 -->
  <rect x="285" y="62" width="220" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">按 d 升序排队，贪心取货</text>

  <rect x="285" y="98" width="220" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① d=1，余 2 → 取 2 · 代价 2 · 剩 3</text>
  <rect x="285" y="134" width="220" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② d=1，余 2 → 取 2 · 代价 2 · 剩 1</text>
  <rect x="285" y="170" width="220" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="395" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ d=2，余 1 → 取 1 · 代价 2 · 剩 0</text>

  <rect x="285" y="208" width="220" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="228" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">合计 cost = 2+2+2 = 6 ✓</text>

  <text x="395" y="262" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">单价：d = min(顺时针, 逆时针) 距离</text>
  <text x="395" y="280" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">容量：balance[i]（净送出上限）</text>
  <text x="395" y="298" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">先买便宜的 ⇒ 总价最小</text>

  <!-- 底部结论 -->
  <rect x="36" y="334" width="448" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">单缺口 ⇒ 凑 x 个单位：单价 d、容量 balance[i]，先近后远</text>
</svg>
