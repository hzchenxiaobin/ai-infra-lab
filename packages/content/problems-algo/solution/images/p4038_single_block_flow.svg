<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 596"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="596" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：一趟扫描记三元组，逐值判定</text>

    <!-- step 1 -->
    <rect x="105" y="30" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="52" text-anchor="middle" font-size="10.5" fill="#333">① 初始化 first / last / cnt 为空</text>

    <path d="M 200 66 V 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- step 2: scan -->
    <rect x="80" y="82" width="240" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="101" text-anchor="middle" font-size="10.5" fill="#333">② 一趟扫描：i = 0 … n−1</text>
    <text x="200" y="118" text-anchor="middle" font-size="9.5" fill="#555">x = nums[i]：首次见到则 first[x] = i</text>
    <text x="200" y="133" text-anchor="middle" font-size="9.5" fill="#555">last[x] = i（每轮刷新），cnt[x] += 1</text>

    <!-- scan loop back -->
    <path d="M 80 128 H 36 V 96 H 76" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="28" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" transform="rotate(-90 28 112)">i++，直到扫完</text>

    <path d="M 200 140 V 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 1 -->
    <polygon points="200,158 292,190 200,222 108,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="194" text-anchor="middle" font-size="10.5" fill="#333">还有未检查的值 x？</text>

    <!-- no: return -->
    <path d="M 292 190 H 330" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="302" y="183" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
    <rect x="334" y="170" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="409" y="187" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold">④ 返回 ans</text>
    <text x="409" y="202" text-anchor="middle" font-size="9" fill="#2f5527">（不同特殊整数的个数）</text>

    <!-- yes: down -->
    <path d="M 200 222 V 236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="233" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <!-- fetch triple -->
    <rect x="95" y="240" width="210" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="262" text-anchor="middle" font-size="10" fill="#333">取 l = first[x]，r = last[x]，c = cnt[x]</text>

    <path d="M 200 276 V 290" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 2 -->
    <polygon points="200,294 288,326 200,358 112,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="330" text-anchor="middle" font-size="11" fill="#333">r − l + 1 == c ？</text>

    <!-- yes: ans++ -->
    <path d="M 288 326 H 315" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="294" y="319" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="319" y="304" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="409" y="322" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold">ans += 1</text>
    <text x="409" y="339" text-anchor="middle" font-size="9" fill="#2f5527">（x 是特殊整数）</text>

    <!-- no: down -->
    <path d="M 200 358 V 378" stroke="#446688" stroke-width="1.6" fill="none"/>
    <text x="208" y="372" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

    <!-- merge and loop back to diamond 1 -->
    <path d="M 409 348 V 378" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 409 378 H 48 V 190 H 104" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="38" y="284" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" transform="rotate(-90 38 284)">下一个 x</text>

    <!-- complexity -->
    <rect x="334" y="222" width="160" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="414" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">复杂度</text>
    <text x="414" y="257" text-anchor="middle" font-size="9" fill="#7a5c1a">时间 O(n + U)，U 为值域</text>
    <text x="414" y="272" text-anchor="middle" font-size="9" fill="#7a5c1a">空间 O(U)：仅存三元组</text>

    <!-- pitfalls -->
    <rect x="40" y="400" width="440" height="180" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="260" y="422" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">五个免踩的坑</text>
    <text x="58" y="446" font-size="9.5" fill="#8a3a35">① 只出现一次的值天然特殊：l == r、cnt == 1，判定式恒成立，无需特判</text>
    <text x="58" y="470" font-size="9.5" fill="#8a3a35">② 不必存全部下标：first / last / cnt 三个数就是判定所需的全部信息</text>
    <text x="58" y="494" font-size="9.5" fill="#8a3a35">③ 值域 [1,100]：用 int[101] 定长数组代替哈希表，更快更省</text>
    <text x="58" y="518" font-size="9.5" fill="#8a3a35">④ 警惕差一错误：判定式是 r − l + 1 == cnt，不是 r − l == cnt</text>
    <text x="58" y="542" font-size="9.5" fill="#8a3a35">⑤ 一般化"块数"：相邻出现位置差 &gt; 1 的次数 + 1；特殊 ⟺ 恰好 1 块</text>
  </g>
</svg>
