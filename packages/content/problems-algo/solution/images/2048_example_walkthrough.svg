<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#888" stroke-width="1.4"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">候选数轴上的 upper_bound 定位</text>

  <!-- ===== 候选格子行 ===== -->
  <text x="30" y="74" font-size="11" fill="#888">候选(升序):</text>
  <!-- 333 -->
  <rect x="110" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="78" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">333</text>
  <!-- 1333 -->
  <rect x="174" y="56" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1333</text>
  <!-- 3133 -->
  <rect x="246" y="56" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3133</text>
  <!-- 3313 -->
  <rect x="318" y="56" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3313</text>
  <!-- 3331 -->
  <rect x="390" y="56" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="78" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3331</text>
  <!-- 4444 -->
  <rect x="462" y="56" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="494" y="78" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">4444</text>
  <!-- 省略号 -->
  <text x="100" y="78" font-size="12" fill="#bbb">…</text>
  <text x="536" y="78" font-size="12" fill="#bbb">…</text>

  <!-- ===== n = 1000 ===== -->
  <text x="30" y="140" font-size="12" fill="#b85450" font-weight="bold">n = 1000</text>
  <!-- n=1000 标记位置：在 333 与 1333 之间 -->
  <path d="M 168 110 L 168 56" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="168" y="126" text-anchor="middle" font-size="10" fill="#b85450">1000</text>
  <!-- upper_bound 箭头指向 1333 -->
  <path d="M 168 150 Q 168 168 200 168 L 206 168 L 206 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="232" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">upper_bound → 1333 ✓</text>

  <!-- 分隔 -->
  <path d="M 40 196 L 540 196" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== n = 3000 ===== -->
  <text x="30" y="222" font-size="12" fill="#b85450" font-weight="bold">n = 3000</text>
  <!-- n=3000 标记位置：在 1333 与 3133 之间 -->
  <path d="M 240 198 L 240 56" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="240" y="214" text-anchor="middle" font-size="10" fill="#b85450">3000</text>
  <!-- upper_bound 箭头指向 3133 -->
  <path d="M 240 234 Q 240 252 270 252 L 278 252 L 278 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="304" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">upper_bound → 3133 ✓</text>

  <!-- ===== 结论框 ===== -->
  <rect x="50" y="280" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">同一子集 {1,3} 的 4 个全排列都要生成</text>
  <text x="290" y="318" text-anchor="middle" font-size="11" fill="#666">1333 / 3133 / 3313 / 3331 大小不同，分别服务不同 n 区间</text>
</svg>
