<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：层序 BFS 精简版</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">每层 i==0 记 ans，while 结束时 ans 即「最后一行最左」</text>

  <!-- ===== Step 1: init ===== -->
  <rect x="180" y="60" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="270" y="93" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">queue = [root]; ans = root.val</text>

  <path d="M 270 102 L 270 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: while decision ===== -->
  <polygon points="270,124 360,164 270,204 180,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② queue 非空?</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#888">否 → 跳到 ⑥</text>

  <!-- No branch -> return -->
  <path d="M 360 164 L 430 164" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="395" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="146" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑥ return ans</text>
  <text x="480" y="178" text-anchor="middle" font-size="8" fill="#888">最后一层最左值</text>

  <!-- Yes branch down -->
  <path d="M 270 204 L 270 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Step 3: size snapshot ===== -->
  <rect x="180" y="226" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">③ size = queue.size()</text>

  <path d="M 270 262 L 270 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: for loop ===== -->
  <rect x="120" y="284" width="300" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ for i in 0..size:</text>
  <text x="135" y="320" font-family="monospace" font-size="10" fill="#333">node = queue.pop_front()</text>
  <text x="135" y="336" font-family="monospace" font-size="10" fill="#b85450" font-weight="bold">if i == 0: ans = node.val   ⭐</text>
  <text x="135" y="352" font-family="monospace" font-size="10" fill="#333">push(left); push(right)</text>
  <text x="305" y="362" font-size="8" fill="#888">i==0 出队即本层最左</text>

  <!-- loop back arrow -->
  <path d="M 120 326 L 80 326 L 80 164 L 180 164" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="248" font-size="9" fill="#4a7a3a" font-weight="bold">回到 ②</text>
  <text x="50" y="262" font-size="8" fill="#888">处理下一层</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="390" width="490" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="410" font-size="11" fill="#d6a040" font-weight="bold">为什么 ④ 完成后才回 ②？</text>
  <text x="50" y="426" font-size="10" fill="#555">for(size) 恰好处理一整层，期间入队的子节点属下一层；循环结束后队列里只剩下一层节点。</text>
  <text x="50" y="440" font-size="10" fill="#555">size 快照锁定层边界 —— 与 102/107/199 全家共享的同一技巧。</text>
</svg>
