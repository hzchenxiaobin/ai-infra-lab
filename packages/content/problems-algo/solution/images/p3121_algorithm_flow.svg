<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描记两个极端位置，收尾 26 次链式判定</text>

  <!-- start box -->
  <rect x="170" y="36" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始化：firstUpper ← n（+∞），lastLower ← −1</text>

  <path d="M 280 70 L 280 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- scan loop -->
  <rect x="170" y="86" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一趟扫描：i = 0 … n−1，c = word[i]</text>

  <path d="M 280 120 L 280 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="280,136 365,170 280,204 195,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c 是小写？</text>

  <path d="M 365 170 L 390 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="373" y="162" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="392" y="148" width="152" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="167" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">lastLower[c] ← i</text>
  <text x="468" y="183" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">覆盖式 · 自然留最后一个</text>

  <path d="M 195 170 L 170 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="186" y="162" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="16" y="148" width="152" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="167" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">firstUpper[c] ← min(·, i)</text>
  <text x="92" y="183" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">min 语义 · 只留第一个</text>

  <!-- converge -->
  <path d="M 468 192 L 468 228" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 92 192 L 92 228" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 92 228 L 468 228" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 228 L 280 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- final loop -->
  <rect x="170" y="246" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫描结束：for c in 0 … 25</text>

  <path d="M 280 280 L 280 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="280,298 372,336 280,374 188,336" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">−1 &lt; lastLower[c]</text>
  <text x="280" y="347" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">&lt; firstUpper[c] &lt; n ？</text>

  <path d="M 372 336 L 398 336" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="382" y="328" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="400" y="318" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="452" y="341" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++</text>

  <path d="M 188 336 L 160 336 L 160 396" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="176" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">否·跳过</text>

  <path d="M 452 354 L 452 396" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 160 396 L 452 396" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 396 L 280 412" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="190" y="414" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
