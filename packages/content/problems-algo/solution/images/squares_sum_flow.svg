<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化 → 循环判定 → 三分支移动 / 终止</text>

  <!-- ===== Step 1: Start / Init ===== -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：a=0, b=⌊√c⌋</text>

  <!-- arrow down to loop check -->
  <path d="M 280 84 L 280 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: Loop condition (diamond) ===== -->
  <polygon points="280,108 380,160 280,212 180,160" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a ≤ b ?</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#888">（含相等）</text>

  <!-- No branch → return false (right) -->
  <path d="M 380 160 L 460 160" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="395" y="152" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="140" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return</text>
  <text x="500" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes branch → compute s (down) -->
  <path d="M 280 212 L 280 236" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="288" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Step 3: compute s ===== -->
  <rect x="200" y="236" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算 s = a² + b²</text>

  <!-- arrow down to 3-way compare -->
  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 4: 3-way compare (diamond) ===== -->
  <polygon points="280,296 400,348 280,400 160,348" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s 与 c 比较</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888">三分支</text>

  <!-- ===== Branch s == c (left) → return true ===== -->
  <path d="M 160 348 L 80 348" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">s == c</text>
  <rect x="20" y="328" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="60" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- ===== Branch s < c (down-left) → a++ ===== -->
  <path d="M 240 392 L 180 420" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="416" font-size="11" fill="#4a7a3a" font-weight="bold">s &lt; c</text>
  <rect x="120" y="420" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">++a</text>

  <!-- ===== Branch s > c (down-right) ⇒ b 减一 ===== -->
  <path d="M 320 392 L 380 420" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="416" font-size="11" fill="#b85450" font-weight="bold">s &gt; c</text>
  <rect x="340" y="420" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="440" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">--b</text>

  <!-- ===== Loop-back arrows to top of diamond ===== -->
  <!-- from a++ back up to loop check (left side route) -->
  <path d="M 170 420 L 170 160 L 180 160" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- from b 减一 back up to loop check (right side route) -->
  <path d="M 390 420 L 390 160 L 380 160" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#999">虚线表示回到循环条件判断处</text>
</svg>
