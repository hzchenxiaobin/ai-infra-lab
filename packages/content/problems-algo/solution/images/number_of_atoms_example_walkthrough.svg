<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：K4(ON(SO3)2)2 逐步计数</text>

  <!-- ===== table header ===== -->
  <rect x="30" y="44" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="60" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <rect x="66" y="44" width="54" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="60" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">读入</text>
  <rect x="120" y="44" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="60" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>
  <rect x="270" y="44" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="60" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cur</text>
  <rect x="430" y="44" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="510" y="60" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">stack（底→顶）</text>

  <!-- ===== row 1: K4 (atom, green) ===== -->
  <rect x="30" y="68" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="85" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="66" y="68" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="85" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">K4</text>
  <rect x="120" y="68" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="85" text-anchor="middle" font-size="9.5" fill="#333">原子 K×4</text>
  <rect x="270" y="68" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="85" text-anchor="middle" font-size="10" fill="#333">{K:4}</text>
  <rect x="430" y="68" width="160" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="85" text-anchor="middle" font-size="10" fill="#888">[]</text>

  <!-- ===== row 2: ( (push, orange) ===== -->
  <rect x="30" y="94" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="111" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="66" y="94" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(</text>
  <rect x="120" y="94" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="111" text-anchor="middle" font-size="9.5" fill="#333">压栈，重置 cur</text>
  <rect x="270" y="94" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="111" text-anchor="middle" font-size="10" fill="#333">{}</text>
  <rect x="430" y="94" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="510" y="111" text-anchor="middle" font-size="10" fill="#d6a040">[{K:4}]</text>

  <!-- ===== row 3: O (atom) ===== -->
  <rect x="30" y="120" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="137" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="66" y="120" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O</text>
  <rect x="120" y="120" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="137" text-anchor="middle" font-size="9.5" fill="#333">原子 O×1</text>
  <rect x="270" y="120" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="137" text-anchor="middle" font-size="10" fill="#333">{O:1}</text>
  <rect x="430" y="120" width="160" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="137" text-anchor="middle" font-size="10" fill="#888">[{K:4}]</text>

  <!-- ===== row 4: N (atom) ===== -->
  <rect x="30" y="146" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="163" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="66" y="146" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">N</text>
  <rect x="120" y="146" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="163" text-anchor="middle" font-size="9.5" fill="#333">原子 N×1</text>
  <rect x="270" y="146" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="163" text-anchor="middle" font-size="10" fill="#333">{O:1, N:1}</text>
  <rect x="430" y="146" width="160" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="163" text-anchor="middle" font-size="10" fill="#888">[{K:4}]</text>

  <!-- ===== row 5: ( (push, orange) ===== -->
  <rect x="30" y="172" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="189" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="66" y="172" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="93" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(</text>
  <rect x="120" y="172" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="189" text-anchor="middle" font-size="9.5" fill="#333">压栈，重置 cur</text>
  <rect x="270" y="172" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="350" y="189" text-anchor="middle" font-size="10" fill="#333">{}</text>
  <rect x="430" y="172" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="189" text-anchor="middle" font-size="9" fill="#d6a040">[{K:4},{O:1,N:1}]</text>

  <!-- ===== row 6: S (atom) ===== -->
  <rect x="30" y="198" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="215" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="66" y="198" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">S</text>
  <rect x="120" y="198" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="215" text-anchor="middle" font-size="9.5" fill="#333">原子 S×1</text>
  <rect x="270" y="198" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="10" fill="#333">{S:1}</text>
  <rect x="430" y="198" width="160" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="215" text-anchor="middle" font-size="9" fill="#888">[{K:4},{O:1,N:1}]</text>

  <!-- ===== row 7: O3 (atom) ===== -->
  <rect x="30" y="224" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="241" text-anchor="middle" font-size="10" fill="#333">7</text>
  <rect x="66" y="224" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="93" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O3</text>
  <rect x="120" y="224" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="241" text-anchor="middle" font-size="9.5" fill="#333">原子 O×3</text>
  <rect x="270" y="224" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="241" text-anchor="middle" font-size="10" fill="#333">{S:1, O:3}</text>
  <rect x="430" y="224" width="160" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="241" text-anchor="middle" font-size="9" fill="#888">[{K:4},{O:1,N:1}]</text>

  <!-- ===== row 8: )2 (pop, red) ===== -->
  <rect x="30" y="250" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="48" y="267" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">8</text>
  <rect x="66" y="250" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="93" y="267" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">)2</text>
  <rect x="120" y="250" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="195" y="267" text-anchor="middle" font-size="9" fill="#333">弹栈 cur×2 并入 top</text>
  <rect x="270" y="250" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="267" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">{O:7, N:1, S:2}</text>
  <rect x="430" y="250" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="510" y="267" text-anchor="middle" font-size="10" fill="#b85450">[{K:4}]</text>

  <!-- ===== row 9: )2 (pop, red) ===== -->
  <rect x="30" y="276" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="48" y="293" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9</text>
  <rect x="66" y="276" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="93" y="293" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">)2</text>
  <rect x="120" y="276" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="195" y="293" text-anchor="middle" font-size="9" fill="#333">弹栈 cur×2 并入 top</text>
  <rect x="270" y="276" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="293" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">{K:4,O:14,N:2,S:4}</text>
  <rect x="430" y="276" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="510" y="293" text-anchor="middle" font-size="10" fill="#b85450">[]</text>

  <!-- ===== merge detail note ===== -->
  <line x1="30" y1="316" x2="590" y2="316" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="336" font-size="10.5" fill="#888" font-weight="bold">第 8 步合并细节（内层 )2）：</text>
  <rect x="30" y="344" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="10.5" fill="#333">cur={S:1,O:3} ×2 = {S:2,O:6}　并入 top={O:1,N:1}</text>
  <text x="300" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">→ O:1+6=7, N:1, S:2　= {O:7,N:1,S:2}（同名原子累加，非覆盖）</text>

  <!-- ===== sort + output ===== -->
  <text x="30" y="416" font-size="10.5" fill="#888" font-weight="bold">第 9 步后 cur 即最终计数，按原子名字典序排序输出：</text>
  <rect x="30" y="424" width="540" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="11" fill="#333">排序：H &lt; He &lt; K &lt; Mg &lt; N &lt; O &lt; S　→　K, N, O, S</text>
  <text x="300" y="462" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出：K4N2O14S4</text>

  <!-- legend -->
  <rect x="30" y="490" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="501" font-size="9" fill="#555">原子读入</text>
  <rect x="120" y="490" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="501" font-size="9" fill="#555">( 压栈</text>
  <rect x="200" y="490" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="220" y="501" font-size="9" fill="#555">) 弹栈合并</text>
</svg>
