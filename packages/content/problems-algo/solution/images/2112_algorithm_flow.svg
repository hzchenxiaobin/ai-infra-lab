<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：拆行 → 聚合 → 取最大</text>

  <!-- ===== Step 1: Flights table ===== -->
  <rect x="120" y="40" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① Flights 表</text>
  <text x="260" y="72" text-anchor="middle" font-size="9" fill="#888">departure_airport, arrival_airport, flights_count</text>

  <!-- Arrow down -->
  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: UNION ALL ===== -->
  <rect x="80" y="104" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② UNION ALL 拆行（逆透视）</text>
  <text x="260" y="140" text-anchor="middle" font-size="9" fill="#555">SELECT departure_airport AS airport_id, flights_count</text>
  <text x="260" y="153" text-anchor="middle" font-size="9" fill="#555">UNION ALL  SELECT arrival_airport, flights_count</text>

  <!-- Arrow down -->
  <path d="M 260 162 L 260 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: GROUP BY + SUM ===== -->
  <rect x="100" y="182" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ GROUP BY airport_id + SUM(flights_count)</text>
  <text x="260" y="220" text-anchor="middle" font-size="9" fill="#555">每机场的出发航班 + 到达航班 总数 = total</text>

  <!-- Arrow down -->
  <path d="M 260 234 L 260 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: WHERE = MAX (diamond decision) ===== -->
  <polygon points="260,254 390,294 260,334 130,294" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ WHERE total =</text>
  <text x="260" y="304" text-anchor="middle" font-size="10" fill="#b85450">(SELECT MAX(total))</text>
  <text x="260" y="318" text-anchor="middle" font-size="9" fill="#b85450">并列全部保留</text>

  <!-- Arrow down -->
  <path d="M 260 336 L 260 356" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Output ===== -->
  <rect x="160" y="360" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 输出 airport_id</text>
  <text x="260" y="396" text-anchor="middle" font-size="9" fill="#888">流量最大的机场（可能多个）</text>

  <!-- Side notes -->
  <rect x="395" y="104" width="110" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="402" y="120" font-size="8" fill="#b85450" font-weight="bold">⚠️ UNION ALL</text>
  <text x="402" y="134" font-size="8" fill="#777">非 UNION！</text>
  <text x="402" y="148" font-size="8" fill="#777">UNION 去重会丢行</text>

  <rect x="395" y="254" width="110" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="402" y="270" font-size="8" fill="#4a7a3a" font-weight="bold">💡 并列处理</text>
  <text x="402" y="284" font-size="8" fill="#777">= MAX 自然保留</text>
  <text x="402" y="298" font-size="8" fill="#777">所有并列最大值</text>

  <text x="260" y="426" text-anchor="middle" font-size="9.5" fill="#aaa">CTE 两层：AirportTraffic（拆行）→ AirportTotal（聚合）→ 子查询取 MAX</text>
</svg>
