<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：求和子数组 = 原始前缀 + 变换中段 + 原始后缀</text>

  <!-- 第一行：原数组 -->
  <text x="66" y="66" font-size="12" fill="#555" filter="url(#rough2)">nums:</text>
  <text x="253" y="42" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">操作子数组 ×k</text>
  <rect x="132" y="48" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="48" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-2</text>
  <rect x="224" y="48" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="270" y="48" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="291" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="316" y="48" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-5</text>

  <path d="M 251 82 C 251 90, 251 92, 251 98" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="94" font-size="11" fill="#888" filter="url(#rough2)">乘以 k=2</text>

  <!-- 第二行：结果数组 -->
  <text x="66" y="118" font-size="12" fill="#555" filter="url(#rough2)">结果 b:</text>
  <rect x="132" y="100" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="100" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-2</text>
  <rect x="224" y="100" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="270" y="100" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="316" y="100" width="42" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-5</text>
  <rect x="221" y="96" width="94" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="253" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">和最大子数组 6+8 = 14</text>

  <!-- 三段结构条 -->
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">求和子数组的三段结构：</text>
  <rect x="45" y="190" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="211" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">原始前缀 → dp0</text>
  <path d="M 175 206 L 195 206" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="190" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="211" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">×k / ÷k 中段 → dp1, dp2</text>
  <path d="M 355 206 L 375 206" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="375" y="190" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="211" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">原始后缀 → dp3</text>

  <!-- 状态机 -->
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">沿数组从左到右的状态转移（Kadane 式，每段可空、可随时重开）：</text>

  <path d="M 105 268 C 85 250, 135 246, 128 266" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="262" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">重开</text>

  <rect x="50" y="270" width="115" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="107" y="286" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dp0</text>
  <text x="107" y="301" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">还没开始操作</text>

  <rect x="225" y="258" width="125" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="287" y="274" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dp1：×k 进行中</text>
  <text x="287" y="289" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">元素取 v·k</text>

  <rect x="225" y="318" width="125" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="287" y="334" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dp2：÷k 进行中</text>
  <text x="287" y="349" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">元素取 trunc(v/k)</text>

  <rect x="405" y="288" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dp3</text>
  <text x="455" y="319" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">操作已结束</text>

  <path d="M 165 282 C 195 278, 195 274, 223 272" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="264" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">开始乘</text>
  <path d="M 165 296 C 195 306, 195 330, 223 336" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="322" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">开始除</text>
  <path d="M 350 272 C 380 274, 380 288, 403 296" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">结束操作</text>
  <path d="M 350 336 C 380 330, 380 316, 403 310" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">结束操作</text>

  <rect x="140" y="368" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans = max over i of (dp0..dp3)</text>
</svg>
