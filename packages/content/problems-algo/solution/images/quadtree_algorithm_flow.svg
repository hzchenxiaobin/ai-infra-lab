<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：build(x, y, len) 递归</text>

  <!-- Start: entry -->
  <rect x="200" y="44" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">build(x, y, len) 进入</text>
  <path d="M 280 80 L 280 96" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- len==1 base -->
  <polygon points="280,96 380,124 280,152 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">len == 1 ?</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#d6a040">（单格必为叶）</text>

  <!-- Yes branch -->
  <text x="148" y="128" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 180 124 L 120 124 L 120 168" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="170" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回叶子</text>
  <text x="120" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a">val=grid[x][y], isLeaf=1</text>

  <!-- No branch: check uniform -->
  <text x="392" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 152 L 280 168" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <polygon points="280,170 410,206 280,242 150,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">子块全同值 ?</text>
  <text x="280" y="219" text-anchor="middle" font-size="11" fill="#d6a040">（扫描 [x,x+len)×[y,y+len)）</text>

  <!-- Yes: leaf -->
  <text x="118" y="206" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 206 L 120 206 L 120 250" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <rect x="32" y="252" width="176" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回叶子</text>
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a">val=首值, isLeaf=1</text>

  <!-- No: split 4 -->
  <text x="422" y="206" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 242 L 280 258" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="260" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">half = len / 2</text>
  <path d="M 280 292 L 280 306" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- 4 recursive calls -->
  <g filter="url(#rough2)">
    <rect x="40" y="308" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="95" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">TL: build(x,y,half)</text>
    <text x="95" y="335" text-anchor="middle" font-size="10" fill="#b85450">左上</text>

    <rect x="160" y="308" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="215" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">TR: build(x,y+half,half)</text>
    <text x="215" y="335" text-anchor="middle" font-size="10" fill="#b85450">右上</text>

    <rect x="280" y="308" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="335" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">BL: build(x+half,y,half)</text>
    <text x="335" y="335" text-anchor="middle" font-size="10" fill="#b85450">左下</text>

    <rect x="400" y="308" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="455" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">BR: build(x+half,y+half,half)</text>
    <text x="455" y="335" text-anchor="middle" font-size="10" fill="#b85450">右下</text>
  </g>
  <!-- arrows from half box to 4 calls -->
  <path d="M 280 306 L 280 308" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 230 296 L 95 308" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 265 296 L 215 308" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 295 296 L 335 308" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 330 296 L 455 308" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- combine -->
  <path d="M 95 342 L 95 352 L 455 352 L 455 342" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 275 352 L 275 360" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="362" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">返回内部节点 isLeaf=0</text>
</svg>
