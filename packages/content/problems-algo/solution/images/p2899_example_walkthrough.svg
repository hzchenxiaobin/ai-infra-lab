<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="650" height="380" fill="#fafafa"/>

  <text x="325" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [1, −1, 2, −1, −1]</text>
  <text x="325" y="44" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">seen 左端 = 头部 = 栈顶（最近访问）；k = 连续 −1 计数（回看深度）</text>

  <!-- grid -->
  <g stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 28 64 L 624 64"/>
    <path d="M 28 94 L 624 94" stroke-width="1.6"/>
    <path d="M 28 140 L 624 140"/>
    <path d="M 28 186 L 624 186"/>
    <path d="M 28 232 L 624 232"/>
    <path d="M 28 278 L 624 278"/>
    <path d="M 28 324 L 624 324"/>
    <path d="M 28 64 L 28 324"/>
    <path d="M 64 64 L 64 324"/>
    <path d="M 114 64 L 114 324"/>
    <path d="M 322 64 L 322 324"/>
    <path d="M 450 64 L 450 324"/>
    <path d="M 484 64 L 484 324"/>
    <path d="M 624 64 L 624 324"/>
  </g>

  <!-- header -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#446688">
    <text x="46" y="83" text-anchor="middle">步骤</text>
    <text x="89" y="83" text-anchor="middle">读入 x</text>
    <text x="218" y="83" text-anchor="middle">动作</text>
    <text x="386" y="83" text-anchor="middle">seen（左=头）</text>
    <text x="467" y="83" text-anchor="middle">k</text>
    <text x="554" y="83" text-anchor="middle">ans</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="46" y="121" text-anchor="middle">①</text>
    <text x="89" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c22">1</text>
    <text x="218" y="121" text-anchor="middle">正数：压栈，k 清零</text>
    <text x="386" y="121" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#2e5c22">1</tspan>]</text>
    <text x="467" y="121" text-anchor="middle" font-size="12">0</text>
    <text x="554" y="121" text-anchor="middle" font-size="12">[]</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="46" y="167" text-anchor="middle">②</text>
    <text x="89" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">−1</text>
    <text x="218" y="167" text-anchor="middle">k=1 ≤ len=1：取第 1 个</text>
    <text x="386" y="167" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#2e5c22">1</tspan>]</text>
    <text x="467" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">1</text>
    <text x="554" y="167" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#b85450">1</tspan>]</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="46" y="213" text-anchor="middle">③</text>
    <text x="89" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c22">2</text>
    <text x="218" y="213" text-anchor="middle">正数：压栈，k 清零</text>
    <text x="386" y="213" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#2e5c22">2</tspan>, 1]</text>
    <text x="467" y="213" text-anchor="middle" font-size="12">0</text>
    <text x="554" y="213" text-anchor="middle" font-size="12">[1]</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="46" y="259" text-anchor="middle">④</text>
    <text x="89" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">−1</text>
    <text x="218" y="259" text-anchor="middle">k=1 ≤ len=2：取第 1 个（栈顶）</text>
    <text x="386" y="259" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#2e5c22">2</tspan>, 1]</text>
    <text x="467" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">1</text>
    <text x="554" y="259" text-anchor="middle" font-size="12">[1, <tspan font-weight="bold" fill="#b85450">2</tspan>]</text>
  </g>

  <!-- row 5 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="46" y="305" text-anchor="middle">⑤</text>
    <text x="89" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">−1</text>
    <text x="218" y="305" text-anchor="middle">k=2 ≤ len=2：取第 2 个</text>
    <text x="386" y="305" text-anchor="middle" font-size="12">[<tspan font-weight="bold" fill="#2e5c22">2</tspan>, 1]</text>
    <text x="467" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">2</text>
    <text x="554" y="305" text-anchor="middle" font-size="12">[1, 2, <tspan font-weight="bold" fill="#b85450">1</tspan>]</text>
  </g>

  <!-- result -->
  <rect x="120" y="342" width="410" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="325" y="363" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">最终 ans = [1, 2, 1]：三个 −1 依次取到 1 → 2 → 1</text>
</svg>
