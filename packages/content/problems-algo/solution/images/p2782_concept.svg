<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">交互式问题：通过 haveSameCategory 统计唯一类别数</text>

  <!-- hidden categories array -->
  <text x="20" y="56" font-size="11" fill="#888">隐藏数组 categories：</text>
  <rect x="150" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <rect x="188" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <rect x="226" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <rect x="264" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <rect x="302" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <rect x="340" y="42" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="60" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <text x="386" y="60" font-size="10" fill="#b85450">← 你的代码看不到</text>

  <!-- element indices -->
  <text x="168" y="88" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="206" y="88" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="244" y="88" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="282" y="88" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="358" y="88" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- CategoryHandler interface -->
  <rect x="60" y="108" width="420" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">CategoryHandler 接口（系统提供）</text>
  <text x="270" y="150" text-anchor="middle" font-size="11.5" fill="#446688">haveSameCategory(a, b) → bool</text>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#555">返回元素 a 和 b 是否属于同一类别</text>

  <!-- arrows from elements to handler -->
  <path d="M168,92 Q168,104 200,108" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M358,92 Q358,104 340,108" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- key insight -->
  <rect x="30" y="198" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键观察：同类关系是等价关系（自反 + 对称 + 传递）</text>
  <text x="270" y="238" text-anchor="middle" font-size="11" fill="#555">若 i 同类于 j、j 同类于 r，则 i 同类于 r → 只需对比代表元</text>

  <!-- goal -->
  <rect x="30" y="266" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">目标：仅用 haveSameCategory 统计不同类别的数量</text>

  <!-- example result -->
  <rect x="30" y="322" width="480" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#888">示例：n=6, categories=[1,1,2,2,3,3] → 输出 3</text>
</svg>
