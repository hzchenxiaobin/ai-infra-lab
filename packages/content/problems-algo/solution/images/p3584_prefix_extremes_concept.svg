<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">中间随便填，首尾距离 ≥ m−1 即成子序列</text>

  <!-- 首尾约束弧线 -->
  <path d="M 136 58 C 170 34, 350 34, 380 56" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="258" y="40" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j − i ≥ m − 1 = 2</text>

  <!-- 数组格子：nums = [1,3,-5,5,6,-4] -->
  <rect x="46" y="62" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="77" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="74" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">1</text>

  <rect x="108" y="62" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="136" y="77" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">#1</text>
  <text x="136" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>

  <rect x="170" y="62" width="56" height="48" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="198" y="77" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#2</text>
  <text x="198" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#rough2)">−5</text>
  <path d="M 178 70 L 218 102" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="232" y="62" width="56" height="48" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="260" y="77" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#3</text>
  <text x="260" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#rough2)">5</text>
  <path d="M 240 70 L 280 102" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="294" y="62" width="56" height="48" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="322" y="77" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#4</text>
  <text x="322" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#rough2)">6</text>
  <path d="M 302 70 L 342 102" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="356" y="62" width="56" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="384" y="77" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#5</text>
  <text x="384" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">−4</text>

  <text x="136" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">首 i=1</text>
  <text x="248" y="126" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">中间 m−2 个：保序任选，与乘积无关</text>
  <text x="384" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">尾 j=5</text>

  <text x="260" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">乘积只看首尾 → 求 max nums[i] × nums[j]，约束 j ≥ i + m − 1</text>

  <!-- 第二部分：前缀双极值 -->
  <text x="260" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 枚举尾 j=5（m=3）→ 合法首 = 前缀 [0 .. j−m+1]</text>

  <text x="142" y="204" text-anchor="end" font-size="11" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">前缀 [0..3]</text>
  <rect x="150" y="184" width="46" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="203" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">1</text>
  <rect x="206" y="184" width="46" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="203" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <rect x="262" y="184" width="46" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="285" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−5</text>
  <rect x="318" y="184" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="341" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>

  <rect x="396" y="184" width="78" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">尾 −4</text>

  <!-- preMax / preMin -->
  <path d="M 341 216 L 341 232 L 266 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="96" y="232" width="170" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">preMax = 5（配正尾）</text>

  <path d="M 285 216 L 285 232 L 310 232" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="314" y="232" width="170" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">preMin = −5（配负尾）</text>

  <!-- 配对结果 -->
  <path d="M 399 262 L 399 278 L 320 278" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 435 212 L 435 278 L 400 278" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="170" y="284" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="265" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">−4 × (−5) = 20 ✓</text>

  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（尾 ≥ 0 配 preMax、尾 &lt; 0 配 preMin——两个乘积都算一遍取 max 最稳）</text>

  <rect x="60" y="352" width="400" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans = max( nums[j]×preMax, nums[j]×preMin )，j 从 m−1 扫到 n−1</text>
</svg>
