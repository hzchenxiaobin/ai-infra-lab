<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：26 个字母分属 3 行，预建 letter→row 映射，各字母同行即合法</text>

  <!-- ===== Keyboard rows ===== -->
  <!-- Row 1: q w e r t y u i o p (blue) -->
  <text x="40" y="82" font-size="11" fill="#446688" font-weight="bold">第 1 行</text>
  <rect x="72" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="91" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">q</text>
  <rect x="114" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="133" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">w</text>
  <rect x="156" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">e</text>
  <rect x="198" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">r</text>
  <rect x="240" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">t</text>
  <rect x="282" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="301" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">y</text>
  <rect x="324" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="343" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">u</text>
  <rect x="366" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">i</text>
  <rect x="408" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="427" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">o</text>
  <rect x="450" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="469" y="84" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">p</text>

  <!-- Row 2: a s d f g h j k l (green) -->
  <text x="40" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 行</text>
  <rect x="93" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="135" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">s</text>
  <rect x="177" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">d</text>
  <rect x="219" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">f</text>
  <rect x="261" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">g</text>
  <rect x="303" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">h</text>
  <rect x="345" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">j</text>
  <rect x="387" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">k</text>
  <rect x="429" y="106" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="128" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">l</text>

  <!-- Row 3: z x c v b n m (orange) -->
  <text x="40" y="170" font-size="11" fill="#d6a040" font-weight="bold">第 3 行</text>
  <rect x="135" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">z</text>
  <rect x="177" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">x</text>
  <rect x="219" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">c</text>
  <rect x="261" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">v</text>
  <rect x="303" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">b</text>
  <rect x="345" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">n</text>
  <rect x="387" y="150" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="172" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">m</text>

  <!-- divider -->
  <line x1="40" y1="206" x2="520" y2="206" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ===== Example: valid word "Alaska" (all row 2 green) ===== -->
  <text x="80" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">合法：Alaska → 全部属第 2 行</text>
  <rect x="80" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">A</text>
  <rect x="119" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">l</text>
  <rect x="158" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="197" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">s</text>
  <rect x="236" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">k</text>
  <rect x="275" y="242" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="293" y="265" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <text x="325" y="265" font-size="16" fill="#4a7a3a" font-weight="bold">✓ 同行</text>

  <!-- ===== Example: invalid word "Hello" (mixed rows) ===== -->
  <text x="80" y="306" font-size="12" fill="#b85450" font-weight="bold">非法：Hello → 混跨第 1、2 行</text>
  <rect x="80" y="316" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98" y="339" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">H</text>
  <rect x="119" y="316" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="339" text-anchor="middle" font-size="15" fill="#2a4a66" font-weight="bold">e</text>
  <rect x="158" y="316" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="339" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">l</text>
  <rect x="197" y="316" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="339" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">l</text>
  <rect x="236" y="316" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="339" text-anchor="middle" font-size="15" fill="#2a4a66" font-weight="bold">o</text>
  <text x="286" y="339" font-size="16" fill="#b85450" font-weight="bold">✗ 混行</text>

  <!-- caption -->
  <rect x="40" y="362" width="480" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#555">大小写无关：统一转小写后查表；预建 rowOf[26]，每个字母 O(1) 定位所属行</text>
</svg>
