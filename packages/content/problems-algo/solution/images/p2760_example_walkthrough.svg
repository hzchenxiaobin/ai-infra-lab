<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,2,5,4], threshold = 5</text>

  <!-- index row -->
  <text x="40" y="52" font-size="11" fill="#888">下标:</text>
  <text x="120" y="52" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="180" y="52" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="240" y="52" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="300" y="52" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- value cells -->
  <rect x="100" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- parity labels -->
  <text x="122" y="108" text-anchor="middle" font-size="10" fill="#d6a040">奇</text>
  <text x="182" y="108" text-anchor="middle" font-size="10" fill="#446688">偶</text>
  <text x="242" y="108" text-anchor="middle" font-size="10" fill="#d6a040">奇</text>
  <text x="302" y="108" text-anchor="middle" font-size="10" fill="#446688">偶</text>

  <!-- Steps table header -->
  <text x="40" y="138" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="90" y="138" font-size="12" fill="#444" font-weight="bold">i</text>
  <text x="130" y="138" font-size="12" fill="#444" font-weight="bold">值</text>
  <text x="180" y="138" font-size="12" fill="#444" font-weight="bold">判断</text>
  <text x="330" y="138" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="470" y="138" font-size="12" fill="#444" font-weight="bold">窗口</text>
  <text x="540" y="138" font-size="12" fill="#444" font-weight="bold">ans</text>
  <line x1="30" y1="144" x2="560" y2="144" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: i=0, 3 odd -> skip -->
  <text x="40" y="164" font-size="11" fill="#333">1</text>
  <text x="90" y="164" font-size="11" fill="#333">0</text>
  <text x="130" y="164" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="180" y="164" font-size="11" fill="#b85450">奇数，非合法起点</text>
  <text x="330" y="164" font-size="11" fill="#b85450">i++（跳过）</text>
  <text x="470" y="164" font-size="11" fill="#888">—</text>
  <text x="540" y="164" font-size="11" fill="#333">0</text>

  <!-- Step 2: i=1, 2 even & <=5 -> start -->
  <text x="40" y="184" font-size="11" fill="#333">2</text>
  <text x="90" y="184" font-size="11" fill="#333">1</text>
  <text x="130" y="184" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="180" y="184" font-size="11" fill="#4a7a3a">偶 &amp; 2≤5 ✓ 起点</text>
  <text x="330" y="184" font-size="11" fill="#4a7a3a">start=1; i++</text>
  <text x="470" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">[2]</text>
  <text x="540" y="184" font-size="11" fill="#333">1</text>

  <!-- Step 3: i=2, 5 <=5, odd!=even -->
  <text x="40" y="204" font-size="11" fill="#333">3</text>
  <text x="90" y="204" font-size="11" fill="#333">2</text>
  <text x="130" y="204" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="180" y="204" font-size="11" fill="#4a7a3a">5≤5 &amp; 奇≠偶 ✓</text>
  <text x="330" y="204" font-size="11" fill="#4a7a3a">扩展 i++</text>
  <text x="470" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">[2,5]</text>
  <text x="540" y="204" font-size="11" fill="#333">2</text>

  <!-- Step 4: i=3, 4 <=5, even!=odd -->
  <text x="40" y="224" font-size="11" fill="#333">4</text>
  <text x="90" y="224" font-size="11" fill="#333">3</text>
  <text x="130" y="224" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="180" y="224" font-size="11" fill="#4a7a3a">4≤5 &amp; 偶≠奇 ✓</text>
  <text x="330" y="224" font-size="11" fill="#4a7a3a">扩展 i++</text>
  <text x="470" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">[2,5,4]</text>
  <text x="540" y="224" font-size="11" fill="#333" font-weight="bold">3 ⭐</text>

  <!-- Step 5: i=4 == n, stop -->
  <text x="40" y="244" font-size="11" fill="#333">5</text>
  <text x="90" y="244" font-size="11" fill="#333">4</text>
  <text x="130" y="244" font-size="11" fill="#888">—</text>
  <text x="180" y="244" font-size="11" fill="#888">i = n，越界</text>
  <text x="330" y="244" font-size="11" fill="#888">窗口结束，跳到 i=4</text>
  <text x="470" y="244" font-size="11" fill="#888">—</text>
  <text x="540" y="244" font-size="11" fill="#333">3</text>

  <!-- result box -->
  <rect x="60" y="272" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3，最长子数组 [2,5,4]（下标 1–3）</text>
  <text x="290" y="314" text-anchor="middle" font-size="11" fill="#888">i 只增不减：跳过 0、扩展 1→3、结束于 4，共推进 4 次 = O(n)</text>

  <!-- legend -->
  <rect x="60" y="340" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="351" font-size="10" fill="#555">偶数</text>
  <rect x="130" y="340" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="150" y="351" font-size="10" fill="#555">奇数</text>
  <rect x="200" y="340" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="220" y="351" font-size="10" fill="#555">合法扩展</text>
  <rect x="290" y="340" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="310" y="351" font-size="10" fill="#555">跳过</text>
  <text x="370" y="351" font-size="10" fill="#888">⭐ = 全局最大</text>
</svg>
