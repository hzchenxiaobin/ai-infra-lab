<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心扩张：maxReach 像可推进的右边界</text>

  <!-- number line -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <polygon points="520,200 512,196 512,204" fill="#888" filter="url(#rough2)"/>

  <!-- ticks 0..5 -->
  <g font-size="11" fill="#888">
    <line x1="70" y1="196" x2="70" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="222" text-anchor="middle">0</text>
    <line x1="150" y1="196" x2="150" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="222" text-anchor="middle">1</text>
    <line x1="230" y1="196" x2="230" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="230" y="222" text-anchor="middle">2</text>
    <line x1="310" y1="196" x2="310" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="310" y="222" text-anchor="middle">3</text>
    <line x1="390" y1="196" x2="390" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="390" y="222" text-anchor="middle">4</text>
    <line x1="470" y1="196" x2="470" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="470" y="222" text-anchor="middle">5</text>
  </g>

  <!-- nums values above ticks -->
  <text x="70" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="150" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="230" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="310" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="390" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- ========= Step 1: i=0, maxReach 0 -> 3 ========= -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">步骤1：i=0 可达，从 0 可跳到 3 → maxReach = 3</text>
  <!-- coverage bracket 0..3 -->
  <path d="M 70 130 L 70 124 L 310 124 L 310 130" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">覆盖 [0,3]</text>
  <!-- maxReach marker -->
  <rect x="300" y="92" width="20" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="86" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">maxReach=3</text>

  <!-- ========= Step 2: i=1,2,3 push no further, stuck at 3 ========= -->
  <text x="40" y="252" font-size="12" fill="#4a7a3a" font-weight="bold">步骤2-4：i=1,2,3 均在边界内，但都跳不过 3</text>
  <path d="M 150 250 L 150 256 L 310 256 L 310 250" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="230" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a">i=1 覆盖到 3</text>
  <path d="M 230 282 L 230 288 L 310 288 L 310 282" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="9.5" fill="#888">i=2 覆盖到 3</text>
  <path d="M 310 314 L 310 320" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="320" y="326" font-size="9.5" fill="#b85450" font-weight="bold">i=3 是 0，卡住</text>

  <!-- ========= Step 5: i=4 > maxReach -> false ========= -->
  <text x="40" y="358" font-size="12" fill="#b85450" font-weight="bold">步骤5：i=4 &gt; maxReach(3) → 断点，返回 false</text>
  <circle cx="390" cy="200" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 312 200 L 378 200" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">越不过</text>

  <!-- note box -->
  <rect x="40" y="378" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#444">0 不是必然失败：本例因 0 把边界卡死才失败</text>
</svg>
