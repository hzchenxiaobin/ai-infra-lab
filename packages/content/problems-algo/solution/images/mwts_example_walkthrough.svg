<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：pos=[1,1,2,2,3,3,5], k=2</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888">best[0]=0；逐 i 求 lo[i]、cnt、best[lo[i]]，最大 ans=7（i=6 行）</text>

  <!-- table: x start 115, cols end 485 -->
  <!-- column x-starts: i 115, pos 155, l 210, cnt 250, best[l] 295, ans 360, best[i+1] 405 -->
  <!-- header -->
  <rect x="115" y="54" width="370" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="135" y="71">i</text>
    <text x="182" y="71">pos[i]</text>
    <text x="230" y="71">l</text>
    <text x="272" y="71">cnt</text>
    <text x="327" y="71">best[l]</text>
    <text x="382" y="71">ans</text>
    <text x="445" y="71">best[i+1]</text>
  </g>

  <!-- vertical separators for all rows -->
  <g stroke="#bbb" stroke-width="0.8" filter="url(#rough2)">
    <line x1="155" y1="54" x2="155" y2="234"/>
    <line x1="210" y1="54" x2="210" y2="234"/>
    <line x1="250" y1="54" x2="250" y2="234"/>
    <line x1="295" y1="54" x2="295" y2="234"/>
    <line x1="360" y1="54" x2="360" y2="234"/>
    <line x1="405" y1="54" x2="405" y2="234"/>
  </g>

  <!-- data rows; row height 25 starting y=80 -->
  <!-- row i=0 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="96">0</text>
    <text x="182" y="96">1</text>
    <text x="230" y="96">0</text>
    <text x="272" y="96">1</text>
    <text x="327" y="96">0</text>
    <text x="382" y="96">1</text>
    <text x="445" y="96">1</text>
  </g>
  <!-- row i=1 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="121">1</text>
    <text x="182" y="121">1</text>
    <text x="230" y="121">0</text>
    <text x="272" y="121">2</text>
    <text x="327" y="121">0</text>
    <text x="382" y="121">2</text>
    <text x="445" y="121">2</text>
  </g>
  <!-- row i=2 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="146">2</text>
    <text x="182" y="146">2</text>
    <text x="230" y="146">0</text>
    <text x="272" y="146">3</text>
    <text x="327" y="146">0</text>
    <text x="382" y="146">3</text>
    <text x="445" y="146">3</text>
  </g>
  <!-- row i=3 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="171">3</text>
    <text x="182" y="171">2</text>
    <text x="230" y="171">0</text>
    <text x="272" y="171">4</text>
    <text x="327" y="171">0</text>
    <text x="382" y="171">4</text>
    <text x="445" y="171">4</text>
  </g>
  <!-- row i=4 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="196">4</text>
    <text x="182" y="196">3</text>
    <text x="230" y="196">0</text>
    <text x="272" y="196">5</text>
    <text x="327" y="196">0</text>
    <text x="382" y="196">5</text>
    <text x="445" y="196">5</text>
  </g>
  <!-- row i=5 -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="135" y="221">5</text>
    <text x="182" y="221">3</text>
    <text x="230" y="221">0</text>
    <text x="272" y="221">6</text>
    <text x="327" y="221">0</text>
    <text x="382" y="221">6</text>
    <text x="445" y="221">6</text>
  </g>

  <!-- row i=6 (highlight) -->
  <rect x="115" y="226" width="370" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="10" font-weight="bold" text-anchor="middle">
    <text x="135" y="244" fill="#333">6</text>
    <text x="182" y="244" fill="#333">5</text>
    <text x="230" y="244" fill="#b85450">4</text>
    <text x="272" y="244" fill="#d6a040">3</text>
    <text x="327" y="244" fill="#446688">4</text>
    <text x="382" y="244" fill="#4a7a3a">7</text>
    <text x="445" y="244" fill="#333">6</text>
  </g>

  <!-- bottom note -->
  <rect x="115" y="262" width="370" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">i=6：cnt=3 + best[4]=4 = 7；左段右端点&lt;4 → [0,2] 覆盖 4 件，不重叠</text>
</svg>
