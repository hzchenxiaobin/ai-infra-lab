<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,12,−5,−6,50,3]，k = 4</text>

  <!-- ===================== Panel 0: 窗口 [0..3] ===================== -->
  <rect x="20" y="40" width="160" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="40" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口 [0..3]</text>

  <!-- nums cells (6 cells, w=22, start x=28) -->
  <text x="24" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="28" y="78" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="39" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="50" y="78" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="61" y="93" text-anchor="middle" font-size="10" fill="#333">12</text>
  <rect x="72" y="78" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="83" y="93" text-anchor="middle" font-size="10" fill="#333">−5</text>
  <rect x="94" y="78" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="93" text-anchor="middle" font-size="10" fill="#333">−6</text>
  <rect x="116" y="78" width="22" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="127" y="93" text-anchor="middle" font-size="10" fill="#999">50</text>
  <rect x="138" y="78" width="22" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>

  <text x="24" y="124" font-size="10" fill="#888">sum：</text>
  <text x="100" y="124" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1+12−5−6 = 2</text>
  <text x="24" y="148" font-size="10" fill="#888">avg：</text>
  <text x="100" y="148" text-anchor="middle" font-size="12" fill="#888">2/4 = 0.50</text>

  <rect x="32" y="166" width="136" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxSum = 2</text>

  <text x="100" y="216" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">首窗：O(k) 求和</text>
  <text x="100" y="232" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">初始化 maxSum</text>

  <!-- ===================== Panel 1: 窗口 [1..4] ===================== -->
  <rect x="200" y="40" width="160" height="300" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="40" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口 [1..4] ★</text>

  <text x="204" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="208" y="78" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="241" y="93" text-anchor="middle" font-size="10" fill="#333">12</text>
  <rect x="252" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="263" y="93" text-anchor="middle" font-size="10" fill="#333">−5</text>
  <rect x="274" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="93" text-anchor="middle" font-size="10" fill="#333">−6</text>
  <rect x="296" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50</text>
  <rect x="318" y="78" width="22" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="329" y="93" text-anchor="middle" font-size="10" fill="#999">3</text>

  <text x="204" y="124" font-size="10" fill="#888">更新：</text>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1 + 50</text>
  <text x="204" y="148" font-size="10" fill="#888">sum：</text>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 −1 +50 = 51</text>

  <rect x="212" y="166" width="136" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxSum = 51 ★</text>

  <text x="280" y="216" text-anchor="middle" font-size="9.5" fill="#b85450" font-style="italic">增量：左出 nums[0]</text>
  <text x="280" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-style="italic">右入 nums[4]</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">avg = 12.75</text>

  <!-- ===================== Panel 2: 窗口 [2..5] ===================== -->
  <rect x="380" y="40" width="160" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="380" y="40" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口 [2..5]</text>

  <text x="384" y="86" font-size="10" fill="#888">nums:</text>
  <rect x="388" y="78" width="22" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="399" y="93" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="410" y="78" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="421" y="93" text-anchor="middle" font-size="10" fill="#b85450">12</text>
  <rect x="432" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="93" text-anchor="middle" font-size="10" fill="#333">−5</text>
  <rect x="454" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="465" y="93" text-anchor="middle" font-size="10" fill="#333">−6</text>
  <rect x="476" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="487" y="93" text-anchor="middle" font-size="10" fill="#333">50</text>
  <rect x="498" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="509" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>

  <text x="384" y="124" font-size="10" fill="#888">更新：</text>
  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−12 + 3</text>
  <text x="384" y="148" font-size="10" fill="#888">sum：</text>
  <text x="460" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">51 −12 +3 = 42</text>

  <rect x="392" y="166" width="136" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxSum 仍 51</text>

  <text x="460" y="216" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">42 &lt; 51，不更新</text>
  <text x="460" y="232" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">左出 nums[1]</text>
  <text x="460" y="256" text-anchor="middle" font-size="10" fill="#888">avg = 10.50</text>

  <!-- bottom summary -->
  <rect x="20" y="356" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终 maxSum = 51，返回 51 / 4 = 12.75000</text>
</svg>
