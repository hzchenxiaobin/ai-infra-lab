<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：等价转化为「穿过」，求最大掉落时间</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 n, left[], right[]</text>

  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Transform box -->
  <rect x="100" y="104" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键转化：蚂蚁碰撞 ⟺ 穿过对方</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#555">每只蚂蚁沿原方向直走，直到从木板一端掉落</text>

  <path d="M 280 150 L 280 168" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Split into two branches -->
  <path d="M 280 170 L 150 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 170 L 410 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Left branch: left-moving ants -->
  <rect x="40" y="194" width="220" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">向左走的蚂蚁</text>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#555">位置 p → 从左端 0 掉落</text>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">掉落时间 = p</text>

  <!-- Right branch: right-moving ants -->
  <rect x="300" y="194" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">向右走的蚂蚁</text>
  <text x="410" y="232" text-anchor="middle" font-size="11" fill="#555">位置 p → 从右端 n 掉落</text>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">掉落时间 = n − p</text>

  <!-- arrows down -->
  <path d="M 150 266 L 150 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 266 L 410 286" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- max boxes -->
  <rect x="70" y="290" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxLeft = max(left)</text>

  <rect x="330" y="290" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxRight = max(n−p)</text>

  <!-- converge -->
  <path d="M 150 326 L 270 346" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 326 L 290 346" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="170" y="350" width="220" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = max(maxLeft, maxRight)</text>
</svg>
