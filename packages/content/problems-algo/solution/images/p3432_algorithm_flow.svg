<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">O(n) 数学解法：求和一趟，按奇偶性直接出答案</text>

  <rect x="205" y="42" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 74 L 260 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="100" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333">total = Σ nums[i]</text>

  <path d="M 260 136 L 260 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,160 355,192 260,224 165,192" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total 是偶数？</text>

  <path d="M 355 192 L 398 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <path d="M 260 224 L 260 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="244" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="402" y="174" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 n − 1</text>

  <rect x="205" y="256" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 0</text>

  <rect x="40" y="308" width="440" height="42" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="10" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="10" fill="#555">验证：[10,10,3,7,6] total=36 偶 → 4 ✓   [1,2,2] total=5 奇 → 0 ✓</text>
  <text x="260" y="341" text-anchor="middle" font-size="10" fill="#555">[2,4,6,8] total=20 偶 → 3 ✓</text>
</svg>
