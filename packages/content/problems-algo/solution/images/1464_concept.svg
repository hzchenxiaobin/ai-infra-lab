<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：所有元素 ≥ 1，减 1 后非负，挑最大的两个即得最大乘积</text>

  <!-- Array row -->
  <text x="30" y="74" font-size="12" fill="#888">nums =</text>
  <rect x="80" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="132" y="58" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="157" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第二大</text>
  <rect x="184" y="58" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="209" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最大</text>
  <rect x="236" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- why top 2: monotonicity -->
  <text x="30" y="134" font-size="12" fill="#444" font-weight="bold">为什么挑最大的两个？</text>
  <rect x="30" y="142" width="500" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11.5" fill="#333">约束 nums[i] ≥ 1 ⟹ nums[i] − 1 ≥ 0，两个非负数相乘</text>
  <text x="280" y="178" text-anchor="middle" font-size="11.5" fill="#333">乘积随两因子同步增大 ⟹ 取最大、次大值即可</text>

  <!-- formula -->
  <text x="30" y="216" font-size="12" fill="#444" font-weight="bold">目标式与化简：</text>
  <rect x="80" y="224" width="400" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">max (nums[i]−1)(nums[j]−1) = (max1−1)(max2−1)</text>

  <!-- link top2 to formula -->
  <path d="M 209 92 L 209 110 L 380 110 L 380 224" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 157 92 L 157 120 L 200 120 L 200 224" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute -->
  <text x="30" y="280" font-size="12" fill="#444" font-weight="bold">代入示例：</text>
  <rect x="80" y="288" width="380" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#333">(5−1) × (4−1) = 4 × 3 = 12 ⭐</text>

  <!-- footer -->
  <rect x="40" y="338" width="480" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#555">问题转化为：一趟扫描找「最大值 max1」与「次大值 max2」</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#888">无需排序，O(n) 时间、O(1) 空间即可拿到前两大</text>
</svg>
