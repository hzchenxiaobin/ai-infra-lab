<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：双轨 DP 逐位扫描</text>

  <!-- Step 1: Init -->
  <rect x="90" y="42" width="340" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：nums[0] 偶 → maxEven = nums[0], maxOdd = −∞</text>
  <text x="260" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">nums[0] 奇 → 对调</text>

  <!-- Arrow down -->
  <line x1="260" y1="84" x2="260" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop -->
  <rect x="120" y="102" width="280" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 i = 1 → n−1</text>

  <!-- Arrow down -->
  <line x1="260" y1="134" x2="260" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: parity check -->
  <polygon points="260,150 340,190 260,230 180,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[i] 奇偶?</text>

  <!-- Left branch: even -->
  <line x1="180" y1="190" x2="130" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="183" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶</text>

  <rect x="30" y="215" width="200" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp = max(maxEven + nums[i],</text>
  <text x="130" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxOdd + nums[i] − x)</text>

  <line x1="130" y1="267" x2="130" y2="283" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="285" width="160" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="305" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxEven = max(maxEven, dp)</text>

  <!-- Right branch: odd -->
  <line x1="340" y1="190" x2="390" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇</text>

  <rect x="290" y="215" width="200" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="236" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp = max(maxOdd + nums[i],</text>
  <text x="390" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxEven + nums[i] − x)</text>

  <line x1="390" y1="267" x2="390" y2="283" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="285" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="305" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">maxOdd = max(maxOdd, dp)</text>

  <!-- Merge arrows -->
  <path d="M130,315 Q130,345 260,345" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M390,315 Q390,345 260,345" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="345" x2="260" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back arrow (curved) -->
  <path d="M260,102 Q260,95 200,95 Q40,95 40,360 Q40,375 90,375" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="225" font-size="9" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- Final -->
  <rect x="100" y="372" width="320" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">return max(maxEven, maxOdd)</text>
</svg>
