<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">示例演算：[null,0,5,[0],[false,16]] → [5,[],[16]]</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">元素 (原值)</text>
  <rect x="160" y="44" width="180" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">① compactObject(元素)</text>
  <rect x="350" y="44" width="140" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">② Boolean(精简值)</text>
  <rect x="500" y="44" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="545" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">去留</text>

  <!-- 行1: null -->
  <rect x="30" y="78" width="120" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">null</text>
  <rect x="160" y="78" width="180" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">null（原始，原样返回）</text>
  <rect x="350" y="78" width="140" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="97" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">false ✗</text>
  <rect x="500" y="78" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="97" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删</text>

  <!-- 行2: 0 -->
  <rect x="30" y="112" width="120" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="160" y="112" width="180" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0（原始，原样返回）</text>
  <rect x="350" y="112" width="140" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="131" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">false ✗</text>
  <rect x="500" y="112" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="131" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删</text>

  <!-- 行3: 5 -->
  <rect x="30" y="146" width="120" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="160" y="146" width="180" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5（原始，原样返回）</text>
  <rect x="350" y="146" width="140" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>
  <rect x="500" y="146" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">留 5</text>

  <!-- 行4: [0] -->
  <rect x="30" y="180" width="120" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0]</text>
  <rect x="160" y="180" width="180" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[] （0 被过滤）</text>
  <rect x="350" y="180" width="140" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true ✓（空数组恒真）</text>
  <rect x="500" y="180" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">留 []</text>

  <!-- 行5: [false,16] -->
  <rect x="30" y="214" width="120" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[false,16]</text>
  <rect x="160" y="214" width="180" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[16]（false 被过滤）</text>
  <rect x="350" y="214" width="140" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>
  <rect x="500" y="214" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">留 [16]</text>

  <!-- 汇总箭头 -->
  <text x="310" y="270" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)" font-weight="bold">filter(Boolean) 汇总后重排索引</text>
  <path d="M 310 278 L 310 300" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="160" y="304" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)" font-weight="bold">输出 = [5, [], [16]]</text>

  <!-- 嵌套细节框 -->
  <rect x="30" y="368" width="560" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="390" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">💡 递归下钻细节（以 [false,16] 为例）</text>
  <text x="46" y="410" font-size="11" fill="#555" filter="url(#rough2)">[false,16] 是数组 → ① map(compactObject)：[false→false, 16→16]</text>
  <text x="46" y="428" font-size="11" fill="#555" filter="url(#rough2)">                ② filter(Boolean)：false 假值删掉，16 真值留 → [16]</text>
  <text x="46" y="446" font-size="11" fill="#555" filter="url(#rough2)">  父层再 Boolean([16]) = true → 留存。[0] 同理先精简成 []，因 Boolean([])=true 而留存。</text>
  <text x="46" y="462" font-size="11" fill="#d6a040" filter="url(#rough2)" font-weight="bold">关键：先精简子节点、再过滤——空容器（[] / {}）恒真，故空壳被保留。</text>
</svg>
