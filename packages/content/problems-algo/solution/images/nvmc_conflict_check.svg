<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">冲突检测：同一时刻同格则无效</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">两枚棋子同时移动，逐秒比较位置——任意一秒撞同格 → 冲突</text>

  <!-- ===== Case A: Conflict (both end at (8,1)) ===== -->
  <text x="140" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 冲突：两车都到 (8,1)</text>

  <g filter="url(#rough2)" font-size="9">
    <!-- 8x1 column strip, simplified as 8 cells vertically -->
    <!-- Left rook path: (1,1) -> (8,1), 7 steps down -->
    <text x="50" y="90" text-anchor="middle" font-size="9" fill="#446688">车 A</text>
    <text x="50" y="102" text-anchor="middle" font-size="8" fill="#888">(1,1)↓</text>

    <!-- cell (1,1) at t=0 -->
    <rect x="35" y="110" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="50" y="128" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t0</text>

    <rect x="35" y="142" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="35" y="174" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="35" y="206" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="35" y="238" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="35" y="270" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="35" y="302" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>

    <!-- cell (8,1) at t=7 -->
    <rect x="35" y="334" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="50" y="352" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t7</text>

    <path d="M 50 140 L 50 332" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)"/>

    <!-- Right rook path: (8,8) -> (8,1), 7 steps left, shown as row at bottom -->
    <text x="230" y="90" text-anchor="middle" font-size="9" fill="#446688">车 B</text>
    <text x="230" y="102" text-anchor="middle" font-size="8" fill="#888">(8,8)←</text>

    <!-- B's cells: (8,8) at t=0 ... (8,1) at t=7 -->
    <rect x="135" y="334" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="150" y="352" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">t7</text>
    <rect x="170" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="205" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="240" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="275" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="310" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="345" y="334" width="30" height="28" fill="#f5f5f5" stroke="#ccc" rx="4"/>
    <rect x="380" y="334" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="395" y="352" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">t0</text>

    <path d="M 380 348 L 168 348" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)"/>

    <!-- Both at (8,1) at t=7 -->
    <rect x="35" y="334" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="135" y="334" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="100" y="380" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">t=7 时两车同在 (8,1) → 冲突！</text>
  </g>

  <!-- divider -->
  <line x1="280" y1="70" x2="280" y2="395" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ===== Case B: Valid swap (adjacent) ===== -->
  <text x="420" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 有效：相邻交换位置</text>

  <g filter="url(#rough2)" font-size="9">
    <!-- Two rooks at (1,1) and (1,2), swap -->
    <text x="420" y="92" text-anchor="middle" font-size="9" fill="#888">车A: (1,1)→(1,2) 1步</text>
    <text x="420" y="104" text-anchor="middle" font-size="9" fill="#888">车B: (1,2)→(1,1) 1步</text>

    <!-- t=0 row -->
    <text x="312" y="128" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">t=0</text>
    <rect x="330" y="112" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="348" y="132" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A</text>
    <rect x="370" y="112" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="388" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">B</text>
    <text x="348" y="106" text-anchor="middle" font-size="8" fill="#888">(1,1)</text>
    <text x="388" y="106" text-anchor="middle" font-size="8" fill="#888">(1,2)</text>

    <!-- arrows down swap -->
    <path d="M 348 146 L 388 176" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2"/>
    <path d="M 388 146 L 348 176" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2"/>

    <!-- t=1 row -->
    <text x="312" y="196" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">t=1</text>
    <rect x="330" y="178" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="348" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">B</text>
    <rect x="370" y="178" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="388" y="198" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A</text>

    <!-- result -->
    <rect x="312" y="220" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="371" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">全程无同格 → 有效</text>

    <!-- explanation -->
    <text x="420" y="268" text-anchor="middle" font-size="9" fill="#888">两车直接相邻，下一秒</text>
    <text x="420" y="280" text-anchor="middle" font-size="9" fill="#888">互相占据对方位置</text>
    <text x="420" y="292" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">→ 题目允许交换</text>

    <!-- t=0 vs t=1 no overlap -->
    <rect x="312" y="305" width="118" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="6"/>
    <text x="371" y="318" text-anchor="middle" font-size="9" fill="#555">t=0: A≠B（不同格）</text>
    <text x="371" y="332" text-anchor="middle" font-size="9" fill="#555">t=1: A≠B（不同格）</text>
  </g>

  <!-- ===== Bottom key insight ===== -->
  <rect x="30" y="395" width="500" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">核心：逐秒模拟 min(t,steps)，任意一秒两子同格即剪枝</text>
</svg>
