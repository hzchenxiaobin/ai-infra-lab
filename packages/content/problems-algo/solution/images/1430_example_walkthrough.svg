<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组 arr 在同一棵树上的判定</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">树：0→1→{0,1}, 0→0→0 ；叶子序列 = [0,1,0,1] / [0,1,1,0] / [0,0,0]</text>

  <!-- table frame -->
  <rect x="20" y="56" width="520" height="248" fill="none" stroke="#cccccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="20" y="56" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="56" x2="150" y2="304" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="56" x2="300" y2="304" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="56" x2="410" y2="304" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="85" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arr</text>
  <text x="225" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">匹配路径</text>
  <text x="355" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">终止节点</text>
  <text x="475" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <!-- row separators -->
  <line x1="20" y1="140" x2="540" y2="140" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="222" x2="540" y2="222" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: arr=[0,1,0,1] -> true -->
  <text x="85" y="106" text-anchor="middle" font-size="11" fill="#333">[0,1,0,1]</text>
  <text x="225" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0→1→0→1</text>
  <text x="355" y="100" text-anchor="middle" font-size="11" fill="#333">值1的叶子</text>
  <text x="355" y="116" text-anchor="middle" font-size="9" fill="#888">(无左右孩子)</text>
  <rect x="448" y="94" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- row 2: arr=[0,1,1] -> false (internal) -->
  <text x="85" y="172" text-anchor="middle" font-size="11" fill="#333">[0,1,1]</text>
  <text x="225" y="172" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">0→1→1</text>
  <text x="355" y="166" text-anchor="middle" font-size="11" fill="#333">值1的内部节点</text>
  <text x="355" y="182" text-anchor="middle" font-size="9" fill="#b85450">未到叶 ✗</text>
  <rect x="448" y="160" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- row 3: arr=[0,0,1] -> false (mismatch) -->
  <text x="85" y="254" text-anchor="middle" font-size="11" fill="#333">[0,0,1]</text>
  <text x="225" y="254" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">0→0→(无1)</text>
  <text x="355" y="248" text-anchor="middle" font-size="11" fill="#333">走到 0 的子树</text>
  <text x="355" y="264" text-anchor="middle" font-size="9" fill="#b85450">第三位失配 ✗</text>
  <rect x="448" y="242" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- bottom note -->
  <rect x="60" y="312" width="440" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="10" fill="#8a6a20">关键：① 逐位值须全等  ② 序列用尽处必须恰是叶子（缺一即 false）</text>
</svg>
