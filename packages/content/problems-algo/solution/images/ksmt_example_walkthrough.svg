<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：m = 3, n = 3, k = 5（升序拍平 1,2,2,3,3,4,6,6,9 → 第 5 小 = 3）</text>

  <!-- table header -->
  <rect x="40" y="44" width="70" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="61" text-anchor="middle" font-size="11" fill="#888">轮次</text>
  <rect x="116" y="44" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="161" y="61" text-anchor="middle" font-size="11" fill="#888">[lo, hi]</text>
  <rect x="212" y="44" width="60" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="242" y="61" text-anchor="middle" font-size="11" fill="#888">mid</text>
  <rect x="278" y="44" width="200" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="378" y="61" text-anchor="middle" font-size="11" fill="#888">count = Σmin(⌊mid/i⌋,3)</text>
  <rect x="484" y="44" width="56" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="512" y="61" text-anchor="middle" font-size="11" fill="#888">判定</text>

  <!-- Round 1: [1,9] mid=5 count=6 >=5 hi=5 -->
  <rect x="40" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="93" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="116" y="74" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="93" text-anchor="middle" font-size="11" fill="#333">[1, 9]</text>
  <rect x="212" y="74" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="278" y="74" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="93" text-anchor="middle" font-size="11" fill="#333">3 + 2 + 1 = 6</text>
  <rect x="484" y="74" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="512" y="93" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi=5</text>

  <!-- Round 2: [1,5] mid=3 count=5 >=5 hi=3 -->
  <rect x="40" y="108" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="127" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="116" y="108" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="127" text-anchor="middle" font-size="11" fill="#333">[1, 5]</text>
  <rect x="212" y="108" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="278" y="108" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="127" text-anchor="middle" font-size="11" fill="#333">3 + 1 + 1 = 5</text>
  <rect x="484" y="108" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="512" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi=3</text>

  <!-- Round 3: [1,3] mid=2 count=3 <5 lo=3 -->
  <rect x="40" y="142" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="161" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="116" y="142" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="161" text-anchor="middle" font-size="11" fill="#333">[1, 3]</text>
  <rect x="212" y="142" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="278" y="142" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="161" text-anchor="middle" font-size="11" fill="#333">2 + 1 + 0 = 3</text>
  <rect x="484" y="142" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="512" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo=3</text>

  <!-- Round 4: lo==hi exit -->
  <rect x="40" y="178" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="197" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结束</text>
  <rect x="116" y="178" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="197" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[3, 3]</text>
  <rect x="212" y="178" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="242" y="197" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="278" y="178" width="200" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="378" y="197" text-anchor="middle" font-size="10" fill="#888">lo == hi，退出循环</text>
  <rect x="484" y="178" width="56" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="512" y="197" text-anchor="middle" font-size="10" fill="#888">返回</text>

  <!-- count detail box -->
  <rect x="40" y="232" width="500" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="252" font-size="11" fill="#444" font-weight="bold">count(mid) 逐行展开（i = 1, 2, 3 行，封顶 n = 3）：</text>
  <text x="60" y="274" font-size="11" fill="#333">mid=5: ⌊5/1⌋=5→min(5,3)=3;  ⌊5/2⌋=2→min(2,3)=2;  ⌊5/3⌋=1→min(1,3)=1;  合计 6</text>
  <text x="60" y="296" font-size="11" fill="#333">mid=3: ⌊3/1⌋=3→min(3,3)=3;  ⌊3/2⌋=1→min(1,3)=1;  ⌊3/3⌋=1→min(1,3)=1;  合计 5</text>
  <text x="60" y="318" font-size="11" fill="#333">mid=2: ⌊2/1⌋=2→min(2,3)=2;  ⌊2/2⌋=1→min(1,3)=1;  ⌊2/3⌋=0→min(0,3)=0;  合计 3</text>
  <text x="60" y="340" font-size="11" fill="#888">注：⌊mid/i⌋ 是「j ≤ mid/i」的最大整数 j；封顶 n 因为每行只有 n 列。</text>

  <!-- final answer -->
  <rect x="40" y="370" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="13" fill="#444">lo == hi == 3 收敛，且 3 是表中真实存在的值</text>
  <text x="290" y="416" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">answer = 3  ✓</text>

  <rect x="40" y="438" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="453" text-anchor="middle" font-size="10" fill="#b85450">mid=3 时 count 恰为 5 = k，但 mid=2 时 count=3 &lt; k ⇒ 分界点恰在 3</text>
</svg>
