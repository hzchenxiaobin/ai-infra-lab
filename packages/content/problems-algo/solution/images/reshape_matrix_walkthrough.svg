<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[1,2],[3,4]] → 1×4</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">m=2, n=2, r=1, c=4 ；m·n = 4 = r·c ✓</text>

  <!-- ===== Step table header ===== -->
  <rect x="40" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">idx</text>
  <rect x="100" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">原坐标 (i,j)</text>
  <rect x="210" y="60" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">值</text>
  <rect x="280" y="60" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">新坐标 (r',c')</text>
  <rect x="400" y="60" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans 填入后</text>

  <!-- ===== Row idx=0 ===== -->
  <rect x="40" y="90" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="155" y="109" text-anchor="middle" font-size="11.5" fill="#444">(0, 0) = 0÷2, 0%2</text>
  <rect x="210" y="90" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="340" y="109" text-anchor="middle" font-size="11.5" fill="#3a5a2a">(0, 0) = 0÷4, 0%4</text>
  <!-- ans after idx=0: [1, _, _, _] -->
  <rect x="400" y="90" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="414" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="90" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="90" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <rect x="490" y="90" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>

  <!-- ===== Row idx=1 ===== -->
  <rect x="40" y="122" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="155" y="141" text-anchor="middle" font-size="11.5" fill="#444">(0, 1) = 1÷2, 1%2</text>
  <rect x="210" y="122" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="141" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="340" y="141" text-anchor="middle" font-size="11.5" fill="#3a5a2a">(0, 1) = 1÷4, 1%4</text>
  <rect x="400" y="122" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="414" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="122" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="444" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="122" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <rect x="490" y="122" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>

  <!-- ===== Row idx=2 ===== -->
  <rect x="40" y="154" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="155" y="173" text-anchor="middle" font-size="11.5" fill="#444">(1, 0) = 2÷2, 2%2</text>
  <rect x="210" y="154" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="340" y="173" text-anchor="middle" font-size="11.5" fill="#3a5a2a">(0, 2) = 2÷4, 2%4</text>
  <rect x="400" y="154" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="414" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="154" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="444" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="154" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="474" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="490" y="154" width="28" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>

  <!-- ===== Row idx=3 ===== -->
  <rect x="40" y="186" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="155" y="205" text-anchor="middle" font-size="11.5" fill="#444">(1, 1) = 3÷2, 3%2</text>
  <rect x="210" y="186" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="340" y="205" text-anchor="middle" font-size="11.5" fill="#3a5a2a">(0, 3) = 3÷4, 3%4</text>
  <rect x="400" y="186" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="414" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="186" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="444" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="186" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="474" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="490" y="186" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="504" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- result box -->
  <rect x="120" y="240" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">最终结果 ans</text>
  <text x="280" y="276" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">[[1, 2, 3, 4]]  ✓</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="300" width="500" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">观察要点</text>
  <text x="48" y="348" font-size="11.5" fill="#444">① 只看 idx，原坐标 (i,j) 与新坐标 (r',c') 是同一 idx 的两种「除法分解」。</text>
  <text x="48" y="368" font-size="11.5" fill="#444">② 除数从 n 换成 c，坐标就从原形状跳到新形状，元素值不变。</text>
  <text x="48" y="388" font-size="11.5" fill="#b85450" font-weight="bold">③ 若 r·c ≠ m·n（如本例改 r=1,c=3），直接返回原 mat，不做任何搬运。</text>
</svg>
