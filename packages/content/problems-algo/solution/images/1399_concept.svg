<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按数位和分组，数位和取值有界 [1, 36]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">n ≤ 10⁴ → 最大数 9999 的数位和 = 36，只需 37 长计数数组（O(1) 空间）</text>

  <!-- digit sum examples -->
  <text x="40" y="78" font-size="11" fill="#666" font-weight="bold">数位和：</text>
  <g font-size="12">
    <rect x="92" y="62" width="92" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="138" y="81" text-anchor="middle" fill="#446688">13 → 1+3=4</text>
    <rect x="192" y="62" width="92" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="238" y="81" text-anchor="middle" fill="#446688">10 → 1+0=1</text>
    <rect x="292" y="62" width="68" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="326" y="81" text-anchor="middle" fill="#446688">7 → 7</text>
    <rect x="368" y="62" width="108" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="422" y="81" text-anchor="middle" fill="#d6a040" font-weight="bold">9999 → 36</text>
  </g>

  <path d="M 310 94 L 310 110" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="106" font-size="10" fill="#666">分组</text>

  <!-- Row 1: size=2 groups (highlighted orange, max size) -->
  <text x="40" y="128" font-size="11" fill="#d6a040" font-weight="bold">大小 = 2（最大）★</text>
  <g>
    <!-- group sum=1 -->
    <rect x="30" y="134" width="135" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="97" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">数位和 = 1</text>
    <text x="97" y="172" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">[ 1, 10 ]</text>
    <text x="97" y="186" text-anchor="middle" font-size="10" fill="#888">大小 = 2</text>
    <!-- group sum=2 -->
    <rect x="175" y="134" width="135" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="242" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">数位和 = 2</text>
    <text x="242" y="172" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">[ 2, 11 ]</text>
    <text x="242" y="186" text-anchor="middle" font-size="10" fill="#888">大小 = 2</text>
    <!-- group sum=3 -->
    <rect x="320" y="134" width="135" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="387" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">数位和 = 3</text>
    <text x="387" y="172" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">[ 3, 12 ]</text>
    <text x="387" y="186" text-anchor="middle" font-size="10" fill="#888">大小 = 2</text>
    <!-- group sum=4 -->
    <rect x="465" y="134" width="135" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="532" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">数位和 = 4</text>
    <text x="532" y="172" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">[ 4, 13 ]</text>
    <text x="532" y="186" text-anchor="middle" font-size="10" fill="#888">大小 = 2</text>
  </g>

  <!-- Row 2: size=1 groups (blue, smaller) -->
  <text x="40" y="214" font-size="11" fill="#446688" font-weight="bold">大小 = 1：</text>
  <g>
    <rect x="27" y="220" width="105" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="79" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 = 5</text>
    <text x="79" y="258" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">[ 5 ]</text>

    <rect x="142" y="220" width="105" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="194" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 = 6</text>
    <text x="194" y="258" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">[ 6 ]</text>

    <rect x="257" y="220" width="105" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="309" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 = 7</text>
    <text x="309" y="258" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">[ 7 ]</text>

    <rect x="372" y="220" width="105" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="424" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 = 8</text>
    <text x="424" y="258" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">[ 8 ]</text>

    <rect x="487" y="220" width="105" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="539" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">和 = 9</text>
    <text x="539" y="258" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">[ 9 ]</text>
  </g>

  <!-- result box -->
  <rect x="40" y="288" width="540" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最大组大小 = 2，有 4 个组并列最多 → 返回 4</text>
  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#888">不返回组的大小，而是返回「达到最大大小的组的个数」</text>

  <!-- bound analysis -->
  <rect x="40" y="352" width="540" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="374" font-size="12" fill="#4a7a3a" font-weight="bold">值域有界 → 计数数组 O(1) 空间</text>
  <text x="60" y="394" font-size="11" fill="#666">• n ≤ 10⁴，数位和 s ∈ [1, 36]（9999 → 36，10000 → 1）</text>
  <text x="60" y="412" font-size="11" fill="#666">• 开 cnt[37] 固定数组，cnt[s] 记录数位和为 s 的数字个数</text>
  <text x="60" y="428" font-size="11" fill="#4a7a3a">• 遍历 1..n 累加 → 找 max → 数等于 max 的个数，全程 O(1) 空间</text>
</svg>
