<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：压缩 → 整体翻 → 逐词翻</text>

  <!-- ===== 开始 ===== -->
  <ellipse cx="280" cy="50" rx="48" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">开始</text>

  <path d="M 280 68 L 280 80" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 1 ===== -->
  <rect x="90" y="84" width="380" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 原地压缩空格（slow=写指针 / fast=读指针）</text>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#555">跳前导空格 → 逐词拷贝 → 单词间补 1 空格</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#555">→ resize(slow) 截断尾部</text>

  <path d="M 280 160 L 280 172" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2 ===== -->
  <rect x="130" y="176" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="201" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② 整体翻转 reverse(0, n)</text>

  <path d="M 280 218 L 280 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 逐词翻转（含循环） ===== -->
  <rect x="90" y="234" width="380" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="257" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">③ 逐词翻转</text>
  <text x="110" y="279" font-size="11.5" fill="#444" font-family="'Comic Sans MS', monospace">for i = 0 to n:</text>
  <text x="110" y="297" font-size="11.5" fill="#444" font-family="'Comic Sans MS', monospace">  if i == n 或 s[i] == ' ':   </text>
  <text x="110" y="315" font-size="11.5" fill="#444" font-family="'Comic Sans MS', monospace">    reverse(start, i);  start = i + 1</text>

  <!-- 循环回边 -->
  <path d="M 460 270 Q 478 270 478 258 Q 478 246 110 246 Q 96 246 96 270" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="490" y="262" font-size="10" fill="#4a7a3a">下一词</text>

  <path d="M 280 328 L 280 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== 结束 ===== -->
  <ellipse cx="280" cy="358" rx="48" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 s</text>

  <!-- ===== 要点 ===== -->
  <rect x="40" y="384" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#8a6a20">要点：必须先压缩空格再翻转 · 整体翻 + 逐词翻 = 抵消字母级、保留单词级</text>
</svg>
