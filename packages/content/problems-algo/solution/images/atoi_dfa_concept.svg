<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">atoi 的确定性有限状态机（4 状态）</text>

  <!-- 起始 state -->
  <ellipse cx="85" cy="125" rx="54" ry="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="129" text-anchor="middle" font-size="13" fill="#333">起始 start</text>

  <!-- 符号 state -->
  <ellipse cx="270" cy="125" rx="54" ry="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="13" fill="#333">符号 signed</text>

  <!-- 数字 state -->
  <ellipse cx="270" cy="255" rx="62" ry="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="259" text-anchor="middle" font-size="13" fill="#333">数字 in_number</text>

  <!-- 结束 state -->
  <ellipse cx="470" cy="190" rx="50" ry="27" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="194" text-anchor="middle" font-size="13" fill="#333">结束 end</text>

  <!-- 1. 起始 self-loop on space -->
  <path d="M 58 108 C 38 66, 132 66, 112 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="85" y="62" text-anchor="middle" font-size="11" fill="#82b366">空格</text>

  <!-- 2. 起始 -> 符号 (+/-) -->
  <path d="M 139 125 L 216 125" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="117" text-anchor="middle" font-size="11" fill="#d6a040">+ / −</text>

  <!-- 3. 起始 -> 数字 (digit) -->
  <path d="M 124 148 L 214 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a">数字</text>

  <!-- 4. 符号 -> 数字 (digit) -->
  <path d="M 270 152 L 270 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="194" font-size="11" fill="#4a7a3a">数字</text>

  <!-- 5. 符号 -> 结束 (other) -->
  <path d="M 320 112 L 424 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="132" text-anchor="middle" font-size="11" fill="#b85450">其他</text>

  <!-- 6. 数字 self-loop (digit) -->
  <path d="M 332 248 C 376 226, 376 284, 332 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">数字</text>

  <!-- 7. 数字 -> 结束 (non-digit) -->
  <path d="M 322 240 L 424 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="236" text-anchor="middle" font-size="11" fill="#b85450">非数字</text>

  <!-- 起始 -> 结束 (other) note arrow -->
  <path d="M 124 102 L 422 184" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="92" text-anchor="middle" font-size="10" fill="#999">其他（直接结束）</text>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#888">核心：每读一个字符只做一次状态转移，规则天然实现"前导空格、单个符号、遇非数字即停"</text>
</svg>
