<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">示例 2 演算：arr1 入表 → arr2 覆盖/新增 → 排序输出</text>

  <!-- 输入 -->
  <rect x="30" y="44" width="560" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="62" font-size="10" fill="#d6a040" filter="url(#rough2)" font-weight="bold">输入</text>
  <text x="42" y="80" font-size="9.5" fill="#333" filter="url(#rough2)">arr1 = [{id:1,x:2,y:3},{id:2,x:3,y:6}]</text>
  <text x="42" y="96" font-size="9.5" fill="#333" filter="url(#rough2)">arr2 = [{id:2,x:10,y:20},{id:3,x:0,y:0}]</text>

  <path d="M 310 104 L 310 124" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="118" font-size="9" fill="#888" filter="url(#rough2)">①遍历 arr1 入表</text>

  <!-- ① arr1 入表后 -->
  <rect x="30" y="128" width="560" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="146" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">① 入表后</text>
  <text x="42" y="166" font-size="9.5" fill="#333" filter="url(#rough2)">map = { 1:{id:1,x:2,y:3},  2:{id:2,x:3,y:6} }</text>

  <path d="M 310 178 L 310 198" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="192" font-size="9" fill="#888" filter="url(#rough2)">②处理 arr2[0]</text>

  <!-- ② arr2[0] id=2 命中合并 -->
  <rect x="30" y="202" width="560" height="62" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="220" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">② arr2[0]={id:2,x:10,y:20}  → 命中 id=2，浅合并</text>
  <text x="42" y="240" font-size="9.5" fill="#333" filter="url(#rough2)">{...{id:2,x:3,y:6}, ...{id:2,x:10,y:20}} = {id:2, x:10, y:20}</text>
  <text x="42" y="256" font-size="9" fill="#b85450" filter="url(#rough2)">x:3→10, y:6→20（arr2 覆盖）；id 相同</text>

  <path d="M 310 264 L 310 284" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="278" font-size="9" fill="#888" filter="url(#rough2)">②处理 arr2[1]</text>

  <!-- ③ arr2[1] id=3 新增 -->
  <rect x="30" y="288" width="560" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="306" font-size="10" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">③ arr2[1]={id:3,x:0,y:0}  → id=3 不存在，直接入表</text>
  <text x="42" y="326" font-size="9.5" fill="#333" filter="url(#rough2)">map 新增键 3 → {id:3, x:0, y:0}</text>

  <path d="M 310 346 L 310 366" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="360" font-size="9" fill="#888" filter="url(#rough2)">③取值+排序</text>

  <!-- ④ 合并后 map 状态 -->
  <rect x="30" y="370" width="560" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="388" font-size="10" fill="#d6a040" filter="url(#rough2)" font-weight="bold">④ map 最终态（3 个唯一 id）</text>
  <text x="42" y="408" font-size="9.5" fill="#333" filter="url(#rough2)">{ 1:{id:1,x:2,y:3},  2:{id:2,x:10,y:20},  3:{id:3,x:0,y:0} }</text>

  <path d="M 310 420 L 310 438" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="434" font-size="9" fill="#888" filter="url(#rough2)">④sort by id</text>

  <!-- 输出 -->
  <rect x="30" y="442" width="560" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="42" y="460" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">输出</text>
  <text x="42" y="480" font-size="9.5" fill="#333" filter="url(#rough2)">[{id:1,x:2,y:3}, {id:2,x:10,y:20}, {id:3,x:0,y:0}]  ← 已按 id 升序</text>
</svg>
