<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arr636b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#fafafa"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：逐条日志，按 start / end 分支</text>
  <path d="M 250 42 Q 410 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起点 -->
  <g filter="url(#sk)">
    <ellipse cx="410" cy="86" rx="90" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="410" y="91" text-anchor="middle" font-size="13" fill="#2b4a77" font-weight="bold">res=[0]*n, stack=[], prev=0</text>
  <path d="M 410 108 L 410 132" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>

  <!-- 取下一条日志 -->
  <g filter="url(#sk)">
    <rect x="310" y="134" width="200" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="410" y="161" text-anchor="middle" font-size="13" fill="#333">解析 log → id, type, t</text>
  <path d="M 410 178 L 410 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="410,204 500,252 410,300 320,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="410" y="250" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">type ==</text>
  <text x="410" y="268" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">"start" ?</text>

  <!-- start 分支（左） -->
  <path d="M 320 252 L 200 252 L 200 320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>
  <text x="248" y="244" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="60" y="322" width="280" height="40" rx="5" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="200" y="347" text-anchor="middle" font-size="12" fill="#234" font-family="monospace">if 栈非空: res[栈顶] += t − prev</text>

  <path d="M 200 362 L 200 386" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="388" width="280" height="40" rx="5" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="200" y="413" text-anchor="middle" font-size="12" fill="#234" font-family="monospace">stack.push(id); prev = t</text>

  <!-- end 分支（右） -->
  <path d="M 500 252 L 620 252 L 620 320" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>
  <text x="560" y="244" font-size="12" fill="#b85450" font-weight="bold">否(end)</text>

  <g filter="url(#sk)">
    <rect x="480" y="322" width="280" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="620" y="347" text-anchor="middle" font-size="12" fill="#234" font-family="monospace">res[栈顶] += t − prev + 1</text>

  <path d="M 620 362 L 620 386" stroke="#446688" stroke-width="1.5" marker-end="url(#arr636b)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="480" y="388" width="280" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="620" y="413" text-anchor="middle" font-size="12" fill="#234" font-family="monospace">stack.pop(); prev = t + 1</text>

  <!-- 回路 -->
  <path d="M 200 428 L 200 470 L 720 470 L 720 156" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr636b)" filter="url(#sk)"/>
  <path d="M 620 428 L 620 470" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="410" y="488" text-anchor="middle" font-size="12" fill="#666">处理完所有日志后，返回 res</text>

  <!-- 颜色图例 -->
  <g filter="url(#sk)">
    <rect x="60" y="498" width="16" height="14" rx="2" fill="#e8f0fe" stroke="#4a8edb"/>
    <rect x="240" y="498" width="16" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="82" y="509" font-size="10" fill="#666">start 分支</text>
  <text x="262" y="509" font-size="10" fill="#666">end 分支</text>
</svg>
