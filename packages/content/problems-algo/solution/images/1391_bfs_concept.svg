<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心：街道连通是双向的</text>
  <path d="M 140 38 Q 280 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">A 的街道朝邻居 B 开口，B 的街道必须朝 A 反向开口，二者才算接通</text>

  <!-- Case 1: connected ✓ -->
  <text x="120" y="90" font-size="13" font-weight="bold" fill="#2e6e2e">✓ 接通</text>
  <!-- cell A: type 2 (up-down), neighbor below -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="100" height="80" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b6e">2</text>
  <path d="M 110 100 L 110 180" stroke="#d6a040" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="40" y="144" font-size="10" fill="#555">A</text>
  <!-- cell B: type 6 (right-up) -->
  <g filter="url(#sk)">
    <rect x="60" y="180" width="100" height="80" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="110" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">6</text>
  <path d="M 160 220 Q 110 220 110 180" stroke="#d6a040" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="40" y="224" font-size="10" fill="#555">B</text>
  <!-- bidirectional arrows on the shared edge -->
  <path d="M 110 175 L 110 185" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 120 185 L 120 175" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="276" text-anchor="middle" font-size="10" fill="#2e6e2e">A 朝下开口，B 朝上开口 → 通</text>

  <!-- Case 2: not connected ✗ -->
  <text x="400" y="90" font-size="13" font-weight="bold" fill="#b03a3a">✗ 不通</text>
  <g filter="url(#sk)">
    <rect x="340" y="100" width="100" height="80" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b6e">2</text>
  <path d="M 390 100 L 390 180" stroke="#d6a040" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="320" y="144" font-size="10" fill="#555">A</text>
  <g filter="url(#sk)">
    <rect x="340" y="180" width="100" height="80" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="390" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">1</text>
  <path d="M 340 220 L 440 220" stroke="#d6a040" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#sk)"/>
  <text x="320" y="224" font-size="10" fill="#555">B</text>
  <!-- broken edge: A reaches down, B has no up opening -->
  <path d="M 390 175 L 390 185" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="3 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="263" font-size="10" fill="#b03a3a">✗</text>
  <text x="450" y="263" font-size="10" fill="#b03a3a">✗</text>
  <text x="390" y="276" text-anchor="middle" font-size="10" fill="#b03a3a">A 朝下开口，B 朝左右 → 断</text>

  <!-- summary box -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="440" height="86" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">判定规则</text>
  <path d="M 100 332 Q 280 338 460 332" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="11" fill="#444">
    <text x="80" y="354">· A 朝方向 d 开口 ⟺ opp[d] ∈ conn[B]（B 朝反向开口）</text>
    <text x="80" y="374" fill="#b03a3a" font-weight="bold">· 仅单边开口 = 死胡同，BFS 不会跨过这条边</text>
  </g>
</svg>
