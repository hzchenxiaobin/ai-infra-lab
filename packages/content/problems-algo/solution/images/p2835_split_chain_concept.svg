<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">链式拆分：拆 2^j 得到 2^i，代价 = 层级差 j − i</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 16 → 2 为例：沿一条链拆 3 次，每层顺手留下一个副产品</text>

  <!-- step 1: 16 splits into 8 + 8 -->
  <rect x="60" y="66" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">16</text>

  <path d="M 128 84 L 186 66" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 128 88 L 186 108" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="58" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">操作①</text>

  <!-- byproduct 8 -->
  <rect x="190" y="48" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="71" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="222" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">副产品 · 留在桶里</text>

  <!-- continuing 8 -->
  <rect x="190" y="116" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- step 2 -->
  <path d="M 258 134 L 316 116" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 138 L 316 158" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">操作②</text>

  <!-- byproduct 4 -->
  <rect x="320" y="98" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" rx="4" filter="url(#rough2)"/>
  <text x="352" y="121" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="352" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">副产品</text>

  <!-- continuing 4 -->
  <rect x="320" y="166" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- step 3 -->
  <path d="M 388 184 L 446 166" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 388 188 L 446 208" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">操作③</text>

  <!-- two 2s -->
  <rect x="450" y="148" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="171" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="482" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">用 ✓（服务位 i）</text>

  <rect x="450" y="216" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="482" y="239" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="482" y="268" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">剩下的回桶</text>

  <!-- left annotation: one operation definition -->
  <rect x="46" y="170" width="140" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="116" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">题目的一次操作：</text>
  <text x="116" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删掉 x，尾插两个 x/2</text>

  <!-- summary box -->
  <rect x="70" y="290" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">拆 16 拿到一个 2：花 3 次操作（= 4 − 1 = j − i）</text>
  <text x="310" y="330" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">顺带收获副产品 8、4、2 各一个，回桶供更高的位使用</text>

  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">层级差越小越便宜 → 缺 2^i 时「就近」拆最小的更大元素</text>
</svg>
