<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈：新字符与栈顶比较，同字母异大小写则抵消</text>

  <!-- Row 1: Stack before + new char -->
  <text x="40" y="76" font-size="12" fill="#888">栈(操作前):</text>

  <rect x="130" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>

  <rect x="174" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <text x="194" y="50" text-anchor="middle" font-size="10" fill="#446688">栈顶</text>

  <!-- Arrow from new char to stack top -->
  <path d="M 305 75 L 220 75" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888">新字符</text>
  <rect x="310" y="58" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>

  <!-- Row 2: Comparison result -->
  <text x="260" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e 与 E → 同字母(e) · 异大小写 → 抵消!</text>

  <!-- Arrow down showing transformation -->
  <path d="M 150 98 L 150 152" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Row 3: Stack after -->
  <text x="40" y="176" font-size="12" fill="#888">栈(操作后):</text>
  <rect x="130" y="158" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <text x="195" y="176" font-size="11" fill="#888">e 被弹出, E 被丢弃</text>

  <!-- Rule box -->
  <rect x="40" y="220" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">bad pair 判定规则</text>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#555">tolower(a) == tolower(b) 且 a ≠ b</text>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#555">等价写法：|a − b| == 32（ASCII 大小写差 32）</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#888">例：e~E、a~A、z~Z 互为 bad pair</text>
</svg>
