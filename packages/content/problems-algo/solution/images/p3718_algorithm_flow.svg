<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：入集合 → 倍数跳跃 → 首个落空即答案</text>

  <rect x="215" y="30" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 66" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="68" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① S = set(nums)（一趟建集合，判定 O(1)）</text>

  <path d="M 260 94 L 260 106" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="108" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② m = k（从最小正倍数起步）</text>

  <path d="M 260 134 L 260 146" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 146 L 355 184 L 260 222 L 165 184 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ m ∈ S ?</text>
  <text x="260" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">被挡住了？</text>

  <path d="M 260 222 L 260 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="242" font-size="11" fill="#b85450" filter="url(#rough2)">否（落空）</text>

  <rect x="160" y="254" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ return m ← 答案</text>

  <!-- 是：跳跃到下一个倍数 -->
  <path d="M 355 184 L 414 184" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="416" y="170" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ m += k</text>

  <!-- 回到 ③ 再判 -->
  <path d="M 460 198 L 460 300 L 80 300 L 80 184 L 156 184" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="410" y="293" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下一轮（跳到下一个倍数，回 ③ 再判）</text>

  <text x="16" y="322" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 先判定再跳跃：写成 do { m += k } while (m ∈ S) 会跳过 k 本身——示例 2 中 k = 5 恰是答案</text>
  <text x="16" y="336" font-size="10" fill="#999" filter="url(#rough2)">💡 循环至多 n + 1 轮（鸽巢：n 个元素至多挡住 n 个倍数），整体 O(n)</text>
</svg>
