<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：模拟保底 vs 组合公式一步到位</text>

  <rect x="190" y="40" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n, k</text>

  <path d="M 236 76 Q 150 92 140 114" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 284 76 Q 370 92 380 114" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路线 A：模拟（保底）</text>
  <text x="380" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">路线 B：组合公式（最优）</text>

  <rect x="30" y="118" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k 轮「原地前缀和」</text>

  <rect x="30" y="188" width="220" height="84" fill="#f7f7f7" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="210" font-size="10.5" fill="#555" filter="url(#rough2)">for _ in range(k):</text>
  <text x="58" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">for i in 1..n−1:</text>
  <text x="72" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">a[i] = (a[i]</text>
  <text x="86" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">+ a[i−1]) % p</text>

  <path d="M 140 156 L 140 184" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 140 272 L 140 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="30" y="300" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">O(nk) ≤ 10⁶，稳过</text>

  <rect x="270" y="118" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="142" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">m = n + k − 1（≤ 1999）</text>

  <rect x="270" y="188" width="220" height="84" fill="#f7f7f7" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">预处理 fact[0..m]（模 p）</text>
  <text x="380" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">inv[m] = fact[m]^(p−2)（费马小定理）</text>
  <text x="380" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">倒推 inv[i−1] = inv[i]·i</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p = 10⁹+7 为素数，m &lt; p ⇒ 逆元合法</text>

  <path d="M 380 156 L 380 184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 380 272 L 380 296" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="270" y="300" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = fact[m]·inv[k]·inv[m−k] mod p</text>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">O(n+k)，优雅</text>

  <path d="M 140 336 Q 140 366 196 376" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 380 336 Q 380 366 324 376" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="185" y="370" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 a[n−1] mod p</text>

  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两条路线殊途同归：路线 B 直接算出 C(n+k−1, k)</text>
</svg>
