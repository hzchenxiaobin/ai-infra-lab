<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：「最大成本 ≤ t」⟺ 只保留权 ≤ t 的边</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">以示例 1 为例：n = 5, edges = [[0,1,4],[1,2,3],[1,3,2],[3,4,6]], k = 2，答案 4</text>

  <!-- ============ Panel 1: 阈值删边 ============ -->
  <text x="34" y="62" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 取阈值 t = 4：删除权 &gt; 4 的边（红虚线），每个分量的成本自动 ≤ 4</text>

  <g filter="url(#rough2)">
    <!-- 分量框 -->
    <rect x="52" y="68" width="210" height="86" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4"/>
    <rect x="314" y="60" width="40" height="42" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4"/>
    <!-- 边 -->
    <line x1="93" y1="129" x2="137" y2="122" stroke="#446688" stroke-width="2.5"/>
    <line x1="167" y1="122" x2="211" y2="129" stroke="#446688" stroke-width="2.5"/>
    <line x1="166" y1="114" x2="224" y2="93" stroke="#446688" stroke-width="2.5"/>
    <line x1="253" y1="87" x2="319" y2="82" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- 边权标注 -->
    <text x="113" y="142" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">4</text>
    <text x="189" y="144" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">3</text>
    <text x="196" y="99" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">2</text>
    <text x="286" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
    <!-- 节点 -->
    <ellipse cx="78" cy="132" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="152" cy="119" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="226" cy="132" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="238" cy="88" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="334" cy="81" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="78" y="136" text-anchor="middle" font-size="10" fill="#2a5a2a">0</text>
    <text x="152" y="123" text-anchor="middle" font-size="10" fill="#2a5a2a">1</text>
    <text x="226" y="136" text-anchor="middle" font-size="10" fill="#2a5a2a">2</text>
    <text x="238" y="92" text-anchor="middle" font-size="10" fill="#2a5a2a">3</text>
    <text x="334" y="85" text-anchor="middle" font-size="10" fill="#2a5a2a">4</text>
    <!-- 分量标注 -->
    <text x="157" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a">分量 A：成本 = max(4,3,2) = 4</text>
    <text x="334" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a">分量 B：成本 = 0</text>
  </g>

  <!-- ============ Panel 2: g(t) 单调阶梯 ============ -->
  <text x="34" y="196" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② g(t) = 只保留权 ≤ t 的边后的分量数，t 越大边越多 ⟹ g 单调不增</text>

  <g filter="url(#rough2)">
    <line x1="100" y1="210" x2="470" y2="210" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="236" x2="470" y2="236" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="263" x2="470" y2="263" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="289" x2="470" y2="289" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>

    <path d="M 100 326 L 100 204" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 100 320 L 478 320" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="486" y="326" font-size="10" fill="#888">t</text>
    <text x="92" y="214" text-anchor="end" font-size="9.5" fill="#666">1</text>
    <text x="92" y="240" text-anchor="end" font-size="9.5" fill="#666">2</text>
    <text x="92" y="267" text-anchor="end" font-size="9.5" fill="#666">3</text>
    <text x="92" y="293" text-anchor="end" font-size="9.5" fill="#666">4</text>
    <text x="92" y="319" text-anchor="end" font-size="9.5" fill="#666">5</text>
    <text x="115" y="336" text-anchor="middle" font-size="9.5" fill="#666">0</text>
    <text x="225" y="336" text-anchor="middle" font-size="9.5" fill="#666">2</text>
    <text x="282" y="336" text-anchor="middle" font-size="9.5" fill="#666">3</text>
    <text x="338" y="336" text-anchor="middle" font-size="9.5" fill="#666">4</text>
    <text x="445" y="336" text-anchor="middle" font-size="9.5" fill="#666">6</text>
    <text x="86" y="265" font-size="9.5" fill="#888" transform="rotate(-90 86 265)">分量数 g(t)</text>

    <path d="M 115 315 L 225 315 L 225 289 L 282 289 L 282 263 L 338 263 L 338 236 L 445 236 L 445 210 L 470 210" fill="none" stroke="#4a7a3a" stroke-width="2.5"/>
    <ellipse cx="115" cy="315" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="225" cy="289" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="282" cy="263" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="338" cy="236" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <ellipse cx="445" cy="210" rx="3.5" ry="3.5" fill="#4a7a3a"/>
    <text x="168" y="307" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=5</text>
    <text x="252" y="281" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=4</text>
    <text x="308" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=3</text>
    <text x="390" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=2</text>
    <text x="459" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">g=1</text>

    <line x1="100" y1="236" x2="445" y2="236" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="128" y="229" font-size="10.5" fill="#b85450" font-weight="bold">k = 2</text>

    <line x1="338" y1="236" x2="338" y2="328" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3"/>
    <ellipse cx="338" cy="236" rx="5" ry="5" fill="#d6a040" stroke="#8a6d1f" stroke-width="1.5"/>
    <text x="338" y="352" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">答案 t = 4</text>
    <text x="395" y="253" text-anchor="middle" font-size="9" fill="#888">首个 g ≤ k 的 t</text>
  </g>

  <!-- ============ 结论框 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="364" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="383" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">结论：答案 = 最小 t 使 g(t) ≤ k ⟺ 升序 Kruskal 中第 (n−k) 次成功合并的边权</text>
    <text x="260" y="402" text-anchor="middle" font-size="10" fill="#33455e">本题 n=5, k=2 ⟹ 第 3 次成功合并的权 4；n ≤ k 时无需合并，答案 0</text>
  </g>
</svg>
