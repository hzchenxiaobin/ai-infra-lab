<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按 node.val 与 [low, high] 三分剪枝</text>
  <text x="290" y="46" text-anchor="middle" font-size="12" fill="#888">示例：root = [10,5,15,3,7,null,18]，low = 7, high = 15</text>

  <!-- ===== BST 主图 ===== -->
  <g font-size="13">
    <!-- 根 10：命中 -->
    <circle cx="290" cy="92" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="290" y="97" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <!-- L1: 5(偏左), 15(命中) -->
    <circle cx="210" cy="152" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="210" y="157" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <circle cx="370" cy="152" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="370" y="157" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <line x1="278" y1="105" x2="222" y2="138" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="302" y1="105" x2="358" y2="138" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <!-- L2: 3(偏左), 7(命中), null, 18(偏右) -->
    <circle cx="160" cy="212" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="160" y="217" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <circle cx="230" cy="212" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="230" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="440" cy="212" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="440" y="217" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">18</text>
    <line x1="200" y1="165" x2="168" y2="198" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <line x1="220" y1="165" x2="228" y2="198" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <line x1="378" y1="165" x2="432" y2="198" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <!-- null 占位 (15 的左孩子) -->
    <rect x="318" y="200" width="26" height="22" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="331" y="216" text-anchor="middle" font-size="10" fill="#aaa">∅</text>
    <line x1="362" y1="165" x2="338" y2="198" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  </g>

  <!-- 范围区间标注条 -->
  <rect x="120" y="248" width="340" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="266" font-size="12" fill="#7a5a20" font-weight="bold">[ low=7</text>
  <line x1="200" y1="252" x2="200" y2="270" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="266" font-size="12" fill="#7a5a20" font-weight="bold">high=15 ]</text>
  <line x1="370" y1="252" x2="370" y2="270" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#7a5a20">命中区间</text>

  <!-- ===== 三分说明卡片 ===== -->
  <!-- ① 偏左 -->
  <rect x="30" y="296" width="170" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="316" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 偏左：val &lt; low</text>
  <text x="40" y="338" font-size="11" fill="#333">节点 5：5 &lt; 7</text>
  <text x="40" y="356" font-size="11" fill="#555">自身及左子树全 &lt; low</text>
  <text x="40" y="374" font-size="11" fill="#b85450" font-weight="bold">→ 舍弃左子树</text>
  <text x="40" y="392" font-size="11" fill="#446688">只递归右子树</text>
  <!-- 剪枝标记：在节点 5 的左子树(3) 上画叉 -->
  <path d="M 150 200 L 176 226" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 176 200 L 150 226" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- ② 命中 -->
  <rect x="210" y="296" width="170" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="295" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 命中：low ≤ val ≤ high</text>
  <text x="220" y="338" font-size="11" fill="#333">节点 10：7 ≤ 10 ≤ 15</text>
  <text x="220" y="356" font-size="11" fill="#555">累加 val 到答案</text>
  <text x="220" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">→ 左右都递归</text>
  <text x="220" y="392" font-size="11" fill="#555">两侧仍可能有命中节点</text>

  <!-- ③ 偏右 -->
  <rect x="390" y="296" width="170" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="475" y="316" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 偏右：val &gt; high</text>
  <text x="400" y="338" font-size="11" fill="#333">节点 18：18 &gt; 15</text>
  <text x="400" y="356" font-size="11" fill="#555">自身及右子树全 &gt; high</text>
  <text x="400" y="374" font-size="11" fill="#b85450" font-weight="bold">→ 舍弃右子树</text>
  <text x="400" y="392" font-size="11" fill="#d6a040">只递归左子树</text>
  <!-- 剪枝标记：节点 18 右侧画叉（18 无右子树，标记自身被剪） -->
  <path d="M 432 200 L 460 230" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 460 200 L 432 230" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
</svg>
