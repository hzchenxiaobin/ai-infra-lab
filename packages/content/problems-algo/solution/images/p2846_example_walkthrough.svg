<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例①演算：链 0—1—2—3—4—5—6，边权 1,1,1,2,2,2
  </text>

  <!-- chain tree -->
  <path d="M59,70 L101,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M129,70 L171,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M199,70 L241,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M269,70 L311,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M339,70 L381,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M409,70 L451,70" stroke="#999" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="45" y="44" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">根</text>
  <ellipse cx="45" cy="70" rx="14" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="45" y="75" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <ellipse cx="115" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <ellipse cx="185" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <ellipse cx="255" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <ellipse cx="325" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <ellipse cx="395" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <ellipse cx="465" cy="70" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <text x="80" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="150" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="220" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="290" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="360" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="430" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <!-- path bracket for query [2,6] -->
  <path d="M185,106 L185,112 L465,112 L465,106" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="325" y="128" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">查询 [2,6] 的路径：4 条边</text>

  <!-- prefix count table -->
  <rect x="61" y="142" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="106" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 x</text>
  <rect x="151" y="142" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="195" y="142" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="239" y="142" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="160" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="283" y="142" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="327" y="142" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="371" y="142" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="415" y="142" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <rect x="61" y="168" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="106" y="186" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt[x][1]</text>
  <rect x="151" y="168" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="195" y="168" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="239" y="168" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="186" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="283" y="168" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="327" y="168" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="349" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="371" y="168" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="393" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="415" y="168" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <rect x="61" y="194" width="90" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="106" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt[x][2]</text>
  <rect x="151" y="194" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="195" y="194" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="217" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="239" y="194" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="212" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="283" y="194" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="327" y="194" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="349" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="371" y="194" width="44" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="393" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="415" y="194" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    根到每个节点的前缀计数（本例权值只有 1、2 两种）
  </text>

  <!-- query calc boxes -->
  <rect x="22" y="256" width="232" height="140" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="280" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">查询 [2, 6]：LCA = 2</text>
  <text x="138" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L = 2 + 6 − 2·2 = 4</text>
  <text x="138" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w=1: 2+3−2·2 = 1</text>
  <text x="138" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w=2: 0+3−2·0 = 3</text>
  <text x="138" y="368" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">ans = 4 − max(1,3) = 1</text>

  <rect x="266" y="256" width="232" height="140" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="280" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">查询 [0, 6]：LCA = 0（根）</text>
  <text x="382" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L = 0 + 6 − 2·0 = 6</text>
  <text x="382" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w=1: 0+3−2·0 = 3</text>
  <text x="382" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w=2: 0+3−2·0 = 3</text>
  <text x="382" y="368" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">ans = 6 − max(3,3) = 3</text>

  <text x="260" y="414" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    四条查询全部算完 → [0, 0, 1, 3]，与官方输出一致
  </text>
</svg>
