<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">冗余连接 II 算法流程：先入度，再判环</text>

  <!-- Step 1 -->
  <rect x="180" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计每点入度</text>
  <text x="300" y="78" text-anchor="middle" font-size="10.5" fill="#666">找入度 = 2 的节点 v，记 cand1/cand2</text>
  <line x1="300" y1="88" x2="300" y2="108" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <path d="M 300 108 L 410 140 L 300 172 L 190 140 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">存在入度=2 的 v ?</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#888">cand2 是否有效</text>

  <text x="172" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="190" y1="140" x2="120" y2="140" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="140" x2="120" y2="170" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="418" y="134" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <line x1="410" y1="140" x2="480" y2="140" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="480" y1="140" x2="480" y2="170" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Left branch: no in-degree-2 -->
  <rect x="30" y="172" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 全边并查集（同 684）</text>
  <text x="120" y="206" text-anchor="middle" font-size="10" fill="#666">逐条 union，抓失败</text>
  <line x1="120" y1="216" x2="120" y2="240" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="25" y="240" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 union 失败的边</text>
  <text x="120" y="274" text-anchor="middle" font-size="10" fill="#666">即环上最后一条</text>

  <!-- Right branch: has in-degree-2 -->
  <rect x="380" y="172" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="480" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 试删 cand2（后出现）</text>
  <text x="480" y="206" text-anchor="middle" font-size="10" fill="#666">对其余 n−1 条边跑并查集</text>
  <line x1="480" y1="216" x2="480" y2="240" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="385" y="240" width="190" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="480" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 逐条 union，判环</text>
  <line x1="480" y1="276" x2="480" y2="296" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2 -->
  <path d="M 480 296 L 560 324 L 480 352 L 400 324 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">出现环 ?</text>
  <text x="480" y="336" text-anchor="middle" font-size="10" fill="#888">union 失败</text>

  <!-- No: down -> cand2 -->
  <text x="494" y="366" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="480" y1="352" x2="480" y2="382" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="384" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="402" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 cand2</text>
  <text x="480" y="418" text-anchor="middle" font-size="10" fill="#666">删它即成树，且最晚</text>

  <!-- Yes: left -> cand1 -->
  <text x="388" y="318" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="400" y1="324" x2="330" y2="324" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="304" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 cand1</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888">cand1 在环上</text>

  <!-- bottom note -->
  <rect x="40" y="436" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="453" text-anchor="middle" font-size="10.5" fill="#444">先试后出现的 cand2：成功即返；失败说明 cand1 在环上 → 返 cand1（唯一合法解）</text>
</svg>
