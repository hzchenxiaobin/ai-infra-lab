<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">棋盘染色 → 二分图 → König 定理</text>

  <!-- ====== Left: grid with checkerboard coloring ====== -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">原始矩阵 + 棋盘染色</text>

  <!-- 3x3 grid, cell 36x36, start x=56 y=72 -->
  <g filter="url(#rough2)">
    <!-- Row 0 -->
    <rect x="56" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="74" y="95" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <rect x="92" y="72" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="110" y="95" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="128" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="3,2" rx="4"/>
    <text x="146" y="95" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <!-- Row 1 -->
    <rect x="56" y="108" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,2" rx="4"/>
    <text x="74" y="131" text-anchor="middle" font-size="12" fill="#aaa">0</text>
    <rect x="92" y="108" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="110" y="131" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <rect x="128" y="108" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="146" y="131" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- Row 2 -->
    <rect x="56" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="74" y="167" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <rect x="92" y="144" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="110" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="128" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="146" y="167" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- grid labels -->
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="56" y="66">B</text><text x="92" y="66">W</text><text x="128" y="66">B</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="56" y="192" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="75" y="202">B = (i+j) 偶</text>
    <rect x="56" y="208" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="75" y="218">W = (i+j) 奇</text>
  </g>

  <!-- arrow -->
  <path d="M 172 120 L 218 120" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">建图</text>

  <!-- ====== Right: bipartite graph ====== -->
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">二分图：相邻的 1 连边</text>

  <!-- partition labels -->
  <text x="270" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">白组 W</text>
  <text x="470" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">黑组 B</text>

  <!-- edges (draw first, under nodes) -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.4" fill="none">
    <line x1="288" y1="90" x2="452" y2="82"/>
    <line x1="288" y1="90" x2="452" y2="130"/>
    <line x1="288" y1="155" x2="452" y2="130"/>
    <line x1="288" y1="155" x2="452" y2="228"/>
    <line x1="288" y1="220" x2="452" y2="130"/>
    <line x1="288" y1="220" x2="452" y2="180"/>
    <line x1="288" y1="220" x2="452" y2="228"/>
  </g>

  <!-- Left nodes (W, green) -->
  <g filter="url(#rough2)">
    <circle cx="270" cy="90" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="94" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">0,1</text>
    <circle cx="270" cy="155" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="159" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">1,2</text>
    <circle cx="270" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="224" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">2,1</text>
  </g>

  <!-- Right nodes (B, blue) -->
  <g filter="url(#rough2)">
    <circle cx="470" cy="82" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="86" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">0,0</text>
    <circle cx="470" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="134" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">1,1</text>
    <circle cx="470" cy="180" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="184" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">2,0</text>
    <circle cx="470" cy="228" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="232" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">2,2</text>
  </g>

  <!-- ====== Bottom: key insight ====== -->
  <rect x="40" y="262" width="500" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">核心观察：三步转化</text>

  <text x="60" y="310" font-size="11" fill="#555">① 棋盘染色：(i+j) 偶 = 黑组 B，(i+j) 奇 = 白组 W，相邻格子必跨组 → 天然二分图</text>
  <text x="60" y="330" font-size="11" fill="#555">② 问题 = 最小点覆盖：选最少的 1 删掉，使所有「相邻 1 对」的边都被覆盖</text>
  <text x="60" y="350" font-size="11" fill="#555">③ <tspan fill="#b85450" font-weight="bold">König 定理</tspan>：二分图最小点覆盖数 = 最大匹配数 → 匈牙利算法求最大匹配</text>
  <text x="60" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = 最大匹配数，只需删匹配覆盖的那些 1</text>
</svg>
