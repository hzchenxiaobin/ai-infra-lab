<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：按 dept 分区 → 排名 → 套公式 (rk−1)×100/(cnt−1)</text>

  <!-- Dept 1 block -->
  <rect x="24" y="44" width="250" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">院系 1（n = cnt = 3）</text>
  <!-- table header -->
  <rect x="40" y="72" width="218" height="20" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="86" font-size="9.5" fill="#446688" font-weight="bold">sid</text>
  <text x="92" y="86" font-size="9.5" fill="#446688" font-weight="bold">mark</text>
  <text x="150" y="86" font-size="9.5" fill="#b85450" font-weight="bold">rk</text>
  <text x="200" y="86" font-size="9.5" fill="#d6a040" font-weight="bold">percentage</text>
  <!-- rows sorted by mark desc: 7/920/rk1, 1/610/rk2, 3/530/rk3 -->
  <rect x="40" y="92" width="218" height="22" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="107" font-size="9.5" fill="#333">7</text><text x="92" y="107" font-size="9.5" fill="#333">920</text><text x="150" y="107" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="200" y="107" font-size="9.5" fill="#b85450" font-weight="bold">0.0</text>
  <rect x="40" y="114" width="218" height="22" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="129" font-size="9.5" fill="#333">1</text><text x="92" y="129" font-size="9.5" fill="#333">610</text><text x="150" y="129" font-size="9.5" fill="#b85450" font-weight="bold">2</text><text x="200" y="129" font-size="9.5" fill="#b85450" font-weight="bold">50.0</text>
  <rect x="40" y="136" width="218" height="22" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="151" font-size="9.5" fill="#333">3</text><text x="92" y="151" font-size="9.5" fill="#333">530</text><text x="150" y="151" font-size="9.5" fill="#b85450" font-weight="bold">3</text><text x="200" y="151" font-size="9.5" fill="#b85450" font-weight="bold">100.0</text>
  <!-- formula line -->
  <text x="40" y="180" font-size="9.5" fill="#4a7a3a">sid7: (1−1)×100/(3−1)=0.0</text>
  <text x="40" y="196" font-size="9.5" fill="#4a7a3a">sid1: (2−1)×100/(3−1)=50.0</text>
  <text x="40" y="212" font-size="9.5" fill="#4a7a3a">sid3: (3−1)×100/(3−1)=100.0</text>

  <!-- Dept 2 block -->
  <rect x="286" y="44" width="250" height="190" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="302" y="64" font-size="12" fill="#b85450" font-weight="bold">院系 2（n = cnt = 2）</text>
  <rect x="302" y="72" width="218" height="20" fill="#e8f0fe" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="86" font-size="9.5" fill="#446688" font-weight="bold">sid</text>
  <text x="354" y="86" font-size="9.5" fill="#446688" font-weight="bold">mark</text>
  <text x="412" y="86" font-size="9.5" fill="#b85450" font-weight="bold">rk</text>
  <text x="462" y="86" font-size="9.5" fill="#d6a040" font-weight="bold">percentage</text>
  <!-- both sid2/8 mark650 -> rk1 (tie) -->
  <rect x="302" y="92" width="218" height="22" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="314" y="107" font-size="9.5" fill="#333">2</text><text x="354" y="107" font-size="9.5" fill="#333">650</text><text x="412" y="107" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="462" y="107" font-size="9.5" fill="#b85450" font-weight="bold">0.0</text>
  <rect x="302" y="114" width="218" height="22" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="314" y="129" font-size="9.5" fill="#333">8</text><text x="354" y="129" font-size="9.5" fill="#333">650</text><text x="412" y="129" font-size="9.5" fill="#b85450" font-weight="bold">1</text><text x="462" y="129" font-size="9.5" fill="#b85450" font-weight="bold">0.0</text>
  <text x="302" y="180" font-size="9.5" fill="#b85450">同分 650 → 同 rk=1（RANK 跳号语义）</text>
  <text x="302" y="196" font-size="9.5" fill="#b85450">sid2: (1−1)×100/(2−1)=0.0</text>
  <text x="302" y="212" font-size="9.5" fill="#b85450">sid8: (1−1)×100/(2−1)=0.0</text>

  <!-- Divider -->
  <path d="M 40 248 L 520 248" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <path d="M 280 250 L 280 270" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Output table -->
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">输出（student_id, department_id, percentage）</text>
  <rect x="160" y="294" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="309" font-size="10" fill="#446688" font-weight="bold">student_id</text>
  <text x="280" y="309" font-size="10" fill="#446688" font-weight="bold">department_id</text>
  <text x="370" y="309" font-size="10" fill="#446688" font-weight="bold">percentage</text>
  <rect x="160" y="316" width="240" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="330" font-size="10" fill="#333">7</text><text x="280" y="330" font-size="10" fill="#333">1</text><text x="370" y="330" font-size="10" fill="#b85450" font-weight="bold">0.0</text>
  <rect x="160" y="336" width="240" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="350" font-size="10" fill="#333">1</text><text x="280" y="350" font-size="10" fill="#333">1</text><text x="370" y="350" font-size="10" fill="#b85450" font-weight="bold">50.0</text>
  <rect x="160" y="356" width="240" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="370" font-size="10" fill="#333">3</text><text x="280" y="370" font-size="10" fill="#333">1</text><text x="370" y="370" font-size="10" fill="#b85450" font-weight="bold">100.0</text>
  <rect x="160" y="376" width="240" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="390" font-size="10" fill="#333">2</text><text x="280" y="390" font-size="10" fill="#333">2</text><text x="370" y="390" font-size="10" fill="#b85450" font-weight="bold">0.0</text>
  <rect x="160" y="396" width="240" height="20" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="410" font-size="10" fill="#333">8</text><text x="280" y="410" font-size="10" fill="#333">2</text><text x="370" y="410" font-size="10" fill="#b85450" font-weight="bold">0.0</text>

  <!-- Footer notes -->
  <text x="40" y="438" font-size="10.5" fill="#555">• 题目允许「任意顺序」返回，故输出无需特定 ORDER BY</text>
  <text x="40" y="456" font-size="10.5" fill="#555">• 最高分 rk=1 → 0%；最低分（无并列时）rk=cnt → 100%，线性插值两端</text>
  <text x="40" y="472" font-size="10.5" fill="#888">注：dept2 两人同分，均 rk=1，故均 0%——印证「同分同排名」</text>
</svg>
