<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：十字分组，极值严格夹逼</text>
  <text x="153" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：n = 3，五栋建筑摆成十字</text>

  <!-- 网格 -->
  <text x="107" y="54" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">y=1</text>
  <text x="153" y="54" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">y=2</text>
  <text x="199" y="54" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">y=3</text>
  <text x="78" y="86" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">x=1</text>
  <text x="78" y="132" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">x=2</text>
  <text x="78" y="178" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">x=3</text>

  <rect x="84" y="60" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="60" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="60" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="84" y="106" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="106" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="106" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="84" y="152" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="152" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="152" width="46" height="46" rx="4" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 四个方向的邻居 -->
  <circle cx="153" cy="83" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="87" font-size="8.5" fill="#888" filter="url(#rough2)">(1,2)</text>

  <circle cx="153" cy="175" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="179" font-size="8.5" fill="#888" filter="url(#rough2)">(3,2)</text>

  <circle cx="107" cy="129" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="107" y="149" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(2,1)</text>

  <circle cx="199" cy="129" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="199" y="149" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(2,3)</text>

  <!-- 中心建筑 -->
  <circle cx="153" cy="129" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="153" y="132" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,2)</text>

  <!-- 方向箭头 -->
  <path d="M 153 112 L 153 97" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 153 146 L 153 161" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 136 129 L 121 129" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 170 129 L 185 129" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="141" y="104" text-anchor="end" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">上</text>
  <text x="141" y="158" text-anchor="end" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">下</text>
  <text x="127" y="118" text-anchor="end" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">左</text>
  <text x="179" y="118" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">右</text>

  <text x="153" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">端点四栋各缺一侧 ⇒ 不覆盖；仅中心 (2,2) 被覆盖</text>

  <!-- 同 x 分组 -->
  <rect x="244" y="60" width="256" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">同 x 分组 → 判左右</text>
  <text x="256" y="96" font-size="10" fill="#333" filter="url(#rough2)">x=1 → {2}：min = max = 2</text>
  <text x="256" y="112" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">x=2 → {1,2,3}：min=1, max=3</text>
  <text x="256" y="128" font-size="10" fill="#333" filter="url(#rough2)">x=3 → {2}：min = max = 2</text>

  <!-- 同 y 分组 -->
  <rect x="244" y="144" width="256" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">同 y 分组 → 判上下</text>
  <text x="256" y="180" font-size="10" fill="#333" filter="url(#rough2)">y=1 → {2}：min = max = 2</text>
  <text x="256" y="196" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">y=2 → {1,2,3}：min=1, max=3</text>
  <text x="256" y="212" font-size="10" fill="#333" filter="url(#rough2)">y=3 → {2}：min = max = 2</text>

  <text x="372" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,2)：左右 1 &lt; 2 &lt; 3 ✓，上下 1 &lt; 2 &lt; 3 ✓</text>

  <!-- 结论 -->
  <rect x="56" y="254" width="444" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">被覆盖 ⇔ rowMin[x] &lt; y &lt; rowMax[x] 且 colMin[y] &lt; x &lt; colMax[y]</text>
  <text x="278" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">同 x 组连成水平线管左右，同 y 组连成竖直线管上下</text>
  <text x="278" y="328" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">取到组内极值的建筑必缺一侧 ⇒ 不等式必须严格</text>
</svg>
