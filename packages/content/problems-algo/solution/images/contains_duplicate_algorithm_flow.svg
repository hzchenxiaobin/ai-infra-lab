<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">哈希集合法流程</text>
  <path d="M 140 42 Q 260 50 380 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="260" cy="74" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 260 92 L 260 110" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="170" y="114" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="260" y="139" text-anchor="middle" font-size="13" fill="#333">seen = ∅</text>

  <path d="M 260 154 L 260 172" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个 num -->
  <g filter="url(#rough2)">
    <rect x="160" y="176" width="200" height="44" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="260" y="203" text-anchor="middle" font-size="13" fill="#333">取下一个 num（遍历）</text>

  <path d="M 260 220 L 260 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <g filter="url(#rough2)">
    <path d="M 260 244 L 360 286 L 260 328 L 160 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#333">num ∈ seen ?</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#888">（之前见过吗）</text>

  <!-- 是 → 返回 true -->
  <path d="M 360 286 L 430 286 L 430 350" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>

  <g filter="url(#rough2)">
    <rect x="372" y="354" width="116" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="430" y="379" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 true</text>

  <!-- 否 → add 并回环 -->
  <path d="M 160 286 L 90 286 L 90 198 L 156 198" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">否</text>

  <!-- add 框（回环路上） -->
  <g filter="url(#rough2)">
    <rect x="36" y="248" width="108" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="90" y="273" text-anchor="middle" font-size="12" fill="#333">seen.add(num)</text>

  <!-- 遍历结束 → 返回 false -->
  <path d="M 260 224 Q 260 410 360 410" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="392" text-anchor="end" font-size="11" fill="#888">遍历完仍无命中</text>

  <g filter="url(#rough2)">
    <rect x="356" y="414" width="116" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="414" y="437" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">返回 false</text>
</svg>
