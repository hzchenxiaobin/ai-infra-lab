<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "abcbabcd"，k = 2，n = 8（例 3）</text>

  <!-- word cells -->
  <rect x="84" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <rect x="128" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="172" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="216" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="238" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="260" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <rect x="304" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="348" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="392" y="38" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">d</text>
  <text x="106" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="150" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="194" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="238" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="282" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="326" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="370" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="414" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>

  <!-- table header -->
  <rect x="30" y="98" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2t</text>
  <text x="180" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">w[i:]</text>
  <text x="292" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 w[0:n−i]</text>
  <text x="372" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">z[i]</text>
  <text x="418" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">n−i</text>
  <text x="490" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row 1 -->
  <rect x="30" y="124" width="500" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cbabcd</text>
  <text x="292" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abcbab</text>
  <text x="372" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="418" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="490" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ c≠a</text>

  <!-- row 2 -->
  <rect x="30" y="152" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abcd</text>
  <text x="292" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abcb</text>
  <text x="372" y="170" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="418" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ d≠b</text>

  <!-- row 3 -->
  <rect x="30" y="180" width="500" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="180" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cd</text>
  <text x="292" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ab</text>
  <text x="372" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="418" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="490" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ c≠a</text>

  <!-- row 4 -->
  <rect x="30" y="208" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="55" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="100" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="180" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">（空串）</text>
  <text x="292" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">—</text>
  <text x="372" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">—</text>
  <text x="418" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" filter="url(#rough2)">0</text>
  <text x="490" y="226" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">✓ i≥n</text>

  <!-- conclusion -->
  <rect x="30" y="252" width="500" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">第 1~3 轮：z[i] &lt; n − i，后缀 w[i:] 都不是 w 的前缀 → 恢复失败</text>
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 4 轮：i = 8 ≥ n，原字符全部移空、整串自己填 → 恢复 ✓</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)"></text>

  <!-- tip -->
  <rect x="30" y="326" width="500" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 注意第 2 行：z[4] = 3，w[4:]="abcd" 与前缀 "abcb" 前 3 位相同、第 4 位 d≠b</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">——差一个字符也不行，判据必须是整段后缀 z[i] == n − i，答案 4 与示例一致</text>
</svg>
