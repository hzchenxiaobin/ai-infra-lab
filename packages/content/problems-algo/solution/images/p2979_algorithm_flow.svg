<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一行公式为主，DP 打表为辅</text>

  <!-- 输入 -->
  <rect x="190" y="46" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">输入两个质数 a、b</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#888">质数 ⇒ 自动互质，无需判定</text>

  <!-- 分叉箭头 -->
  <path d="M 240 90 L 140 126" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <path d="M 320 90 L 420 126" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 左：公式解 -->
  <rect x="36" y="132" width="212" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="142" y="154" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">公式解（推荐）</text>
  <text x="142" y="178" text-anchor="middle" font-size="13" fill="#333">return a*b − a − b</text>
  <text x="142" y="202" text-anchor="middle" font-size="11" fill="#666">时间 O(1) / 空间 O(1)</text>
  <text x="142" y="220" text-anchor="middle" font-size="10.5" fill="#888">麦乐鸡定理一步出答案</text>

  <!-- 右：DP -->
  <rect x="312" y="132" width="212" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="154" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">DP 打表（小数据 / 对拍验证）</text>
  <text x="418" y="178" text-anchor="middle" font-size="11.5" fill="#333">can[0] = true</text>
  <text x="418" y="196" text-anchor="middle" font-size="11.5" fill="#333">can[v] = can[v−a] ∥ can[v−b]</text>
  <text x="418" y="218" text-anchor="middle" font-size="11" fill="#666">扫到 v = a·b，取最大的 false</text>

  <!-- 汇合箭头 -->
  <path d="M 142 228 L 240 276" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <path d="M 418 228 L 320 276" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>

  <!-- 输出 -->
  <rect x="180" y="282" width="200" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12.5" fill="#333">输出最贵买不到的价格</text>
  <text x="280" y="321" text-anchor="middle" font-size="10.5" fill="#888">两路结果一致：g = ab − a − b</text>

  <!-- 底注 -->
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888">hint 提示「大于 a·b 的价格总能买」⇒ DP 表只需开到 a·b</text>
</svg>
