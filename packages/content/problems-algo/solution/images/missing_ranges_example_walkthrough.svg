<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[0,1,3,50,75], lower=0, upper=99</text>

  <!-- sequence indicator: existing values with sentinels -->
  <text x="18" y="56" font-size="10" fill="#888">已存在值序列:</text>
  <rect x="92" y="44" width="40" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="59" text-anchor="middle" font-size="10" fill="#aaa">−1</text>
  <rect x="134" y="44" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="154" y="59" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="176" y="44" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="196" y="59" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="218" y="44" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="238" y="59" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="260" y="44" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="10" fill="#333">50</text>
  <rect x="302" y="44" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="322" y="59" text-anchor="middle" font-size="10" fill="#333">75</text>
  <rect x="344" y="44" width="40" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="364" y="59" text-anchor="middle" font-size="10" fill="#aaa">100</text>

  <!-- ===================== Panel 1: Round 3 cur=3 ===================== -->
  <rect x="22" y="80" width="135" height="232" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="22" y="80" width="135" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="89" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第3轮 cur=3</text>

  <rect x="34" y="118" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="134" text-anchor="middle" font-size="10.5" fill="#333">prev=1</text>
  <rect x="96" y="118" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="10.5" fill="#333">cur=3</text>
  <text x="89" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">diff = 3−1 = 2</text>

  <rect x="34" y="168" width="111" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="89" y="184" text-anchor="middle" font-size="10.5" fill="#b85450">缺失段 [2, 2]</text>

  <rect x="34" y="202" width="111" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="89" y="223" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"2"</text>

  <rect x="34" y="246" width="111" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="89" y="264" text-anchor="middle" font-size="10.5" fill="#446688">prev ← 3</text>
  <text x="89" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">恰好缺1个</text>

  <!-- ===================== Panel 2: Round 4 cur=50 ===================== -->
  <rect x="159" y="80" width="135" height="232" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="159" y="80" width="135" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="226" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第4轮 cur=50</text>

  <rect x="171" y="118" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="134" text-anchor="middle" font-size="10.5" fill="#333">prev=3</text>
  <rect x="233" y="118" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="257" y="134" text-anchor="middle" font-size="10.5" fill="#333">cur=50</text>
  <text x="226" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">diff = 50−3 = 47</text>

  <rect x="171" y="168" width="111" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="226" y="184" text-anchor="middle" font-size="10.5" fill="#b85450">缺失段 [4, 49]</text>

  <rect x="171" y="202" width="111" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="226" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"4-&gt;49"</text>

  <rect x="171" y="246" width="111" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="226" y="264" text-anchor="middle" font-size="10.5" fill="#4a7a3a">prev ← 50</text>
  <text x="226" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">缺一段(≥2个)</text>

  <!-- ===================== Panel 3: Round 5 cur=75 ===================== -->
  <rect x="296" y="80" width="135" height="232" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="296" y="80" width="135" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="363" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第5轮 cur=75</text>

  <rect x="308" y="118" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="134" text-anchor="middle" font-size="10.5" fill="#333">prev=50</text>
  <rect x="370" y="118" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="middle" font-size="10.5" fill="#333">cur=75</text>
  <text x="363" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">diff = 75−50 = 25</text>

  <rect x="308" y="168" width="111" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="363" y="184" text-anchor="middle" font-size="10.5" fill="#b85450">缺失段 [51, 74]</text>

  <rect x="308" y="202" width="111" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="363" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"51-&gt;74"</text>

  <rect x="308" y="246" width="111" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="363" y="264" text-anchor="middle" font-size="10.5" fill="#d6a040">prev ← 75</text>
  <text x="363" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">缺一段(≥2个)</text>

  <!-- ===================== Panel 4: Round 6 cur=100(哨兵) ===================== -->
  <rect x="433" y="80" width="135" height="232" fill="#ffffff" stroke="#aaa" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="433" y="80" width="135" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第6轮 cur=100*</text>

  <rect x="445" y="118" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="469" y="134" text-anchor="middle" font-size="10.5" fill="#333">prev=75</text>
  <rect x="507" y="118" width="48" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="531" y="134" text-anchor="middle" font-size="10.5" fill="#888">100</text>
  <text x="500" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">diff =100−75=25</text>

  <rect x="445" y="168" width="111" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="184" text-anchor="middle" font-size="10.5" fill="#b85450">缺失段 [76, 99]</text>

  <rect x="445" y="202" width="111" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"76-&gt;99"</text>

  <rect x="445" y="246" width="111" height="28" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="264" text-anchor="middle" font-size="10.5" fill="#888">prev ← 100</text>
  <text x="500" y="296" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">*哨兵 upper+1</text>

  <!-- final result -->
  <rect x="22" y="328" width="546" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="295" y="353" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：["2", "4-&gt;49", "51-&gt;74", "76-&gt;99"]</text>
</svg>
