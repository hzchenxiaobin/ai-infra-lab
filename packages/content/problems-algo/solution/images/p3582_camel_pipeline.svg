<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：三步流水线 —— 顺序本身就是语义</text>

  <!-- ===== 输入条：字符格子，空格红色高亮 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="28" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="44" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="76" y="38" width="16" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 2" filter="url(#rough2)"/>
    <rect x="92" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="108" y="38" width="16" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 2" filter="url(#rough2)"/>
    <rect x="124" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="140" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="156" y="38" width="16" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 2" filter="url(#rough2)"/>
    <rect x="172" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="188" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="204" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="220" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="236" y="38" width="16" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="52" filter="url(#rough2)">c</text>
    <text x="52" y="52" filter="url(#rough2)">a</text>
    <text x="68" y="52" filter="url(#rough2)">n</text>
    <text x="84" y="52" font-size="9" fill="#b85450" filter="url(#rough2)">␣</text>
    <text x="100" y="52" filter="url(#rough2)">I</text>
    <text x="116" y="52" font-size="9" fill="#b85450" filter="url(#rough2)">␣</text>
    <text x="132" y="52" filter="url(#rough2)">G</text>
    <text x="148" y="52" filter="url(#rough2)">o</text>
    <text x="164" y="52" font-size="9" fill="#b85450" filter="url(#rough2)">␣</text>
    <text x="180" y="52" filter="url(#rough2)">T</text>
    <text x="196" y="52" filter="url(#rough2)">h</text>
    <text x="212" y="52" filter="url(#rough2)">e</text>
    <text x="228" y="52" filter="url(#rough2)">r</text>
    <text x="244" y="52" filter="url(#rough2)">e</text>
  </g>
  <text x="282" y="46" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">红色 = 空格</text>
  <text x="282" y="58" font-size="9" fill="#b85450" filter="url(#rough2)">唯一分词依据</text>

  <path d="M 168 62 L 168 76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== ① 驼峰拼接 ===== -->
  <rect x="18" y="78" width="300" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 分词 → 驼峰拼接（前置 '#'）</text>
  <g font-size="11" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="30" y="106" width="44" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="52" y="121" filter="url(#rough2)">can</text>
    <rect x="78" y="106" width="24" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="90" y="121" filter="url(#rough2)">I</text>
    <rect x="106" y="106" width="32" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="122" y="121" filter="url(#rough2)">Go</text>
    <rect x="142" y="106" width="56" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="170" y="121" filter="url(#rough2)">There</text>
  </g>
  <text x="212" y="121" font-size="12" fill="#446688" filter="url(#rough2)">→</text>
  <rect x="224" y="106" width="82" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="121" text-anchor="middle" font-size="10.5" fill="#2a4a6a" font-weight="bold" filter="url(#rough2)">canIGoThere</text>
  <text x="168" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">词 1 整体小写；词 2+ 首字母大写、其余小写</text>

  <path d="M 168 162 L 168 174" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== ② 去非字母 ===== -->
  <rect x="18" y="176" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 去非字母（保留 '#'）</text>
  <text x="168" y="213" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输入仅字母 + 空格：空格在分词时已消失 → 并入 ①</text>

  <path d="M 168 222 L 168 232" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== ③ 截断 ===== -->
  <rect x="18" y="234" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="253" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">③ 截断至 ≤ 100 个字符</text>
  <text x="168" y="271" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">超出上限从末尾砍 —— '#' 也计入 100</text>

  <path d="M 168 280 L 168 290" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== 输出条 ===== -->
  <rect x="18" y="292" width="300" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="311" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">输出：#canIGoThere（12 ≤ 100，无需截断）</text>

  <!-- ===== 右上：反序陷阱 ===== -->
  <rect x="332" y="78" width="172" height="122" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">反序陷阱 ✗</text>
  <text x="418" y="118" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">若先「删非字母」再驼峰：</text>
  <text x="418" y="136" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">can I Go There</text>
  <text x="418" y="154" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">→ 熔成一个词 canIGoThere</text>
  <text x="418" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ #canigothere ✗</text>
  <text x="418" y="192" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">词界丢失，无法恢复</text>

  <!-- ===== 右下：截断演示 ===== -->
  <rect x="332" y="208" width="172" height="114" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="228" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">截断演示（示例 3）</text>
  <text x="418" y="248" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">'#' + 101 个 h = 102 字符</text>
  <text x="418" y="266" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">保留前 100：'#' + 99 个 h</text>
  <text x="418" y="286" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">砍掉尾部 2 个字符</text>
  <text x="418" y="306" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">上限 100 = 最终标签总长（含 '#'）</text>

  <!-- ===== 底部结论横幅 ===== -->
  <rect x="18" y="330" width="486" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="261" y="346" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">顺序即语义：先驼峰（消耗词界）→ 再清洗 → 最后截断，三步不可交换</text>
</svg>
