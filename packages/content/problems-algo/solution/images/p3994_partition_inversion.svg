<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：三值化 + 逆序对计数</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 2：nums = [9,7,5,3]，a = 4，b = 8；x &lt; a → 0，a ≤ x ≤ b → 1，x &gt; b → 2</text>

  <text x="58" y="79" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">原数组</text>

  <rect x="150" y="58" width="62" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="222" y="58" width="62" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="294" y="58" width="62" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="366" y="58" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="181" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="253" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="325" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="397" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 181 96 L 181 108" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 253 96 L 253 108" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 325 96 L 325 108" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 397 96 L 397 108" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="438" y="106" font-size="9.5" fill="#999" filter="url(#rough2)">三值化</text>

  <text x="58" y="133" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">组序列</text>

  <rect x="150" y="114" width="62" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="222" y="114" width="62" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="294" y="114" width="62" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="366" y="114" width="62" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="181" y="133" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="253" y="133" text-anchor="middle" font-size="13" fill="#3a5c2e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="325" y="133" text-anchor="middle" font-size="13" fill="#3a5c2e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="397" y="133" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">0</text>

  <path d="M 181 146 C 181 172, 253 172, 253 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 325 146 C 325 172, 397 172, 397 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 253 146 C 253 192, 397 192, 397 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 181 146 C 181 222, 325 222, 325 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 181 146 C 181 256, 397 256, 397 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="260" y="268" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5 条红弧 = 5 个逆序对：(2,1)×2、(2,0)×1、(1,0)×2</text>

  <rect x="30" y="282" width="460" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">最少相邻交换次数 = 逆序对数 = 5</text>
  <text x="260" y="322" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">一次相邻交换只改变被交换那对的相对顺序，逆序数恰好 ±1 ⇒ 至少 inv 次</text>
  <text x="260" y="340" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">只要未排成 0…0 1…1 2…2 就必有相邻逆序对，交换它 ⇒ 恰好 inv 次排好</text>
</svg>
