<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：能否保留，只看结果区倒数第 k 位</text>

  <text x="222" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">fast = i（待判定）</text>
  <path d="M 222 52 L 222 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="407" y="60" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">原数组 nums，k = 2</text>

  <rect x="95" y="66" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="147" y="66" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="199" y="66" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="222" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="251" y="66" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="303" y="66" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="355" y="66" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="118" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="222" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="274" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="326" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="378" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <path d="M 214 106 L 187 131" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="172" cy="146" rx="15" ry="13" fill="#fff8e1" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="151" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">=</text>
  <path d="M 158 160 L 131 188" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="176" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">都是 1</text>

  <path d="M 55 178 L 465 178" stroke="#ccc" stroke-width="1" stroke-dasharray="6,5" fill="none" filter="url(#rough2)"/>

  <text x="95" y="193" font-size="12" fill="#888" filter="url(#rough2)">结果区（slow 左边都已写好）</text>

  <rect x="88" y="194" width="110" height="48" rx="8" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="95" y="200" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="147" y="200" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="199" y="200" width="46" height="34" rx="4" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="118" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="170" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="222" y="246" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">slow</text>
  <text x="143" y="268" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">回看窗口：结果末尾 k=2 位</text>

  <rect x="310" y="196" width="185" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">判定：相同 → 丢弃</text>
  <text x="402" y="236" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">这个 1 已保留满 2 个</text>
  <text x="402" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 3 个 1 不写入</text>
  <path d="M 308 226 L 252 219" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="55" y="296" width="410" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">有序 ⇒ 重复必相邻；当前值 == 倒数第 k 个已保留值</text>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⟺ 这个值已保留满 k 个 —— 一行判据定去留</text>
</svg>
