<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,1,1,2]</text>

  <!-- ===== Group value=1 (highlight) ===== -->
  <text x="40" y="58" font-size="11" fill="#d6a040" font-weight="bold">值 1 → 下标组 [0, 2, 3]，m=3，total=5</text>
  <!-- header -->
  <rect x="40" y="68" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <rect x="100" y="68" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">pᵢ</text>
  <rect x="160" y="68" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">prefix[i]</text>
  <rect x="240" y="68" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="83" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">pᵢ·(2i−m)+total−2·prefix</text>
  <rect x="420" y="68" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="83" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans[pᵢ]</text>

  <!-- row i=0 -->
  <rect x="40" y="90" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="90" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="160" y="90" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="90" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="104" text-anchor="middle" font-size="9" fill="#555">0·(−3)+5−0 = 5</text>
  <rect x="420" y="90" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- row i=1 -->
  <rect x="40" y="110" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="100" y="110" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="160" y="110" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="110" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="9" fill="#555">2·(−1)+5−0 = 3</text>
  <rect x="420" y="110" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- row i=2 -->
  <rect x="40" y="130" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="144" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="100" y="130" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="160" y="130" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="240" y="130" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="9" fill="#555">3·1+5−4 = 4</text>
  <rect x="420" y="130" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- ===== Group value=3 (single) ===== -->
  <text x="40" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">值 3 → 下标组 [1]，m=1，total=1（单元素组，公式天然得 0）</text>
  <rect x="40" y="182" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="182" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="160" y="182" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="196" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="182" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="196" text-anchor="middle" font-size="9" fill="#555">1·(−1)+1−0 = 0</text>
  <rect x="420" y="182" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ===== Group value=2 (single) ===== -->
  <text x="40" y="216" font-size="11" fill="#446688" font-weight="bold">值 2 → 下标组 [4]，m=1，total=4</text>
  <rect x="40" y="226" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="100" y="226" width="60" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="160" y="226" width="80" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="240" y="226" width="180" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="240" text-anchor="middle" font-size="9" fill="#555">4·(−1)+4−0 = 0</text>
  <rect x="420" y="226" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Final result bar -->
  <rect x="40" y="266" width="510" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按原下标回填 → arr</text>
  <text x="295" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">[5, 0, 3, 4, 0] ✓</text>

  <!-- bottom note -->
  <text x="295" y="346" text-anchor="middle" font-size="10" fill="#888">三组各自独立套公式，单元素组 m=1 时 2i−m=−1 天然得 0，无需特判</text>
  <text x="295" y="362" text-anchor="middle" font-size="9" fill="#888">关注值 1 组：i 从 0→2 时 2i−m 从 −3→+1，左侧点数追上并超过右侧</text>
</svg>
