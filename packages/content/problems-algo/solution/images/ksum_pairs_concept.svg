<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：统计频次，每个数 v 的配对数 = min(freq[v], freq[k−v])</text>

  <!-- Array -->
  <text x="30" y="62" font-size="12" fill="#888">nums =</text>
  <rect x="80" y="46" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="126" y="46" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="172" y="46" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="218" y="46" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- k annotation -->
  <rect x="330" y="46" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 5</text>

  <!-- Frequency table -->
  <text x="30" y="104" font-size="12" fill="#888">频次表 freq：</text>
  <rect x="80" y="110" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值 v</text>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">freq[v]</text>
  <line x1="150" y1="110" x2="150" y2="136" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="80" y="138" width="150" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="195" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="162" width="150" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="177" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="195" y="177" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="186" width="150" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="201" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="195" y="201" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="210" width="150" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="225" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="195" y="225" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Pairing section -->
  <text x="290" y="104" font-size="12" fill="#444" font-weight="bold">配对（只看 v ≤ k−v）：</text>

  <!-- Pair 1↔4 -->
  <rect x="300" y="118" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="342" y="135" font-size="11" fill="#888">+</text>
  <rect x="354" y="118" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="398" y="135" font-size="11" fill="#888">= 5</text>
  <text x="450" y="135" font-size="11" fill="#4a7a3a" font-weight="bold">min(1,1) = 1</text>

  <!-- Pair 2↔3 -->
  <rect x="300" y="150" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="342" y="167" font-size="11" fill="#888">+</text>
  <rect x="354" y="150" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="398" y="167" font-size="11" fill="#888">= 5</text>
  <text x="450" y="167" font-size="11" fill="#4a7a3a" font-weight="bold">min(1,1) = 1</text>

  <!-- skip note -->
  <text x="300" y="195" font-size="11" fill="#888">v=3: k−v=2, 3 &gt; 2 → 跳过（已计）</text>
  <text x="300" y="212" font-size="11" fill="#888">v=4: k−v=1, 4 &gt; 1 → 跳过（已计）</text>

  <!-- Total -->
  <rect x="300" y="224" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总计 = 1 + 1 = 2 对</text>

  <!-- Special case -->
  <line x1="20" y1="270" x2="580" y2="270" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="292" font-size="12" fill="#b85450" font-weight="bold">⚠️ 特殊情况：v == k−v（即 v = k/2）时，自己和自己配对</text>
  <text x="30" y="314" font-size="11" fill="#333">例：k=6, nums=[3,1,3,4,3] → freq[3]=3, k−3=3</text>
  <text x="30" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">配对数 = freq[3] // 2 = 3 // 2 = 1 对（多的一个 3 落单）</text>

  <!-- bottom note -->
  <rect x="30" y="350" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="368" font-size="11" fill="#555" font-weight="bold">关键：只遍历 v ≤ k−v 的键，避免 (v, k−v) 与 (k−v, v) 重复计数</text>
  <text x="50" y="384" font-size="11" fill="#555">一次建表 O(n) + 一次遍历键集合 O(n) = 总时间 O(n)</text>
</svg>
