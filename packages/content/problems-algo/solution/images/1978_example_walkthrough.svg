<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：上级经理已离职的公司员工</text>

  <!-- ===== Step 0: Full Employees table ===== -->
  <text x="290" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Employees 全表</text>
  <rect x="120" y="56" width="340" height="116" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="132" y="72" font-size="9" fill="#446688" font-weight="bold">emp_id  name       manager_id  salary</text>
  <line x1="120" y1="78" x2="460" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="132" y="92" font-size="9" fill="#888">3        Mila       9           60301</text>
  <text x="132" y="106" font-size="9" fill="#888">12       Antonella  null        31000</text>
  <text x="132" y="120" font-size="9" fill="#888">13       Emery      null        67084</text>
  <rect x="122" y="124" width="336" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="132" y="134" font-size="9" fill="#d6a040" font-weight="bold">1        Kalel      11          21241</text>
  <text x="132" y="148" font-size="9" fill="#888">9        Mikaela    null        50937</text>
  <rect x="122" y="152" width="336" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="132" y="162" font-size="9" fill="#d6a040" font-weight="bold">11       Joziah     6           28485</text>

  <!-- Arrow down -->
  <path d="M 290 172 L 290 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: Filter salary < 30000 ===== -->
  <text x="290" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">① 筛选 salary &lt; 30000</text>
  <rect x="120" y="214" width="340" height="50" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="132" y="230" font-size="9" fill="#d6a040" font-weight="bold">emp_id  name       manager_id  salary</text>
  <line x1="120" y1="236" x2="460" y2="236" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="122" y="238" width="336" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="132" y="248" font-size="9" fill="#446688">1        Kalel      11          21241 ✓</text>
  <rect x="122" y="250" width="336" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="132" y="260" font-size="9" fill="#446688">11       Joziah     6           28485 ✓</text>

  <!-- Annotation for rejected rows -->
  <text x="470" y="230" font-size="8" fill="#888">被过滤:</text>
  <text x="470" y="242" font-size="7" fill="#888">3(60301)</text>
  <text x="470" y="252" font-size="7" fill="#888">12(31000)</text>
  <text x="470" y="262" font-size="7" fill="#888">13,9(null...)</text>

  <!-- Arrow down -->
  <path d="M 290 264 L 290 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Check manager_id in emp_id set ===== -->
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">② 检查 manager_id 是否在 emp_id 集合 {1,3,9,11,12,13} 中</text>

  <!-- Employee 1: manager=11, in set -->
  <rect x="40" y="310" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="328" font-size="10" fill="#4a7a3a" font-weight="bold">emp_id = 1 (Kalel)</text>
  <text x="50" y="344" font-size="9" fill="#333">manager_id = 11</text>
  <text x="50" y="358" font-size="9" fill="#4a7a3a">11 ∈ {1,3,9,11,12,13} ✓</text>
  <text x="50" y="372" font-size="9" fill="#4a7a3a" font-weight="bold">→ 经理仍在职，不输出</text>

  <!-- Employee 11: manager=6, NOT in set -->
  <rect x="310" y="310" width="240" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="328" font-size="10" fill="#b85450" font-weight="bold">emp_id = 11 (Joziah)</text>
  <text x="320" y="344" font-size="9" fill="#333">manager_id = 6</text>
  <text x="320" y="358" font-size="9" fill="#b85450" font-weight="bold">6 ∉ {1,3,9,11,12,13} ✗</text>
  <text x="320" y="372" font-size="9" fill="#b85450" font-weight="bold">→ 经理已离职，输出！</text>

  <!-- Arrow from step 2 to result -->
  <path d="M 430 380 L 430 398" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">③ ORDER BY employee_id → 最终结果</text>
  <rect x="230" y="420" width="120" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="436" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">employee_id</text>
  <line x1="230" y1="442" x2="350" y2="442" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="460" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">11</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="420" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="438" font-size="9" fill="#d6a040" font-weight="bold">emp 1 的经理=11</text>
  <text x="40" y="452" font-size="9" fill="#d6a040">11 仍在表 → 保留经理</text>
  <text x="40" y="464" font-size="8" fill="#888">→ emp 1 不输出</text>

  <rect x="370" y="420" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="438" font-size="9" fill="#d6a040" font-weight="bold">emp 11 的经理=6</text>
  <text x="380" y="452" font-size="9" fill="#d6a040">6 不在表 → 经理离职</text>
  <text x="380" y="464" font-size="8" fill="#888">→ emp 11 输出</text>
</svg>
