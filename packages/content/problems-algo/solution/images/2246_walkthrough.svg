<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：parent = [-1,0,0,1,1,2], s = "abacbe"</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">后序遍历顺序：3 → 4 → 1 → 5 → 2 → 0</text>

  <!-- Table header -->
  <rect x="45" y="52" width="30" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">#</text>

  <rect x="75" y="52" width="60" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="105" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点(字)</text>

  <rect x="135" y="52" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="195" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">可用子链</text>

  <rect x="255" y="52" width="45" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="277" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">max1</text>

  <rect x="300" y="52" width="45" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="322" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">max2</text>

  <rect x="345" y="52" width="75" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="382" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1+m1+m2</text>

  <rect x="420" y="52" width="45" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="71" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">返回</text>

  <!-- Row 1: Node 3(c) -->
  <rect x="45" y="82" width="420" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="101" text-anchor="middle" font-size="10.5" fill="#888">①</text>
  <text x="105" y="101" text-anchor="middle" font-size="10.5" fill="#333">3 (c)</text>
  <text x="195" y="101" text-anchor="middle" font-size="10" fill="#999">—（叶子）</text>
  <text x="277" y="101" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="322" y="101" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="382" y="101" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="442" y="101" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>

  <!-- Row 2: Node 4(b) -->
  <rect x="45" y="112" width="420" height="28" fill="#fff" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="131" text-anchor="middle" font-size="10.5" fill="#888">②</text>
  <text x="105" y="131" text-anchor="middle" font-size="10.5" fill="#333">4 (b)</text>
  <text x="195" y="131" text-anchor="middle" font-size="10" fill="#999">—（叶子）</text>
  <text x="277" y="131" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="322" y="131" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="382" y="131" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="442" y="131" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>

  <!-- Row 3: Node 1(b) -->
  <rect x="45" y="142" width="420" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="161" text-anchor="middle" font-size="10.5" fill="#888">③</text>
  <text x="105" y="161" text-anchor="middle" font-size="10.5" fill="#333">1 (b)</text>
  <text x="195" y="161" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3(c≠b)→1; 4(b=b)✗</text>
  <text x="277" y="161" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="322" y="161" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="382" y="161" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="442" y="161" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2</text>

  <!-- Row 4: Node 5(e) -->
  <rect x="45" y="172" width="420" height="28" fill="#fff" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="10.5" fill="#888">④</text>
  <text x="105" y="191" text-anchor="middle" font-size="10.5" fill="#333">5 (e)</text>
  <text x="195" y="191" text-anchor="middle" font-size="10" fill="#999">—（叶子）</text>
  <text x="277" y="191" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="322" y="191" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="382" y="191" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="442" y="191" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>

  <!-- Row 5: Node 2(a) -->
  <rect x="45" y="202" width="420" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="221" text-anchor="middle" font-size="10.5" fill="#888">⑤</text>
  <text x="105" y="221" text-anchor="middle" font-size="10.5" fill="#333">2 (a)</text>
  <text x="195" y="221" text-anchor="middle" font-size="9.5" fill="#4a7a3a">5(e≠a)→1</text>
  <text x="277" y="221" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="322" y="221" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="382" y="221" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="442" y="221" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2</text>

  <!-- Row 6: Node 0(a) - answer row, highlighted -->
  <rect x="45" y="232" width="420" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⑥</text>
  <text x="105" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0 (a)</text>
  <text x="195" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1(b≠a)→2; 2(a=a)✗</text>
  <text x="277" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="322" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="382" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 ★</text>
  <text x="442" y="252" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">3</text>

  <!-- Bottom note -->
  <rect x="55" y="278" width="410" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终答案：ans = 3</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#555">节点 2 虽返回链长 2，但 s[2]='a'==s[0]='a' 被阻断，不能拼入路径</text>

  <!-- Footer -->
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888">★ = 全局最大更新点 | 阻断边：父子字符相同，子链不可用</text>
</svg>
