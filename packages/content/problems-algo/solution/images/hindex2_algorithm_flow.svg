<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">H 指数 II：二分下标流程图</text>

  <!-- start -->
  <rect x="220" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- init: left=0, right=n (哨兵) -->
  <rect x="170" y="98" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333">left = 0, right = n  (n 作哨兵)</text>

  <!-- diamond: left < right ? -->
  <polygon points="280,150 400,195 280,240 160,195" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#444">left &lt; right ?</text>

  <!-- no branch -> return -->
  <text x="296" y="258" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="180" y="272" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 h = n − left</text>

  <!-- yes label -->
  <text x="412" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid box -->
  <rect x="420" y="178" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="200" text-anchor="middle" font-size="11.5" fill="#333">mid = (left+right)/2</text>

  <!-- inner diamond: citations[mid] >= n - mid ? -->
  <polygon points="480,232 560,280 480,328 400,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="274" text-anchor="middle" font-size="10.5" fill="#444">citations[mid]</text>
  <text x="480" y="290" text-anchor="middle" font-size="10.5" fill="#444">≥ n − mid ?</text>

  <!-- yes (满足): right = mid -->
  <rect x="300" y="348" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="375" y="370" text-anchor="middle" font-size="11.5" fill="#4a7a3a">right = mid</text>
  <text x="396" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- no (不满足): left = mid + 1 -->
  <rect x="470" y="348" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="550" y="370" text-anchor="middle" font-size="11.5" fill="#b85450">left = mid + 1</text>
  <text x="500" y="338" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- arrows: start -> init -> diamond -->
  <path d="M 280 78 L 280 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 132 L 280 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond yes -> mid -->
  <path d="M 400 195 L 418 195" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- mid -> inner diamond -->
  <path d="M 480 212 L 480 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond no -> return -->
  <path d="M 280 240 L 280 270" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- inner diamond yes -> right=mid -->
  <path d="M 400 280 L 376 280 L 376 346" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- inner diamond no -> left=mid+1 -->
  <path d="M 560 280 L 588 280 L 588 348 L 632 348" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- loop back: both branches -> up to outer diamond top (280,150) -->
  <path d="M 375 382 L 375 410 L 120 410 L 120 195 L 158 195" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 550 382 L 550 422 L 120 422 L 120 195" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="150" y="402" font-size="9.5" fill="#888">区间折半后继续</text>

  <!-- side note: invariant -->
  <rect x="30" y="100" width="116" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="88" y="120" text-anchor="middle" font-size="10" fill="#444">不变量：</text>
  <text x="88" y="135" text-anchor="middle" font-size="10" fill="#444">首个成立下标</text>
  <text x="88" y="150" text-anchor="middle" font-size="10" fill="#d6a040">∈ [left, right]</text>
</svg>
