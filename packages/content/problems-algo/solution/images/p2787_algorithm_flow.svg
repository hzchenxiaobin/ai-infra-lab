<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2787f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#b85450"/>
    </marker>
    <marker id="arr2787g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">0-1 背包计数流程（一维滚动 + 逆序枚举 j）</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">dp[j] = 凑出容量 j 的方案数；dp[0] = 1</text>

  <!-- dp array row of cells 0..10 -->
  <text x="30" y="92" font-size="11" fill="#446688" font-weight="bold">dp 数组 (j = 0 .. n)</text>
  <g font-size="10" fill="#333">
    <rect x="40"  y="100" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="61"  y="124" text-anchor="middle">0</text>
    <rect x="82"  y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="103" y="124" text-anchor="middle">1</text>
    <rect x="124" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="124" text-anchor="middle">2</text>
    <rect x="166" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="187" y="124" text-anchor="middle">3</text>
    <rect x="208" y="100" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="229" y="124" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="250" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="271" y="124" text-anchor="middle">5</text>
    <rect x="292" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="313" y="124" text-anchor="middle">6</text>
    <rect x="334" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="355" y="124" text-anchor="middle">7</text>
    <rect x="376" y="100" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="397" y="124" text-anchor="middle">8</text>
    <rect x="418" y="100" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="439" y="124" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <rect x="460" y="100" width="50" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="485" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
  </g>

  <!-- reverse iteration arrow above cells: from 10 -> w -->
  <path d="M 485 92 L 229 92" stroke="#b85450" stroke-width="2" marker-end="url(#arr2787f)" filter="url(#rough2)"/>
  <text x="357" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 从 n 倒序到 w</text>

  <!-- dependency: dp[j] reads dp[j-w] -->
  <text x="229" y="166" text-anchor="middle" font-size="10" fill="#d6a040">↑ j-w</text>
  <path d="M 229 158 L 485 158" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr2787g)" filter="url(#rough2)"/>
  <text x="357" y="152" text-anchor="middle" font-size="10" fill="#d6a040">dp[j] += dp[j-w]</text>

  <!-- Outer loop -->
  <rect x="30" y="200" width="500" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">外层循环：枚举每个物品 w = i^x（i = 1..m）</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#666">i^x &gt; n 时停止；w = 1, 4, 9, ... 每轮刷新一次 dp</text>

  <!-- Why reverse box -->
  <rect x="30" y="280" width="500" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么必须逆序？避免「同一物品重复使用」</text>
  <text x="50" y="322" font-size="11" fill="#666">① 顺序 j↑：更新 dp[j] 时读到的 dp[j-w] 可能已被本物品污染 → 等价物品可重复选</text>
  <text x="50" y="342" font-size="11" fill="#666">② 逆序 j↓：更新 dp[j] 读到的 dp[j-w] 来自更小下标，尚未被本物品更新 → 干净</text>
  <text x="50" y="362" font-size="11" fill="#b85450" font-weight="bold">③ 逆序 = 0-1 背包（每物一次）；顺序 = 完全背包（可重复），区分全在此一举</text>
</svg>
