<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- ===== 示例 1：val=2 命中 ===== -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：root=[4,2,7,1,3]，val=2 → 命中</text>

  <!-- 树结构 -->
  <line x1="135" y1="98" x2="108" y2="132" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="145" y1="98" x2="172" y2="132" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="103" y1="148" x2="86" y2="182" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="113" y1="148" x2="126" y2="182" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 4（访问过，蓝） -->
  <circle cx="140" cy="86" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- 节点 2（命中，绿） -->
  <circle cx="105" cy="140" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- 节点 7 -->
  <circle cx="175" cy="140" r="13" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="144" text-anchor="middle" font-size="11" fill="#999">7</text>

  <!-- 节点 1, 3 -->
  <circle cx="85" cy="192" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="196" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="128" cy="192" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="196" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 搜索路径箭头 4→2 -->
  <path d="M 132 98 L 112 128" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 步骤表 -->
  <rect x="260" y="58" width="280" height="120" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="78" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="330" y="78" font-size="11" fill="#555" font-weight="bold">节点</text>
  <text x="385" y="78" font-size="11" fill="#555" font-weight="bold">判定</text>
  <text x="475" y="78" font-size="11" fill="#555" font-weight="bold">动作</text>
  <line x1="268" y1="86" x2="532" y2="86" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="282" y="106" font-size="11" fill="#333">1</text>
  <text x="335" y="106" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="385" y="106" font-size="11" fill="#555">2 &lt; 4</text>
  <text x="475" y="106" font-size="11" fill="#446688">走左 →</text>

  <text x="282" y="128" font-size="11" fill="#333">2</text>
  <text x="335" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="385" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">2 = 2</text>
  <text x="475" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">命中 ✅</text>

  <line x1="268" y1="138" x2="532" y2="138" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回子树 [2,1,3]</text>

  <!-- ===== 示例 2：val=5 未找到 ===== -->
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">示例 2：root=[4,2,7,1,3]，val=5 → 未找到</text>

  <!-- 树结构（淡色未访问分支） -->
  <line x1="135" y1="258" x2="108" y2="292" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="145" y1="258" x2="172" y2="292" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="103" y1="308" x2="86" y2="342" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="113" y1="308" x2="126" y2="342" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 4（访问过，蓝） -->
  <circle cx="140" cy="246" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- 节点 2（未访问，淡） -->
  <circle cx="105" cy="300" r="13" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="304" text-anchor="middle" font-size="11" fill="#bbb">2</text>

  <!-- 节点 7（访问过，橙） -->
  <circle cx="175" cy="300" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- 节点 1, 3（淡） -->
  <circle cx="85" cy="352" r="11" fill="#fff" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="85" y="356" text-anchor="middle" font-size="10" fill="#ccc">1</text>
  <circle cx="128" cy="352" r="11" fill="#fff" stroke="#ddd" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="128" y="356" text-anchor="middle" font-size="10" fill="#ccc">3</text>

  <!-- 搜索路径 4→7 -->
  <path d="M 148 258 L 168 288" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7 的左孩子为 null 标记 -->
  <path d="M 167 312 L 150 340" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="118" y="342" width="48" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="142" y="357" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">null</text>

  <!-- 步骤表 -->
  <rect x="260" y="220" width="280" height="140" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="240" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="330" y="240" font-size="11" fill="#555" font-weight="bold">节点</text>
  <text x="385" y="240" font-size="11" fill="#555" font-weight="bold">判定</text>
  <text x="475" y="240" font-size="11" fill="#555" font-weight="bold">动作</text>
  <line x1="268" y1="248" x2="532" y2="248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="282" y="268" font-size="11" fill="#333">1</text>
  <text x="335" y="268" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="385" y="268" font-size="11" fill="#555">5 &gt; 4</text>
  <text x="475" y="268" font-size="11" fill="#d6a040">走右 →</text>

  <text x="282" y="290" font-size="11" fill="#333">2</text>
  <text x="335" y="290" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="385" y="290" font-size="11" fill="#555">5 &lt; 7</text>
  <text x="475" y="290" font-size="11" fill="#446688">走左 →</text>

  <text x="282" y="312" font-size="11" fill="#333">3</text>
  <text x="335" y="312" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="385" y="312" font-size="11" fill="#888">空节点</text>
  <text x="475" y="312" font-size="11" fill="#b85450" font-weight="bold">未找到 ❌</text>

  <line x1="268" y1="322" x2="532" y2="322" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="400" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 null</text>

  <!-- 分隔线 -->
  <line x1="20" y1="195" x2="540" y2="195" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

</svg>
