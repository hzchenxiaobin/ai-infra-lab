<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：其余项目作「分隔符」隔出 rest+1 个槽，每槽至多 1 个 max</text>

  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">分隔符 / 槽 模型（以 rest = 3 为例）</text>

  <rect x="60" y="66" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="88" y="91" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">槽</text>
  <rect x="124" y="66" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="188" y="66" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="216" y="91" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">槽</text>
  <rect x="252" y="66" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="316" y="66" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="344" y="91" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">槽</text>
  <rect x="380" y="66" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="444" y="66" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="472" y="91" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">槽</text>

  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">rest = 3 个分隔符 ⟹ rest + 1 = 4 个槽</text>

  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">填入 max 里程碑（每槽至多 1 个，否则两 max 相邻违规）</text>

  <rect x="60" y="164" width="56" height="40" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="189" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="124" y="164" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="188" y="164" width="56" height="40" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="189" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="252" y="164" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="316" y="164" width="56" height="40" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="189" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="380" y="164" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">分</text>
  <rect x="444" y="164" width="56" height="40" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="189" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">M</text>

  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 个 M 填满 4 个槽 ⟹ max 可调度 ≤ rest + 1</text>

  <path d="M 40 240 L 540 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="30" y="252" width="245" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="152" y="274" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情况一：max ≤ rest + 1</text>
  <text x="152" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">全部 max 都能填入槽</text>
  <text x="152" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案 = total = max + rest</text>
  <rect x="60" y="328" width="185" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="152" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[1,2,3] → 3 ≤ 4 → 6 ✓</text>

  <rect x="285" y="252" width="245" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="407" y="274" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情况二：max &gt; rest + 1</text>
  <text x="407" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">多出的 max 无槽可放</text>
  <text x="407" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案 = (rest+1) + rest = 2·rest+1</text>
  <rect x="315" y="328" width="185" height="34" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="407" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[5,2,1] → 5 &gt; 4 → 7</text>
</svg>
