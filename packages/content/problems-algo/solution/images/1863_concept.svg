<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按位独立 — 每个 bit 恰好一半子集异或为 1</text>

  <!-- nums decimal row -->
  <text x="48" y="84" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="150" y="60" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="60" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="60" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="238" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="298" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- nums binary row -->
  <text x="48" y="144" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">二进制</text>
  <rect x="150" y="120" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="120" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="120" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="238" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">001</text>
  <text x="298" y="144" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">110</text>

  <!-- down arrow -->
  <path d="M 238 162 L 238 180" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- OR box -->
  <rect x="90" y="184" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 | 1 | 6 = 7     （101 | 001 | 110 = 111₂）</text>
  <text x="240" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">OR 汇集所有出现过的 bit 位</text>

  <!-- divider -->
  <path d="M 40 244 L 540 244" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bit contribution: 3 rows -->
  <text x="290" y="264" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">每位贡献 = 位值 × 2^(n−1)   （n = 3，故 2^(n−1) = 4）</text>

  <!-- bit 2: value 4, contribution 16 -->
  <text x="60" y="292" font-size="12" fill="#333" filter="url(#rough2)">bit 2 (值 4)</text>
  <rect x="160" y="280" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="280" width="160" height="22" fill="#446688" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="296" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4 × 4 = 16</text>

  <!-- bit 1: value 2, contribution 8 -->
  <text x="60" y="322" font-size="12" fill="#333" filter="url(#rough2)">bit 1 (值 2)</text>
  <rect x="160" y="310" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="310" width="80" height="22" fill="#4a7a3a" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="326" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 × 4 = 8</text>

  <!-- bit 0: value 1, contribution 4 -->
  <text x="60" y="352" font-size="12" fill="#333" filter="url(#rough2)">bit 0 (值 1)</text>
  <rect x="160" y="340" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="340" width="40" height="22" fill="#d6a040" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="356" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1 × 4 = 4</text>

  <!-- sum -->
  <text x="335" y="378" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 = 28</text>

  <!-- Formula box -->
  <rect x="60" y="394" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="418" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = OR(nums) × 2^(n−1) = 7 × 2² = 28</text>
</svg>
