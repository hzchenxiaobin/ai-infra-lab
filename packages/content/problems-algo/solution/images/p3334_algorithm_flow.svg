<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两遍预处理 ＋ 一遍 O(1) 枚举</text>

  <ellipse cx="260" cy="44" rx="108" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始：输入 nums（长 n）</text>

  <path d="M 260 60 L 260 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="110" y="74" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 前缀表 preG/preL：preG[0]=0，preL[0]=1，左→右</text>
  <text x="260" y="103" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">preG[k+1] = gcd(preG[k], nums[k])，lcm 同理</text>

  <path d="M 260 110 L 260 122" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="110" y="124" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 后缀表 sufG/sufL：sufG[n]=0，sufL[n]=1，右→左</text>
  <text x="260" y="153" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">sufG[k] = gcd(sufG[k+1], nums[k])，lcm 同理</text>

  <path d="M 260 160 L 260 172" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="110" y="174" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ ans ← preG[n] × preL[n]（方案「不删」）</text>

  <path d="M 260 204 L 260 216" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="260,218 356,244 260,270 164,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">还有删除下标 i</text>
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">（i = 0 … n−1）？</text>

  <path d="M 260 270 L 260 282" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="280" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="110" y="284" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ G = gcd(preG[i], sufG[i+1])，L = lcm(preL[i], sufL[i+1])</text>
  <text x="260" y="315" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ans ← max(ans, G × L)；i++，回到判断</text>
  <path d="M 410 303 Q 448 303 448 244 Q 448 218 360 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 164 244 L 118 244" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="144" y="236" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="26" y="228" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="71" y="241" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="71" y="254" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（long long）</text>

  <rect x="110" y="330" width="300" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⚠ LCM(1..30) ≈ 2.3×10¹²，得分 ≈ 7×10¹³，全程 long long</text>
</svg>
