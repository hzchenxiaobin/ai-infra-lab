<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n = 4 的 dp 表填充（对角线 = 0，按长度递增）</text>

  <!-- ===== dp table grid 5x5 (i,j from 1..4) ===== -->
  <!-- column header j -->
  <text x="170" y="62" text-anchor="middle" font-size="11" fill="#888">j →</text>
  <text x="220" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="370" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- row header i -->
  <text x="150" y="106" text-anchor="end" font-size="11" fill="#888">i</text>
  <text x="150" y="116" text-anchor="end" font-size="11" fill="#888">↓</text>
  <text x="150" y="138" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="150" y="188" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="238" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="150" y="288" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- Row i=1 -->
  <!-- (1,1) diagonal -->
  <rect x="196" y="120" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="13" fill="#777" font-weight="bold">0</text>
  <!-- (1,2) len2 -->
  <rect x="246" y="120" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- (1,3) len3 -->
  <rect x="296" y="120" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- (1,4) answer -->
  <rect x="346" y="116" width="52" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>

  <!-- Row i=2 -->
  <!-- (2,1) invalid -->
  <rect x="196" y="170" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="196" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <!-- (2,2) diagonal -->
  <rect x="246" y="170" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="13" fill="#777" font-weight="bold">0</text>
  <!-- (2,3) len2 -->
  <rect x="296" y="170" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- (2,4) len3 -->
  <rect x="346" y="170" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Row i=3 -->
  <!-- (3,1) invalid -->
  <rect x="196" y="220" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="246" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <!-- (3,2) invalid -->
  <rect x="246" y="220" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <!-- (3,3) diagonal -->
  <rect x="296" y="220" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="13" fill="#777" font-weight="bold">0</text>
  <!-- (3,4) len2 -->
  <rect x="346" y="220" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="246" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- Row i=4 -->
  <!-- (4,1..3) invalid -->
  <rect x="196" y="270" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="296" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <rect x="246" y="270" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <rect x="296" y="270" width="48" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="296" text-anchor="middle" font-size="13" fill="#ccc">—</text>
  <!-- (4,4) diagonal -->
  <rect x="346" y="270" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="296" text-anchor="middle" font-size="13" fill="#777" font-weight="bold">0</text>

  <!-- arrow pointing to answer cell -->
  <path d="M 460 140 L 404 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="136" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="470" y="150" font-size="10" fill="#b85450">dp[1][4]</text>

  <!-- ===== key computation: dp[1][4] ===== -->
  <rect x="60" y="326" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[1][4] 的计算（枚举 k = 1..4）</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#555">k=1: 1 + max(0, dp[2][4]=3) = 4</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#555">k=2: 2 + max(0, dp[3][4]=3) = 5</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#555">k=3: 3 + max(dp[1][2]=1, 0) = 4</text>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ min = 4（选 k=1 或 k=3）</text>
</svg>
