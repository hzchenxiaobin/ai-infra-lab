<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：拆掉绝对值 → 左右两趟前缀/后缀最大值
  </text>

  <!-- Transition formula -->
  <rect x="60" y="44" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    dp[r][c] = points[r][c] + max_{c'} ( dp[r−1][c'] − |c − c'| )
  </text>

  <!-- dp[r-1] row -->
  <text x="50" y="108" font-size="12" fill="#888" filter="url(#rough2)">dp[r−1]:</text>
  <rect x="130" y="92" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="92" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="262" y="92" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="336" y="108" font-size="11" fill="#aaa" filter="url(#rough2)">（c'=0,1,2）</text>

  <!-- Left pass -->
  <rect x="30" y="138" width="270" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="165" y="160" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">
    左趟（c' ≤ c）：|c−c'| = c − c'
  </text>
  <text x="165" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    dp[r−1][c'] + c'  − c   ← 只关心 (dp + c')
  </text>

  <text x="50" y="206" font-size="11" fill="#888" filter="url(#rough2)">dp+c':</text>
  <rect x="120" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="190" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 172 202 L 176 202" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 230 202 L 234 202" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="50" y="244" font-size="11" fill="#888" filter="url(#rough2)">leftMax:</text>
  <rect x="120" y="228" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="228" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="228" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="165" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">从左→右跑前缀 max</text>
  <text x="165" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">leftMax[c] = max_{c'≤c}(dp+c')</text>
  <text x="165" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个 c 的最优左源 O(1) 继承</text>

  <!-- Right pass -->
  <rect x="310" y="138" width="270" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="445" y="160" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">
    右趟（c' ≥ c）：|c−c'| = c' − c
  </text>
  <text x="445" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    dp[r−1][c'] − c'  + c   ← 只关心 (dp − c')
  </text>

  <text x="330" y="206" font-size="11" fill="#888" filter="url(#rough2)">dp−c':</text>
  <rect x="400" y="190" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="458" y="190" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="516" y="190" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="541" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 514 202 L 510 202" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 456 202 L 452 202" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="330" y="244" font-size="11" fill="#888" filter="url(#rough2)">rightMax:</text>
  <rect x="400" y="228" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="458" y="228" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="516" y="228" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="541" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="445" y="276" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从右→左跑后缀 max</text>
  <text x="445" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">rightMax[c] = max_{c'≥c}(dp−c')</text>
  <text x="445" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个 c 的最优右源 O(1) 继承</text>

  <!-- Arrows from passes to combine -->
  <path d="M 165 338 Q 165 350 220 358" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 445 338 Q 445 350 390 358" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Combine -->
  <rect x="60" y="360" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="13" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">
    dp[r][c] = points[r][c] + max( leftMax[c] − c ,  rightMax[c] + c )
  </text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    每行 O(n) 两趟扫描，总 O(m·n)
  </text>

  <!-- footer note -->
  <text x="300" y="428" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    绝对值拆成两段后，max 可由前缀/后缀最大值 O(1) 查询
  </text>
  <text x="300" y="445" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">
    滚动数组只留上一行 dp，空间 O(n)
  </text>
</svg>
