<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：相邻两两配对交换 id，末位奇数保留</text>

  <!-- Left: original Seat table -->
  <text x="90" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 原表 Seat</text>
  <rect x="50" y="64" width="80" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="50" y1="84" x2="130" y2="84" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">id</text>
  <text x="110" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">student</text>
  <text x="70" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="110" y="102" text-anchor="middle" font-size="10" fill="#333">Abbot</text>
  <text x="70" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#333">Doris</text>
  <text x="70" y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="110" y="146" text-anchor="middle" font-size="10" fill="#333">Emerson</text>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="110" y="168" text-anchor="middle" font-size="10" fill="#333">Green</text>
  <text x="70" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="110" y="190" text-anchor="middle" font-size="10" fill="#333">Jeames</text>
  <text x="70" y="216" text-anchor="middle" font-size="9" fill="#b85450">↑末位奇数</text>

  <!-- swap pair arrows on the right of left table -->
  <path d="M 135 102 C 165 92, 165 124, 135 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 146 C 165 136, 165 168, 135 168" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="116" text-anchor="middle" font-size="9" fill="#d6a040">swap</text>
  <text x="172" y="160" text-anchor="middle" font-size="9" fill="#d6a040">swap</text>

  <!-- arrow to result -->
  <path d="M 195 145 L 250 145" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: result -->
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 交换后结果</text>
  <rect x="340" y="64" width="80" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="340" y1="84" x2="420" y2="84" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">id</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">student</text>
  <text x="360" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Doris</text>
  <text x="360" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="400" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Abbot</text>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="400" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Green</text>
  <text x="360" y="168" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="400" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Emerson</text>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#333">Jeames</text>
  <text x="360" y="216" text-anchor="middle" font-size="9" fill="#b85450">↑保留不变</text>

  <!-- bottom rule box -->
  <rect x="50" y="270" width="420" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">配对规则（按 id 奇偶）</text>
  <text x="60" y="315" font-size="11" fill="#555">• id 为奇数 → 新 id = id + 1（与下一位交换）</text>
  <text x="60" y="335" font-size="11" fill="#555">• id 为偶数 → 新 id = id − 1（与上一位交换）</text>
  <text x="60" y="355" font-size="11" fill="#b85450" font-weight="bold">• id 为奇数且是最后一位 → 保持不变（无下一位可换）</text>
</svg>
