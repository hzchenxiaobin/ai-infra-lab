<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：排序旋转数组，循环视角下「下降点」至多 1 个</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">源数组非递减 → 轮转后两段各自有序，拼接处至多一次下降</text>

  <!-- ===== Source array row ===== -->
  <text x="44" y="97" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">源数组 a</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="116" y="76" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="144" y="98" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="184" y="76" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="212" y="98" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="252" y="76" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="280" y="98" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="320" y="76" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="348" y="98" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="388" y="76" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="416" y="98" fill="#4a7a3a" font-weight="bold">5</text>
  </g>
  <!-- ≤ markers between source boxes -->
  <g filter="url(#rough2)" font-size="10" fill="#4a7a3a" text-anchor="middle">
    <text x="178" y="97">≤</text>
    <text x="246" y="97">≤</text>
    <text x="314" y="97">≤</text>
    <text x="382" y="97">≤</text>
  </g>
  <text x="476" y="97" font-size="9.5" fill="#888" filter="url(#rough2)">非递减</text>

  <!-- ===== Rotation arrow ===== -->
  <path d="M 280 116 L 280 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="118" width="104" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="352" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">轮转 x = 2 位</text>

  <!-- ===== Rotated array row ===== -->
  <text x="44" y="173" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">nums = b</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- b[0]=3 -->
    <rect x="116" y="152" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="144" y="174" fill="#333" font-weight="bold">3</text>
    <!-- b[1]=4 -->
    <rect x="184" y="152" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="212" y="174" fill="#333" font-weight="bold">4</text>
    <!-- b[2]=5 (drop start, red) -->
    <rect x="252" y="152" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="280" y="174" fill="#b85450" font-weight="bold">5</text>
    <!-- b[3]=1 (drop end, red) -->
    <rect x="320" y="152" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="348" y="174" fill="#b85450" font-weight="bold">1</text>
    <!-- b[4]=2 -->
    <rect x="388" y="152" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="416" y="174" fill="#333" font-weight="bold">2</text>
  </g>
  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="144" y="200">i=0</text>
    <text x="212" y="200">i=1</text>
    <text x="280" y="200">i=2</text>
    <text x="348" y="200">i=3</text>
    <text x="416" y="200">i=4</text>
  </g>

  <!-- ===== Between-pair markers for rotated row ===== -->
  <!-- ≤ between 3,4 ; 4,5 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#4a7a3a" text-anchor="middle" font-weight="bold">
    <text x="178" y="174">≤</text>
    <text x="246" y="174">≤</text>
  </g>
  <!-- DROP between 5 and 1: red down arrow + label -->
  <path d="M 300 150 L 324 150" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="334" y="146" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">下降</text>
  <!-- ≤ between 1,2 -->
  <text x="382" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">≤</text>

  <!-- ===== Cyclic wrap: 2 (last) -> 3 (first), curved below, green (no drop) ===== -->
  <path d="M 416 190 Q 470 230 470 250 Q 470 270 250 270 Q 90 270 90 250 Q 90 230 116 190"
        stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="232" y="262" width="96" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环回: 2 ≤ 3 无下降</text>

  <!-- ===== Callout: 唯一下降（切点） ===== -->
  <path d="M 334 110 L 334 146" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="262" y="86" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="352" y="103" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">唯一下降 = 切点（i=2）</text>

  <!-- ===== Result box ===== -->
  <rect x="80" y="306" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">环下降数 = #{nums[i] &gt; nums[(i+1)%n]} = 1</text>
  <text x="280" y="348" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ≤ 1 → true（合法的排序旋转数组）</text>
</svg>
