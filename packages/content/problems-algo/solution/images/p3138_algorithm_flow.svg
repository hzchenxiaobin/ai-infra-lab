<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：升序枚举约数 L → 整除预检 → 逐块校验</text>

  <!-- 统计总计数 -->
  <rect x="185" y="36" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">统计总计数 cnt[26]</text>
  <path d="M 265 68 L 265 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 枚举约数 -->
  <rect x="185" y="84" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">升序枚举 n 的约数 L</text>
  <text x="175" y="105" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">≤ 128 个</text>
  <path d="M 265 116 L 265 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1：整除预检 -->
  <polygon points="265,130 385,172 265,214 145,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="167" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k = n / L</text>
  <text x="265" y="184" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">k 整除每个 cnt[c]？</text>
  <text x="138" y="172" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">O(26) 预检</text>

  <path d="M 265 214 L 265 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="273" y="225" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 构造 need -->
  <rect x="175" y="230" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">need[c] = cnt[c] / k</text>
  <path d="M 265 262 L 265 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形2：逐块校验 -->
  <polygon points="265,276 385,318 265,360 145,318" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="313" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐块统计计数 cur</text>
  <text x="265" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每一块都有 cur == need？</text>

  <path d="M 265 360 L 265 374" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="278" y="371" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是（全部块通过）</text>

  <!-- 终点 -->
  <rect x="175" y="376" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="265" y="398" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 L（最小）</text>

  <!-- 换下一个 L 侧轨 -->
  <path d="M 385 172 L 400 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="163" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="402" y="156" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="177" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">换下一个 L</text>

  <path d="M 385 318 L 452 318 L 452 192" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="394" y="309" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 452 156 L 452 100 L 349 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">L = n（k = 1）必然通过全部检查 → 兜底有解；升序枚举保证首个返回值就是最小答案</text>
</svg>
