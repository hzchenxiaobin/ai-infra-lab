<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：反查坐标 → 逐相邻步校验</text>

  <!-- Step 1: build pos[] -->
  <rect x="150" y="44" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 建立反查表 pos[]</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#555">遍历 grid，pos[ grid[r][c] ] = (r, c)</text>

  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: diamond check pos[0]==(0,0) -->
  <path d="M 260 110 L 330 138 L 260 166 L 190 138 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pos[0] == (0,0) ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="9.5" fill="#888">起点校验</text>

  <!-- No branch -> false -->
  <path d="M 190 138 L 110 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="124" width="68" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="74" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes branch down -->
  <path d="M 260 166 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: loop box -->
  <rect x="120" y="186" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 遍历 k = 0 … n²−2</text>
  <text x="260" y="223" text-anchor="middle" font-size="10" fill="#555">dr=|pos[k].r−pos[k+1].r|, dc=|…c|　if dr×dc≠2 → false</text>

  <path d="M 260 236 L 260 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: diamond all pass? -->
  <path d="M 260 256 L 330 282 L 260 308 L 190 282 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">全部相邻步合法?</text>
  <text x="260" y="296" text-anchor="middle" font-size="9.5" fill="#888">无中途 return false</text>

  <!-- Yes -> true -->
  <path d="M 260 308 L 260 324" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="320" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="206" y="326" width="108" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- loop fail branch right -->
  <path d="M 330 282 L 410 282" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="412" y="268" width="68" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="446" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>
</svg>
