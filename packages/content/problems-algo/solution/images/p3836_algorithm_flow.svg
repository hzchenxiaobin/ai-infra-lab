<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 550"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="550" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：三重循环填 dp 表，−∞ 哨兵保证「恰好 k 对」</text>

  <!-- 初始化 -->
  <rect x="170" y="44" width="220" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[·][·][0] = 0，其余 = −∞</text>

  <path d="M 280 78 L 280 96" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="150" y="98" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三重循环：i = 1..n，j = 1..m，t = 1..k</text>

  <!-- 分叉到三个候选 -->
  <path d="M 280 132 C 235 146, 155 152, 102 162" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 132 L 280 160" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 132 C 325 146, 405 152, 458 162" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 候选① -->
  <rect x="18" y="164" width="160" height="68" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="192" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">候选① 跳过 nums1[i−1]</text>
  <text x="98" y="214" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">dp[i−1][j][t]</text>

  <!-- 候选② -->
  <rect x="200" y="164" width="160" height="68" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">候选② 跳过 nums2[j−1]</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">dp[i][j−1][t]</text>

  <!-- 候选③ -->
  <rect x="382" y="164" width="160" height="68" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="186" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">候选③ 配对 (i−1, j−1)</text>
  <text x="462" y="203" text-anchor="middle" font-size="10.5" fill="#a07020" filter="url(#rough2)">dp[i−1][j−1][t−1]</text>
  <text x="462" y="218" text-anchor="middle" font-size="10.5" fill="#a07020" filter="url(#rough2)">+ nums1[i−1]·nums2[j−1]</text>
  <text x="462" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">仅当 t ≤ min(i, j)</text>

  <!-- 汇合到 max -->
  <path d="M 98 232 C 98 248, 200 258, 272 264" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 232 L 280 260" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 232 C 462 248, 360 258, 288 264" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="268" width="260" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp[i][j][t] = max(①, ②, ③)</text>

  <path d="M 280 302 L 280 320" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：枚举完？ -->
  <polygon points="280,322 372,354 280,386 188,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">状态枚举完？</text>

  <!-- 否：回循环 -->
  <path d="M 188 354 L 56 354 L 56 115 L 144 115" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="66" y="346" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 是：输出 -->
  <path d="M 280 386 L 280 406" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="402" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="170" y="408" width="220" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 dp[n][m][k]</text>

  <!-- 哨兵说明 -->
  <g filter="url(#rough2)">
    <rect x="20" y="462" width="520" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="280" y="486" text-anchor="middle" font-size="10.5" fill="#8a403c" font-weight="bold">⚠ −∞ 哨兵：t &gt; min(i, j) 的状态「凑不出 t 对」，恒为 −∞，任何合法值都能压过它，</text>
    <text x="280" y="504" text-anchor="middle" font-size="10.5" fill="#8a403c">从而强制「恰好 k 对」——负乘积也必须照收（示例 3 返回 −7）；</text>
    <text x="280" y="522" text-anchor="middle" font-size="10.5" fill="#8a403c">单个乘积达 10¹²、k ≤ 100 ⇒ |总分| ≤ 10¹⁴，超出 int 范围，须用 64 位整数。</text>
  </g>
</svg>
