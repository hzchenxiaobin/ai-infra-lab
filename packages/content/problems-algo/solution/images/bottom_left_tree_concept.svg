<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：最后一行 + 最左 = 每层首个出队</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 逐层推进 → 最后一层；入队「先左后右」→ 同层首个即最左</text>

  <!-- ===== Tree (left) ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">二叉树 [1,2,3,4,null,5,6,null,null,7]</text>
  <g font-size="11">
    <!-- L0: 1 -->
    <circle cx="130" cy="98" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="130" y="103" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- L1: 2, 3 -->
    <circle cx="80" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="153" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="180" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="153" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <line x1="120" y1="110" x2="90" y2="136" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="140" y1="110" x2="170" y2="136" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <!-- L2: 4, 5, 6 -->
    <circle cx="45" cy="198" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="45" y="203" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="160" cy="198" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="160" y="203" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="210" cy="198" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="203" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <line x1="72" y1="160" x2="52" y2="186" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="170" y1="160" x2="155" y2="186" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="190" y1="160" x2="205" y2="186" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <!-- L3: 7 (answer, highlighted) -->
    <circle cx="135" cy="248" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="135" y="253" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="155" y1="210" x2="138" y2="234" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <!-- depth labels -->
    <text x="18" y="103" font-size="9" fill="#b85450" font-weight="bold">L0</text>
    <text x="18" y="153" font-size="9" fill="#446688" font-weight="bold">L1</text>
    <text x="18" y="203" font-size="9" fill="#4a7a3a" font-weight="bold">L2</text>
    <text x="18" y="253" font-size="9" fill="#d6a040" font-weight="bold">L3</text>

    <!-- answer callout -->
    <path d="M 152 248 L 210 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="245" y="244" font-size="10" fill="#b85450" font-weight="bold">ans = 7</text>
    <text x="245" y="258" font-size="8" fill="#888">最后一行 · 最左</text>
  </g>

  <!-- ===== Right: two dimensions ===== -->
  <text x="400" y="74" font-size="11" fill="#444" font-weight="bold">题意拆解</text>

  <rect x="310" y="86" width="210" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="105" font-size="11" fill="#d6a040" font-weight="bold">维度 ① 最后一行</text>
  <text x="320" y="122" font-size="10" fill="#555">深度最大的一层</text>
  <text x="320" y="137" font-size="9" fill="#888">BFS 逐层推进，循环结束即停</text>

  <rect x="310" y="156" width="210" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="175" font-size="11" fill="#446688" font-weight="bold">维度 ② 最左</text>
  <text x="320" y="192" font-size="10" fill="#555">该层从左到右第一个节点</text>
  <text x="320" y="207" font-size="9" fill="#888">入队「先 left 后 right」→ 出队首个即最左</text>

  <!-- combine arrow -->
  <path d="M 415 222 L 415 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="310" y="252" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">合起来：每层 i==0 记 ans</text>
  <text x="320" y="288" font-size="9" fill="#555">while 结束时 ans = 最后一层最左值</text>

  <rect x="30" y="312" width="490" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="332" font-size="10" fill="#b85450" font-weight="bold">关键：BFS 入队顺序「先 left 后 right」是「最左性」的唯一来源</text>
  <text x="50" y="345" font-size="9" fill="#555">改为先 right 后 left，ans 就变成「最后一行最右」—— 与 199 右视图同源</text>
</svg>
