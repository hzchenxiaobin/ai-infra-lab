<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 dp 表填充（jobs=[6,5,4,3,2,1], d=2）</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888">j=1 行 = 前缀最大值；j=2 行逐列由转移式算出，绿格=答案</text>

  <!-- ===== dp table ===== -->
  <!-- header row -->
  <g font-size="12">
    <rect x="130" y="60" width="70" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="165" y="80" text-anchor="middle" fill="#555" font-weight="bold">j \ i</text>
    <rect x="200" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="230" y="80" text-anchor="middle" fill="#555" font-weight="bold">1</text>
    <rect x="260" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="290" y="80" text-anchor="middle" fill="#555" font-weight="bold">2</text>
    <rect x="320" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="80" text-anchor="middle" fill="#555" font-weight="bold">3</text>
    <rect x="380" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="410" y="80" text-anchor="middle" fill="#555" font-weight="bold">4</text>
    <rect x="440" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="470" y="80" text-anchor="middle" fill="#555" font-weight="bold">5</text>
    <rect x="500" y="60" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="530" y="80" text-anchor="middle" fill="#555" font-weight="bold">6</text>
  </g>

  <!-- row j=1 -->
  <g font-size="12">
    <rect x="130" y="94" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="165" y="115" text-anchor="middle" fill="#446688" font-weight="bold">j=1</text>
    <rect x="200" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="230" y="115" text-anchor="middle" fill="#333">6</text>
    <rect x="260" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="290" y="115" text-anchor="middle" fill="#333">6</text>
    <rect x="320" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="115" text-anchor="middle" fill="#333">6</text>
    <rect x="380" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="410" y="115" text-anchor="middle" fill="#333">6</text>
    <rect x="440" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="470" y="115" text-anchor="middle" fill="#333">6</text>
    <rect x="500" y="94" width="60" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="530" y="115" text-anchor="middle" fill="#333">6</text>
  </g>
  <text x="575" y="115" font-size="9" fill="#888">前缀 max</text>

  <!-- row j=2 -->
  <g font-size="12">
    <rect x="130" y="128" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="165" y="149" text-anchor="middle" fill="#d6a040" font-weight="bold">j=2</text>
    <rect x="200" y="128" width="60" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="230" y="149" text-anchor="middle" fill="#aaa">—</text>
    <rect x="260" y="128" width="60" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="290" y="149" text-anchor="middle" fill="#333">11</text>
    <rect x="320" y="128" width="60" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="350" y="149" text-anchor="middle" fill="#333">10</text>
    <rect x="380" y="128" width="60" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="410" y="149" text-anchor="middle" fill="#333">9</text>
    <rect x="440" y="128" width="60" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="470" y="149" text-anchor="middle" fill="#333">8</text>
    <rect x="500" y="128" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="530" y="149" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
  </g>

  <!-- arrow from dp[6][2] down to computation -->
  <path d="M 530 160 L 530 184 L 320 184 L 320 200" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[6][2] 怎么算出来的？枚举 k</text>

  <!-- ===== computation table for dp[6][2] ===== -->
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">dp[6][2] = min_k { dp[k][1] + max(jobs[k..5]) }</text>

  <!-- header -->
  <g font-size="11">
    <rect x="120" y="224" width="70" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="155" y="243" text-anchor="middle" fill="#555" font-weight="bold">k</text>
    <rect x="190" y="224" width="120" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="243" text-anchor="middle" fill="#555" font-weight="bold">dp[k][1]</text>
    <rect x="310" y="224" width="130" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="375" y="243" text-anchor="middle" fill="#555" font-weight="bold">max(jobs[k..5])</text>
    <rect x="440" y="224" width="80" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="480" y="243" text-anchor="middle" fill="#555" font-weight="bold">求和</text>
  </g>

  <!-- rows k=5..1 -->
  <g font-size="11">
    <!-- k=5 (optimal) -->
    <rect x="120" y="256" width="70" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="155" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="190" y="256" width="120" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="274" text-anchor="middle" fill="#333">6</text>
    <rect x="310" y="256" width="130" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="274" text-anchor="middle" fill="#333">1（jobs[5]=1）</text>
    <rect x="440" y="256" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="480" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7 ✓</text>

    <!-- k=4 -->
    <rect x="120" y="284" width="70" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="302" text-anchor="middle" fill="#333">4</text>
    <rect x="190" y="284" width="120" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="302" text-anchor="middle" fill="#333">6</text>
    <rect x="310" y="284" width="130" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="302" text-anchor="middle" fill="#333">2（max(2,1)）</text>
    <rect x="440" y="284" width="80" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="302" text-anchor="middle" fill="#333">8</text>

    <!-- k=3 -->
    <rect x="120" y="312" width="70" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="330" text-anchor="middle" fill="#333">3</text>
    <rect x="190" y="312" width="120" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="330" text-anchor="middle" fill="#333">6</text>
    <rect x="310" y="312" width="130" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="330" text-anchor="middle" fill="#333">3（max(3,2,1)）</text>
    <rect x="440" y="312" width="80" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="330" text-anchor="middle" fill="#333">9</text>

    <!-- k=2 -->
    <rect x="120" y="340" width="70" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="358" text-anchor="middle" fill="#333">2</text>
    <rect x="190" y="340" width="120" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="358" text-anchor="middle" fill="#333">6</text>
    <rect x="310" y="340" width="130" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="358" text-anchor="middle" fill="#333">4（max(4,3,2,1)）</text>
    <rect x="440" y="340" width="80" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="358" text-anchor="middle" fill="#333">10</text>

    <!-- k=1 -->
    <rect x="120" y="368" width="70" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="386" text-anchor="middle" fill="#333">1</text>
    <rect x="190" y="368" width="120" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="250" y="386" text-anchor="middle" fill="#333">6</text>
    <rect x="310" y="368" width="130" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="386" text-anchor="middle" fill="#333">5（max(5,…,1)）</text>
    <rect x="440" y="368" width="80" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="386" text-anchor="middle" fill="#333">11</text>
  </g>

  <!-- bottom note -->
  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#888">k=5 最优：前 5 个工作 1 天(max=6) + 最后 1 个工作 1 天(max=1) = 7</text>
</svg>
