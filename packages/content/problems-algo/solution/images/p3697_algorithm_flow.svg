<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：逐位剥离 → 非零位生成分量 → 反转输出</text>

  <!-- 开始 -->
  <rect x="192" y="36" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 230 62 L 230 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1：n > 0 ? -->
  <polygon points="230,74 294,102 230,130 166,102" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n &gt; 0 ?</text>

  <!-- 是：向下取末位 -->
  <path d="M 230 130 L 230 146" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="239" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="172" y="148" width="116" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = n % 10</text>
  <path d="M 230 176 L 230 188" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形2：d > 0 ? -->
  <polygon points="230,188 287,214 230,240 173,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d &gt; 0 ?</text>

  <!-- 是：右侧生成分量 -->
  <text x="295" y="207" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 287 214 L 331 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="335" y="198" width="128" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="399" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res 追加 d × power</text>

  <!-- 分支汇合 -->
  <path d="M 399 230 L 399 249 L 236 249" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="253" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 230 240 L 230 256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 剥位推进 -->
  <rect x="158" y="258" width="144" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="271" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">n ← n / 10</text>
  <text x="230" y="284" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">power ← power × 10</text>

  <!-- 回到循环 -->
  <path d="M 158 273 L 55 273 L 55 102 L 162 102" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="106" y="94" text-anchor="middle" font-size="11" fill="#b3541e" filter="url(#rough2)">下一位</text>

  <!-- 否：退出循环 -->
  <text x="303" y="95" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 294 102 L 495 102 L 495 310" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="400" y="312" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">反转 res</text>
  <text x="455" y="344" text-anchor="middle" font-size="11" fill="#b3541e" filter="url(#rough2)">返回（降序）</text>

  <!-- 备注 -->
  <rect x="25" y="308" width="215" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="132" y="325" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">零位：跳过，不产生分量</text>
  <text x="132" y="343" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">power 跟踪位值 10^k（64 位）</text>
</svg>
