<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,null,3,2,4,null,5,6]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">孩子顺序入栈 → 出栈得「根,孩子逆序」→ 反转</text>

  <!-- 树结构 -->
  <circle cx="120" cy="74" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="70" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>

  <circle cx="120" cy="138" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <circle cx="170" cy="138" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="108" y1="86" x2="80" y2="126" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="120" y1="90" x2="120" y2="124" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="132" y1="86" x2="160" y2="126" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="95" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <circle cx="145" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <line x1="112" y1="150" x2="100" y2="189" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="128" y1="150" x2="140" y2="189" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <rect x="240" y="56" width="300" height="232" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">栈迭代过程（孩子顺序入栈）</text>
  <line x1="240" y1="84" x2="540" y2="84" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="250" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">步</text>
  <text x="276" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">出栈</text>
  <text x="320" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">入栈孩子</text>
  <text x="430" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">栈(底→顶)</text>
  <text x="525" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">result</text>
  <line x1="240" y1="108" x2="540" y2="108" stroke="#ccc" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="250" y="124" font-size="10" fill="#333">1</text>
  <text x="276" y="124" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="124" font-size="10" fill="#555">3,2,4</text>
  <text x="430" y="124" font-size="10" fill="#555">[3,2,4]</text>
  <text x="525" y="124" font-size="10" fill="#555">[1]</text>

  <text x="250" y="142" font-size="10" fill="#333">2</text>
  <text x="276" y="142" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="320" y="142" font-size="10" fill="#888">—</text>
  <text x="430" y="142" font-size="10" fill="#555">[3,2]</text>
  <text x="525" y="142" font-size="10" fill="#555">[1,4]</text>

  <text x="250" y="160" font-size="10" fill="#333">3</text>
  <text x="276" y="160" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="320" y="160" font-size="10" fill="#555">5,6</text>
  <text x="430" y="160" font-size="10" fill="#555">[3,5,6]</text>
  <text x="525" y="160" font-size="10" fill="#555">[1,4,2]</text>

  <text x="250" y="178" font-size="10" fill="#333">4</text>
  <text x="276" y="178" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <text x="320" y="178" font-size="10" fill="#888">—</text>
  <text x="430" y="178" font-size="10" fill="#555">[3,5]</text>
  <text x="525" y="178" font-size="10" fill="#555">[1,4,2,6]</text>

  <text x="250" y="196" font-size="10" fill="#333">5</text>
  <text x="276" y="196" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="320" y="196" font-size="10" fill="#888">—</text>
  <text x="430" y="196" font-size="10" fill="#555">[3]</text>
  <text x="525" y="196" font-size="10" fill="#555">[1,4,2,6,5]</text>

  <text x="250" y="214" font-size="10" fill="#333">6</text>
  <text x="276" y="214" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="320" y="214" font-size="10" fill="#888">—</text>
  <text x="430" y="214" font-size="10" fill="#555">[]</text>
  <text x="525" y="214" font-size="10" fill="#555">[1,4,2,6,5,3]</text>

  <line x1="240" y1="222" x2="540" y2="222" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="390" y="240" text-anchor="middle" font-size="11" fill="#333">result（根,孩子逆序）= [1,4,2,6,5,3]</text>
  <text x="390" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">reverse → [3,5,6,2,4,1] ✅</text>

  <!-- 汇总说明 -->
  <rect x="20" y="232" width="210" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="38" y="252" font-size="11" fill="#333" font-weight="bold">关键点：</text>
  <text x="38" y="270" font-size="10" fill="#555">• 孩子按顺序 push（3,2,4）</text>
  <text x="38" y="286" font-size="10" fill="#555">• 栈顶=最后入栈的孩子→先出</text>
  <text x="38" y="302" font-size="10" fill="#555">• 出栈序 = 根,4,2,6,5,3</text>
  <text x="38" y="318" font-size="10" fill="#555">  =「根 + 孩子逆序」</text>
  <text x="38" y="334" font-size="10" fill="#b85450" font-weight="bold">• 反转即后序 ✅</text>
</svg>
