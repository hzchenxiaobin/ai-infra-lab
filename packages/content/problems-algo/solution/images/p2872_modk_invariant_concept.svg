<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 532" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="532" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：切走的块 ≡ 0 (mod k)，父侧余数不灭</text>

  <!-- green block around subtree of node 1 -->
  <rect x="62" y="214" width="136" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S(1) = 12 ≡ 0 ✓</text>

  <!-- edges -->
  <path d="M 230 84 L 230 130" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 330 168 L 318 262" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 130 284 L 130 330" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- cut edge: 2 - 1, dashed red -->
  <path d="M 222 166 L 138 254" stroke="#b85450" stroke-width="3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="196" y="196" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✂ 切！</text>

  <!-- nodes -->
  <circle cx="230" cy="64" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="262" y="68" font-size="11" fill="#555" filter="url(#rough2)">值 1</text>

  <circle cx="230" cy="150" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="262" y="154" font-size="11" fill="#555" filter="url(#rough2)">值 1</text>
  <text x="262" y="172" font-size="10.5" fill="#888" filter="url(#rough2)">开放区域 = 5</text>

  <circle cx="130" cy="262" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="130" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">值 8</text>

  <circle cx="330" cy="262" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="267" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="330" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">值 4</text>

  <circle cx="130" cy="350" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="355" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="130" y="384" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">值 4</text>

  <!-- right annotation box -->
  <rect x="392" y="52" width="192" height="222" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="404" y="76" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k = 6</text>
  <text x="404" y="104" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S(1) = 8 + 4 = 12 ≡ 0 ✓</text>
  <text x="404" y="124" font-size="11.5" fill="#555" filter="url(#rough2)">→ {1,3} 单独成一块</text>
  <text x="404" y="160" font-size="11.5" fill="#555" filter="url(#rough2)">完整子树和 S(2) = 17</text>
  <text x="404" y="180" font-size="11.5" fill="#555" filter="url(#rough2)">17 mod 6 = 5</text>
  <text x="404" y="200" font-size="11.5" fill="#555" filter="url(#rough2)">切走 12 后剩 5</text>
  <text x="404" y="220" font-size="11.5" fill="#555" filter="url(#rough2)">5 ≡ 17 (mod 6)</text>
  <text x="404" y="250" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">余数纹丝不动！</text>
  <text x="404" y="268" font-size="10.5" fill="#888" filter="url(#rough2)">切多切少都不变</text>

  <!-- exchange argument box -->
  <rect x="36" y="416" width="528" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="437" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">交换论证：能切就切 —— 补切一刀，切下的块 ≡ 0，父侧只减一个 k 的倍数</text>
  <text x="300" y="457" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">其余块的合法性不变，块数 +1 ⟹ 切永不吃亏</text>

  <!-- formula box -->
  <rect x="36" y="478" width="528" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="506" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = #{ u : S(u) mod k = 0 }（含根；S(root) ≡ 0 题目已保证）</text>
</svg>
