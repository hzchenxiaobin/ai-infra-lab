<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：y = [1,2,1,2,1,3,2]</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">线段高度区间：s0~s3 → [1,2]，s4 → [1,3]，s5 → [2,3]（共 6 条）</text>

  <!-- table header -->
  <rect x="80" y="66" width="380" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="84" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">高度 h</text>
  <text x="225" y="84" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">事件明细（下端 +1 / 上端 −1）</text>
  <text x="345" y="84" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Δ</text>
  <text x="390" y="84" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="437" y="84" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row h=1 (highlight) -->
  <rect x="80" y="96" width="380" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="225" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s0~s4 下端 +1×5</text>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+5</text>
  <text x="390" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="437" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- row h=2 -->
  <rect x="80" y="134" width="380" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="225" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s0~s3 上端 −1×4；s5 下端 +1</text>
  <text x="345" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="390" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="437" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- row h=3 -->
  <rect x="80" y="172" width="380" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="225" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s4、s5 上端 −1×2</text>
  <text x="345" y="194" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="390" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="437" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- conclusion note -->
  <rect x="70" y="222" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">cur 只在相邻高度之间有意义：高度带 (1, 2) 上恒为 5，即 y = 1.5 的高度</text>
  <text x="260" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">扫描结束，ans = 5，与示例输出一致 ✓</text>

  <!-- vertex view note -->
  <rect x="70" y="284" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">顶点视角（官方 hints）：谷 +2、峰 −2、单调点抵消、端点 ±1</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">h=1：谷 ×2（+2×2）+ 左端点低于右邻（+1）= +5，与差分完全一致</text>
</svg>
