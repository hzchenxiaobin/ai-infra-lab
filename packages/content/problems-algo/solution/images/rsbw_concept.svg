<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：空格守恒，均匀分配到间隔</text>

  <!-- ====== Input row ====== -->
  <text x="50" y="64" font-size="11" fill="#888" font-weight="bold">输入</text>
  <!-- 2 spaces -->
  <rect x="64" y="50" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <!-- this -->
  <rect x="100" y="50" width="72" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="72" text-anchor="middle" font-size="13" fill="#333">this</text>
  <!-- 3 spaces -->
  <rect x="172" y="50" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- is -->
  <rect x="226" y="50" width="36" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="72" text-anchor="middle" font-size="13" fill="#333">is</text>
  <!-- 2 spaces -->
  <rect x="262" y="50" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <!-- a -->
  <rect x="298" y="50" width="18" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="72" text-anchor="middle" font-size="13" fill="#333">a</text>
  <!-- 1 space -->
  <rect x="316" y="50" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <!-- sentence -->
  <rect x="334" y="50" width="144" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="72" text-anchor="middle" font-size="13" fill="#333">sentence</text>
  <!-- 1 space -->
  <rect x="478" y="50" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="487" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <!-- space count annotation -->
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#555">空格总数 = 2 + 3 + 2 + 1 + 1 = <tspan fill="#446688" font-weight="bold">9</tspan>，单词数 = <tspan fill="#4a7a3a" font-weight="bold">4</tspan></text>

  <!-- ====== Formula box ====== -->
  <rect x="100" y="118" width="360" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">间隔数 = 单词数 − 1 = 4 − 1 = 3</text>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#333">每间隔空格 = 9 ÷ 3 = <tspan fill="#4a7a3a" font-weight="bold">3</tspan>，末尾余数 = 9 mod 3 = <tspan fill="#b85450" font-weight="bold">0</tspan></text>
  <text x="280" y="180" text-anchor="middle" font-size="10.5" fill="#888">spaces = per × gap + extra（守恒等式）</text>

  <!-- arrow down -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Output row ====== -->
  <text x="50" y="244" font-size="11" fill="#888" font-weight="bold">输出</text>
  <!-- this -->
  <rect x="64" y="230" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="13" fill="#333">this</text>
  <!-- 3 spaces -->
  <rect x="136" y="230" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- is -->
  <rect x="190" y="230" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="252" text-anchor="middle" font-size="13" fill="#333">is</text>
  <!-- 3 spaces -->
  <rect x="226" y="230" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- a -->
  <rect x="280" y="230" width="18" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="289" y="252" text-anchor="middle" font-size="13" fill="#333">a</text>
  <!-- 3 spaces -->
  <rect x="298" y="230" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- sentence -->
  <rect x="352" y="230" width="144" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="424" y="252" text-anchor="middle" font-size="13" fill="#333">sentence</text>

  <!-- ====== Bottom summary ====== -->
  <rect x="60" y="286" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">空格守恒：9 = 3 × 3 + 0 → 间隔均匀最大化，余数归尾</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#888">蓝块=空格（数字表示个数），绿框=单词；重排后每个间隔均为 3</text>
</svg>
