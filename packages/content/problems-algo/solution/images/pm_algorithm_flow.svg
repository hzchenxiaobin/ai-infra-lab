<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="470" fill="#fafafa"/>
  <text x="250" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两层拓扑排序流程</text>

  <!-- Step 1 -->
  <rect x="130" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无组项目(-1) 分配唯一新组号</text>
  <path d="M250,86 L250,100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="95" y="104" width="310" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">建两层图：项目级(同组边) + 小组级(跨组边)</text>
  <path d="M250,144 L250,158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="130" y="162" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对小组做 Kahn 拓扑排序</text>
  <path d="M250,202 L250,216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <polygon points="250,220 322,256 250,292 178,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">小组图</text>
  <text x="250" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有环?</text>
  <!-- yes -->
  <path d="M322,256 L372,256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="347" y="249" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="372" y="238" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="261" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 []</text>
  <!-- no -->
  <path d="M250,292 L250,306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="266" y="302" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Step 4 -->
  <rect x="80" y="310" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按组序遍历：对每组内项目做 Kahn 拓扑排序</text>
  <path d="M250,350 L250,364" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision 2 -->
  <polygon points="250,368 322,404 250,440 178,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="401" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">项目图</text>
  <text x="250" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有环?</text>
  <!-- yes -->
  <path d="M322,404 L372,404" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="347" y="397" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="372" y="386" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="409" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 []</text>
  <!-- no -->
  <path d="M250,440 L250,440" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M178,404 L120,404" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="155" y="397" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="28" y="386" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="409" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">拼接返回</text>
</svg>
