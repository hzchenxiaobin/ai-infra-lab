  <text x="421" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- 结果 -->
  <rect x="96" y="330" width="378" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="351" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">结果 ans = [3, 4, −1, −1, −1] ✓</text>
