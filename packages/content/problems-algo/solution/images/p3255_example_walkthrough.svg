  <text x="421" y="202" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[1]=4</text>

  <!-- 行 4 -->
  <rect x="46" y="216" width="50" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
