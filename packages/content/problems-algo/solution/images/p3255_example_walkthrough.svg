  <text x="320" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="421" y="134" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

