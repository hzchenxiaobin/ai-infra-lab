  <text x="188" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">链</text>
  <text x="244" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="320" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i ≥ k−1 ?</text>
  <text x="421" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">写入 ans</text>

  <!-- 行 0 -->
  <rect x="46" y="80" width="50" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="80" width="64" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="80" width="56" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
