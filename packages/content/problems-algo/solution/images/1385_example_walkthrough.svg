<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr1=[4,5,8]，arr2 排序=[1,8,9,10]，d=2</text>

  <!-- common scale: value v -> x = 80 + v*40 (range 0..12) -->

  <!-- ============ Row 1: x=4 ============ -->
  <text x="30" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">步1：x = 4</text>
  <text x="30" y="82" font-size="11" fill="#333">窗口 [2, 6]</text>

  <!-- window rect [2,6]: x 160..320 -->
  <rect x="160" y="92" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)" opacity="0.7"/>

  <!-- number line -->
  <line x1="80" y1="130" x2="560" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr2 elements: 1,8,9,10 -->
  <circle cx="120" cy="130" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="400" cy="130" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <circle cx="440" cy="130" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <circle cx="480" cy="130" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="134" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>

  <!-- tick marks at 2 and 6 -->
  <line x1="160" y1="126" x2="160" y2="118" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">2</text>
  <line x1="320" y1="126" x2="320" y2="118" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">6</text>

  <!-- lower_bound(2) -> 8 -->
  <path d="M 400 142 L 400 150" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="162" text-anchor="middle" font-size="10" fill="#888">lower_bound(2)=8，8 &gt; 6</text>

  <!-- result -->
  <rect x="470" y="56" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="535" y="77" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 计数 ans=1</text>

  <!-- ============ Row 2: x=5 ============ -->
  <text x="30" y="194" font-size="12" fill="#4a7a3a" font-weight="bold">步2：x = 5</text>
  <text x="30" y="212" font-size="11" fill="#333">窗口 [3, 7]</text>

  <!-- window rect [3,7]: x 200..360 -->
  <rect x="200" y="222" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)" opacity="0.7"/>

  <!-- number line -->
  <line x1="80" y1="260" x2="560" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="120" cy="260" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="400" cy="260" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <circle cx="440" cy="260" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <circle cx="480" cy="260" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>

  <line x1="200" y1="256" x2="200" y2="248" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a">3</text>
  <line x1="360" y1="256" x2="360" y2="248" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a">7</text>

  <path d="M 400 272 L 400 280" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="292" text-anchor="middle" font-size="10" fill="#888">lower_bound(3)=8，8 &gt; 7</text>

  <rect x="470" y="186" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="535" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 计数 ans=2</text>

  <!-- ============ Row 3: x=8 ============ -->
  <text x="30" y="324" font-size="12" fill="#b85450" font-weight="bold">步3：x = 8</text>
  <text x="30" y="342" font-size="11" fill="#333">窗口 [6, 10]</text>

  <!-- window rect [6,10]: x 320..480 -->
  <rect x="320" y="352" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)" opacity="0.7"/>

  <!-- number line -->
  <line x1="80" y1="390" x2="560" y2="390" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="120" cy="390" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="394" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="400" cy="390" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">8</text>
  <circle cx="440" cy="390" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9</text>
  <circle cx="480" cy="390" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <line x1="320" y1="386" x2="320" y2="378" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="9" fill="#b85450">6</text>
  <line x1="480" y1="386" x2="480" y2="378" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="374" text-anchor="middle" font-size="9" fill="#b85450">10</text>

  <path d="M 400 402 L 400 410" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="422" text-anchor="middle" font-size="10" fill="#888">lower_bound(6)=8，8 ≤ 10</text>

  <rect x="470" y="316" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="535" y="337" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 跳过（有近邻）</text>

  <!-- bottom summary -->
  <line x1="40" y1="436" x2="580" y2="436" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="452" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最终 ans = 2（步1、步2 符合，步3 不符合）</text>
</svg>
