<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">情侣牵手：座位成对（沙发），情侣靠 XOR 配对</text>

  <!-- ===== Left panel: couches & couples ===== -->
  <rect x="24" y="48" width="252" height="248" rx="10" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">沙发 = 相邻两个座位 (2i, 2i+1)</text>

  <!-- Couch 0: seats 0,1 -> couple (0,1) -->
  <rect x="44" y="92" width="208" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="96" width="98" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="113" text-anchor="middle" font-size="12" fill="#333">座位0</text>
  <rect x="150" y="96" width="98" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="199" y="113" text-anchor="middle" font-size="12" fill="#333">座位1</text>
  <text x="150" y="84" text-anchor="middle" font-size="10" fill="#446688">沙发0 → 应坐情侣 (0,1)</text>

  <!-- Couch 1: seats 2,3 -> couple (2,3) -->
  <rect x="44" y="140" width="208" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="144" width="98" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="161" text-anchor="middle" font-size="12" fill="#333">座位2</text>
  <rect x="150" y="144" width="98" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="199" y="161" text-anchor="middle" font-size="12" fill="#333">座位3</text>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">沙发1 → 应坐情侣 (2,3)</text>

  <!-- Couch 2: seats 4,5 -> couple (4,5) -->
  <rect x="44" y="188" width="208" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="192" width="98" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="209" text-anchor="middle" font-size="12" fill="#333">座位4</text>
  <rect x="150" y="192" width="98" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="199" y="209" text-anchor="middle" font-size="12" fill="#333">座位5</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#d6a040">沙发2 → 应坐情侣 (4,5)</text>

  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#555">每个沙发坐一对情侣即“配对成功”</text>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">目标：让每个沙发上的两人互为情侣</text>

  <!-- ===== Right panel: XOR partner rule ===== -->
  <rect x="292" y="48" width="244" height="248" rx="10" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">伴侣 ID = x XOR 1</text>

  <!-- couple pairs -->
  <rect x="320" y="92" width="80" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="12" fill="#333">0 ⇄ 1</text>
  <text x="420" y="112" font-size="11" fill="#888">0 ^ 1 = 1</text>

  <rect x="320" y="132" width="80" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="152" text-anchor="middle" font-size="12" fill="#333">2 ⇄ 3</text>
  <text x="420" y="152" font-size="11" fill="#888">2 ^ 1 = 3</text>

  <rect x="320" y="172" width="80" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="192" text-anchor="middle" font-size="12" fill="#333">4 ⇄ 5</text>
  <text x="420" y="192" font-size="11" fill="#888">4 ^ 1 = 5</text>

  <rect x="320" y="212" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="232" text-anchor="middle" font-size="12" fill="#333">6 ⇄ 7</text>
  <text x="420" y="232" font-size="11" fill="#888">6 ^ 1 = 7</text>

  <text x="414" y="262" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">偶数 ^ 1 = +1，奇数 ^ 1 = −1</text>
  <text x="414" y="280" text-anchor="middle" font-size="11" fill="#555">O(1) 算出伴侣，免查表</text>

  <!-- ===== Bottom note box ===== -->
  <rect x="40" y="312" width="480" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：人 x 的伴侣是 x^1；沙发 i 应放情侣 (2i, 2i+1)</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666">把“2n 个座位”看成“n 个沙发”，每次交换让一个沙发配对成功</text>
</svg>
