<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：提取 → 排序 → 交替分配 → 求和</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">O(n log n) 时间 / O(n) 空间，n 为位数（≤10）</text>

  <!-- Step 1: 输入 -->
  <rect x="170" y="58" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 num（2~10 位正整数）</text>

  <path d="M 260 98 L 260 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 提取数位 -->
  <rect x="140" y="120" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">提取数位 → d = [数位…]</text>
  <text x="260" y="154" text-anchor="middle" font-size="10" fill="#888">num % 10 取末位，num /= 10 循环至 0</text>

  <path d="M 260 166 L 260 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 升序排序 -->
  <rect x="140" y="188" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">升序排序 → d₀ ≤ d₁ ≤ … ≤ dₙ₋₁</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#888">最小数位在前，准备配最大权重</text>

  <path d="M 260 234 L 260 252" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 交替分配 (process box) -->
  <polygon points="260,256 406,292 260,328 114,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交替分配</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a">偶下标 → num1 = num1×10 + d[i]</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#d6a040">奇下标 → num2 = num2×10 + d[i]</text>

  <path d="M 260 330 L 260 346" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 返回和 -->
  <rect x="150" y="350" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 num1 + num2</text>

  <!-- Side annotation -->
  <path d="M 406 292 L 438 292" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="444" y="288" font-size="10" fill="#888">重排不等式</text>
  <text x="444" y="300" font-size="10" fill="#888">小配大权重</text>
</svg>
