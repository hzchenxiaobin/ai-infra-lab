<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="480" fill="#fafafa"/>

  <text x="220" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Boyer-Moore 投票算法流程</text>

  <!-- Init -->
  <rect x="80" y="42" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">candidate = ∅,  count = 0</text>

  <path d="M 220 96 L 220 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="220,118 330,160 220,202 110,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有元素 x ?</text>
  <text x="220" y="174" text-anchor="middle" font-size="10.5" fill="#777">遍历未结束？</text>

  <!-- No -> return -->
  <path d="M 330 160 L 390 160 L 390 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="350" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="300" y="242" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="365" y="267" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return candidate</text>

  <!-- Yes down -->
  <path d="M 220 202 L 220 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="238" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Diamond: count == 0 ? -->
  <polygon points="220,224 320,266 220,308 120,266" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count == 0 ?</text>
  <text x="220" y="280" text-anchor="middle" font-size="10.5" fill="#777">候选已被抵消？</text>

  <!-- Yes (count==0): pick candidate -->
  <path d="M 120 266 L 50 266 L 50 330" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="68" y="258" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="334" width="120" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="66" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换新候选</text>
  <text x="66" y="374" text-anchor="middle" font-size="10.5" fill="#555">candidate = x</text>
  <text x="66" y="390" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count = 1</text>

  <!-- No (count!=0): go to compare x with candidate -->
  <path d="M 320 266 L 390 266 L 390 330" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="258" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- compare diamond -->
  <polygon points="390,334 460,372 390,410 320,372" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="368" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">x == candidate ?</text>

  <!-- equal: count+1 -->
  <path d="M 320 372 L 250 372" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="285" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">==</text>
  <rect x="146" y="348" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="196" y="368" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">盟友 +1</text>
  <text x="196" y="386" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">count += 1</text>

  <!-- not equal: count-1 -->
  <path d="M 390 410 L 390 426" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="410" y="424" font-size="10" fill="#b85450" font-weight="bold">!=</text>
  <rect x="320" y="430" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="390" y="448" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">对手抵消</text>
  <text x="390" y="463" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">count -= 1</text>

  <!-- loop back arrows to loop check -->
  <path d="M 66 334 L 66 160 L 110 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 196 348 L 196 160 L 130 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 390 470 L 390 478 L 250 478 L 250 210 L 250 202" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <text x="220" y="466" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">三个分支都回到循环顶部</text>
</svg>
