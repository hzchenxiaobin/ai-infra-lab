<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单趟扫描 + 实体匹配决策</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">i 单调递增；遇 &amp; 则在 [i, i+7) 找 ';' 查哈希表，命中跳过整个实体</text>

  <!-- start box -->
  <rect x="220" y="56" width="160" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = 0, res = []</text>

  <path d="M 300 92 L 300 104" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Diamond 1: i < n ? -->
  <polygon points="300,106 380,138 300,170 220,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n ?</text>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#d6a040">循环条件</text>

  <!-- No: right to return -->
  <path d="M 380 138 L 416 138" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="130" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="418" y="120" width="150" height="36" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="142" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">return ''.join(res)</text>

  <!-- Yes: down to Diamond 2 -->
  <path d="M 300 170 L 300 184" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="308" y="182" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- Diamond 2: text[i] == '&' ? -->
  <polygon points="300,186 380,218 300,250 220,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">text[i] == '&amp;' ?</text>
  <text x="300" y="230" text-anchor="middle" font-size="10" fill="#d6a040">实体起点？</text>

  <!-- No: left to box A -->
  <path d="M 220 218 L 180 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="200" y="210" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="36" y="200" width="144" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">append text[i]; i+=1</text>

  <!-- Yes: down to find box -->
  <path d="M 300 250 L 300 264" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="308" y="262" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- find box -->
  <rect x="170" y="266" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">在 text[i .. i+7) 中找 ';'</text>
  <text x="300" y="298" text-anchor="middle" font-size="10" fill="#666">取 ent = text[i : semi+1]</text>

  <path d="M 300 306 L 300 318" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Diamond 3: ent in map ? -->
  <polygon points="300,320 380,352 300,384 220,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="348" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ent 在哈希表 ?</text>
  <text x="300" y="364" text-anchor="middle" font-size="10" fill="#d6a040">查 6 种实体</text>

  <!-- Yes: left to box B -->
  <path d="M 220 352 L 180 352" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="200" y="344" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="334" width="160" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">append 映射字符; i=semi+1</text>

  <!-- No: right to box C -->
  <path d="M 380 352 L 416 352" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="344" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="418" y="334" width="150" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="493" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">append '&amp;'; i+=1</text>
  <text x="493" y="362" text-anchor="middle" font-size="9" fill="#b85450">&amp; 当普通字符</text>

  <!-- loop back: box A -> up left -> diamond 1 -->
  <path d="M 108 200 L 108 88 L 220 88 L 220 120 L 240 130" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <!-- loop back: box B -> up left (join box A path) -->
  <path d="M 100 334 L 100 200" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <!-- loop back: box C -> up right -> diamond 1 -->
  <path d="M 493 334 L 493 88 L 380 88 L 380 120 L 360 130" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="160" font-size="9" fill="#999">循环下一 i</text>
  <text x="510" y="160" font-size="9" fill="#999">循环下一 i</text>

  <!-- bottom note -->
  <rect x="30" y="404" width="540" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="426" font-size="11" fill="#446688" font-weight="bold">💡 三条路径殊途同归：i 单调递增，每个字符只被消费一次</text>
  <text x="50" y="444" font-size="10" fill="#666">普通字符快路径（左上）；命中实体跳过整段（左下）；伪实体 &amp; 当普通字符（右下）</text>
</svg>
