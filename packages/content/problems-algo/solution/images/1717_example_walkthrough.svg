<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "cdbcbbaaabab", x = 4, y = 5 → 19</text>

  <text x="40" y="52" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">y(5) &gt; x(4) ⇒ 先栈删 "ba"(+5)，再用剩余删 "ab"(+4)</text>

  <!-- ===== Input row ===== -->
  <text x="40" y="84" font-size="10" fill="#888" filter="url(#rough2)">输入 s：</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <!-- 12 boxes, x from 90, w=32 -->
    <rect x="90" y="72" width="32" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="106" y="91" fill="#666">c</text>
    <rect x="122" y="72" width="32" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="138" y="91" fill="#666">d</text>
    <rect x="154" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="170" y="91" fill="#446688">b</text>
    <rect x="186" y="72" width="32" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="202" y="91" fill="#666">c</text>
    <rect x="218" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="234" y="91" fill="#446688">b</text>
    <rect x="250" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="266" y="91" fill="#446688">b</text>
    <rect x="282" y="72" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="298" y="91" fill="#d6a040">a</text>
    <rect x="314" y="72" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="330" y="91" fill="#d6a040">a</text>
    <rect x="346" y="72" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="362" y="91" fill="#d6a040">a</text>
    <rect x="378" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="394" y="91" fill="#446688">b</text>
    <rect x="410" y="72" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="426" y="91" fill="#d6a040">a</text>
    <rect x="442" y="72" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="458" y="91" fill="#446688">b</text>
  </g>

  <!-- ===== Pass 1 ===== -->
  <rect x="40" y="116" width="500" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="136" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第一趟：栈删 "ba"（top=b 且来 a → 弹，+5/次）</text>
  <line x1="52" y1="142" x2="528" y2="142" stroke="#e8c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="160" font-size="10" fill="#555" filter="url(#rough2)">读 a，栈顶 b → 弹 b，+5 ；再读 a，栈顶又是 b → 弹 b，+5</text>
  <text x="52" y="176" font-size="10" fill="#555" filter="url(#rough2)">…读 a，栈顶 b → 弹 b，+5（第三次命中）</text>
  <text x="52" y="194" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中 3 次 "ba" ⇒ g1 = 3 × 5 = 15</text>

  <!-- remaining row -->
  <text x="52" y="214" font-size="10" fill="#888" filter="url(#rough2)">剩余串 =</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="120" y="202" width="32" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="136" y="220" fill="#666">c</text>
    <rect x="152" y="202" width="32" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="168" y="220" fill="#666">d</text>
    <rect x="184" y="202" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="200" y="220" fill="#446688">b</text>
    <rect x="216" y="202" width="32" height="26" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="232" y="220" fill="#666">c</text>
    <rect x="248" y="202" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/><text x="264" y="220" fill="#d6a040">a</text>
    <rect x="280" y="202" width="32" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4"/><text x="296" y="220" fill="#446688">b</text>
  </g>
  <text x="324" y="220" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 末尾 "ab" 留给第二趟</text>

  <!-- arrow down -->
  <path d="M 290 236 L 290 252" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pass 2 ===== -->
  <rect x="40" y="256" width="500" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="276" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二趟：拿剩余串 "cdbcab" 栈删 "ab"（top=a 且来 b → 弹，+4/次）</text>
  <line x1="52" y1="282" x2="528" y2="282" stroke="#c0e0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="10" fill="#555" filter="url(#rough2)">读到末位 b，栈顶 a → 弹 a，+4（唯一一次命中）</text>
  <text x="52" y="318" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 1 次 "ab" ⇒ g2 = 4</text>

  <!-- leftover -->
  <text x="52" y="344" font-size="10" fill="#888" filter="url(#rough2)">最终剩余 =</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="140" y="332" width="32" height="22" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="156" y="348" fill="#666">c</text>
    <rect x="172" y="332" width="32" height="22" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="188" y="348" fill="#666">d</text>
    <rect x="204" y="332" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/><text x="220" y="348" fill="#446688">b</text>
    <rect x="236" y="332" width="32" height="22" fill="#eeeeee" stroke="#888" stroke-width="1.4" rx="4"/><text x="252" y="348" fill="#666">c</text>
  </g>
  <text x="280" y="348" font-size="10" fill="#888" filter="url(#rough2)">（再无 "ab" / "ba"）</text>

  <!-- arrow down -->
  <path d="M 290 358 L 290 374" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Total ===== -->
  <g filter="url(#rough2)">
    <rect x="160" y="378" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="290" y="400" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">总分 = g1 + g2 = 15 + 4</text>
    <text x="290" y="418" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">= 19</text>
  </g>
</svg>
