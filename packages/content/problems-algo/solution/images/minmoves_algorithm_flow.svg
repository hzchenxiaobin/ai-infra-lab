<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：反向贪心从 target 倒推到 1</text>

  <!-- Start -->
  <rect x="230" y="44" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">moves = 0</text>
  <path d="M 280 72 L 280 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,92 410,142 280,192 150,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">target &gt; 1 且</text>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxDoubles &gt; 0 ?</text>

  <!-- No branch: right -> finalize -->
  <path d="M 410 142 L 458 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="136" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="128" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="506" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">moves +=</text>
  <text x="506" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target − 1</text>
  <path d="M 506 160 L 506 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="456" y="186" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="506" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return moves</text>

  <!-- Yes branch: down -->
  <path d="M 280 192 L 280 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Inner decision: even? -->
  <polygon points="280,214 380,254 280,294 180,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">target 为偶数?</text>

  <!-- Yes (left): halve -->
  <path d="M 180 254 L 110 254" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="20" y="238" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target ÷= 2</text>
  <text x="65" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">doubles −= 1</text>

  <!-- No (right): decrement -->
  <path d="M 380 254 L 450 254" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="452" y="238" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="497" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target −= 1</text>

  <!-- merge to moves += 1 -->
  <path d="M 65 274 L 65 320 L 200 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 497 274 L 497 320 L 360 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="306" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">moves += 1</text>

  <!-- loop back arrow: from moves+=1 up to loop condition -->
  <path d="M 280 336 L 280 358" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="352" font-size="10" fill="#888" font-weight="bold">回到循环判断</text>

  <!-- loop back curve -->
  <path d="M 200 321 L 60 321 L 60 142 L 150 142" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note box -->
  <rect x="60" y="380" width="440" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">循环结束时：要么 target == 1（已到起点），要么 doubles 用尽</text>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#666">doubles 用尽时，剩余 target−1 步只能靠 +1 走完，一次性累加</text>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#888">（target == 1 时 target−1 = 0，不影响结果）</text>
</svg>
