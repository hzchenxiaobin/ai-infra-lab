<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：统计两类失配 → 逐档配对计费</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="150" y="40" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="59" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">开始</text>
  </g>
  <path d="M 200 68 L 200 84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>

  <!-- 步骤 1：统计 -->
  <g filter="url(#rough2)">
    <rect x="65" y="88" width="270" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="107" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">一遍扫描 s 与 t</text>
    <text x="200" y="124" text-anchor="middle" font-size="11.5" fill="#33506b">a = #(s=0,t=1)，b = #(s=1,t=0)</text>
  </g>
  <path d="M 200 132 L 200 148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>

  <!-- 步骤 2：异向对 -->
  <g filter="url(#rough2)">
    <rect x="65" y="152" width="270" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="171" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">p = min(a, b)　← 异向对</text>
    <text x="200" y="188" text-anchor="middle" font-size="11.5" fill="#33506b">ans += p × min(S, 2F)</text>
  </g>
  <path d="M 200 196 L 200 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>

  <!-- 步骤 3：同向对 -->
  <g filter="url(#rough2)">
    <rect x="65" y="216" width="270" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="235" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">r = |a − b|　← 剩余同型失配</text>
    <text x="200" y="252" text-anchor="middle" font-size="11.5" fill="#33506b">ans += ⌊r/2⌋ × min(X+S, 2F)</text>
  </g>
  <path d="M 200 260 L 200 276" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>

  <!-- 判断 r 奇偶 -->
  <g filter="url(#rough2)">
    <polygon points="200,280 272,314 200,348 128,314" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="200" y="319" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">r 为奇数？</text>
  </g>

  <!-- 是：落单个 -->
  <path d="M 272 314 L 338 314" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="340" y="292" width="175" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="427" y="311" text-anchor="middle" font-size="12.5" fill="#a04340" font-weight="bold">ans += F</text>
    <text x="427" y="328" text-anchor="middle" font-size="11" fill="#a04340">落单的最后 1 个失配</text>
  </g>

  <!-- 否：直达返回 -->
  <path d="M 200 348 L 200 376" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="213" y="366" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 落单支路汇合 -->
  <path d="M 427 336 L 427 399 L 283 399" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="125" y="380" width="150" height="30" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="400" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">返回 ans</text>
  </g>

  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">F = flipCost，S = swapCost，X = crossCost；一遍扫描，时间 O(n)、空间 O(1)</text>
</svg>
