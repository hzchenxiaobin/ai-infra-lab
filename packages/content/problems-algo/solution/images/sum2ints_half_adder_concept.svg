<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：加法 = 异或求本位和 + 与运算左移求进位</text>

  <!-- ===== Row a: a = 5 = 0101 ===== -->
  <text x="44" y="82" font-size="12.5" fill="#446688" font-weight="bold">a = 5</text>
  <text x="44" y="97" font-size="10" fill="#888">二进制</text>
  <rect x="180" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="384" y="80" font-size="10" fill="#888">高位 → 低位</text>

  <!-- ===== Row b: b = 7 = 0111 ===== -->
  <text x="44" y="134" font-size="12.5" fill="#446688" font-weight="bold">b = 7</text>
  <rect x="180" y="110" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="110" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="110" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="330" y="110" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="132" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- split arrows: XOR (left/down) and AND<<1 (right/down) -->
  <path d="M 201 142 Q 201 156 201 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 301 142 Q 301 156 301 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="164" font-size="10.5" fill="#d6a040" font-weight="bold">⊕ 异或</text>
  <text x="372" y="164" font-size="10.5" fill="#4a7a3a" font-weight="bold">&amp; 再左移</text>

  <!-- ===== Row result1: 本位和 a^b = 0010 ===== -->
  <text x="44" y="197" font-size="12.5" fill="#d6a040" font-weight="bold">本位和</text>
  <text x="44" y="212" font-size="10" fill="#888">a ⊕ b = 2</text>
  <rect x="180" y="175" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="197" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="175" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="197" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="175" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="197" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="330" y="175" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="197" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="197" font-size="10.5" fill="#d6a040" font-weight="bold">↑ 位不同则 1</text>

  <!-- ===== Row result2: 进位 (a&b)<<1 = 1010 ===== -->
  <text x="44" y="252" font-size="12.5" fill="#4a7a3a" font-weight="bold">进位</text>
  <text x="44" y="267" font-size="10" fill="#888">(a&amp;b)&lt;&lt;1 = 10</text>
  <rect x="180" y="230" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="252" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="230" y="230" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="252" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="230" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="252" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="330" y="230" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="252" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="252" font-size="10.5" fill="#4a7a3a" font-weight="bold">↑ 同为 1 才进位</text>

  <!-- arrow down to formula -->
  <path d="M 270 266 Q 270 280 270 290" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="50" y="294" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a + b = (a ⊕ b) + ((a &amp; b) &lt;&lt; 1)  →  递归套用到进位为 0</text>

  <!-- bottom note -->
  <rect x="50" y="344" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="363" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">每轮进位整体左移一位，多出一个最低位 0</text>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#b85450">最多 32 轮进位被「挤出」字长，循环终止</text>
</svg>
