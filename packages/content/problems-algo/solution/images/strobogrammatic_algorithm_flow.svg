<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：对撞双指针核对旋转对</text>

  <!-- 起点 -->
  <rect x="210" y="44" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l = 0, r = n−1</text>
  <line x1="260" y1="74" x2="260" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策 1：l <= r ? -->
  <polygon points="260,96 340,132 260,168 180,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l ≤ r ?</text>
  <!-- 否 → return true -->
  <line x1="340" y1="132" x2="372" y2="132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="374" y="116" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return true ✓</text>
  <!-- 是 → 下一决策 -->
  <line x1="260" y1="168" x2="260" y2="186" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="182" font-size="10" fill="#d6a040" filter="url(#rough2)">是</text>

  <!-- 决策 2：num[l] 合法 ? -->
  <polygon points="260,190 340,226 260,262 180,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num[l] 在</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">映射表中?</text>
  <!-- 否 → return false 非法字符 -->
  <line x1="340" y1="226" x2="372" y2="226" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="220" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="374" y="210" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="432" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return false</text>
  <text x="432" y="244" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">非法字符 2/3/4/5/7</text>
  <!-- 是 → 下一决策 -->
  <line x1="260" y1="262" x2="260" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="276" font-size="10" fill="#d6a040" filter="url(#rough2)">是</text>

  <!-- 决策 3：rotate(num[l]) == num[r] ? -->
  <polygon points="260,284 350,320 260,356 170,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rotate(num[l])</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== num[r] ?</text>
  <!-- 否 → return false 配对失败 -->
  <line x1="350" y1="320" x2="372" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="314" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="374" y="304" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="432" y="325" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return false</text>
  <text x="432" y="338" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">旋转后不等</text>
  <!-- 是 → l++, r-- -->
  <line x1="260" y1="356" x2="260" y2="372" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="368" font-size="10" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="210" y="374" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l++, r−−</text>

  <!-- 回到循环顶部（左侧弧线） -->
  <path d="M 210 388 Q 110 388 110 132 Q 110 96 178 132" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="260" font-size="10" fill="#446688" filter="url(#rough2)" transform="rotate(-90 92 260)">回到循环顶部</text>
</svg>
