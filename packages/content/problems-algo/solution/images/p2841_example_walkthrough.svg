<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,6,7,3,1,7]，m = 3，k = 4</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">共 n − k + 1 = 3 个窗口，逐个平移</text>

  <!-- table header -->
  <rect x="30" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口</text>
  <rect x="150" y="60" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">freq（非零项）</text>
  <rect x="320" y="60" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">distinct</text>
  <rect x="400" y="60" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>
  <rect x="470" y="60" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="525" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">判定 ≥ m</text>
  <rect x="580" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="605" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1: [2,6,7,3] -->
  <rect x="30" y="94" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[2,6,7,3]</text>
  <rect x="150" y="94" width="170" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2:1, 6:1, 7:1, 3:1}</text>
  <rect x="320" y="94" width="80" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="400" y="94" width="70" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <rect x="470" y="94" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="525" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 ≥ 3 ✓</text>
  <rect x="580" y="94" width="50" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="605" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- row 2: [6,7,3,1] -->
  <rect x="30" y="132" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[6,7,3,1]</text>
  <rect x="150" y="132" width="170" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{6:1, 7:1, 3:1, 1:1}</text>
  <rect x="320" y="132" width="80" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="400" y="132" width="70" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <rect x="470" y="132" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="525" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 ≥ 3 ✓</text>
  <rect x="580" y="132" width="50" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="605" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>

  <!-- row 3: [7,3,1,7] highlighted -->
  <rect x="30" y="170" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[7,3,1,7]</text>
  <rect x="150" y="170" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{7:2, 3:1, 1:1}</text>
  <rect x="320" y="170" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="193" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="400" y="170" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <rect x="470" y="170" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="525" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 ≥ 3 ✓</text>
  <rect x="580" y="170" width="50" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="605" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- transitions -->
  <text x="90" y="228" text-anchor="start" font-size="11" fill="#999" filter="url(#rough2)">窗口 1 → 2：出 2 进 1，种类仍为 4，sum 18 → 17</text>
  <text x="90" y="248" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">窗口 2 → 3：出 6 进 7，freq[7] 从 1 变 2，种类 4 → 3</text>

  <!-- key note -->
  <rect x="40" y="264" width="560" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="283" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">「几乎唯一」允许重复：7 出现两次不碍事</text>
  <text x="320" y="301" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">只要不同值的个数 ≥ m 就合法；若 m = k = 4，此窗口将被判非法</text>

  <!-- answer -->
  <rect x="190" y="320" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="346" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终答案 ans = 18</text>
</svg>
