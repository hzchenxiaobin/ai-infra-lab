<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="argray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：盒0 → 盒2 → 盒1，共 16 颗</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#888">status=[1,0,1,0] candies=[7,5,4,100] keys=[[],[],[1],[]] contained=[[1,2],[3],[],[]] start=[0]</text>

  <!-- step 0: box 0 open -->
  <g filter="url(#sk)">
    <rect x="30" y="86" width="120" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="90" y="106" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">步骤① 开盒0</text>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="#555">status=1，直接入队</text>
  <text x="90" y="140" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">+7  → ans=7</text>
  <text x="90" y="158" text-anchor="middle" font-size="10" fill="#888">得盒1,2；无钥匙</text>

  <!-- box 1 held but closed -->
  <g filter="url(#sk)">
    <rect x="170" y="86" width="70" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="205" y="106" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">盒1 关</text>
  <text x="205" y="122" text-anchor="middle" font-size="10" fill="#888">hasBox=✓</text>
  <text x="205" y="136" text-anchor="middle" font-size="10" fill="#888">hasKey=✗</text>

  <!-- box 2 open -->
  <g filter="url(#sk)">
    <rect x="260" y="86" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="295" y="106" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">盒2 开</text>
  <text x="295" y="122" text-anchor="middle" font-size="10" fill="#888">status=1</text>
  <text x="295" y="136" text-anchor="middle" font-size="10" fill="#4a8e4a">可开 ✓</text>

  <path d="M 90 150 L 90 172" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- step 2: open box 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="174" width="200" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="130" y="194" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">步骤② 开盒2（status=1）</text>
  <text x="130" y="212" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">+4  → ans=11</text>
  <text x="130" y="230" text-anchor="middle" font-size="10" fill="#888">得钥匙[1]；无内含盒</text>

  <!-- key 1 unlocks box 1 -->
  <path d="M 130 238 L 130 258" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="260" width="280" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="200" y="285" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">新得钥匙1：hasBox[1] 已为真 → 触发开盒1</text>

  <path d="M 200 300 L 200 318" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- step 3: open box 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="320" width="220" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="140" y="340" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">步骤③ 开盒1（钥匙解锁）</text>
  <text x="140" y="358" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">+5  → ans=16　得盒3(关,无钥匙→搁置)</text>

  <!-- right summary -->
  <g filter="url(#sk)">
    <rect x="360" y="86" width="170" height="150" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="445" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">资源表变化</text>
  <path d="M 380 118 Q 445 124 510 118" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="11" fill="#444">
    <text x="376" y="140">初始 hasBox={0}</text>
    <text x="376" y="160">开0: hasBox={1,2}</text>
    <text x="376" y="180">开2: hasKey={1}</text>
    <text x="376" y="200">开1: hasBox={3}</text>
    <text x="376" y="222" fill="#b03a3a" font-weight="bold">盒3 关 且无钥匙 → 弃</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="360" y="320" width="170" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="445" y="345" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">总糖果 = 7+4+5</text>
  <text x="445" y="362" text-anchor="middle" font-size="16" fill="#b03a3a" font-weight="bold">= 16</text>
</svg>
