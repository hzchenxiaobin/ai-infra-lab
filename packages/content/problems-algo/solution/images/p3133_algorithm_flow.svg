<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="15" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双指针填位 —— i 扫 x 的位找空槽，j 读 v = n−1 的位</text>

  <!-- start -->
  <rect x="210" y="26" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="280" y="45" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 54 L 280 66" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="160" y="68" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v ← n−1；ans ← x；i = j = 0</text>
  <path d="M 280 98 L 280 114" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: v has bits left? -->
  <polygon points="185,158 280,118 375,158 280,198" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">v &gt;&gt; j ≠ 0 ?</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（v 还有位没填）</text>

  <!-- no -> return -->
  <path d="M 375 158 L 400 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="387" y="150" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="404" y="142" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="474" y="162" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -> diamond 2 -->
  <path d="M 280 198 L 280 214" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="210" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- diamond 2: fixed bit of x? -->
  <polygon points="185,258 280,218 375,258 280,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x 的第 i 位 = 1 ?</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（撞上固定 1 位）</text>

  <!-- yes -> skip box (left) -->
  <path d="M 185 258 L 162 258" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="172" y="249" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="18" y="240" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="88" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i++</text>
  <text x="88" y="271" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（不消耗 v 的位）</text>

  <!-- skip box loops back into D1-D2 connector -->
  <path d="M 88 240 L 88 208 L 272 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">继续查下一位</text>

  <!-- no -> diamond 3 -->
  <path d="M 280 298 L 280 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="310" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 3: bit of v is 1? -->
  <polygon points="185,358 280,318 375,358 280,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">v 的第 j 位 = 1 ?</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（往空槽 i 里填 1 ?）</text>

  <!-- yes -> set bit box (right) -->
  <path d="M 375 358 L 400 358" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="387" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="404" y="342" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="474" y="362" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">ans |= 1 &lt;&lt; i</text>

  <!-- set box -> advance box -->
  <path d="M 474 374 L 474 436 L 406 436" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no -> advance box -->
  <path d="M 280 398 L 280 416" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="412" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- advance box -->
  <rect x="160" y="418" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i++；j++</text>
  <text x="280" y="448" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（消耗 v 的第 j 位 → 移到下一个空槽）</text>

  <!-- loop back to diamond 1 -->
  <path d="M 280 454 L 280 484 L 12 484 L 12 158 L 176 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="478" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（回到循环头）</text>

  <!-- complexity note -->
  <rect x="90" y="494" width="380" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="280" y="508" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">循环次数 ≤ bit(x) + bit(n−1) ≤ 54：时间 O(log n + log x)，空间 O(1)</text>
</svg>
