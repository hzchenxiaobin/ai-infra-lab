<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">示例演算：栈匹配全过程</text>

  <!-- ===== Left: s = "aabcbc" (valid) ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s = "aabcbc" → 有效 ✓</text>

  <!-- input chars row -->
  <g font-size="11" fill="#333">
    <rect x="40" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="84" text-anchor="middle" font-weight="bold">a</text>
    <rect x="72" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="87" y="84" text-anchor="middle" font-weight="bold">a</text>
    <rect x="104" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="119" y="84" text-anchor="middle" font-weight="bold">b</text>
    <rect x="136" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="151" y="84" text-anchor="middle" font-weight="bold">c</text>
    <rect x="168" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="183" y="84" text-anchor="middle" font-weight="bold">b</text>
    <rect x="200" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="215" y="84" text-anchor="middle" font-weight="bold">c</text>
  </g>

  <!-- steps -->
  <g font-size="10" fill="#333">
    <!-- Step 1: read a -->
    <text x="36" y="112" fill="#446688" font-weight="bold">① a</text>
    <rect x="68" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="79" y="119" text-anchor="middle" font-weight="bold">a</text>
    <text x="98" y="119" fill="#888">栈: [a]</text>

    <!-- Step 2: read a -->
    <text x="36" y="146" fill="#446688" font-weight="bold">② a</text>
    <rect x="68" y="138" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="79" y="153" text-anchor="middle" font-weight="bold">a</text>
    <rect x="92" y="138" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="103" y="153" text-anchor="middle" font-weight="bold">a</text>
    <text x="122" y="153" fill="#888">栈: [a a]</text>

    <!-- Step 3: read b -->
    <text x="36" y="180" fill="#446688" font-weight="bold">③ b</text>
    <rect x="68" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="79" y="187" text-anchor="middle" font-weight="bold">a</text>
    <rect x="92" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="103" y="187" text-anchor="middle" font-weight="bold">a</text>
    <rect x="116" y="172" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="127" y="187" text-anchor="middle" font-weight="bold">b</text>
    <text x="146" y="187" fill="#888">栈: [a a b]</text>

    <!-- Step 4: read c -> pop 3 (highlight) -->
    <text x="36" y="214" fill="#b85450" font-weight="bold">④ c</text>
    <rect x="68" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="79" y="221" text-anchor="middle" font-weight="bold" fill="#b85450">a</text>
    <rect x="92" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="103" y="221" text-anchor="middle" font-weight="bold" fill="#b85450">b</text>
    <rect x="116" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="127" y="221" text-anchor="middle" font-weight="bold" fill="#b85450">c</text>
    <text x="146" y="221" fill="#b85450" font-weight="bold">栈顶=abc → 弹出3</text>
    <text x="146" y="234" fill="#888">栈: [a]</text>

    <!-- Step 5: read b -->
    <text x="36" y="252" fill="#446688" font-weight="bold">⑤ b</text>
    <rect x="68" y="244" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="79" y="259" text-anchor="middle" font-weight="bold">a</text>
    <rect x="92" y="244" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="103" y="259" text-anchor="middle" font-weight="bold">b</text>
    <text x="122" y="259" fill="#888">栈: [a b]</text>

    <!-- Step 6: read c -> pop 3 -->
    <text x="36" y="286" fill="#b85450" font-weight="bold">⑥ c</text>
    <rect x="68" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="79" y="293" text-anchor="middle" font-weight="bold" fill="#b85450">a</text>
    <rect x="92" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="103" y="293" text-anchor="middle" font-weight="bold" fill="#b85450">b</text>
    <rect x="116" y="278" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="127" y="293" text-anchor="middle" font-weight="bold" fill="#b85450">c</text>
    <text x="146" y="293" fill="#b85450" font-weight="bold">栈顶=abc → 弹出3</text>
    <text x="146" y="306" fill="#888">栈: [] (空)</text>
  </g>

  <!-- result -->
  <rect x="40" y="320" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">栈空 → 有效 ✓</text>

  <!-- ===== Right: s = "abccba" (invalid) ===== -->
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">s = "abccba" → 非法 ✗</text>

  <g font-size="11" fill="#333">
    <rect x="330" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="345" y="84" text-anchor="middle" font-weight="bold">a</text>
    <rect x="362" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="377" y="84" text-anchor="middle" font-weight="bold">b</text>
    <rect x="394" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="409" y="84" text-anchor="middle" font-weight="bold">c</text>
    <rect x="426" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="441" y="84" text-anchor="middle" font-weight="bold">c</text>
    <rect x="458" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="473" y="84" text-anchor="middle" font-weight="bold">b</text>
    <rect x="490" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="505" y="84" text-anchor="middle" font-weight="bold">a</text>
  </g>

  <g font-size="10" fill="#333">
    <!-- Step 1: a -->
    <text x="326" y="112" fill="#446688" font-weight="bold">① a</text>
    <rect x="358" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="369" y="119" text-anchor="middle" font-weight="bold">a</text>
    <text x="388" y="119" fill="#888">栈: [a]</text>

    <!-- Step 2: b -->
    <text x="326" y="146" fill="#446688" font-weight="bold">② b</text>
    <rect x="358" y="138" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="369" y="153" text-anchor="middle" font-weight="bold">a</text>
    <rect x="382" y="138" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="393" y="153" text-anchor="middle" font-weight="bold">b</text>
    <text x="412" y="153" fill="#888">栈: [a b]</text>

    <!-- Step 3: c -> pop 3 -->
    <text x="326" y="180" fill="#b85450" font-weight="bold">③ c</text>
    <rect x="358" y="172" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="369" y="187" text-anchor="middle" font-weight="bold" fill="#b85450">a</text>
    <rect x="382" y="172" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="393" y="187" text-anchor="middle" font-weight="bold" fill="#b85450">b</text>
    <rect x="406" y="172" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="417" y="187" text-anchor="middle" font-weight="bold" fill="#b85450">c</text>
    <text x="436" y="187" fill="#b85450" font-weight="bold">栈顶=abc → 弹出3</text>
    <text x="436" y="200" fill="#888">栈: [] (空)</text>

    <!-- Step 4: c -> no pop -->
    <text x="326" y="224" fill="#d6a040" font-weight="bold">④ c</text>
    <rect x="358" y="216" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="369" y="231" text-anchor="middle" font-weight="bold" fill="#d6a040">c</text>
    <text x="388" y="231" fill="#888">栈仅1个，不触发</text>

    <!-- Step 5: b -->
    <text x="326" y="258" fill="#446688" font-weight="bold">⑤ b</text>
    <rect x="358" y="250" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="369" y="265" text-anchor="middle" font-weight="bold">c</text>
    <rect x="382" y="250" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="393" y="265" text-anchor="middle" font-weight="bold">b</text>
    <text x="412" y="265" fill="#888">栈: [c b]</text>

    <!-- Step 6: a -> top3 = cba != abc -->
    <text x="326" y="292" fill="#d6a040" font-weight="bold">⑥ a</text>
    <rect x="358" y="284" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="369" y="299" text-anchor="middle" font-weight="bold" fill="#d6a040">c</text>
    <rect x="382" y="284" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="393" y="299" text-anchor="middle" font-weight="bold" fill="#d6a040">b</text>
    <rect x="406" y="284" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="417" y="299" text-anchor="middle" font-weight="bold" fill="#d6a040">a</text>
    <text x="436" y="299" fill="#d6a040" font-weight="bold">栈顶=cba≠abc</text>
    <text x="436" y="312" fill="#888">不消除</text>
  </g>

  <!-- result -->
  <rect x="330" y="320" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="340" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">栈非空(剩cba) → 非法 ✗</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="40" y="370" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">💡 对照要点</text>
  <text x="60" y="412" font-size="10" fill="#555">• 左侧有效：每次栈顶凑成 abc 立即消，最终栈空；嵌套的 abc 被 LIFO 自动「由内向外」拆除</text>
  <text x="60" y="428" font-size="10" fill="#555">• 右侧非法：消掉第一个 abc 后露出 c，后续 cba 顺序错乱无法组成 abc，栈残留 → 非法</text>
  <text x="60" y="444" font-size="10" fill="#555">• 关键不变式：扫描任一时刻，栈中字符都不含可消的「abc」后缀（一出现就立刻消）</text>
</svg>
