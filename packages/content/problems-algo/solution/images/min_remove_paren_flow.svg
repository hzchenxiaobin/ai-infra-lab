<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：栈存左括号下标 + 标记删除</text>

  <!-- ===== Start ===== -->
  <rect x="210" y="42" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：空栈 + remove 集合</text>
  <path d="M 280 76 L 280 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop decision ===== -->
  <polygon points="280,96 380,150 280,204 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#555">逐字符 s[i]</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#555">是否遍历完?</text>
  <text x="280" y="174" text-anchor="middle" font-size="9" fill="#888">未完 → 看 s[i]</text>

  <!-- No branch: classify char -->
  <text x="395" y="150" font-size="10" fill="#666">未完</text>
  <path d="M 380 150 L 410 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- three branches box -->
  <rect x="410" y="100" width="140" height="170" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="116" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">s[i] 分类</text>

  <!-- '(' -->
  <rect x="420" y="124" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="140" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">'('</text>
  <text x="480" y="156" text-anchor="middle" font-size="9" fill="#555">下标 i 入栈</text>

  <!-- ')' -->
  <rect x="420" y="172" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="188" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">')'</text>
  <text x="480" y="204" text-anchor="middle" font-size="9" fill="#555">看栈是否空</text>

  <!-- other -->
  <rect x="420" y="220" width="120" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="236" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">字母</text>
  <text x="480" y="252" text-anchor="middle" font-size="9" fill="#555">跳过</text>

  <!-- ')' sub-branches: loop back -->
  <path d="M 410 185 L 380 185" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch: end of scan -> mark remaining stack -->
  <text x="150" y="160" font-size="10" fill="#666">遍历完</text>
  <path d="M 180 150 L 150 150 L 150 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="232" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">标记栈中残留下标</text>
  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#555">（未配对的 '(' → 删）</text>
  <path d="M 150 282 L 150 302" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ')' branch detail (left-bottom) -->
  <path d="M 480 212 L 480 232" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="480,232 545,262 480,292 415,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="258" text-anchor="middle" font-size="10" fill="#555">栈空?</text>

  <!-- empty -> mark remove -->
  <path d="M 415 262 L 320 262 L 320 296" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="254" font-size="9" fill="#b85450">空</text>
  <rect x="260" y="296" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="312" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">标记 i 删除</text>
  <text x="320" y="325" text-anchor="middle" font-size="9" fill="#888">（多余的 ')'）</text>

  <!-- not empty -> pop -->
  <path d="M 480 292 L 480 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="492" y="306" font-size="9" fill="#4a7a3a">非空</text>
  <rect x="420" y="312" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="480" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">弹出栈顶（配对）</text>
  <text x="480" y="341" text-anchor="middle" font-size="9" fill="#888">这对括号都保留</text>

  <!-- loop back arrows to top decision -->
  <path d="M 320 332 L 320 360 L 110 360 L 110 150 L 180 150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 480 348 L 480 372 L 540 372 L 540 88 L 380 88 L 380 130" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 540 240 L 540 88" stroke="none"/>
  <!-- '(' and letter loop back -->
  <path d="M 420 144 L 400 144 L 400 96 L 280 96" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Build result ===== -->
  <path d="M 150 302 L 150 332 L 150 388" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="388" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">拼接未被标记的字符 → 返回</text>
  <text x="280" y="422" text-anchor="middle" font-size="9" fill="#888">O(n) 一次遍历 + 一次拼接</text>

  <!-- legend -->
  <text x="30" y="408" font-size="9" fill="#999">虚线 = 回到判定</text>
  <text x="30" y="422" font-size="9" fill="#999">菱形 = 判定</text>
</svg>
