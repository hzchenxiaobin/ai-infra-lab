<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,1,2,1,2]</text>

  <!-- table header -->
  <rect x="30" y="46" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤</text>
  <text x="135" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x</text>
  <text x="225" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans(前)</text>
  <text x="355" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算 ans⊕x</text>
  <text x="455" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans(后)</text>

  <!-- column separators -->
  <path d="M 100 46 L 100 296" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 170 46 L 170 296" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 280 46 L 280 296" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 430 46 L 430 296" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0: init -->
  <rect x="30" y="82" width="460" height="34" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="104" text-anchor="middle" font-size="11.5" fill="#888">初始</text>
  <text x="135" y="104" text-anchor="middle" font-size="11.5" fill="#aaa">—</text>
  <text x="225" y="104" text-anchor="middle" font-size="11.5" fill="#aaa">—</text>
  <text x="355" y="104" text-anchor="middle" font-size="11.5" fill="#aaa">—</text>
  <text x="455" y="104" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">0</text>

  <!-- row 1 -->
  <rect x="30" y="116" width="460" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="138" text-anchor="middle" font-size="11.5" fill="#555">1</text>
  <text x="135" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="225" y="138" text-anchor="middle" font-size="11.5" fill="#555">0</text>
  <text x="355" y="138" text-anchor="middle" font-size="11.5" fill="#555">0 ⊕ 4</text>
  <text x="455" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- row 2 -->
  <rect x="30" y="150" width="460" height="34" fill="#f7f9fc" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="172" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="225" y="172" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <text x="355" y="172" text-anchor="middle" font-size="11.5" fill="#555">4 ⊕ 1</text>
  <text x="455" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- row 3 -->
  <rect x="30" y="184" width="460" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="206" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <text x="135" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="225" y="206" text-anchor="middle" font-size="11.5" fill="#555">5</text>
  <text x="355" y="206" text-anchor="middle" font-size="11.5" fill="#555">5 ⊕ 2</text>
  <text x="455" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- row 4 -->
  <rect x="30" y="218" width="460" height="34" fill="#f7f9fc" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="240" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <text x="135" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="225" y="240" text-anchor="middle" font-size="11.5" fill="#555">7</text>
  <text x="355" y="240" text-anchor="middle" font-size="11.5" fill="#555">7 ⊕ 1</text>
  <text x="455" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- row 5: highlight -->
  <rect x="30" y="252" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="274" text-anchor="middle" font-size="11.5" fill="#555">5</text>
  <text x="135" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="225" y="274" text-anchor="middle" font-size="11.5" fill="#555">6</text>
  <text x="355" y="274" text-anchor="middle" font-size="11.5" fill="#555">6 ⊕ 2</text>
  <text x="455" y="274" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4 ✓</text>

  <!-- footer -->
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">两对 1、2 各自抵消为 0，最后剩下落单的 4</text>
</svg>
