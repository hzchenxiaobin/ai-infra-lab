<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：四步走</text>

  <!-- Step 1 -->
  <rect x="120" y="44" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 解析每条交易字符串</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">"name,time,amount,city" → 四元组</text>
  <path d="M 280 90 L 280 104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="106" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 按 name 分组</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">HashMap&lt;name, List&lt;交易&gt;&gt;</text>
  <path d="M 280 152 L 280 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="168" width="400" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">③ 逐条判定（OR 两条规则）</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#rough2)">规则一: amount &gt; 1000 ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#rough2)">规则二: 同组内存在异城 ∧ |Δt|≤60 ?</text>
  <path d="M 280 230 L 280 244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="120" y="246" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">④ 收集所有标记为无效的交易</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">保留原始字符串，顺序任意</text>
  <path d="M 280 292 L 280 306" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="150" y="308" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">返回无效交易列表</text>

  <!-- side note: rule 1 shortcut -->
  <rect x="40" y="178" width="32" height="20" fill="#fafafa" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="192" text-anchor="middle" font-size="9" fill="#8a3a3a" filter="url(#rough2)">命中</text>
  <text x="56" y="204" text-anchor="middle" font-size="9" fill="#8a3a3a" filter="url(#rough2)">即停</text>

  <!-- bottom key note -->
  <rect x="40" y="354" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">关键：规则二只在同 name 组内两两比较</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">N ≤ 1000 → O(N²) 完全可承受</text>
</svg>
