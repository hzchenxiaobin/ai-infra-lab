<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">句子相似性判定流程：长度检查 → 建哈希集合 → 逐位查集合</text>

  <!-- Start node -->
  <ellipse cx="280" cy="62" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 读入 s1, s2, similarPairs</text>

  <!-- arrow down to diamond A: len equal? -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond A: len(s1) == len(s2) ? -->
  <polygon points="280,104 384,154 280,204 176,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#333">len(s1) ==</text>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333">len(s2) ?</text>

  <!-- A: No -> return false -->
  <path d="M 384 154 L 456 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="492" cy="154" rx="46" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="158" text-anchor="middle" font-size="12" fill="#333">返回 false</text>

  <!-- A: Yes -> down to process: build set -->
  <path d="M 280 204 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="218" font-size="11" fill="#82b366">是</text>

  <!-- Process: build hash set -->
  <rect x="150" y="224" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333">建集合 sim: 对每个 (a,b)</text>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">存 a#b 与 b#a (双向)</text>

  <!-- arrow down to process: i = 0 -->
  <path d="M 280 268 L 280 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: i = 0 -->
  <rect x="216" y="288" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <!-- arrow down to diamond B: i < n ? -->
  <path d="M 280 324 L 280 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond B: i < n ? -->
  <polygon points="280,346 374,392 280,438 186,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888">(遍历位置)</text>

  <!-- B: No -> return true -->
  <path d="M 374 392 L 456 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="384" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="492" cy="392" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="396" text-anchor="middle" font-size="12" fill="#333">返回 true</text>

  <!-- B: Yes -> down to diamond C: w1==w2 or in set ? -->
  <path d="M 280 438 L 280 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="452" font-size="11" fill="#82b366">是</text>

  <!-- Diamond C: w1==w2 or sim has w1#w2 ? -->
  <polygon points="280,460 440,512 280,564 120,512" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="504" text-anchor="middle" font-size="11" fill="#333">w1==w2 或</text>
  <text x="280" y="520" text-anchor="middle" font-size="11" fill="#333">sim 含 w1#w2 ?</text>
  <text x="280" y="536" text-anchor="middle" font-size="10" fill="#888">(相似判定)</text>

  <!-- C: No -> return false (left) -->
  <path d="M 120 512 L 64 512" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="504" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="44" cy="446" rx="36" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="450" text-anchor="middle" font-size="11" fill="#333">false</text>
  <path d="M 44 466 L 44 500 L 64 512" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- C: Yes -> i++ then loop back -->
  <path d="M 440 512 L 500 512 L 500 306 L 344 306" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="504" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 500 410)">i++ 继续下一轮</text>
</svg>
