<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以 right 结尾的合法子串数 = min(最后位置) + 1</text>

  <!-- index labels -->
  <text x="80" y="62" font-size="10.5" fill="#aaa">下标</text>
  <text x="130" y="62" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="176" y="62" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="222" y="62" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="268" y="62" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="314" y="62" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="360" y="62" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- string cells: a b c a b c ; each 44 wide, gap 2, start x=108 -->
  <rect x="108" y="70" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">a</text>
  <rect x="154" y="70" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="200" y="70" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">c</text>
  <rect x="246" y="70" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">a</text>
  <rect x="292" y="70" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <!-- right=5 highlighted -->
  <rect x="338" y="70" width="44" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">c</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right=5</text>

  <!-- last occurrence brackets: arrows from bottom of cells 3,4,5 up to a "last" annotation -->
  <path d="M 268 106 L 268 138" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 314 106 L 314 138" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 360 106 L 360 138" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- last occurrence row -->
  <text x="80" y="156" font-size="11" fill="#888">最后位置</text>
  <rect x="246" y="142" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="159" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a:3</text>
  <rect x="292" y="142" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b:4</text>
  <rect x="338" y="142" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="159" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c:5</text>

  <!-- min highlight box -->
  <rect x="395" y="142" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="455" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min = 3（即 a）</text>

  <!-- valid-starts shading region: starts 0..3 -->
  <text x="80" y="200" font-size="11" fill="#888">合法起点</text>
  <rect x="108" y="184" width="182" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="199" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0, 1, 2, 3  共 4 个</text>
  <text x="306" y="202" font-size="11" fill="#b85450" font-weight="bold">= min + 1</text>

  <!-- bracket arrow from min(3) to valid starts -->
  <path d="M 268 168 Q 268 178 240 184" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- the 4 valid substrings list -->
  <text x="80" y="240" font-size="11" fill="#888">以 right=5 结尾的 4 个合法子串：</text>
  <rect x="80" y="250" width="400" height="86" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="92" y="270" font-size="11" fill="#444">[0,5] = abcabc</text>
  <text x="92" y="288" font-size="11" fill="#444">[1,5] = bcabc</text>
  <text x="240" y="270" font-size="11" fill="#444">[2,5] = cabc</text>
  <text x="240" y="288" font-size="11" fill="#444">[3,5] = abc</text>
  <text x="92" y="312" font-size="10.5" fill="#888" font-style="italic">起点 ≤ min(3) 的子串都含 a、b、c 各至少一次</text>

  <!-- formula box -->
  <rect x="80" y="350" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">贡献数 = min(last_a, last_b, last_c) + 1</text>
</svg>
