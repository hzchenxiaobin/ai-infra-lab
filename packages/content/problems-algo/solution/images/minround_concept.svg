<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：升级小数部分最大的 → ceil 误差最小</text>

  <!-- Section 1 label -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">每个价格：floor 误差（绿）= 小数部 f，ceil 误差（蓝）= 1 − f</text>

  <!-- ===== Row 1: 0.700 ===== -->
  <text x="50" y="96" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">0.700</text>
  <rect x="80" y="80" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="120" y="82" width="168" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="204" y="76" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">floor err = 0.700</text>
  <rect x="288" y="82" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="324" y="76" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0.300</text>
  <rect x="360" y="80" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== Row 2: 2.800 ===== -->
  <text x="50" y="144" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">2.800</text>
  <rect x="80" y="128" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="120" y="130" width="192" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="216" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">floor err = 0.800</text>
  <rect x="312" y="130" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="336" y="124" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">0.200</text>
  <rect x="360" y="128" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- ===== Row 3: 4.900 ===== -->
  <text x="50" y="192" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">4.900</text>
  <rect x="80" y="176" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="120" y="178" width="216" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="228" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">floor err = 0.900</text>
  <rect x="336" y="178" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="348" y="172" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">0.100</text>
  <rect x="360" y="176" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Divider -->
  <line x1="40" y1="222" x2="520" y2="222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Section 2 label -->
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">按小数部降序，升级前 k 个（k = target − baseSum = 2）</text>

  <!-- k=2 bracket over first two boxes -->
  <path d="M 96 268 L 96 260 L 336 260 L 336 268" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="216" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k = 2 升级</text>

  <!-- ===== Three sorted boxes ===== -->
  <!-- Box 1: 4.900 (upgraded) -->
  <rect x="80" y="270" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4.900</text>
  <text x="140" y="310" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">frac = 0.900</text>
  <text x="140" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 升级 ceil=5</text>
  <text x="140" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">err = 0.100</text>

  <!-- Box 2: 2.800 (upgraded) -->
  <rect x="216" y="270" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="276" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2.800</text>
  <text x="276" y="310" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">frac = 0.800</text>
  <text x="276" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 升级 ceil=3</text>
  <text x="276" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">err = 0.200</text>

  <!-- Box 3: 0.700 (kept floor) -->
  <rect x="352" y="270" width="120" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="412" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0.700</text>
  <text x="412" y="310" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">frac = 0.700</text>
  <text x="412" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↓ 保持 floor=0</text>
  <text x="412" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">err = 0.700</text>

  <!-- Arrow down -->
  <path d="M 280 360 L 280 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="120" y="386" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">总误差 = 0.100 + 0.200 + 0.700</text>
  <text x="280" y="420" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 1.000</text>

  <!-- Side note -->
  <text x="490" y="96" font-size="9" fill="#4a7a3a" filter="url(#rough2)">f 小 →</text>
  <text x="490" y="108" font-size="9" fill="#4a7a3a" filter="url(#rough2)">ceil 误差大</text>
  <text x="490" y="192" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">f 大 →</text>
  <text x="490" y="204" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">ceil 误差小</text>
  <text x="490" y="216" font-size="9" fill="#b85450" filter="url(#rough2)">优先升级!</text>
</svg>
