<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：flips = [3,2,4,1,5]，n = 5</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">逐步翻转，跟踪累计 mx；mx == 步号 i 即前缀归位。橙框＝本步新翻的位，绿括号＝前缀一致</text>

  <!-- ====== header row ====== -->
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="50" y="84" text-anchor="middle">步号 i</text>
    <text x="115" y="84" text-anchor="middle">flips</text>
    <text x="255" y="84" text-anchor="middle">翻转后字符串 bits[1..5]</text>
    <text x="395" y="84" text-anchor="middle">mx</text>
    <text x="470" y="84" text-anchor="middle">mx==i?</text>
    <text x="545" y="84" text-anchor="middle">ans</text>
  </g>
  <!-- position labels 1..5 above bits -->
  <g font-size="9" fill="#aaa">
    <text x="175" y="74" text-anchor="middle">1</text>
    <text x="215" y="74" text-anchor="middle">2</text>
    <text x="255" y="74" text-anchor="middle">3</text>
    <text x="295" y="74" text-anchor="middle">4</text>
    <text x="335" y="74" text-anchor="middle">5</text>
  </g>
  <line x1="20" y1="92" x2="620" y2="92" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 1: step 1, flip 3, 00100, mx=3, ✗, ans=0 ====== -->
  <text x="50" y="124" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">1</text>
  <text x="115" y="124" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <g font-size="14">
    <rect x="155" y="104" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="175" y="128" text-anchor="middle" fill="#bbb">0</text>
    <rect x="195" y="104" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="215" y="128" text-anchor="middle" fill="#bbb">0</text>
    <rect x="235" y="104" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="255" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="275" y="104" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="295" y="128" text-anchor="middle" fill="#bbb">0</text>
    <rect x="315" y="104" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="128" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="395" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="470" y="124" text-anchor="middle" font-size="12" fill="#888">3≠1 ✗</text>
  <text x="545" y="124" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <line x1="20" y1="146" x2="620" y2="146" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 2: step 2, flip 2, 01100, mx=3, ✗, ans=0 ====== -->
  <text x="50" y="174" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">2</text>
  <text x="115" y="174" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <g font-size="14">
    <rect x="155" y="154" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="175" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="195" y="154" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="215" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="235" y="154" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="255" y="178" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="275" y="154" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="295" y="178" text-anchor="middle" fill="#bbb">0</text>
    <rect x="315" y="154" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="178" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="395" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="470" y="174" text-anchor="middle" font-size="12" fill="#888">3≠2 ✗</text>
  <text x="545" y="174" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <line x1="20" y1="196" x2="620" y2="196" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 3: step 3, flip 4, 01110, mx=4, ✗, ans=0 ====== -->
  <text x="50" y="224" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">3</text>
  <text x="115" y="224" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <g font-size="14">
    <rect x="155" y="204" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="175" y="228" text-anchor="middle" fill="#bbb">0</text>
    <rect x="195" y="204" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="215" y="228" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="235" y="204" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="255" y="228" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="275" y="204" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="295" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="315" y="204" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="228" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="395" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="470" y="224" text-anchor="middle" font-size="12" fill="#888">4≠3 ✗</text>
  <text x="545" y="224" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <line x1="20" y1="246" x2="620" y2="246" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 4: step 4, flip 1, 11110, mx=4, ✓, ans=1  (prefix-aligned) ====== -->
  <text x="50" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="115" y="274" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <g font-size="14">
    <rect x="155" y="254" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="175" y="278" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="195" y="254" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="215" y="278" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="235" y="254" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="255" y="278" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="275" y="254" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="295" y="278" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="315" y="254" width="40" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="278" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <!-- green prefix bracket [1,4] -->
  <path d="M 155 296 L 155 302 L 315 302 L 315 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="235" y="314" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">前缀 [1,4] 全 1 ✓</text>
  <text x="395" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="470" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4==4 ✓</text>
  <text x="545" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="20" y1="324" x2="620" y2="324" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Row 5: step 5, flip 5, 11111, mx=5, ✓, ans=2  (prefix-aligned) ====== -->
  <text x="50" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="115" y="354" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <g font-size="14">
    <rect x="155" y="334" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="175" y="358" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="195" y="334" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="215" y="358" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="235" y="334" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="255" y="358" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="275" y="334" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="295" y="358" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="315" y="334" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="335" y="358" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
  </g>
  <path d="M 155 376 L 155 382 L 355 382 L 355 376" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="255" y="394" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">前缀 [1,5] 全 1 ✓</text>
  <text x="395" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="470" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5==5 ✓</text>
  <text x="545" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ====== bottom note ====== -->
  <rect x="40" y="412" width="560" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="432" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">mx 只增不减，编码「已翻位置的范围上界」</text>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#666">第 4 步翻的是下标 1（小值），但 mx 仍=4；只要累计最大值卡在步号 i，前缀即归位</text>
</svg>
