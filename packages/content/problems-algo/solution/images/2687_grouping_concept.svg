<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="390" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 bike_number 分组 + 取 MAX(end_time)</text>

  <!-- Left table label -->
  <text x="265" y="48" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">Bikes 表（按 bike_number 重排示意，6 次骑行）</text>

  <!-- Header row -->
  <rect x="30" y="56" width="470" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">ride_id</text>
  <text x="150" y="72" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">bike_number</text>
  <text x="282" y="72" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">start_time</text>
  <text x="430" y="72" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">end_time</text>

  <!-- Row a: W00300 green (ride 2) -->
  <rect x="30" y="80" width="470" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="95" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="150" y="95" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">W00300</text>
  <text x="282" y="95" text-anchor="middle" font-size="8" fill="#333">2012-03-25 10:30:00</text>
  <text x="430" y="95" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2012-03-25 10:50:00</text>

  <!-- Row b: W00455 orange (ride 4) -->
  <rect x="30" y="102" width="470" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="117" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="150" y="117" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="282" y="117" text-anchor="middle" font-size="8" fill="#333">2012-03-25 12:30:00</text>
  <text x="430" y="117" text-anchor="middle" font-size="8" fill="#333">2012-03-25 13:40:00</text>

  <!-- Row c: W00455 orange (ride 3) MAX -->
  <rect x="30" y="124" width="470" height="22" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="139" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="150" y="139" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="282" y="139" text-anchor="middle" font-size="8" fill="#333">2012-03-26 14:30:00</text>
  <text x="430" y="139" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2012-03-26 17:40:00 ★</text>

  <!-- Row d: W00576 blue (ride 5) -->
  <rect x="30" y="146" width="470" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="161" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="150" y="161" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">W00576</text>
  <text x="282" y="161" text-anchor="middle" font-size="8" fill="#333">2012-03-25 08:10:00</text>
  <text x="430" y="161" text-anchor="middle" font-size="8" fill="#333">2012-03-25 09:10:00</text>

  <!-- Row e: W00576 blue (ride 1) -->
  <rect x="30" y="168" width="470" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="150" y="183" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">W00576</text>
  <text x="282" y="183" text-anchor="middle" font-size="8" fill="#333">2012-03-25 11:30:00</text>
  <text x="430" y="183" text-anchor="middle" font-size="8" fill="#333">2012-03-25 12:40:00</text>

  <!-- Row f: W00576 blue (ride 6) MAX -->
  <rect x="30" y="190" width="470" height="22" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="205" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="150" y="205" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">W00576</text>
  <text x="282" y="205" text-anchor="middle" font-size="8" fill="#333">2012-03-28 02:30:00</text>
  <text x="430" y="205" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2012-03-28 02:50:00 ★</text>

  <!-- Arrows from end_time col (x=500) to buckets (x=540) -->
  <path d="M 500 91 Q 520 95 540 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 113 Q 520 130 540 150" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 135 Q 520 150 540 165" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 500 157 Q 520 190 540 225" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 179 Q 520 210 540 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 201 Q 520 225 540 250" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Right side label -->
  <text x="650" y="48" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">分组取 MAX(end_time)</text>

  <!-- Bucket: W00300 (green) -->
  <rect x="540" y="80" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="650" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W00300</text>
  <text x="650" y="120" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">最后使用 → 2012-03-25 10:50:00</text>

  <!-- Bucket: W00455 (orange) -->
  <rect x="540" y="140" width="220" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="650" y="160" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="650" y="180" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">最后使用 → 2012-03-26 17:40:00</text>

  <!-- Bucket: W00576 (blue) -->
  <rect x="540" y="212" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="650" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">W00576</text>
  <text x="650" y="252" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">最后使用 → 2012-03-28 02:50:00</text>

  <!-- Bottom note -->
  <rect x="30" y="300" width="720" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="322" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">分组求最大值：GROUP BY bike_number + MAX(end_time)</text>
  <text x="390" y="342" text-anchor="middle" font-size="9" fill="#666">① 「最后使用时间」= 该车所有骑行 end_time 的最大值</text>
  <text x="390" y="360" text-anchor="middle" font-size="9" fill="#666">② GROUP BY bike_number 把同一辆车的多次骑行归为一组</text>
  <text x="390" y="378" text-anchor="middle" font-size="9" fill="#b85450">⚠ 取 MAX(end_time) 而非 start_time；★ 标记每组赢得最大值的行</text>

  <!-- legend -->
  <text x="390" y="425" text-anchor="middle" font-size="8" fill="#888">★ = 该组 end_time 最大（最后使用）的骑行记录</text>
</svg>
