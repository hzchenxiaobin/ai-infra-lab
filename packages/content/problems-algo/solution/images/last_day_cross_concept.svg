<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">正向淹没难维护 vs 逆向并查集易求解（虚拟顶/底节点）</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== TOP: forward deletion is hard ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="56" width="832" height="176" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="440" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">① 正向：每天淹一格 = 删一条边 → 连通性只减不增</text>

  <!-- Grid: day 3 (crossable). origin (70, 96), cell=30, 3x3 -->
  <g font-size="13" text-anchor="middle">
    <!-- row0: L W L -->
    <g filter="url(#sk)"><rect x="70" y="96" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="100" y="96" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="115" y="116" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="130" y="96" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="3"/></g>
    <text x="145" y="116" fill="#2e6e2e" font-weight="bold">★</text>
    <!-- row1: W L L -->
    <g filter="url(#sk)"><rect x="70" y="126" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="85" y="146" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="100" y="126" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="3"/></g>
    <text x="115" y="146" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="130" y="126" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="3"/></g>
    <text x="145" y="146" fill="#2e6e2e" font-weight="bold">★</text>
    <!-- row2: L L W -->
    <g filter="url(#sk)"><rect x="70" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="100" y="156" width="30" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="3"/></g>
    <text x="115" y="176" fill="#2e6e2e" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="130" y="156" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="145" y="176" fill="#b85450" font-weight="bold">W</text>
  </g>
  <text x="115" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">第 3 天 ✓ 能过</text>
  <text x="115" y="220" text-anchor="middle" font-size="10" fill="#5a5a5a">★ = 贯通路径</text>

  <!-- arrow forward -->
  <path d="M 168 141 L 208 141" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Grid: day 4 (broken). origin (220, 96), cell=30, 3x3 -->
  <g font-size="13" text-anchor="middle">
    <!-- row0: L W L -->
    <g filter="url(#sk)"><rect x="220" y="96" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="250" y="96" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="265" y="116" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="280" y="96" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <!-- row1: W W L -->
    <g filter="url(#sk)"><rect x="220" y="126" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="235" y="146" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="250" y="126" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/></g>
    <text x="265" y="146" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="280" y="126" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <!-- row2: L L W -->
    <g filter="url(#sk)"><rect x="220" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="250" y="156" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="280" y="156" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="295" y="176" fill="#b85450" font-weight="bold">W</text>
  </g>
  <!-- big X over day4 grid -->
  <path d="M 224 100 L 312 188" stroke="#b85450" stroke-width="3" filter="url(#sk)"/>
  <path d="M 312 100 L 224 188" stroke="#b85450" stroke-width="3" filter="url(#sk)"/>
  <text x="265" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">第 4 天 ✗ 断开</text>
  <text x="265" y="220" text-anchor="middle" font-size="10" fill="#5a5a5a">中间 (1,1) 被淹 → 路径切断</text>

  <!-- right explanation box -->
  <g filter="url(#sk)">
    <rect x="350" y="100" width="486" height="118" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="368" y="124" font-size="12.5" fill="#7a5415">• 正向每淹一格 = 从图里删一条边</text>
  <text x="368" y="146" font-size="12.5" fill="#7a5415">• 并查集只会 <tspan font-weight="bold" fill="#b85450">union</tspan> 不会 <tspan font-weight="bold" fill="#b85450">split</tspan> → 无法维护</text>
  <text x="368" y="168" font-size="12.5" fill="#7a5415">• 逐天 BFS 判连通: 每次 O(mn)，共 mn 天</text>
  <text x="368" y="186" font-size="12.5" font-weight="bold" fill="#b85450">  → O((mn)²) 太慢</text>
  <text x="368" y="206" font-size="11.5" fill="#4a7a3a" font-weight="bold">转念一想：反过来加边，并查集就够用了！</text>

  <!-- down arrow reverse -->
  <path d="M 440 236 L 440 264" stroke="#4a8e4a" stroke-width="2.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="455" y="256" font-size="11" fill="#4a8e4a" font-weight="bold">逆向</text>

  <!-- ===== BOTTOM: reverse union-find ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="272" width="832" height="272" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="440" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">② 逆向：全淹出发 → 倒序补陆 → union 邻格 → 顶底首次连通即答案</text>

  <!-- virtual top node -->
  <g filter="url(#sk)">
    <ellipse cx="198" cy="324" rx="30" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="198" y="329" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">顶 TOP</text>

  <!-- 3x3 grid: day-3 land pattern. origin (150, 348), cell=32 -->
  <!-- Land: (0,0),(0,2),(1,1),(1,2),(2,0),(2,1); Water: (0,1),(1,0),(2,2) -->
  <g font-size="13" text-anchor="middle">
    <!-- row0 -->
    <g filter="url(#sk)"><rect x="150" y="348" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="182" y="348" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="198" y="369" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="214" y="348" width="32" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <!-- row1 -->
    <g filter="url(#sk)"><rect x="150" y="380" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="166" y="401" fill="#b85450" font-weight="bold">W</text>
    <g filter="url(#sk)"><rect x="182" y="380" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="3"/></g>
    <text x="198" y="401" fill="#d6a040" font-weight="bold">+</text>
    <g filter="url(#sk)"><rect x="214" y="380" width="32" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <!-- row2 -->
    <g filter="url(#sk)"><rect x="150" y="412" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
    <g filter="url(#sk)"><rect x="182" y="412" width="32" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/></g>
    <g filter="url(#sk)"><rect x="214" y="412" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="230" y="433" fill="#b85450" font-weight="bold">W</text>
  </g>

  <!-- virtual bottom node -->
  <g filter="url(#sk)">
    <ellipse cx="198" cy="460" rx="30" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="198" y="465" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">底 BOT</text>

  <!-- edges: top -> row0 land cells (0,0)&(0,2) -->
  <path d="M 180 338 L 166 348" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 216 338 L 230 348" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <!-- edges: bottom -> row2 land cells (2,0)&(2,1) -->
  <path d="M 180 472 L 166 444" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 198 472 L 198 444" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- bridge path (orange): 顶-(0,2)-(1,2)-(1,1)-(2,1)-底 -->
  <path d="M 230 348 L 230 380" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 214 396 L 214 396" stroke="#d6a040" stroke-width="2.4" fill="none"/>
  <path d="M 230 380 L 214 396" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 214 412 L 198 412" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>

  <!-- bridge label -->
  <text x="198" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">补回 (1,1) → 桥接顶底 → find(顶)==find(底)</text>

  <!-- right explanation -->
  <g filter="url(#sk)">
    <rect x="290" y="320" width="546" height="208" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="308" y="344" font-size="13" font-weight="bold" fill="#7a5415">逆向并查集三步法</text>
  <text x="308" y="368" font-size="12.5" fill="#444">① 初始：所有格子为水，并查集 parent[n+2]</text>
  <text x="324" y="386" font-size="11.5" fill="#666">多两个虚拟节点：top=n, bottom=n+1</text>
  <text x="308" y="410" font-size="12.5" fill="#444">② 倒序遍历 cells (i = mn-1 → 0)：</text>
  <text x="324" y="428" font-size="11.5" fill="#666">把 cells[i] 补成陆地，与四邻陆地 union</text>
  <text x="324" y="446" font-size="11.5" fill="#666">首行格 → union(top)；末行格 → union(bottom)</text>
  <text x="308" y="470" font-size="12.5" fill="#444">③ 每次 union 后查 find(top)==find(bottom)</text>
  <text x="324" y="488" font-size="11.5" font-weight="bold" fill="#2e6e2e">首次相等 → 返回 i（即最后能过的天）</text>
  <text x="308" y="512" font-size="11.5" fill="#4a7a3a" font-weight="bold">连通性逆向单调：补陆只连不断 → 首次连通即最大天</text>
</svg>
