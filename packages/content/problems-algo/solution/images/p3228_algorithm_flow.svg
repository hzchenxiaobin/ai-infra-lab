<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，只在「新 0 段开头」累加 ones</text>

  <!-- annotation box -->
  <rect x="404" y="48" width="152" height="52" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="68" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">关键：只在 s[i-1]='1' 且</text>
  <text x="480" y="82" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">s[i]='0'（新 0 段开头）时</text>
  <text x="480" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">累加 ones，同一段只加一次</text>

  <!-- start -->
  <rect x="250" y="36" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="53" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 290 62 L 290 76" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="210" y="78" width="160" height="30" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = 0，ones = 0，i = 0</text>
  <path d="M 290 108 L 290 120" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: i < n ? -->
  <polygon points="290,120 360,148 290,176 220,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 360 148 L 400 148" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="404" y="133" width="110" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 290 176 L 290 196" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- diamond 2: s[i]=='1' ? -->
  <polygon points="290,196 355,224 290,252 225,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">s[i] == '1' ?</text>

  <path d="M 225 224 L 178 224" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="216" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="65" y="209" width="110" height="30" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ones += 1</text>

  <path d="M 290 252 L 290 272" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- diamond 3: s[i-1]=='1' ? -->
  <polygon points="290,272 365,300 290,328 215,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="297" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">s[i-1] == '1' ?</text>
  <text x="290" y="311" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（新 0 段开头？）</text>

  <path d="M 365 300 L 405 300" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="409" y="285" width="118" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="304" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">ans += ones</text>

  <path d="M 290 328 L 290 348" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <rect x="245" y="350" width="90" height="28" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i += 1</text>

  <path d="M 120 239 L 120 364 L 241 364" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 315 L 468 364 L 339 364" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 290 378 L 290 392 L 175 392 L 175 148 L 214 148" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
