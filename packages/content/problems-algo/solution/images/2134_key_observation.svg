<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：窗口大小 = 1 的总数，窗口内 0 的个数 = 交换次数</text>

  <!-- Step 1: count total ones -->
  <text x="40" y="60" font-size="12" fill="#555" font-weight="bold">① 统计 1 的总数 total</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="93">0</text>
    <rect x="102" y="72" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="122" y="93" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="144" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="93">0</text>
    <rect x="186" y="72" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="206" y="93" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="228" y="72" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="93" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="270" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="93">0</text>
    <rect x="312" y="72" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="332" y="93">0</text>
  </g>
  <text x="370" y="93" font-size="12" fill="#4a7a3a" font-weight="bold">total = 3</text>

  <!-- Step 2: window of size total -->
  <text x="40" y="130" font-size="12" fill="#555" font-weight="bold">② 在大小 = total 的窗口中，0 的个数 = 需要的交换次数</text>

  <!-- Window A: best case -->
  <text x="40" y="158" font-size="11" fill="#555">窗口 A（最优）：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="168" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="189">0</text>
    <rect x="102" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="122" y="189" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="144" y="168" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="164" y="189" fill="#d6a040" font-weight="bold">0</text>
    <rect x="186" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="206" y="189" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="228" y="168" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="189" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="270" y="168" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="189">0</text>
    <rect x="312" y="168" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="332" y="189">0</text>
  </g>
  <!-- window bracket -->
  <rect x="142" y="166" width="126" height="36" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="205" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口内 0 的个数 = 1 → 交换 1 次</text>

  <!-- Window B: worse case -->
  <text x="40" y="248" font-size="11" fill="#555">窗口 B（更差）：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="279">0</text>
    <rect x="102" y="258" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="122" y="279" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="144" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="279">0</text>
    <rect x="186" y="258" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="206" y="279" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="228" y="258" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="279" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="270" y="258" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="290" y="279" fill="#d6a040" font-weight="bold">0</text>
    <rect x="312" y="258" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="332" y="279" fill="#d6a040" font-weight="bold">0</text>
  </g>
  <rect x="226" y="256" width="126" height="36" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="289" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口内 0 的个数 = 2 → 交换 2 次</text>

  <!-- Divider -->
  <path d="M 40 326 L 520 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula -->
  <rect x="60" y="340" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">最少交换次数 = min(窗口内 0 的个数) = total − max(窗口内 1 的个数)</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">窗口大小固定为 total，用滑动窗口 O(1) 增量维护</text>
</svg>
