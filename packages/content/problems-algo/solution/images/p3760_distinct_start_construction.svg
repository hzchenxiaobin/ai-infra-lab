<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="370" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个不同字符各切一刀 → 答案 = d</text>

  <!-- s = abac -->
  <text x="66" y="72" font-size="13" fill="#333">s =</text>

  <rect x="100" y="48" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="127.5" y="71" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <rect x="155" y="48" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182.5" y="71" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>

  <rect x="210" y="48" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237.5" y="71" text-anchor="middle" font-size="15" fill="#666">a</text>

  <rect x="265" y="48" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292.5" y="71" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>

  <text x="127.5" y="102" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="182.5" y="102" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="237.5" y="102" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="292.5" y="102" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- cut lines at first occurrences -->
  <path d="M 100 40 L 100 96" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 155 40 L 155 96" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 265 40 L 265 96" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 96 96 L 104 96 L 100 105 z" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 151 96 L 159 96 L 155 105 z" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 261 96 L 269 96 L 265 105 z" fill="#b85450" filter="url(#rough2)"/>

  <text x="345" y="58" font-size="11" fill="#888">红虚线 ▼ = 切割点</text>
  <text x="345" y="76" font-size="11" fill="#888">切在每个不同字符的首次出现处</text>
  <text x="345" y="94" font-size="11" fill="#888">（位置 0 必切：首段起点）</text>

  <!-- resulting parts -->
  <rect x="100" y="124" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="127.5" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>

  <rect x="155" y="124" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="182.5" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>

  <rect x="210" y="124" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="265" y="146" text-anchor="middle" font-size="14"><tspan fill="#b85450" font-weight="bold">a</tspan><tspan fill="#333">c</tspan></text>

  <text x="210" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3 段，首字符 a / b / c 互不相同</text>

  <!-- upper bound box -->
  <rect x="30" y="196" width="275" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="220" font-size="12" fill="#446688" font-weight="bold">上界 ⬆</text>
  <text x="52" y="240" font-size="11" fill="#333">k 段的 k 个首字符互不相同，且</text>
  <text x="52" y="258" font-size="11" fill="#333">都取自 s 的字符集 → 段数 ≤ d</text>

  <!-- achievable box -->
  <rect x="315" y="196" width="275" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="337" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">可达 ⬇</text>
  <text x="337" y="240" font-size="11" fill="#333">每个不同字符任取一个出现位置</text>
  <text x="337" y="258" font-size="11" fill="#333">当切割点 → 恰好切出 d 段</text>

  <!-- conclusion -->
  <rect x="30" y="290" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = d = s 中不同字符的个数</text>
  <text x="310" y="334" text-anchor="middle" font-size="11" fill="#888">（d ≤ 26，重复字符不增加段数）</text>
</svg>
