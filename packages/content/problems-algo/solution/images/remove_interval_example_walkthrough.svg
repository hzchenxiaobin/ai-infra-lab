<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：intervals = [[0,2],[3,4],[5,7]], toBeRemoved = [1,6]
  </text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    数轴上蓝条 = 原区间，红条 = 删除 [1,6)，绿条 = 保留
  </text>

  <!-- number line: 0..7 mapped at x = 80 + v*50 -->
  <path d="M 70 90 L 450 90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- ticks -->
  <g filter="url(#rough2)">
    <path d="M 80 84 L 80 96" stroke="#446688" stroke-width="1.2"/><text x="80" y="112" text-anchor="middle" font-size="11" fill="#446688">0</text>
    <path d="M 130 84 L 130 96" stroke="#b85450" stroke-width="1.5"/><text x="130" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <path d="M 180 84 L 180 96" stroke="#446688" stroke-width="1.2"/><text x="180" y="112" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <path d="M 230 84 L 230 96" stroke="#446688" stroke-width="1.2"/><text x="230" y="112" text-anchor="middle" font-size="11" fill="#446688">3</text>
    <path d="M 280 84 L 280 96" stroke="#446688" stroke-width="1.2"/><text x="280" y="112" text-anchor="middle" font-size="11" fill="#446688">4</text>
    <path d="M 330 84 L 330 96" stroke="#446688" stroke-width="1.2"/><text x="330" y="112" text-anchor="middle" font-size="11" fill="#446688">5</text>
    <path d="M 380 84 L 380 96" stroke="#b85450" stroke-width="1.5"/><text x="380" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
    <path d="M 430 84 L 430 96" stroke="#446688" stroke-width="1.2"/><text x="430" y="112" text-anchor="middle" font-size="11" fill="#446688">7</text>
  </g>

  <!-- toBeRemoved band [1,6): x 130..380 -->
  <rect x="130" y="76" width="250" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" opacity="0.7" filter="url(#rough2)"/>

  <!-- Row 1: [0,2) -->
  <text x="50" y="156" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">[0,2)</text>
  <rect x="80" y="146" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <!-- overlap part [1,2) shaded -->
  <rect x="130" y="146" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.6" filter="url(#rough2)"/>
  <!-- kept [0,1) -->
  <rect x="80" y="178" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="105" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0,1)</text>
  <text x="200" y="192" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a=0&lt;1 → 保留 [0,1)；b=2&gt;6? 否</text>

  <!-- Row 2: [3,4) -->
  <text x="50" y="246" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">[3,4)</text>
  <rect x="230" y="236" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="230" y="236" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.7" filter="url(#rough2)"/>
  <!-- cross out -->
  <path d="M 226 232 L 284 262" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 226 262 L 284 232" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">a=3≥1, b=4≤6 → 完全覆盖，删除</text>

  <!-- Row 3: [5,7) -->
  <text x="50" y="336" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">[5,7)</text>
  <rect x="330" y="326" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="326" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.6" filter="url(#rough2)"/>
  <!-- kept [6,7) -->
  <rect x="380" y="358" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="405" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[6,7)</text>
  <text x="120" y="372" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a=5&lt;1? 否；b=7&gt;6 → 保留 [6,7)</text>

  <!-- Result box -->
  <rect x="80" y="396" width="400" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    最终结果：[[0,1], [6,7]] ✓
  </text>
</svg>
