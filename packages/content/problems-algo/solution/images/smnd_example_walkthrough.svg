<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：情形 B 拼两位，情形 A 取公共位</text>

  <!-- ===== Example 1 (top): no common ===== -->
  <rect x="24" y="46" width="552" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="70" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 1（无公共 → 拼两位）</text>

  <!-- inputs -->
  <rect x="40" y="84" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums1 = [4,1,3]</text>

  <rect x="210" y="84" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums2 = [5,7]</text>

  <!-- intersection -->
  <rect x="380" y="84" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="108" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">交集 = ∅</text>

  <!-- mins -->
  <rect x="40" y="138" width="220" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(nums1)=1，min(nums2)=5</text>

  <path d="M 268 158 L 290 158" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compose -->
  <rect x="300" y="138" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(1·10+5, 5·10+1) = 15 ⭐</text>

  <!-- ===== Example 2 (bottom): has common ===== -->
  <rect x="24" y="216" width="552" height="156" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="240" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2（有公共 → 取最小公共位）</text>

  <!-- inputs -->
  <rect x="40" y="254" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums1 = [3,5,2,6]</text>

  <rect x="220" y="254" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums2 = [3,1,7]</text>

  <!-- intersection -->
  <rect x="390" y="254" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">交集 = {3}</text>

  <!-- arrow -->
  <path d="M 470 296 L 470 320" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="380" y="324" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">min({3}) = 3 ⭐</text>

  <text x="150" y="350" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">一位数 3 &lt; 任意两位数</text>
</svg>
