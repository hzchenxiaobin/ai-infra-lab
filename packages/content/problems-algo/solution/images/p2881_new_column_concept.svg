<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">整列运算 → 赋值开新列：一行搞定</text>

  <!-- Left: employees -->
  <rect x="26" y="56" width="196" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="124" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">employees</text>

  <rect x="44" y="90" width="92" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="136" y="90" width="74" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="173" y="106" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary</text>

  <rect x="44" y="114" width="92" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="114" width="74" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="173" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4548</text>

  <rect x="44" y="138" width="92" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="138" width="74" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Grace</text>
  <text x="173" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">28150</text>

  <rect x="44" y="162" width="92" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="162" width="74" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="173" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1103</text>

  <rect x="44" y="186" width="92" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="186" width="74" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="173" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6593</text>

  <text x="124" y="226" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">salary：整列 int64</text>

  <!-- Middle: multiply -->
  <text x="259" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">整列一起算（向量化）</text>
  <rect x="231" y="104" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="259" y="128" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">× 2</text>
  <path d="M 226 162 L 294 162" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不写 for 循环</text>

  <!-- Right: employees + bonus -->
  <rect x="300" y="56" width="236" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">employees（+bonus）</text>

  <rect x="316" y="90" width="84" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="358" y="106" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="400" y="90" width="60" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="106" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary</text>
  <rect x="460" y="90" width="60" height="24" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="106" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">bonus</text>

  <rect x="316" y="114" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="114" width="60" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="114" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="430" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4548</text>
  <text x="490" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9096</text>

  <rect x="316" y="138" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="138" width="60" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="138" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Grace</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">28150</text>
  <text x="490" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">56300</text>

  <rect x="316" y="162" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="162" width="60" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="162" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="430" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1103</text>
  <text x="490" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2206</text>

  <rect x="316" y="186" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="186" width="60" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="186" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="430" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6593</text>
  <text x="490" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13186</text>

  <text x="418" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">bonus 追加在最右端</text>

  <!-- Bottom: the one-liner -->
  <rect x="56" y="292" width="448" height="80" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">employees['bonus'] = employees['salary'] * 2</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">等号左边：开新列（列已存在则整列覆盖）</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">等号右边：整列表达式，按行索引对齐逐元素求值</text>
</svg>
