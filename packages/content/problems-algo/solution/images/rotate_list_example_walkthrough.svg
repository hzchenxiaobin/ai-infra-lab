<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：head = [1,2,3,4,5], k = 2</text>
  <path d="M 300 40 Q 460 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)"><rect x="40" y="62" width="840" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="90" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">阶段</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">操作</text>
  <text x="560" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">链表状态</text>
  <text x="820" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">说明</text>

  <!-- Row 1: find length -->
  <g filter="url(#sk)"><rect x="40" y="92" width="840" height="48" fill="#eaf6ee" stroke="#ddd" stroke-width="0.8"/></g>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="#444">求长度</text>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#2e6e2e" font-family="monospace">遍历计数</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="440" y="106" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="460" y="122" text-anchor="middle">1</text></g>
    <g filter="url(#sk)"><rect x="484" y="106" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="504" y="122" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="528" y="106" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="548" y="122" text-anchor="middle">3</text></g>
    <g filter="url(#sk)"><rect x="572" y="106" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="592" y="122" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="616" y="106" width="40" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/><text x="636" y="122" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text></g>
    <text x="666" y="122" font-size="10" fill="#888">→ null</text>
  </g>
  <text x="820" y="120" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">n=5, tail=5</text>

  <!-- Row 2: mod -->
  <g filter="url(#sk)"><rect x="40" y="140" width="840" height="48" fill="#fef6e6" stroke="#ddd" stroke-width="0.8"/></g>
  <text x="90" y="168" text-anchor="middle" font-size="11" fill="#444">取模</text>
  <text x="230" y="168" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace">k = 2 % 5</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="440" y="154" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="460" y="170" text-anchor="middle">1</text></g>
    <g filter="url(#sk)"><rect x="484" y="154" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="504" y="170" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="528" y="154" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="548" y="170" text-anchor="middle">3</text></g>
    <g filter="url(#sk)"><rect x="572" y="154" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="592" y="170" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="616" y="154" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="636" y="170" text-anchor="middle">5</text></g>
    <text x="666" y="170" font-size="10" fill="#888">→ null</text>
  </g>
  <text x="820" y="168" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">k=2, 需旋转</text>

  <!-- Row 3: close ring -->
  <g filter="url(#sk)"><rect x="40" y="188" width="840" height="52" fill="#fce4ec" stroke="#ddd" stroke-width="0.8"/></g>
  <text x="90" y="218" text-anchor="middle" font-size="11" fill="#444">成环</text>
  <text x="230" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace">tail.next=head</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="440" y="202" width="40" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/><text x="460" y="218" text-anchor="middle" fill="#2b6e9e" font-weight="bold">1</text></g>
    <g filter="url(#sk)"><rect x="484" y="202" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="504" y="218" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="528" y="202" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="548" y="218" text-anchor="middle">3</text></g>
    <g filter="url(#sk)"><rect x="572" y="202" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="592" y="218" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="616" y="202" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="636" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">5</text></g>
  </g>
  <!-- curved arrow from 5 back to 1 -->
  <path d="M 636 226 Q 548 248 460 226" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="820" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首尾相连↺</text>

  <!-- Row 4: walk to new tail -->
  <g filter="url(#sk)"><rect x="40" y="240" width="840" height="48" fill="#f3e8fb" stroke="#ddd" stroke-width="0.8"/></g>
  <text x="90" y="268" text-anchor="middle" font-size="11" fill="#444">走到新尾</text>
  <text x="230" y="268" text-anchor="middle" font-size="10" fill="#6b3da0" font-family="monospace">走 n−k−1 = 2 步</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="440" y="254" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="460" y="270" text-anchor="middle">1</text></g>
    <g filter="url(#sk)"><rect x="484" y="254" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="504" y="270" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="528" y="254" width="40" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/><text x="548" y="270" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text></g>
    <g filter="url(#sk)"><rect x="572" y="254" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="592" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">4</text></g>
    <g filter="url(#sk)"><rect x="616" y="254" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="636" y="270" text-anchor="middle">5</text></g>
  </g>
  <text x="548" y="296" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">new_tail</text>
  <text x="592" y="296" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">new_head</text>
  <text x="820" y="268" text-anchor="middle" font-size="10" fill="#6b3da0" font-weight="bold">new_tail=3</text>

  <!-- Row 5: break -->
  <g filter="url(#sk)"><rect x="40" y="300" width="840" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="90" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">断开</text>
  <text x="230" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace">new_tail.next=null</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="440" y="314" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="460" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">4</text></g>
    <g filter="url(#sk)"><rect x="484" y="314" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/><text x="504" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">5</text></g>
    <g filter="url(#sk)"><rect x="528" y="314" width="40" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/><text x="548" y="330" text-anchor="middle" fill="#2b6e9e" font-weight="bold">1</text></g>
    <g filter="url(#sk)"><rect x="572" y="314" width="40" height="24" rx="3" fill="#fff" stroke="#ddd"/><text x="592" y="330" text-anchor="middle">2</text></g>
    <g filter="url(#sk)"><rect x="616" y="314" width="40" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/><text x="636" y="330" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text></g>
    <text x="666" y="330" font-size="10" fill="#888">→ null</text>
  </g>
  <text x="820" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✂ 一刀切断</text>

  <!-- Result -->
  <g filter="url(#sk)"><rect x="40" y="360" width="840" height="80" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="460" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">结果：4 → 5 → 1 → 2 → 3 → null</text>
  <text x="460" y="410" text-anchor="middle" font-size="11" fill="#555">两趟遍历合计 O(n) 时间，O(1) 空间</text>
  <text x="460" y="428" text-anchor="middle" font-size="10" fill="#888">成环后只需定位断点，无需逐步搬尾</text>
</svg>
