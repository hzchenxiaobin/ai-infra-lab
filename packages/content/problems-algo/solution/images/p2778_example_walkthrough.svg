<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">示例演算：nums = [2,7,1,19,18,3]，n = 6</text>

  <!-- table header -->
  <rect x="40" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="100" y="48" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">nums[i-1]</text>
  <rect x="190" y="48" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">n % i</text>
  <rect x="260" y="48" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">特殊?</text>
  <rect x="340" y="48" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="410" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">贡献</text>

  <!-- rows: i=1..6 -->
  <!-- i=1: 2, 0, ✓, 2²=4 -->
  <rect x="40" y="80" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="100" y="80" width="90" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190" y="80" width="70" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="80" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="80" width="140" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2² = 4</text>

  <!-- i=2: 7, 0, ✓, 7²=49 -->
  <rect x="40" y="108" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="100" y="108" width="90" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="190" y="108" width="70" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="108" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="108" width="140" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7² = 49</text>

  <!-- i=3: 1, 0, ✓, 1²=1 -->
  <rect x="40" y="136" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="100" y="136" width="90" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="136" width="70" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="136" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="136" width="140" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1² = 1</text>

  <!-- i=4: 19, 2, ✗, 0 -->
  <rect x="40" y="164" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="100" y="164" width="90" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19</text>
  <rect x="190" y="164" width="70" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="260" y="164" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="340" y="164" width="140" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="182" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">— 跳过</text>

  <!-- i=5: 18, 1, ✗, 0 -->
  <rect x="40" y="192" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="100" y="192" width="90" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <rect x="190" y="192" width="70" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="192" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="340" y="192" width="140" height="26" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">— 跳过</text>

  <!-- i=6: 3, 0, ✓, 3²=9 -->
  <rect x="40" y="220" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <rect x="100" y="220" width="90" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="220" width="70" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="220" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="340" y="220" width="140" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3² = 9</text>

  <!-- sum row -->
  <rect x="40" y="258" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="280" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">求和（仅特殊元素）</text>
  <rect x="340" y="258" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="280" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">4+49+1+9 = 63</text>

  <!-- note -->
  <rect x="60" y="306" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下标 1-indexed：代码里取 nums[i-1]</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i 是 n 的因子 ⟺ n % i == 0</text>
</svg>
