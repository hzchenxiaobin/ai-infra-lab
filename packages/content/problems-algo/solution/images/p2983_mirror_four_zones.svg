<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：右半镜像对齐 → 两个重排区间进入同一坐标系</text>

  <!-- original string -->
  <text x="280" y="48" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">原串 s = "abdacdac"（n=8, m=4），查询 [a,b,c,d] = [0,1,5,6]</text>

  <rect x="95" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="137" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="179" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="221" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="263" y="56" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="305" y="56" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="347" y="56" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="389" y="56" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="155" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="197" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="239" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="281" y="76" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="323" y="76" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="365" y="76" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="407" y="76" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="113" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="197" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="239" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="281" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="323" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="365" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="407" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <path d="M 262 54 L 262 108" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="262" y="118" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">中缝</text>

  <rect x="93" y="50" width="82" height="42" fill="none" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <rect x="303" y="50" width="82" height="42" fill="none" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="134" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">重排①=[0,1]</text>
  <text x="344" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">重排②=[5,6]</text>

  <!-- mirror arcs -->
  <path d="M 330 96 C 400 130, 340 180, 272 226" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 372 96 C 462 150, 400 220, 224 226" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="398" y="126" text-anchor="middle" font-size="9.5" fill="#a07820" filter="url(#rough2)">s[5] → y₂</text>
  <text x="452" y="182" text-anchor="middle" font-size="9.5" fill="#a07820" filter="url(#rough2)">s[6] → y₁</text>

  <!-- aligned rows -->
  <text x="20" y="166" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">镜像对齐后（i ∈ [0, m)）：</text>

  <text x="128" y="206" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">xᵢ = s[i]</text>
  <rect x="140" y="188" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="188" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="244" y="188" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="296" y="188" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="162" y="208" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="214" y="208" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="266" y="208" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">d</text>
  <text x="318" y="208" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">a</text>

  <text x="128" y="252" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">yᵢ = s[n−1−i]</text>
  <rect x="140" y="234" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="234" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="244" y="234" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="296" y="234" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="162" y="254" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">c</text>
  <text x="214" y="254" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="266" y="254" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="318" y="254" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">c</text>

  <!-- bracket U1 above x row -->
  <path d="M 140 180 L 140 174 L 236 174 L 236 180" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="188" y="170" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">①=[0,1]</text>

  <!-- indices -->
  <text x="162" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="214" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="266" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="318" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>

  <!-- bracket U2 below y row -->
  <path d="M 192 288 L 192 294 L 288 294 L 288 288" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="240" y="310" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">②镜像后=[n−1−d, n−1−c]=[1,2]</text>

  <!-- zone chips -->
  <rect x="137" y="322" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="162" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">仅①</text>
  <rect x="189" y="322" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="214" y="336" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">双</text>
  <rect x="241" y="322" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="266" y="336" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">仅②</text>
  <rect x="293" y="322" width="50" height="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="318" y="336" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">门外</text>

  <!-- legend -->
  <rect x="36" y="356" width="488" height="106" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">四类位置，四种命运</text>
  <text x="52" y="402" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">· 门外（灰）：x、y 两侧都锁死 → 必须本来就相等，否则直接 false（条件 A）</text>
  <text x="52" y="422" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">· 仅①（蓝）：x 进左池可换，y 锁死 → y 是左池必须满足的固定需求</text>
  <text x="52" y="442" text-anchor="start" font-size="11" fill="#7a5a10" filter="url(#rough2)">· 仅②（橙）：y 进右池可换，x 锁死 → x 是右池必须满足的固定需求</text>
  <text x="52" y="462" text-anchor="start" font-size="11" fill="#2f5d24" filter="url(#rough2)">· 双（绿）：两侧都自由 → 两池之间唯一的「桥」，成对消耗等值字符</text>
</svg>
