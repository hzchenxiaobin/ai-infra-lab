<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">克隆图：用 哈希表(原节点→克隆) 破环 + 去重</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">map 既是 visited 防止环上无限递归，也保证每个节点只克隆一次</text>

  <!-- ===== Left: original graph ===== -->
  <text x="100" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原图（含环 1-2-3-4-1）</text>

  <!-- edges original (undirected) -->
  <path d="M 118 150 Q 100 200 118 250" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 142 150 Q 160 200 142 250" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 130 270 L 130 330" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 130 270 L 70 270 L 70 330" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes original -->
  <ellipse cx="130" cy="130" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <ellipse cx="130" cy="270" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="275" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <ellipse cx="130" cy="350" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="354" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <ellipse cx="70" cy="350" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="354" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>

  <!-- ===== Middle: hash map ===== -->
  <text x="290" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">哈希表 visited</text>
  <text x="290" y="90" text-anchor="middle" font-size="9" fill="#888">原节点 → 克隆节点</text>

  <rect x="226" y="100" width="128" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>

  <text x="262" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">key</text>
  <text x="318" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">val</text>
  <line x1="252" y1="132" x2="328" y2="132" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="262" y="152" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="293" y="152" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="318" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1′</text>

  <text x="262" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="293" y="180" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="318" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2′</text>

  <text x="262" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="293" y="208" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="318" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3′</text>

  <text x="262" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="293" y="236" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="318" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4′</text>

  <text x="290" y="276" text-anchor="middle" font-size="9" fill="#b85450">命中即复用，不再新建</text>

  <!-- arrow original -> map -->
  <path d="M 162 200 L 222 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="192" text-anchor="middle" font-size="9" fill="#b85450">查询</text>

  <!-- arrow map -> clone -->
  <path d="M 358 200 L 418 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">返回</text>

  <!-- ===== Right: cloned graph ===== -->
  <text x="490" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">克隆图（全新节点）</text>

  <!-- edges clone -->
  <path d="M 478 150 Q 460 200 478 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 502 150 Q 520 200 502 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 270 L 490 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 270 L 430 270 L 430 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes clone -->
  <ellipse cx="490" cy="130" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="135" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1′</text>

  <ellipse cx="490" cy="270" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="275" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2′</text>

  <ellipse cx="490" cy="350" rx="24" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3′</text>

  <ellipse cx="430" cy="350" rx="24" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4′</text>

  <!-- footer note -->
  <rect x="60" y="382" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="401" text-anchor="middle" font-size="10.5" fill="#666">⚠ 环 1→2→1：若无 map，DFS 会无限递归；map 既防环又防重复克隆同一节点</text>
</svg>
