<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：长度被 k 整除 ⇔ 前缀和下标同余</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 3：nums = [−5, 1, 2, −3, 4]，k = 2；P[i] = 前 i 项之和，P[0] = 0</text>

  <!-- 前缀和行：下标标签 -->
  <text x="85" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="155" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 1</text>
  <text x="225" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 2</text>
  <text x="295" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 3</text>
  <text x="365" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 4</text>
  <text x="435" y="52" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 5</text>

  <!-- 前缀和格子：蓝 = 余 0，绿 = 余 1；P1 / P5 红框高亮（答案配对） -->
  <rect x="54" y="56" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85" y="82" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="124" y="56" width="62" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="14" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−5</text>

  <rect x="194" y="56" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="225" y="82" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">−4</text>

  <rect x="264" y="56" width="62" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="82" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−2</text>

  <rect x="334" y="56" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="365" y="82" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">−5</text>

  <rect x="404" y="56" width="62" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="82" text-anchor="middle" font-size="14" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- 余数徽标 -->
  <text x="85" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">mod 2 = 0</text>
  <text x="155" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mod 2 = 1</text>
  <text x="225" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">mod 2 = 0</text>
  <text x="295" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mod 2 = 1</text>
  <text x="365" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">mod 2 = 0</text>
  <text x="435" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mod 2 = 1</text>

  <!-- 分隔虚线 -->
  <path d="M 25 124 L 495 124" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">按「下标 mod k」拆成 k 条通道 → 每条通道内部玩一场「股票买卖」</text>

  <!-- 通道 0 -->
  <rect x="25" y="154" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">通道 0</text>
  <text x="75" y="181" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">i ≡ 0 (mod 2)</text>

  <rect x="150" y="154" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="168" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">P[0]</text>
  <text x="178" y="181" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 208 171 L 220 171" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="224" y="154" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="168" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">P[2]</text>
  <text x="252" y="181" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">−4</text>
  <path d="M 282 171 L 294 171" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="298" y="154" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="168" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">P[4]</text>
  <text x="326" y="181" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">−5</text>

  <text x="435" y="168" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">通道内最优：</text>
  <text x="435" y="181" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">P[4] − P[2] = −1</text>

  <!-- 通道 1 -->
  <rect x="25" y="204" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="75" y="218" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">通道 1</text>
  <text x="75" y="231" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">i ≡ 1 (mod 2)</text>

  <rect x="150" y="204" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="218" text-anchor="middle" font-size="8.5" fill="#8a3a34" filter="url(#rough2)">P[1] 买点</text>
  <text x="178" y="231" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−5</text>
  <path d="M 208 221 L 220 221" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="224" y="204" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="218" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">P[3]</text>
  <text x="252" y="231" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−2</text>
  <path d="M 282 221 L 294 221" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="298" y="204" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="218" text-anchor="middle" font-size="8.5" fill="#8a3a34" filter="url(#rough2)">P[5] 卖点</text>
  <text x="326" y="231" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">−1</text>

  <text x="435" y="218" text-anchor="middle" font-size="9" fill="#8a3a34" filter="url(#rough2)">通道内最优：</text>
  <text x="435" y="231" text-anchor="middle" font-size="9" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">P[5] − P[1] = 4 ★</text>

  <!-- 公式框 -->
  <rect x="25" y="252" width="470" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">子数组和 = P[r] − P[l]，长度 r − l 被 k 整除 ⇔ r ≡ l (mod k)</text>

  <!-- 股票模型框 -->
  <rect x="25" y="296" width="470" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">扫描到 P[r] 时：ans ← max(ans, P[r] − minP[r mod k])</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">minP = 本通道历史最小前缀和（最低买点）→ O(1) 完成一次「低买高卖」</text>

  <!-- 答案框 -->
  <rect x="25" y="352" width="470" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">全局答案 ans = P[5] − P[1] = −1 − (−5) = 4</text>
  <text x="260" y="391" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">对应子数组 nums[1..4] = [1, 2, −3, 4]，长度 4 被 2 整除 ✓</text>

  <!-- 脚注 -->
  <text x="260" y="424" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">best[0] 初始化为 0（空前缀 P[0]）；先查询后入库，保证配对下标 l &lt; r（子数组非空）</text>
</svg>
