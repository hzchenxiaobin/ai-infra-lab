<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,6,2,3] → 排序 [2,3,3,6]</text>

  <!-- sorted array at top -->
  <text x="30" y="58" font-size="12" fill="#888">排序后：</text>
  <rect x="110" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="230" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="290" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="138" y="84" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="198" y="84" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="258" y="84" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="318" y="84" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>

  <!-- table headers -->
  <text x="20" y="112" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="120" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">三元组 (a, b, c)</text>
  <text x="290" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">a + b  vs  c</text>
  <text x="440" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <line x1="10" y1="120" x2="550" y2="120" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: i=1, triple (3,3,6), 3+3=6<=6, fail -->
  <text x="20" y="144" font-size="11" fill="#333">1</text>
  <text x="56" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="120" y="144" font-size="11" fill="#333">(3, 3, 6)</text>
  <text x="290" y="144" text-anchor="middle" font-size="11" fill="#333">3 + 3 = 6 ≤ 6  ✗</text>
  <text x="440" y="144" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i−−</text>

  <!-- Row 2: i=0, triple (2,3,3), 2+3=5>3, success -->
  <text x="20" y="174" font-size="11" fill="#333">2</text>
  <text x="56" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="120" y="174" font-size="11" fill="#333">(2, 3, 3)</text>
  <rect x="250" y="162" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 + 3 = 5 &gt; 3  ✓</text>
  <text x="440" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回周长</text>

  <line x1="10" y1="192" x2="550" y2="192" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="210" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">周长 = 2 + 3 + 3 = 8  ✓</text>

  <!-- legend -->
  <text x="20" y="270" font-size="11" fill="#888" font-weight="bold">图例：</text>
  <rect x="70" y="260" width="18" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="94" y="272" font-size="10.5" fill="#444">a（较小边）</text>
  <rect x="180" y="260" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="204" y="272" font-size="10.5" fill="#444">b（中间边）</text>
  <rect x="290" y="260" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="272" font-size="10.5" fill="#444">c（最大边）</text>
  <rect x="400" y="260" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="272" font-size="10.5" fill="#4a7a3a" font-weight="bold">a + b &gt; c</text>

  <!-- footer note -->
  <rect x="40" y="292" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#444">步骤 1：c = 6，最优配对 a = 3, b = 3，但 3 + 3 = 6 ≤ 6，6 无法作为最大边</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#888">步骤 2：c = 3，a = 2, b = 3，2 + 3 = 5 &gt; 3 ✓，首个合法即最大周长</text>
</svg>
