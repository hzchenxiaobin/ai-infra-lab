<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：自连接 → GROUP BY 去重 → ORDER BY 排序</text>

  <!-- Step 1: Self-Join -->
  <rect x="30" y="48" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="74" r="14" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="79" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="84" y="72" font-size="12" fill="#446688" font-weight="bold">自连接：Follow f1 JOIN Follow f2 ON f1.follower = f2.followee</text>
  <text x="84" y="90" font-size="10" fill="#555">把「Y 关注 X」与「Z 关注 Y」两条边拼接成 (X, Z) 二级关注对</text>
  <text x="84" y="106" font-size="10" fill="#555">f1.follower 与 f2.followee 是同一列（中间人 Y），桥接两跳</text>
  <text x="84" y="124" font-size="9.5" fill="#b85450">⚠️ 可能产生重复行：Z 通过多条路径成为 X 的二级关注者</text>

  <!-- arrow step1 -> step2 -->
  <path d="M280 142 L280 160" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <rect x="30" y="164" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="190" r="14" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="195" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="84" y="188" font-size="12" fill="#d6a040" font-weight="bold">GROUP BY f1.followee, f2.follower</text>
  <text x="84" y="206" font-size="10" fill="#555">按 (followee, follower) 对去重——同一二级关注关系只保留一行</text>
  <text x="84" y="222" font-size="10" fill="#555">SELECT 不需聚合函数，GROUP BY 自身即去重（SELECT 上的列全在 GROUP BY 中）</text>

  <!-- arrow step2 -> step3 -->
  <path d="M280 244 L280 262" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: ORDER BY -->
  <rect x="30" y="266" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="58" cy="292" r="14" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="297" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="84" y="290" font-size="12" fill="#4a7a3a" font-weight="bold">ORDER BY followee, follower（即 ORDER BY 1, 2）</text>
  <text x="84" y="308" font-size="10" fill="#555">先按被关注者升序，再按二级关注者升序，得到题目要求的有序输出</text>

  <!-- arrow step3 -> output -->
  <path d="M280 330 L280 348" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="120" y="352" width="320" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：去重 + 排序后的二级关注者表 (followee, follower)</text>
</svg>
