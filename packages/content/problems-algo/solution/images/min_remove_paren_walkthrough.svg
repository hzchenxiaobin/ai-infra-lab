<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "lee(t(c)o)de)"</text>
  <text x="290" y="44" text-anchor="middle" font-size="10" fill="#888">仅展示关键步（字母与跳过步合并），栈存 '(' 的下标</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="58" width="520" height="26" fill="#446688" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="55" y="76">i</text>
    <text x="95" y="76">s[i]</text>
    <text x="160" y="76">操作</text>
    <text x="270" y="76">栈（存下标）</text>
    <text x="380" y="76">remove 集合</text>
    <text x="495" y="76">说明</text>
  </g>
  <line x1="75" y1="58" x2="75" y2="84" stroke="#fff" stroke-width="1"/>
  <line x1="115" y1="58" x2="115" y2="84" stroke="#fff" stroke-width="1"/>
  <line x1="210" y1="58" x2="210" y2="84" stroke="#fff" stroke-width="1"/>
  <line x1="330" y1="58" x2="330" y2="84" stroke="#fff" stroke-width="1"/>
  <line x1="445" y1="58" x2="445" y2="84" stroke="#fff" stroke-width="1"/>

  <!-- ===== Rows ===== -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <!-- row 1: i=0-2 letters -->
    <rect x="30" y="84" width="520" height="24" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="100">0-2</text>
    <text x="95" y="100">lee</text>
    <text x="160" y="100">跳过</text>
    <text x="270" y="100" fill="#888">[]</text>
    <text x="380" y="100" fill="#888">∅</text>
    <text x="495" y="100" fill="#888">字母不入栈</text>

    <!-- row 2: i=3 ( push -->
    <rect x="30" y="108" width="520" height="24" fill="#e8f0fe" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="124">3</text>
    <text x="95" y="124" fill="#446688" font-weight="bold">(</text>
    <text x="160" y="124" fill="#446688">入栈</text>
    <text x="270" y="124" fill="#446688">[3]</text>
    <text x="380" y="124" fill="#888">∅</text>
    <text x="495" y="124" fill="#446688">记录待匹配</text>

    <!-- row 3: i=4 t skip -->
    <rect x="30" y="132" width="520" height="22" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="148">4</text>
    <text x="95" y="148">t</text>
    <text x="160" y="148">跳过</text>
    <text x="270" y="148" fill="#446688">[3]</text>
    <text x="380" y="148" fill="#888">∅</text>
    <text x="495" y="148" fill="#888">—</text>

    <!-- row 4: i=5 ( push -->
    <rect x="30" y="154" width="520" height="24" fill="#e8f0fe" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="170">5</text>
    <text x="95" y="170" fill="#446688" font-weight="bold">(</text>
    <text x="160" y="170" fill="#446688">入栈</text>
    <text x="270" y="170" fill="#446688">[3, 5]</text>
    <text x="380" y="170" fill="#888">∅</text>
    <text x="495" y="170" fill="#446688">嵌套左括号</text>

    <!-- row 5: i=6 c skip -->
    <rect x="30" y="178" width="520" height="22" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="194">6</text>
    <text x="95" y="194">c</text>
    <text x="160" y="194">跳过</text>
    <text x="270" y="194" fill="#446688">[3, 5]</text>
    <text x="380" y="194" fill="#888">∅</text>
    <text x="495" y="194" fill="#888">—</text>

    <!-- row 6: i=7 ) pop 5 -->
    <rect x="30" y="200" width="520" height="24" fill="#e6f4ea" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="216">7</text>
    <text x="95" y="216" fill="#4a7a3a" font-weight="bold">)</text>
    <text x="160" y="216" fill="#4a7a3a">弹出 5 配对</text>
    <text x="270" y="216" fill="#446688">[3]</text>
    <text x="380" y="216" fill="#888">∅</text>
    <text x="495" y="216" fill="#4a7a3a">5↔7 配对 ✓</text>

    <!-- row 7: i=8 o skip -->
    <rect x="30" y="224" width="520" height="22" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="240">8</text>
    <text x="95" y="240">o</text>
    <text x="160" y="240">跳过</text>
    <text x="270" y="240" fill="#446688">[3]</text>
    <text x="380" y="240" fill="#888">∅</text>
    <text x="495" y="240" fill="#888">—</text>

    <!-- row 8: i=9 ) pop 3 -->
    <rect x="30" y="246" width="520" height="24" fill="#e6f4ea" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="262">9</text>
    <text x="95" y="262" fill="#4a7a3a" font-weight="bold">)</text>
    <text x="160" y="262" fill="#4a7a3a">弹出 3 配对</text>
    <text x="270" y="262" fill="#888">[]</text>
    <text x="380" y="262" fill="#888">∅</text>
    <text x="495" y="262" fill="#4a7a3a">3↔9 配对 ✓</text>

    <!-- row 9: i=10-11 de skip -->
    <rect x="30" y="270" width="520" height="22" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="55" y="286">10-11</text>
    <text x="95" y="286">de</text>
    <text x="160" y="286">跳过</text>
    <text x="270" y="286" fill="#888">[]</text>
    <text x="380" y="286" fill="#888">∅</text>
    <text x="495" y="286" fill="#888">—</text>

    <!-- row 10: i=12 ) stack empty -> mark -->
    <rect x="30" y="292" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="310" fill="#b85450" font-weight="bold">12</text>
    <text x="95" y="310" fill="#b85450" font-weight="bold">)</text>
    <text x="160" y="310" fill="#b85450" font-weight="bold">栈空 → 标记 12</text>
    <text x="270" y="310" fill="#888">[]</text>
    <text x="380" y="310" fill="#b85450" font-weight="bold">{12}</text>
    <text x="495" y="310" fill="#b85450">多余右括号 ✗</text>
  </g>

  <!-- ===== After scan ===== -->
  <path d="M 30 326 L 550 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="30" y="338" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">扫描结束：栈 = []（无残留 '('），remove = {12}</text>
  <text x="290" y="370" text-anchor="middle" font-size="10" fill="#888">若栈非空，则把栈中所有下标加入 remove（删未配对的 '('）</text>

  <!-- ===== Build result ===== -->
  <rect x="30" y="384" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">拼接未被标记的字符 → "lee(t(c)o)de"</text>
  <text x="290" y="416" text-anchor="middle" font-size="10" fill="#888">只删了 i=12 一个 ')'，括号已全部配对 → 合法 ✓</text>

  <!-- ===== Summary formula ===== -->
  <rect x="60" y="430" width="460" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="446" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">删除数 = (栈空时遇到的 ')' 数) + (扫描后栈中残留 '(' 数)</text>
</svg>
