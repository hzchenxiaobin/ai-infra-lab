<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扫描计数 + 逐桶校验最大槽位</text>

  <!-- Start -->
  <rect x="220" y="48" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 80 L 280 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: length check -->
  <polygon points="280,102 392,142 280,182 168,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">len(s) ≠ len(t) ?</text>
  <path d="M 392 142 L 450 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="136" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="450" y="126" width="94" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="497" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 280 182 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Scan process -->
  <rect x="150" y="202" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333">扫描 i = 0..n−1</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#333">d = (t[i] − s[i] + 26) mod 26</text>
  <path d="M 280 244 L 280 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Count process -->
  <rect x="150" y="260" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt[d] ++ （d=0 入桶但校验时跳过）</text>
  <path d="M 280 296 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: check all d -->
  <polygon points="280,316 405,362 280,408 155,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">∀ d ∈ 1..25：</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">d + 26·(cnt[d]−1) ≤ k ?</text>
  <path d="M 405 362 L 450 362" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="450" y="346" width="94" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="497" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 280 408 L 280 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="420" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Return true -->
  <rect x="220" y="424" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
