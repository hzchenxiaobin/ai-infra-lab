<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="520" fill="#fafafa"/>

  <!-- Start -->
  <ellipse cx="240" cy="36" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="41" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M240,54 L240,74" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 1: init adjacency -->
  <rect x="60" y="76" width="360" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化邻接表 g[0..n-1] = []</text>

  <path d="M240,110 L240,128" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: type 1 stack (blue) -->
  <rect x="60" y="130" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">单调栈 #1（从右→左）：弹出 nums[k] &lt; nums[i]</text>
  <text x="240" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">栈顶 j → g[i].add(j)  · 类型一 · 下一个 ≥</text>

  <path d="M240,186 L240,204" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3: type 2 stack (green) -->
  <rect x="60" y="206" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">单调栈 #2（从右→左）：弹出 nums[k] ≥ nums[i]</text>
  <text x="240" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">栈顶 j → g[i].add(j)  · 类型二 · 下一个 &lt;</text>

  <path d="M240,262 L240,280" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: init f -->
  <rect x="60" y="282" width="360" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[0] = 0，其余 f[i] = +∞（long long）</text>

  <path d="M240,316 L240,334" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5: DP relaxation (orange) -->
  <rect x="60" y="336" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="358" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">for i = 0 .. n-1：（拓扑序 = 下标序）</text>
  <text x="240" y="378" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">for j ∈ g[i]：f[j] = min(f[j], f[i] + costs[j])</text>

  <path d="M240,392 L240,410" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 6: return -->
  <rect x="60" y="412" width="360" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="434" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 f[n-1]</text>

  <path d="M240,446 L240,456" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="240" cy="476" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="481" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结束</text>
</svg>
