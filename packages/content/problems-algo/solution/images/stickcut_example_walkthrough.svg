<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：dp 表与最优切割树  (n=7, cuts=[1,3,4,5])</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">pos = [0, 1, 3, 4, 5, 7]   下标 0..5</text>

  <!-- dp 表 -->
  <!-- 表头：列下标 -->
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j→</text>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i↓</text>

  <!-- 行列标签 -->
  <g filter="url(#rough2)" font-size="11" fill="#446688" text-anchor="middle">
    <text x="150" y="100">0</text>
    <text x="200" y="100">1</text>
    <text x="250" y="100">2</text>
    <text x="300" y="100">3</text>
    <text x="350" y="100">4</text>
    <text x="400" y="100">5</text>
    <text x="120" y="130">0</text>
    <text x="120" y="160">1</text>
    <text x="120" y="190">2</text>
    <text x="120" y="220">3</text>
    <text x="120" y="250">4</text>
    <text x="120" y="280">5</text>
  </g>

  <!-- 格子 6x6，每格 50x30 起点 (130,110) -->
  <!-- 行0: dp[0][1..5] = 0,3,7,10,16 -->
  <g filter="url(#rough2)">
    <rect x="130" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="180" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="230" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="280" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="330" y="112" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="150" y="131" fill="#4a7a3a">0</text>
    <text x="200" y="131" fill="#d6a040">3</text>
    <text x="250" y="131" fill="#d6a040">7</text>
    <text x="300" y="131" fill="#d6a040">10</text>
    <text x="350" y="131" fill="#b85450" font-weight="bold">16</text>
  </g>

  <!-- 行1: dp[1][2..5] = 0,3,6,12 -->
  <g filter="url(#rough2)">
    <rect x="180" y="142" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="230" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="280" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="330" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#d6a040">
    <text x="200" y="161" fill="#4a7a3a">0</text>
    <text x="250" y="161">3</text>
    <text x="300" y="161">6</text>
    <text x="350" y="161">12</text>
  </g>

  <!-- 行2: dp[2][3..5] = 0,2,6 -->
  <g filter="url(#rough2)">
    <rect x="230" y="172" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="280" y="172" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="330" y="172" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#d6a040">
    <text x="250" y="191" fill="#4a7a3a">0</text>
    <text x="300" y="191">2</text>
    <text x="350" y="191">6</text>
  </g>

  <!-- 行3: dp[3][4..5] = 0,3 -->
  <g filter="url(#rough2)">
    <rect x="280" y="202" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="330" y="202" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="300" y="221" fill="#4a7a3a">0</text>
    <text x="350" y="221" fill="#d6a040">3</text>
  </g>

  <!-- 行4: dp[4][5] = 0 -->
  <g filter="url(#rough2)">
    <rect x="330" y="232" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="350" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="10" fill="#666">
    <rect x="430" y="116" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="450" y="126">相邻=0（边界）</text>
    <rect x="430" y="136" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="450" y="146">中间状态</text>
    <rect x="430" y="156" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="450" y="166">答案 dp[0][5]</text>
  </g>

  <!-- 最优决策回溯说明 -->
  <text x="150" y="280" font-size="12" fill="#b85450" filter="url(#rough2)">最优决策回溯：dp[0][5]=16 选 k=2</text>

  <!-- 切割树 -->
  <text x="310" y="300" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最优切割树（每节点：区间 / 切点 / 成本）</text>

  <!-- 根 -->
  <rect x="250" y="312" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="333" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[0,5] 切k=2  成本7</text>

  <!-- 左子 [0,2] -->
  <path d="M280 346 Q 210 360 195 372" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="120" y="376" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="175" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[0,2] 切k=1  成本3</text>

  <!-- 右子 [2,5] -->
  <path d="M340 346 Q 410 360 425 372" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="370" y="376" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="396" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[2,5] 切k=4  成本4</text>

  <!-- [0,2] 的叶子 -->
  <rect x="95" y="420" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="435" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[0,1]</text>
  <rect x="155" y="420" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="435" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1,2]</text>

  <!-- [2,5] 的子 [2,4] -->
  <path d="M410 408 Q 385 418 375 425" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="345" y="428" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="380" y="445" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">[2,4] 切k=3 成本2</text>

  <!-- [2,5] 的子 [4,5] -->
  <path d="M450 408 Q 475 418 485 425" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="465" y="428" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="492" y="443" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">[4,5]</text>

  <!-- 总成本标注 -->
  <text x="310" y="465" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">总成本 = 7 + 3 + 4 + 2 = 16 ✓  顺序 [3, 1, 5, 4]</text>
</svg>
