<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="120" y="28" width="160" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">开始：输入 nums</text>

  <path d="M200,70 L200,100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 一次遍历 -->
  <rect x="50" y="100" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一次遍历：</text>
  <text x="200" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 最左最小值下标，j = 最右最大值下标</text>

  <path d="M200,156 L200,186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 i == j -->
  <polygon points="200,186 280,221 200,256 120,221" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i == j ?</text>

  <!-- 是：返回 0 -->
  <path d="M280,221 L360,221" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="318" y="213" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="360" y="201" width="120" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">返回 0</text>

  <!-- 否：向下 -->
  <path d="M200,256 L200,282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="212" y="273" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判定 i < j -->
  <polygon points="200,282 280,317 200,352 120,317" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i &lt; j ?</text>

  <!-- 是：返回 i+(n-1-j) -->
  <path d="M280,317 L360,317" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="318" y="309" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="358" y="296" width="148" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="323" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">返回 i+(n−1−j)</text>

  <!-- 否：返回 i+(n-1-j)-1 -->
  <path d="M200,352 L200,378" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="212" y="369" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="90" y="378" width="220" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="405" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">返回 i + (n−1−j) − 1</text>

</svg>
