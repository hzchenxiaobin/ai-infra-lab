<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：频率是「全局」属性 —— 第一遍数完，第二遍过滤</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例：s = "aadbbcccca"，k = 3 → 输出 "dbb"</text>

  <!-- string cells: a a d b b c c c c a -->
  <rect x="56" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="92" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="128" y="54" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="164" y="54" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="200" y="54" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="236" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="272" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="308" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="344" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="380" y="54" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- indices -->
  <text x="74" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="110" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="146" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="182" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="218" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="254" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="290" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="326" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="362" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="398" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>

  <!-- legend -->
  <rect x="424" y="56" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="66" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">保留（freq &lt; k）</text>
  <rect x="424" y="76" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="86" font-size="9.5" fill="#b85450" filter="url(#rough2)">删除（freq ≥ k）</text>

  <!-- arrow 1 -->
  <path d="M 152,103 L 152,119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="113" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 先数频率（26 个计数器）</text>

  <!-- freq panel -->
  <rect x="30" y="122" width="245" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="142" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">频次表 cnt（第一遍数出）</text>
  <text x="42" y="165" font-size="10.5" fill="#333" filter="url(#rough2)">a → 3 次（位置 0、1、9）</text>
  <text x="42" y="185" font-size="10.5" fill="#333" filter="url(#rough2)">d → 1 次</text>
  <text x="42" y="205" font-size="10.5" fill="#333" filter="url(#rough2)">b → 2 次</text>
  <text x="42" y="225" font-size="10.5" fill="#333" filter="url(#rough2)">c → 4 次</text>

  <!-- arrow between panels -->
  <path d="M 275,181 L 291,181" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- judge panel -->
  <rect x="295" y="122" width="235" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="307" y="142" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">与 k = 3 逐一比较（第二遍查表）</text>
  <text x="307" y="165" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">a: 3 ≥ 3 → 删除</text>
  <text x="307" y="185" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d: 1 &lt; 3 → 保留</text>
  <text x="307" y="205" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b: 2 &lt; 3 → 保留</text>
  <text x="307" y="225" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c: 4 ≥ 3 → 删除</text>

  <!-- arrow to result -->
  <path d="M 350,240 L 350,251" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result row -->
  <text x="160" y="273" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 保序拼接 → res =</text>
  <rect x="280" y="254" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="312" y="254" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="344" y="254" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="359" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- bottom note -->
  <rect x="30" y="300" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="42" y="316" font-size="10.5" fill="#333" filter="url(#rough2)">频率是整串的全局量：同一字符的多次出现共享一个计数，与位置无关；</text>
  <text x="42" y="334" font-size="10.5" fill="#333" filter="url(#rough2)">扫到某个字符时它后面可能还有同字符 → 频率未定型，必须先数完再过滤</text>
</svg>
