<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">叶值序列：从左到右收集所有叶子的值</text>

  <!-- ===== 树 1 ===== -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#888">root1</text>

  <!-- 根 3 -->
  <circle cx="160" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- 左 5 -->
  <line x1="150" y1="92" x2="120" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="115" cy="122" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="126" text-anchor="middle" font-size="11" fill="#333">5</text>
  <!-- 右 1 -->
  <line x1="170" y1="92" x2="200" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="205" cy="122" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="126" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- 5 左 6 (叶子) -->
  <line x1="107" y1="134" x2="92" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="88" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="166" text-anchor="middle" font-size="10" fill="#333">6</text>
  <!-- 5 右 2 -->
  <line x1="123" y1="134" x2="140" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="142" cy="162" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="166" text-anchor="middle" font-size="10" fill="#333">2</text>
  <!-- 2 左 7 (叶子) -->
  <line x1="134" y1="173" x2="120" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="116" cy="202" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="206" text-anchor="middle" font-size="10" fill="#333">7</text>
  <!-- 2 右 4 (叶子) -->
  <line x1="150" y1="173" x2="164" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="168" cy="202" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="206" text-anchor="middle" font-size="10" fill="#333">4</text>
  <!-- 1 左 9 (叶子) -->
  <line x1="197" y1="134" x2="183" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="166" text-anchor="middle" font-size="10" fill="#333">9</text>
  <!-- 1 右 8 (叶子) -->
  <line x1="213" y1="134" x2="227" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="230" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="166" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- 叶值序列标注 -->
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">叶值序列（绿色叶子从左到右）</text>
  <rect x="70" y="250" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="269" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[6, 7, 4, 9, 8]</text>

  <!-- ===== 等号 ===== -->
  <text x="300" y="262" text-anchor="middle" font-size="24" fill="#b85450" font-weight="bold" filter="url(#rough2)">==</text>
  <text x="300" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true!</text>

  <!-- ===== 树 2 ===== -->
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#888">root2</text>

  <!-- 根 3 -->
  <circle cx="450" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- 左 5 -->
  <line x1="440" y1="92" x2="410" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="405" cy="122" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="126" text-anchor="middle" font-size="11" fill="#333">5</text>
  <!-- 右 1 -->
  <line x1="460" y1="92" x2="490" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="495" cy="122" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="126" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- 5 左 6 (叶子) -->
  <line x1="397" y1="134" x2="382" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="378" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="166" text-anchor="middle" font-size="10" fill="#333">6</text>
  <!-- 5 右 7 (叶子) -->
  <line x1="413" y1="134" x2="427" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="430" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="166" text-anchor="middle" font-size="10" fill="#333">7</text>
  <!-- 1 左 4 (叶子) -->
  <line x1="487" y1="134" x2="473" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="470" cy="162" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="166" text-anchor="middle" font-size="10" fill="#333">4</text>
  <!-- 1 右 2 -->
  <line x1="503" y1="134" x2="517" y2="152" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="520" cy="162" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="166" text-anchor="middle" font-size="10" fill="#333">2</text>
  <!-- 2 左 9 (叶子) -->
  <line x1="512" y1="173" x2="498" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="494" cy="202" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="494" y="206" text-anchor="middle" font-size="10" fill="#333">9</text>
  <!-- 2 右 8 (叶子) -->
  <line x1="528" y1="173" x2="542" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="546" cy="202" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="546" y="206" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- 叶值序列标注 -->
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">叶值序列（绿色叶子从左到右）</text>
  <rect x="360" y="250" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="269" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[6, 7, 4, 9, 8]</text>

  <!-- ===== 说明框 ===== -->
  <rect x="60" y="300" width="480" height="105" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心思路</text>
  <text x="80" y="346" font-size="11" fill="#555">① 前序 DFS（左先右后）天然保证叶子按从左到右的顺序被访问</text>
  <text x="80" y="364" font-size="11" fill="#555">② 遇到叶子节点（左右孩子都为 null）时，收集它的值</text>
  <text x="80" y="382" font-size="11" fill="#555">③ 比较两棵树的叶值序列是否完全相同</text>
  <text x="80" y="398" font-size="10" fill="#888">绿色节点 = 叶子（被收集）；蓝色节点 = 非叶（只做中转）</text>
</svg>
