<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：9 格骨架的挂载与计数填充</text>

  <!-- ===== Stage 1: skeleton (empty grid) ===== -->
  <text x="110" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤 ①②③ 骨架（9 空格）</text>

  <text x="68" y="76" text-anchor="middle" font-size="8" fill="#888">Reading</text>
  <text x="108" y="76" text-anchor="middle" font-size="8" fill="#888">Sports</text>
  <text x="152" y="76" text-anchor="middle" font-size="8" fill="#888">Programming</text>
  <text x="22" y="98" text-anchor="end" font-size="8" fill="#888">Android</text>
  <text x="22" y="128" text-anchor="end" font-size="8" fill="#888">IOS</text>
  <text x="22" y="158" text-anchor="end" font-size="8" fill="#888">Web</text>

  <!-- 9 empty cells -->
  <rect x="40" y="84" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="84" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="132" y="84" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="114" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="114" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="132" y="114" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="144" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="144" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <rect x="132" y="144" width="44" height="28" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>

  <!-- arrow -->
  <path d="M 188 128 L 222 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="122" text-anchor="middle" font-size="8" fill="#888">挂载</text>

  <!-- ===== Stage 2: after LEFT JOIN (experiment_ids in cells) ===== -->
  <text x="320" y="52" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">步骤 ④ LEFT JOIN 挂事实行</text>

  <text x="278" y="76" text-anchor="middle" font-size="8" fill="#888">Reading</text>
  <text x="318" y="76" text-anchor="middle" font-size="8" fill="#888">Sports</text>
  <text x="362" y="76" text-anchor="middle" font-size="8" fill="#888">Programming</text>
  <text x="232" y="98" text-anchor="end" font-size="8" fill="#888">Android</text>
  <text x="232" y="128" text-anchor="end" font-size="8" fill="#888">IOS</text>
  <text x="232" y="158" text-anchor="end" font-size="8" fill="#888">Web</text>

  <!-- Android row -->
  <rect x="250" y="84" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">14</text>
  <rect x="296" y="84" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="103" text-anchor="middle" font-size="8" fill="#b85450">NULL</text>
  <rect x="342" y="84" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="364" y="103" text-anchor="middle" font-size="8" fill="#b85450">NULL</text>

  <!-- IOS row -->
  <rect x="250" y="114" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="133" text-anchor="middle" font-size="8" fill="#b85450">NULL</text>
  <rect x="296" y="114" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="133" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">13</text>
  <rect x="342" y="114" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="364" y="133" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Web row -->
  <rect x="250" y="144" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="272" y="163" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">8,12</text>
  <rect x="296" y="144" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="163" text-anchor="middle" font-size="8" fill="#b85450">NULL</text>
  <rect x="342" y="144" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="364" y="163" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- arrow -->
  <path d="M 398 128 L 432 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="122" text-anchor="middle" font-size="8" fill="#888">计数</text>

  <!-- ===== Stage 3: final counts ===== -->
  <text x="490" y="52" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">步骤 ⑤⑥ COUNT</text>

  <text x="470" y="76" text-anchor="middle" font-size="8" fill="#888">R</text>
  <text x="508" y="76" text-anchor="middle" font-size="8" fill="#888">S</text>
  <text x="548" y="76" text-anchor="middle" font-size="8" fill="#888">P</text>
  <text x="432" y="98" text-anchor="end" font-size="8" fill="#888">Android</text>
  <text x="432" y="128" text-anchor="end" font-size="8" fill="#888">IOS</text>
  <text x="432" y="158" text-anchor="end" font-size="8" fill="#888">Web</text>

  <!-- Android -->
  <rect x="442" y="84" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="460" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="490" y="84" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="103" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="530" y="84" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="548" y="103" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- IOS -->
  <rect x="442" y="114" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="460" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="490" y="114" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="530" y="114" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="548" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Web -->
  <rect x="442" y="144" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="490" y="144" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="530" y="144" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="548" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="200" width="480" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">COUNT(experiment_id)：数非空 id，NULL 格 → 0</text>
  <text x="60" y="246" font-size="10" fill="#666">• 左：9 空格骨架（CROSS JOIN 枚举全集）</text>
  <text x="60" y="266" font-size="10" fill="#666">• 中：LEFT JOIN 后，5 格挂上事实 id（绿），4 格保留 NULL（红）</text>
  <text x="60" y="286" font-size="10" fill="#666">• 右：COUNT(experiment_id) 把 {14}→1、{8,12}→2、{NULL}→0</text>
  <text x="60" y="312" font-size="10" fill="#b85450" font-weight="bold">⚠ 误用 COUNT(*)：NULL 格的空行会被算成 1 → 9 格全 ≥ 1，零次组合全丢</text>
  <text x="60" y="334" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 列计数 COUNT(experiment_id)：NULL 不计 → 零次组合正确得 0</text>
  <text x="60" y="358" font-size="9" fill="#888">Web × Reading 同格挂 2 条 id（8、12）→ COUNT 得 2，体现「同组合多行」计数</text>
</svg>
