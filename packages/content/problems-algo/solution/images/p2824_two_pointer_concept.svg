<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">排序 + 双指针：sum &lt; target 时一次性计数 (right−left) 对</text>

  <!-- Sorted array -->
  <text x="30" y="62" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">排序后</text>
  <rect x="100" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−7</text>
  <rect x="156" y="44" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−6</text>
  <rect x="212" y="44" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="268" y="44" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="324" y="44" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="380" y="44" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="436" y="44" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="464" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- left and right labels -->
  <path d="M 128 78 L 128 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">left</text>
  <path d="M 408 78 L 408 92" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="408" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">right</text>

  <!-- Sum comparison -->
  <rect x="120" y="116" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums[left] + nums[right] = −7 + 3 = −4 &lt; −2 (target) ✓</text>

  <path d="M 300 150 L 300 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key insight -->
  <rect x="50" y="172" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键观察：数组已排序 → 对 left+1..right 间所有 j，nums[j] ≤ nums[right]</text>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">→ nums[left] + nums[j] ≤ nums[left] + nums[right] &lt; target 全部成立</text>
  <text x="300" y="232" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">一次性计数 (right − left) = 5 对，然后 left++</text>

  <!-- Result -->
  <rect x="120" y="258" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="281" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">count += right − left = 5</text>

  <!-- Footnote -->
  <text x="30" y="316" font-size="11" fill="#999" filter="url(#rough2)">若 sum ≥ target：right−−（缩小较大端使和下降），无需逐个枚举</text>
  <text x="30" y="334" font-size="11" fill="#999" filter="url(#rough2)">排序不改变配对数：只需 i≠j 两数之和，与下标顺序无关</text>
</svg>
