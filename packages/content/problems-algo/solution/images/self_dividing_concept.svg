<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：自除数 —— 每一位都能整除原数</text>

  <!-- number 128 -->
  <text x="44" y="72" font-size="12" fill="#888">原数 n</text>
  <rect x="80" y="52" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">128</text>

  <!-- split into digits -->
  <text x="200" y="72" font-size="11" fill="#888">拆出各位 →</text>
  <rect x="270" y="52" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="314" y="52" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="358" y="52" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>

  <!-- division checks -->
  <text x="44" y="120" font-size="12" fill="#888">逐位整除检验</text>

  <!-- check 1 -->
  <rect x="80" y="104" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">128 % 1 == 0  ✓</text>

  <!-- check 2 -->
  <rect x="80" y="140" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">128 % 2 == 0  ✓</text>

  <!-- check 8 -->
  <rect x="80" y="176" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">128 % 8 == 0  ✓</text>

  <!-- verdict -->
  <rect x="80" y="216" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="238" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">128 是自除数 ✓</text>

  <!-- counter-example: 21 -->
  <text x="330" y="120" font-size="12" fill="#888">反例 n = 21</text>
  <rect x="310" y="104" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">21 % 1 == 0  ✓</text>

  <rect x="310" y="140" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">21 % 2 == 1  ✗</text>

  <rect x="310" y="176" width="180" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#999">（有一位不整除即停）</text>

  <rect x="310" y="216" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="238" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">21 不是自除数 ✗</text>

  <!-- key rules -->
  <rect x="40" y="270" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="292" font-size="12" fill="#446688" font-weight="bold">两条关键规则</text>
  <text x="60" y="312" font-size="11" fill="#444">① 含数字 0 的数一定不是自除数（除零非法），如 10、20、101</text>
  <text x="60" y="330" font-size="11" fill="#444">② 只要有任意一位 d 不满足 n % d == 0，即判定非自除数（短路剪枝）</text>
  <text x="60" y="348" font-size="10" fill="#888">逐位提取方式：d = n % 10 取末位，n /= 10 截短，直到 n == 0</text>
</svg>
