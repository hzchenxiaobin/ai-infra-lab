<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：列可重排 → 按高度排序 → 位置 j 宽度至少 j+1
  </text>

  <!-- ===== Left: before sort (column heights fixed) ===== -->
  <text x="135" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    排序前（列固定）
  </text>
  <!-- baseline -->
  <line x1="80" y1="232" x2="230" y2="232" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- col0 h=2 -->
  <rect x="92" y="176" width="38" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="111" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">col0</text>
  <text x="111" y="170" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <!-- col1 h=0 -->
  <text x="155" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="155" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">col1</text>
  <!-- col2 h=3 -->
  <rect x="178" y="148" width="38" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="197" y="142" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="197" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">col2</text>

  <text x="135" y="276" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    heights = [2, 0, 3]
  </text>
  <text x="135" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">
    col1=0 把列隔断，看不出 2×2
  </text>

  <!-- ===== Middle: sort arrow ===== -->
  <path d="M250,200 L300,200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="275" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">降序</text>
  <text x="275" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">排序</text>

  <!-- ===== Right: after sort ===== -->
  <text x="425" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    排序后（列可重排并到一起）
  </text>
  <line x1="340" y1="232" x2="490" y2="232" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- pos0 h=3 -->
  <rect x="352" y="148" width="38" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="371" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="371" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=0</text>
  <!-- pos1 h=2 -->
  <rect x="394" y="176" width="38" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="413" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="413" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=1</text>
  <!-- pos2 h=0 -->
  <text x="455" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="455" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=2</text>

  <!-- highlight the 2x2 max rectangle: pos0&pos1 up to height 2 -->
  <rect x="349" y="173" width="86" height="61" fill="#b85450" fill-opacity="0.18" stroke="#b85450" stroke-width="2" stroke-dasharray="4 2" rx="2" filter="url(#rough2)"/>
  <text x="392" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2×2 = 4 ✓</text>

  <text x="425" y="276" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    sorted = [3, 2, 0]
  </text>
  <text x="425" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    高 2 的列有 2 个 → 并排成 2×2
  </text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="40" y="312" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    降序后位置 j：前 j+1 列高度都 ≥ h_j → 候选面积 = h_j × (j+1)
  </text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    排序消除了“位置约束”，单调栈（85 题）被一次排序取代
  </text>
</svg>
