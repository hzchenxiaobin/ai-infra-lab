<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历定位 1 与 n，套公式返回</text>

  <!-- Start node -->
  <rect x="180" y="40" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 nums，记录 x=idx(1), y=idx(n)</text>

  <path d="M 260 80 L 260 108" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Condition diamond: x < y? -->
  <polygon points="260,113 350,153 260,193 170,153" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x &lt; y ?</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#888">（1 在 n 左侧）</text>

  <!-- Yes (x < y) branch left -->
  <path d="M 170 153 L 90 153" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="135" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="55" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不交叉</text>

  <!-- No (x > y) branch right -->
  <path d="M 350 153 L 430 153" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="135" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交叉一次</text>

  <!-- Both converge down to formula -->
  <path d="M 55 171 L 55 220 L 200 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 465 171 L 465 220 L 320 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Formula boxes -->
  <rect x="40" y="240" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = x + (n-1-y)</text>
  <text x="140" y="272" text-anchor="middle" font-size="9" fill="#888">不减</text>

  <rect x="280" y="240" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = x + (n-1-y) - 1</text>
  <text x="380" y="272" text-anchor="middle" font-size="9" fill="#888">交叉处省 1 次</text>

  <!-- converge to return -->
  <path d="M 140 280 L 140 305 L 230 305" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 280 L 380 305 L 290 305" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="312" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>
</svg>
