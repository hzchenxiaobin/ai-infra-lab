<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察一：按位取反 —— 把「求最远」变成「求最近」</text>

  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">m = 4 示例：x = 1001，取反 ~x = 0110，数组元素 y = 1100</text>

  <!-- Group A: x vs y -->
  <text x="80" y="84" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="90" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="230" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="300" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="83" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="80" y="126" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="90" y="104" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="125" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="104" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="125" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="230" y="104" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="300" y="104" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="125" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="120" y="150" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">✓同</text>
  <text x="190" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗异</text>
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">✓同</text>
  <text x="330" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗异</text>

  <text x="440" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dist(x, y) = 2</text>

  <!-- 取反箭头 -->
  <path d="M 392 138 L 392 174" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="402" y="160" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">按位取反</text>

  <!-- Group B: ~x vs y -->
  <text x="80" y="194" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">~x</text>
  <rect x="90" y="172" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="193" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="160" y="172" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="193" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="230" y="172" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="172" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="193" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="80" y="236" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="90" y="214" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="235" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="214" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="235" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="230" y="214" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="300" y="214" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="235" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="120" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗异</text>
  <text x="190" y="260" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">✓同</text>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗异</text>
  <text x="330" y="260" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">✓同</text>

  <text x="440" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dist(~x, y) = 2</text>

  <!-- 底部结论框 -->
  <rect x="30" y="278" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">逐列看：x ≠ y 的位上必有 ~x = y；x = y 的位上必有 ~x ≠ y</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">每列恰好贡献一个 ✗ ⇒ dist(x, y) + dist(~x, y) = m</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⇒ max dist(x, ·) = m − min dist(~x, ·)：「最远」转化为「最近」</text>
</svg>
