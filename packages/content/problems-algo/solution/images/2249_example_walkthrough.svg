<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：circles = [[2,2,2],[3,4,1]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">圆1覆盖13点，圆2覆盖5点，重叠2点 → 13+5−2 = 16</text>

  <!-- ===== Left: grid visualization ===== -->
  <text x="40" y="70" font-size="11" fill="#446688" font-weight="bold">格点网格（x: 0→4, y: 0→5）</text>

  <!-- grid: 5 columns (x=0..4) x 6 rows (y=0..5), cell 38px, offset (50, 80) -->
  <g filter="url(#rough2)">
    <g stroke="#e0e0e0" stroke-width="0.8">
      <line x1="50" y1="80" x2="240" y2="80"/>
      <line x1="50" y1="118" x2="240" y2="118"/>
      <line x1="50" y1="156" x2="240" y2="156"/>
      <line x1="50" y1="194" x2="240" y2="194"/>
      <line x1="50" y1="232" x2="240" y2="232"/>
      <line x1="50" y1="270" x2="240" y2="270"/>
      <line x1="50" y1="308" x2="240" y2="308"/>
      <line x1="50" y1="80" x2="50" y2="308"/>
      <line x1="88" y1="80" x2="88" y2="308"/>
      <line x1="126" y1="80" x2="126" y2="308"/>
      <line x1="164" y1="80" x2="164" y2="308"/>
      <line x1="202" y1="80" x2="202" y2="308"/>
      <line x1="240" y1="80" x2="240" y2="308"/>
    </g>
    <rect x="50" y="80" width="190" height="228" fill="none" stroke="#bbb" stroke-width="1.5"/>
  </g>

  <!-- axis labels -->
  <text x="40" y="84" font-size="8" fill="#888" text-anchor="end">5</text>
  <text x="40" y="122" font-size="8" fill="#888" text-anchor="end">4</text>
  <text x="40" y="160" font-size="8" fill="#888" text-anchor="end">3</text>
  <text x="40" y="198" font-size="8" fill="#888" text-anchor="end">2</text>
  <text x="40" y="236" font-size="8" fill="#888" text-anchor="end">1</text>
  <text x="40" y="274" font-size="8" fill="#888" text-anchor="end">0</text>
  <text x="69" y="320" font-size="8" fill="#888" text-anchor="middle">0</text>
  <text x="107" y="320" font-size="8" fill="#888" text-anchor="middle">1</text>
  <text x="145" y="320" font-size="8" fill="#888" text-anchor="middle">2</text>
  <text x="183" y="320" font-size="8" fill="#888" text-anchor="middle">3</text>
  <text x="221" y="320" font-size="8" fill="#888" text-anchor="middle">4</text>

  <!-- circle 1: center (2,2) r=2 → grid (145, 198), radius 76px (2*38) -->
  <circle cx="145" cy="198" r="76" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.8" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- circle 2: center (3,4) r=1 → grid (183, 122), radius 38px -->
  <circle cx="183" cy="122" r="38" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- center markers -->
  <text x="145" y="194" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">C1</text>
  <text x="183" y="118" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">C2</text>

  <!-- lattice points in circle 1 only (blue) -->
  <g fill="#446688" filter="url(#rough2)">
    <circle cx="69" cy="198" r="4"/>
    <circle cx="107" cy="160" r="4"/>
    <circle cx="107" cy="198" r="4"/>
    <circle cx="107" cy="236" r="4"/>
    <circle cx="145" cy="118" r="4"/>
    <circle cx="145" cy="160" r="4"/>
    <circle cx="145" cy="198" r="4"/>
    <circle cx="145" cy="236" r="4"/>
    <circle cx="145" cy="274" r="4"/>
    <circle cx="183" cy="160" r="4"/>
    <circle cx="183" cy="198" r="4"/>
    <circle cx="221" cy="198" r="4"/>
  </g>

  <!-- overlap points (red ring + blue fill) -->
  <g filter="url(#rough2)">
    <circle cx="145" cy="122" r="5" fill="#446688" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="183" cy="160" r="5" fill="#446688" stroke="#b85450" stroke-width="1.8"/>
  </g>

  <!-- circle 2 only (green) -->
  <g fill="#4a7a3a" filter="url(#rough2)">
    <circle cx="183" cy="122" r="4"/>
    <circle cx="183" cy="84" r="4"/>
    <circle cx="221" cy="122" r="4"/>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)">
    <circle cx="60" cy="342" r="4" fill="#446688"/>
    <text x="70" y="346" font-size="9" fill="#555">仅圆1</text>
    <circle cx="120" cy="342" r="4" fill="#4a7a3a"/>
    <text x="130" y="346" font-size="9" fill="#555">仅圆2</text>
    <circle cx="180" cy="342" r="5" fill="#446688" stroke="#b85450" stroke-width="1.8"/>
    <text x="192" y="346" font-size="9" fill="#555">重叠(计1次)</text>
  </g>

  <!-- count box -->
  <rect x="50" y="360" width="190" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="145" y="378" text-anchor="middle" font-size="10" fill="#333">圆1: 13点, 圆2: 5点</text>
  <text x="145" y="392" text-anchor="middle" font-size="10" fill="#333">重叠: 2点</text>
  <text x="145" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">总计 = 13 + 5 − 2 = 16</text>

  <!-- split line -->
  <line x1="260" y1="60" x2="260" y2="420" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: judgment table ===== -->
  <text x="420" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">逐格点判定过程</text>

  <!-- table header -->
  <rect x="280" y="82" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="100" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">格点(x,y)</text>
  <rect x="372" y="82" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="100" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">圆1 ≤4?</text>
  <rect x="474" y="82" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="519" y="100" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">命中?</text>

  <!-- row: (0,0) no -->
  <rect x="280" y="110" width="90" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="125" text-anchor="middle" font-size="9.5" fill="#333">(0,0)</text>
  <rect x="372" y="110" width="100" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="422" y="125" text-anchor="middle" font-size="9" fill="#b85450">8 ✗</text>
  <rect x="474" y="110" width="90" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="519" y="125" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <!-- row: (0,2) yes circle1 -->
  <rect x="280" y="134" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="149" text-anchor="middle" font-size="9.5" fill="#333">(0,2)</text>
  <rect x="372" y="134" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="149" text-anchor="middle" font-size="9" fill="#4a7a3a">4 ✓</text>
  <rect x="474" y="134" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="149" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ break</text>

  <!-- row: (1,1) yes circle1 -->
  <rect x="280" y="158" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="173" text-anchor="middle" font-size="9.5" fill="#333">(1,1)</text>
  <rect x="372" y="158" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a">2 ✓</text>
  <rect x="474" y="158" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ break</text>

  <!-- row: (2,4) overlap, hit circle1 first -->
  <rect x="280" y="182" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="197" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">(2,4)</text>
  <rect x="372" y="182" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="197" text-anchor="middle" font-size="9" fill="#4a7a3a">4 ✓</text>
  <rect x="474" y="182" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="197" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ break</text>

  <!-- row: (3,3) overlap, hit circle1 first -->
  <rect x="280" y="206" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="221" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">(3,3)</text>
  <rect x="372" y="206" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="221" text-anchor="middle" font-size="9" fill="#4a7a3a">2 ✓</text>
  <rect x="474" y="206" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="221" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ break</text>

  <!-- row: (3,4) no circle1, yes circle2 -->
  <rect x="280" y="230" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="245" text-anchor="middle" font-size="9.5" fill="#333">(3,4)</text>
  <rect x="372" y="230" width="100" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="422" y="245" text-anchor="middle" font-size="9" fill="#b85450">5 ✗</text>
  <rect x="474" y="230" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="245" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ (圆2)</text>

  <!-- row: (3,5) no circle1, yes circle2 -->
  <rect x="280" y="254" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="269" text-anchor="middle" font-size="9.5" fill="#333">(3,5)</text>
  <rect x="372" y="254" width="100" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="422" y="269" text-anchor="middle" font-size="9" fill="#b85450">10 ✗</text>
  <rect x="474" y="254" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="269" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ (圆2)</text>

  <!-- row: (4,4) no circle1, yes circle2 -->
  <rect x="280" y="278" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="293" text-anchor="middle" font-size="9.5" fill="#333">(4,4)</text>
  <rect x="372" y="278" width="100" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="422" y="293" text-anchor="middle" font-size="9" fill="#b85450">8 ✗</text>
  <rect x="474" y="278" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="519" y="293" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ (圆2)</text>

  <!-- note about overlap -->
  <rect x="280" y="312" width="284" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="422" y="330" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">重叠点天然去重</text>
  <text x="290" y="346" font-size="9.5" fill="#555">(2,4) 和 (3,3) 同时被两个圆覆盖，</text>
  <text x="290" y="360" font-size="9.5" fill="#555">但点视角命中圆1即 break，</text>
  <text x="290" y="374" font-size="9.5" fill="#555">每个点只计一次 → 无需集合去重</text>

  <!-- result -->
  <rect x="280" y="390" width="284" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="422" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 16 ✓</text>
</svg>
