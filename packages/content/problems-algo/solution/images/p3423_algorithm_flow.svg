<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">一次遍历：取模统一处理 n 对相邻</text>

  <!-- 开始 -->
  <ellipse cx="300" cy="45" rx="48" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="50" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 300 62 L 300 76" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="215" y="76" width="170" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = 0；i = 0</text>
  <path d="M 300 110 L 300 139" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件 -->
  <polygon points="235,168 300,139 365,168 300,197" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是：循环体 -->
  <text x="312" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 300 197 L 300 225" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="225" width="220" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = |nums[(i+1)%n] − nums[i]|</text>
  <text x="300" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = max(ans, d)</text>
  <path d="M 300 281 L 300 305" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 自增 -->
  <rect x="255" y="305" width="90" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i += 1</text>

  <!-- 回边 -->
  <path d="M 345 321 L 470 321 L 470 168 L 368 168" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="312" font-size="11" fill="#446688" filter="url(#rough2)">下一轮</text>

  <!-- 否：返回 -->
  <text x="216" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 235 168 L 187 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="128" cy="168" rx="55" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="173" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 右上备注 -->
  <rect x="355" y="58" width="155" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="432" y="78" text-anchor="middle" font-size="12" fill="#2a4a6a" filter="url(#rough2)">💡 i = n−1 时</text>
  <text x="432" y="97" text-anchor="middle" font-size="12" fill="#2a4a6a" filter="url(#rough2)">(i+1) % n = 0</text>
</svg>
