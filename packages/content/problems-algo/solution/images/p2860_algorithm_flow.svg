<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 线性枚举 k</text>

  <!-- A: sort -->
  <rect x="170" y="38" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 排序 nums，得升序数组 a</text>
  <path d="M 260 72 L 260 86" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: init -->
  <rect x="180" y="90" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② ans = 0，k = 0</text>
  <path d="M 260 122 L 260 136" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: loop condition diamond -->
  <polygon points="260,140 345,176 260,212 175,176" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k ≤ n ?</text>

  <text x="358" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 345 176 L 396 176" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="160" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 212 L 260 236" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: feasibility diamond -->
  <polygon points="260,240 365,277 260,314 155,277" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[k−1] &lt; k</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 a[k] &gt; k ?</text>

  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 314 L 260 332" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E: ans++ -->
  <rect x="185" y="336" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← ans + 1</text>
  <path d="M 260 366 L 260 382" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: k++ -->
  <rect x="185" y="386" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="406" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k ← k + 1</text>

  <!-- D: no branch bypasses ans++ -->
  <text x="385" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 365 277 L 430 277 L 430 401 L 340 401" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back to C -->
  <path d="M 185 401 L 60 401 L 60 176 L 170 176" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">回到 k ≤ n</text>

  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 判定时哨兵化：k = 0 视 a[−1] = −1，k = n 视 a[n] = +∞，无需特判</text>
</svg>
