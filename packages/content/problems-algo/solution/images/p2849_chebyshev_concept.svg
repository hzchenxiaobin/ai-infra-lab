<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8 方向移动：斜走一步，x、y 同时推进 → 最短时间 = max(dx, dy)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">以示例 1 为例：S(2,4) → F(7,7)，dx=5、dy=3</text>

  <!-- grid: cols x=2..7, rows y=3..7, cell 44, origin (60,74) -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="74" x2="60" y2="294"/>
    <line x1="104" y1="74" x2="104" y2="294"/>
    <line x1="148" y1="74" x2="148" y2="294"/>
    <line x1="192" y1="74" x2="192" y2="294"/>
    <line x1="236" y1="74" x2="236" y2="294"/>
    <line x1="280" y1="74" x2="280" y2="294"/>
    <line x1="324" y1="74" x2="324" y2="294"/>
    <line x1="60" y1="74" x2="324" y2="74"/>
    <line x1="60" y1="118" x2="324" y2="118"/>
    <line x1="60" y1="162" x2="324" y2="162"/>
    <line x1="60" y1="206" x2="324" y2="206"/>
    <line x1="60" y1="250" x2="324" y2="250"/>
    <line x1="60" y1="294" x2="324" y2="294"/>
  </g>

  <!-- axis labels -->
  <g filter="url(#rough2)" font-size="10" fill="#888">
    <text x="82" y="308" text-anchor="middle">2</text>
    <text x="126" y="308" text-anchor="middle">3</text>
    <text x="170" y="308" text-anchor="middle">4</text>
    <text x="214" y="308" text-anchor="middle">5</text>
    <text x="258" y="308" text-anchor="middle">6</text>
    <text x="302" y="308" text-anchor="middle">7</text>
    <text x="50" y="100" text-anchor="middle">7</text>
    <text x="50" y="144" text-anchor="middle">6</text>
    <text x="50" y="188" text-anchor="middle">5</text>
    <text x="50" y="232" text-anchor="middle">4</text>
    <text x="50" y="276" text-anchor="middle">3</text>
  </g>

  <!-- path cells (white) -->
  <g filter="url(#rough2)">
    <rect x="104" y="162" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="148" y="118" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="192" y="74" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="236" y="74" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>

  <!-- S / F cells -->
  <rect x="60" y="206" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">S</text>
  <text x="82" y="240" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(2,4)</text>

  <rect x="280" y="74" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">F</text>
  <text x="302" y="108" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">(7,7)</text>

  <!-- path arrows: S(82,228)->(126,184)->(170,140)->(214,96)->(258,96)->F(302,96) -->
  <g stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)">
    <line x1="82" y1="228" x2="126" y2="184" marker-end="url(#arrGreen)"/>
    <line x1="126" y1="184" x2="170" y2="140" marker-end="url(#arrGreen)"/>
    <line x1="170" y1="140" x2="214" y2="96" marker-end="url(#arrGreen)"/>
    <line x1="214" y1="96" x2="258" y2="96" marker-end="url(#arrGreen)"/>
    <line x1="258" y1="96" x2="302" y2="96" marker-end="url(#arrGreen)"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#4a7a3a">
    <text x="96" y="200">斜</text>
    <text x="140" y="156">斜</text>
    <text x="184" y="112">斜</text>
    <text x="232" y="88">右</text>
    <text x="276" y="88">右</text>
  </g>

  <!-- in-grid notes -->
  <text x="148" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">斜走 = 两轴同时 +1</text>
  <text x="280" y="140" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">直走补齐 x 差</text>

  <!-- dx / dy arrows -->
  <line x1="336" y1="228" x2="336" y2="96" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="336" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dy = 3</text>
  <line x1="82" y1="326" x2="302" y2="326" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="192" y="344" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dx = 5</text>

  <!-- right panel -->
  <rect x="356" y="64" width="192" height="204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="452" y="88" font-size="12" fill="#333">dx = |7 − 2| = 5</text>
    <text x="452" y="108" font-size="12" fill="#333">dy = |7 − 4| = 3</text>
    <text x="452" y="134" font-size="13" font-weight="bold" fill="#d6a040">d = max(dx, dy) = 5</text>
    <text x="452" y="158" font-size="10" fill="#555">下界：每步每轴最多 +1</text>
    <text x="452" y="174" font-size="10" fill="#555">→ 至少 max(dx, dy) 步</text>
    <text x="452" y="198" font-size="10" fill="#555">构造：斜走 min + 直走差</text>
    <text x="452" y="214" font-size="10" fill="#555">→ 恰好 max 步到达</text>
    <text x="452" y="242" font-size="11" font-weight="bold" fill="#4a7a3a">示例 1：t = 6 ≥ 5 → true</text>
    <text x="452" y="258" font-size="9" fill="#888">（多出的 1 秒见下图）</text>
  </g>
</svg>
