<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算："1-2--3--4-5--6--7"</text>

  <!-- 表头 -->
  <rect x="24" y="40" width="44" height="24" fill="#ddd" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
  <rect x="70" y="40" width="70" height="24" fill="#ddd" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">token</text>
  <rect x="142" y="40" width="180" height="24" fill="#ddd" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">栈（压栈后）</text>
  <rect x="324" y="40" width="232" height="24" fill="#ddd" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="56" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">动作</text>

  <!-- 步骤 1: (0,1) -->
  <rect x="24" y="68" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="70" y="68" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="85" text-anchor="middle" font-size="9" fill="#b85450">d=0</text>
  <text x="105" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="68" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="76" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="92" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="324" y="92" font-size="10" fill="#555">栈空 → 建根 1，压栈</text>

  <!-- 步骤 2: (1,2) -->
  <rect x="24" y="112" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="70" y="112" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="129" text-anchor="middle" font-size="9" fill="#446688">d=1</text>
  <text x="105" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="142" y="112" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="120" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="120" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="324" y="130" font-size="10" fill="#555">size=1=d → 父=1</text>
  <text x="324" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">无左孩子 → 1.left=2</text>

  <!-- 步骤 3: (2,3) -->
  <rect x="24" y="156" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="70" y="156" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="105" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="142" y="156" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="164" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="180" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="164" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="180" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="214" y="164" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="180" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="324" y="174" font-size="10" fill="#555">size=2=d → 父=2</text>
  <text x="324" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">无左孩子 → 2.left=3</text>

  <!-- 步骤 4: (2,4) -->
  <rect x="24" y="200" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="70" y="200" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="217" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="105" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="142" y="200" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="208" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="208" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="214" y="208" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="228" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="324" y="214" font-size="10" fill="#b85450">弹 3（size 3→2=d）</text>
  <text x="324" y="228" font-size="10" fill="#d6a040" font-weight="bold">有左孩子 → 2.right=4</text>

  <!-- 步骤 5: (1,5) -->
  <rect x="24" y="244" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="70" y="244" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="261" text-anchor="middle" font-size="9" fill="#446688">d=1</text>
  <text x="105" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="142" y="244" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="252" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="268" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="252" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="268" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="324" y="258" font-size="10" fill="#b85450">弹 4, 2（size→1=d）</text>
  <text x="324" y="272" font-size="10" fill="#d6a040" font-weight="bold">有左孩子 → 1.right=5</text>

  <!-- 步骤 6: (2,6) -->
  <rect x="24" y="288" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="70" y="288" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="305" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="105" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="142" y="288" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="296" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="312" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="296" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="312" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="214" y="296" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="312" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="324" y="302" font-size="10" fill="#555">size=2=d → 父=5</text>
  <text x="324" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">无左孩子 → 5.left=6</text>

  <!-- 步骤 7: (2,7) -->
  <rect x="24" y="332" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="70" y="332" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="349" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="105" y="362" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="142" y="332" width="180" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="340" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="356" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="340" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="356" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="214" y="340" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="228" y="356" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="324" y="346" font-size="10" fill="#b85450">弹 6（size 3→2=d）</text>
  <text x="324" y="360" font-size="10" fill="#d6a040" font-weight="bold">有左孩子 → 5.right=7</text>

  <!-- 最终结果 -->
  <rect x="24" y="384" width="532" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="406" font-size="11" fill="#333" font-weight="bold">最终树：</text>
  <text x="100" y="406" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="116" y="406" font-size="11" fill="#555">→ 左</text>
  <text x="150" y="406" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="166" y="406" font-size="11" fill="#555">(左</text>
  <text x="190" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="202" y="406" font-size="11" fill="#555">, 右</text>
  <text x="228" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="242" y="406" font-size="11" fill="#555">), 右</text>
  <text x="278" y="406" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="294" y="406" font-size="11" fill="#555">(左</text>
  <text x="318" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="330" y="406" font-size="11" fill="#555">, 右</text>
  <text x="356" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="370" y="406" font-size="11" fill="#555">)</text>
  <text x="40" y="424" font-size="10" fill="#888">栈始终维护「根→当前节点」路径；弹栈到 size=depth 即定位父节点</text>
</svg>
